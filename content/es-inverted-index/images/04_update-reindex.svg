<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>필드 하나를 수정하면 문서 전체를 분석해 새 세그먼트 _1에 term 200개를 기록하고, 기존 세그먼트 _0에는 삭제 비트만 세우는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .chip { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; }
    .chipt { font-size: 13px; font-weight: 600; fill: #1f2937; }
    .idt { font-size: 13px; font-weight: 700; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .empty { fill: none; stroke: #e5e7eb; stroke-width: 1.2; stroke-dasharray: 3 3; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="400" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">필드 하나 수정 — 문서 전체를 새 세그먼트에 다시 색인</text>
  <text x="220" y="68" class="step" text-anchor="middle">1단계</text>
  <text x="360" y="68" class="step" text-anchor="middle">2단계</text>
  <text x="500" y="68" class="step" text-anchor="middle">3단계</text>
  <text x="640" y="68" class="step" text-anchor="middle">4단계</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="110" class="lane">요청</text>
  <text x="30" y="128" class="sub">필드 하나만 바꿈</text>
  <rect x="150" y="86" width="585" height="56" rx="6" class="track"/>
  <text x="30" y="174" class="lane">세그먼트 _1</text>
  <text x="30" y="192" class="sub">새로 만드는 쪽</text>
  <rect x="150" y="150" width="585" height="56" rx="6" class="track"/>
  <text x="30" y="238" class="lane">세그먼트 _0</text>
  <text x="30" y="256" class="sub">기존 문서가 있는 쪽</text>
  <rect x="150" y="214" width="585" height="56" rx="6" class="track"/>
  <rect x="160.0" y="90" width="120" height="48" rx="8" class="box"/>
  <text x="220" y="110" class="op" text-anchor="middle">UPDATE</text>
  <text x="220" y="129" class="val" text-anchor="middle">필드 1개 변경</text>
  <rect x="300.0" y="154" width="120" height="48" rx="8" class="box"/>
  <text x="360" y="174" class="db" text-anchor="middle">분석</text>
  <text x="360" y="193" class="val" text-anchor="middle">문서 전체</text>
  <line x1="220" y1="138" x2="330" y2="152" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="438" y="154" width="124" height="48" rx="8" class="bad"/>
  <text x="500" y="174" class="badt" text-anchor="middle">term 200개</text>
  <text x="500" y="193" class="val" text-anchor="middle">posting list 추가</text>
  <line x1="424" y1="178" x2="434" y2="178" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="580.0" y="218" width="120" height="48" rx="8" class="hold"/>
  <text x="640" y="238" class="op" text-anchor="middle">.del</text>
  <text x="640" y="257" class="val" text-anchor="middle">doc 0번 죽음</text>
  <line x1="530" y1="204" x2="610" y2="216" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="300" class="db">기록하는 양</text>
  <rect x="150" y="280" width="280" height="32" rx="6" class="bad"/>
  <text x="290" y="301" class="badt" text-anchor="middle">_1: term 200개 × (tf + position)</text>
  <rect x="450" y="280" width="280" height="32" rx="6" class="dbbox"/>
  <text x="590" y="301" class="db" text-anchor="middle">_0: 삭제 비트 하나</text>
  <text x="150" y="346" class="sub">비교: MySQL은 바뀐 컬럼의 인덱스 페이지만 갱신합니다</text>
  <text x="150" y="372" class="note">역인덱스는 필드 하나만 바꿔도 200개 term을 전부 다시 씁니다</text>
</svg>
