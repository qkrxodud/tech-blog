<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 438" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>주기 작업을 서버끼리 나누는 세 방식 — 작업 잠금 테이블은 표 하나로 계약 6개를 모두 지키고 결과 모름 20건을 서버 1·2·3대가 보정할 때 PG 조회가 20·20·20번이다. 나누지 않으면 계약 4개를 지키지 못하고 조회가 20·40·60번이다. 결제·알림마다 점유는 칸을 더하고 계약을 지키지만 첫 서버가 20건을 모두 맡아 조회는 20·20·20번이다. 주기 한 번은 2263~2584ms로 비슷했다</title>
