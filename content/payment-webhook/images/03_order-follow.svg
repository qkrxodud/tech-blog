  <rect x="60" y="486" width="280" height="44" rx="10" fill="#e3f3e6" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="60" y="486" width="280" height="44" rx="10" fill="none" stroke="#16a34a" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.55;0.56;0.61;0.62;1"/></rect>
  <use href="#vmark" x="82" y="508"/>
  <text x="100" y="504" class="okt"><tspan class="m">APPROVAL_CANCELED</tspan></text>
  <text x="100" y="521" class="oks">취소 기록 1건 · 남은 0원 — PG와 같음</text>
  <text x="386" y="500" class="gs">두 알림이 어떤 순서로 와도</text>
  <text x="386" y="517" class="gs">같은 상태에 도착합니다</text>
  <rect x="16" y="546" width="728" height="50" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.2"/>
  <use href="#xmark" x="36" y="571"/>
  <text x="54" y="566" class="badt">비교 B — <tspan class="m">CANCELED</tspan>를 취소 행위 하나로 바꾸면 결과 모름에서는 전이 표에 없음</text>
  <text x="54" y="584" class="bads">두 알림 모두 <tspan class="m">409</tspan>, 결제는 결과 모름으로 남고 PG는 같은 알림을 다시 보냄</text>
  <text x="24" y="614" class="gs">결정 4부터는 받은 알림을 남겨 두고, 처리기가 주문마다 한 번 조회합니다(그림 10)</text>
