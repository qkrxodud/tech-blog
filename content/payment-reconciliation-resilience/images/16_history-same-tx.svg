  </defs>

  <rect width="760" height="620" fill="#ffffff"/>
  <text x="24" y="28" class="h">결정 3 — 상태 전이와 이력을 같은 트랜잭션에서</text>
  <text x="24" y="48" class="gs" style="font-size:11px">예: <tspan class="m">PaymentWebhookRecorder.follow</tspan>(주문번호, 결제, 계기) 코드 순서 · <tspan class="m">PaymentRecorder.recordApproval</tspan>도 같은 순서</text>
  <rect x="96" y="64" width="250" height="34" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/><text x="221" y="85" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">결제를 바꾸는 기록 — <tspan class="m">@Transactional</tspan></text>
  <line x1="221" y1="98" x2="221" y2="122" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="28" y="126" width="390" height="440" rx="16" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="40" y="114" width="160" height="24" rx="6" fill="#5b7194"/><text x="120" y="130.5" class="tab" text-anchor="middle">한 트랜잭션</text>
  <rect x="56" y="144" width="330" height="50" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <use href="#i-lock" transform="translate(70,155) scale(0.85)"/>
  <text x="112" y="165" class="t2" style="font-size:12.5px">결제 줄 잠금</text>
  <text x="112" y="183" class="s2" style="font-size:10.5px"><tspan class="m">findByOrderIdForUpdate</tspan></text>
  <circle cx="56" cy="144" r="10" fill="#111827"/><text x="56" y="148" class="num" text-anchor="middle" style="font-size:11px">1</text>
  <line x1="221" y1="194" x2="221" y2="210" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="56" y="212" width="330" height="50" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <use href="#i-chips" transform="translate(70,223) scale(0.85)"/>
  <text x="112" y="233" class="t2" style="font-size:12.5px">행위 메서드 → <tspan class="m">changeStatus</tspan></text>
  <text x="112" y="251" class="s2" style="font-size:10.5px">전이 (이전, 행위, 다음)를 목록에 더함</text>
  <circle cx="56" cy="212" r="10" fill="#111827"/><text x="56" y="216" class="num" text-anchor="middle" style="font-size:11px">2</text>
  <line x1="221" y1="262" x2="221" y2="278" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="56" y="280" width="330" height="50" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <use href="#i-coin" transform="translate(70,291) scale(0.85)"/>
  <text x="112" y="301" class="t2" style="font-size:12.5px">잡아 둔 것 정리</text>
  <text x="112" y="319" class="s2" style="font-size:10.5px"><tspan class="m">paymentHoldings.settle</tspan></text>
  <circle cx="56" cy="280" r="10" fill="#111827"/><text x="56" y="284" class="num" text-anchor="middle" style="font-size:11px">3</text>
  <line x1="221" y1="330" x2="221" y2="346" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="56" y="348" width="330" height="50" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <use href="#i-outbox" transform="translate(70,359) scale(0.85)"/>
  <text x="112" y="369" class="t2" style="font-size:12.5px">결제 결과 기록(9장)</text>
  <text x="112" y="387" class="s2" style="font-size:10.5px"><tspan class="m">publishIfChanged</tspan> → <tspan class="m">payment_outbox</tspan></text>
  <circle cx="56" cy="348" r="10" fill="#111827"/><text x="56" y="352" class="num" text-anchor="middle" style="font-size:11px">4</text>
  <line x1="221" y1="398" x2="221" y2="414" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="56" y="416" width="330" height="50" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#i-table" transform="translate(70,427) scale(0.85)"/>
  <text x="112" y="437" class="t2" style="font-size:12.5px">상태 이력(결정 3)</text>
  <text x="112" y="455" class="s2" style="font-size:10.5px"><tspan class="m">record</tspan>: <tspan class="m">drainTransitions</tspan> → <tspan class="m">saveAll</tspan></text>
  <circle cx="56" cy="416" r="10" fill="#111827"/><text x="56" y="420" class="num" text-anchor="middle" style="font-size:11px">5</text>
  <line x1="221" y1="466" x2="221" y2="482" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="56" y="484" width="330" height="50" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#i-doc" transform="translate(70,495) scale(0.85)"/>
  <text x="112" y="505" class="t2" style="font-size:12.5px">커밋</text>
  <text x="112" y="523" class="s2" style="font-size:10.5px">결제·outbox·이력이 함께 남음</text>
  <circle cx="56" cy="484" r="10" fill="#111827"/><text x="56" y="488" class="num" text-anchor="middle" style="font-size:11px">6</text>
  <rect x="434" y="212" width="314" height="50" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="446" y="232" class="gs" style="font-size:10.5px">전이 목록은 <tspan class="m">@Transient</tspan> — 결제 줄에 저장하지 않음</text>
  <text x="446" y="250" class="gs" style="font-size:10.5px"><tspan class="m">drainTransitions</tspan>로 꺼낸 전이는 다시 나오지 않음</text>
  <line x1="386" y1="237" x2="432" y2="237" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="386" y1="509" x2="432" y2="509" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="434" y="480" width="314" height="58" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/><text x="591" y="504.5" class="s2" text-anchor="middle" style="fill:#b91c1c;font-size:10.5px">커밋이 실패해 롤백되면 셋 모두 남지 않음</text><text x="591" y="521.5" class="s2" text-anchor="middle" style="fill:#b91c1c;font-size:10.5px">계약 “승인 기록이 되돌려지면 승인 이력도 남지 않는다”</text>
  <rect x="434" y="286" width="314" height="140" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="446" y="308" class="t2" style="font-size:12px">한 트랜잭션에서 남는 이력 줄 수</text>
  <text x="446" y="332" class="s2" style="font-size:11px;fill:#1f2937">보정이 결과 모름을 승인으로 닫고</text><text x="446" y="354" class="s2" style="font-size:11px;fill:#1f2937">바로 카드사 취소까지 들여옴 → 전이마다 한 줄</text><text x="446" y="376" class="s2" style="font-size:11px;fill:#1f2937">상태가 그대로인 부분 취소 → 0줄</text><text x="446" y="398" class="s2" style="font-size:11px;fill:#1f2937">결제 생성(준비) → 0줄(전이가 아님)</text><text x="446" y="420" class="s2" style="font-size:11px;fill:#1f2937">바뀐 것이 없으면 → 남기지 않음</text>
  <text x="28" y="588" class="gs" style="font-size:11px">같은 트랜잭션이라 상태가 커밋되면 이력도 반드시 남고, 커밋이 실패하면 함께 남지 않음(<tspan class="m">PaymentHistories</tspan> 주석)</text>
  <text x="28" y="606" class="gs" style="font-size:11px">이력은 결제를 외래 키로 가리킴 · 12장 이전에 만든 결제에는 이력이 없음</text>
