  <text x="528" y="292" class="gs" style="font-size:11.5px">한 번 실행한 값</text>
  <text x="528" y="334" class="gs" style="font-size:10.5px">우리 남은 금액 = 결제 금액</text>
  <text x="528" y="352" class="gs" style="font-size:10.5px">− 끝난 취소의 합</text>
  <text x="528" y="372" class="gs" style="font-size:10.5px">카드사 잔액 = <tspan class="m">balanceAmount</tspan></text>
