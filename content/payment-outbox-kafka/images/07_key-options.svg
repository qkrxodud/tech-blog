<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 438" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 4 선택지 비교 — 같은 결제의 승인(n)과 취소(n+1)를 보내고 주문 서비스가 승인 기록에서 1초 붙잡혔을 때, 결제 번호를 키로 보내면(고름, acks=all·enable.idempotence=true) 두 이벤트가 키 해시로 정한 같은 파티션에 실려 취소는 승인 처리가 끝날 때까지 기다리고 받은 순서 [승인, 취소], 주문 CANCELED가 된다. 키 없이(RoundRobinPartitioner) 보내면 승인은 파티션 0, 취소는 파티션 1로 가 다른 소비자가 취소를 먼저 처리해 [취소, 승인], 주문 PAID가 되고, 기본 파티셔너 측정에서도 6번 중 2번 순서가 어긋났다. 브로커 1대·복제본 1이라 여러 복제본 대기는 시험하지 못했다</title>
