  <rect x="366" y="66" width="186" height="70" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="380" y="92" class="gt" style="font-size:12.5px">인증째 롤백</text>
  <text x="380" y="112" class="gs" style="font-size:10.5px">결제는 준비 상태(<tspan class="m">READY</tspan>)</text>
  <line x1="554" y1="101" x2="578" y2="101" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="582" y="66" width="154" height="70" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="596" y="92" class="t2" style="font-size:13px"><tspan class="m">409</tspan></text>
  <text x="596" y="112" class="s2" style="font-size:11px">카드사에 요청 안 함</text>
  <text x="24" y="178" class="okt" style="font-size:13px">10장</text>
  <rect x="70" y="156" width="266" height="70" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <use href="#i-box" transform="translate(82,172) scale(0.95)"/>
  <text x="120" y="182" class="bt" style="font-size:12px">인증 커밋 → 재고 서비스 예약</text>
  <text x="120" y="202" class="bs" style="font-size:11px"><tspan class="m">409</tspan> 재고 없음</text>
  <line x1="338" y1="191" x2="362" y2="191" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="366" y="156" width="186" height="70" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="380" y="182" class="badt" style="font-size:12px"><tspan class="m">APPROVAL_FAILED</tspan></text>
  <text x="380" y="202" class="bads" style="font-size:11px">쿠폰 · 포인트 돌려줌</text>
  <line x1="554" y1="191" x2="578" y2="191" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="582" y="156" width="154" height="70" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="596" y="182" class="okt" style="font-size:11.5px"><tspan class="m">409 OUT_OF_STOCK</tspan></text>
  <text x="596" y="202" class="oks" style="font-size:11px">주문 서비스에</text>
  <text x="596" y="218" class="oks" style="font-size:10.5px"><tspan class="m">PAYMENT_FAILED</tspan></text>
  <rect x="24" y="244" width="712" height="46" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="38" y="272" class="s2" style="font-size:11.5px">그대로인 것: <tspan class="m">409</tspan>로 답함 · 카드사에 승인을 요청하지 않음 · 포인트 · 쿠폰이 모자란 결제는 준비 상태로 남음</text>
  <text x="24" y="318" class="t2" style="font-size:13px">재고를 인증 트랜잭션 밖으로 뺀 이유 두 가지</text>
  <rect x="24" y="330" width="348" height="104" rx="12" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="38" y="354" class="bt" style="font-size:12.5px">HTTP를 기다리는 동안 쥐지 않음</text>
  <text x="38" y="386" class="bs" style="font-size:11.5px">결제 DB 트랜잭션</text>
  <text x="38" y="406" class="bs" style="font-size:11.5px">결제 줄 잠금</text>
  <use href="#i-lock" transform="translate(330,340) scale(0.85)"/>
  <rect x="388" y="330" width="348" height="104" rx="12" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="402" y="354" class="okt" style="font-size:12.5px">포인트가 모자라 롤백돼도 재고가 안 남음</text>
  <text x="402" y="386" class="oks" style="font-size:11.5px">출발 코드: 8장 계약 1개 실패 — 재고 4(처음 5)</text>
  <text x="402" y="406" class="oks" style="font-size:11.5px">결정 1 커밋에서 통과</text>
</svg>
