<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>BigDecimal 금액 비교 — DB에서 읽은 15000.00(소수 자릿수 2)과 요청 JSON의 15000(소수 자릿수 0)을 equals로 비교하면 다른 금액으로 보아 AMOUNT_MISMATCH로 거부하고, compareTo로 비교하면 0이라 금액 확인을 통과하며, equals로 비교한 비교 B는 정상 금액 승인까지 거부해 계약 테스트 7개 중 5개가 실패한 그림</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .h2 { font-size: 15px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14.5px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #4b5563; }
    .m { font-family: Menlo, Consolas, monospace; }
    .lbl { font-size: 12px; fill: #4b5563; }
    .tab { font-size: 12.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .badt { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .bads { font-size: 11.5px; fill: #b91c1c; }
    .okt { font-size: 13px; font-weight: 700; fill: #15803d; }
    .oks { font-size: 11.5px; fill: #15803d; }
    .gt { font-size: 13px; font-weight: 700; fill: #6b7280; }
    .gs { font-size: 11.5px; fill: #6b7280; }
    .o { stroke: #1f2937; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .spine { stroke: #1f2937; stroke-width: 1.5; fill: none; }
    .life { stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .run { stroke-dasharray: 5 4; animation: run 0.9s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -18; } }
    @media (prefers-reduced-motion: reduce) { .run { animation: none; } .anim { display: none; } }
  </style>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="aor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
    <g id="pkt">
      <rect x="-11" y="-8" width="22" height="16" rx="3" fill="#2dd4bf" stroke="#0f766e" stroke-width="1.5"/>
      <path d="M-10,-7 L0,1 L10,-7" fill="none" stroke="#0f766e" stroke-width="1.5"/>
    </g>
    <g id="pkt2">
      <rect x="-11" y="-8" width="22" height="16" rx="3" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/>
      <path d="M-10,-7 L0,1 L10,-7" fill="none" stroke="#c2410c" stroke-width="1.5"/>
    </g>
    <g id="xmark"><circle r="9" fill="#ef4444"/><path d="M-4,-4 L4,4 M4,-4 L-4,4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
    <g id="vmark"><circle r="9" fill="#22c55e"/><path d="M-4.5,0 L-1.5,3.5 L4.5,-3.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="gmark"><circle r="9" fill="#9ca3af"/><path d="M-4.5,0 L-1.5,3.5 L4.5,-3.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  </defs>
  <rect width="760" height="500" fill="#ffffff"/>
  <text x="24" y="32" class="h">금액 비교 — DB에서 읽은 15000.00과 요청의 15000</text>

  <!-- 두 값 -->
  <rect x="50" y="50" width="320" height="70" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <g transform="translate(68,64)">
    <path d="M1,5 v20 a13,5 0 0 0 26,0 v-20 a13,5 0 0 1 -26,0 z" fill="#60a5fa" class="o"/>
    <path d="M1,15 a13,5 0 0 0 26,0" fill="none" class="o"/>
    <ellipse cx="14" cy="5" rx="13" ry="5" fill="#bfdbfe" class="o"/>
  </g>
  <text x="112" y="72" class="t">DB에서 읽은 금액</text>
  <text x="112" y="92" class="s"><tspan class="m" style="font-size: 13px; font-weight: 700; fill: #1f2937">15000.00</tspan> · 소수 자릿수 2</text>
  <text x="112" y="110" class="s m" style="font-size: 11px">decimal(19, 2)</text>
  <rect x="390" y="50" width="320" height="70" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <g transform="translate(408,61)">
    <rect x="0" y="3" width="32" height="22" rx="4" fill="#5eead4" class="o"/>
    <rect x="0" y="8" width="32" height="5" fill="#1f2937"/>
    <rect x="4" y="16" width="8" height="6" rx="1.5" fill="#fbbf24" class="o" stroke-width="1"/>
  </g>
  <text x="452" y="72" class="t">요청 JSON의 금액</text>
  <text x="452" y="92" class="s"><tspan class="m" style="font-size: 13px; font-weight: 700; fill: #1f2937">15000</tspan> · 소수 자릿수 0</text>
  <text x="452" y="110" class="s m" style="font-size: 11px">new BigDecimal("15000")</text>

  <!-- 두 값이 두 비교 방법으로 -->
  <path d="M210,120 V138 M550,120 V138 M210,138 H550" class="spine"/>
  <line x1="210" y1="138" x2="210" y2="160" class="spine" marker-end="url(#ak)"/>
  <line x1="550" y1="138" x2="550" y2="160" class="spine" marker-end="url(#ak)"/>
  <rect x="330" y="128" width="100" height="20" rx="4" fill="#ffffff"/>
  <text x="380" y="142" class="lbl" text-anchor="middle">같은 두 값</text>

  <!-- 왼쪽: equals (비교 B) -->
  <polygon points="210,162 370,198 210,234 50,198" fill="#ece8fb" stroke="#9b88d6" stroke-width="1.5"/>
  <text x="210" y="194" class="t2" text-anchor="middle"><tspan class="m">equals</tspan>로 비교 (비교 B)</text>
  <text x="210" y="211" class="s" text-anchor="middle" style="font-size: 11.5px">수치와 자릿수가 같아야 같음</text>
  <line x1="210" y1="234" x2="210" y2="254" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="50" y="256" width="320" height="46" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.2"/>
  <use href="#xmark" x="72" y="279"/>
  <text x="92" y="275" class="badt">다른 금액으로 봄</text>
  <text x="92" y="293" class="bads m">equals → false</text>
  <line x1="210" y1="302" x2="210" y2="322" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="50" y="324" width="320" height="46" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.2"/>
  <use href="#xmark" x="72" y="347"/>
  <text x="92" y="343" class="badt">거부 <tspan class="m">400 AMOUNT_MISMATCH</tspan></text>
  <text x="92" y="361" class="bads">같은 금액인데 승인하지 않음</text>

  <!-- 오른쪽: compareTo (고른 방식) -->
  <polygon points="550,162 710,198 550,234 390,198" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <text x="550" y="194" class="t2" text-anchor="middle"><tspan class="m">compareTo</tspan>로 비교 (고른 방식)</text>
  <text x="550" y="211" class="s" text-anchor="middle" style="font-size: 11.5px">값만 비교</text>
  <line x1="550" y1="234" x2="550" y2="254" stroke="#16a34a" stroke-width="1.5" marker-end="url(#agr)"/>
  <rect x="390" y="256" width="320" height="46" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.2"/>
  <use href="#vmark" x="412" y="279"/>
  <text x="432" y="275" class="okt">같은 금액으로 봄</text>
  <text x="432" y="293" class="oks m">compareTo → 0</text>
  <line x1="550" y1="302" x2="550" y2="322" stroke="#16a34a" stroke-width="1.5" marker-end="url(#agr)"/>
  <rect x="390" y="324" width="320" height="46" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.2"/>
  <use href="#vmark" x="412" y="347"/>
  <text x="432" y="343" class="okt">금액 확인 통과</text>
  <text x="432" y="361" class="oks">다음 판단(같은 요청인지)으로 넘어감</text>

  <!-- 비교 B 결과 -->
  <rect x="14" y="404" width="732" height="84" rx="16" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="28" y="391" width="250" height="26" rx="6" fill="#5b7194"/>
  <text x="153" y="409" class="tab" text-anchor="middle">비교 B — 계약 테스트 7개 중 5개 실패</text>
  <text x="40" y="436" class="s">테스트의 요청 금액은 모두 <tspan class="m">15000</tspan>, DB에서 읽은 금액은 모두 <tspan class="m">15000.00</tspan></text>
  <use href="#xmark" x="49" y="455"/>
  <text x="66" y="460" class="bads" style="font-size: 12px">실패 5 — 정상 금액으로 보낸 승인까지 모두 <tspan class="m">AmountMismatchException</tspan>으로 거부</text>
  <use href="#gmark" x="49" y="476"/>
  <text x="66" y="481" class="gs" style="font-size: 12px">통과 2 — 금액이 다를 때 거부하는 테스트. 모든 요청을 거부하니 통과한 것</text>
</svg>
