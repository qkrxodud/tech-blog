<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>컨트롤러가 요청을 받아 서비스와 리포지토리를 호출하고 결과를 모델에 담으면, 뷰가 모델의 데이터로 HTML을 만들어 응답하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="310" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">MVC 패턴 — 컨트롤러, 모델, 뷰의 역할</text>

  <rect x="30" y="70" width="140" height="64" rx="8" class="hold"/>
  <text x="100" y="99" class="t" text-anchor="middle">클라이언트</text>
  <text x="100" y="118" class="s" text-anchor="middle">웹 브라우저</text>

  <rect x="250" y="70" width="180" height="64" rx="8" class="box"/>
  <text x="340" y="99" class="t" text-anchor="middle">컨트롤러</text>
  <text x="340" y="118" class="s" text-anchor="middle">요청 처리, 파라미터 검증</text>

  <rect x="530" y="70" width="200" height="64" rx="8" class="hold"/>
  <text x="630" y="99" class="t" text-anchor="middle">서비스, 리포지토리</text>
  <text x="630" y="118" class="s" text-anchor="middle">비즈니스 로직, 데이터 접근</text>

  <rect x="250" y="200" width="180" height="64" rx="8" class="box"/>
  <text x="340" y="229" class="t" text-anchor="middle">모델</text>
  <text x="340" y="248" class="s" text-anchor="middle">뷰에 출력할 데이터</text>

  <rect x="30" y="200" width="140" height="64" rx="8" class="ok"/>
  <text x="100" y="229" class="okt" text-anchor="middle">뷰</text>
  <text x="100" y="248" class="s" text-anchor="middle">HTML 렌더링</text>

  <text x="210" y="94" class="s" text-anchor="middle">1. 요청</text>
  <line x1="172" y1="104" x2="247" y2="104" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="480" y="94" class="s" text-anchor="middle">2. 로직 호출</text>
  <line x1="432" y1="104" x2="527" y2="104" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="350" y="171" class="s">3. 결과 데이터 담기</text>
  <line x1="340" y1="136" x2="340" y2="197" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="210" y="224" class="s" text-anchor="middle">4. 전달</text>
  <line x1="248" y1="232" x2="173" y2="232" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="110" y="171" class="s">5. HTML 응답</text>
  <line x1="100" y1="198" x2="100" y2="137" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>

  <text x="470" y="226" class="val">뷰는 모델의 데이터만 사용하므로</text>
  <text x="470" y="246" class="val">비즈니스 로직과 데이터 접근을 몰라도 됩니다.</text>
  <text x="30" y="298" class="foot">컨트롤러는 서비스를 호출하고 결과를 모델에 담으며, 뷰는 그 데이터로 화면을 그리는 일에 집중합니다.</text>
</svg>
