<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>리뷰 전에는 Line 안에서 RANDOM.nextBoolean() 람다로 ConnectionStrategy를 만들어 connectLine에 넘겨 인터페이스로 분리한 장점이 없고, 변경 방향은 Line 바깥에서 ConnectionStrategy를 만들어 connectLine(connectionStrategy)로 전달해 Random 요소를 Line에서 분리하는 것이다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 12px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .name { font-size: 14px; font-weight: 700; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .pkg { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .rail { stroke: #9ca3af; stroke-width: 3; stroke-linecap: round; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#ffffff"/>
  <rect x="10" y="10" width="364" height="360" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">리뷰 전 — 전략을 안에서 생성</text>
  <rect x="30" y="64" width="324" height="196" rx="8" class="pkg"/>
  <text x="46" y="88" class="opm">Line</text>
  <rect x="46" y="102" width="292" height="56" rx="8" class="bad"/>
  <text x="60" y="125" class="badc">() -&gt; RANDOM.nextBoolean()</text>
  <text x="60" y="146" class="note">전략을 Line 안에서 직접 만듦</text>
  <line x1="192" y1="160" x2="192" y2="190" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="46" y="194" width="292" height="50" rx="8" class="box"/>
  <text x="192" y="224" class="ms" text-anchor="middle">connectLine(connectionStrategy)</text>
  <text x="30" y="296" class="note">인터페이스로 분리했지만 만드는 곳과</text>
  <text x="30" y="316" class="note">쓰는 곳이 모두 Line 안이라 장점이 없고,</text>
  <text x="30" y="336" class="note">Random 요소도 Line에 남아 있습니다.</text>

  <rect x="386" y="10" width="364" height="360" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="406" y="42" class="h">변경 방향 — 바깥에서 주입</text>
  <rect x="406" y="64" width="324" height="64" rx="8" class="ok"/>
  <text x="420" y="88" class="okt">Line 바깥</text>
  <text x="420" y="112" class="gnote">ConnectionStrategy를 만들어 전달</text>
  <line x1="568" y1="130" x2="568" y2="190" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="578" y="164" class="ms">connectionStrategy</text>
  <rect x="406" y="194" width="324" height="66" rx="8" class="pkg"/>
  <text x="422" y="216" class="opm">Line</text>
  <rect x="422" y="224" width="292" height="28" rx="6" class="box"/>
  <text x="568" y="243" class="ms" text-anchor="middle">connectLine(connectionStrategy)</text>
  <text x="406" y="296" class="gnote">Line은 받은 전략의 isConnection()</text>
  <text x="406" y="316" class="gnote">결과로 points에 true/false만 추가하고,</text>
  <text x="406" y="336" class="gnote">Random 요소는 Line 바깥에 둡니다.</text>
</svg>
