  <text x="370" y="152" class="s2" style="font-size:11.5px;fill:#1f2937;font-weight:700">11장 761개 + 64개</text>
  <text x="370" y="172" class="s2" style="font-size:11px;fill:#1f2937">12장 운영 계약 41 · 대사 견주기 단위 16 · 결제 전이 단위 3</text><text x="370" y="190" class="s2" style="font-size:11px;fill:#1f2937">여러 쪽 대사 1 · 매일 작업 일정 2 · 오류 응답 1</text><text x="370" y="208" class="oks" style="font-size:11px;fill:#1f2937">주문 서비스 모듈 13개 · 재고 서비스 모듈 10개도 통과</text>
