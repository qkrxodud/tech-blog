  <circle cx="270" cy="223" r="9" fill="#111827"/><text x="270" y="227" class="num" text-anchor="middle" style="font-size: 11px">3</text>
  <text x="294" y="222" class="t2" style="font-size: 12.5px">금액 확인 → 이미 결과가 있나</text>
  <text x="294" y="238" class="oks" style="font-size: 11px">같은 금액 · 아니오</text>
  <circle cx="476" cy="214" r="8" fill="#ef4444"/><text x="476" y="218" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
