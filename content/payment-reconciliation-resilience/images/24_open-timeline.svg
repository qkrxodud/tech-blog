<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 4 차단기의 비용 타임라인 — 운영 값으로 잰 장애 15초 측정에서 처음 20건은 읽기 제한 5초를 기다려 결과 모름이 되고(두 실행 같음), 그 뒤 15초까지의 승인은 카드사에 보내지 않고 바로 실패해 승인 실패가 3690건·3623건이었음(두 실행, 승인 요청 전체 3710건·3643건의 응답 중앙 33ms). 차단기가 열리는 약 5초 경계는 잰 값이 아니라 읽기 제한 5초에서 계산한 모양임. 15초 뒤는 측정하지 않은 구간으로, 운영 값대로라면 열린 시간 30초(가정)가 지날 때까지 카드사가 돌아와도 새 승인이 바로 실패하고 그 뒤 반쯤 열림에서 설정 값 3번을 시험 삼아 보내는 모양이며, 열린 동안에도 재고는 잡았다가 돌려주고, 시험은 차단기를 기본으로 끈 그림</title>
