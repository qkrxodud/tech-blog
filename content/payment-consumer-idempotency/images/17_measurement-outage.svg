  <title>받는 쪽 저장소를 막은 동안의 측정(주문 서비스, 방식마다 3번씩 두 번 실행) — 장애 10초·20건에서 운영(blocking + DLT)은 두 실행 모두 반영 20·잃음 0(지연 중앙 10322~10891ms, 10210~10762ms), 기본 처리는 반영 17·잃음 3(4561~4590ms, 4557~5077ms), 다시 시도 토픽은 첫 실행 반영 20, 두 번째 실행 #1만 반영 19·실패 모음 1(7085~7124ms, 7049~7079ms), 로그만과 DB 실패 표는 반영 20·잃음 0임. 장애 30초·60건에서 운영은 반영 58·실패 모음 2·잃음 0(15529~17971ms, 15352~16312ms), 기본 처리는 첫 실행 반영 48~49·잃음 12·11·12, 두 번째 반영 49·잃음 11·11·11, 다시 시도 토픽은 반영 30~32·실패 모음 28~30과 반영 30~31·실패 모음 29~30, 로그만은 반영 58·잃음 2, DB 실패 표는 반영 60·실패 표 0·잃음 0인 그림</title>
