  <text x="118" y="192" class="t2" style="font-size:12px">결제 줄을 잠그고 읽음</text>
  <text x="118" y="209" class="s" style="font-size:10.5px"><tspan class="m">findByOrderIdForUpdate</tspan> · 금액 확인</text>
  <rect x="60" y="230" width="280" height="46" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="60" cy="230" r="10" fill="#111827"/><text x="60" y="234" class="num" text-anchor="middle">2</text>
  <use href="#i-chips" transform="translate(76,238) scale(0.95)"/>
  <text x="118" y="250" class="t2" style="font-size:12px">인증 전이</text>
  <text x="118" y="267" class="s" style="font-size:10px"><tspan class="m">Payment.authenticate</tspan> → <tspan class="m">AUTHENTICATED</tspan></text>
  <rect x="60" y="288" width="280" height="46" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="60" cy="288" r="10" fill="#111827"/><text x="60" y="292" class="num" text-anchor="middle">3</text>
  <use href="#i-box" transform="translate(76,296) scale(0.95)"/>
  <text x="118" y="308" class="t2" style="font-size:12px">재고 조건부 UPDATE</text>
  <text x="118" y="325" class="s" style="font-size:10px">상품 번호 순 · 1줄 바뀜(5 → 4, 커밋 전)</text>
  <rect x="60" y="346" width="280" height="46" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="60" cy="346" r="10" fill="#111827"/><text x="60" y="350" class="num" text-anchor="middle">4</text>
  <use href="#i-ticket" transform="translate(76,354) scale(0.95)"/>
  <text x="118" y="366" class="t2" style="font-size:12px">쿠폰 조건부 UPDATE</text>
  <text x="118" y="383" class="s" style="font-size:10px"><tspan class="m">ISSUED</tspan> → <tspan class="m">USED</tspan> · 1줄 바뀜(커밋 전)</text>
  <rect x="60" y="404" width="280" height="46" rx="10" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <circle cx="60" cy="404" r="10" fill="#111827"/><text x="60" y="408" class="num" text-anchor="middle">5</text>
  <use href="#i-point" transform="translate(76,414) scale(0.95)"/>
  <text x="118" y="424" class="t2" style="font-size:12px">포인트 조건부 UPDATE</text>
  <text x="118" y="441" class="s" style="font-size:10.5px">잔액 500 ≥ 1000? → 0줄</text>
  <text x="60" y="470" class="bs" style="font-size:10.5px">3~5는 <tspan class="m">PaymentHoldings.hold</tspan> — 재고 → 쿠폰 → 포인트 순서</text>
  <line x1="342" y1="427" x2="384" y2="427" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr)"/>
