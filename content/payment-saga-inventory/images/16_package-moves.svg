  <rect width="760" height="400" fill="#ffffff"/>
  <text x="24" y="30" class="h">출발 코드 앞의 패키지 이동 두 커밋</text>
  <text x="24" y="52" class="gs">동작과 테스트 내용은 그대로</text>
  <circle cx="36" cy="82" r="10" fill="#111827"/><text x="36" y="86" class="num" text-anchor="middle">1</text>
