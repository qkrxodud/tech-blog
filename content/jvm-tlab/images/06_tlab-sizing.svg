<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>스레드가 시작할 때 TLAB 용량을 할당 스레드 수 평균과 목표 refill 횟수 50으로 나눠 초기 크기를 정하고, GC마다 모든 TLAB을 retire한 뒤 스레드별 할당 비율 평균으로 다음 TLAB 크기를 다시 계산하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
    .monob { font-family: Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; fill: #15803d; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .opm { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .grid { stroke: #eceef1; stroke-width: 1; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="480" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="470" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">TLAB 크기 결정 — 스레드별로 GC마다 다시 계산</text>
  <text x="730" y="42" class="code" text-anchor="end">ResizeTLAB=true</text>
  <rect x="40" y="66" width="200" height="56" rx="8" class="hold"/>
  <text x="140.0" y="90.0" class="op" text-anchor="middle">스레드 시작</text>
  <text x="140.0" y="109.0" class="val" text-anchor="middle">초기 크기 결정</text>
  <rect x="270" y="66" width="460" height="56" rx="8" class="box"/>
  <text x="500.0" y="90.0" class="op" text-anchor="middle">TLAB 용량(Eden) / (할당 스레드 수 평균 × 50)</text>
  <text x="500.0" y="109.0" class="val" text-anchor="middle">TLABSize를 지정하면 그 값으로 시작</text>
  <line x1="240" y1="94" x2="270" y2="94" class="axis"/>
  <rect x="40" y="150" width="200" height="56" rx="8" class="box"/>
  <text x="140.0" y="174.0" class="op" text-anchor="middle">실행 중</text>
  <text x="140.0" y="193.0" class="val" text-anchor="middle">TLAB을 쓰고 새로 받기를 반복</text>
  <rect x="270" y="150" width="460" height="56" rx="8" class="box"/>
  <text x="500.0" y="174.0" class="op" text-anchor="middle">refill 횟수, 버린 공간, slow allocation 기록</text>
  <text x="500.0" y="193.0" class="val" text-anchor="middle">로그의 refills, waste, slow allocs</text>
  <line x1="240" y1="178" x2="270" y2="178" class="axis"/>
  <rect x="40" y="234" width="200" height="56" rx="8" class="hold"/>
  <text x="140.0" y="258.0" class="op" text-anchor="middle">GC</text>
  <text x="140.0" y="277.0" class="val" text-anchor="middle">모든 TLAB retire</text>
  <rect x="270" y="234" width="460" height="56" rx="8" class="box"/>
  <text x="500.0" y="258.0" class="op" text-anchor="middle">이 스레드가 Eden에서 할당한 비율을 갱신</text>
  <text x="500.0" y="277.0" class="val" text-anchor="middle">최근 값에 가중치를 둔 평균 (TLABAllocationWeight 35)</text>
  <line x1="240" y1="262" x2="270" y2="262" class="axis"/>
  <rect x="40" y="318" width="200" height="56" rx="8" class="ok"/>
  <text x="140.0" y="342.0" class="okt" text-anchor="middle">크기 재계산</text>
  <text x="140.0" y="361.0" class="val" text-anchor="middle">다음 TLAB부터 적용</text>
  <rect x="270" y="318" width="460" height="56" rx="8" class="box"/>
  <text x="500.0" y="342.0" class="op" text-anchor="middle">TLAB 용량(Eden) × 할당 비율 평균 / 50</text>
  <text x="500.0" y="361.0" class="val" text-anchor="middle">MinTLABSize(2KB)와 최대 크기 사이로 맞춤</text>
  <line x1="240" y1="346" x2="270" y2="346" class="axis"/>
  <line x1="140" y1="122" x2="140" y2="148" class="al" marker-end="url(#ar)"/>
  <line x1="140" y1="206" x2="140" y2="232" class="al" marker-end="url(#ar)"/>
  <line x1="140" y1="290" x2="140" y2="316" class="al" marker-end="url(#ar)"/>
  <path d="M 40 346 L 24 346 L 24 178 L 38 178" class="al" marker-end="url(#ar)"/>
  <text x="30" y="402" class="sub">50은 GC 사이에 TLAB을 새로 받는 목표 횟수로, 100 / (2 × TLABWasteTargetPercent)로 정해집니다</text>
  <text x="30" y="424" class="sub">GC 때 TLAB이 평균 절반쯤 차 있다고 보고, 그때 버려지는 공간이 Eden의 1%(기본값)를 넘지 않도록 잡은 값입니다</text>
  <text x="30" y="452" class="gnote">Eden에서 많이 할당하는 스레드는 큰 TLAB을, 적게 할당하는 스레드는 작은 TLAB을 받습니다</text>
</svg>
