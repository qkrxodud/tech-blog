ass="s2" style="font-family: Menlo, Consolas, monospace;font-size:11px">[1,0,1,0]</text><text x="30" y="391" class="s2">3회</text><rect x="70" y="374" width="30" height="24" rx="5" fill="#fdba74" stroke="#1f2937" stroke-width="1.2"/><text x="85" y="391" class="t2" text-anchor="middle" style="font-size:12.5px">1</text><rect x="108" y="374" width="30" height="24" rx="5" fill="#93c5fd" stroke="#1f2937" stroke-width="1.2"/><text x="123" y="391" class="t2" text-anchor="middle" style="font-size:12.5px">0</text><rect x="146" y="374" width="30" height="24" rx="5" fill="#fdba74" stroke="#1f2937" stroke-width="1.2"/><text x="161" y="391" class="t2" text-anchor="middle" style="font-size:12.5px">1</text><rect x="184" y="374" width="30" height="24" rx="5" fill="#93c5fd" stroke="#1f2937" stroke-width="1.2"/><text x="199" y="391" class="t2" text-anchor="middle" style="font-size:12.5px">0</text><text x="232" y="391" class="s2" style="font-family: Menlo, Consolas, monospace;font-size:11px">[1,0,1,0]</text><use href="#vs" x="320" y="354"/><text x="332" y="358" class="oks" style="font-weight:700">번갈아</text>
