<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>localhost:8080/hello 요청이 오면 WAS가 request와 response 객체를 만들고 서블릿 컨테이너가 helloServlet을 실행한 뒤 response를 바탕으로 응답을 보내며, request와 response는 요청마다 새로 만들지만 helloServlet은 인스턴스 하나를 모든 요청이 공유한다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .m { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .mv { font-size: 12px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .gn { font-size: 12.5px; fill: #15803d; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="446" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="150" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">서블릿 동작 순서 — <tspan font-family="Menlo, Consolas, monospace" font-size="15">localhost:8080/hello</tspan> 호출</text>
  <text x="94" y="68" class="step" text-anchor="middle">1</text>
  <text x="237" y="68" class="step" text-anchor="middle">2</text>
  <text x="380" y="68" class="step" text-anchor="middle">3</text>
  <text x="523" y="68" class="step" text-anchor="middle">4</text>
  <text x="666" y="68" class="step" text-anchor="middle">5</text>
  <rect x="30" y="78" width="128" height="58" rx="8" class="box"/>
  <text x="94" y="102" class="t" text-anchor="middle">요청</text>
  <text x="94" y="122" class="val" text-anchor="middle">웹 브라우저 → 서버</text>
  <line x1="158" y1="107" x2="167" y2="107" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="173" y="78" width="128" height="58" rx="8" class="box"/>
  <text x="237" y="102" class="t" text-anchor="middle">객체 생성</text>
  <text x="237" y="122" class="val" text-anchor="middle">request, response</text>
  <line x1="301" y1="107" x2="310" y2="107" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="316" y="78" width="128" height="58" rx="8" class="hold"/>
  <text x="380" y="102" class="m" text-anchor="middle">helloServlet</text>
  <text x="380" y="122" class="val" text-anchor="middle">컨테이너가 실행</text>
  <line x1="444" y1="107" x2="453" y2="107" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="459" y="78" width="128" height="58" rx="8" class="box"/>
  <text x="523" y="102" class="t" text-anchor="middle">응답 메시지 생성</text>
  <text x="523" y="122" class="val" text-anchor="middle">response 기반</text>
  <line x1="587" y1="107" x2="596" y2="107" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="602" y="78" width="128" height="58" rx="8" class="ok"/>
  <text x="666" y="102" class="okt" text-anchor="middle">응답 전달</text>
  <text x="666" y="122" class="val" text-anchor="middle">웹 브라우저로</text>

  <rect x="10" y="176" width="740" height="260" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="208" class="h">싱글톤 서블릿 — request, response는 요청마다, 서블릿은 하나</text>
  <text x="30" y="250" class="lane">요청 A</text>
  <text x="30" y="268" class="sub">고객 1</text>
  <rect x="162" y="232" width="210" height="56" rx="8" class="box"/>
  <text x="267" y="255" class="t" text-anchor="middle">request, response</text>
  <text x="267" y="275" class="val" text-anchor="middle">요청 A용으로 새로 생성</text>
  <text x="30" y="324" class="lane">요청 B</text>
  <text x="30" y="342" class="sub">고객 2</text>
  <rect x="162" y="306" width="210" height="56" rx="8" class="box"/>
  <text x="267" y="329" class="t" text-anchor="middle">request, response</text>
  <text x="267" y="349" class="val" text-anchor="middle">요청 B용으로 새로 생성</text>
  <line x1="372" y1="260" x2="484" y2="290" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="372" y1="334" x2="484" y2="306" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="420" y="254" class="sub" text-anchor="middle">호출</text>
  <text x="420" y="350" class="sub" text-anchor="middle">호출</text>
  <rect x="490" y="246" width="240" height="102" rx="8" class="hold"/>
  <text x="610" y="282" class="m" text-anchor="middle">helloServlet</text>
  <text x="610" y="304" class="val" text-anchor="middle">인스턴스 1개 (싱글톤)</text>
  <text x="610" y="324" class="val" text-anchor="middle">최초 로딩 시점에 생성해 재활용</text>
  <rect x="30" y="380" width="700" height="40" rx="8" class="bad"/>
  <text x="380" y="405" class="note" text-anchor="middle">모든 요청이 같은 서블릿 인스턴스에 접근하므로 공유 변수(멤버 변수) 사용에 주의</text>
</svg>
