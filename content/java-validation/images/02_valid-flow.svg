<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>요청 JSON을 @RequestBody로 객체로 변환한 뒤 @Valid로 필드 규칙을 검증하고, 통과하면 컨트롤러 메서드가 실행되고 실패하면 MethodArgumentNotValidException이 발생해 400으로 응답하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .desc { font-size: 13px; fill: #374151; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .dimt { font-size: 12px; fill: #9ca3af; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .chip { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .dim { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .okms { font-size: 12px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .badms { font-size: 12px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="300" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h"><tspan font-family="Menlo, Consolas, monospace">@Valid</tspan> 검증 흐름 — 통과하면 실행, 실패하면 예외</text>
  <text x="730" y="42" class="code" text-anchor="end">createUser(@Valid @RequestBody User user)</text>

  <text x="95" y="78" class="step" text-anchor="middle">1단계</text>
  <text x="270" y="78" class="step" text-anchor="middle">2단계</text>
  <text x="455" y="78" class="step" text-anchor="middle">3단계</text>
  <text x="655" y="78" class="step" text-anchor="middle">4단계</text>

  <rect x="30" y="92" width="130" height="60" rx="8" class="box"/>
  <text x="95" y="117" class="t" text-anchor="middle">요청 body</text>
  <text x="95" y="138" class="sub" text-anchor="middle">JSON</text>

  <line x1="162" y1="122" x2="186" y2="122" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>

  <rect x="190" y="92" width="160" height="60" rx="8" class="box"/>
  <text x="270" y="117" class="mb" text-anchor="middle">@RequestBody</text>
  <text x="270" y="138" class="sub" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">User</tspan> 객체로 변환</text>

  <line x1="352" y1="122" x2="376" y2="122" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>

  <rect x="380" y="92" width="150" height="60" rx="8" class="hold"/>
  <text x="455" y="117" class="mb" text-anchor="middle">@Valid</text>
  <text x="455" y="138" class="sub" text-anchor="middle">필드 규칙 검증</text>

  <text x="555" y="112" class="gnote" text-anchor="middle">통과</text>
  <line x1="532" y1="122" x2="576" y2="122" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>

  <rect x="580" y="92" width="150" height="60" rx="8" class="ok"/>
  <text x="655" y="117" class="okt" text-anchor="middle">메서드 실행</text>
  <text x="655" y="138" class="gnote" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">createUser</tspan> 본문</text>

  <line x1="455" y1="154" x2="455" y2="200" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="466" y="182" class="note">실패</text>

  <rect x="290" y="204" width="440" height="66" rx="8" class="bad"/>
  <text x="510" y="232" class="badm" text-anchor="middle">MethodArgumentNotValidException</text>
  <text x="510" y="256" class="note" text-anchor="middle">메서드는 실행되지 않고 기본 설정에서 400 Bad Request로 응답</text>

  <text x="30" y="226" class="sub">예: <tspan font-family="Menlo, Consolas, monospace">@NotNull</tspan>인</text>
  <text x="30" y="244" class="sub"><tspan font-family="Menlo, Consolas, monospace">name</tspan>이 null</text>
  <text x="30" y="292" class="foot">규칙을 하나라도 통과하지 못하면 컨트롤러 메서드에 도달하지 않습니다</text>
</svg>
