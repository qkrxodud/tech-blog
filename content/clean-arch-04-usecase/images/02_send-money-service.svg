<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>SendMoneyService가 application.port.in의 SendMoneyUseCase를 구현하고 SendMoneyCommand를 입력으로 받으며, domain의 Account 상태를 바꾸고 application.port.out의 UpdateAccountStatePort로 저장하는 구조</title>
  <style>
