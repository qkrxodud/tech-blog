<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>knownFailingTest 결과와 앞 장 비교의 변화 — 비교 구현 746개 중 214개가 실패했고, 12장 비교 9개는 95개 중 46개, 2~11장 비교는 651개 중 168개가 실패했으며 뒤이어 도는 7장 jpaVersionTest는 11개 중 4개 실패함. 11장 기록 169개에서 168개로 달라진 곳은 10장 비교 재고 서비스 답이 없으면 실패로만 보고 해제를 보내지 않음의 몰림 계약(서버 두 대·300건, 겹침 고정 안 함) 하나로 4개에서 3개가 되었고, 11장 기록에서도 같은 계약이 3개에서 4개로 흔들렸으며 원인은 따로 확인하지 않았고, 그 밖의 비교 클래스는 시험 수·실패 수가 같은 그림</title>
