<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>OneToOne이 즉시 로딩이면 사용자 100명을 조회하는 쿼리 1개 뒤에 사용자마다 프로필을 조회하는 쿼리 100개가 더 실행되어 101개가 되고, 지연 로딩과 LEFT JOIN FETCH를 쓰면 쿼리 1개로 사용자와 프로필을 함께 가져오는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12.5px; fill: #374151; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .thead { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .cell { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 12.5px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 12.5px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="230" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">즉시 로딩 — 연관 엔티티마다 쿼리가 추가된다</text>
  <text x="730" y="42" class="code" text-anchor="end">FetchType.EAGER</text>
  <rect x="30" y="64" width="200" height="58" rx="10" class="box"/>
  <text x="130" y="88" class="t" text-anchor="middle">사용자 조회 쿼리</text>
  <text x="130" y="108" class="sub" text-anchor="middle">사용자 100명 (쿼리 1개)</text>
  <line x1="231" y1="93" x2="268" y2="93" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="272" y="64" width="210" height="30" rx="7" class="bad"/>
  <text x="377" y="84" class="note" text-anchor="middle">사용자 1의 프로필 조회</text>
  <rect x="272" y="100" width="210" height="30" rx="7" class="bad"/>
  <text x="377" y="120" class="note" text-anchor="middle">사용자 2의 프로필 조회</text>
  <text x="377" y="148" class="badt" text-anchor="middle">⋮</text>
  <rect x="272" y="158" width="210" height="30" rx="7" class="bad"/>
  <text x="377" y="178" class="note" text-anchor="middle">사용자 100의 프로필 조회</text>
  <text x="500" y="128" class="sub">추가 쿼리 100개 (N)</text>
  <rect x="580" y="148" width="150" height="40" rx="20" class="bad"/>
  <text x="655" y="173" class="badt" text-anchor="middle">1 + 100 = 101개</text>
  <text x="30" y="222" class="foot">OneToOne은 기본이 즉시 로딩이라, 조회한 엔티티 수만큼 연관 엔티티 조회 쿼리가 더 나갑니다.</text>
  <rect x="10" y="256" width="740" height="154" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="288" class="h">지연 로딩 + LEFT JOIN FETCH — 쿼리 한 번</text>
  <text x="730" y="288" class="code" text-anchor="end">FetchType.LAZY</text>
  <rect x="30" y="310" width="452" height="58" rx="10" class="ok"/>
  <text x="256" y="334" class="okt" text-anchor="middle">사용자 조회 쿼리 + LEFT JOIN FETCH 프로필</text>
  <text x="256" y="354" class="sub" text-anchor="middle">필요한 연관 엔티티만 조인해서 함께 가져옴</text>
  <rect x="580" y="319" width="150" height="40" rx="20" class="ok"/>
  <text x="655" y="344" class="okt" text-anchor="middle">1개</text>
  <line x1="484" y1="339" x2="576" y2="339" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="394" class="foot">기본은 지연 로딩으로 두고, 함께 필요한 경우에만 JPQL에서 LEFT JOIN FETCH로 가져옵니다.</text>
</svg>
