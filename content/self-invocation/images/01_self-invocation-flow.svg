<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>pojo.foo는 프록시를 거쳐 advice 로그가 찍힌 뒤 타겟의 foo가 실행되고, 타겟 안에서 this로 부른 bar는 프록시를 거치지 않아 advice 로그 없이 실행되는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 13.5px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 13.5px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badw { fill: #ffffff; stroke: #dc2626; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .badt { font-size: 13.5px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="380" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">self-invocation — this로 부른 bar는 프록시를 거치지 않는다</text>
  <text x="730" y="42" class="code" text-anchor="end">ExecuteLoggingAdvice</text>
  <text x="220" y="68" class="step" text-anchor="middle">1단계</text>
  <text x="360" y="68" class="step" text-anchor="middle">2단계</text>
  <text x="500" y="68" class="step" text-anchor="middle">3단계</text>
  <text x="640" y="68" class="step" text-anchor="middle">4단계</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">호출하는 쪽</text>
  <text x="30" y="126" class="sub">pojo (프록시 참조)</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <text x="30" y="168" class="lane">프록시</text>
  <text x="30" y="186" class="sub">부가 기능 실행</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <text x="30" y="228" class="lane">타겟</text>
  <text x="30" y="246" class="sub">SimplePojo</text>
  <rect x="150" y="206" width="585" height="52" rx="6" class="track"/>
  <rect x="158" y="88" width="124" height="48" rx="8" class="box"/>
  <text x="220" y="107.5" class="op" text-anchor="middle">pojo.foo()</text>
  <text x="220" y="126.5" class="val" text-anchor="middle">프록시 호출</text>
  <rect x="298" y="148" width="124" height="48" rx="8" class="ok"/>
  <text x="360" y="167.5" class="okt" text-anchor="middle">advice 실행</text>
  <text x="360" y="186.5" class="val" text-anchor="middle">foo 로그 찍음</text>
  <rect x="438" y="208" width="124" height="48" rx="8" class="box"/>
  <text x="500" y="227.5" class="op" text-anchor="middle">foo()</text>
  <text x="500" y="246.5" class="val" text-anchor="middle">### foo</text>
  <rect x="578" y="208" width="124" height="48" rx="8" class="bad"/>
  <text x="640" y="227.5" class="badc" text-anchor="middle">this.bar()</text>
  <text x="640" y="246.5" class="val" text-anchor="middle">### bar</text>
  <rect x="578" y="156" width="124" height="32" rx="6" class="badw"/>
  <text x="640" y="177" class="note" text-anchor="middle">advice 실행 안 됨</text>
  <line x1="250" y1="136" x2="330" y2="146" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="390" y1="196" x2="470" y2="206" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="563" y1="232" x2="576" y2="232" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="30" y="290" class="db">출력</text>
  <text x="150" y="290" class="val"><tspan font-family="Menlo, Consolas, monospace">>>> execute method [foo]</tspan></text>
  <text x="390" y="290" class="val"><tspan font-family="Menlo, Consolas, monospace">### foo</tspan></text>
  <text x="500" y="290" class="note"><tspan font-family="Menlo, Consolas, monospace">### bar</tspan> — advice 로그 없음</text>
  <rect x="150" y="316" width="280" height="30" rx="15" class="bad"/>
  <text x="290" y="336" class="badt" text-anchor="middle">결과 — bar에는 부가 기능 미적용</text>
  <text x="150" y="372" class="foot">부가 기능은 프록시에만 있고, 타겟 안의 this는 프록시가 아니라 원본 객체입니다</text>
</svg>
