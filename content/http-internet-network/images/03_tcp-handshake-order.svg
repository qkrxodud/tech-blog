<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>위쪽은 클라이언트가 SYN을 보내고 서버가 SYN+ACK로 응답한 뒤 클라이언트가 ACK를 보내 연결을 맺는 3-way handshake, 아래쪽은 패킷이 1, 3, 2 순서로 도착하면 서버가 패킷 1만 보관하고 나머지를 버린 뒤 패킷 2부터 다시 보내 달라고 요청하는 순서 보장</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .m { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .mv { font-size: 12px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="530" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="236" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">3-way handshake — 연결을 맺을 때 패킷이 세 번 오간다</text>
  <text x="730" y="42" class="code" text-anchor="end">SYN → SYN+ACK → ACK</text>
  <text x="220" y="68" class="step" text-anchor="middle">1. 연결 요청</text>
  <text x="360" y="68" class="step" text-anchor="middle">2. 응답</text>
  <text x="500" y="68" class="step" text-anchor="middle">3. 확인</text>
  <text x="640" y="68" class="step" text-anchor="middle">4. 데이터 전송</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="110" class="lane">클라이언트</text>
  <text x="30" y="128" class="sub">연결을 요청하는 쪽</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <text x="30" y="200" class="lane">서버</text>
  <text x="30" y="218" class="sub">요청을 받는 쪽</text>
  <rect x="150" y="176" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="108" class="op" text-anchor="middle">SYN</text>
  <text x="220" y="127" class="val" text-anchor="middle">연결 요청</text>
  <rect x="162" y="178" width="116" height="48" rx="8" class="hold"/>
  <text x="220" y="207" class="val" text-anchor="middle">요청 받음</text>
  <line x1="220" y1="137" x2="220" y2="176" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="302" y="178" width="116" height="48" rx="8" class="box"/>
  <text x="360" y="198" class="op" text-anchor="middle">SYN+ACK</text>
  <text x="360" y="217" class="val" text-anchor="middle">나도 연결 요청</text>
  <rect x="302" y="88" width="116" height="48" rx="8" class="hold"/>
  <text x="360" y="117" class="val" text-anchor="middle">응답 받음</text>
  <line x1="360" y1="177" x2="360" y2="138" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="442" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="500" y="108" class="op" text-anchor="middle">ACK</text>
  <text x="500" y="127" class="val" text-anchor="middle">알겠다는 확인</text>
  <rect x="442" y="178" width="116" height="48" rx="8" class="hold"/>
  <text x="500" y="207" class="val" text-anchor="middle">확인 받음</text>
  <line x1="500" y1="137" x2="500" y2="176" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="582" y="88" width="116" height="48" rx="8" class="ok"/>
  <text x="640" y="108" class="okt" text-anchor="middle">연결 완료</text>
  <text x="640" y="127" class="val" text-anchor="middle">데이터 전송</text>
  <rect x="582" y="178" width="116" height="48" rx="8" class="ok"/>
  <text x="640" y="198" class="okt" text-anchor="middle">연결 완료</text>
  <text x="640" y="217" class="val" text-anchor="middle">데이터 수신</text>

  <rect x="10" y="262" width="740" height="258" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="294" class="h">순서 보장 — 순서가 어긋나면 맞는 패킷까지만 보관하고 다시 요청한다</text>
  <text x="220" y="320" class="step" text-anchor="middle">1. 전송</text>
  <text x="360" y="320" class="step" text-anchor="middle">2. 순서 확인</text>
  <text x="500" y="320" class="step" text-anchor="middle">3. 다시 요청</text>
  <text x="640" y="320" class="step" text-anchor="middle">4. 재전송</text>
  <line x1="160" y1="328" x2="722" y2="328" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="362" class="lane">클라이언트</text>
  <text x="30" y="380" class="sub">패킷을 보내는 쪽</text>
  <rect x="150" y="338" width="585" height="52" rx="6" class="track"/>
  <text x="30" y="452" class="lane">서버</text>
  <text x="30" y="470" class="sub">패킷을 받는 쪽</text>
  <rect x="150" y="428" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="340" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="360" class="t" text-anchor="middle">패킷 1, 2, 3</text>
  <text x="220" y="379" class="val" text-anchor="middle">순서대로 전송</text>
  <line x1="220" y1="389" x2="220" y2="428" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="162" y="430" width="116" height="48" rx="8" class="bad"/>
  <text x="220" y="450" class="badt" text-anchor="middle">1, 3, 2</text>
  <text x="220" y="469" class="val" text-anchor="middle">순서로 도착</text>
  <rect x="302" y="430" width="116" height="48" rx="8" class="hold"/>
  <text x="360" y="450" class="okt" text-anchor="middle">1 보관</text>
  <text x="360" y="469" class="note" text-anchor="middle">3, 2는 버림</text>
  <rect x="442" y="430" width="116" height="48" rx="8" class="box"/>
  <text x="500" y="450" class="t" text-anchor="middle">2부터 요청</text>
  <text x="500" y="469" class="val" text-anchor="middle">다시 보내 달라</text>
  <line x1="500" y1="429" x2="500" y2="390" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="442" y="340" width="116" height="48" rx="8" class="hold"/>
  <text x="500" y="369" class="val" text-anchor="middle">요청 받음</text>
  <rect x="582" y="340" width="116" height="48" rx="8" class="box"/>
  <text x="640" y="360" class="t" text-anchor="middle">패킷 2, 3</text>
  <text x="640" y="379" class="val" text-anchor="middle">순서대로 재전송</text>
  <line x1="640" y1="389" x2="640" y2="428" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="582" y="430" width="116" height="48" rx="8" class="ok"/>
  <text x="640" y="450" class="okt" text-anchor="middle">1, 2, 3</text>
  <text x="640" y="469" class="val" text-anchor="middle">순서 맞춤</text>
  <text x="30" y="504" class="foot">순서는 TCP/IP 패킷에 담긴 전송 제어, 순서 정보로 확인합니다.</text>
</svg>
