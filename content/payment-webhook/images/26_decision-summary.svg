<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>6장 결정 다섯 가지 한눈에 — 출발 코드의 6장 테스트 20개 중 14개가 실패했고 완성 코드에서 모두 통과. 결정 1 알림 내용은 출발 코드에서 위조 알림이 그대로 반영됨 → 알림은 신호로만 쓰고 PG 결제 조회로 다시 읽음, 본문을 믿는 비교 A는 위조 알림 2건이 어긋남. 결정 2 순서는 승인 답 기록이 409로 막힘 → 갈 수 있는 방향이면 따라가고 지난 상태면 무시, 표로 거부하는 비교 B는 재전송 52번에 끝내 200을 받지 못한 알림 6건. 결정 3 중복은 출발 코드에 중복을 거르는 장치가 없음 → PG 취소 이력을 transactionKey로 맞춰 처리 자체를 멱등으로, 본문 해시로 거르는 비교 D는 같은 상태를 다른 때에 새 createdAt으로 다시 보내면 취소가 두 번 남음. 결정 4 답하는 때는 출발 코드가 받은 요청 안에서 반영하되 PG에 조회하지 않음(실패는 아님) → 남기고 바로 200, 조회와 반영은 주기 처리기, 요청 안에서 조회하는 비교 E는 늦은 조회에 504로 답해 재전송이 생김. 결정 5 결과 모름은 결과 모름 취소가 알림으로 닫히지 않고 PG에서만 일어난 부분 취소가 무시됨 → 바로 맞추고 우리 취소와 먼저 짝지음, 주기 보정만 하는 비교 F는 PG에서만 일어난 취소가 있는 8건이 끝내 어긋남. 4장 보정도 웹훅과 같은 follow로 읽게 바꿔 4장 비교 구현 망취소는 보정 계약 9개 중 3개를 지키지 못하게 됨</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 13px; font-weight: 700; fill: #1f2937; }
