    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 12px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .rm { font-size: 12px; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="760" height="310" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="290" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">AppConfig — 구현 객체를 생성하고 생성자로 주입</text>
  <rect x="270" y="62" width="220" height="54" rx="8" class="ok"/>
  <text x="380" y="85.0" class="okm" text-anchor="middle">AppConfig</text>
  <text x="380" y="103.0" class="s" text-anchor="middle">구체 클래스 선택</text>
  <rect x="30" y="170" width="210" height="56" rx="8" class="box"/>
  <text x="135" y="194.0" class="opm" text-anchor="middle">MemoryMemberRepository</text>
  <text x="135" y="212.0" class="s" text-anchor="middle">구현 객체</text>
  <rect x="275" y="170" width="210" height="56" rx="8" class="hold"/>
  <text x="380" y="194.0" class="opm" text-anchor="middle">OrderServiceImpl</text>
  <text x="380" y="212.0" class="s" text-anchor="middle">인터페이스에만 의존</text>
  <rect x="520" y="170" width="210" height="56" rx="8" class="box"/>
  <text x="625" y="194.0" class="opm" text-anchor="middle">RateDiscountPolicy</text>
  <text x="625" y="212.0" class="s" text-anchor="middle">구현 객체</text>
  <line x1="330" y1="118" x2="140" y2="167" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="380" y1="118" x2="380" y2="167" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="430" y1="118" x2="620" y2="167" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="222" y="140" class="s" text-anchor="middle">생성</text>
  <text x="538" y="140" class="s" text-anchor="middle">생성</text>
  <text x="392" y="146" class="s">생성</text>
  <line x1="242" y1="198" x2="272" y2="198" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="518" y1="198" x2="488" y2="198" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="257" y="248" class="gmsg" text-anchor="middle">생성자 주입</text>
  <text x="503" y="248" class="gmsg" text-anchor="middle">생성자 주입</text>
  <text x="30" y="284" class="foot">OrderServiceImpl은 어떤 구현 객체가 주입될지 알지 못하고, 그 결정은 AppConfig가 합니다.</text>
</svg>
