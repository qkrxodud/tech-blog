<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 4 조회 비교를 돌리다 고친 재고 서비스 코드 — 고치기 전에는 트랜잭션 밖 조회 find가 예약 줄을 읽는 행 매퍼 안에서 담긴 상품을 다시 조회해 연결을 하나 더 쥐었고, 몰림 시험에서 연결 풀 10개가 바닥나 30초 기다리다 CannotGetJdbcConnectionException이 278번 나며 재고 명령 소비가 멈췄음. 고친 뒤에는 예약 줄을 다 읽은 뒤 itemsOf로 상품을 읽어 연결을 하나씩만 쓰고, 조회 비교는 처리 중 시간 초과 1개만 실패했음</title>
