<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>외부 테이블 rule의 행을 하나씩 꺼내 내부 테이블 detection에서 rule_id가 같은 행을 찾고, 매칭된 행을 결과에 추가한 뒤 다음 rule 행으로 넘어가는 Nested Loop Join</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .subc { font-size: 12px; fill: #6b7280; font-family: Menlo, Consolas, monospace; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .valc { font-size: 12px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .dbc { font-size: 13px; font-weight: 700; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .opg { font-size: 14px; font-weight: 700; fill: #9ca3af; font-family: Menlo, Consolas, monospace; }
    .tg { font-size: 13px; font-weight: 700; fill: #6b7280; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .colh { font-size: 12px; font-weight: 700; fill: #9ca3af; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="332" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="312" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">Nested Loop Join — 외부 행마다 내부 테이블 탐색</text>
  <text x="730" y="42" class="code" text-anchor="end">detection.rule_id = rule.code</text>
  <text x="220" y="68" class="step" text-anchor="middle">외부 행 1</text>
  <text x="360" y="68" class="step" text-anchor="middle">내부 탐색</text>
  <text x="500" y="68" class="step" text-anchor="middle">외부 행 2</text>
  <text x="640" y="68" class="step" text-anchor="middle">내부 탐색</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">외부 테이블</text>
  <text x="30" y="126" class="subc">rule</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="156" y="88" width="128" height="48" rx="8" class="hold"/>
  <text x="220" y="108" class="t" text-anchor="middle">1번째 행</text>
  <text x="220" y="127" class="val" text-anchor="middle">rule.code 꺼냄</text>
  <rect x="436" y="88" width="128" height="48" rx="8" class="hold"/>
  <text x="500" y="108" class="t" text-anchor="middle">2번째 행</text>
  <text x="500" y="127" class="val" text-anchor="middle">rule.code 꺼냄</text>
  <text x="30" y="168" class="lane">내부 테이블</text>
  <text x="30" y="186" class="subc">detection</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="296" y="148" width="128" height="48" rx="8" class="box"/>
  <text x="360" y="168" class="t" text-anchor="middle">rule_id 비교</text>
  <text x="360" y="187" class="val" text-anchor="middle">조인 조건 확인</text>
  <rect x="576" y="148" width="128" height="48" rx="8" class="box"/>
  <text x="640" y="168" class="t" text-anchor="middle">rule_id 비교</text>
  <text x="640" y="187" class="val" text-anchor="middle">조인 조건 확인</text>
  <text x="30" y="228" class="lane">결과</text>
  <text x="30" y="246" class="sub">매칭된 행</text>
  <rect x="150" y="206" width="585" height="52" rx="6" class="track"/>
  <rect x="296" y="208" width="128" height="48" rx="8" class="ok"/>
  <text x="360" y="237.0" class="okt" text-anchor="middle">결과에 추가</text>
  <rect x="576" y="208" width="128" height="48" rx="8" class="ok"/>
  <text x="640" y="237.0" class="okt" text-anchor="middle">결과에 추가</text>
  <line x1="262" y1="136" x2="318" y2="147" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="542" y1="136" x2="598" y2="147" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="360" y1="196" x2="360" y2="207" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="640" y1="196" x2="640" y2="207" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="410" y1="147" x2="456" y2="137" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="150" y="274" width="585" height="32" rx="15" class="hold"/>
  <text x="442.5" y="295" class="db" text-anchor="middle">외부 테이블의 행 수만큼 내부 테이블을 반복해서 찾음</text>
</svg>
