  <rect x="398" y="346" width="158" height="52" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/><text x="477" y="362" class="s2" text-anchor="middle" style="fill:#b91c1c;font-size:10.5px">주문 변경이 실패해 롤백되면</text><text x="477" y="376" class="s2" text-anchor="middle" style="fill:#b91c1c;font-size:10.5px">번호 줄도 함께 롤백됨</text><text x="477" y="390" class="s2" text-anchor="middle" style="fill:#b91c1c;font-size:10.5px">→ 다시 시도할 수 있음</text>
