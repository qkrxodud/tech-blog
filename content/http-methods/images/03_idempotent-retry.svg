<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>서버가 타임아웃으로 응답하지 못해 클라이언트가 같은 요청을 다시 보낼 때, PUT은 같은 값으로 다시 대체되어 결과가 같고 POST는 결제가 두 번 처리되어 중복되는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="444" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="204" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">PUT 재요청 — 멱등이라 최종 결과가 같음</text>
  <text x="220" y="68" class="step" text-anchor="middle">1. 요청</text>
  <text x="360" y="68" class="step" text-anchor="middle">2. 응답 없음</text>
  <text x="500" y="68" class="step" text-anchor="middle">3. 재요청</text>
  <text x="640" y="68" class="step" text-anchor="middle">4. 결과</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="117" class="lane">클라이언트</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="108" class="op" text-anchor="middle">PUT</text>
  <text x="220" y="127" class="val" text-anchor="middle">대체 요청</text>
  <rect x="302" y="96" width="116" height="32" rx="6" class="wait"/>
  <text x="360" y="117" class="waitt" text-anchor="middle">타임아웃</text>
  <rect x="442" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="500" y="108" class="op" text-anchor="middle">PUT</text>
  <text x="500" y="127" class="val" text-anchor="middle">같은 요청 재전송</text>
  <text x="30" y="177" class="lane">서버</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="148" width="116" height="48" rx="8" class="hold"/>
  <text x="220" y="168" class="db" text-anchor="middle">리소스 대체</text>
  <text x="220" y="187" class="val" text-anchor="middle">1번째 요청 처리</text>
  <rect x="302" y="148" width="116" height="48" rx="8" class="bad"/>
  <text x="360" y="168" class="badt" text-anchor="middle">응답 못 줌</text>
  <text x="360" y="187" class="val" text-anchor="middle">타임아웃 등</text>
  <rect x="442" y="148" width="116" height="48" rx="8" class="hold"/>
  <text x="500" y="168" class="db" text-anchor="middle">리소스 대체</text>
  <text x="500" y="187" class="val" text-anchor="middle">같은 값으로 다시</text>
  <rect x="582" y="148" width="116" height="48" rx="8" class="ok"/>
  <text x="640" y="168" class="okt" text-anchor="middle">결과 같음</text>
  <text x="640" y="187" class="val" text-anchor="middle">재요청해도 됨</text>
  <line x1="220" y1="136" x2="220" y2="146" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="360" y1="148" x2="360" y2="130" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <line x1="500" y1="136" x2="500" y2="146" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="10" y="230" width="740" height="204" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="262" class="h">POST 재요청 — 멱등이 아니라 처리가 중복됨</text>
  <text x="220" y="288" class="step" text-anchor="middle">1. 요청</text>
  <text x="360" y="288" class="step" text-anchor="middle">2. 응답 없음</text>
  <text x="500" y="288" class="step" text-anchor="middle">3. 재요청</text>
  <text x="640" y="288" class="step" text-anchor="middle">4. 결과</text>
  <line x1="160" y1="296" x2="722" y2="296" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="337" class="lane">클라이언트</text>
  <rect x="150" y="306" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="308" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="328" class="op" text-anchor="middle">POST</text>
  <text x="220" y="347" class="val" text-anchor="middle">결제 요청</text>
  <rect x="302" y="316" width="116" height="32" rx="6" class="wait"/>
  <text x="360" y="337" class="waitt" text-anchor="middle">타임아웃</text>
  <rect x="442" y="308" width="116" height="48" rx="8" class="box"/>
  <text x="500" y="328" class="op" text-anchor="middle">POST</text>
  <text x="500" y="347" class="val" text-anchor="middle">같은 요청 재전송</text>
  <text x="30" y="397" class="lane">서버</text>
  <rect x="150" y="366" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="368" width="116" height="48" rx="8" class="hold"/>
  <text x="220" y="388" class="db" text-anchor="middle">결제 처리</text>
  <text x="220" y="407" class="val" text-anchor="middle">1번째 결제</text>
  <rect x="302" y="368" width="116" height="48" rx="8" class="bad"/>
  <text x="360" y="388" class="badt" text-anchor="middle">응답 못 줌</text>
  <text x="360" y="407" class="val" text-anchor="middle">타임아웃 등</text>
  <rect x="442" y="368" width="116" height="48" rx="8" class="hold"/>
  <text x="500" y="388" class="db" text-anchor="middle">결제 처리</text>
  <text x="500" y="407" class="val" text-anchor="middle">2번째 결제</text>
  <rect x="582" y="368" width="116" height="48" rx="8" class="bad"/>
  <text x="640" y="388" class="badt" text-anchor="middle">결제 중복</text>
  <text x="640" y="407" class="val" text-anchor="middle">멱등이 아님</text>
  <line x1="220" y1="356" x2="220" y2="366" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="360" y1="368" x2="360" y2="350" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <line x1="500" y1="356" x2="500" y2="366" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
</svg>
