  </defs>

  <rect width="760" height="526" fill="#ffffff"/>
  <text x="24" y="30" class="h">Mock PG의 웹훅 — 문서에서 확인한 동작과 가정으로 둔 것</text>
  <text x="24" y="52" class="gs">"웹훅을 잘 받았다면 10 초 이내로 200 응답을 보내주세요." — 토스페이먼츠 웹훅 가이드</text>
  <rect x="24" y="72" width="176" height="112" rx="12" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <use href="#i-server" x="38" y="86"/>
  <text x="84" y="98" class="t2">Mock PG</text>
  <text x="84" y="116" class="s" style="font-size:11.5px">상태가 바뀜</text>
  <text x="38" y="140" class="gs" style="font-size:10.5px"><tspan class="m">DONE</tspan> 승인 · <tspan class="m">ABORTED</tspan> 거절</text>
  <text x="38" y="156" class="gs" style="font-size:10.5px"><tspan class="m">PARTIAL_CANCELED</tspan> 취소</text>
  <text x="38" y="172" class="gs" style="font-size:10.5px"><tspan class="m">CANCELED</tspan> 취소</text>
  <line x1="202" y1="128" x2="232" y2="128" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="236" y="72" width="260" height="112" rx="12" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <text x="250" y="94" class="t2" style="font-size:12px">POST <tspan class="m">PAYMENT_STATUS_CHANGED</tspan></text>
  <text x="250" y="116" class="s" style="font-size:11px"><tspan class="m">eventType</tspan></text>
  <text x="250" y="134" class="s" style="font-size:9.5px"><tspan class="m">createdAt</tspan> <tspan class="m">yyyy-MM-dd'T'HH:mm:ss.SSSSSS</tspan></text>
  <text x="250" y="152" class="s" style="font-size:11px"><tspan class="m">data</tspan> — 결제 조회 응답과 같은 모양</text>
  <text x="250" y="172" class="bads" style="font-size:11px"><tspan class="m">eventId</tspan> 없음</text>
  <line x1="498" y1="128" x2="528" y2="128" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="532" y="72" width="204" height="112" rx="12" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <use href="#i-app" x="546" y="86"/>
  <text x="590" y="98" class="t2">결제 서버</text>
  <text x="546" y="136" class="okt" style="font-size:12px">10초 안에 200 → 성공</text>
  <text x="546" y="158" class="badt" style="font-size:12px">아니면 다시 보냄</text>
  <path d="M634,186 V214 H73 V236" fill="none" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#aor)"/>
  <text x="400" y="208" class="os" text-anchor="middle" style="font-size:11.5px">200이 아니면 같은 본문으로 다시 — 최대 7번, 다 쓰면 그만</text>
  <rect x="40" y="240" width="66" height="30" rx="6" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <text x="73.0" y="260" class="os" text-anchor="middle" style="font-size:10.5px">1번 · 1분</text>
  <rect x="114" y="240" width="66" height="30" rx="6" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <text x="147.0" y="260" class="os" text-anchor="middle" style="font-size:10.5px">2번 · 4분</text>
  <rect x="188" y="240" width="66" height="30" rx="6" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <text x="221.0" y="260" class="os" text-anchor="middle" style="font-size:10.5px">3번 · 16분</text>
  <rect x="262" y="240" width="66" height="30" rx="6" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <text x="295.0" y="260" class="os" text-anchor="middle" style="font-size:10.5px">4번 · 64분</text>
  <rect x="336" y="240" width="66" height="30" rx="6" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <text x="369.0" y="260" class="os" text-anchor="middle" style="font-size:10.5px">5번 · 256분</text>
  <rect x="410" y="240" width="80" height="30" rx="6" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <text x="450.0" y="260" class="os" text-anchor="middle" style="font-size:10.5px">6번 · 1024분</text>
  <rect x="498" y="240" width="80" height="30" rx="6" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <text x="538.0" y="260" class="os" text-anchor="middle" style="font-size:10.5px">7번 · 4096분</text>
  <text x="40" y="290" class="gs" style="font-size:11px">실제 간격(최초 전송으로부터 3일 19시간까지) · 테스트는 횟수만 같게, 간격은 100ms</text>
  <rect x="24" y="308" width="712" height="116" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="38" y="330" class="gt" style="font-size:12.5px">문서에서 확인하지 못해 Mock PG의 가정으로 둔 것</text>
  <text x="38" y="356" class="t2" style="font-size:12px;fill:#4b5563">알림 순서</text>
  <text x="38" y="376" class="gs" style="font-size:10.5px">바뀐 순서대로 바로 보냄</text>
  <text x="38" y="392" class="gs" style="font-size:10.5px">테스트에서만 쌓아 두었다가</text>
  <text x="38" y="408" class="gs" style="font-size:10.5px">순서를 바꿔 0.1초씩 보냄</text>
  <text x="214" y="356" class="t2" style="font-size:12px;fill:#4b5563">다시 보내는 본문</text>
  <text x="214" y="376" class="gs" style="font-size:10.5px">처음 본문과 같음(<tspan class="m">createdAt</tspan>도)</text>
  <text x="214" y="392" class="gs" style="font-size:10.5px">다른 때의 같은 상태는</text>
  <text x="214" y="408" class="gs" style="font-size:10.5px">테스트가 새 알림으로 만듦</text>
  <text x="390" y="356" class="t2" style="font-size:12px;fill:#4b5563"><tspan class="m">createdAt</tspan> 시간대</text>
  <text x="390" y="376" class="gs" style="font-size:10.5px">한국 시각</text>
  <text x="390" y="392" class="gs" style="font-size:10.5px">문서의 형식에 시간대가 없음</text>
  <text x="566" y="356" class="t2" style="font-size:12px;fill:#4b5563">서명·전송 헤더</text>
  <text x="566" y="376" class="gs" style="font-size:10.5px">붙이지 않음</text>
  <text x="566" y="392" class="gs" style="font-size:10.5px">서명 헤더가 결제 상태 알림에</text>
  <text x="566" y="408" class="gs" style="font-size:10.5px">붙는지 판단하지 못함</text>
  <text x="24" y="448" class="t2" style="font-size:12.5px">시험용 조작</text>
  <rect x="24" y="460" width="170.28" height="24" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="109.14" y="476.5" class="s" text-anchor="middle" style="font-size:11px">쌓아 두기·순서 바꿔 보내기</text>
  <rect x="200.28" y="460" width="106.48000000000002" height="24" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="253.52" y="476.5" class="s" text-anchor="middle" style="font-size:11px">같은 본문 두 번</text>
  <rect x="312.76" y="460" width="83.16" height="24" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="354.34" y="476.5" class="s" text-anchor="middle" style="font-size:11px">늦게 보내기</text>
  <rect x="401.91999999999996" y="460" width="100.32000000000001" height="24" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="452.08" y="476.5" class="s" text-anchor="middle" style="font-size:11px">같은 상태 다시</text>
  <rect x="508.23999999999995" y="460" width="72.16" height="24" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="544.3199999999999" y="476.5" class="s" text-anchor="middle" style="font-size:11px">위조 알림</text>
  <rect x="586.4" y="460" width="111.32000000000001" height="24" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="642.06" y="476.5" class="s" text-anchor="middle" style="font-size:11px">승인 답만 붙잡기</text>
  <rect x="24" y="490" width="145.64" height="24" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="96.82" y="506.5" class="s" text-anchor="middle" style="font-size:11px">PG에서만 일어나는 취소</text>
</svg>
