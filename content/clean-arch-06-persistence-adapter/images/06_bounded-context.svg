  <text x="127.5" y="404.0" class="m" text-anchor="middle">…</text>
  <rect x="290" y="324" width="180" height="52" rx="8" class="ok"/>
  <text x="380.0" y="346.5" class="st" text-anchor="middle">«interface»</text>
  <text x="380.0" y="361.5" class="mok" text-anchor="middle">CreateInvoicePort</text>
  <rect x="290" y="380" width="180" height="40" rx="8" class="box"/>
  <text x="380.0" y="404" class="m" text-anchor="middle">…</text>
  <rect x="540" y="328" width="175" height="92" rx="8" class="hold"/>
  <text x="627.5" y="363.0" class="m" text-anchor="middle">Billing</text>
