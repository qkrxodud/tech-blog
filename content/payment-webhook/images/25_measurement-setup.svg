  <rect width="760" height="540" fill="#ffffff"/>
  <text x="24" y="30" class="h">같은 알림 묶음 측정 — 묶음과 조건</text>
  <text x="24" y="52" class="gs"><tspan class="m">./gradlew webhookMeasurement</tspan> · 구현마다 같은 묶음을 보냄 · 한 번 실행한 값</text>
  <rect x="24" y="72" width="440" height="300" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="40" y="96" class="t2" style="font-size:13px">시나리오 9개 × 2건 = 결제 18건</text>
  <rect x="40" y="108" width="408" height="23" rx="6" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <text x="52" y="124" class="t2" style="font-size:11px">1</text>
  <text x="70" y="124" class="s" style="font-size:11px">순서 바뀜 — 취소 알림이 먼저</text>
  <text x="440" y="124" class="gs" text-anchor="end" style="font-size:10.5px">×2</text>
  <rect x="40" y="135" width="408" height="23" rx="6" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <text x="52" y="151" class="t2" style="font-size:11px">2</text>
  <text x="70" y="151" class="s" style="font-size:11px">승인 알림이 승인 답보다 먼저(답 0.5초 붙잡음)</text>
  <text x="440" y="151" class="gs" text-anchor="end" style="font-size:10.5px">×2</text>
  <rect x="40" y="162" width="408" height="23" rx="6" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <text x="52" y="178" class="t2" style="font-size:11px">3</text>
  <text x="70" y="178" class="s" style="font-size:11px">같은 알림 두 번 — PG에서만 부분 취소, 같은 본문</text>
  <text x="440" y="178" class="gs" text-anchor="end" style="font-size:10.5px">×2</text>
  <rect x="40" y="189" width="408" height="23" rx="6" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <text x="52" y="205" class="t2" style="font-size:11px">4</text>
  <text x="70" y="205" class="s" style="font-size:11px">같은 상태를 다른 때에 다시 — 0.5초 뒤 새 <tspan class="m">createdAt</tspan></text>
  <text x="440" y="205" class="gs" text-anchor="end" style="font-size:10.5px">×2</text>
  <rect x="40" y="216" width="408" height="23" rx="6" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <text x="52" y="232" class="t2" style="font-size:11px">5</text>
  <text x="70" y="232" class="s" style="font-size:11px">위조 알림 — 승인된 결제에 전액 취소</text>
  <text x="440" y="232" class="gs" text-anchor="end" style="font-size:10.5px">×2</text>
  <rect x="40" y="243" width="408" height="23" rx="6" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <text x="52" y="259" class="t2" style="font-size:11px">6</text>
  <text x="70" y="259" class="s" style="font-size:11px">PG 조회가 늦음 — 1.5초, 그사이 PG에서만 부분 취소</text>
  <text x="440" y="259" class="gs" text-anchor="end" style="font-size:10.5px">×2</text>
  <rect x="40" y="270" width="408" height="23" rx="6" fill="#ede9fe" stroke="#8b7fd1" stroke-width="1.5"/>
  <text x="52" y="286" class="t2" style="font-size:11px">7</text>
  <text x="70" y="286" class="s" style="font-size:11px">결과 모름 결제</text>
  <text x="440" y="286" class="gs" text-anchor="end" style="font-size:10.5px">×2</text>
  <rect x="40" y="297" width="408" height="23" rx="6" fill="#ede9fe" stroke="#8b7fd1" stroke-width="1.5"/>
  <text x="52" y="313" class="t2" style="font-size:11px">8</text>
  <text x="70" y="313" class="s" style="font-size:11px">결과 모름 취소</text>
  <text x="440" y="313" class="gs" text-anchor="end" style="font-size:10.5px">×2</text>
  <rect x="40" y="324" width="408" height="23" rx="6" fill="#ede9fe" stroke="#8b7fd1" stroke-width="1.5"/>
  <text x="52" y="340" class="t2" style="font-size:11px">9</text>
  <text x="70" y="340" class="s" style="font-size:11px">PG에서만 일어난 부분 취소</text>
  <text x="440" y="340" class="gs" text-anchor="end" style="font-size:10.5px">×2</text>
  <text x="40" y="362" class="gs" style="font-size:11.5px">모든 결제에 승인 알림도 감</text>
  <rect x="480" y="72" width="256" height="168" rx="12" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="494" y="96" class="bt" style="font-size:12.5px">측정 조건</text>
  <text x="494" y="122" class="bs" style="font-size:11.5px">받은 알림 처리 + 4·5장 주기 보정</text>
  <text x="494" y="144" class="bs" style="font-size:11.5px">→ 0.2초마다 함께 돌림</text>
  <text x="494" y="166" class="bs" style="font-size:11.5px">읽기 시간 제한 1초</text>
  <text x="494" y="188" class="bs" style="font-size:11.5px">보정 대기 시간 10초</text>
  <text x="494" y="210" class="bs" style="font-size:11.5px">200이 아니면 100ms 간격 7번까지</text>
  <rect x="480" y="252" width="256" height="120" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="494" y="276" class="gt" style="font-size:12.5px">운영 설정·실제 PG — 측정과 다름</text>
  <text x="494" y="302" class="gs" style="font-size:11.5px">받은 알림 처리 1초마다</text>
  <text x="494" y="324" class="gs" style="font-size:11.5px">주기 보정 1분마다</text>
  <text x="494" y="346" class="gs" style="font-size:11.5px">재전송 간격 1~4096분(실제 PG)</text>
  <text x="24" y="404" class="t2" style="font-size:12.5px">한 구현의 실행</text>
  <rect x="24" y="416" width="300" height="40" rx="8" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <use href="#i-bell" transform="translate(34,424) scale(0.8)"/>
  <text x="64" y="441" class="ot" style="font-size:12px">묶음 보내기 14676~15311ms</text>
  <line x1="326" y1="436" x2="344" y2="436" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="348" y="416" width="268" height="40" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <use href="#i-clock" transform="translate(358,423) scale(0.85)"/>
  <text x="392" y="441" class="bt" style="font-size:12px">다 보낸 뒤 25초까지 봄</text>
  <line x1="618" y1="436" x2="632" y2="436" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="636" y="416" width="100" height="40" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="686" y="434" class="bads" text-anchor="middle" style="font-size:10.5px">PG와 다르면</text>
  <text x="686" y="449" class="badt" text-anchor="middle" style="font-size:11.5px">어긋남</text>
  <rect x="24" y="470" width="712" height="54" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="40" y="492" class="t2" style="font-size:12px">맞춰지기까지</text>
  <text x="40" y="512" class="s" style="font-size:11.5px">결제의 마지막 PG 쪽 변화(위조는 위조 알림을 보낸 때) → 처음 PG와 같아진 때</text>
</svg>
