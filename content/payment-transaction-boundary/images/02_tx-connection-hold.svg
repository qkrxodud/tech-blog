<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>트랜잭션 하나로 묶기와 나누기에서 DB 연결을 쥐는 구간 비교 — 하나로 묶으면 인증 기록부터 PG 답 대기, 결과 기록까지 트랜잭션 하나가 연결 하나를 계속 쥐고, 나누면 인증 기록(트랜잭션 1)과 결과 기록(트랜잭션 2)의 짧은 트랜잭션에서만 연결을 쓰고 트랜잭션 밖에서 PG를 기다리는 동안에는 연결을 놓는 그림</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14.5px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #4b5563; }
    .m { font-family: Menlo, Consolas, monospace; }
    .lbl { font-size: 12px; fill: #4b5563; }
    .ax { font-size: 12.5px; fill: #4b5563; font-weight: 700; }
    .tab { font-size: 12.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .badt { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .bads { font-size: 11.5px; fill: #b91c1c; }
    .okt { font-size: 13px; font-weight: 700; fill: #15803d; }
    .oks { font-size: 11.5px; fill: #15803d; }
    .o { stroke: #1f2937; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .spine { stroke: #1f2937; stroke-width: 1.5; fill: none; }
    .run { stroke-dasharray: 5 4; animation: run 0.9s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -18; } }
    @media (prefers-reduced-motion: reduce) { .run { animation: none; } .anim { display: none; } }
  </style>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="aor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <g id="pkt">
      <rect x="-11" y="-8" width="22" height="16" rx="3" fill="#2dd4bf" stroke="#0f766e" stroke-width="1.5"/>
      <path d="M-10,-7 L0,1 L10,-7" fill="none" stroke="#0f766e" stroke-width="1.5"/>
    </g>
    <g id="xmark"><circle r="9" fill="#ef4444"/><path d="M-4,-4 L4,4 M4,-4 L-4,4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
    <g id="vmark"><circle r="9" fill="#22c55e"/><path d="M-4.5,0 L-1.5,3.5 L4.5,-3.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <!-- 자물쇠: 트랜잭션·연결을 쥐고 있음 -->
    <g id="lock">
      <path d="M-5.5,-3 v-4 a5.5,5.5 0 0 1 11,0 v4" fill="none" stroke="#1f2937" stroke-width="2.2"/>
      <rect x="-8.5" y="-3" width="17" height="13" rx="3" fill="#fbbf24" stroke="#1f2937" stroke-width="1.5"/>
      <circle cx="0" cy="3" r="1.8" fill="#1f2937"/>
    </g>
    <!-- 두 상태 칩 + 화살표: 상태 전이 -->
    <g id="chips">
      <rect x="0" y="4" width="13" height="14" rx="4" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.5"/>
      <rect x="21" y="4" width="13" height="14" rx="4" fill="#86efac" stroke="#1f2937" stroke-width="1.5"/>
      <path d="M14,11 h6 M17,8 l3,3 l-3,3" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- 종이비행기: 바깥 호출 -->
    <g id="plane">
      <path d="M1,13 L31,1 L23,29 L15,19 Z" fill="#fdba74" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M15,19 L31,1 L11,16 Z" fill="#fb923c" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <!-- 체크 문서: 기록 -->
    <g id="doc">
      <path d="M0,0 h18 l8,8 v26 h-26 z" fill="#ffffff" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M18,0 v8 h8" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="20" cy="26" r="8" fill="#22c55e" stroke="#1f2937" stroke-width="1.5"/>
      <path d="M16.5,26 l2.5,2.5 l4.5,-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5,10 h9 M5,16 h7" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- DB 원통 -->
    <g id="db">
      <path d="M0,4 v16 a11,4 0 0 0 22,0 v-16 a11,4 0 0 1 -22,0 z" fill="#60a5fa" stroke="#1f2937" stroke-width="1.5"/>
      <path d="M0,12 a11,4 0 0 0 22,0" fill="none" stroke="#1f2937" stroke-width="1.5"/>
      <ellipse cx="11" cy="4" rx="11" ry="4" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.5"/>
    </g>
    <!-- 서버 두 칸 + 불빛: PG -->
    <g id="srv">
      <rect x="0" y="0" width="36" height="13" rx="3" fill="#cbd5e1" stroke="#1f2937" stroke-width="1.5"/>
      <rect x="0" y="16" width="36" height="13" rx="3" fill="#cbd5e1" stroke="#1f2937" stroke-width="1.5"/>
      <circle cx="7" cy="6.5" r="2.2" fill="#22c55e"/>
      <circle cx="7" cy="22.5" r="2.2" fill="#22c55e"/>
      <path d="M14,6.5 h16 M14,22.5 h16" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- 시계: 시간 제한·대기 -->
    <g id="clock">
      <circle cx="13" cy="13" r="12" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.5"/>
      <path d="M13,6 V13 L18,16" fill="none" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="760" height="490" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="228" rx="12" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="26" y="38" class="h">트랜잭션 하나로 묶기 — PG 답을 기다리는 동안에도 연결을 쥔다</text>
  <rect x="150" y="62" width="594" height="94" rx="16" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="150" y="62" width="594" height="94" rx="16" fill="none" stroke="#5b7194" stroke-width="3" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.033;0.038;0.826;0.836;1"/></rect>
  <rect x="166" y="50" width="210" height="24" rx="6" fill="#5b7194"/>
  <text x="271" y="67" class="tab" text-anchor="middle">트랜잭션 1개 — <tspan font-family="Menlo, Consolas, monospace" font-size="11.5px">@Transactional</tspan></text>
  <text x="26" y="112" class="t">승인 서비스</text>
  <text x="26" y="130" class="s">출발 코드</text>
  <rect x="166" y="82" width="170" height="64" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <rect x="166" y="82" width="170" height="64" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.033;0.038;0.234;0.244;1"/></rect>
  <circle cx="166" cy="82" r="12" fill="#111827"/><text x="166" y="86" class="num" text-anchor="middle">1</text>
  <use href="#chips" x="178" y="104"/>
  <text x="220" y="104" class="t">인증 기록</text>
  <text x="220" y="122" class="s m" style="font-size: 11px">payment.</text>
  <text x="220" y="137" class="s m" style="font-size: 11px">authenticate()</text>
  <rect x="348" y="82" width="204" height="64" rx="10" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <rect x="348" y="82" width="204" height="64" rx="10" fill="none" stroke="#ea580c" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.243;0.248;0.623;0.633;1"/></rect>
  <circle cx="348" cy="82" r="12" fill="#111827"/><text x="348" y="86" class="num" text-anchor="middle">2</text>
  <g transform="translate(360,98)"><use href="#plane"/></g>
  <text x="402" y="104" class="t">PG 승인 호출</text>
  <text x="402" y="122" class="s m" style="font-size: 11px">paymentGateway.</text>
  <text x="402" y="137" class="s m" style="font-size: 11px">approve()</text>
  <rect x="564" y="82" width="164" height="64" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <rect x="564" y="82" width="164" height="64" rx="10" fill="none" stroke="#16a34a" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.632;0.637;0.826;0.836;1"/></rect>
  <circle cx="564" cy="82" r="12" fill="#111827"/><text x="564" y="86" class="num" text-anchor="middle">3</text>
  <use href="#doc" x="576" y="97"/>
  <text x="612" y="104" class="t">결과 기록·커밋</text>
  <text x="612" y="122" class="s m" style="font-size: 11px">payment.</text>
  <text x="612" y="137" class="s m" style="font-size: 11px">approve()</text>
  <text x="26" y="188" class="t">DB 연결</text>
  <text x="26" y="206" class="s">트랜잭션 1개</text>
  <rect x="166" y="168" width="562" height="46" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <rect x="166" y="168" width="562" height="46" rx="10" fill="none" stroke="#dc2626" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.033;0.038;0.826;0.836;1"/></rect>
  <use href="#lock" x="190" y="188"/>
  <text x="447" y="187" class="badt" text-anchor="middle">연결 1개를 쥔 채 PG 답을 기다림</text>
  <text x="447" y="205" class="bads" text-anchor="middle">커밋은 마지막에 한 번, 그때까지 연결을 놓지 않음</text>
  <rect x="10" y="252" width="740" height="228" rx="12" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="26" y="280" class="h">트랜잭션 나누기 — PG를 기다리는 동안 연결을 놓는다</text>
  <rect x="154" y="304" width="188" height="94" rx="16" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="154" y="304" width="188" height="94" rx="16" fill="none" stroke="#5b7194" stroke-width="3" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.033;0.038;0.234;0.244;1"/></rect>
  <rect x="166" y="292" width="96" height="24" rx="6" fill="#5b7194"/>
  <text x="214" y="309" class="tab" text-anchor="middle">트랜잭션 1</text>
  <rect x="558" y="304" width="182" height="94" rx="16" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="558" y="304" width="182" height="94" rx="16" fill="none" stroke="#5b7194" stroke-width="3" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.632;0.637;0.826;0.836;1"/></rect>
  <rect x="570" y="292" width="96" height="24" rx="6" fill="#5b7194"/>
  <text x="618" y="309" class="tab" text-anchor="middle">트랜잭션 2</text>
  <text x="450" y="316" class="oks" text-anchor="middle" style="font-weight: 700">트랜잭션 밖</text>
  <text x="26" y="354" class="t">승인 서비스</text>
  <text x="26" y="372" class="s">완성 코드</text>
  <rect x="166" y="324" width="170" height="64" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <rect x="166" y="324" width="170" height="64" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.033;0.038;0.234;0.244;1"/></rect>
  <circle cx="166" cy="324" r="12" fill="#111827"/><text x="166" y="328" class="num" text-anchor="middle">1</text>
  <use href="#chips" x="178" y="346"/>
  <text x="220" y="346" class="t">인증 기록</text>
  <text x="220" y="364" class="s m" style="font-size: 11px">paymentRecorder.</text>
  <text x="220" y="379" class="s m" style="font-size: 11px">authenticate()</text>
  <rect x="348" y="324" width="204" height="64" rx="10" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <rect x="348" y="324" width="204" height="64" rx="10" fill="none" stroke="#ea580c" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.243;0.248;0.623;0.633;1"/></rect>
  <circle cx="348" cy="324" r="12" fill="#111827"/><text x="348" y="328" class="num" text-anchor="middle">2</text>
  <g transform="translate(360,340)"><use href="#plane"/></g>
  <text x="402" y="346" class="t">PG 승인 호출</text>
  <text x="402" y="364" class="s m" style="font-size: 11px">paymentGateway.</text>
  <text x="402" y="379" class="s m" style="font-size: 11px">approve()</text>
  <rect x="564" y="324" width="164" height="64" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <rect x="564" y="324" width="164" height="64" rx="10" fill="none" stroke="#16a34a" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.632;0.637;0.826;0.836;1"/></rect>
  <circle cx="564" cy="324" r="12" fill="#111827"/><text x="564" y="328" class="num" text-anchor="middle">3</text>
  <use href="#doc" x="576" y="339"/>
  <text x="612" y="346" class="t">결과 기록·커밋</text>
  <text x="612" y="364" class="s m" style="font-size: 11px">paymentRecorder.</text>
  <text x="612" y="379" class="s m" style="font-size: 11px">recordApproval()</text>
  <text x="26" y="430" class="t">DB 연결</text>
  <text x="26" y="448" class="s">짧은 트랜잭션 2개</text>
  <rect x="166" y="410" width="170" height="46" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <rect x="166" y="410" width="170" height="46" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.033;0.038;0.234;0.244;1"/></rect>
  <use href="#lock" x="188" y="430"/>
  <text x="210" y="429" class="t" style="font-size: 13.5px">트랜잭션 1</text>
  <text x="210" y="447" class="s">커밋 후 반납</text>
  <rect x="348" y="410" width="204" height="46" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="5 4"/>
  <rect x="348" y="410" width="204" height="46" rx="10" fill="none" stroke="#16a34a" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.243;0.248;0.623;0.633;1"/></rect>
  <text x="450" y="429" class="okt" text-anchor="middle">연결을 쓰지 않음</text>
  <text x="450" y="447" class="oks" text-anchor="middle">다른 요청이 그 연결을 쓸 수 있음</text>
  <rect x="564" y="410" width="164" height="46" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <rect x="564" y="410" width="164" height="46" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.632;0.637;0.826;0.836;1"/></rect>
  <use href="#lock" x="586" y="430"/>
  <text x="608" y="429" class="t" style="font-size: 13.5px">트랜잭션 2</text>
  <text x="608" y="447" class="s">다시 읽고 기록</text>
