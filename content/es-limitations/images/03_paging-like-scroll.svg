<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>화면은 1~10페이지 번호를 그대로 보여 주고, 5페이지를 클릭하면 내부에서는 무한 스크롤 방식으로 해당 인덱스만큼 조회해 그 페이지 결과를 노출하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .chip { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; }
    .chipt { font-size: 13px; font-weight: 600; fill: #1f2937; }
    .idt { font-size: 13px; font-weight: 700; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .empty { fill: none; stroke: #e5e7eb; stroke-width: 1.2; stroke-dasharray: 3 3; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="350" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="330" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">무한 스크롤 방식이지만 페이징처럼 노출</text>
  <text x="30" y="64" class="sub">현업이 쓰던 페이징 화면은 그대로 두고, 조회 방식만 바꿈</text>
  <text x="30" y="106" class="lane">화면</text>
  <text x="30" y="124" class="sub">1~10페이지</text>
  <rect x="150" y="86" width="36" height="36" rx="6" class="box"/>
  <text x="168" y="109" class="chipt" text-anchor="middle">1</text>
  <rect x="196" y="86" width="36" height="36" rx="6" class="box"/>
  <text x="214" y="109" class="chipt" text-anchor="middle">2</text>
  <rect x="242" y="86" width="36" height="36" rx="6" class="box"/>
  <text x="260" y="109" class="chipt" text-anchor="middle">3</text>
  <rect x="288" y="86" width="36" height="36" rx="6" class="box"/>
  <text x="306" y="109" class="chipt" text-anchor="middle">4</text>
  <rect x="334" y="86" width="36" height="36" rx="6" class="ok"/>
  <text x="352" y="109" class="okt" text-anchor="middle">5</text>
  <rect x="380" y="86" width="36" height="36" rx="6" class="box"/>
  <text x="398" y="109" class="chipt" text-anchor="middle">6</text>
  <rect x="426" y="86" width="36" height="36" rx="6" class="box"/>
  <text x="444" y="109" class="chipt" text-anchor="middle">7</text>
  <rect x="472" y="86" width="36" height="36" rx="6" class="box"/>
  <text x="490" y="109" class="chipt" text-anchor="middle">8</text>
  <rect x="518" y="86" width="36" height="36" rx="6" class="box"/>
  <text x="536" y="109" class="chipt" text-anchor="middle">9</text>
  <rect x="564" y="86" width="36" height="36" rx="6" class="box"/>
  <text x="582" y="109" class="chipt" text-anchor="middle">10</text>
  <text x="30" y="198" class="lane">조회</text>
  <text x="30" y="216" class="sub">내부 동작</text>
  <rect x="160.0" y="176" width="220" height="48" rx="8" class="box"/>
  <text x="270" y="196" class="db" text-anchor="middle">5페이지 클릭</text>
  <text x="270" y="215" class="val" text-anchor="middle">기존 페이징 화면 그대로</text>
  <rect x="400.0" y="176" width="260" height="48" rx="8" class="ok"/>
  <text x="530" y="196" class="okt" text-anchor="middle">해당 인덱스만큼 조회</text>
  <text x="530" y="215" class="val" text-anchor="middle">무한 스크롤 방식</text>
  <line x1="384" y1="200" x2="396" y2="200" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="352" y1="126" x2="300" y2="172" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="274" class="lane">노출</text>
  <rect x="400.0" y="252" width="260" height="48" rx="8" class="box"/>
  <text x="530" y="272" class="db" text-anchor="middle">5페이지 결과</text>
  <text x="530" y="291" class="val" text-anchor="middle">페이지처럼 노출</text>
  <line x1="530" y1="226" x2="530" y2="250" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
</svg>
