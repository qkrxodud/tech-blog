    <g id="i-lock"><path d="M7,12 V8 a7,7 0 0 1 14,0 V12" fill="none" class="o" stroke-width="2.2"/><rect x="3" y="12" width="22" height="16" rx="3" fill="#fbbf24" class="o"/><circle cx="14" cy="20" r="2.4" fill="#1f2937"/></g>
  </defs>

  <rect width="760" height="476" fill="#ffffff"/>
  <text x="24" y="30" class="h">5장 완성 코드의 취소 API — 응답 한눈에</text>
  <rect x="24" y="48" width="712" height="58" rx="12" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <use href="#i-card" x="38" y="62"/>
  <text x="82" y="70" class="t2" style="font-size:12.5px"><tspan class="m">POST /api/v1/payments/{orderId}/cancel</tspan></text>
  <text x="82" y="92" class="s" style="font-size:11px">헤더 <tspan class="m">Idempotency-Key</tspan>(필수, 300자 이하) · 본문 <tspan class="m">{cancelAmount?, cancelReason}</tspan></text>
  <rect x="24" y="120" width="230" height="340" rx="14" fill="#fdf2f2" stroke="#e08a8a" stroke-width="1.3"/>
  <rect x="36" y="130" width="170" height="24" rx="6" fill="#b91c1c"/>
  <text x="121.0" y="146.5" class="tab" text-anchor="middle">PG를 부르기 전 거절</text>
  <rect x="266" y="120" width="230" height="340" rx="14" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.3"/>
  <rect x="278" y="130" width="150" height="24" rx="6" fill="#5b7194"/>
  <text x="353.0" y="146.5" class="tab" text-anchor="middle">같은 키 · 같은 내용</text>
  <rect x="508" y="120" width="228" height="340" rx="14" fill="#fbf4ee" stroke="#d99a6c" stroke-width="1.3"/>
  <rect x="520" y="130" width="110" height="24" rx="6" fill="#c2410c"/>
  <text x="575.0" y="146.5" class="tab" text-anchor="middle">PG 답으로</text>
  <rect x="36" y="166" width="206" height="81" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="48" y="186" class="badt" style="font-size:12.5px"><tspan class="m">400</tspan></text>
  <text x="48" y="204" class="bads" style="font-size:9.5px"><tspan class="m">INVALID_IDEMPOTENCY_KEY</tspan></text>
  <text x="48" y="221" class="bads" style="font-size:9.5px"><tspan class="m">INVALID_CANCEL_REASON</tspan></text>
  <text x="48" y="238" class="bads" style="font-size:9.5px"><tspan class="m">INVALID_AMOUNT</tspan></text>
  <rect x="36" y="257" width="206" height="47" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="48" y="277" class="badt" style="font-size:12.5px"><tspan class="m">404</tspan></text>
  <text x="48" y="295" class="bads" style="font-size:9.5px"><tspan class="m">PAYMENT_NOT_FOUND</tspan></text>
  <rect x="36" y="314" width="206" height="64" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="48" y="334" class="badt" style="font-size:12.5px"><tspan class="m">409</tspan></text>
  <text x="48" y="352" class="bads" style="font-size:9.5px"><tspan class="m">INVALID_PAYMENT_TRANSITION</tspan></text>
  <text x="48" y="369" class="bads" style="font-size:9.5px"><tspan class="m">CANCEL_AMOUNT_EXCEEDS_BALANCE</tspan></text>
  <rect x="36" y="388" width="206" height="64" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="48" y="408" class="badt" style="font-size:12.5px"><tspan class="m">422</tspan></text>
  <text x="48" y="426" class="bads" style="font-size:9.5px"><tspan class="m">IDEMPOTENCY_KEY_REUSED</tspan></text>
  <text x="48" y="443" class="bads" style="font-size:10.5px">같은 키에 다른 금액 · 사유</text>
  <rect x="278" y="166" width="206" height="76" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="290" y="188" class="okt" style="font-size:12px"><tspan class="m">200</tspan> 처음과 같은 답</text>
  <text x="290" y="210" class="oks" style="font-size:10.5px">결과가 있으면</text>
  <text x="290" y="227" class="oks" style="font-size:10.5px">PG를 부르지 않음</text>
  <rect x="278" y="252" width="206" height="76" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="290" y="274" class="okt" style="font-size:12px"><tspan class="m">200</tspan> PG에 같은 키로</text>
  <text x="290" y="296" class="oks" style="font-size:10.5px">결과를 못 남겼으면</text>
  <text x="290" y="313" class="oks" style="font-size:10.5px">다시 보내 그 답으로</text>
  <rect x="278" y="338" width="206" height="76" rx="8" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <text x="290" y="360" class="t2" style="font-size:12px"><tspan class="m">202</tspan> 확인 중</text>
  <text x="290" y="382" class="s" style="font-size:10.5px">PG가 앞 요청을 처리 중</text>
  <text x="290" y="399" class="s" style="font-size:10.5px"><tspan class="m">balanceAmount</tspan> 비어 있음</text>
  <rect x="520" y="166" width="204" height="78" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="532" y="186" class="okt" style="font-size:12px"><tspan class="m">200</tspan> <tspan class="m">DONE</tspan></text>
  <text x="532" y="203" class="oks" style="font-size:9.5px"><tspan class="m">balanceAmount</tspan> · 0원이면 결제</text>
  <text x="532" y="219" class="oks" style="font-size:9.5px"><tspan class="m">APPROVAL_CANCELED</tspan> 또는</text>
  <text x="532" y="235" class="oks" style="font-size:9.5px"><tspan class="m">CAPTURE_CANCELED</tspan>, 남으면 그대로</text>
  <rect x="520" y="254" width="204" height="46" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="532" y="274" class="badt" style="font-size:12px"><tspan class="m">200</tspan> <tspan class="m">FAILED</tspan></text>
  <text x="532" y="291" class="bads" style="font-size:9.5px">PG가 거절 · <tspan class="m">balanceAmount</tspan> 그대로</text>
  <rect x="520" y="310" width="204" height="62" rx="8" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <text x="532" y="330" class="t2" style="font-size:12px"><tspan class="m">504</tspan></text>
  <text x="532" y="347" class="s" style="font-size:9.5px"><tspan class="m">PAYMENT_GATEWAY_NO_RESPONSE</tspan></text>
  <text x="532" y="363" class="s" style="font-size:9.5px">취소는 <tspan class="m">UNKNOWN</tspan></text>
  <rect x="520" y="382" width="204" height="62" rx="8" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <text x="532" y="402" class="t2" style="font-size:12px"><tspan class="m">502</tspan></text>
  <text x="532" y="419" class="s" style="font-size:9.5px"><tspan class="m">PAYMENT_GATEWAY_FAILED</tspan></text>
  <text x="532" y="435" class="s" style="font-size:9.5px">취소는 결과를 기다리는 상태 그대로</text>
</svg>
