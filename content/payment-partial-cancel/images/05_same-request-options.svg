  <text x="340" y="292" class="bads" style="font-size: 12px">PG 취소 2번, 다른 답</text>
  <rect x="468" y="240" width="132" height="74" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.2"/>
  <use href="#xmark" x="484" y="265"/>
