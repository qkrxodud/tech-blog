<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 362" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>주문을 조회하는 SQL 1번으로 주문 2건을 가져온 뒤, SimpleOrderDto를 만들면서 주문마다 회원과 배송을 지연 로딩해 MEMBER 조회 2번과 DELIVERY 조회 2번이 추가로 실행되어 모두 5번이 되는 N+1 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .m { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .vm { font-size: 12px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .jm { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="362" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="342" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">V2 DTO 변환 — 주문 2건의 N+1</text>
  <text x="730" y="42" class="code" text-anchor="end">/api/v2/simple-orders</text>
  <text x="207" y="68" class="step" text-anchor="middle">쿼리 1번</text>
  <text x="380" y="68" class="step" text-anchor="middle">주문1 (회원·배송)</text>
  <text x="610" y="68" class="step" text-anchor="middle">주문2 (회원·배송)</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">애플리케이션</text>
  <text x="30" y="126" class="sub">DTO 변환</text>
  <rect x="150" y="86" width="585" height="56" rx="6" class="track"/>
  <rect x="155" y="90" width="105" height="48" rx="8" class="box"/>
  <text x="207.5" y="110" class="t" text-anchor="middle">주문 조회</text>
  <text x="207.5" y="129" class="val" text-anchor="middle">주문 목록</text>
  <rect x="275" y="90" width="210" height="48" rx="8" class="hold"/>
  <text x="380" y="110" class="t" text-anchor="middle">주문1 → SimpleOrderDto</text>
  <text x="380" y="129" class="val" text-anchor="middle">getMember(), getDelivery()</text>
  <rect x="505" y="90" width="210" height="48" rx="8" class="hold"/>
  <text x="610" y="110" class="t" text-anchor="middle">주문2 → SimpleOrderDto</text>
  <text x="610" y="129" class="val" text-anchor="middle">getMember(), getDelivery()</text>
  <text x="30" y="192" class="lane">SQL</text>
  <text x="30" y="210" class="sub">DB로 나간 SQL</text>
  <rect x="150" y="170" width="585" height="56" rx="6" class="track"/>
  <rect x="155" y="174" width="105" height="48" rx="8" class="dbbox"/>
  <text x="207.5" y="194" class="m" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">ORDERS</tspan></text>
  <text x="207.5" y="213" class="val" text-anchor="middle">주문 2건</text>
  <rect x="275" y="174" width="100" height="48" rx="8" class="bad"/>
  <text x="325" y="194" class="badm" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">MEMBER</tspan></text>
  <text x="325" y="213" class="val" text-anchor="middle">userA</text>
  <rect x="385" y="174" width="100" height="48" rx="8" class="bad"/>
  <text x="435" y="194" class="badm" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">DELIVERY</tspan></text>
  <text x="435" y="213" class="val" text-anchor="middle">주문1 배송</text>
  <rect x="505" y="174" width="100" height="48" rx="8" class="bad"/>
  <text x="555" y="194" class="badm" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">MEMBER</tspan></text>
  <text x="555" y="213" class="val" text-anchor="middle">userB</text>
  <rect x="615" y="174" width="100" height="48" rx="8" class="bad"/>
  <text x="665" y="194" class="badm" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">DELIVERY</tspan></text>
  <text x="665" y="213" class="val" text-anchor="middle">주문2 배송</text>
  <line x1="207" y1="139" x2="207" y2="172" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="325" y1="139" x2="325" y2="172" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <line x1="435" y1="139" x2="435" y2="172" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <line x1="555" y1="139" x2="555" y2="172" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <line x1="665" y1="139" x2="665" y2="172" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="150" y="248" width="360" height="32" rx="15" class="bad"/>
  <text x="330" y="269" class="badt" text-anchor="middle">SQL 1 + 회원 N(2) + 배송 N(2) = 5번</text>
  <text x="150" y="310" class="foot">지연 로딩된 회원과 배송을 DTO에서 꺼낼 때마다 SQL이 실행됩니다.</text>
  <text x="150" y="332" class="foot">이미 영속성 컨텍스트에 있는 엔티티면 그 조회는 생략됩니다.</text>
</svg>
