  <rect x="150" y="248" width="200" height="32" rx="15" class="ok"/>
  <text x="250" y="269" class="okt" text-anchor="middle">SQL 1번</text>
  <text x="150" y="310" class="foot">회원과 배송이 이미 채워져 있으므로 지연 로딩이 발생하지 않습니다.</text>
</svg>
