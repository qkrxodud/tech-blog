  <rect width="760" height="400" fill="#ffffff"/>
  <text x="24" y="28" class="h">12장 요약 — 다섯 결정과 비교 구현의 실패 수</text>
  <text x="24" y="48" class="gs" style="font-size:11px">출발 코드에서 12장 계약 41개 중 30개 실패 → 완성 코드 825개 모두 통과</text>
