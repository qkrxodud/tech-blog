  <rect width="760" height="470" fill="#ffffff"/>
  <text x="24" y="30" class="h">알리는 결제 결과 여섯 가지와 주문 상태</text>
  <text x="24" y="52" class="gs"><tspan class="m">Payment.announcesFrom(before)</tspan> — 상태가 바뀌었고(<tspan class="m">status != before</tspan>) 바뀐 상태가 결과일 때만</text>
  <text x="40" y="86" class="bt" style="font-size:12.5px">결제 서버 — 결과 상태</text>
  <text x="500" y="86" class="okt" style="font-size:12.5px">주문 서비스 — 주문 상태</text>
  <rect x="40" y="100" width="280" height="36" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="54" y="123" class="bt" style="font-size:12px">승인</text>
  <text x="150" y="123" class="bs" style="font-size:11px"><tspan class="m">APPROVED</tspan></text>
  <line x1="322" y1="118" x2="494" y2="139" stroke="#16a34a" stroke-width="1.3" marker-end="url(#agr)"/>
  <rect x="40" y="142" width="280" height="36" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="54" y="165" class="bt" style="font-size:12px">매입</text>
  <text x="150" y="165" class="bs" style="font-size:11px"><tspan class="m">CAPTURED</tspan></text>
  <line x1="322" y1="160" x2="494" y2="139" stroke="#16a34a" stroke-width="1.3" marker-end="url(#agr)"/>
  <rect x="498" y="114" width="238" height="50" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="514" y="145" class="okt" style="font-size:12.5px">결제 완료</text>
  <text x="600" y="145" class="oks" style="font-size:11px"><tspan class="m">PAID</tspan></text>
  <rect x="40" y="196" width="280" height="36" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="54" y="219" class="bt" style="font-size:12px">승인 실패</text>
  <text x="150" y="219" class="bs" style="font-size:11px"><tspan class="m">APPROVAL_FAILED</tspan></text>
  <line x1="322" y1="214" x2="494" y2="235" stroke="#16a34a" stroke-width="1.3" marker-end="url(#agr)"/>
  <rect x="40" y="238" width="280" height="36" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="54" y="261" class="bt" style="font-size:12px">만료</text>
  <text x="150" y="261" class="bs" style="font-size:11px"><tspan class="m">EXPIRED</tspan></text>
  <line x1="322" y1="256" x2="494" y2="235" stroke="#16a34a" stroke-width="1.3" marker-end="url(#agr)"/>
  <rect x="498" y="210" width="238" height="50" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="514" y="241" class="badt" style="font-size:12.5px">결제 실패</text>
  <text x="600" y="241" class="bads" style="font-size:11px"><tspan class="m">PAYMENT_FAILED</tspan></text>
  <rect x="40" y="292" width="280" height="36" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="54" y="315" class="bt" style="font-size:12px">승인 취소</text>
  <text x="150" y="315" class="bs" style="font-size:11px"><tspan class="m">APPROVAL_CANCELED</tspan></text>
  <line x1="322" y1="310" x2="494" y2="331" stroke="#16a34a" stroke-width="1.3" marker-end="url(#agr)"/>
  <rect x="40" y="334" width="280" height="36" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="54" y="357" class="bt" style="font-size:12px">매입 취소</text>
  <text x="150" y="357" class="bs" style="font-size:11px"><tspan class="m">CAPTURE_CANCELED</tspan></text>
  <line x1="322" y1="352" x2="494" y2="331" stroke="#16a34a" stroke-width="1.3" marker-end="url(#agr)"/>
  <rect x="498" y="306" width="238" height="50" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="514" y="337" class="gt" style="font-size:12.5px">취소</text>
  <text x="600" y="337" class="gs" style="font-size:11px"><tspan class="m">CANCELED</tspan></text>
  <rect x="24" y="390" width="430" height="66" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="38" y="412" class="gt" style="font-size:12.5px">알리지 않음</text>
  <text x="38" y="432" class="gs" style="font-size:11px">준비 · 인증 · 결과 모름 — 결과가 아님</text>
  <text x="38" y="449" class="gs" style="font-size:10.5px">이미 지난 상태를 다시 봄(웹훅·보정) · 부분 취소처럼 상태 그대로</text>
  <rect x="466" y="390" width="270" height="66" rx="12" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <text x="480" y="412" class="t2" style="font-size:12px"><tspan class="m">Order.follow</tspan></text>
  <text x="480" y="432" class="s" style="font-size:11px">옛 결과인지 보지 않음 →</text>
  <text x="480" y="449" class="s" style="font-size:11px">만든 순서대로 보내야 맞음</text>
