<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>persist한 post의 INSERT는 쓰기 지연 SQL 저장소에 보관되었다가, JPQL을 실행하기 전에 자동 플러시로 먼저 DB에 전송되고, 이어서 실행된 SELECT 결과에 방금 persist한 post가 포함되는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="310" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h" text-anchor="start">JPQL 실행 전 자동 플러시 — FlushMode.AUTO</text>
  <text x="730" y="42" class="code" text-anchor="end">SELECT p FROM Post p</text>
  <text x="220" y="68" class="step" text-anchor="middle">persist</text>
  <text x="360" y="68" class="step" text-anchor="middle">JPQL 실행 요청</text>
  <text x="500" y="68" class="step" text-anchor="middle">자동 플러시</text>
  <text x="640" y="68" class="step" text-anchor="middle">SELECT 실행</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="117" class="lane" text-anchor="start">애플리케이션</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <text x="30" y="168" class="lane" text-anchor="start">쓰기 지연</text>
  <text x="30" y="186" class="sub" text-anchor="start">SQL 저장소</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <text x="30" y="237" class="lane" text-anchor="start">DB</text>
  <rect x="150" y="206" width="585" height="52" rx="6" class="track"/>
  <rect x="155.0" y="88" width="130" height="48" rx="8" class="box"/>
  <text x="220.0" y="108.0" class="op" text-anchor="middle">persist(post)</text>
  <text x="220.0" y="127.0" class="val" text-anchor="middle">id = 1L</text>
  <rect x="155.0" y="148" width="130" height="48" rx="8" class="hold"/>
  <text x="220.0" y="168.0" class="t" text-anchor="middle">INSERT 보관</text>
  <text x="220.0" y="187.0" class="val" text-anchor="middle">아직 전송 전</text>
  <rect x="295.0" y="88" width="130" height="48" rx="8" class="box"/>
  <text x="360.0" y="108.0" class="op" text-anchor="middle">createQuery</text>
  <text x="360.0" y="127.0" class="val" text-anchor="middle">getResultList()</text>
  <rect x="435.0" y="148" width="130" height="48" rx="8" class="ok"/>
  <text x="500.0" y="168.0" class="okt" text-anchor="middle">자동 플러시</text>
  <text x="500.0" y="187.0" class="val" text-anchor="middle">INSERT 전송</text>
  <rect x="435.0" y="208" width="130" height="48" rx="8" class="box"/>
  <text x="500.0" y="228.0" class="op" text-anchor="middle">INSERT</text>
  <text x="500.0" y="247.0" class="val" text-anchor="middle">post 1건</text>
  <rect x="575.0" y="208" width="130" height="48" rx="8" class="box"/>
  <text x="640.0" y="228.0" class="op" text-anchor="middle">SELECT</text>
  <text x="640.0" y="247.0" class="val" text-anchor="middle">post 조회</text>
  <rect x="575.0" y="88" width="130" height="48" rx="8" class="ok"/>
  <text x="640.0" y="108.0" class="okt" text-anchor="middle">결과에 포함</text>
  <text x="640.0" y="127.0" class="val" text-anchor="middle">persist한 post</text>
  <line x1="220" y1="136" x2="220" y2="146" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="390" y1="136" x2="470" y2="146" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="500" y1="196" x2="500" y2="206" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="640" y1="206" x2="640" y2="138" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="150" y="284" class="sub" text-anchor="start">JPQL을 실행하기 전에 쓰기 지연 SQL 저장소의 INSERT가 먼저 전송됩니다.</text>
  <text x="150" y="302" class="sub" text-anchor="start">그래서 조회 결과에 방금 persist한 post가 포함되어 데이터 일관성이 지켜집니다.</text>
</svg>
