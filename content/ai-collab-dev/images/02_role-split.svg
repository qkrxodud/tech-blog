<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>사람이 요구사항을 정해 백로그를 채우면 AI가 항목을 구현하고 빌드, curl, 화면 검증을 거치며, 사람이 결과를 검토해 다시 백로그를 채우는 역할 분담</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="300" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">사람과 AI의 역할 분담 — 한 루프의 흐름</text>
  <text x="220" y="68" class="step" text-anchor="middle">백로그</text>
  <text x="360" y="68" class="step" text-anchor="middle">구현</text>
  <text x="500" y="68" class="step" text-anchor="middle">검증</text>
  <text x="640" y="68" class="step" text-anchor="middle">검토</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <path d="M640,114 L640,98 L220,98 L220,110" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <rect x="360" y="88" width="140" height="18" fill="#fafafa"/>
  <text x="430" y="101" class="sub" text-anchor="middle">다시 백로그를 채움</text>
  <text x="30" y="136" class="lane">사람</text>
  <text x="30" y="154" class="sub">결정과 판단</text>
  <rect x="150" y="112" width="585" height="56" rx="6" class="track"/>
  <rect x="162" y="116" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="136" class="db" text-anchor="middle">백로그 채우기</text>
  <text x="220" y="155" class="val" text-anchor="middle">요구사항 결정</text>
  <rect x="582" y="116" width="116" height="48" rx="8" class="box"/>
  <text x="640" y="136" class="db" text-anchor="middle">결과 검토</text>
  <text x="640" y="155" class="val" text-anchor="middle">맞는 방향인가</text>
  <text x="30" y="206" class="lane">AI</text>
  <text x="30" y="224" class="sub">구현과 반복 작업</text>
  <rect x="150" y="182" width="585" height="56" rx="6" class="track"/>
  <rect x="302" y="186" width="116" height="48" rx="8" class="box"/>
  <text x="360" y="206" class="db" text-anchor="middle">항목 구현</text>
  <text x="360" y="225" class="val" text-anchor="middle">반복 작업</text>
  <rect x="442" y="186" width="116" height="48" rx="8" class="box"/>
  <text x="500" y="206" class="db" text-anchor="middle">검증</text>
  <text x="500" y="225" class="val" text-anchor="middle">빌드·<tspan font-family="Menlo, Consolas, monospace">curl</tspan>·화면</text>
  <line x1="420" y1="210" x2="438" y2="210" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="250" y1="164" x2="310" y2="185" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="530" y1="185" x2="600" y2="165" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="270" class="sub">사람이 맡은 것: 요구사항 결정 · 트레이드오프 판단 · 최종 검토</text>
  <text x="30" y="292" class="sub">AI가 맡은 것: 결정된 항목의 구현과 반복 작업</text>
</svg>
