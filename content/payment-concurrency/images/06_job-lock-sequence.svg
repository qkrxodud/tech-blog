<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>서버 세 대의 주기 작업 — 서버 1이 job_lock 줄에 맡은 시간이 지났을 때만 바꾸는 UPDATE를 보내 1줄이 바뀌어 15분 동안 맡고, 같은 때 보낸 서버 2·3의 UPDATE는 0줄이라 이번 주기를 넘긴다. 서버 1만 PaymentReconciler와 PaymentCancelReconciler로 결제마다 Mock PG에 조회해 결제를 맞추고, finally에서 locked_until을 지금으로 당겨 다음 주기에 아무 서버나 맡게 한다. 맡은 서버가 죽으면 15분이 지날 때까지 아무도 맡지 못한다</title>
