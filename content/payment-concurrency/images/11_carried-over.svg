  <text x="86" y="228" class="s" style="fill:#1f2937">인증 상태 결제에 같은 결제 키로 다시 온 승인이 409</text>
  <line x1="538" y1="223" x2="558" y2="223" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#agy)"/>
