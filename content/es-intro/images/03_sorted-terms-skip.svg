<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>사전순으로 정렬된 term은 중간의 나무를 보고 뒤쪽을 건너뛰어 고양이를 찾고, 정렬되지 않은 term은 모든 term을 확인해야 한다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #1f2937; }
    .cell { font-size: 15px; font-weight: 700; fill: #1f2937; }
    .codek { font-size: 13px; fill: #6b7280; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="446" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="214" rx="12" fill="#fafafa" stroke="#16a34a"/>
  <text x="30" y="42" class="h">정렬된 term — 중간을 보고 한쪽을 건너뜀</text>
  <text x="730" y="42" class="codek" text-anchor="end">찾는 단어: 고양이</text>
  <text x="30" y="112" class="lane">term</text>
  <text x="30" y="130" class="sub">사전순</text>
  <rect x="160" y="96" width="100" height="42" rx="8" class="box"/>
  <text x="210" y="123" class="cell" text-anchor="middle">가</text>
  <rect x="272" y="96" width="100" height="42" rx="8" class="box"/>
  <text x="322" y="123" class="cell" text-anchor="middle">강아지</text>
  <rect x="384" y="96" width="100" height="42" rx="8" class="ok"/>
  <text x="434" y="123" class="okt" text-anchor="middle">고양이</text>
  <rect x="496" y="96" width="100" height="42" rx="8" class="hold"/>
  <text x="546" y="123" class="cell" text-anchor="middle">나무</text>
  <rect x="608" y="96" width="100" height="42" rx="8" class="wait"/>
  <text x="658" y="123" class="waitt" text-anchor="middle">… 뒤쪽 단어</text>
  <text x="546" y="86" class="step" text-anchor="middle">① 중간을 먼저 확인</text>
  <text x="658" y="160" class="note" text-anchor="middle">② 뒤쪽은 보지 않음</text>
  <text x="434" y="160" class="gnote" text-anchor="middle">③ 앞쪽에서 찾음</text>
  <text x="160" y="202" class="sub">고양이는 나무보다 앞에 오므로, 나무 뒤쪽은 확인하지 않고 앞쪽만 찾음</text>
  <rect x="10" y="240" width="740" height="196" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="272" class="h">정렬되지 않은 term — 전부 확인</text>
  <text x="730" y="272" class="codek" text-anchor="end">찾는 단어: 고양이</text>
  <text x="30" y="334" class="lane">term</text>
  <text x="30" y="352" class="sub">순서 없음</text>
  <rect x="160" y="318" width="100" height="42" rx="8" class="box"/>
  <text x="210" y="345" class="cell" text-anchor="middle">나무</text>
  <text x="210" y="380" class="note" text-anchor="middle">확인</text>
  <rect x="272" y="318" width="100" height="42" rx="8" class="box"/>
  <text x="322" y="345" class="cell" text-anchor="middle">가</text>
  <text x="322" y="380" class="note" text-anchor="middle">확인</text>
  <rect x="384" y="318" width="100" height="42" rx="8" class="wait"/>
  <text x="434" y="345" class="waitt" text-anchor="middle">… 다른 단어</text>
  <text x="434" y="380" class="note" text-anchor="middle">확인</text>
  <rect x="496" y="318" width="100" height="42" rx="8" class="box"/>
  <text x="546" y="345" class="cell" text-anchor="middle">고양이</text>
  <text x="546" y="380" class="note" text-anchor="middle">확인</text>
  <rect x="608" y="318" width="100" height="42" rx="8" class="box"/>
  <text x="658" y="345" class="cell" text-anchor="middle">강아지</text>
  <text x="658" y="380" class="note" text-anchor="middle">확인</text>
  <rect x="160" y="394" width="440" height="30" rx="15" class="bad"/>
  <text x="380" y="414" class="badt" text-anchor="middle">어디서 멈출지 판단할 수 없어 모든 term을 확인</text>
</svg>
