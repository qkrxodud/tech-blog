  <text x="182" y="474" class="lbl" text-anchor="middle" style="fill: #15803d"><tspan class="m">200 Payment {status, cancels}</tspan></text>
  <line x1="73" y1="482" x2="431" y2="482" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#agr)"/>
