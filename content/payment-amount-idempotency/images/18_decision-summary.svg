  <line x1="336" y1="367" x2="356" y2="367" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="360" y="328" width="214" height="58" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="372" y="352" class="bt" style="font-size:11.5px"><tspan class="m">paymentKey</tspan> 저장</text>
  <text x="372" y="370" class="bt" style="font-size:11.5px">같은 키면 기록된 결과</text>
  <line x1="576" y1="357" x2="586" y2="357" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="588" y="328" width="148" height="58" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="598" y="352" class="oks" style="font-size:10.5px">같은 키는 기록된 결과로</text>
  <text x="598" y="370" class="oks" style="font-size:10.5px"><tspan class="m">200</tspan> · 다른 키는 <tspan class="m">409</tspan></text>
  <rect x="24" y="398" width="76" height="70" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="62" y="438" class="t2" text-anchor="middle" style="font-size:12.5px">결정 5</text>
  <text x="110" y="414" class="t2" style="font-size:12px">같은 주문번호로 다시 준비</text>
  <rect x="110" y="422" width="224" height="42" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="122" y="448" class="bads" style="font-size:11px"><tspan class="m">500</tspan></text>
  <line x1="336" y1="443" x2="356" y2="443" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="360" y="404" width="214" height="58" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="372" y="428" class="bt" style="font-size:11.5px">같은 금액은 있는 결제</text>
  <text x="372" y="446" class="bt" style="font-size:11.5px">다른 금액은 거부</text>
  <line x1="576" y1="433" x2="586" y2="433" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="588" y="404" width="148" height="58" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
