    <g id="xs"><circle r="7" fill="#ef4444"/><path d="M-3,-3 L3,3 M3,-3 L-3,3" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></g>
    <g id="vs"><circle r="7" fill="#22c55e"/><path d="M-3.5,0 L-1,2.8 L3.5,-2.8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="i-card"><rect x="0" y="3" width="32" height="22" rx="4" fill="#5eead4" class="o"/><rect x="0" y="8" width="32" height="5" fill="#1f2937"/><rect x="4" y="16" width="8" height="6" rx="1.5" fill="#fbbf24" class="o" stroke-width="1"/></g>
    <g id="i-app"><rect x="0" y="0" width="30" height="30" rx="5" fill="#93c5fd" class="o"/><path d="M0,9 h30" class="o" fill="none"/><circle cx="5" cy="4.5" r="1.4" fill="#1f2937"/><circle cx="10" cy="4.5" r="1.4" fill="#1f2937"/><path d="M7,16 h16 M7,22 h11" stroke="#1e3a8a" stroke-width="1.6" stroke-linecap="round"/></g>
    <g id="i-db"><path d="M1,5 v20 a13,5 0 0 0 26,0 v-20 a13,5 0 0 1 -26,0 z" fill="#60a5fa" class="o"/><path d="M1,15 a13,5 0 0 0 26,0" fill="none" class="o"/><ellipse cx="14" cy="5" rx="13" ry="5" fill="#bfdbfe" class="o"/></g>
    <g id="i-server"><rect x="0" y="0" width="36" height="13" rx="3" fill="#cbd5e1" class="o"/><rect x="0" y="16" width="36" height="13" rx="3" fill="#cbd5e1" class="o"/><circle cx="7" cy="6.5" r="2.2" fill="#22c55e"/><circle cx="7" cy="22.5" r="2.2" fill="#22c55e"/><path d="M14,6.5 h16 M14,22.5 h16" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/></g>
    <g id="i-coin"><circle cx="12" cy="12" r="11" fill="#fbbf24" class="o"/><circle cx="12" cy="12" r="7" fill="#fcd34d" stroke="#b45309" stroke-width="1"/><text x="12" y="16.5" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">₩</text></g>
    <g id="i-key"><circle cx="8" cy="12" r="7.5" fill="#fbbf24" class="o"/><circle cx="8" cy="12" r="2.6" fill="#ffffff" class="o" stroke-width="1.2"/><path d="M15.5,12 H30 V17.5 M25,12 V16.5" fill="none" class="o" stroke-width="2"/></g>
    <g id="i-clock"><circle cx="14" cy="14" r="13" fill="#fde68a" class="o"/><path d="M14,7 V14 L20,18" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/></g>
    <g id="i-chips"><rect x="0" y="4" width="13" height="14" rx="4" fill="#e5e7eb" class="o"/><rect x="21" y="4" width="13" height="14" rx="4" fill="#86efac" class="o"/><path d="M14,11 h6" class="o" fill="none"/><path d="M17,8 l3,3 l-3,3" class="o" fill="none"/></g>
    <g id="i-plane"><path d="M1,13 L31,1 L23,29 L15,19 Z" fill="#fdba74" class="o"/><path d="M15,19 L31,1 L11,16 Z" fill="#fb923c" class="o"/></g>
    <g id="i-doc"><path d="M0,0 h18 l8,8 v26 h-26 z" fill="#ffffff" class="o"/><path d="M18,0 v8 h8" fill="#e5e7eb" class="o"/><circle cx="20" cy="26" r="8" fill="#22c55e" class="o"/><path d="M16.5,26 l2.5,2.5 l4.5,-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5,10 h9 M5,16 h7" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/></g>
    <g id="i-table"><rect x="0" y="0" width="30" height="26" rx="3" fill="#ffffff" class="o"/><rect x="0" y="0" width="30" height="7" rx="3" fill="#60a5fa" class="o"/><path d="M0,13.5 h30 M0,20 h30 M11,7 v19" stroke="#1f2937" stroke-width="1.2"/></g>
    <g id="i-search"><circle cx="11" cy="11" r="9" fill="#bae6fd" class="o"/><path d="M18,18 L27,27" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/></g>
    <g id="i-chart"><rect x="0" y="16" width="7" height="12" fill="#93c5fd" class="o"/><rect x="10" y="8" width="7" height="20" fill="#60a5fa" class="o"/><rect x="20" y="2" width="7" height="26" fill="#2563eb" class="o"/></g>
    <g id="i-bell"><path d="M14,3 C8.5,3 6,7.5 6,13 V19 L3,23 H25 L22,19 V13 C22,7.5 19.5,3 14,3 Z" fill="#fde047" class="o"/><circle cx="14" cy="26" r="3" fill="#f59e0b" class="o"/></g>
    <g id="i-warn"><path d="M14,2 L27,25 H1 Z" fill="#fca5a5" class="o"/><path d="M14,10 V17" stroke="#7f1d1d" stroke-width="2.2" stroke-linecap="round"/><circle cx="14" cy="21" r="1.5" fill="#7f1d1d"/></g>
    <g id="i-lock"><path d="M7,12 V8 a7,7 0 0 1 14,0 V12" fill="none" class="o" stroke-width="2.2"/><rect x="3" y="12" width="22" height="16" rx="3" fill="#fbbf24" class="o"/><circle cx="14" cy="20" r="2.4" fill="#1f2937"/></g>
    <g id="i-wait"><path d="M3,1 H23 M3,29 H23" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><path d="M5,2 C5,10 13,12 13,15 C13,18 5,20 5,28 H21 C21,20 13,18 13,15 C13,12 21,10 21,2 Z" fill="#e0e7ff" class="o"/><path d="M8,26 C9,22 13,21 13,19 C13,21 17,22 18,26 Z" fill="#f59e0b"/></g>
    <g id="i-box"><path d="M2,9 L15,3 L28,9 V23 L15,29 L2,23 Z" fill="#fcd34d" class="o"/><path d="M2,9 L15,15 L28,9 M15,15 V29" fill="none" class="o"/><path d="M8.5,6 L21.5,12" stroke="#b45309" stroke-width="1.5"/></g>
    <g id="i-ticket"><path d="M1,6 H29 V12 a3,3 0 0 0 0,6 V24 H1 V18 a3,3 0 0 0 0,-6 Z" fill="#f9a8d4" class="o"/><path d="M10,7 V23" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="2 2"/><text x="19.5" y="19" font-size="9" font-weight="700" fill="#831843" text-anchor="middle">%</text></g>
    <g id="i-point"><circle cx="13" cy="13" r="12" fill="#a7f3d0" class="o"/><circle cx="13" cy="13" r="8" fill="#6ee7b7" stroke="#047857" stroke-width="1"/><text x="13" y="17.5" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">P</text></g>
  <g id="i-kafka"><rect x="0" y="2" width="30" height="8" rx="2" fill="#fde68a" class="o"/><rect x="0" y="12" width="30" height="8" rx="2" fill="#fdba74" class="o"/><rect x="0" y="22" width="30" height="8" rx="2" fill="#fde68a" class="o"/><path d="M8,2 v8 M16,2 v8 M8,12 v8 M16,12 v8 M22,12 v8 M8,22 v8" stroke="#1f2937" stroke-width="1"/></g>
    <g id="i-bolt"><path d="M15,1 L3,17 H12 L9,29 L23,11 H14 Z" fill="#fde047" class="o"/></g>
    <g id="i-outbox"><rect x="0" y="0" width="30" height="26" rx="3" fill="#ffffff" class="o"/><rect x="0" y="0" width="30" height="7" rx="3" fill="#86efac" class="o"/><path d="M0,13.5 h30 M0,20 h30 M11,7 v19" stroke="#1f2937" stroke-width="1.2"/></g>
  </defs>

  <rect width="760" height="540" fill="#ffffff"/>
  <text x="24" y="28" class="h">남은 한계 ① — 결정의 비용과 가정으로 남긴 것</text>
  <text x="24" y="48" class="gs" style="font-size:11px">측정 값은 첫 실행 · 두 번째 실행(방식마다 3번씩)</text>
  <rect x="14" y="62" width="362" height="104" rx="10" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <use href="#i-wait" transform="translate(26,74) scale(0.7)"/>
  <text x="58" y="90" class="t2" style="font-size:12.5px">같은 파티션을 막는 시간</text>
  <text x="28" y="114" class="s2" style="font-size:10.5px;fill:#1f2937">일시 오류 메시지 하나가 다시 시도를 다 쓸 때까지</text><text x="28" y="130" class="s2" style="font-size:10.5px;fill:#1f2937">같은 파티션의 뒤 메시지가 기다림 — 결정 3의 비용</text><text x="28" y="146" class="s2" style="font-size:10.5px;fill:#1f2937">15813~15933ms · 15736~15759ms</text>
  <rect x="386" y="62" width="362" height="104" rx="10" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <use href="#i-clock" transform="translate(398,74) scale(0.7)"/>
  <text x="430" y="90" class="t2" style="font-size:12.5px">다시 시도 15초의 근거</text>
  <text x="400" y="114" class="s2" style="font-size:10.5px;fill:#1f2937">이 머신에서 잰 MySQL 컨테이너 재시작 2.62~3.04초</text><text x="400" y="130" class="s2" style="font-size:10.5px;fill:#1f2937">15초는 약 5배 — 5배 여유는 가정</text><text x="400" y="146" class="s2" style="font-size:10.5px;fill:#1f2937">운영 DB 전환 시간의 기준은 없음</text>
  <rect x="14" y="176" width="362" height="104" rx="10" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <use href="#i-box" transform="translate(26,188) scale(0.7)"/>
  <text x="58" y="204" class="t2" style="font-size:12.5px">긴 장애와 다시 넣기</text>
  <text x="28" y="228" class="s2" style="font-size:10.5px;fill:#1f2937">측정의 30초 장애에서 파티션마다 맨 앞 메시지가</text><text x="28" y="244" class="s2" style="font-size:10.5px;fill:#1f2937">실패 모음으로 감(2건) — 운영자가 다시 넣기 명령을</text><text x="28" y="260" class="s2" style="font-size:10.5px;fill:#1f2937">돌려야 반영, 다시 넣기는 자동으로 돌지 않음</text>
  <rect x="386" y="176" width="362" height="104" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#i-warn" transform="translate(398,188) scale(0.7)"/>
  <text x="430" y="204" class="t2" style="font-size:12.5px">문서로 확인하지 않은 가정 둘</text>
  <text x="400" y="228" class="s2" style="font-size:10.5px;fill:#1f2937"><tspan class="m">payment_outbox</tspan> 번호가 같은 결제 안에서 커밋 순서대로</text><text x="400" y="244" class="s2" style="font-size:10.5px;fill:#1f2937">커진다(결제 줄 잠금 구조에서 끌어냄)</text><text x="400" y="260" class="s2" style="font-size:10.5px;fill:#1f2937"><tspan class="m">insert ignore</tspan>가 남기는 중인 트랜잭션을 기다린다</text>
  <rect x="14" y="290" width="362" height="104" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <use href="#i-chart" transform="translate(26,302) scale(0.7)"/>
  <text x="58" y="318" class="t2" style="font-size:12.5px">재고 서비스의 결정 1·2</text>
  <text x="28" y="342" class="s2" style="font-size:10.5px;fill:#1f2937">이 장의 계약 12개에서 넣기 전후의 차이가 없었음</text><text x="28" y="358" class="s2" style="font-size:10.5px;fill:#1f2937">재고 운영 계약 실패는 결정 3·4 커밋에서 줄었음</text><text x="28" y="374" class="s2" style="font-size:10.5px;fill:#1f2937">7개 → 5개 → 0개</text>
  <rect x="386" y="290" width="362" height="104" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <use href="#i-table" transform="translate(398,302) scale(0.7)"/>
  <text x="430" y="318" class="t2" style="font-size:12.5px">쌓이기만 하는 표</text>
  <text x="400" y="342" class="s2" style="font-size:10.5px;fill:#1f2937">받은 기록, 처리한 명령 기록, 보낸 <tspan class="m">payment_outbox</tspan> 줄을</text><text x="400" y="358" class="s2" style="font-size:10.5px;fill:#1f2937">지우지 않음</text><text x="400" y="374" class="s2" style="font-size:10.5px;fill:#1f2937">예약 만료(TTL)도 없음</text>
  <rect x="14" y="404" width="362" height="120" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <use href="#i-db" transform="translate(26,416) scale(0.7)"/>
  <text x="58" y="432" class="t2" style="font-size:12.5px">이미 만든 DB를 옮기는 스크립트 없음</text>
  <text x="28" y="452" class="s2" style="font-size:10.5px;fill:#1f2937">옮길 때 칸을 더함 — <tspan class="m">orders.last_event_id</tspan>,</text>
  <text x="28" y="467" class="s2" style="font-size:10.5px;fill:#1f2937"><tspan class="m">stock_reservation.last_command_id</tspan></text>
  <text x="28" y="482" class="s2" style="font-size:10.5px;fill:#1f2937"><tspan class="m">received_payment_event</tspan>의 같은 번호 줄을 지운 뒤</text>
  <text x="28" y="497" class="s2" style="font-size:10.5px;fill:#1f2937">고유 키를 더해야 함 — <tspan class="m">create table if not exists</tspan>는</text>
  <text x="28" y="512" class="s2" style="font-size:10.5px;fill:#1f2937">새 칸·키를 더하지 않음</text>
</svg>
