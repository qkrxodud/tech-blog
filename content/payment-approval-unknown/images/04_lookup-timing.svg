  <text x="528" y="213" class="okt m" text-anchor="middle" style="font-size: 12px">DONE</text>
  <line x1="402" y1="150" x2="412" y2="194" stroke="#c2410c" stroke-width="1.5" marker-end="url(#aor)"/>
  <line x1="426" y1="194" x2="458" y2="148" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="470" y="174" class="lbl" style="fill: #c2410c; font-size: 12px">곧바로 <tspan class="m">GET</tspan> 조회</text>
  <text x="470" y="190" class="bads m" style="font-size: 12px">404 NOT_FOUND_PAYMENT</text>
  <rect x="456" y="120" width="150" height="32" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="531" y="141" class="badt m" text-anchor="middle" style="font-size: 12px">APPROVAL_FAILED</text>
  <rect x="30" y="238" width="700" height="26" rx="6" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.2"/>
  <use href="#xmark" x="48" y="251"/>
  <text x="64" y="255" class="badt" style="font-size: 12.5px">결제 <tspan class="m">APPROVAL_FAILED</tspan> · PG <tspan class="m">DONE</tspan> — 어긋남. 조회 0.5초 뒤 PG에 승인이 남음</text>
  <rect x="14" y="312" width="732" height="190" rx="16" fill="#f3f6fb" stroke="#16a34a" stroke-width="2"/>
