<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>기능 이름을 넣은 URI 다섯 개와 회원 리소스만 식별한 URI를 나란히 비교하고, URI는 리소스를 맡고 조회·등록·수정·삭제 행위는 HTTP 메서드가 맡는다는 것을 보여 주는 그림</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="470" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="450" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">회원 API의 URI 설계 — 기능 이름 vs 리소스 식별</text>
  <text x="30" y="76" class="sub">기능</text>
  <text x="315" y="76" class="sub" text-anchor="middle">기능 이름으로 만든 URI</text>
  <text x="605" y="76" class="sub" text-anchor="middle">회원 리소스를 식별한 URI</text>
  <text x="30" y="111" class="db">회원 목록 조회</text>
  <rect x="190" y="88" width="250" height="36" rx="8" class="bad"/>
  <text x="315" y="111" class="badc" text-anchor="middle">/read-member-list</text>
  <line x1="446" y1="106" x2="474" y2="106" class="axis" marker-end="url(#ar)"/>
  <rect x="480" y="88" width="250" height="36" rx="8" class="ok"/>
  <text x="605" y="111" class="okc" text-anchor="middle">/members</text>
  <text x="30" y="157" class="db">회원 조회</text>
  <rect x="190" y="134" width="250" height="36" rx="8" class="bad"/>
  <text x="315" y="157" class="badc" text-anchor="middle">/read-member-by-id</text>
  <line x1="446" y1="152" x2="474" y2="152" class="axis" marker-end="url(#ar)"/>
  <rect x="480" y="134" width="250" height="36" rx="8" class="ok"/>
  <text x="605" y="157" class="okc" text-anchor="middle">/members/{id}</text>
  <text x="30" y="203" class="db">회원 등록</text>
  <rect x="190" y="180" width="250" height="36" rx="8" class="bad"/>
  <text x="315" y="203" class="badc" text-anchor="middle">/create-member</text>
  <line x1="446" y1="198" x2="474" y2="198" class="axis" marker-end="url(#ar)"/>
  <rect x="480" y="180" width="250" height="36" rx="8" class="ok"/>
  <text x="605" y="203" class="okc" text-anchor="middle">/members/{id}</text>
  <text x="30" y="249" class="db">회원 수정</text>
  <rect x="190" y="226" width="250" height="36" rx="8" class="bad"/>
  <text x="315" y="249" class="badc" text-anchor="middle">/update-member</text>
  <line x1="446" y1="244" x2="474" y2="244" class="axis" marker-end="url(#ar)"/>
  <rect x="480" y="226" width="250" height="36" rx="8" class="ok"/>
  <text x="605" y="249" class="okc" text-anchor="middle">/members/{id}</text>
  <text x="30" y="295" class="db">회원 삭제</text>
  <rect x="190" y="272" width="250" height="36" rx="8" class="bad"/>
  <text x="315" y="295" class="badc" text-anchor="middle">/delete-member</text>
  <line x1="446" y1="290" x2="474" y2="290" class="axis" marker-end="url(#ar)"/>
  <rect x="480" y="272" width="250" height="36" rx="8" class="ok"/>
  <text x="605" y="295" class="okc" text-anchor="middle">/members/{id}</text>
  <rect x="30" y="336" width="340" height="72" rx="10" class="hold"/>
  <text x="200" y="364" class="db" text-anchor="middle">URI — 리소스(명사)</text>
  <text x="200" y="390" class="val" text-anchor="middle">회원 → <tspan font-family="Menlo, Consolas, monospace">/members</tspan>, <tspan font-family="Menlo, Consolas, monospace">/members/{id}</tspan></text>
  <rect x="390" y="336" width="340" height="72" rx="10" class="hold"/>
  <text x="560" y="364" class="db" text-anchor="middle">HTTP 메서드 — 행위(동사)</text>
  <text x="560" y="390" class="val" text-anchor="middle">조회 · 등록 · 수정 · 삭제</text>
  <text x="30" y="440" class="sub">조회·등록·수정·삭제가 모두 같은 /members/{id}가 되므로, 행위는 URI가 아니라 메서드로 구분합니다.</text>
</svg>
