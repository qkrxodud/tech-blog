  <text x="28" y="494" class="gs" style="font-size:11px">설정: <tspan class="m">order.retry.initial-interval=1s</tspan> · <tspan class="m">multiplier=2</tspan> · <tspan class="m">max-interval=8s</tspan> · <tspan class="m">max-retries=4</tspan></text>
