<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>OrderApp이 AppConfig에서 memberService와 orderService를 받은 뒤 join으로 회원을 가입시키고 createOrder로 주문을 생성하는 순서</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .lanec { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .gmsg { font-size: 12px; fill: #15803d; }
    .rmsg { font-size: 12px; fill: #b91c1c; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 12px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .rm { font-size: 12px; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="760" height="370" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="350" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">OrderApp 실행 순서 — AppConfig에서 서비스를 받아 주문 생성</text>
  <text x="220" y="68" class="step" text-anchor="middle">1단계</text>
  <text x="360" y="68" class="step" text-anchor="middle">2단계</text>
  <text x="500" y="68" class="step" text-anchor="middle">3단계</text>
  <text x="640" y="68" class="step" text-anchor="middle">4단계</text>
  <line x1="160" y1="76" x2="722" y2="76" stroke="#c4c8ce" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lanec">OrderApp</text>
  <text x="30" y="126" class="ms">main()</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <text x="30" y="168" class="lanec">AppConfig</text>
  <text x="30" y="186" class="sub">구성 담당</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <text x="30" y="228" class="lanec">MemberService</text>
  <text x="30" y="246" class="sub">회원 서비스</text>
  <rect x="150" y="206" width="585" height="52" rx="6" class="track"/>
  <text x="30" y="288" class="lanec">OrderService</text>
  <text x="30" y="306" class="sub">주문 서비스</text>
  <rect x="150" y="266" width="585" height="52" rx="6" class="track"/>
  <rect x="158" y="94" width="550" height="36" rx="6" class="hold"/>
  <text x="433" y="117" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">new AppConfig()</tspan> 후 받은 서비스로 회원 가입과 주문 생성</text>
  <rect x="152" y="148" width="136" height="48" rx="8" class="box"/>
  <text x="220" y="168.0" class="opm" text-anchor="middle">memberService()</text>
  <text x="220" y="186.0" class="ms" text-anchor="middle">MemberServiceImpl</text>
  <rect x="292" y="148" width="136" height="48" rx="8" class="box"/>
  <text x="360" y="168.0" class="opm" text-anchor="middle">orderService()</text>
  <text x="360" y="186.0" class="ms" text-anchor="middle">OrderServiceImpl</text>
  <rect x="432" y="208" width="136" height="48" rx="8" class="box"/>
  <text x="500" y="228.0" class="opm" text-anchor="middle">join()</text>
  <text x="500" y="246.0" class="val" text-anchor="middle">memberA, VIP</text>
  <rect x="572" y="268" width="136" height="48" rx="8" class="box"/>
  <text x="640" y="288.0" class="opm" text-anchor="middle">createOrder()</text>
  <text x="640" y="306.0" class="val" text-anchor="middle">itemA, 100000</text>
  <line x1="220" y1="130" x2="220" y2="146" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="360" y1="130" x2="360" y2="146" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="500" y1="130" x2="500" y2="206" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="640" y1="130" x2="640" y2="266" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="346" class="foot">OrderApp은 AppConfig가 만든 서비스를 받아 회원을 가입시키고, 같은 회원 ID로 주문을 생성합니다.</text>
</svg>
