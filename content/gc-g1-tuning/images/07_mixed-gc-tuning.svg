<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>mixed GC가 MaxGCPauseMillis를 자주 넘으면 로그로 young과 old 중 어디에 시간을 썼는지 보고, young이면 young GC 튜닝을, old이면 G1MixedGCCountTarget 증가, G1MixedGCLiveThresholdPercent 감소, G1HeapWastePercent 증가 세 가지 방법을 쓴다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .gc { fill: #d1d5db; stroke: #6b7280; stroke-width: 1.2; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .br { stroke: #9ca3af; stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="400" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">mixed GC 실행 시간에 따른 튜닝 — Space-Reclamation Phase</text>
  <rect x="160" y="60" width="440" height="44" rx="8" class="bad"/>
  <text x="380" y="87" class="badt" text-anchor="middle">mixed GC가 <tspan font-family="Menlo, Consolas, monospace">MaxGCPauseMillis</tspan>를 자주 초과</text>
  <path d="M 280 104 L 280 124 L 160 124 L 160 142" class="al" marker-end="url(#ar)"/>
  <path d="M 480 104 L 480 124 L 520 124 L 520 142" class="al" marker-end="url(#ar)"/>
  <rect x="40" y="144" width="240" height="52" rx="8" class="box"/>
  <text x="160" y="166" class="op" text-anchor="middle">young 수집에 시간을 많이 씀</text>
  <text x="160" y="185" class="val" text-anchor="middle">predicted eden + base time</text>
  <rect x="320" y="144" width="400" height="52" rx="8" class="box"/>
  <text x="520" y="166" class="op" text-anchor="middle">old regions 수집에 시간을 많이 씀</text>
  <text x="520" y="185" class="val" text-anchor="middle">predicted initial time</text>
  <line x1="160" y1="196" x2="160" y2="216" class="gl" marker-end="url(#agr)"/>
  <rect x="40" y="218" width="240" height="52" rx="8" class="ok"/>
  <text x="160" y="240" class="okt" text-anchor="middle">young GC 튜닝 방식</text>
  <text x="160" y="259" class="val" text-anchor="middle">G1NewSizePercent 등</text>
  <line x1="520" y1="196" x2="520" y2="216" class="gl" marker-end="url(#agr)"/>
  <rect x="320" y="218" width="400" height="52" rx="8" class="ok"/>
  <text x="520" y="240" class="okt" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">G1MixedGCCountTarget(8)</tspan> ↑</text>
  <text x="520" y="259" class="val" text-anchor="middle">더 많은 mixed GC에 candidate regions를 퍼뜨림</text>
  <rect x="320" y="280" width="400" height="52" rx="8" class="ok"/>
  <text x="520" y="302" class="okt" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">G1MixedGCLiveThresholdPercent(85)</tspan> ↓</text>
  <text x="520" y="321" class="val" text-anchor="middle">candidate regions를 더 엄격하게 구성</text>
  <rect x="320" y="342" width="400" height="52" rx="8" class="ok"/>
  <text x="520" y="364" class="okt" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">G1HeapWastePercent</tspan> ↑</text>
  <text x="520" y="383" class="val" text-anchor="middle">candidate 수를 줄여 Space-Reclamation을 일찍 끝냄</text>
  <text x="40" y="364" class="sub">old 쪽은 세 가지 중</text>
  <text x="40" y="382" class="sub">하나를 골라 적용</text>
</svg>
