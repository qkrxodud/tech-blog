<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>주문 2건 기준으로 V1 엔티티 직접 노출과 V2 DTO 변환은 SQL이 1 + N + N인 5번, V3 페치 조인과 V4 DTO 직접 조회는 1번이며, V3는 엔티티를 조회해 재사용성이 좋고 V4는 원하는 컬럼만 SELECT하지만 API 스펙에 맞춘 코드가 리포지토리에 들어가는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .m { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .vm { font-size: 12px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .jm { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="392" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="372" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">V1~V4 비교 — 주문 2건 기준</text>
  <text x="730" y="42" class="code" text-anchor="end">simple-orders</text>
  <text x="225" y="68" class="step" text-anchor="middle">SQL 수</text>
  <text x="400" y="68" class="step" text-anchor="middle">조회 방식</text>
  <text x="620" y="68" class="step" text-anchor="middle">특징</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">V1</text>
  <text x="30" y="126" class="sub">엔티티 직접 노출</text>
  <rect x="150" y="86" width="585" height="64" rx="6" class="track"/>
  <rect x="165" y="94" width="120" height="48" rx="8" class="bad"/>
  <text x="225" y="114" class="badt" text-anchor="middle">5번</text>
  <text x="225" y="133" class="vm" text-anchor="middle">1 + N + N</text>
  <rect x="300" y="94" width="200" height="48" rx="8" class="box"/>
  <text x="400" y="114" class="t" text-anchor="middle">Order 엔티티 반환</text>
  <text x="400" y="133" class="val" text-anchor="middle">지연 로딩 강제 초기화</text>
  <rect x="515" y="94" width="210" height="48" rx="8" class="bad"/>
  <text x="620" y="114" class="badt" text-anchor="middle">엔티티가 API에 노출</text>
  <text x="620" y="133" class="val" text-anchor="middle">프록시·무한 루프 처리 필요</text>
  <text x="30" y="180" class="lane">V2</text>
  <text x="30" y="198" class="sub">엔티티 → DTO</text>
  <rect x="150" y="158" width="585" height="64" rx="6" class="track"/>
  <rect x="165" y="166" width="120" height="48" rx="8" class="bad"/>
  <text x="225" y="186" class="badt" text-anchor="middle">5번</text>
  <text x="225" y="205" class="vm" text-anchor="middle">1 + N + N</text>
  <rect x="300" y="166" width="200" height="48" rx="8" class="box"/>
  <text x="400" y="186" class="t" text-anchor="middle">Order 조회 후 변환</text>
  <text x="400" y="205" class="val" text-anchor="middle">SimpleOrderDto</text>
  <rect x="515" y="166" width="210" height="48" rx="8" class="box"/>
  <text x="620" y="186" class="t" text-anchor="middle">API 스펙은 DTO로 분리</text>
  <text x="620" y="205" class="val" text-anchor="middle">쿼리 수는 V1과 같음</text>
  <text x="30" y="252" class="lane">V3</text>
  <text x="30" y="270" class="sub">페치 조인</text>
  <rect x="150" y="230" width="585" height="64" rx="6" class="track"/>
  <rect x="165" y="238" width="120" height="48" rx="8" class="ok"/>
  <text x="225" y="258" class="okt" text-anchor="middle">1번</text>
  <text x="225" y="277" class="vm" text-anchor="middle">join fetch</text>
  <rect x="300" y="238" width="200" height="48" rx="8" class="box"/>
  <text x="400" y="258" class="t" text-anchor="middle">Order + 회원 + 배송</text>
  <text x="400" y="277" class="val" text-anchor="middle">엔티티로 조회 후 변환</text>
  <rect x="515" y="238" width="210" height="48" rx="8" class="ok"/>
  <text x="620" y="258" class="okt" text-anchor="middle">리포지토리 재사용성 좋음</text>
  <text x="620" y="277" class="val" text-anchor="middle">대부분 여기서 해결</text>
  <text x="30" y="324" class="lane">V4</text>
  <text x="30" y="342" class="sub">DTO 직접 조회</text>
  <rect x="150" y="302" width="585" height="64" rx="6" class="track"/>
  <rect x="165" y="310" width="120" height="48" rx="8" class="ok"/>
  <text x="225" y="330" class="okt" text-anchor="middle">1번</text>
  <text x="225" y="349" class="vm" text-anchor="middle">select new</text>
  <rect x="300" y="310" width="200" height="48" rx="8" class="box"/>
  <text x="400" y="330" class="t" text-anchor="middle">필요한 값만 SELECT</text>
  <text x="400" y="349" class="val" text-anchor="middle">OrderSimpleQueryDto</text>
  <rect x="515" y="310" width="210" height="48" rx="8" class="box"/>
  <text x="620" y="330" class="t" text-anchor="middle">네트워크 용량 최적화</text>
  <text x="620" y="349" class="val" text-anchor="middle">리포지토리 재사용성 낮음</text>
</svg>
