<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 3에서 결과 모름이 확정되기까지 — 인증을 커밋하며 authenticated_at을 남기고 PG에 승인을 요청한 뒤 연결 1초·읽기 5초 안에 답을 받지 못하면 APPROVAL_UNKNOWN으로 남기고 504로 답함. wait-after-request(기본 1분)가 지나기 전에는 보정 대상이 아니고, 앞 보정이 끝난 뒤 interval(기본 1분)만큼 쉬고 다시 도는 주기 보정(fixedDelay)이 now − wait-after-request보다 먼저 인증한 결과 모름·인증 결제를 오래된 것부터 100건 골라 주문번호로 조회해 닫음. 대기 시간이 지난 뒤 처음 도는 회차가 닫으므로 확정까지 1분에서 2분이고 그동안 고객은 확인 중을 봄. PG가 조회에 답하지 않으면 한 회차에 100건 × 5초를 기다릴 수 있음. 측정에서 첫 보정의 조회에만 늦게 답하게 하자 확정까지 보정 2번, 16322ms가 걸렸고, 이 값은 읽기 시간 제한 1초로 대기 시간과 주기를 빼고 잰 것임</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #4b5563; }
