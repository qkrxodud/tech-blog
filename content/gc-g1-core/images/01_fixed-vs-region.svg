<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>Parallel GC는 young과 old generation이 각각 연속된 주소로 예약되고 경계가 시작할 때 고정되지만, G1 GC는 heap을 region으로 나눠 eden, survivor, old, humongous 역할을 섞어 쓴다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
    .monob { font-family: Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #1f2937; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .lbl { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .rE { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .rS { fill: #ffffff; stroke: #16a34a; stroke-width: 1.8; }
    .rO { fill: #e5e7eb; stroke: #6b7280; stroke-width: 1.5; }
    .rH { fill: #9ca3af; stroke: #4b5563; stroke-width: 1.5; }
    .rF { fill: #ffffff; stroke: #c4c8ce; stroke-width: 1.2; }
    .rR { fill: #fafafa; stroke: #c4c8ce; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .tE { font-size: 13px; font-weight: 700; fill: #15803d; }
    .tS { font-size: 13px; font-weight: 700; fill: #15803d; }
    .tO { font-size: 13px; font-weight: 700; fill: #374151; }
    .tH { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .tF { font-size: 11px; fill: #9ca3af; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .dl { stroke: #9ca3af; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="446" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="190" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">Parallel GC — young과 old의 최대 크기가 시작할 때 고정됨</text>
  <text x="730" y="42" class="code" text-anchor="end">-XX:+UseParallelGC</text>
  <path d="M 60 92 L 60 84 L 380 84 L 380 92" class="al"/>
  <text x="220.0" y="76" class="val" text-anchor="middle">max old generation (reserved)</text>
  <path d="M 380 92 L 380 84 L 700 84 L 700 92" class="al"/>
  <text x="540.0" y="76" class="val" text-anchor="middle">max young generation (reserved)</text>
  <rect x="60" y="100" width="200" height="48" rx="4" class="rO"/>
  <text x="160" y="129" class="tO" text-anchor="middle">old (committed)</text>
  <rect x="260" y="100" width="120" height="48" rx="4" class="rR"/>
  <rect x="380" y="100" width="190" height="48" rx="4" class="rE"/>
  <text x="475" y="129" class="tE" text-anchor="middle">young (committed)</text>
  <rect x="570" y="100" width="130" height="48" rx="4" class="rR"/>
  <line x1="380" y1="94" x2="380" y2="156" stroke="#dc2626" stroke-width="2.4"/>
  <text x="380" y="178" class="note" text-anchor="middle">boundary — 실행 중에 움직이지 않음</text>
  <rect x="10" y="216" width="740" height="220" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="248" class="h">G1 GC — heap을 같은 크기의 region으로 나눠 역할을 붙임</text>
  <text x="730" y="248" class="code" text-anchor="end">-XX:+UseG1GC</text>
  <text x="85.0" y="280" class="step" text-anchor="middle">1</text>
  <rect x="60" y="288" width="50" height="48" rx="4" class="rH"/>
  <text x="85.0" y="317.0" class="tH" text-anchor="middle">H</text>
  <text x="138.0" y="280" class="step" text-anchor="middle">2</text>
  <rect x="113" y="288" width="50" height="48" rx="4" class="rH"/>
  <text x="138.0" y="317.0" class="tH" text-anchor="middle">H</text>
  <text x="191.0" y="280" class="step" text-anchor="middle">3</text>
  <rect x="166" y="288" width="50" height="48" rx="4" class="rF"/>
  <text x="191.0" y="316.0" class="tF" text-anchor="middle">free</text>
  <text x="244.0" y="280" class="step" text-anchor="middle">4</text>
  <rect x="219" y="288" width="50" height="48" rx="4" class="rF"/>
  <text x="244.0" y="316.0" class="tF" text-anchor="middle">free</text>
  <text x="297.0" y="280" class="step" text-anchor="middle">5</text>
  <rect x="272" y="288" width="50" height="48" rx="4" class="rF"/>
  <text x="297.0" y="316.0" class="tF" text-anchor="middle">free</text>
  <text x="350.0" y="280" class="step" text-anchor="middle">6</text>
  <rect x="325" y="288" width="50" height="48" rx="4" class="rS"/>
  <text x="350.0" y="317.0" class="tS" text-anchor="middle">S</text>
  <text x="403.0" y="280" class="step" text-anchor="middle">7</text>
  <rect x="378" y="288" width="50" height="48" rx="4" class="rO"/>
  <text x="403.0" y="317.0" class="tO" text-anchor="middle">O</text>
  <text x="456.0" y="280" class="step" text-anchor="middle">8</text>
  <rect x="431" y="288" width="50" height="48" rx="4" class="rS"/>
  <text x="456.0" y="317.0" class="tS" text-anchor="middle">S</text>
  <text x="509.0" y="280" class="step" text-anchor="middle">9</text>
  <rect x="484" y="288" width="50" height="48" rx="4" class="rF"/>
  <text x="509.0" y="316.0" class="tF" text-anchor="middle">free</text>
  <text x="562.0" y="280" class="step" text-anchor="middle">10</text>
  <rect x="537" y="288" width="50" height="48" rx="4" class="rR"/>
  <text x="615.0" y="280" class="step" text-anchor="middle">11</text>
  <rect x="590" y="288" width="50" height="48" rx="4" class="rR"/>
  <text x="668.0" y="280" class="step" text-anchor="middle">12</text>
  <rect x="643" y="288" width="50" height="48" rx="4" class="rR"/>
  <path d="M 60 346 L 60 354 L 693 354 L 693 346" class="al"/>
  <text x="376.5" y="372" class="val" text-anchor="middle">max heap (reserved) — young/old 경계 없이 region마다 역할이 바뀜</text>
  <rect x="60" y="392" width="22" height="20" rx="4" class="rE"/>
  <text x="71.0" y="407.0" class="tE" text-anchor="middle">E</text>
  <text x="88" y="407" class="sub">eden</text>
  <rect x="138" y="392" width="22" height="20" rx="4" class="rS"/>
  <text x="149.0" y="407.0" class="tS" text-anchor="middle">S</text>
  <text x="166" y="407" class="sub">survivor</text>
  <rect x="244" y="392" width="22" height="20" rx="4" class="rO"/>
  <text x="255.0" y="407.0" class="tO" text-anchor="middle">O</text>
  <text x="272" y="407" class="sub">old</text>
  <rect x="315" y="392" width="22" height="20" rx="4" class="rH"/>
  <text x="326.0" y="407.0" class="tH" text-anchor="middle">H</text>
  <text x="343" y="407" class="sub">humongous</text>
  <rect x="428" y="392" width="22" height="20" rx="4" class="rF"/>
  <text x="456" y="407" class="sub">free</text>
  <rect x="506" y="392" width="22" height="20" rx="4" class="rR"/>
  <text x="534" y="407" class="sub">예약만(commit 전)</text>
</svg>
