  <rect width="760" height="520" fill="#ffffff"/>
  <text x="24" y="30" class="h">결정 다섯 가지 한눈에</text>
  <text x="24" y="52" class="gs">출발 코드의 6장 테스트 20개 중 14개 실패 → 완성 코드에서 모두 통과</text>
  <text x="110" y="84" class="gs" style="font-size:11.5px">출발 코드에서</text>
  <text x="342" y="84" class="gs" style="font-size:11.5px">고른 것</text>
  <text x="556" y="84" class="gs" style="font-size:11.5px">비교 구현에서</text>
  <rect x="24" y="94" width="76" height="66" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="62" y="132" class="t2" text-anchor="middle" style="font-size:12.5px">결정 1</text>
  <text x="110" y="110" class="t2" style="font-size:12px">알림의 내용을 믿을까</text>
  <rect x="110" y="118" width="210" height="38" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="120" y="141" class="bads" style="font-size:10.5px">위조 알림이 그대로 반영됨</text>
  <line x1="322" y1="137" x2="336" y2="137" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="340" y="100" width="200" height="54" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="352" y="122" class="bt" style="font-size:11.5px">신호로만 쓰고</text>
  <text x="352" y="139" class="bt" style="font-size:11.5px">PG 결제 조회로 다시 읽음</text>
  <rect x="554" y="100" width="182" height="54" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="566" y="122" class="gt" style="font-size:11px">A 본문 믿음</text>
  <text x="566" y="139" class="gs" style="font-size:10.5px">위조 2건 어긋남</text>
  <rect x="24" y="166" width="76" height="66" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="62" y="204" class="t2" text-anchor="middle" style="font-size:12.5px">결정 2</text>
  <text x="110" y="182" class="t2" style="font-size:12px">순서가 바뀐 알림</text>
  <rect x="110" y="190" width="210" height="38" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="120" y="205" class="bads" style="font-size:10.5px">먼저 온 알림 뒤 승인 답 기록</text>
  <text x="120" y="220" class="bads" style="font-size:10.5px"><tspan class="m">409</tspan>로 막힘</text>
  <line x1="322" y1="209" x2="336" y2="209" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="340" y="172" width="200" height="54" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="352" y="194" class="bt" style="font-size:11.5px">갈 수 있는 방향이면 따라가고</text>
  <text x="352" y="211" class="bt" style="font-size:11.5px">지난 상태면 무시</text>
  <rect x="554" y="172" width="182" height="54" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="566" y="194" class="gt" style="font-size:11px">B 표로 거부</text>
  <text x="566" y="211" class="gs" style="font-size:10.5px">재전송 52번 · 200 못 받음 6건</text>
  <rect x="24" y="238" width="76" height="66" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="62" y="276" class="t2" text-anchor="middle" style="font-size:12.5px">결정 3</text>
  <text x="110" y="254" class="t2" style="font-size:12px">같은 알림이 여러 번</text>
  <rect x="110" y="262" width="210" height="38" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="120" y="285" class="bads" style="font-size:10.5px">중복을 거르는 장치 없음</text>
  <line x1="322" y1="281" x2="336" y2="281" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="340" y="244" width="200" height="54" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="352" y="266" class="bt" style="font-size:11.5px"><tspan class="m">transactionKey</tspan>로 맞춰</text>
  <text x="352" y="283" class="bt" style="font-size:11.5px">처리 자체를 멱등으로</text>
  <rect x="554" y="244" width="182" height="54" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="566" y="266" class="gt" style="font-size:11px">D 본문 해시 — 취소 2번</text>
  <text x="566" y="283" class="gs" style="font-size:10.5px">같은 상태를 다른 때에 다시</text>
  <rect x="24" y="310" width="76" height="66" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="62" y="348" class="t2" text-anchor="middle" style="font-size:12.5px">결정 4</text>
  <text x="110" y="326" class="t2" style="font-size:12px">언제 200으로 답할까</text>
  <rect x="110" y="334" width="210" height="38" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="120" y="357" class="gs" style="font-size:10.5px">받은 요청 안에서 반영(조회 없음)</text>
  <line x1="322" y1="353" x2="336" y2="353" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="340" y="316" width="200" height="54" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="352" y="338" class="bt" style="font-size:11.5px">남기고 바로 <tspan class="m">200</tspan></text>
  <text x="352" y="355" class="bt" style="font-size:11.5px">조회·반영은 주기 처리기</text>
  <rect x="554" y="316" width="182" height="54" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="566" y="338" class="gt" style="font-size:11px">E 요청 안 조회</text>
  <text x="566" y="355" class="gs" style="font-size:10.5px">늦은 조회에 <tspan class="m">504</tspan> · 재전송</text>
  <rect x="24" y="382" width="76" height="66" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="62" y="420" class="t2" text-anchor="middle" style="font-size:12.5px">결정 5</text>
  <text x="110" y="398" class="t2" style="font-size:12px">결과 모름을 바로 맞출까</text>
  <rect x="110" y="406" width="210" height="38" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="120" y="421" class="bads" style="font-size:10.5px">결과 모름 취소가 닫히지 않음</text>
  <text x="120" y="436" class="bads" style="font-size:10.5px">PG에서만 일어난 취소 무시</text>
  <line x1="322" y1="425" x2="336" y2="425" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="340" y="388" width="200" height="54" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="352" y="410" class="bt" style="font-size:11.5px">바로 맞추고</text>
  <text x="352" y="427" class="bt" style="font-size:11.5px">우리 취소와 먼저 짝지음</text>
  <rect x="554" y="388" width="182" height="54" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="566" y="410" class="gt" style="font-size:11px">F 주기 보정만</text>
  <text x="566" y="427" class="gs" style="font-size:10.5px">8건 끝내 어긋남</text>
  <rect x="24" y="460" width="712" height="46" rx="10" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <text x="40" y="480" class="ot" style="font-size:12px">4장 보정도 웹훅과 같은 <tspan class="m">follow()</tspan>로 <tspan class="m">CANCELED</tspan>를 승인 뒤 취소로 읽음</text>
  <text x="40" y="497" class="os" style="font-size:11px">보정과 알림이 어느 쪽이 먼저 돌든 결과가 같아짐 · 4장 비교 구현 망취소는 보정 계약 9개 중 3개 실패</text>
</svg>
