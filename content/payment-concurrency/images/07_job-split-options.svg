  <text x="20" y="404" class="gs" style="font-size:11.5px">주기 한 번에 걸린 시간은 구현과 서버 수에 상관없이 2263~2584ms(한 번 실행). 나눠 갖는 효과는 대상이 맡는 단위(100건)보다 많아야 나옴</text>
