<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>예제 쿼리에서 title은 must의 match로, category와 is_notice는 filter의 term으로 검사하며 1번 게시글이 세 조건을 모두 만족한다</title>
    <style>
      .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
      .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
      .step { font-size: 12px; fill: #9ca3af; }
      .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
      .sub { font-size: 12px; fill: #6b7280; }
      .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
      .val { font-size: 12.5px; fill: #4b5563; }
      .db { font-size: 14px; font-weight: 700; fill: #374151; }
      .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
      .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
      .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
      .track { fill: #ffffff; stroke: #eceef1; }
      .axis { stroke: #c4c8ce; stroke-width: 1.2; }
      .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .waitt { font-size: 12.5px; fill: #6b7280; }
      .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
      .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
      .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
      .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
      .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
      .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
      .note { font-size: 12.5px; fill: #b91c1c; }
      .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    </style>
    <defs>
      <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
      </marker>
      <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
      </marker>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
      </marker>
    </defs>
  <rect width="760" height="330" fill="#ffffff"/>

  <rect x="10" y="10" width="740" height="310" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">예제 쿼리 — 필드 성격에 따라 must와 filter로 나누기</text>
  <text x="730" y="42" class="code" text-anchor="end">GET /boards/_search</text>

  <text x="268" y="72" class="step" text-anchor="middle">조건</text>
  <text x="481" y="72" class="step" text-anchor="middle">1번 게시글의 값</text>
  <text x="671" y="72" class="step" text-anchor="middle">판정</text>

  <text x="30" y="106" class="lane">must</text>
  <text x="30" y="124" class="sub">title (text, nori)</text>
  <rect x="180" y="84" width="176" height="48" rx="8" class="box"/>
  <text x="268" y="104" class="op" text-anchor="middle">match title</text>
  <text x="268" y="123" class="val" text-anchor="middle">"검색엔진"</text>
  <rect x="368" y="84" width="226" height="48" rx="8" class="hold"/>
  <text x="481" y="104" class="val" text-anchor="middle">엘라스틱서치는 정말</text>
  <text x="481" y="123" class="val" text-anchor="middle">강력한 검색엔진이에요</text>
  <rect x="606" y="84" width="130" height="48" rx="8" class="ok"/>
  <text x="671" y="104" class="okt" text-anchor="middle">일치</text>
  <text x="671" y="123" class="val" text-anchor="middle">score에 반영</text>

  <text x="30" y="170" class="lane">filter</text>
  <text x="30" y="188" class="sub">category (keyword)</text>
  <rect x="180" y="148" width="176" height="48" rx="8" class="box"/>
  <text x="268" y="168" class="op" text-anchor="middle">term category</text>
  <text x="268" y="187" class="val" text-anchor="middle">"자유 게시판"</text>
  <rect x="368" y="148" width="226" height="48" rx="8" class="hold"/>
  <text x="481" y="177" class="val" text-anchor="middle">자유 게시판</text>
  <rect x="606" y="148" width="130" height="48" rx="8" class="ok"/>
  <text x="671" y="168" class="okt" text-anchor="middle">일치</text>
  <text x="671" y="187" class="val" text-anchor="middle">score 영향 없음</text>

  <text x="30" y="234" class="lane">filter</text>
  <text x="30" y="252" class="sub">is_notice (boolean)</text>
  <rect x="180" y="212" width="176" height="48" rx="8" class="box"/>
  <text x="268" y="232" class="op" text-anchor="middle">term is_notice</text>
  <text x="268" y="251" class="val" text-anchor="middle">false</text>
  <rect x="368" y="212" width="226" height="48" rx="8" class="hold"/>
  <text x="481" y="241" class="val" text-anchor="middle">false</text>
  <rect x="606" y="212" width="130" height="48" rx="8" class="ok"/>
  <text x="671" y="232" class="okt" text-anchor="middle">일치</text>
  <text x="671" y="251" class="val" text-anchor="middle">score 영향 없음</text>

  <rect x="30" y="276" width="560" height="30" rx="15" class="ok"/>
  <text x="310" y="296" class="okt" text-anchor="middle">세 조건 모두 만족 — 1번 게시글 조회, score는 must 조건으로만 계산</text>
</svg>
