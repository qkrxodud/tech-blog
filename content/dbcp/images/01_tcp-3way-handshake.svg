<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>클라이언트가 SYN을 보내고 서버가 SYN-ACK로 수락한 뒤 클라이언트가 ACK로 확인해 TCP 연결이 맺어지는 3way handshake 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .pool { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .life { stroke: #c4c8ce; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="290" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="270" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">3way handshake — 연결을 맺을 때 패킷이 세 번 오간다</text>
  <text x="730" y="42" class="code" text-anchor="end">SYN → SYN-ACK → ACK</text>
  <text x="220" y="68" class="step" text-anchor="middle">1. 연결 요청</text>
  <text x="360" y="68" class="step" text-anchor="middle">2. 요청 수락</text>
  <text x="500" y="68" class="step" text-anchor="middle">3. 수락 확인</text>
  <text x="640" y="68" class="step" text-anchor="middle">4. 연결 완료</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="110" class="lane">클라이언트</text>
  <text x="30" y="128" class="sub">요청하는 쪽</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <text x="30" y="200" class="lane">서버</text>
  <text x="30" y="218" class="sub">받는 쪽</text>
  <rect x="150" y="176" width="585" height="52" rx="6" class="track"/>
  <rect x="162.0" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="108" class="op" text-anchor="middle">SYN</text>
  <text x="220" y="127" class="val" text-anchor="middle">연결 요청</text>
  <rect x="162.0" y="178" width="116" height="48" rx="8" class="hold"/>
  <text x="220" y="207" class="val" text-anchor="middle">요청 받음</text>
  <line x1="220" y1="137" x2="220" y2="176" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="302.0" y="178" width="116" height="48" rx="8" class="box"/>
  <text x="360" y="198" class="op" text-anchor="middle">SYN-ACK</text>
  <text x="360" y="217" class="val" text-anchor="middle">요청 수락</text>
  <rect x="302.0" y="88" width="116" height="48" rx="8" class="hold"/>
  <text x="360" y="117" class="val" text-anchor="middle">수락 받음</text>
  <line x1="360" y1="177" x2="360" y2="138" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="442.0" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="500" y="108" class="op" text-anchor="middle">ACK</text>
  <text x="500" y="127" class="val" text-anchor="middle">수락 확인</text>
  <rect x="442.0" y="178" width="116" height="48" rx="8" class="hold"/>
  <text x="500" y="207" class="val" text-anchor="middle">확인 받음</text>
  <line x1="500" y1="137" x2="500" y2="176" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="582.0" y="88" width="116" height="48" rx="8" class="ok"/>
  <text x="640" y="108" class="okt" text-anchor="middle">연결 완료</text>
  <text x="640" y="127" class="val" text-anchor="middle">데이터 전송 가능</text>
  <rect x="582.0" y="178" width="116" height="48" rx="8" class="ok"/>
  <text x="640" y="198" class="okt" text-anchor="middle">연결 완료</text>
  <text x="640" y="217" class="val" text-anchor="middle">데이터 전송 가능</text>
  <text x="30" y="258" class="foot">양쪽이 서로의 상태를 확인한 뒤에야 데이터를 보낼 수 있습니다.</text>
</svg>
