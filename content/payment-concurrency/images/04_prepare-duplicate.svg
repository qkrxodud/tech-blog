  <rect width="760" height="550" fill="#ffffff"/>
  <text x="24" y="28" class="h">결정 3 — 같은 주문의 준비가 겹치면 중복 거부를 잡아 다시 읽기</text>
  <rect x="16" y="42" width="260" height="30" rx="15" fill="#2563eb"/>
  <text x="146.0" y="62" class="num" text-anchor="middle" style="font-size:13px">준비 A — 먼저 보냄</text>
  <rect x="296" y="42" width="448" height="30" rx="15" fill="#7c3aed"/>
  <text x="520.0" y="62" class="num" text-anchor="middle" style="font-size:13px">준비 B — 같은 주문번호, A의 저장이 붙잡힌 동안 보냄</text>
