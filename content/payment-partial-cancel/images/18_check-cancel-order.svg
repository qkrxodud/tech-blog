  <rect width="760" height="520" fill="#ffffff"/>
  <text x="24" y="30" class="h">결제가 취소를 받는 순서 — PG에 보내기 전</text>
  <text x="24" y="52" class="gs"><tspan class="m">Payment.requestCancel</tspan> → <tspan class="m">checkCancel</tspan> · 거절은 모두 PG를 부르지 않음</text>
  <rect x="24" y="70" width="712" height="436" rx="16" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="36" y="80" width="200" height="24" rx="6" fill="#64748b"/>
  <text x="136.0" y="96.5" class="tab" text-anchor="middle">결제(<tspan class="m">Payment</tspan>) 안</text>
