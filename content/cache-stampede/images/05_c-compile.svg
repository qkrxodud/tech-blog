<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>C 언어는 hello.c를 gcc로 컴파일·링킹해 기계어 실행 파일을 만들고 OS와 CPU가 직접 실행하며, 특정 OS와 CPU용으로 만든 바이너리는 다른 환경에서 실행되지 않는다는 그림</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .subc { font-size: 12px; fill: #6b7280; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .valc { font-size: 12.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .lbl { font-size: 12px; font-weight: 700; fill: #6b7280; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .codek { font-size: 13px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="280" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">C 언어 — 소스 코드를 기계어로 직접 변환</text>
  <text x="730" y="42" class="code" text-anchor="end">gcc</text>
  <rect x="30" y="66" width="140" height="60" rx="8" class="box"/>
  <text x="100.0" y="92" class="t" text-anchor="middle">소스 코드</text>
  <text x="100.0" y="112" class="subc" text-anchor="middle">hello.c</text>
  <rect x="217" y="66" width="140" height="60" rx="8" class="box"/>
  <text x="287.0" y="92" class="t" text-anchor="middle">컴파일 · 링킹</text>
  <text x="287.0" y="112" class="subc" text-anchor="middle">gcc</text>
  <rect x="404" y="66" width="140" height="60" rx="8" class="box"/>
  <text x="474.0" y="92" class="t" text-anchor="middle">실행 파일</text>
  <text x="474.0" y="112" class="sub" text-anchor="middle">기계어 바이너리</text>
  <rect x="591" y="66" width="140" height="60" rx="8" class="ok"/>
  <text x="661.0" y="92" class="okt" text-anchor="middle">실행</text>
  <text x="661.0" y="112" class="sub" text-anchor="middle">OS 로드, CPU 실행</text>
  <line x1="172" y1="96" x2="215" y2="96" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="359" y1="96" x2="402" y2="96" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="546" y1="96" x2="589" y2="96" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="404" y="146" class="sub"><tspan class="subc">hello.exe</tspan> 또는 <tspan class="subc">a.out</tspan></text>
  <rect x="30" y="170" width="220" height="52" rx="8" class="hold"/>
  <text x="140" y="192" class="t" text-anchor="middle">Linux · x86용 바이너리</text>
  <text x="140" y="211" class="val" text-anchor="middle">특정 OS·CPU에 맞게 컴파일</text>
  <rect x="330" y="170" width="180" height="52" rx="8" class="bad"/>
  <text x="420" y="192" class="badt" text-anchor="middle">Windows</text>
  <text x="420" y="211" class="val" text-anchor="middle">실행되지 않음</text>
  <rect x="550" y="170" width="180" height="52" rx="8" class="bad"/>
  <text x="640" y="192" class="badt" text-anchor="middle">ARM CPU</text>
  <text x="640" y="211" class="val" text-anchor="middle">실행되지 않음</text>
  <line x1="252" y1="190" x2="328" y2="190" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <path d="M140,224 V240 H640 V226" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="30" y="272" class="foot">플랫폼 종속적이기 때문에 OS와 CPU 아키텍처가 바뀌면 다시 컴파일해야 합니다.</text>
</svg>
