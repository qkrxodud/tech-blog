  <rect width="760" height="572" fill="#ffffff"/>
  <text x="24" y="28" class="h">결정 2 — 늦게 온 옛 메시지를 어떻게 거를까</text>
  <text x="24" y="48" class="gs" style="font-size:11.5px">주문 서비스 · 같은 주문의 승인과 취소 · 기대는 모두 취소(<tspan class="m">CANCELED</tspan>)</text>
  <rect x="262" y="62" width="156" height="48" rx="10" fill="#f9fafb" stroke="#16a34a" stroke-width="3"/>
  <text x="274" y="82" class="t2" style="font-size:12.5px">번호와 비교</text>
  <text x="274" y="100" class="oks" style="font-size:10.5px;font-weight:700">이 장에서 고름 · 운영</text>
  <rect x="424" y="62" width="156" height="48" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="436" y="82" class="t2" style="font-size:12.5px">만든 시각과 비교</text>
  <text x="436" y="100" class="gs" style="font-size:10.5px"><tspan class="m">occurredAt</tspan></text>
  <rect x="586" y="62" width="156" height="48" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="598" y="82" class="t2" style="font-size:12.5px">거르지 않음</text>
  <text x="598" y="100" class="gs" style="font-size:10.5px">9장 방식 · 마지막 받은 결과</text>
  <rect x="14" y="122" width="240" height="90" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <use href="#i-clock" transform="translate(22,133) scale(0.6)"/>
  <text x="52" y="146" class="t2" style="font-size:12.5px">늦게 온 옛 승인</text>
  <text x="24" y="168" class="s2" style="font-size:10.5px;fill:#1f2937">승인(번호 작음, 시각 t)</text><text x="24" y="183" class="s2" style="font-size:10.5px;fill:#1f2937">취소(번호 큼, t+0.2초)가 먼저 도착</text><text x="24" y="198" class="s2" style="font-size:10.5px;fill:#1f2937">→ 승인이 늦게 도착</text>
  <rect x="262" y="122" width="156" height="90" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="340" y="152"/>
  <text x="340" y="184" class="oks" text-anchor="middle" style="font-size:11px">승인 무시 · 취소 유지</text>
  <rect x="424" y="122" width="156" height="90" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="502" y="152"/>
  <text x="502" y="184" class="oks" text-anchor="middle" style="font-size:11px">승인 무시 · 취소 유지</text>
  <rect x="586" y="122" width="156" height="90" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="664" y="152"/>
  <text x="664" y="184" class="bads" text-anchor="middle" style="font-size:11px;font-weight:700"><tspan class="m">PAID</tspan>로 되돌아감</text>
  <rect x="14" y="222" width="240" height="90" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <use href="#i-server" transform="translate(22,233) scale(0.6)"/>
  <text x="52" y="246" class="t2" style="font-size:12.5px">시계가 다른 서버</text>
  <text x="24" y="268" class="s2" style="font-size:10.5px;fill:#1f2937">서버 A가 승인을 남김(시각 t)</text><text x="24" y="283" class="s2" style="font-size:10.5px;fill:#1f2937">시계가 0.3초 늦은 서버 B가 0.2초 뒤</text><text x="24" y="298" class="s2" style="font-size:10.5px;fill:#1f2937">취소를 남김 → 찍힌 시각 t−0.1초</text>
  <rect x="262" y="222" width="156" height="90" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="340" y="252"/>
  <text x="340" y="284" class="oks" text-anchor="middle" style="font-size:11px">취소 반영(번호가 큼)</text>
  <rect x="424" y="222" width="156" height="90" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="502" y="252"/>
  <text x="502" y="284" class="bads" text-anchor="middle" style="font-size:11px;font-weight:700">취소를 옛 결과로 무시 · <tspan class="m">PAID</tspan></text>
  <rect x="586" y="222" width="156" height="90" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="664" y="252"/>
  <text x="664" y="284" class="oks" text-anchor="middle" style="font-size:11px">취소 반영(받은 순서)</text>
  <rect x="14" y="322" width="240" height="90" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <use href="#i-box" transform="translate(22,333) scale(0.6)"/>
  <text x="52" y="346" class="t2" style="font-size:12.5px">다시 넣은 옛 승인</text>
  <text x="24" y="368" class="s2" style="font-size:10.5px;fill:#1f2937">실패 모음에서 다시 넣은 승인이</text><text x="24" y="383" class="s2" style="font-size:10.5px;fill:#1f2937">그사이 반영된 더 새 취소 뒤에 도착</text>
  <rect x="262" y="322" width="156" height="90" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="340" y="352"/>
  <text x="340" y="384" class="oks" text-anchor="middle" style="font-size:11px">무시 · 취소 유지</text>
  <rect x="424" y="322" width="156" height="90" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="502" y="352"/>
  <text x="502" y="384" class="oks" text-anchor="middle" style="font-size:11px">무시 · 취소 유지</text>
  <rect x="586" y="322" width="156" height="90" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="664" y="352"/>
  <text x="664" y="384" class="bads" text-anchor="middle" style="font-size:11px;font-weight:700"><tspan class="m">PAID</tspan>로 되돌아감</text>
  <text x="24" y="448" class="t2">11장 계약 실패</text>
  <text x="340" y="448" class="okt" text-anchor="middle" style="font-size:12px">0개</text>
  <text x="502" y="448" class="badt" text-anchor="middle" style="font-size:12px">1개 — 시계 계약</text>
  <text x="664" y="448" class="badt" text-anchor="middle" style="font-size:12px">2개 — 옛 승인 두 경우</text>
  <line x1="14" y1="464" x2="748" y2="464" stroke="#9ca3af" stroke-width="1"/>
  <use href="#i-box" transform="translate(22,476) scale(0.7)"/>
  <text x="50" y="492" class="t2">재고 서비스</text>
  <text x="50" y="512" class="s2" style="font-size:11px;fill:#1f2937">재고 명령에는 만든 시각이 실리지 않아 시각 비교는 만들지 않음 · 옛 명령을 거르지 않는 비교(10장 상태 전이만)도</text>
  <text x="50" y="530" class="s2" style="font-size:11px;fill:#1f2937">12개 모두 통과 — 해제 뒤 늦게 온 옛 확정은 해제가 끝 상태라 막힘 · 넣기 전후의 차이가 없었음</text>
  <text x="50" y="550" class="gs" style="font-size:10.5px">번호로 비교하는 비용: 같은 주문의 이벤트마다 주문 줄을 잠그고 읽음 · 번호가 숫자가 아닌 메시지는 영구 오류</text>
</svg>
