<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>MySQL의 테이블·컬럼·레코드·스키마가 Elasticsearch의 인덱스·필드·도큐먼트·매핑에 대응하고, MySQL의 인덱스는 검색에 쓰이지만 ES의 인덱스는 테이블에 해당한다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #1f2937; }
    .cell { font-size: 15px; font-weight: 700; fill: #1f2937; }
    .codek { font-size: 13px; fill: #6b7280; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="446" fill="#ffffff"/>
  <rect x="10" y="10" width="362" height="290" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">MySQL</text>
  <text x="30" y="64" class="sub">테이블 · 컬럼 · 레코드 · 스키마</text>
  <text x="40" y="98" class="db">테이블 users</text>
  <rect x="40" y="110" width="100" height="36" class="hold"/>
  <text x="90.0" y="133" class="op" text-anchor="middle">name</text>
  <rect x="40" y="146" width="100" height="36" class="box"/>
  <text x="90.0" y="169" class="mono" text-anchor="middle">Alice</text>
  <rect x="140" y="110" width="92" height="36" class="hold"/>
  <text x="186.0" y="133" class="op" text-anchor="middle">age</text>
  <rect x="140" y="146" width="92" height="36" class="box"/>
  <text x="186.0" y="169" class="mono" text-anchor="middle">28</text>
  <rect x="232" y="110" width="110" height="36" class="hold"/>
  <text x="287.0" y="133" class="op" text-anchor="middle">is_active</text>
  <rect x="232" y="146" width="110" height="36" class="box"/>
  <text x="287.0" y="169" class="mono" text-anchor="middle">true</text>
  <text x="40" y="216" class="sub">· 컬럼: name, age, is_active</text>
  <text x="40" y="240" class="sub">· 레코드(로우): Alice, 28, true 한 줄</text>
  <text x="40" y="264" class="sub">· 스키마: 컬럼 구성 정의</text>
  <rect x="388" y="10" width="362" height="290" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="408" y="42" class="h">Elasticsearch</text>
  <text x="408" y="64" class="sub">인덱스 · 필드 · 도큐먼트 · 매핑</text>
  <text x="418" y="98" class="db">인덱스 users</text>
  <rect x="418" y="110" width="302" height="72" rx="8" class="box"/>
  <text x="438" y="132" class="mono">"name": "Alice",</text>
  <text x="438" y="152" class="mono">"age": 28,</text>
  <text x="438" y="172" class="mono">"is_active": true</text>
  <text x="418" y="216" class="sub">· 필드: name, age, is_active</text>
  <text x="418" y="240" class="sub">· 도큐먼트: JSON 한 건</text>
  <text x="418" y="264" class="sub">· 매핑: 필드 구성 정의</text>
  <rect x="10" y="316" width="740" height="114" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="348" class="h">‘인덱스’가 가리키는 것</text>
  <rect x="40" y="366" width="330" height="46" rx="10" class="hold"/>
  <text x="205" y="394" class="t" text-anchor="middle">MySQL 인덱스 — 검색할 때 사용</text>
  <rect x="390" y="366" width="330" height="46" rx="10" class="ok"/>
  <text x="555" y="394" class="okt" text-anchor="middle">ES 인덱스 — 테이블에 해당</text>
</svg>
