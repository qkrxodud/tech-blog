  <rect width="760" height="600" fill="#ffffff"/>
  <text x="24" y="30" class="h">Mock PG의 승인 API — 시나리오대로 기다렸다가 답함</text>
  <text x="24" y="52" class="gs" style="font-size:11px">2장 완성 코드 기준 · 서버 오류 분기는 완성 코드에서 더함(출발 코드에는 없음)</text>
  <rect x="60" y="68" width="280" height="48" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <use href="#i-app" x="74" y="77"/>
  <text x="118" y="88" class="t2" style="font-size:12px">결제 서버의 승인 요청</text>
  <text x="118" y="106" class="s" style="font-size:10px"><tspan class="m">POST /v1/payments/confirm</tspan></text>
  <rect x="24" y="130" width="712" height="456" rx="16" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="386" y="140" width="336" height="24" rx="6" fill="#5b7194"/>
  <text x="554.0" y="156.5" class="tab" text-anchor="middle">Mock PG — <tspan class="m">ConfirmController.confirm</tspan></text>
  <line x1="320" y1="118" x2="320" y2="174" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <line x1="320" y1="220" x2="320" y2="230" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <line x1="320" y1="276" x2="320" y2="286" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <line x1="320" y1="332" x2="320" y2="342" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <line x1="320" y1="388" x2="320" y2="398" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <line x1="320" y1="444" x2="320" y2="454" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <line x1="320" y1="500" x2="320" y2="510" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <rect x="60" y="176" width="280" height="44" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="60" cy="176" r="10" fill="#111827"/><text x="60" y="180" class="num" text-anchor="middle">1</text>
  <use href="#i-search" transform="translate(76,184) scale(0.9)"/>
  <text x="118" y="195" class="t2" style="font-size:12px">지금 시나리오 읽기</text>
  <text x="118" y="212" class="s" style="font-size:10px"><tspan class="m">scenarioStore.current()</tspan></text>
  <rect x="60" y="232" width="280" height="44" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="60" cy="232" r="10" fill="#111827"/><text x="60" y="236" class="num" text-anchor="middle">2</text>
  <use href="#i-table" transform="translate(76,240) scale(0.9)"/>
  <text x="118" y="251" class="t2" style="font-size:12px">기다리는 주문에 올림</text>
  <text x="118" y="268" class="s" style="font-size:10px"><tspan class="m">scenarioStore.enter(orderId)</tspan></text>
  <rect x="60" y="288" width="280" height="44" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="60" cy="288" r="10" fill="#111827"/><text x="60" y="292" class="num" text-anchor="middle">3</text>
  <use href="#i-clock" transform="translate(76,296) scale(0.9)"/>
  <text x="118" y="307" class="t2" style="font-size:12px">지연 시간만큼 기다림</text>
  <text x="118" y="324" class="s" style="font-size:10px"><tspan class="m">Thread.sleep(delay)</tspan></text>
  <rect x="60" y="344" width="280" height="44" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="60" cy="344" r="10" fill="#111827"/><text x="60" y="348" class="num" text-anchor="middle">4</text>
  <use href="#i-table" transform="translate(76,352) scale(0.9)"/>
  <text x="118" y="363" class="t2" style="font-size:12px">기다리는 주문에서 내림</text>
  <text x="118" y="380" class="s" style="font-size:10px"><tspan class="m">finally</tspan> · <tspan class="m">leave(orderId)</tspan></text>
  <rect x="60" y="400" width="280" height="44" rx="10" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <circle cx="60" cy="400" r="10" fill="#111827"/><text x="60" y="404" class="num" text-anchor="middle">5</text>
  <text x="80" y="419" class="t2" style="font-size:12px">서버 오류 시나리오인가</text>
  <text x="80" y="436" class="s" style="font-size:10px"><tspan class="m">isFail()</tspan> · 완성 코드에서 더함</text>
  <rect x="60" y="456" width="280" height="44" rx="10" fill="#ede9fe" stroke="#8b7fd1" stroke-width="1.5"/>
  <circle cx="60" cy="456" r="10" fill="#111827"/><text x="60" y="460" class="num" text-anchor="middle">6</text>
  <text x="80" y="475" class="t2" style="font-size:12px">거절 시나리오인가</text>
  <text x="80" y="492" class="s" style="font-size:10px"><tspan class="m">isDecline()</tspan></text>
  <rect x="60" y="512" width="280" height="44" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <circle cx="60" cy="512" r="10" fill="#111827"/><text x="60" y="516" class="num" text-anchor="middle">7</text>
  <use href="#i-doc" transform="translate(76,520) scale(0.8)"/>
  <text x="118" y="531" class="okt" style="font-size:12px">주문별 승인 횟수 기록</text>
  <text x="118" y="548" class="oks" style="font-size:10px"><tspan class="m">recordApproval(orderId)</tspan></text>
  <line x1="342" y1="422" x2="384" y2="422" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="362" y="415" class="bads" text-anchor="middle" style="font-size:10px">예</text>
  <rect x="386" y="400" width="336" height="44" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="404" y="422"/>
  <text x="420" y="419" class="badt" style="font-size:12px"><tspan class="m">500</tspan></text>
  <text x="420" y="436" class="bads" style="font-size:10px"><tspan class="m">FAILED_INTERNAL_SYSTEM_PROCESSING</tspan></text>
  <line x1="342" y1="478" x2="384" y2="478" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="362" y="471" class="bads" text-anchor="middle" style="font-size:10px">예</text>
  <rect x="386" y="456" width="336" height="44" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="404" y="478"/>
  <text x="420" y="475" class="badt" style="font-size:12px"><tspan class="m">400</tspan></text>
  <text x="420" y="492" class="bads" style="font-size:10px"><tspan class="m">CARD_REJECTED</tspan></text>
  <line x1="342" y1="534" x2="384" y2="534" stroke="#16a34a" stroke-width="1.4" marker-end="url(#agr)"/>
  <rect x="386" y="512" width="336" height="44" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="404" y="534"/>
  <text x="420" y="531" class="okt" style="font-size:12px"><tspan class="m">200</tspan> · status <tspan class="m">DONE</tspan></text>
  <text x="420" y="548" class="oks" style="font-size:10px">결제 서버가 기다리기를 그만뒀어도 승인은 남음</text>
  <rect x="386" y="176" width="336" height="200" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="400" y="198" class="t2" style="font-size:12.5px">제어 API와 테스트가 보는 것</text>
  <text x="400" y="224" class="bt" style="font-size:11.5px"><tspan class="m">PUT /control/scenario</tspan></text>
  <text x="400" y="241" class="s" style="font-size:10.5px">지연 시간과 결과(승인 · 거절 · 서버 오류)를 바꿈</text>
  <text x="400" y="262" class="bt" style="font-size:11.5px">기다리는 주문</text>
  <text x="400" y="279" class="s" style="font-size:10.5px">두 요청이 모두 PG 답을 기다리는 순간을 잡음</text>
  <text x="400" y="300" class="bt" style="font-size:11.5px">주문별 승인 횟수</text>
  <text x="400" y="317" class="s" style="font-size:10.5px"><tspan class="m">GET /control/approvals/{orderId}</tspan></text>
  <text x="400" y="338" class="bt" style="font-size:11.5px">테스트에서</text>
  <text x="400" y="355" class="s" style="font-size:10.5px">같은 JVM 안 임의 포트 · 결제 서버와는 실제 HTTP</text>
  <path d="M384,212 C364,212 362,198 344,198" fill="none" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#agy)"/>
  <rect x="60" y="176" width="280" height="44" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1688;0.1788;0.2288;0.2388;1"/></rect>
  <rect x="60" y="232" width="280" height="44" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2527;0.2627;0.3127;0.3227;1"/></rect>
  <rect x="60" y="288" width="280" height="44" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3366;0.3466;0.4966;0.5066;1"/></rect>
  <rect x="60" y="344" width="280" height="44" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5204;0.5304;0.5804;0.5904;1"/></rect>
