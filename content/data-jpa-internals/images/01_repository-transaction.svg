<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>서비스 계층에 트랜잭션이 없으면 save()에 붙은 @Transactional이 리포지토리에서 트랜잭션을 시작하고 끝내며, 서비스 계층에서 트랜잭션을 시작했으면 리포지토리는 그 트랜잭션을 전파받아 사용하고, 클래스에 붙은 @Transactional(readOnly = true)는 조회 메서드에 적용되어 플러시를 생략한다는 그림</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 12.5px; fill: #374151; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="760" height="336" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="316" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">SimpleJpaRepository의 트랜잭션 — 어디서 시작하는가</text>
  <text x="250" y="72" class="step" text-anchor="middle">트랜잭션 시작</text>
  <text x="445" y="72" class="step" text-anchor="middle">리포지토리 메서드</text>
  <text x="640" y="72" class="step" text-anchor="middle">트랜잭션 종료</text>
  <line x1="160" y1="80" x2="722" y2="80" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="114" class="lane">서비스</text>
  <text x="30" y="132" class="sub">트랜잭션 없음</text>
  <rect x="150" y="90" width="585" height="56" rx="6" class="track"/>
  <rect x="165" y="94" width="170" height="48" rx="8" class="ok"/>
  <text x="250" y="114" class="okt" text-anchor="middle">리포지토리에서 시작</text>
  <text x="250" y="133" class="val" text-anchor="middle">save()의 @Transactional</text>
  <line x1="337" y1="118" x2="358" y2="118" class="axis" marker-end="url(#ar)"/>
  <rect x="360" y="94" width="170" height="48" rx="8" class="box"/>
  <text x="445" y="114" class="t" text-anchor="middle">save() 실행</text>
  <text x="445" y="133" class="val" text-anchor="middle">persist 또는 merge</text>
  <line x1="532" y1="118" x2="553" y2="118" class="axis" marker-end="url(#ar)"/>
  <rect x="555" y="94" width="170" height="48" rx="8" class="ok"/>
  <text x="640" y="114" class="okt" text-anchor="middle">리포지토리에서 커밋</text>
  <text x="640" y="133" class="val" text-anchor="middle">save()가 끝날 때</text>
  <text x="30" y="180" class="lane">서비스</text>
  <text x="30" y="198" class="sub">@Transactional</text>
  <rect x="150" y="156" width="585" height="56" rx="6" class="track"/>
  <rect x="165" y="160" width="170" height="48" rx="8" class="hold"/>
  <text x="250" y="180" class="t" text-anchor="middle">서비스에서 시작</text>
  <text x="250" y="199" class="val" text-anchor="middle">서비스 메서드 진입</text>
  <line x1="337" y1="184" x2="358" y2="184" class="axis" marker-end="url(#ar)"/>
  <rect x="360" y="160" width="170" height="48" rx="8" class="box"/>
  <text x="445" y="180" class="t" text-anchor="middle">save() 실행</text>
  <text x="445" y="199" class="val" text-anchor="middle">트랜잭션을 전파받음</text>
  <line x1="532" y1="184" x2="553" y2="184" class="axis" marker-end="url(#ar)"/>
  <rect x="555" y="160" width="170" height="48" rx="8" class="hold"/>
  <text x="640" y="180" class="t" text-anchor="middle">서비스에서 커밋</text>
  <text x="640" y="199" class="val" text-anchor="middle">서비스 메서드가 끝날 때</text>
  <text x="30" y="246" class="lane">조회</text>
  <text x="30" y="264" class="sub">findById 등</text>
  <rect x="150" y="222" width="585" height="56" rx="6" class="track"/>
  <rect x="165" y="226" width="170" height="48" rx="8" class="hold"/>
  <text x="250" y="246" class="t" text-anchor="middle">readOnly = true</text>
  <text x="250" y="265" class="val" text-anchor="middle">클래스에 붙은 설정</text>
  <line x1="337" y1="250" x2="358" y2="250" class="axis" marker-end="url(#ar)"/>
  <rect x="360" y="226" width="170" height="48" rx="8" class="box"/>
  <text x="445" y="246" class="t" text-anchor="middle">조회 실행</text>
  <text x="445" y="265" class="val" text-anchor="middle">변경하지 않음</text>
  <line x1="532" y1="250" x2="553" y2="250" class="axis" marker-end="url(#ar)"/>
  <rect x="555" y="226" width="170" height="48" rx="8" class="ok"/>
  <text x="640" y="246" class="okt" text-anchor="middle">플러시 생략</text>
  <text x="640" y="265" class="val" text-anchor="middle">약간의 성능 향상</text>
  <text x="30" y="306" class="sub">변경 메서드인 save()에는 @Transactional이 따로 붙어 있어 readOnly가 아닌 트랜잭션으로 실행됩니다.</text>
</svg>
