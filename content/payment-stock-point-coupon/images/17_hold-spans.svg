  <rect width="760" height="470" fill="#ffffff"/>
  <text x="24" y="30" class="h">결정 2 잡는 때 비교 — 재고·쿠폰·포인트를 쥐는 구간</text>
  <text x="24" y="52" class="gs">막대 = 쥐는 구간 · 세 구현은 잡는 방법이 같고 잡는 때만 다름(<tspan class="m">DeferredHoldings</tspan>)</text>
  <line x1="214" y1="92" x2="214" y2="290" stroke="#e5e7eb" stroke-width="1"/>
  <text x="214" y="84" class="gs" text-anchor="middle" style="font-size:11px">준비</text>
  <line x1="320" y1="92" x2="320" y2="290" stroke="#e5e7eb" stroke-width="1"/>
  <text x="320" y="84" class="gs" text-anchor="middle" style="font-size:11px">인증</text>
  <line x1="440" y1="92" x2="440" y2="290" stroke="#e5e7eb" stroke-width="1"/>
  <text x="440" y="84" class="gs" text-anchor="middle" style="font-size:11px">PG 답 기다림</text>
  <line x1="580" y1="92" x2="580" y2="290" stroke="#e5e7eb" stroke-width="1"/>
  <text x="580" y="84" class="gs" text-anchor="middle" style="font-size:11px">승인 답 기록</text>
  <line x1="700" y1="92" x2="700" y2="290" stroke="#e5e7eb" stroke-width="1"/>
  <text x="700" y="84" class="gs" text-anchor="middle" style="font-size:11px">…</text>
  <rect x="24" y="104" width="150" height="62" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="38" y="130" class="t2" style="font-size:13px">준비 때 잡기</text>
  <text x="38" y="150" class="gs" style="font-size:11px">비교 · 실패 1</text>
  <rect x="214" y="116" width="452" height="16" rx="8" fill="#fed7aa" stroke="#ea580c" stroke-width="1.3"/>
  <rect x="670" y="116" width="50" height="16" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="4 3"/>
  <use href="#i-lock" transform="translate(202,108) scale(0.85)"/>
  <text x="716" y="154" class="bads hl" text-anchor="end" style="font-size:11px">승인까지 안 간 준비도 쥠</text>
  <rect x="24" y="180" width="150" height="62" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="2.5"/>
  <text x="38" y="206" class="okt" style="font-size:13px">인증 때 잡기</text>
  <text x="38" y="226" class="oks" style="font-size:11px">이 장에서 고름</text>
  <rect x="320" y="192" width="400" height="16" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.3"/>
  <use href="#i-lock" transform="translate(308,184) scale(0.85)"/>
  <text x="716" y="230" class="bs hl" text-anchor="end" style="font-size:11px">PG 답을 기다리는 동안 묶임</text>
  <rect x="24" y="256" width="150" height="62" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="38" y="282" class="t2" style="font-size:13px">승인 뒤 잡기</text>
  <text x="38" y="302" class="gs" style="font-size:11px">비교 · 실패 3</text>
  <rect x="600" y="268" width="66" height="16" rx="8" fill="#fed7aa" stroke="#ea580c" stroke-width="1.3"/>
  <rect x="670" y="268" width="50" height="16" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="4 3"/>
  <use href="#i-lock" transform="translate(588,260) scale(0.85)"/>
  <text x="716" y="306" class="bs hl" text-anchor="end" style="font-size:11px">PG 답을 기다리는 동안은 안 묶음</text>
  <text x="720" y="330" class="gs" text-anchor="end" style="font-size:10.5px">초록 막대(운영)는 돌려줄 때까지 · 회색 점선 = 비교 구현은 잡는 때만 재고 돌려주지는 않음</text>
  <text x="24" y="362" class="t2" style="font-size:12.5px">맞는 경우</text>
  <rect x="24" y="372" width="230" height="92" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="38" y="392" class="gt" style="font-size:12px">준비 때</text>
  <text x="38" y="410" class="gs" style="font-size:10.5px">준비한 주문에 재고를 먼저</text>
  <text x="38" y="425" class="gs" style="font-size:10.5px">보장해야 하는 판매</text>
  <text x="38" y="440" class="gs" style="font-size:10.5px">풀어 줄 작업이 함께 있어야 함</text>
  <text x="38" y="455" class="gs" style="font-size:10.5px">— 이 장에는 그 작업이 없음</text>
  <rect x="264" y="372" width="230" height="92" rx="12" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="278" y="392" class="okt" style="font-size:12px">인증 때 (이 장)</text>
  <text x="278" y="410" class="oks" style="font-size:10.5px">승인해 놓고 재고가 없는</text>
  <text x="278" y="425" class="oks" style="font-size:10.5px">결제를 만들지 않음</text>
  <text x="278" y="440" class="oks" style="font-size:10.5px">결과 모름이면 보정까지</text>
  <text x="278" y="455" class="oks" style="font-size:10.5px">(운영 설정: 1분 뒤 · 1분마다)</text>
  <rect x="504" y="372" width="230" height="92" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="518" y="392" class="gt" style="font-size:12px">승인 뒤</text>
  <text x="518" y="410" class="gs" style="font-size:10.5px">재고 모자람이 드물고</text>
  <text x="518" y="425" class="gs" style="font-size:10.5px">카드에 승인과 취소가</text>
  <text x="518" y="440" class="gs" style="font-size:10.5px">함께 남아도 괜찮을 때</text>
</svg>
