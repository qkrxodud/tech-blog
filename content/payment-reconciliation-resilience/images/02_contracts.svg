<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 548" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>12장 계약 네 묶음 41개 — 하루치 대사(DailyReconciliationContract) 13개, 상태 이력(StatusHistoryContract) 9개, 카드사 장애(PgOutageContract) 6개, 운영 신호(OperationalSignalsContract) 13개가 보는 것과 출발 코드에서 실패한 수(9·8·4·9), 계약을 추상 클래스로 두고 운영 구현·출발 구조·비교 구현이 상속해 같은 테스트를 돌리는 구조</title>
  <style>
