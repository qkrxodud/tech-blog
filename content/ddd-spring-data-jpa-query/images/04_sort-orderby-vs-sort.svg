<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>메서드 이름에 OrderBy를 쓰면 정렬 기준이 메서드에 고정되고, Sort를 파라미터로 받으면 호출하는 쪽에서 정렬 기준을 바꿔 같은 메서드로 다른 ORDER BY를 만들 수 있다는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .op2 { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #1f2937; }
    .okc2 { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badc2 { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .monos { font-family: Menlo, Consolas, monospace; font-size: 12.5px; fill: #374151; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="760" height="436" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="170" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">메서드 이름에 OrderBy — 정렬 기준이 메서드에 고정</text>
  <text x="730" y="42" class="code" text-anchor="end">OrderBy</text>
  <rect x="30" y="62" width="400" height="48" rx="8" class="box"/>
  <text x="230" y="91" class="op2" text-anchor="middle">findByOrdererIdOrderByNumberDesc("user1")</text>
  <line x1="434" y1="86" x2="526" y2="86" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#agy)"/>
  <rect x="530" y="62" width="200" height="48" rx="8" class="hold"/>
  <text x="630" y="91" class="monos" text-anchor="middle">order by number desc</text>
  <rect x="30" y="124" width="700" height="36" rx="6" class="bad"/>
  <text x="380" y="147" class="note" text-anchor="middle">정렬 기준을 바꾸려면 <tspan font-family="Menlo, Consolas, monospace">findByOrdererIdOrderByOrderDateDesc</tspan> 같은 메서드를 새로 추가</text>
  <rect x="10" y="196" width="740" height="230" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="228" class="h">Sort 파라미터 — 호출하는 쪽에서 정렬 기준을 정함</text>
  <text x="730" y="228" class="code" text-anchor="end">Sort</text>
  <text x="165" y="254" class="step" text-anchor="middle">호출하는 쪽</text>
  <text x="415" y="254" class="step" text-anchor="middle">같은 메서드</text>
  <text x="630" y="254" class="step" text-anchor="middle">실행되는 정렬</text>
  <rect x="30" y="264" width="270" height="48" rx="8" class="box"/>
  <text x="165" y="293" class="monos" text-anchor="middle">Sort.by("number").ascending()</text>
  <rect x="30" y="326" width="270" height="48" rx="8" class="box"/>
  <text x="165" y="355" class="monos" text-anchor="middle">Sort.by("orderDate").descending()</text>
  <rect x="330" y="264" width="170" height="110" rx="8" class="hold"/>
  <text x="415" y="312" class="op2" text-anchor="middle">findByOrdererId</text>
  <text x="415" y="332" class="monos" text-anchor="middle">("user1", sort)</text>
  <line x1="304" y1="288" x2="326" y2="288" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#agy)"/>
  <line x1="304" y1="350" x2="326" y2="350" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#agy)"/>
  <line x1="504" y1="288" x2="526" y2="288" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="504" y1="350" x2="526" y2="350" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="530" y="264" width="200" height="48" rx="8" class="ok"/>
  <text x="630" y="293" class="monos" text-anchor="middle">order by number asc</text>
  <rect x="530" y="326" width="200" height="48" rx="8" class="ok"/>
  <text x="630" y="355" class="monos" text-anchor="middle">order by orderDate desc</text>
  <text x="30" y="408" class="gnote">메서드 하나로 정렬 기준을 바꿔 가며 조회할 수 있음</text>
</svg>
