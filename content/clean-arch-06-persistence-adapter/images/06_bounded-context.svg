  <text x="42" y="314" class="pk">application.service</text>
  <rect x="275" y="294" width="210" height="136" rx="8" class="pkg"/>
  <text x="287" y="314" class="pk">application.port.out</text>
  <rect x="525" y="294" width="205" height="136" rx="8" class="pkg"/>
  <text x="537" y="314" class="pk">adapter.out.persistence</text>
  <rect x="40" y="328" width="175" height="44" rx="8" class="box"/>
  <text x="127.5" y="346.5" class="m" text-anchor="middle">CreateMonthly</text>
  <text x="127.5" y="361.5" class="m" text-anchor="middle">InvoiceService</text>
