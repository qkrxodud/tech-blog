<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>MemberJpaRepository가 EntityManager로 save, findById, findAll, findByUsername을, JPAQueryFactory로 findAll_querydsl, findUsername_querydsl을 처리하고, 빈으로 등록한 JPAQueryFactory가 받은 프록시 엔티티 매니저는 트랜잭션마다 실제 엔티티 매니저를 할당받는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .msg { font-size: 11.5px; fill: #374151; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .cont { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="330" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="310" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">순수 JPA 리포지토리 — EntityManager와 JPAQueryFactory</text>
  <text x="730" y="42" class="code" text-anchor="end">@Repository</text>
  <rect x="30" y="60" width="330" height="212" rx="10" class="cont"/>
  <text x="195" y="84" class="opm" text-anchor="middle">MemberJpaRepository</text>
  <rect x="46" y="98" width="298" height="76" rx="8" class="box"/>
  <text x="195.0" y="122.0" class="ts" text-anchor="middle">EntityManager로 처리</text>
  <text x="195.0" y="141.0" class="m" text-anchor="middle">save, findById,</text>
  <text x="195.0" y="160.0" class="m" text-anchor="middle">findAll, findByUsername</text>
  <rect x="46" y="186" width="298" height="76" rx="8" class="box"/>
  <text x="195.0" y="210.0" class="ts" text-anchor="middle">JPAQueryFactory로 처리</text>
  <text x="195.0" y="229.0" class="m" text-anchor="middle">findAll_querydsl,</text>
  <text x="195.0" y="248.0" class="m" text-anchor="middle">findUsername_querydsl</text>
  <rect x="390" y="200" width="160" height="48" rx="8" class="hold"/>
  <text x="470.0" y="219.5" class="opm" text-anchor="middle">JPAQueryFactory</text>
  <text x="470.0" y="238.5" class="sub" text-anchor="middle">스프링 빈</text>
  <line x1="344" y1="224" x2="386" y2="224" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="390" y="98" width="160" height="60" rx="8" class="hold"/>
  <text x="470.0" y="123.5" class="opm" text-anchor="middle">EntityManager</text>
  <text x="470.0" y="142.5" class="sub" text-anchor="middle">프록시(가짜)</text>
  <line x1="470" y1="200" x2="470" y2="162" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="476" y="186" class="sub" text-anchor="start">생성 시 주입</text>
  <rect x="580" y="74" width="150" height="52" rx="8" class="ok"/>
  <text x="655.0" y="95.5" class="okt" text-anchor="middle">트랜잭션 A</text>
  <text x="655.0" y="114.5" class="gnote" text-anchor="middle">실제 EntityManager</text>
  <rect x="580" y="138" width="150" height="52" rx="8" class="ok"/>
  <text x="655.0" y="159.5" class="okt" text-anchor="middle">트랜잭션 B</text>
  <text x="655.0" y="178.5" class="gnote" text-anchor="middle">실제 EntityManager</text>
  <line x1="550" y1="120" x2="576" y2="102" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="550" y1="136" x2="576" y2="160" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="300" class="foot" text-anchor="start">프록시 엔티티 매니저는 실제 사용 시점에 트랜잭션 단위로 실제 엔티티 매니저(영속성 컨텍스트)를 할당하므로 동시성 문제가 없습니다</text>
</svg>
