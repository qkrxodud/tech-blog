  <rect x="402" y="270" width="318" height="85" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="402" cy="270" r="10" fill="#111827"/><text x="402" y="274" class="num" text-anchor="middle">3</text>
  <use href="#i-app" transform="translate(416,280) scale(0.9)"/>
  <text x="458" y="292" class="bt" style="font-size:12px">서버 두 대가 같은 때 시작</text>
  <text x="458" y="310" class="bs" style="font-size:10.5px">릴레이를 쉬지 않고 돌림</text>
  <text x="458" y="327" class="bs" style="font-size:10.5px">주기 하나는 50건까지</text>
  <text x="458" y="344" class="bs" style="font-size:10.5px">한 줄씩 나눠 보내기는 한 줄씩</text>
  <line x1="561" y1="356" x2="561" y2="368" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ak)"/>
  <rect x="402" y="369" width="318" height="51" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="402" cy="369" r="10" fill="#111827"/><text x="402" y="373" class="num" text-anchor="middle">4</text>
  <use href="#i-clock" transform="translate(416,379) scale(0.9)"/>
  <text x="458" y="391" class="bt" style="font-size:12px">보낼 것이 없어질 때까지</text>
  <text x="458" y="409" class="bs" style="font-size:10.5px">처리량 = 200 ÷ 다 보낸 시간(초)</text>
  <text x="402" y="446" class="bs" style="font-size:10.5px">도착 지연에 쌓아 둔 동안 기다린 시간이 들어 있어</text>
  <text x="402" y="462" class="bs" style="font-size:10.5px">방식끼리만 견줌</text>
</svg>
