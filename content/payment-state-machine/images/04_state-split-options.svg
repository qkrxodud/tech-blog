<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>상태 나누기 — 승인 하나로 묶으면 취소할 때 매입 전후를 알 수 없고, 하나의 상태 필드에 모두 두면 APPROVED와 CAPTURED에서 취소가 전이 표 한 곳에서 갈라지며, 두 필드로 나누면 두 필드를 함께 봐야 취소 방향이 정해지는 그림. 고른 방식만 구현했다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14.5px; font-weight: 700; fill: #1f2937; }
    .t13 { font-size: 13.5px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #4b5563; }
    .m { font-family: Menlo, Consolas, monospace; }
    .lbl { font-size: 12px; fill: #4b5563; }
    .step { font-size: 12.5px; font-weight: 700; fill: #374151; }
    .lane { font-size: 15px; font-weight: 700; fill: #1f2937; }
    .tab { font-size: 12.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .badt { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .bads { font-size: 11.5px; fill: #b91c1c; }
    .okt { font-size: 13px; font-weight: 700; fill: #15803d; }
    .oks { font-size: 11.5px; fill: #15803d; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .mute { font-size: 12px; fill: #6b7280; }
    .o { stroke: #1f2937; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .spine { stroke: #1f2937; stroke-width: 1.5; fill: none; }
    .run { stroke-dasharray: 5 4; animation: run 0.9s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -18; } }
    @media (prefers-reduced-motion: reduce) { .run { animation: none; } .anim { display: none; } }
  </style>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="aor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <g id="pkt">
      <rect x="-11" y="-8" width="22" height="16" rx="3" fill="#2dd4bf" stroke="#0f766e" stroke-width="1.5"/>
      <path d="M-10,-7 L0,1 L10,-7" fill="none" stroke="#0f766e" stroke-width="1.5"/>
    </g>
    <g id="xmark"><circle r="9" fill="#ef4444"/><path d="M-4,-4 L4,4 M4,-4 L-4,4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
    <g id="vmark"><circle r="9" fill="#22c55e"/><path d="M-4.5,0 L-1.5,3.5 L4.5,-3.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  </defs>
  <rect width="760" height="500" fill="#ffffff"/>
  <text x="24" y="30" class="h">상태 나누기 — 세 방식에서 취소 방향이 정해지는 곳</text>
  <rect x="22" y="56" width="228" height="428" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="114" y="45" width="124" height="22" rx="11" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="176" y="60.5" class="mute" text-anchor="middle" style="font-size: 11.5px">구현하지 않은 선택지</text>
  <text x="38" y="132" class="mute">상태 필드</text>
  <text x="38" y="318" class="mute">취소 요청이 오면</text>
  <text x="38" y="430" class="mute">다른 선택이 맞는 조건</text>
  <line x1="38" y1="298" x2="234" y2="298" stroke="#e5e7eb"/>
  <line x1="38" y1="410" x2="234" y2="410" stroke="#e5e7eb"/>
  <rect x="266" y="56" width="228" height="428" rx="12" fill="#f6fbf7" stroke="#16a34a" stroke-width="2.5"/>
  <rect x="390" y="45" width="92" height="22" rx="11" fill="#16a34a"/>
  <text x="436" y="60.5" class="tab" text-anchor="middle" style="font-size: 12px">이 장의 선택</text>
  <text x="282" y="132" class="mute">상태 필드</text>
  <text x="282" y="318" class="mute">취소 요청이 오면</text>
  <text x="282" y="430" class="mute">이 선택의 비용</text>
  <line x1="282" y1="298" x2="478" y2="298" stroke="#e5e7eb"/>
  <line x1="282" y1="410" x2="478" y2="410" stroke="#e5e7eb"/>
  <rect x="510" y="56" width="228" height="428" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="602" y="45" width="124" height="22" rx="11" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="664" y="60.5" class="mute" text-anchor="middle" style="font-size: 11.5px">구현하지 않은 선택지</text>
  <text x="526" y="132" class="mute">상태 필드</text>
  <text x="526" y="318" class="mute">취소 요청이 오면</text>
  <text x="526" y="430" class="mute">다른 선택이 맞는 조건</text>
  <line x1="526" y1="298" x2="722" y2="298" stroke="#e5e7eb"/>
  <line x1="526" y1="410" x2="722" y2="410" stroke="#e5e7eb"/>
  <g transform="translate(36,76)"><rect x="0" y="0" width="22" height="14" rx="4" fill="#e5e7eb" class="o"/></g>
  <text x="70" y="90" class="t">승인 하나로 묶기</text>
  <text x="38" y="112" class="s">인증·승인·매입을 구분하지 않음</text>
  <rect x="38" y="146" width="196" height="56" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="136" y="167" class="s m" text-anchor="middle">status</text>
  <text x="136" y="189" class="t" text-anchor="middle">결제 완료</text>
  <text x="136" y="226" class="s" text-anchor="middle">매입 전후를 담을 자리가 없음</text>
  <rect x="38" y="330" width="196" height="44" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="56" y="352"/>
  <text x="144" y="357" class="badt" text-anchor="middle">매입 전인지 후인지 모름</text>
  <text x="136" y="394" class="bads" text-anchor="middle" style="font-size: 12px">승인 취소·매입 취소 구분 불가</text>
  <text x="38" y="452" class="s" style="font-size: 12.5px; fill: #374151">정산을 PG에 모두 맡기고</text>
  <text x="38" y="470" class="s" style="font-size: 12.5px; fill: #374151">매입 시점에 관여하지 않을 때</text>
  <g transform="translate(278,76)"><rect x="0" y="4" width="13" height="14" rx="4" fill="#e5e7eb" class="o"/><rect x="21" y="4" width="13" height="14" rx="4" fill="#86efac" class="o"/><path d="M14,11 h6" class="o" fill="none"/><path d="M17,8 l3,3 l-3,3" class="o" fill="none"/></g>
  <text x="320" y="90" class="t">한 필드에 모두 두기</text>
  <text x="282" y="112" class="s">인증·승인·매입을 <tspan font-family="Menlo, Consolas, monospace">status</tspan> 하나에</text>
  <rect x="282" y="146" width="196" height="122" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="380" y="167" class="s m" text-anchor="middle">status</text>
  <text x="380" y="190" class="t m" text-anchor="middle" style="font-size: 12px; font-weight: 400">READY</text>
  <text x="380" y="211" class="t m" text-anchor="middle" style="font-size: 12px; font-weight: 400">AUTHENTICATED</text>
  <text x="380" y="232" class="t m" text-anchor="middle" style="font-size: 12px; font-weight: 400">APPROVED</text>
  <text x="380" y="253" class="t m" text-anchor="middle" style="font-size: 12px; font-weight: 400">CAPTURED</text>
  <text x="380" y="287" class="s" text-anchor="middle">+ 실패·만료·취소 5개, 모두 9개</text>
  <rect x="282" y="330" width="196" height="50" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="478" y="330"/>
  <text x="380" y="351" class="okt" text-anchor="middle" style="font-size: 11px"><tspan font-family="Menlo, Consolas, monospace">APPROVED</tspan> → <tspan font-family="Menlo, Consolas, monospace">APPROVAL_CANCELED</tspan></text>
  <text x="380" y="370" class="okt" text-anchor="middle" style="font-size: 11px"><tspan font-family="Menlo, Consolas, monospace">CAPTURED</tspan> → <tspan font-family="Menlo, Consolas, monospace">CAPTURE_CANCELED</tspan></text>
  <text x="380" y="398" class="gnote" text-anchor="middle">전이 표 한 곳에서 갈라짐</text>
  <text x="282" y="452" class="s" style="font-size: 12.5px; fill: #374151">매입 중간 단계(<tspan font-family="Menlo, Consolas, monospace" font-size="11.5">REQUESTED</tspan> 등)를</text>
  <text x="282" y="470" class="s" style="font-size: 12.5px; fill: #374151">표현하지 못함</text>
  <g transform="translate(524,74)"><rect x="0" y="0" width="22" height="14" rx="4" fill="#bfdbfe" class="o"/><rect x="9" y="6" width="22" height="14" rx="4" fill="#fdba74" class="o"/></g>
  <text x="564" y="90" class="t">두 필드로 나누기</text>
  <text x="526" y="112" class="s">토스페이먼츠 결제 객체와 같은 방식</text>
  <rect x="526" y="146" width="196" height="52" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="624" y="166" class="s m" text-anchor="middle">status</text>
  <text x="624" y="186" class="t m" text-anchor="middle" style="font-size: 11.5px; font-weight: 400">IN_PROGRESS·DONE…</text>
  <rect x="526" y="208" width="196" height="52" rx="8" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <text x="624" y="228" class="s m" text-anchor="middle">acquireStatus</text>
  <text x="624" y="248" class="t m" text-anchor="middle" style="font-size: 11.5px; font-weight: 400">REQUESTED·COMPLETED…</text>
  <text x="624" y="287" class="s" text-anchor="middle">결제 상태와 매입 상태를 따로</text>
  <rect x="526" y="330" width="196" height="50" rx="8" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <text x="624" y="351" class="t13" text-anchor="middle">두 필드를 함께 봐야</text>
  <text x="624" y="370" class="t13" text-anchor="middle">취소 방향이 정해짐</text>
  <text x="526" y="452" class="s" style="font-size: 12.5px; fill: #374151">매입 중간 상태를 PG에서 받아</text>
  <text x="526" y="470" class="s" style="font-size: 12.5px; fill: #374151">대사에 써야 할 때</text>
</svg>
