  <text x="24" y="338" class="gs" style="font-size:11.5px">한 줄씩 나눠 보내기는 운영의 약 1.5~1.8배지만 순서 위반 결제가 2~8건, 잠그지 않음은 처리량이 늘지 않고 같은 일을 두 번 함</text>
  <text x="24" y="358" class="gs" style="font-size:11.5px">운영 릴레이는 건마다 브로커의 답을 기다림 — 88~98건/초가 이 장 릴레이 한 대의 상한으로 보임(다른 조건은 재지 않음)</text>
