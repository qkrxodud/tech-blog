  <rect width="760" height="446" fill="#ffffff"/>
  <text x="24" y="30" class="h">같은 취소 묶음 — 결제 12건, 고객이 뜻한 PG 취소 14건</text>
  <text x="24" y="52" class="gs"><tspan class="m">./gradlew cancelMeasurement</tspan> · 모두 15000원 승인 결제 · 부분 취소 5000원 · 구현마다 같은 묶음</text>
  <text x="408" y="84" class="gs" text-anchor="middle" style="font-size:11px">결제</text>
  <text x="470" y="84" class="gs" text-anchor="middle" style="font-size:11px">뜻한 취소</text>
