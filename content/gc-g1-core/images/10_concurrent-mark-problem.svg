<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>A, B, D를 marking 한 뒤 애플리케이션이 A에서 D 대신 E를 참조하게 하고 C에서 E로 가는 참조를 끊으면, C까지 marking 해도 살아 있는 E는 방문되지 않고 참조가 끊긴 D는 marking 된 채 남는다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
    .monob { font-family: Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #1f2937; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .lbl { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .rE { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .rS { fill: #ffffff; stroke: #16a34a; stroke-width: 1.8; }
    .rO { fill: #e5e7eb; stroke: #6b7280; stroke-width: 1.5; }
    .rH { fill: #9ca3af; stroke: #4b5563; stroke-width: 1.5; }
    .rF { fill: #ffffff; stroke: #c4c8ce; stroke-width: 1.2; }
    .rR { fill: #fafafa; stroke: #c4c8ce; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .tE { font-size: 13px; font-weight: 700; fill: #15803d; }
    .tS { font-size: 13px; font-weight: 700; fill: #15803d; }
    .tO { font-size: 13px; font-weight: 700; fill: #374151; }
    .tH { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .tF { font-size: 11px; fill: #9ca3af; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .dl { stroke: #9ca3af; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="512" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="492" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">concurrent mark의 문제점 — marking 도중 참조가 바뀜</text>
  <rect x="22" y="54" width="356" height="190" rx="10" class="track"/>
  <text x="36" y="78" class="lbl">① A, B, D를 marking</text>
  <line x1="84.0" y1="124.0" x2="124.0" y2="124.0" class="al" marker-end="url(#ar)"/>
  <line x1="159.0" y1="124.0" x2="209.0" y2="124.0" class="al" marker-end="url(#ar)"/>
  <line x1="244.0" y1="124.0" x2="294.0" y2="124.0" class="al" marker-end="url(#ar)"/>
  <line x1="152.07063765811782" y1="137.69606721504022" x2="181.3369718914047" y2="177.49828177231035" class="al" marker-end="url(#ar)"/>
  <line x1="318.861883511797" y1="139.55360262673986" x2="334.7344762816267" y2="175.5314795716872" class="al" marker-end="url(#ar)"/>
  <rect x="40" y="109" width="44" height="30" rx="5" class="dbbox"/>
  <text x="62" y="129" class="sub" text-anchor="middle">root</text>
  <circle cx="142" cy="124" r="16" fill="#d1d5db" stroke="#4b5563" stroke-width="2"/>
  <text x="142" y="129" class="db" text-anchor="middle">A</text>
  <circle cx="227" cy="124" r="16" fill="#d1d5db" stroke="#4b5563" stroke-width="2"/>
  <text x="227" y="129" class="db" text-anchor="middle">B</text>
  <circle cx="312" cy="124" r="16" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="312" y="129" class="val" text-anchor="middle">C</text>
  <circle cx="192" cy="192" r="16" fill="#d1d5db" stroke="#4b5563" stroke-width="2"/>
  <text x="192" y="197" class="db" text-anchor="middle">D</text>
  <circle cx="342" cy="192" r="16" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="342" y="197" class="val" text-anchor="middle">E</text>
  <rect x="386" y="54" width="356" height="190" rx="10" class="track"/>
  <text x="400" y="78" class="lbl">② 애플리케이션: A → E 추가, A → D 끊음</text>
  <line x1="448.0" y1="124.0" x2="488.0" y2="124.0" class="al" marker-end="url(#ar)"/>
  <line x1="523.0" y1="124.0" x2="573.0" y2="124.0" class="al" marker-end="url(#ar)"/>
  <line x1="608.0" y1="124.0" x2="658.0" y2="124.0" class="al" marker-end="url(#ar)"/>
  <line x1="682.861883511797" y1="139.55360262673986" x2="698.7344762816267" y2="175.5314795716872" class="al" marker-end="url(#ar)"/>
  <line x1="522.0951366619352" y1="129.47234646505794" x2="688.9580905932452" y2="186.20575080170335" class="gl" marker-end="url(#agr)"/>
  <line x1="516.0706376581178" y1="137.69606721504022" x2="545.3369718914047" y2="177.49828177231035" class="rl" marker-end="url(#arr)"/>
  <text x="531.0" y="163.0" class="badt" text-anchor="middle">✕</text>
  <rect x="404" y="109" width="44" height="30" rx="5" class="dbbox"/>
  <text x="426" y="129" class="sub" text-anchor="middle">root</text>
  <circle cx="506" cy="124" r="16" fill="#d1d5db" stroke="#4b5563" stroke-width="2"/>
  <text x="506" y="129" class="db" text-anchor="middle">A</text>
  <circle cx="591" cy="124" r="16" fill="#d1d5db" stroke="#4b5563" stroke-width="2"/>
  <text x="591" y="129" class="db" text-anchor="middle">B</text>
  <circle cx="676" cy="124" r="16" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="676" y="129" class="val" text-anchor="middle">C</text>
  <circle cx="556" cy="192" r="16" fill="#d1d5db" stroke="#4b5563" stroke-width="2"/>
  <text x="556" y="197" class="db" text-anchor="middle">D</text>
  <circle cx="706" cy="192" r="16" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="706" y="197" class="val" text-anchor="middle">E</text>
  <rect x="22" y="256" width="356" height="190" rx="10" class="track"/>
  <text x="36" y="280" class="lbl">③ 애플리케이션: C → E 끊음</text>
  <line x1="84.0" y1="326.0" x2="124.0" y2="326.0" class="al" marker-end="url(#ar)"/>
  <line x1="159.0" y1="326.0" x2="209.0" y2="326.0" class="al" marker-end="url(#ar)"/>
  <line x1="244.0" y1="326.0" x2="294.0" y2="326.0" class="al" marker-end="url(#ar)"/>
  <line x1="158.09513666193513" y1="331.47234646505797" x2="324.9580905932452" y2="388.20575080170335" class="al" marker-end="url(#ar)"/>
  <line x1="318.861883511797" y1="341.55360262673986" x2="334.7344762816267" y2="377.5314795716872" class="rl" marker-end="url(#arr)"/>
  <text x="327.0" y="365.0" class="badt" text-anchor="middle">✕</text>
  <rect x="40" y="311" width="44" height="30" rx="5" class="dbbox"/>
  <text x="62" y="331" class="sub" text-anchor="middle">root</text>
  <circle cx="142" cy="326" r="16" fill="#d1d5db" stroke="#4b5563" stroke-width="2"/>
  <text x="142" y="331" class="db" text-anchor="middle">A</text>
  <circle cx="227" cy="326" r="16" fill="#d1d5db" stroke="#4b5563" stroke-width="2"/>
  <text x="227" y="331" class="db" text-anchor="middle">B</text>
  <circle cx="312" cy="326" r="16" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="312" y="331" class="val" text-anchor="middle">C</text>
  <circle cx="192" cy="394" r="16" fill="#d1d5db" stroke="#4b5563" stroke-width="2"/>
  <text x="192" y="399" class="db" text-anchor="middle">D</text>
  <circle cx="342" cy="394" r="16" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="342" y="399" class="val" text-anchor="middle">E</text>
  <rect x="386" y="256" width="356" height="190" rx="10" class="track"/>
  <text x="400" y="280" class="lbl">④ C를 marking — 결과는?</text>
  <line x1="448.0" y1="326.0" x2="488.0" y2="326.0" class="al" marker-end="url(#ar)"/>
  <line x1="523.0" y1="326.0" x2="573.0" y2="326.0" class="al" marker-end="url(#ar)"/>
  <line x1="608.0" y1="326.0" x2="658.0" y2="326.0" class="al" marker-end="url(#ar)"/>
  <line x1="522.0951366619352" y1="331.47234646505797" x2="688.9580905932452" y2="388.20575080170335" class="al" marker-end="url(#ar)"/>
  <rect x="404" y="311" width="44" height="30" rx="5" class="dbbox"/>
  <text x="426" y="331" class="sub" text-anchor="middle">root</text>
  <circle cx="506" cy="326" r="16" fill="#d1d5db" stroke="#4b5563" stroke-width="2"/>
  <text x="506" y="331" class="db" text-anchor="middle">A</text>
  <circle cx="591" cy="326" r="16" fill="#d1d5db" stroke="#4b5563" stroke-width="2"/>
  <text x="591" y="331" class="db" text-anchor="middle">B</text>
  <circle cx="676" cy="326" r="16" fill="#d1d5db" stroke="#4b5563" stroke-width="2"/>
  <text x="676" y="331" class="db" text-anchor="middle">C</text>
  <circle cx="556" cy="394" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="556" y="399" class="badt" text-anchor="middle">D</text>
  <circle cx="706" cy="394" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="706" y="399" class="badt" text-anchor="middle">E</text>
  <circle cx="40" cy="470" r="8" fill="#d1d5db" stroke="#4b5563" stroke-width="2"/>
  <text x="54" y="475" class="sub">marking 됨</text>
  <circle cx="150" cy="470" r="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="164" y="475" class="sub">방문 전</text>
  <text x="240" y="475" class="note">④ D는 참조가 끊겼는데 marking 됨, E는 A가 참조하는데 방문되지 않음</text>
</svg>
