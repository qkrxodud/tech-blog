<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>위는 AccountController 하나가 다섯 개의 포트를 모두 의존하고 AccountResource를 공유하는 구조이고, 아래는 연산마다 별도 패키지의 컨트롤러가 포트 하나와 전용 모델만 가지는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 12px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .msg { font-size: 11.5px; fill: #374151; }
    .hd { font-size: 10.5px; fill: #374151; }
    .gmsg { font-size: 11.5px; fill: #15803d; }
    .rmsg { font-size: 11.5px; fill: #b91c1c; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .pkg { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .life { stroke: #c4c8ce; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .act { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.2; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .hint { font-size: 12px; fill: #6b7280; font-family: Menlo, Consolas, monospace; }
    .cd { font-size: 14px; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opmx { font-size: 12px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6b7280" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect width="760" height="570" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="262" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">하나의 컨트롤러 — 포트 다섯 개와 공유 모델</text>
  <text x="730" y="42" class="code" text-anchor="end">AccountController</text>
  <rect x="30" y="60" width="250" height="116" rx="8" class="hold"/>
  <text x="155" y="85" class="opm" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">AccountController</tspan></text>
  <text x="155" y="104" class="ms" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">listAccounts()</tspan></text>
  <text x="155" y="123" class="ms" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">getAccount()</tspan></text>
  <text x="155" y="142" class="ms" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">getAccountBalance()</tspan></text>
  <text x="155" y="161" class="s" text-anchor="middle">...</text>
  <rect x="30" y="192" width="250" height="56" rx="8" class="bad"/>
  <text x="155" y="215.5" class="badm" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">AccountResource</tspan></text>
  <text x="155" y="234.5" class="rmsg" text-anchor="middle">여러 연산이 공유하는 모델</text>
  <line x1="155" y1="177" x2="155" y2="189" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="334" y="60" width="200" height="30" rx="6" class="box"/>
  <text x="434" y="80" class="msg" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">GetAccountBalanceQuery</tspan></text>
  <line x1="282" y1="118" x2="331" y2="75" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="334" y="98" width="200" height="30" rx="6" class="box"/>
  <text x="434" y="118" class="msg" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">ListAccountsQuery</tspan></text>
  <line x1="282" y1="118" x2="331" y2="113" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="334" y="136" width="200" height="30" rx="6" class="box"/>
  <text x="434" y="156" class="msg" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">LoadAccountQuery</tspan></text>
  <line x1="282" y1="118" x2="331" y2="151" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="334" y="174" width="200" height="30" rx="6" class="box"/>
  <text x="434" y="194" class="msg" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">SendMoneyUseCase</tspan></text>
  <line x1="282" y1="118" x2="331" y2="189" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="334" y="212" width="200" height="30" rx="6" class="box"/>
  <text x="434" y="232" class="msg" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">CreateAccountUseCase</tspan></text>
  <line x1="282" y1="118" x2="331" y2="227" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="556" y="90" class="note">클래스와 테스트 코드가</text>
  <text x="556" y="108" class="note">함께 커집니다.</text>
  <text x="556" y="146" class="note">연산마다 필요 없는 필드도</text>
  <text x="556" y="164" class="note">공유 모델에 따라옵니다.</text>
  <text x="556" y="202" class="note">예: create 연산에는</text>
  <text x="556" y="220" class="note">id 필드가 필요 없습니다.</text>
  <rect x="10" y="288" width="740" height="272" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="320" class="h">연산별 컨트롤러 — 패키지마다 포트 하나와 전용 모델</text>
  <rect x="30" y="336" width="700" height="56" rx="8" class="scope"/>
  <rect x="44" y="345" width="220" height="38" rx="6" class="box"/>
  <text x="154" y="369" class="opm" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">SendMoneyController</tspan></text>
  <rect x="306" y="345" width="210" height="38" rx="6" class="box"/>
  <text x="411" y="369" class="msg" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">SendMoneyUseCase</tspan></text>
  <rect x="546" y="345" width="170" height="38" rx="6" class="ok"/>
  <text x="631" y="369" class="val" text-anchor="middle">원시값 <tspan font-family="Menlo, Consolas, monospace">Long</tspan> 3개</text>
  <line x1="266" y1="364" x2="303" y2="364" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="30" y="400" width="700" height="56" rx="8" class="scope"/>
  <rect x="44" y="409" width="220" height="38" rx="6" class="box"/>
  <text x="154" y="433" class="t" text-anchor="middle">계좌 생성 컨트롤러</text>
  <rect x="306" y="409" width="210" height="38" rx="6" class="box"/>
  <text x="411" y="433" class="msg" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">CreateAccountUseCase</tspan></text>
  <rect x="546" y="409" width="170" height="38" rx="6" class="ok"/>
  <text x="631" y="433" class="msg" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">CreateAccountResource</tspan></text>
  <line x1="266" y1="428" x2="303" y2="428" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="30" y="464" width="700" height="56" rx="8" class="scope"/>
  <rect x="44" y="473" width="220" height="38" rx="6" class="box"/>
  <text x="154" y="497" class="t" text-anchor="middle">잔고 조회 컨트롤러</text>
  <rect x="306" y="473" width="210" height="38" rx="6" class="box"/>
  <text x="411" y="497" class="msg" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">GetAccountBalanceQuery</tspan></text>
  <rect x="546" y="473" width="170" height="38" rx="6" class="ok"/>
  <text x="631" y="497" class="val" text-anchor="middle">전용 모델 또는 원시값</text>
  <line x1="266" y1="492" x2="303" y2="492" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="30" y="544" class="foot">점선은 별도 패키지입니다. 전용 모델은 패키지 안에서만 쓰도록 private으로 둘 수 있습니다.</text>
</svg>
