<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>생성자로 Boolean을 만들면 호출마다 새 인스턴스가 생기고, Boolean.valueOf는 미리 만들어 둔 TRUE와 FALSE 중 하나를 반환하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .pool { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .life { stroke: #c4c8ce; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="170" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">생성자 — 호출할 때마다 새 인스턴스를 만든다</text>
  <rect x="30" y="62" width="280" height="40" rx="8" class="box"/>
  <text x="170" y="87" class="opm" text-anchor="middle">isTrue = new Boolean(true)</text>
  <rect x="30" y="114" width="280" height="40" rx="8" class="box"/>
  <text x="170" y="139" class="opm" text-anchor="middle">isFalse = new Boolean(false)</text>
  <line x1="312" y1="82" x2="406" y2="82" class="flow" marker-end="url(#ag)"/>
  <line x1="312" y1="134" x2="406" y2="134" class="flow" marker-end="url(#ag)"/>
  <text x="360" y="74" class="s" text-anchor="middle">new</text>
  <text x="360" y="126" class="s" text-anchor="middle">new</text>
  <rect x="410" y="62" width="200" height="40" rx="8" class="hold"/>
  <text x="510" y="87" class="t" text-anchor="middle">새 Boolean 인스턴스</text>
  <rect x="410" y="114" width="200" height="40" rx="8" class="hold"/>
  <text x="510" y="139" class="t" text-anchor="middle">새 Boolean 인스턴스</text>

  <rect x="10" y="196" width="740" height="214" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="228" class="h">정적 팩터리 — 미리 만들어 둔 인스턴스를 돌려준다</text>
  <rect x="30" y="250" width="280" height="40" rx="8" class="box"/>
  <text x="170" y="275" class="opm" text-anchor="middle">isTrue = Boolean.valueOf(true)</text>
  <rect x="30" y="318" width="280" height="40" rx="8" class="box"/>
  <text x="170" y="343" class="opm" text-anchor="middle">isFalse = Boolean.valueOf(false)</text>
  <rect x="346" y="250" width="176" height="108" rx="10" class="box"/>
  <text x="434" y="290" class="opm" text-anchor="middle">valueOf(b)</text>
  <text x="434" y="314" class="opm" text-anchor="middle">b ? TRUE : FALSE</text>
  <line x1="312" y1="270" x2="342" y2="270" class="flow" marker-end="url(#ag)"/>
  <line x1="312" y1="338" x2="342" y2="338" class="flow" marker-end="url(#ag)"/>
  <rect x="566" y="250" width="164" height="44" rx="8" class="ok"/>
  <text x="648" y="268" class="okm" text-anchor="middle">TRUE</text>
  <text x="648" y="286" class="s" text-anchor="middle">static final 인스턴스</text>
  <rect x="566" y="314" width="164" height="44" rx="8" class="ok"/>
  <text x="648" y="332" class="okm" text-anchor="middle">FALSE</text>
  <text x="648" y="350" class="s" text-anchor="middle">static final 인스턴스</text>
  <line x1="524" y1="272" x2="562" y2="272" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="524" y1="336" x2="562" y2="336" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="390" class="gnote">valueOf()는 새 객체를 만들지 않고, 클래스에 미리 만들어 둔 TRUE·FALSE 중 하나를 반환합니다.</text>
</svg>
