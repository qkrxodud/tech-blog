<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>6장 출발 코드의 웹훅 문제 네 장면 — 승인 알림이 승인 답보다 먼저 와서 결제를 APPROVED로 바꾸면 늦게 온 승인 답 기록이 Cannot APPROVE a payment in APPROVED status.로 막히고, 승인된 결제에 같은 승인 알림이 두 번 오면 두 번 모두 409로 답해 PG가 다시 보내며, PG 기록과 다른 위조 취소 알림으로 결제가 APPROVAL_CANCELED가 되고, PG에서만 일어난 5000원 부분 취소 알림은 무시되어 우리 남은 금액 15000원과 PG 잔액 10000원이 어긋난다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #4b5563; }
    .m { font-family: Menlo, Consolas, monospace; }
    .lbl { font-size: 12px; fill: #4b5563; }
    .tab { font-size: 12.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .badt { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .bads { font-size: 12px; fill: #b91c1c; }
    .okt { font-size: 13px; font-weight: 700; fill: #15803d; }
    .oks { font-size: 12px; fill: #15803d; }
    .gt { font-size: 13px; font-weight: 700; fill: #6b7280; }
    .gs { font-size: 12px; fill: #6b7280; }
    .ot { font-size: 13px; font-weight: 700; fill: #c2410c; }
    .os { font-size: 12px; fill: #c2410c; }
    .bt { font-size: 13px; font-weight: 700; fill: #1e3a8a; }
    .bs { font-size: 12px; fill: #1e3a8a; }
    .o { stroke: #1f2937; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .spine { stroke: #1f2937; stroke-width: 1.5; fill: none; }
    .life { stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .run { stroke-dasharray: 5 4; animation: run 0.9s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -18; } }
    @media (prefers-reduced-motion: reduce) { .run { animation: none; } .anim { display: none; } }
  </style>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="aor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
    <marker id="abl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <g id="pkt">
      <rect x="-11" y="-8" width="22" height="16" rx="3" fill="#2dd4bf" stroke="#0f766e" stroke-width="1.5"/>
      <path d="M-10,-7 L0,1 L10,-7" fill="none" stroke="#0f766e" stroke-width="1.5"/>
    </g>
    <g id="pkt2">
      <rect x="-11" y="-8" width="22" height="16" rx="3" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/>
      <path d="M-10,-7 L0,1 L10,-7" fill="none" stroke="#c2410c" stroke-width="1.5"/>
    </g>
    <g id="xmark"><circle r="9" fill="#ef4444"/><path d="M-4,-4 L4,4 M4,-4 L-4,4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
    <g id="vmark"><circle r="9" fill="#22c55e"/><path d="M-4.5,0 L-1.5,3.5 L4.5,-3.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="xs"><circle r="7" fill="#ef4444"/><path d="M-3,-3 L3,3 M3,-3 L-3,3" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></g>
    <g id="vs"><circle r="7" fill="#22c55e"/><path d="M-3.5,0 L-1,2.8 L3.5,-2.8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="i-card"><rect x="0" y="3" width="32" height="22" rx="4" fill="#5eead4" class="o"/><rect x="0" y="8" width="32" height="5" fill="#1f2937"/><rect x="4" y="16" width="8" height="6" rx="1.5" fill="#fbbf24" class="o" stroke-width="1"/></g>
    <g id="i-app"><rect x="0" y="0" width="30" height="30" rx="5" fill="#93c5fd" class="o"/><path d="M0,9 h30" class="o" fill="none"/><circle cx="5" cy="4.5" r="1.4" fill="#1f2937"/><circle cx="10" cy="4.5" r="1.4" fill="#1f2937"/><path d="M7,16 h16 M7,22 h11" stroke="#1e3a8a" stroke-width="1.6" stroke-linecap="round"/></g>
    <g id="i-db"><path d="M1,5 v20 a13,5 0 0 0 26,0 v-20 a13,5 0 0 1 -26,0 z" fill="#60a5fa" class="o"/><path d="M1,15 a13,5 0 0 0 26,0" fill="none" class="o"/><ellipse cx="14" cy="5" rx="13" ry="5" fill="#bfdbfe" class="o"/></g>
    <g id="i-server"><rect x="0" y="0" width="36" height="13" rx="3" fill="#cbd5e1" class="o"/><rect x="0" y="16" width="36" height="13" rx="3" fill="#cbd5e1" class="o"/><circle cx="7" cy="6.5" r="2.2" fill="#22c55e"/><circle cx="7" cy="22.5" r="2.2" fill="#22c55e"/><path d="M14,6.5 h16 M14,22.5 h16" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/></g>
    <g id="i-coin"><circle cx="12" cy="12" r="11" fill="#fbbf24" class="o"/><circle cx="12" cy="12" r="7" fill="#fcd34d" stroke="#b45309" stroke-width="1"/><text x="12" y="16.5" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">₩</text></g>
    <g id="i-key"><circle cx="8" cy="12" r="7.5" fill="#fbbf24" class="o"/><circle cx="8" cy="12" r="2.6" fill="#ffffff" class="o" stroke-width="1.2"/><path d="M15.5,12 H30 V17.5 M25,12 V16.5" fill="none" class="o" stroke-width="2"/></g>
    <g id="i-clock"><circle cx="14" cy="14" r="13" fill="#fde68a" class="o"/><path d="M14,7 V14 L20,18" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/></g>
    <g id="i-chips"><rect x="0" y="4" width="13" height="14" rx="4" fill="#e5e7eb" class="o"/><rect x="21" y="4" width="13" height="14" rx="4" fill="#86efac" class="o"/><path d="M14,11 h6" class="o" fill="none"/><path d="M17,8 l3,3 l-3,3" class="o" fill="none"/></g>
    <g id="i-plane"><path d="M1,13 L31,1 L23,29 L15,19 Z" fill="#fdba74" class="o"/><path d="M15,19 L31,1 L11,16 Z" fill="#fb923c" class="o"/></g>
    <g id="i-doc"><path d="M0,0 h18 l8,8 v26 h-26 z" fill="#ffffff" class="o"/><path d="M18,0 v8 h8" fill="#e5e7eb" class="o"/><circle cx="20" cy="26" r="8" fill="#22c55e" class="o"/><path d="M16.5,26 l2.5,2.5 l4.5,-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5,10 h9 M5,16 h7" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/></g>
    <g id="i-table"><rect x="0" y="0" width="30" height="26" rx="3" fill="#ffffff" class="o"/><rect x="0" y="0" width="30" height="7" rx="3" fill="#60a5fa" class="o"/><path d="M0,13.5 h30 M0,20 h30 M11,7 v19" stroke="#1f2937" stroke-width="1.2"/></g>
    <g id="i-search"><circle cx="11" cy="11" r="9" fill="#bae6fd" class="o"/><path d="M18,18 L27,27" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/></g>
    <g id="i-chart"><rect x="0" y="16" width="7" height="12" fill="#93c5fd" class="o"/><rect x="10" y="8" width="7" height="20" fill="#60a5fa" class="o"/><rect x="20" y="2" width="7" height="26" fill="#2563eb" class="o"/></g>
    <g id="i-bell"><path d="M14,3 C8.5,3 6,7.5 6,13 V19 L3,23 H25 L22,19 V13 C22,7.5 19.5,3 14,3 Z" fill="#fde047" class="o"/><circle cx="14" cy="26" r="3" fill="#f59e0b" class="o"/></g>
    <g id="i-warn"><path d="M14,2 L27,25 H1 Z" fill="#fca5a5" class="o"/><path d="M14,10 V17" stroke="#7f1d1d" stroke-width="2.2" stroke-linecap="round"/><circle cx="14" cy="21" r="1.5" fill="#7f1d1d"/></g>
    <g id="i-lock"><path d="M7,12 V8 a7,7 0 0 1 14,0 V12" fill="none" class="o" stroke-width="2.2"/><rect x="3" y="12" width="22" height="16" rx="3" fill="#fbbf24" class="o"/><circle cx="14" cy="20" r="2.4" fill="#1f2937"/></g>
  </defs>
  <rect width="760" height="620" fill="#ffffff"/>
  <text x="24" y="30" class="h">6장 출발 코드의 웹훅 — 본문의 상태를 그 자리에서 전이 표대로 옮길 때</text>
  <text x="24" y="52" class="s">결제 15000원 · 부분 취소 5000원 · 받은 요청 안에서 <tspan class="m">report(GatewayStatus.of(status))</tspan></text>
  <rect x="14" y="66" width="732" height="128" rx="14" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <g transform="translate(26,73) scale(0.82)"><use href="#i-clock"/></g>
  <text x="60" y="92" class="t2">① 승인 알림이 승인 답보다 먼저</text>
  <rect x="30" y="106" width="146" height="60" rx="10" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <circle cx="30" cy="106" r="11" fill="#111827"/><text x="30" y="110" class="num" text-anchor="middle">1</text>
  <text x="44" y="127" class="t2">PG 승인 · 알림</text>
  <text x="44" y="144" class="s">승인 답은 붙잡아 둠</text>
  <line x1="178" y1="136" x2="199" y2="136" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="202" y="106" width="146" height="60" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="202" cy="106" r="11" fill="#111827"/><text x="202" y="110" class="num" text-anchor="middle">2</text>
  <text x="216" y="127" class="t2">알림이 먼저 반영</text>
  <text x="216" y="144" class="s"><tspan class="m">DONE</tspan> → <tspan class="m">APPROVED</tspan></text>
  <line x1="350" y1="136" x2="371" y2="136" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="374" y="106" width="146" height="60" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="374" cy="106" r="11" fill="#111827"/><text x="374" y="110" class="num" text-anchor="middle">3</text>
  <text x="388" y="127" class="t2">늦게 온 승인 답</text>
  <text x="388" y="144" class="s"><tspan class="m">recordApproval</tspan></text>
  <text x="388" y="159" class="s">다시 승인 전이</text>
  <line x1="522" y1="136" x2="543" y2="136" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="546" y="106" width="190" height="60" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.2"/>
  <use href="#xmark" x="564" y="123"/>
  <text x="580" y="128" class="badt">답 기록이 막힘</text>
  <text x="560" y="145" class="bads">전이 표에 없는 전이</text>
  <text x="30" y="184" class="bads">늦게 온 답 기록 — <tspan class="m">Cannot APPROVE a payment in APPROVED status.</tspan></text>
  <rect x="14" y="204" width="732" height="128" rx="14" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <g transform="translate(26,211) scale(0.82)"><use href="#i-bell"/></g>
  <text x="60" y="230" class="t2">② 승인된 결제에 같은 승인 알림이 두 번</text>
  <rect x="30" y="244" width="146" height="60" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <circle cx="30" cy="244" r="11" fill="#111827"/><text x="30" y="248" class="num" text-anchor="middle">1</text>
  <text x="44" y="265" class="t2">승인된 결제</text>
  <text x="44" y="282" class="s"><tspan class="m">APPROVED</tspan></text>
  <line x1="178" y1="274" x2="199" y2="274" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="202" y="244" width="146" height="60" rx="10" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <circle cx="202" cy="244" r="11" fill="#111827"/><text x="202" y="248" class="num" text-anchor="middle">2</text>
  <text x="216" y="265" class="t2">같은 승인 알림</text>
  <text x="216" y="282" class="s">본문 <tspan class="m">DONE</tspan>, 두 번</text>
  <line x1="350" y1="274" x2="371" y2="274" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="374" y="244" width="146" height="60" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="374" cy="244" r="11" fill="#111827"/><text x="374" y="248" class="num" text-anchor="middle">3</text>
  <text x="388" y="265" class="t2">다시 승인 전이</text>
  <text x="388" y="282" class="s"><tspan class="m">APPROVE</tspan> → 표에 없음</text>
  <line x1="522" y1="274" x2="543" y2="274" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="546" y="244" width="190" height="60" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.2"/>
  <use href="#xmark" x="564" y="261"/>
  <text x="580" y="266" class="badt">두 번 모두 409</text>
  <text x="560" y="283" class="bads"><tspan class="m">[409, 409]</tspan></text>
  <text x="30" y="322" class="gs">200이 아니면 PG는 같은 알림을 7번까지 다시 보냅니다</text>
  <rect x="14" y="342" width="732" height="128" rx="14" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <g transform="translate(26,349) scale(0.82)"><use href="#i-warn"/></g>
  <text x="60" y="368" class="t2">③ PG 기록과 다른 위조 취소 알림</text>
  <rect x="30" y="382" width="146" height="60" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <circle cx="30" cy="382" r="11" fill="#111827"/><text x="30" y="386" class="num" text-anchor="middle">1</text>
  <text x="44" y="403" class="t2">승인된 결제</text>
  <text x="44" y="420" class="s">PG 상태 <tspan class="m">DONE</tspan></text>
  <line x1="178" y1="412" x2="199" y2="412" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="202" y="382" width="146" height="60" rx="10" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <circle cx="202" cy="382" r="11" fill="#111827"/><text x="202" y="386" class="num" text-anchor="middle">2</text>
  <text x="216" y="403" class="t2">위조 취소 알림</text>
  <text x="216" y="420" class="s">본문 <tspan class="m">CANCELED</tspan></text>
  <line x1="350" y1="412" x2="371" y2="412" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="374" y="382" width="146" height="60" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="374" cy="382" r="11" fill="#111827"/><text x="374" y="386" class="num" text-anchor="middle">3</text>
  <text x="388" y="403" class="t2">본문대로 전이</text>
  <text x="388" y="420" class="s"><tspan class="m">cancel()</tspan></text>
  <line x1="522" y1="412" x2="543" y2="412" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="546" y="382" width="190" height="60" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.2"/>
  <use href="#xmark" x="564" y="399"/>
  <text x="580" y="404" class="badt">PG와 어긋남</text>
  <text x="560" y="421" class="bads"><tspan class="m">APPROVAL_CANCELED</tspan></text>
  <text x="560" y="436" class="bads">PG는 승인 그대로</text>
  <text x="30" y="460" class="gs">PG에 기록이 없는 결과 모름 결제도 위조 승인 알림으로 <tspan class="m">APPROVED</tspan>가 되었습니다</text>
  <rect x="14" y="480" width="732" height="128" rx="14" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <g transform="translate(26,487) scale(0.82)"><use href="#i-server"/></g>
  <text x="60" y="506" class="t2">④ PG에서만 일어난 5000원 부분 취소</text>
  <rect x="30" y="520" width="146" height="60" rx="10" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <circle cx="30" cy="520" r="11" fill="#111827"/><text x="30" y="524" class="num" text-anchor="middle">1</text>
  <text x="44" y="541" class="t2">PG에서만 부분 취소</text>
  <text x="44" y="558" class="s"><tspan class="m">PARTIAL_CANCELED</tspan></text>
  <line x1="178" y1="550" x2="199" y2="550" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="202" y="520" width="146" height="60" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="202" cy="520" r="11" fill="#111827"/><text x="202" y="524" class="num" text-anchor="middle">2</text>
  <text x="216" y="541" class="t2">알림을 무시</text>
  <text x="216" y="558" class="s"><tspan class="m">reportedAction()</tspan></text>
  <text x="216" y="573" class="s">부분 취소는 옮기지 않음</text>
  <line x1="350" y1="550" x2="371" y2="550" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="374" y="520" width="146" height="60" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="374" cy="520" r="11" fill="#111827"/><text x="374" y="524" class="num" text-anchor="middle">3</text>
  <text x="388" y="541" class="t2">취소 기록 없음</text>
  <text x="388" y="558" class="s">우리 남은 금액 15000원</text>
  <line x1="522" y1="550" x2="543" y2="550" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="546" y="520" width="190" height="60" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.2"/>
  <use href="#xmark" x="564" y="537"/>
  <text x="580" y="542" class="badt">잔액이 다름</text>
  <text x="560" y="559" class="bads">우리 15000원 · PG 10000원</text>
  <text x="30" y="598" class="gs">취소 알림이 먼저 온 테스트도 취소 기록이 없어 남은 금액이 15000원으로 남았습니다</text>
</svg>
