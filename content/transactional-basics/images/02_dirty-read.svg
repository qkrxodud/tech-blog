<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>userA 트랜잭션이 커밋하기 전의 최고관리자 값을 userB 트랜잭션이 읽고, userA가 롤백해 값이 일반사용자로 돌아가는 Dirty Read 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .cellt { font-size: 14px; font-weight: 700; fill: #374151; }
    .colh { font-size: 13px; font-weight: 700; fill: #4b5563; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="280" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">READ_UNCOMMITTED — Dirty Read</text>
  <text x="730" y="42" class="code" text-anchor="end">isolation = READ_UNCOMMITTED</text>
  <text x="220" y="72" class="step" text-anchor="middle">1. 변경</text>
  <text x="360" y="72" class="step" text-anchor="middle">2. 조회</text>
  <text x="500" y="72" class="step" text-anchor="middle">3. 롤백</text>
  <text x="640" y="72" class="step" text-anchor="middle">4. 결과</text>
  <line x1="160" y1="80" x2="722" y2="80" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="110" class="lane">userA</text>
  <text x="30" y="128" class="sub">권한을 바꾸는 쪽</text>
  <rect x="150" y="88" width="585" height="52" rx="6" class="track"/>
  <rect x="155" y="90" width="130" height="48" rx="8" class="box"/>
  <text x="220" y="110" class="op" text-anchor="middle">UPDATE</text>
  <text x="220" y="129" class="val" text-anchor="middle">최고관리자, 미커밋</text>
  <rect x="435" y="90" width="130" height="48" rx="8" class="bad"/>
  <text x="500" y="110" class="badt" text-anchor="middle">예외 → 롤백</text>
  <text x="500" y="129" class="val" text-anchor="middle">일반사용자로 복구</text>
  <text x="30" y="170" class="lane">userB</text>
  <text x="30" y="188" class="sub">권한을 읽는 쪽</text>
  <rect x="150" y="148" width="585" height="52" rx="6" class="track"/>
  <rect x="295" y="150" width="130" height="48" rx="8" class="bad"/>
  <text x="360" y="170" class="badc" text-anchor="middle">SELECT</text>
  <text x="360" y="189" class="val" text-anchor="middle">최고관리자 읽음</text>
  <rect x="575" y="150" width="130" height="48" rx="8" class="bad"/>
  <text x="640" y="170" class="badt" text-anchor="middle">잘못된 권한</text>
  <text x="640" y="189" class="val" text-anchor="middle">최고관리자로 판단</text>
  <line x1="240" y1="140" x2="345" y2="150" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="30" y="235" class="db">권한 데이터</text>
  <rect x="170" y="214" width="100" height="32" rx="6" class="dbbox"/>
  <text x="220" y="235" class="db" text-anchor="middle">최고관리자</text>
  <rect x="310" y="214" width="100" height="32" rx="6" class="dbbox"/>
  <text x="360" y="235" class="db" text-anchor="middle">최고관리자</text>
  <rect x="450" y="214" width="100" height="32" rx="6" class="ok"/>
  <text x="500" y="235" class="okt" text-anchor="middle">일반사용자</text>
  <rect x="590" y="214" width="100" height="32" rx="6" class="ok"/>
  <text x="640" y="235" class="okt" text-anchor="middle">일반사용자</text>
  <text x="150" y="272" class="sub">userB는 커밋되지 않은 최고관리자 값을 읽었고, 그 값은 롤백으로 사라졌습니다.</text>

</svg>
