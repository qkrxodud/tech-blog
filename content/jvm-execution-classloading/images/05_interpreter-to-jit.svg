<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>인터프리터가 바이트코드를 해석하며 호출 횟수를 세다가, 자주 호출되는 메서드를 JIT 컴파일러가 기계어로 바꿔 Code Cache에 두고 이후에는 기계어를 직접 실행하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .ops { font-size: 12.5px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .link { stroke: #9ca3af; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .brk { stroke: #9ca3af; stroke-width: 1.4; fill: none; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .lbl { font-size: 12.5px; font-weight: 700; fill: #6b7280; }
    .lblc { font-size: 12px; font-weight: 700; fill: #6b7280; font-family: Menlo, Consolas, monospace; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="350" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="330" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">HotSpot — 해석하다가 자주 쓰이면 기계어로</text>
  <text x="730" y="42" class="code" text-anchor="end">superAmazingPopularMethod()</text>
  <text x="220" y="68" class="step" text-anchor="middle">1. 처음 호출</text>
  <text x="360" y="68" class="step" text-anchor="middle">2. 호출이 쌓임</text>
  <text x="500" y="68" class="step" text-anchor="middle">3. 컴파일</text>
  <text x="640" y="68" class="step" text-anchor="middle">4. 이후 호출</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">인터프리터</text>
  <text x="30" y="126" class="sub">바이트코드 해석</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <text x="30" y="174" class="lane">JIT 컴파일러</text>
  <text x="30" y="192" class="sub">별도 컴파일러 스레드</text>
  <rect x="150" y="152" width="585" height="52" rx="6" class="track"/>
  <text x="30" y="240" class="lane">Code Cache</text>
  <text x="30" y="258" class="sub">기계어 저장 영역</text>
  <rect x="150" y="218" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="108" class="t" text-anchor="middle">해석 실행</text>
  <text x="220" y="127" class="val" text-anchor="middle">명령어 하나씩</text>
  <rect x="302" y="88" width="116" height="48" rx="8" class="hold"/>
  <text x="360" y="108" class="t" text-anchor="middle">호출 횟수 집계</text>
  <text x="360" y="127" class="val" text-anchor="middle">메서드·반복문</text>
  <rect x="442" y="154" width="116" height="48" rx="8" class="box"/>
  <text x="500" y="174" class="t" text-anchor="middle">기계어로 컴파일</text>
  <text x="500" y="193" class="val" text-anchor="middle">최적화 포함</text>
  <rect x="442" y="220" width="116" height="48" rx="8" class="hold"/>
  <text x="500" y="240" class="t" text-anchor="middle">기계어 저장</text>
  <text x="500" y="259" class="val" text-anchor="middle">네이티브 코드</text>
  <rect x="582" y="220" width="116" height="48" rx="8" class="ok"/>
  <text x="640" y="240" class="okt" text-anchor="middle">직접 실행</text>
  <text x="640" y="259" class="val" text-anchor="middle">해석 없이 빠르게</text>
  <rect x="582" y="98" width="116" height="28" rx="6" class="wait"/>
  <text x="640" y="117" class="waitt" text-anchor="middle">해석하지 않음</text>
  <line x1="278" y1="112" x2="298" y2="112" class="flow" marker-end="url(#ag)"/>
  <line x1="400" y1="136" x2="470" y2="154" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="396" y="154" class="gnote" text-anchor="end">hot</text>
  <line x1="500" y1="202" x2="500" y2="218" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="558" y1="244" x2="578" y2="244" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="150" y="300" class="sub">자주 호출되는 영역(hotspot)만 골라 컴파일하기 때문에 HotSpot VM이라고 부릅니다. 컴파일 전까지는</text>
  <text x="150" y="318" class="sub">인터프리터가 계속 실행하므로, 컴파일은 실행을 멈추지 않고 뒤에서 진행됩니다.</text>
</svg>
