  <rect width="760" height="480" fill="#ffffff"/>
  <text x="24" y="30" class="h">측정 지표를 센 방법</text>
  <text x="24" y="52" class="gs">처음 재고는 20(재고 20개 상품) · 오른쪽은 본문에 나온 값</text>
  <rect x="24" y="68" width="124" height="54" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="86" y="100" class="bt" text-anchor="middle" style="font-size:12.5px">응답</text>
  <rect x="156" y="68" width="384" height="54" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="170" y="100" class="s2" style="font-size:11px">결제 준비와 승인 요청이 답할 때까지 · 구간마다 10건</text>
  <rect x="548" y="68" width="188" height="54" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="560" y="100" class="t2" style="font-size:11px">운영 늦음 중앙 1027~1038ms</text>
  <rect x="24" y="130" width="124" height="54" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="86" y="162" class="bt" text-anchor="middle" style="font-size:12.5px">승인 답</text>
  <rect x="156" y="130" width="384" height="54" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="170" y="162" class="s2" style="font-size:11px">고객이 받은 승인 답 수(뒤에 보상 취소된 것 포함)</text>
  <rect x="548" y="130" width="188" height="54" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="560" y="162" class="t2" style="font-size:11px">승인 먼저 30건(재고 20)</text>
  <rect x="24" y="192" width="124" height="54" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="86" y="224" class="t2" text-anchor="middle" style="font-size:12.5px">넘겨 판 수량</text>
  <rect x="156" y="192" width="384" height="54" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="170" y="224" class="s2" style="font-size:11px">승인이 남은 결제의 수량 − 처음 재고(0보다 작으면 0)</text>
  <rect x="548" y="192" width="188" height="54" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="560" y="224" class="t2" style="font-size:11px">모든 방식 0</text>
  <rect x="24" y="254" width="124" height="54" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="86" y="286" class="badt" text-anchor="middle" style="font-size:12.5px">어긋난 재고</text>
  <rect x="156" y="254" width="384" height="54" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="170" y="286" class="s2" style="font-size:11px">20초 뒤 (남은 재고 + 승인이 남은 수량) − 처음 재고</text>
  <rect x="548" y="254" width="188" height="54" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="560" y="286" class="t2" style="font-size:11px">실패로만 −10 · HTTP −5</text>
  <rect x="24" y="316" width="124" height="54" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="86" y="348" class="okt" text-anchor="middle" style="font-size:12.5px">맞춰진 때</text>
  <rect x="156" y="316" width="384" height="54" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="170" y="348" class="s2" style="font-size:11px">되돌린 때부터 그 합이 처음 재고와 같아질 때까지 · 100ms마다</text>
  <rect x="548" y="316" width="188" height="54" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="560" y="348" class="t2" style="font-size:11px">운영 352~716ms</text>
  <rect x="24" y="378" width="124" height="54" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="86" y="410" class="okt" text-anchor="middle" style="font-size:12.5px">원복</text>
  <rect x="156" y="378" width="384" height="54" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="170" y="410" class="s2" style="font-size:11px">승인 없이 끝나거나 취소된 결제의 요청부터 해제까지</text>
  <rect x="548" y="378" width="188" height="54" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="560" y="410" class="t2" style="font-size:11px">운영 중앙 302~626ms</text>
  <text x="24" y="454" class="bads" style="font-size:11px">어긋난 재고: 음수는 끝내 돌아오지 않은 재고, 양수는 처음보다 늘어난 재고(수량만 +10)</text>
  <text x="24" y="474" class="gs" style="font-size:11px">수량만과 승인 먼저는 예약 기록이 없어 원복을 재지 못함</text>
</svg>
