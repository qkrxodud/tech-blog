<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>컨트롤러 이름이 AOP 포인트컷에 걸리면 컨트롤러에서 트랜잭션이 시작되어 서비스가 그 안에서 실행되고, 이름을 Ctr로 바꾸면 포인트컷에서 빠져 서비스에서 트랜잭션이 시작되는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 13.5px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 13.5px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badw { fill: #ffffff; stroke: #dc2626; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .badt { font-size: 13.5px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="436" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="200" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">포인트컷 일치 — 컨트롤러에서 트랜잭션 시작</text>
  <text x="730" y="42" class="code" text-anchor="end">*Controller.*(..)</text>
  <rect x="30" y="62" width="460" height="132" rx="10" class="scope"/>
  <text x="46" y="84" class="sub">트랜잭션 범위 — 이름: 컨트롤러 이름</text>
  <rect x="50" y="100" width="170" height="56" rx="8" class="hold"/>
  <text x="135" y="124" class="op" text-anchor="middle">XxxController</text>
  <text x="135" y="144" class="val" text-anchor="middle">트랜잭션 시작</text>
  <rect x="290" y="100" width="180" height="56" rx="8" class="box"/>
  <text x="380" y="124" class="op" text-anchor="middle">XxxService</text>
  <text x="380" y="144" class="val" text-anchor="middle">같은 트랜잭션 안에서 실행</text>
  <line x1="222" y1="128" x2="288" y2="128" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="510" y="112" class="note"><tspan font-family="Menlo, Consolas, monospace">getCurrentTransactionName()</tspan></text>
  <text x="510" y="132" class="note">결과가 컨트롤러 이름</text>
  <rect x="10" y="226" width="740" height="200" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="258" class="h">이름을 Ctr로 변경 — 포인트컷에서 빠짐</text>
  <rect x="50" y="316" width="170" height="56" rx="8" class="box"/>
  <text x="135" y="340" class="op" text-anchor="middle">XxxCtr</text>
  <text x="135" y="360" class="val" text-anchor="middle">트랜잭션 없음</text>
  <rect x="270" y="278" width="220" height="132" rx="10" class="scope"/>
  <text x="286" y="300" class="sub">트랜잭션 범위</text>
  <rect x="290" y="316" width="180" height="56" rx="8" class="ok"/>
  <text x="380" y="340" class="okc" text-anchor="middle">XxxService</text>
  <text x="380" y="360" class="val" text-anchor="middle">여기서 트랜잭션 시작</text>
  <line x1="222" y1="344" x2="288" y2="344" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="510" y="336" class="gnote">테스트에서 롤백이 잘 되는 것을 확인</text>
  <text x="510" y="356" class="foot">전부 수정되면 다시 Controller로</text>
  <text x="510" y="374" class="foot">변경하기로 합의</text>
</svg>
