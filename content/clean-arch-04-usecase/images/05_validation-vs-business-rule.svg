<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 374" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>입력 유효성 검증은 모델 상태에 접근하지 않고 입력 모델에서 구문상의 유효성을 확인하고, 비즈니스 규칙 검증은 모델의 현재 상태에 접근해 도메인 엔티티나 유스케이스에서 의미적인 유효성을 확인한다는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 12px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .msg { font-size: 11.5px; fill: #374151; }
    .hd { font-size: 10.5px; fill: #374151; }
    .gmsg { font-size: 11.5px; fill: #15803d; }
    .rmsg { font-size: 11.5px; fill: #b91c1c; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .pkg { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .life { stroke: #c4c8ce; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .act { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.2; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .hint { font-size: 12px; fill: #6b7280; font-family: Menlo, Consolas, monospace; }
    .cd { font-size: 14px; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opmx { font-size: 12px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6b7280" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect width="760" height="374" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="356" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">입력 유효성 검증과 비즈니스 규칙 검증</text>
  <rect x="150" y="56" width="284" height="40" rx="8" class="hold"/>
  <text x="292" y="81" class="t" text-anchor="middle">입력 유효성 검증</text>
  <rect x="446" y="56" width="284" height="40" rx="8" class="hold"/>
  <text x="588" y="81" class="t" text-anchor="middle">비즈니스 규칙 검증</text>
  <text x="30" y="133.0" class="ts">검증 대상</text>
  <rect x="150" y="106" width="284" height="44" rx="8" class="box"/>
  <text x="292" y="133" class="val" text-anchor="middle">구문상의(syntactical) 유효성</text>
  <rect x="446" y="106" width="284" height="44" rx="8" class="box"/>
  <text x="588" y="133" class="val" text-anchor="middle">의미적인(semantical) 유효성</text>
  <text x="30" y="185.0" class="ts">모델 상태</text>
  <rect x="150" y="158" width="284" height="44" rx="8" class="box"/>
  <text x="292" y="185" class="val" text-anchor="middle">접근하지 않음</text>
  <rect x="446" y="158" width="284" height="44" rx="8" class="box"/>
  <text x="588" y="185" class="val" text-anchor="middle">현재 상태에 접근해야 함</text>
  <text x="30" y="237.0" class="ts">예</text>
  <rect x="150" y="210" width="284" height="44" rx="8" class="box"/>
  <text x="292" y="237" class="val" text-anchor="middle">송금되는 금액은 0보다 커야 한다</text>
  <rect x="446" y="210" width="284" height="44" rx="8" class="box"/>
  <text x="588" y="237" class="val" text-anchor="middle">출금 계좌는 초과 출금되어서는 안 된다</text>
  <text x="30" y="297.0" class="ts">구현 위치</text>
  <rect x="150" y="262" width="284" height="60" rx="8" class="box"/>
  <text x="292" y="297" class="val" text-anchor="middle">입력 모델 <tspan font-family="Menlo, Consolas, monospace">SendMoneyCommand</tspan></text>
  <rect x="446" y="262" width="284" height="60" rx="8" class="box"/>
  <text x="588" y="287.5" class="val" text-anchor="middle">도메인 엔티티 <tspan font-family="Menlo, Consolas, monospace">Account.withdraw()</tspan></text>
  <text x="588" y="306.5" class="val" text-anchor="middle">어려우면 유스케이스에서 엔티티 사용 전</text>
  <text x="30" y="348" class="foot">두 검증을 나누는 기준은 도메인 모델의 현재 상태에 접근해야 하는지입니다.</text>
</svg>
