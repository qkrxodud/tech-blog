<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>출발 코드에서 12장 완성 코드로 바뀐 테스트 결과 — 출발 코드 ch12-start는 802개 중 30개가 실패했고 모두 12장 계약 41개(대사 13 중 9, 이력 9 중 8, 장애 6 중 4, 운영 신호 13 중 9)에서 나왔으며 앞 장 761개는 통과함. 완성 코드는 11장 761개에 12장 운영 계약 41, 대사 견주기 단위 16, 결제 전이 단위 3, 여러 쪽 대사 1, 매일 작업 일정 2, 오류 응답 1을 더한 825개가 모두 통과하고 주문 서비스 모듈 13개·재고 서비스 모듈 10개도 통과함. 커버리지는 결제 서버만 INSTRUCTION 97.3%, BRANCH 93.5%, LINE 96.8%이고 두 서비스 모듈은 검사 밖이며, 같은 코드의 첫 clean check에서 결제 API 19개·결제 취소 API 14개가 404로 실패한 것은 한 번 관찰되고 그 뒤 clean check 4번·test 1번에서 재현되지 않은 그림</title>
