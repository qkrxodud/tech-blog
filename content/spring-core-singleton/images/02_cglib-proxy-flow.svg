<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>스프링 컨테이너에는 AppConfig를 상속한 AppConfig@CGLIB가 등록되고, memberRepository 호출 시 컨테이너에 이미 있으면 등록된 빈을 반환하고 없으면 기존 로직으로 생성해 등록하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .m { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 12px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .gn { font-size: 12.5px; fill: #15803d; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="416" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="124" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">등록되는 빈 — AppConfig를 상속한 AppConfig@CGLIB</text>
  <rect x="40" y="62" width="180" height="52" rx="8" class="box"/>
  <text x="130.0" y="84.0" class="m" text-anchor="middle">AppConfig</text>
  <text x="130.0" y="103.0" class="val" text-anchor="middle">내가 만든 클래스</text>
  <rect x="300" y="62" width="230" height="52" rx="8" class="hold"/>
  <text x="415.0" y="84.0" class="m" text-anchor="middle">AppConfig@CGLIB</text>
  <text x="415.0" y="103.0" class="val" text-anchor="middle">CGLIB가 만든 자식 클래스</text>
  <line x1="300" y1="88" x2="226" y2="88" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="263" y="80" class="sub" text-anchor="middle">상속</text>
  <line x1="530" y1="88" x2="574" y2="88" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="580" y="62" width="150" height="52" rx="8" class="ok"/>
  <text x="655.0" y="84.0" class="okt" text-anchor="middle">스프링 빈</text>
  <text x="655.0" y="103.0" class="val" text-anchor="middle">컨테이너에 등록</text>
  <rect x="10" y="150" width="740" height="256" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="182" class="h">memberRepository() 호출 — 이미 등록된 빈이 있으면 그대로 반환한다</text>
  <rect x="30" y="208" width="180" height="56" rx="8" class="box"/>
  <text x="120.0" y="232.0" class="ms" text-anchor="middle">memberRepository()</text>
  <text x="120.0" y="251.0" class="val" text-anchor="middle">호출</text>
  <line x1="210" y1="236" x2="234" y2="236" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="240" y="208" width="230" height="56" rx="8" class="hold"/>
  <text x="355.0" y="232.0" class="t" text-anchor="middle">컨테이너에 등록되어 있나?</text>
  <text x="355.0" y="251.0" class="val" text-anchor="middle">memoryMemberRepository</text>
  <line x1="470" y1="236" x2="514" y2="236" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="492" y="228" class="gnote" text-anchor="middle">예</text>
  <rect x="520" y="208" width="210" height="56" rx="8" class="ok"/>
  <text x="625.0" y="232.0" class="okt" text-anchor="middle">등록된 빈을 찾아서 반환</text>
  <text x="625.0" y="251.0" class="val" text-anchor="middle">새로 생성하지 않는다</text>
  <line x1="355" y1="264" x2="355" y2="306" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="366" y="290" class="sub">아니오</text>
  <rect x="240" y="312" width="230" height="56" rx="8" class="box"/>
  <text x="355" y="336" class="t" text-anchor="middle">기존 로직 호출</text>
  <text x="355" y="355" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">new MemoryMemberRepository()</tspan></text>
  <line x1="470" y1="340" x2="514" y2="340" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="520" y="312" width="210" height="56" rx="8" class="box"/>
  <text x="625.0" y="336.0" class="t" text-anchor="middle">컨테이너에 등록 후 반환</text>
  <text x="625.0" y="355.0" class="val" text-anchor="middle">다음 호출부터는 예 경로</text>
  <text x="30" y="396" class="foot">실제 CGLIB 코드는 훨씬 더 복잡하지만, 이 덕분에 몇 번을 호출해도 인스턴스는 하나다</text>
</svg>
