<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>@Entity 컬렉션의 clear는 select로 대상을 로딩한 뒤 이미지마다 delete를 실행하고, @Embeddable 컬렉션의 clear는 delete 한 번으로 끝나는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opk { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .ster { font-size: 11.5px; font-style: italic; fill: #6b7280; }
    .cls { font-size: 15px; font-weight: 700; fill: #1f2937; }
    .attr { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
    .sep { stroke: #d1d5db; stroke-width: 1; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
    <marker id="dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="14" markerHeight="9" orient="auto">
      <path d="M1,5 L8,1 L15,5 L8,9 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="760" height="380" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="190" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">@Entity 컬렉션의 clear() — 로딩 후 하나씩 삭제</text>
  <text x="730" y="42" class="code" text-anchor="end">@OneToMany</text>
  <text x="220" y="66" class="step" text-anchor="middle">1단계</text>
  <text x="360" y="66" class="step" text-anchor="middle">2단계</text>
  <text x="500" y="66" class="step" text-anchor="middle">3단계</text>
  <text x="640" y="66" class="step" text-anchor="middle">4단계</text>
  <line x1="160" y1="74" x2="722" y2="74" stroke="#c4c8ce" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">쿼리</text>
  <text x="30" y="126" class="sub">images.clear()</text>
  <rect x="150" y="84" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="86" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="106" class="op" text-anchor="middle">select</text>
  <text x="220" y="125" class="val" text-anchor="middle">대상 로딩</text>
  <rect x="302" y="86" width="116" height="48" rx="8" class="bad"/>
  <text x="360" y="106" class="badc" text-anchor="middle">delete</text>
  <text x="360" y="125" class="val" text-anchor="middle">이미지 1개</text>
  <rect x="442" y="86" width="116" height="48" rx="8" class="bad"/>
  <text x="500" y="106" class="badc" text-anchor="middle">delete</text>
  <text x="500" y="125" class="val" text-anchor="middle">이미지 1개</text>
  <rect x="582" y="86" width="116" height="48" rx="8" class="wait"/>
  <text x="640" y="115" class="waitt" text-anchor="middle">개수만큼 반복</text>
  <text x="150" y="172" class="note">컬렉션에 속한 엔티티를 먼저 읽어 오고, 엔티티마다 delete 쿼리를 실행합니다.</text>
  <rect x="10" y="216" width="740" height="154" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="248" class="h">@Embeddable 컬렉션의 clear() — 한 번에 삭제</text>
  <text x="730" y="248" class="code" text-anchor="end">@ElementCollection</text>
  <text x="30" y="290" class="lane">쿼리</text>
  <text x="30" y="308" class="sub">images.clear()</text>
  <rect x="150" y="266" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="268" width="256" height="48" rx="8" class="ok"/>
  <text x="290" y="288" class="okc" text-anchor="middle">delete</text>
  <text x="290" y="307" class="val" text-anchor="middle">로딩 없이 한 번에 삭제</text>
  <text x="150" y="348" class="gnote">컬렉션 객체를 로딩하지 않고 delete 쿼리 한 번으로 삭제합니다.</text>
</svg>
