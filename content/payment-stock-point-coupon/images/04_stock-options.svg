<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 3 — 재고 1개에 주문 A·B가 겹칠 때(A가 재고를 바꾸고 인증 UPDATE에서 1초 붙잡힘). 조건부 UPDATE(이 장에서 고름)는 A가 quantity &gt;= 1 조건으로 1줄을 바꾸고, B의 같은 문장은 A 커밋까지 기다린 뒤 A가 줄인 0으로 조건을 봐 0줄을 바꿔 OUT_OF_STOCK. select … for update는 B가 잠금에서 기다린 뒤 0을 읽어 OUT_OF_STOCK. 변경 번호 + 다시 시도는 B의 update where version이 A 커밋 뒤 0줄이 되어 StockChangedException으로 인증 트랜잭션을 처음부터 다시 하고(최대 30번) 0을 읽어 OUT_OF_STOCK. 잠그지 않음(결정 2까지)은 A·B 모두 1을 읽고 0을 써서 둘 다 승인, PG 승인 2. 같은 상품 계약 6개 중 실패는 0, 0, 0, 5개</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #4b5563; }
