  <circle cx="577" cy="255" r="4" fill="#e5e7eb"/>
  <text x="614" y="259" class="oks" style="font-size:10px">skip locked 3 → 2</text>
  <rect x="14" y="288" width="734" height="54" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
