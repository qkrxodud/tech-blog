<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>스레드 1이 A를 쥔 채 B를 1초 기다리다 실패해 A를 놓고, 그 사이 스레드 2가 A를 얻어 작업을 끝낸 뒤 스레드 1이 재시도해 A와 B를 모두 얻는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .waitl { stroke: #dc2626; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
    .lbl { font-size: 12.5px; font-weight: 700; fill: #6b7280; }
    .colh { font-size: 12px; font-weight: 700; fill: #9ca3af; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="280" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">tryLock 타임아웃 — 못 잡으면 놓고 다시</text>
  <text x="730" y="42" class="code" text-anchor="end">tryLock(1, SECONDS)</text>
  <text x="210" y="68" class="step" text-anchor="middle">1단계</text>
  <text x="325" y="68" class="step" text-anchor="middle">2단계</text>
  <text x="440" y="68" class="step" text-anchor="middle">3단계</text>
  <text x="555" y="68" class="step" text-anchor="middle">4단계</text>
  <text x="670" y="68" class="step" text-anchor="middle">5단계</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">스레드 1</text>
  <text x="30" y="126" class="sub">A → B 순서</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="157" y="88" width="106" height="48" rx="8" class="hold"/>
  <text x="210" y="108" class="op" text-anchor="middle">tryLock(A)</text>
  <text x="210" y="127" class="val" text-anchor="middle">A 획득</text>
  <rect x="272" y="88" width="106" height="48" rx="8" class="bad"/>
  <text x="325" y="108" class="badc" text-anchor="middle">tryLock(B)</text>
  <text x="325" y="127" class="val" text-anchor="middle">1초 대기 실패</text>
  <rect x="387" y="88" width="106" height="48" rx="8" class="box"/>
  <text x="440" y="108" class="op" text-anchor="middle">unlock(A)</text>
  <text x="440" y="127" class="val" text-anchor="middle">A를 놓음</text>
  <rect x="504" y="96" width="102" height="32" rx="6" class="wait"/>
  <text x="555" y="117" class="waitt" text-anchor="middle">잠시 후 재시도</text>
  <rect x="617" y="88" width="106" height="48" rx="8" class="ok"/>
  <text x="670" y="108" class="okt" text-anchor="middle">A, B 획득</text>
  <text x="670" y="127" class="val" text-anchor="middle">작업 성공</text>
  <text x="30" y="168" class="lane">스레드 2</text>
  <text x="30" y="186" class="sub">B → A 순서</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="157" y="148" width="106" height="48" rx="8" class="hold"/>
  <text x="210" y="168" class="op" text-anchor="middle">tryLock(B)</text>
  <text x="210" y="187" class="val" text-anchor="middle">B 획득</text>
  <rect x="274" y="156" width="108" height="32" rx="6" class="wait"/>
  <text x="328" y="177" class="waitt" text-anchor="middle">A 대기</text>
  <rect x="387" y="148" width="106" height="48" rx="8" class="ok"/>
  <text x="440" y="168" class="okt" text-anchor="middle">A 획득</text>
  <text x="440" y="187" class="val" text-anchor="middle">A, B 모두 쥠</text>
  <rect x="502" y="148" width="106" height="48" rx="8" class="box"/>
  <text x="555" y="168" class="op" text-anchor="middle">unlock</text>
  <text x="555" y="187" class="val" text-anchor="middle">A, B 해제</text>
  <line x1="440" y1="136" x2="440" y2="147" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="596" y1="148" x2="630" y2="137" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="150" y="214" width="585" height="32" rx="15" class="ok"/>
  <text x="442.5" y="235" class="okt" text-anchor="middle">A를 놓는 순간 점유 대기가 깨져 고리가 풀림</text>
  <text x="150" y="272" class="foot">스레드 2가 먼저 끝나고, 스레드 1은 재시도에서 A와 B를 모두 얻습니다.</text>
</svg>
