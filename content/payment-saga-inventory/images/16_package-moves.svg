  <rect x="24" y="298" width="340" height="72" rx="12" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="38" y="322" class="t2" style="font-size:12px"><tspan class="m">domain/job</tspan></text>
