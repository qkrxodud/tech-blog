  <text x="24" y="52" class="gs">출발 코드 <tspan class="m">ch05-start</tspan> → 완성 코드 <tspan class="m">ch05</tspan> · <tspan class="m">chapter-05</tspan> 브랜치</text>
  <rect x="24" y="72" width="340" height="226" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="38" y="96" class="t2">앞 장에서 이 장으로 넘긴 것</text>
