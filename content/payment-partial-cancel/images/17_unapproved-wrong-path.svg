  <rect width="760" height="430" fill="#ffffff"/>
  <text x="24" y="30" class="h">승인 전 결제의 취소 — 잘못된 주소로 보내서 통과</text>
  <text x="24" y="52" class="gs">출발 코드 · 테스트 "승인 전 결제의 취소는 카드사에 보내지 않는다"</text>
  <rect x="24" y="76" width="330" height="250" rx="16" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="36" y="86" width="150" height="24" rx="6" fill="#64748b"/>
  <text x="111.0" y="102.5" class="tab" text-anchor="middle">결제 서버 · 출발 코드</text>
  <rect x="396" y="76" width="340" height="250" rx="16" fill="#fbf4ee" stroke="#d99a6c" stroke-width="1.5"/>
  <use href="#i-server" transform="translate(410,88) scale(0.8)"/>
  <text x="446" y="104" class="ot" style="font-size:13px">Mock PG</text>
  <path d="M340,155 H418" fill="none" stroke="#c2410c" stroke-width="1.6" class="run" marker-end="url(#aor)"/>
  <path d="M436,186 V288 H342" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="44" y="122" width="296" height="66" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <circle cx="44" cy="122" r="10" fill="#111827"/><text x="44" y="126" class="num" text-anchor="middle">1</text>
  <use href="#i-card" x="60" y="138"/>
  <text x="104" y="148" class="t2" style="font-size:12.5px">승인 전 결제 취소</text>
  <text x="104" y="168" class="s" style="font-size:10.5px">결제 키 없음 → <tspan class="m">/v1/payments//cancel</tspan></text>
  <rect x="420" y="128" width="300" height="56" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <circle cx="420" cy="128" r="10" fill="#111827"/><text x="420" y="132" class="num" text-anchor="middle">2</text>
  <text x="450" y="150" class="badt" style="font-size:12px">취소 API에 닿지 못함 → <tspan class="m">404</tspan></text>
  <text x="450" y="170" class="bads" style="font-size:10px"><tspan class="m">/v1/payments/{paymentKey}/cancel</tspan>과 다른 주소</text>
  <rect x="44" y="264" width="296" height="48" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <circle cx="44" cy="264" r="10" fill="#111827"/><text x="44" y="268" class="num" text-anchor="middle">3</text>
  <text x="60" y="284" class="badt" style="font-size:12px">404를 받아 <tspan class="m">502</tspan>로 답함</text>
  <text x="60" y="302" class="bads" style="font-size:10.5px"><tspan class="m">PAYMENT_GATEWAY_FAILED</tspan></text>
  <rect x="456" y="214" width="264" height="56" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="470" y="236" class="t2" style="font-size:11.5px">취소 API — 여기서 취소 요청 수를 셈</text>
  <text x="470" y="256" class="s" style="font-size:11px">요청이 닿지 않아 0건</text>
  <rect x="24" y="340" width="712" height="76" rx="12" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <use href="#i-warn" x="38" y="352"/>
  <text x="76" y="364" class="t2" style="font-size:13px">테스트는 통과 — <tspan class="m">cancelCount</tspan> 0건</text>
  <text x="76" y="386" class="s" style="font-size:11.5px">PG에 보내지 않아서가 아니라 잘못된 주소로 보내서 0건</text>
  <text x="76" y="404" class="s" style="font-size:11px">완성 코드는 전이 표로 먼저 막아 PG를 부르지 않음(<tspan class="m">409 INVALID_PAYMENT_TRANSITION</tspan>)</text>
  <rect x="44" y="122" width="296" height="66" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.01;0.02;0.07;0.08;1"/></rect>
  <rect x="420" y="128" width="300" height="56" rx="10" fill="none" stroke="#dc2626" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2435;0.2535;0.3835;0.3935;1"/></rect>
  <rect x="44" y="264" width="296" height="48" rx="10" fill="none" stroke="#dc2626" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.85;0.86;0.91;0.92;1"/></rect>
  <g class="anim" opacity="0">
    <use href="#pkt"/>
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear"
      path="M330,155 H436 V288 H330"
      keyPoints="0;0;0;0.3072;0.3072;1;1;1" keyTimes="0;0.02;0.02;0.2535;0.3335;0.86;0.86;1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.015;0.02;0.86;0.87;1"/>
  </g>
