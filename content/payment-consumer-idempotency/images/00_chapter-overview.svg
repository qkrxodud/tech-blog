  <line x1="12" y1="310" x2="748" y2="310" stroke="#9ca3af" stroke-width="1"/>
  <text x="24" y="334" class="t2">이 장에서 정하는 네 가지</text>
  <circle cx="34" cy="362" r="10" fill="#111827"/><text x="34" y="366" class="num" text-anchor="middle" style="font-size:11px">1</text>
  <text x="52" y="367" class="s" style="fill:#1f2937">같은 메시지를 어떻게 가릴까</text>
  <circle cx="396" cy="362" r="10" fill="#111827"/><text x="396" y="366" class="num" text-anchor="middle" style="font-size:11px">2</text>
  <text x="414" y="367" class="s" style="fill:#1f2937">늦게 온 옛 메시지를 어떻게 거를까</text>
  <circle cx="34" cy="394" r="10" fill="#111827"/><text x="34" y="398" class="num" text-anchor="middle" style="font-size:11px">3</text>
  <text x="52" y="399" class="s" style="fill:#1f2937">처리에 실패한 메시지를 언제 다시 시도할까</text>
  <circle cx="396" cy="394" r="10" fill="#111827"/><text x="396" y="398" class="num" text-anchor="middle" style="font-size:11px">4</text>
  <text x="414" y="399" class="s" style="fill:#1f2937">다시 시도를 다 쓴 메시지를 어디에 모을까</text>
  <rect x="14" y="424" width="734" height="32" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="28" y="445" class="gs" style="font-size:11.5px">범위 밖: Redis 쓰지 않음 · 보낸 <tspan class="m">payment_outbox</tspan> 줄 지우기 없음 · 예약 만료(TTL) 없음</text>
