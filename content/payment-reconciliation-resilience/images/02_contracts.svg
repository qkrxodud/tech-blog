  <rect width="760" height="548" fill="#ffffff"/>
  <text x="24" y="28" class="h">12장 계약 — 네 묶음, 41개</text>
  <text x="24" y="48" class="gs" style="font-size:11px">지켜야 하는 규칙은 추상 클래스(계약)에 두고 구현마다 상속해 같은 테스트를 돌림 · 빨간 숫자는 출발 코드에서 실패한 수</text>
  <rect x="14" y="64" width="362" height="166" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <use href="#i-search" transform="translate(26,76) scale(0.75)"/>
  <text x="60" y="90" class="t2">하루치 대사 — 13개</text>
  <text x="60" y="108" class="gs" style="font-size:10.5px"><tspan class="m">DailyReconciliationContract</tspan></text>
  <text x="30" y="132" class="s2" style="font-size:10.5px;fill:#1f2937">카드사에서만 전액·부분 취소, 알림 모두 닿지 않음</text><text x="30" y="148" class="s2" style="font-size:10.5px;fill:#1f2937">→ 맞추는지, 맞춘 결제가 대사 결과에 남는지</text><text x="30" y="164" class="s2" style="font-size:10.5px;fill:#1f2937">금액 다름·우리에게만·카드사에만·우리 쪽만 취소</text><text x="30" y="180" class="s2" style="font-size:10.5px;fill:#1f2937">→ 고치지 않고 운영자 확인으로 남는지</text><text x="30" y="196" class="s2" style="font-size:10.5px;fill:#1f2937">같은 결제는 남지 않음 · 같은 날 두 번이면 한 줄</text><text x="30" y="212" class="s2" style="font-size:10.5px;fill:#1f2937">서버 두 대가 같은 때 시작해도 거래 내역 한 번</text>
  <text x="362" y="90" class="badt" text-anchor="end" style="font-size:11.5px">출발 9개 실패</text>
  <rect x="386" y="64" width="362" height="166" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <use href="#i-chips" transform="translate(398,76) scale(0.75)"/>
  <text x="432" y="90" class="t2">상태 이력 — 9개</text>
  <text x="432" y="108" class="gs" style="font-size:10.5px"><tspan class="m">StatusHistoryContract</tspan></text>
  <text x="402" y="132" class="s2" style="font-size:10.5px;fill:#1f2937">인증·승인 두 줄</text><text x="402" y="148" class="s2" style="font-size:10.5px;fill:#1f2937">계기(승인 요청·보정·알림·취소)</text><text x="402" y="164" class="s2" style="font-size:10.5px;fill:#1f2937">결과 모름을 거친 이력</text><text x="402" y="180" class="s2" style="font-size:10.5px;fill:#1f2937">상태가 그대로인 부분 취소는 남기지 않음</text><text x="402" y="196" class="s2" style="font-size:10.5px;fill:#1f2937">되돌려진 승인 · 바뀐 때</text>
  <text x="734" y="90" class="badt" text-anchor="end" style="font-size:11.5px">출발 8개 실패</text>
  <rect x="14" y="240" width="362" height="166" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <use href="#i-warn" transform="translate(26,252) scale(0.75)"/>
  <text x="60" y="266" class="t2">카드사 장애 — 6개</text>
  <text x="60" y="284" class="gs" style="font-size:10.5px"><tspan class="m">PgOutageContract</tspan></text>
  <text x="30" y="308" class="s2" style="font-size:10.5px;fill:#1f2937">실패가 기준을 넘은 뒤 승인 요청을 보내지 않음</text><text x="30" y="324" class="s2" style="font-size:10.5px;fill:#1f2937">바로 실패함 · 결과 모름이 아님</text><text x="30" y="340" class="s2" style="font-size:10.5px;fill:#1f2937">카드사가 돌아온 뒤 다시 승인됨</text><text x="30" y="356" class="s2" style="font-size:10.5px;fill:#1f2937">거절은 막지 않음 · 차단기 지표</text>
  <text x="362" y="266" class="badt" text-anchor="end" style="font-size:11.5px">출발 4개 실패</text>
  <rect x="386" y="240" width="362" height="166" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <use href="#i-chart" transform="translate(398,252) scale(0.75)"/>
  <text x="432" y="266" class="t2">운영 신호 — 13개</text>
  <text x="432" y="284" class="gs" style="font-size:10.5px"><tspan class="m">OperationalSignalsContract</tspan></text>
  <text x="402" y="308" class="s2" style="font-size:10.5px;fill:#1f2937">주문·재고 실패 모음 수, 다시 넣은 뒤 빠짐</text><text x="402" y="324" class="s2" style="font-size:10.5px;fill:#1f2937">보내지 않은 결과 수와 가장 오래 기다린 나이</text><text x="402" y="340" class="s2" style="font-size:10.5px;fill:#1f2937">대사 어긋남 수</text><text x="402" y="356" class="s2" style="font-size:10.5px;fill:#1f2937">보낸 결과·받은 기록·처리한 명령의 보존 기간 정리</text><text x="402" y="372" class="s2" style="font-size:10.5px;fill:#1f2937">보내지 않은 결과는 지우지 않음</text><text x="402" y="388" class="s2" style="font-size:10.5px;fill:#1f2937">받은 기록을 지운 뒤 같은 결과가 와도 주문 그대로</text>
  <text x="734" y="266" class="badt" text-anchor="end" style="font-size:11.5px">출발 9개 실패</text>
  <line x1="12" y1="424" x2="748" y2="424" stroke="#9ca3af" stroke-width="1"/>
  <rect x="14" y="438" width="240" height="66" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/><text x="134" y="466.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">계약(추상 클래스)</text><text x="134" y="483.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">예: <tspan class="m">DailyReconciliationContract</tspan></text>
  <line x1="256" y1="471" x2="300" y2="471" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <text x="262" y="462" class="gs" style="font-size:10.5px">상속</text>
  <rect x="302" y="438" width="200" height="66" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/><text x="402" y="466.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:10px">운영 구현(출발 코드에서는 출발 구조)</text><text x="402" y="483.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:10px"><tspan class="m">PaymentDailyReconciliationTest</tspan></text>
  <path d="M134,504 V528 H630 V508" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="512" y="438" width="236" height="66" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/><text x="630" y="466.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">비교 구현</text><text x="630" y="483.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">같은 계약을 <tspan class="m">knownFailingTest</tspan>로</text>
</svg>
