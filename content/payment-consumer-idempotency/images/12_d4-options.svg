<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 528" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 4 선택지 비교 — 모르는 상태나 읽을 수 없는 본문 같은 영구 오류는 실패 모음 토픽(.DLT) + 다시 넣기(이 장에서 고름)가 다시 시도 없이 원인 머리 kafka_dlt와 함께 실패 모음에 남기고, 로그만은 ERROR 로그만 남겨 메시지가 사라지며, DB 실패 표는 failed_message에 남김. 저장소 장애로 다시 시도를 다 쓴 메시지는 운영이 실패 모음에 실은 뒤 넘어가 다시 넣으면 결정 1·2대로 처리되고, 로그만은 사라지며, DB 실패 표는 저장소가 막혀 실패 표에도 못 남겨 그 자리를 넘어가지 않고 계속 다시 시도함. 11장 계약 실패는 0개, 5개(실패 모음 3·다시 넣기 2), 3개(다 쓴 결과·다시 넣기 2)이고, 30초 장애 측정은 잃음 0·실패 모음 2, 잃음 2, 반영 60·실패 표 0(저장소가 돌아온 뒤 반영)임. 운영의 비용은 운영자가 다시 넣기 명령을 돌려야 하고 받는 쪽 토픽마다 실패 모음 토픽이 늘어 파티션 수를 원래 토픽과 맞춰야 하는 것인 그림</title>
