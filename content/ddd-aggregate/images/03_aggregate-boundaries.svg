<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>같은 객체를 분류, 상품, 리뷰, 주문, 결제, 회원 여섯 개 애그리거트로 묶어 경계를 표시한 모델</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .ops { font-size: 11.5px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .src { font-size: 13px; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .grp { fill: #f3f4f6; stroke: #c4c8ce; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .pkg { fill: #ffffff; stroke: #c4c8ce; stroke-width: 1.2; }
    .grpt { font-size: 13px; font-weight: 700; fill: #4b5563; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .edge { stroke: #9ca3af; stroke-width: 1.4; fill: none; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="760" height="500" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="480" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">애그리거트 단위 모델 — 관련 객체를 경계로 묶는다</text>
  <rect x="184" y="60" width="416" height="256" rx="12" class="grp"/>
  <text x="196" y="80" class="grpt">주문</text>
  <rect x="26" y="150" width="140" height="78" rx="12" class="grp"/>
  <text x="38" y="170" class="grpt">분류</text>
  <rect x="26" y="234" width="140" height="78" rx="12" class="grp"/>
  <text x="38" y="254" class="grpt">상품</text>
  <rect x="26" y="334" width="140" height="78" rx="12" class="grp"/>
  <text x="38" y="354" class="grpt">리뷰</text>
  <rect x="322" y="334" width="140" height="78" rx="12" class="grp"/>
  <text x="334" y="354" class="grpt">결제</text>
  <rect x="606" y="234" width="128" height="178" rx="12" class="grp"/>
  <text x="618" y="254" class="grpt">회원</text>
  <rect x="332.0" y="94" width="120" height="44" rx="6" class="box"/>
  <text x="392.0" y="121.0" class="opm" text-anchor="middle">Address</text>
  <rect x="36.0" y="178" width="120" height="44" rx="6" class="box"/>
  <text x="96.0" y="205.0" class="opm" text-anchor="middle">Category</text>
  <rect x="192.0" y="178" width="120" height="44" rx="6" class="box"/>
  <text x="252.0" y="195.5" class="opm" text-anchor="middle">Delivery</text>
  <text x="252.0" y="214.5" class="opm" text-anchor="middle">Tracking</text>
  <rect x="332.0" y="178" width="120" height="44" rx="6" class="box"/>
  <text x="392.0" y="205.0" class="opm" text-anchor="middle">ShippingInfo</text>
  <rect x="472.0" y="178" width="120" height="44" rx="6" class="box"/>
  <text x="532.0" y="205.0" class="opm" text-anchor="middle">Receiver</text>
  <rect x="36.0" y="262" width="120" height="44" rx="6" class="box"/>
  <text x="96.0" y="289.0" class="opm" text-anchor="middle">Product</text>
  <rect x="192.0" y="262" width="120" height="44" rx="6" class="box"/>
  <text x="252.0" y="289.0" class="opm" text-anchor="middle">OrderLine</text>
  <rect x="332.0" y="262" width="120" height="44" rx="6" class="box"/>
  <text x="392.0" y="289.0" class="opm" text-anchor="middle">Order</text>
  <rect x="472.0" y="262" width="120" height="44" rx="6" class="box"/>
  <text x="532.0" y="289.0" class="opm" text-anchor="middle">Orderer</text>
  <rect x="616.0" y="262" width="108" height="44" rx="6" class="box"/>
  <text x="670.0" y="289.0" class="opm" text-anchor="middle">Member</text>
  <rect x="36.0" y="362" width="120" height="44" rx="6" class="box"/>
  <text x="96.0" y="389.0" class="opm" text-anchor="middle">Review</text>
  <rect x="332.0" y="362" width="120" height="44" rx="6" class="box"/>
  <text x="392.0" y="389.0" class="opm" text-anchor="middle">PaymentInfo</text>
  <rect x="616.0" y="362" width="108" height="44" rx="6" class="box"/>
  <text x="670.0" y="389.0" class="opm" text-anchor="middle">MemberGrade</text>
  <line x1="96" y1="222" x2="96" y2="262" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="96" y1="306" x2="96" y2="362" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="156.0" y1="284" x2="192.0" y2="284" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="252" y1="222" x2="252" y2="262" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="292.0" y1="222" x2="338.0" y2="262" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="312.0" y1="284" x2="332.0" y2="284" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="392" y1="222" x2="392" y2="262" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="392" y1="138" x2="392" y2="178" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="452.0" y1="200" x2="472.0" y2="200" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="532" y1="222" x2="532" y2="262" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="452.0" y1="284" x2="472.0" y2="284" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="592.0" y1="284" x2="616.0" y2="284" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="670" y1="306" x2="670" y2="362" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="392" y1="306" x2="392" y2="362" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="30" y="458" class="foot">경계 안의 객체는 함께 생성·변경되고, 한 객체는 한 애그리거트에만 속합니다.</text>
</svg>
