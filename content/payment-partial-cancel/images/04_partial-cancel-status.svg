  <text x="628.0" y="277" class="s" text-anchor="middle"><tspan class="m">DONE</tspan> · 남은 0원</text>
  <polygon points="440,230 510,262 440,294 370,262" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <polygon points="440,230 510,262 440,294 370,262" fill="none" stroke="#d97706" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6104;0.6204;0.6704;0.6804;1"/></polygon>
  <circle cx="440" cy="230" r="11" fill="#111827"/><text x="440" y="234" class="num" text-anchor="middle">4</text>
  <text x="444" y="260" class="t2" text-anchor="middle">남은 0원?</text>
  <text x="444" y="278" class="s" text-anchor="middle">예</text>
  <rect x="190" y="234" width="150" height="56" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <rect x="190" y="234" width="150" height="56" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7337;0.7437;0.7937;0.8037;1"/></rect>
  <circle cx="190" cy="234" r="11" fill="#111827"/><text x="190" y="238" class="num" text-anchor="middle">5</text>
  <text x="265.0" y="258" class="t2" text-anchor="middle"><tspan class="m">cancel()</tspan> 전이</text>
  <text x="265.0" y="277" class="s" text-anchor="middle">1장부터 있던 전이</text>
  <rect x="30" y="234" width="140" height="56" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <rect x="30" y="234" width="140" height="56" rx="10" fill="none" stroke="#16a34a" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.85;0.86;0.91;0.92;1"/></rect>
  <text x="100.0" y="258" class="t2" text-anchor="middle" style="font-size: 12.5px"><tspan class="m">APPROVAL_CANCELED</tspan></text>
  <text x="100.0" y="277" class="s" text-anchor="middle">취소 상태로 닫힘</text>
