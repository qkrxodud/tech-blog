<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>Metaspace 로그의 reserved, committed, capacity, used는 차례로 안쪽에 포함되는 크기이며 예시 로그의 Metaspace와 class space 값을 함께 적었다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
    .monob { font-family: Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #1f2937; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .sep { stroke: #9ca3af; stroke-width: 1; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="360" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">Metaspace 로그 — reserved ⊇ committed ⊇ capacity ⊇ used</text>
  <text x="590" y="74" class="step" text-anchor="middle">Metaspace</text>
  <text x="690" y="74" class="step" text-anchor="middle">class space</text>
  <rect x="40" y="84" width="490" height="50" rx="6" class="wait"/>
  <text x="56" y="106" class="monob">reserved</text>
  <text x="56" y="124" class="sub">예약된 주소 공간</text>
  <text x="590" y="114" class="mono" text-anchor="middle">1253376K</text>
  <text x="690" y="114" class="mono" text-anchor="middle">1048576K</text>
  <rect x="40" y="146" width="460" height="50" rx="6" class="hold"/>
  <text x="56" y="168" class="monob">committed</text>
  <text x="56" y="186" class="sub">reserved 중 물리 메모리와 매핑될 수 있게 commit된 크기</text>
  <text x="590" y="176" class="mono" text-anchor="middle">149504K</text>
  <text x="690" y="176" class="mono" text-anchor="middle">21632K</text>
  <rect x="40" y="208" width="430" height="50" rx="6" class="box"/>
  <text x="56" y="230" class="monob">capacity</text>
  <text x="56" y="248" class="sub">committed 중 chunk화까지 된 크기</text>
  <text x="590" y="238" class="mono" text-anchor="middle">148992K</text>
  <text x="690" y="238" class="mono" text-anchor="middle">21568K</text>
  <rect x="40" y="270" width="400" height="50" rx="6" class="ok"/>
  <text x="56" y="292" class="okc">used</text>
  <text x="56" y="310" class="sub">실제로 class metadata 저장에 사용된 크기</text>
  <text x="590" y="300" class="mono" text-anchor="middle">132478K</text>
  <text x="690" y="300" class="mono" text-anchor="middle">19234K</text>
  <line x1="540" y1="84" x2="540" y2="330" class="axis"/>
  <text x="40" y="360" class="sub">값은 강의 예시 로그의 exit 시점 값입니다. 막대 길이는 크기 비율이 아니라 큰 순서만 나타냅니다.</text>
</svg>
