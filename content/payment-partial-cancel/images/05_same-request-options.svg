  <circle cx="192" cy="46" r="11" fill="#111827"/><text x="192" y="50" class="num" text-anchor="middle">1</text>
  <text x="258" y="67" class="t2" text-anchor="middle" style="font-size: 12.5px">같은 금액 부분 취소</text>
  <text x="258" y="85" class="gs" text-anchor="middle">키를 바꿔 두 번</text>
  <rect x="330" y="46" width="132" height="50" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <circle cx="330" cy="46" r="11" fill="#111827"/><text x="330" y="50" class="num" text-anchor="middle">2</text>
  <text x="396" y="67" class="t2" text-anchor="middle" style="font-size: 12.5px">부분 취소 뒤</text>
  <text x="396" y="85" class="gs" text-anchor="middle">같은 키로 다시</text>
  <rect x="468" y="46" width="132" height="50" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <circle cx="468" cy="46" r="11" fill="#111827"/><text x="468" y="50" class="num" text-anchor="middle">3</text>
  <text x="534" y="67" class="t2" text-anchor="middle" style="font-size: 12.5px">같은 키에</text>
  <text x="534" y="85" class="gs" text-anchor="middle">다른 금액</text>
  <rect x="606" y="46" width="132" height="50" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <circle cx="606" cy="46" r="11" fill="#111827"/><text x="606" y="50" class="num" text-anchor="middle">4</text>
  <text x="672" y="67" class="t2" text-anchor="middle" style="font-size: 12.5px">전액 취소 뒤</text>
  <text x="672" y="85" class="gs" text-anchor="middle">새 키로 취소</text>
  <rect x="16" y="108" width="166" height="58" rx="10" fill="#e3f3e6" stroke="#16a34a" stroke-width="2"/>
  <text x="28" y="127" class="t2">키 필수 + 남긴 결과</text>
  <text x="28" y="143" class="gs">이 장에서 고름</text>
  <text x="28" y="159" class="oks">계약 실패 0개</text>
  <rect x="192" y="108" width="132" height="58" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.2"/>
  <use href="#vmark" x="208" y="125"/>
  <text x="222" y="130" class="okt">PG 취소 2번</text>
  <text x="202" y="152" class="oks" style="font-size: 12px">두 키 모두 새 취소</text>
  <rect x="330" y="108" width="132" height="58" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.2"/>
  <use href="#vmark" x="346" y="125"/>
  <text x="360" y="130" class="okt">처음과 같은 답</text>
  <text x="340" y="152" class="oks" style="font-size: 12px">PG를 부르지 않음</text>
  <rect x="468" y="108" width="132" height="58" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.2"/>
  <use href="#vmark" x="484" y="125"/>
