<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>스핀락: 스레드 B가 락이 풀렸는지 계속 확인하며 CPU를 쓰다가, A가 해제하는 즉시 들어가는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .loop { stroke: #9ca3af; stroke-width: 1.4; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#ffffff"/>

  <rect x="10" y="10" width="740" height="340" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">스핀락 — 문 앞에서 계속 손잡이를 돌려보기</text>
  <text x="730" y="42" class="code" text-anchor="end">while (locked) { }</text>

  <text x="160" y="68" class="sub">시간</text>
  <line x1="190" y1="64" x2="722" y2="64" class="axis" marker-end="url(#ar)"/>

  <!-- 스레드 A -->
  <text x="30" y="104" class="lane">스레드 A</text>
  <text x="30" y="122" class="sub">락을 쥐고 있음</text>
  <rect x="150" y="80" width="585" height="56" rx="6" class="track"/>
  <rect x="162" y="84" width="356" height="48" rx="8" class="hold"/>
  <text x="340" y="104" class="op" text-anchor="middle">임계 구역 실행 중</text>
  <text x="340" y="123" class="val" text-anchor="middle">락 보유</text>
  <rect x="530" y="84" width="80" height="48" rx="8" class="box"/>
  <text x="570" y="104" class="op" text-anchor="middle">해제</text>
  <text x="570" y="123" class="val" text-anchor="middle">unlock</text>

  <!-- 스레드 B -->
  <text x="30" y="168" class="lane">스레드 B</text>
  <text x="30" y="186" class="sub">문 앞에서 반복 확인</text>
  <rect x="150" y="144" width="585" height="56" rx="6" class="track"/>
  <rect x="162" y="148" width="80" height="48" rx="8" class="box"/>
  <text x="202" y="168" class="op" text-anchor="middle">열렸나?</text>
  <text x="202" y="187" class="note" text-anchor="middle">아직</text>
  <line x1="243" y1="172" x2="252" y2="172" class="loop" marker-end="url(#ag)"/>
  <rect x="254" y="148" width="80" height="48" rx="8" class="box"/>
  <text x="294" y="168" class="op" text-anchor="middle">열렸나?</text>
  <text x="294" y="187" class="note" text-anchor="middle">아직</text>
  <line x1="335" y1="172" x2="344" y2="172" class="loop" marker-end="url(#ag)"/>
  <rect x="346" y="148" width="80" height="48" rx="8" class="box"/>
  <text x="386" y="168" class="op" text-anchor="middle">열렸나?</text>
  <text x="386" y="187" class="note" text-anchor="middle">아직</text>
  <line x1="427" y1="172" x2="436" y2="172" class="loop" marker-end="url(#ag)"/>
  <rect x="438" y="148" width="80" height="48" rx="8" class="box"/>
  <text x="478" y="168" class="op" text-anchor="middle">열렸나?</text>
  <text x="478" y="187" class="note" text-anchor="middle">아직</text>
  <line x1="519" y1="172" x2="528" y2="172" class="loop" marker-end="url(#ag)"/>
  <rect x="530" y="148" width="80" height="48" rx="8" class="ok"/>
  <text x="570" y="168" class="op" text-anchor="middle">열렸나?</text>
  <text x="570" y="187" class="gnote" text-anchor="middle">열림</text>
  <line x1="611" y1="172" x2="620" y2="172" class="loop" marker-end="url(#ag)"/>
  <rect x="622" y="148" width="108" height="48" rx="8" class="ok"/>
  <text x="676" y="168" class="okt" text-anchor="middle">바로 진입</text>
  <text x="676" y="187" class="val" text-anchor="middle">임계 구역</text>

  <!-- 해제 → 확인 -->
  <line x1="570" y1="134" x2="570" y2="146" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>

  <!-- CPU -->
  <text x="30" y="234" class="db">B의 CPU</text>
  <rect x="162" y="214" width="448" height="30" rx="6" class="bad"/>
  <text x="386" y="234" class="badt" text-anchor="middle">기다리는 동안에도 CPU를 계속 씀 (busy waiting)</text>
  <rect x="622" y="214" width="108" height="30" rx="6" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="676" y="234" class="val" text-anchor="middle">일하는 데 씀</text>

  <!-- 정리 -->
  <rect x="30" y="268" width="340" height="30" rx="15" class="ok"/>
  <text x="200" y="288" class="okt" text-anchor="middle">풀리는 순간 바로 들어감 → 반응이 가장 빠름</text>
  <rect x="390" y="268" width="340" height="30" rx="15" class="bad"/>
  <text x="560" y="288" class="badt" text-anchor="middle">아무 일도 안 하면서 CPU를 차지함</text>

  <text x="30" y="326" class="sub">락이 몇 마이크로초 안에 풀릴 때, 코어가 여러 개일 때만 이득입니다. 코어가 하나면 A가 실행조차 못 합니다.</text>
</svg>
