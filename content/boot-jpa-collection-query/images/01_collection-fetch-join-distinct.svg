<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>userA와 userB의 주문을 orderItems와 페치 조인하면 주문 상품 수만큼 네 행이 만들어져 같은 주문이 두 번씩 조회되고, distinct를 붙이면 애플리케이션에서 같은 주문 엔티티의 중복을 걸러 주문 두 건이 되는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="350" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="330" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h" text-anchor="start">컬렉션 페치 조인 — 주문이 주문 상품 수만큼 조회됨</text>
  <text x="30" y="72" class="m" text-anchor="start">join fetch o.orderItems oi</text>
  <text x="30" y="98" class="ts" text-anchor="start">SQL 결과: 주문 상품 기준 네 행</text>
  <rect x="30" y="108" width="310" height="26" rx="4" class="hold"/>
  <text x="85.0" y="126" class="ts" text-anchor="middle">주문</text>
  <text x="185.0" y="126" class="ts" text-anchor="middle">회원</text>
  <text x="285.0" y="126" class="ts" text-anchor="middle">주문 상품</text>
  <rect x="30" y="134" width="310" height="28" rx="0" class="box"/>
  <text x="85.0" y="153" class="val" text-anchor="middle">userA 주문</text>
  <text x="185.0" y="153" class="val" text-anchor="middle">userA</text>
  <text x="285.0" y="153" class="val" text-anchor="middle">주문 상품 1</text>
  <rect x="30" y="162" width="310" height="28" rx="0" class="box"/>
  <text x="85.0" y="181" class="val" text-anchor="middle">userA 주문</text>
  <text x="185.0" y="181" class="val" text-anchor="middle">userA</text>
  <text x="285.0" y="181" class="val" text-anchor="middle">주문 상품 2</text>
  <rect x="30" y="190" width="310" height="28" rx="0" class="box"/>
  <text x="85.0" y="209" class="val" text-anchor="middle">userB 주문</text>
  <text x="185.0" y="209" class="val" text-anchor="middle">userB</text>
  <text x="285.0" y="209" class="val" text-anchor="middle">주문 상품 1</text>
  <rect x="30" y="218" width="310" height="28" rx="0" class="box"/>
  <text x="85.0" y="237" class="val" text-anchor="middle">userB 주문</text>
  <text x="185.0" y="237" class="val" text-anchor="middle">userB</text>
  <text x="285.0" y="237" class="val" text-anchor="middle">주문 상품 2</text>
  <line x1="140" y1="108" x2="140" y2="246" stroke="#d1d5db" stroke-width="1"/>
  <line x1="230" y1="108" x2="230" y2="246" stroke="#d1d5db" stroke-width="1"/>
  <text x="30" y="290" class="sub" text-anchor="start">같은 주문 엔티티가 행마다 한 번씩 담김</text>
  <line x1="350" y1="160" x2="392" y2="160" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="400" y="98" class="badt" text-anchor="start">distinct 없음 — 결과 4건</text>
  <rect x="400" y="110" width="76" height="34" rx="8" class="bad"/>
  <text x="438.0" y="132.0" class="note" text-anchor="middle">userA 주문</text>
  <rect x="484" y="110" width="76" height="34" rx="8" class="bad"/>
  <text x="522.0" y="132.0" class="note" text-anchor="middle">userA 주문</text>
  <rect x="568" y="110" width="76" height="34" rx="8" class="bad"/>
  <text x="606.0" y="132.0" class="note" text-anchor="middle">userB 주문</text>
  <rect x="652" y="110" width="76" height="34" rx="8" class="bad"/>
  <text x="690.0" y="132.0" class="note" text-anchor="middle">userB 주문</text>
  <text x="400" y="166" class="note" text-anchor="start">같은 주문이 중복으로 조회됨</text>
  <line x1="350" y1="230" x2="392" y2="230" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="400" y="204" class="okt" text-anchor="start">select distinct o — 결과 2건</text>
  <rect x="400" y="216" width="76" height="34" rx="8" class="ok"/>
  <text x="438.0" y="238.0" class="gnote" text-anchor="middle">userA 주문</text>
  <rect x="484" y="216" width="76" height="34" rx="8" class="ok"/>
  <text x="522.0" y="238.0" class="gnote" text-anchor="middle">userB 주문</text>
  <text x="400" y="272" class="val" text-anchor="start">SQL에 distinct를 추가하고,</text>
  <text x="400" y="292" class="val" text-anchor="start">같은 엔티티의 중복은 애플리케이션에서 걸러 줌</text>
  <text x="30" y="322" class="note" text-anchor="start">단점: 컬렉션을 페치 조인하면 페이징이 불가능</text>
</svg>
