<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 508" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>@Synchronize가 없으면 Order의 배송지 변경이 메모리에만 있는 상태에서 OrderSummary를 조회해 이전 값을 읽고, @Synchronize에 purchase_order를 지정하면 조회 전에 플러시가 일어나 변경된 값을 읽는다는 두 패널 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .op2 { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #1f2937; }
    .okc2 { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badc2 { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .monos { font-family: Menlo, Consolas, monospace; font-size: 12.5px; fill: #374151; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="760" height="508" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="236" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">@Synchronize 없음 — 변경 전 값을 읽음</text>
  <text x="730" y="42" class="code" text-anchor="end">@Subselect</text>
  <text x="220" y="68" class="step" text-anchor="middle">1. Order 조회</text>
  <text x="360" y="68" class="step" text-anchor="middle">2. 상태 변경</text>
  <text x="500" y="68" class="step" text-anchor="middle">3. 조회 전</text>
  <text x="640" y="68" class="step" text-anchor="middle">4. 결과</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="110" class="lane">코드</text>
  <text x="30" y="128" class="sub">한 트랜잭션</text>
  <rect x="150" y="84" width="585" height="56" rx="6" class="track"/>
  <rect x="154" y="88" width="132" height="48" rx="8" class="box"/>
  <text x="220" y="108" class="op2" text-anchor="middle">findById</text>
  <text x="220" y="127" class="val" text-anchor="middle">Order 로딩</text>
  <rect x="294" y="88" width="132" height="48" rx="8" class="hold"/>
  <text x="360" y="108" class="op2" text-anchor="middle">changeShipping</text>
  <text x="360" y="127" class="val" text-anchor="middle">메모리에만 반영</text>
  <rect x="445" y="96" width="110" height="32" rx="6" class="wait"/>
  <text x="500" y="117" class="waitt" text-anchor="middle">플러시 없음</text>
  <rect x="574" y="88" width="132" height="48" rx="8" class="bad"/>
  <text x="640" y="108" class="badc2" text-anchor="middle">findByOrdererId</text>
  <text x="640" y="127" class="val" text-anchor="middle">이전 배송지</text>
  <text x="30" y="187" class="db">DB 배송지</text>
  <rect x="180" y="166" width="80" height="32" rx="6" class="dbbox"/>
  <text x="220" y="187" class="db" text-anchor="middle">이전</text>
  <rect x="320" y="166" width="80" height="32" rx="6" class="dbbox"/>
  <text x="360" y="187" class="db" text-anchor="middle">이전</text>
  <rect x="460" y="166" width="80" height="32" rx="6" class="dbbox"/>
  <text x="500" y="187" class="db" text-anchor="middle">이전</text>
  <rect x="600" y="166" width="80" height="32" rx="6" class="bad"/>
  <text x="640" y="187" class="badt" text-anchor="middle">이전</text>
  <text x="150" y="232" class="note">OrderSummary는 DB의 purchase_order를 읽으므로 커밋 전 변경을 보지 못함</text>
  <rect x="10" y="262" width="740" height="236" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="294" class="h">@Synchronize 지정 — 조회 전에 플러시</text>
  <text x="730" y="294" class="code" text-anchor="end">@Synchronize</text>
  <text x="220" y="320" class="step" text-anchor="middle">1. Order 조회</text>
  <text x="360" y="320" class="step" text-anchor="middle">2. 상태 변경</text>
  <text x="500" y="320" class="step" text-anchor="middle">3. 조회 전</text>
  <text x="640" y="320" class="step" text-anchor="middle">4. 결과</text>
  <line x1="160" y1="328" x2="722" y2="328" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="362" class="lane">코드</text>
  <text x="30" y="380" class="sub">한 트랜잭션</text>
  <rect x="150" y="336" width="585" height="56" rx="6" class="track"/>
  <rect x="154" y="340" width="132" height="48" rx="8" class="box"/>
  <text x="220" y="360" class="op2" text-anchor="middle">findById</text>
  <text x="220" y="379" class="val" text-anchor="middle">Order 로딩</text>
  <rect x="294" y="340" width="132" height="48" rx="8" class="hold"/>
  <text x="360" y="360" class="op2" text-anchor="middle">changeShipping</text>
  <text x="360" y="379" class="val" text-anchor="middle">메모리에만 반영</text>
  <rect x="434" y="340" width="132" height="48" rx="8" class="ok"/>
  <text x="500" y="360" class="okc" text-anchor="middle">flush</text>
  <text x="500" y="379" class="val" text-anchor="middle">먼저 DB에 반영</text>
  <rect x="574" y="340" width="132" height="48" rx="8" class="ok"/>
  <text x="640" y="360" class="okc2" text-anchor="middle">findByOrdererId</text>
  <text x="640" y="379" class="val" text-anchor="middle">변경된 배송지</text>
  <text x="30" y="439" class="db">DB 배송지</text>
  <rect x="180" y="418" width="80" height="32" rx="6" class="dbbox"/>
  <text x="220" y="439" class="db" text-anchor="middle">이전</text>
  <rect x="320" y="418" width="80" height="32" rx="6" class="dbbox"/>
  <text x="360" y="439" class="db" text-anchor="middle">이전</text>
  <rect x="460" y="418" width="80" height="32" rx="6" class="ok"/>
  <text x="500" y="439" class="okt" text-anchor="middle">새 값</text>
  <rect x="600" y="418" width="80" height="32" rx="6" class="ok"/>
  <text x="640" y="439" class="okt" text-anchor="middle">새 값</text>
  <text x="150" y="484" class="gnote">@Synchronize에 지정한 purchase_order에 변경이 있어 조회 전에 플러시함</text>
</svg>
