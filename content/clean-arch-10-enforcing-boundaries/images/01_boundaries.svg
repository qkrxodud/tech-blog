<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>설정, 어댑터, 애플리케이션, 도메인 계층이 바깥에서 안쪽으로 겹쳐 있고, 허용되는 의존성은 실선으로 안쪽을 향하며, 어댑터에서 팩터리로, 엔티티에서 아웃고잉 포트로, 서비스에서 어댑터로 향하는 허용되지 않는 의존성은 빨간 점선으로 표시한 그림</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 12px; font-weight: 700; fill: #374151; }
    .tsm { font-size: 12px; font-weight: 700; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .s { font-size: 12px; fill: #6b7280; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .pkg { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .pkgw { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badd { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6b7280" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect width="760" height="640" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="620" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">아키텍처 경계 — 의존성은 안쪽으로만</text>
  <text x="730" y="42" class="note" text-anchor="end">빨간 점선 — 허용되지 않는 의존성</text>

  <rect x="24" y="60" width="712" height="556" rx="18" fill="#ffffff" stroke="#c4c8ce" stroke-width="1.3"/>
  <text x="40" y="84" class="t">설정</text>
  <rect x="60" y="114" width="640" height="456" rx="16" fill="#f9fafb" stroke="#c4c8ce" stroke-width="1.3"/>
  <text x="76" y="138" class="t">어댑터</text>
  <rect x="104" y="230" width="552" height="290" rx="14" fill="#f3f4f6" stroke="#c4c8ce" stroke-width="1.3"/>
  <text x="120" y="506" class="t">애플리케이션</text>
  <rect x="290" y="300" width="180" height="140" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="306" y="324" class="t">도메인</text>

  <rect x="330" y="72" width="100" height="30" rx="4" class="box"/>
  <text x="380" y="92" class="ts" text-anchor="middle">팩터리</text>
  <rect x="330" y="578" width="100" height="30" rx="4" class="box"/>
  <text x="380" y="598" class="ts" text-anchor="middle">팩터리</text>

  <rect x="130" y="160" width="120" height="40" rx="4" class="box"/>
  <text x="190" y="185" class="ts" text-anchor="middle">어댑터</text>
  <rect x="510" y="160" width="120" height="40" rx="4" class="box"/>
  <text x="570" y="185" class="ts" text-anchor="middle">어댑터</text>

  <rect x="130" y="270" width="120" height="40" rx="4" class="box"/>
  <text x="190" y="295" class="ts" text-anchor="middle">인커밍 포트</text>
  <rect x="130" y="370" width="120" height="40" rx="4" class="box"/>
  <text x="190" y="395" class="ts" text-anchor="middle">서비스</text>
  <rect x="510" y="270" width="120" height="40" rx="4" class="box"/>
  <text x="570" y="295" class="ts" text-anchor="middle">아웃고잉 포트</text>
  <rect x="510" y="370" width="120" height="40" rx="4" class="box"/>
  <text x="570" y="395" class="ts" text-anchor="middle">서비스</text>

  <rect x="320" y="360" width="120" height="44" rx="4" class="box"/>
  <text x="380" y="387" class="ts" text-anchor="middle">엔티티</text>

  <line x1="360" y1="103" x2="214" y2="158" stroke="#6b7280" stroke-width="1.3" marker-end="url(#ag)"/>
  <line x1="400" y1="103" x2="546" y2="158" stroke="#6b7280" stroke-width="1.3" marker-end="url(#ag)"/>
  <line x1="350" y1="577" x2="206" y2="413" stroke="#6b7280" stroke-width="1.3" marker-end="url(#ag)"/>
  <line x1="410" y1="577" x2="554" y2="413" stroke="#6b7280" stroke-width="1.3" marker-end="url(#ag)"/>

  <line x1="190" y1="201" x2="190" y2="268" stroke="#6b7280" stroke-width="1.3" marker-end="url(#ag)"/>
  <line x1="190" y1="369" x2="190" y2="312" stroke="#6b7280" stroke-width="1.3" marker-end="url(#tri)"/>
  <line x1="251" y1="390" x2="318" y2="384" stroke="#6b7280" stroke-width="1.3" marker-end="url(#ag)"/>
  <line x1="509" y1="390" x2="442" y2="384" stroke="#6b7280" stroke-width="1.3" marker-end="url(#ag)"/>
  <line x1="570" y1="369" x2="570" y2="312" stroke="#6b7280" stroke-width="1.3" marker-end="url(#ag)"/>
  <line x1="570" y1="201" x2="570" y2="268" stroke="#6b7280" stroke-width="1.3" marker-end="url(#tri)"/>

  <path d="M129,180 H44 V96 H328" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <path d="M410,359 V290 H508" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <path d="M631,390 H676 V180 H632" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
</svg>
