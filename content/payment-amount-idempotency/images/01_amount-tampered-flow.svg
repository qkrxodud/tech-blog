  <rect x="18" y="242" width="726" height="44" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.2"/>
  <rect x="18" y="242" width="726" height="44" rx="8" fill="none" stroke="#dc2626" stroke-width="2.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.8;0.81;0.95;0.96;1"/></rect>
  <use href="#xmark" x="40" y="264"/>
  <text x="58" y="260" class="badt">결제 <tspan class="m">APPROVED</tspan> · Mock PG 승인 기록 <tspan class="m">[100]</tspan></text>
  <text x="58" y="278" class="bads">우리 기록은 15000원 결제가 승인된 것처럼 보이지만, 카드사에 승인된 금액은 100원</text>
  <text x="24" y="318" class="h2">3장 완성 코드 — 저장한 금액과 비교하고 다르면 멈춤</text>
  <rect x="144" y="336" width="456" height="94" rx="16" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="160" y="323" width="90" height="26" rx="6" fill="#5b7194"/>
