<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>appConfig.xml의 bean 태그 네 개가 id와 class로 빈을 정의하고, memberService와 orderService가 constructor-arg의 ref로 memberRepository와 discountPolicy를 가리키는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .pkg { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .gnote { font-size: 12px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="320" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">bean 태그 — id·class로 빈을 정의하고 ref로 주입한다</text>
  <text x="730" y="42" class="code" text-anchor="end">appConfig.xml</text>
  <rect x="30" y="76" width="270" height="62" rx="8" class="box"/>
  <text x="165.0" y="101" class="opm" text-anchor="middle">id="memberService"</text>
  <text x="165.0" y="122" class="ms" text-anchor="middle">hello.core.member.MemberServiceImpl</text>
  <rect x="30" y="206" width="270" height="62" rx="8" class="box"/>
  <text x="165.0" y="231" class="opm" text-anchor="middle">id="orderService"</text>
  <text x="165.0" y="252" class="ms" text-anchor="middle">hello.core.order.OrderServiceImpl</text>
  <rect x="440" y="76" width="290" height="62" rx="8" class="box"/>
  <text x="585.0" y="101" class="opm" text-anchor="middle">id="memberRepository"</text>
  <text x="585.0" y="122" class="ms" text-anchor="middle">hello.core.member.MemoryMemberRepository</text>
  <rect x="440" y="206" width="290" height="62" rx="8" class="box"/>
  <text x="585.0" y="231" class="opm" text-anchor="middle">id="discountPolicy"</text>
  <text x="585.0" y="252" class="ms" text-anchor="middle">hello.core.discount.RateDiscountPolicy</text>
  <line x1="302" y1="107" x2="436" y2="107" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="302" y1="224" x2="436" y2="126" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="302" y1="244" x2="436" y2="244" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="369" y="99" class="gnote" text-anchor="middle">ref</text>
  <text x="369" y="262" class="gnote" text-anchor="middle">ref</text>
  <text x="30" y="300" class="foot">상자 하나가 <tspan font-family="Menlo, Consolas, monospace">&lt;bean&gt;</tspan> 태그 하나이고, 화살표는 <tspan font-family="Menlo, Consolas, monospace">&lt;constructor-arg&gt;</tspan>의 <tspan font-family="Menlo, Consolas, monospace">ref</tspan>가 가리키는 빈입니다.</text>
</svg>
