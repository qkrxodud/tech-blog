<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>스레드 1이 애그리거트를 구하며 선점 잠금을 얻으면, 스레드 2는 잠금이 해제될 때까지 블로킹되었다가 스레드 1의 커밋 뒤에 잠금을 얻어 수정하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .valc { font-size: 12.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .dbt { font-size: 13px; font-weight: 700; fill: #374151; }
    .dbc { font-size: 14px; font-weight: 700; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="310" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">선점 잠금 — 먼저 구한 스레드가 끝날 때까지 대기</text>
  <text x="730" y="42" class="code" text-anchor="end">PESSIMISTIC_WRITE</text>
  <text x="199" y="68" class="step" text-anchor="middle">1</text>
  <text x="296" y="68" class="step" text-anchor="middle">2</text>
  <text x="393" y="68" class="step" text-anchor="middle">3</text>
  <text x="490" y="68" class="step" text-anchor="middle">4</text>
  <text x="587" y="68" class="step" text-anchor="middle">5</text>
  <text x="684" y="68" class="step" text-anchor="middle">6</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="117" class="lane">스레드 1</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="155" y="88" width="88" height="48" rx="8" class="hold"/>
  <text x="199" y="108" class="t" text-anchor="middle">구함</text>
  <text x="199" y="127" class="val" text-anchor="middle">선점 잠금</text>
  <rect x="252" y="88" width="88" height="48" rx="8" class="box"/>
  <text x="296" y="117.0" class="t" text-anchor="middle">수정</text>
  <rect x="349" y="88" width="88" height="48" rx="8" class="ok"/>
  <text x="393" y="108" class="okt" text-anchor="middle">커밋</text>
  <text x="393" y="127" class="val" text-anchor="middle">잠금 해제</text>
  <text x="30" y="177" class="lane">스레드 2</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="252" y="148" width="88" height="48" rx="8" class="box"/>
  <text x="296" y="168" class="t" text-anchor="middle">구함 시도</text>
  <text x="296" y="187" class="val" text-anchor="middle">잠금 대기</text>
  <rect x="349" y="156" width="88" height="32" rx="6" class="wait"/>
  <text x="393.0" y="177.0" class="waitt" text-anchor="middle">블로킹</text>
  <rect x="446" y="148" width="88" height="48" rx="8" class="hold"/>
  <text x="490" y="168" class="t" text-anchor="middle">구함</text>
  <text x="490" y="187" class="val" text-anchor="middle">선점 잠금</text>
  <rect x="543" y="148" width="88" height="48" rx="8" class="box"/>
  <text x="587" y="177.0" class="t" text-anchor="middle">수정</text>
  <rect x="640" y="148" width="88" height="48" rx="8" class="ok"/>
  <text x="684" y="168" class="okt" text-anchor="middle">커밋</text>
  <text x="684" y="187" class="val" text-anchor="middle">잠금 해제</text>
  <line x1="420" y1="136" x2="462" y2="147" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="235" class="db">잠금 보유</text>
  <rect x="155" y="214" width="282" height="32" rx="6" class="hold"/>
  <text x="296" y="235" class="dbt" text-anchor="middle">스레드 1</text>
  <rect x="446" y="214" width="282" height="32" rx="6" class="hold"/>
  <text x="587" y="235" class="dbt" text-anchor="middle">스레드 2</text>
  <text x="30" y="280" class="foot">스레드 2는 스레드 1이 커밋해 잠금을 해제한 뒤에야 애그리거트를 구하므로, 스레드 1이 바꾼 상태를 기준으로 수정합니다.</text>
  <text x="30" y="302" class="foot"><tspan font-family="Menlo, Consolas, monospace">@Lock(LockModeType.PESSIMISTIC_WRITE)</tspan>로 지정합니다.</text>
</svg>
