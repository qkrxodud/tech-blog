  <rect width="760" height="630" fill="#ffffff"/>
  <text x="24" y="28" class="h">시험 도구와 계약의 시간 값</text>
  <rect x="14" y="52" width="734" height="262" rx="16" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="26" y="40" width="120" height="24" rx="6" fill="#5b7194"/><text x="86" y="56.5" class="tab" text-anchor="middle">시험 도구</text>
  <rect x="26" y="66" width="236" height="112" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <use href="#i-plane" transform="translate(36,76) scale(0.7)"/>
  <text x="66" y="92" class="t2" style="font-size:12.5px"><tspan class="m">MessageFeed</tspan></text>
  <text x="38" y="116" class="s2" style="font-size:11px;fill:#1f2937">받는 쪽 토픽에 시험이 직접 실음</text><text x="38" y="133" class="s2" style="font-size:11px;fill:#1f2937">키 = 결제 번호</text><text x="38" y="150" class="s2" style="font-size:11px;fill:#1f2937">이벤트·명령 번호는 10억대부터</text>
  <rect x="270" y="66" width="236" height="112" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <use href="#i-db" transform="translate(280,76) scale(0.7)"/>
  <text x="310" y="92" class="t2" style="font-size:12.5px"><tspan class="m">ReceiverOutage</tspan></text>
  <text x="282" y="116" class="s2" style="font-size:11px;fill:#1f2937">관리자 계정으로 <tspan class="m">read_only</tspan> on/off</text><text x="282" y="133" class="s2" style="font-size:11px;fill:#1f2937">받는 쪽 쓰기가 곧바로 오류 1290</text><text x="282" y="150" class="s2" style="font-size:11px;fill:#1f2937">결제 서버·두 서비스 함께 막힘</text>
  <rect x="514" y="66" width="222" height="112" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <use href="#i-bolt" transform="translate(524,76) scale(0.7)"/>
  <text x="554" y="92" class="t2" style="font-size:12.5px">트리거</text>
  <text x="526" y="116" class="s2" style="font-size:11px;fill:#1f2937"><tspan class="m">signal sqlstate '45000'</tspan></text><text x="526" y="133" class="s2" style="font-size:11px;fill:#1f2937">한 주문·예약의 변경만 실패</text><text x="526" y="150" class="s2" style="font-size:11px;fill:#1f2937">일시 오류로 분류됨</text>
  <rect x="26" y="188" width="236" height="112" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <use href="#i-chart" transform="translate(36,198) scale(0.7)"/>
  <text x="66" y="214" class="t2" style="font-size:12.5px"><tspan class="m">TopicLag</tspan></text>
  <text x="38" y="238" class="s2" style="font-size:11px;fill:#1f2937">다 처리했다 = 소비자 그룹이</text><text x="38" y="255" class="s2" style="font-size:11px;fill:#1f2937">커밋한 자리가 토픽 끝에 닿음</text>
  <rect x="270" y="188" width="236" height="112" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <use href="#i-kafka" transform="translate(280,198) scale(0.7)"/>
  <text x="310" y="214" class="t2" style="font-size:12.5px">결제 이벤트 토픽</text>
  <text x="282" y="238" class="s2" style="font-size:11px;fill:#1f2937">컨텍스트마다 새 이름</text><text x="282" y="255" class="s2" style="font-size:11px;fill:#1f2937">번호가 컨텍스트마다 1부터라</text><text x="282" y="272" class="s2" style="font-size:11px;fill:#1f2937">같은 토픽이면 결정 1에 걸러짐</text>
  <rect x="514" y="188" width="222" height="112" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="526" y="210" class="gt" style="font-size:12.5px">만들지 않은 것</text>
  <text x="526" y="232" class="gs" style="font-size:11px">연결이 끊기는 장애</text><text x="526" y="248" class="gs" style="font-size:11px">처리 뒤 커밋 전에 다시 뜨는 경우</text><text x="526" y="264" class="gs" style="font-size:11px">→ 같은 메시지를 토픽에 한 번 더</text><text x="526" y="280" class="gs" style="font-size:11px">실어 대신함(가정)</text>
  <text x="24" y="344" class="t2">시간 축(초)</text>
