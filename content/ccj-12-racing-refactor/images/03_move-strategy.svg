<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>CarMoveStrategy가 MoveStrategy를 구현해 0부터 9 사이 값을 돌려주고, Car는 move(moveStrategy)로 그 값을 받아 4 이상이면 전진하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="340" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">전략 패턴 — Car는 MoveStrategy에게 이동 값을 받는다</text>
  <rect x="34" y="80" width="200" height="56" rx="8" class="hold"/>
  <text x="134" y="103" class="op" text-anchor="middle">MoveStrategy</text>
  <text x="134" y="123" class="val" text-anchor="middle">인터페이스 · int move()</text>
  <rect x="34" y="200" width="200" height="56" rx="8" class="box"/>
  <text x="134" y="223" class="op" text-anchor="middle">CarMoveStrategy</text>
  <text x="134" y="243" class="val" text-anchor="middle">0~9 사이 랜덤 값 반환</text>
  <line x1="134" y1="198" x2="134" y2="140" class="axis" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="146" y="174" class="sub">구현</text>
  <line x1="236" y1="108" x2="294" y2="108" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="265" y="98" class="sub" text-anchor="middle">값 전달</text>
  <rect x="298" y="80" width="200" height="56" rx="8" class="box"/>
  <text x="398" y="103" class="op" text-anchor="middle">move(moveStrategy)</text>
  <text x="398" y="123" class="val" text-anchor="middle">Car가 전략을 주입받음</text>
  <line x1="500" y1="108" x2="536" y2="108" class="axis" marker-end="url(#ar)"/>
  <rect x="540" y="80" width="190" height="56" rx="8" class="box"/>
  <text x="635" y="103" class="op" text-anchor="middle">isMove()</text>
  <text x="635" y="123" class="val" text-anchor="middle">4 이상인지 확인</text>
  <line x1="590" y1="138" x2="590" y2="196" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="582" y="172" class="gnote" text-anchor="end">4 이상</text>
  <line x1="680" y1="138" x2="680" y2="196" class="axis" marker-end="url(#ar)"/>
  <text x="690" y="172" class="sub">0~3</text>
  <rect x="545" y="200" width="90" height="44" rx="8" class="ok"/>
  <text x="590" y="227" class="okt" text-anchor="middle">전진</text>
  <rect x="640" y="200" width="90" height="44" rx="8" class="box"/>
  <text x="685" y="227" class="lane" text-anchor="middle" style="font-size:14px">멈춤</text>
  <text x="34" y="300" class="sub">어떤 값을 넘길지는 MoveStrategy 구현 클래스가 정하고, Car는 인터페이스만 알고 있습니다.</text>
  <text x="34" y="322" class="sub">이동 조건이 바뀌면 MoveStrategy를 구현한 다른 클래스를 넘기면 됩니다.</text>
</svg>
