  <rect width="760" height="432" fill="#ffffff"/>
  <text x="24" y="30" class="h">결정 3 — 거절을 알리는 방식마다 맞는 경우와 주의</text>
  <text x="24" y="52" class="gs" style="font-size:11px">점선은 구현해 돌려 보지 않은 방식</text>
  <rect x="24" y="72" width="228" height="44" rx="12" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="48" y="94"/>
  <text x="64" y="99" class="badt" style="font-size:12px">예외와 롤백 — 비교 A</text>
  <text x="38" y="142" class="gt" style="font-size:12px">맞는 경우</text>
  <rect x="24" y="152" width="228" height="80" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="38" y="176" class="t2" style="font-size:12.5px"></text>
  <text x="38" y="180" class="s" style="font-size:11px">거절된 결제를 남길 필요가 없고</text>
  <text x="38" y="200" class="s" style="font-size:11px">실패하면 모두 되돌리는 작업</text>
  <text x="38" y="220" class="s" style="font-size:11px">가장 단순함</text>
  <text x="38" y="258" class="gt" style="font-size:12px">주의</text>
  <rect x="24" y="268" width="228" height="80" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="38" y="292" class="t2" style="font-size:12.5px"></text>
  <text x="38" y="296" class="s" style="font-size:11px">거절 기록이 사라짐</text>
  <text x="38" y="316" class="s" style="font-size:11px">결제는 <tspan class="m">READY</tspan>로 남음</text>
  <rect x="266" y="72" width="228" height="44" rx="12" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="280" y="99" class="bt" style="font-size:12px"><tspan class="m">noRollbackFor</tspan> — 비교 A'</text>
  <text x="280" y="142" class="gt" style="font-size:12px">맞는 경우</text>
  <rect x="266" y="152" width="228" height="80" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="280" y="176" class="t2" style="font-size:12.5px"></text>
  <text x="280" y="180" class="s" style="font-size:11px">트랜잭션을 하나로 유지해야 하는데</text>
  <text x="280" y="200" class="s" style="font-size:11px">거절 기록은 남겨야 할 때</text>
  <text x="280" y="258" class="gt" style="font-size:12px">주의</text>
  <rect x="266" y="268" width="228" height="80" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="280" y="292" class="t2" style="font-size:12.5px"></text>
  <text x="280" y="296" class="s" style="font-size:11px">지정한 예외 타입에만 적용</text>
  <text x="280" y="316" class="s" style="font-size:11px">거절 예외 타입이 바뀌면 다시 롤백</text>
  <text x="280" y="336" class="s" style="font-size:11px">연결 대기 문제는 그대로</text>
  <rect x="508" y="72" width="228" height="44" rx="12" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="532" y="94"/>
  <text x="548" y="99" class="okt" style="font-size:12px">기록 후 <tspan class="m">200</tspan> + <tspan class="m">status</tspan> — 고름</text>
  <text x="522" y="142" class="gt" style="font-size:12px">고른 이유</text>
  <rect x="508" y="152" width="228" height="80" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="522" y="176" class="t2" style="font-size:12.5px"></text>
  <text x="522" y="180" class="s" style="font-size:11px">카드사 거절은 잘못된 요청이 아니라</text>
  <text x="522" y="200" class="s" style="font-size:11px">정상적으로 처리된 결과</text>
  <text x="522" y="258" class="gt" style="font-size:12px">주의</text>
  <rect x="508" y="268" width="228" height="80" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="522" y="292" class="t2" style="font-size:12.5px"></text>
  <text x="522" y="296" class="s" style="font-size:11px">부르는 쪽은 HTTP 상태만 보면 안 되고</text>
  <text x="522" y="316" class="s" style="font-size:11px">반드시 <tspan class="m">status</tspan>를 봐야 함</text>
  <text x="522" y="336" class="s" style="font-size:11px"><tspan class="m">422</tspan>면 상태만으로 거절을 알았음</text>
  <rect x="24" y="366" width="712" height="48" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="38" y="387" class="gt" style="font-size:12px">거절을 기록하고 커밋한 뒤 <tspan class="m">422</tspan>로 알리기</text>
  <text x="38" y="404" class="gs" style="font-size:10.5px">트랜잭션을 나눈 구조에서 할 수 있지만 구현해서 돌려 보지 않음</text>
</svg>
