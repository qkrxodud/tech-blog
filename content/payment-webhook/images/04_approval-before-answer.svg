  <rect width="760" height="462" fill="#ffffff"/>
  <text x="24" y="30" class="h">승인 알림이 승인 답보다 먼저 — 늦게 온 답은 남은 결과를 건드리지 않음</text>
  <rect x="16" y="44" width="728" height="32" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.2"/>
  <use href="#xs" x="34" y="60"/>
  <text x="50" y="64" class="bads">6장 출발 코드는 ⑤에서 <tspan class="m">Cannot APPROVE a payment in APPROVED status.</tspan>로 막힘</text>
  <rect x="16" y="88" width="728" height="74" fill="#f9fafb"/>
  <text x="28" y="122.0" class="t2">결제 서버</text>
  <text x="28" y="138.0" class="gs">승인 요청</text>
  <rect x="16" y="166" width="728" height="74" fill="#ffffff"/>
  <text x="28" y="208.0" class="t2">Mock PG</text>
  <rect x="16" y="244" width="728" height="74" fill="#f9fafb"/>
  <text x="28" y="278.0" class="t2">처리기</text>
  <text x="28" y="294.0" class="gs">웹훅</text>
  <rect x="16" y="322" width="728" height="52" fill="#ffffff"/>
  <text x="28" y="345.0" class="t2">DB</text>
  <text x="28" y="361.0" class="gs">결제 상태</text>
  <rect x="154" y="100" width="132" height="50" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <circle cx="154" cy="100" r="11" fill="#111827"/><text x="154" y="104" class="num" text-anchor="middle">1</text>
  <text x="168" y="121" class="t2">PG에 승인 요청</text>
  <text x="168" y="138" class="s">답을 기다림</text>
  <line x1="288" y1="140" x2="604" y2="140" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="446" y="130" class="gs" text-anchor="middle">승인 답을 기다리는 중</text>
  <path d="M220,150 V203 H304" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <rect x="306" y="178" width="132" height="50" rx="10" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <circle cx="306" cy="178" r="11" fill="#111827"/><text x="306" y="182" class="num" text-anchor="middle">2</text>
  <text x="320" y="199" class="t2">승인 기록 · 알림</text>
  <text x="320" y="216" class="s">승인 답은 붙잡아 둠</text>
  <line x1="440" y1="214" x2="604" y2="214" stroke="#c2410c" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#aor)"/>
  <text x="522" y="204" class="os" text-anchor="middle">처리한 뒤 답을 풀어 줌</text>
  <path d="M372,228 V281 H456" fill="none" stroke="#c2410c" stroke-width="1.5" marker-end="url(#aor)"/>
  <rect x="458" y="256" width="132" height="50" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="458" cy="256" r="11" fill="#111827"/><text x="458" y="260" class="num" text-anchor="middle">3</text>
  <text x="472" y="277" class="t2">알림 처리</text>
  <text x="472" y="294" class="s">PG 조회 → <tspan class="m">follow</tspan></text>
  <line x1="524" y1="306" x2="524" y2="332" stroke="#16a34a" stroke-width="1.5" marker-end="url(#agr)"/>
  <rect x="606" y="178" width="132" height="50" rx="10" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <circle cx="606" cy="178" r="11" fill="#111827"/><text x="606" y="182" class="num" text-anchor="middle">4</text>
  <text x="620" y="199" class="t2">붙잡은 답 보냄</text>
  <text x="620" y="216" class="s">승인 <tspan class="m">DONE</tspan></text>
  <line x1="672" y1="178" x2="672" y2="152" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <rect x="606" y="100" width="132" height="50" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <circle cx="606" cy="100" r="11" fill="#111827"/><text x="606" y="104" class="num" text-anchor="middle">5</text>
  <text x="620" y="121" class="t2">답 기록 건너뜀</text>
  <text x="620" y="138" class="s">기다리는 결제 아님</text>
  <rect x="162" y="335" width="118" height="26" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="221.0" y="352.0" class="gs" text-anchor="middle"><tspan class="m">AUTHENTICATED</tspan></text>
  <rect x="474" y="335" width="100" height="26" rx="8" fill="#e3f3e6" stroke="#16a34a" stroke-width="1.3"/>
  <text x="524.0" y="352.0" class="oks" text-anchor="middle"><tspan class="m">APPROVED</tspan></text>
  <rect x="612" y="335" width="124" height="26" rx="8" fill="#e3f3e6" stroke="#16a34a" stroke-width="1.3"/>
  <text x="674.0" y="352.0" class="oks" text-anchor="middle"><tspan class="m">APPROVED</tspan> 그대로</text>
  <line x1="282" y1="348" x2="470" y2="348" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#agy)"/>
  <rect x="16" y="390" width="728" height="58" rx="10" fill="#e3f3e6" stroke="#16a34a" stroke-width="1.5"/>
  <use href="#vmark" x="38" y="410"/>
  <text x="56" y="415" class="okt">승인 API는 지금 결과인 <tspan class="m">APPROVED</tspan>로 답함 — 결제는 승인 하나로 맞음</text>
  <text x="56" y="435" class="oks"><tspan class="m">recordApproval</tspan>은 <tspan class="m">isAwaitingApprovalResult()</tspan>일 때만 기록합니다 — 4장의 결과 모름 기록도 같습니다</text>
</svg>
