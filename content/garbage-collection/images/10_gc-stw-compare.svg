<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>Serial, Parallel, CMS, G1, ZGC 순서로 애플리케이션이 멈추는 구간이 짧아지고, GC 작업 중 애플리케이션과 동시에 진행되는 구간이 늘어나는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t13 { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okt13 { font-size: 13px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badt13 { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .m { font-family: Menlo, Consolas, monospace; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="380" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">GC 알고리즘별 멈추는 구간 — 개략 비교</text>
  <text x="735" y="42" class="step" text-anchor="end">시간 →</text>
  <text x="30" y="81" class="t">Serial GC</text>
  <text x="30" y="98" class="s">단일 스레드</text>
  <rect x="150" y="66" width="150" height="34" rx="4" class="hold"/>
  <rect x="300" y="66" width="170" height="34" rx="4" class="bad"/>
  <text x="385" y="88" class="badt13" text-anchor="middle">멈춤</text>
  <rect x="470" y="66" width="265" height="34" rx="4" class="hold"/>
  <text x="30" y="133" class="t">Parallel GC</text>
  <text x="30" y="150" class="s">여러 스레드</text>
  <rect x="150" y="118" width="150" height="34" rx="4" class="hold"/>
  <rect x="300" y="118" width="80" height="34" rx="4" class="bad"/>
  <text x="340" y="140" class="badt13" text-anchor="middle">멈춤</text>
  <rect x="380" y="118" width="355" height="34" rx="4" class="hold"/>
  <text x="30" y="185" class="t">CMS GC</text>
  <text x="30" y="202" class="s">Mark·Sweep 동시</text>
  <rect x="150" y="170" width="150" height="34" rx="4" class="hold"/>
  <rect x="300" y="170" width="18" height="34" rx="4" class="bad"/>
  <rect x="318" y="170" width="152" height="34" rx="4" class="ok"/>
  <text x="394" y="192" class="okt13" text-anchor="middle">동시 작업</text>
  <rect x="470" y="170" width="22" height="34" rx="4" class="bad"/>
  <rect x="492" y="170" width="118" height="34" rx="4" class="ok"/>
  <text x="551" y="192" class="okt13" text-anchor="middle">동시 작업</text>
  <rect x="610" y="170" width="125" height="34" rx="4" class="hold"/>
  <text x="30" y="237" class="t">G1 GC</text>
  <text x="30" y="254" class="s">Region 단위</text>
  <rect x="150" y="222" width="150" height="34" rx="4" class="hold"/>
  <rect x="300" y="222" width="16" height="34" rx="4" class="bad"/>
  <rect x="316" y="222" width="154" height="34" rx="4" class="ok"/>
  <text x="393" y="244" class="okt13" text-anchor="middle">동시 작업</text>
  <rect x="470" y="222" width="18" height="34" rx="4" class="bad"/>
  <rect x="488" y="222" width="52" height="34" rx="4" class="ok"/>
  <rect x="540" y="222" width="32" height="34" rx="4" class="bad"/>
  <rect x="572" y="222" width="163" height="34" rx="4" class="hold"/>
  <text x="30" y="289" class="t">ZGC</text>
  <text x="30" y="306" class="s">Relocate까지 동시</text>
  <rect x="150" y="274" width="150" height="34" rx="4" class="hold"/>
  <rect x="300" y="274" width="6" height="34" rx="4" class="bad"/>
  <rect x="306" y="274" width="144" height="34" rx="4" class="ok"/>
  <text x="378" y="296" class="okt13" text-anchor="middle">동시 작업</text>
  <rect x="450" y="274" width="6" height="34" rx="4" class="bad"/>
  <rect x="456" y="274" width="64" height="34" rx="4" class="ok"/>
  <rect x="520" y="274" width="6" height="34" rx="4" class="bad"/>
  <rect x="526" y="274" width="124" height="34" rx="4" class="ok"/>
  <text x="588" y="296" class="okt13" text-anchor="middle">동시 작업</text>
  <rect x="650" y="274" width="85" height="34" rx="4" class="hold"/>
  <rect x="150" y="336" width="14" height="14" rx="3" class="hold"/>
  <text x="170" y="348" class="s">애플리케이션 실행</text>
  <rect x="300" y="336" width="14" height="14" rx="3" class="bad"/>
  <text x="320" y="348" class="s">멈춤 (Stop-The-World)</text>
  <rect x="480" y="336" width="14" height="14" rx="3" class="ok"/>
  <text x="500" y="348" class="s">애플리케이션 실행 + GC 동시 작업</text>
  <text x="30" y="376" class="foot">아래로 갈수록 멈추는 구간이 짧고 잘게 나뉘며, 그 사이의 GC 작업은 애플리케이션과 동시에 진행됩니다.</text>
</svg>
