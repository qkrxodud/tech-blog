<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>11장 출발 코드의 주문 서비스에서 첫째·둘째 문제가 생기는 순서 — OrderPaymentService.apply는 받은 결과를 받은 기록(received_payment_event, 고유 키 없음)에 남긴 뒤 주문을 결과대로 바꾸고 updated_at을 지금 시각으로 바꿈. 첫째: 승인(번호 N)이 오면 받은 기록 1줄, 주문 PAID. 같은 승인 N이 다시 오면(결제 서버가 다시 보내거나 다시 읽음) 받은 기록이 2줄(기대 1)이 되고, 주문은 PAID 그대로지만 updated_at이 다시 바뀜. 둘째: 다른 결제에서 취소(승인보다 0.2초 뒤에 만든 결과)를 먼저 반영해 CANCELED가 된 뒤 그보다 먼저 만든 승인이 늦게 오면 받은 순서대로 따라 PAID로 돌아감(기대 CANCELED). 재고 서비스는 10장 예약 상태 전이로 두 문제 모두 재현되지 않은 그림</title>
