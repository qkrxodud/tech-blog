<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>placeOrder가 this.saveLog를 부르면 REQUIRES_NEW가 무시되어 로그가 트랜잭션 A 안에서 저장되고, 예외로 A가 롤백되면 주문과 로그가 함께 사라지는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 13.5px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 13.5px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badw { fill: #ffffff; stroke: #dc2626; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .badt { font-size: 13.5px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="436" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="416" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">this.saveLog() — REQUIRES_NEW가 무시된다</text>
  <text x="730" y="42" class="code" text-anchor="end">OrderService</text>
  <text x="220" y="68" class="step" text-anchor="middle">1단계</text>
  <text x="360" y="68" class="step" text-anchor="middle">2단계</text>
  <text x="500" y="68" class="step" text-anchor="middle">3단계</text>
  <text x="640" y="68" class="step" text-anchor="middle">4단계</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">트랜잭션 A</text>
  <text x="30" y="126" class="sub">placeOrder()</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <text x="30" y="168" class="lane">saveLog()</text>
  <text x="30" y="186" class="sub">REQUIRES_NEW</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="158" y="88" width="124" height="48" rx="8" class="box"/>
  <text x="220" y="107.5" class="op" text-anchor="middle">placeOrder()</text>
  <text x="220" y="126.5" class="val" text-anchor="middle">A 시작</text>
  <rect x="298" y="88" width="124" height="48" rx="8" class="hold"/>
  <text x="360" y="107.5" class="op" text-anchor="middle">this.saveLog()</text>
  <text x="360" y="126.5" class="val" text-anchor="middle">A 안에서 로그 저장</text>
  <rect x="298" y="156" width="124" height="32" rx="6" class="badw"/>
  <text x="360" y="177" class="note" text-anchor="middle">새 트랜잭션 없음</text>
  <rect x="438" y="88" width="124" height="48" rx="8" class="box"/>
  <text x="500" y="107.5" class="op" text-anchor="middle">save(order)</text>
  <text x="500" y="126.5" class="val" text-anchor="middle">A에 주문 저장</text>
  <rect x="578" y="88" width="124" height="48" rx="8" class="bad"/>
  <text x="640" y="107.5" class="badt" text-anchor="middle">예외 발생</text>
  <text x="640" y="126.5" class="val" text-anchor="middle">A 롤백</text>
  <line x1="283" y1="112" x2="296" y2="112" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="423" y1="112" x2="436" y2="112" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="563" y1="112" x2="576" y2="112" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="360" y1="138" x2="360" y2="155" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="30" y="243" class="db">DB의 주문</text>
  <rect x="460" y="222" width="80" height="32" rx="6" class="dbbox"/>
  <text x="500" y="243" class="db" text-anchor="middle">미커밋</text>
  <rect x="600" y="222" width="80" height="32" rx="6" class="bad"/>
  <text x="640" y="243" class="badt" text-anchor="middle">없음</text>
  <text x="30" y="287" class="db">DB의 로그</text>
  <rect x="320" y="266" width="80" height="32" rx="6" class="dbbox"/>
  <text x="360" y="287" class="db" text-anchor="middle">미커밋</text>
  <rect x="600" y="266" width="80" height="32" rx="6" class="bad"/>
  <text x="640" y="287" class="badt" text-anchor="middle">없음</text>
  <rect x="150" y="320" width="290" height="30" rx="15" class="bad"/>
  <text x="295" y="340" class="badt" text-anchor="middle">결과 — 로그도 주문과 함께 롤백</text>
  <text x="150" y="380" class="foot">this.saveLog()는 프록시를 거치지 않아 @Transactional(REQUIRES_NEW)가 적용되지 않습니다</text>
  <text x="150" y="400" class="foot">로그는 트랜잭션 A에 속해 있으므로 A가 롤백되면 함께 롤백됩니다</text>
</svg>
