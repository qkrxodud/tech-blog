  <circle cx="600" cy="72" r="10" fill="#111827"/><text x="600" y="76" class="num" text-anchor="middle">5</text>
  <use href="#i-doc" transform="translate(614,79) scale(0.85)"/>
  <text x="650" y="92" class="okt" style="font-size:12.5px">커밋</text>
  <text x="650" y="110" class="oks" style="font-size:10.5px">모두 풀림</text>
  <rect x="90" y="140" width="578" height="14" rx="7" fill="#fde68a" stroke="#d97706" stroke-width="1.2"/>
  <text x="82" y="151" class="s" text-anchor="end" style="font-size:10.5px">결제 줄</text>
  <rect x="234" y="164" width="434" height="14" rx="7" fill="#fde68a" stroke="#d97706" stroke-width="1.2"/>
  <text x="226" y="175" class="s" text-anchor="end" style="font-size:10.5px">재고 줄</text>
  <rect x="378" y="188" width="290" height="14" rx="7" fill="#fde68a" stroke="#d97706" stroke-width="1.2"/>
  <text x="370" y="199" class="s" text-anchor="end" style="font-size:10.5px">쿠폰 줄</text>
  <rect x="522" y="212" width="146" height="14" rx="7" fill="#fde68a" stroke="#d97706" stroke-width="1.2"/>
  <text x="514" y="223" class="s" text-anchor="end" style="font-size:10.5px">포인트 줄</text>
  <line x1="668" y1="134" x2="668" y2="236" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="676" y="230" class="oks" style="font-size:10.5px">풀림</text>
  <text x="40" y="256" class="gs" style="font-size:10.5px">막대 = 잠금을 쥐는 구간 · 결제 상태 UPDATE(<tspan class="m">AUTHENTICATED</tspan>)는 커밋 때 나감</text>
  <text x="40" y="274" class="gs" style="font-size:10.5px">같은 상품의 다른 주문은 재고 줄에서 기다림 — 그 사이 쿠폰·포인트를 잡고 인증을 남기는 시간까지</text>
  <rect x="24" y="290" width="712" height="62" rx="12" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="38" y="312" class="bt" style="font-size:11.5px">7장 남은 한계 "여러 결제를 한 트랜잭션에서 잠그는 기록이 생기면 다시 봐야 함"</text>
  <text x="38" y="334" class="bs" style="font-size:11px">이 장도 잠그는 결제는 하나 — 같은 걱정이 결제 밖의 줄(재고·쿠폰·포인트)로 넓어짐</text>
  <rect x="24" y="364" width="350" height="76" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="38" y="386" class="gt" style="font-size:12.5px">교착 상태</text>
  <text x="38" y="406" class="gs" style="font-size:11px">재고는 상품 번호 순으로 잡게 했을 뿐</text>
  <text x="38" y="424" class="gs" style="font-size:11px">이 장에서도 시험하지 않음</text>
  <rect x="386" y="364" width="350" height="76" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="400" y="386" class="gt" style="font-size:12.5px">재고 줄 하나에 몰린 주문의 대기</text>
  <text x="400" y="406" class="gs" style="font-size:11px">300건까지만 잼 · 그보다 많을 때와</text>
  <text x="400" y="424" class="gs" style="font-size:11px">인증 트랜잭션이 느려질 때는 실행 안 함</text>
  <rect x="24" y="72" width="132" height="48" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0928;0.1028;0.1528;0.1628;1"/></rect>
  <rect x="168" y="72" width="132" height="48" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2495;0.2595;0.3095;0.3195;1"/></rect>
  <rect x="312" y="72" width="132" height="48" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4063;0.4163;0.4663;0.4763;1"/></rect>
  <rect x="456" y="72" width="132" height="48" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5631;0.5731;0.6231;0.6331;1"/></rect>
  <rect x="600" y="72" width="136" height="48" rx="10" fill="none" stroke="#16a34a" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.77;0.78;0.91;0.92;1"/></rect>
