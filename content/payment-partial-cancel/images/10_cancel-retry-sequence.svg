<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 646" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>시간 초과 뒤 같은 키로 다시 온 취소 — Idempotency-Key cancel-1로 5000원 취소가 오면 결제 서버는 조회와 확인 뒤 REQUESTED를 커밋하고 Mock PG에 같은 키로 취소를 보내는데, 1초 안에 답이 오지 않아 결과 모름(UNKNOWN)을 커밋하고 504 PAYMENT_GATEWAY_NO_RESPONSE로 답한다. PG는 1.5초에 취소를 DONE으로 남겨 잔액이 10000원이 된다. 같은 키·같은 내용으로 다시 오면 결제를 조회해 결과를 기다리는 취소임을 보고 PG에 같은 키로 다시 보내고, PG는 다시 취소하지 않고 첫 응답을 200으로 돌려주며, 결제 서버는 DONE과 balance_after 10000을 기록하고 200 cancelStatus DONE, balanceAmount 10000으로 답한다. PG가 앞 요청을 처리 중이면 409 IDEMPOTENT_REQUEST_PROCESSING을 받아 취소를 그대로 두고 202로 답하고, 이미 결과를 남긴 취소면 PG를 부르지 않고 남긴 결과로 200을 준다</title>
