<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결과를 모르는 동안 어떻게 답할까 — 첫 승인 요청이 시간 초과로 끝난 뒤 같은 결제 키로 다시 보내면, 출발 코드는 504 뒤 결제가 AUTHENTICATED라 인증 전이를 다시 시도하다 거부되어 409 INVALID_PAYMENT_TRANSITION으로 답하고, 고른 방식은 504 뒤 APPROVAL_UNKNOWN 결제를 이미 보낸 요청으로 보아 PG를 부르지 않고 202와 status APPROVAL_UNKNOWN으로 답한다. 첫 요청부터 202로 답하는 방식은 구현해서 돌려 보지 않았다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #4b5563; }
    .m { font-family: Menlo, Consolas, monospace; }
    .lbl { font-size: 12px; fill: #4b5563; }
    .tab { font-size: 12.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .badt { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .bads { font-size: 12px; fill: #b91c1c; }
    .okt { font-size: 13px; font-weight: 700; fill: #15803d; }
    .oks { font-size: 12px; fill: #15803d; }
    .gt { font-size: 13px; font-weight: 700; fill: #6b7280; }
    .gs { font-size: 12px; fill: #6b7280; }
    .ot { font-size: 13px; font-weight: 700; fill: #b45309; }
    .os { font-size: 12px; fill: #b45309; }
    .o { stroke: #1f2937; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .spine { stroke: #1f2937; stroke-width: 1.5; fill: none; }
    .life { stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .run { stroke-dasharray: 5 4; animation: run 0.9s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -18; } }
    @media (prefers-reduced-motion: reduce) { .run { animation: none; } .anim { display: none; } }
  </style>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="aor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
    <g id="pkt">
      <rect x="-11" y="-8" width="22" height="16" rx="3" fill="#2dd4bf" stroke="#0f766e" stroke-width="1.5"/>
      <path d="M-10,-7 L0,1 L10,-7" fill="none" stroke="#0f766e" stroke-width="1.5"/>
    </g>
    <g id="pkt2">
      <rect x="-11" y="-8" width="22" height="16" rx="3" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/>
      <path d="M-10,-7 L0,1 L10,-7" fill="none" stroke="#c2410c" stroke-width="1.5"/>
    </g>
    <g id="xmark"><circle r="9" fill="#ef4444"/><path d="M-4,-4 L4,4 M4,-4 L-4,4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
    <g id="vmark"><circle r="9" fill="#22c55e"/><path d="M-4.5,0 L-1.5,3.5 L4.5,-3.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="omark"><circle r="9" fill="#f59e0b"/><path d="M-4,0 H4" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g>
    <g id="i-card"><rect x="0" y="3" width="32" height="22" rx="4" fill="#5eead4" class="o"/><rect x="0" y="8" width="32" height="5" fill="#1f2937"/><rect x="4" y="16" width="8" height="6" rx="1.5" fill="#fbbf24" class="o" stroke-width="1"/></g>
    <g id="i-chips"><rect x="0" y="4" width="13" height="14" rx="4" fill="#e5e7eb" class="o"/><rect x="21" y="4" width="13" height="14" rx="4" fill="#86efac" class="o"/><path d="M14,11 h6" class="o" fill="none"/><path d="M17,8 l3,3 l-3,3" class="o" fill="none"/></g>
    <g id="i-plane"><path d="M1,13 L31,1 L23,29 L15,19 Z" fill="#fdba74" class="o"/><path d="M15,19 L31,1 L11,16 Z" fill="#fb923c" class="o"/></g>
    <g id="i-coin"><circle cx="12" cy="12" r="11" fill="#fbbf24" class="o"/><circle cx="12" cy="12" r="7" fill="#fcd34d" stroke="#b45309" stroke-width="1"/><text x="12" y="16.5" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">₩</text></g>
    <g id="i-db"><path d="M1,5 v20 a13,5 0 0 0 26,0 v-20 a13,5 0 0 1 -26,0 z" fill="#60a5fa" class="o"/><path d="M1,15 a13,5 0 0 0 26,0" fill="none" class="o"/><ellipse cx="14" cy="5" rx="13" ry="5" fill="#bfdbfe" class="o"/></g>
    <g id="i-doc"><path d="M0,0 h18 l8,8 v26 h-26 z" fill="#ffffff" class="o"/><path d="M18,0 v8 h8" fill="#e5e7eb" class="o"/><circle cx="20" cy="26" r="8" fill="#22c55e" class="o"/><path d="M16.5,26 l2.5,2.5 l4.5,-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5,10 h9 M5,16 h7" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/></g>
    <g id="i-docx"><path d="M0,0 h18 l8,8 v26 h-26 z" fill="#ffffff" class="o"/><path d="M18,0 v8 h8" fill="#e5e7eb" class="o"/><circle cx="20" cy="26" r="8" fill="#ef4444" class="o"/><path d="M17,23 l6,6 M23,23 l-6,6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><path d="M5,10 h9 M5,16 h7" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/></g>
    <g id="i-server"><rect x="0" y="0" width="36" height="13" rx="3" fill="#cbd5e1" class="o"/><rect x="0" y="16" width="36" height="13" rx="3" fill="#cbd5e1" class="o"/><circle cx="7" cy="6.5" r="2.2" fill="#22c55e"/><circle cx="7" cy="22.5" r="2.2" fill="#22c55e"/><path d="M14,6.5 h16 M14,22.5 h16" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/></g>
    <g id="i-clock"><circle cx="14" cy="14" r="13" fill="#fde68a" class="o"/><path d="M14,7 V14 L20,18" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/></g>
    <g id="i-search"><circle cx="11" cy="11" r="9" fill="#bae6fd" class="o"/><path d="M18,18 L27,27" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/></g>
    <g id="i-undo"><circle cx="14" cy="14" r="13" fill="#fecaca" class="o"/><path d="M8,14 a6,6 0 1 1 6,6" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/><path d="M5,11 l3,3.5 l3.5,-3" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="i-pause"><circle cx="14" cy="14" r="13" fill="#e5e7eb" class="o"/><path d="M10,8 v12 M18,8 v12" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/></g>
  </defs>
  <rect width="760" height="450" fill="#ffffff"/>
  <text x="24" y="30" class="h">결과를 모르는 동안 어떻게 답할까 — 같은 결제 키로 다시 온 요청</text>
  <rect x="14" y="58" width="732" height="86" rx="16" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="28" y="45" width="300" height="26" rx="6" fill="#5b7194"/>
  <text x="178" y="63" class="tab" text-anchor="middle">같은 입력 — 첫 요청이 시간 초과로 끝남</text>
  <rect x="32" y="80" width="166" height="50" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <use href="#i-card" x="42" y="91"/>
  <text x="86" y="101" class="t2" style="font-size: 12.5px">승인 요청</text>
  <text x="86" y="119" class="s" style="font-size: 12px">결제 키와 금액</text>
  <circle cx="32" cy="80" r="10" fill="#111827"/><text x="32" y="84" class="num" text-anchor="middle">1</text>
  <line x1="198" y1="105" x2="213" y2="105" class="spine" marker-end="url(#ak)"/>
  <rect x="214" y="80" width="166" height="50" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <use href="#i-chips" x="224" y="94"/>
  <text x="268" y="101" class="t2" style="font-size: 12.5px">인증 전이</text>
  <text x="268" y="119" class="s m" style="font-size: 12px">AUTHENTICATED</text>
  <circle cx="214" cy="80" r="10" fill="#111827"/><text x="214" y="84" class="num" text-anchor="middle">2</text>
  <line x1="380" y1="105" x2="395" y2="105" class="spine" marker-end="url(#ak)"/>
  <rect x="396" y="80" width="166" height="50" rx="10" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <use href="#i-plane" x="406" y="91"/>
  <text x="450" y="101" class="t2" style="font-size: 12.5px">PG 승인 요청</text>
  <text x="450" y="119" class="s" style="font-size: 12px">1회</text>
  <circle cx="396" cy="80" r="10" fill="#111827"/><text x="396" y="84" class="num" text-anchor="middle">3</text>
  <line x1="562" y1="105" x2="577" y2="105" class="spine" marker-end="url(#ak)"/>
  <rect x="578" y="80" width="160" height="50" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#i-clock" x="588" y="91"/>
  <text x="632" y="101" class="t2" style="font-size: 12.5px">읽기 시간 초과</text>
  <text x="632" y="119" class="s" style="font-size: 12px">답을 받지 못함</text>
  <circle cx="578" cy="80" r="10" fill="#111827"/><text x="578" y="84" class="num" text-anchor="middle">4</text>
  <use href="#pkt2" x="40" y="166"/>
  <text x="60" y="171" class="lbl" style="fill: #c2410c">첫 응답을 받은 클라이언트가 같은 결제 키·금액으로 다시 보냄</text>
  <text x="217.0" y="200" class="gs" text-anchor="middle">첫 응답</text>
  <text x="337.0" y="200" class="gs" text-anchor="middle">결제 상태</text>
  <text x="493.0" y="200" class="gs" text-anchor="middle">다시 온 요청의 판단</text>
  <text x="660.0" y="200" class="gs" text-anchor="middle">재요청 응답</text>
  <text x="24" y="200" class="gs">선택지</text>
  <rect x="24" y="212" width="140" height="52" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="36" y="234" class="t2" style="font-size: 12.5px">4장 출발 코드</text>
  <text x="36" y="252" class="gs" style="font-size: 12px">지금처럼 409</text>
  <rect x="24" y="274" width="140" height="52" rx="10" fill="#e3f3e6" stroke="#16a34a" stroke-width="2"/>
  <text x="36" y="296" class="t2" style="font-size: 12.5px">이 장에서 고른 방식</text>
  <text x="36" y="314" class="gs" style="font-size: 12px">504 뒤 재요청은 202</text>
  <rect x="172" y="212" width="90" height="52" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.2"/>
  <text x="217.0" y="234" class="badt m" text-anchor="middle">504</text>
  <text x="217.0" y="251" class="bads" text-anchor="middle">응답 없음</text>
  <rect x="270" y="212" width="134" height="52" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.2"/>
  <text x="337.0" y="234" class="t2 m" style="font-size: 12px; fill: #1e3a8a" text-anchor="middle">AUTHENTICATED</text>
  <text x="337.0" y="251" class="s" style="font-size: 12px" text-anchor="middle">인증 기록 그대로</text>
  <rect x="412" y="212" width="162" height="52" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.2"/>
  <text x="493.0" y="234" class="s" style="font-size: 12px" text-anchor="middle">결과 없음으로 봄</text>
  <text x="493.0" y="251" class="s" style="font-size: 12px" text-anchor="middle">인증 전이 다시 시도 → 거부</text>
  <rect x="582" y="212" width="156" height="52" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.2"/>
  <use href="#xmark" x="600" y="230"/><text x="616" y="235" class="badt m">409</text>
  <text x="660" y="255" class="bads" text-anchor="middle" style="font-size: 12px">인증 전이 거부</text>
  <rect x="172" y="274" width="90" height="52" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.2"/>
  <text x="217.0" y="296" class="badt m" text-anchor="middle">504</text>
  <text x="217.0" y="313" class="bads" text-anchor="middle">응답 없음</text>
  <rect x="270" y="274" width="134" height="52" rx="8" fill="#e3f3e6" stroke="#16a34a" stroke-width="1.2"/>
  <text x="337.0" y="296" class="okt m" style="font-size: 12px" text-anchor="middle">APPROVAL_UNKNOWN</text>
  <text x="337.0" y="313" class="oks" style="font-size: 12px" text-anchor="middle">결과 모름 기록</text>
  <rect x="412" y="274" width="162" height="52" rx="8" fill="#ece8fb" stroke="#9b88d6" stroke-width="1.2"/>
  <text x="493.0" y="296" class="s" style="font-size: 12px" text-anchor="middle">같은 키 · 결과 모름</text>
  <text x="493.0" y="313" class="s" style="font-size: 12px" text-anchor="middle">이미 보낸 요청으로 봄</text>
  <rect x="582" y="274" width="156" height="52" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.2"/>
  <use href="#vmark" x="600" y="292"/><text x="616" y="297" class="okt m">202</text>
  <text x="660" y="317" class="oks m" text-anchor="middle" style="font-size: 12px">APPROVAL_UNKNOWN</text>
  <rect x="24" y="336" width="140" height="52" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="36" y="358" class="gt" style="font-size: 12.5px">첫 요청부터 202</text>
  <text x="36" y="376" class="gs" style="font-size: 12px">504 대신 상태 본문</text>
  <rect x="172" y="336" width="566" height="52" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="455" y="358" class="gt" text-anchor="middle">구현해서 돌려 보지 않음</text>
  <text x="455" y="376" class="gs" text-anchor="middle">2장의 계약과 오류 응답 규칙을 함께 바꿔야 함</text>
  <text x="24" y="416" class="s">두 방식 모두 다시 온 요청에서는 PG를 부르지 않음(PG 호출은 첫 요청의 1회). 갈리는 것은 재요청의 응답.</text>
  <text x="24" y="436" class="gs">고른 방식에서도 결제가 <tspan class="m">AUTHENTICATED</tspan>(답 대기·5xx·기록 실패)이면 다시 온 요청은 여전히 409</text>
</svg>
