<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>EnumType.ORDINAL은 enum의 순서 번호를 저장하므로, 일반 회원이 0으로 저장된 뒤 GUEST를 앞에 추가하면 같은 0이 GUEST로 읽혀 DB 데이터가 꼬이고, STRING은 이름을 저장해 순서가 바뀌어도 영향이 없다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .m { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="156" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">ORDINAL — enum의 순서 번호를 저장한다</text>
  <text x="730" y="42" class="code" text-anchor="end">EnumType.ORDINAL</text>
  <text x="30" y="92" class="sub">기존 순서</text>
  <rect x="120" y="66" width="150" height="40" rx="6" class="box"/>
  <text x="195" y="91" class="t" text-anchor="middle">일반 회원 = 0</text>
  <rect x="290" y="66" width="150" height="40" rx="6" class="box"/>
  <text x="365" y="91" class="t" text-anchor="middle">관리자 = 1</text>
  <rect x="520" y="66" width="210" height="40" rx="6" class="ok"/>
  <text x="625" y="91" class="okt" text-anchor="middle">저장된 0 → 일반 회원</text>
  <line x1="440" y1="86" x2="514" y2="86" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="142" class="sub">GUEST 추가 후</text>
  <rect x="120" y="116" width="110" height="40" rx="6" class="bad"/>
  <text x="175" y="141" class="badt" text-anchor="middle">GUEST = 0</text>
  <rect x="240" y="116" width="130" height="40" rx="6" class="box"/>
  <text x="305" y="141" class="t" text-anchor="middle">일반 회원 = 1</text>
  <rect x="380" y="116" width="110" height="40" rx="6" class="box"/>
  <text x="435" y="141" class="t" text-anchor="middle">관리자 = 2</text>
  <rect x="520" y="116" width="210" height="40" rx="6" class="bad"/>
  <text x="625" y="141" class="badt" text-anchor="middle">저장된 0 → GUEST</text>
  <line x1="490" y1="136" x2="514" y2="136" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="10" y="182" width="740" height="168" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="214" class="h">STRING — enum의 이름을 저장한다</text>
  <text x="730" y="214" class="code" text-anchor="end">EnumType.STRING</text>
  <text x="30" y="254" class="sub">GUEST 추가 후</text>
  <rect x="120" y="228" width="110" height="40" rx="6" class="box"/>
  <text x="175" y="253" class="t" text-anchor="middle">GUEST</text>
  <rect x="240" y="228" width="130" height="40" rx="6" class="box"/>
  <text x="305" y="253" class="t" text-anchor="middle">일반 회원</text>
  <rect x="380" y="228" width="110" height="40" rx="6" class="box"/>
  <text x="435" y="253" class="t" text-anchor="middle">관리자</text>
  <rect x="520" y="228" width="210" height="40" rx="6" class="ok"/>
  <text x="625" y="253" class="okt" text-anchor="middle">저장된 이름 그대로 읽힘</text>
  <line x1="490" y1="248" x2="514" y2="248" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="300" class="foot">순서 번호를 저장하는 ORDINAL은 누군가 순서를 앞에 등록하면 기존 데이터의 뜻이 바뀐다</text>
  <text x="30" y="322" class="foot">STRING은 순서가 바뀌어도 저장된 값에 영향이 없으므로 STRING으로 지정해서 사용한다</text>
</svg>
