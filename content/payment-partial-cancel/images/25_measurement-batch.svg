  <text x="528" y="160" class="gs" style="font-size:11.5px">읽기 시간 제한 1초</text>
  <text x="528" y="182" class="gs" style="font-size:11.5px">늦은 취소는 1.5초 뒤 답</text>
  <text x="528" y="204" class="gs" style="font-size:11.5px">묶음을 다 보낸 뒤</text>
  <text x="528" y="226" class="gs" style="font-size:11.5px">보정을 한 번</text>
  <text x="528" y="248" class="gs" style="font-size:11.5px">보정 시각은 대기 시간</text>
