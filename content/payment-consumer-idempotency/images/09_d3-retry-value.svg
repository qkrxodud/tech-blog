<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 3 다시 시도 값의 근거 — 시험 밖에서 MySQL 8.4 컨테이너를 docker restart 한 뒤 select 1이 성공할 때까지 잰 시간은 5번 2.62~3.04초(docker exec 시간 포함)이고, 운영 다시 시도는 같은 자리에서 1·2·4·8초(누적 1·3·7·15초, 기다림 합 15초)임. 15초는 잰 값의 약 5배이고 5배 여유는 가정이며, 계약에서만 2·4·4·4초(합 14초)를 씀. 한 번 기다리는 가장 긴 8초는 max.poll.interval.ms 기본값 5분보다 짧음. 잰 것은 이 머신의 재시작 시간뿐이고 운영 DB 전환 시간의 기준은 없으며, 비용은 다시 시도를 다 쓸 때까지 같은 파티션의 뒤 메시지가 기다리는 것인 그림</title>
