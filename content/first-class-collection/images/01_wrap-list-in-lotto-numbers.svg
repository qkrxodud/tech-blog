<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>List를 그대로 넘기면 사용하는 곳마다 Collections.sort()를 호출해야 하지만, LottoNumbers로 감싸면 List 하나만 멤버로 두고 생성할 때 정렬하는 구조 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .bt { font-size: 14px; font-weight: 700; fill: #1f2937; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="540" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="240" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">List를 그대로 넘길 때 — 정렬 코드가 호출하는 쪽마다 흩어진다</text>
  <rect x="30" y="104" width="200" height="56" rx="8" class="hold"/>
  <text x="130" y="127" class="op" text-anchor="middle">List&lt;LottoNumber&gt;</text>
  <text x="130" y="147" class="val" text-anchor="middle">번호 목록 그대로</text>
  <rect x="420" y="68" width="310" height="56" rx="8" class="bad"/>
  <text x="575" y="91" class="badt" text-anchor="middle">호출하는 쪽 A</text>
  <text x="575" y="111" class="val" text-anchor="middle">Collections.sort()를 직접 호출</text>
  <rect x="420" y="140" width="310" height="56" rx="8" class="bad"/>
  <text x="575" y="163" class="badt" text-anchor="middle">호출하는 쪽 B</text>
  <text x="575" y="183" class="val" text-anchor="middle">Collections.sort()를 직접 호출</text>
  <line x1="232" y1="122" x2="416" y2="98" class="axis" marker-end="url(#ar)"/>
  <line x1="232" y1="142" x2="416" y2="166" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="230" class="note">정렬된 번호가 필요한 곳마다 정렬 코드가 들어가야 합니다.</text>
  <rect x="10" y="266" width="740" height="264" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="298" class="h">LottoNumbers로 감쌀 때 — 규칙은 컬렉션 클래스 안에 있다</text>
  <text x="730" y="298" class="code" text-anchor="end">LottoNumbers.from()</text>
  <rect x="30" y="358" width="200" height="56" rx="8" class="box"/>
  <text x="130" y="381" class="bt" text-anchor="middle">호출하는 쪽</text>
  <text x="130" y="401" class="val" text-anchor="middle">LottoNumbers만 다룸</text>
  <line x1="232" y1="386" x2="296" y2="386" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="264" y="376" class="sub" text-anchor="middle">from()</text>
  <rect x="300" y="316" width="430" height="160" rx="10" class="ok"/>
  <text x="320" y="342" class="okc">LottoNumbers</text>
  <rect x="320" y="358" width="190" height="56" rx="8" class="hold"/>
  <text x="415" y="381" class="op" text-anchor="middle">List&lt;LottoNumber&gt;</text>
  <text x="415" y="401" class="val" text-anchor="middle">유일한 멤버 변수</text>
  <rect x="524" y="358" width="190" height="56" rx="8" class="box"/>
  <text x="619" y="381" class="op" text-anchor="middle">sort()</text>
  <text x="619" y="401" class="val" text-anchor="middle">생성할 때 한 번 정렬</text>
  <text x="320" y="452" class="sub">getLottoNumbers()로 정렬된 목록을 돌려줌</text>
  <text x="30" y="506" class="sub">정렬 규칙이 LottoNumbers 안에 모여 있어서, 호출하는 쪽에는 정렬 코드가 없습니다.</text>
</svg>
