<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>조건부 UPDATE를 고르며 처음 든 이유 — 7장의 결제 줄 잠금은 결제마다 줄이 달라 충돌이 적었지만 재고 줄은 같은 상품의 모든 주문이 한 줄을 바꿈. 재고 100개에 승인 300건을 보낸 측정(DB 연결 10개, Mock PG 바로 답)에서 변경 번호 + 다시 시도는 승인될 수 있는 100건에 다시 시도가 841~851번 일어났고 응답 중앙값은 조건부 UPDATE의 두 배 정도. select … for update와는 응답 중앙값 범위가 461~590ms와 437~629ms로 겹쳐 차이가 보이지 않았고, 두 방식 모두 바꾼 재고 줄의 잠금을 인증 트랜잭션이 끝날 때까지 쥠. 코드에서 확인한 차이는 읽기와 쓰기 두 문장이 한 문장이 된다는 점뿐</title>
