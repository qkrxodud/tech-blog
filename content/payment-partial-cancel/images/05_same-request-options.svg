  <text x="616" y="292" class="bads" style="font-size: 12px">재요청으로 봄</text>
  <rect x="16" y="326" width="166" height="32" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="28" y="347" class="gt" style="font-size: 12.5px">응답 본문 저장 테이블</text>
  <rect x="192" y="326" width="546" height="32" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="206" y="347" class="gs">HTTP 본문을 그대로 저장하는 별도 멱등 테이블 — 구현해서 돌려 보지 않음</text>
  <rect x="16" y="366" width="166" height="32" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
