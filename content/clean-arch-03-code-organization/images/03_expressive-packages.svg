  <rect x="412" y="356" width="276" height="36" rx="4" class="box"/>
  <text x="550" y="379" class="opm" text-anchor="middle"><tspan class="s" font-weight="400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">«interface» </tspan>LoadAccountPort</text>
  <rect x="412" y="400" width="276" height="36" rx="4" class="box"/>
  <text x="550" y="423" class="opm" text-anchor="middle"><tspan class="s" font-weight="400" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">«interface» </tspan>UpdateAccountStatePort</text>
  <line x1="329" y1="220" x2="410" y2="262" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#open)"/>
  <line x1="640" y1="193" x2="640" y2="248" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <path d="M705,174 H712 V374 H691" fill="none" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#open)"/>
  <path d="M712,374 V418 H691" fill="none" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#open)"/>
  <line x1="329" y1="318" x2="410" y2="370" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <line x1="329" y1="328" x2="410" y2="414" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <text x="30" y="562" class="foot">adapter 패키지의 클래스는 application 패키지의 포트 인터페이스를 통해서만 호출됨 — package-private로 두어도 됨</text>
