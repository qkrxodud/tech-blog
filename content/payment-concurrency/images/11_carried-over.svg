  <rect x="24" y="172" width="50" height="22" rx="11" fill="#475569"/>
  <text x="49" y="187" class="num" text-anchor="middle" style="font-size:11.5px">4장</text>
  <text x="86" y="188" class="s" style="fill:#1f2937">서버마다 도는 보정과 두 번 가는 망취소</text>
  <line x1="538" y1="183" x2="558" y2="183" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#agy)"/>
