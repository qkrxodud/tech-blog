  <rect width="760" height="470" fill="#ffffff"/>
  <text x="24" y="30" class="h">결정 3 — 결과 모름이 확정되기까지: 대기 시간 뒤 주기 보정에서 조회</text>
  <text x="24" y="52" class="gs">기본값 <tspan class="m">wait-after-request</tspan> 1분 · <tspan class="m">interval</tspan> 1분 · PG 시간 제한 연결 1초, 읽기 5초 · 시각은 <tspan class="m">Clock</tspan> 빈(UTC)</text>
  <line x1="40" y1="248" x2="724" y2="248" stroke="#374151" stroke-width="1.5"/>
  <line x1="60" y1="243" x2="60" y2="253" stroke="#374151" stroke-width="1.5"/>
  <text x="60" y="270" class="gs" text-anchor="middle" style="font-size:11.5px">0</text>
  <line x1="170" y1="243" x2="170" y2="253" stroke="#374151" stroke-width="1.5"/>
  <text x="170" y="270" class="gs" text-anchor="middle" style="font-size:11.5px">5초</text>
  <line x1="420" y1="243" x2="420" y2="253" stroke="#374151" stroke-width="1.5"/>
  <text x="420" y="270" class="gs" text-anchor="middle" style="font-size:11.5px">1분</text>
  <line x1="680" y1="243" x2="680" y2="253" stroke="#374151" stroke-width="1.5"/>
  <text x="680" y="270" class="gs" text-anchor="middle" style="font-size:11.5px">2분</text>
  <rect x="262" y="245" width="16" height="6" fill="#ffffff"/>
  <path d="M258,256 l8,-16 M270,256 l8,-16" stroke="#374151" stroke-width="1.5" fill="none"/>
  <rect x="24" y="74" width="150" height="52" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="36" y="95" class="t2" style="font-size:12px">인증 커밋</text>
  <text x="36" y="113" class="s" style="font-size:11px"><tspan class="m">authenticated_at</tspan> 남김</text>
  <line x1="60" y1="128" x2="60" y2="240" stroke="#7b93c9" stroke-width="1.2" marker-end="url(#ak)"/>
  <rect x="186" y="74" width="214" height="52" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="198" y="95" class="badt" style="font-size:12px">PG 답 없음 · 읽기 시간 제한</text>
  <text x="198" y="113" class="bads" style="font-size:11px"><tspan class="m">APPROVAL_UNKNOWN</tspan> · 504</text>
  <path d="M293,127 V150 H170 V240" fill="none" stroke="#e08a8a" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="60" y="196" width="360" height="24" rx="5" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.2"/>
  <text x="240" y="213" class="os" text-anchor="middle" style="font-size:11px"><tspan class="m">wait-after-request</tspan> — 이 동안은 보정 대상이 아님</text>
  <rect x="420" y="196" width="260" height="24" rx="5" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.2"/>
  <text x="550" y="213" class="bs" text-anchor="middle" style="font-size:11px;font-weight:700">이 사이 처음 도는 회차가 조회해 닫음</text>
  <path d="M420,226 V234 H680 V226" fill="none" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="420" y="74" width="316" height="92" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="432" y="95" class="t2" style="font-size:12px">주기 보정(<tspan class="m">@Scheduled</tspan> <tspan class="m">fixedDelay</tspan>)</text>
  <text x="432" y="114" class="s" style="font-size:11px">앞 보정이 끝난 뒤 <tspan class="m">interval</tspan>만큼 쉬고 다시 돎</text>
  <text x="432" y="132" class="s" style="font-size:11px"><tspan class="m">now − wait-after-request</tspan>보다 먼저 인증한</text>
  <text x="432" y="150" class="s" style="font-size:11px">결과 모름·인증 결제를 오래된 것부터 100건</text>
  <line x1="550" y1="168" x2="550" y2="192" stroke="#2563eb" stroke-width="1.2" marker-end="url(#abl)"/>
  <rect x="420" y="282" width="304" height="26" rx="6" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.2"/>
  <text x="572" y="300" class="oks" text-anchor="middle" style="font-size:11.5px;font-weight:700">확정까지 1~2분 — 그동안 고객은 "확인 중"</text>
  <text x="60" y="300" class="gs" style="font-size:11px">축은 0~5초 구간을 늘려 그림</text>
  <line x1="16" y1="326" x2="744" y2="326" stroke="#d1d5db" stroke-width="1"/>
  <rect x="24" y="340" width="352" height="116" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="38" y="364" class="badt" style="font-size:12.5px">PG가 조회에 답하지 않으면</text>
  <text x="38" y="388" class="bads" style="font-size:11px">조회도 승인과 같은 PG 클라이언트 — 읽기 5초</text>
  <text x="38" y="408" class="bads" style="font-size:11px">한 회차에 100건 × 5초까지 기다릴 수 있음</text>
  <rect x="388" y="340" width="348" height="116" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="402" y="364" class="gt" style="font-size:12px">측정 — 첫 보정의 조회에만 늦게 답하게 함</text>
  <text x="402" y="392" class="badt" style="font-size:15px">확정까지 보정 2번 · 16322ms</text>
  <text x="402" y="414" class="gs" style="font-size:11px">읽기 시간 제한 1초로 잰 값</text>
  <text x="402" y="431" class="gs" style="font-size:11px">운영의 대기 시간과 주기는 들어 있지 않음</text>
  <text x="402" y="448" class="gs" style="font-size:10.5px">첫 보정의 조회가 시간 제한에 걸리고 둘째에서 닫힘</text>
</svg>
