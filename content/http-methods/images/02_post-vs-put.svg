<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 426" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>POST는 클라이언트가 요청 데이터만 보내고 서버가 새 리소스를 식별해 생성하며, PUT은 클라이언트가 /members/{id}를 지정해 리소스가 있으면 대체하고 없으면 생성하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="426" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="160" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">POST — 새 리소스는 서버가 식별</text>
  <text x="40" y="68" class="sub">클라이언트</text>
  <text x="330" y="68" class="sub">서버</text>
  <rect x="40" y="76" width="220" height="52" rx="8" class="box"/>
  <text x="150" y="97" class="op" text-anchor="middle">POST</text>
  <text x="150" y="117" class="val" text-anchor="middle">요청 데이터 전송</text>
  <line x1="266" y1="102" x2="324" y2="102" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="330" y="76" width="400" height="52" rx="8" class="ok"/>
  <text x="530" y="97" class="okt" text-anchor="middle">서버가 아직 식별하지 않은 새 리소스를 생성</text>
  <text x="530" y="117" class="val" text-anchor="middle">새 리소스의 위치(URI)는 서버가 정함</text>
  <text x="40" y="154" class="sub">클라이언트는 만들어질 리소스의 URI를 모른 채 요청 데이터만 보냅니다.</text>

  <rect x="10" y="186" width="740" height="230" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="218" class="h">PUT — 클라이언트가 URI를 지정</text>
  <text x="40" y="244" class="sub">클라이언트</text>
  <text x="420" y="244" class="sub">서버</text>
  <rect x="40" y="280" width="240" height="52" rx="8" class="box"/>
  <text x="160" y="301" class="op" text-anchor="middle">PUT /members/{id}</text>
  <text x="160" y="321" class="val" text-anchor="middle">대체할 리소스 전송</text>
  <line x1="286" y1="296" x2="414" y2="278" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="286" y1="316" x2="414" y2="342" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="420" y="252" width="310" height="52" rx="8" class="ok"/>
  <text x="575" y="273" class="okt" text-anchor="middle">리소스가 있으면 대체</text>
  <text x="575" y="293" class="val" text-anchor="middle">기존 리소스를 완전히 덮어씀</text>
  <rect x="420" y="318" width="310" height="52" rx="8" class="ok"/>
  <text x="575" y="339" class="okt" text-anchor="middle">리소스가 없으면 생성</text>
  <text x="575" y="359" class="val" text-anchor="middle">지정한 URI에 신규 리소스 생성</text>
  <text x="40" y="398" class="sub">클라이언트가 리소스 위치를 알고 URI를 지정한다는 점이 POST와의 차이입니다.</text>
</svg>
