<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 3 측정 — 결과 200건을 쌓아 두고 서버 두 대가 비운 처리량을 두 번 실행 × 3번의 범위로 그린 막대. 작업 잠금 한 대(운영)는 88~98건/초, 다 보낸 시간 2042~2273ms, 중복·순서 위반·주문 어긋남 0. 잠그지 않음은 77~86건/초, 2324~2597ms, 중복 198~200, 순서 위반 결제 12~47, 주문 어긋남 0~1. 한 줄씩 나눠 보내기(skip locked)는 146~159건/초, 1256~1366ms, 중복 0, 순서 위반 결제 2~8, 주문 어긋남 2~8</title>
