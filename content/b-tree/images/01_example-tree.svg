  <text x="30" y="338" class="foot">키 k개인 노드는 자식이 k+1개이고, 각 자식은 부모의 두 키 사이 값만 저장합니다.</text>
  <text x="30" y="358" class="foot">루트 노드부터 모든 리프 노드까지 경로의 길이가 같습니다.</text>
