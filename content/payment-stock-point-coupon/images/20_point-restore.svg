  <rect width="760" height="420" fill="#ffffff"/>
  <text x="24" y="30" class="h">포인트를 돌려줄 때 — 이력을 먼저 남기고, 들어간 때만 잔액 +=</text>
  <text x="24" y="52" class="gs" style="font-size:11px"><tspan class="m">point_history</tspan>의 <tspan class="m">(payment_id, type)</tspan> unique 키 · 곳마다 따로 되돌리는 비교에서 거절 하나를 세 기록이 닫을 때</text>
  <text x="38" y="86" class="gs" style="font-size:11.5px">돌려주는 기록</text>
  <text x="236" y="86" class="gs" style="font-size:11px"><tspan class="m">insert ignore … RESTORE</tspan></text>
  <text x="470" y="86" class="gs" style="font-size:11.5px"><tspan class="m">point_wallet</tspan> 잔액</text>
