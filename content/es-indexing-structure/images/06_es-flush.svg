<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 524" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>Elasticsearch flush 전후 상태 — fsync로 세그먼트를 디스크에 확정하고 translog를 비우며, 페이지 캐시의 세그먼트는 남는다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 14px; font-weight: 600; fill: #1f2937; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opn { font-size: 13px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .lbl { font-size: 12.5px; font-weight: 700; fill: #6b7280; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="524" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="504" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">ElasticSearch의 flush — 디스크에 확정하고 translog를 비운다</text>
  <rect x="160" y="62" width="258" height="34" rx="6" class="hold"/>
  <text x="289" y="84" class="t" text-anchor="middle">flush 전 (refresh 후)</text>
  <rect x="472" y="62" width="258" height="34" rx="6" class="hold"/>
  <text x="601" y="84" class="t" text-anchor="middle">flush 후</text>
  <text x="30" y="134.0" class="lane">JVM Heap</text>
  <text x="30" y="152.0" class="sub">buffer</text>
  <rect x="150" y="100" width="590" height="72" rx="6" class="track"/>
  <rect x="160" y="108" width="258" height="56" rx="8" class="wait"/>
  <text x="289" y="141" class="t2" text-anchor="middle">buffer: (비워짐)</text>
  <rect x="472" y="108" width="258" height="56" rx="8" class="wait"/>
  <text x="601" y="141" class="t2" text-anchor="middle">buffer: (비워짐)</text>
  <text x="30" y="232.0" class="lane">Page Cache</text>
  <text x="30" y="250.0" class="sub">세그먼트</text>
  <rect x="150" y="198" width="590" height="72" rx="6" class="track"/>
  <rect x="160" y="206" width="258" height="56" rx="8" class="ok"/>
  <text x="289" y="229" class="okt" text-anchor="middle">Segment_0: [문서 A]</text>
  <text x="289" y="248" class="val" text-anchor="middle">검색은 여기서</text>
  <rect x="472" y="206" width="258" height="56" rx="8" class="ok"/>
  <text x="601" y="229" class="okt" text-anchor="middle">Segment_0: [문서 A]</text>
  <text x="601" y="248" class="val" text-anchor="middle">지워지지 않음 — 검색은 계속 메모리에서</text>
  <text x="30" y="339.0" class="lane">Disk</text>
  <text x="30" y="357.0" class="sub">영속 영역</text>
  <rect x="150" y="296" width="590" height="90" rx="6" class="track"/>
  <rect x="160" y="304" width="258" height="74" rx="8" class="hold"/>
  <text x="289" y="336" class="t" text-anchor="middle">translog: [문서 A 색인 작업]</text>
  <text x="289" y="355" class="val" text-anchor="middle">세그먼트는 아직 디스크에 없음</text>
  <rect x="472" y="304" width="258" height="74" rx="8" class="ok"/>
  <text x="601" y="326" class="okt" text-anchor="middle">Segment_0: [문서 A]</text>
  <text x="601" y="345" class="t2" text-anchor="middle">translog: (비워짐)</text>
  <text x="601" y="364" class="val" text-anchor="middle">커밋 포인트 기록</text>
  <line x1="420" y1="79" x2="468" y2="79" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="603" y1="264" x2="603" y2="302" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="614" y="283" class="op">fsync()</text>
  <text x="30" y="436" class="sub">Lucene commit이 fsync()로 세그먼트를 디스크와 동기화하고 커밋 포인트를 남기면,</text>
  <text x="30" y="454" class="sub">Elasticsearch flush가 필요 없어진 translog를 비웁니다.</text>
  <text x="30" y="480" class="note">디스크 I/O를 유발하므로 refresh보다 훨씬 무겁습니다.</text>
</svg>
