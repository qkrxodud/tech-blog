  <rect width="760" height="616" fill="#ffffff"/>
  <text x="24" y="30" class="h">결과 모름 취소에 알림이 오면 — 기다리는 우리 취소와 먼저 짝짓기</text>
  <text x="24" y="50" class="s">결제 15000원 · 우리 취소 5000원 <tspan class="m">UNKNOWN</tspan>(보정 대기 10초 전) · PG는 그 취소를 끝냄</text>
  <rect x="60" y="62" width="280" height="44" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <use href="#i-bell" x="74" y="70"/>
  <text x="112" y="80" class="t2">취소 알림</text>
  <text x="112" y="97" class="s">본문 <tspan class="m">status: PARTIAL_CANCELED</tspan></text>
