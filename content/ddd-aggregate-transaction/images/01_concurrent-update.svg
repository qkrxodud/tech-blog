<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>운영자 스레드와 고객 스레드가 같은 주문 애그리거트를 각각 구한 뒤, 운영자는 배송 상태를 바꿔 커밋하고 고객은 배송지를 바꿔 커밋해 배송 중인 주문의 배송지가 바뀌는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .valc { font-size: 12.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .dbt { font-size: 13px; font-weight: 700; fill: #374151; }
    .dbc { font-size: 14px; font-weight: 700; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="340" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">동시 수정 — 두 스레드가 같은 주문 애그리거트를 수정</text>
  <text x="730" y="42" class="code" text-anchor="end">Order</text>
  <text x="220" y="68" class="step" text-anchor="middle">1단계</text>
  <text x="360" y="68" class="step" text-anchor="middle">2단계</text>
  <text x="500" y="68" class="step" text-anchor="middle">3단계</text>
  <text x="640" y="68" class="step" text-anchor="middle">4단계</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">운영자</text>
  <text x="30" y="126" class="sub">스레드</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="108" class="t" text-anchor="middle">주문 구함</text>
  <text x="220" y="127" class="val" text-anchor="middle">기존 배송지</text>
  <rect x="302" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="360" y="108" class="t" text-anchor="middle">배송 상태 변경</text>
  <text x="360" y="127" class="val" text-anchor="middle">기존 배송지 기준</text>
  <rect x="442" y="88" width="116" height="48" rx="8" class="hold"/>
  <text x="500" y="117.0" class="t" text-anchor="middle">커밋</text>
  <text x="30" y="168" class="lane">고객</text>
  <text x="30" y="186" class="sub">스레드</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="148" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="168" class="t" text-anchor="middle">주문 구함</text>
  <text x="220" y="187" class="val" text-anchor="middle">기존 배송지</text>
  <rect x="302" y="148" width="116" height="48" rx="8" class="box"/>
  <text x="360" y="168" class="t" text-anchor="middle">배송지 변경</text>
  <text x="360" y="187" class="val" text-anchor="middle">새 배송지 입력</text>
  <rect x="582" y="148" width="116" height="48" rx="8" class="hold"/>
  <text x="640" y="177.0" class="t" text-anchor="middle">커밋</text>
  <text x="30" y="235" class="db">배송 상태</text>
  <rect x="170" y="214" width="100" height="32" rx="6" class="dbbox"/>
  <text x="220" y="235.0" class="dbt" text-anchor="middle">배송 전</text>
  <rect x="310" y="214" width="100" height="32" rx="6" class="dbbox"/>
  <text x="360" y="235.0" class="dbt" text-anchor="middle">배송 전</text>
  <rect x="450" y="214" width="100" height="32" rx="6" class="dbbox"/>
  <text x="500" y="235.0" class="dbt" text-anchor="middle">배송 중</text>
  <rect x="590" y="214" width="100" height="32" rx="6" class="dbbox"/>
  <text x="640" y="235.0" class="dbt" text-anchor="middle">배송 중</text>
  <text x="30" y="275" class="db">배송지</text>
  <rect x="170" y="254" width="100" height="32" rx="6" class="dbbox"/>
  <text x="220" y="275.0" class="dbt" text-anchor="middle">기존</text>
  <rect x="310" y="254" width="100" height="32" rx="6" class="dbbox"/>
  <text x="360" y="275.0" class="dbt" text-anchor="middle">기존</text>
  <rect x="450" y="254" width="100" height="32" rx="6" class="dbbox"/>
  <text x="500" y="275.0" class="dbt" text-anchor="middle">기존</text>
  <rect x="590" y="254" width="100" height="32" rx="6" class="bad"/>
  <text x="640" y="275.0" class="badt" text-anchor="middle">새 배송지</text>
  <text x="30" y="318" class="foot">운영자는 기존 배송지 기준으로 배송을 시작했는데, 그 뒤 고객의 커밋으로 배송지가 바뀌어 일관성이 깨집니다.</text>
</svg>
