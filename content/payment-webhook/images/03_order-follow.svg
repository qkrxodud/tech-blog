  <text x="122" y="161" class="t2">PG에 다시 조회</text>
  <text x="122" y="178" class="s"><tspan class="m">findPayment(orderId)</tspan></text>
  <line x1="340" y1="156" x2="614" y2="156" stroke="#c2410c" stroke-width="1.5" class="run" marker-end="url(#aor)"/>
  <line x1="614" y1="174" x2="342" y2="174" stroke="#c2410c" stroke-width="1.5" class="run" marker-end="url(#aor)"/>
  <text x="477" y="150" class="os" text-anchor="middle"><tspan class="m">GET …/orders/{orderId}</tspan></text>
  <text x="477" y="190" class="os" text-anchor="middle"><tspan class="m">CANCELED</tspan> · <tspan class="m">cancels</tspan> 1건</text>
