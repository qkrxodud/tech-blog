<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 1에서 재고를 인증 트랜잭션 밖으로 뺀 결과 — 8장은 인증 트랜잭션 안에서 재고를 줄이다 모자라면 인증째 롤백해 결제가 준비 상태로 남고 409로 답함. 10장은 인증(쿠폰·포인트)을 커밋한 뒤 재고 서비스에 예약하고, 모자라면 결제를 승인 없이 실패(APPROVAL_FAILED)로 닫고 쿠폰·포인트를 돌려준 뒤 409 OUT_OF_STOCK으로 답하며, 결과 상태가 되어 9장 릴레이를 거쳐 주문 서비스에 PAYMENT_FAILED가 감. 409로 답하는 것과 카드사에 승인을 요청하지 않는 것은 8장 그대로이고, 포인트·쿠폰이 모자란 결제는 8장처럼 준비 상태로 남음. 재고를 인증 트랜잭션 밖으로 뺀 이유는 HTTP를 기다리는 동안 결제 DB 트랜잭션과 결제 줄 잠금을 쥐지 않기 위해서와, 포인트가 모자라 인증이 롤백될 때 재고 서비스에 이미 줄인 재고가 남지 않게 하려는 것이며 출발 코드에서 이것으로 실패한 8장 계약 1개가 결정 1 커밋에서 통과함</title>
