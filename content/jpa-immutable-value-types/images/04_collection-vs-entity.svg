<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>좋아하는 음식은 값 타입 컬렉션 테이블에 회원 ID와 값만 저장되고, 주소 이력은 자체 ID를 가진 ADDRESS 엔티티 테이블에 저장되어 행마다 식별자로 추적할 수 있는 구조 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .msg { font-size: 11.5px; fill: #374151; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .cont { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="344" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="324" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">값 타입 컬렉션 vs 엔티티로 매핑</text>
  <text x="30" y="68" class="t" text-anchor="start">favoriteFoods — 값 타입 컬렉션</text>
  <text x="30" y="104" class="db" text-anchor="start">컬렉션 테이블</text>
  <rect x="30" y="112" width="220" height="28" rx="4" class="hold"/>
  <text x="85.0" y="131" class="ts" text-anchor="middle">회원 ID</text>
  <text x="195.0" y="131" class="ts" text-anchor="middle">값</text>
  <rect x="30" y="140" width="220" height="28" rx="0" class="box"/>
  <text x="85.0" y="159" class="val" text-anchor="middle">1</text>
  <text x="195.0" y="159" class="val" text-anchor="middle">치킨</text>
  <rect x="30" y="168" width="220" height="28" rx="0" class="box"/>
  <text x="85.0" y="187" class="val" text-anchor="middle">1</text>
  <text x="195.0" y="187" class="val" text-anchor="middle">족발</text>
  <rect x="30" y="196" width="220" height="28" rx="0" class="box"/>
  <text x="85.0" y="215" class="val" text-anchor="middle">1</text>
  <text x="195.0" y="215" class="val" text-anchor="middle">피자</text>
  <line x1="140" y1="112" x2="140" y2="224" stroke="#d1d5db" stroke-width="1"/>
  <rect x="30" y="244" width="220" height="32" rx="6" class="bad"/>
  <text x="140" y="265" class="badt" text-anchor="middle">행을 구분할 식별자 없음</text>
  <text x="300" y="68" class="t" text-anchor="start">addressHistory — AddressEntity</text>
  <text x="300" y="104" class="db" text-anchor="start">ADDRESS 테이블</text>
  <rect x="300" y="112" width="430" height="28" rx="4" class="hold"/>
  <text x="343.0" y="131" class="ts" text-anchor="middle">ID (PK)</text>
  <text x="424.0" y="131" class="ts" text-anchor="middle">회원 FK</text>
  <text x="494.0" y="131" class="ts" text-anchor="middle">city</text>
  <text x="571.0" y="131" class="ts" text-anchor="middle">street</text>
  <text x="673.0" y="131" class="ts" text-anchor="middle">zipcode</text>
  <rect x="300" y="140" width="430" height="28" rx="0" class="box"/>
  <text x="343.0" y="159" class="val" text-anchor="middle">생성된 ID</text>
  <text x="424.0" y="159" class="val" text-anchor="middle">1</text>
  <text x="494.0" y="159" class="val" text-anchor="middle">old1</text>
  <text x="571.0" y="159" class="val" text-anchor="middle">street</text>
  <text x="673.0" y="159" class="val" text-anchor="middle">zipcode</text>
  <rect x="300" y="168" width="430" height="28" rx="0" class="box"/>
  <text x="343.0" y="187" class="val" text-anchor="middle">생성된 ID</text>
  <text x="424.0" y="187" class="val" text-anchor="middle">1</text>
  <text x="494.0" y="187" class="val" text-anchor="middle">old2</text>
  <text x="571.0" y="187" class="val" text-anchor="middle">street</text>
  <text x="673.0" y="187" class="val" text-anchor="middle">zipcode</text>
  <line x1="386" y1="112" x2="386" y2="196" stroke="#d1d5db" stroke-width="1"/>
  <line x1="462" y1="112" x2="462" y2="196" stroke="#d1d5db" stroke-width="1"/>
  <line x1="526" y1="112" x2="526" y2="196" stroke="#d1d5db" stroke-width="1"/>
  <line x1="616" y1="112" x2="616" y2="196" stroke="#d1d5db" stroke-width="1"/>
  <rect x="300" y="216" width="430" height="32" rx="6" class="ok"/>
  <text x="515" y="237" class="okt" text-anchor="middle">ID로 행 하나하나를 추적·수정할 수 있음</text>
  <text x="300" y="276" class="sub" text-anchor="start">Address 값 타입은 AddressEntity 안에 그대로 들어갑니다</text>
  <text x="300" y="296" class="sub" text-anchor="start">영속성 전이 + 고아 객체 제거로 값 타입 컬렉션처럼 사용</text>
</svg>
