  <rect width="760" height="500" fill="#ffffff"/>
  <text x="24" y="30" class="h">측정 두 가지의 조건 — <tspan class="m">./gradlew outboxMeasurement</tspan></text>
  <text x="24" y="52" class="gs">서비스를 시험 JVM 안에서 바로 부름 · k6는 돌리지 않음 · 방식마다 3번, 앞에 작은 묶음 한 번 버림, 전체 두 번 실행</text>
  <rect x="24" y="72" width="350" height="410" rx="16" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="36" y="82" width="260" height="24" rx="6" fill="#5b7194"/>
  <text x="166.0" y="98.5" class="tab" text-anchor="middle">보내는 방식마다 — 브로커를 끊음</text>
  <text x="40" y="128" class="bs" style="font-size:11px"><tspan class="m">EventDeliveryMeasurement</tspan></text>
  <rect x="40" y="140" width="318" height="68" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="40" cy="140" r="10" fill="#111827"/><text x="40" y="144" class="num" text-anchor="middle">1</text>
  <use href="#i-card" transform="translate(54,150) scale(0.9)"/>
  <text x="96" y="162" class="bt" style="font-size:12px">결제 60건</text>
  <text x="96" y="180" class="bs" style="font-size:10.5px">스레드 3개 · 0.2초 간격</text>
  <text x="96" y="197" class="bs" style="font-size:10.5px">승인하고 바로 전액 취소</text>
  <line x1="199" y1="209" x2="199" y2="221" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ak)"/>
  <rect x="40" y="222" width="318" height="51" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="40" cy="222" r="10" fill="#111827"/><text x="40" y="226" class="num" text-anchor="middle">2</text>
  <use href="#i-doc" transform="translate(54,232) scale(0.9)"/>
  <text x="96" y="244" class="bt" style="font-size:12px">이벤트 120건</text>
  <text x="96" y="262" class="bs" style="font-size:10.5px">결제마다 승인 · 취소 두 건</text>
  <line x1="199" y1="274" x2="199" y2="286" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ak)"/>
  <rect x="40" y="287" width="318" height="51" rx="10" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <circle cx="40" cy="287" r="10" fill="#111827"/><text x="40" y="291" class="num" text-anchor="middle">3</text>
  <use href="#i-warn" transform="translate(54,297) scale(0.9)"/>
  <text x="96" y="309" class="t2" style="font-size:12px">1초 뒤부터 4초 끊음</text>
  <text x="96" y="327" class="s" style="font-size:10.5px">시험 보내기 시간 제한 3초</text>
  <line x1="199" y1="339" x2="199" y2="351" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ak)"/>
  <rect x="40" y="352" width="318" height="68" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="40" cy="352" r="10" fill="#111827"/><text x="40" y="356" class="num" text-anchor="middle">4</text>
  <use href="#i-search" transform="translate(54,362) scale(0.9)"/>
  <text x="96" y="374" class="bt" style="font-size:12px">다 올 때까지 기다려 셈</text>
  <text x="96" y="392" class="bs" style="font-size:10.5px">보낼 것이 남지 않고</text>
  <text x="96" y="409" class="bs" style="font-size:10.5px">받은 수가 3초 동안 그대로</text>
  <text x="40" y="446" class="bs" style="font-size:10.5px">키 없는 방식도 기본 파티셔너 · 릴레이는 0.1초마다</text>
  <rect x="386" y="72" width="350" height="410" rx="16" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="398" y="82" width="270" height="24" rx="6" fill="#5b7194"/>
  <text x="533.0" y="98.5" class="tab" text-anchor="middle">릴레이를 나누는 방식마다 — 끊지 않음</text>
