<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 3 재고 서비스의 예약 줄 상태 전이 — 예약이 먼저 도착하면 claim이 성공해 RESERVED(잡음)가 되고 상품 번호 순으로 재고를 줄임. 해제가 먼저 도착하면 claim이 성공해 상품 없는 RELEASED 줄(빈 해제 줄)을 남김. RESERVED는 확정(canConfirm)으로 CONFIRMED, 해제(holdsStock)로 RELEASED가 되고, CONFIRMED도 전액 취소면 RELEASED가 됨. 해제하면 returnStock이 담은 수량만큼 재고를 늘림. CONFIRMED에 다시 온 확정, RELEASED에 다시 온 해제와 늦게 온 확정은 아무것도 바꾸지 않고, RELEASED에 늦게 온 예약은 409 RESERVATION_RELEASED로 받지 않음</title>
