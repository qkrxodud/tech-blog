  <text x="30" y="126" class="s2"><tspan class="m">job_lock</tspan> 표 하나, 작업마다 한 줄</text>
  <text x="30" y="145" class="s2">결제·알림 표에 칸을 더하지 않음</text>
  <text x="304" y="100" class="oks" text-anchor="end">이 장에서 고름</text>
