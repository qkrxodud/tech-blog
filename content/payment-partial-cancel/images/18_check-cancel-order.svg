  <line x1="342" y1="384" x2="384" y2="384" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="60" y="114" width="280" height="46" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <use href="#i-card" x="74" y="123"/>
  <text x="118" y="134" class="t2" style="font-size:12.5px">취소 요청</text>
  <text x="118" y="151" class="s" style="font-size:10.5px">금액(없을 수 있음) · 사유 · 키</text>
  <rect x="60" y="176" width="280" height="46" rx="10" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <circle cx="60" cy="176" r="10" fill="#111827"/><text x="60" y="180" class="num" text-anchor="middle">1</text>
  <text x="78" y="196" class="t2" style="font-size:12px">전이 표에 <tspan class="m">CANCEL</tspan>이 있나</text>
  <text x="78" y="213" class="s" style="font-size:10.5px"><tspan class="m">status.refuses(CANCEL)</tspan></text>
  <rect x="60" y="238" width="280" height="46" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="60" cy="238" r="10" fill="#111827"/><text x="60" y="242" class="num" text-anchor="middle">2</text>
  <text x="78" y="258" class="t2" style="font-size:12px">금액 정하기</text>
  <text x="78" y="275" class="s" style="font-size:10.5px">없으면 받을 수 있는 금액 전부</text>
  <rect x="60" y="300" width="280" height="46" rx="10" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <circle cx="60" cy="300" r="10" fill="#111827"/><text x="60" y="304" class="num" text-anchor="middle">3</text>
  <text x="78" y="320" class="t2" style="font-size:12px">0원보다 큰가</text>
  <text x="78" y="337" class="s" style="font-size:10.5px"><tspan class="m">isNotPositive</tspan></text>
  <rect x="60" y="362" width="280" height="46" rx="10" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <circle cx="60" cy="362" r="10" fill="#111827"/><text x="60" y="366" class="num" text-anchor="middle">4</text>
  <text x="78" y="382" class="t2" style="font-size:12px">받을 수 있는 금액 안인가</text>
  <text x="78" y="399" class="s" style="font-size:10.5px"><tspan class="m">compareTo(cancelableAmount())</tspan></text>
  <rect x="386" y="176" width="336" height="62" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="404" y="199"/>
  <text x="420" y="196" class="badt" style="font-size:12px">아니오 → <tspan class="m">409</tspan></text>
  <text x="420" y="213" class="bads" style="font-size:10.5px"><tspan class="m">INVALID_PAYMENT_TRANSITION</tspan></text>
  <text x="404" y="230" class="bads" style="font-size:9.5px">승인 전 · 인증 · 인증 실패 · 승인 실패 · 결과 모름 · 만료 · 이미 취소</text>
  <rect x="386" y="300" width="336" height="46" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="404" y="323"/>
  <text x="420" y="320" class="badt" style="font-size:12px">아니오 → <tspan class="m">400</tspan></text>
  <text x="420" y="337" class="bads" style="font-size:10.5px"><tspan class="m">INVALID_AMOUNT</tspan></text>
  <rect x="386" y="362" width="336" height="46" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="404" y="385"/>
  <text x="420" y="382" class="badt" style="font-size:12px">넘음 → <tspan class="m">409</tspan></text>
  <text x="420" y="399" class="bads" style="font-size:10.5px"><tspan class="m">CANCEL_AMOUNT_EXCEEDS_BALANCE</tspan></text>
  <rect x="386" y="246" width="336" height="44" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="400" y="264" class="t2" style="font-size:11.5px">받을 수 있는 금액</text>
  <text x="400" y="281" class="s" style="font-size:10.5px">= 남은 금액 − PG 답을 기다리는 취소</text>
  <line x1="342" y1="266" x2="384" y2="266" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3 3"/>
  <rect x="60" y="424" width="280" height="66" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <circle cx="60" cy="424" r="10" fill="#111827"/><text x="60" y="428" class="num" text-anchor="middle">5</text>
  <use href="#i-doc" transform="translate(78,440) scale(0.9)"/>
  <text x="118" y="446" class="okt" style="font-size:12px"><tspan class="m">REQUESTED</tspan> 취소로 남김</text>
  <text x="118" y="464" class="oks" style="font-size:10.5px">그 금액으로 요청 기록 커밋</text>
  <text x="118" y="481" class="oks" style="font-size:10.5px">→ 트랜잭션 밖에서 PG로</text>
  <rect x="386" y="424" width="336" height="66" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="400" y="446" class="t2" style="font-size:11.5px">금액 없이 온 취소</text>
  <text x="400" y="464" class="s" style="font-size:10.5px">PG에는 정한 금액을 <tspan class="m">cancelAmount</tspan>로 적어 보냄</text>
  <text x="400" y="481" class="s" style="font-size:10.5px">예: 5000원 취소 뒤 금액 없이 → PG에 10000원</text>
  <rect x="60" y="176" width="280" height="46" rx="10" fill="none" stroke="#d97706" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1689;0.1789;0.2289;0.2389;1"/></rect>
  <rect x="60" y="238" width="280" height="46" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3277;0.3377;0.3877;0.3977;1"/></rect>
  <rect x="60" y="300" width="280" height="46" rx="10" fill="none" stroke="#d97706" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4866;0.4966;0.5466;0.5566;1"/></rect>
