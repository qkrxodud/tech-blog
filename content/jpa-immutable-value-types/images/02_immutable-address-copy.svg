<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>setter가 없는 불변 Address를 회원마다 생성자로 따로 만들어 넣고, 값을 바꿀 때도 새 Address를 만들어 교체하므로 member3의 주소는 그대로 남는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .msg { font-size: 11.5px; fill: #374151; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .cont { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="206" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">불변 객체 — 회원마다 새 인스턴스를 생성해서 넣음</text>
  <text x="730" y="42" class="code" text-anchor="end">new Address(...)</text>
  <rect x="30" y="66" width="150" height="48" rx="8" class="box"/>
  <text x="105" y="87" class="opm" text-anchor="middle">member1</text>
  <text x="105" y="105" class="val" text-anchor="middle">Member</text>
  <rect x="30" y="140" width="150" height="48" rx="8" class="box"/>
  <text x="105" y="161" class="opm" text-anchor="middle">member3</text>
  <text x="105" y="179" class="val" text-anchor="middle">Member</text>
  <rect x="250" y="66" width="230" height="48" rx="8" class="hold"/>
  <text x="365" y="87" class="opm" text-anchor="middle">Address@x01</text>
  <text x="365" y="105" class="val" text-anchor="middle">test1, test1, test1</text>
  <rect x="250" y="140" width="230" height="48" rx="8" class="hold"/>
  <text x="365" y="161" class="opm" text-anchor="middle">Address@x02</text>
  <text x="365" y="179" class="val" text-anchor="middle">test2, test2, test2</text>
  <line x1="180" y1="90" x2="246" y2="90" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="180" y1="164" x2="246" y2="164" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="530" y="86" class="val" text-anchor="start">생성자로만 값을 설정</text>
  <text x="530" y="106" class="val" text-anchor="start">setter 없음</text>
  <text x="530" y="160" class="val" text-anchor="start">서로 다른 인스턴스이므로</text>
  <text x="530" y="180" class="val" text-anchor="start">공유되지 않음</text>
  <rect x="10" y="232" width="740" height="228" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="264" class="h">값을 바꿀 때 — 고치지 않고 새 인스턴스로 교체</text>
  <text x="730" y="264" class="code" text-anchor="end">setHomeAddress(new Address(...))</text>
  <rect x="30" y="288" width="150" height="48" rx="8" class="box"/>
  <text x="105" y="309" class="opm" text-anchor="middle">member1</text>
  <text x="105" y="327" class="val" text-anchor="middle">Member</text>
  <rect x="30" y="372" width="150" height="48" rx="8" class="box"/>
  <text x="105" y="393" class="opm" text-anchor="middle">member3</text>
  <text x="105" y="411" class="val" text-anchor="middle">Member</text>
  <rect x="250" y="288" width="230" height="48" rx="8" class="ok"/>
  <text x="365" y="309" class="okm" text-anchor="middle">Address@x03</text>
  <text x="365" y="327" class="val" text-anchor="middle">생성자로 새 값을 설정</text>
  <line x1="180" y1="312" x2="246" y2="312" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="540" y="288" width="190" height="48" rx="8" class="wait"/>
  <text x="635" y="309" class="opm" text-anchor="middle">Address@x01</text>
  <text x="635" y="327" class="waitt" text-anchor="middle">기존 인스턴스는 수정 안 함</text>
  <text x="510" y="317" class="step" text-anchor="middle">대신</text>
  <rect x="250" y="372" width="230" height="48" rx="8" class="hold"/>
  <text x="365" y="393" class="opm" text-anchor="middle">Address@x02</text>
  <text x="365" y="411" class="val" text-anchor="middle">test2, test2, test2</text>
  <line x1="180" y1="396" x2="246" y2="396" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="540" y="380" width="190" height="32" rx="6" class="ok"/>
  <text x="635" y="401" class="okt" text-anchor="middle">member3는 영향 없음</text>
  <text x="30" y="446" class="sub" text-anchor="start">setter가 없으므로 <tspan font-family="Menlo, Consolas, monospace">getHomeAddress()</tspan>로 꺼낸 값을 직접 고칠 수 없습니다</text>
</svg>
