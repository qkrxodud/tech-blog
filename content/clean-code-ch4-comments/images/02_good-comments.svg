<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>코드로 의도를 표현할 수 있으면 함수 이름으로 바꾸고, 그렇지 않을 때 법적인 주석, 결과를 경고하는 주석, TODO 주석, 중요성을 강조하는 주석을 남기는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 12.5px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="760" height="310" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="290" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">좋은 주석 — 코드로 표현할 수 없을 때 남기는 주석</text>
  <rect x="30" y="66" width="170" height="44" rx="8" class="hold"/>
  <text x="115" y="93" class="t" text-anchor="middle">주석을 달고 싶을 때</text>
  <line x1="202" y1="88" x2="228" y2="88" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="232" y="66" width="266" height="44" rx="8" class="box"/>
  <text x="365" y="93" class="t" text-anchor="middle">코드로 의도를 표현할 수 있는가?</text>
  <text x="519" y="80" class="s" text-anchor="middle">예</text>
  <line x1="500" y1="88" x2="536" y2="88" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="540" y="66" width="190" height="44" rx="8" class="ok"/>
  <text x="635" y="93" class="okt" text-anchor="middle">코드로 의도 표현</text>
  <line x1="365" y1="110" x2="365" y2="146" stroke="#6b7280" stroke-width="1.4"/>
  <text x="378" y="134" class="s">아니오</text>
  <line x1="114.5" y1="146" x2="645.5" y2="146" stroke="#6b7280" stroke-width="1.4"/>
  <line x1="114.5" y1="146" x2="114.5" y2="176" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ag)"/>
  <rect x="30" y="180" width="169" height="66" rx="8" class="box"/>
  <text x="114.5" y="207" class="t2" text-anchor="middle">법적인 주석</text>
  <text x="114.5" y="229" class="s" text-anchor="middle">저작권·소유권 정보</text>
  <line x1="291.5" y1="146" x2="291.5" y2="176" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ag)"/>
  <rect x="207" y="180" width="169" height="66" rx="8" class="box"/>
  <text x="291.5" y="207" class="t2" text-anchor="middle">결과를 경고하는 주석</text>
  <text x="291.5" y="229" class="s" text-anchor="middle">결과를 미리 경고</text>
  <line x1="468.5" y1="146" x2="468.5" y2="176" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ag)"/>
  <rect x="384" y="180" width="169" height="66" rx="8" class="box"/>
  <text x="468.5" y="207" class="t2" text-anchor="middle">TODO 주석</text>
  <text x="468.5" y="229" class="s" text-anchor="middle">앞으로 할 일</text>
  <line x1="645.5" y1="146" x2="645.5" y2="176" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ag)"/>
  <rect x="561" y="180" width="169" height="66" rx="8" class="box"/>
  <text x="645.5" y="207" class="t2" text-anchor="middle">중요성을 강조하는 주석</text>
  <text x="645.5" y="229" class="s" text-anchor="middle">trim이 중요한 이유</text>
  <text x="30" y="282" class="foot">정말로 좋은 주석은 주석을 달지 않을 방법을 찾아낸 주석입니다.</text>
</svg>
