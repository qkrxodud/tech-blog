<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>2장 완성 코드의 ./gradlew check 결과 — 전체 241개 = 1장 218개 + 2장 23개가 통과. 2장 23개는 카드사 승인 뒤 승인 기록 실패 2, 카드사 답을 기다리다 그만두면 1, 결제 승인 운영 구현 4, 비교 B' TransactionTemplate 4, 결제 API 11, 승인 대기 중 조회 운영 설정 1. 결제 API 11개는 출발 코드의 8개에 PG 서버 오류 502, 지원하지 않는 HTTP 방식 405, 같은 주문번호로 다시 준비(지금은 500)를 더한 것. JaCoCo 라인 커버리지 98.9%, 명령어 99.6%(빌드 문턱 90%는 명령어 기준), 분기 87.5%는 16개 중 14개이고 지나가지 않은 2개는 statusOf의 INVALID_INPUT·INTERNAL 분기. 비교 구현은 기본 빌드에서 빼고 ./gradlew knownFailingTest로 13개 중 6개 실패를 기록</title>
