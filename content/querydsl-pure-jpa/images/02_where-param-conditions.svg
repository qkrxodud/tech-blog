<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>MemberSearchCondition에 teamName teamB와 ageGoe 40만 들어오면 usernameEq와 ageLoe는 null을, teamNameEq는 team.name.eq teamB를, ageGoe는 member.age.goe 40을 반환하고, where 절은 null을 무시해 두 조건만 and로 묶는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .msg { font-size: 11.5px; fill: #374151; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .cont { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="420" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">Where절 파라미터 — 들어온 조건만 남음</text>
  <text x="730" y="42" class="code" text-anchor="end">/v1/members?teamName=teamB&amp;ageGoe=40</text>
  <text x="30" y="76" class="step" text-anchor="start">검색 조건 값</text>
  <text x="250" y="76" class="step" text-anchor="start">조건 메서드</text>
  <text x="460" y="76" class="step" text-anchor="start">반환값</text>
  <rect x="30" y="88" width="190" height="46" rx="8" class="hold"/>
  <text x="125.0" y="116.0" class="ts" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">username</tspan> = 없음</text>
  <rect x="250" y="88" width="180" height="46" rx="8" class="box"/>
  <text x="340.0" y="116.0" class="opm" text-anchor="middle">usernameEq(…)</text>
  <rect x="460" y="88" width="270" height="46" rx="8" class="wait"/>
  <text x="595.0" y="116.0" class="waitt" text-anchor="middle">null 반환</text>
  <line x1="220" y1="111" x2="246" y2="111" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="430" y1="111" x2="456" y2="111" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="30" y="146" width="190" height="46" rx="8" class="hold"/>
  <text x="125.0" y="174.0" class="opm" text-anchor="middle">teamName = "teamB"</text>
  <rect x="250" y="146" width="180" height="46" rx="8" class="box"/>
  <text x="340.0" y="174.0" class="opm" text-anchor="middle">teamNameEq(…)</text>
  <rect x="460" y="146" width="270" height="46" rx="8" class="ok"/>
  <text x="595.0" y="174.0" class="okm" text-anchor="middle">team.name.eq("teamB")</text>
  <line x1="220" y1="169" x2="246" y2="169" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="430" y1="169" x2="456" y2="169" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="30" y="204" width="190" height="46" rx="8" class="hold"/>
  <text x="125.0" y="232.0" class="opm" text-anchor="middle">ageGoe = 40</text>
  <rect x="250" y="204" width="180" height="46" rx="8" class="box"/>
  <text x="340.0" y="232.0" class="opm" text-anchor="middle">ageGoe(…)</text>
  <rect x="460" y="204" width="270" height="46" rx="8" class="ok"/>
  <text x="595.0" y="232.0" class="okm" text-anchor="middle">member.age.goe(40)</text>
  <line x1="220" y1="227" x2="246" y2="227" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="430" y1="227" x2="456" y2="227" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="30" y="262" width="190" height="46" rx="8" class="hold"/>
  <text x="125.0" y="290.0" class="ts" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">ageLoe</tspan> = 없음</text>
  <rect x="250" y="262" width="180" height="46" rx="8" class="box"/>
  <text x="340.0" y="290.0" class="opm" text-anchor="middle">ageLoe(…)</text>
  <rect x="460" y="262" width="270" height="46" rx="8" class="wait"/>
  <text x="595.0" y="290.0" class="waitt" text-anchor="middle">null 반환</text>
  <line x1="220" y1="285" x2="246" y2="285" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="430" y1="285" x2="456" y2="285" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="595" y1="308" x2="595" y2="330" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="260" y="332" width="470" height="56" rx="8" class="ok"/>
  <text x="495.0" y="355.5" class="okt" text-anchor="middle">where(…) — null은 무시</text>
  <text x="495.0" y="374.5" class="okm" text-anchor="middle">team.name.eq("teamB") and member.age.goe(40)</text>
  <text x="30" y="360" class="lane" text-anchor="start">where 결과</text>
  <text x="30" y="416" class="foot" text-anchor="start">값이 없는 조건은 메서드가 null을 반환하고, where 절은 null을 무시합니다</text>
</svg>
