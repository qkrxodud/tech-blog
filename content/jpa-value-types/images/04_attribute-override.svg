<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>homeAddress와 workAddress가 모두 Address를 사용하면 city, street, zipcode 컬럼이 겹치지만, workAddress에 @AttributeOverride를 지정하면 work_city, work_street, work_zipcode 컬럼으로 매핑되는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .msg { font-size: 12px; fill: #374151; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .cont { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .life { stroke: #c4c8ce; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="182" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">같은 값 타입을 두 번 사용 — 컬럼명 중복</text>
  <rect x="30" y="64" width="240" height="36" rx="6" class="box"/>
  <text x="150" y="87" class="opm" text-anchor="middle">homeAddress : Address</text>
  <line x1="272" y1="82" x2="312" y2="82" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="320" y="64" width="130" height="36" rx="6" class="box"/>
  <text x="385" y="87" class="m" text-anchor="middle">city</text>
  <rect x="460" y="64" width="130" height="36" rx="6" class="box"/>
  <text x="525" y="87" class="m" text-anchor="middle">street</text>
  <rect x="600" y="64" width="130" height="36" rx="6" class="box"/>
  <text x="665" y="87" class="m" text-anchor="middle">zipcode</text>
  <rect x="30" y="114" width="240" height="36" rx="6" class="box"/>
  <text x="150" y="137" class="opm" text-anchor="middle">workAddress : Address</text>
  <line x1="272" y1="132" x2="312" y2="132" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="320" y="114" width="130" height="36" rx="6" class="bad"/>
  <text x="385" y="137" class="badm" text-anchor="middle">city</text>
  <rect x="460" y="114" width="130" height="36" rx="6" class="bad"/>
  <text x="525" y="137" class="badm" text-anchor="middle">street</text>
  <rect x="600" y="114" width="130" height="36" rx="6" class="bad"/>
  <text x="665" y="137" class="badm" text-anchor="middle">zipcode</text>
  <text x="30" y="176" class="note">두 필드가 모두 같은 컬럼명으로 매핑되어 중복됩니다.</text>
  <rect x="10" y="208" width="740" height="182" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="240" class="h"><tspan font-family="Menlo, Consolas, monospace">@AttributeOverride</tspan> — 컬럼명 재정의</text>
  <rect x="30" y="262" width="240" height="36" rx="6" class="box"/>
  <text x="150" y="285" class="opm" text-anchor="middle">homeAddress : Address</text>
  <line x1="272" y1="280" x2="312" y2="280" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="320" y="262" width="130" height="36" rx="6" class="box"/>
  <text x="385" y="285" class="m" text-anchor="middle">city</text>
  <rect x="460" y="262" width="130" height="36" rx="6" class="box"/>
  <text x="525" y="285" class="m" text-anchor="middle">street</text>
  <rect x="600" y="262" width="130" height="36" rx="6" class="box"/>
  <text x="665" y="285" class="m" text-anchor="middle">zipcode</text>
  <rect x="30" y="312" width="240" height="36" rx="6" class="box"/>
  <text x="150" y="335" class="opm" text-anchor="middle">workAddress : Address</text>
  <line x1="272" y1="330" x2="312" y2="330" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="320" y="312" width="130" height="36" rx="6" class="ok"/>
  <text x="385" y="335" class="okm" text-anchor="middle">work_city</text>
  <rect x="460" y="312" width="130" height="36" rx="6" class="ok"/>
  <text x="525" y="335" class="okm" text-anchor="middle">work_street</text>
  <rect x="600" y="312" width="130" height="36" rx="6" class="ok"/>
  <text x="665" y="335" class="okm" text-anchor="middle">work_zipcode</text>
  <text x="30" y="374" class="gnote"><tspan font-family="Menlo, Consolas, monospace">workAddress</tspan>의 컬럼명을 재정의해 두 주소의 컬럼이 나뉩니다.</text>
</svg>
