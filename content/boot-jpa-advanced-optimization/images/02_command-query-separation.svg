<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>OSIV를 끈 상태에서 OrderService를 핵심 비즈니스 로직을 담는 OrderService와 화면이나 API에 맞춘 OrderQueryService로 나누고, 두 서비스 모두 서비스 계층의 트랜잭션 안에서 지연 로딩을 사용하는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="350" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="330" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h" text-anchor="start">커맨드와 쿼리 분리 — OSIV를 끈 상태에서</text>
  <text x="730" y="42" class="code" text-anchor="end">open-in-view: false</text>
  <rect x="280" y="62" width="200" height="40" rx="8" class="box"/>
  <text x="380.0" y="87.0" class="t" text-anchor="middle">컨트롤러</text>
  <line x1="340" y1="102" x2="240" y2="167" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="420" y1="102" x2="520" y2="167" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="30" y="140" width="700" height="140" rx="10" class="scope"/>
  <text x="44" y="160" class="sub" text-anchor="start">서비스 계층 — 트랜잭션 유지</text>
  <rect x="60" y="170" width="300" height="92" rx="8" class="box"/>
  <text x="210.0" y="221.0" class="t" text-anchor="middle"></text>
  <text x="210" y="196" class="ts" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">OrderService</tspan></text>
  <text x="210" y="220" class="val" text-anchor="middle">핵심 비즈니스 로직</text>
  <text x="210" y="242" class="val" text-anchor="middle">엔티티 몇 개를 등록·수정</text>
  <rect x="400" y="170" width="300" height="92" rx="8" class="box"/>
  <text x="550.0" y="221.0" class="t" text-anchor="middle"></text>
  <text x="550" y="196" class="ts" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">OrderQueryService</tspan></text>
  <text x="550" y="220" class="val" text-anchor="middle">화면이나 API에 맞춘 서비스</text>
  <text x="550" y="242" class="val" text-anchor="middle">화면에 맞춘 조회 성능 최적화</text>
  <rect x="30" y="292" width="700" height="32" rx="15" class="ok"/>
  <text x="380" y="313" class="okt" text-anchor="middle">두 서비스 모두 트랜잭션을 유지하면서 지연 로딩 사용 가능</text>
</svg>
