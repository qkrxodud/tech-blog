<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>HTTP 요청이 웹 어댑터에서 자바 객체 매핑, 권한 검사, 입력 유효성 검증, 입력 모델 매핑을 거쳐 입력 포트로 유스케이스를 호출하고, 출력을 HTTP로 매핑해 응답을 반환하며, 중간에 실패하면 에러 메시지로 변환하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 12px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .msg { font-size: 11.5px; fill: #374151; }
    .hd { font-size: 10.5px; fill: #374151; }
    .gmsg { font-size: 11.5px; fill: #15803d; }
    .rmsg { font-size: 11.5px; fill: #b91c1c; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .pkg { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .life { stroke: #c4c8ce; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .act { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.2; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .hint { font-size: 12px; fill: #6b7280; font-family: Menlo, Consolas, monospace; }
    .cd { font-size: 14px; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opmx { font-size: 12px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6b7280" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect width="760" height="410" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="400" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">웹 어댑터의 책임 — HTTP 요청에서 HTTP 응답까지</text>
  <rect x="22" y="56" width="538" height="306" rx="10" class="scope"/>
  <text x="36" y="76" class="ts">웹 어댑터 — HTTP를 다루는 곳</text>
  <rect x="574" y="56" width="164" height="306" rx="10" class="pkg"/>
  <text x="656" y="76" class="ts" text-anchor="middle">애플리케이션 코어</text>
  <text x="656" y="94" class="s" text-anchor="middle">HTTP를 모름</text>
  <rect x="30" y="108" width="116" height="56" rx="8" class="box"/>
  <text x="88" y="131.5" class="ts" text-anchor="middle">1. 요청 매핑</text>
  <text x="88" y="150.5" class="s" text-anchor="middle">HTTP → 자바 객체</text>
  <rect x="162" y="108" width="116" height="56" rx="8" class="box"/>
  <text x="220" y="141" class="ts" text-anchor="middle">2. 권한 검사</text>
  <rect x="294" y="108" width="116" height="56" rx="8" class="box"/>
  <text x="352" y="131.5" class="ts" text-anchor="middle">3. 입력 유효성 검증</text>
  <text x="352" y="150.5" class="s" text-anchor="middle">변환 가능한지 확인</text>
  <rect x="426" y="108" width="116" height="56" rx="8" class="box"/>
  <text x="484" y="131.5" class="ts" text-anchor="middle">4. 입력 모델 매핑</text>
  <text x="484" y="150.5" class="s" text-anchor="middle">유스케이스의 모델로</text>
  <line x1="147" y1="136" x2="161" y2="136" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="279" y1="136" x2="293" y2="136" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="411" y1="136" x2="425" y2="136" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="30" y="100" class="msg">HTTP 요청</text>
  <rect x="426" y="204" width="116" height="56" rx="8" class="ok"/>
  <text x="484" y="227.5" class="okt" text-anchor="middle">5. 유스케이스 호출</text>
  <text x="484" y="246.5" class="gmsg" text-anchor="middle">입력 포트로</text>
  <line x1="484.0" y1="165" x2="484.0" y2="202" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="588" y="204" width="136" height="56" rx="8" class="hold"/>
  <text x="656" y="227.5" class="t" text-anchor="middle">입력 포트</text>
  <text x="656" y="246.5" class="ms" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">SendMoneyUseCase</tspan></text>
  <line x1="543" y1="232" x2="585" y2="232" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="426" y="296" width="116" height="56" rx="8" class="box"/>
  <text x="484" y="319.5" class="ts" text-anchor="middle">6. 출력 매핑</text>
  <text x="484" y="338.5" class="s" text-anchor="middle">출력을 HTTP로</text>
  <path d="M656,261 L656,324 L545,324" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="294" y="296" width="116" height="56" rx="8" class="box"/>
  <text x="352" y="329" class="ts" text-anchor="middle">7. HTTP 응답 반환</text>
  <line x1="425" y1="324" x2="411" y2="324" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="293" y1="324" x2="140" y2="324" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="36" y="329" class="msg">HTTP 응답</text>
  <rect x="30" y="204" width="256" height="56" rx="8" class="bad"/>
  <text x="158" y="227.5" class="badt" text-anchor="middle">어느 단계에서든 실패하면 예외</text>
  <text x="158" y="246.5" class="rmsg" text-anchor="middle">호출자에게 보여 줄 에러 메시지로 변환</text>
  <line x1="88.0" y1="165" x2="88.0" y2="202" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <line x1="220.0" y1="165" x2="220.0" y2="202" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <path d="M352.0,165 L352.0,190 L270,190 L270,202" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="30" y="388" class="foot">1~4와 6~7은 웹 어댑터 안에서 끝나고, 애플리케이션 코어에는 입력 포트를 통한 호출만 전달됩니다.</text>
</svg>
