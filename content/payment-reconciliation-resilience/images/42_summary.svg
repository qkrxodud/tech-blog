  <text x="206" y="92" class="t2" style="font-size:12px">어긋남 처리</text>
  <text x="174" y="118" class="s2" style="font-size:10.5px;fill:#1f2937">뒤처진 결제만</text><text x="174" y="135" class="s2" style="font-size:10.5px;fill:#1f2937">카드사에 다시 조회해</text><text x="174" y="152" class="s2" style="font-size:10.5px;fill:#1f2937">6장 따라가기로 맞춤</text><text x="174" y="169" class="s2" style="font-size:10.5px;fill:#1f2937">나머지는</text><text x="174" y="186" class="s2" style="font-size:10.5px;fill:#1f2937">운영자 확인으로 남김</text>
  <rect x="162" y="266" width="142" height="30" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="233" y="285" class="gs" text-anchor="middle" style="font-size:9.5px">확인한 줄을 닫는 길 없음</text>
