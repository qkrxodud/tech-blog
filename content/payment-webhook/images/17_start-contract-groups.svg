<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>6장 웹훅 계약 15개의 일곱 묶음 — 순서 2개(승인 알림이 승인 응답보다 먼저, 취소 알림이 승인 알림보다 먼저), 중복 3개(같은 취소 알림 두 번, 같은 상태가 다른 때에 다시, 같은 알림 두 번 모두 받았다고 답함), 위조 2개(PG 기록과 다른 취소 알림, PG에 승인이 없는 결과 모름 결제의 승인 알림), 모르는 주문 2개(받았다고 답함, 결제를 만들지 않음), 응답 시간 1개(PG 조회가 늦어도 10초 안에), 결과 모름 4개(결과 모름 결제의 승인 알림, 결과 모름 취소의 남은 금액·결과 모름에서 벗어남·PG 취소를 따로 기록하지 않음), PG에서만 일어난 취소 1개(부분 취소 알림이면 남은 금액이 PG 잔액과 같아짐). 계약은 결제 금액 15000원, 부분 취소 5000원, 읽기 시간 제한 1초, 늦은 답 1.5초, 보정 대기 시간 10초로 돌리고, 카드사와 같다는 결제 상태가 Mock PG 상태와 짝이 맞고(DONE·PARTIAL_CANCELED는 승인·매입, CANCELED는 승인 취소·매입 취소, ABORTED는 승인 실패) 남은 금액이 Mock PG 잔액과 같은지로 봄. 구현마다 다른 주소에 Mock PG가 실제 HTTP로 알림을 보냄</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #4b5563; }
    .m { font-family: Menlo, Consolas, monospace; }
    .lbl { font-size: 12px; fill: #4b5563; }
    .tab { font-size: 12.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .badt { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .bads { font-size: 12px; fill: #b91c1c; }
    .okt { font-size: 13px; font-weight: 700; fill: #15803d; }
    .oks { font-size: 12px; fill: #15803d; }
    .gt { font-size: 13px; font-weight: 700; fill: #6b7280; }
    .gs { font-size: 12px; fill: #6b7280; }
    .ot { font-size: 13px; font-weight: 700; fill: #c2410c; }
    .os { font-size: 12px; fill: #c2410c; }
    .bt { font-size: 13px; font-weight: 700; fill: #1e3a8a; }
    .bs { font-size: 12px; fill: #1e3a8a; }
    .o { stroke: #1f2937; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .spine { stroke: #1f2937; stroke-width: 1.5; fill: none; }
    .life { stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .run { stroke-dasharray: 5 4; animation: run 0.9s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -18; } }
    @media (prefers-reduced-motion: reduce) { .run { animation: none; } .anim { display: none; } }
  </style>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="aor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
    <marker id="abl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <g id="pkt">
      <rect x="-11" y="-8" width="22" height="16" rx="3" fill="#2dd4bf" stroke="#0f766e" stroke-width="1.5"/>
      <path d="M-10,-7 L0,1 L10,-7" fill="none" stroke="#0f766e" stroke-width="1.5"/>
    </g>
    <g id="pkt2">
      <rect x="-11" y="-8" width="22" height="16" rx="3" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/>
      <path d="M-10,-7 L0,1 L10,-7" fill="none" stroke="#c2410c" stroke-width="1.5"/>
    </g>
    <g id="xmark"><circle r="9" fill="#ef4444"/><path d="M-4,-4 L4,4 M4,-4 L-4,4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
    <g id="vmark"><circle r="9" fill="#22c55e"/><path d="M-4.5,0 L-1.5,3.5 L4.5,-3.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="xs"><circle r="7" fill="#ef4444"/><path d="M-3,-3 L3,3 M3,-3 L-3,3" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></g>
    <g id="vs"><circle r="7" fill="#22c55e"/><path d="M-3.5,0 L-1,2.8 L3.5,-2.8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="i-card"><rect x="0" y="3" width="32" height="22" rx="4" fill="#5eead4" class="o"/><rect x="0" y="8" width="32" height="5" fill="#1f2937"/><rect x="4" y="16" width="8" height="6" rx="1.5" fill="#fbbf24" class="o" stroke-width="1"/></g>
    <g id="i-app"><rect x="0" y="0" width="30" height="30" rx="5" fill="#93c5fd" class="o"/><path d="M0,9 h30" class="o" fill="none"/><circle cx="5" cy="4.5" r="1.4" fill="#1f2937"/><circle cx="10" cy="4.5" r="1.4" fill="#1f2937"/><path d="M7,16 h16 M7,22 h11" stroke="#1e3a8a" stroke-width="1.6" stroke-linecap="round"/></g>
    <g id="i-db"><path d="M1,5 v20 a13,5 0 0 0 26,0 v-20 a13,5 0 0 1 -26,0 z" fill="#60a5fa" class="o"/><path d="M1,15 a13,5 0 0 0 26,0" fill="none" class="o"/><ellipse cx="14" cy="5" rx="13" ry="5" fill="#bfdbfe" class="o"/></g>
    <g id="i-server"><rect x="0" y="0" width="36" height="13" rx="3" fill="#cbd5e1" class="o"/><rect x="0" y="16" width="36" height="13" rx="3" fill="#cbd5e1" class="o"/><circle cx="7" cy="6.5" r="2.2" fill="#22c55e"/><circle cx="7" cy="22.5" r="2.2" fill="#22c55e"/><path d="M14,6.5 h16 M14,22.5 h16" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/></g>
    <g id="i-coin"><circle cx="12" cy="12" r="11" fill="#fbbf24" class="o"/><circle cx="12" cy="12" r="7" fill="#fcd34d" stroke="#b45309" stroke-width="1"/><text x="12" y="16.5" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">₩</text></g>
    <g id="i-key"><circle cx="8" cy="12" r="7.5" fill="#fbbf24" class="o"/><circle cx="8" cy="12" r="2.6" fill="#ffffff" class="o" stroke-width="1.2"/><path d="M15.5,12 H30 V17.5 M25,12 V16.5" fill="none" class="o" stroke-width="2"/></g>
    <g id="i-clock"><circle cx="14" cy="14" r="13" fill="#fde68a" class="o"/><path d="M14,7 V14 L20,18" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/></g>
    <g id="i-chips"><rect x="0" y="4" width="13" height="14" rx="4" fill="#e5e7eb" class="o"/><rect x="21" y="4" width="13" height="14" rx="4" fill="#86efac" class="o"/><path d="M14,11 h6" class="o" fill="none"/><path d="M17,8 l3,3 l-3,3" class="o" fill="none"/></g>
    <g id="i-plane"><path d="M1,13 L31,1 L23,29 L15,19 Z" fill="#fdba74" class="o"/><path d="M15,19 L31,1 L11,16 Z" fill="#fb923c" class="o"/></g>
    <g id="i-doc"><path d="M0,0 h18 l8,8 v26 h-26 z" fill="#ffffff" class="o"/><path d="M18,0 v8 h8" fill="#e5e7eb" class="o"/><circle cx="20" cy="26" r="8" fill="#22c55e" class="o"/><path d="M16.5,26 l2.5,2.5 l4.5,-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5,10 h9 M5,16 h7" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/></g>
    <g id="i-table"><rect x="0" y="0" width="30" height="26" rx="3" fill="#ffffff" class="o"/><rect x="0" y="0" width="30" height="7" rx="3" fill="#60a5fa" class="o"/><path d="M0,13.5 h30 M0,20 h30 M11,7 v19" stroke="#1f2937" stroke-width="1.2"/></g>
    <g id="i-search"><circle cx="11" cy="11" r="9" fill="#bae6fd" class="o"/><path d="M18,18 L27,27" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/></g>
    <g id="i-chart"><rect x="0" y="16" width="7" height="12" fill="#93c5fd" class="o"/><rect x="10" y="8" width="7" height="20" fill="#60a5fa" class="o"/><rect x="20" y="2" width="7" height="26" fill="#2563eb" class="o"/></g>
    <g id="i-bell"><path d="M14,3 C8.5,3 6,7.5 6,13 V19 L3,23 H25 L22,19 V13 C22,7.5 19.5,3 14,3 Z" fill="#fde047" class="o"/><circle cx="14" cy="26" r="3" fill="#f59e0b" class="o"/></g>
    <g id="i-warn"><path d="M14,2 L27,25 H1 Z" fill="#fca5a5" class="o"/><path d="M14,10 V17" stroke="#7f1d1d" stroke-width="2.2" stroke-linecap="round"/><circle cx="14" cy="21" r="1.5" fill="#7f1d1d"/></g>
    <g id="i-lock"><path d="M7,12 V8 a7,7 0 0 1 14,0 V12" fill="none" class="o" stroke-width="2.2"/><rect x="3" y="12" width="22" height="16" rx="3" fill="#fbbf24" class="o"/><circle cx="14" cy="20" r="2.4" fill="#1f2937"/></g>
  </defs>

  <rect width="760" height="520" fill="#ffffff"/>
  <text x="24" y="30" class="h">웹훅 계약 15개 — 일곱 묶음과 시험 조건</text>
  <text x="24" y="52" class="gs">추상 클래스 <tspan class="m">WebhookContract</tspan>를 구현마다 상속 · Mock PG가 실제 HTTP로 구현마다 다른 주소에 알림을 보냄</text>
  <rect x="24" y="72" width="350" height="64" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="24" y="72" width="92" height="64" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="70" y="102.0" class="t2" text-anchor="middle" style="font-size:12px">순서</text>
  <text x="70" y="119.0" class="bs" text-anchor="middle" style="font-size:11px">2개</text>
  <text x="128" y="96" class="s" style="font-size:11px">승인 알림이 승인 응답보다 먼저</text>
  <text x="128" y="113" class="s" style="font-size:11px">취소 알림이 승인 알림보다 먼저</text>
  <rect x="24" y="144" width="350" height="81" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="24" y="144" width="92" height="81" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="70" y="182.5" class="t2" text-anchor="middle" style="font-size:12px">중복</text>
  <text x="70" y="199.5" class="bs" text-anchor="middle" style="font-size:11px">3개</text>
  <text x="128" y="168" class="s" style="font-size:11px">같은 취소 알림 두 번 — 취소 기록 하나</text>
  <text x="128" y="185" class="s" style="font-size:11px">같은 상태가 다른 때에 다시 — 기록 하나</text>
  <text x="128" y="202" class="s" style="font-size:11px">같은 알림 두 번 — 두 번 모두 200</text>
  <rect x="24" y="233" width="350" height="64" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="24" y="233" width="92" height="64" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="70" y="263.0" class="t2" text-anchor="middle" style="font-size:12px">위조</text>
  <text x="70" y="280.0" class="bs" text-anchor="middle" style="font-size:11px">2개</text>
  <text x="128" y="257" class="s" style="font-size:11px">PG 기록과 다른 취소 알림</text>
  <text x="128" y="274" class="s" style="font-size:11px">PG에 승인 없는 결과 모름 결제의 승인 알림</text>
  <rect x="24" y="305" width="350" height="64" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="24" y="305" width="92" height="64" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="70" y="335.0" class="t2" text-anchor="middle" style="font-size:12px">모르는 주문</text>
  <text x="70" y="352.0" class="bs" text-anchor="middle" style="font-size:11px">2개</text>
  <text x="128" y="329" class="s" style="font-size:11px">받았다고 답함</text>
  <text x="128" y="346" class="s" style="font-size:11px">그 알림으로 결제를 만들지 않음</text>
  <rect x="386" y="72" width="350" height="47" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="386" y="72" width="92" height="47" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="432" y="93.5" class="t2" text-anchor="middle" style="font-size:12px">응답 시간</text>
  <text x="432" y="110.5" class="bs" text-anchor="middle" style="font-size:11px">1개</text>
  <text x="490" y="96" class="s" style="font-size:11px">PG 조회가 늦어도 10초 안에 받았다고 답함</text>
  <rect x="386" y="127" width="350" height="98" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="386" y="127" width="92" height="98" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="432" y="174.0" class="t2" text-anchor="middle" style="font-size:12px">결과 모름</text>
  <text x="432" y="191.0" class="bs" text-anchor="middle" style="font-size:11px">4개</text>
  <text x="490" y="151" class="s" style="font-size:11px">결과 모름 결제의 승인 알림 → 대기 전에 승인</text>
  <text x="490" y="168" class="s" style="font-size:11px">결과 모름 취소 → 남은 금액이 PG 잔액과 같음</text>
  <text x="490" y="185" class="s" style="font-size:11px">그 취소가 결과 모름에서 벗어남</text>
  <text x="490" y="202" class="s" style="font-size:11px">PG 취소를 따로 한 번 더 기록하지 않음</text>
  <rect x="386" y="233" width="350" height="47" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="386" y="233" width="92" height="47" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="432" y="254.5" class="t2" text-anchor="middle" style="font-size:12px">PG에서만 취소</text>
  <text x="432" y="271.5" class="bs" text-anchor="middle" style="font-size:11px">1개</text>
  <text x="490" y="257" class="s" style="font-size:11px">부분 취소 알림 → 남은 금액이 PG 잔액과 같음</text>
  <rect x="386" y="296" width="350" height="66" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="400" y="318" class="gt" style="font-size:12px"><tspan class="m">process()</tspan></text>
  <text x="400" y="337" class="gs" style="font-size:10.5px">받은 알림을 처리하는 주기 작업을 한 번 돌림</text>
  <text x="400" y="353" class="gs" style="font-size:10.5px">받은 요청 안에서 처리하는 구현이면 아무것도 안 함</text>
  <rect x="24" y="384" width="350" height="120" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="38" y="406" class="okt" style="font-size:12.5px">"카드사와 같다"</text>
  <text x="38" y="430" class="oks" style="font-size:11px"><tspan class="m">DONE</tspan> · <tspan class="m">PARTIAL_CANCELED</tspan></text>
  <text x="360" y="430" class="oks" text-anchor="end" style="font-size:11px">승인 · 매입</text>
  <text x="38" y="448" class="oks" style="font-size:11px"><tspan class="m">CANCELED</tspan></text>
  <text x="360" y="448" class="oks" text-anchor="end" style="font-size:11px">승인 취소 · 매입 취소</text>
  <text x="38" y="466" class="oks" style="font-size:11px"><tspan class="m">ABORTED</tspan></text>
  <text x="360" y="466" class="oks" text-anchor="end" style="font-size:11px">승인 실패</text>
  <text x="38" y="492" class="okt" style="font-size:11.5px">그리고 남은 금액 = Mock PG 잔액</text>
  <rect x="386" y="384" width="350" height="120" rx="10" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <text x="400" y="406" class="ot" style="font-size:12.5px">시험 조건</text>
  <text x="400" y="430" class="os" style="font-size:11.5px">결제 15000원 · 부분 취소 5000원</text>
  <text x="400" y="450" class="os" style="font-size:11.5px">PG 읽기 시간 제한 1초 · 늦은 답 1.5초 뒤</text>
  <text x="400" y="470" class="os" style="font-size:11.5px">보정 대기 시간 10초</text>
</svg>
