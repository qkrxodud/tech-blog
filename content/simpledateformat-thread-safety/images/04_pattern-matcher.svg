<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 496" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>Pattern 하나를 공유하고 스레드마다 Matcher를 새로 만들면 안전하고, Matcher 하나를 두 스레드가 공유하면 매칭 위치와 그룹이 섞이는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .tag { font-size: 12px; font-weight: 700; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="496" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="250" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">Pattern은 공유, Matcher는 호출마다 — 안전</text>
  <text x="730" y="42" class="code" text-anchor="end">pattern.matcher(input)</text>
  <rect x="40" y="70" width="130" height="48" rx="8" class="box"/>
  <text x="105" y="90" class="t" text-anchor="middle">스레드 A</text>
  <text x="105" y="109" class="val" text-anchor="middle">find()</text>
  <rect x="40" y="150" width="130" height="48" rx="8" class="box"/>
  <text x="105" y="170" class="t" text-anchor="middle">스레드 B</text>
  <text x="105" y="189" class="val" text-anchor="middle">find()</text>
  <rect x="262" y="70" width="190" height="128" rx="8" class="ok"/>
  <text x="357" y="90" class="okc" text-anchor="middle">Pattern</text>
  <text x="357" y="109" class="val" text-anchor="middle">컴파일된 정규식 (설정)</text>
  <text x="357" y="150" class="val" text-anchor="middle">static 상수로 공유</text>
  <line x1="171" y1="94" x2="260" y2="94" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="171" y1="174" x2="260" y2="174" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="544" y="70" width="180" height="48" rx="8" class="ok"/>
  <text x="634" y="90" class="okt" text-anchor="middle">Matcher (A 전용)</text>
  <text x="634" y="109" class="val" text-anchor="middle">A의 매칭 위치·그룹</text>
  <rect x="544" y="150" width="180" height="48" rx="8" class="ok"/>
  <text x="634" y="170" class="okt" text-anchor="middle">Matcher (B 전용)</text>
  <text x="634" y="189" class="val" text-anchor="middle">B의 매칭 위치·그룹</text>
  <line x1="453" y1="94" x2="542" y2="94" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="453" y1="174" x2="542" y2="174" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="498" y="86" class="tag" text-anchor="middle">새로 만듦</text>
  <text x="498" y="166" class="tag" text-anchor="middle">새로 만듦</text>
  <text x="30" y="230" class="sub">같은 구조: JAXBContext → Marshaller, DataSource → Connection, EntityManagerFactory → EntityManager</text>
  <rect x="10" y="276" width="740" height="210" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="308" class="h">Matcher 하나를 공유하면 — 작업 상태가 섞임</text>
  <text x="730" y="308" class="code" text-anchor="end">static final Matcher</text>
  <rect x="40" y="336" width="130" height="48" rx="8" class="box"/>
  <text x="105" y="356" class="t" text-anchor="middle">스레드 A</text>
  <text x="105" y="375" class="val" text-anchor="middle">find()</text>
  <rect x="40" y="410" width="130" height="48" rx="8" class="box"/>
  <text x="105" y="430" class="t" text-anchor="middle">스레드 B</text>
  <text x="105" y="449" class="val" text-anchor="middle">find()</text>
  <rect x="262" y="336" width="270" height="122" rx="8" class="bad"/>
  <text x="397" y="356" class="badt" text-anchor="middle">Matcher 하나</text>
  <text x="397" y="375" class="val" text-anchor="middle">매칭 위치·그룹</text>
  <text x="397" y="418" class="note" text-anchor="middle">A와 B가 번갈아 덮어씀</text>
  <line x1="171" y1="360" x2="260" y2="360" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="171" y1="434" x2="260" y2="434" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="560" y="372" width="170" height="48" rx="8" class="bad"/>
  <text x="645" y="392" class="badt" text-anchor="middle">틀린 결과</text>
  <text x="645" y="411" class="val" text-anchor="middle">다른 스레드의 위치</text>
  <line x1="533" y1="396" x2="558" y2="396" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>

</svg>
