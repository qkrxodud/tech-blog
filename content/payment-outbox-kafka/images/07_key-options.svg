492" y2="115" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ak)"/><rect x="494" y="152" width="94" height="42" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/><text x="541" y="169" class="s2" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#1f2937">소비자</text><text x="541" y="185" class="s2" text-anchor="middle" style="font-size:10.5px;fill:#4b5563">이 결제 없음</text><line x1="482" y1="173" x2="492" y2="173" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ak)"/><rect x="604" y="84" width="142" height="120" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><use href="#vs" x="618" y="106"/><text x="631" y="110" class="oks" style="font-size:11.5px;font-weight:700">[승인, 취소]</text><use href="#vs" x="618" y="130"/><text x="631" y="134" class="oks" style="font-size:11.5px">주문 <tspan class="m">CANCELED</tspan></text><text x="616" y="158" class="gs" style="font-size:10.5px">취소는 승인 처리가</text><text x="616" y="182" class="gs" style="font-size:10.5px">끝날 때까지 기다림</text>
  <rect x="14" y="216" width="150" height="120" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/><text x="28" y="250" class="t2">키 없이</text><text x="28" y="270" class="t2" style="font-size:12px">결정 3까지</text><text x="28" y="294" class="s2" style="font-size:11.5px">비교 · RoundRobin</text><rect x="176" y="236" width="58" height="80" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/><use href="#i-server" transform="translate(190,250) scale(0.8)"/><text x="205" y="298" class="s2" text-anchor="middle" style="font-size:10.5px;fill:#1f2937">번호 순</text><rect x="262" y="230" width="218" height="34" rx="6" fill="#fffbeb" stroke="#d4a845" stroke-width="1.2"/><text x="272" y="251" class="s2" style="font-size:10.5px;fill:#92400e;font-weight:700">파티션 0</text><rect x="334" y="236" width="64" height="22" rx="5" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.2"/><text x="366" y="251.5" class="s2" text-anchor="middle" style="font-size:11px;fill:#1f2937">n 승인</text><rect x="262" y="288" width="218" height="34" rx="6" fill="#fffbeb" stroke="#d4a845" stroke-width="1.2"/><text x="272" y="309" class="s2" style="font-size:10.5px;fill:#92400e;font-weight:700">파티션 1</text><rect x="334" y="294" width="64" height="22" rx="5" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.2"/><text x="366" y="309.5" class="s2" text-anchor="middle" style="font-size:11px;fill:#1f2937">n+1 취소</text><line x1="236" y1="266" x2="258" y2="247" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/><line x1="236" y1="286" x2="258" y2="305" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/><rect x="494" y="226" width="94" height="42" rx="8" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/><text x="541" y="243" class="s2" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#1f2937">소비자 0</text><text x="541" y="259" class="s2" text-anchor="middle" style="font-size:10.5px;fill:#92400e">승인 기록 1초</text><line x1="482" y1="247" x2="492" y2="247" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ak)"/><rect x="494" y="284" width="94" height="42" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/><text x="541" y="301" class="s2" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#1f2937">소비자 1</text><text x="541" y="317" class="s2" text-anchor="middle" style="font-size:10.5px;fill:#b91c1c">취소를 먼저 처리</text><line x1="482" y1="305" x2="492" y2="305" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ak)"/><rect x="604" y="216" width="142" height="120" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><use href="#xs" x="618" y="238"/><text x="631" y="242" class="bads" style="font-size:11.5px;font-weight:700">[취소, 승인]</text><use href="#xs" x="618" y="262"/><text x="631" y="266" class="bads" style="font-size:11.5px">주문 <tspan class="m">PAID</tspan></text><text x="616" y="290" class="gs" style="font-size:10.5px">기본 파티셔너 측정에서도</text><text x="616" y="314" class="gs" style="font-size:10.5px">6번 중 2번 순서 위반</text>
  <line x1="12" y1="350" x2="748" y2="350" stroke="#9ca3af" stroke-width="1"/>
  <text x="24" y="370" class="gs" style="font-size:11px">Kafka 4.2 문서 — <tspan class="m">partitioner.class</tspan>: “choose a partition based on a hash of the key.”</text>
