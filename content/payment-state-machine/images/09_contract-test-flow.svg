  <path d="M350,376 H368 V336 H384" fill="none" stroke="#16a34a" stroke-width="1.4" marker-end="url(#agr)"/>
  <path d="M350,398 H384" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="48" y="114" width="300" height="48" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="48" cy="114" r="10" fill="#111827"/><text x="48" y="118" class="num" text-anchor="middle">1</text>
  <use href="#i-app" x="64" y="124"/>
  <text x="110" y="135" class="t2" style="font-size:12.5px">결제 만들기</text>
  <text x="110" y="153" class="s" style="font-size:10.5px"><tspan class="m">newPayment()</tspan> · READY</text>
  <rect x="48" y="176" width="300" height="48" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="48" cy="176" r="10" fill="#111827"/><text x="48" y="180" class="num" text-anchor="middle">2</text>
  <use href="#i-chips" x="64" y="189"/>
  <text x="110" y="197" class="t2" style="font-size:12.5px">출발 상태까지 행위 호출</text>
  <text x="110" y="215" class="s" style="font-size:10.5px"><tspan class="m">paymentIn(from)</tspan> · <tspan class="m">PATH</tspan>대로</text>
  <rect x="48" y="238" width="300" height="48" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="48" cy="238" r="10" fill="#111827"/><text x="48" y="242" class="num" text-anchor="middle">3</text>
  <use href="#i-search" x="64" y="248"/>
  <text x="110" y="259" class="t2" style="font-size:12.5px">출발 상태인지 확인</text>
  <text x="110" y="277" class="s" style="font-size:10.5px"><tspan class="m">status()</tspan>가 from인지</text>
  <rect x="48" y="300" width="300" height="48" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="48" cy="300" r="10" fill="#111827"/><text x="48" y="304" class="num" text-anchor="middle">4</text>
  <use href="#i-card" x="64" y="310"/>
  <text x="110" y="321" class="t2" style="font-size:12.5px">시험할 행위 요청</text>
  <text x="110" y="339" class="s" style="font-size:10.5px"><tspan class="m">perform(action)</tspan></text>
  <rect x="48" y="362" width="300" height="48" rx="10" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <circle cx="48" cy="362" r="10" fill="#111827"/><text x="48" y="366" class="num" text-anchor="middle">5</text>
  <use href="#i-table" x="64" y="372"/>
  <text x="110" y="383" class="t2" style="font-size:12.5px">기대 규칙과 맞춰 보기</text>
  <text x="110" y="401" class="s" style="font-size:10.5px">조합 테스트는 <tspan class="m">ALLOWED</tspan> 표로</text>
  <rect x="390" y="114" width="334" height="186" rx="12" fill="#ffffff" stroke="#9fb3d1" stroke-width="1.2"/>
  <text x="404" y="136" class="bt" style="font-size:12px">구현마다 상속 — <tspan class="m">PaymentHandle</tspan>이 넘기는 곳</text>
  <rect x="402" y="148" width="310" height="42" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <use href="#i-table" transform="translate(412,156) scale(0.85)"/>
  <text x="450" y="166" class="t2" style="font-size:12px">허용 전이 표</text>
  <text x="450" y="182" class="s" style="font-size:10.5px"><tspan class="m">payment.capture()</tspan> 같은 메서드 호출</text>
  <rect x="402" y="196" width="310" height="42" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <use href="#i-chips" transform="translate(412,206) scale(0.85)"/>
  <text x="450" y="214" class="t2" style="font-size:12px">State 패턴</text>
  <text x="450" y="230" class="s" style="font-size:10.5px"><tspan class="m">payment.capture()</tspan> 같은 메서드 호출</text>
  <rect x="402" y="244" width="310" height="42" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <use href="#i-plane" transform="translate(412,252) scale(0.85)"/>
  <text x="450" y="262" class="t2" style="font-size:12px">Spring Statemachine</text>
  <text x="450" y="278" class="s" style="font-size:10.5px"><tspan class="m">payment.perform(action)</tspan> · 이벤트 전송</text>
  <rect x="390" y="314" width="334" height="44" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="406" y="336"/>
  <text x="424" y="332" class="okt" style="font-size:12px">표에 있는 조합</text>
  <text x="424" y="349" class="oks" style="font-size:10.5px">다음 상태로 바뀌었는지 확인</text>
  <rect x="390" y="370" width="334" height="50" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="406" y="395"/>
  <text x="424" y="389" class="badt" style="font-size:12px">표에 없는 조합 — 예외와 상태 확인</text>
  <text x="424" y="407" class="bads" style="font-size:10px"><tspan class="m">InvalidPaymentTransitionException</tspan> · 상태는 그대로</text>
  <text x="24" y="456" class="t2" style="font-size:12.5px">구현마다 70개 = 규칙 하나씩 담은 개별 테스트 7개 + 조합 63개(상태 9 × 행위 7)</text>
  <text x="24" y="476" class="gs" style="font-size:11px">운영 코드의 표를 가져다 쓰지 않고 기대 규칙(<tspan class="m">ALLOWED</tspan>)을 테스트에 따로 적음</text>
  <rect x="48" y="114" width="300" height="48" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0593;0.0693;0.1193;0.1293;1"/></rect>
  <rect x="48" y="176" width="300" height="48" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1396;0.1496;0.1996;0.2096;1"/></rect>
  <rect x="48" y="238" width="300" height="48" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.22;0.23;0.28;0.29;1"/></rect>
  <rect x="48" y="300" width="300" height="48" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3004;0.3104;0.3604;0.3704;1"/></rect>
  <rect x="48" y="362" width="300" height="48" rx="10" fill="none" stroke="#d97706" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3678;0.3778;0.4278;0.4378;1"/></rect>
  <rect x="390" y="314" width="334" height="44" rx="10" fill="none" stroke="#16a34a" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.85;0.86;0.91;0.92;1"/></rect>
  <g class="anim" opacity="0">
