  <text x="112" y="203" class="okt" style="font-size:11.5px">줄 1 — <tspan class="m">send</tspan> → 답 → <tspan class="m">markSent</tspan></text>
  <text x="112" y="221" class="oks" style="font-size:10.5px">보낸 때가 바로 남음</text>
