<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 604" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 2 선택지 비교 — 오케스트레이션(이 장에서 고름)은 결제를 바꾸는 기록 다섯 곳이 PaymentHoldings.settle 한 곳을 불러 승인이면 확정, 승인 없이 끝나거나 취소면 해제를 정하고 payment_outbox에 STOCK_CONFIRM·STOCK_RELEASE 줄을 남겨 릴레이가 stock-reservation-commands로 보내며, 재고 서비스는 결제 상태를 모른 채 받은 명령대로 예약 상태만 바꿈. 코레오그래피(비교)는 결제 서버가 쿠폰·포인트만 돌려주고 PAYMENT_RESULT 줄만 남기며, 재고 서비스의 PaymentEventReactionListener가 payment-events를 읽어 APPROVED·CAPTURED면 확정, APPROVAL_FAILED·EXPIRED·APPROVAL_CANCELED·CAPTURE_CANCELED면 해제함. 둘 다 계약 21개를 모두 통과했고 측정 어긋난 재고는 6번 모두 0, 맞춰진 때는 352~716ms와 243~752ms였음. 차이는 결제 서버에 settle과 재고 명령이 생기는 것과, 재고 서비스가 결제 상태 여섯 개의 뜻을 알고 재고를 잡지 않은 결제에도 빈 해제 줄을 남기는 것이며, 결과는 계약과 측정으로 갈리지 않았음</title>
