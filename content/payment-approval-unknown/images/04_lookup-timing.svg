  <text x="64" y="483" class="okt" style="font-size: 12.5px">결제 <tspan class="m">APPROVED</tspan> · PG <tspan class="m">DONE</tspan> — 짝이 맞음. 대기 시간은 테스트 10초, 기본값 1분</text>
