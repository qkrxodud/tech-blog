<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>인증 트랜잭션이 잠그는 줄 — 결제 줄 잠금(findByOrderIdForUpdate, 7장)으로 시작해 상품 번호 순 재고 줄, 쿠폰 줄, 포인트 줄을 조건부 UPDATE로 바꾸며 잠그고, 결제 상태 UPDATE는 커밋 때 나가며 커밋에서 잠금이 모두 풀림. 7장의 남은 한계에는 여러 결제를 한 트랜잭션에서 잠그는 기록이 생기면 다시 봐야 한다고 적었는데, 이 장의 인증 트랜잭션은 결제를 여러 개 잠그지는 않지만 같은 걱정이 결제 밖의 줄(재고·쿠폰·포인트)로 넓어짐. 재고는 상품 번호 순으로 잡도록 했을 뿐 교착 상태는 시험하지 않았고, 재고 줄 하나에 몰린 주문의 대기는 300건까지만 재었고 잠금을 쥔 인증 트랜잭션이 느려질 때는 실행하지 않음</title>
  <style>
