<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>스레드 1이 A, 스레드 2가 B의 선점 잠금을 구한 뒤 서로 상대가 쥔 잠금을 시도해 둘 다 대기하는 교착 상태와, 최대 대기 시간을 지정하면 3초 뒤 예외로 대기를 멈추는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .valc { font-size: 12.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .dbt { font-size: 13px; font-weight: 700; fill: #374151; }
    .dbc { font-size: 14px; font-weight: 700; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="520" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="330" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">교착 상태 — 서로 상대가 쥔 잠금을 기다림</text>
  <text x="220" y="68" class="step" text-anchor="middle">1단계</text>
  <text x="360" y="68" class="step" text-anchor="middle">2단계</text>
  <text x="500" y="68" class="step" text-anchor="middle">3단계</text>
  <text x="640" y="68" class="step" text-anchor="middle">4단계</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="117" class="lane">스레드 1</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="88" width="116" height="48" rx="8" class="hold"/>
  <text x="220" y="108" class="t" text-anchor="middle">A 잠금 구함</text>
  <text x="220" y="127" class="val" text-anchor="middle">선점 잠금</text>
  <rect x="442" y="88" width="116" height="48" rx="8" class="bad"/>
  <text x="500" y="108" class="badt" text-anchor="middle">B 잠금 시도</text>
  <text x="500" y="127" class="val" text-anchor="middle">스레드 2가 보유</text>
  <rect x="582" y="96" width="116" height="32" rx="6" class="wait"/>
  <text x="640.0" y="117.0" class="waitt" text-anchor="middle">B 대기</text>
  <text x="30" y="177" class="lane">스레드 2</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="302" y="148" width="116" height="48" rx="8" class="hold"/>
  <text x="360" y="168" class="t" text-anchor="middle">B 잠금 구함</text>
  <text x="360" y="187" class="val" text-anchor="middle">선점 잠금</text>
  <rect x="582" y="148" width="116" height="48" rx="8" class="bad"/>
  <text x="640" y="168" class="badt" text-anchor="middle">A 잠금 시도</text>
  <text x="640" y="187" class="val" text-anchor="middle">스레드 1이 보유</text>
  <text x="30" y="235" class="db">A 잠금</text>
  <rect x="162" y="214" width="536" height="32" rx="6" class="hold"/>
  <text x="430" y="235" class="dbt" text-anchor="middle">스레드 1 보유</text>
  <text x="30" y="275" class="db">B 잠금</text>
  <rect x="302" y="254" width="396" height="32" rx="6" class="hold"/>
  <text x="500" y="275" class="dbt" text-anchor="middle">스레드 2 보유</text>
  <text x="30" y="316" class="note">두 스레드 모두 자기 잠금은 쥔 채 상대의 잠금을 기다리므로, 어느 쪽도 진행하지 못합니다.</text>
  <rect x="10" y="356" width="740" height="154" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="388" class="h">최대 대기 시간 지정 — 정한 시간이 지나면 대기를 멈춤</text>
  <text x="730" y="388" class="code" text-anchor="end">lock.timeout = 3000</text>
  <text x="30" y="441" class="lane">스레드 1</text>
  <rect x="150" y="410" width="585" height="56" rx="6" class="track"/>
  <rect x="162" y="414" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="443.0" class="t" text-anchor="middle">B 잠금 시도</text>
  <rect x="290" y="426" width="280" height="32" rx="6" class="wait"/>
  <text x="430.0" y="447.0" class="waitt" text-anchor="middle">최대 3000ms 동안 대기</text>
  <rect x="582" y="414" width="116" height="48" rx="8" class="bad"/>
  <text x="640" y="434" class="badt" text-anchor="middle">예외 발생</text>
  <text x="640" y="453" class="val" text-anchor="middle">잠금 구하기 실패</text>
  <text x="30" y="494" class="foot">지정한 시간 안에 잠금을 구하지 못하면 예외가 발생하므로, 스레드가 영원히 대기하지 않습니다.</text>
</svg>
