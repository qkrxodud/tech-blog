<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>주입 지점의 @Qualifier("mainDiscountPolicy")로 먼저 같은 @Qualifier가 붙은 빈을 찾아 RateDiscountPolicy를 주입하고, 없으면 mainDiscountPolicy라는 이름의 빈을 찾으며, 그것도 없으면 NoSuchBeanDefinitionException이 발생하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .okms { font-size: 12px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .chip { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .gscope { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .dim { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dimt { font-size: 12.5px; fill: #9ca3af; font-family: Menlo, Consolas, monospace; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .tag { font-size: 11.5px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="380" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">@Qualifier 매칭 순서 — Qualifier끼리, 빈 이름, 그래도 없으면 예외</text>
  <rect x="30" y="74" width="210" height="72" rx="8" class="hold"/>
  <text x="135" y="96" class="sub" text-anchor="middle">주입 지점</text>
  <text x="135" y="116" class="ms" text-anchor="middle">@Qualifier(</text>
  <text x="135" y="134" class="ms" text-anchor="middle">"mainDiscountPolicy")</text>
  <line x1="244" y1="110" x2="286" y2="110" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="290" y="74" width="230" height="72" rx="8" class="box"/>
  <text x="405" y="102" class="t" text-anchor="middle">1. @Qualifier끼리 매칭</text>
  <text x="405" y="124" class="sub" text-anchor="middle">같은 @Qualifier가 붙은 빈이 있나?</text>
  <text x="545" y="100" class="gnote" text-anchor="middle">있음</text>
  <line x1="524" y1="110" x2="566" y2="110" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="570" y="74" width="160" height="72" rx="8" class="ok"/>
  <text x="650" y="102" class="okt" text-anchor="middle">주입</text>
  <text x="650" y="124" class="m" text-anchor="middle">RateDiscountPolicy</text>
  <text x="422" y="178" class="sub">없음</text>
  <line x1="405" y1="150" x2="405" y2="196" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="290" y="200" width="230" height="72" rx="8" class="box"/>
  <text x="405" y="228" class="t" text-anchor="middle">2. 빈 이름 매칭</text>
  <text x="405" y="250" class="sub" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">mainDiscountPolicy</tspan> 이름의 빈?</text>
  <text x="545" y="226" class="gnote" text-anchor="middle">있음</text>
  <line x1="524" y1="236" x2="566" y2="236" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="570" y="200" width="160" height="72" rx="8" class="ok"/>
  <text x="650" y="241" class="okt" text-anchor="middle">그 빈을 주입</text>
  <text x="422" y="300" class="sub">없음</text>
  <line x1="405" y1="276" x2="405" y2="312" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="290" y="316" width="440" height="54" rx="8" class="bad"/>
  <text x="510" y="349" class="badm" text-anchor="middle">NoSuchBeanDefinitionException</text>
  <text x="30" y="190" class="foot">@Qualifier는 추가 구분자일 뿐</text>
  <text x="30" y="208" class="foot">빈 이름을 바꾸지 않습니다.</text>
</svg>
