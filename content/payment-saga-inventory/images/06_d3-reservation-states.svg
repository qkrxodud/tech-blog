  <text x="672" y="110" class="gs" style="font-size:11px">다시 온 확정</text>
  <text x="672" y="126" class="gs" style="font-size:11px;font-weight:700">바꾸지 않음</text>
  <path d="M620,317 C666,295 666,363 624,341" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#agy)"/>
  <text x="672" y="318" class="gs" style="font-size:11px">다시 온 해제</text>
  <text x="672" y="334" class="gs" style="font-size:11px">늦게 온 확정</text>
  <text x="672" y="350" class="gs" style="font-size:11px;font-weight:700">바꾸지 않음</text>
  <line x1="500" y1="420" x2="500" y2="362" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="440" y="420" width="280" height="40" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/><text x="580" y="436.5" class="s2" text-anchor="middle" style="fill:#b91c1c;font-size:11px;font-weight:700">늦게 온 예약 — 받지 않음</text><text x="580" y="451.5" class="s2" text-anchor="middle" style="fill:#b91c1c;font-size:11px;font-weight:700">409 <tspan class="m">RESERVATION_RELEASED</tspan></text>
  <line x1="12" y1="474" x2="748" y2="474" stroke="#9ca3af" stroke-width="1"/>
  <text x="24" y="492" class="gs" style="font-size:11.5px">잡혀 있거나 확정된 줄에 다시 온 예약은 그대로 둠 · 상태 전이 규칙은 재고 서비스 모듈 단위 시험 7개로 확인</text>
</svg>
