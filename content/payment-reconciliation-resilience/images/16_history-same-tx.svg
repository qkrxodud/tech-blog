<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 3 상태 전이와 이력을 남기는 코드 순서 — 결제를 바꾸는 기록(예: PaymentWebhookRecorder.follow, PaymentRecorder.recordApproval도 같은 순서)이 한 트랜잭션 안에서 1 findByOrderIdForUpdate로 결제 줄을 잠그고, 2 행위 메서드가 changeStatus로 (이전, 행위, 다음) 전이를 저장하지 않는(@Transient) 목록에 더하고, 3 paymentHoldings.settle, 4 publishIfChanged로 payment_outbox에 결제 결과를 남기고, 5 PaymentHistories.record가 drainTransitions로 꺼낸 전이를 saveAll로 남긴 뒤 6 결제·outbox·이력을 함께 커밋하는 순서. 커밋이 실패해 롤백되면 셋 모두 남지 않고, 보정이 결과 모름을 승인으로 닫고 카드사 취소까지 들여오면 전이마다 한 줄, 상태가 그대로인 부분 취소와 결제 생성은 0줄임</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #4b5563; }
    .s2 { font-size: 11.5px; fill: #4b5563; }
    .m { font-family: Menlo, Consolas, monospace; }
    .lbl { font-size: 12px; fill: #4b5563; }
    .tab { font-size: 12.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .badt { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .bads { font-size: 12px; fill: #b91c1c; }
    .okt { font-size: 13px; font-weight: 700; fill: #15803d; }
    .oks { font-size: 12px; fill: #15803d; }
    .gt { font-size: 13px; font-weight: 700; fill: #6b7280; }
    .gs { font-size: 12px; fill: #6b7280; }
    .ys { font-size: 12px; fill: #92400e; }
    .yt { font-size: 13px; font-weight: 700; fill: #92400e; }
    .ot { font-size: 13px; font-weight: 700; fill: #c2410c; }
    .os { font-size: 12px; fill: #c2410c; }
    .bt { font-size: 13px; font-weight: 700; fill: #1e3a8a; }
    .bs { font-size: 12px; fill: #1e3a8a; }
    .o { stroke: #1f2937; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .spine { stroke: #1f2937; stroke-width: 1.5; fill: none; }
    .life { stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .hl { paint-order: stroke; stroke: #ffffff; stroke-width: 3.5px; stroke-linejoin: round; }
    .run { stroke-dasharray: 5 4; animation: run 0.9s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -18; } }
    @media (prefers-reduced-motion: reduce) { .run { animation: none; } .anim { display: none; } }
  </style>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
