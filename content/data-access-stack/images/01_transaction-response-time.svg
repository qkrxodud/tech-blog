<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>트랜잭션 하나의 응답 시간은 연결 획득, Statement 제출, Statement 실행, 결과 가져오기, 연결 해제 전 유휴 시간의 다섯 구간을 더한 값이고, 커넥션은 획득 이후 해제될 때까지 점유된다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12.5px; fill: #374151; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .thead { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .cell { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 12.5px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 12.5px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="316" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="296" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">트랜잭션 응답 시간 — 다섯 구간을 더한 값</text>
  <text x="94" y="72" class="step" text-anchor="middle">①</text>
  <text x="237" y="72" class="step" text-anchor="middle">②</text>
  <text x="380" y="72" class="step" text-anchor="middle">③</text>
  <text x="523" y="72" class="step" text-anchor="middle">④</text>
  <text x="666" y="72" class="step" text-anchor="middle">⑤</text>
  <rect x="30" y="82" width="128" height="58" rx="10" class="box"/>
  <text x="94" y="106" class="t" text-anchor="middle">연결 획득</text>
  <text x="94" y="126" class="sub" text-anchor="middle">DB 커넥션 획득</text>
  <rect x="173" y="82" width="128" height="58" rx="10" class="box"/>
  <text x="237" y="106" class="t" text-anchor="middle">Statement 제출</text>
  <text x="237" y="126" class="sub" text-anchor="middle">DB 엔진에 전달</text>
  <rect x="316" y="82" width="128" height="58" rx="10" class="box"/>
  <text x="380" y="106" class="t" text-anchor="middle">Statement 실행</text>
  <text x="380" y="126" class="sub" text-anchor="middle">DB 엔진에서 실행</text>
  <rect x="459" y="82" width="128" height="58" rx="10" class="box"/>
  <text x="523" y="106" class="t" text-anchor="middle">결과 가져오기</text>
  <text x="523" y="126" class="sub" text-anchor="middle">결과 집합 조회</text>
  <rect x="602" y="82" width="128" height="58" rx="10" class="box"/>
  <text x="666" y="106" class="t" text-anchor="middle">유휴 시간</text>
  <text x="666" y="126" class="sub" text-anchor="middle">종료·연결 해제 전</text>
  <line x1="159" y1="111" x2="171" y2="111" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="302" y1="111" x2="314" y2="111" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="445" y1="111" x2="457" y2="111" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="588" y1="111" x2="600" y2="111" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="158" y="156" width="572" height="32" rx="6" class="hold"/>
  <text x="444" y="177" class="val" text-anchor="middle">커넥션 점유 — 획득한 뒤부터 연결을 해제할 때까지</text>
  <text x="30" y="177" class="t">커넥션</text>
  <line x1="30" y1="208" x2="730" y2="208" class="axis"/>
  <line x1="30" y1="200" x2="30" y2="216" class="axis"/>
  <line x1="730" y1="200" x2="730" y2="216" class="axis"/>
  <text x="380" y="236" class="t" text-anchor="middle">응답 시간 = ① + ② + ③ + ④ + ⑤</text>
  <text x="380" y="256" class="sub" text-anchor="middle">트랜잭션 매니저 수준에서 측정</text>
  <text x="30" y="286" class="gnote">처리량은 단위 시간당 실행된 트랜잭션 수이고, 그 역수가 평균 응답 시간입니다. 응답 시간을 줄이면 처리량이 늘어납니다.</text>
</svg>
