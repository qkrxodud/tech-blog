  <text x="596" y="298" class="t2" style="font-size:12px">받은 기록</text>
  <text x="596" y="316" class="s2" style="font-size:10px"><tspan class="m">received_payment_event</tspan></text>
  <text x="596" y="334" class="gs" style="font-size:10.5px">JPA 엔티티에서 빼고</text>
  <text x="596" y="350" class="gs" style="font-size:10.5px">JDBC로 남김</text>
  <line x1="594" y1="366" x2="738" y2="366" stroke="#9ca3af" stroke-width="1"/>
  <text x="596" y="386" class="t2" style="font-size:12px">재고 서비스도 같음</text>
  <text x="596" y="404" class="s2" style="font-size:10px"><tspan class="m">processed_stock_command</tspan></text>
  <text x="596" y="422" class="gs" style="font-size:10.5px"><tspan class="m">command_id</tspan> 고유</text>
  <text x="596" y="440" class="gs" style="font-size:10.5px">처음 온 번호일 때만</text>
  <text x="596" y="456" class="gs" style="font-size:10.5px">예약을 바꿈</text>
  <rect x="14" y="488" width="734" height="98" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="28" y="510" class="gs" style="font-size:11.5px">주석에는 “같은 번호를 다른 트랜잭션이 남기는 중이면 그 트랜잭션이 끝날 때까지 기다린 뒤 답한다”</text>
  <text x="28" y="530" class="gs" style="font-size:11.5px">— 10장과 마찬가지로 MySQL 문서로 확인하지 않음</text>
  <text x="28" y="556" class="s2" style="font-size:11.5px;fill:#1f2937">가리는 이유: 결제 서버가 적어도 한 번 보내고(9장), 소비자가 처리한 뒤 읽은 자리를 커밋하기 전에</text>
  <text x="28" y="574" class="s2" style="font-size:11.5px;fill:#1f2937">다시 뜨면 같은 메시지를 다시 읽음</text>
