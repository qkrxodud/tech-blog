<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>분리한 서비스를 거쳐 회원마다 새 트랜잭션이 생성되어 회원1은 커밋, 회원2만 롤백되고 바깥 트랜잭션에서 이력을 저장하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .cellt { font-size: 14px; font-weight: 700; fill: #374151; }
    .colh { font-size: 13px; font-weight: 700; fill: #4b5563; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="310" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">서비스 분리 — 회원마다 새 트랜잭션</text>
  <text x="730" y="42" class="code" text-anchor="end">REQUIRES_NEW</text>
  <text x="220" y="72" class="step" text-anchor="middle">1. 일괄 처리 시작</text>
  <text x="360" y="72" class="step" text-anchor="middle">2. 회원1 저장</text>
  <text x="500" y="72" class="step" text-anchor="middle">3. 회원2 저장</text>
  <text x="640" y="72" class="step" text-anchor="middle">4. 이력 저장</text>
  <line x1="160" y1="80" x2="722" y2="80" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="110" class="lane">바깥</text>
  <text x="30" y="128" class="sub">saveMembers()</text>
  <rect x="150" y="88" width="585" height="52" rx="6" class="track"/>
  <rect x="157" y="90" width="126" height="48" rx="8" class="box"/>
  <text x="220" y="119" class="op" text-anchor="middle">begin</text>
  <rect x="290" y="98" width="280" height="32" rx="6" class="wait"/>
  <text x="430" y="119" class="waitt" text-anchor="middle">보류 (분리한 서비스 호출 중)</text>
  <rect x="577" y="90" width="126" height="48" rx="8" class="ok"/>
  <text x="640" y="110" class="okc" text-anchor="middle">commit</text>
  <text x="640" y="129" class="val" text-anchor="middle">이력 저장</text>
  <text x="30" y="170" class="lane">회원1</text>
  <text x="30" y="188" class="sub">새 트랜잭션</text>
  <rect x="150" y="148" width="585" height="52" rx="6" class="track"/>
  <rect x="297" y="150" width="126" height="48" rx="8" class="ok"/>
  <text x="360" y="170" class="okc" text-anchor="middle">commit</text>
  <text x="360" y="189" class="val" text-anchor="middle">저장 성공</text>
  <text x="30" y="230" class="lane">회원2</text>
  <text x="30" y="248" class="sub">새 트랜잭션</text>
  <rect x="150" y="208" width="585" height="52" rx="6" class="track"/>
  <rect x="437" y="210" width="126" height="48" rx="8" class="bad"/>
  <text x="500" y="230" class="badc" text-anchor="middle">rollback</text>
  <text x="500" y="249" class="val" text-anchor="middle">저장 실패</text>
  <line x1="240" y1="140" x2="330" y2="150" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="150" y="284" class="sub">분리한 서비스의 프록시를 거치므로 회원마다 REQUIRES_NEW 트랜잭션이 생성되고,</text>
  <text x="150" y="302" class="sub">회원2만 롤백됩니다. 이력 저장까지 가려면 반복문에서 회원2의 예외를 잡아야 합니다.</text>

</svg>
