  <line x1="213" y1="425" x2="213" y2="438" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#aor)"/>
  <rect x="186" y="440" width="210" height="30" rx="6" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <text x="291" y="459" class="os" text-anchor="middle" style="font-size:10.5px;">다시 시도 토픽으로 넘김 → 뒤에 다시 처리</text>
  <line x1="398" y1="455" x2="420" y2="455" stroke="#c2410c" stroke-width="1.6" marker-end="url(#aor)"/>
  <rect x="422" y="440" width="160" height="30" rx="6" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <text x="502" y="459" class="ys" text-anchor="middle" style="font-size:10.5px;">늦게 온 승인 — 결정 2가 거름</text>
  <use href="#xs" x="194" y="488"/>
  <text x="206" y="492" class="bads" style="font-size:11px">받은 순서 <tspan class="m">[APPROVAL_CANCELED, APPROVED]</tspan> — 순서 계약 실패 · 주문은 취소로 끝남</text>
  <text x="186" y="510" class="s2" style="font-size:10px;fill:#1f2937">막는 시간 일시 45~48ms · 41~50ms, 영구 49~57ms · 46~51ms · 다 쓴 메시지의 실패 모음 원인 머리가 비어 있음</text>
  <line x1="14" y1="528" x2="748" y2="528" stroke="#9ca3af" stroke-width="1"/>
  <text x="24" y="550" class="t2">11장 계약 실패</text>
  <text x="140" y="550" class="okt" style="font-size:12px">운영 주문 0 · 재고 0</text>
  <text x="310" y="550" class="badt" style="font-size:12px">기본 처리 주문 8 · 재고 7</text>
  <text x="510" y="550" class="badt" style="font-size:12px">다시 시도 토픽 주문 2 · 재고 1</text>
  <text x="24" y="574" class="gs" style="font-size:10.5px">재고의 순서 계약은 다시 시도 토픽에서도 예약 상태 전이로 결과가 같아 통과 · 기본 처리의 재고 “확정 다시 시도 중 해제”는 해제가 재고를 돌려줘 통과</text>
  <text x="24" y="596" class="gs" style="font-size:10.5px">문서: “By using this strategy you lose Kafka's ordering guarantees for that topic.” (다시 시도 토픽)</text>
  <text x="24" y="618" class="gs" style="font-size:10.5px">막는 시간: 주문 서비스, 한 결제를 계속 실패시킨 뒤 같은 파티션 결과가 반영되기까지 · 두 값은 첫 실행 · 두 번째 실행(방식마다 3번씩)</text>
