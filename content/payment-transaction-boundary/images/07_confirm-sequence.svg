  <g transform="translate(24,57)"><rect x="0" y="0" width="26" height="18" rx="3" fill="#5eead4" class="o"/><path d="M8,24 h10 M13,18 v6" class="o" fill="none"/></g>
  <text x="58" y="75" class="t">클라이언트</text>
  <rect x="16" y="46" width="128" height="46" rx="10" fill="none" stroke="#16a34a" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.845;0.85;0.93;0.94;1"/></rect>
  <rect x="232" y="46" width="176" height="46" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
