<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>mutator thread의 local SATB buffer가 가득 차면 global SATB buffer로 통째로 옮겨지고, GC thread가 이를 주기적으로 가져와 필터링한 old 객체를 local mark stack에 push하며, local mark stack이 가득 차면 global mark stack으로 옮기고 비면 global mark stack이나 다른 GC thread에서 가져온다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
    .monob { font-family: Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #1f2937; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dark { fill: #d1d5db; stroke: #6b7280; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .sep { stroke: #e5e7eb; stroke-width: 1; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .wn { fill: #ffffff; stroke: #6b7280; stroke-width: 1.5; }
    .gn { fill: #d1d5db; stroke: #6b7280; stroke-width: 1.5; }
    .bn { fill: #374151; stroke: #1f2937; stroke-width: 1.5; }
    .nt { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ntw { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .edge { stroke: #6b7280; stroke-width: 1.5; fill: none; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="440" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="420" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">SATB buffer와 mark stack — 객체가 오가는 경로</text>
  <text x="120" y="72" class="step" text-anchor="middle">mutator thread</text>
  <text x="380" y="72" class="step" text-anchor="middle">공유 영역</text>
  <text x="640" y="72" class="step" text-anchor="middle">GC thread</text>
  <rect x="30" y="82" width="180" height="118" rx="8" class="hold"/>
  <text x="44" y="106" class="op">mutator thread 1</text>
  <text x="44" y="124" class="sub">local SATB buffer (가득 참)</text>
  <rect x="44" y="138" width="34" height="22" rx="3" class="ok"/>
  <text x="61.0" y="154" class="mono" text-anchor="middle">2</text>
  <rect x="82" y="138" width="34" height="22" rx="3" class="ok"/>
  <text x="99.0" y="154" class="mono" text-anchor="middle">0</text>
  <rect x="120" y="138" width="34" height="22" rx="3" class="ok"/>
  <text x="137.0" y="154" class="mono" text-anchor="middle">11</text>
  <rect x="158" y="138" width="34" height="22" rx="3" class="ok"/>
  <text x="175.0" y="154" class="mono" text-anchor="middle">71</text>
  <text x="44" y="186" class="sub">기존 참조 객체를 저장</text>
  <rect x="30" y="226" width="180" height="56" rx="8" class="wait"/>
  <text x="120" y="250" class="waitt" text-anchor="middle">새 local SATB buffer</text>
  <text x="120" y="268" class="sub" text-anchor="middle">다 찬 buffer 대신 할당</text>
  <rect x="290" y="82" width="180" height="118" rx="8" class="box"/>
  <text x="380" y="106" class="op" text-anchor="middle">global SATB buffer</text>
  <rect x="308" y="120" width="144" height="26" rx="4" class="ok"/>
  <text x="380" y="138" class="val" text-anchor="middle">SATB buf 주소</text>
  <rect x="308" y="152" width="144" height="26" rx="4" class="ok"/>
  <text x="380" y="170" class="val" text-anchor="middle">SATB buf 주소</text>
  <line x1="211" y1="141" x2="288" y2="141" class="gl" marker-end="url(#agr)"/>
  <text x="250" y="166" class="gnote" text-anchor="middle">가득 차면</text>
  <text x="250" y="184" class="gnote" text-anchor="middle">통째로</text>
  <rect x="550" y="82" width="180" height="118" rx="8" class="hold"/>
  <text x="564" y="106" class="op">GC thread 1</text>
  <text x="564" y="124" class="sub">local mark stack</text>
  <rect x="564" y="138" width="30" height="22" rx="3" class="hold"/>
  <text x="579.0" y="154" class="mono" text-anchor="middle">5</text>
  <rect x="598" y="138" width="30" height="22" rx="3" class="hold"/>
  <text x="613.0" y="154" class="mono" text-anchor="middle">8</text>
  <text x="564" y="186" class="sub">push/pop하며 marking</text>
  <line x1="471" y1="141" x2="548" y2="141" class="gl" marker-end="url(#agr)"/>
  <text x="510" y="166" class="gnote" text-anchor="middle">주기적으로</text>
  <text x="510" y="184" class="gnote" text-anchor="middle">가져와 필터링</text>
  <rect x="290" y="300" width="180" height="56" rx="8" class="box"/>
  <text x="380" y="324" class="op" text-anchor="middle">global mark stack</text>
  <text x="380" y="342" class="sub" text-anchor="middle">GC thread가 공유</text>
  <rect x="550" y="300" width="180" height="56" rx="8" class="hold"/>
  <text x="564" y="324" class="op">GC thread 2</text>
  <text x="564" y="342" class="sub">local mark stack (비어 있음)</text>
  <line x1="580" y1="201" x2="440" y2="298" class="al" marker-end="url(#ar)"/>
  <text x="492" y="236" class="sub" text-anchor="end">가득 차면</text>
  <text x="492" y="254" class="sub" text-anchor="end">일부를 옮김</text>
  <line x1="471" y1="328" x2="548" y2="328" class="al" marker-end="url(#ar)"/>
  <text x="510" y="378" class="sub" text-anchor="middle">비면 일부를 가져옴</text>
  <line x1="700" y1="201" x2="700" y2="298" class="al" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="690" y="240" class="sub" text-anchor="end">global도 비면</text>
  <text x="690" y="258" class="sub" text-anchor="end">다른 GC thread에서</text>
  <text x="30" y="408" class="sub">mark stack에 push될 수 있는 조건: old 객체이면서 TAMS 포인터 이전에 할당되었고 mark bitmap의 bit 값이 0</text>

</svg>
