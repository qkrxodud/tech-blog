    <g id="i-outbox"><rect x="0" y="0" width="30" height="26" rx="3" fill="#ffffff" class="o"/><rect x="0" y="0" width="30" height="7" rx="3" fill="#86efac" class="o"/><path d="M0,13.5 h30 M0,20 h30 M11,7 v19" stroke="#1f2937" stroke-width="1.2"/></g>
  </defs>

  <rect width="760" height="430" fill="#ffffff"/>
  <text x="24" y="30" class="h">출발 코드 결과 전에 밝혀 둘 것 두 가지</text>
  <circle cx="36" cy="66" r="10" fill="#111827"/><text x="36" y="70" class="num" text-anchor="middle">1</text>
  <text x="54" y="71" class="t2" style="font-size:13px">10장 계약을 고친 것</text>
  <rect x="24" y="84" width="712" height="150" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="38" y="106" class="t2" style="font-size:12px">답이 늦은 경우 · 요청이 늦게 도착한 경우 · 해제가 예약보다 먼저 도착한 경우 — 세 계약의 비교식</text>
  <rect x="38" y="118" width="230" height="52" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="50" y="138" class="gt" style="font-size:11.5px">처음</text>
  <text x="50" y="158" class="gs" style="font-size:11.5px">남은 재고 = 처음 재고(5)</text>
  <line x1="272" y1="144" x2="300" y2="144" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="304" y="118" width="418" height="52" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="316" y="138" class="okt" style="font-size:11.5px">출발 구조를 커밋한 뒤</text>
  <text x="316" y="158" class="oks" style="font-size:11.5px">남은 재고 + 승인이 남은 결제의 수량 = 처음 재고</text>
  <text x="38" y="190" class="s2" style="font-size:11px">이유: 승인 먼저 비교(결정 1)에서는 답이 늦은 주문도 승인돼 남은 재고만으로는 맞지 않음</text>
  <text x="38" y="210" class="s2" style="font-size:11px">결정 4에서 "예약을 처리하는 동안 시간 제한이 지나는" 계약 1개를 더함 → 21개</text>
  <text x="38" y="228" class="gs" style="font-size:10.5px">출발 코드는 그대로 · 임시 브랜치에서 계약만 얹고 <tspan class="m">InventoryServer.releaseHold()</tspan>만 더해 다시 돌림</text>
  <circle cx="36" cy="262" r="10" fill="#111827"/><text x="36" y="266" class="num" text-anchor="middle">2</text>
  <text x="54" y="267" class="t2" style="font-size:13px">앞 장 시험의 준비를 재고 서비스로 옮긴 것</text>
  <rect x="24" y="280" width="232" height="104" rx="12" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="38" y="304" class="bt" style="font-size:12.5px">8장 시험의 재고</text>
  <text x="38" y="328" class="bs" style="font-size:11px">재고 서비스 DB에 둠</text>
  <rect x="264" y="280" width="232" height="104" rx="12" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="278" y="304" class="bt" style="font-size:12.5px">8장 재고 줄이기 비교</text>
  <text x="278" y="328" class="bs" style="font-size:11px">잠그지 않음 · <tspan class="m">for update</tspan> ·</text>
  <text x="278" y="345" class="bs" style="font-size:11px">변경 번호 → 재고 서비스 안의</text>
  <text x="278" y="362" class="bs" style="font-size:11px">재고 저장소를 바꿔 끼움</text>
  <rect x="504" y="280" width="232" height="104" rx="12" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <text x="518" y="304" class="yt" style="font-size:12.5px"><tspan class="m">StockContract</tspan>만 시간 제한 5초</text>
  <text x="518" y="328" class="ys" style="font-size:11px">재고 줄이기를 1초 붙잡다</text>
  <text x="518" y="345" class="ys" style="font-size:11px">운영 시간 제한 1초에 걸려</text>
  <text x="518" y="362" class="ys" style="font-size:11px">두 주문이 모두 그만둠</text>
  <text x="380" y="412" class="gt" text-anchor="middle" style="font-size:12.5px">계약 문장과 기대값은 바꾸지 않음</text>
</svg>
