<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>ApplicationContext가 빈 관리·조회 기능을 가진 BeanFactory를 상속받고, 국제화·환경변수·애플리케이션 이벤트·리소스 조회 부가 기능을 더해 제공하는 관계</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .pkg { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .gnote { font-size: 12px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="760" height="440" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="420" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">상속 관계 — 빈 관리 기능 위에 부가 기능을 더한다</text>
  <rect x="30" y="62" width="300" height="320" rx="10" class="scope"/>
  <text x="46" y="86" class="s">스프링 컨테이너</text>
  <rect x="60" y="100" width="240" height="78" rx="8" class="box"/>
  <text x="180" y="124" class="op" text-anchor="middle">BeanFactory</text>
  <text x="180" y="144" class="s" text-anchor="middle">최상위 인터페이스</text>
  <text x="180" y="164" class="s" text-anchor="middle">빈 관리·조회, <tspan font-family="Menlo, Consolas, monospace">getBean()</tspan></text>
  <rect x="60" y="282" width="240" height="78" rx="8" class="ok"/>
  <text x="180" y="306" class="okc" text-anchor="middle">ApplicationContext</text>
  <text x="180" y="326" class="s" text-anchor="middle">BeanFactory 기능을 모두 상속</text>
  <text x="180" y="346" class="s" text-anchor="middle">+ 부가 기능</text>
  <line x1="180" y1="282" x2="180" y2="180" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tri)"/>
  <text x="192" y="236" class="s">상속</text>
  <rect x="420" y="96" width="310" height="56" rx="8" class="box"/>
  <text x="575" y="119" class="t" text-anchor="middle">국제화 기능</text>
  <text x="575" y="140" class="s" text-anchor="middle">메시지 소스 — 언어별로 출력</text>
  <line x1="300" y1="321" x2="416" y2="124" stroke="#16a34a" stroke-width="1.4" marker-end="url(#agr)"/>
  <rect x="420" y="166" width="310" height="56" rx="8" class="box"/>
  <text x="575" y="189" class="t" text-anchor="middle">환경변수</text>
  <text x="575" y="210" class="s" text-anchor="middle">로컬·개발·운영 구분</text>
  <line x1="300" y1="321" x2="416" y2="194" stroke="#16a34a" stroke-width="1.4" marker-end="url(#agr)"/>
  <rect x="420" y="236" width="310" height="56" rx="8" class="box"/>
  <text x="575" y="259" class="t" text-anchor="middle">애플리케이션 이벤트</text>
  <text x="575" y="280" class="s" text-anchor="middle">이벤트 발행·구독</text>
  <line x1="300" y1="321" x2="416" y2="264" stroke="#16a34a" stroke-width="1.4" marker-end="url(#agr)"/>
  <rect x="420" y="306" width="310" height="56" rx="8" class="box"/>
  <text x="575" y="329" class="t" text-anchor="middle">편리한 리소스 조회</text>
  <text x="575" y="350" class="s" text-anchor="middle">파일·클래스패스·외부</text>
  <line x1="300" y1="321" x2="416" y2="334" stroke="#16a34a" stroke-width="1.4" marker-end="url(#agr)"/>
  <text x="575" y="84" class="gnote" text-anchor="middle">ApplicationContext가 더하는 부가 기능</text>
  <text x="30" y="412" class="foot">BeanFactory나 ApplicationContext를 스프링 컨테이너라고 하며, 실제로는 부가 기능이 있는 ApplicationContext를 사용합니다.</text>
</svg>
