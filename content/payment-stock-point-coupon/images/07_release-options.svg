<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 4 — 거절된 결제(잡은 상태 재고 3·포인트 2000원, 처음 재고 5·포인트 3000원)를 알림 처리·보정·거절 답 기록 셋이 겹쳐 닫을 때. 세 기록은 7장의 결제 줄 잠금을 차례로 지나고, 먼저 닫은 기록만 before가 AUTHENTICATED이고 나중 두 기록은 이미 APPROVAL_FAILED를 읽는다. 상태 전이에서 한 번 + 이력(이 장에서 고름)은 먼저 닫은 기록만 돌려줘 재고 5·포인트 3000원, 실패 0개. 곳마다 따로(이력은 운영과 같음)는 세 기록이 저마다 재고 2개씩 돌려줘 재고 9, 포인트는 RESTORE 이력이 두 번째부터 막아 3000원, 실패 1개. 이력 없이 잔액만은 재고 5·포인트 3000원, 실패 0개. 곳마다 따로 + 이력 없이는 재고 9·포인트 5000원, 실패 2개. 되돌리기 계약 11개 기준</title>
