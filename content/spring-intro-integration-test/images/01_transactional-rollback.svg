<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>@SpringBootTest로 스프링을 띄워 memberService를 주입받고, @Transactional이 시작한 트랜잭션 안에서 join으로 이름이 hello인 회원을 insert하고 검증한 뒤, 테스트가 끝나면 롤백되어 DB가 테스트 전 상태로 돌아가는 순서</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .grp { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 13px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 12px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="340" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="320" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">@Transactional — 테스트가 끝나면 롤백한다</text>
  <text x="730" y="42" class="sub" text-anchor="end" font-size="13">회원가입<tspan font-family="Menlo, Consolas, monospace">()</tspan> 테스트</text>

  <text x="220" y="68" class="step" text-anchor="middle">테스트 시작</text>
  <text x="368" y="68" class="step" text-anchor="middle">given · when</text>
  <text x="516" y="68" class="step" text-anchor="middle">then</text>
  <text x="664" y="68" class="step" text-anchor="middle">테스트 종료</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>

  <text x="30" y="108" class="lane">트랜잭션</text>
  <text x="30" y="126" class="sub">@Transactional</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="154" y="88" width="132" height="48" rx="8" class="box"/>
  <text x="220" y="117" class="t" text-anchor="middle">시작</text>
  <rect x="302" y="96" width="280" height="32" rx="6" class="hold"/>
  <text x="442" y="117" class="waitt" text-anchor="middle">같은 트랜잭션 안에서 실행</text>
  <rect x="598" y="88" width="132" height="48" rx="8" class="ok"/>
  <text x="664" y="108" class="okm" text-anchor="middle">rollback</text>
  <text x="664" y="127" class="val" text-anchor="middle">변경 되돌림</text>

  <text x="30" y="168" class="lane">테스트</text>
  <text x="30" y="186" class="sub">@SpringBootTest</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="154" y="148" width="132" height="48" rx="8" class="box"/>
  <text x="220" y="168" class="op" text-anchor="middle">@Autowired</text>
  <text x="220" y="187" class="val" text-anchor="middle" font-family="Menlo, Consolas, monospace">memberService</text>
  <rect x="302" y="148" width="132" height="48" rx="8" class="box"/>
  <text x="368" y="168" class="op" text-anchor="middle">join(member1)</text>
  <text x="368" y="187" class="val" text-anchor="middle">이름 <tspan font-family="Menlo, Consolas, monospace">hello</tspan> 저장</text>
  <rect x="450" y="148" width="132" height="48" rx="8" class="box"/>
  <text x="516" y="168" class="op" text-anchor="middle">assertThat</text>
  <text x="516" y="187" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">findOne</tspan>으로 확인</text>

  <text x="30" y="228" class="lane">DB</text>
  <text x="30" y="246" class="sub">member 테이블</text>
  <rect x="150" y="206" width="585" height="52" rx="6" class="track"/>
  <rect x="154" y="208" width="132" height="48" rx="8" class="dbbox" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="220" y="237" class="val" text-anchor="middle">테스트 전 상태</text>
  <rect x="302" y="208" width="132" height="48" rx="8" class="hold"/>
  <text x="368" y="228" class="op" text-anchor="middle">insert</text>
  <text x="368" y="247" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">hello</tspan> 행 추가</text>
  <rect x="450" y="208" width="132" height="48" rx="8" class="hold"/>
  <text x="516" y="228" class="op" text-anchor="middle">select</text>
  <text x="516" y="247" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">hello</tspan> 행 조회</text>
  <rect x="598" y="208" width="132" height="48" rx="8" class="ok"/>
  <text x="664" y="237" class="okt" text-anchor="middle">테스트 전 상태</text>

  <line x1="368" y1="196" x2="368" y2="206" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="516" y1="196" x2="516" y2="206" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="664" y1="136" x2="664" y2="206" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>

  <text x="30" y="290" class="foot">테스트에서 저장한 <tspan font-family="Menlo, Consolas, monospace">hello</tspan> 회원은 커밋되지 않고 롤백되어, 다음 실행에 남지 않습니다.</text>
  <text x="30" y="312" class="foot">테스트 메서드마다 같은 순서로 반복합니다.</text>
</svg>
