  <text x="80.0" y="132" class="tab" text-anchor="middle">결제 서버</text>
  <g transform="translate(0,12)">
  <rect x="60" y="140" width="280" height="50" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
