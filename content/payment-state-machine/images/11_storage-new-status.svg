  <rect width="760" height="452" fill="#ffffff"/>
  <text x="24" y="30" class="h">결정 4 — 상태를 하나 더하면 세 저장 방식에서 생기는 일</text>
  <text x="24" y="52" class="gs" style="font-size:11px">MySQL 8.4(Testcontainers) · V2는 <tspan class="m">READY</tspan>와 <tspan class="m">APPROVED</tspan> 사이에 <tspan class="m">AUTHENTICATED</tspan>를 끼움</text>
  <rect x="176" y="70" width="180" height="48" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <use href="#i-db" transform="translate(188,79) scale(0.9)"/>
  <text x="222" y="90" class="t2" style="font-size:11.5px"><tspan class="m">ORDINAL</tspan></text>
  <text x="222" y="108" class="s" style="font-size:10.5px">순서 번호</text>
  <rect x="366" y="70" width="180" height="48" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="2.2"/>
  <use href="#i-db" transform="translate(378,79) scale(0.9)"/>
  <text x="412" y="90" class="okt" style="font-size:11.5px"><tspan class="m">STRING</tspan> + <tspan class="m">varchar</tspan></text>
  <text x="412" y="108" class="oks" style="font-size:10.5px">상태 이름 · 고른 것</text>
  <rect x="556" y="70" width="180" height="48" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <use href="#i-db" transform="translate(568,79) scale(0.9)"/>
  <text x="602" y="90" class="t2" style="font-size:11.5px"><tspan class="m">STRING</tspan> + MySQL <tspan class="m">enum</tspan></text>
  <text x="602" y="108" class="s" style="font-size:10.5px">정해진 값만</text>
  <text x="24" y="162" class="t2" style="font-size:12px">V1이 남긴 <tspan class="m">APPROVED</tspan></text>
  <text x="24" y="180" class="s" style="font-size:11px">V2가 읽으면</text>
  <rect x="176" y="132" width="180" height="70" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="194" y="154"/>
  <text x="212" y="159" class="badt" style="font-size:12px"><tspan class="m">1</tspan> → <tspan class="m">AUTHENTICATED</tspan></text>
  <text x="190" y="184" class="bads" style="font-size:11px">오류 없이 뜻이 바뀜</text>
  <rect x="366" y="132" width="180" height="70" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="384" y="154"/>
  <text x="402" y="159" class="okt" style="font-size:12px"><tspan class="m">APPROVED</tspan> 그대로</text>
  <text x="380" y="184" class="oks" style="font-size:11px">뜻이 유지됨</text>
  <rect x="556" y="132" width="180" height="70" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="646.0" y="172" class="gt" text-anchor="middle" style="font-size:12px">—</text>
  <text x="24" y="246" class="t2" style="font-size:12px">새 상태</text>
  <text x="24" y="264" class="s" style="font-size:11px"><tspan class="m">AUTHENTICATED</tspan> 넣기</text>
  <rect x="176" y="216" width="180" height="70" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="266.0" y="256" class="gt" text-anchor="middle" style="font-size:12px">—</text>
  <rect x="366" y="216" width="180" height="70" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="384" y="238"/>
  <text x="402" y="243" class="okt" style="font-size:12px">그대로 저장됨</text>
  <text x="380" y="268" class="oks" style="font-size:11px">목록에 없던 값도 받음</text>
  <rect x="556" y="216" width="180" height="70" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="574" y="238"/>
  <text x="592" y="243" class="badt" style="font-size:12px"><tspan class="m">Data truncated</tspan></text>
  <text x="570" y="268" class="bads" style="font-size:11px"><tspan class="m">ALTER TABLE</tspan>이 먼저</text>
  <rect x="24" y="304" width="712" height="66" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="38" y="326" class="t2" style="font-size:12px">실행 결과</text>
  <text x="38" y="346" class="s" style="font-size:11px"><tspan class="m">stored ordinal=1, V2 ordinal=AUTHENTICATED, V2 string=APPROVED</tspan></text>
  <text x="38" y="362" class="s" style="font-size:11px"><tspan class="m">enum insert error: Data truncated for column 'enum_status' at row 1</tspan></text>
  <text x="24" y="400" class="gs" style="font-size:11px">테스트 4개 — 순서 번호는 뜻이 바뀜 · 이름은 뜻이 유지됨 · 이름 칸은 새 상태를 받음 · 정해진 값 칸은 새 상태를 받지 않음</text>
</svg>
