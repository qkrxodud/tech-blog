<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>counter가 5일 때 두 스레드가 모두 5를 읽고 각자 6을 저장해 결과가 7이 아닌 6이 되는 실행 순서</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .opk { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .lbl { font-size: 13px; font-weight: 700; fill: #374151; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="310" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">동기화 없이 — 두 스레드의 읽기와 쓰기가 섞임</text>
  <text x="730" y="42" class="code" text-anchor="end">counter++</text>
  <text x="220" y="68" class="step" text-anchor="middle">1단계</text>
  <text x="360" y="68" class="step" text-anchor="middle">2단계</text>
  <text x="500" y="68" class="step" text-anchor="middle">3단계</text>
  <text x="640" y="68" class="step" text-anchor="middle">4단계</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">스레드 1</text>
  <text x="30" y="126" class="sub">counter++</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="108" class="opk" text-anchor="middle">읽기</text>
  <text x="220" y="127" class="val" text-anchor="middle">5 읽음</text>
  <rect x="442" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="500" y="108" class="opk" text-anchor="middle">증가·쓰기</text>
  <text x="500" y="127" class="val" text-anchor="middle">6 저장</text>

  <text x="30" y="168" class="lane">스레드 2</text>
  <text x="30" y="186" class="sub">counter++</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="302" y="148" width="116" height="48" rx="8" class="bad"/>
  <text x="360" y="168" class="opk" text-anchor="middle">읽기</text>
  <text x="360" y="187" class="val" text-anchor="middle">5 읽음</text>
  <rect x="582" y="148" width="116" height="48" rx="8" class="box"/>
  <text x="640" y="168" class="opk" text-anchor="middle">증가·쓰기</text>
  <text x="640" y="187" class="val" text-anchor="middle">6 저장</text>

  <text x="30" y="235" class="db">counter</text>
  <rect x="180" y="214" width="80" height="32" rx="6" class="dbbox"/>
  <text x="220" y="235" class="db" text-anchor="middle">5</text>
  <rect x="320" y="214" width="80" height="32" rx="6" class="dbbox"/>
  <text x="360" y="235" class="db" text-anchor="middle">5</text>
  <rect x="460" y="214" width="80" height="32" rx="6" class="dbbox"/>
  <text x="500" y="235" class="db" text-anchor="middle">6</text>
  <rect x="600" y="214" width="80" height="32" rx="6" class="bad"/>
  <text x="640" y="235" class="badt" text-anchor="middle">6</text>

  <text x="150" y="272" class="note">스레드 2가 스레드 1의 쓰기 전 값 5를 읽어, 스레드 1이 더한 1이 덮어써집니다</text>
  <rect x="150" y="284" width="250" height="26" rx="13" class="bad"/>
  <text x="275" y="302" class="badt" text-anchor="middle" style="font-size:13px">결과 6 (7이어야 함)</text>
  <text x="414" y="302" class="sub">실행 순서에 따라 결과가 달라지는 레이스 컨디션</text>
</svg>
