<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 5 정리와 보존 기간 — 매일 4시 30분에 delete … order by id limit 1000을 되풀이해, 보낸 payment_outbox 줄은 7일(Kafka 문서의 브로커 기본 보존 168시간 = 7일에 맞춘 가정), 주문 서비스의 받은 기록과 재고 서비스의 처리한 명령은 14일(7일의 두 배, 가정) 뒤 지움. 보내지 않은 outbox 줄, 11장 결정 2가 기대는 주문·예약 줄, 상태 이력은 지우지 않음. 받은 기록을 지운 뒤 같은 결과가 다시 오면 14일 안에는 받은 기록(11장 결정 1)이, 14일 뒤에는 받은 기록에 한 줄 다시 남고 마지막 번호(11장 결정 2)가 주문을 바꾸지 않는 타임라인</title>
