<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>buckpal 아래에 domain, persistence, web 세 패키지가 있고, 사용자 기능을 추가하면 UserController, UserService, UserRepository, User, UserRepositoryImpl이 세 패키지에 흩어지는 계층별 패키지 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 12px; font-weight: 700; fill: #374151; }
    .tsm { font-size: 12px; font-weight: 700; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .s { font-size: 12px; fill: #6b7280; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .pkg { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .pkgw { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badd { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6b7280" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect width="760" height="460" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="440" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">계층으로 구성하기 — 계층마다 패키지 하나</text>
  <text x="730" y="42" class="code" text-anchor="end">buckpal</text>

  <rect x="30" y="70" width="80" height="16" rx="3" class="pkg"/>
  <rect x="30" y="84" width="220" height="300" rx="6" class="pkg"/>
  <text x="44" y="106" class="tsm">domain</text>
  <rect x="45" y="116" width="190" height="28" rx="4" class="box"/>
  <text x="140" y="135" class="opm" text-anchor="middle">Account</text>
  <rect x="45" y="152" width="190" height="28" rx="4" class="box"/>
  <text x="140" y="171" class="opm" text-anchor="middle">Activity</text>
  <rect x="45" y="188" width="190" height="28" rx="4" class="box"/>
  <text x="140" y="207" class="opm" text-anchor="middle">AccountRepository</text>
  <rect x="45" y="224" width="190" height="28" rx="4" class="box"/>
  <text x="140" y="243" class="opm" text-anchor="middle">AccountService</text>
  <rect x="45" y="268" width="190" height="28" rx="4" class="badd"/>
  <text x="140" y="287" class="badm" text-anchor="middle">UserService</text>
  <rect x="45" y="304" width="190" height="28" rx="4" class="badd"/>
  <text x="140" y="323" class="badm" text-anchor="middle">UserRepository</text>
  <rect x="45" y="340" width="190" height="28" rx="4" class="badd"/>
  <text x="140" y="359" class="badm" text-anchor="middle">User</text>

  <rect x="270" y="70" width="80" height="16" rx="3" class="pkg"/>
  <rect x="270" y="84" width="220" height="300" rx="6" class="pkg"/>
  <text x="284" y="106" class="tsm">persistence</text>
  <rect x="285" y="116" width="190" height="28" rx="4" class="box"/>
  <text x="380" y="135" class="opm" text-anchor="middle">AccountRepositoryImpl</text>
  <rect x="285" y="160" width="190" height="28" rx="4" class="badd"/>
  <text x="380" y="179" class="badm" text-anchor="middle">UserRepositoryImpl</text>

  <rect x="510" y="70" width="80" height="16" rx="3" class="pkg"/>
  <rect x="510" y="84" width="220" height="300" rx="6" class="pkg"/>
  <text x="524" y="106" class="tsm">web</text>
  <rect x="525" y="116" width="190" height="28" rx="4" class="box"/>
  <text x="620" y="135" class="opm" text-anchor="middle">AccountController</text>
  <rect x="525" y="160" width="190" height="28" rx="4" class="badd"/>
  <text x="620" y="179" class="badm" text-anchor="middle">UserController</text>

  <rect x="30" y="401" width="34" height="18" rx="4" class="badd"/>
  <text x="76" y="415" class="note">사용자 기능을 추가할 때 생기는 클래스 — 기능 하나가 세 패키지에 흩어짐</text>
  <text x="30" y="440" class="foot">패키지 이름(domain, persistence, web)만으로는 어떤 유스케이스를 제공하는지 알 수 없음</text>
</svg>
