<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>HttpServletResponse에서 setStatus로 응답 코드를, setHeader와 setContentType, addCookie, sendRedirect로 헤더를, getWriter로 텍스트나 HTML, JSON 바디를 만들어 HTTP 응답 메시지를 구성한다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .m { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .mv { font-size: 12px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .gn { font-size: 12.5px; fill: #15803d; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="380" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">HttpServletResponse — 메서드로 응답 메시지를 만든다</text>
  <text x="30" y="66" class="step">HttpServletResponse 메서드</text>
  <text x="370" y="66" class="step">HTTP 응답 메시지</text>

  <rect x="30" y="76" width="290" height="60" rx="8" class="hold"/>
  <text x="44" y="111" class="mv">setStatus(HttpServletResponse.SC_OK)</text>
  <line x1="320" y1="106" x2="364" y2="106" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="370" y="76" width="360" height="60" rx="8" class="box"/>
  <text x="384" y="98" class="sub">상태 라인</text>
  <text x="384" y="122" class="val">HTTP 응답 코드 지정 (리다이렉트는 302)</text>

  <rect x="30" y="148" width="290" height="96" rx="8" class="hold"/>
  <text x="44" y="174" class="mv">setHeader() setContentType()</text>
  <text x="44" y="194" class="mv">setCharacterEncoding()</text>
  <text x="44" y="214" class="mv">addCookie() sendRedirect()</text>
  <text x="44" y="234" class="sub">편의 메서드</text>
  <line x1="320" y1="196" x2="364" y2="196" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="370" y="148" width="360" height="96" rx="8" class="box"/>
  <text x="384" y="170" class="sub">헤더</text>
  <text x="384" y="192" class="mv" style="font-size:11px">Content-Type: text/plain;charset=utf-8</text>
  <text x="384" y="211" class="mv" style="font-size:11px">Set-Cookie: myCookie=good; Max-Age=600</text>
  <text x="384" y="230" class="mv" style="font-size:11px">Location: /basic/hello-form.html</text>

  <rect x="30" y="256" width="290" height="104" rx="8" class="hold"/>
  <text x="44" y="300" class="mv">getWriter().write()</text>
  <text x="44" y="320" class="mv">getWriter().println()</text>
  <line x1="320" y1="308" x2="364" y2="308" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="370" y="256" width="360" height="104" rx="8" class="box"/>
  <text x="384" y="278" class="sub">바디</text>
  <text x="384" y="300" class="val">단순 텍스트: <tspan font-family="Menlo, Consolas, monospace" font-size="11">ok</tspan></text>
  <text x="384" y="322" class="val">HTML: <tspan font-family="Menlo, Consolas, monospace" font-size="11">&lt;html&gt;…&lt;/html&gt;</tspan></text>
  <text x="384" y="344" class="val">JSON: <tspan font-family="Menlo, Consolas, monospace" font-size="11">{"username":"kim","age":20}</tspan></text>
</svg>
