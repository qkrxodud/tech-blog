  <text x="38" y="96" class="t2" style="font-size:12.5px">승인 답 기록</text>
  <text x="38" y="113" class="s" style="font-size:9.5px"><tspan class="m">PaymentRecorder</tspan></text>
  <text x="38" y="128" class="s" style="font-size:9.5px"><tspan class="m">.recordApproval</tspan></text>
  <rect x="24" y="152" width="190" height="60" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="38" y="172" class="t2" style="font-size:12.5px">결과 모름 보정</text>
  <text x="38" y="189" class="s" style="font-size:9.5px"><tspan class="m">PaymentRecorder</tspan></text>
  <text x="38" y="204" class="s" style="font-size:9.5px"><tspan class="m">.recordInquiry</tspan></text>
  <rect x="24" y="228" width="190" height="60" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="38" y="248" class="t2" style="font-size:12.5px">취소 답 기록</text>
  <text x="38" y="265" class="s" style="font-size:9.5px"><tspan class="m">PaymentCancelRecorder</tspan></text>
  <text x="38" y="280" class="s" style="font-size:9.5px"><tspan class="m">.recordOutcome</tspan></text>
  <rect x="24" y="304" width="190" height="60" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="38" y="324" class="t2" style="font-size:12.5px">취소 보정</text>
  <text x="38" y="341" class="s" style="font-size:9.5px"><tspan class="m">PaymentCancelRecorder</tspan></text>
  <text x="38" y="356" class="s" style="font-size:9.5px"><tspan class="m">.recordInquiry</tspan></text>
  <rect x="24" y="380" width="190" height="60" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="38" y="400" class="t2" style="font-size:12.5px">알림 반영</text>
  <text x="38" y="417" class="s" style="font-size:9.5px"><tspan class="m">PaymentWebhookRecorder</tspan></text>
  <text x="38" y="432" class="s" style="font-size:9.5px"><tspan class="m">.follow</tspan></text>
