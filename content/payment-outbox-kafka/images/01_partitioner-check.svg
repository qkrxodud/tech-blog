  <text x="24" y="28" class="h">키 없이 보낼 때의 파티션 — 기본 파티셔너는 한 파티션에 붙음</text>
  <text x="24" y="48" class="gs">확인용 시험: 키 없이 300ms 간격으로 4건을 보내기를 세 번</text>
  <rect x="14" y="62" width="392" height="136" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><text x="30" y="86" class="t2">기본 파티셔너</text><text x="394" y="86" class="s2" text-anchor="end">키 없음</text><text x="30" y="117" class="s2">1회</text><rect x="70" y="100" width="30" height="24" rx="5" fill="#93c5fd" stroke="#1f2937" stroke-width="1.2"/><text x="85" y="117" class="t2" text-anchor="middle" style="font-size:12.5px">0</text><rect x="108" y="100" width="30" height="24" rx="5" fill="#93c5fd" stroke="#1f2937" stroke-width="1.2"/><text x="123" y="117" class="t2" text-anchor="middle" style="font-size:12.5px">0</text><rect x="146" y="100" width="30" height="24" rx="5" fill="#93c5fd" stroke="#1f2937" stroke-width="1.2"/><text x="161" y="117" class="t2" text-anchor="middle" style="font-size:12.5px">0</text><rect x="184" y="100" width="30" height="24" rx="5" fill="#93c5fd" stroke="#1f2937" stroke-width="1.2"/><text x="199" y="117" class="t2" text-anchor="middle" style="font-size:12.5px">0</text><text x="232" y="117" class="s2" style="font-family: Menlo, Consolas, monospace;font-size:11px">[0,0,0,0]</text><text x="30" y="149" class="s2">2회</text><rect x="70" y="132" width="30" height="24" rx="5" fill="#93c5fd" stroke="#1f2937" stroke-width="1.2"/><text x="85" y="149" class="t2" text-anchor="middle" style="font-size:12.5px">0</text><rect x="108" y="132" width="30" height="24" rx="5" fill="#93c5fd" stroke="#1f2937" stroke-width="1.2"/><text x="123" y="149" class="t2" text-anchor="middle" style="font-size:12.5px">0</text><rect x="146" y="132" width="30" height="24" rx="5" fill="#93c5fd" stroke="#1f2937" stroke-width="1.2"/><text x="161" y="149" class="t2" text-anchor="middle" style="font-size:12.5px">0</text><rect x="184" y="132" width="30" height="24" rx="5" fill="#93c5fd" stroke="#1f2937" stroke-width="1.2"/><text x="199" y="149" class="t2" text-anchor="middle" style="font-size:12.5px">0</text><text x="232" y="149" class="s2" style="font-family: Menlo, Consolas, monospace;font-size:11px">[0,0,0,0]</text><text x="30" y="181" class="s2">3회</text><rect x="70" y="164" width="30" height="24" rx="5" fill="#fdba74" stroke="#1f2937" stroke-width="1.2"/><text x="85" y="181" class="t2" text-anchor="middle" style="font-size:12.5px">1</text><rect x="108" y="164" width="30" height="24" rx="5" fill="#fdba74" stroke="#1f2937" stroke-width="1.2"/><text x="123" y="181" class="t2" text-anchor="middle" style="font-size:12.5px">1</text><rect x="146" y="164" width="30" height="24" rx="5" fill="#fdba74" stroke="#1f2937" stroke-width="1.2"/><text x="161" y="181" class="t2" text-anchor="middle" style="font-size:12.5px">1</text><rect x="184" y="164" width="30" height="24" rx="5" fill="#fdba74" stroke="#1f2937" stroke-width="1.2"/><text x="199" y="181" class="t2" text-anchor="middle" style="font-size:12.5px">1</text><text x="232" y="181" class="s2" style="font-family: Menlo, Consolas, monospace;font-size:11px">[1,1,1,1]</text><use href="#xs" x="320" y="144"/><text x="332" y="148" class="bads" style="font-weight:700">한 파티션</text>
  <text x="30" y="222" class="gs" style="font-size:10.5px">“If no partition or key is present, choose the sticky partition</text>
  <text x="30" y="237" class="gs" style="font-size:10.5px">that changes when at least batch.size bytes are produced to the partition.”</text>
  <text x="30" y="254" class="gs" style="font-size:11px">batch.size(16KB)를 채울 때까지 한 파티션에 붙음 — Kafka 4.2 문서</text>
