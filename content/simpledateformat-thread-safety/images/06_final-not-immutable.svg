<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 536" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>final 필드에 외부 리스트를 그대로 보관하면 list.add와 order.items().clear()가 Order 내부를 바꾸고, List.copyOf로 복사하면 원본과 끊기는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .tag { font-size: 12px; font-weight: 700; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="536" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="250" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">그대로 보관 — 외부 리스트가 Order 내부를 바꿈</text>
  <text x="730" y="42" class="code" text-anchor="end">this.items = items</text>
  <rect x="40" y="66" width="170" height="48" rx="8" class="box"/>
  <text x="125" y="86" class="op" text-anchor="middle">list</text>
  <text x="125" y="105" class="val" text-anchor="middle">호출한 쪽의 참조</text>
  <rect x="40" y="146" width="170" height="48" rx="8" class="box"/>
  <text x="125" y="166" class="op" text-anchor="middle">Order.items</text>
  <text x="125" y="185" class="val" text-anchor="middle">final 필드</text>
  <rect x="300" y="92" width="200" height="76" rx="8" class="bad"/>
  <text x="400" y="112" class="badt" text-anchor="middle">ArrayList 하나</text>
  <text x="400" y="131" class="val" text-anchor="middle">[A] → [A, B] → []</text>
  <line x1="211" y1="90" x2="298" y2="116" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="211" y1="170" x2="298" y2="146" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="560" y="66" width="170" height="48" rx="8" class="bad"/>
  <text x="645" y="86" class="badc" text-anchor="middle">list.add("B")</text>
  <text x="645" y="105" class="val" text-anchor="middle">Order 내부가 바뀜</text>
  <rect x="560" y="146" width="170" height="48" rx="8" class="bad"/>
  <text x="645" y="166" class="badc" text-anchor="middle">items().clear()</text>
  <text x="645" y="185" class="val" text-anchor="middle">이것도 바뀜</text>
  <line x1="558" y1="90" x2="502" y2="112" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <line x1="558" y1="170" x2="502" y2="150" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="30" y="230" class="sub">필드가 final이어도 list와 Order.items가 같은 ArrayList를 가리키므로 불변이 아닙니다 (얕은 불변).</text>
  <rect x="10" y="276" width="740" height="250" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="308" class="h">List.copyOf로 복사 — 원본과 끊김</text>
  <text x="730" y="308" class="code" text-anchor="end">List.copyOf(items)</text>
  <rect x="40" y="332" width="170" height="48" rx="8" class="box"/>
  <text x="125" y="352" class="op" text-anchor="middle">list</text>
  <text x="125" y="371" class="val" text-anchor="middle">호출한 쪽의 참조</text>
  <rect x="40" y="412" width="170" height="48" rx="8" class="box"/>
  <text x="125" y="432" class="op" text-anchor="middle">Order.items</text>
  <text x="125" y="451" class="val" text-anchor="middle">final 필드</text>
  <rect x="300" y="332" width="200" height="48" rx="8" class="box"/>
  <text x="400" y="352" class="t" text-anchor="middle">원본 ArrayList</text>
  <text x="400" y="371" class="val" text-anchor="middle">[A] → [A, B]</text>
  <rect x="300" y="412" width="200" height="48" rx="8" class="ok"/>
  <text x="400" y="432" class="okt" text-anchor="middle">불변 리스트 (복사본)</text>
  <text x="400" y="451" class="val" text-anchor="middle">[A] 그대로</text>
  <line x1="211" y1="356" x2="298" y2="356" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="211" y1="436" x2="298" y2="436" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="400" y1="381" x2="400" y2="410" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="410" y="400" class="gnote">생성 시점에 복사</text>
  <rect x="560" y="332" width="170" height="48" rx="8" class="box"/>
  <text x="645" y="352" class="op" text-anchor="middle">list.add("B")</text>
  <text x="645" y="371" class="val" text-anchor="middle">원본만 바뀜</text>
  <rect x="560" y="412" width="170" height="48" rx="8" class="ok"/>
  <text x="645" y="432" class="okc" text-anchor="middle">items()</text>
  <text x="645" y="451" class="val" text-anchor="middle">그대로 반환해도 안전</text>
  <line x1="558" y1="356" x2="502" y2="356" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="30" y="496" class="sub">들어올 때 List.copyOf로 끊어 두면, 원본 list를 바꿔도 Order에는 영향이 없습니다.</text>

</svg>
