  <rect width="760" height="604" fill="#ffffff"/>
  <text x="24" y="28" class="h">결정 2 — Saga 진행을 누가 쥘까</text>
  <text x="24" y="48" class="gs" style="font-size:11.5px">두 방식 모두 예약은 결제 서버가 동기 HTTP로 보냄 — 갈리는 것은 확정·해제를 누가 정하는가</text>
  <rect x="14" y="62" width="360" height="46" rx="10" fill="#f9fafb" stroke="#16a34a" stroke-width="3"/>
  <text x="28" y="82" class="t2">① 오케스트레이션</text>
  <text x="28" y="100" class="oks" style="font-size:11.5px;font-weight:700">이 장에서 고름 · 운영</text>
  <rect x="24" y="122" width="340" height="40" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/><text x="194" y="138.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">결제 상태 전이 — 기록 다섯 곳</text><text x="194" y="153.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">승인 답 · 결과 모름 보정 · 취소 답 · 취소 보정 · 알림 반영</text>
