    <g id="i-lock"><path d="M7,12 V8 a7,7 0 0 1 14,0 V12" fill="none" class="o" stroke-width="2.2"/><rect x="3" y="12" width="22" height="16" rx="3" fill="#fbbf24" class="o"/><circle cx="14" cy="20" r="2.4" fill="#1f2937"/></g>
    <g id="i-wait"><path d="M3,1 H23 M3,29 H23" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><path d="M5,2 C5,10 13,12 13,15 C13,18 5,20 5,28 H21 C21,20 13,18 13,15 C13,12 21,10 21,2 Z" fill="#e0e7ff" class="o"/><path d="M8,26 C9,22 13,21 13,19 C13,21 17,22 18,26 Z" fill="#f59e0b"/></g>
    <g id="i-box"><path d="M2,9 L15,3 L28,9 V23 L15,29 L2,23 Z" fill="#fcd34d" class="o"/><path d="M2,9 L15,15 L28,9 M15,15 V29" fill="none" class="o"/><path d="M8.5,6 L21.5,12" stroke="#b45309" stroke-width="1.5"/></g>
    <g id="i-ticket"><path d="M1,6 H29 V12 a3,3 0 0 0 0,6 V24 H1 V18 a3,3 0 0 0 0,-6 Z" fill="#f9a8d4" class="o"/><path d="M10,7 V23" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="2 2"/><text x="19.5" y="19" font-size="9" font-weight="700" fill="#831843" text-anchor="middle">%</text></g>
    <g id="i-point"><circle cx="13" cy="13" r="12" fill="#a7f3d0" class="o"/><circle cx="13" cy="13" r="8" fill="#6ee7b7" stroke="#047857" stroke-width="1"/><text x="13" y="17.5" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">P</text></g>
  </defs>

  <rect width="760" height="520" fill="#ffffff"/>
  <text x="24" y="28" class="h">결정 3 — 같은 상품에 몰린 주문의 재고를 어떻게 줄일까</text>
  <text x="24" y="48" class="s2">같은 입력: 재고 1개에 주문 A·B — A가 재고를 바꾸고 인증 UPDATE에서 1초 붙잡힌 동안 B의 승인을 보냄</text>
  <text x="274" y="74" class="t2" text-anchor="middle" style="fill:#4b5563">A — 먼저 보낸 주문</text>
  <text x="487" y="74" class="t2" text-anchor="middle" style="fill:#4b5563">B — 나중 주문</text>
  <text x="673" y="74" class="t2" text-anchor="middle" style="fill:#4b5563">B의 답 · 계약 6개</text>
  <rect x="16" y="84" width="150" height="78" rx="10" fill="#e3f3e6" stroke="#16a34a" stroke-width="2.5"/>
  <text x="28" y="114" class="t2">조건부 UPDATE</text>
  <text x="28" y="134" class="oks" style="font-weight:700">이 장에서 고름</text>
  <rect x="176" y="84" width="196" height="78" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.3"/>
  <text x="190" y="108" class="s2" style="fill:#1f2937;font-weight:700"><tspan class="m">update … quantity &gt;= 1</tspan></text>
  <text x="190" y="127" class="s2" style="fill:#1f2937">1줄 바뀜 · 재고 줄 잠금을</text>
  <text x="190" y="146" class="s2" style="fill:#1f2937">쥔 채 붙잡힘</text>
  <line x1="374" y1="123" x2="377" y2="123" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="380" y="84" width="214" height="78" rx="10" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.3"/>
  <use href="#i-wait" transform="translate(568,92) scale(0.6)"/>
  <text x="394" y="108" class="s2" style="fill:#1f2937;font-weight:700">같은 문장이 A 커밋까지 기다림</text>
  <text x="394" y="127" class="s2" style="fill:#1f2937">A가 줄인 0으로 조건을 봄</text>
  <text x="394" y="146" class="s2" style="fill:#1f2937">→ 0줄</text>
  <line x1="596" y1="123" x2="599" y2="123" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="602" y="84" width="142" height="78" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.3"/>
  <use href="#vmark" x="622" y="114"/>
  <text x="638" y="119" class="okt" style="font-size:12px"><tspan class="m">OUT_OF_STOCK</tspan></text>
  <text x="616" y="144" class="oks">실패 0개 · 문장 1개</text>
  <rect x="16" y="172" width="150" height="78" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="28" y="202" class="t2" style="font-size:10.5px"><tspan class="m">select … for update</tspan></text>
  <text x="28" y="222" class="s2">비교</text>
  <rect x="176" y="172" width="196" height="78" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.3"/>
  <text x="190" y="196" class="s2" style="fill:#1f2937;font-weight:700"><tspan class="m">for update</tspan>로 1을 읽고</text>
  <text x="190" y="215" class="s2" style="fill:#1f2937"><tspan class="m">update … quantity - 1</tspan></text>
  <text x="190" y="234" class="s2" style="fill:#1f2937">잠금을 쥔 채 붙잡힘</text>
  <line x1="374" y1="211" x2="377" y2="211" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="380" y="172" width="214" height="78" rx="10" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.3"/>
  <use href="#i-wait" transform="translate(568,180) scale(0.6)"/>
  <text x="394" y="196" class="s2" style="fill:#1f2937;font-weight:700"><tspan class="m">for update</tspan>에서 기다림</text>
  <text x="394" y="215" class="s2" style="fill:#1f2937">A 커밋 뒤 0을 읽음</text>
  <text x="394" y="234" class="s2" style="fill:#1f2937">→ 줄이지 않음</text>
  <line x1="596" y1="211" x2="599" y2="211" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="602" y="172" width="142" height="78" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.3"/>
  <use href="#vmark" x="622" y="202"/>
  <text x="638" y="207" class="okt" style="font-size:12px"><tspan class="m">OUT_OF_STOCK</tspan></text>
  <text x="616" y="232" class="oks">실패 0개 · 문장 2개</text>
  <rect x="16" y="260" width="150" height="78" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="28" y="290" class="t2">변경 번호 + 다시 시도</text>
  <text x="28" y="310" class="s2">비교 · 최대 30번</text>
  <rect x="176" y="260" width="196" height="78" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.3"/>
  <text x="190" y="284" class="s2" style="fill:#1f2937;font-weight:700">version 0으로 읽고</text>
  <text x="190" y="303" class="s2" style="fill:#1f2937"><tspan class="m">… where version = 0</tspan></text>
  <text x="190" y="322" class="s2" style="fill:#1f2937">1줄 · 번호를 올림</text>
  <line x1="374" y1="299" x2="377" y2="299" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="380" y="260" width="214" height="78" rx="10" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.3"/>
  <use href="#i-wait" transform="translate(568,268) scale(0.6)"/>
  <text x="394" y="284" class="s2" style="fill:#1f2937;font-weight:700">A 커밋 뒤 <tspan class="m">version = 0</tspan>이 0줄</text>
  <text x="394" y="303" class="s2" style="fill:#1f2937">인증 트랜잭션을 처음부터</text>
  <text x="394" y="322" class="s2" style="fill:#1f2937">다시 읽으면 0</text>
  <line x1="596" y1="299" x2="599" y2="299" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="602" y="260" width="142" height="78" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.3"/>
  <use href="#vmark" x="622" y="290"/>
  <text x="638" y="295" class="okt" style="font-size:12px"><tspan class="m">OUT_OF_STOCK</tspan></text>
  <text x="616" y="320" class="oks">실패 0개 · 다시 시도</text>
  <rect x="16" y="348" width="150" height="78" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="28" y="378" class="t2">잠그지 않음</text>
  <text x="28" y="398" class="s2">결정 2까지</text>
  <rect x="176" y="348" width="196" height="78" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.3"/>
  <text x="190" y="372" class="s2" style="fill:#1f2937;font-weight:700">잠그지 않고 1을 읽음</text>
  <text x="190" y="391" class="s2" style="fill:#1f2937">0을 씀</text>
  <text x="190" y="410" class="s2" style="fill:#1f2937"></text>
  <line x1="374" y1="387" x2="377" y2="387" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="380" y="348" width="214" height="78" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.3"/>
  <text x="394" y="372" class="s2" style="fill:#1f2937;font-weight:700">잠그지 않고 1을 읽음</text>
  <text x="394" y="391" class="s2" style="fill:#1f2937">0을 씀</text>
  <text x="394" y="410" class="s2" style="fill:#1f2937"></text>
  <line x1="596" y1="387" x2="599" y2="387" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="602" y="348" width="142" height="78" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.3"/>
  <use href="#xmark" x="622" y="378"/>
  <text x="638" y="383" class="badt" style="font-size:12px">둘 다 승인</text>
  <text x="616" y="408" class="bads">실패 5개 · PG 승인 2</text>
  <line x1="12" y1="438" x2="748" y2="438" stroke="#9ca3af" stroke-width="1"/>
  <use href="#i-lock" transform="translate(22,446) scale(0.72)"/>
  <text x="46" y="462" class="s2" style="fill:#1f2937">조건부 UPDATE와 <tspan class="m">for update</tspan>는 모두 바꾼 재고 줄의 잠금을 인증 트랜잭션이 끝날 때까지 쥠 — 코드에서 본 차이는 문장 수</text>
  <text x="46" y="482" class="s2">변경 번호: REPEATABLE READ라 같은 트랜잭션에서 다시 읽으면 첫 스냅숏을 봐서, 트랜잭션을 처음부터 다시 함</text>
  <text x="46" y="502" class="gs">조건부 UPDATE의 B가 A 커밋 값으로 조건을 본 것은 실행으로 확인(5번 반복 같음), MySQL 문서로는 확인하지 않음</text>

</svg>
