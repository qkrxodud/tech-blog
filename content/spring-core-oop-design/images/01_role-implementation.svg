<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 428" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>운전자는 자동차 역할만 알고 구현 A, B, C 중 무엇이 와도 운전할 수 있고, 로미오 역할은 장동건과 원빈 누구나 맡을 수 있으며 줄리엣 역할을 누가 맡는지 몰라도 되는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .lanec { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .gmsg { font-size: 12px; fill: #15803d; }
    .rmsg { font-size: 12px; fill: #b91c1c; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 12px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .rm { font-size: 12px; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="760" height="428" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="200" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">운전자와 자동차 — 역할만 알면 구현이 바뀌어도 운전할 수 있음</text>
  <rect x="30" y="90" width="140" height="60" rx="8" class="box"/>
  <text x="100" y="116.0" class="t" text-anchor="middle">운전자</text>
  <text x="100" y="134.0" class="s" text-anchor="middle">클라이언트</text>
  <rect x="290" y="90" width="180" height="60" rx="8" class="hold"/>
  <text x="380" y="116.0" class="t" text-anchor="middle">자동차 역할</text>
  <text x="380" y="134.0" class="s" text-anchor="middle">인터페이스</text>
  <rect x="560" y="70" width="170" height="36" rx="8" class="box"/>
  <text x="645" y="93.0" class="ts" text-anchor="middle">자동차 구현 A</text>
  <line x1="558" y1="88" x2="473" y2="105" stroke="#6b7280" stroke-width="1.6" marker-end="url(#tri)"/>
  <rect x="560" y="112" width="170" height="36" rx="8" class="box"/>
  <text x="645" y="135.0" class="ts" text-anchor="middle">자동차 구현 B</text>
  <line x1="558" y1="130" x2="473" y2="120" stroke="#6b7280" stroke-width="1.6" marker-end="url(#tri)"/>
  <rect x="560" y="154" width="170" height="36" rx="8" class="box"/>
  <text x="645" y="177.0" class="ts" text-anchor="middle">자동차 구현 C</text>
  <line x1="558" y1="172" x2="473" y2="135" stroke="#6b7280" stroke-width="1.6" marker-end="url(#tri)"/>
  <text x="231" y="111" class="s" text-anchor="middle">역할만 앎</text>
  <line x1="172" y1="120" x2="287" y2="120" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="10" y="226" width="740" height="192" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="258" class="h">로미오와 줄리엣 — 배역은 누가 맡아도 공연할 수 있음</text>
  <rect x="200" y="284" width="170" height="56" rx="8" class="hold"/>
  <text x="285" y="308.0" class="t" text-anchor="middle">로미오 역할</text>
  <text x="285" y="326.0" class="s" text-anchor="middle">인터페이스</text>
  <rect x="470" y="284" width="170" height="56" rx="8" class="hold"/>
  <text x="555" y="308.0" class="t" text-anchor="middle">줄리엣 역할</text>
  <text x="555" y="326.0" class="s" text-anchor="middle">인터페이스</text>
  <line x1="372" y1="312" x2="467" y2="312" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="420" y="303" class="s" text-anchor="middle">협력</text>
  <rect x="150" y="370" width="110" height="36" rx="8" class="box"/>
  <text x="205" y="393.0" class="ts" text-anchor="middle">장동건</text>
  <rect x="290" y="370" width="110" height="36" rx="8" class="box"/>
  <text x="345" y="393.0" class="ts" text-anchor="middle">원빈</text>
  <line x1="205" y1="368" x2="265" y2="343" stroke="#6b7280" stroke-width="1.6" marker-end="url(#tri)"/>
  <line x1="345" y1="368" x2="305" y2="343" stroke="#6b7280" stroke-width="1.6" marker-end="url(#tri)"/>
  <rect x="470" y="370" width="170" height="36" rx="8" class="wait"/>
  <text x="555" y="393" class="waitt" text-anchor="middle">누가 맡는지 몰라도 됨</text>
  <line x1="555" y1="368" x2="555" y2="343" stroke="#6b7280" stroke-width="1.6" marker-end="url(#tri)"/>
</svg>
