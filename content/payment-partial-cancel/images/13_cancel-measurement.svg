<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>같은 취소 묶음 12건(고객이 뜻한 PG 취소 14건)으로 잰 결과 — PG가 받은 취소 요청과 실제 취소는 운영 구현 16건과 14건, 비교 A 14건과 12건, 비교 B 18건과 18건, 비교 C 16건과 14건, 비교 D 16건과 16건이고, 더 취소된 결제는 B 4건과 D 2건, 덜 취소된 결제는 A 2건, 우리 남은 금액과 PG 잔액이 다른 결제는 C 4건과 D 2건이며 나머지는 0건이다. 비교 B는 우리 기록과 PG 잔액이 함께 줄어 잔액 비교로는 드러나지 않는다</title>
