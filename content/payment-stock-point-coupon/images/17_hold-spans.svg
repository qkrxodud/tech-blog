<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 2의 잡는 때 비교 — 재고·쿠폰·포인트를 쥐는 구간. 비교 구현(준비 때·승인 뒤 잡기)은 잡는 때만 재고 돌려주지는 않고(DeferredHoldings), 운영인 인증 때 잡기는 돌려줄 때까지 쥠. 준비 때 잡기는 준비부터 쥐어 승인까지 가지 않은 준비도 재고를 잡고 있어 풀어 줄 작업이 함께 있어야 하고 이 장에는 그런 작업이 없음, 준비한 주문에 재고를 먼저 보장해야 하는 판매에 맞음. 인증 때 잡기(이 장)는 승인 요청 직전부터 쥐어 PG 답을 기다리는 동안 묶이고 결과 모름이면 보정이 닫을 때까지 묶임(운영 설정:  승인을 요청한 지 1분이 지난 결제를 1분마다 보정), 승인해 놓고 재고가 없는 결제를 만들지 않음. 승인 뒤 잡기는 승인 확인이 끝난 뒤 별도 트랜잭션에서 잡아 PG 답을 기다리는 동안 묶지 않지만 모자라면 승인을 전액 취소해 카드에 승인과 취소가 남음, 재고가 모자라는 일이 드물고 승인과 취소가 함께 남아도 괜찮을 때 맞음</title>
