  <text x="650" y="354" class="s2" text-anchor="middle" style="font-size:10px">커밋한 자리</text>
  <text x="734" y="354" class="s2" text-anchor="end" style="font-size:10px">끝</text>
  <text x="552" y="376" class="gs" style="font-size:10px">11장 다시 넣기 명령이 한 건마다</text><text x="552" y="394" class="gs" style="font-size:10px">그 그룹에 커밋 → 다시 넣은 것은 빠짐</text><text x="552" y="412" class="gs" style="font-size:10px">커밋이 없으면 토픽 처음부터 셈</text><text x="552" y="430" class="gs" style="font-size:10px">브로커가 답하지 않으면 값 없음</text>
  <text x="24" y="556" class="gs" style="font-size:10.5px">시험은 각 서비스 컨텍스트의 <tspan class="m">MeterRegistry</tspan>에서 읽음 · 지표를 읽을 때마다 DB 집계 한 문장이나 브로커 조회가 생김</text>
  <text x="24" y="576" class="gs" style="font-size:10.5px">Micrometer 문서: “A gauge is a handle to get the current value.”</text>
</svg>
