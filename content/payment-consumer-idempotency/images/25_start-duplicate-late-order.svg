  <line x1="216" y1="220" x2="282" y2="220" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="284" y="204" width="200" height="32" rx="6" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="296" y="225" class="bads" style="font-size:11px">2줄 — 기대 1</text>
  <line x1="486" y1="220" x2="524" y2="220" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="526" y="204" width="220" height="32" rx="6" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
