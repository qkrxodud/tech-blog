  <text x="100" y="149" class="bads" style="font-size:11.5px">"부분 취소는 5장에서 다룹니다"</text>
  <rect x="38" y="170" width="312" height="50" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <rect x="38" y="170" width="52" height="50" rx="8" fill="#fca5a5" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="64" y="200" class="badt" text-anchor="middle" style="font-size:12px">3장</text>
  <text x="100" y="191" class="bads" style="font-size:11.5px">결제 하나에 취소가 여러 번 있는</text>
  <text x="100" y="209" class="bads" style="font-size:11.5px">부분 취소에서 같은 요청 가리기</text>
  <rect x="38" y="230" width="312" height="50" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <rect x="38" y="230" width="52" height="50" rx="8" fill="#fca5a5" stroke="#e08a8a" stroke-width="1.5"/>
