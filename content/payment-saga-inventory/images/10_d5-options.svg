  <rect width="760" height="520" fill="#ffffff"/>
  <text x="24" y="28" class="h">결정 5 — 확정과 해제를 어떻게 보낼까</text>
  <text x="24" y="48" class="gs" style="font-size:11.5px">같은 장면: 재고 서비스가 멈춘 동안(중계 끊음 + 리스너 멈춤) 카드사가 승인을 거절한 결제 · 처음 재고 5, 주문 수량 2</text>
  <rect x="14" y="62" width="360" height="46" rx="10" fill="#f9fafb" stroke="#16a34a" stroke-width="3"/>
  <text x="28" y="82" class="t2">① 상태 전이 트랜잭션에서 <tspan class="m">payment_outbox</tspan></text>
  <text x="28" y="100" class="oks" style="font-size:11.5px;font-weight:700">이 장에서 고름 · 운영</text>
  <rect x="24" y="122" width="340" height="40" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/><text x="194" y="138.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">거절 답 기록 트랜잭션</text><text x="194" y="153.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">결제 상태 + <tspan class="m">STOCK_RELEASE</tspan> 줄을 함께 커밋</text>
  <line x1="194" y1="163" x2="194" y2="173" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="24" y="174" width="340" height="40" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/><text x="194" y="190.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">릴레이가 <tspan class="m">stock-reservation-commands</tspan>로 보냄</text><text x="194" y="205.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">브로커는 받음 — 보낸 때를 남김</text>
  <line x1="194" y1="215" x2="194" y2="225" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="24" y="226" width="340" height="40" rx="8" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/><text x="194" y="242.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">재고 서비스 멈춤 — 리스너가 읽지 않음</text><text x="194" y="257.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">명령은 토픽에 남아 있음</text>
  <line x1="194" y1="267" x2="194" y2="277" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="24" y="278" width="340" height="40" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/><text x="194" y="294.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">재고 서비스가 돌아오면</text><text x="194" y="309.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">읽던 자리부터 다시 읽음</text>
  <line x1="194" y1="319" x2="194" y2="329" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="24" y="330" width="340" height="40" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/><text x="194" y="354" class="s2" text-anchor="middle" style="fill:#15803d;font-weight:700;font-size:11px">예약 해제 → 재고 5</text>
  <use href="#vmark" x="360" y="346"/>
  <rect x="388" y="62" width="360" height="46" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="402" y="82" class="t2">② 상태를 바꾼 자리에서 바로 HTTP</text>
  <text x="402" y="100" class="gs" style="font-size:11.5px">비교 · <tspan class="m">DirectHttpHoldings</tspan></text>
  <rect x="398" y="122" width="340" height="40" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/><text x="568" y="138.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">거절 답 기록 트랜잭션 안에서</text><text x="568" y="153.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">재고 서비스에 HTTP로 해제 — 결제 줄을 잠근 채</text>
  <line x1="568" y1="163" x2="568" y2="173" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="398" y="174" width="340" height="40" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/><text x="568" y="198" class="s2" text-anchor="middle" style="fill:#b91c1c;font-weight:700;font-size:11px">재고 서비스 멈춤 — 연결 실패</text>
  <line x1="568" y1="215" x2="568" y2="225" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="398" y="226" width="340" height="40" rx="8" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/><text x="568" y="242.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">로그만 남김</text><text x="568" y="257.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">다시 보낼 것이 남지 않음</text>
  <line x1="568" y1="267" x2="568" y2="277" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="398" y="278" width="340" height="40" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/><text x="568" y="294.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">재고 서비스가 돌아와도</text><text x="568" y="309.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">받을 명령이 없음</text>
  <line x1="568" y1="319" x2="568" y2="329" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="398" y="330" width="340" height="40" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/><text x="568" y="354" class="s2" text-anchor="middle" style="fill:#b91c1c;font-weight:700;font-size:11px">재고 3 — 처음으로 돌아오지 않음</text>
  <use href="#xmark" x="734" y="346"/>
  <line x1="12" y1="404" x2="748" y2="404" stroke="#9ca3af" stroke-width="1"/>
  <text x="26" y="428" class="s" style="font-weight:700;fill:#1f2937">계약 21개 중 실패</text>
  <text x="220" y="428" class="oks" style="font-weight:700">0</text>
  <text x="398" y="428" class="bads" style="font-weight:700">1(멈춘 동안 해제 유실)</text>
  <text x="26" y="452" class="s" style="font-weight:700;fill:#1f2937">측정 어긋난 재고(6번)</text>
  <text x="220" y="452" class="oks" style="font-weight:700">0</text>
  <text x="398" y="452" class="bads" style="font-weight:700">−5(멈춘 동안 취소한 5건)</text>
  <text x="26" y="476" class="s" style="font-weight:700;fill:#1f2937">재고 서비스 늦음 응답 중앙</text>
  <text x="220" y="476" class="oks" style="font-weight:700">1027~1038ms</text>
  <text x="398" y="476" class="bads" style="font-weight:700">2042~2045ms(예약 1s + 해제 HTTP 1s)</text>
  <text x="26" y="506" class="os" style="font-size:11.5px">운영의 비용 — 원복 시간(요청을 보낸 때부터 해제까지) 25건 중앙 302~626ms, p95 1321~1553ms</text>
</svg>
