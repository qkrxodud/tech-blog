  <line x1="318" y1="224" x2="318" y2="236" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <line x1="318" y1="286" x2="318" y2="298" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <line x1="318" y1="348" x2="318" y2="360" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
