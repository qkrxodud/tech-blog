<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>반복 실행으로 흔들리는지 본 것 — 10장 기본 테스트 42개를 5번 돌려 5번 모두 통과했고, 10장 known-failing 비교 105개를 3번 돌려 16·16·18개가 실패함. 겹침을 고정한 계약은 3번 모두 같았고 달라진 것은 겹침을 고정하지 않은 몰림 계약(서버 두 대·300건) 하나로, 실패로만과 수량만이 세 번째 실행에서만 실패했으며 0.5초를 넘긴 예약이 몇 건 나느냐에 달림. 측정 커밋에서 기본 시험의 측정 제외를 빠뜨려 한 번은 ./gradlew clean check가 측정까지 돌아 18분 28초가 걸리고 같은 실행에서 8장 되돌리기 계약 11개 중 10개가 5초 대기를 넘겨 실패했으며, 측정을 뺀 뒤 다시 돌린 결과를 기록했고 두 일이 이어진 원인은 더 좁히지 않음</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
