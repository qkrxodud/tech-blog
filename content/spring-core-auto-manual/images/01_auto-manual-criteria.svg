<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>업무 로직은 자동 등록을 기본으로 하고 다형성을 활용하면 수동 등록이나 패키지 묶기, 기술 지원 로직은 스프링 부트가 자동 등록하면 의도대로 사용하고 아니면 수동 등록하는 판단 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 12px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .msg { font-size: 11.5px; fill: #374151; }
    .hd { font-size: 10.5px; fill: #374151; }
    .gmsg { font-size: 11.5px; fill: #15803d; }
    .rmsg { font-size: 11.5px; fill: #b91c1c; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .pkg { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .life { stroke: #c4c8ce; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .act { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.2; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6b7280" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect width="760" height="410" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="390" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">자동 등록과 수동 등록 — 업무 로직과 기술 지원 로직으로 나눔</text>

  <rect x="250" y="60" width="260" height="40" rx="8" class="box"/>
  <text x="380" y="85" class="t" text-anchor="middle">스프링 빈으로 등록할 객체</text>
  <path d="M380,100 L380,112 L195,112 L195,128" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
  <path d="M380,112 L565,112 L565,128" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>

  <rect x="30" y="130" width="330" height="56" rx="8" class="box"/>
  <text x="195" y="153" class="t" text-anchor="middle">업무 로직 빈</text>
  <text x="195" y="174" class="s" text-anchor="middle">컨트롤러, 서비스, 리포지토리</text>
  <rect x="400" y="130" width="330" height="56" rx="8" class="box"/>
  <text x="565" y="153" class="t" text-anchor="middle">기술 지원 빈</text>
  <text x="565" y="174" class="s" text-anchor="middle">데이터베이스 연결, 공통 로그 처리(AOP)</text>

  <line x1="195" y1="186" x2="195" y2="206" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
  <line x1="565" y1="186" x2="565" y2="206" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>

  <rect x="45" y="208" width="300" height="42" rx="21" class="hold"/>
  <text x="195" y="234" class="ts" text-anchor="middle">다형성을 적극 활용하는가?</text>
  <rect x="415" y="208" width="300" height="42" rx="21" class="hold"/>
  <text x="565" y="234" class="ts" text-anchor="middle">스프링·스프링 부트가 자동 등록하는가?</text>

  <path d="M140,250 L140,262 L108,262 L108,286" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
  <path d="M250,250 L250,262 L283,262 L283,286" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="96" y="278" class="s" text-anchor="end">아니오</text>
  <text x="295" y="278" class="s">예</text>
  <path d="M510,250 L510,262 L478,262 L478,286" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
  <path d="M620,250 L620,262 L653,262 L653,286" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="466" y="278" class="s" text-anchor="end">예</text>
  <text x="665" y="278" class="s">아니오</text>

  <rect x="30" y="288" width="156" height="64" rx="8" class="ok"/>
  <text x="108" y="313" class="okt" text-anchor="middle">자동 등록</text>
  <text x="108" y="334" class="s" text-anchor="middle">컴포넌트 스캔</text>
  <rect x="204" y="288" width="156" height="64" rx="8" class="ok"/>
  <text x="282" y="313" class="okt" text-anchor="middle">수동 등록</text>
  <text x="282" y="334" class="s" text-anchor="middle">또는 특정 패키지에 묶기</text>
  <rect x="400" y="288" width="156" height="64" rx="8" class="ok"/>
  <text x="478" y="313" class="okt" text-anchor="middle">의도대로 사용</text>
  <text x="478" y="334" class="s" text-anchor="middle">매뉴얼 참고</text>
  <rect x="574" y="288" width="156" height="64" rx="8" class="ok"/>
  <text x="652" y="313" class="okt" text-anchor="middle">수동 등록</text>
  <text x="652" y="334" class="s" text-anchor="middle">설정 정보에 드러내기</text>

  <text x="30" y="382" class="foot">예: DataSource는 스프링 부트가 자동 등록하고, 직접 스프링 빈으로 등록하는 기술 지원 객체는 수동으로 등록합니다.</text>
</svg>
