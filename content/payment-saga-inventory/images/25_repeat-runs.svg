  <text x="24" y="140" class="t2" style="font-size:12.5px">비교 105개</text>
  <rect x="130" y="116" width="188" height="96" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="144" y="142" class="badt" style="font-size:12px">1번째 실행</text>
  <text x="144" y="178" class="badt" style="font-size:26px">16</text>
  <text x="182" y="178" class="bads" style="font-size:12px">개 실패</text>
  <text x="144" y="200" class="bads" style="font-size:10.5px">겹침을 고정한 계약은 같음</text>
  <rect x="330" y="116" width="188" height="96" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="344" y="142" class="badt" style="font-size:12px">2번째 실행</text>
  <text x="344" y="178" class="badt" style="font-size:26px">16</text>
  <text x="382" y="178" class="bads" style="font-size:12px">개 실패</text>
  <text x="344" y="200" class="bads" style="font-size:10.5px">겹침을 고정한 계약은 같음</text>
  <rect x="530" y="116" width="188" height="96" rx="10" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <text x="544" y="142" class="ot" style="font-size:12px">3번째 실행</text>
  <text x="544" y="178" class="ot" style="font-size:26px">18</text>
  <text x="582" y="178" class="os" style="font-size:12px">개 실패</text>
  <text x="544" y="200" class="os" style="font-size:10.5px">몰림: 실패로만 +1 · 수량만 +1</text>
  <text x="24" y="236" class="gs" style="font-size:11px">16 + 2 = 18 — 세 번째 실행에서만 실패로만과 수량만의 몰림 계약이 실패</text>
  <rect x="24" y="256" width="712" height="124" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <use href="#i-warn" transform="translate(38,270) scale(0.9)"/>
  <text x="74" y="284" class="gt" style="font-size:12.5px">측정 제외를 빠뜨린 한 번 — 기록에서 뺀 실행</text>
  <text x="38" y="314" class="gs" style="font-size:11px">측정 커밋에서 기본 시험의 측정 제외를 빠뜨려 <tspan class="m">./gradlew clean check</tspan>가 측정까지 돌아 18분 28초</text>
  <text x="38" y="334" class="gs" style="font-size:11px">같은 실행에서 8장 되돌리기 계약 11개 중 10개가 5초 대기를 넘겨 실패</text>
  <text x="38" y="358" class="gs" style="font-size:11px">측정을 뺀 뒤 다시 돌린 결과가 위 기록 · 두 일이 이어진 원인은 더 좁히지 않음</text>
