  <rect width="760" height="528" fill="#ffffff"/>
  <text x="24" y="28" class="h">결정 4 — 다시 시도를 다 쓴 메시지를 어디에 모을까</text>
  <text x="24" y="48" class="gs" style="font-size:11.5px">두 경우 · 같은 계약 12개와 30초 장애 측정(주문 서비스)</text>
  <rect x="170" y="62" width="186" height="48" rx="10" fill="#f9fafb" stroke="#16a34a" stroke-width="3"/>
  <text x="182" y="82" class="t2" style="font-size:12px">&lt;토픽&gt;<tspan class="m">.DLT</tspan> + 다시 넣기</text>
  <text x="182" y="100" class="oks" style="font-size:10.5px;font-weight:700">이 장에서 고름 · 운영</text>
  <rect x="362" y="62" width="186" height="48" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="374" y="82" class="t2" style="font-size:12px">로그만</text>
  <text x="374" y="100" class="gs" style="font-size:10.5px">결정 3까지의 운영</text>
  <rect x="554" y="62" width="186" height="48" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="566" y="82" class="t2" style="font-size:12px">DB 실패 표</text>
  <text x="566" y="100" class="gs" style="font-size:10.5px">받는 쪽 자기 DB · <tspan class="m">failed_message</tspan></text>
  <rect x="14" y="122" width="150" height="94" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="26" y="148" class="t2" style="font-size:12.5px">영구 오류</text>
  <text x="26" y="170" class="gs" style="font-size:10.5px">모르는 상태</text><text x="26" y="186" class="gs" style="font-size:10.5px">읽을 수 없는 본문</text>
  <rect x="170" y="122" width="186" height="94" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="190" y="144"/>
  <text x="206" y="149" class="oks" style="font-size:11px">다시 시도 없이 실패 모음</text><text x="206" y="166" class="oks" style="font-size:11px">원인 머리 <tspan class="m">kafka_dlt-*</tspan></text>
  <rect x="362" y="122" width="186" height="94" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="382" y="144"/>
  <text x="398" y="149" class="bads" style="font-size:11px">ERROR 로그만 남고</text><text x="398" y="166" class="bads" style="font-size:11px">메시지가 사라짐</text>
  <rect x="554" y="122" width="186" height="94" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="574" y="144"/>
  <text x="590" y="149" class="oks" style="font-size:11px"><tspan class="m">failed_message</tspan>에 남음</text>
  <rect x="14" y="226" width="150" height="94" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="26" y="252" class="t2" style="font-size:12.5px">저장소 장애로</text>
  <text x="26" y="274" class="gs" style="font-size:10.5px">다시 시도를 다 씀</text>
  <rect x="170" y="226" width="186" height="94" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="190" y="248"/>
  <text x="206" y="253" class="oks" style="font-size:11px">실패 모음에 실린 뒤 넘어감</text><text x="206" y="270" class="oks" style="font-size:11px">다시 넣으면 결정 1·2대로</text>
  <rect x="362" y="226" width="186" height="94" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="382" y="248"/>
  <text x="398" y="253" class="bads" style="font-size:11px">ERROR 로그만 남고</text><text x="398" y="270" class="bads" style="font-size:11px">메시지가 사라짐</text>
  <rect x="554" y="226" width="186" height="94" rx="10" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <use href="#xmark" x="574" y="248"/>
  <text x="590" y="253" class="os" style="font-size:11px">저장소가 막혀 실패 표에도</text><text x="590" y="270" class="os" style="font-size:11px">못 남김 → 넘어가지 않고</text><text x="590" y="287" class="os" style="font-size:11px">계속 다시 시도</text>
  <text x="24" y="354" class="t2" style="font-size:12px">11장 계약 실패</text>
  <text x="263" y="354" class="okt" text-anchor="middle" style="font-size:11.5px">0개</text>
  <text x="455" y="354" class="badt" text-anchor="middle" style="font-size:11.5px">5개 — 실패 모음 3·다시 넣기 2</text>
  <text x="647" y="354" class="badt" text-anchor="middle" style="font-size:11.5px">3개 — 다 쓴 결과·다시 넣기 2</text>
  <text x="24" y="380" class="t2" style="font-size:12px">30초 장애 측정</text>
  <text x="263" y="380" class="oks" text-anchor="middle" style="font-size:11px;font-weight:700">잃음 0 · 실패 모음 2</text>
  <text x="455" y="380" class="bads" text-anchor="middle" style="font-size:11px;font-weight:700">잃음 2(운영이 모은 2건)</text>
  <text x="647" y="380" class="os" text-anchor="middle" style="font-size:11px;font-weight:700">반영 60 · 실패 표 0</text>
  <text x="647" y="396" class="gs" text-anchor="middle" style="font-size:10px">저장소가 돌아온 뒤 반영(실행에서 봄)</text>
  <line x1="14" y1="412" x2="748" y2="412" stroke="#9ca3af" stroke-width="1"/>
  <use href="#i-box" transform="translate(22,424) scale(0.7)"/>
  <text x="52" y="440" class="t2">운영이 치르는 비용</text>
  <text x="52" y="462" class="s2" style="font-size:11px;fill:#1f2937">실패 모음에 간 메시지는 운영자가 다시 넣기 명령을 돌려야 원래 토픽으로 돌아감</text><text x="52" y="480" class="s2" style="font-size:11px;fill:#1f2937">받는 쪽 토픽마다 실패 모음 토픽이 하나씩 늘고(서비스가 뜰 때 만듦, 파티션 2), 파티션 수를 원래 토픽과 맞춰야 함</text><text x="52" y="498" class="s2" style="font-size:11px;fill:#1f2937">원래 메시지와 같은 번호 파티션에 원래 키·본문 그대로 실음 · 싣지 못하면 그 자리를 넘어가지 않고 다시 시도</text>
</svg>
