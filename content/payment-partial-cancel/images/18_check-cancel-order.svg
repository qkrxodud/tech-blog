  <rect x="60" y="424" width="280" height="66" rx="10" fill="none" stroke="#16a34a" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.8121;0.8221;0.8721;0.8821;1"/></rect>
