  <text x="288" y="66" class="t">결제 서버</text>
  <text x="288" y="83" class="s">컨트롤러·서비스</text>
  <rect x="448" y="46" width="104" height="46" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <use href="#db" x="462" y="57"/>
  <text x="496" y="75" class="t">DB</text>
  <rect x="612" y="46" width="136" height="46" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <rect x="612" y="46" width="136" height="46" rx="10" fill="none" stroke="#ea580c" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.515;0.52;0.66;0.67;1"/></rect>
  <use href="#srv" x="622" y="55"/>
  <text x="666" y="75" class="t">Mock PG</text>
  <line x1="80" y1="92" x2="80" y2="512" stroke="#c4c8ce" stroke-dasharray="4 4"/>
  <line x1="320" y1="92" x2="320" y2="512" stroke="#c4c8ce" stroke-dasharray="4 4"/>
  <line x1="500" y1="92" x2="500" y2="512" stroke="#c4c8ce" stroke-dasharray="4 4"/>
  <line x1="680" y1="92" x2="680" y2="512" stroke="#c4c8ce" stroke-dasharray="4 4"/>
  <circle cx="30" cy="128" r="11" fill="#111827"/><text x="30" y="132" class="num" text-anchor="middle">1</text>
  <text x="30" y="154" class="lbl" text-anchor="middle" style="font-size: 11px">준비</text>
  <text x="90" y="106" class="m" style="font-size: 11.5px; fill: #1f2937">POST /api/v1/payments</text>
  <text x="90" y="120" class="m" style="font-size: 11.5px; fill: #6b7280">{orderId, amount}</text>
  <line x1="80" y1="128" x2="316" y2="128" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <text x="410" y="122" class="lbl" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace" font-size="11.5px">READY</tspan> 저장·커밋</text>
  <line x1="324" y1="128" x2="492" y2="128" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <rect x="494" y="120" width="12" height="28" rx="2" fill="#bfdbfe" stroke="#7b93c9" stroke-width="1.2"/>
  <rect x="494" y="120" width="12" height="28" rx="2" fill="none" stroke="#2563eb" stroke-width="2.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.115;0.12;0.17;0.18;1"/></rect>
  <line x1="494" y1="144" x2="324" y2="144" stroke="#1f2937" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ak)"/>
  <text x="200" y="155" class="m" text-anchor="middle" style="font-size: 11.5px; fill: #1f2937">201 {status: READY}</text>
  <line x1="320" y1="160" x2="84" y2="160" stroke="#1f2937" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ak)"/>
  <line x1="16" y1="174" x2="748" y2="174" stroke="#e5e7eb"/>
  <circle cx="30" cy="206" r="11" fill="#111827"/><text x="30" y="210" class="num" text-anchor="middle">2</text>
  <text x="30" y="232" class="lbl" text-anchor="middle" style="font-size: 11px">승인</text>
  <text x="90" y="184" class="m" style="font-size: 11.5px; fill: #1f2937">POST /api/v1/payments/</text>
  <text x="90" y="198" class="m" style="font-size: 11.5px; fill: #1f2937">{orderId}/confirm <tspan fill="#6b7280">{paymentKey}</tspan></text>
  <line x1="80" y1="206" x2="316" y2="206" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <rect x="232" y="222" width="468" height="70" rx="16" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="232" y="222" width="468" height="70" rx="16" fill="none" stroke="#2563eb" stroke-width="3" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.302;0.307;0.414;0.424;1"/></rect>
  <rect x="244" y="212" width="212" height="24" rx="6" fill="#5b7194"/>
  <text x="350" y="229" class="tab" text-anchor="middle">트랜잭션 1 — <tspan font-family="Menlo, Consolas, monospace" font-size="11.5px">authenticate()</tspan></text>
  <text x="410" y="250" class="lbl" text-anchor="middle">결제 읽기·인증 기록</text>
  <line x1="324" y1="256" x2="492" y2="256" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <rect x="494" y="248" width="12" height="38" rx="2" fill="#bfdbfe" stroke="#7b93c9" stroke-width="1.2"/>
  <rect x="494" y="248" width="12" height="38" rx="2" fill="none" stroke="#2563eb" stroke-width="2.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.35;0.355;0.405;0.415;1"/></rect>
  <use href="#lock" x="526" y="262"/>
  <text x="542" y="271" class="lbl" style="fill: #1f2937"><tspan font-family="Menlo, Consolas, monospace" font-size="11.5px">AUTHENTICATED</tspan> 커밋</text>
  <text x="410" y="276" class="oks" text-anchor="middle">커밋 후 연결 반납</text>
  <line x1="494" y1="282" x2="324" y2="282" stroke="#1f2937" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ak)"/>
  <circle cx="214" cy="256" r="10" fill="#fde8e8" stroke="#dc2626" stroke-width="1.5"/>
  <text x="214" y="260.5" class="badt" text-anchor="middle" style="font-size: 12px">A</text>
  <circle cx="30" cy="356" r="11" fill="#111827"/><text x="30" y="360" class="num" text-anchor="middle">3</text>
  <text x="30" y="382" class="lbl" text-anchor="middle" style="font-size: 11px">PG 호출</text>
  <rect x="232" y="302" width="516" height="92" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="232" y="302" width="516" height="92" rx="12" fill="none" stroke="#16a34a" stroke-width="3" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.409;0.414;0.7056;0.7156;1"/></rect>
  <text x="244" y="319" class="okt">트랜잭션 밖 — PG를 기다리는 동안 DB 연결을 쓰지 않음</text>
  <text x="330" y="334" class="m" style="font-size: 11.5px; fill: #1f2937">POST /v1/payments/confirm</text>
  <text x="330" y="348" class="m" style="font-size: 11.5px; fill: #6b7280">{paymentKey, orderId, amount}</text>
  <line x1="324" y1="356" x2="672" y2="356" stroke="#c2410c" stroke-width="1.5" class="run" marker-end="url(#aor)"/>
  <rect x="674" y="356" width="12" height="30" rx="2" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.2"/>
  <text x="500" y="380" class="m" text-anchor="middle" style="font-size: 11.5px; fill: #1f2937">200 {status: DONE, totalAmount}</text>
  <line x1="674" y1="386" x2="324" y2="386" stroke="#c2410c" stroke-width="1.5" class="run" marker-end="url(#aor)"/>
  <circle cx="722" cy="371" r="10" fill="#fde8e8" stroke="#dc2626" stroke-width="1.5"/>
  <text x="722" y="375.5" class="badt" text-anchor="middle" style="font-size: 12px">B</text>
  <circle cx="30" cy="438" r="11" fill="#111827"/><text x="30" y="442" class="num" text-anchor="middle">4</text>
  <text x="30" y="464" class="lbl" text-anchor="middle" style="font-size: 11px">결과 기록</text>
  <rect x="232" y="404" width="468" height="70" rx="16" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="232" y="404" width="468" height="70" rx="16" fill="none" stroke="#2563eb" stroke-width="3" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7006;0.7056;0.8128;0.8228;1"/></rect>
  <rect x="244" y="394" width="226" height="24" rx="6" fill="#5b7194"/>
  <text x="357" y="411" class="tab" text-anchor="middle">트랜잭션 2 — <tspan font-family="Menlo, Consolas, monospace" font-size="11.5px">recordApproval()</tspan></text>
  <text x="410" y="432" class="lbl" text-anchor="middle">다시 읽고 결과 기록</text>
  <line x1="324" y1="438" x2="492" y2="438" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <rect x="494" y="430" width="12" height="38" rx="2" fill="#bfdbfe" stroke="#7b93c9" stroke-width="1.2"/>
  <rect x="494" y="430" width="12" height="38" rx="2" fill="none" stroke="#2563eb" stroke-width="2.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.75;0.755;0.805;0.815;1"/></rect>
  <use href="#lock" x="526" y="444"/>
  <text x="542" y="453" class="lbl" style="fill: #1f2937"><tspan font-family="Menlo, Consolas, monospace" font-size="11.5px">APPROVED</tspan> 커밋</text>
  <text x="410" y="458" class="oks" text-anchor="middle">커밋 후 연결 반납</text>
  <line x1="494" y1="464" x2="324" y2="464" stroke="#1f2937" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ak)"/>
  <circle cx="30" cy="500" r="11" fill="#111827"/><text x="30" y="504" class="num" text-anchor="middle">5</text>
  <text x="30" y="526" class="lbl" text-anchor="middle" style="font-size: 11px">응답</text>
  <text x="200" y="494" class="m" text-anchor="middle" style="font-size: 11.5px; fill: #15803d">200 {status: APPROVED}</text>
  <line x1="320" y1="500" x2="84" y2="500" stroke="#16a34a" stroke-width="1.8" marker-end="url(#agr)"/>
  <line x1="16" y1="534" x2="748" y2="534" stroke="#e5e7eb"/>
  <circle cx="30" cy="553" r="9" fill="#fde8e8" stroke="#dc2626" stroke-width="1.5"/>
  <text x="30" y="557" class="badt" text-anchor="middle" style="font-size: 11px">A</text>
  <text x="48" y="557" class="s" style="font-size: 12.5px; fill: #1f2937">결제가 없으면 404 <tspan font-family="Menlo, Consolas, monospace" font-size="11px">PAYMENT_NOT_FOUND</tspan>, 상태가 맞지 않으면 409 <tspan font-family="Menlo, Consolas, monospace" font-size="11px">INVALID_PAYMENT_TRANSITION</tspan> — PG를 부르지 않음</text>
  <circle cx="30" cy="577" r="9" fill="#fde8e8" stroke="#dc2626" stroke-width="1.5"/>
  <text x="30" y="581" class="badt" text-anchor="middle" style="font-size: 11px">B</text>
  <text x="48" y="581" class="s" style="font-size: 12.5px; fill: #1f2937">거절(400 <tspan font-family="Menlo, Consolas, monospace" font-size="11px">CARD_REJECTED</tspan>)이면 트랜잭션 2에서 <tspan font-family="Menlo, Consolas, monospace" font-size="11px">APPROVAL_FAILED</tspan> 커밋 → 200 <tspan font-family="Menlo, Consolas, monospace" font-size="11px">{status: APPROVAL_FAILED}</tspan></text>
  <text x="48" y="603" class="s" style="font-size: 12.5px; fill: #1f2937">읽기 시간 제한 안에 답이 없으면 <tspan font-family="Menlo, Consolas, monospace" font-size="11px">AUTHENTICATED</tspan>로 둔 채 504 <tspan font-family="Menlo, Consolas, monospace" font-size="11px">PAYMENT_GATEWAY_NO_RESPONSE</tspan></text>
  <text x="48" y="625" class="s">오류 응답 본문은 <tspan font-family="Menlo, Consolas, monospace" font-size="11px">{code, message}</tspan>, 승인 응답 본문은 <tspan font-family="Menlo, Consolas, monospace" font-size="11px">{orderId, amount, status}</tspan></text>
  <g class="anim" opacity="0">
    <use href="#pkt"/>
