<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>리뷰 전에는 LadderHeightParam이 BaseParam 인터페이스를 구현하고 convertParamToModel이 Object를 반환해 무엇을 받는지 알기 어렵고, 리뷰 후에는 인터페이스 없이 LadderHeightParam의 convertParamToModel이 Supplier로 LadderHeight를 만들어 반환한다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 12px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .name { font-size: 14px; font-weight: 700; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .pkg { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .rail { stroke: #9ca3af; stroke-width: 3; stroke-linecap: round; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#ffffff"/>
  <rect x="10" y="10" width="364" height="380" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">리뷰 전 — Object 반환</text>
  <rect x="42" y="66" width="300" height="70" rx="6" class="box"/>
  <text x="192" y="88" class="sub" text-anchor="middle">«interface»</text>
  <text x="192" y="108" class="opm" text-anchor="middle">BaseParam</text>
  <text x="192" y="127" class="ms" text-anchor="middle">Object convertParamToModel()</text>
  <rect x="42" y="186" width="300" height="56" rx="6" class="box"/>
  <text x="192" y="210" class="opm" text-anchor="middle">LadderHeightParam</text>
  <text x="192" y="230" class="val" text-anchor="middle">height 검증</text>
  <line x1="192" y1="184" x2="192" y2="140" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <text x="202" y="166" class="sub">구현</text>
  <line x1="192" y1="244" x2="192" y2="268" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="202" y="261" class="ms">convertParamToModel()</text>
  <rect x="42" y="272" width="300" height="56" rx="8" class="bad"/>
  <text x="192" y="296" class="badc" text-anchor="middle">Object</text>
  <text x="192" y="316" class="note" text-anchor="middle">무엇이 반환될지 파악하기 어려움</text>
  <text x="30" y="358" class="foot">공통이라고 생각해 만든 인터페이스가</text>
  <text x="30" y="376" class="foot">필요한지도 함께 지적받음</text>

  <rect x="386" y="10" width="364" height="380" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="406" y="42" class="h">리뷰 후 — 구체 타입 반환</text>
  <rect x="418" y="66" width="300" height="104" rx="6" class="box"/>
  <text x="568" y="90" class="opm" text-anchor="middle">LadderHeightParam</text>
  <line x1="418" y1="102" x2="718" y2="102" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="430" y="124" class="ms">LadderHeight convertParamToModel()</text>
  <text x="430" y="150" class="ms">Supplier&lt;LadderHeight&gt; supplier</text>
  <line x1="568" y1="172" x2="568" y2="268" stroke="#16a34a" stroke-width="1.4" marker-end="url(#agr)"/>
  <text x="578" y="226" class="ms">supplier.get()</text>
  <rect x="418" y="272" width="300" height="56" rx="8" class="ok"/>
  <text x="568" y="296" class="okc" text-anchor="middle">LadderHeight</text>
  <text x="568" y="316" class="gnote" text-anchor="middle">반환 타입이 코드에 드러남</text>
  <text x="406" y="358" class="foot">직접 만든 인터페이스 대신</text>
  <text x="406" y="376" class="foot">라이브러리의 Supplier 사용</text>
</svg>
