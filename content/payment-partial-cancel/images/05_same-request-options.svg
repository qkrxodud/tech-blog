  <text x="478" y="292" class="bads" style="font-size: 12px">새 취소로 처리</text>
  <rect x="606" y="240" width="132" height="74" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.2"/>
  <use href="#xmark" x="622" y="265"/>
