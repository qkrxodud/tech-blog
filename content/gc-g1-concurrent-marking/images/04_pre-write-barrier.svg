<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>obj.field = newObj가 실행되기 직전에 pre-write barrier가 기존 참조 객체를 mutator thread의 local SATB buffer에 넣고, 다 찬 buffer는 global SATB buffer로 옮겨져 GC thread가 꺼내 mark stack에 저장한다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
    .monob { font-family: Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #1f2937; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dark { fill: #d1d5db; stroke: #6b7280; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .sep { stroke: #e5e7eb; stroke-width: 1; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .wn { fill: #ffffff; stroke: #6b7280; stroke-width: 1.5; }
    .gn { fill: #d1d5db; stroke: #6b7280; stroke-width: 1.5; }
    .bn { fill: #374151; stroke: #1f2937; stroke-width: 1.5; }
    .nt { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ntw { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .edge { stroke: #6b7280; stroke-width: 1.5; fill: none; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="370" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="350" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">pre-write barrier — 참조가 바뀌기 직전에 기존 참조 객체를 기록</text>
  <text x="30" y="80" class="lane">mutator thread</text>
  <text x="30" y="98" class="sub">애플리케이션 코드</text>
  <rect x="170" y="62" width="170" height="52" rx="8" class="box"/>
  <text x="255" y="93" class="monob" text-anchor="middle">obj.field = newObj;</text>
  <rect x="372" y="62" width="170" height="52" rx="8" class="ok"/>
  <text x="457" y="84" class="okt" text-anchor="middle">pre-write barrier</text>
  <text x="457" y="103" class="val" text-anchor="middle">기존 참조 객체 enqueue</text>
  <rect x="574" y="62" width="156" height="52" rx="8" class="hold"/>
  <text x="652" y="84" class="op" text-anchor="middle">참조 변경</text>
  <text x="652" y="103" class="val" text-anchor="middle">obj.field → newObj</text>
  <line x1="341" y1="88" x2="370" y2="88" class="al" marker-end="url(#ar)"/>
  <line x1="543" y1="88" x2="572" y2="88" class="al" marker-end="url(#ar)"/>
  <text x="255" y="132" class="sub" text-anchor="middle">① 실행 직전</text>
  <text x="457" y="132" class="gnote" text-anchor="middle">② 먼저 실행</text>
  <text x="652" y="132" class="sub" text-anchor="middle">③ 그다음 변경</text>
  <line x1="30" y1="150" x2="730" y2="150" class="sep"/>
  <text x="30" y="186" class="lane">SATB buffer</text>
  <text x="30" y="204" class="sub">기존 참조 객체가 쌓임</text>
  <rect x="372" y="168" width="170" height="52" rx="8" class="ok"/>
  <text x="457" y="190" class="okt" text-anchor="middle">local SATB buffer</text>
  <text x="457" y="209" class="val" text-anchor="middle">mutator thread마다 하나</text>
  <rect x="170" y="168" width="170" height="52" rx="8" class="box"/>
  <text x="255" y="190" class="op" text-anchor="middle">global SATB buffer</text>
  <text x="255" y="209" class="val" text-anchor="middle">다 찬 buffer를 통째로</text>
  <line x1="528" y1="115" x2="528" y2="166" class="gl" marker-end="url(#agr)"/>
  <line x1="371" y1="194" x2="342" y2="194" class="al" marker-end="url(#ar)"/>
  <line x1="30" y1="236" x2="730" y2="236" class="sep"/>
  <text x="30" y="272" class="lane">GC thread</text>
  <text x="30" y="290" class="sub">marking 수행</text>
  <rect x="170" y="254" width="170" height="52" rx="8" class="hold"/>
  <text x="255" y="276" class="op" text-anchor="middle">local mark stack</text>
  <text x="255" y="295" class="val" text-anchor="middle">꺼낸 객체를 push</text>
  <line x1="255" y1="221" x2="255" y2="252" class="al" marker-end="url(#ar)"/>
  <text x="372" y="272" class="val">SATB buffer에서 객체를 꺼내 자신의 mark stack에 저장</text>
  <text x="372" y="292" class="sub">참조가 지워져도 기존 참조 객체는 marking 대상으로 남는다</text>
  <text x="30" y="336" class="note">지역 변수의 참조 변경에는 pre-write barrier가 적용되지 않는다</text>

</svg>
