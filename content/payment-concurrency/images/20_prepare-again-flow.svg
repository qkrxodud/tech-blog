  <rect width="760" height="628" fill="#ffffff"/>
  <text x="24" y="30" class="h">결정 3 — 중복 거부를 잡아 새 트랜잭션에서 다시 읽기</text>
  <text x="24" y="52" class="gs">빈을 나눈 이유: 중복 거부가 난 트랜잭션은 되돌리기로 표시돼 그 안에서는 다시 읽어 답할 수 없음</text>
  <rect x="60" y="70" width="280" height="46" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <use href="#i-card" x="74" y="79"/>
  <text x="118" y="90" class="t2" style="font-size:12px">같은 주문번호의 나중 준비</text>
  <text x="118" y="107" class="s" style="font-size:10.5px">앞 준비의 결제는 아직 커밋 전</text>
  <rect x="24" y="128" width="712" height="486" rx="16" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="392" y="138" width="332" height="24" rx="6" fill="#5b7194"/>
  <text x="558.0" y="154.5" class="tab" text-anchor="middle"><tspan class="m">PaymentPrepareService.prepare</tspan> — 트랜잭션 없음</text>
  <rect x="44" y="176" width="312" height="144" rx="12" fill="#ffffff" stroke="#9fb3d1" stroke-width="1.2"/>
  <text x="56" y="194" class="bs" style="font-size:10px">트랜잭션 1 — <tspan class="m">PaymentPrepareRecorder.prepare</tspan></text>
  <rect x="60" y="204" width="280" height="48" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="60" cy="204" r="10" fill="#111827"/><text x="60" y="208" class="num" text-anchor="middle">1</text>
  <use href="#i-db" transform="translate(76,213) scale(0.95)"/>
  <text x="118" y="224" class="t2" style="font-size:12px">주문번호로 결제 찾기</text>
  <text x="118" y="242" class="s" style="font-size:10.5px"><tspan class="m">findByOrderId</tspan> → 없음</text>
  <rect x="60" y="262" width="280" height="48" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="60" cy="262" r="10" fill="#111827"/><text x="60" y="266" class="num" text-anchor="middle">2</text>
  <use href="#i-doc" transform="translate(78,269) scale(0.9)"/>
  <text x="118" y="282" class="t2" style="font-size:12px">새 결제 저장</text>
  <text x="118" y="300" class="s" style="font-size:10.5px"><tspan class="m">uk_payment_order_id</tspan> 중복 거부</text>
  <rect x="386" y="262" width="336" height="48" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <line x1="342" y1="286" x2="384" y2="286" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="400" y="282" class="badt" style="font-size:12px">되돌리기로 표시된 트랜잭션</text>
  <text x="400" y="300" class="bads" style="font-size:10.5px"><tspan class="m">DataIntegrityViolationException</tspan></text>
  <rect x="60" y="332" width="280" height="46" rx="10" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <circle cx="60" cy="332" r="10" fill="#111827"/><text x="60" y="336" class="num" text-anchor="middle">3</text>
  <text x="78" y="352" class="t2" style="font-size:12px">서비스가 중복 거부를 잡음</text>
  <text x="78" y="369" class="s" style="font-size:9.5px"><tspan class="m">catch (DataIntegrityViolationException)</tspan></text>
  <rect x="44" y="390" width="312" height="144" rx="12" fill="#ffffff" stroke="#9fb3d1" stroke-width="1.2"/>
  <text x="56" y="408" class="bs" style="font-size:10.5px">트랜잭션 2 — <tspan class="m">prepareAgain</tspan> (readOnly)</text>
  <rect x="60" y="418" width="280" height="48" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="60" cy="418" r="10" fill="#111827"/><text x="60" y="422" class="num" text-anchor="middle">4</text>
  <use href="#i-db" transform="translate(76,427) scale(0.95)"/>
  <text x="118" y="438" class="t2" style="font-size:12px">먼저 남은 결제를 다시 읽기</text>
  <text x="118" y="456" class="s" style="font-size:10.5px"><tspan class="m">findByOrderId</tspan> → 있음</text>
  <line x1="200" y1="536" x2="200" y2="556" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#agy)"/>
  <text x="210" y="550" class="gs" style="font-size:10.5px">결제가 없어 비어 있으면</text>
  <rect x="60" y="558" width="662" height="44" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="76" y="577" class="gt" style="font-size:12px">원래 예외를 그대로 알림 — <tspan class="m">orElseThrow(() -&gt; duplicated)</tspan></text>
  <text x="76" y="594" class="gs" style="font-size:10.5px">주문번호 중복이 아닌 거부 · 트랜잭션 없는 서비스에서</text>
  <rect x="60" y="476" width="280" height="48" rx="10" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <circle cx="60" cy="476" r="10" fill="#111827"/><text x="60" y="480" class="num" text-anchor="middle">5</text>
  <use href="#i-coin" x="78" y="488"/>
  <text x="118" y="496" class="t2" style="font-size:12px">금액 비교(3장 규칙)</text>
  <text x="118" y="514" class="s" style="font-size:10.5px"><tspan class="m">verifyPreparedAmount</tspan></text>
  <rect x="386" y="476" width="160" height="48" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="404" y="500"/>
  <text x="420" y="496" class="okt" style="font-size:12px">같은 금액</text>
  <text x="420" y="514" class="oks" style="font-size:11px">그 결제 <tspan class="m">201</tspan></text>
  <rect x="556" y="476" width="166" height="48" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="574" y="500"/>
  <text x="590" y="496" class="badt" style="font-size:12px">다른 금액</text>
  <text x="590" y="514" class="bads" style="font-size:10px"><tspan class="m">409 DUPLICATE_ORDER</tspan></text>
  <line x1="342" y1="500" x2="384" y2="500" stroke="#16a34a" stroke-width="1.4" marker-end="url(#agr)"/>
  <line x1="320" y1="116" x2="320" y2="202" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <line x1="320" y1="252" x2="320" y2="260" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <line x1="320" y1="310" x2="320" y2="330" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <line x1="320" y1="378" x2="320" y2="416" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <line x1="320" y1="466" x2="320" y2="474" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <rect x="60" y="204" width="280" height="48" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2139;0.2239;0.2739;0.2839;1"/></rect>
  <rect x="60" y="262" width="280" height="48" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3022;0.3122;0.3622;0.3722;1"/></rect>
  <rect x="60" y="332" width="280" height="46" rx="10" fill="none" stroke="#d97706" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4072;0.4172;0.4672;0.4772;1"/></rect>
  <rect x="60" y="418" width="280" height="48" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5396;0.5496;0.5996;0.6096;1"/></rect>
  <rect x="60" y="476" width="280" height="48" rx="10" fill="none" stroke="#d97706" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6278;0.6378;0.6878;0.6978;1"/></rect>
  <rect x="386" y="476" width="160" height="48" rx="10" fill="none" stroke="#16a34a" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.85;0.86;0.91;0.92;1"/></rect>
  <g class="anim" opacity="0">
    <use href="#pkt"/>
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear"
      path="M320,94 V500 H466"
      keyPoints="0;0;0.2428;0.3478;0.4728;0.6304;0.7355;1;1;1" keyTimes="0;0.02;0.2239;0.3122;0.4172;0.5496;0.6378;0.86;0.86;1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.015;0.02;0.86;0.87;1"/>
