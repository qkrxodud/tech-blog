<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 2 선택지 비교 — 어긋남 다섯 종류마다 뒤처짐만 따라가기(이 장에서 고름, FollowBehindResolver)는 STATUS_BEHIND만 카드사에 다시 조회해 6장 follow로 맞춰 FOLLOWED로 남기고 나머지는 운영자 확인(NEEDS_REVIEW)으로 두며, 기록만(RecordOnlyResolver)은 모두 운영자 확인으로 두고, 모두 카드사에 맞춤(FollowAllResolver)은 뒤처진 결제는 따라가고 나머지는 결제 줄을 직접 고쳐(우리가 앞선 결제는 카드사 단계로 되돌리고, 우리 금액을 카드사 금액으로, 우리에게만 있는 결제를 승인 실패로, 카드사에만 있는 결제를 승인 결제로 새로 만듦) 모두 FOLLOWED로 남기는 비교</title>
