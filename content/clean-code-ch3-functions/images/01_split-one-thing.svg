<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>변경 전 renderPageWithSetupsAndTeardowns의 여러 문장이 변경 후 isTestPage, includeSetupAndTeardownPages, getHtml 세 호출로 묶이는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 12.5px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="760" height="410" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="390" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">한 가지만 하는 함수 — 변경 전과 후</text>
  <text x="730" y="42" class="code" text-anchor="end">renderPageWithSetupsAndTeardowns</text>
  <text x="30" y="72" class="step">변경 전 — 모든 문장이 한 함수 안에 있음</text>
  <text x="480" y="72" class="step">변경 후 — 세 단계 호출</text>
  <rect x="30" y="86" width="420" height="28" rx="6" class="box"/>
  <text x="42" y="104.5" class="ms">boolean isTestPage = pageData.hasAttribute(&quot;Test&quot;);</text>
  <rect x="30" y="126" width="420" height="28" rx="6" class="hold"/>
  <text x="42" y="144.5" class="ms">WikiPage testPage = pageData.getWikiPage();</text>
  <rect x="30" y="158" width="420" height="28" rx="6" class="hold"/>
  <text x="42" y="176.5" class="ms">StringBuffer newPageContent = new StringBuffer();</text>
  <rect x="30" y="190" width="420" height="28" rx="6" class="hold"/>
  <text x="42" y="208.5" class="ms">includeSetupPages(testPage, newPageContent, isSuite);</text>
  <rect x="30" y="222" width="420" height="28" rx="6" class="hold"/>
  <text x="42" y="240.5" class="ms">newPageContent.append(pageData.getContent());</text>
  <rect x="30" y="254" width="420" height="28" rx="6" class="hold"/>
  <text x="42" y="272.5" class="ms">includeTeardownPages(testPage, newPageContent, isSuite);</text>
  <rect x="30" y="286" width="420" height="28" rx="6" class="hold"/>
  <text x="42" y="304.5" class="ms">pageData.setContent(newPageContent.toString());</text>
  <rect x="30" y="326" width="420" height="28" rx="6" class="box"/>
  <text x="42" y="344.5" class="ms">return pageData.getHtml();</text>
  <line x1="454" y1="100" x2="476" y2="100" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="480" y="86" width="250" height="28" rx="6" class="ok"/>
  <text x="605" y="104.5" class="okm" text-anchor="middle">if (isTestPage(pageData))</text>
  <path d="M456,128 H464 V312 H456" fill="none" stroke="#16a34a" stroke-width="1.4"/>
  <line x1="464" y1="220" x2="476" y2="220" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="480" y="190" width="250" height="60" rx="8" class="ok"/>
  <text x="605" y="215" class="okm" text-anchor="middle">includeSetupAndTeardownPages(</text>
  <text x="605" y="236" class="okm" text-anchor="middle">pageData, isSuite)</text>
  <line x1="454" y1="340" x2="476" y2="340" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="480" y="326" width="250" height="28" rx="6" class="ok"/>
  <text x="605" y="344.5" class="okm" text-anchor="middle">return pageData.getHtml();</text>
  <text x="30" y="384" class="foot">변경 후 함수에는 테스트 페이지 판단, 설정·해제 페이지 넣기, HTML 반환의 세 단계만 남습니다.</text>
</svg>
