<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>리소스 로컬 트랜잭션에서는 커넥션을 트랜잭션이 끝날 때 해제해 트랜잭션 내내 점유하고, JTA에서는 Statement를 실행할 때마다 커넥션을 해제하는 Hibernate 연결 생명주기 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12.5px; fill: #374151; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .thead { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .cell { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 12.5px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 12.5px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="408" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="186" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">리소스 로컬 트랜잭션 — 트랜잭션이 끝날 때 해제</text>
  <text x="730" y="42" class="code" text-anchor="end">AFTER_TRANSACTION</text>
  <text x="220" y="68" class="step" text-anchor="middle">1</text>
  <text x="360" y="68" class="step" text-anchor="middle">2</text>
  <text x="500" y="68" class="step" text-anchor="middle">3</text>
  <text x="640" y="68" class="step" text-anchor="middle">4</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="114" class="lane">트랜잭션</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="117" class="t" text-anchor="middle">트랜잭션 시작</text>
  <rect x="302" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="360" y="117" class="t" text-anchor="middle">Statement 1</text>
  <rect x="442" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="500" y="117" class="t" text-anchor="middle">Statement 2</text>
  <rect x="582" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="640" y="117" class="t" text-anchor="middle">커밋</text>
  <text x="30" y="170" class="lane">커넥션</text>
  <rect x="150" y="144" width="585" height="44" rx="6" class="track"/>
  <rect x="162" y="150" width="536" height="32" rx="6" class="hold"/>
  <text x="430" y="171" class="val" text-anchor="middle">획득한 뒤 트랜잭션 내내 점유 → 커밋 후 해제</text>
  <rect x="10" y="212" width="740" height="186" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="244" class="h">JTA — Statement를 실행할 때마다 해제</text>
  <text x="730" y="244" class="code" text-anchor="end">AFTER_STATEMENT</text>
  <text x="220" y="270" class="step" text-anchor="middle">1</text>
  <text x="360" y="270" class="step" text-anchor="middle">2</text>
  <text x="500" y="270" class="step" text-anchor="middle">3</text>
  <text x="640" y="270" class="step" text-anchor="middle">4</text>
  <line x1="160" y1="278" x2="722" y2="278" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="316" class="lane">트랜잭션</text>
  <rect x="150" y="288" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="290" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="319" class="t" text-anchor="middle">트랜잭션 시작</text>
  <rect x="302" y="290" width="116" height="48" rx="8" class="box"/>
  <text x="360" y="319" class="t" text-anchor="middle">Statement 1</text>
  <rect x="442" y="290" width="116" height="48" rx="8" class="box"/>
  <text x="500" y="319" class="t" text-anchor="middle">Statement 2</text>
  <rect x="582" y="290" width="116" height="48" rx="8" class="box"/>
  <text x="640" y="319" class="t" text-anchor="middle">커밋</text>
  <text x="30" y="372" class="lane">커넥션</text>
  <rect x="150" y="346" width="585" height="44" rx="6" class="track"/>
  <rect x="302" y="352" width="116" height="32" rx="6" class="ok"/>
  <text x="360" y="373" class="gnote" text-anchor="middle">획득 → 해제</text>
  <rect x="442" y="352" width="116" height="32" rx="6" class="ok"/>
  <text x="500" y="373" class="gnote" text-anchor="middle">획득 → 해제</text>
  <text x="220" y="373" class="sub" text-anchor="middle">점유 없음</text>
  <text x="640" y="373" class="sub" text-anchor="middle">점유 없음</text>
</svg>
