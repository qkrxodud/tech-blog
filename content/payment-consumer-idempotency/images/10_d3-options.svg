  <text x="24" y="28" class="h">결정 3 — 처리에 실패한 메시지를 언제 다시 시도할까</text>
  <text x="24" y="48" class="gs" style="font-size:11.5px">같은 파티션 · 같은 주문의 승인 → 취소 순서로 보냄 · 승인이 일시 오류(그림의 길이는 순서만 나타냄)</text>
