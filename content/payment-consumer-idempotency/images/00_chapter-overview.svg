  <text x="28" y="256" class="gs" style="font-size:11px">보낸 뒤 보낸 때를 남기기 전에 서버가</text>
  <text x="28" y="272" class="gs" style="font-size:11px">멈추면 같은 메시지를 다시 받을 수 있음</text>
