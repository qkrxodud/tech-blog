  <circle cx="40" cy="238" r="11" fill="#111827"/><text x="40" y="242" class="num" text-anchor="middle">2</text>
  <text x="200" y="235" class="t2" text-anchor="middle">승인 결과를 기다리는 결제?</text>
  <text x="200" y="252" class="s" text-anchor="middle">인증 · 결과 모름</text>
