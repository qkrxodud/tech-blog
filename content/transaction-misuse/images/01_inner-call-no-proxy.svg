<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>테스트가 프록시를 거쳐 outerMethod를 호출하면 트랜잭션이 하나 시작되고, this로 부른 innerMethod는 프록시를 거치지 않아 예외가 catch로 잡힌 뒤 Outer User와 Inner User가 모두 커밋되는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 13.5px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 13.5px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badw { fill: #ffffff; stroke: #dc2626; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .badt { font-size: 13.5px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="400" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">내부 호출 — innerMethod는 프록시를 거치지 않는다</text>
  <text x="730" y="42" class="code" text-anchor="end">UserService</text>
  <text x="214" y="68" class="step" text-anchor="middle">1단계</text>
  <text x="331" y="68" class="step" text-anchor="middle">2단계</text>
  <text x="448" y="68" class="step" text-anchor="middle">3단계</text>
  <text x="565" y="68" class="step" text-anchor="middle">4단계</text>
  <text x="682" y="68" class="step" text-anchor="middle">5단계</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">테스트</text>
  <text x="30" y="126" class="sub">userService 호출</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <text x="30" y="168" class="lane">프록시</text>
  <text x="30" y="186" class="sub">트랜잭션 시작·커밋</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <text x="30" y="228" class="lane">UserService</text>
  <text x="30" y="246" class="sub">실제 객체</text>
  <rect x="150" y="206" width="585" height="52" rx="6" class="track"/>
  <rect x="161" y="88" width="106" height="48" rx="8" class="box"/>
  <text x="214" y="107.5" class="op" text-anchor="middle">outerMethod</text>
  <text x="214" y="126.5" class="val" text-anchor="middle">프록시 호출</text>
  <rect x="278" y="148" width="106" height="48" rx="8" class="box"/>
  <text x="331" y="167.5" class="t" text-anchor="middle">트랜잭션 시작</text>
  <text x="331" y="186.5" class="val" text-anchor="middle">트랜잭션 1개</text>
  <rect x="395" y="208" width="106" height="48" rx="8" class="box"/>
  <text x="448" y="227.5" class="op" text-anchor="middle">outerMethod</text>
  <text x="448" y="246.5" class="val" text-anchor="middle">Outer 저장</text>
  <rect x="512" y="208" width="106" height="48" rx="8" class="bad"/>
  <text x="565" y="227.5" class="badc" text-anchor="middle">innerMethod</text>
  <text x="565" y="246.5" class="val" text-anchor="middle">Inner 저장·예외</text>
  <rect x="512" y="156" width="106" height="32" rx="6" class="badw"/>
  <text x="565" y="177" class="note" text-anchor="middle">거치지 않음</text>
  <rect x="629" y="208" width="106" height="48" rx="8" class="box"/>
  <text x="682" y="227.5" class="op" text-anchor="middle">catch</text>
  <text x="682" y="246.5" class="val" text-anchor="middle">예외를 잡음</text>
  <rect x="629" y="148" width="106" height="48" rx="8" class="bad"/>
  <text x="682" y="167.5" class="badt" text-anchor="middle">커밋</text>
  <text x="682" y="186.5" class="val" text-anchor="middle">정상 종료</text>
  <line x1="234" y1="136" x2="311" y2="146" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="351" y1="196" x2="428" y2="206" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="501" y1="232" x2="511" y2="232" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="618" y1="232" x2="628" y2="232" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="682" y1="208" x2="682" y2="197" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="565" y="270" class="note" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">this.innerMethod()</tspan></text>
  <text x="30" y="311" class="db">DB의 user</text>
  <rect x="408" y="290" width="80" height="32" rx="6" class="dbbox"/>
  <text x="448" y="311" class="db" text-anchor="middle">1건</text>
  <rect x="525" y="290" width="80" height="32" rx="6" class="dbbox"/>
  <text x="565" y="311" class="db" text-anchor="middle">2건</text>
  <rect x="642" y="290" width="80" height="32" rx="6" class="bad"/>
  <text x="682" y="311" class="badt" text-anchor="middle">2건 커밋</text>
  <rect x="150" y="346" width="240" height="30" rx="15" class="bad"/>
  <text x="270" y="366" class="badt" text-anchor="middle">결과 — Inner User도 저장됨</text>
  <text x="406" y="366" class="foot">테스트가 기대한 <tspan font-family="Menlo, Consolas, monospace">users.size() = 1</tspan>과 다름</text>
  <text x="150" y="398" class="foot">innerMethod의 @Transactional은 프록시를 거쳐 호출될 때만 적용됩니다</text>
</svg>
