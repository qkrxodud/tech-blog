<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>예외를 기대하는 테스트를 작성하고, 더미 구현으로 테스트가 실패하고, try-catch로 StorageException을 던져 성공한 뒤, 예외 유형을 좁히는 리팩터링을 하는 네 단계</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .ttl { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ttls { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .cs { font-family: Menlo, Consolas, monospace; font-size: 11.5px; fill: #374151; }
    .csb { font-family: Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; fill: #1f2937; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="350" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="330" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">Try-Catch-Finally 문부터 작성 — 테스트가 이끄는 순서</text>
  <text x="220" y="68" class="step" text-anchor="middle">1단계</text>
  <text x="360" y="68" class="step" text-anchor="middle">2단계</text>
  <text x="500" y="68" class="step" text-anchor="middle">3단계</text>
  <text x="640" y="68" class="step" text-anchor="middle">4단계</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="112" class="lane">코드</text>
  <text x="30" y="130" class="sub">테스트와 구현</text>
  <rect x="150" y="86" width="585" height="64" rx="6" class="track"/>
  <rect x="156" y="90" width="128" height="56" rx="8" class="box"/>
  <text x="220" y="113" class="ttls" text-anchor="middle">테스트 작성</text>
  <text x="220" y="133" class="val" text-anchor="middle">예외를 기대함</text>
  <rect x="296" y="90" width="128" height="56" rx="8" class="box"/>
  <text x="360" y="113" class="ttls" text-anchor="middle">더미 구현</text>
  <text x="360" y="133" class="val" text-anchor="middle">빈 ArrayList 반환</text>
  <rect x="436" y="90" width="128" height="56" rx="8" class="box"/>
  <text x="500" y="113" class="ttls" text-anchor="middle">try-catch 추가</text>
  <text x="500" y="133" class="val" text-anchor="middle">예외로 바꿔 던짐</text>
  <rect x="576" y="90" width="128" height="56" rx="8" class="box"/>
  <text x="640" y="113" class="ttls" text-anchor="middle">리팩터링</text>
  <text x="640" y="133" class="val" text-anchor="middle">예외 유형 좁히기</text>
  <text x="30" y="192" class="lane">테스트</text>
  <text x="30" y="210" class="sub">실행 결과</text>
  <rect x="150" y="166" width="585" height="64" rx="6" class="track"/>
  <rect x="296" y="170" width="128" height="56" rx="8" class="bad"/>
  <text x="360" y="193" class="badt" text-anchor="middle">실패</text>
  <text x="360" y="213" class="val" text-anchor="middle">예외를 던지지 않음</text>
  <rect x="436" y="170" width="128" height="56" rx="8" class="ok"/>
  <text x="500" y="193" class="okt" text-anchor="middle">성공</text>
  <text x="500" y="213" class="val" text-anchor="middle">예외를 던짐</text>
  <rect x="576" y="170" width="128" height="56" rx="8" class="ok"/>
  <text x="640" y="193" class="okt" text-anchor="middle">성공 상태에서</text>
  <text x="640" y="213" class="val" text-anchor="middle">리팩터링 가능</text>
  <line x1="360" y1="146" x2="360" y2="168" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="500" y1="146" x2="500" y2="168" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="640" y1="146" x2="640" y2="168" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="150" y="262" class="sub">먼저 강제로 예외를 일으키는 테스트를 작성하고, 테스트를 통과하도록 코드를 작성합니다.</text>
  <text x="150" y="284" class="sub">그러면 try 블록의 트랜잭션 범위부터 구현하게 되어 범위 안에서 트랜잭션 본질을 유지하기 쉽습니다.</text>
  <text x="150" y="316" class="step">1단계 테스트: @Test(expected = StorageException.class), 3단계: throw new StorageException(...)</text>
</svg>
