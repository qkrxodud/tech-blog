<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>ZGC는 concurrent GC라 GC가 트리거된 뒤 끝날 때까지도 애플리케이션이 객체를 계속 생성하므로, -Xmx에 여유가 있으면 GC가 끝날 때까지 버티지만 빠듯하면 GC가 끝나기 전에 힙이 가득 찰 수 있다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .mc { font-family: Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 700; fill: #1f2937; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .gauge { fill: #ffffff; stroke: #c4c8ce; stroke-width: 1.2; }
    .used { fill: #d1d5db; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <pattern id="small" width="4" height="36" patternUnits="userSpaceOnUse">
      <rect width="4" height="36" fill="#fee2e2"/>
      <line x1="3.5" y1="0" x2="3.5" y2="36" stroke="#f87171" stroke-width="1"/>
    </pattern>
    <pattern id="large" x="150" width="56.25" height="36" patternUnits="userSpaceOnUse">
      <rect width="56.25" height="36" fill="#dcfce7"/>
      <line x1="55.75" y1="0" x2="55.75" y2="36" stroke="#16a34a" stroke-width="1.2"/>
    </pattern>
  </defs>
  <rect width="760" height="380" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="360" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">-Xmx — concurrent GC 중에도 객체 생성은 계속된다</text>

  <text x="220" y="68" class="step" text-anchor="middle">GC 트리거</text>
  <text x="360" y="68" class="step" text-anchor="middle">concurrent mark</text>
  <text x="500" y="68" class="step" text-anchor="middle">relocation</text>
  <text x="640" y="68" class="step" text-anchor="middle">GC 완료</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>

  <text x="30" y="108" class="lane">애플리케이션</text>
  <text x="30" y="126" class="sub">객체 생성</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="88" width="536" height="48" rx="8" class="hold"/>
  <text x="430" y="108" class="op" text-anchor="middle">GC 중에도 객체 생성 계속</text>
  <text x="430" y="127" class="val" text-anchor="middle">힙 사용량이 계속 늘어남</text>

  <text x="30" y="168" class="lane">ZGC</text>
  <text x="30" y="186" class="sub">GC 스레드</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="148" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="168" class="op" text-anchor="middle">GC 트리거</text>
  <text x="220" y="187" class="val" text-anchor="middle">생성 속도로 판단</text>
  <rect x="302" y="148" width="256" height="48" rx="8" class="hold"/>
  <text x="430" y="168" class="op" text-anchor="middle">mark · relocation</text>
  <text x="430" y="187" class="val" text-anchor="middle">애플리케이션과 동시에 진행</text>
  <rect x="582" y="148" width="116" height="48" rx="8" class="ok"/>
  <text x="640" y="168" class="okt" text-anchor="middle">GC 완료</text>
  <text x="640" y="187" class="val" text-anchor="middle">메모리 회수</text>

  <text x="30" y="232" class="db">여유 있는</text>
  <text x="30" y="250" class="sub" font-family="Menlo, Consolas, monospace">-Xmx</text>
  <rect x="150" y="212" width="585" height="48" rx="6" class="track"/>
  <rect x="165" y="225" width="110" height="22" rx="4" class="gauge"/>
  <rect x="165" y="225" width="44" height="22" rx="4" class="used"/>
  <rect x="305" y="225" width="110" height="22" rx="4" class="gauge"/>
  <rect x="305" y="225" width="60" height="22" rx="4" class="used"/>
  <rect x="445" y="225" width="110" height="22" rx="4" class="gauge"/>
  <rect x="445" y="225" width="76" height="22" rx="4" class="used"/>
  <rect x="585" y="225" width="110" height="22" rx="4" class="gauge"/>
  <rect x="585" y="225" width="36" height="22" rx="4" class="ok"/>
  <text x="702" y="241" class="gnote">OK</text>

  <text x="30" y="292" class="db">빠듯한</text>
  <text x="30" y="310" class="sub" font-family="Menlo, Consolas, monospace">-Xmx</text>
  <rect x="150" y="272" width="585" height="48" rx="6" class="track"/>
  <rect x="165" y="285" width="110" height="22" rx="4" class="gauge"/>
  <rect x="165" y="285" width="78" height="22" rx="4" class="used"/>
  <rect x="305" y="285" width="110" height="22" rx="4" class="gauge"/>
  <rect x="305" y="285" width="98" height="22" rx="4" class="used"/>
  <rect x="445" y="285" width="110" height="22" rx="4" class="bad"/>
  <rect x="582" y="274" width="116" height="44" rx="8" class="bad"/>
  <text x="640" y="301" class="badt" text-anchor="middle">힙이 가득 참</text>
  <line x1="557" y1="296" x2="580" y2="296" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <text x="150" y="350" class="sub">막대는 힙 사용량 — GC가 끝날 때까지 늘어나는 사용량만큼 -Xmx에 여유를 두어야 한다</text>
</svg>
