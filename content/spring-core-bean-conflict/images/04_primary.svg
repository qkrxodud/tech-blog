<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>DiscountPolicy 타입의 빈 rateDiscountPolicy와 fixDiscountPolicy가 함께 매칭될 때, 주입 코드에 아무것도 지정하지 않아도 @Primary가 붙은 rateDiscountPolicy가 주입되는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .okms { font-size: 12px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .chip { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .gscope { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .dim { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dimt { font-size: 12.5px; fill: #9ca3af; font-family: Menlo, Consolas, monospace; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .tag { font-size: 11.5px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="300" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">@Primary — 여러 빈이 매칭되면 우선권을 가짐</text>
  <rect x="30" y="76" width="230" height="110" rx="8" class="box"/>
  <text x="145" y="102" class="mb" text-anchor="middle">OrderServiceImpl</text>
  <rect x="46" y="118" width="198" height="40" rx="6" class="chip"/>
  <text x="145" y="143" class="m" text-anchor="middle">DiscountPolicy</text>
  <text x="145" y="176" class="sub" text-anchor="middle">아무것도 지정하지 않음</text>
  <rect x="320" y="66" width="410" height="130" rx="10" class="scope"/>
  <text x="340" y="90" class="t">스프링 컨테이너 — <tspan font-family="Menlo, Consolas, monospace">DiscountPolicy</tspan> 타입 빈 2개</text>
  <rect x="340" y="106" width="180" height="72" rx="8" class="ok"/>
  <text x="430" y="128" class="tag" text-anchor="middle">@Primary</text>
  <text x="430" y="150" class="okm" text-anchor="middle">rateDiscountPolicy</text>
  <text x="430" y="168" class="gnote" text-anchor="middle">우선권</text>
  <rect x="534" y="106" width="180" height="72" rx="8" class="dim"/>
  <text x="624" y="146" class="dimt" text-anchor="middle">fixDiscountPolicy</text>
  <text x="290" y="128" class="gnote" text-anchor="middle">주입</text>
  <line x1="338" y1="140" x2="248" y2="140" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="130" y="222" width="500" height="40" rx="20" class="ok"/>
  <text x="380" y="247" class="okt" text-anchor="middle">조회하는 코드는 그대로 두고 @Primary가 붙은 빈이 주입됨</text>
  <text x="30" y="290" class="foot">생성자 주입과 수정자 주입 모두 같은 방식으로 @Primary가 붙은 rateDiscountPolicy를 받습니다.</text>
</svg>
