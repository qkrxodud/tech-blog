      <path d="M-10,-7 L0,1 L10,-7" fill="none" stroke="#0f766e" stroke-width="1.5"/>
    </g>
    <g id="pkt2">
      <rect x="-11" y="-8" width="22" height="16" rx="3" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/>
      <path d="M-10,-7 L0,1 L10,-7" fill="none" stroke="#c2410c" stroke-width="1.5"/>
    </g>
    <g id="xmark"><circle r="9" fill="#ef4444"/><path d="M-4,-4 L4,4 M4,-4 L-4,4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
    <g id="vmark"><circle r="9" fill="#22c55e"/><path d="M-4.5,0 L-1.5,3.5 L4.5,-3.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="xs"><circle r="7" fill="#ef4444"/><path d="M-3,-3 L3,3 M3,-3 L-3,3" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></g>
    <g id="vs"><circle r="7" fill="#22c55e"/><path d="M-3.5,0 L-1,2.8 L3.5,-2.8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="i-card"><rect x="0" y="3" width="32" height="22" rx="4" fill="#5eead4" class="o"/><rect x="0" y="8" width="32" height="5" fill="#1f2937"/><rect x="4" y="16" width="8" height="6" rx="1.5" fill="#fbbf24" class="o" stroke-width="1"/></g>
    <g id="i-app"><rect x="0" y="0" width="30" height="30" rx="5" fill="#93c5fd" class="o"/><path d="M0,9 h30" class="o" fill="none"/><circle cx="5" cy="4.5" r="1.4" fill="#1f2937"/><circle cx="10" cy="4.5" r="1.4" fill="#1f2937"/><path d="M7,16 h16 M7,22 h11" stroke="#1e3a8a" stroke-width="1.6" stroke-linecap="round"/></g>
    <g id="i-db"><path d="M1,5 v20 a13,5 0 0 0 26,0 v-20 a13,5 0 0 1 -26,0 z" fill="#60a5fa" class="o"/><path d="M1,15 a13,5 0 0 0 26,0" fill="none" class="o"/><ellipse cx="14" cy="5" rx="13" ry="5" fill="#bfdbfe" class="o"/></g>
    <g id="i-server"><rect x="0" y="0" width="36" height="13" rx="3" fill="#cbd5e1" class="o"/><rect x="0" y="16" width="36" height="13" rx="3" fill="#cbd5e1" class="o"/><circle cx="7" cy="6.5" r="2.2" fill="#22c55e"/><circle cx="7" cy="22.5" r="2.2" fill="#22c55e"/><path d="M14,6.5 h16 M14,22.5 h16" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/></g>
    <g id="i-coin"><circle cx="12" cy="12" r="11" fill="#fbbf24" class="o"/><circle cx="12" cy="12" r="7" fill="#fcd34d" stroke="#b45309" stroke-width="1"/><text x="12" y="16.5" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">₩</text></g>
    <g id="i-key"><circle cx="8" cy="12" r="7.5" fill="#fbbf24" class="o"/><circle cx="8" cy="12" r="2.6" fill="#ffffff" class="o" stroke-width="1.2"/><path d="M15.5,12 H30 V17.5 M25,12 V16.5" fill="none" class="o" stroke-width="2"/></g>
    <g id="i-clock"><circle cx="14" cy="14" r="13" fill="#fde68a" class="o"/><path d="M14,7 V14 L20,18" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/></g>
    <g id="i-chips"><rect x="0" y="4" width="13" height="14" rx="4" fill="#e5e7eb" class="o"/><rect x="21" y="4" width="13" height="14" rx="4" fill="#86efac" class="o"/><path d="M14,11 h6" class="o" fill="none"/><path d="M17,8 l3,3 l-3,3" class="o" fill="none"/></g>
    <g id="i-plane"><path d="M1,13 L31,1 L23,29 L15,19 Z" fill="#fdba74" class="o"/><path d="M15,19 L31,1 L11,16 Z" fill="#fb923c" class="o"/></g>
    <g id="i-doc"><path d="M0,0 h18 l8,8 v26 h-26 z" fill="#ffffff" class="o"/><path d="M18,0 v8 h8" fill="#e5e7eb" class="o"/><circle cx="20" cy="26" r="8" fill="#22c55e" class="o"/><path d="M16.5,26 l2.5,2.5 l4.5,-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5,10 h9 M5,16 h7" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/></g>
    <g id="i-table"><rect x="0" y="0" width="30" height="26" rx="3" fill="#ffffff" class="o"/><rect x="0" y="0" width="30" height="7" rx="3" fill="#60a5fa" class="o"/><path d="M0,13.5 h30 M0,20 h30 M11,7 v19" stroke="#1f2937" stroke-width="1.2"/></g>
    <g id="i-search"><circle cx="11" cy="11" r="9" fill="#bae6fd" class="o"/><path d="M18,18 L27,27" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/></g>
    <g id="i-chart"><rect x="0" y="16" width="7" height="12" fill="#93c5fd" class="o"/><rect x="10" y="8" width="7" height="20" fill="#60a5fa" class="o"/><rect x="20" y="2" width="7" height="26" fill="#2563eb" class="o"/></g>
    <g id="i-bell"><path d="M14,3 C8.5,3 6,7.5 6,13 V19 L3,23 H25 L22,19 V13 C22,7.5 19.5,3 14,3 Z" fill="#fde047" class="o"/><circle cx="14" cy="26" r="3" fill="#f59e0b" class="o"/></g>
    <g id="i-warn"><path d="M14,2 L27,25 H1 Z" fill="#fca5a5" class="o"/><path d="M14,10 V17" stroke="#7f1d1d" stroke-width="2.2" stroke-linecap="round"/><circle cx="14" cy="21" r="1.5" fill="#7f1d1d"/></g>
    <g id="i-lock"><path d="M7,12 V8 a7,7 0 0 1 14,0 V12" fill="none" class="o" stroke-width="2.2"/><rect x="3" y="12" width="22" height="16" rx="3" fill="#fbbf24" class="o"/><circle cx="14" cy="20" r="2.4" fill="#1f2937"/></g>
    <g id="i-wait"><path d="M3,1 H23 M3,29 H23" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><path d="M5,2 C5,10 13,12 13,15 C13,18 5,20 5,28 H21 C21,20 13,18 13,15 C13,12 21,10 21,2 Z" fill="#e0e7ff" class="o"/><path d="M8,26 C9,22 13,21 13,19 C13,21 17,22 18,26 Z" fill="#f59e0b"/></g>
    <g id="i-box"><path d="M2,9 L15,3 L28,9 V23 L15,29 L2,23 Z" fill="#fcd34d" class="o"/><path d="M2,9 L15,15 L28,9 M15,15 V29" fill="none" class="o"/><path d="M8.5,6 L21.5,12" stroke="#b45309" stroke-width="1.5"/></g>
    <g id="i-ticket"><path d="M1,6 H29 V12 a3,3 0 0 0 0,6 V24 H1 V18 a3,3 0 0 0 0,-6 Z" fill="#f9a8d4" class="o"/><path d="M10,7 V23" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="2 2"/><text x="19.5" y="19" font-size="9" font-weight="700" fill="#831843" text-anchor="middle">%</text></g>
    <g id="i-point"><circle cx="13" cy="13" r="12" fill="#a7f3d0" class="o"/><circle cx="13" cy="13" r="8" fill="#6ee7b7" stroke="#047857" stroke-width="1"/><text x="13" y="17.5" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">P</text></g>
  <g id="i-kafka"><rect x="0" y="2" width="30" height="8" rx="2" fill="#fde68a" class="o"/><rect x="0" y="12" width="30" height="8" rx="2" fill="#fdba74" class="o"/><rect x="0" y="22" width="30" height="8" rx="2" fill="#fde68a" class="o"/><path d="M8,2 v8 M16,2 v8 M8,12 v8 M16,12 v8 M22,12 v8 M8,22 v8" stroke="#1f2937" stroke-width="1"/></g>
    <g id="i-bolt"><path d="M15,1 L3,17 H12 L9,29 L23,11 H14 Z" fill="#fde047" class="o"/></g>
    <g id="i-outbox"><rect x="0" y="0" width="30" height="26" rx="3" fill="#ffffff" class="o"/><rect x="0" y="0" width="30" height="7" rx="3" fill="#86efac" class="o"/><path d="M0,13.5 h30 M0,20 h30 M11,7 v19" stroke="#1f2937" stroke-width="1.2"/></g>
  </defs>

  <rect width="760" height="524" fill="#ffffff"/>
  <text x="24" y="28" class="h">12장 완성 코드 — 지표를 읽는 길과 매일 정리하는 길</text>
  <text x="24" y="48" class="gs" style="font-size:11.5px">원고 구현 5·6번 항목 · 하루치 대사(매일 4시, 어제)와 정리(매일 4시 30분)는 따로 돎</text>
  <rect x="14" y="62" width="734" height="44" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <use href="#i-clock" transform="translate(26,70) scale(0.95)"/>
  <text x="62" y="85" class="t2">4시 — 하루치 대사</text>
  <text x="62" y="100" class="gs" style="font-size:10.5px">Asia/Seoul · 어제 거래 내역과 우리 결제</text>
  <use href="#i-clock" transform="translate(392,70) scale(0.95)"/>
  <text x="428" y="85" class="t2">4시 30분 — 정리</text>
  <text x="428" y="100" class="gs" style="font-size:10.5px">결제 서버·주문 서비스·재고 서비스 각각</text>
  <rect x="14" y="128" width="362" height="384" rx="16" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="26" y="116" width="200" height="24" rx="6" fill="#5b7194"/><text x="126" y="132.5" class="tab" text-anchor="middle">지표 — 읽을 때마다 새로 셈</text>
  <rect x="28" y="146" width="110" height="30" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/><text x="83" y="165" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:10.5px">운영자</text>
  <line x1="140" y1="161" x2="162" y2="161" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="164" y="146" width="198" height="30" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><text x="263" y="165" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:10.5px"><tspan class="m">/actuator/metrics/{이름}</tspan></text>
  <text x="28" y="194" class="gs" style="font-size:10.5px">수집기(Prometheus 등)는 붙이지 않음</text>
  <rect x="28" y="206" width="334" height="124" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <use href="#i-app" transform="translate(38,214) scale(0.6)"/>
  <text x="64" y="228" class="t2" style="font-size:12px">결제 서버 <tspan class="m">PaymentMetrics</tspan></text>
  <text x="40" y="250" class="s2" style="font-size:10px;fill:#1f2937"><tspan class="m">payment.outbox.unsent</tspan> ← <tspan class="m">countUnsent</tspan></text><text x="40" y="267" class="s2" style="font-size:10px;fill:#1f2937"><tspan class="m">…oldest-unsent-age</tspan> ← <tspan class="m">findOldestUnsentOccurredAt</tspan></text><text x="40" y="284" class="s2" style="font-size:10px;fill:#1f2937"><tspan class="m">…open-mismatches</tspan> ← <tspan class="m">countNeedingReview</tspan></text><text x="40" y="301" class="s2" style="font-size:10px;fill:#1f2937"><tspan class="m">payment.pg.circuit.state</tspan> ← 차단기 <tspan class="m">getState</tspan></text>
  <text x="40" y="322" class="oks" style="font-size:10.5px">DB 집계 한 문장 · HTTP로 열림</text>
  <rect x="28" y="340" width="162" height="66" rx="10" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <text x="40" y="358" class="t2" style="font-size:12px">재고 서비스</text>
  <text x="36" y="376" class="s2" style="font-size:8px;fill:#1f2937"><tspan class="m">inventory.dead-letter.pending</tspan></text>
  <text x="40" y="395" class="oks" style="font-size:10.5px">HTTP로 열림</text>
  <rect x="200" y="340" width="162" height="66" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="212" y="358" class="gt" style="font-size:12px">주문 서비스</text>
  <text x="212" y="376" class="gs" style="font-size:9.5px"><tspan class="m">order.dead-letter.pending</tspan></text>
  <use href="#xs" x="219" y="391"/>
  <text x="231" y="395" class="bads" style="font-size:10px">웹 서버 없음 — 밖으로 안 냄</text>
  <text x="28" y="428" class="s2" style="font-size:10.5px;fill:#1f2937;font-weight:700">두 서비스 <tspan class="m">KafkaDeadLetterBacklog.pending</tspan>(브로커 조회, 5초 제한)</text>
  <text x="28" y="446" class="s2" style="font-size:10px;fill:#1f2937"><tspan class="m">partitionsFor</tspan> → <tspan class="m">beginningOffsets</tspan> → <tspan class="m">endOffsets</tspan> → <tspan class="m">committed</tspan></text>
  <text x="28" y="468" class="gs" style="font-size:10.5px">파티션마다 (실패 모음 토픽 끝 − 다시 넣기 그룹이 커밋한 자리)를 더함</text>
  <text x="28" y="485" class="gs" style="font-size:10.5px">11장 다시 넣기가 한 건마다 커밋 → 다시 넣은 메시지는 수에서 빠짐</text>
  <rect x="388" y="128" width="360" height="384" rx="16" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="400" y="116" width="196" height="24" rx="6" fill="#5b7194"/><text x="498" y="132.5" class="tab" text-anchor="middle">정리 — 매일 4시 30분</text>
  <rect x="400" y="146" width="336" height="120" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="412" y="166" class="t2" style="font-size:12px">결제 서버</text>
  <text x="412" y="186" class="s2" style="font-size:9.5px;fill:#1f2937"><tspan class="m">OutboxCleanupScheduler.cleanUp</tspan> → <tspan class="m">OutboxCleanup.cleanUp</tspan></text><text x="412" y="201" class="s2" style="font-size:9.5px;fill:#1f2937">→ <tspan class="m">ExclusiveJobRunner.run(payment-outbox-cleanup)</tspan></text><text x="412" y="216" class="s2" style="font-size:9.5px;fill:#1f2937">→ <tspan class="m">deleteSentBefore</tspan> 되풀이</text>
  <text x="412" y="235" class="s2" style="font-size:10.5px;fill:#1f2937;font-weight:700">7일 전에 보낸 <tspan class="m">payment_outbox</tspan> 줄</text>
  <text x="412" y="252" class="oks" style="font-size:10px">보내지 않은 줄은 지우지 않음 · 작업 잠금으로 한 대만</text>
  <rect x="400" y="278" width="336" height="100" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="412" y="298" class="t2" style="font-size:12px">주문 서비스</text>
  <text x="412" y="318" class="s2" style="font-size:9.5px;fill:#1f2937"><tspan class="m">ReceivedEventCleanupScheduler.cleanUp</tspan></text><text x="412" y="333" class="s2" style="font-size:9.5px;fill:#1f2937">→ <tspan class="m">ReceivedEventCleanup.cleanUp</tspan> → <tspan class="m">deleteReceivedBefore</tspan></text>
  <text x="412" y="352" class="s2" style="font-size:10.5px;fill:#1f2937;font-weight:700">14일 전에 받은 <tspan class="m">received_payment_event</tspan></text>
  <rect x="400" y="390" width="336" height="100" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="412" y="410" class="t2" style="font-size:12px">재고 서비스</text>
  <text x="412" y="430" class="s2" style="font-size:9.5px;fill:#1f2937"><tspan class="m">ProcessedCommandCleanupScheduler.cleanUp</tspan></text><text x="412" y="445" class="s2" style="font-size:9.5px;fill:#1f2937">→ <tspan class="m">ProcessedCommandCleanup</tspan></text>
