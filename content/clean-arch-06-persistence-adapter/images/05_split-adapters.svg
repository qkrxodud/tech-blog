  <rect x="30" y="62" width="205" height="246" rx="8" class="pkg"/>
  <text x="42" y="82" class="pk">application.service</text>
  <rect x="275" y="62" width="210" height="246" rx="8" class="pkg"/>
  <text x="287" y="82" class="pk">application.port.out</text>
  <rect x="525" y="62" width="205" height="246" rx="8" class="pkg"/>
  <text x="537" y="82" class="pk">adapter.out.persistence</text>
  <rect x="290" y="98" width="180" height="60" rx="8" class="ok"/>
  <text x="380.0" y="124.5" class="st" text-anchor="middle">«interface»</text>
  <text x="380.0" y="139.5" class="mok" text-anchor="middle">LoadAccountPort</text>
  <rect x="290" y="174" width="180" height="60" rx="8" class="ok"/>
  <text x="380.0" y="193.0" class="st" text-anchor="middle">«interface»</text>
  <text x="380.0" y="208.0" class="mok" text-anchor="middle">UpdateAccount</text>
  <text x="380.0" y="223.0" class="mok" text-anchor="middle">StatePort</text>
  <rect x="290" y="250" width="180" height="60" rx="8" class="ok"/>
  <text x="380.0" y="276.5" class="st" text-anchor="middle">«interface»</text>
  <text x="380.0" y="291.5" class="mok" text-anchor="middle">CreateAccountPort</text>
  <rect x="40" y="120" width="175" height="48" rx="8" class="box"/>
  <text x="127.5" y="148.0" class="m" text-anchor="middle">SendMoneyService</text>
  <rect x="40" y="236" width="175" height="48" rx="8" class="box"/>
  <text x="127.5" y="256.5" class="m" text-anchor="middle">RegisterAccount</text>
  <text x="127.5" y="271.5" class="m" text-anchor="middle">Service</text>
  <path d="M215,144 L255,144 L255,128 L288,128" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
  <path d="M215,144 L255,144 L255,204 L288,204" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
  <path d="M215,260 L255,260 L255,280 L288,280" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
  <rect x="540" y="116" width="175" height="104" rx="8" class="hold"/>
  <text x="627.5" y="157.0" class="m" text-anchor="middle">Account</text>
  <text x="627.5" y="172.0" class="m" text-anchor="middle">Persistence</text>
  <text x="627.5" y="187.0" class="m" text-anchor="middle">Adapter</text>
  <rect x="540" y="250" width="175" height="60" rx="8" class="hold"/>
  <text x="627.5" y="276.5" class="m" text-anchor="middle">User</text>
  <text x="627.5" y="291.5" class="m" text-anchor="middle">PersistenceAdapter</text>
  <path d="M540,128 L471,128" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tri)"/>
  <path d="M540,204 L471,204" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tri)"/>
  <path d="M540,280 L471,280" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tri)"/>
  <line x1="430" y1="334" x2="470" y2="334" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="478" y="338" class="lbl">호출</text>
  <line x1="540" y1="334" x2="582" y2="334" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tri)"/>
  <text x="590" y="338" class="lbl">구현</text>
  <text x="30" y="338" class="foot">포트만 구현돼 있으면 어떤 클래스가 구현하는지는 상관없습니다.</text>
</svg>
