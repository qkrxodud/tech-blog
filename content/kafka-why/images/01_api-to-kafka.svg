<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>처음에는 상대 시스템과 검수 웹 서비스가 API로 데이터를 주고받기로 했지만, 회의 뒤 카프카로 데이터를 받고 검수 결과도 카프카로 보내기로 바뀌어 검수 서비스가 컨슈머와 프로듀서를 모두 맡게 된 모습</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .chip { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
    .grp { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="150" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">처음 스펙 — API로 데이터를 주고받음</text>
  <rect x="30" y="62" width="160" height="80" rx="8" class="box"/>
  <text x="110" y="98" class="t" text-anchor="middle">상대 시스템</text>
  <text x="110" y="118" class="sub" text-anchor="middle">걸러진 건을 넘겨줌</text>
  <rect x="560" y="62" width="170" height="80" rx="8" class="box"/>
  <text x="645" y="98" class="t" text-anchor="middle">검수 웹 서비스</text>
  <text x="645" y="118" class="sub" text-anchor="middle">상품 검수</text>
  <line x1="194" y1="88" x2="556" y2="88" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="375" y="80" class="val" text-anchor="middle">데이터 전달 (API)</text>
  <line x1="556" y1="120" x2="194" y2="120" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="375" y="138" class="val" text-anchor="middle">검수 처리 결과 (API)</text>
  <rect x="10" y="176" width="740" height="214" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="208" class="h">회의 뒤 — 카프카로 받고, 결과도 카프카로 돌려줌</text>
  <rect x="30" y="246" width="160" height="80" rx="8" class="box"/>
  <text x="110" y="282" class="t" text-anchor="middle">상대 시스템</text>
  <text x="110" y="302" class="sub" text-anchor="middle">걸러진 건을 넘겨줌</text>
  <rect x="300" y="246" width="160" height="80" rx="8" class="hold"/>
  <text x="380" y="282" class="t" text-anchor="middle">카프카</text>
  <text x="380" y="302" class="sub" text-anchor="middle">데이터와 결과를 전달</text>
  <rect x="560" y="226" width="170" height="130" rx="8" class="box"/>
  <text x="645" y="248" class="t" text-anchor="middle">검수 웹 서비스</text>
  <rect x="576" y="260" width="138" height="36" rx="8" class="ok"/>
  <text x="645" y="283" class="okt" text-anchor="middle">컨슈머</text>
  <rect x="576" y="306" width="138" height="36" rx="8" class="ok"/>
  <text x="645" y="329" class="okt" text-anchor="middle">프로듀서</text>
  <line x1="194" y1="286" x2="296" y2="286" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="245" y="276" class="val" text-anchor="middle">걸러진 건</text>
  <line x1="462" y1="278" x2="572" y2="278" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="517" y="268" class="val" text-anchor="middle">가져감</text>
  <line x1="572" y1="324" x2="464" y2="324" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="517" y="342" class="val" text-anchor="middle">검수 결과</text>
  <text x="30" y="376" class="foot">검수 서비스가 컨슈머(데이터 수신)와 프로듀서(결과 전송) 역할을 모두 맡게 됩니다.</text>
</svg>
