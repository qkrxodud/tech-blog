<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>취소를 기록하는 세 선택지 — 상태만 바꾸는 5장 출발 코드는 payment의 status를 APPROVAL_CANCELED로 바꿀 뿐 취소 이력과 남은 금액이 없어 37개 중 29개가 실패했고, 결제 행에 취소 합계(또는 남은 금액) 칸만 두는 방식은 취소 한 건마다의 키와 결과를 둘 곳이 없다고 판단해 구현하지 않았으며, 이 장에서 고른 payment_cancel은 취소 한 건마다 idempotency_key, request_digest, amount, status, transaction_key, balance_after, requested_at을 한 줄로 남기고 남은 금액은 결제 금액에서 DONE 취소의 합을 뺀다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #4b5563; }
    .m { font-family: Menlo, Consolas, monospace; }
    .lbl { font-size: 12px; fill: #4b5563; }
    .tab { font-size: 12.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .badt { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .bads { font-size: 12px; fill: #b91c1c; }
    .okt { font-size: 13px; font-weight: 700; fill: #15803d; }
    .oks { font-size: 12px; fill: #15803d; }
    .gt { font-size: 13px; font-weight: 700; fill: #6b7280; }
    .gs { font-size: 12px; fill: #6b7280; }
    .ot { font-size: 13px; font-weight: 700; fill: #c2410c; }
    .os { font-size: 12px; fill: #c2410c; }
    .bt { font-size: 13px; font-weight: 700; fill: #1e3a8a; }
    .o { stroke: #1f2937; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .life { stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .run { stroke-dasharray: 5 4; animation: run 0.9s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -18; } }
    @media (prefers-reduced-motion: reduce) { .run { animation: none; } .anim { display: none; } }
  </style>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="aor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
    <marker id="abl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <g id="pkt">
      <rect x="-11" y="-8" width="22" height="16" rx="3" fill="#2dd4bf" stroke="#0f766e" stroke-width="1.5"/>
      <path d="M-10,-7 L0,1 L10,-7" fill="none" stroke="#0f766e" stroke-width="1.5"/>
    </g>
    <g id="pkt2">
      <rect x="-11" y="-8" width="22" height="16" rx="3" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/>
      <path d="M-10,-7 L0,1 L10,-7" fill="none" stroke="#c2410c" stroke-width="1.5"/>
    </g>
    <g id="xmark"><circle r="9" fill="#ef4444"/><path d="M-4,-4 L4,4 M4,-4 L-4,4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
    <g id="vmark"><circle r="9" fill="#22c55e"/><path d="M-4.5,0 L-1.5,3.5 L4.5,-3.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="xs"><circle r="7" fill="#ef4444"/><path d="M-3,-3 L3,3 M3,-3 L-3,3" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></g>
    <g id="vs"><circle r="7" fill="#22c55e"/><path d="M-3.5,0 L-1,2.8 L3.5,-2.8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="i-card"><rect x="0" y="3" width="32" height="22" rx="4" fill="#5eead4" class="o"/><rect x="0" y="8" width="32" height="5" fill="#1f2937"/><rect x="4" y="16" width="8" height="6" rx="1.5" fill="#fbbf24" class="o" stroke-width="1"/></g>
    <g id="i-app"><rect x="0" y="0" width="30" height="30" rx="5" fill="#93c5fd" class="o"/><path d="M0,9 h30" class="o" fill="none"/><circle cx="5" cy="4.5" r="1.4" fill="#1f2937"/><circle cx="10" cy="4.5" r="1.4" fill="#1f2937"/><path d="M7,16 h16 M7,22 h11" stroke="#1e3a8a" stroke-width="1.6" stroke-linecap="round"/></g>
    <g id="i-db"><path d="M1,5 v20 a13,5 0 0 0 26,0 v-20 a13,5 0 0 1 -26,0 z" fill="#60a5fa" class="o"/><path d="M1,15 a13,5 0 0 0 26,0" fill="none" class="o"/><ellipse cx="14" cy="5" rx="13" ry="5" fill="#bfdbfe" class="o"/></g>
    <g id="i-server"><rect x="0" y="0" width="36" height="13" rx="3" fill="#cbd5e1" class="o"/><rect x="0" y="16" width="36" height="13" rx="3" fill="#cbd5e1" class="o"/><circle cx="7" cy="6.5" r="2.2" fill="#22c55e"/><circle cx="7" cy="22.5" r="2.2" fill="#22c55e"/><path d="M14,6.5 h16 M14,22.5 h16" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/></g>
    <g id="i-coin"><circle cx="12" cy="12" r="11" fill="#fbbf24" class="o"/><circle cx="12" cy="12" r="7" fill="#fcd34d" stroke="#b45309" stroke-width="1"/><text x="12" y="16.5" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">₩</text></g>
    <g id="i-key"><circle cx="8" cy="12" r="7.5" fill="#fbbf24" class="o"/><circle cx="8" cy="12" r="2.6" fill="#ffffff" class="o" stroke-width="1.2"/><path d="M15.5,12 H30 V17.5 M25,12 V16.5" fill="none" class="o" stroke-width="2"/></g>
    <g id="i-clock"><circle cx="14" cy="14" r="13" fill="#fde68a" class="o"/><path d="M14,7 V14 L20,18" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/></g>
    <g id="i-chips"><rect x="0" y="4" width="13" height="14" rx="4" fill="#e5e7eb" class="o"/><rect x="21" y="4" width="13" height="14" rx="4" fill="#86efac" class="o"/><path d="M14,11 h6" class="o" fill="none"/><path d="M17,8 l3,3 l-3,3" class="o" fill="none"/></g>
    <g id="i-plane"><path d="M1,13 L31,1 L23,29 L15,19 Z" fill="#fdba74" class="o"/><path d="M15,19 L31,1 L11,16 Z" fill="#fb923c" class="o"/></g>
    <g id="i-doc"><path d="M0,0 h18 l8,8 v26 h-26 z" fill="#ffffff" class="o"/><path d="M18,0 v8 h8" fill="#e5e7eb" class="o"/><circle cx="20" cy="26" r="8" fill="#22c55e" class="o"/><path d="M16.5,26 l2.5,2.5 l4.5,-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5,10 h9 M5,16 h7" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/></g>
    <g id="i-table"><rect x="0" y="0" width="30" height="26" rx="3" fill="#ffffff" class="o"/><rect x="0" y="0" width="30" height="7" rx="3" fill="#60a5fa" class="o"/><path d="M0,13.5 h30 M0,20 h30 M11,7 v19" stroke="#1f2937" stroke-width="1.2"/></g>
    <g id="i-search"><circle cx="11" cy="11" r="9" fill="#bae6fd" class="o"/><path d="M18,18 L27,27" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/></g>
    <g id="i-chart"><rect x="0" y="16" width="7" height="12" fill="#93c5fd" class="o"/><rect x="10" y="8" width="7" height="20" fill="#60a5fa" class="o"/><rect x="20" y="2" width="7" height="26" fill="#2563eb" class="o"/></g>
  </defs>
  <rect width="760" height="446" fill="#ffffff"/>
  <text x="24" y="30" class="h">취소를 어떻게 기록할까 — 세 선택지</text>
  <rect x="16" y="46" width="236" height="50" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="30" y="67" class="t2">상태만 바꾸기</text>
  <text x="30" y="85" class="gs">5장 출발 코드</text>
  <rect x="262" y="46" width="236" height="50" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="276" y="67" class="gt">결제 행에 합계만 두기</text>
  <text x="276" y="85" class="gs">구현해서 돌려 보지 않음</text>
  <rect x="508" y="46" width="236" height="50" rx="10" fill="#e3f3e6" stroke="#16a34a" stroke-width="2"/>
  <text x="522" y="67" class="t2">취소마다 한 줄 남기기</text>
  <text x="522" y="85" class="oks">이 장에서 고름</text>
  <rect x="16" y="106" width="236" height="226" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <use href="#i-table" x="30" y="118"/>
  <text x="70" y="136" class="t2"><tspan class="m">payment</tspan></text>
  <rect x="30" y="156" width="208" height="24" rx="5" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="40" y="172" class="s"><tspan class="m">amount</tspan> 15000</text>
  <rect x="30" y="186" width="208" height="24" rx="5" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="40" y="202" class="s"><tspan class="m">status</tspan> <tspan class="m">APPROVED</tspan></text>
  <rect x="30" y="216" width="208" height="24" rx="5" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="40" y="232" class="bads">→ <tspan class="m">APPROVAL_CANCELED</tspan></text>
  <text x="30" y="268" class="gs">취소 이력·남은 금액이 없음</text>
  <text x="30" y="287" class="gs">금액과 상관없이 <tspan class="m">cancel()</tspan> 전이</text>
  <text x="30" y="306" class="gs">→ 전액 취소만 할 수 있음</text>
  <rect x="262" y="106" width="236" height="226" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <use href="#i-table" x="276" y="118"/>
  <text x="316" y="136" class="gt"><tspan class="m">payment</tspan></text>
  <rect x="276" y="156" width="208" height="24" rx="5" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="286" y="172" class="gs"><tspan class="m">amount</tspan> 15000</text>
  <rect x="276" y="186" width="208" height="24" rx="5" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="286" y="202" class="gs"><tspan class="m">status</tspan></text>
  <rect x="276" y="216" width="208" height="24" rx="5" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="286" y="232" class="gs">취소 합계(또는 남은 금액) 칸</text>
  <text x="276" y="268" class="gs">취소 한 건마다의 키·결과·</text>
  <text x="276" y="287" class="gs"><tspan class="m">transactionKey</tspan>를 둘 곳이 없음</text>
  <text x="276" y="306" class="gs">(코드로 확인하지 않은 판단)</text>
  <rect x="508" y="106" width="236" height="226" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <use href="#i-table" x="522" y="118"/>
  <text x="562" y="136" class="t2"><tspan class="m">payment_cancel</tspan></text>
  <rect x="522" y="150" width="208" height="17" rx="4" fill="#e6edfa" stroke="#7b93c9" stroke-width="1"/>
  <text x="530" y="163" class="s" style="fill: #1e3a8a"><tspan class="m">idempotency_key</tspan></text>
  <rect x="522" y="169" width="208" height="17" rx="4" fill="#e6edfa" stroke="#7b93c9" stroke-width="1"/>
  <text x="530" y="182" class="s" style="fill: #1e3a8a"><tspan class="m">request_digest</tspan></text>
  <rect x="522" y="188" width="208" height="17" rx="4" fill="#e6edfa" stroke="#7b93c9" stroke-width="1"/>
  <text x="530" y="201" class="s" style="fill: #1e3a8a"><tspan class="m">amount</tspan></text>
  <rect x="522" y="207" width="208" height="17" rx="4" fill="#e6edfa" stroke="#7b93c9" stroke-width="1"/>
  <text x="530" y="220" class="s" style="fill: #1e3a8a"><tspan class="m">status</tspan></text>
  <rect x="522" y="226" width="208" height="17" rx="4" fill="#e6edfa" stroke="#7b93c9" stroke-width="1"/>
  <text x="530" y="239" class="s" style="fill: #1e3a8a"><tspan class="m">transaction_key</tspan></text>
  <rect x="522" y="245" width="208" height="17" rx="4" fill="#e6edfa" stroke="#7b93c9" stroke-width="1"/>
  <text x="530" y="258" class="s" style="fill: #1e3a8a"><tspan class="m">balance_after</tspan></text>
  <rect x="522" y="264" width="208" height="17" rx="4" fill="#e6edfa" stroke="#7b93c9" stroke-width="1"/>
  <text x="530" y="277" class="s" style="fill: #1e3a8a"><tspan class="m">requested_at</tspan></text>
  <rect x="522" y="290" width="208" height="32" rx="6" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.2"/>
  <text x="532" y="311" class="oks">남은 금액 = 결제 금액 − <tspan class="m">DONE</tspan> 합</text>
  <line x1="134.0" y1="334" x2="134.0" y2="352" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#agy)"/>
  <rect x="16" y="354" width="236" height="56" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="38" y="375"/>
  <text x="54" y="380" class="badt">5장 테스트 37개 중 29개 실패</text>
  <text x="54" y="399" class="bads">부분 취소 한 번에 결제가 닫힘</text>
  <line x1="380.0" y1="334" x2="380.0" y2="352" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#agy)"/>
  <rect x="262" y="354" width="236" height="56" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="276" y="380" class="gt">비교로 돌리지 않음</text>
  <text x="276" y="399" class="gs">테스트로 확인한 차이 없음</text>
  <line x1="626.0" y1="334" x2="626.0" y2="352" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#agy)"/>
  <rect x="508" y="354" width="236" height="56" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="530" y="375"/>
  <text x="546" y="380" class="okt">실패하던 29개 모두 통과</text>
  <text x="546" y="399" class="oks">5장 완성 코드</text>
  <text x="24" y="434" class="gs">회색 점선은 구현하지 않은 선택지 · <tspan class="m">payment_cancel</tspan>의 <tspan class="m">request_digest</tspan>·<tspan class="m">balance_after</tspan>는 결정 3, <tspan class="m">requested_at</tspan>은 결정 4에서 더함</text>
</svg>
