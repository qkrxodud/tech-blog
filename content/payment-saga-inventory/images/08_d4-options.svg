<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 4 선택지 비교 격자 — 재고 서비스 쪽에서 답만 늦음(이미 잡음), 처리 중(커밋 전), 요청이 늦게 도착, 받지 못함의 네 경우마다, 닫고 해제를 보내는 운영은 해제가 돌려주거나, 같은 예약 줄을 기다렸다 돌려주거나, 먼저 남은 해제 줄에 막히거나, 받지 못함은 계약에 없어 시험하지 않았고 운영 칸은 빈 해제 줄만 남는다는 결정 4 커밋의 이유(재고 5)이며, 앞의 세 경우는 모두 재고 5다. 조회로 확인하는 비교는 답만 늦으면 잡힌 예약을 보고 승인까지 가고, 처리 중이면 커밋 전이라 보이지 않아 해제 없이 닫아 재고 3, 요청이 늦게 도착하면 조회도 붙잡혀 해제를 보냄. 실패로만 보는 비교는 앞의 세 경우 모두 재고 3임. 계약 실패는 0·1·3, 측정 어긋난 재고는 0·0·−10, 늦음 응답 중앙은 1027~1038·2040~2045·1029~1035ms</title>
