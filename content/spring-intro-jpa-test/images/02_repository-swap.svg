<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>MemberService는 MemberRepository 인터페이스에 의존하고, SpringConfig의 memberRepository()에서 Memory, Jdbc, JdbcTemplate 구현체는 주석 처리하고 EntityManager를 넘긴 JpaMemberRepository를 반환하는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .op { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mg { font-size: 12px; fill: #9ca3af; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 12px; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 12px; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="400" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">구현체 교체 — SpringConfig의 <tspan font-family="Menlo, Consolas, monospace">memberRepository()</tspan>만 변경</text>
  <rect x="30" y="86" width="200" height="56" rx="8" class="box"/>
  <text x="130" y="110" class="op" text-anchor="middle">MemberService</text>
  <text x="130" y="129" class="sub" text-anchor="middle">코드는 그대로</text>
  <line x1="130" y1="143" x2="130" y2="186" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="140" y="169" class="sub">의존</text>
  <rect x="30" y="188" width="200" height="56" rx="8" class="hold"/>
  <text x="130" y="212" class="op" text-anchor="middle">MemberRepository</text>
  <text x="130" y="231" class="sub" text-anchor="middle">인터페이스</text>
  <text x="300" y="74" class="sub"><tspan font-family="Menlo, Consolas, monospace">memberRepository()</tspan>가 반환하는 구현체</text>
  <rect x="300" y="86" width="430" height="44" rx="8" class="wait"/>
  <text x="312" y="112" class="mg" style="font-size:11px">// return new MemoryMemberRepository();</text>
  <text x="718" y="112" class="sub" text-anchor="end">주석</text>
  <line x1="299" y1="108" x2="233" y2="216" stroke="#c4c8ce" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="300" y="138" width="430" height="44" rx="8" class="wait"/>
  <text x="312" y="164" class="mg" style="font-size:11px">// return new JdbcMemberRepository(dataSource);</text>
  <text x="718" y="164" class="sub" text-anchor="end">주석</text>
  <line x1="299" y1="160" x2="233" y2="216" stroke="#c4c8ce" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="300" y="190" width="430" height="44" rx="8" class="wait"/>
  <text x="312" y="216" class="mg" style="font-size:11px">// return new JdbcTemplateMemberRepository(dataSource);</text>
  <text x="718" y="216" class="sub" text-anchor="end">주석</text>
  <line x1="299" y1="212" x2="233" y2="216" stroke="#c4c8ce" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="300" y="242" width="430" height="44" rx="8" class="ok"/>
  <text x="312" y="268" class="okc">return new JpaMemberRepository(em);</text>
  <text x="718" y="268" class="okt" text-anchor="end">반환</text>
  <line x1="299" y1="264" x2="234" y2="222" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="244" y="268" class="gnote">구현</text>
  <rect x="300" y="322" width="250" height="52" rx="8" class="hold"/>
  <text x="425" y="344" class="op" text-anchor="middle">EntityManager</text>
  <text x="425" y="363" class="sub" text-anchor="middle">SpringConfig 생성자로 주입받아 전달</text>
  <line x1="425" y1="321" x2="425" y2="289" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="396" class="foot">MemberService와 MemberRepository는 그대로 두고, SpringConfig에서 반환하는 구현체만 바뀝니다.</text>
</svg>
