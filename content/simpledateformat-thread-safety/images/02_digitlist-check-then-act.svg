<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>DigitList.append: 스레드 A가 길이 검사를 통과한 뒤 스레드 B가 append로 count를 배열 길이까지 올려, A의 digits[count++]가 범위를 벗어나 ArrayIndexOutOfBoundsException이 발생하는 순서</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .tag { font-size: 12px; font-weight: 700; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="340" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">DigitList.append — 검사와 사용 사이에 count가 바뀜</text>
  <text x="240" y="68" class="step" text-anchor="middle">1. A 길이 검사</text>
  <text x="440" y="68" class="step" text-anchor="middle">2. B append</text>
  <text x="640" y="68" class="step" text-anchor="middle">3. A 배열에 쓰기</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">스레드 A</text>
  <text x="30" y="126" class="sub">숫자 파싱 중</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="155" y="88" width="170" height="48" rx="8" class="box"/>
  <text x="240" y="108" class="t" text-anchor="middle">길이 검사 통과</text>
  <text x="240" y="127" class="val" text-anchor="middle">3 == 4 아님 → 확장 안 함</text>
  <rect x="555" y="88" width="170" height="48" rx="8" class="bad"/>
  <text x="640" y="108" class="badc" text-anchor="middle">digits[count++]</text>
  <text x="640" y="127" class="note" text-anchor="middle">digits[4] → AIOOBE</text>
  <text x="30" y="168" class="lane">스레드 B</text>
  <text x="30" y="186" class="sub">같은 DigitList 사용</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="355" y="148" width="170" height="48" rx="8" class="box"/>
  <text x="440" y="168" class="op" text-anchor="middle">append(digit)</text>
  <text x="440" y="187" class="val" text-anchor="middle">count 3 → 4</text>
  <text x="30" y="229" class="db">count / 길이</text>
  <rect x="195" y="208" width="90" height="32" rx="6" class="dbbox"/>
  <text x="240" y="229" class="db" text-anchor="middle">3 / 4</text>
  <rect x="395" y="208" width="90" height="32" rx="6" class="bad"/>
  <text x="440" y="229" class="badt" text-anchor="middle">4 / 4</text>
  <rect x="595" y="208" width="90" height="32" rx="6" class="bad"/>
  <text x="640" y="229" class="badt" text-anchor="middle">4 / 4</text>
  <line x1="440" y1="196" x2="440" y2="206" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="640" y1="207" x2="640" y2="139" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="150" y="268" class="sub">예시: 배열 길이 4, count 3에서 시작한 경우</text>
  <rect x="30" y="284" width="700" height="30" rx="15" class="bad"/>
  <text x="380" y="304" class="badt" text-anchor="middle">check-then-act 경쟁 조건 — 검사한 뒤 사용하기 전에 다른 스레드가 상태를 바꿈</text>

</svg>
