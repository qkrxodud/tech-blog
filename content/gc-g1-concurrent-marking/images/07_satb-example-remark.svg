  <rect width="760" height="580" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="180" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">예제 ③ — Remark (STW): SATB buffer에 남은 객체 marking</text>
  <text x="30" y="72" class="op">dequeue 할 때 아래 조건이면 discard</text>
  <rect x="30" y="84" width="220" height="40" rx="6" class="bad"/>
  <text x="140" y="109" class="note" text-anchor="middle">1. TAMS 포인터 이후에 할당된 객체</text>
  <rect x="260" y="84" width="220" height="40" rx="6" class="bad"/>
  <text x="370" y="109" class="note" text-anchor="middle">2. 이미 marking된 객체</text>
  <rect x="490" y="84" width="240" height="40" rx="6" class="bad"/>
  <text x="610" y="109" class="note" text-anchor="middle">3. young 객체</text>
  <text x="30" y="150" class="sub">세 조건에 걸리지 않는 객체(old 객체, TAMS 이전에 할당, mark bitmap 0)만 local mark stack에 push</text>
  <text x="30" y="170" class="sub">global SATB buffer에는 객체가 아니라 local SATB buffer의 주소가 쌓인다</text>
  <rect x="10" y="206" width="740" height="358" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="244" class="step">동작</text>
  <text x="330" y="244" class="step">SATB buffer</text>
  <text x="440" y="244" class="step">mark stack</text>
