  <rect width="760" height="400" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="380" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">하나의 서비스가 하나의 유스케이스를 구현한다</text>
  <text x="730" y="42" class="code" text-anchor="end">SendMoneyService</text>
  <rect x="30" y="58" width="220" height="300" rx="8" class="pkg"/>
  <text x="42" y="78" class="ms"><tspan font-family="Menlo, Consolas, monospace">application.port.in</tspan></text>
  <rect x="282" y="58" width="200" height="136" rx="8" class="pkg"/>
  <text x="294" y="78" class="ms"><tspan font-family="Menlo, Consolas, monospace">application.service</tspan></text>
  <rect x="282" y="214" width="200" height="144" rx="8" class="pkg"/>
  <text x="294" y="234" class="ms"><tspan font-family="Menlo, Consolas, monospace">domain</tspan></text>
  <rect x="514" y="58" width="216" height="136" rx="8" class="pkg"/>
  <text x="526" y="78" class="ms"><tspan font-family="Menlo, Consolas, monospace">application.port.out</tspan></text>
  <rect x="46" y="92" width="188" height="70" rx="8" class="box"/>
  <text x="140" y="122.5" class="s" text-anchor="middle">«interface»</text>
  <text x="140" y="141.5" class="opm" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">SendMoneyUseCase</tspan></text>
  <rect x="46" y="270" width="188" height="60" rx="8" class="box"/>
  <text x="140" y="295.5" class="opm" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">SendMoneyCommand</tspan></text>
  <text x="140" y="314.5" class="s" text-anchor="middle">입력 모델</text>
  <rect x="298" y="92" width="168" height="70" rx="8" class="hold"/>
  <text x="382" y="122.5" class="opm" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">SendMoneyService</tspan></text>
  <text x="382" y="141.5" class="s" text-anchor="middle">유스케이스 구현</text>
  <rect x="298" y="254" width="168" height="70" rx="8" class="box"/>
  <text x="382" y="284.5" class="opm" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">Account</tspan></text>
  <text x="382" y="303.5" class="s" text-anchor="middle">도메인 엔티티</text>
  <rect x="528" y="92" width="188" height="70" rx="8" class="box"/>
  <text x="622" y="122.5" class="s" text-anchor="middle">«interface»</text>
  <text x="622" y="141.5" class="ms" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">UpdateAccountStatePort</tspan></text>
  <line x1="296" y1="127" x2="238" y2="127" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <text x="267" y="118" class="msg" text-anchor="middle">구현</text>
  <line x1="140" y1="164" x2="140" y2="266" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="148" y="220" class="msg">입력으로 받음</text>
  <line x1="382" y1="164" x2="382" y2="250" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="390" y="212" class="msg">상태 변경</text>
  <line x1="468" y1="127" x2="524" y2="127" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="496" y="118" class="msg" text-anchor="middle">저장</text>
