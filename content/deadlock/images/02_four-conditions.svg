<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>상호 배제, 점유 대기, 비선점, 순환 대기 네 조건이 모두 모여야 데드락이 생기고, 실제로 깨는 것은 점유 대기와 순환 대기</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .waitl { stroke: #dc2626; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
    .lbl { font-size: 12.5px; font-weight: 700; fill: #6b7280; }
    .colh { font-size: 12px; font-weight: 700; fill: #9ca3af; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="320" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">데드락의 네 조건 — 넷이 모두 모여야 생긴다</text>
  <rect x="30" y="66" width="160" height="64" rx="10" class="hold"/>
  <text x="110" y="92" class="t" text-anchor="middle">상호 배제</text>
  <text x="110" y="113" class="s" text-anchor="middle">한 번에 한 명만</text>
  <rect x="210" y="66" width="160" height="64" rx="10" class="ok"/>
  <text x="290" y="92" class="okt" text-anchor="middle">점유 대기</text>
  <text x="290" y="113" class="s" text-anchor="middle">쥔 채로 기다림</text>
  <rect x="390" y="66" width="160" height="64" rx="10" class="hold"/>
  <text x="470" y="92" class="t" text-anchor="middle">비선점</text>
  <text x="470" y="113" class="s" text-anchor="middle">뺏을 수 없음</text>
  <rect x="570" y="66" width="160" height="64" rx="10" class="ok"/>
  <text x="650" y="92" class="okt" text-anchor="middle">순환 대기</text>
  <text x="650" y="113" class="s" text-anchor="middle">기다림이 원을 그림</text>
  <text x="200" y="104" class="lbl" text-anchor="middle">+</text>
  <text x="380" y="104" class="lbl" text-anchor="middle">+</text>
  <text x="560" y="104" class="lbl" text-anchor="middle">+</text>
  <line x1="110" y1="130" x2="110" y2="152" class="flow"/>
  <line x1="290" y1="130" x2="290" y2="152" class="flow"/>
  <line x1="470" y1="130" x2="470" y2="152" class="flow"/>
  <line x1="650" y1="130" x2="650" y2="152" class="flow"/>
  <line x1="110" y1="152" x2="650" y2="152" class="flow"/>
  <line x1="380" y1="152" x2="380" y2="180" class="flow" marker-end="url(#ag)"/>
  <text x="392" y="172" class="lbl">모두 성립할 때만</text>
  <rect x="290" y="184" width="180" height="44" rx="10" class="bad"/>
  <text x="380" y="211" class="badt" text-anchor="middle">데드락</text>
  <rect x="30" y="250" width="18" height="14" rx="3" class="hold"/>
  <text x="58" y="262" class="val">자원의 성질 — 보통 건드리지 않음 (깨면 데이터가 깨짐)</text>
  <rect x="30" y="274" width="18" height="14" rx="3" class="ok"/>
  <text x="58" y="286" class="val">실제로 깨는 조건 — 점유 대기, 순환 대기</text>
  <text x="30" y="316" class="gnote">넷 중 하나만 깨도 데드락은 발생하지 않습니다.</text>
</svg>
