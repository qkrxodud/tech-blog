  <rect x="14" y="270" width="210" height="40" rx="8" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/><text x="119" y="286.5" class="s2" text-anchor="middle" style="fill:#92400e;font-size:11px">해제하면 <tspan class="m">returnStock</tspan></text><text x="119" y="301.5" class="s2" text-anchor="middle" style="fill:#92400e;font-size:11px">담은 수량만큼 재고를 늘림</text>
