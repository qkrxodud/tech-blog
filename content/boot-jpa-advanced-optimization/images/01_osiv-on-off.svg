<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>OSIV ON이면 트랜잭션 시작 시점부터 API 응답이 끝날 때까지 영속성 컨텍스트와 데이터베이스 커넥션이 유지되어 컨트롤러와 뷰에서도 지연 로딩이 가능하지만 외부 API 대기 시간만큼 커넥션을 반환하지 못하고, OSIV OFF이면 트랜잭션이 끝날 때 영속성 컨텍스트를 닫고 커넥션을 반환해 지연 로딩을 트랜잭션 안에서 처리해야 하는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="512" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="238" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h" text-anchor="start">OSIV ON — 응답이 끝날 때까지 유지</text>
  <text x="730" y="42" class="code" text-anchor="end">open-in-view: true</text>
  <text x="207.5" y="70" class="step" text-anchor="middle">요청 → 컨트롤러</text>
  <text x="350.0" y="70" class="step" text-anchor="middle">서비스 (트랜잭션)</text>
  <text x="517.5" y="70" class="step" text-anchor="middle">컨트롤러로 복귀</text>
  <text x="672.5" y="70" class="step" text-anchor="middle">API 응답 끝</text>
  <line x1="160" y1="78" x2="722" y2="78" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane" text-anchor="start">트랜잭션</text>
  <rect x="150" y="88" width="585" height="36" rx="6" class="track"/>
  <rect x="279" y="91" width="142" height="30" rx="8" class="hold"/>
  <text x="350.0" y="111.0" class="ts" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">@Transactional</tspan></text>
  <text x="30" y="150" class="lane" text-anchor="start">영속성</text>
  <text x="30" y="168" class="sub" text-anchor="start">컨텍스트·커넥션</text>
  <rect x="150" y="132" width="585" height="44" rx="6" class="track"/>
  <rect x="279" y="136" width="452" height="36" rx="8" class="hold"/>
  <text x="505.0" y="159.0" class="t" text-anchor="middle">영속성 컨텍스트와 DB 커넥션 유지</text>
  <text x="30" y="206" class="lane" text-anchor="start">지연 로딩</text>
  <rect x="150" y="184" width="585" height="44" rx="6" class="track"/>
  <rect x="279" y="188" width="142" height="36" rx="8" class="ok"/>
  <text x="350.0" y="211.0" class="okt" text-anchor="middle">가능</text>
  <rect x="439" y="188" width="157" height="36" rx="8" class="ok"/>
  <text x="517.5" y="211.0" class="gnote" text-anchor="middle">컨트롤러·뷰에서 가능</text>
  <text x="608" y="202" class="note" text-anchor="start">외부 API 대기 동안</text>
  <text x="608" y="219" class="note" text-anchor="start">커넥션 반환 못 함</text>
  <rect x="10" y="264" width="740" height="238" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="296" class="h" text-anchor="start">OSIV OFF — 트랜잭션이 끝나면 반환</text>
  <text x="730" y="296" class="code" text-anchor="end">open-in-view: false</text>
  <text x="207.5" y="324" class="step" text-anchor="middle">요청 → 컨트롤러</text>
  <text x="350.0" y="324" class="step" text-anchor="middle">서비스 (트랜잭션)</text>
  <text x="517.5" y="324" class="step" text-anchor="middle">컨트롤러로 복귀</text>
  <text x="672.5" y="324" class="step" text-anchor="middle">API 응답 끝</text>
  <line x1="160" y1="332" x2="722" y2="332" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="30" y="362" class="lane" text-anchor="start">트랜잭션</text>
  <rect x="150" y="342" width="585" height="36" rx="6" class="track"/>
  <rect x="279" y="345" width="142" height="30" rx="8" class="hold"/>
  <text x="350.0" y="365.0" class="ts" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">@Transactional</tspan></text>
  <text x="30" y="404" class="lane" text-anchor="start">영속성</text>
  <text x="30" y="422" class="sub" text-anchor="start">컨텍스트·커넥션</text>
  <rect x="150" y="386" width="585" height="44" rx="6" class="track"/>
  <rect x="279" y="390" width="142" height="36" rx="8" class="hold"/>
  <text x="350.0" y="413.0" class="t" text-anchor="middle">유지</text>
  <text x="430" y="413" class="gnote" text-anchor="start">닫고 커넥션 반환</text>
  <text x="30" y="460" class="lane" text-anchor="start">지연 로딩</text>
  <rect x="150" y="438" width="585" height="44" rx="6" class="track"/>
  <rect x="279" y="442" width="142" height="36" rx="8" class="ok"/>
  <text x="350.0" y="465.0" class="okt" text-anchor="middle">가능</text>
  <rect x="439" y="442" width="157" height="36" rx="8" class="bad"/>
  <text x="517.5" y="465.0" class="note" text-anchor="middle">컨트롤러·뷰에서 불가</text>
  <text x="608" y="456" class="val" text-anchor="start">트랜잭션 안에서</text>
  <text x="608" y="473" class="val" text-anchor="start">강제로 호출해 둠</text>
</svg>
