<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>CMS GC에서 Initial Mark와 Remark 동안에만 애플리케이션이 멈추고, Concurrent Mark와 Concurrent Sweep 동안에는 애플리케이션이 계속 실행되는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t13 { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okt13 { font-size: 13px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badt13 { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .m { font-family: Menlo, Consolas, monospace; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="256" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="236" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">CMS GC — 두 번만 멈추고 나머지는 동시에</text>
  <text x="225" y="68" class="step" text-anchor="middle">1. Initial Mark</text>
  <text x="365" y="68" class="step" text-anchor="middle">2. Concurrent Mark</text>
  <text x="505" y="68" class="step" text-anchor="middle">3. Remark</text>
  <text x="645" y="68" class="step" text-anchor="middle">4. Concurrent Sweep</text>
  <line x1="160" y1="76" x2="722" y2="76" stroke="#c4c8ce" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">애플리케이션</text>
  <text x="30" y="126" class="sub">스레드</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="160" y="88" width="130" height="48" rx="8" class="bad"/>
  <text x="225" y="108" class="badt13" text-anchor="middle">멈춤</text>
  <text x="225" y="127" class="val" text-anchor="middle">Stop-The-World</text>
  <rect x="300" y="88" width="130" height="48" rx="8" class="hold"/>
  <text x="365" y="117" class="t13" text-anchor="middle">계속 실행</text>
  <rect x="440" y="88" width="130" height="48" rx="8" class="bad"/>
  <text x="505" y="108" class="badt13" text-anchor="middle">멈춤</text>
  <text x="505" y="127" class="val" text-anchor="middle">Stop-The-World</text>
  <rect x="580" y="88" width="130" height="48" rx="8" class="hold"/>
  <text x="645" y="117" class="t13" text-anchor="middle">계속 실행</text>
  <text x="30" y="168" class="lane">CMS GC</text>
  <text x="30" y="186" class="sub">Old Generation</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="160" y="148" width="130" height="48" rx="8" class="box"/>
  <text x="225" y="168" class="t13" text-anchor="middle">루트에서 닿는</text>
  <text x="225" y="187" class="val" text-anchor="middle">객체 표시</text>
  <rect x="300" y="148" width="130" height="48" rx="8" class="ok"/>
  <text x="365" y="168" class="okt13" text-anchor="middle">연결된 객체</text>
  <text x="365" y="187" class="val" text-anchor="middle">추적 · 동시</text>
  <rect x="440" y="148" width="130" height="48" rx="8" class="box"/>
  <text x="505" y="168" class="t13" text-anchor="middle">변경된 객체</text>
  <text x="505" y="187" class="val" text-anchor="middle">다시 확인</text>
  <rect x="580" y="148" width="130" height="48" rx="8" class="ok"/>
  <text x="645" y="168" class="okt13" text-anchor="middle">회수</text>
  <text x="645" y="187" class="val" text-anchor="middle">Compaction 없음</text>
  <text x="150" y="228" class="foot">초록색 단계는 애플리케이션과 동시에 진행되고, 빨간색 단계에서만 애플리케이션이 멈춥니다.</text>
</svg>
