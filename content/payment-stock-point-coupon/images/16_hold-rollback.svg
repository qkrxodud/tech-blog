  <rect width="760" height="560" fill="#ffffff"/>
  <text x="24" y="30" class="h">잡지 못한 주문 — 하나라도 모자라면 인증 트랜잭션을 통째로 되돌림</text>
  <text x="24" y="52" class="gs" style="font-size:11px"><tspan class="m">HoldRefusalTest</tspan>: 재고 5 · 쿠폰 2000원 · 포인트 500원 회원이 포인트 1000원을 쓰는 주문(10000 − 2000 − 1000 = 7000원)</text>
  <rect x="60" y="70" width="280" height="44" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <use href="#i-card" x="74" y="78"/>
