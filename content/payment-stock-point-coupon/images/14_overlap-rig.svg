  <rect width="760" height="440" fill="#ffffff"/>
  <text x="24" y="30" class="h">두 주문의 겹침을 고정하는 방법 — 7장과 같은 방법</text>
  <text x="24" y="52" class="gs" style="font-size:11px"><tspan class="m">slowWrites.holdPaymentChangeTo(AUTHENTICATED)</tspan> → 먼저 보낸 주문의 승인 → <tspan class="m">awaitHeld()</tspan> → 두 번째 주문의 승인</text>
  <line x1="140" y1="100" x2="736" y2="100" stroke="#e5e7eb" stroke-width="1"/>
  <text x="24" y="96" class="t2" style="font-size:12.5px">먼저 보낸 주문</text>
  <text x="24" y="114" class="gs" style="font-size:11px">인증 트랜잭션</text>
  <line x1="140" y1="180" x2="736" y2="180" stroke="#e5e7eb" stroke-width="1"/>
  <text x="24" y="176" class="t2" style="font-size:12.5px">MySQL</text>
  <text x="24" y="194" class="gs" style="font-size:11px">트리거</text>
