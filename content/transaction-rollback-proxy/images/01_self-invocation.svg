<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>호출자가 MemberService 프록시를 거쳐 saveMembers를 호출하면 트랜잭션이 시작되지만, this로 호출한 saveMember는 프록시를 거치지 않아 REQUIRES_NEW가 적용되지 않는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .cellt { font-size: 14px; font-weight: 700; fill: #374151; }
    .colh { font-size: 13px; font-weight: 700; fill: #4b5563; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="340" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">자기 호출 — saveMember가 프록시를 거치지 않는 구조</text>
  <text x="730" y="42" class="code" text-anchor="end">this.saveMember(member)</text>
  <rect x="30" y="120" width="110" height="56" rx="8" class="box"/>
  <text x="85" y="153" class="cellt" text-anchor="middle">호출자</text>
  <rect x="180" y="100" width="190" height="96" rx="8" class="hold"/>
  <text x="275" y="144" class="cellt" text-anchor="middle">MemberService 프록시</text>
  <text x="275" y="163" class="val" text-anchor="middle">트랜잭션 시작 (<tspan font-family="Menlo, Consolas, monospace">REQUIRED</tspan>)</text>
  <line x1="140" y1="148" x2="178" y2="148" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="410" y="66" width="320" height="236" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-dasharray="5 4"/>
  <text x="426" y="88" class="sub">MemberService 대상 객체</text>
  <rect x="430" y="100" width="280" height="56" rx="8" class="box"/>
  <text x="570" y="124" class="op" text-anchor="middle">saveMembers()</text>
  <text x="570" y="143" class="val" text-anchor="middle">바깥 트랜잭션 안에서 실행</text>
  <line x1="370" y1="128" x2="428" y2="128" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="430" y="226" width="280" height="60" rx="8" class="bad"/>
  <text x="570" y="252" class="badc" text-anchor="middle">saveMember()</text>
  <text x="570" y="271" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">REQUIRES_NEW</tspan> 적용 안 됨</text>
  <line x1="570" y1="156" x2="570" y2="224" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="582" y="196" class="note"><tspan font-family="Menlo, Consolas, monospace">this</tspan>로 바로 호출</text>
  <text x="30" y="250" class="sub">프록시는 saveMembers 호출만</text>
  <text x="30" y="268" class="sub">가로챕니다.</text>
  <text x="30" y="330" class="note">saveMember도 saveMembers의 트랜잭션에 묶여, 회원 하나가 실패하면 전체가 롤백됩니다.</text>

</svg>
