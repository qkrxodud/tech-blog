<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>teamA에 member1(10살), member2(20살), teamB에 member3(30살), member4(40살)를 저장하고 em.flush()와 em.clear()로 초기화한 뒤 join fetch로 회원과 팀을 함께 조회하는 테스트 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .msg { font-size: 11.5px; fill: #374151; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .cont { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="360" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">테스트 데이터 — 팀 2개, 회원 4명</text>
  <rect x="30" y="62" width="340" height="122" rx="10" class="cont"/>
  <text x="46" y="86" class="t">teamA</text>
  <rect x="46" y="100" width="150" height="66" rx="8" class="box"/>
  <text x="121" y="126" class="opm" text-anchor="middle">member1</text>
  <text x="121" y="148" class="val" text-anchor="middle">age 10</text>
  <rect x="206" y="100" width="150" height="66" rx="8" class="box"/>
  <text x="281" y="126" class="opm" text-anchor="middle">member2</text>
  <text x="281" y="148" class="val" text-anchor="middle">age 20</text>
  <rect x="30" y="196" width="340" height="122" rx="10" class="cont"/>
  <text x="46" y="220" class="t">teamB</text>
  <rect x="46" y="234" width="150" height="66" rx="8" class="box"/>
  <text x="121" y="260" class="opm" text-anchor="middle">member3</text>
  <text x="121" y="282" class="val" text-anchor="middle">age 30</text>
  <rect x="206" y="234" width="150" height="66" rx="8" class="box"/>
  <text x="281" y="260" class="opm" text-anchor="middle">member4</text>
  <text x="281" y="282" class="val" text-anchor="middle">age 40</text>
  <rect x="420" y="62" width="310" height="62" rx="8" class="box"/>
  <text x="575" y="88" class="opm" text-anchor="middle">em.persist()</text>
  <text x="575" y="108" class="val" text-anchor="middle">팀 2개, 회원 4명 저장</text>
  <rect x="420" y="159" width="310" height="62" rx="8" class="hold"/>
  <text x="575" y="185" class="opm" text-anchor="middle">em.flush() / em.clear()</text>
  <text x="575" y="205" class="val" text-anchor="middle">SQL 반영 후 영속성 컨텍스트 초기화</text>
  <rect x="420" y="256" width="310" height="62" rx="8" class="ok"/>
  <text x="575" y="282" class="okm" text-anchor="middle">join fetch m.team t</text>
  <text x="575" y="302" class="val" text-anchor="middle">회원과 팀을 함께 조회해 출력</text>
  <line x1="575" y1="124" x2="575" y2="157" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="575" y1="221" x2="575" y2="254" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="372" y1="93" x2="418" y2="93" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="30" y="350" class="foot">flush·clear로 영속성 컨텍스트를 비운 뒤 조회하므로, 출력되는 회원과 팀은 DB에서 다시 읽어 온 값입니다.</text>
</svg>
