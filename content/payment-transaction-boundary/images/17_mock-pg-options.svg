<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 6 Mock PG의 세 형태 — 같은 JVM 안의 가짜 구현은 PaymentGateway 인터페이스를 테스트용 클래스로 대신해 JdkClientHttpRequestFactory가 실제 HTTP 요청에서 거는 읽기 시간 제한을 지나가지 않고, PG 결과에 따른 분기만 확인할 때 가장 빠름. WireMock 같은 HTTP 테스트 대역은 비교 구현하지 않아 차이를 확인하지 못했고, 실제 PG의 요청·응답 형식을 많이 흉내 내야 하면 요청 일치 규칙과 응답 틀로 품이 덜 들 수 있음. 고른 직접 만든 별도 모듈은 실제 HTTP로 답하는 Spring Boot 앱이라 시간 제한 설정을 지나가고 6장 웹훅도 같은 Mock PG에 더함. 대신 빌드가 멀티 모듈이 되고 테스트마다 Mock PG를 띄우는 시간이 들며, 테스트에서는 같은 클래스 경로를 쓰므로 Mock PG 쪽 DB 자동 구성을 끄고 띄움</title>
