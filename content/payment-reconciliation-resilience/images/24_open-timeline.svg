  <text x="255" y="196" class="bads" text-anchor="middle" style="font-size:9.5px;font-weight:700">바로 실패 3690 / 3623건</text>
  <text x="255" y="212" class="bads" text-anchor="middle" style="font-size:8.5px">전체 3710 / 3643건 중앙 33ms</text>
