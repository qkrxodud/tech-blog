  <text x="336" y="374" class="badt" style="font-size:11px">계약 9개 중 7 실패</text>
  <rect x="458" y="62" width="142" height="196" rx="10" fill="#ece8fb" stroke="#9b88d6" stroke-width="1.5"/>
  <circle cx="460" cy="64" r="11" fill="#111827"/><text x="460" y="68" class="num" text-anchor="middle" style="font-size:11px">4</text>
