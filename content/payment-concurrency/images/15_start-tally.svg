<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>7장 출발 코드에서 7장 테스트 27개 중 15개 실패 — 서버 여러 대의 주기 작업 6개 중 4개(원인 넷째: 서버 두 대가 같은 주기 작업을 함께 돎), PG 답을 기다리는 결제에 다시 온 승인 4개 중 1개(둘째: 같은 결제 키 재요청에 409), 같은 결제를 바꾸는 동시 기록 11개 중 6개(첫째: 같은 결제를 바꾸는 기록이 서로를 보지 못함), 같은 주문의 동시 준비 4개 중 2개(셋째: 나중 준비가 주문번호 중복 거부를 그대로 받아 500), 결제 API 2개 중 2개(둘째·셋째). 통과한 12개 가운데 카드사에서 취소된 금액은 결제 금액을 넘지 않는다는 Mock PG의 잔액 검사가, 결제는 하나만 생기고 금액은 먼저 준비한 금액이라는 두 테스트는 unique 키가 막아 준 것</title>
