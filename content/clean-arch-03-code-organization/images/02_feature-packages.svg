<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>account 패키지 하나에 Account, AccountController, AccountRepository, AccountRepositoryImpl, SendMoneyService가 모두 들어 있고, SendMoneyService가 AccountRepositoryImpl에 직접 의존하는 것은 같은 패키지라 막을 수 없는 기능별 패키지 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 12px; font-weight: 700; fill: #374151; }
    .tsm { font-size: 12px; font-weight: 700; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .s { font-size: 12px; fill: #6b7280; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .pkg { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .pkgw { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badd { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6b7280" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect width="760" height="410" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="390" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">기능으로 구성하기 — 기능마다 패키지 하나</text>
  <text x="730" y="42" class="code" text-anchor="end">buckpal.account</text>

  <rect x="30" y="66" width="80" height="16" rx="3" class="pkg"/>
  <rect x="30" y="80" width="700" height="236" rx="6" class="pkg"/>
  <text x="44" y="102" class="tsm">account</text>

  <rect x="50" y="120" width="200" height="40" rx="4" class="box"/>
  <text x="150" y="145" class="opm" text-anchor="middle">Account</text>
  <rect x="280" y="120" width="200" height="40" rx="4" class="box"/>
  <text x="380" y="145" class="opm" text-anchor="middle">AccountController</text>
  <rect x="510" y="120" width="200" height="40" rx="4" class="box"/>
  <text x="610" y="138" class="s" text-anchor="middle">«interface»</text>
  <text x="610" y="154" class="opm" text-anchor="middle">AccountRepository</text>

  <rect x="230" y="250" width="200" height="40" rx="4" class="ok"/>
  <text x="330" y="275" class="okm" text-anchor="middle">SendMoneyService</text>
  <rect x="510" y="250" width="200" height="40" rx="4" class="box"/>
  <text x="610" y="275" class="opm" text-anchor="middle">AccountRepositoryImpl</text>

  <line x1="400" y1="249" x2="536" y2="163" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#open)"/>
  <text x="452" y="196" class="ms">use</text>
  <line x1="610" y1="249" x2="610" y2="163" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#tri)"/>
  <text x="620" y="212" class="s">구현</text>
  <line x1="431" y1="278" x2="508" y2="278" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="470" y="306" class="note" text-anchor="middle">직접 의존</text>

  <text x="30" y="344" class="gnote">SendMoneyService — ‘송금하기’ 유스케이스를 클래스명만으로 찾을 수 있음</text>
  <text x="30" y="368" class="note">빨간 점선 — 같은 패키지 안이라 package-private로는 막을 수 없는 의존성</text>
  <text x="30" y="392" class="foot">패키지 이름만으로는 어댑터, 인커밍 포트, 아웃고잉 포트를 구분할 수 없음</text>
</svg>
