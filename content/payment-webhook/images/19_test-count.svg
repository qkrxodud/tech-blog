<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>6장 완성 코드의 테스트 수 — 5장의 460개에서 511개가 됨. 6장 테스트 53개는 웹훅 처리 19개(계약 15개와 운영 구현에만 있는 4개: 조회 실패 재처리 1개, 4장 보정과의 순서 3개), 웹훅 받기 API 6개(출발 코드의 4개와 처리 전 알림으로 남기기·결제 상태 알림이 아니면 남기지 않기 2개), 주기 처리 1개, 도메인 27개(PG에서 다시 읽은 결제 상태 따라가기 9, PG 취소 이력 따라가기 7, PG 답을 기다리는 취소를 취소 이력으로 바로 닫기 5, 받은 카드사 웹훅 6)이고, 4장 보정 테스트는 도메인 4개와 운영 보정 3개가 늘고 망취소 9개가 기본 테스트에서 빠짐. 라인 커버리지는 709줄 중 705줄, 99.4%</title>
