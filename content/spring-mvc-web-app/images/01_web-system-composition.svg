<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>WAS와 DB만 둔 구성은 WAS가 정적 리소스와 애플리케이션 로직을 모두 맡아 과부하와 장애 시 오류 화면 문제가 있고, WEB, WAS, DB 구성은 정적 리소스는 WEB 서버, 동적 처리는 WAS가 나누어 맡는다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .m { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .mv { font-size: 12px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .gn { font-size: 12.5px; fill: #15803d; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="190" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">WAS, DB 구성 — WAS가 모든 처리를 맡는다</text>
  <rect x="30" y="66" width="120" height="56" rx="8" class="box"/>
  <text x="90" y="99" class="t" text-anchor="middle">클라이언트</text>
  <line x1="150" y1="94" x2="214" y2="94" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="220" y="66" width="320" height="56" rx="8" class="hold"/>
  <text x="380" y="89" class="t" text-anchor="middle">WAS</text>
  <text x="380" y="109" class="val" text-anchor="middle">정적 리소스 + 애플리케이션 로직</text>
  <line x1="540" y1="94" x2="604" y2="94" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="610" y="66" width="120" height="56" rx="8" class="dbbox"/>
  <text x="670" y="99" class="db" text-anchor="middle">DB</text>
  <rect x="30" y="138" width="700" height="46" rx="8" class="bad"/>
  <text x="46" y="157" class="note">· WAS 과부하 우려, 정적 리소스 처리 때문에 애플리케이션 로직 수행이 어려워질 수 있음</text>
  <text x="46" y="175" class="note">· WAS에 장애가 나면 오류 화면조차 노출할 수 없음</text>

  <rect x="10" y="216" width="740" height="194" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="248" class="h">WEB, WAS, DB 구성 — 정적 리소스는 WEB, 동적 처리는 WAS</text>
  <rect x="30" y="272" width="110" height="56" rx="8" class="box"/>
  <text x="85" y="305" class="t" text-anchor="middle">클라이언트</text>
  <line x1="140" y1="300" x2="184" y2="300" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="190" y="272" width="160" height="56" rx="8" class="box"/>
  <text x="270" y="295" class="t" text-anchor="middle">WEB 서버</text>
  <text x="270" y="315" class="val" text-anchor="middle">정적 리소스 처리</text>
  <line x1="350" y1="300" x2="414" y2="300" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="382" y="292" class="sub" text-anchor="middle">위임</text>
  <rect x="420" y="272" width="170" height="56" rx="8" class="hold"/>
  <text x="505" y="295" class="t" text-anchor="middle">WAS</text>
  <text x="505" y="315" class="val" text-anchor="middle">애플리케이션 로직 전담</text>
  <line x1="590" y1="300" x2="634" y2="300" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="640" y="272" width="90" height="56" rx="8" class="dbbox"/>
  <text x="685" y="305" class="db" text-anchor="middle">DB</text>
  <rect x="30" y="344" width="700" height="50" rx="8" class="ok"/>
  <text x="46" y="364" class="gn">· 정적 리소스 사용량이 많으면 WEB 서버, 애플리케이션 리소스 사용량이 많으면 WAS를 증설</text>
  <text x="46" y="383" class="gn">· WAS나 DB에 장애가 나도 WEB 서버가 오류 화면을 제공할 수 있음</text>
</svg>
