<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>9장 결제 이벤트 계약 PaymentEventContract 7개 — 주문 서비스에 무엇이 도착했는지로 봄. 승인된 결제의 주문은 결제 완료, 거절된 결제의 주문은 결제 실패(2개). 유실: 결제 직전에 브로커를 끊고 4초(보내기 시간 제한 3초 + 1초) 뒤에 되돌린 다음 15초 안에 승인이 도착(1개). 유령: 결제를 승인 상태로 바꾸는 UPDATE를 트리거로 막아 커밋 때 실패시키면 승인이 가지 않음(1개). 순서: 주문 서비스가 승인 이벤트를 남기는 received_payment_event insert를 트리거로 1초 붙잡은 사이 전액 취소해, 두 이벤트가 만든 순서대로 도착하고 주문이 취소 상태로 끝남(2개). 응답 지연: 브로커가 답을 1.5초 늦게 줘도 결제 승인이 1초 안에 답함(1개). 2 + 1 + 1 + 2 + 1 = 7</title>
