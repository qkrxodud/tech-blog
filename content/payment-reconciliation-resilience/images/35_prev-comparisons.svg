  <text x="505.50670241286866" y="108" class="oks" text-anchor="middle" style="font-size:11px;font-weight:700">통과 483</text>
  <text x="24" y="156" class="gs" style="font-size:10.5px">뒤이어 도는 7장 <tspan class="m">jpaVersionTest</tspan>는 11개 중 4개 실패 — 앞 장과 같음</text>
