<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>이미지 2개와 옵션 2개를 가진 Product를 두 컬렉션 즉시 로딩으로 조인하면 결과가 4행이 되고, 하이버네이트가 Product 1개, Image 2개, Option 2개로 정리하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opk { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .ster { font-size: 11.5px; font-style: italic; fill: #6b7280; }
    .cls { font-size: 15px; font-weight: 700; fill: #1f2937; }
    .attr { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
    .sep { stroke: #d1d5db; stroke-width: 1; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
    <marker id="dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="14" markerHeight="9" orient="auto">
      <path d="M1,5 L8,1 L15,5 L8,9 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="760" height="390" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="370" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">두 컬렉션을 즉시 로딩 — 조인 결과가 곱으로 늘어남</text>
  <text x="730" y="42" class="code" text-anchor="end">FetchType.EAGER</text>
  <text x="130" y="66" class="step" text-anchor="middle">조회 대상</text>
  <text x="400" y="66" class="step" text-anchor="middle">조인 결과</text>
  <text x="640" y="66" class="step" text-anchor="middle">메모리의 객체</text>
  <rect x="40" y="84" width="180" height="48" rx="8" class="hold"/>
  <text x="130" y="104" class="op" text-anchor="middle">Product</text>
  <text x="130" y="123" class="val" text-anchor="middle">1개</text>
  <rect x="40" y="146" width="180" height="48" rx="8" class="box"/>
  <text x="130" y="166" class="op" text-anchor="middle">Image</text>
  <text x="130" y="185" class="val" text-anchor="middle">img1, img2</text>
  <rect x="40" y="208" width="180" height="48" rx="8" class="box"/>
  <text x="130" y="228" class="op" text-anchor="middle">Option</text>
  <text x="130" y="247" class="val" text-anchor="middle">opt1, opt2</text>
  <line x1="224" y1="170" x2="284" y2="170" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="290" y="84" width="220" height="176" rx="6" class="dbbox"/>
  <text x="326" y="106" class="attr" text-anchor="middle">product</text>
  <text x="400" y="106" class="attr" text-anchor="middle">image</text>
  <text x="474" y="106" class="attr" text-anchor="middle">option</text>
  <line x1="290" y1="116" x2="510" y2="116" class="sep"/>
  <rect x="296" y="120" width="208" height="28" rx="4" class="bad"/>
  <text x="326" y="139" class="attr" text-anchor="middle">P1</text>
  <text x="400" y="139" class="attr" text-anchor="middle">img1</text>
  <text x="474" y="139" class="attr" text-anchor="middle">opt1</text>
  <rect x="296" y="154" width="208" height="28" rx="4" class="bad"/>
  <text x="326" y="173" class="attr" text-anchor="middle">P1</text>
  <text x="400" y="173" class="attr" text-anchor="middle">img1</text>
  <text x="474" y="173" class="attr" text-anchor="middle">opt2</text>
  <rect x="296" y="188" width="208" height="28" rx="4" class="bad"/>
  <text x="326" y="207" class="attr" text-anchor="middle">P1</text>
  <text x="400" y="207" class="attr" text-anchor="middle">img2</text>
  <text x="474" y="207" class="attr" text-anchor="middle">opt1</text>
  <rect x="296" y="222" width="208" height="28" rx="4" class="bad"/>
  <text x="326" y="241" class="attr" text-anchor="middle">P1</text>
  <text x="400" y="241" class="attr" text-anchor="middle">img2</text>
  <text x="474" y="241" class="attr" text-anchor="middle">opt2</text>
  <text x="400" y="284" class="badt" text-anchor="middle">2 × 2 = 4행</text>
  <line x1="514" y1="170" x2="560" y2="170" stroke="#16a34a" stroke-width="1.5" marker-end="url(#agr)"/>
  <rect x="570" y="92" width="140" height="40" rx="8" class="ok"/>
  <text x="640" y="117" class="okt" text-anchor="middle">Product 1개</text>
  <rect x="570" y="150" width="140" height="40" rx="8" class="ok"/>
  <text x="640" y="175" class="okt" text-anchor="middle">Image 2개</text>
  <rect x="570" y="208" width="140" height="40" rx="8" class="ok"/>
  <text x="640" y="233" class="okt" text-anchor="middle">Option 2개</text>
  <text x="640" y="284" class="gnote" text-anchor="middle">하이버네이트가 중복 제거</text>
  <text x="30" y="336" class="note">product · image · product_option을 한 번에 조인하므로 이미지 수 × 옵션 수만큼 행이 중복됩니다.</text>
  <text x="30" y="358" class="sub">메모리에는 알맞게 정리되지만, 애그리거트가 커지면 문제가 될 수 있습니다.</text>
</svg>
