  <rect width="760" height="392" fill="#ffffff"/>
  <text x="24" y="30" class="h">남은 한계 — Mock PG 가정, 동시 요청, API와 스키마</text>
  <text x="24" y="52" class="gs">점선은 문서 확인 · 실행을 하지 못한 것</text>
  <rect x="24" y="70" width="200" height="24" rx="6" fill="#64748b"/>
  <text x="124.0" y="86.5" class="tab" text-anchor="middle">Mock PG 가정 · 동시 요청</text>
  <rect x="24" y="102" width="349" height="57" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="38" y="124" class="gt" style="font-size:12.5px">같은 키에 다른 본문 → 첫 응답</text>
  <text x="38" y="144" class="gs" style="font-size:11px">문서로 확인하지 못함</text>
  <rect x="24" y="169" width="349" height="57" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="38" y="191" class="gt" style="font-size:12.5px">잔액 초과 → <tspan class="m">NOT_CANCELABLE_AMOUNT</tspan></text>
  <text x="38" y="211" class="gs" style="font-size:11px">문서로 확인하지 못함 · 15일 유효 기간은 흉내 안 냄</text>
  <rect x="24" y="236" width="349" height="57" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="38" y="258" class="gt" style="font-size:12.5px">PG 500이면 취소를 남기지 않음</text>
  <text x="38" y="278" class="gs" style="font-size:11px">가정 · 첫 요청 500 뒤 같은 키 재요청은 다루지 않음</text>
  <rect x="24" y="303" width="349" height="74" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="38" y="325" class="gt" style="font-size:12.5px">동시 요청 — 7장에서</text>
  <text x="38" y="345" class="gs" style="font-size:11px">같은 키 동시 → unique 키가 막아 <tspan class="m">500</tspan>일 것(실행 안 함)</text>
  <text x="38" y="362" class="gs" style="font-size:11px">다른 취소 동시 → 남은 금액을 넘어도 못 막음</text>
  <rect x="387" y="70" width="200" height="24" rx="6" fill="#64748b"/>
  <text x="487.0" y="86.5" class="tab" text-anchor="middle">API · 스키마</text>
  <rect x="387" y="102" width="349" height="57" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="401" y="124" class="badt" style="font-size:12.5px">남은 금액을 볼 곳이 취소 응답뿐</text>
  <text x="401" y="144" class="bads" style="font-size:11px">결제 조회 API에 없음 · 취소 목록 API도 없음</text>
  <rect x="387" y="169" width="349" height="57" rx="10" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <text x="401" y="191" class="ot" style="font-size:12.5px">다른 결제에 쓴 키를 다시 써도 다른 요청</text>
  <text x="401" y="211" class="os" style="font-size:11px">결제마다 키를 봄 · 토스페이먼츠도 주소가 달라(문서 기준)</text>
  <rect x="387" y="236" width="349" height="57" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="401" y="258" class="badt" style="font-size:12.5px">키에 개인정보를 넣지 말라는 안내</text>
  <text x="401" y="278" class="bads" style="font-size:11px">아직 API 문서에 없음</text>
  <rect x="387" y="303" width="349" height="57" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="401" y="325" class="badt" style="font-size:12.5px"><tspan class="m">create table if not exists</tspan></text>
  <text x="401" y="345" class="bads" style="font-size:11px">이미 테이블이 있는 DB에는 칸 추가가 안 들어감 · 4장과 같음</text>
</svg>
