<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>스프링 컨테이너가 @Autowired가 붙은 생성자를 통해 MemberController에 MemberService 빈을, MemberService에 MemoryMemberRepository 빈을 MemberRepository 타입으로 주입하는 관계</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .mxs { font-size: 11px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .chip { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .gscope { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="270" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="250" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">자동 의존관계 설정 — 생성자에 @Autowired로 빈 주입</text>
  <rect x="30" y="62" width="700" height="150" rx="10" class="gscope"/>
  <text x="46" y="84" class="sub">스프링 컨테이너</text>
  <rect x="46" y="100" width="176" height="80" rx="8" class="ok"/>
  <text x="134.0" y="128.0" class="okm" text-anchor="middle">MemberController</text>
  <text x="134.0" y="145.0" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">@Controller</tspan></text>
  <text x="134.0" y="162.0" class="gnote" text-anchor="middle">MemberService를 받음</text>
  <rect x="276" y="100" width="176" height="80" rx="8" class="ok"/>
  <text x="364.0" y="128.0" class="okm" text-anchor="middle">MemberService</text>
  <text x="364.0" y="145.0" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">@Service</tspan></text>
  <text x="364.0" y="162.0" class="gnote" text-anchor="middle">MemberRepository를 받음</text>
  <rect x="506" y="100" width="208" height="80" rx="8" class="ok"/>
  <text x="610.0" y="128.0" class="okm" text-anchor="middle">MemoryMemberRepository</text>
  <text x="610.0" y="145.0" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">@Repository</tspan></text>
  <text x="610.0" y="162.0" class="gnote" text-anchor="middle">주입되는 구현체</text>
  <line x1="273" y1="140" x2="226" y2="140" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="503" y1="140" x2="456" y2="140" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="380" y="202" class="sub" text-anchor="middle">화살표는 주입 방향 — 스프링이 생성자를 호출하며 빈을 넣어 줌</text>
  <text x="30" y="240" class="foot">컨트롤러와 서비스 모두 new로 의존 객체를 만들지 않고, 컨테이너에 등록된 빈 하나를 주입받아 사용합니다.</text>
</svg>
