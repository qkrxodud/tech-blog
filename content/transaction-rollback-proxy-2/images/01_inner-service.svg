<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>같은 서비스 안에서 호출한 세 번째 @Transactional 함수는 트랜잭션이 null로 확인되고, TransactionInnerService로 옮기면 프록시를 거쳐 트랜잭션이 따로 걸리는 비교 그림</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .cellt { font-size: 14px; font-weight: 700; fill: #374151; }
    .colh { font-size: 13px; font-weight: 700; fill: #4b5563; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="446" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="190" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">분리 전 — 같은 서비스 안에서 호출</text>
  <text x="730" y="42" class="code" text-anchor="end">getCurrentTransactionName()</text>
  <rect x="30" y="62" width="700" height="104" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-dasharray="5 4"/>
  <text x="44" y="82" class="sub">Service</text>
  <rect x="50" y="92" width="190" height="58" rx="8" class="box"/>
  <text x="145" y="114" class="cellt" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">@Transactional</tspan> 함수</text>
  <text x="145" y="134" class="val" text-anchor="middle">트랜잭션1</text>
  <line x1="240" y1="121" x2="278" y2="121" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="280" y="92" width="190" height="58" rx="8" class="box"/>
  <text x="375" y="114" class="cellt" text-anchor="middle">일반 함수</text>
  <text x="375" y="134" class="val" text-anchor="middle">트랜잭션1</text>
  <line x1="470" y1="121" x2="508" y2="121" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="510" y="92" width="200" height="58" rx="8" class="bad"/>
  <text x="610" y="114" class="badt" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">@Transactional</tspan> 함수</text>
  <text x="610" y="134" class="val" text-anchor="middle">null</text>
  <text x="30" y="188" class="note">세 번째 함수는 프록시를 거치지 않아 @Transactional이 적용되지 않았습니다.</text>
  <rect x="10" y="216" width="740" height="214" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="248" class="h">분리 후 — TransactionInnerService로 옮김</text>
  <text x="730" y="248" class="code" text-anchor="end">TransactionInnerService</text>
  <rect x="30" y="268" width="460" height="104" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-dasharray="5 4"/>
  <text x="44" y="288" class="sub">Service</text>
  <rect x="50" y="298" width="190" height="58" rx="8" class="box"/>
  <text x="145" y="320" class="cellt" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">@Transactional</tspan> 함수</text>
  <text x="145" y="340" class="val" text-anchor="middle">트랜잭션1</text>
  <line x1="240" y1="327" x2="268" y2="327" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="270" y="298" width="200" height="58" rx="8" class="box"/>
  <text x="370" y="320" class="cellt" text-anchor="middle">일반 함수</text>
  <text x="370" y="340" class="val" text-anchor="middle">트랜잭션1</text>
  <rect x="510" y="268" width="220" height="104" rx="10" fill="#ffffff" stroke="#16a34a" stroke-dasharray="5 4"/>
  <text x="524" y="288" class="sub">InnerService 프록시 경유</text>
  <line x1="470" y1="327" x2="518" y2="327" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="520" y="298" width="200" height="58" rx="8" class="ok"/>
  <text x="620" y="320" class="okt" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">@Transactional</tspan> 함수</text>
  <text x="620" y="340" class="val" text-anchor="middle">트랜잭션이 따로 걸림</text>
  <text x="30" y="402" class="gnote">다른 Bean으로 옮긴 함수는 프록시를 거쳐 호출되므로 @Transactional이 적용됩니다.</text>

</svg>
