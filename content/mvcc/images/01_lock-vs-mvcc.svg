<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>락 기반 방식에서는 트랜잭션 1의 read가 트랜잭션 2의 write lock 때문에 커밋까지 대기하고, MVCC에서는 read가 커밋된 값을 바로 읽으며 write끼리만 대기하는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .valc { font-size: 12.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .dbc { font-size: 14px; font-weight: 700; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .mark { stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="580" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="234" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">락 기반 방식 — read와 write가 서로를 기다림</text>
  <text x="730" y="42" class="code" text-anchor="end">write lock</text>
  <text x="220" y="68" class="step" text-anchor="middle">1단계</text>
  <text x="360" y="68" class="step" text-anchor="middle">2단계</text>
  <text x="500" y="68" class="step" text-anchor="middle">3단계</text>
  <text x="640" y="68" class="step" text-anchor="middle">4단계</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">트랜잭션 1</text>
  <text x="30" y="126" class="sub">읽기</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="302" y="88" width="116" height="48" rx="8" class="bad"/>
  <text x="360" y="108" class="badc" text-anchor="middle">read(A)</text>
  <text x="360" y="127" class="val" text-anchor="middle">lock 대기</text>
  <rect x="426" y="96" width="148" height="32" rx="6" class="wait"/>
  <text x="500.0" y="117" class="waitt" text-anchor="middle">커밋까지 대기</text>
  <rect x="582" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="640" y="108" class="op" text-anchor="middle">read(A)</text>
  <text x="640" y="127" class="val" text-anchor="middle">커밋 후 읽음</text>
  <text x="30" y="168" class="lane">트랜잭션 2</text>
  <text x="30" y="186" class="sub">쓰기</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="148" width="116" height="48" rx="8" class="hold"/>
  <text x="220" y="168" class="op" text-anchor="middle">write(A)</text>
  <text x="220" y="187" class="val" text-anchor="middle">write lock 획득</text>
  <rect x="442" y="148" width="116" height="48" rx="8" class="ok"/>
  <text x="500" y="168" class="okc" text-anchor="middle">commit</text>
  <text x="500" y="187" class="val" text-anchor="middle">unlock</text>
  <line x1="540" y1="148" x2="598" y2="137" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="150" y="226" class="foot">read와 write가 동시에 발생하면 한쪽이 끝날 때까지 기다려야 합니다.</text>
  <rect x="10" y="260" width="740" height="310" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="292" class="h">MVCC — read는 커밋된 값을 바로 읽음</text>
  <text x="730" y="292" class="code" text-anchor="end">MVCC</text>
  <text x="220" y="318" class="step" text-anchor="middle">1단계</text>
  <text x="360" y="318" class="step" text-anchor="middle">2단계</text>
  <text x="500" y="318" class="step" text-anchor="middle">3단계</text>
  <text x="640" y="318" class="step" text-anchor="middle">4단계</text>
  <line x1="160" y1="326" x2="722" y2="326" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="358" class="lane">트랜잭션 1</text>
  <text x="30" y="376" class="sub">읽기</text>
  <rect x="150" y="336" width="585" height="52" rx="6" class="track"/>
  <rect x="302" y="338" width="116" height="48" rx="8" class="ok"/>
  <text x="360" y="358" class="okc" text-anchor="middle">read(A)</text>
  <text x="360" y="377" class="val" text-anchor="middle">커밋된 값 읽음</text>
  <text x="30" y="418" class="lane">트랜잭션 2</text>
  <text x="30" y="436" class="sub">쓰기</text>
  <rect x="150" y="396" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="398" width="116" height="48" rx="8" class="hold"/>
  <text x="220" y="418" class="op" text-anchor="middle">write(A)</text>
  <text x="220" y="437" class="val" text-anchor="middle">write lock 획득</text>
  <rect x="442" y="398" width="116" height="48" rx="8" class="ok"/>
  <text x="500" y="418" class="okc" text-anchor="middle">commit</text>
  <text x="500" y="437" class="val" text-anchor="middle">unlock</text>
  <text x="30" y="478" class="lane">트랜잭션 3</text>
  <text x="30" y="496" class="sub">쓰기</text>
  <rect x="150" y="456" width="585" height="52" rx="6" class="track"/>
  <rect x="302" y="458" width="116" height="48" rx="8" class="bad"/>
  <text x="360" y="478" class="badc" text-anchor="middle">write(A)</text>
  <text x="360" y="497" class="val" text-anchor="middle">lock 대기</text>
  <rect x="426" y="466" width="148" height="32" rx="6" class="wait"/>
  <text x="500.0" y="487" class="waitt" text-anchor="middle">T2 커밋까지 대기</text>
  <rect x="582" y="458" width="116" height="48" rx="8" class="box"/>
  <text x="640" y="478" class="op" text-anchor="middle">write(A)</text>
  <text x="640" y="497" class="val" text-anchor="middle">커밋 후 진행</text>
  <line x1="540" y1="446" x2="598" y2="457" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="150" y="522" width="585" height="32" rx="15" class="ok"/>
  <text x="442.5" y="543" class="okt" text-anchor="middle">read와 write는 서로를 block하지 않음 — write끼리만 대기</text>
</svg>
