<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>mark-sweep은 지운 자리가 흩어지고, mark-sweep-compact는 live 객체를 한쪽으로 모으며 heap 크기와 전체 객체 수에 비례하고, mark-copy는 live 객체만 빈 공간으로 복사해 live 객체 수에 비례하는 모습</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #374151; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ops { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .tiny { font-size: 11px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #e5e7eb; stroke: #6b7280; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .region { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12px; fill: #9ca3af; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .ad { stroke: #9ca3af; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="500" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="480" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">free 공간 확보 — mark-sweep, mark-sweep-compact, mark-copy</text>
  <text x="30" y="80" class="lane">GC 전 (mark)</text>
  <text x="30" y="98" class="sub">live 객체 표시</text>
  <rect x="262" y="60" width="54" height="44" rx="8" class="ok"/>
  <text x="289.0" y="87.0" class="okt" text-anchor="middle">A</text>
  <rect x="322" y="60" width="54" height="44" rx="8" class="bad"/>
  <text x="349.0" y="87.0" class="badt" text-anchor="middle">B</text>
  <rect x="382" y="60" width="54" height="44" rx="8" class="ok"/>
  <text x="409.0" y="87.0" class="okt" text-anchor="middle">C</text>
  <rect x="442" y="60" width="54" height="44" rx="8" class="bad"/>
  <text x="469.0" y="87.0" class="badt" text-anchor="middle">D</text>
  <rect x="502" y="60" width="54" height="44" rx="8" class="bad"/>
  <text x="529.0" y="87.0" class="badt" text-anchor="middle">E</text>
  <rect x="562" y="60" width="54" height="44" rx="8" class="ok"/>
  <text x="589.0" y="87.0" class="okt" text-anchor="middle">F</text>
  <rect x="622" y="60" width="54" height="44" rx="6" class="wait"/>
  <rect x="682" y="60" width="54" height="44" rx="6" class="wait"/>
  <text x="30" y="146" class="lane">mark-sweep</text>
  <text x="30" y="164" class="sub">표시 안 된 객체 제거</text>
  <rect x="262" y="126" width="54" height="44" rx="8" class="ok"/>
  <text x="289.0" y="153.0" class="okt" text-anchor="middle">A</text>
  <rect x="322" y="126" width="54" height="44" rx="6" class="wait"/>
  <rect x="382" y="126" width="54" height="44" rx="8" class="ok"/>
  <text x="409.0" y="153.0" class="okt" text-anchor="middle">C</text>
  <rect x="442" y="126" width="54" height="44" rx="6" class="wait"/>
  <rect x="502" y="126" width="54" height="44" rx="6" class="wait"/>
  <rect x="562" y="126" width="54" height="44" rx="8" class="ok"/>
  <text x="589.0" y="153.0" class="okt" text-anchor="middle">F</text>
  <rect x="622" y="126" width="54" height="44" rx="6" class="wait"/>
  <rect x="682" y="126" width="54" height="44" rx="6" class="wait"/>
  <text x="262" y="188" class="note">지운 자리가 여기저기 흩어집니다</text>
  <text x="30" y="226" class="lane">mark-sweep-compact</text>
  <text x="30" y="244" class="sub">live 객체를 한쪽으로</text>
  <rect x="262" y="206" width="54" height="44" rx="8" class="ok"/>
  <text x="289.0" y="233.0" class="okt" text-anchor="middle">A</text>
  <rect x="322" y="206" width="54" height="44" rx="8" class="ok"/>
  <text x="349.0" y="233.0" class="okt" text-anchor="middle">C</text>
  <rect x="382" y="206" width="54" height="44" rx="8" class="ok"/>
  <text x="409.0" y="233.0" class="okt" text-anchor="middle">F</text>
  <rect x="442" y="206" width="294" height="44" rx="6" class="wait"/>
  <text x="589.0" y="233" class="waitt" text-anchor="middle">연속된 빈 공간</text>
  <text x="262" y="268" class="sub">linear scan을 여러 번 — heap 크기와 전체 객체 수에 비례</text>
  <text x="262" y="294" class="step">사용 중인 공간</text>
  <text x="502" y="294" class="step">비어 있는 공간 (survivor)</text>
  <text x="30" y="322" class="lane">mark-copy</text>
  <text x="30" y="340" class="sub">copy 전</text>
  <rect x="262" y="302" width="54" height="44" rx="8" class="ok"/>
  <text x="289.0" y="329.0" class="okt" text-anchor="middle">A</text>
  <rect x="322" y="302" width="54" height="44" rx="8" class="bad"/>
  <text x="349.0" y="329.0" class="badt" text-anchor="middle">B</text>
  <rect x="382" y="302" width="54" height="44" rx="8" class="ok"/>
  <text x="409.0" y="329.0" class="okt" text-anchor="middle">C</text>
  <rect x="442" y="302" width="54" height="44" rx="8" class="bad"/>
  <text x="469.0" y="329.0" class="badt" text-anchor="middle">D</text>
  <rect x="502" y="302" width="54" height="44" rx="6" class="wait"/>
  <rect x="562" y="302" width="54" height="44" rx="6" class="wait"/>
  <rect x="622" y="302" width="54" height="44" rx="6" class="wait"/>
  <rect x="682" y="302" width="54" height="44" rx="6" class="wait"/>
  <text x="30" y="404" class="lane"></text>
  <text x="30" y="422" class="sub">copy 후</text>
  <rect x="262" y="384" width="54" height="44" rx="6" class="wait"/>
  <rect x="322" y="384" width="54" height="44" rx="6" class="wait"/>
  <rect x="382" y="384" width="54" height="44" rx="6" class="wait"/>
  <rect x="442" y="384" width="54" height="44" rx="6" class="wait"/>
  <rect x="502" y="384" width="54" height="44" rx="8" class="ok"/>
  <text x="529.0" y="411.0" class="okt" text-anchor="middle">A</text>
  <rect x="562" y="384" width="54" height="44" rx="8" class="ok"/>
  <text x="589.0" y="411.0" class="okt" text-anchor="middle">C</text>
  <rect x="622" y="384" width="54" height="44" rx="6" class="wait"/>
  <rect x="682" y="384" width="54" height="44" rx="6" class="wait"/>
  <line x1="289.0" y1="346" x2="525.0" y2="382" class="gl" marker-end="url(#agr)"/>
  <line x1="409.0" y1="346" x2="585.0" y2="382" class="gl" marker-end="url(#agr)"/>
  <text x="262" y="450" class="gnote">live 객체만 복사하고 원래 공간은 전체가 빔 — live 객체 수에 비례, 대신 빈 공간이 필요</text>
</svg>
