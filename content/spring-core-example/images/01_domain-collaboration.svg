<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 465" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>회원 서비스가 회원 저장소 역할에 의존하고 메모리·DB·외부 시스템 구현이 그 역할을 구현하는 회원 도메인과, 주문 서비스가 회원 저장소와 할인 정책 역할에 의존하는 주문 도메인의 협력 관계</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .lanec { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .gmsg { font-size: 12px; fill: #15803d; }
    .rmsg { font-size: 12px; fill: #b91c1c; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 12px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .rm { font-size: 12px; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="760" height="465" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="215" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">회원 도메인 협력 관계 — 회원 가입과 조회</text>
  <rect x="30" y="96" width="110" height="50" rx="8" class="box"/>
  <text x="85" y="126.0" class="t" text-anchor="middle">클라이언트</text>
  <rect x="180" y="96" width="150" height="50" rx="8" class="hold"/>
  <text x="255" y="117.0" class="t" text-anchor="middle">회원 서비스</text>
  <text x="255" y="135.0" class="ms" text-anchor="middle">MemberService</text>
  <rect x="370" y="96" width="155" height="50" rx="8" class="hold"/>
  <text x="447.5" y="117.0" class="t" text-anchor="middle">회원 저장소</text>
  <text x="447.5" y="135.0" class="ms" text-anchor="middle">MemberRepository</text>
  <rect x="565" y="62" width="175" height="36" rx="8" class="box"/>
  <text x="652.5" y="85.0" class="ts" text-anchor="middle">메모리 회원 저장소</text>
  <rect x="565" y="106" width="175" height="36" rx="8" class="wait"/>
  <text x="652.5" y="129" class="waitt" text-anchor="middle">DB 회원 저장소</text>
  <rect x="565" y="150" width="175" height="36" rx="8" class="wait"/>
  <text x="652.5" y="173" class="waitt" text-anchor="middle">외부 시스템 연동 저장소</text>
  <line x1="142" y1="121" x2="177" y2="121" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="332" y1="121" x2="367" y2="121" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="563" y1="80" x2="527" y2="108" stroke="#6b7280" stroke-width="1.6" marker-end="url(#tri)"/>
  <line x1="563" y1="124" x2="527" y2="121" stroke="#6b7280" stroke-width="1.6" marker-end="url(#tri)"/>
  <line x1="563" y1="168" x2="527" y2="134" stroke="#6b7280" stroke-width="1.6" marker-end="url(#tri)"/>
  <text x="30" y="212" class="foot">점선은 아직 정해지지 않은 구현입니다(미확정). 회원 데이터는 자체 DB를 구축하거나 외부 시스템과 연동할 수 있습니다.</text>
  <rect x="10" y="241" width="740" height="214" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="273" class="h">주문 도메인 협력 관계 — 주문 생성과 할인 정책</text>
  <rect x="30" y="342" width="110" height="50" rx="8" class="box"/>
  <text x="85" y="372.0" class="t" text-anchor="middle">클라이언트</text>
  <rect x="180" y="342" width="150" height="50" rx="8" class="hold"/>
  <text x="255" y="363.0" class="t" text-anchor="middle">주문 서비스</text>
  <text x="255" y="381.0" class="ms" text-anchor="middle">OrderService</text>
  <rect x="380" y="298" width="160" height="50" rx="8" class="hold"/>
  <text x="460" y="319.0" class="t" text-anchor="middle">회원 저장소</text>
  <text x="460" y="337.0" class="ms" text-anchor="middle">MemberRepository</text>
  <rect x="380" y="384" width="160" height="50" rx="8" class="hold"/>
  <text x="460" y="405.0" class="t" text-anchor="middle">할인 정책</text>
  <text x="460" y="423.0" class="ms" text-anchor="middle">DiscountPolicy</text>
  <rect x="580" y="305" width="160" height="36" rx="8" class="box"/>
  <text x="660" y="328.0" class="ts" text-anchor="middle">메모리 회원 저장소</text>
  <rect x="580" y="370" width="160" height="40" rx="8" class="box"/>
  <text x="660" y="386.0" class="ts" text-anchor="middle">고정 금액 할인</text>
  <text x="660" y="404.0" class="s" text-anchor="middle">VIP 1000원</text>
  <rect x="580" y="418" width="160" height="30" rx="8" class="box"/>
  <text x="660" y="438.0" class="opm" text-anchor="middle">RateDiscountPolicy</text>
  <line x1="142" y1="367" x2="177" y2="367" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <path d="M332,357 L355,357 L355,323 L377,323" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <path d="M332,377 L355,377 L355,409 L377,409" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="578" y1="323" x2="543" y2="323" stroke="#6b7280" stroke-width="1.6" marker-end="url(#tri)"/>
  <line x1="578" y1="390" x2="543" y2="402" stroke="#6b7280" stroke-width="1.6" marker-end="url(#tri)"/>
  <line x1="578" y1="433" x2="543" y2="416" stroke="#6b7280" stroke-width="1.6" marker-end="url(#tri)"/>
</svg>
