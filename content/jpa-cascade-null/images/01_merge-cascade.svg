<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 386" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>이미 저장된 부모를 조회해 새 자식을 추가하고 save하면 부모에 id가 있어 merge가 호출되는데, cascade에 PERSIST만 있으면 merge가 자식으로 전이되지 않아 자식 Id가 null로 들어갔고, MERGE를 추가하면 자식도 함께 병합되어 저장된다는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="386" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="180" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h" text-anchor="start">PERSIST만 지정 — merge가 자식에 전이되지 않음</text>
  <text x="730" y="42" class="code" text-anchor="end">{CascadeType.PERSIST}</text>
  <text x="110.0" y="70" class="step" text-anchor="middle">부모 조회</text>
  <text x="286.0" y="70" class="step" text-anchor="middle">자식 추가</text>
  <text x="462.0" y="70" class="step" text-anchor="middle">save(parent)</text>
  <text x="638.0" y="70" class="step" text-anchor="middle">자식</text>
  <rect x="30" y="82" width="160" height="52" rx="8" class="box"/>
  <text x="110.0" y="104.0" class="op" text-anchor="middle">findById(6L)</text>
  <text x="110.0" y="123.0" class="val" text-anchor="middle">부모 id = 6</text>
  <rect x="206" y="82" width="160" height="52" rx="8" class="box"/>
  <text x="286.0" y="104.0" class="t" text-anchor="middle">자식 추가</text>
  <text x="286.0" y="123.0" class="val" text-anchor="middle">새 Child, id 없음</text>
  <line x1="192" y1="108.0" x2="203" y2="108.0" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="382" y="82" width="160" height="52" rx="8" class="box"/>
  <text x="462.0" y="104.0" class="op" text-anchor="middle">em.merge()</text>
  <text x="462.0" y="123.0" class="val" text-anchor="middle">id가 있어 merge 호출</text>
  <line x1="368" y1="108.0" x2="379" y2="108.0" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="558" y="82" width="160" height="52" rx="8" class="bad"/>
  <text x="638.0" y="104.0" class="badt" text-anchor="middle">전이 안 됨</text>
  <text x="638.0" y="123.0" class="val" text-anchor="middle">자식 Id가 null</text>
  <line x1="544" y1="108.0" x2="555" y2="108.0" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="30" y="162" class="sub" text-anchor="start">부모는 이미 영속 상태라 merge 자체는 무시되고, merge는 MERGE(또는 ALL)로 지정한 연관관계로만 전이됩니다.</text>
  <rect x="10" y="206" width="740" height="170" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="238" class="h" text-anchor="start">PERSIST, MERGE 지정 — 자식도 함께 병합</text>
  <text x="730" y="238" class="code" text-anchor="end">{PERSIST, MERGE}</text>
  <text x="110.0" y="266" class="step" text-anchor="middle">부모 조회</text>
  <text x="286.0" y="266" class="step" text-anchor="middle">자식 추가</text>
  <text x="462.0" y="266" class="step" text-anchor="middle">save(parent)</text>
  <text x="638.0" y="266" class="step" text-anchor="middle">자식</text>
  <rect x="30" y="278" width="160" height="52" rx="8" class="box"/>
  <text x="110.0" y="300.0" class="op" text-anchor="middle">findById(6L)</text>
  <text x="110.0" y="319.0" class="val" text-anchor="middle">부모 id = 6</text>
  <rect x="206" y="278" width="160" height="52" rx="8" class="box"/>
  <text x="286.0" y="300.0" class="t" text-anchor="middle">자식 추가</text>
  <text x="286.0" y="319.0" class="val" text-anchor="middle">새 Child, id 없음</text>
  <line x1="192" y1="304.0" x2="203" y2="304.0" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="382" y="278" width="160" height="52" rx="8" class="box"/>
  <text x="462.0" y="300.0" class="op" text-anchor="middle">em.merge()</text>
  <text x="462.0" y="319.0" class="val" text-anchor="middle">id가 있어 merge 호출</text>
  <line x1="368" y1="304.0" x2="379" y2="304.0" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="558" y="278" width="160" height="52" rx="8" class="ok"/>
  <text x="638.0" y="300.0" class="okt" text-anchor="middle">자식도 병합</text>
  <text x="638.0" y="319.0" class="val" text-anchor="middle">자식 저장</text>
  <line x1="544" y1="304.0" x2="555" y2="304.0" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="358" class="sub" text-anchor="start">MERGE를 함께 지정하면 부모를 merge할 때 Childs가 가진 자식에도 merge가 전이됩니다.</text>
</svg>
