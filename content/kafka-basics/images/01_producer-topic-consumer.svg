<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 326" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>프로듀서가 파티션 3개로 구성된 토픽에 메시지를 보내면 메시지는 파티션 1 하나에만 저장되고, 컨슈머는 파티션에서 데이터를 가져가는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .chip { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
    .grp { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="326" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="306" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">카프카 기본 구조 — 메시지 한 건은 한 파티션에만 저장</text>
  <rect x="30" y="136" width="130" height="80" rx="8" class="box"/>
  <text x="95" y="172" class="t" text-anchor="middle">프로듀서</text>
  <text x="95" y="192" class="sub" text-anchor="middle">데이터를 보냄</text>
  <rect x="210" y="62" width="360" height="200" rx="10" class="grp"/>
  <text x="230" y="86" class="t">토픽</text>
  <text x="268" y="86" class="sub">하나 이상의 파티션으로 구성</text>
  <rect x="236" y="102" width="310" height="44" rx="8" class="box"/>
  <text x="391" y="121" class="t" text-anchor="middle">파티션 0</text>
  <text x="391" y="138" class="sub" text-anchor="middle">저장되지 않음</text>
  <line x1="548" y1="124" x2="616" y2="176" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="236" y="154" width="310" height="44" rx="8" class="ok"/>
  <text x="391" y="173" class="okt" text-anchor="middle">파티션 1</text>
  <text x="391" y="190" class="gnote" text-anchor="middle">이번 메시지가 저장됨</text>
  <line x1="548" y1="176" x2="616" y2="176" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="236" y="206" width="310" height="44" rx="8" class="box"/>
  <text x="391" y="225" class="t" text-anchor="middle">파티션 2</text>
  <text x="391" y="242" class="sub" text-anchor="middle">저장되지 않음</text>
  <line x1="548" y1="228" x2="616" y2="176" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="162" y1="176" x2="232" y2="176" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="186" y="166" class="val" text-anchor="middle">메시지</text>
  <rect x="620" y="136" width="110" height="80" rx="8" class="box"/>
  <text x="675" y="172" class="t" text-anchor="middle">컨슈머</text>
  <text x="675" y="192" class="sub" text-anchor="middle">데이터를 가져감</text>
  <text x="30" y="294" class="foot">프로듀서가 보낸 메시지는 3개의 파티션에 복사되지 않고, 그중 하나의 파티션에만 저장됩니다.</text>
</svg>
