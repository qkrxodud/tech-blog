  <line x1="320" y1="222" x2="320" y2="236" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <line x1="320" y1="284" x2="320" y2="298" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
