  <rect width="760" height="470" fill="#ffffff"/>
  <text x="24" y="28" class="h">11장 — 메시지를 받는 쪽에서 정하는 네 가지</text>
  <text x="24" y="48" class="gs" style="font-size:11.5px">9장부터 결제 서버는 결제 결과를 적어도 한 번 보냄 · 10장 재고 명령도 같은 릴레이로 나감</text>
  <rect x="14" y="78" width="196" height="214" rx="16" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
