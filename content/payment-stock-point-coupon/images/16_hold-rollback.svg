  <text x="398" y="421" class="badt" style="font-size:12px">통째로 롤백</text>
  <text x="398" y="446" class="bads" style="font-size:9.5px"><tspan class="m">InsufficientPointException</tspan></text>
  <line x1="478" y1="398" x2="478" y2="338" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="486" y="374" class="bads" style="font-size:10.5px">되돌림</text>
  <rect x="386" y="172" width="184" height="164" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="400" y="194" class="t2" style="font-size:12px">남지 않음</text>
  <text x="400" y="220" class="s" style="font-size:11px">재고 5 그대로</text>
  <text x="400" y="242" class="s" style="font-size:11px">쿠폰 <tspan class="m">ISSUED</tspan></text>
  <text x="400" y="264" class="s" style="font-size:11px">결제 <tspan class="m">READY</tspan></text>
  <text x="400" y="286" class="s" style="font-size:11px">(인증도 안 남음)</text>
  <rect x="600" y="172" width="136" height="60" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <use href="#i-server" x="612" y="186"/>
  <text x="656" y="196" class="t2" style="font-size:12px">Mock PG</text>
  <text x="656" y="216" class="bads" style="font-size:11px">승인 요청 0</text>
  <line x1="668" y1="234" x2="668" y2="300" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="668" y="318" class="bads" text-anchor="middle" style="font-size:10.5px">가지 않음</text>
  <rect x="24" y="496" width="712" height="50" rx="12" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="44" y="517" class="badt" style="font-size:12px">답 <tspan class="m">409 INSUFFICIENT_POINT</tspan> — 재고 <tspan class="m">OUT_OF_STOCK</tspan> · 쿠폰 <tspan class="m">COUPON_NOT_AVAILABLE</tspan>도 같은 길</text>
  <text x="44" y="536" class="bads" style="font-size:10.5px">재고·쿠폰은 <tspan class="m">JdbcTemplate</tspan> 문장, 인증은 JPA — 함께 롤백되는지 실행으로 확인(<tspan class="m">HoldRefusalTest</tspan> 4개 통과)</text>
