  <title>결정 다섯 가지의 글 순서와 커밋 순서 — 글은 결정 1 재고를 언제 어떻게 잡을까, 2 Saga 진행을 누가 쥘까, 3 재고 서비스는 무엇을 남길까, 4 예약 답을 받지 못하면, 5 확정과 해제를 어떻게 보낼까 순서이고, 커밋은 1·3·2·4·5 순서(7e96b17, fd67a08, 3d22a0a, 8ec250f, 17f6e27)로 함. 결정 2의 비교 구현(코레오그래피)이 결정 3의 예약 기록이 있어야 돌기 때문</title>
