    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.015;0.02;0.9;0.91;1"/>
  </g>
  <g class="anim" opacity="0">
    <use href="#pkt2"/>
