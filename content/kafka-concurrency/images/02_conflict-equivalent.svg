  <rect x="61" y="318" width="88" height="24" rx="6" class="box"/>
  <text x="105" y="335" class="monob" text-anchor="middle">w1(H)</text>
  <rect x="61" y="348" width="88" height="24" rx="6" class="box"/>
  <text x="105" y="365" class="monob" text-anchor="middle">c1</text>
  <text x="275" y="104" class="monob" text-anchor="middle">sched.2</text>
