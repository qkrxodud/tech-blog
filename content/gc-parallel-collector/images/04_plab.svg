<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>Parallel GC의 GC 스레드 두 개가 old generation과 survivor에 각자 PLAB를 가지고, old는 OldPLABSize 1024 heap words, young은 YoungPLABSize 4096 heap words가 기본값이다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
    .monob { font-family: Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #1f2937; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dark { fill: #d1d5db; stroke: #6b7280; stroke-width: 1.2; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .sep { stroke: #e5e7eb; stroke-width: 1; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="350" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="330" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">PLAB — GC 스레드마다 가지는 promotion 버퍼</text>
  <text x="730" y="42" class="code" text-anchor="end">-XX:+UseParallelGC</text>
  <path d="M 40 90 L 40 82 L 420 82 L 420 90" class="al"/>
  <text x="230" y="76" class="sub" text-anchor="middle">max old generation (reserved)</text>
  <path d="M 420 90 L 420 82 L 720 82 L 720 90" class="al"/>
  <text x="570" y="76" class="sub" text-anchor="middle">max young generation (reserved)</text>
  <rect x="40" y="92" width="320" height="60" rx="4" class="hold"/>
  <text x="100" y="128" class="op" text-anchor="middle">old</text>
  <rect x="360" y="92" width="60" height="60" rx="4" class="wait"/>
  <text x="390" y="128" class="waitt" text-anchor="middle">virtual</text>
  <rect x="420" y="92" width="120" height="60" rx="4" class="box"/>
  <text x="480" y="128" class="op" text-anchor="middle">eden</text>
  <rect x="540" y="92" width="120" height="60" rx="4" class="box"/>
  <text x="600" y="112" class="val" text-anchor="middle">survivor</text>
  <rect x="660" y="92" width="60" height="60" rx="4" class="wait"/>
  <text x="690" y="128" class="waitt" text-anchor="middle">virtual</text>
  <rect x="170" y="112" width="38" height="26" rx="3" class="ok"/>
  <text x="189" y="130" class="okt" text-anchor="middle">T1</text>
  <rect x="212" y="112" width="38" height="26" rx="3" class="dark"/>
  <text x="231" y="130" class="op" text-anchor="middle">T2</text>
  <rect x="556" y="120" width="38" height="26" rx="3" class="ok"/>
  <text x="575" y="138" class="okt" text-anchor="middle">T1</text>
  <rect x="598" y="120" width="38" height="26" rx="3" class="dark"/>
  <text x="617" y="138" class="op" text-anchor="middle">T2</text>
  <text x="40" y="180" class="op">old generation의 PLAB</text>
  <text x="40" y="200" class="val">old generation으로 promotion 할 때 사용</text>
  <text x="440" y="180" class="op">survivor의 PLAB</text>
  <text x="440" y="200" class="val">to-survivor로 이동할 때 사용</text>
  <text x="40" y="220" class="val"><tspan font-family="Menlo, Consolas, monospace">OldPLABSize</tspan> = 1024 heap words</text>
  <text x="440" y="220" class="val"><tspan font-family="Menlo, Consolas, monospace">YoungPLABSize</tspan> = 4096 heap words</text>
  <line x1="30" y1="240" x2="730" y2="240" class="sep"/>
  <rect x="40" y="256" width="30" height="22" rx="3" class="ok"/>
  <text x="80" y="272" class="val">GC-thread-1 PLAB</text>
  <rect x="220" y="256" width="30" height="22" rx="3" class="dark"/>
  <text x="260" y="272" class="val">GC-thread-2 PLAB</text>
  <text x="40" y="306" class="gnote">GC 스레드끼리 같은 공간을 두고 동기화하지 않도록 각자 버퍼를 가짐</text>
  <text x="40" y="328" class="sub">TLAB와 비슷하지만 TLAB는 application thread에게 할당됨</text>
</svg>
