<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>금액이 0 이하인 준비를 막는 자리 두 가지 — 구현하지 않은 요청 DTO의 Bean Validation(@NotNull, @Positive)과 컨트롤러의 @Valid는 API로 들어온 요청에만 걸리고, 고른 Payment.create 검사는 API뿐 아니라 테스트나 나중에 생길 배치·메시지 처리처럼 API가 아닌 경로로 결제를 만들어도 같은 규칙이 적용됨. API 길에서는 400 INVALID_AMOUNT, 테스트·배치 길에서는 InvalidAmountException을 받음. 같은 주문번호로 다시 준비하는 길은 Payment.create를 지나지 않고 verifyPreparedAmount가 같은 검사를 함. 1장에서 상태 전이 규칙을 Payment 안에 둔 것과 같은 이유이고, 빌드에는 spring-boot-starter-validation이 있지만 검사 애노테이션을 쓴 곳이 없어 도메인 쪽에 맞춤. 대신 Bean Validation처럼 필드 오류를 모아 알리지 못하고 첫 오류 하나만 알림. 요청 필드가 많고 잘못된 필드를 한 번에 알려야 하는 API라면 형식 검사는 Bean Validation, 업무 규칙은 도메인으로 나누는 편이 맞음</title>
