<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>AccountController, SendMoneyUseCase, SendMoneyService, UpdateAccountStatePort, AccountPersistenceAdapter가 모두 같은 Account 모델을 주고받아 계층 간 매핑이 없는 구조</title>
  <style>
