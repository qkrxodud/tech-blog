<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>11장 개요 — 결제 서버의 payment_outbox 번호를 단 메시지를 9장 릴레이가 적어도 한 번 보내(보낸 때를 남기기 전에 서버가 멈추면 같은 메시지를 다시 받을 수 있음) Kafka의 payment-events(결제 결과)와 stock-reservation-commands(확정·해제 명령)로 나가고, 받는 쪽 주문 서비스는 결제 결과로 주문 상태를, 재고 서비스는 명령으로 예약 상태를 바꿈. 이 장은 받는 쪽 두 곳에 같은 규칙을 넣어 같은 메시지 가리기, 늦게 온 옛 메시지 거르기, 실패한 메시지를 언제 다시 시도할지, 다시 시도를 다 쓴 메시지를 어디에 모을지 네 가지를 정하고, Redis·보낸 줄 지우기·예약 만료(TTL)는 범위 밖으로 둔 그림</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 13px; font-weight: 700; fill: #1f2937; }
