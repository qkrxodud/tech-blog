  <rect x="525" y="90" width="190" height="48" rx="8" class="ok"/>
  <text x="620" y="110" class="okt" text-anchor="middle">주문2 → SimpleOrderDto</text>
  <text x="620" y="129" class="val" text-anchor="middle">추가 SQL 없음</text>
  <text x="30" y="192" class="lane">SQL</text>
  <text x="30" y="210" class="sub">DB로 나간 SQL</text>
  <rect x="150" y="170" width="585" height="56" rx="6" class="track"/>
  <rect x="155" y="174" width="560" height="48" rx="8" class="dbbox"/>
  <text x="435" y="194" class="m" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">ORDERS join MEMBER join DELIVERY</tspan></text>
  <text x="435" y="213" class="val" text-anchor="middle">주문 2건과 회원·배송을 함께 가져옴</text>
