<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 428" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>V3.1에서 주문과 회원, 배송을 페치 조인해 페이징으로 한 번 조회한 뒤, 옵션이 없으면 orderItems와 item을 지연 로딩할 때마다 쿼리가 N번씩 나가고, default_batch_fetch_size를 설정하면 주문 id와 상품 id를 모아 IN 쿼리로 한 번씩 조회해 1 + N이 1 + 1이 되는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="428" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="196" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h" text-anchor="start">V3.1 옵션 없음 — 지연 로딩마다 쿼리</text>
  <text x="730" y="42" class="code" text-anchor="end">ordersV3_page</text>
  <text x="140" y="72" class="step" text-anchor="middle">1단계</text>
  <text x="380" y="72" class="step" text-anchor="middle">2단계 — 컬렉션 지연 로딩</text>
  <text x="620" y="72" class="step" text-anchor="middle">3단계 — 프록시 지연 로딩</text>
  <rect x="30" y="82" width="220" height="56" rx="8" class="box"/>
  <text x="140.0" y="102" class="t" text-anchor="middle">주문 1번</text>
  <text x="140.0" y="121" class="val" text-anchor="middle">회원·배송 페치 조인 + 페이징</text>
  <rect x="270" y="82" width="220" height="56" rx="8" class="bad"/>
  <text x="380.0" y="102" class="badt" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">orderItems</tspan> 쿼리 N번</text>
  <text x="380.0" y="121" class="val" text-anchor="middle">주문마다 한 번씩 조회</text>
  <rect x="510" y="82" width="220" height="56" rx="8" class="bad"/>
  <text x="620.0" y="102" class="badt" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">item</tspan> 쿼리 N번</text>
  <text x="620.0" y="121" class="val" text-anchor="middle">주문 상품마다 한 번씩 조회</text>
  <line x1="252" y1="110" x2="266" y2="110" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="492" y1="110" x2="506" y2="110" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="30" y="156" width="330" height="32" rx="15" class="bad"/>
  <text x="195" y="177" class="badt" text-anchor="middle">지연 로딩 대상마다 1 + N</text>
  <text x="380" y="177" class="val" text-anchor="start">조회한 데이터가 많을수록 쿼리 수가 늘어남</text>
  <rect x="10" y="222" width="740" height="196" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="254" class="h" text-anchor="start">default_batch_fetch_size 적용 — IN 쿼리로 묶음</text>
  <text x="730" y="254" class="code" text-anchor="end">default_batch_fetch_size: 1000</text>
  <text x="140" y="284" class="step" text-anchor="middle">1단계</text>
  <text x="380" y="284" class="step" text-anchor="middle">2단계 — 컬렉션 지연 로딩</text>
  <text x="620" y="284" class="step" text-anchor="middle">3단계 — 프록시 지연 로딩</text>
  <rect x="30" y="294" width="220" height="56" rx="8" class="box"/>
  <text x="140.0" y="314" class="t" text-anchor="middle">주문 1번</text>
  <text x="140.0" y="333" class="val" text-anchor="middle">회원·배송 페치 조인 + 페이징</text>
  <rect x="270" y="294" width="220" height="56" rx="8" class="ok"/>
  <text x="380.0" y="314" class="okt" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">orderItems</tspan> IN 쿼리 1번</text>
  <text x="380.0" y="333" class="val" text-anchor="middle">주문 id를 size만큼 모아 조회</text>
  <rect x="510" y="294" width="220" height="56" rx="8" class="ok"/>
  <text x="620.0" y="314" class="okt" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">item</tspan> IN 쿼리 1번</text>
  <text x="620.0" y="333" class="val" text-anchor="middle">상품 id를 size만큼 모아 조회</text>
  <line x1="252" y1="322" x2="266" y2="322" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="492" y1="322" x2="506" y2="322" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="30" y="368" width="330" height="32" rx="15" class="ok"/>
  <text x="195" y="389" class="okt" text-anchor="middle">지연 로딩 대상마다 1 + N → 1 + 1</text>
  <text x="380" y="389" class="val" text-anchor="start">페이징 가능, 중복 데이터 전송 없음</text>
</svg>
