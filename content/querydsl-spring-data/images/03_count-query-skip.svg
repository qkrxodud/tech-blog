<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>size 10으로 첫 페이지를 조회해 내용이 member1부터 member4까지 4건이면 전체 개수를 4로 정하고, 샘플 데이터 100건을 size 30으로 조회한 page 3의 내용이 10건이면 offset 90에 10을 더한 100을 전체 개수로 정해 두 경우 모두 count 쿼리를 생략하는 예시</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .msg { font-size: 11.5px; fill: #374151; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .cont { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="300" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="280" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">count 쿼리 생략 — 내용 결과만으로 전체 개수를 앎</text>
  <text x="730" y="42" class="code" text-anchor="end">PageableExecutionUtils.getPage</text>
  <text x="30" y="76" class="step" text-anchor="start">요청</text>
  <text x="200" y="76" class="step" text-anchor="start">내용 쿼리 결과</text>
  <text x="400" y="76" class="step" text-anchor="start">판단</text>
  <text x="570" y="76" class="step" text-anchor="start">전체 개수</text>
  <rect x="30" y="88" width="150" height="60" rx="8" class="hold"/>
  <text x="105.0" y="113.5" class="ts" text-anchor="middle">첫 페이지</text>
  <text x="105.0" y="132.5" class="m" text-anchor="middle">page=0, size=10</text>
  <rect x="200" y="88" width="180" height="60" rx="8" class="box"/>
  <text x="290.0" y="113.5" class="m" text-anchor="middle">member1~member4</text>
  <text x="290.0" y="132.5" class="val" text-anchor="middle">4건</text>
  <rect x="400" y="88" width="150" height="60" rx="8" class="box"/>
  <text x="475.0" y="113.5" class="val" text-anchor="middle">시작 페이지이고</text>
  <text x="475.0" y="132.5" class="m" text-anchor="middle">4 &lt; 10</text>
  <rect x="570" y="88" width="160" height="60" rx="8" class="ok"/>
  <text x="650.0" y="113.5" class="okm" text-anchor="middle">4</text>
  <text x="650.0" y="132.5" class="gnote" text-anchor="middle">count 쿼리 생략</text>
  <rect x="30" y="168" width="150" height="60" rx="8" class="hold"/>
  <text x="105.0" y="193.5" class="ts" text-anchor="middle">마지막 페이지</text>
  <text x="105.0" y="212.5" class="m" text-anchor="middle">page=3, size=30</text>
  <rect x="200" y="168" width="180" height="60" rx="8" class="box"/>
  <text x="290.0" y="193.5" class="val" text-anchor="middle">샘플 100건 중</text>
  <text x="290.0" y="212.5" class="val" text-anchor="middle">10건 (offset 90)</text>
  <rect x="400" y="168" width="150" height="60" rx="8" class="box"/>
  <text x="475.0" y="193.5" class="val" text-anchor="middle">마지막 페이지</text>
  <text x="475.0" y="212.5" class="m" text-anchor="middle">10 &lt; 30</text>
  <rect x="570" y="168" width="160" height="60" rx="8" class="ok"/>
  <text x="650.0" y="193.5" class="okm" text-anchor="middle">90 + 10 = 100</text>
  <text x="650.0" y="212.5" class="gnote" text-anchor="middle">count 쿼리 생략</text>
  <line x1="180" y1="118" x2="196" y2="118" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="380" y1="118" x2="396" y2="118" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="550" y1="118" x2="566" y2="118" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="180" y1="198" x2="196" y2="198" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="380" y1="198" x2="396" y2="198" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="550" y1="198" x2="566" y2="198" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="30" y="262" class="foot" text-anchor="start">마지막 페이지는 offset과 컨텐츠 사이즈를 더해 전체 사이즈를 구합니다</text>
</svg>
