<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 5 선택지 비교 — 보내고 답이 오면 남기는 방식(적어도 한 번, 고름)은 send로 브로커에 남긴 뒤 markSent 전에 죽어도 sent_at이 비어 있어 다음 주기에 다시 send해 같은 고유 번호로 두 번 도착하고(중복 1) 유실은 0이다. 먼저 보낸 것으로 남기고 보내는 방식(최대 한 번)은 markSent 뒤 보내려던 자리에서 죽으면 보낸 것으로 남아 다시 보내지 않아 15초 안에 도착하지 않고 8개 중 3개 계약이 실패한다. 중복은 받는 쪽이 고유 번호로 가려야 하며 11장에서 다룬다</title>
