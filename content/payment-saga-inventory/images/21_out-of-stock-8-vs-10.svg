  <rect width="760" height="450" fill="#ffffff"/>
  <text x="24" y="30" class="h">재고가 모자랄 때 — 8장과 10장</text>
  <text x="24" y="52" class="gs">10장은 인증을 커밋한 뒤 재고를 잡음 · 하나라도 모자라면 재고 서비스는 아무것도 줄이지 않음</text>
  <text x="24" y="86" class="t2" style="font-size:13px">8장</text>
  <rect x="70" y="66" width="266" height="70" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <use href="#i-lock" transform="translate(82,82) scale(0.9)"/>
  <text x="120" y="92" class="t2" style="font-size:12px">인증 트랜잭션 안에서</text>
  <text x="120" y="112" class="s2" style="font-size:11px">재고 줄이기 → 모자람</text>
