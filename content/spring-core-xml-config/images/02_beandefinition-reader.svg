<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>자바 코드, XML, 새로운 형식의 설정을 각각의 BeanDefinitionReader가 읽어 BeanDefinition을 만들고, 스프링 컨테이너는 BeanDefinition에만 의존하는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .pkg { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .gnote { font-size: 12px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="760" height="460" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="440" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">BeanDefinition — 설정 형식이 달라도 컨테이너는 이것만 안다</text>
  <rect x="200" y="62" width="360" height="54" rx="8" class="box"/>
  <text x="380" y="85" class="t" text-anchor="middle">스프링 컨테이너</text>
  <text x="380" y="104" class="s" text-anchor="middle">메타 정보를 기반으로 스프링 빈 생성</text>
  <rect x="200" y="156" width="360" height="54" rx="8" class="ok"/>
  <text x="380" y="179" class="okc" text-anchor="middle">BeanDefinition</text>
  <text x="380" y="198" class="s" text-anchor="middle">빈 설정 메타 정보 — @Bean, bean 태그당 하나</text>
  <line x1="380" y1="156" x2="380" y2="119" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="392" y="142" class="gnote">BeanDefinition만 의존</text>
  <rect x="30" y="256" width="220" height="48" rx="8" class="box"/>
  <text x="140" y="276" class="ms" text-anchor="middle">AnnotatedBeanDefinitionReader</text>
  <text x="140" y="294" class="s" text-anchor="middle">읽어서 BeanDefinition 생성</text>
  <rect x="60" y="344" width="160" height="40" rx="8" class="pkg"/>
  <text x="140" y="369" class="m" text-anchor="middle">AppConfig.class</text>
  <line x1="140" y1="344" x2="140" y2="307" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ag)"/>
  <rect x="270" y="256" width="220" height="48" rx="8" class="box"/>
  <text x="380" y="276" class="ms" text-anchor="middle">XmlBeanDefinitionReader</text>
  <text x="380" y="294" class="s" text-anchor="middle">읽어서 BeanDefinition 생성</text>
  <rect x="300" y="344" width="160" height="40" rx="8" class="pkg"/>
  <text x="380" y="369" class="m" text-anchor="middle">appConfig.xml</text>
  <line x1="380" y1="344" x2="380" y2="307" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ag)"/>
  <rect x="510" y="256" width="220" height="48" rx="8" class="wait"/>
  <text x="620" y="276" class="ms" text-anchor="middle">XxxBeanDefinitionReader</text>
  <text x="620" y="294" class="s" text-anchor="middle">읽어서 BeanDefinition 생성</text>
  <rect x="540" y="344" width="160" height="40" rx="8" class="wait"/>
  <text x="620" y="369" class="m" text-anchor="middle">appConfig.xxx</text>
  <line x1="620" y1="344" x2="620" y2="307" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ag)"/>
  <line x1="140" y1="256" x2="262" y2="213" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="380" y1="256" x2="380" y2="213" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="620" y1="256" x2="498" y2="213" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="140" y="404" class="s" text-anchor="middle">자바 코드</text>
  <text x="380" y="404" class="s" text-anchor="middle">XML</text>
  <text x="620" y="404" class="s" text-anchor="middle">새로운 형식</text>
  <text x="30" y="434" class="foot">새로운 형식이 추가되면 <tspan font-family="Menlo, Consolas, monospace">XxxBeanDefinitionReader</tspan>만 만들면 되고, 스프링 컨테이너는 바뀌지 않습니다.</text>
</svg>
