<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 442" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>calculatePay가 직원 유형마다 switch로 분기하는 구조와, EmployeeFactoryImpl에서만 switch로 파생 클래스를 만들고 Employee 인터페이스로 호출하는 구조의 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 12.5px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="760" height="442" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="196" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">switch 문 — 직원 유형마다 분기하는 calculatePay</text>
  <rect x="30" y="86" width="240" height="48" rx="8" class="bad"/>
  <text x="150" y="106" class="badm" text-anchor="middle">calculatePay(e)</text>
  <text x="150" y="125" class="ms" text-anchor="middle">switch (e.type)</text>
  <line x1="272" y1="104" x2="336" y2="80" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ag)"/>
  <line x1="272" y1="110" x2="336" y2="118" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ag)"/>
  <line x1="272" y1="116" x2="336" y2="154" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ag)"/>
  <rect x="340" y="62" width="260" height="32" rx="6" class="box"/>
  <text x="470" y="82.5" class="m" text-anchor="middle">calculateCommissionedPay(e)</text>
  <rect x="340" y="102" width="260" height="32" rx="6" class="box"/>
  <text x="470" y="122.5" class="m" text-anchor="middle">calculateHourlyPay(e)</text>
  <rect x="340" y="142" width="260" height="32" rx="6" class="box"/>
  <text x="470" y="162.5" class="m" text-anchor="middle">calculateSalariedPay(e)</text>
  <text x="610" y="104" class="note">유형이 늘면</text>
  <text x="610" y="122" class="note">코드를 변경</text>
  <text x="30" y="194" class="note">새 직원 유형을 추가할 때마다 코드를 변경해야 하고, 구조가 동일한 함수가 계속 늘어납니다. (SRP·OCP 위반)</text>

  <rect x="10" y="222" width="740" height="210" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="254" class="h">다형성 — 팩토리에서만 switch로 파생 클래스를 생성</text>
  <rect x="30" y="292" width="230" height="70" rx="8" class="hold"/>
  <text x="145" y="314" class="opm" text-anchor="middle">EmployeeFactoryImpl</text>
  <text x="145" y="333" class="m" text-anchor="middle">makeEmployee(r)</text>
  <text x="145" y="351" class="ms" text-anchor="middle">switch (r.type)</text>
  <line x1="262" y1="316" x2="306" y2="290" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ag)"/>
  <line x1="262" y1="327" x2="306" y2="330" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ag)"/>
  <line x1="262" y1="338" x2="306" y2="368" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ag)"/>
  <rect x="310" y="274" width="190" height="32" rx="6" class="box"/>
  <text x="405" y="294.5" class="m" text-anchor="middle">CommissionedEmployee</text>
  <rect x="310" y="314" width="190" height="32" rx="6" class="box"/>
  <text x="405" y="334.5" class="m" text-anchor="middle">HourlyEmployee</text>
  <rect x="310" y="354" width="190" height="32" rx="6" class="box"/>
  <text x="405" y="374.5" class="m" text-anchor="middle">SalariedEmployee</text>
  <line x1="502" y1="290" x2="548" y2="314" stroke="#6b7280" stroke-width="1.3" marker-end="url(#tri)"/>
  <line x1="502" y1="330" x2="548" y2="330" stroke="#6b7280" stroke-width="1.3" marker-end="url(#tri)"/>
  <line x1="502" y1="370" x2="548" y2="346" stroke="#6b7280" stroke-width="1.3" marker-end="url(#tri)"/>
  <rect x="550" y="284" width="180" height="92" rx="8" class="ok"/>
  <text x="640" y="306" class="okc" text-anchor="middle">Employee</text>
  <text x="640" y="326" class="m" text-anchor="middle">isPayday()</text>
  <text x="640" y="344" class="m" text-anchor="middle">calculatePay()</text>
  <text x="640" y="362" class="m" text-anchor="middle">deliverPay(Money pay)</text>
  <text x="30" y="416" class="gnote">switch 문은 팩토리 한 곳에만 남고, 나머지 코드는 Employee 인터페이스를 거쳐 함수를 호출합니다.</text>
</svg>
