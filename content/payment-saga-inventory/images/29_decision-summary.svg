<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>10장 결정 다섯 가지 한눈에 — 출발 코드에서 692개 중 8개가 실패했고 완성 코드에서 713개가 모두 통과함. 결정 1 재고는 인증을 커밋한 뒤 카드사 승인 전에 동기 HTTP로 예약하고 시간 제한은 연결 300ms·읽기 1s이며, 승인 먼저는 계약 7개가 실패하고 재고가 모자란 주문도 승인 뒤 취소됨. 결정 2 결제 서버가 결제 상태로 확정·해제 명령을 보내고(오케스트레이션), 코레오그래피도 21개를 모두 통과해 계약으로 갈리지 않음. 결정 3 재고 서비스는 결제 번호로 예약 줄을 남기고 잡음 → 확정 / 해제로 바꾸며, 수량만은 해제가 먼저 오거나 두 번 오면 재고 7(처음 5). 결정 4 예약 답이 없으면 카드사에 요청하지 않고 닫은 뒤 해제를 보내며(504), 실패로만은 측정에서 재고 10개가 돌아오지 않고 조회로 확인은 계약 1개 실패와 늦을 때 응답 2040~2045ms. 결정 5 확정·해제는 상태 전이 트랜잭션에서 payment_outbox에 남기고 9장 릴레이가 결제 번호 키로 보내며, 그 자리 HTTP는 멈춘 동안 해제 5건이 사라져 측정 어긋난 재고 −5</title>
