<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>sumOverThreeAndDouble에서 1부터 6까지의 숫자가 filter(number > 3)로 4, 5, 6만 남고, map(number * 2)로 8, 10, 12가 된 뒤, reduce로 0에서 시작해 더해 30이 되는 그림</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .bt { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .gl { font-size: 12.5px; font-weight: 700; fill: #6b7280; }
    .cv { font-family: Menlo, Consolas, monospace; font-size: 12.5px; fill: #4b5563; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="310" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="290" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">sumOverThreeAndDouble — filter, map, reduce 단계별 값</text>
  <rect x="30" y="62" width="170" height="48" rx="8" class="hold"/>
  <text x="115" y="82" class="opm" text-anchor="middle" font-size="13">numbers.stream()</text>
  <text x="115" y="100" class="val" text-anchor="middle">1부터 6까지</text>
  <rect x="215" y="62" width="170" height="48" rx="8" class="box"/>
  <text x="300" y="82" class="opm" text-anchor="middle" font-size="13">filter(number &gt; 3)</text>
  <text x="300" y="100" class="val" text-anchor="middle">3보다 큰 수만 남김</text>
  <rect x="400" y="62" width="170" height="48" rx="8" class="box"/>
  <text x="485" y="82" class="opm" text-anchor="middle" font-size="13">map(number * 2)</text>
  <text x="485" y="100" class="val" text-anchor="middle">남은 수를 2배</text>
  <rect x="583" y="62" width="150" height="48" rx="8" class="ok"/>
  <text x="658" y="82" class="okc" text-anchor="middle" font-size="13">reduce(0, ...)</text>
  <text x="658" y="100" class="val" text-anchor="middle">total + number</text>
  <line x1="201" y1="86" x2="213" y2="86" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="386" y1="86" x2="398" y2="86" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="571" y1="86" x2="581" y2="86" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="30" y="142" class="gl">스트림의 값</text>
  <line x1="30" y1="150" x2="735" y2="150" stroke="#eceef1"/>
  <rect x="27" y="164" width="26" height="28" rx="5" class="dbbox"/>
  <text x="40" y="183" class="db" text-anchor="middle" font-size="13">1</text>
  <rect x="57" y="164" width="26" height="28" rx="5" class="dbbox"/>
  <text x="70" y="183" class="db" text-anchor="middle" font-size="13">2</text>
  <rect x="87" y="164" width="26" height="28" rx="5" class="dbbox"/>
  <text x="100" y="183" class="db" text-anchor="middle" font-size="13">3</text>
  <rect x="117" y="164" width="26" height="28" rx="5" class="dbbox"/>
  <text x="130" y="183" class="db" text-anchor="middle" font-size="13">4</text>
  <rect x="147" y="164" width="26" height="28" rx="5" class="dbbox"/>
  <text x="160" y="183" class="db" text-anchor="middle" font-size="13">5</text>
  <rect x="177" y="164" width="26" height="28" rx="5" class="dbbox"/>
  <text x="190" y="183" class="db" text-anchor="middle" font-size="13">6</text>
  <rect x="257" y="164" width="26" height="28" rx="5" class="dbbox"/>
  <text x="270" y="183" class="db" text-anchor="middle" font-size="13">4</text>
  <rect x="287" y="164" width="26" height="28" rx="5" class="dbbox"/>
  <text x="300" y="183" class="db" text-anchor="middle" font-size="13">5</text>
  <rect x="317" y="164" width="26" height="28" rx="5" class="dbbox"/>
  <text x="330" y="183" class="db" text-anchor="middle" font-size="13">6</text>
  <text x="300" y="214" class="note" text-anchor="middle">1, 2, 3은 걸러짐</text>
  <rect x="442" y="164" width="26" height="28" rx="5" class="dbbox"/>
  <text x="455" y="183" class="db" text-anchor="middle" font-size="13">8</text>
  <rect x="472" y="164" width="26" height="28" rx="5" class="dbbox"/>
  <text x="485" y="183" class="db" text-anchor="middle" font-size="13">10</text>
  <rect x="502" y="164" width="26" height="28" rx="5" class="dbbox"/>
  <text x="515" y="183" class="db" text-anchor="middle" font-size="13">12</text>
  <rect x="618" y="164" width="80" height="28" rx="5" class="ok"/>
  <text x="658" y="183" class="okt" text-anchor="middle">30</text>
  <text x="658" y="214" class="sub" text-anchor="middle">0 + 8 = 8</text>
  <text x="658" y="232" class="sub" text-anchor="middle">8 + 10 = 18</text>
  <text x="658" y="250" class="sub" text-anchor="middle">18 + 12 = 30</text>
  <text x="30" y="282" class="sub">numbers가 1부터 6까지일 때의 값입니다. filter와 map은 다음 단계로 스트림을 넘기고, reduce가 최종 결과 30을 만듭니다.</text>
</svg>
