<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>리팩터링 전에는 memberService와 orderService가 각각 new MemoryMemberRepository를 호출하고, 리팩터링 후에는 memberRepository와 discountPolicy 메서드가 역할별 구현을 반환하는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .lanec { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .gmsg { font-size: 12px; fill: #15803d; }
    .rmsg { font-size: 12px; fill: #b91c1c; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 12px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .rm { font-size: 12px; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="760" height="456" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="196" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">리팩터링 전 — 같은 구현을 두 곳에서 생성</text>
  <rect x="30" y="70" width="190" height="44" rx="8" class="box"/>
  <text x="125" y="97.0" class="opm" text-anchor="middle">memberService()</text>
  <rect x="30" y="130" width="190" height="44" rx="8" class="box"/>
  <text x="125" y="157.0" class="opm" text-anchor="middle">orderService()</text>
  <rect x="280" y="70" width="250" height="44" rx="8" class="bad"/>
  <text x="405" y="97.0" class="badm" text-anchor="middle">new MemoryMemberRepository()</text>
  <rect x="280" y="130" width="250" height="44" rx="8" class="bad"/>
  <text x="405" y="157.0" class="badm" text-anchor="middle">new MemoryMemberRepository()</text>
  <rect x="545" y="130" width="195" height="44" rx="8" class="box"/>
  <text x="642.5" y="157.0" class="m" text-anchor="middle">new RateDiscountPolicy()</text>
  <line x1="222" y1="92" x2="277" y2="92" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="222" y1="152" x2="277" y2="152" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="30" y="196" class="foot">중복이 있고, 어떤 역할에 어떤 구현을 쓰는지 메서드만 보고는 알기 어렵습니다.</text>
  <rect x="10" y="222" width="740" height="224" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="254" class="h">리팩터링 후 — 역할마다 메서드 하나</text>
  <text x="120" y="278" class="step" text-anchor="middle">사용하는 쪽</text>
  <text x="390" y="278" class="step" text-anchor="middle">역할</text>
  <text x="645" y="278" class="step" text-anchor="middle">구현</text>
  <rect x="30" y="290" width="180" height="44" rx="8" class="box"/>
  <text x="120" y="317.0" class="opm" text-anchor="middle">memberService()</text>
  <rect x="30" y="360" width="180" height="44" rx="8" class="box"/>
  <text x="120" y="387.0" class="opm" text-anchor="middle">orderService()</text>
  <rect x="290" y="290" width="200" height="44" rx="8" class="hold"/>
  <text x="390" y="308.0" class="opm" text-anchor="middle">memberRepository()</text>
  <text x="390" y="326.0" class="ms" text-anchor="middle">MemberRepository</text>
  <rect x="290" y="360" width="200" height="44" rx="8" class="hold"/>
  <text x="390" y="378.0" class="opm" text-anchor="middle">discountPolicy()</text>
  <text x="390" y="396.0" class="ms" text-anchor="middle">DiscountPolicy</text>
  <rect x="550" y="290" width="190" height="44" rx="8" class="ok"/>
  <text x="645" y="317.0" class="okm" text-anchor="middle">MemoryMemberRepository</text>
  <rect x="550" y="360" width="190" height="44" rx="8" class="ok"/>
  <text x="645" y="387.0" class="okm" text-anchor="middle">RateDiscountPolicy</text>
  <line x1="212" y1="312" x2="287" y2="312" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="212" y1="372" x2="287" y2="324" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="212" y1="386" x2="287" y2="386" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="492" y1="312" x2="547" y2="312" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="492" y1="382" x2="547" y2="382" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="432" class="foot">메서드 이름으로 역할이, 반환하는 객체로 구현이 한눈에 보입니다.</text>
</svg>
