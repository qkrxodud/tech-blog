<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 506" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>출발 구조의 전이 규칙 테스트 결과 — 상태 9개와 행위 7개로 만든 63개 조합 중 허용 표에 있는 전이 8개만 통과하고, 거부되어야 할 조합 47개는 예외 없이 실행되어 40개는 상태가 바뀌고 7개는 같은 값을 다시 대입했으며, CAPTURE_CANCELED에서 출발하는 7개는 그 상태에 도달하지 못했고, CAPTURED에서의 취소 1개는 APPROVAL_CANCELED가 된 그림</title>
