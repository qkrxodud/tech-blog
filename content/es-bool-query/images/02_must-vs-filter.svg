<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>must와 filter는 둘 다 조건에 맞지 않는 문서를 제외하지만, must만 score를 계산해 결과에 반영한다</title>
    <style>
      .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
      .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
      .step { font-size: 12px; fill: #9ca3af; }
      .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
      .sub { font-size: 12px; fill: #6b7280; }
      .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
      .val { font-size: 12.5px; fill: #4b5563; }
      .db { font-size: 14px; font-weight: 700; fill: #374151; }
      .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
      .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
      .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
      .track { fill: #ffffff; stroke: #eceef1; }
      .axis { stroke: #c4c8ce; stroke-width: 1.2; }
      .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .waitt { font-size: 12.5px; fill: #6b7280; }
      .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
      .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
      .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
      .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
      .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
      .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
      .note { font-size: 12.5px; fill: #b91c1c; }
      .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    </style>
    <defs>
      <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
      </marker>
      <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
      </marker>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
      </marker>
    </defs>
  <rect width="760" height="280" fill="#ffffff"/>

  <rect x="10" y="10" width="740" height="260" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">must와 filter — score를 계산하는지 비교</text>
  <text x="730" y="42" class="code" text-anchor="end">bool.must / bool.filter</text>

  <text x="214" y="68" class="step" text-anchor="middle">1. 문서</text>
  <text x="362" y="68" class="step" text-anchor="middle">2. 조건 검사</text>
  <text x="510" y="68" class="step" text-anchor="middle">3. score</text>
  <text x="658" y="68" class="step" text-anchor="middle">4. 결과</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>

  <text x="30" y="108" class="lane">must</text>
  <text x="30" y="126" class="sub">SQL의 AND</text>
  <rect x="140" y="80" width="595" height="64" rx="6" class="track"/>
  <rect x="150" y="88" width="128" height="48" rx="8" class="box"/>
  <text x="214" y="108" class="t" text-anchor="middle">문서</text>
  <text x="214" y="127" class="val" text-anchor="middle">검색 대상</text>
  <line x1="279" y1="112" x2="296" y2="112" class="axis" marker-end="url(#ar)"/>
  <rect x="298" y="88" width="128" height="48" rx="8" class="box"/>
  <text x="362" y="108" class="t" text-anchor="middle">조건 검사</text>
  <text x="362" y="127" class="val" text-anchor="middle">불일치는 제외</text>
  <line x1="427" y1="112" x2="444" y2="112" class="axis" marker-end="url(#ar)"/>
  <rect x="446" y="88" width="128" height="48" rx="8" class="ok"/>
  <text x="510" y="108" class="okc" text-anchor="middle">score</text>
  <text x="510" y="127" class="val" text-anchor="middle">관련도를 계산</text>
  <line x1="575" y1="112" x2="592" y2="112" class="axis" marker-end="url(#ar)"/>
  <rect x="594" y="88" width="128" height="48" rx="8" class="ok"/>
  <text x="658" y="108" class="okt" text-anchor="middle">결과</text>
  <text x="658" y="127" class="val" text-anchor="middle">score에 반영</text>

  <text x="30" y="180" class="lane">filter</text>
  <text x="30" y="198" class="sub">SQL의 AND</text>
  <rect x="140" y="152" width="595" height="64" rx="6" class="track"/>
  <rect x="150" y="160" width="128" height="48" rx="8" class="box"/>
  <text x="214" y="180" class="t" text-anchor="middle">문서</text>
  <text x="214" y="199" class="val" text-anchor="middle">검색 대상</text>
  <line x1="279" y1="184" x2="296" y2="184" class="axis" marker-end="url(#ar)"/>
  <rect x="298" y="160" width="128" height="48" rx="8" class="box"/>
  <text x="362" y="180" class="t" text-anchor="middle">조건 검사</text>
  <text x="362" y="199" class="val" text-anchor="middle">불일치는 제외</text>
  <line x1="427" y1="184" x2="444" y2="184" class="axis" marker-end="url(#ar)"/>
  <rect x="446" y="160" width="128" height="48" rx="8" class="hold"/>
  <text x="510" y="180" class="op" text-anchor="middle">score</text>
  <text x="510" y="199" class="val" text-anchor="middle">계산하지 않음</text>
  <line x1="575" y1="184" x2="592" y2="184" class="axis" marker-end="url(#ar)"/>
  <rect x="594" y="160" width="128" height="48" rx="8" class="hold"/>
  <text x="658" y="180" class="t" text-anchor="middle">결과</text>
  <text x="658" y="199" class="val" text-anchor="middle">score 영향 없음</text>

  <text x="30" y="246" class="sub">두 기능 모두 조건에 맞지 않는 문서를 결과에서 뺍니다. 차이는 3단계에서 score(관련도 수치)를 계산하는지 여부입니다.</text>
</svg>
