<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>앞 장 코드에서 바뀐 것 — 3장의 준비(PaymentPrepareRecorder)는 상품을 담은 준비면 PaymentOrders로 결제를 만들고 없으면 7장까지처럼 주문번호와 금액으로 만듦(결정 1). 2장의 승인 앞 기록(인증)에서 잡고 출발 코드가 승인 답 기록에서 하던 줄이기는 뺌(결정 2). 4·5·6장의 기록 다섯 곳이 바꾸기 전 상태를 들고 결제를 바꾼 뒤 releaseIfClosed를 부름(결정 4). 결제를 지우는 앞 장 시험 4개는 외래 키 때문에 payment_item을 먼저 지우고 PaymentPrepareServiceTest는 생성자 인자가 늘어 고침. 빌드의 모든 시험 태스크에 spring.test.context.cache.maxSize=10 — 결정 5 커밋에서 clean check 641개 중 20개가 웹훅 시험 두 묶음의 컨테이너 접속 실패로 실패했고, 캐시를 10개로 묶은 뒤 641개 모두 통과. 컨텍스트가 늘어 컨테이너가 한꺼번에 많이 떠 있던 탓으로 보았고 원인을 확정할 컨테이너 로그는 모으지 않음</title>
