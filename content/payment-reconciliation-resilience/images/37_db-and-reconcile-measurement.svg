<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>쓰는 중인 DB 연결과 대사 시간의 두 실행 범위 비교 — 장애 15초 측정에서 쓰는 중인 DB 연결 평균은 시간 제한만 0.14~0.17개, 다시 시도 0.05~0.07개, 차단기 6.98~7.00개이고 최대는 세 방식 모두 10/10(고객 20명이 같은 때 준비·인증 기록을 남긴 순간)이며, 카드사 답을 기다리는 동안은 연결을 쥐지 않고(2장) 차단기 평균 약 7개는 바로 실패한 고객이 쉬지 않고 다음 결제를 준비·기록(초당 약 240건)한 결과로 실제 재시도 간격은 재지 않음. 대사는 1천 건에서 운영 306~434ms(거래 조회 1번·결제 조회 10번), 결제마다 단건 조회 4783~4984ms(조회 1000번), 1만 건에서 운영 995~1033ms(거래 조회 3번·결제 조회 100번), 결제마다 35263~36130ms(조회 1만 번)이고 두 방식 모두 카드사에서만 취소된 10건·100건을 맞춘 그림</title>
