<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 282" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>@RequestParam의 required가 기본값 true이면 name 파라미터 없이 요청할 때 에러가 발생하고, false로 주면 파라미터 없이도 hello-mvc 템플릿이 HTML로 출력되는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .mxs { font-size: 11px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .chip { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .gscope { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="282" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="262" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">@RequestParam의 required — name 파라미터 없이 요청했을 때</text>
  <text x="730" y="42" class="code" text-anchor="end">/hello-mvc</text>
  <text x="30" y="90" class="code">required</text>
  <text x="30" y="110" class="badc">= true</text>
  <text x="30" y="128" class="sub">기본값</text>
  <rect x="150" y="66" width="585" height="72" rx="6" class="track"/>
  <rect x="160" y="78" width="132" height="48" rx="8" class="box"/>
  <text x="226.0" y="98.0" class="t" text-anchor="middle">요청</text>
  <text x="226.0" y="117.0" class="val" text-anchor="middle">name 파라미터 없음</text>
  <line x1="293" y1="102" x2="303" y2="102" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="305" y="78" width="132" height="48" rx="8" class="box"/>
  <text x="371.0" y="98.0" class="mb" text-anchor="middle">@RequestParam</text>
  <text x="371.0" y="117.0" class="val" text-anchor="middle">name 값이 필수</text>
  <line x1="438" y1="102" x2="448" y2="102" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="450" y="78" width="132" height="48" rx="8" class="bad"/>
  <text x="516.0" y="98.0" class="badt" text-anchor="middle">에러 발생</text>
  <text x="516.0" y="117.0" class="note" text-anchor="middle">HTML 출력 안 됨</text>
  <text x="30" y="176" class="code">required</text>
  <text x="30" y="196" class="okc">= false</text>
  <text x="30" y="214" class="sub">직접 지정</text>
  <rect x="150" y="152" width="585" height="72" rx="6" class="track"/>
  <rect x="160" y="164" width="132" height="48" rx="8" class="box"/>
  <text x="226.0" y="184.0" class="t" text-anchor="middle">요청</text>
  <text x="226.0" y="203.0" class="val" text-anchor="middle">name 파라미터 없음</text>
  <line x1="293" y1="188" x2="303" y2="188" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="305" y="164" width="132" height="48" rx="8" class="box"/>
  <text x="371.0" y="184.0" class="mb" text-anchor="middle">@RequestParam</text>
  <text x="371.0" y="203.0" class="val" text-anchor="middle">없어도 통과</text>
  <line x1="438" y1="188" x2="448" y2="188" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="450" y="164" width="132" height="48" rx="8" class="box"/>
  <text x="516.0" y="184.0" class="mb" text-anchor="middle">helloMvc</text>
  <text x="516.0" y="203.0" class="val" text-anchor="middle">Model에 name 담기</text>
  <line x1="583" y1="188" x2="593" y2="188" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="595" y="164" width="132" height="48" rx="8" class="ok"/>
  <text x="661.0" y="184.0" class="okt" text-anchor="middle">HTML 출력</text>
  <text x="661.0" y="203.0" class="val" text-anchor="middle">hello-mvc.html</text>
  <text x="30" y="254" class="foot">required = false로 주면 name 파라미터를 전달하지 않아도 HTML이 출력됩니다.</text>
</svg>
