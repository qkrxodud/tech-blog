  <use href="#xs" x="736" y="200"/>
  <rect x="14" y="260" width="170" height="64" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="26" y="288" class="t2">요청이 늦게 도착</text>
  <text x="26" y="307" class="gs" style="font-size:11px">중계가 붙잡았다 넘김</text>
  <rect x="192" y="260" width="182" height="64" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="204" y="287" class="s2" style="fill:#15803d;font-size:11px">먼저 남은 해제 줄에</text><text x="204" y="303" class="s2" style="fill:#15803d;font-size:11px">막힘</text>
  <text x="360" y="300" class="okt" text-anchor="end">재고 5</text>
  <use href="#vs" x="364" y="272"/>
  <rect x="378" y="260" width="182" height="64" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="390" y="287" class="s2" style="fill:#15803d;font-size:11px">조회도 붙잡혀 응답 없음</text><text x="390" y="303" class="s2" style="fill:#15803d;font-size:11px">→ 해제를 보냄</text>
  <text x="546" y="300" class="okt" text-anchor="end">재고 5</text>
  <use href="#vs" x="550" y="272"/>
  <rect x="564" y="260" width="182" height="64" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="576" y="287" class="s2" style="fill:#b91c1c;font-size:11px">늦은 요청이</text><text x="576" y="303" class="s2" style="fill:#b91c1c;font-size:11px">그대로 줄임</text>
  <text x="732" y="300" class="badt" text-anchor="end">재고 3</text>
  <use href="#xs" x="736" y="272"/>
  <rect x="14" y="332" width="170" height="64" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="26" y="360" class="t2">받지 못함</text>
  <text x="26" y="379" class="gs" style="font-size:11px">요청이 닿지 않음</text>
  <rect x="192" y="332" width="182" height="64" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="204" y="359" class="s2" style="fill:#4b5563;font-size:11px">빈 해제 줄만 남음</text>
  <text x="360" y="360" class="okt" text-anchor="end" style="fill:#6b7280">재고 5</text>
  <text x="204" y="380" class="s2" style="fill:#6b7280;font-size:10px">(계약 없음 — 결정 4 커밋의 이유)</text>
  <rect x="378" y="332" width="182" height="64" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="390" y="368" class="s2" style="fill:#9ca3af;font-size:11px">시험하지 않음</text>
