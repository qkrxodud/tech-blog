<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>2코어 CPU에서 스레드 1과 2가 같은 가상 주소 공간의 stack 1, stack 2를 각각 쓰고 heap, data, code는 함께 쓰는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .seg { font-size: 13px; font-weight: 700; fill: #374151; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opk { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .dia { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .lbl { font-size: 12.5px; font-weight: 700; fill: #6b7280; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="450" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="430" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">같은 프로세스의 스레드 — 주소 공간을 공유하고 stack만 따로</text>
  <rect x="30" y="150" width="200" height="150" rx="16" class="hold"/>
  <text x="130" y="176" class="t" text-anchor="middle">CPU (2코어)</text>
  <rect x="50" y="192" width="160" height="40" rx="8" class="box"/>
  <text x="130" y="217" class="opk" text-anchor="middle">코어 1 — 스레드 1</text>
  <rect x="50" y="248" width="160" height="40" rx="8" class="box"/>
  <text x="130" y="273" class="opk" text-anchor="middle">코어 2 — 스레드 2</text>
  <text x="510" y="70" class="t" text-anchor="middle">프로세스의 가상 주소 공간</text>
  <rect x="420" y="80" width="180" height="330" rx="12" class="box"/>
  <rect x="430" y="88" width="160" height="44" rx="6" class="hold"/>
  <text x="510" y="115" class="seg" text-anchor="middle">kernel</text>
  <rect x="430" y="140" width="160" height="36" rx="6" class="hold"/>
  <text x="510" y="163" class="seg" text-anchor="middle">stack 1</text>
  <rect x="430" y="184" width="160" height="36" rx="6" class="hold"/>
  <text x="510" y="207" class="seg" text-anchor="middle">stack 2</text>
  <rect x="430" y="250" width="160" height="40" rx="6" class="ok"/>
  <text x="510" y="275" class="okt" text-anchor="middle">heap</text>
  <rect x="430" y="298" width="160" height="40" rx="6" class="ok"/>
  <text x="510" y="323" class="okt" text-anchor="middle">data</text>
  <rect x="430" y="346" width="160" height="56" rx="6" class="ok"/>
  <text x="510" y="379" class="okt" text-anchor="middle">code</text>
  <line x1="210" y1="212" x2="428" y2="158" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="210" y1="268" x2="428" y2="204" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <path d="M604,140 L614,140 L614,220 L604,220" fill="none" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="622" y="176" class="t">스레드마다</text>
  <text x="622" y="194" class="t">따로</text>
  <path d="M604,250 L614,250 L614,402 L604,402" fill="none" stroke="#16a34a" stroke-width="1.4"/>
  <text x="622" y="318" class="okt">모든 스레드가</text>
  <text x="622" y="336" class="okt">공유</text>
  <text x="30" y="430" class="sub">스레드를 하나 더 만들면 stack 영역만 하나 더 확보하면 됩니다.</text>
</svg>
