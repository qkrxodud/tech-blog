<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>old generation 점유율이 IHOP을 넘으면 Concurrent Start가 시작되고, adaptive IHOP은 첫 mixed GC가 max old generation size에서 G1ReservePercent를 뺀 지점에서 시작되도록 IHOP을 정한다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .gc { fill: #d1d5db; stroke: #6b7280; stroke-width: 1.2; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .br { stroke: #9ca3af; stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="400" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">IHOP — old 점유율이 넘으면 Concurrent Start</text>
  <text x="730" y="42" class="code" text-anchor="end">-XX:+G1UseAdaptiveIHOP</text>
  <line x1="90" y1="320" x2="720" y2="320" class="axis" marker-end="url(#ar)"/>
  <line x1="90" y1="320" x2="90" y2="70" class="axis" marker-end="url(#ar)"/>
  <text x="720" y="340" class="step" text-anchor="end">시간</text>
  <text x="84" y="80" class="step" text-anchor="end">old</text>
  <text x="84" y="94" class="step" text-anchor="end">점유</text>
  <rect x="92" y="100" width="620" height="28" class="bad" stroke-width="0" fill-opacity="0.7"/>
  <line x1="92" y1="100" x2="712" y2="100" stroke="#dc2626" stroke-width="1.4"/>
  <text x="704" y="94" class="note" text-anchor="end">max old generation size</text>
  <text x="704" y="120" class="note" text-anchor="end"><tspan font-family="Menlo, Consolas, monospace">G1ReservePercent(10)</tspan> — buffer</text>
  <line x1="92" y1="128" x2="712" y2="128" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="92" y1="210" x2="712" y2="210" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="100" y="202" class="gnote">IHOP</text>
  <path d="M 92 300 L 160 280 L 230 250 L 300 210 L 370 185 L 440 160 L 510 140 L 545 128" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M 545 128 L 575 170 L 610 200 L 645 230 L 680 255" stroke="#374151" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
  <circle cx="300" cy="210" r="6" fill="#16a34a"/>
  <circle cx="545" cy="128" r="6" fill="#16a34a"/>
  <line x1="300" y1="216" x2="300" y2="262" class="gl"/>
  <text x="300" y="280" class="okt" text-anchor="middle">Concurrent Start</text>
  <path d="M 304 252 L 541 252" class="al" marker-end="url(#ar)"/>
  <text x="422" y="244" class="sub" text-anchor="middle">concurrent marking</text>
  <line x1="545" y1="134" x2="545" y2="262" class="gl"/>
  <text x="545" y="280" class="okt" text-anchor="middle">첫 mixed GC</text>
  <text x="600" y="168" class="sub">Space-Reclamation</text>
  <text x="40" y="372" class="sub">IHOP — 처음 몇 cycle은 45%, 이후 이전 marking 시간과 그동안 old에 할당된 양으로 예측</text>
  <text x="40" y="392" class="note">예측이 틀려 marking이 끝나기 전에 old가 가득 차면 → full GC</text>
</svg>
