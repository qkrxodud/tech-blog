<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>연결·읽기 타임아웃 3초를 설정한 요청 팩토리, UriComponentsBuilder로 만든 /restApi/test?userId=userId URI, Content-Type을 담은 HttpEntity를 RestTemplate의 exchange()에 넘겨 127.0.0.1:8080에 PUT 요청을 보내고 응답을 ResponseEntity로 받는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .subc { font-size: 12px; fill: #6b7280; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .valc { font-size: 12.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .lbl { font-size: 12px; font-weight: 700; fill: #6b7280; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="336" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="316" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">RestTemplate 호출 — 요청을 만들어 exchange()로 보냄</text>
  <text x="730" y="42" class="code" text-anchor="end">HttpMethod.PUT</text>
  <rect x="30" y="64" width="260" height="58" rx="8" class="box"/>
  <text x="44" y="88" class="t">URI</text>
  <text x="276" y="88" class="subc" text-anchor="end">UriComponentsBuilder</text>
  <text x="44" y="109" class="valc">/restApi/test?userId=userId</text>
  <line x1="292" y1="93" x2="337" y2="120" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ag)"/>
  <rect x="30" y="140" width="260" height="58" rx="8" class="box"/>
  <text x="44" y="164" class="t">헤더</text>
  <text x="276" y="164" class="subc" text-anchor="end">HttpEntity</text>
  <text x="44" y="185" class="valc">Content-Type: application/json</text>
  <line x1="292" y1="169" x2="337" y2="136" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ag)"/>
  <rect x="30" y="216" width="260" height="58" rx="8" class="box"/>
  <text x="44" y="240" class="t">요청 팩토리</text>
  <text x="276" y="240" class="subc" text-anchor="end">HttpComponents</text>
  <text x="44" y="261" class="val">연결·읽기 타임아웃 3초</text>
  <line x1="292" y1="245" x2="337" y2="152" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ag)"/>
  <rect x="340" y="104" width="170" height="80" rx="10" class="hold"/>
  <text x="425" y="136" class="op" text-anchor="middle">RestTemplate</text>
  <text x="425" y="160" class="valc" text-anchor="middle">exchange()</text>
  <rect x="570" y="104" width="160" height="80" rx="10" class="box"/>
  <text x="650" y="136" class="t" text-anchor="middle">외부 API 서버</text>
  <text x="650" y="160" class="valc" text-anchor="middle">127.0.0.1:8080</text>
  <line x1="512" y1="128" x2="567" y2="128" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="540" y="120" class="lbl" text-anchor="middle">PUT</text>
  <line x1="568" y1="162" x2="513" y2="162" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="540" y="178" class="gnote" text-anchor="middle">응답</text>
  <line x1="425" y1="186" x2="425" y2="222" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="340" y="226" width="170" height="56" rx="10" class="ok"/>
  <text x="425" y="250" class="okc" text-anchor="middle">ResponseEntity</text>
  <text x="425" y="270" class="valc" text-anchor="middle">&lt;UserDTO&gt;</text>
  <text x="530" y="250" class="val">상태 코드와 본문을</text>
  <text x="530" y="270" class="val">UserDTO 타입으로 받음</text>
  <text x="30" y="306" class="foot">URI, 헤더, 타임아웃을 설정한 요청 팩토리를 RestTemplate에 넘기면 exchange() 한 번으로 요청과 응답이 처리됩니다.</text>
</svg>
