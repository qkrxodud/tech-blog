  <rect width="760" height="500" fill="#ffffff"/>
  <text x="24" y="30" class="h">9장 결정 다섯 가지 한눈에</text>
  <text x="24" y="52" class="gs">왼쪽은 고른 것, 오른쪽은 비교에서 갈린 것</text>
  <rect x="24" y="72" width="150" height="56" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="24" cy="72" r="10" fill="#111827"/><text x="24" y="76" class="num" text-anchor="middle">1</text>
  <text x="38" y="106" class="t2" style="font-size:11.5px">언제 남기고 보낼까</text>
  <rect x="184" y="72" width="268" height="56" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="196" y="100"/>
  <text x="218" y="105" class="oks" style="font-size:11px">같은 트랜잭션에 <tspan class="m">payment_outbox</tspan> 한 줄</text>
  <rect x="462" y="72" width="274" height="56" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="476" y="96" class="bads" style="font-size:11px">바로 보냄 · 커밋 뒤 보냄은 유실이 남음</text>
  <text x="476" y="115" class="bads" style="font-size:11px">커밋 뒤 보냄은 유령만 막음</text>
  <rect x="24" y="138" width="150" height="56" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="24" cy="138" r="10" fill="#111827"/><text x="24" y="142" class="num" text-anchor="middle">2</text>
  <text x="38" y="172" class="t2" style="font-size:11.5px">무엇이 읽어 보낼까</text>
  <rect x="184" y="138" width="268" height="56" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="196" y="166"/>
  <text x="218" y="171" class="oks" style="font-size:11px">주기 폴링 릴레이 · 번호 순 · <tspan class="m">markSent</tspan></text>
  <rect x="462" y="138" width="274" height="56" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="476" y="162" class="gs" style="font-size:11px">CDC는 구현하지 않음</text>
  <text x="476" y="181" class="gs" style="font-size:11px">Kafka Connect를 따로 운영해야 해 범위 밖</text>
  <rect x="24" y="204" width="150" height="56" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="24" cy="204" r="10" fill="#111827"/><text x="24" y="208" class="num" text-anchor="middle">3</text>
  <text x="38" y="238" class="t2" style="font-size:11.5px">서버 여러 대면 누가</text>
  <rect x="184" y="204" width="268" height="56" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="196" y="232"/>
  <text x="218" y="237" class="oks" style="font-size:11px">작업 잠금을 맡은 한 대(88~98건/초)</text>
  <rect x="462" y="204" width="274" height="56" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="476" y="228" class="bads" style="font-size:11px">잠그지 않음 — 중복 198~200</text>
  <text x="476" y="247" class="bads" style="font-size:11px">한 줄씩 나눠 보내기 — 순서 위반 결제 2~8</text>
  <rect x="24" y="270" width="150" height="56" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="24" cy="270" r="10" fill="#111827"/><text x="24" y="274" class="num" text-anchor="middle">4</text>
  <text x="38" y="304" class="t2" style="font-size:11.5px">순서를 어떻게 지킬까</text>
  <rect x="184" y="270" width="268" height="56" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="196" y="298"/>
  <text x="218" y="303" class="oks" style="font-size:11px">키 = 결제 번호 · 못 보낸 결제는 기다림</text>
  <rect x="462" y="270" width="274" height="56" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="476" y="294" class="bads" style="font-size:11px">키 없이 — 계약 2개 실패</text>
  <text x="476" y="313" class="bads" style="font-size:11px">릴레이 측정 6번 중 2번 순서 어긋남</text>
  <rect x="24" y="336" width="150" height="56" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="24" cy="336" r="10" fill="#111827"/><text x="24" y="340" class="num" text-anchor="middle">5</text>
  <text x="38" y="370" class="t2" style="font-size:11.5px">보내기와 기록 순서</text>
  <rect x="184" y="336" width="268" height="56" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="196" y="364"/>
  <text x="218" y="369" class="oks" style="font-size:11px">보내고 답이 오면 남김(적어도 한 번)</text>
  <rect x="462" y="336" width="274" height="56" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="476" y="360" class="bads" style="font-size:11px">먼저 남기기 — 8개 중 3개 실패</text>
  <text x="476" y="379" class="bads" style="font-size:11px">죽으면 잃음 2 · 다시 보내지 않음 1</text>
  <rect x="24" y="410" width="712" height="76" rx="12" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="38" y="434" class="bt" style="font-size:12.5px">브로커를 4초 끊은 측정 — 운영(남겨 두고 릴레이, 결제 번호 키)</text>
  <text x="38" y="456" class="bs" style="font-size:11.5px">유실 · 중복 · 순서 위반 0 · 승인 응답 최대 20~56ms</text>
  <text x="38" y="475" class="bs" style="font-size:11.5px">대신 도착 지연 중앙값 3340~4551ms(바로 보냄 9~14ms)</text>
</svg>
