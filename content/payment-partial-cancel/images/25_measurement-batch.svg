<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>같은 취소 묶음의 구성 — 결제 12건(모두 15000원 승인, 부분 취소 5000원)을 여섯 경우에 2건씩 둠: 같은 금액 부분 취소를 키를 바꿔 두 번(뜻한 취소 4), 부분 취소 뒤 같은 키로 다시(2), PG 취소 답이 늦어 시간 초과 뒤 보정만(2), 시간 초과 뒤 PG가 처리를 마친 다음 같은 키로 다시(2), PG 취소 뒤 결과 기록 실패(MySQL 트리거) 뒤 보정만(2), 전액 취소 뒤 같은 키로 다시(2). 고객이 뜻한 PG 취소 4 + 2 + 2 + 2 + 2 + 2 = 14건. 측정 조건은 읽기 시간 제한 1초, 늦은 취소는 1.5초 뒤 답, 묶음을 다 보낸 뒤 보정을 한 번 돌리고 보정 시각은 대기 시간 10초가 지난 때, 한 번 실행. 우리 남은 금액은 결제 금액에서 끝난 취소의 합을 뺀 값, 카드사 잔액은 Mock PG의 balanceAmount</title>
