<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>GC Root에서 참조를 따라 닿는 A, C, F, G를 표시하고, 표시되지 않은 B, D, E, H를 지운 뒤 살아 있는 객체를 앞으로 모으는 Mark, Sweep, Compaction 단계</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t13 { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okt13 { font-size: 13px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badt13 { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .m { font-family: Menlo, Consolas, monospace; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="440" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="420" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">Mark, Sweep, Compaction — 힙이 바뀌는 모습</text>
  <rect x="330" y="58" width="110" height="28" rx="6" class="dbbox"/>
  <text x="385" y="77" class="t13" text-anchor="middle">GC Root</text>
  <line x1="352" y1="86" x2="200" y2="112" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="418" y1="86" x2="544" y2="112" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="134" class="lane">1. Mark</text>
  <text x="30" y="152" class="sub">닿는 객체 표시</text>
  <rect x="160" y="114" width="64" height="40" rx="6" class="ok"/>
  <text x="192" y="139" class="okt" text-anchor="middle">A</text>
  <rect x="232" y="114" width="64" height="40" rx="6" class="bad"/>
  <text x="264" y="139" class="badt" text-anchor="middle">B</text>
  <rect x="304" y="114" width="64" height="40" rx="6" class="ok"/>
  <text x="336" y="139" class="okt" text-anchor="middle">C</text>
  <rect x="376" y="114" width="64" height="40" rx="6" class="bad"/>
  <text x="408" y="139" class="badt" text-anchor="middle">D</text>
  <rect x="448" y="114" width="64" height="40" rx="6" class="bad"/>
  <text x="480" y="139" class="badt" text-anchor="middle">E</text>
  <rect x="520" y="114" width="64" height="40" rx="6" class="ok"/>
  <text x="552" y="139" class="okt" text-anchor="middle">F</text>
  <rect x="592" y="114" width="64" height="40" rx="6" class="ok"/>
  <text x="624" y="139" class="okt" text-anchor="middle">G</text>
  <rect x="664" y="114" width="64" height="40" rx="6" class="bad"/>
  <text x="696" y="139" class="badt" text-anchor="middle">H</text>
  <path d="M 192 154 Q 264 176 334 156" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <path d="M 560 154 Q 588 172 618 156" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="220" class="lane">2. Sweep</text>
  <text x="30" y="238" class="sub">표시 안 된 객체 해제</text>
  <rect x="160" y="200" width="64" height="40" rx="6" class="ok"/>
  <text x="192" y="225" class="okt" text-anchor="middle">A</text>
  <rect x="232" y="200" width="64" height="40" rx="6" class="wait"/>
  <text x="264" y="225" class="waitt" text-anchor="middle">빈칸</text>
  <rect x="304" y="200" width="64" height="40" rx="6" class="ok"/>
  <text x="336" y="225" class="okt" text-anchor="middle">C</text>
  <rect x="376" y="200" width="64" height="40" rx="6" class="wait"/>
  <text x="408" y="225" class="waitt" text-anchor="middle">빈칸</text>
  <rect x="448" y="200" width="64" height="40" rx="6" class="wait"/>
  <text x="480" y="225" class="waitt" text-anchor="middle">빈칸</text>
  <rect x="520" y="200" width="64" height="40" rx="6" class="ok"/>
  <text x="552" y="225" class="okt" text-anchor="middle">F</text>
  <rect x="592" y="200" width="64" height="40" rx="6" class="ok"/>
  <text x="624" y="225" class="okt" text-anchor="middle">G</text>
  <rect x="664" y="200" width="64" height="40" rx="6" class="wait"/>
  <text x="696" y="225" class="waitt" text-anchor="middle">빈칸</text>
  <text x="30" y="306" class="lane">3. Compaction</text>
  <text x="30" y="324" class="sub">살아 있는 객체 모으기</text>
  <rect x="160" y="286" width="64" height="40" rx="6" class="ok"/>
  <text x="192" y="311" class="okt" text-anchor="middle">A</text>
  <rect x="232" y="286" width="64" height="40" rx="6" class="ok"/>
  <text x="264" y="311" class="okt" text-anchor="middle">C</text>
  <rect x="304" y="286" width="64" height="40" rx="6" class="ok"/>
  <text x="336" y="311" class="okt" text-anchor="middle">F</text>
  <rect x="376" y="286" width="64" height="40" rx="6" class="ok"/>
  <text x="408" y="311" class="okt" text-anchor="middle">G</text>
  <rect x="448" y="286" width="280" height="40" rx="6" class="wait"/>
  <text x="588" y="311" class="waitt" text-anchor="middle">연속된 빈 공간</text>
  <text x="160" y="360" class="foot">Sweep만 하면 빈칸이 흩어지고, Compaction 뒤에야 큰 객체를 놓을 연속된 공간이 생깁니다.</text>
  <rect x="160" y="378" width="14" height="14" rx="3" class="ok"/>
  <text x="180" y="390" class="s">살아 있는 객체 (Root에서 닿음)</text>
  <rect x="390" y="378" width="14" height="14" rx="3" class="bad"/>
  <text x="410" y="390" class="s">회수 대상 (어디에서도 닿지 않음)</text>
</svg>
