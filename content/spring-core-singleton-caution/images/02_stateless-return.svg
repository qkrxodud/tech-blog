<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>order가 금액을 반환하고 각 사용자가 지역 변수 price1, price2에 받으면 공유 필드가 없어 사용자 A는 10000, 사용자 B는 20000을 그대로 갖는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .m { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 12px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .gn { font-size: 12.5px; fill: #15803d; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="310" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">무상태로 수정 — 주문 금액을 반환해 지역 변수로 받는다</text>
  <text x="245" y="68" class="step" text-anchor="middle">1. A 주문</text>
  <text x="445" y="68" class="step" text-anchor="middle">2. B 주문</text>
  <text x="640" y="68" class="step" text-anchor="middle">3. 결과 출력</text>
  <line x1="160" y1="76" x2="722" y2="76" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">사용자 A</text>
  <text x="30" y="126" class="sub">ThreadA</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="157.0" y="88" width="176" height="48" rx="8" class="box"/>
  <text x="245.0" y="108.0" class="ms" text-anchor="middle">order("userA", 10000)</text>
  <text x="245.0" y="127.0" class="val" text-anchor="middle">10000 반환</text>
  <rect x="552.0" y="88" width="176" height="48" rx="8" class="ok"/>
  <text x="640.0" y="108.0" class="okm" text-anchor="middle">price1</text>
  <text x="640.0" y="127.0" class="gn" text-anchor="middle">10000</text>
  <line x1="333.0" y1="112" x2="546.0" y2="112" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="168" class="lane">사용자 B</text>
  <text x="30" y="186" class="sub">ThreadB</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="357.0" y="148" width="176" height="48" rx="8" class="box"/>
  <text x="445.0" y="168.0" class="ms" text-anchor="middle">order("userB", 20000)</text>
  <text x="445.0" y="187.0" class="val" text-anchor="middle">20000 반환</text>
  <rect x="552.0" y="148" width="176" height="48" rx="8" class="ok"/>
  <text x="640.0" y="168.0" class="okm" text-anchor="middle">price2</text>
  <text x="640.0" y="187.0" class="gn" text-anchor="middle">20000</text>
  <line x1="533.0" y1="172" x2="546.0" y2="172" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="246" class="db">필드</text>
  <text x="30" y="264" class="sub">StatefulService</text>
  <rect x="157" y="230" width="571" height="36" rx="6" class="wait"/>
  <text x="442.5" y="253" class="waitt" text-anchor="middle">공유하는 필드가 없다</text>
  <text x="150" y="300" class="gnote">각 사용자의 금액은 자신의 지역 변수에만 남아 서로 영향을 주지 않는다</text>
</svg>
