<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 616" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결과 모름 취소에 알림이 오면 — 15000원 결제의 5000원 우리 취소가 결과 모름(UNKNOWN)으로 보정 대기 10초 전에 있고 PG는 그 취소를 tx-9로 끝냈을 때, 처리기는 PG에 다시 조회해 cancels [tx-9 5000]을 읽고, 우리 기록에 없는 transactionKey tx-9를 고른 뒤, 결과를 기다리는 우리 취소와 같은 금액으로 짝지어 complete(cancel, tx-9)로 DONE을 남긴다. 짝 안 된 PG 취소가 없어 들여올 줄이 없고, 남은 금액 10000원이 PG 잔액과 같다. 짝이 없으면 우리 취소는 그대로 두고(실패로 닫는 것은 주기 보정), 짝 안 된 PG 취소는 PG에서만 일어난 취소로 들여온다</title>
