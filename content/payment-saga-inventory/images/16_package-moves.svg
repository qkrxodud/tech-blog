  <text x="410" y="342" class="oks" style="font-size:11px"><tspan class="m">ExclusiveJobRunner</tspan> 곁으로</text>
  <text x="410" y="360" class="oks" style="font-size:11px">앞 글의 패키지 경로 · 예외 경로는 지금과 다름</text>
  <text x="24" y="392" class="gs" style="font-size:10.5px">옮기기 전 위치 domain/job은 커밋 56ecbee에서 확인</text>
