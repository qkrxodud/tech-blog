  <text x="30" y="328" class="val">GC thread: global SATB buffer에서</text>
  <text x="30" y="346" class="sub">local SATB buffer를 dequeue</text>
  <rect x="330" y="320" width="30" height="22" rx="3" class="ok"/>
  <text x="345.0" y="336" class="mono" text-anchor="middle">2</text>
  <rect x="364" y="320" width="30" height="22" rx="3" class="ok"/>
