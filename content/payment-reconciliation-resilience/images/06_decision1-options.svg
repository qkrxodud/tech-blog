<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 1 선택지 비교 — 하루치 거래 내역을 5000건씩 읽어 결제 키로 맞추는 방식(이 장에서 고름)은 측정에서 거래 조회 1번·3번과 뒤처진 결제 조회 10번·100번으로 끝나고 카드사에만 있는 결제도 찾아 계약 13개를 모두 통과함. 결제마다 카드사 단건 조회는 결제 수만큼(1000번·1만 번) 조회하고, 우리 쪽만 취소·금액 다름·카드사에만 있는 결제를 운영자 확인으로 남기지 못하고 서버 두 대 계약은 거래 내역을 읽지 않아 4개가 실패함(카드사에만 있는 결제는 우리 목록에 없어 못 찾음). 닿지 않은 웹훅을 카드사에 다시 요청하는 방식은 계획에 없어 비교로 돌리지 않았고, 카드사에서만 취소된 결제는 앞의 두 방식 모두 측정에서 모두 맞춘 비교</title>
