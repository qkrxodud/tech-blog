<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>부모 타입으로 조회하는 다형성 쿼리에서 단일 테이블 전략은 테이블 하나만 읽고, 조인 전략은 부모와 자식 테이블을 조인하며, 구현 클래스마다 테이블 전략은 모든 구현 클래스 테이블을 UNION으로 합치는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12.5px; fill: #374151; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .thead { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .cell { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 12.5px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 12.5px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="350" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="330" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">부모 타입으로 조회할 때 — 전략마다 읽는 테이블이 다르다</text>
  <rect x="30" y="60" width="220" height="236" rx="10" class="box"/>
  <text x="140" y="86" class="t" text-anchor="middle">단일 테이블 전략</text>
  <text x="140" y="104" class="code" text-anchor="middle">SINGLE_TABLE</text>
  <rect x="50" y="124" width="180" height="76" rx="8" class="hold"/>
  <text x="140" y="156" class="t" text-anchor="middle">테이블 하나</text>
  <text x="140" y="178" class="sub" text-anchor="middle">공통·하위 컬럼·판별자</text>
  <text x="140" y="234" class="sub" text-anchor="middle">한 테이블만 조회</text>
  <text x="46" y="260" class="gnote">조인 없이 조회</text>
  <text x="46" y="281" class="note">하위 컬럼은 NULL 허용</text>
  <rect x="270" y="60" width="220" height="236" rx="10" class="box"/>
  <text x="380" y="86" class="t" text-anchor="middle">조인 전략</text>
  <text x="380" y="104" class="code" text-anchor="middle">JOINED</text>
  <rect x="320" y="122" width="120" height="34" rx="8" class="hold"/>
  <text x="380" y="144" class="s" text-anchor="middle">부모 테이블</text>
  <rect x="282" y="182" width="92" height="34" rx="8" class="hold"/>
  <text x="328" y="204" class="s" text-anchor="middle">자식 A</text>
  <rect x="386" y="182" width="92" height="34" rx="8" class="hold"/>
  <text x="432" y="204" class="s" text-anchor="middle">자식 B</text>
  <line x1="358" y1="157" x2="330" y2="181" stroke="#dc2626" stroke-width="1.4"/>
  <line x1="402" y1="157" x2="430" y2="181" stroke="#dc2626" stroke-width="1.4"/>
  <text x="380" y="176" class="badm" text-anchor="middle">JOIN</text>
  <text x="380" y="234" class="sub" text-anchor="middle">부모와 자식 테이블을 조인</text>
  <text x="286" y="260" class="gnote">정규화, NOT NULL 제약 가능</text>
  <text x="286" y="281" class="note">조회할 때 조인 발생</text>
  <rect x="510" y="60" width="220" height="236" rx="10" class="box"/>
  <text x="620" y="86" class="t" text-anchor="middle">구현 클래스마다 테이블 전략</text>
  <text x="620" y="104" class="code" text-anchor="middle">TABLE_PER_CLASS</text>
  <rect x="522" y="124" width="92" height="56" rx="8" class="hold"/>
  <text x="568" y="148" class="s" text-anchor="middle">자식 A</text>
  <text x="568" y="168" class="sub" text-anchor="middle">공통 + 고유</text>
  <rect x="626" y="124" width="92" height="56" rx="8" class="hold"/>
  <text x="672" y="148" class="s" text-anchor="middle">자식 B</text>
  <text x="672" y="168" class="sub" text-anchor="middle">공통 + 고유</text>
  <line x1="568" y1="190" x2="672" y2="190" stroke="#dc2626" stroke-width="1.4"/>
  <line x1="568" y1="182" x2="568" y2="190" stroke="#dc2626" stroke-width="1.4"/>
  <line x1="672" y1="182" x2="672" y2="190" stroke="#dc2626" stroke-width="1.4"/>
  <text x="620" y="206" class="badm" text-anchor="middle">UNION</text>
  <text x="620" y="234" class="sub" text-anchor="middle">모든 구현 클래스 테이블을 UNION</text>
  <text x="526" y="260" class="gnote">테이블 구조 단순</text>
  <text x="526" y="281" class="note">UNION 쿼리, 중복 매핑</text>
  <text x="30" y="324" class="foot">부모 타입으로 조회하는 다형성 쿼리에서 각 전략이 읽는 테이블을 비교한 그림입니다.</text>
</svg>
