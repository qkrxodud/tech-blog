<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 492" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>8장 결정 다섯 가지 한눈에 — 결정 1 결제 금액은 출발 코드에서 고객 금액 그대로라 1000원으로 낮춘 17000원 주문이 PG에서 승인 → 서버가 상품가 합 − 쿠폰 할인 − 쓴 포인트로 정하고 다르면 400 AMOUNT_MISMATCH. 결정 2 잡는 때는 승인 뒤라 재고 0개 상품도 PG에서 승인 → 승인 요청 직전 인증 트랜잭션에서 잡고 모자라면 409로 PG까지 가지 않음. 결정 3 같은 상품 재고는 읽고 뺀 값을 써서 재고 10개에 30건이 모두 승인 → 조건부 UPDATE 한 문장, 재고 100개에 300건 측정에서 과판매 0, 측정 범위 안에서 for update와 차이가 보이지 않음. 결정 4 돌려주기는 출발 코드에서 돌려주지 않아 전액 취소 뒤 재고 3·포인트 2000원·쿠폰 USED → 결제 상태가 승인 실패·만료·전액 취소로 바뀌는 그 트랜잭션에서 한 번과 포인트 이력, 겹친 거절에도 한 번, 결과 모름은 쥠. 결정 5 같은 쿠폰은 겹친 두 주문이 모두 승인 → ISSUED일 때만 USED로 바꾸는 조건부 UPDATE, 나중 주문은 409 COUPON_NOT_AVAILABLE</title>
