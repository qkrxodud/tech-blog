<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>전파 옵션 여섯 가지가 기존 트랜잭션이 있을 때와 없을 때 각각 어떻게 동작하는지 비교한 그림</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .cellt { font-size: 14px; font-weight: 700; fill: #374151; }
    .colh { font-size: 13px; font-weight: 700; fill: #4b5563; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="400" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">전파 옵션 — 기존 트랜잭션이 있을 때와 없을 때</text>
  <text x="730" y="42" class="code" text-anchor="end">propagation</text>
  <text x="30" y="78" class="colh">옵션</text>
  <text x="330" y="78" class="colh" text-anchor="middle">기존 트랜잭션이 있을 때</text>
  <text x="610" y="78" class="colh" text-anchor="middle">기존 트랜잭션이 없을 때</text>
  <line x1="30" y1="88" x2="735" y2="88" class="axis"/>
  <text x="30" y="123" class="op">REQUIRED</text>
  <rect x="190" y="98" width="280" height="38" rx="8" class="hold"/>
  <text x="330" y="122" class="cellt" text-anchor="middle">참여</text>
  <rect x="480" y="98" width="255" height="38" rx="8" class="ok"/>
  <text x="607.5" y="122" class="okt" text-anchor="middle">새로 생성</text>
  <text x="30" y="171" class="op">SUPPORTS</text>
  <rect x="190" y="146" width="280" height="38" rx="8" class="hold"/>
  <text x="330" y="170" class="cellt" text-anchor="middle">참여</text>
  <rect x="480" y="146" width="255" height="38" rx="8" class="wait"/>
  <text x="607.5" y="170" class="waitt" text-anchor="middle">트랜잭션 없이 진행</text>
  <text x="30" y="219" class="op">REQUIRES_NEW</text>
  <rect x="190" y="194" width="280" height="38" rx="8" class="ok"/>
  <text x="330" y="218" class="okt" text-anchor="middle">기존 보류 → 새로 생성</text>
  <rect x="480" y="194" width="255" height="38" rx="8" class="ok"/>
  <text x="607.5" y="218" class="okt" text-anchor="middle">새로 생성</text>
  <text x="30" y="267" class="op">MANDATORY</text>
  <rect x="190" y="242" width="280" height="38" rx="8" class="hold"/>
  <text x="330" y="266" class="cellt" text-anchor="middle">참여</text>
  <rect x="480" y="242" width="255" height="38" rx="8" class="bad"/>
  <text x="607.5" y="266" class="badt" text-anchor="middle">예외 발생</text>
  <text x="30" y="315" class="op">NOT_SUPPORTED</text>
  <rect x="190" y="290" width="280" height="38" rx="8" class="wait"/>
  <text x="330" y="314" class="waitt" text-anchor="middle">기존 보류 → 트랜잭션 없이 진행</text>
  <rect x="480" y="290" width="255" height="38" rx="8" class="wait"/>
  <text x="607.5" y="314" class="waitt" text-anchor="middle">트랜잭션 없이 진행</text>
  <text x="30" y="363" class="op">NESTED</text>
  <rect x="190" y="338" width="280" height="38" rx="8" class="ok"/>
  <text x="330" y="362" class="okt" text-anchor="middle">중첩 트랜잭션 (세이브포인트)</text>
  <rect x="480" y="338" width="255" height="38" rx="8" class="ok"/>
  <text x="607.5" y="362" class="okt" text-anchor="middle">새로 생성 (REQUIRED처럼)</text>
  <text x="30" y="402" class="sub">회색은 기존 트랜잭션에 참여, 초록은 트랜잭션 생성, 점선은 트랜잭션 없이 진행, 빨강은 예외입니다.</text>

</svg>
