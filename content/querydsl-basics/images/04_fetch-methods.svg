<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>조회 결과가 0건이면 fetch는 빈 리스트, fetchOne과 fetchFirst는 null을 돌려주고, 1건이면 셋 모두 그 회원을, 2건 이상이면 fetch는 전체 리스트, fetchOne은 NonUniqueResultException, fetchFirst는 첫 번째 한 건을 돌려주는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .msg { font-size: 11.5px; fill: #374151; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .cont { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="300" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">결과 조회 — 결과 건수에 따라 돌려주는 값</text>
  <text x="265" y="76" class="step" text-anchor="middle">결과 0건</text>
  <text x="445" y="76" class="step" text-anchor="middle">결과 1건</text>
  <text x="635" y="76" class="step" text-anchor="middle">결과 2건 이상</text>
  <text x="30" y="118" class="op">fetch()</text>
  <text x="30" y="136" class="sub">리스트 조회</text>
  <rect x="180" y="90" width="170" height="56" rx="8" class="box"/>
  <text x="265" y="114" class="t" text-anchor="middle">빈 리스트</text>
  <text x="265" y="133" class="m" text-anchor="middle">[]</text>
  <rect x="360" y="90" width="170" height="56" rx="8" class="box"/>
  <text x="445" y="114" class="t" text-anchor="middle">한 건 리스트</text>
  <text x="445" y="133" class="m" text-anchor="middle">[member]</text>
  <rect x="540" y="90" width="190" height="56" rx="8" class="ok"/>
  <text x="635" y="114" class="okt" text-anchor="middle">전체 리스트</text>
  <text x="635" y="133" class="m" text-anchor="middle">[member, member, ...]</text>
  <text x="30" y="188" class="op">fetchOne()</text>
  <text x="30" y="206" class="sub">단 건 조회</text>
  <rect x="180" y="160" width="170" height="56" rx="8" class="box"/>
  <text x="265" y="193" class="m" text-anchor="middle">null</text>
  <rect x="360" y="160" width="170" height="56" rx="8" class="ok"/>
  <text x="445" y="184" class="okt" text-anchor="middle">그 회원</text>
  <text x="445" y="203" class="m" text-anchor="middle">member</text>
  <rect x="540" y="160" width="190" height="56" rx="8" class="bad"/>
  <text x="635" y="184" class="badt" text-anchor="middle">예외 발생</text>
  <text x="635" y="203" class="m" text-anchor="middle" font-size="10.5">NonUniqueResultException</text>
  <text x="30" y="258" class="op">fetchFirst()</text>
  <text x="30" y="276" class="sub">limit(1).fetchOne()</text>
  <rect x="180" y="230" width="170" height="56" rx="8" class="box"/>
  <text x="265" y="263" class="m" text-anchor="middle">null</text>
  <rect x="360" y="230" width="170" height="56" rx="8" class="ok"/>
  <text x="445" y="254" class="okt" text-anchor="middle">그 회원</text>
  <text x="445" y="273" class="m" text-anchor="middle">member</text>
  <rect x="540" y="230" width="190" height="56" rx="8" class="ok"/>
  <text x="635" y="254" class="okt" text-anchor="middle">첫 번째 한 건</text>
  <text x="635" y="273" class="val" text-anchor="middle">limit(1)로 한 건만</text>
</svg>
