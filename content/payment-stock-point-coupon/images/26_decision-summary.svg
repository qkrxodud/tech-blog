  <text x="122" y="457" class="bads" style="font-size:10.5px">겹친 두 주문이 모두 승인</text>
  <line x1="336" y1="453" x2="356" y2="453" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="360" y="414" width="214" height="58" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="372" y="438" class="bt" style="font-size:11px"><tspan class="m">ISSUED</tspan>일 때만 <tspan class="m">USED</tspan>로</text>
  <text x="372" y="456" class="bt" style="font-size:11px">바꾸는 조건부 UPDATE</text>
