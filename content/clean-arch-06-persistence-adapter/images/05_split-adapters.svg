<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>AccountPersistenceAdapter가 LoadAccountPort와 UpdateAccountStatePort를, UserPersistenceAdapter가 CreateAccountPort를 구현해 영속성 어댑터가 애그리거트별로 나뉜 구조</title>
  <style>
