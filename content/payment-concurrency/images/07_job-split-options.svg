  <text x="24" y="28" class="h">결정 5 — 주기 작업을 서버끼리 어떻게 나눌까</text>
  <text x="20" y="58" class="lbl">방식</text>
  <text x="332" y="58" class="lbl">서버 두 대 계약 6개</text>
  <text x="544" y="58" class="lbl" style="font-size:11px">PG 조회 — 결과 모름 20건, 서버 수별</text>
