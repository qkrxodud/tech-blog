<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>JVM이 바이트코드를 처음에는 인터프리터로 한 줄씩 해석해 실행할 때마다 기계어로 번역하고, 자주 실행되는 코드는 JIT 컴파일러가 프로파일링으로 찾아 네이티브 코드로 변환해 캐시에 저장한 뒤 인터프리터 없이 실행하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .subc { font-size: 12px; fill: #6b7280; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .valc { font-size: 12.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .lbl { font-size: 12px; font-weight: 700; fill: #6b7280; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="280" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">JVM 실행 — 인터프리터와 JIT 컴파일러</text>
  <text x="730" y="42" class="code" text-anchor="end">Interpreter / JIT</text>
  <text x="220" y="68" class="step" text-anchor="middle">1단계</text>
  <text x="360" y="68" class="step" text-anchor="middle">2단계</text>
  <text x="500" y="68" class="step" text-anchor="middle">3단계</text>
  <text x="640" y="68" class="step" text-anchor="middle">4단계</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">인터프리터</text>
  <text x="30" y="126" class="sub">처음 실행되는 코드</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="162.0" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="108" class="t" text-anchor="middle">한 줄씩 해석</text>
  <text x="220" y="127" class="val" text-anchor="middle">바이트코드</text>
  <rect x="302.0" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="360" y="108" class="t" text-anchor="middle">기계어 번역</text>
  <text x="360" y="127" class="val" text-anchor="middle">실행할 때마다</text>
  <rect x="442.0" y="88" width="116" height="48" rx="8" class="bad"/>
  <text x="500" y="108" class="badt" text-anchor="middle">느린 실행</text>
  <text x="500" y="127" class="val" text-anchor="middle">번역 비용 반복</text>
  <text x="30" y="168" class="lane">JIT 컴파일러</text>
  <text x="30" y="186" class="sub">자주 실행되는 코드</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="302.0" y="148" width="116" height="48" rx="8" class="box"/>
  <text x="360" y="168" class="t" text-anchor="middle">프로파일링</text>
  <text x="360" y="187" class="val" text-anchor="middle">핫스팟 탐지</text>
  <rect x="442.0" y="148" width="116" height="48" rx="8" class="box"/>
  <text x="500" y="168" class="t" text-anchor="middle">네이티브 변환</text>
  <text x="500" y="187" class="val" text-anchor="middle">캐시에 저장</text>
  <rect x="582.0" y="148" width="116" height="48" rx="8" class="ok"/>
  <text x="640" y="168" class="okt" text-anchor="middle">네이티브 실행</text>
  <text x="640" y="187" class="val" text-anchor="middle">인터프리터 생략</text>
  <line x1="260" y1="136" x2="320" y2="148" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="296" y="128" class="gnote"></text>
  <rect x="150" y="214" width="585" height="32" rx="15" class="ok"/>
  <text x="442.5" y="235" class="okt" text-anchor="middle">자주 실행되는 코드는 한 번 변환해 두고 그대로 실행</text>
  <text x="150" y="272" class="foot">실행 시 바이트코드를 기계어로 번역하는 작업이 느리기 때문에 JIT를 도입하였습니다.</text>
</svg>
