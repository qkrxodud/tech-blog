  <line x1="538" y1="343" x2="558" y2="343" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#agy)"/>
  <rect x="560" y="330" width="82" height="26" rx="13" fill="#2563eb"/>
  <text x="601" y="347" class="num" text-anchor="middle" style="font-size:12px">결정 1</text>
  <rect x="16" y="366" width="520" height="34" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>
  <rect x="24" y="372" width="50" height="22" rx="11" fill="#475569"/>
  <text x="49" y="387" class="num" text-anchor="middle" style="font-size:11.5px">6장</text>
  <text x="86" y="388" class="s" style="fill:#1f2937">처리기와 승인·취소 API가 같은 결제를 함께 바꿈</text>
  <line x1="538" y1="383" x2="558" y2="383" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#agy)"/>
  <rect x="560" y="370" width="82" height="26" rx="13" fill="#2563eb"/>
  <text x="601" y="387" class="num" text-anchor="middle" style="font-size:12px">결정 1</text>
  <rect x="16" y="406" width="520" height="34" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>
  <rect x="24" y="412" width="50" height="22" rx="11" fill="#475569"/>
  <text x="49" y="427" class="num" text-anchor="middle" style="font-size:11.5px">6장</text>
  <text x="86" y="428" class="s" style="fill:#1f2937">서버마다 도는 알림 처리기</text>
  <line x1="538" y1="423" x2="558" y2="423" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#agy)"/>
