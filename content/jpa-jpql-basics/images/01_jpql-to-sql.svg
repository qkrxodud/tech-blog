<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>애플리케이션이 엔티티 Member와 속성 age를 대상으로 작성한 JPQL을 JPA가 SQL로 변환해 데이터베이스 테이블에 실행하고, 결과 행을 엔티티로 바꿔 List로 돌려주는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .msg { font-size: 11.5px; fill: #374151; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .cont { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="360" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">JPQL 실행 — 엔티티 대상 쿼리가 SQL로 변환됨</text>
  <text x="730" y="42" class="code" text-anchor="end">createQuery()</text>
  <text x="30" y="96" class="lane" text-anchor="start">애플리케이션</text>
  <text x="30" y="116" class="sub" text-anchor="start">JPQL 작성</text>
  <rect x="150" y="68" width="585" height="64" rx="6" class="track"/>
  <text x="30" y="186" class="lane" text-anchor="start">JPA</text>
  <text x="30" y="206" class="sub" text-anchor="start">SQL로 변환</text>
  <rect x="150" y="158" width="585" height="64" rx="6" class="track"/>
  <text x="30" y="276" class="lane" text-anchor="start">데이터베이스</text>
  <text x="30" y="296" class="sub" text-anchor="start">테이블 대상</text>
  <rect x="150" y="248" width="585" height="64" rx="6" class="track"/>
  <rect x="162" y="72" width="330" height="56" rx="8" class="box"/>
  <text x="327" y="94" class="m" text-anchor="middle">select m from Member as m</text>
  <text x="327" y="114" class="m" text-anchor="middle">where m.age &gt; 18</text>
  <rect x="162" y="162" width="330" height="56" rx="8" class="hold"/>
  <text x="327" y="185" class="t" text-anchor="middle">엔티티 Member → 테이블</text>
  <text x="327" y="205" class="val" text-anchor="middle">속성 age → 컬럼</text>
  <rect x="162" y="252" width="330" height="56" rx="8" class="box"/>
  <text x="327" y="274" class="m" text-anchor="middle">select m.* from Member m</text>
  <text x="327" y="294" class="m" text-anchor="middle">where m.age &gt; 18</text>
  <line x1="327" y1="128" x2="327" y2="158" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="327" y1="218" x2="327" y2="248" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="560" y="252" width="163" height="56" rx="8" class="box"/>
  <text x="641" y="276" class="t" text-anchor="middle">테이블 조회</text>
  <text x="641" y="295" class="val" text-anchor="middle">결과 행 반환</text>
  <rect x="560" y="162" width="163" height="56" rx="8" class="hold"/>
  <text x="641" y="186" class="t" text-anchor="middle">행 → 엔티티</text>
  <text x="641" y="205" class="val" text-anchor="middle">결과를 객체로</text>
  <rect x="560" y="72" width="163" height="56" rx="8" class="ok"/>
  <text x="641" y="96" class="okm" text-anchor="middle">List&lt;Member&gt;</text>
  <text x="641" y="115" class="val" text-anchor="middle">엔티티로 받음</text>
  <line x1="492" y1="280" x2="556" y2="280" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="641" y1="252" x2="641" y2="222" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="641" y1="162" x2="641" y2="132" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="344" class="sub" text-anchor="start">JPQL은 특정 데이터베이스 SQL에 의존하지 않고, 실행할 때 SQL로 변환됩니다</text>
</svg>
