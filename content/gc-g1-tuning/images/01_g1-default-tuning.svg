<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>G1 GC는 디폴트 옵션을 그대로 두고 MaxGCPauseMillis와 -Xmx만으로 throughput 또는 latency 쪽으로 방향을 잡을 수 있고, pause time 목표를 너무 타이트하게 잡으면 GC가 잦아진다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .gc { fill: #d1d5db; stroke: #6b7280; stroke-width: 1.2; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .br { stroke: #9ca3af; stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="360" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">G1 디폴트 옵션 — 두 옵션으로 방향 잡기</text>
  <rect x="40" y="62" width="680" height="52" rx="8" class="hold"/>
  <text x="380" y="84" class="op" text-anchor="middle">디폴트 옵션은 balance를 추구</text>
  <text x="380" y="103" class="val" text-anchor="middle">high throughput + 상대적으로 짧은 latency를 일관되게 · maximum throughput도, lowest latency도 아님</text>
  <rect x="40" y="140" width="250" height="52" rx="8" class="box"/>
  <text x="165" y="171" class="op" text-anchor="middle">throughput을 더 높이고 싶다</text>
  <line x1="290" y1="166" x2="338" y2="166" class="gl" marker-end="url(#agr)"/>
  <rect x="340" y="140" width="380" height="52" rx="8" class="ok"/>
  <text x="530" y="162" class="okt" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">MaxGCPauseMillis</tspan>를 더 길게</text>
  <text x="530" y="181" class="val" text-anchor="middle">또는 <tspan font-family="Menlo, Consolas, monospace">-Xmx</tspan>를 더 크게</text>
  <rect x="40" y="212" width="250" height="52" rx="8" class="box"/>
  <text x="165" y="243" class="op" text-anchor="middle">latency를 줄이고 싶다</text>
  <line x1="290" y1="238" x2="338" y2="238" class="gl" marker-end="url(#agr)"/>
  <rect x="340" y="212" width="380" height="52" rx="8" class="ok"/>
  <text x="530" y="243" class="okt" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">MaxGCPauseMillis</tspan>를 조금 더 타이트하게</text>
  <line x1="530" y1="264" x2="530" y2="286" class="rl" marker-end="url(#arr)"/>
  <text x="542" y="280" class="note">너무 타이트하면</text>
  <rect x="340" y="288" width="380" height="40" rx="8" class="bad"/>
  <text x="530" y="313" class="badt" text-anchor="middle">GC 자체가 잦아짐</text>
  <text x="40" y="356" class="sub">다른 collector에서 옮겨 올 때 — GC에 영향을 줄 옵션은 지우고 <tspan font-family="Menlo, Consolas, monospace">MaxGCPauseMillis</tspan>, <tspan font-family="Menlo, Consolas, monospace">-Xmx</tspan>, <tspan font-family="Menlo, Consolas, monospace">-Xms</tspan>만으로 튜닝</text>
</svg>
