<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>10장 테스트 수 — 기본 시험(./gradlew clean check)은 9장 671개에서 10장 계약 21개를 운영(SagaTest)과 코레오그래피 비교(ChoreographySagaTest)로 돌린 42개가 늘어 713개가 모두 통과했고 라인 커버리지는 97.0%(1118줄 중 1084줄, 애플리케이션 시작 클래스 제외). 재고 서비스 모듈 7개와 주문 서비스 모듈 10개도 통과했고 두 모듈에는 커버리지 검사를 걸지 않음. 비교 구현 ./gradlew knownFailingTest는 507개 중 125개가 실패했고, 그중 10장 비교는 계약 21개 × 다섯 구현 105개 중 16개(승인 먼저 7, 수량만 4, 실패로만 3, 조회로 확인 1, 그 자리 HTTP 1) 실패. 2~9장 비교는 9장 기록과 실패한 테스트 이름이 같고, 다른 것은 8장 되돌리기 비교 두 개(1개 → 0개, 2개 → 1개)이며 7장 jpaVersionTest는 11개 중 4개 실패로 9장과 같음. 후속 작업 뒤 다시 돌린 knownFailingTest는 126개가 실패했고 더해진 1개는 흔들리는 몰림 계약(수량만)</title>
