<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>사용자 1~4가 모두 version 1을 읽은 뒤, 사용자 1의 update가 version을 2로 올려 성공하고, 나머지 사용자의 update는 version 1을 찾지 못해 Exception으로 롤백되는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .valc { font-size: 12.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .dbc { font-size: 14px; font-weight: 700; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .mark { stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="416" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="396" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">낙관적 락 — version이 일치하는 update만 성공</text>
  <text x="730" y="42" class="code" text-anchor="end">@Version</text>
  <text x="220" y="68" class="step" text-anchor="middle">1단계</text>
  <text x="360" y="68" class="step" text-anchor="middle">2단계</text>
  <text x="500" y="68" class="step" text-anchor="middle">3단계</text>
  <text x="640" y="68" class="step" text-anchor="middle">4단계</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">사용자 1</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="108" class="op" text-anchor="middle">read</text>
  <text x="220" y="127" class="val" text-anchor="middle">version = 1</text>
  <rect x="302" y="88" width="116" height="48" rx="8" class="ok"/>
  <text x="360" y="108" class="okc" text-anchor="middle">update</text>
  <text x="360" y="127" class="val" text-anchor="middle">version 1 → 2</text>
  <rect x="582" y="88" width="116" height="48" rx="8" class="ok"/>
  <text x="640" y="117.0" class="okt" text-anchor="middle">주문 성공</text>
  <text x="30" y="168" class="lane">사용자 2</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="148" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="168" class="op" text-anchor="middle">read</text>
  <text x="220" y="187" class="val" text-anchor="middle">version = 1</text>
  <rect x="442" y="148" width="116" height="48" rx="8" class="bad"/>
  <text x="500" y="168" class="badc" text-anchor="middle">update</text>
  <text x="500" y="187" class="val" text-anchor="middle">version = 1 없음</text>
  <rect x="582" y="148" width="116" height="48" rx="8" class="hold"/>
  <text x="640" y="168" class="op" text-anchor="middle">rollback</text>
  <text x="640" y="187" class="val" text-anchor="middle">다시 시도</text>
  <text x="30" y="228" class="lane">사용자 3</text>
  <rect x="150" y="206" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="208" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="228" class="op" text-anchor="middle">read</text>
  <text x="220" y="247" class="val" text-anchor="middle">version = 1</text>
  <rect x="442" y="208" width="116" height="48" rx="8" class="bad"/>
  <text x="500" y="228" class="badc" text-anchor="middle">update</text>
  <text x="500" y="247" class="val" text-anchor="middle">version = 1 없음</text>
  <rect x="582" y="208" width="116" height="48" rx="8" class="hold"/>
  <text x="640" y="228" class="op" text-anchor="middle">rollback</text>
  <text x="640" y="247" class="val" text-anchor="middle">다시 시도</text>
  <text x="30" y="288" class="lane">사용자 4</text>
  <rect x="150" y="266" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="268" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="288" class="op" text-anchor="middle">read</text>
  <text x="220" y="307" class="val" text-anchor="middle">version = 1</text>
  <rect x="442" y="268" width="116" height="48" rx="8" class="bad"/>
  <text x="500" y="288" class="badc" text-anchor="middle">update</text>
  <text x="500" y="307" class="val" text-anchor="middle">version = 1 없음</text>
  <rect x="582" y="268" width="116" height="48" rx="8" class="hold"/>
  <text x="640" y="288" class="op" text-anchor="middle">rollback</text>
  <text x="640" y="307" class="val" text-anchor="middle">다시 시도</text>
  <text x="30" y="347" class="db">DB의 version</text>
  <rect x="180" y="326" width="80" height="32" rx="6" class="dbbox"/>
  <text x="220" y="347" class="dbc" text-anchor="middle">1</text>
  <rect x="320" y="326" width="80" height="32" rx="6" class="ok"/>
  <text x="360" y="347" class="okc" text-anchor="middle">2</text>
  <rect x="460" y="326" width="80" height="32" rx="6" class="dbbox"/>
  <text x="500" y="347" class="dbc" text-anchor="middle">2</text>
  <rect x="600" y="326" width="80" height="32" rx="6" class="dbbox"/>
  <text x="640" y="347" class="dbc" text-anchor="middle">2</text>
  <text x="150" y="390" class="foot">version = 1을 찾지 못한 update는 Exception이 발생해 롤백됩니다.</text>
</svg>
