<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>위는 외부 코드가 ShippingInfo를 꺼내 주소를 직접 바꿔 규칙 검사를 건너뛰는 흐름, 아래는 Order의 changeShippingInfo가 출고 전인지 확인한 뒤 새 밸류를 할당하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .ops { font-size: 11.5px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .src { font-size: 13px; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .grp { fill: #f3f4f6; stroke: #c4c8ce; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .pkg { fill: #ffffff; stroke: #c4c8ce; stroke-width: 1.2; }
    .grpt { font-size: 13px; font-weight: 700; fill: #4b5563; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .edge { stroke: #9ca3af; stroke-width: 1.4; fill: none; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="760" height="380" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="170" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">외부에서 직접 변경 — 루트의 규칙을 건너뛴다</text>
  <rect x="30" y="60" width="164" height="56" rx="8" class="box"/>
  <text x="112.0" y="83.5" class="t" text-anchor="middle">외부 코드</text>
  <text x="112.0" y="102.5" class="val" text-anchor="middle">애그리거트 밖</text>
  <rect x="210" y="60" width="164" height="56" rx="8" class="box"/>
  <text x="292.0" y="83.5" class="ops" text-anchor="middle">getShippingInfo()</text>
  <text x="292.0" y="102.5" class="val" text-anchor="middle">밸류를 꺼냄</text>
  <line x1="195" y1="88" x2="207" y2="88" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="390" y="60" width="164" height="56" rx="8" class="bad"/>
  <text x="472.0" y="83.5" class="badc" text-anchor="middle">setAddress()</text>
  <text x="472.0" y="102.5" class="val" text-anchor="middle">필드를 직접 변경</text>
  <line x1="375" y1="88" x2="387" y2="88" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="570" y="60" width="164" height="56" rx="8" class="bad"/>
  <text x="652.0" y="83.5" class="badt" text-anchor="middle">일관성 깨짐</text>
  <text x="652.0" y="102.5" class="val" text-anchor="middle">주문 상태 확인 없음</text>
  <line x1="555" y1="88" x2="567" y2="88" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="30" y="150" class="note">출고 여부와 상관없이 배송지가 바뀝니다. DB 테이블을 직접 수정한 것과 같은 결과입니다.</text>
  <rect x="10" y="196" width="740" height="174" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="228" class="h">루트가 제공하는 메서드로 변경 — 규칙 검사를 거친다</text>
  <rect x="30" y="246" width="164" height="56" rx="8" class="box"/>
  <text x="112.0" y="269.5" class="t" text-anchor="middle">외부 코드</text>
  <text x="112.0" y="288.5" class="val" text-anchor="middle">새 밸류 생성</text>
  <rect x="210" y="246" width="164" height="56" rx="8" class="box"/>
  <text x="292.0" y="269.5" class="ops" text-anchor="middle">changeShippingInfo()</text>
  <text x="292.0" y="288.5" class="val" text-anchor="middle">새 ShippingInfo 전달</text>
  <line x1="195" y1="274" x2="207" y2="274" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="390" y="246" width="164" height="56" rx="8" class="box"/>
  <text x="472.0" y="269.5" class="ops" text-anchor="middle">verifyNotYetShipped()</text>
  <text x="472.0" y="288.5" class="val" text-anchor="middle">출고 전인지 확인</text>
  <line x1="375" y1="274" x2="387" y2="274" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="570" y="246" width="164" height="56" rx="8" class="ok"/>
  <text x="652.0" y="269.5" class="okc" text-anchor="middle">setShippingInfo()</text>
  <text x="652.0" y="288.5" class="val" text-anchor="middle">private, 새 객체 할당</text>
  <line x1="555" y1="274" x2="567" y2="274" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="30" y="336" class="gnote">set 메서드를 공개하지 않고 밸류를 불변으로 두면 위쪽 코드는 컴파일되지 않습니다.</text>
</svg>
