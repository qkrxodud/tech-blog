  <rect width="760" height="480" fill="#ffffff"/>
  <text x="24" y="30" class="h">결정 다섯 가지 한눈에</text>
  <text x="24" y="52" class="gs">출발 코드의 5장 테스트 37개 중 29개 실패 → 완성 코드에서 460개 모두 통과</text>
  <text x="110" y="84" class="gs" style="font-size:11.5px">출발 코드에서</text>
  <text x="372" y="84" class="gs" style="font-size:11.5px">고른 것</text>
  <text x="586" y="84" class="gs" style="font-size:11.5px">결과 · 비교</text>
  <rect x="24" y="94" width="76" height="70" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="62" y="134" class="t2" text-anchor="middle" style="font-size:12.5px">결정 1</text>
  <text x="110" y="112" class="t2" style="font-size:12px">취소를 어떻게 기록할까</text>
  <rect x="110" y="120" width="224" height="40" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="122" y="136" class="bads" style="font-size:11px">상태만 바꿈 · 취소 이력과</text>
  <text x="122" y="152" class="bads" style="font-size:11px">남은 금액이 없음</text>
  <line x1="336" y1="140" x2="356" y2="140" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="360" y="100" width="214" height="58" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="372" y="124" class="bt" style="font-size:11.5px">취소마다 <tspan class="m">payment_cancel</tspan> 한 줄</text>
  <text x="372" y="142" class="bt" style="font-size:11.5px">남은 금액 = 금액 − 끝난 취소</text>
  <line x1="576" y1="129" x2="586" y2="129" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="588" y="100" width="148" height="58" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="598" y="124" class="oks" style="font-size:10px">남은 금액 안에서</text>
  <text x="598" y="142" class="oks" style="font-size:10px">여러 번 부분 취소</text>
  <rect x="24" y="170" width="76" height="70" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="62" y="210" class="t2" text-anchor="middle" style="font-size:12.5px">결정 2</text>
  <text x="110" y="188" class="t2" style="font-size:12px">부분 취소된 결제의 상태</text>
  <rect x="110" y="196" width="224" height="40" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="122" y="212" class="bads" style="font-size:11px">5000원 취소에도</text>
  <text x="122" y="228" class="bads" style="font-size:11px"><tspan class="m">APPROVAL_CANCELED</tspan></text>
  <line x1="336" y1="216" x2="356" y2="216" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="360" y="176" width="214" height="58" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="372" y="200" class="bt" style="font-size:11.5px">상태 그대로</text>
  <text x="372" y="218" class="bt" style="font-size:11.5px">0원이면 <tspan class="m">cancel()</tspan> 전이</text>
  <line x1="576" y1="205" x2="586" y2="205" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="588" y="176" width="148" height="58" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="598" y="200" class="oks" style="font-size:10px">세 구현의 전이</text>
  <text x="598" y="218" class="oks" style="font-size:10px">테스트 그대로 통과</text>
  <rect x="24" y="246" width="76" height="70" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="62" y="286" class="t2" text-anchor="middle" style="font-size:12.5px">결정 3</text>
  <text x="110" y="264" class="t2" style="font-size:12px">같은 취소 요청 가리기</text>
  <rect x="110" y="272" width="224" height="40" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="122" y="288" class="bads" style="font-size:11px">같은 키로 다시 온 취소가</text>
  <text x="122" y="304" class="bads" style="font-size:11px">PG에 두 번</text>
  <line x1="336" y1="292" x2="356" y2="292" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="360" y="252" width="214" height="58" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="372" y="276" class="bt" style="font-size:11.5px"><tspan class="m">Idempotency-Key</tspan> 필수</text>
  <text x="372" y="294" class="bt" style="font-size:11.5px">다른 내용이면 <tspan class="m">422</tspan></text>
  <line x1="576" y1="281" x2="586" y2="281" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="588" y="252" width="148" height="58" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="598" y="276" class="oks" style="font-size:10px">자연 키: 두 번째 취소 버림</text>
  <text x="598" y="294" class="oks" style="font-size:10px">지금 상태: 4건 더 취소</text>
  <rect x="24" y="322" width="76" height="70" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="62" y="362" class="t2" text-anchor="middle" style="font-size:12.5px">결정 4</text>
  <text x="110" y="340" class="t2" style="font-size:12px">기록과 PG 호출 순서</text>
  <rect x="110" y="348" width="224" height="40" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="122" y="364" class="bads" style="font-size:11px">결과 모름 취소가</text>
  <text x="122" y="380" class="bads" style="font-size:11px">남을 곳이 없음</text>
  <line x1="336" y1="368" x2="356" y2="368" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="360" y="328" width="214" height="58" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="372" y="352" class="bt" style="font-size:11.5px"><tspan class="m">REQUESTED</tspan> 먼저 기록</text>
  <text x="372" y="370" class="bt" style="font-size:11.5px"><tspan class="m">UNKNOWN</tspan>은 보정으로</text>
  <line x1="576" y1="357" x2="586" y2="357" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="588" y="328" width="148" height="58" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="598" y="352" class="oks" style="font-size:10px">PG 먼저 부르면</text>
  <text x="598" y="370" class="oks" style="font-size:10px">4건이 PG와 어긋남</text>
  <rect x="24" y="398" width="76" height="70" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="62" y="438" class="t2" text-anchor="middle" style="font-size:12.5px">결정 5</text>
  <text x="110" y="416" class="t2" style="font-size:12px">PG에도 멱등키를 넘길까</text>
  <rect x="110" y="424" width="224" height="40" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="122" y="440" class="bads" style="font-size:11px">시간 초과 뒤 재요청이</text>
  <text x="122" y="456" class="bads" style="font-size:11px">PG에서 두 번 취소</text>
  <line x1="336" y1="444" x2="356" y2="444" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="360" y="404" width="214" height="58" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="372" y="428" class="bt" style="font-size:11.5px">고객의 키를 PG에도</text>
  <text x="372" y="446" class="bt" style="font-size:11.5px">같은 키로 다시 보냄</text>
  <line x1="576" y1="433" x2="586" y2="433" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="588" y="404" width="148" height="58" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="598" y="428" class="oks" style="font-size:10px">넘기지 않으면</text>
  <text x="598" y="446" class="oks" style="font-size:10px">2건 더 취소</text>
</svg>
