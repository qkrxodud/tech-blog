  <text x="202" y="292" class="oks" style="font-size: 12px">요청마다 새 키</text>
  <rect x="330" y="240" width="132" height="74" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.2"/>
  <use href="#xmark" x="346" y="265"/>
