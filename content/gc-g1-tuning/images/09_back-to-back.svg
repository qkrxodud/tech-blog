<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>MaxGCPauseMillis가 200이고 GCPauseIntervalMillis가 201이면 MMU가 약 0.5%라서 GC가 back to back으로 이어질 수 있고, GCPauseIntervalMillis를 늘리면 GC 사이에 mutator가 실행될 시간이 보장된다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .gc { fill: #d1d5db; stroke: #6b7280; stroke-width: 1.2; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .br { stroke: #9ca3af; stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="176" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">디폴트 — GC가 끝나자마자 다음 GC</text>
  <text x="730" y="42" class="code" text-anchor="end">200ms / 201ms</text>
  <text x="40" y="84" class="sub">MMU = (201 − 200) / 201 ≈ 0.5%</text>
  <rect x="40" y="100" width="110" height="40" class="gc"/>
  <rect x="150" y="100" width="3" height="40" class="bad"/>
  <rect x="153" y="100" width="110" height="40" class="gc"/>
  <rect x="263" y="100" width="3" height="40" class="bad"/>
  <rect x="266" y="100" width="110" height="40" class="gc"/>
  <rect x="376" y="100" width="3" height="40" class="bad"/>
  <rect x="379" y="100" width="110" height="40" class="gc"/>
  <rect x="489" y="100" width="3" height="40" class="bad"/>
  <rect x="492" y="100" width="110" height="40" class="gc"/>
  <rect x="602" y="100" width="3" height="40" class="bad"/>
  <rect x="605" y="100" width="115" height="40" class="gc"/>
  <text x="40" y="168" class="note">mutator가 거의 실행되지 못하고 애플리케이션이 진행되지 않음</text>
  <rect x="10" y="202" width="740" height="208" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="234" class="h">GCPauseIntervalMillis를 늘림 — GC 사이에 간격</text>
  <text x="730" y="234" class="sub" text-anchor="end">예: <tspan font-family="Menlo, Consolas, monospace" font-size="13">200ms / 400ms</tspan></text>
  <text x="40" y="262" class="sub">MMU = (400 − 200) / 400 = 50%</text>
  <rect x="40" y="276" width="110" height="40" class="gc"/>
  <rect x="150" y="276" width="120" height="40" class="ok"/>
  <rect x="270" y="276" width="110" height="40" class="gc"/>
  <rect x="380" y="276" width="120" height="40" class="ok"/>
  <rect x="500" y="276" width="110" height="40" class="gc"/>
  <rect x="610" y="276" width="110" height="40" class="ok"/>
  <rect x="40" y="336" width="16" height="16" class="gc"/>
  <text x="64" y="349" class="val">GC pause</text>
  <rect x="150" y="336" width="16" height="16" class="ok"/>
  <text x="174" y="349" class="val">mutator phase</text>
  <text x="40" y="386" class="gnote">G1이 GC 사이의 간격을 더 벌리려고 함 (막대 길이는 비율을 보여 주기 위한 것)</text>
</svg>
