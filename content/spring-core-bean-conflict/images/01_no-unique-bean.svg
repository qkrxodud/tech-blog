<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>OrderServiceImpl이 DiscountPolicy 타입으로 빈을 조회했는데 rateDiscountPolicy와 fixDiscountPolicy 2개가 발견되어 NoUniqueBeanDefinitionException이 발생하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .okms { font-size: 12px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .chip { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .gscope { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .dim { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dimt { font-size: 12.5px; fill: #9ca3af; font-family: Menlo, Consolas, monospace; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .tag { font-size: 11.5px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="310" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">조회 빈이 2개 — 하나를 고르지 못해 예외 발생</text>
  <rect x="30" y="76" width="230" height="104" rx="8" class="box"/>
  <text x="145" y="102" class="mb" text-anchor="middle">OrderServiceImpl</text>
  <rect x="46" y="118" width="198" height="40" rx="6" class="chip"/>
  <text x="145" y="143" class="m" text-anchor="middle">DiscountPolicy</text>
  <text x="145" y="172" class="sub" text-anchor="middle">주입받을 타입</text>
  <text x="288" y="118" class="sub" text-anchor="middle">타입으로</text>
  <text x="288" y="134" class="sub" text-anchor="middle">조회</text>
  <line x1="262" y1="146" x2="316" y2="146" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="320" y="66" width="410" height="124" rx="10" class="scope"/>
  <text x="340" y="90" class="t">스프링 컨테이너 — <tspan font-family="Menlo, Consolas, monospace">DiscountPolicy</tspan> 타입 빈</text>
  <rect x="340" y="108" width="180" height="60" rx="8" class="bad"/>
  <text x="430" y="134" class="badm" text-anchor="middle">rateDiscountPolicy</text>
  <text x="430" y="154" class="sub" text-anchor="middle">RateDiscountPolicy</text>
  <rect x="534" y="108" width="180" height="60" rx="8" class="bad"/>
  <text x="624" y="134" class="badm" text-anchor="middle">fixDiscountPolicy</text>
  <text x="624" y="154" class="sub" text-anchor="middle">FixDiscountPolicy</text>
  <line x1="525" y1="192" x2="525" y2="222" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="30" y="226" width="700" height="66" rx="8" class="bad"/>
  <text x="380" y="254" class="badm" text-anchor="middle">NoUniqueBeanDefinitionException</text>
  <text x="380" y="278" class="note" text-anchor="middle">하나의 빈을 기대했는데 fixDiscountPolicy, rateDiscountPolicy 2개가 발견됨</text>
</svg>
