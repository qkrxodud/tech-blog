<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>7장 결정 다섯 가지 한눈에 — 결정 1 같은 결제를 바꾸는 기록은 출발 코드에서 같은 승인이 PG에 두 번, 남은 금액을 넘는 취소가 PG까지, 승인 답 기록이 알림 반영을 덮어씀 → 결제 줄 select … for update로 잠금, 같은 결제 기록 계약 11개 통과, 대신 겹친 요청은 기다리고 1000원 취소 30개의 응답 중앙값은 잠그지 않을 때의 약 두 배. 결정 2 PG 답을 기다리는 결제에 같은 결제 키로 다시 온 승인은 409 → PG를 부르지 않고 202 확인 중, 4장의 결과 모름과 같은 답. 결정 3 같은 주문의 동시 준비는 500 → 주문번호 중복 거부를 잡아 새 트랜잭션에서 다시 읽고 201 또는 409, 아직 없는 줄은 잠글 수 없음. 결정 4 같은 키 동시 취소는 500 → 코드를 바꾸지 않고 결정 1의 잠금 뒤 5장 규칙. 결정 5 주기 작업은 서버마다 PG 조회 → 작업 잠금 테이블로 한 번에 서버 한 대, 서버 3대에서 PG 조회 60번이 20번</title>
