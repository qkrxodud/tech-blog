<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>나이가 100인 회원을 이름 null, member5, member6 순서로 저장해도 age desc, username asc nullsLast로 정렬하면 member5, member6, 이름이 null인 회원 순서로 조회되는 결과</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .msg { font-size: 11.5px; fill: #374151; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .cont { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="280" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">정렬 — 이름이 null인 회원은 마지막에</text>
  <text x="30" y="96" class="lane">저장 순서</text>
  <text x="30" y="114" class="sub">age = 100</text>
  <rect x="180" y="72" width="170" height="56" rx="8" class="box"/>
  <text x="265" y="96" class="m" text-anchor="middle">username = null</text>
  <text x="265" y="116" class="val" text-anchor="middle">age 100</text>
  <rect x="370" y="72" width="170" height="56" rx="8" class="box"/>
  <text x="455" y="96" class="opm" text-anchor="middle">member5</text>
  <text x="455" y="116" class="val" text-anchor="middle">age 100</text>
  <rect x="560" y="72" width="170" height="56" rx="8" class="box"/>
  <text x="645" y="96" class="opm" text-anchor="middle">member6</text>
  <text x="645" y="116" class="val" text-anchor="middle">age 100</text>
  <text x="455" y="160" class="m" text-anchor="middle">orderBy(member.age.desc(), member.username.asc().nullsLast())</text>
  <line x1="455" y1="132" x2="455" y2="148" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="455" y1="168" x2="455" y2="184" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="214" class="lane">정렬 결과</text>
  <text x="30" y="232" class="sub">result.get(0~2)</text>
  <rect x="180" y="190" width="170" height="56" rx="8" class="ok"/>
  <text x="265" y="214" class="okm" text-anchor="middle">member5</text>
  <text x="265" y="234" class="val" text-anchor="middle">0번째</text>
  <rect x="370" y="190" width="170" height="56" rx="8" class="ok"/>
  <text x="455" y="214" class="okm" text-anchor="middle">member6</text>
  <text x="455" y="234" class="val" text-anchor="middle">1번째</text>
  <rect x="560" y="190" width="170" height="56" rx="8" class="hold"/>
  <text x="645" y="214" class="m" text-anchor="middle">username = null</text>
  <text x="645" y="234" class="val" text-anchor="middle">2번째 — nullsLast</text>
  <text x="30" y="274" class="foot">나이가 모두 같아 이름 오름차순으로 정렬되고, 이름이 없는 회원은 nullsLast()로 맨 뒤에 놓입니다.</text>
</svg>
