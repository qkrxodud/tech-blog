  <text x="18" y="210" class="gs" style="font-size:9.5px">고객 20명</text>
  <rect x="120" y="180" width="67.5" height="40" rx="4" fill="#fbebdd" stroke="#d99a6c"/>
  <text x="153.75" y="196" class="os" text-anchor="middle" style="font-size:10px;font-weight:700">처음 20건</text>
