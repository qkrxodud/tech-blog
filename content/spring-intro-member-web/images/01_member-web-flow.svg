<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>HomeController가 GET /, GET /members/new, POST /members/new, GET /members 요청을 각각 home(), createForm(), create(), list() 메서드로 처리하고, create()와 list()는 MemberService의 join()과 findMembers()를 호출한 뒤 redirect:/와 members/list를 반환하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .grp { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 13px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 12px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="410" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="390" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">회원 웹 기능 — 요청마다 HomeController가 처리하는 메서드</text>
  <text x="110" y="76" class="step" text-anchor="middle">브라우저 요청</text>
  <text x="290" y="76" class="step" text-anchor="middle">HomeController</text>
  <text x="460" y="76" class="step" text-anchor="middle">MemberService</text>
  <text x="640" y="76" class="step" text-anchor="middle">반환</text>
  <line x1="30" y1="84" x2="730" y2="84" class="axis"/>
  <rect x="30" y="96" width="160" height="56" rx="8" class="box"/>
  <text x="110" y="120" class="m" text-anchor="middle" font-weight="700">GET /</text>
  <text x="110" y="139" class="sub" text-anchor="middle">홈 화면 요청</text>
  <rect x="210" y="96" width="160" height="56" rx="8" class="box"/>
  <text x="290" y="120" class="m" text-anchor="middle" font-weight="700">home()</text>
  <text x="290" y="139" class="sub" text-anchor="middle" font-family="Menlo, Consolas, monospace">@GetMapping</text>
  <rect x="550" y="96" width="180" height="56" rx="8" class="box"/>
  <text x="640" y="120" class="m" text-anchor="middle" font-weight="700">&quot;home&quot;</text>
  <text x="640" y="139" class="sub" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">home.html</tspan> 출력</text>
  <line x1="192" y1="124" x2="206" y2="124" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="372" y1="124" x2="546" y2="124" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <rect x="30" y="164" width="160" height="56" rx="8" class="box"/>
  <text x="110" y="188" class="m" text-anchor="middle" font-weight="700">GET /members/new</text>
  <text x="110" y="207" class="sub" text-anchor="middle">등록 폼 요청</text>
  <rect x="210" y="164" width="160" height="56" rx="8" class="box"/>
  <text x="290" y="188" class="m" text-anchor="middle" font-weight="700">createForm()</text>
  <text x="290" y="207" class="sub" text-anchor="middle" font-family="Menlo, Consolas, monospace">@GetMapping</text>
  <rect x="550" y="164" width="180" height="56" rx="8" class="box"/>
  <text x="640" y="187" class="m" text-anchor="middle">&quot;members/</text>
  <text x="640" y="206" class="m" text-anchor="middle">createMemberForm&quot;</text>
  <line x1="192" y1="192" x2="206" y2="192" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="372" y1="192" x2="546" y2="192" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <rect x="30" y="232" width="160" height="56" rx="8" class="box"/>
  <text x="110" y="256" class="m" text-anchor="middle" font-weight="700">POST /members/new</text>
  <text x="110" y="275" class="sub" text-anchor="middle">name 값 제출</text>
  <rect x="210" y="232" width="160" height="56" rx="8" class="box"/>
  <text x="290" y="256" class="m" text-anchor="middle" font-weight="700">create(MemberForm)</text>
  <text x="290" y="275" class="sub" text-anchor="middle" font-family="Menlo, Consolas, monospace">@PostMapping</text>
  <rect x="390" y="232" width="140" height="56" rx="8" class="box"/>
  <text x="460" y="256" class="m" text-anchor="middle" font-weight="700">join(member)</text>
  <text x="460" y="275" class="sub" text-anchor="middle">회원 저장</text>
  <rect x="550" y="232" width="180" height="56" rx="8" class="ok"/>
  <text x="640" y="256" class="okm" text-anchor="middle" font-weight="700">&quot;redirect:/&quot;</text>
  <text x="640" y="275" class="sub" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">GET /</tspan> 다시 요청</text>
  <line x1="192" y1="260" x2="206" y2="260" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="372" y1="260" x2="386" y2="260" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="532" y1="260" x2="546" y2="260" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="30" y="300" width="160" height="56" rx="8" class="box"/>
  <text x="110" y="324" class="m" text-anchor="middle" font-weight="700">GET /members</text>
  <text x="110" y="343" class="sub" text-anchor="middle">목록 요청</text>
  <rect x="210" y="300" width="160" height="56" rx="8" class="box"/>
  <text x="290" y="324" class="m" text-anchor="middle" font-weight="700">list(Model)</text>
  <text x="290" y="343" class="sub" text-anchor="middle" font-family="Menlo, Consolas, monospace">@GetMapping</text>
  <rect x="390" y="300" width="140" height="56" rx="8" class="box"/>
  <text x="460" y="324" class="m" text-anchor="middle" font-weight="700">findMembers()</text>
  <text x="460" y="343" class="sub" text-anchor="middle">회원 목록 조회</text>
  <rect x="550" y="300" width="180" height="56" rx="8" class="box"/>
  <text x="640" y="324" class="m" text-anchor="middle" font-weight="700">&quot;members/list&quot;</text>
  <text x="640" y="343" class="sub" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">members</tspan> 목록 출력</text>
  <line x1="192" y1="328" x2="206" y2="328" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="372" y1="328" x2="386" y2="328" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="532" y1="328" x2="546" y2="328" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="30" y="382" class="foot">점선은 서비스를 거치지 않고 바로 뷰 이름을 반환하는 요청입니다. 등록 뒤에는 <tspan font-family="Menlo, Consolas, monospace">redirect:/</tspan>로 홈 화면에 돌아갑니다.</text>
</svg>
