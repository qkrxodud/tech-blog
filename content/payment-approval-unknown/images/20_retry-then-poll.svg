  <rect width="760" height="560" fill="#ffffff"/>
  <text x="24" y="30" class="h">결정 5 — 202를 받은 클라이언트는 조회로 다시 확인</text>
  <line x1="80" y1="104" x2="80" y2="492" class="life"/>
  <line x1="330" y1="104" x2="330" y2="492" class="life"/>
  <line x1="640" y1="104" x2="640" y2="492" class="life"/>
  <rect x="20" y="52" width="120" height="52" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <use href="#i-card" x="30" y="64"/>
  <text x="70" y="83" class="t2" style="font-size:12.5px">클라이언트</text>
  <rect x="240" y="52" width="180" height="52" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <use href="#i-app" x="252" y="62"/>
  <text x="292" y="74" class="t2" style="font-size:12.5px">결제 서버</text>
  <text x="292" y="92" class="s" style="font-size:11px"><tspan class="m">/api/v1/payments</tspan></text>
  <rect x="578" y="52" width="124" height="52" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <use href="#i-server" x="588" y="64"/>
  <text x="632" y="83" class="t2" style="font-size:12.5px">Mock PG</text>
  <circle cx="30" cy="138" r="10" fill="#111827"/><text x="30" y="142" class="num" text-anchor="middle">1</text>
  <line x1="89" y1="138" x2="328" y2="138" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <text x="205" y="130" class="lbl" text-anchor="middle" style="font-size:11.5px"><tspan class="m">POST …/{orderId}/confirm</tspan></text>
  <text x="205" y="154" class="lbl" text-anchor="middle" style="font-size:11px">같은 <tspan class="m">paymentKey</tspan>로 다시 · 결과 모름 결제</text>
  <rect x="342" y="124" width="220" height="30" rx="8" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <text x="354" y="144" class="t2" style="font-size:11.5px">이미 보낸 요청으로 봄 · PG 안 부름</text>
  <circle cx="30" cy="186" r="10" fill="#111827"/><text x="30" y="190" class="num" text-anchor="middle">2</text>
  <line x1="321" y1="186" x2="82" y2="186" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#agr)"/>
  <text x="205" y="178" class="oks" text-anchor="middle" style="font-size:11.5px"><tspan class="m">202 status APPROVAL_UNKNOWN</tspan></text>
  <text x="205" y="202" class="gs" text-anchor="middle" style="font-size:11px">언제 다시 확인하라는 정보는 없음</text>
  <circle cx="30" cy="238" r="10" fill="#111827"/><text x="30" y="242" class="num" text-anchor="middle">3</text>
  <line x1="89" y1="238" x2="328" y2="238" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <text x="205" y="230" class="lbl" text-anchor="middle" style="font-size:11.5px"><tspan class="m">GET …/{orderId}</tspan></text>
  <circle cx="30" cy="270" r="10" fill="#111827"/><text x="30" y="274" class="num" text-anchor="middle">4</text>
  <line x1="321" y1="270" x2="82" y2="270" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#agy)"/>
  <text x="205" y="262" class="s" text-anchor="middle" style="font-size:11.5px"><tspan class="m">200 status APPROVAL_UNKNOWN</tspan></text>
  <text x="205" y="286" class="gs" text-anchor="middle" style="font-size:11px">보정 전 · 아직 확인 중</text>
  <rect x="236" y="306" width="510" height="88" rx="10" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.2"/>
  <text x="250" y="326" class="ot" style="font-size:12px">대기 시간이 지난 뒤 주기 보정 (결정 3)</text>
  <line x1="339" y1="348" x2="638" y2="348" stroke="#c2410c" stroke-width="1.6" class="run" marker-end="url(#aor)"/>
  <text x="490" y="342" class="os" text-anchor="middle" style="font-size:11px"><tspan class="m">GET /v1/payments/orders/{orderId}</tspan></text>
  <line x1="631" y1="370" x2="339" y2="370" stroke="#c2410c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#aor)"/>
  <text x="490" y="386" class="os" text-anchor="middle" style="font-size:11px">조회 결과로 결제를 닫음 (결정 2)</text>
  <circle cx="30" cy="424" r="10" fill="#111827"/><text x="30" y="428" class="num" text-anchor="middle">5</text>
  <line x1="89" y1="424" x2="328" y2="424" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <text x="205" y="416" class="lbl" text-anchor="middle" style="font-size:11.5px"><tspan class="m">GET …/{orderId}</tspan></text>
  <circle cx="30" cy="458" r="10" fill="#111827"/><text x="30" y="462" class="num" text-anchor="middle">6</text>
  <line x1="321" y1="458" x2="82" y2="458" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#agr)"/>
  <text x="205" y="450" class="oks" text-anchor="middle" style="font-size:11px">200 APPROVED 또는 APPROVAL_FAILED</text>
  <text x="205" y="476" class="gs" text-anchor="middle" style="font-size:11px">보정이 닫은 결과</text>
  <rect x="24" y="504" width="712" height="44" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="44" y="526"/>
  <text x="62" y="523" class="badt" style="font-size:12px">같은 결제 키로 다시 왔는데 결제가 <tspan class="m">AUTHENTICATED</tspan>면 여전히 <tspan class="m">409</tspan></text>
  <text x="62" y="540" class="bads" style="font-size:10.5px">앞 요청이 PG 답을 기다리는 중인지, 5xx나 기록 실패로 남은 결제인지 요청 시점에는 구분하지 못함</text>
  <rect x="342" y="124" width="220" height="30" rx="8" fill="none" stroke="#d97706" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1336;0.1436;0.1936;0.2036;1"/></rect>
  <rect x="20" y="52" width="120" height="52" rx="10" fill="none" stroke="#16a34a" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.91;0.92;0.97;0.98;1"/></rect>
  <rect x="236" y="306" width="510" height="88" rx="10" fill="none" stroke="#ea580c" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6093;0.6193;0.6693;0.6793;1"/></rect>
  <g class="anim" opacity="0">
    <use href="#pkt"/>
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear"
      path="M80,138 H330 V186 H80 V238 H330 V270 H80 V424 H330 V458 H80"
      keyPoints="0;0;0.1374;0.3011;0.467;0.622;0.6659;0.844;1;1;1" keyTimes="0;0.02;0.1436;0.291;0.4403;0.5798;0.6193;0.7796;0.92;0.92;1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.015;0.02;0.92;0.93;1"/>
  </g>
</svg>
