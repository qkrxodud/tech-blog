<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>로컬에서 80 포트와 81 포트로 띄우면 쿠키가 포트를 구분하지 않아 같은 SESSION 쿠키가 전송되고 세션은 Redis에 있어 로그인 상태가 유지되며, 같은 인스턴스로 두 번 로그인하면 그 인스턴스의 메모리 registry가 앞 세션을 알고 있어 중복 로그인도 막히는 모습</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="412" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="180" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h" text-anchor="start">localhost:80과 :81 — 세션 공유가 확인됨</text>
  <text x="730" y="42" class="gnote" text-anchor="end">세션 공유</text>
  <text x="110.0" y="70" class="step" text-anchor="middle">로그인</text>
  <text x="286.0" y="70" class="step" text-anchor="middle">쿠키</text>
  <text x="462.0" y="70" class="step" text-anchor="middle">다른 포트로 요청</text>
  <text x="638.0" y="70" class="step" text-anchor="middle">결과</text>
  <rect x="30" y="82" width="160" height="52" rx="8" class="box"/>
  <text x="110.0" y="102" class="t" text-anchor="middle">80에서 로그인</text>
  <text x="110.0" y="121" class="val" text-anchor="middle">SESSION 쿠키 발급</text>
  <rect x="206" y="82" width="160" height="52" rx="8" class="hold"/>
  <text x="286.0" y="102" class="t" text-anchor="middle">브라우저 쿠키</text>
  <text x="286.0" y="121" class="val" text-anchor="middle">포트 구분 없이 저장</text>
  <line x1="192" y1="108" x2="203" y2="108" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="382" y="82" width="160" height="52" rx="8" class="box"/>
  <text x="462.0" y="102" class="t" text-anchor="middle">81로 요청</text>
  <text x="462.0" y="121" class="val" text-anchor="middle">같은 쿠키 전송</text>
  <line x1="368" y1="108" x2="379" y2="108" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="558" y="82" width="160" height="52" rx="8" class="ok"/>
  <text x="638.0" y="102" class="okt" text-anchor="middle">로그인 상태 유지</text>
  <text x="638.0" y="121" class="val" text-anchor="middle">Redis에서 세션 조회</text>
  <line x1="544" y1="108" x2="555" y2="108" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="162" class="sub" text-anchor="start">쿠키는 포트를 구분하지 않으므로 두 인스턴스가 같은 세션을 보게 됩니다.</text>
  <rect x="10" y="206" width="740" height="180" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="238" class="h" text-anchor="start">같은 인스턴스로 두 번 로그인 — 중복 로그인도 막힘</text>
  <text x="730" y="238" class="gnote" text-anchor="end">중복 로그인 제어</text>
  <text x="110.0" y="266" class="step" text-anchor="middle">첫 로그인</text>
  <text x="286.0" y="266" class="step" text-anchor="middle">두 번째 로그인</text>
  <text x="462.0" y="266" class="step" text-anchor="middle">판단</text>
  <text x="638.0" y="266" class="step" text-anchor="middle">결과</text>
  <rect x="30" y="278" width="160" height="52" rx="8" class="box"/>
  <text x="110.0" y="298" class="t" text-anchor="middle">80에서 첫 로그인</text>
  <text x="110.0" y="317" class="val" text-anchor="middle">registry: user1 → S1</text>
  <rect x="206" y="278" width="160" height="52" rx="8" class="box"/>
  <text x="286.0" y="298" class="t" text-anchor="middle">다른 브라우저로 80</text>
  <text x="286.0" y="317" class="val" text-anchor="middle">로그인, 같은 registry</text>
  <line x1="192" y1="304" x2="203" y2="304" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="382" y="278" width="160" height="52" rx="8" class="hold"/>
  <text x="462.0" y="298" class="t" text-anchor="middle">S1이 이미 있음</text>
  <text x="462.0" y="317" class="val" text-anchor="middle">최대 1개 초과</text>
  <line x1="368" y1="304" x2="379" y2="304" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="558" y="278" width="160" height="52" rx="8" class="ok"/>
  <text x="638.0" y="298" class="okt" text-anchor="middle">S1 만료 처리</text>
  <text x="638.0" y="317" class="val" text-anchor="middle">중복 로그인 차단</text>
  <line x1="544" y1="304" x2="555" y2="304" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="358" class="note" text-anchor="start">두 번째 로그인이 다른 인스턴스로 들어오는 경우는 이 확인 방식에서 잘 드러나지 않습니다.</text>
</svg>
