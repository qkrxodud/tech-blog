  <text x="400" y="236" class="bs">우리 기록에 없는 키 <tspan class="m">tx-9</tspan></text>
  <line x1="200" y1="256" x2="200" y2="266" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <polygon points="200,268 360,300 200,332 40,300" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <polygon points="200,268 360,300 200,332 40,300" fill="none" stroke="#d97706" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7032;0.7132;0.7632;0.7732;1"/></polygon>
  <circle cx="40" cy="300" r="11" fill="#111827"/><text x="40" y="304" class="num" text-anchor="middle">3</text>
  <text x="200" y="297" class="t2" text-anchor="middle">기다리는 우리 취소와</text>
  <text x="200" y="314" class="s" text-anchor="middle">같은 금액? <tspan class="m">sameAmountOf</tspan></text>
  <line x1="360" y1="300" x2="384" y2="300" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#agy)"/>
  <rect x="386" y="280" width="186" height="40" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="400" y="296" class="gt">아니오 → 우리 취소 그대로</text>
  <text x="400" y="312" class="gs">실패로 닫는 것은 주기 보정</text>
  <line x1="200" y1="332" x2="200" y2="346" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <rect x="60" y="348" width="280" height="50" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <rect x="60" y="348" width="280" height="50" rx="10" fill="none" stroke="#16a34a" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7482;0.7582;0.8082;0.8182;1"/></rect>
  <circle cx="60" cy="348" r="11" fill="#111827"/><text x="60" y="352" class="num" text-anchor="middle">4</text>
  <use href="#i-doc" x="78" y="358"/>
  <text x="122" y="369" class="t2">우리 취소를 끝난 취소로</text>
  <text x="122" y="386" class="s"><tspan class="m">complete(cancel, tx-9)</tspan></text>
  <line x1="340" y1="373" x2="384" y2="373" stroke="#16a34a" stroke-width="1.5" marker-end="url(#agr)"/>
  <rect x="386" y="353" width="186" height="40" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.2"/>
  <rect x="386" y="353" width="186" height="40" rx="8" fill="none" stroke="#16a34a" stroke-width="3" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7482;0.7582;0.8082;0.8182;1"/></rect>
  <text x="400" y="369" class="oks"><tspan class="m">UNKNOWN</tspan> → <tspan class="m">DONE</tspan></text>
  <text x="400" y="385" class="oks"><tspan class="m">transaction_key</tspan> = <tspan class="m">tx-9</tspan></text>
  <line x1="200" y1="398" x2="200" y2="410" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <polygon points="200,410 360,442 200,474 40,442" fill="#ece8fb" stroke="#9b88d6" stroke-width="1.5"/>
  <polygon points="200,410 360,442 200,474 40,442" fill="none" stroke="#7c3aed" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7908;0.8008;0.8508;0.8608;1"/></polygon>
  <circle cx="40" cy="442" r="11" fill="#111827"/><text x="40" y="446" class="num" text-anchor="middle">5</text>
  <text x="200" y="439" class="t2" text-anchor="middle">짝 안 된 PG 취소가 남았나?</text>
  <text x="200" y="456" class="s" text-anchor="middle">이번에는 없음</text>
  <line x1="360" y1="442" x2="384" y2="442" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#agy)"/>
  <rect x="386" y="422" width="186" height="40" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="400" y="438" class="gt">있으면 PG에서만 일어난</text>
  <text x="400" y="454" class="gs">취소로 들여옴 <tspan class="m">fromGateway</tspan></text>
  <line x1="200" y1="474" x2="200" y2="514" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <rect x="60" y="516" width="280" height="44" rx="10" fill="#e3f3e6" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="60" y="516" width="280" height="44" rx="10" fill="none" stroke="#16a34a" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.85;0.86;0.91;0.92;1"/></rect>
  <use href="#vmark" x="82" y="538"/>
  <text x="100" y="534" class="okt">남은 금액 10000원 = PG 잔액</text>
  <text x="100" y="551" class="oks">취소 기록 1건 · 들여온 줄 없음</text>
  <text x="386" y="532" class="gs">결정 3·4 시점에는 같은 PG 취소를</text>
  <text x="386" y="549" class="gs">한 줄 더 들여오고 우리 취소는 남았음</text>
  <text x="24" y="590" class="gs">짝짓기는 5장 보정과 같은 <tspan class="m">sameAmountOf</tspan> — 보정 대기 시간과 상관없이 결과를 기다리는 모든 우리 취소를 봅니다</text>
  <g class="anim" opacity="0">
    <use href="#pkt"/>
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear"
