<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>같은 예약 번호를 두 트랜잭션이 남길 때 — 이런 겹침이 생길 수 있는 경우이고 계약이 이 순서를 고정하지는 않음. 예약 트랜잭션이 claim(insert ignore)으로 예약 줄을 남기고 재고 줄이기가 트리거로 1초 붙잡힌 동안, 같은 번호의 해제 트랜잭션이 claim을 하면 앞 트랜잭션이 끝날 때까지 기다린 뒤 이미 있는 줄로 보고 findForUpdate로 잠그고 읽어 해제하고 재고를 돌려준다는 것이 코드의 전제임. 일반 INSERT가 중복 키를 만나면 공유 잠금을 건다는 MySQL 8.4 문서는 있지만 insert ignore의 경우는 문서로 확인하지 못했고, 예약을 처리하는 동안 시간 제한이 지나는 계약이 통과한 실행으로만 아는 가정임</title>
