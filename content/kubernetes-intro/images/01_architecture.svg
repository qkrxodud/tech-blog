<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>Master의 API Server가 etcd, Scheduler, Controller, 관리자 요청과 각 Node의 kubelet, proxy를 잇고, etcd와는 API Server만 통신하는 쿠버네티스 아키텍처</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .card { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
    .lbl { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .badl { fill: #fef2f2; stroke: #fca5a5; stroke-width: 1.2; }
    .okl { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.2; }
    .gval { font-size: 12.5px; fill: #15803d; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="abg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="10" y="10" width="740" height="420" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">쿠버네티스 아키텍처 — 구성 요소는 API Server를 거쳐 통신</text>
  <rect x="26" y="60" width="404" height="300" rx="10" class="card"/>
  <text x="42" y="84" class="lane">Master</text>
  <text x="106" y="84" class="sub">상태를 체크하고 실행하는 영역</text>
  <rect x="42" y="104" width="150" height="54" rx="8" class="box"/>
  <text x="117.0" y="128.0" class="lbl" text-anchor="middle">Scheduler</text>
  <text x="117.0" y="146.0" class="val" text-anchor="middle">실행할 노드 선택</text>
  <rect x="42" y="186" width="150" height="54" rx="8" class="hold"/>
  <text x="117.0" y="210.0" class="lbl" text-anchor="middle">etcd</text>
  <text x="117.0" y="228.0" class="val" text-anchor="middle">상태 저장소</text>
  <rect x="42" y="268" width="150" height="54" rx="8" class="box"/>
  <text x="117.0" y="292.0" class="lbl" text-anchor="middle">Controller</text>
  <text x="117.0" y="310.0" class="val" text-anchor="middle">원하는 상태 유지</text>
  <rect x="262" y="186" width="150" height="54" rx="8" class="ok"/>
  <text x="337.0" y="210.0" class="okt" text-anchor="middle">API Server</text>
  <text x="337.0" y="228.0" class="val" text-anchor="middle">교통정리</text>
  <rect x="262" y="104" width="150" height="48" rx="8" class="box"/>
  <text x="337.0" y="133.0" class="lbl" text-anchor="middle">관리자 요청</text>
  <line x1="194" y1="140" x2="260" y2="196" stroke="#9ca3af" stroke-width="1.5" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <line x1="194" y1="213" x2="260" y2="213" stroke="#16a34a" stroke-width="2" marker-start="url(#abg)" marker-end="url(#abg)"/>
  <line x1="194" y1="286" x2="260" y2="230" stroke="#9ca3af" stroke-width="1.5" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <line x1="337" y1="154" x2="337" y2="183" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="337" y="262" class="gnote" text-anchor="middle">etcd와 통신하는 유일한 모듈</text>
  <rect x="470" y="60" width="264" height="146" rx="10" class="card"/>
  <text x="486" y="84" class="lane">Node 1</text>
  <text x="560" y="84" class="sub">컨테이너가 실행되는 영역</text>
  <rect x="486" y="100" width="110" height="40" rx="8" class="box"/>
  <text x="541.0" y="125.0" class="lbl" text-anchor="middle">kubelet</text>
  <rect x="608" y="100" width="110" height="40" rx="8" class="box"/>
  <text x="663.0" y="125.0" class="lbl" text-anchor="middle">proxy</text>
  <rect x="486" y="154" width="110" height="36" rx="8" class="hold"/>
  <text x="541.0" y="177.0" class="lbl" text-anchor="middle">Pod</text>
  <rect x="608" y="154" width="110" height="36" rx="8" class="hold"/>
  <text x="663.0" y="177.0" class="lbl" text-anchor="middle">Pod</text>
  <line x1="414" y1="213" x2="483" y2="120" stroke="#9ca3af" stroke-width="1.5" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <rect x="470" y="214" width="264" height="146" rx="10" class="card"/>
  <text x="486" y="238" class="lane">Node 2</text>
  <text x="560" y="238" class="sub">컨테이너가 실행되는 영역</text>
  <rect x="486" y="254" width="110" height="40" rx="8" class="box"/>
  <text x="541.0" y="279.0" class="lbl" text-anchor="middle">kubelet</text>
  <rect x="608" y="254" width="110" height="40" rx="8" class="box"/>
  <text x="663.0" y="279.0" class="lbl" text-anchor="middle">proxy</text>
  <rect x="486" y="308" width="110" height="36" rx="8" class="hold"/>
  <text x="541.0" y="331.0" class="lbl" text-anchor="middle">Pod</text>
  <rect x="608" y="308" width="110" height="36" rx="8" class="hold"/>
  <text x="663.0" y="331.0" class="lbl" text-anchor="middle">Pod</text>
  <line x1="414" y1="213" x2="483" y2="274" stroke="#9ca3af" stroke-width="1.5" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <text x="30" y="392" class="sub">Scheduler, Controller와 각 노드의 kubelet, proxy는 모두 API Server와 통신하고,</text>
  <text x="30" y="412" class="sub">etcd에 직접 접근하는 것은 API Server뿐입니다.</text>
</svg>
