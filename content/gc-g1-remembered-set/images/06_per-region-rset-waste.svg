  <rect x="452" y="152" width="106" height="76" rx="4" class="free"/>
  <text x="458" y="167" class="rl11">#5 free</text>
  <rect x="232" y="232" width="106" height="76" rx="4" class="free"/>
  <text x="238" y="247" class="rl11">#6 free</text>
  <rect x="342" y="232" width="106" height="76" rx="4" class="old"/>
  <text x="348" y="247" class="rl11">#7 old</text>
  <rect x="452" y="232" width="106" height="76" rx="4" class="old"/>
  <text x="458" y="247" class="rl11">#8 old</text>
  <rect x="232" y="72" width="106" height="76" rx="4" class="cset"/>
  <rect x="342" y="72" width="106" height="76" rx="4" class="cset"/>
  <rect x="452" y="72" width="106" height="76" rx="4" class="cset"/>
  <rect x="232" y="152" width="106" height="76" rx="4" class="cset"/>
  <rect x="273" y="104" width="28" height="24" rx="4" class="ob"/>
  <text x="287" y="121" class="obj" text-anchor="middle">B</text>
  <rect x="307" y="104" width="28" height="24" rx="4" class="ob"/>
  <text x="321" y="121" class="obj" text-anchor="middle">D</text>
  <rect x="357" y="104" width="28" height="24" rx="4" class="ob"/>
  <text x="371" y="121" class="obj" text-anchor="middle">E</text>
  <rect x="407" y="104" width="28" height="24" rx="4" class="ob"/>
  <text x="421" y="121" class="obj" text-anchor="middle">H</text>
  <rect x="471" y="104" width="28" height="24" rx="4" class="ob"/>
  <text x="485" y="121" class="obj" text-anchor="middle">C</text>
  <rect x="513" y="104" width="28" height="24" rx="4" class="ob"/>
  <text x="527" y="121" class="obj" text-anchor="middle">L</text>
  <rect x="271" y="184" width="28" height="24" rx="4" class="ob"/>
  <text x="285" y="201" class="obj" text-anchor="middle">A</text>
  <rect x="349" y="264" width="28" height="24" rx="4" class="ob"/>
  <text x="363" y="281" class="obj" text-anchor="middle">I</text>
  <rect x="381" y="264" width="28" height="24" rx="4" class="ob"/>
  <text x="395" y="281" class="obj" text-anchor="middle">J</text>
  <rect x="413" y="264" width="28" height="24" rx="4" class="ob"/>
  <text x="427" y="281" class="obj" text-anchor="middle">F</text>
  <rect x="471" y="264" width="28" height="24" rx="4" class="ob"/>
  <text x="485" y="281" class="obj" text-anchor="middle">G</text>
  <rect x="513" y="264" width="28" height="24" rx="4" class="ob"/>
  <text x="527" y="281" class="obj" text-anchor="middle">K</text>
  <line x1="335" y1="116" x2="357" y2="116" class="al" marker-end="url(#ar)"/>
  <path d="M 421 104 C 421 56, 287 56, 287 104" class="al" marker-end="url(#ar)"/>
  <line x1="441" y1="276" x2="471" y2="276" class="al" marker-end="url(#ar)"/>
  <text x="600" y="88" class="sub">rset of #0</text>
  <rect x="600" y="96" width="110" height="24" rx="3" class="bad"/>
  <text x="655.0" y="113" class="badt" text-anchor="middle">H</text>
  <rect x="600" y="122" width="110" height="24" rx="3" class="bad"/>
  <text x="655.0" y="139" class="badt" text-anchor="middle">I</text>
  <text x="600" y="198" class="sub">rset of #1</text>
  <rect x="600" y="206" width="110" height="24" rx="3" class="bad"/>
  <text x="655.0" y="223" class="badt" text-anchor="middle">D</text>
  <rect x="600" y="232" width="110" height="24" rx="3" class="hold"/>
  <text x="655.0" y="249" class="obj" text-anchor="middle">F</text>
  <text x="600" y="302" class="sub">young gen rset</text>
  <rect x="600" y="310" width="110" height="24" rx="3" class="bad"/>
  <text x="655.0" y="327" class="badt" text-anchor="middle">I</text>
  <text x="600" y="166" class="note">H: 불필요 · I: 중복</text>
  <text x="600" y="272" class="note">D: 불필요</text>
  <text x="600" y="350" class="note">I: 중복</text>
  <rect x="230" y="363" width="22" height="14" rx="3" class="young"/>
  <text x="260" y="374" class="sub">young region</text>
  <rect x="416" y="363" width="22" height="14" rx="3" class="old"/>
  <text x="446" y="374" class="sub">old region</text>
  <rect x="580" y="363" width="22" height="14" rx="3" class="cset"/>
  <text x="610" y="374" class="sub">collection set</text>
  <line x1="30" y1="390" x2="730" y2="390" class="sep"/>
  <text x="30" y="416" class="val">collection set = young region(#2, #3) + #0, #1</text>
  <text x="30" y="438" class="note">H → B, D → E는 같은 collection set 안의 참조 — remembered set에 H와 D를 가질 필요가 없음</text>
  <text x="30" y="460" class="note">같은 collection set인데 I가 rset of #0과 young gen rset에 중복으로 들어 있음</text>
  <text x="30" y="486" class="sub">각 region의 remembered set이 만들어지는 시기는 mixed GC 시작 후가 아님</text>
</svg>
