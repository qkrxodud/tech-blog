  <text x="470" y="428" class="okt" text-anchor="middle" style="font-size:14px">14</text>
  <text x="24" y="428" class="s" style="font-size:11.5px">2 × 6 = 12건 · 4 + 2 + 2 + 2 + 2 + 2 = 14건</text>
