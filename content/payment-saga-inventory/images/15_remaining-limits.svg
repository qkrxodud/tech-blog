  <rect width="760" height="470" fill="#ffffff"/>
  <text x="24" y="28" class="h">10장 구조로 남은 한계 — 어디에 남았는가</text>
  <rect x="14" y="46" width="362" height="112" rx="12" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <text x="28" y="70" class="ot">결정의 비용으로 남김</text>
  <text x="28" y="92" class="s2" style="font-size:11px;fill:#1f2937">· 재고 서비스가 느리면 결제도 읽기 1s만큼 느려짐</text>
  <text x="36" y="110" class="s2" style="font-size:11px;fill:#1f2937">늦음 응답 중앙 1027~1038ms</text>
  <text x="28" y="128" class="s2" style="font-size:11px;fill:#1f2937">· 재고 서비스가 멈추면 결제를 받지 못함</text>
  <text x="28" y="146" class="s2" style="font-size:11px;fill:#1f2937">· 답만 늦고 실제로 잡았어도 승인 없이 실패(결정 4)</text>
  <rect x="386" y="46" width="362" height="112" rx="12" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="400" y="70" class="bt">11장으로 넘김</text>
  <text x="400" y="92" class="s2" style="font-size:11px;fill:#1f2937">· 받는 쪽의 일반적인 중복 가리기·재시도·실패 모음</text>
  <text x="400" y="110" class="s2" style="font-size:11px;fill:#1f2937">· 재고 서비스는 같은 확정·해제를 예약 상태 전이로만</text>
  <text x="408" y="128" class="s2" style="font-size:11px;fill:#1f2937">한 번 반영</text>
  <text x="400" y="146" class="s2" style="font-size:11px;fill:#1f2937">· 처리에 실패한 명령은 Spring Kafka 기본 처리 그대로</text>
  <rect x="14" y="170" width="362" height="112" rx="12" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="28" y="194" class="t2">이 장에서 다루지 않음</text>
  <text x="28" y="216" class="s2" style="font-size:11px;fill:#1f2937">· 쿠폰·포인트는 결제 서버에 그대로 — 나눈 것은 재고뿐</text>
  <text x="28" y="234" class="s2" style="font-size:11px;fill:#1f2937">· 8장 되돌리기 비교의 포인트 계약은 그대로 실패</text>
  <text x="28" y="252" class="s2" style="font-size:11px;fill:#1f2937">· 예약 만료(TTL) 없음 — 보정·알림이 닫을 때까지 남음</text>
  <text x="28" y="270" class="s2" style="font-size:11px;fill:#1f2937">· 결제 서버가 예약 직전·직후에 죽는 경우는 실행 안 함</text>
  <rect x="386" y="170" width="362" height="112" rx="12" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <text x="400" y="194" class="yt">지우지 않고 쌓임</text>
  <text x="400" y="216" class="s2" style="font-size:11px;fill:#1f2937">· 빈 해제 줄</text>
  <text x="400" y="234" class="s2" style="font-size:11px;fill:#1f2937">· 보낸 <tspan class="m">payment_outbox</tspan> 줄 — 결제 결과에 재고 명령까지</text>
  <text x="400" y="252" class="s2" style="font-size:11px;fill:#1f2937">· 결제마다 예약 줄</text>
  <rect x="14" y="294" width="734" height="164" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="28" y="318" class="gt">실행이나 문서로 확인하지 못한 것</text>
  <text x="28" y="342" class="s2" style="font-size:11px;fill:#374151">· 결정 2는 계약과 측정으로 갈리지 않음 — 코레오그래피도 계약 21개를 모두 통과, 오케스트레이션을 고른 실행 근거는 이 장에 없음</text>
  <text x="28" y="361" class="s2" style="font-size:11px;fill:#374151">· 시간 제한 근거(예약 응답 p99, 연결 시간)는 같은 머신의 루프백에서 잰 값 — 운영 망에서도 맞다는 것은 가정</text>
  <text x="28" y="380" class="s2" style="font-size:11px;fill:#374151">· <tspan class="m">insert ignore</tspan>가 같은 번호를 남기는 중인 트랜잭션을 기다린다는 것은 MySQL 문서로 확인하지 못함</text>
  <text x="28" y="399" class="s2" style="font-size:11px;fill:#374151">· 몰림 계약(서버 두 대·300건)은 겹침을 고정하지 않아 비교 구현에서 실행마다 결과가 흔들림</text>
  <text x="28" y="418" class="s2" style="font-size:11px;fill:#374151">· 완전 비동기(202)는 API 약속이 바뀌어 비교로 돌리지 않음</text>
  <text x="28" y="437" class="s2" style="font-size:11px;fill:#374151">· 재고 서비스 모듈에는 커버리지 검사를 걸지 않음(주문 서비스·mock-pg와 같음)</text>
</svg>
