<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>format(): 스레드 A가 공유 calendar에 2026-01-01을 넣은 뒤 스레드 B가 1999-12-31로 덮어써, A가 1999를 읽고 틀린 문자열을 예외 없이 반환하는 순서</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .tag { font-size: 12px; font-weight: 700; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="350" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="330" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">format() — 공유 calendar를 B가 덮어씀</text>
  <text x="730" y="42" class="code" text-anchor="end">calendar.setTime(date)</text>
  <text x="220" y="68" class="step" text-anchor="middle">t1</text>
  <text x="360" y="68" class="step" text-anchor="middle">t2</text>
  <text x="500" y="68" class="step" text-anchor="middle">t3</text>
  <text x="640" y="68" class="step" text-anchor="middle">t4</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">스레드 A</text>
  <text x="30" y="126" class="sub">2026-01-01 포맷</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="108" class="op" text-anchor="middle">setTime</text>
  <text x="220" y="127" class="val" text-anchor="middle">2026-01-01</text>
  <rect x="442" y="88" width="116" height="48" rx="8" class="bad"/>
  <text x="500" y="108" class="badc" text-anchor="middle">get(YEAR)</text>
  <text x="500" y="127" class="val" text-anchor="middle">1999 읽음</text>
  <rect x="582" y="88" width="116" height="48" rx="8" class="bad"/>
  <text x="640" y="108" class="badt" text-anchor="middle">틀린 문자열</text>
  <text x="640" y="127" class="val" text-anchor="middle">예외 없이 반환</text>
  <text x="30" y="168" class="lane">스레드 B</text>
  <text x="30" y="186" class="sub">1999-12-31 포맷</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="302" y="148" width="116" height="48" rx="8" class="box"/>
  <text x="360" y="168" class="op" text-anchor="middle">setTime</text>
  <text x="360" y="187" class="val" text-anchor="middle">1999-12-31</text>
  <text x="30" y="229" class="db">공유 calendar</text>
  <rect x="165" y="208" width="110" height="32" rx="6" class="dbbox"/>
  <text x="220" y="229" class="db" text-anchor="middle">2026-01-01</text>
  <rect x="305" y="208" width="110" height="32" rx="6" class="bad"/>
  <text x="360" y="229" class="badt" text-anchor="middle">1999-12-31</text>
  <rect x="445" y="208" width="110" height="32" rx="6" class="bad"/>
  <text x="500" y="229" class="badt" text-anchor="middle">1999-12-31</text>
  <rect x="585" y="208" width="110" height="32" rx="6" class="bad"/>
  <text x="640" y="229" class="badt" text-anchor="middle">1999-12-31</text>
  <line x1="360" y1="196" x2="360" y2="206" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="500" y1="207" x2="500" y2="139" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="30" y="262" width="700" height="30" rx="15" class="bad"/>
  <text x="380" y="282" class="badt" text-anchor="middle">A가 넣은 날짜가 아니라 B가 넣은 날짜로 문자열을 만듦 — 예외 없는 값 오염</text>
  <text x="30" y="318" class="sub">format()은 calendar에 쓰고(①) 다시 읽는(②) 두 단계라, 그 사이에 다른 스레드가 끼어들면 값이 바뀝니다.</text>

</svg>
