<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>2장 출발 코드에서 돌린 테스트 13개 중 6개 실패 — 계약 테스트 4개 중 대기 중 조회·시간 제한·거절 3개, 실제 HTTP로 부르는 API 테스트 8개 중 거절(200 대신 422)·응답 없음(504 대신 200) 2개, API로 한 번 더 둔 승인 대기 중 조회 1개(200 대신 500)가 실패. 3 + 2 + 1 = 6, 4 + 8 + 1 = 13. 원인은 셋: 거절을 예외로 알려 롤백으로 인증·거절 기록이 사라져 READY로 남고 API는 처리기가 그 예외를 422로 바꿔 답함, PG 답을 기다리는 동안 DB 연결이 바닥나 조회가 실패, 읽기 시간 제한이 없고 시간 제한 설정도 읽지 않아 느린 PG를 끝까지 기다림. 계약 테스트는 연결 2개, 연결 대기 250ms, 읽기 시간 제한 설정 1초(출발 코드는 읽지 않음)</title>
