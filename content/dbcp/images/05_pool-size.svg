<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 402" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>minimumIdle이 maximumPoolSize보다 작으면 요청이 몰릴 때 새 연결을 맺느라 요청이 대기하고, 두 값을 4로 같게 두면 미리 연결된 커넥션 4개를 바로 빌리는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .pool { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .life { stroke: #c4c8ce; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="402" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="170" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">minimumIdle 2, maximumPoolSize 4 — 몰리면 새로 연결한다</text>
  <text x="304" y="68" class="step" text-anchor="middle">평소</text>
  <text x="600" y="68" class="step" text-anchor="middle">요청이 몰릴 때</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="110" class="lane">커넥션 풀</text>
  <text x="30" y="128" class="sub">최대 4개</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="170" y="88" width="64" height="48" rx="8" class="ok"/>
  <text x="202" y="117" class="okt" text-anchor="middle">유휴</text>
  <rect x="238" y="88" width="64" height="48" rx="8" class="ok"/>
  <text x="270" y="117" class="okt" text-anchor="middle">유휴</text>
  <rect x="306" y="88" width="64" height="48" rx="8" class="wait"/>
  <text x="338" y="117" class="waitt" text-anchor="middle">빈 자리</text>
  <rect x="374" y="88" width="64" height="48" rx="8" class="wait"/>
  <text x="406" y="117" class="waitt" text-anchor="middle">빈 자리</text>
  <rect x="462" y="88" width="64" height="48" rx="8" class="hold"/>
  <text x="494" y="117" class="t" text-anchor="middle">사용 중</text>
  <rect x="530" y="88" width="64" height="48" rx="8" class="hold"/>
  <text x="562" y="117" class="t" text-anchor="middle">사용 중</text>
  <rect x="598" y="88" width="64" height="48" rx="8" class="bad"/>
  <text x="630" y="117" class="badt" text-anchor="middle">연결 중</text>
  <rect x="666" y="88" width="64" height="48" rx="8" class="bad"/>
  <text x="698" y="117" class="badt" text-anchor="middle">연결 중</text>
  <text x="600" y="162" class="note" text-anchor="middle">새 연결을 맺는 동안 요청이 대기합니다</text>
  <text x="304" y="162" class="s" text-anchor="middle">유휴 2개만 유지</text>
  <rect x="10" y="196" width="740" height="196" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="228" class="h">minimumIdle = maximumPoolSize = 4 — 처음부터 4개를 유지한다</text>
  <text x="304" y="254" class="step" text-anchor="middle">평소</text>
  <text x="600" y="254" class="step" text-anchor="middle">요청이 몰릴 때</text>
  <line x1="160" y1="262" x2="722" y2="262" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="296" class="lane">커넥션 풀</text>
  <text x="30" y="314" class="sub">최대 4개</text>
  <rect x="150" y="272" width="585" height="52" rx="6" class="track"/>
  <rect x="170" y="274" width="64" height="48" rx="8" class="ok"/>
  <text x="202" y="303" class="okt" text-anchor="middle">유휴</text>
  <rect x="238" y="274" width="64" height="48" rx="8" class="ok"/>
  <text x="270" y="303" class="okt" text-anchor="middle">유휴</text>
  <rect x="306" y="274" width="64" height="48" rx="8" class="ok"/>
  <text x="338" y="303" class="okt" text-anchor="middle">유휴</text>
  <rect x="374" y="274" width="64" height="48" rx="8" class="ok"/>
  <text x="406" y="303" class="okt" text-anchor="middle">유휴</text>
  <rect x="462" y="274" width="64" height="48" rx="8" class="hold"/>
  <text x="494" y="303" class="t" text-anchor="middle">사용 중</text>
  <rect x="530" y="274" width="64" height="48" rx="8" class="hold"/>
  <text x="562" y="303" class="t" text-anchor="middle">사용 중</text>
  <rect x="598" y="274" width="64" height="48" rx="8" class="hold"/>
  <text x="630" y="303" class="t" text-anchor="middle">사용 중</text>
  <rect x="666" y="274" width="64" height="48" rx="8" class="hold"/>
  <text x="698" y="303" class="t" text-anchor="middle">사용 중</text>
  <text x="600" y="348" class="gnote" text-anchor="middle">미리 연결된 커넥션을 바로 빌립니다</text>
  <text x="304" y="348" class="s" text-anchor="middle">유휴 4개 유지</text>
  <text x="30" y="376" class="foot">두 경우 모두 maximumPoolSize(4)에 도달하면 더 이상 연결을 만들지 않고 대기합니다.</text>
</svg>
