  <rect width="760" height="372" fill="#ffffff"/>
  <text x="24" y="28" class="h">결정 5 — 보내기와 보낸 기록 가운데 무엇을 먼저 할까</text>
  <text x="24" y="48" class="gs" style="font-size:11.5px">같은 입력: 릴레이가 승인 결과를 처리하던 중 두 걸음 사이에서 한 번 죽고, 다시 한 주기를 돎</text>
  <rect x="14" y="62" width="140" height="104" rx="10" fill="#f9fafb" stroke="#16a34a" stroke-width="3"/><text x="28" y="94" class="t2">보내고, 답이 오면</text><text x="28" y="114" class="t2" style="font-size:12px">남김</text><text x="28" y="140" class="okt" style="font-size:11.5px">적어도 한 번 · 고름</text><rect x="166" y="72" width="116" height="58" rx="8" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/><text x="224" y="97" class="s2" text-anchor="middle" style="font-size:11px;fill:#9a3412"><tspan class="m">send</tspan> — 답이 옴</text><text x="224" y="113" class="s2" text-anchor="middle" style="font-size:11px;fill:#9a3412">브로커에 남음</text><circle cx="166" cy="72" r="10" fill="#111827"/><text x="166" y="76" class="num" text-anchor="middle" style="font-size:11px">1</text><use href="#i-bolt" transform="translate(290,76) scale(1)"/><text x="302" y="124" class="bads" text-anchor="middle" style="font-size:11px;font-weight:700">죽음</text><rect x="324" y="72" width="124" height="58" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/><text x="386" y="97" class="s2" text-anchor="middle" style="font-size:11px;fill:#1f2937"><tspan class="m">markSent</tspan> 전</text><text x="386" y="113" class="s2" text-anchor="middle" style="font-size:11px;fill:#1f2937"><tspan class="m">sent_at</tspan> 비어 있음</text><line x1="450" y1="101" x2="462" y2="101" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/><rect x="464" y="72" width="120" height="58" rx="8" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/><text x="524" y="97" class="s2" text-anchor="middle" style="font-size:11px;fill:#9a3412">다음 주기</text><text x="524" y="113" class="s2" text-anchor="middle" style="font-size:11px;fill:#9a3412">다시 <tspan class="m">send</tspan></text><circle cx="464" cy="72" r="10" fill="#111827"/><text x="464" y="76" class="num" text-anchor="middle" style="font-size:11px">2</text><line x1="586" y1="101" x2="598" y2="101" stroke="#16a34a" stroke-width="1.3" marker-end="url(#agr)"/><rect x="600" y="62" width="146" height="104" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/><use href="#vs" x="616" y="86"/><text x="629" y="90" class="oks" style="font-size:11.5px;font-weight:700">도착 · 유실 0</text><text x="614" y="112" class="oks" style="font-size:11px">같은 고유 번호로</text><text x="614" y="134" class="oks" style="font-size:11px">두 번 도착(중복 1)</text><text x="166" y="154" class="gs" style="font-size:10.5px"><tspan class="m">payment_outbox</tspan> UPDATE를 트리거로 막아 두 걸음 사이에서 죽게 함</text>
  <rect x="14" y="186" width="140" height="104" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/><text x="28" y="218" class="t2">보낸 것으로</text><text x="28" y="238" class="t2" style="font-size:12px">먼저 남기고 보냄</text><text x="28" y="264" class="s2" style="font-size:11.5px">최대 한 번 · 비교</text><rect x="166" y="196" width="116" height="58" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/><text x="224" y="221" class="s2" text-anchor="middle" style="font-size:11px;fill:#1f2937"><tspan class="m">markSent</tspan> 먼저</text><text x="224" y="237" class="s2" text-anchor="middle" style="font-size:11px;fill:#1f2937">보낸 것으로 남김</text><circle cx="166" cy="196" r="10" fill="#111827"/><text x="166" y="200" class="num" text-anchor="middle" style="font-size:11px">1</text><use href="#i-bolt" transform="translate(290,200) scale(1)"/><text x="302" y="248" class="bads" text-anchor="middle" style="font-size:11px;font-weight:700">죽음</text><rect x="324" y="196" width="124" height="58" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/><text x="386" y="221" class="s2" text-anchor="middle" style="font-size:11px;fill:#b91c1c">보내지 않았는데</text><text x="386" y="237" class="s2" text-anchor="middle" style="font-size:11px;fill:#b91c1c">보낸 것으로 남음</text><line x1="450" y1="225" x2="462" y2="225" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/><rect x="464" y="196" width="120" height="58" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/><text x="524" y="221" class="s2" text-anchor="middle" style="font-size:11px;fill:#6b7280">다음 주기</text><text x="524" y="237" class="s2" text-anchor="middle" style="font-size:11px;fill:#6b7280">다시 보내지 않음</text><circle cx="464" cy="196" r="10" fill="#111827"/><text x="464" y="200" class="num" text-anchor="middle" style="font-size:11px">2</text><line x1="586" y1="225" x2="598" y2="225" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr)"/><rect x="600" y="186" width="146" height="104" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/><use href="#xs" x="616" y="210"/><text x="629" y="214" class="bads" style="font-size:11.5px;font-weight:700">15초 안 도착 0</text><text x="614" y="236" class="bads" style="font-size:11px">그 승인을 잃음</text><text x="614" y="258" class="bads" style="font-size:11px">8개 중 3개 실패</text><text x="166" y="278" class="gs" style="font-size:10.5px">남긴 뒤 보내려던 자리에서 죽게 함(<tspan class="m">SendFaults</tspan>)</text>
  <line x1="12" y1="306" x2="748" y2="306" stroke="#9ca3af" stroke-width="1"/>
  <text x="24" y="328" class="ys" style="font-size:11.5px;font-weight:700">중복은 받는 쪽이 고유 번호(남긴 결과의 번호)로 가려야 함 — 이 장의 주문 서비스는 그대로 남겨 셀 수만 있고, 가리기는 11장</text>
  <text x="24" y="350" class="gs" style="font-size:11.5px">먼저 남기면 보내지 못한 승인도 보낸 것으로 남아, 결정 4의 ‘다음 주기에 만든 순서대로 도착’ 계약도 실패함</text>
</svg>
