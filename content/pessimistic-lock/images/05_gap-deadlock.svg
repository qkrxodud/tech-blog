<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>트랜잭션 A와 B가 같은 갭 (3, 6)에 각각 갭 락을 설정한 뒤 그 갭에 INSERT를 시도해 서로의 갭 락 때문에 대기하는 데드락이 생기고, InnoDB가 이를 감지해 하나를 롤백하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .valc { font-size: 12.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .dbc { font-size: 14px; font-weight: 700; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .mark { stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="310" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="290" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">갭 락으로 인한 데드락 — 같은 갭에 서로 삽입</text>
  <text x="730" y="42" class="code" text-anchor="end">users id: 1, 3, 6</text>
  <text x="220" y="68" class="step" text-anchor="middle">1</text>
  <text x="360" y="68" class="step" text-anchor="middle">2</text>
  <text x="500" y="68" class="step" text-anchor="middle">3</text>
  <text x="640" y="68" class="step" text-anchor="middle">4</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">트랜잭션 A</text>
  <text x="30" y="126" class="sub">id = 4 조회</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="156" y="88" width="128" height="48" rx="8" class="hold"/>
  <text x="220" y="108" class="op" text-anchor="middle">FOR UPDATE</text>
  <text x="220" y="127" class="val" text-anchor="middle">갭 (3, 6) 잠금</text>
  <rect x="436" y="88" width="128" height="48" rx="8" class="bad"/>
  <text x="500" y="108" class="badc" text-anchor="middle">INSERT id=4</text>
  <text x="500" y="127" class="val" text-anchor="middle">B의 갭 락 → 대기</text>
  <rect x="570" y="96" width="152" height="32" rx="6" class="wait"/>
  <text x="646.0" y="117" class="waitt" text-anchor="middle">계속 대기</text>
  <text x="30" y="168" class="lane">트랜잭션 B</text>
  <text x="30" y="186" class="sub">id = 5 조회</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="296" y="148" width="128" height="48" rx="8" class="hold"/>
  <text x="360" y="168" class="op" text-anchor="middle">FOR UPDATE</text>
  <text x="360" y="187" class="val" text-anchor="middle">같은 갭도 획득</text>
  <rect x="576" y="148" width="128" height="48" rx="8" class="bad"/>
  <text x="640" y="168" class="badc" text-anchor="middle">INSERT id=5</text>
  <text x="640" y="187" class="val" text-anchor="middle">A의 갭 락 → 대기</text>
  <rect x="150" y="212" width="585" height="32" rx="15" class="bad"/>
  <text x="442.5" y="233" class="badt" text-anchor="middle">데드락 — A와 B의 INSERT가 서로의 갭 락을 기다림</text>
  <rect x="150" y="254" width="585" height="32" rx="15" class="ok"/>
  <text x="442.5" y="275" class="okt" text-anchor="middle">InnoDB가 데드락을 감지해 하나를 롤백 (ERROR 1213)</text>
</svg>
