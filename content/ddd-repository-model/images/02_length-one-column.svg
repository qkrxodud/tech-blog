  <rect width="760" height="250" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="230" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">밸류를 칼럼 하나에 — 프로퍼티 두 개, 칼럼 한 개</text>
  <text x="730" y="42" class="code" text-anchor="end">Length</text>
  <rect x="40" y="70" width="260" height="110" rx="8" class="box"/>
  <text x="60" y="100" class="attr">public class Length {</text>
  <text x="84" y="122" class="attr">private int value;</text>
  <text x="84" y="144" class="attr">private String unit;</text>
  <text x="60" y="166" class="attr">}</text>
  <text x="170" y="202" class="sub" text-anchor="middle">프로퍼티 2개</text>
  <line x1="312" y1="125" x2="490" y2="125" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="401" y="113" class="code" text-anchor="middle">AttributeConverter</text>
  <text x="401" y="146" class="note" text-anchor="middle">@Embeddable로는 처리할 수 없음</text>
  <rect x="500" y="100" width="220" height="50" rx="8" class="dbbox"/>
  <text x="610" y="131" class="attr" text-anchor="middle">WIDTH VARCHAR(20)</text>
  <text x="610" y="202" class="sub" text-anchor="middle">칼럼 1개</text>
