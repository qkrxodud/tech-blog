<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>이동 기준값 4를 사이에 둔 경계값 테스트: 0~3은 false로 멈추고 4~9는 true로 전진하므로 결과가 바뀌는 3과 4가 경계값이다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .cv { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #4b5563; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
    <rect width="760" height="310" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="290" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">isMove(값) — 기준값 4를 사이에 둔 경계</text>
  <text x="730" y="42" class="code" text-anchor="end">STARTING_CONDITION = 4</text>
  <text x="320" y="76" class="t" text-anchor="middle">경계값 3 · 4</text>
  <rect x="80" y="86" width="60" height="50" rx="4" class="hold"/>
  <text x="110" y="117" class="op" text-anchor="middle">0</text>
  <rect x="140" y="86" width="60" height="50" rx="4" class="hold"/>
  <text x="170" y="117" class="op" text-anchor="middle">1</text>
  <rect x="200" y="86" width="60" height="50" rx="4" class="hold"/>
  <text x="230" y="117" class="op" text-anchor="middle">2</text>
  <rect x="260" y="86" width="60" height="50" rx="4" class="hold" stroke-width="2.6"/>
  <text x="290" y="117" class="op" text-anchor="middle">3</text>
  <rect x="320" y="86" width="60" height="50" rx="4" class="ok" stroke-width="2.6"/>
  <text x="350" y="117" class="okc" text-anchor="middle">4</text>
  <rect x="380" y="86" width="60" height="50" rx="4" class="ok"/>
  <text x="410" y="117" class="okc" text-anchor="middle">5</text>
  <rect x="440" y="86" width="60" height="50" rx="4" class="ok"/>
  <text x="470" y="117" class="okc" text-anchor="middle">6</text>
  <rect x="500" y="86" width="60" height="50" rx="4" class="ok"/>
  <text x="530" y="117" class="okc" text-anchor="middle">7</text>
  <rect x="560" y="86" width="60" height="50" rx="4" class="ok"/>
  <text x="590" y="117" class="okc" text-anchor="middle">8</text>
  <rect x="620" y="86" width="60" height="50" rx="4" class="ok"/>
  <text x="650" y="117" class="okc" text-anchor="middle">9</text>
  <line x1="84" y1="150" x2="316" y2="150" class="axis"/>
  <line x1="324" y1="150" x2="676" y2="150" stroke="#16a34a" stroke-width="1.2"/>
  <text x="200" y="172" class="t" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">false</tspan> — 멈춤</text>
  <text x="500" y="172" class="okt" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">true</tspan> — 전진</text>
  <rect x="80" y="194" width="290" height="56" rx="8" class="hold"/>
  <text x="225" y="217" class="t" text-anchor="middle">자동차이동테스트_멈춤</text>
  <text x="225" y="237" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">i</tspan>가 <tspan font-family="Menlo, Consolas, monospace">0~3</tspan>일 때 <tspan font-family="Menlo, Consolas, monospace">false</tspan> 확인</text>
  <rect x="390" y="194" width="290" height="56" rx="8" class="ok"/>
  <text x="535" y="217" class="okt" text-anchor="middle">자동차테스트_이동</text>
  <text x="535" y="237" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">i</tspan>가 <tspan font-family="Menlo, Consolas, monospace">4~9</tspan>일 때 <tspan font-family="Menlo, Consolas, monospace">true</tspan> 확인</text>
  <text x="80" y="280" class="sub">테스트를 둘로 나누어 결과가 바뀌는 3과 4를 모두 검증합니다.</text>
</svg>
