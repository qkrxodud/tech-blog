  <text x="348" y="274" class="s" style="fill:#1f2937;font-weight:700;font-size:12.5px"><tspan class="m">DataIntegrityViolationException</tspan></text>
  <text x="348" y="291" class="s2">이 트랜잭션은 되돌리기로 표시됨</text>
  <rect x="296" y="310" width="448" height="46" rx="9" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.3"/>
  <circle cx="296" cy="310" r="11" fill="#111827"/><text x="296" y="314" class="num" text-anchor="middle" style="font-size:12px">7</text>
  <use href="#i-db" x="308" y="319"/>
  <text x="348" y="330" class="s" style="fill:#1f2937;font-weight:700;font-size:12.5px">서비스가 잡음 → <tspan class="m">prepareAgain</tspan></text>
  <text x="348" y="347" class="s2">트랜잭션 없는 서비스, readOnly 새 트랜잭션에서 A의 결제를 읽음</text>
  <line x1="278" y1="277" x2="294" y2="277" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#agr)"/>
  <circle cx="296" cy="368" r="11" fill="#111827"/><text x="296" y="372" class="num" text-anchor="middle" style="font-size:12px">8</text>
  <rect x="296" y="368" width="216" height="50" rx="9" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.3"/>
  <use href="#vmark" x="318" y="393"/>
  <text x="336" y="389" class="okt">같은 금액 → <tspan class="m">201</tspan></text>
  <text x="336" y="407" class="oks">먼저 남은 결제로 답함</text>
  <rect x="528" y="368" width="216" height="50" rx="9" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.3"/>
  <use href="#vmark" x="550" y="393"/>
  <text x="568" y="389" class="okt">다른 금액 → <tspan class="m">409</tspan></text>
  <text x="568" y="407" class="oks"><tspan class="m">DUPLICATE_ORDER</tspan></text>
  <text x="24" y="388" class="s2"><tspan class="m">verifyPreparedAmount</tspan>(3장 규칙)</text>
  <text x="24" y="406" class="s2">다시 읽어도 없으면 원래 예외를 알림</text>
  <line x1="16" y1="428" x2="744" y2="428" stroke="#e5e7eb" stroke-width="1"/>
  <text x="20" y="446" class="lbl" style="font-weight:700;fill:#374151">같은 겹침에 다른 두 방식</text>
  <rect x="16" y="456" width="362" height="58" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.3"/>
  <use href="#xmark" x="36" y="485"/>
  <text x="54" y="480" class="badt">잡지 않음(6장까지)</text>
  <text x="54" y="500" class="bads">B는 같은 금액이든 다른 금액이든 <tspan class="m">500</tspan> · 실패 2개</text>
  <rect x="390" y="456" width="354" height="58" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.3"/>
  <use href="#vmark" x="410" y="485"/>
  <text x="428" y="480" class="okt">MySQL 이름 잠금 <tspan class="m">GET_LOCK</tspan></text>
  <text x="428" y="500" class="oks">주문번호마다 차례로, 준비 한 건에 연결 둘 · 실패 0개</text>
  <use href="#i-lock" transform="translate(18,520) scale(0.7)"/>
  <text x="42" y="536" class="gs">아직 없는 줄은 잠글 수 없어서 결정 1의 결제 줄 잠금으로는 이 겹침을 막지 못함</text>
</svg>
