<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>호출하는 쪽이 join을 호출하면 TimeTraceAop의 execute가 먼저 시작 시각을 기록하고, joinPoint.proceed로 MemberService의 join을 실행한 뒤, finally에서 걸린 시간을 계산해 END 로그를 출력하고 결과를 돌려주는 순서</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .op { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mg { font-size: 12px; fill: #9ca3af; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 12px; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 12px; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="370" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="350" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">@Around 실행 순서 — <tspan font-family="Menlo, Consolas, monospace">join()</tspan> 호출을 <tspan font-family="Menlo, Consolas, monospace">execute()</tspan>가 감싼다</text>
  <text x="210" y="68" class="step" text-anchor="middle">1단계</text>
  <text x="326" y="68" class="step" text-anchor="middle">2단계</text>
  <text x="442" y="68" class="step" text-anchor="middle">3단계</text>
  <text x="558" y="68" class="step" text-anchor="middle">4단계</text>
  <text x="674" y="68" class="step" text-anchor="middle">5단계</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane" style="font-size:13.5px">호출하는 쪽</text>
  <text x="30" y="126" class="sub"><tspan font-family="Menlo, Consolas, monospace">join()</tspan> 호출</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <text x="30" y="178" class="lane" style="font-size:13.5px">TimeTraceAop</text>
  <text x="30" y="196" class="sub"><tspan font-family="Menlo, Consolas, monospace">execute()</tspan></text>
  <rect x="150" y="156" width="585" height="52" rx="6" class="track"/>
  <text x="30" y="248" class="lane" style="font-size:13.5px">MemberService</text>
  <text x="30" y="266" class="sub"><tspan font-family="Menlo, Consolas, monospace">join()</tspan></text>
  <rect x="150" y="226" width="585" height="52" rx="6" class="track"/>
  <rect x="158" y="88" width="104" height="48" rx="8" class="box"/>
  <text x="210" y="108" class="op" text-anchor="middle">join()</text>
  <text x="210" y="127" class="val" text-anchor="middle">메서드 호출</text>
  <rect x="274" y="158" width="104" height="48" rx="8" class="hold"/>
  <text x="326" y="178" class="op" text-anchor="middle">start</text>
  <text x="326" y="197" class="val" text-anchor="middle">시작 시각 기록</text>
  <rect x="390" y="158" width="104" height="48" rx="8" class="hold"/>
  <text x="442" y="178" class="op" text-anchor="middle">proceed()</text>
  <text x="442" y="197" class="val" text-anchor="middle">대상 메서드 실행</text>
  <rect x="506" y="228" width="104" height="48" rx="8" class="ok"/>
  <text x="558" y="248" class="okc" text-anchor="middle">join()</text>
  <text x="558" y="267" class="val" text-anchor="middle">회원가입 로직</text>
  <rect x="622" y="158" width="104" height="48" rx="8" class="ok"/>
  <text x="674" y="178" class="okc" text-anchor="middle">finally</text>
  <text x="674" y="197" class="val" text-anchor="middle">걸린 시간 출력</text>
  <rect x="622" y="88" width="104" height="48" rx="8" class="box"/>
  <text x="674" y="108" class="op" text-anchor="middle">return</text>
  <text x="674" y="127" class="val" text-anchor="middle">결과를 받음</text>
  <line x1="230" y1="137" x2="306" y2="157" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="379" y1="182" x2="389" y2="182" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="462" y1="207" x2="538" y2="227" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="578" y1="227" x2="654" y2="207" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="674" y1="157" x2="674" y2="137" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="312" class="foot">2단계에서 <tspan font-family="Menlo, Consolas, monospace">System.out.println(start)</tspan>로 시작 시각을 출력하고, 5단계의 finally에서</text>
  <text x="30" y="334" class="foot"><tspan font-family="Menlo, Consolas, monospace">&quot;END : &quot; + joinPoint.toLongString() + &quot;&quot; + timeMs + &quot;ms&quot;</tspan>를 출력한 뒤 결과를 돌려줍니다.</text>
</svg>
