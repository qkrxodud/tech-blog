<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>JVM Heap에서 write()로 OS Page Cache, fsync()로 Disk까지 내려가는 3단계 저장 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 14px; font-weight: 600; fill: #1f2937; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opn { font-size: 13px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .lbl { font-size: 12.5px; font-weight: 700; fill: #6b7280; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="320" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="300" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">3단계 색인 구조 — write()와 fsync()</text>
  <text x="730" y="42" class="code" text-anchor="end">write() → fsync()</text>
  <rect x="30" y="72" width="180" height="76" rx="8" class="box"/>
  <text x="120" y="105" class="lane" text-anchor="middle">JVM Heap</text>
  <text x="120" y="124" class="sub" text-anchor="middle">ES 프로세스가 직접 쓰는 메모리</text>
  <rect x="290" y="72" width="180" height="76" rx="8" class="box"/>
  <text x="380" y="105" class="lane" text-anchor="middle">OS Page Cache</text>
  <text x="380" y="124" class="sub" text-anchor="middle">커널이 관리하는 메모리</text>
  <rect x="550" y="72" width="180" height="76" rx="8" class="box"/>
  <text x="640" y="105" class="lane" text-anchor="middle">Disk</text>
  <text x="640" y="124" class="sub" text-anchor="middle">전원이 나가도 남는 영역</text>
  <line x1="212" y1="110" x2="286" y2="110" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="249" y="100" class="op" text-anchor="middle">write()</text>
  <text x="249" y="130" class="sub" text-anchor="middle">시스템 콜</text>
  <line x1="472" y1="110" x2="546" y2="110" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="509" y="100" class="op" text-anchor="middle">fsync()</text>
  <text x="509" y="130" class="sub" text-anchor="middle">시스템 콜</text>
  <rect x="30" y="166" width="440" height="34" rx="15" class="bad"/>
  <text x="250" y="188" class="badt" text-anchor="middle">메모리 — 전원이 나가면 사라짐</text>
  <rect x="550" y="166" width="180" height="34" rx="15" class="ok"/>
  <text x="640" y="188" class="okt" text-anchor="middle">디스크 — 영속</text>
  <rect x="290" y="216" width="440" height="56" rx="8" class="hold"/>
  <text x="306" y="239" class="val">Page Cache에 세그먼트가 올라가 있으면</text>
  <text x="306" y="259" class="val">검색할 때 디스크 I/O 없이 메모리에서 읽습니다 (LRU로 관리)</text>
  <text x="30" y="239" class="sub">write()만 호출한 데이터는</text>
  <text x="30" y="257" class="sub">아직 디스크에 없습니다.</text>
  <text x="30" y="294" class="note">확실히 디스크에 내리려면 fsync()를 명시적으로 호출해야 합니다.</text>
</svg>
