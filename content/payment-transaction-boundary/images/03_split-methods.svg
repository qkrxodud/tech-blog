<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 428" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>트랜잭션을 나누는 세 방식 비교 — 기록을 맡는 빈을 따로 두거나 TransactionTemplate으로 경계를 직접 그으면 인증 기록과 결과 기록이 각각 짧은 트랜잭션으로 커밋되고 PG를 기다리는 동안 연결을 쓰지 않아 계약 테스트 4개를 모두 통과하고, 같은 클래스 안에서 this로 부르면 프록시를 거치지 않아 트랜잭션이 걸리지 않으므로 인증 기록이 저장되지 않고 다시 읽은 결제가 READY라 승인 전이가 거부되어 승인·거절 테스트 2개가 실패하는 그림</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14.5px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #4b5563; }
    .m { font-family: Menlo, Consolas, monospace; }
    .lbl { font-size: 12px; fill: #4b5563; }
    .ax { font-size: 12.5px; fill: #4b5563; font-weight: 700; }
    .tab { font-size: 12.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .badt { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .bads { font-size: 11.5px; fill: #b91c1c; }
    .okt { font-size: 13px; font-weight: 700; fill: #15803d; }
    .oks { font-size: 11.5px; fill: #15803d; }
    .o { stroke: #1f2937; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .spine { stroke: #1f2937; stroke-width: 1.5; fill: none; }
    .run { stroke-dasharray: 5 4; animation: run 0.9s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -18; } }
    @media (prefers-reduced-motion: reduce) { .run { animation: none; } .anim { display: none; } }
  </style>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="aor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <g id="pkt">
      <rect x="-11" y="-8" width="22" height="16" rx="3" fill="#2dd4bf" stroke="#0f766e" stroke-width="1.5"/>
      <path d="M-10,-7 L0,1 L10,-7" fill="none" stroke="#0f766e" stroke-width="1.5"/>
    </g>
    <g id="xmark"><circle r="9" fill="#ef4444"/><path d="M-4,-4 L4,4 M4,-4 L-4,4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
    <g id="vmark"><circle r="9" fill="#22c55e"/><path d="M-4.5,0 L-1.5,3.5 L4.5,-3.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <!-- 자물쇠: 트랜잭션·연결을 쥐고 있음 -->
    <g id="lock">
      <path d="M-5.5,-3 v-4 a5.5,5.5 0 0 1 11,0 v4" fill="none" stroke="#1f2937" stroke-width="2.2"/>
      <rect x="-8.5" y="-3" width="17" height="13" rx="3" fill="#fbbf24" stroke="#1f2937" stroke-width="1.5"/>
      <circle cx="0" cy="3" r="1.8" fill="#1f2937"/>
    </g>
    <!-- 두 상태 칩 + 화살표: 상태 전이 -->
    <g id="chips">
      <rect x="0" y="4" width="13" height="14" rx="4" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.5"/>
      <rect x="21" y="4" width="13" height="14" rx="4" fill="#86efac" stroke="#1f2937" stroke-width="1.5"/>
      <path d="M14,11 h6 M17,8 l3,3 l-3,3" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- 종이비행기: 바깥 호출 -->
    <g id="plane">
      <path d="M1,13 L31,1 L23,29 L15,19 Z" fill="#fdba74" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M15,19 L31,1 L11,16 Z" fill="#fb923c" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <!-- 체크 문서: 기록 -->
    <g id="doc">
      <path d="M0,0 h18 l8,8 v26 h-26 z" fill="#ffffff" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M18,0 v8 h8" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="20" cy="26" r="8" fill="#22c55e" stroke="#1f2937" stroke-width="1.5"/>
      <path d="M16.5,26 l2.5,2.5 l4.5,-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5,10 h9 M5,16 h7" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- DB 원통 -->
    <g id="db">
      <path d="M0,4 v16 a11,4 0 0 0 22,0 v-16 a11,4 0 0 1 -22,0 z" fill="#60a5fa" stroke="#1f2937" stroke-width="1.5"/>
      <path d="M0,12 a11,4 0 0 0 22,0" fill="none" stroke="#1f2937" stroke-width="1.5"/>
      <ellipse cx="11" cy="4" rx="11" ry="4" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.5"/>
    </g>
    <!-- 서버 두 칸 + 불빛: PG -->
    <g id="srv">
      <rect x="0" y="0" width="36" height="13" rx="3" fill="#cbd5e1" stroke="#1f2937" stroke-width="1.5"/>
      <rect x="0" y="16" width="36" height="13" rx="3" fill="#cbd5e1" stroke="#1f2937" stroke-width="1.5"/>
      <circle cx="7" cy="6.5" r="2.2" fill="#22c55e"/>
      <circle cx="7" cy="22.5" r="2.2" fill="#22c55e"/>
      <path d="M14,6.5 h16 M14,22.5 h16" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- 시계: 시간 제한·대기 -->
    <g id="clock">
      <circle cx="13" cy="13" r="12" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.5"/>
      <path d="M13,6 V13 L18,16" fill="none" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="760" height="428" fill="#ffffff"/>
  <text x="24" y="32" class="h">트랜잭션을 나누는 세 방식 — 기록 메서드에 트랜잭션이 걸리는가</text>
  <circle cx="38" cy="60" r="10" fill="#111827"/><text x="38" y="64" class="num" text-anchor="middle">1</text>
  <text x="54" y="65" class="ax">인증 기록</text>
  <circle cx="228" cy="60" r="10" fill="#111827"/><text x="228" y="64" class="num" text-anchor="middle">2</text>
  <text x="244" y="65" class="ax">PG 승인 호출</text>
  <circle cx="390" cy="60" r="10" fill="#111827"/><text x="390" y="64" class="num" text-anchor="middle">3</text>
  <text x="406" y="65" class="ax">결과 기록</text>
  <text x="653" y="65" class="ax" text-anchor="middle">계약 테스트 4개</text>
  <line x1="24" y1="76" x2="736" y2="76" stroke="#c4c8ce" stroke-width="1.2"/>
  <text x="26" y="100" class="t">기록을 맡는 빈을 따로 두기</text>
  <text x="246" y="100" class="s"><tspan font-family="Menlo, Consolas, monospace" font-size="11.5px">PaymentRecorder</tspan>의 <tspan font-family="Menlo, Consolas, monospace" font-size="11.5px">@Transactional</tspan> 메서드를 부름</text>
  <rect x="26" y="110" width="178" height="52" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <use href="#lock" x="46" y="134"/>
  <text x="64" y="132" class="t" style="font-size: 13.5px">트랜잭션 1</text>
  <text x="64" y="150" class="s">프록시를 거쳐 커밋</text>
  <line x1="204" y1="136" x2="212" y2="136" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <rect x="214" y="110" width="152" height="52" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="290" y="132" class="okt" text-anchor="middle">연결을 쓰지 않음</text>
  <text x="290" y="150" class="oks" text-anchor="middle">트랜잭션 밖</text>
  <line x1="366" y1="136" x2="374" y2="136" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <rect x="376" y="110" width="178" height="52" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <use href="#lock" x="396" y="134"/>
  <text x="414" y="132" class="t" style="font-size: 13.5px">트랜잭션 2</text>
  <text x="414" y="150" class="s">다시 읽고 기록·커밋</text>
  <rect x="572" y="114" width="162" height="44" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="596" y="136"/>
  <text x="614" y="141" class="okt">4개 모두 통과</text>
  <line x1="24" y1="176" x2="736" y2="176" stroke="#e5e7eb"/>
  <text x="26" y="200" class="t"><tspan font-family="Menlo, Consolas, monospace" font-size="13.5px">TransactionTemplate</tspan>으로 경계 긋기</text>
  <text x="318" y="200" class="s">비교 B' — 메서드 안에서 경계를 직접 그음</text>
  <rect x="26" y="210" width="178" height="52" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <use href="#lock" x="46" y="234"/>
  <text x="64" y="232" class="t" style="font-size: 13.5px">트랜잭션 1</text>
  <text x="64" y="250" class="s">그은 경계 안에서 커밋</text>
  <line x1="204" y1="236" x2="212" y2="236" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <rect x="214" y="210" width="152" height="52" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="290" y="232" class="okt" text-anchor="middle">연결을 쓰지 않음</text>
  <text x="290" y="250" class="oks" text-anchor="middle">트랜잭션 밖</text>
  <line x1="366" y1="236" x2="374" y2="236" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <rect x="376" y="210" width="178" height="52" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <use href="#lock" x="396" y="234"/>
  <text x="414" y="232" class="t" style="font-size: 13.5px">트랜잭션 2</text>
  <text x="414" y="250" class="s">다시 읽고 기록·커밋</text>
  <rect x="572" y="214" width="162" height="44" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="596" y="236"/>
  <text x="614" y="241" class="okt">4개 모두 통과</text>
  <line x1="24" y1="276" x2="736" y2="276" stroke="#e5e7eb"/>
  <text x="26" y="300" class="t">같은 클래스 안에서 <tspan font-family="Menlo, Consolas, monospace" font-size="13.5px">this</tspan>로 부르기</text>
  <text x="246" y="300" class="s">함정 확인용 — 스프링의 트랜잭션 프록시를 거치지 않음</text>
  <rect x="26" y="310" width="178" height="52" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="44" y="336"/>
  <text x="60" y="332" class="badt">트랜잭션 없음</text>
  <text x="60" y="350" class="bads">인증 기록이 저장 안 됨</text>
  <line x1="204" y1="336" x2="212" y2="336" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <rect x="214" y="310" width="152" height="52" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="290" y="332" class="t" text-anchor="middle" style="font-size: 13.5px">PG 승인 호출</text>
  <text x="290" y="350" class="s" text-anchor="middle">트랜잭션 밖</text>
  <line x1="366" y1="336" x2="374" y2="336" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <rect x="376" y="310" width="178" height="52" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="394" y="336"/>
  <text x="410" y="332" class="badt">다시 읽으니 <tspan font-family="Menlo, Consolas, monospace" font-size="12.5px">READY</tspan></text>
  <text x="410" y="350" class="bads">승인 전이가 거부됨</text>
  <rect x="572" y="310" width="162" height="52" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="596" y="336"/>
  <text x="614" y="332" class="badt">2개 실패</text>
  <text x="614" y="350" class="bads">승인·거절 테스트</text>
  <text x="26" y="392" class="s">연결 대기·시간 제한 테스트는 통과 — 트랜잭션이 아예 걸리지 않아 오래 열려 있는 트랜잭션도 없음</text>
  <text x="26" y="412" class="s">승인 테스트의 실패 메시지: <tspan font-family="Menlo, Consolas, monospace" font-size="11.5px">Cannot APPROVE a payment in READY status.</tspan></text>
</svg>
