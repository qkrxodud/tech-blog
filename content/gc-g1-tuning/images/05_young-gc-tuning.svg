<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>young GC 실행 시간이 MaxGCPauseMillis를 지속적으로 넘으면 G1NewSizePercent를, 평소엔 괜찮다가 간헐적으로 spike를 치며 넘으면 G1MaxNewSizePercent를 줄여 본다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .gc { fill: #d1d5db; stroke: #6b7280; stroke-width: 1.2; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .br { stroke: #9ca3af; stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="280" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">young GC 실행 시간에 따른 튜닝 — Young-Only Phase</text>
  <rect x="180" y="62" width="400" height="48" rx="8" class="bad"/>
  <text x="380" y="91" class="badt" text-anchor="middle">young GC 시간이 <tspan font-family="Menlo, Consolas, monospace">MaxGCPauseMillis</tspan> 초과</text>
  <path d="M 300 110 L 300 130 L 200 130 L 200 150" class="al" marker-end="url(#ar)"/>
  <path d="M 460 110 L 460 130 L 560 130 L 560 150" class="al" marker-end="url(#ar)"/>
  <rect x="40" y="152" width="320" height="44" rx="8" class="box"/>
  <text x="200" y="179" class="op" text-anchor="middle">지속적으로 초과</text>
  <rect x="400" y="152" width="320" height="44" rx="8" class="box"/>
  <text x="560" y="179" class="op" text-anchor="middle">평소엔 괜찮다가 간헐적으로 spike</text>
  <line x1="200" y1="196" x2="200" y2="216" class="gl" marker-end="url(#agr)"/>
  <line x1="560" y1="196" x2="560" y2="216" class="gl" marker-end="url(#agr)"/>
  <rect x="40" y="218" width="320" height="52" rx="8" class="ok"/>
  <text x="200" y="240" class="okt" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">G1NewSizePercent</tspan>를 줄인다</text>
  <text x="200" y="259" class="val" text-anchor="middle">최소 young 크기를 낮춤 · 디폴트 5</text>
  <rect x="400" y="218" width="320" height="52" rx="8" class="ok"/>
  <text x="560" y="240" class="okt" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">G1MaxNewSizePercent</tspan>를 줄인다</text>
  <text x="560" y="259" class="val" text-anchor="middle">최대 young 크기를 낮춤 · 디폴트 60</text>
</svg>
