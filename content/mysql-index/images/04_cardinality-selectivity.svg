<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>email은 1,000행 중 고유 값 900개라 선택도 0.9로 인덱스 사용이 유리하고, gender는 고유 값 2개라 선택도 0.002로 Full Table Scan이 더 효율적일 수 있다는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .grp { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ko { font-size: 13px; fill: #374151; }
    .mono { font-size: 13px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .monob { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .colh { font-size: 12px; font-weight: 700; fill: #9ca3af; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .edge { stroke: #c4c8ce; stroke-width: 1.4; fill: none; }
    .gedge { stroke: #16a34a; stroke-width: 2.2; fill: none; }
    .redge { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="310" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">카디널리티와 선택도 — 옵티마이저가 인덱스를 쓸지 판단하는 기준</text>
  <text x="159" y="74" class="colh" text-anchor="middle">전체 행 수</text>
  <text x="290" y="74" class="colh" text-anchor="middle">카디널리티</text>
  <text x="430" y="74" class="colh" text-anchor="middle">선택도</text>
  <text x="600" y="74" class="colh" text-anchor="middle">옵티마이저 판단</text>
  <text x="430" y="90" class="sub" text-anchor="middle">카디널리티 / 전체 행 수</text>
  <text x="30" y="134" class="lane">email</text>
  <text x="30" y="152" class="sub">고유 값 많음</text>
  <rect x="108" y="108" width="632" height="70" rx="6" class="track"/>
  <rect x="114" y="119" width="90" height="48" rx="8" class="box"/>
  <text x="159" y="147.5" class="monob" text-anchor="middle">1,000</text>
  <rect x="240" y="119" width="100" height="48" rx="8" class="box"/>
  <text x="290" y="147.5" class="monob" text-anchor="middle">900</text>
  <rect x="370" y="119" width="120" height="48" rx="8" class="ok"/>
  <text x="430" y="147.5" class="okm" text-anchor="middle">0.9 (90%)</text>
  <rect x="520" y="119" width="160" height="48" rx="8" class="ok"/>
  <text x="600" y="147.5" class="okt" text-anchor="middle">인덱스 사용 유리</text>
  <line x1="204" y1="143" x2="236" y2="143" class="flow" marker-end="url(#ag)"/>
  <line x1="340" y1="143" x2="366" y2="143" class="flow" marker-end="url(#ag)"/>
  <line x1="490" y1="143" x2="516" y2="143" class="flow" marker-end="url(#ag)"/>
  <text x="30" y="224" class="lane">gender</text>
  <text x="30" y="242" class="sub">남/여 2개</text>
  <rect x="108" y="198" width="632" height="70" rx="6" class="track"/>
  <rect x="114" y="209" width="90" height="48" rx="8" class="box"/>
  <text x="159" y="237.5" class="monob" text-anchor="middle">1,000</text>
  <rect x="240" y="209" width="100" height="48" rx="8" class="box"/>
  <text x="290" y="237.5" class="monob" text-anchor="middle">2</text>
  <rect x="370" y="209" width="120" height="48" rx="8" class="bad"/>
  <text x="430" y="237.5" class="badm" text-anchor="middle">0.002 (0.2%)</text>
  <rect x="520" y="209" width="160" height="48" rx="8" class="bad"/>
  <text x="600" y="228" class="badt" text-anchor="middle">Full Table Scan이</text>
  <text x="600" y="247" class="note" text-anchor="middle">더 효율적일 수 있음</text>
  <line x1="204" y1="233" x2="236" y2="233" class="flow" marker-end="url(#ag)"/>
  <line x1="340" y1="233" x2="366" y2="233" class="flow" marker-end="url(#ag)"/>
  <line x1="490" y1="233" x2="516" y2="233" class="flow" marker-end="url(#ag)"/>
  <text x="30" y="298" class="foot">고유 값이 많을수록 조건에 맞는 행이 적어지고, 인덱스로 걸러 내는 효과가 커집니다.</text>
</svg>
