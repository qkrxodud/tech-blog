<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>같은 알림 두 개가 동시에 닿을 때 unique 키 전과 뒤 — 결정 3을 만든 시점에는 알림을 받은 요청 안에서 반영해서, 두 알림이 둘 다 PG에 조회해 같은 transactionKey의 PG 취소를 모르는 키로 보고 들여와 같은 취소가 2건이 된 것을 실행에서 봄. unique(payment_id, transaction_key)를 더한 뒤에는 두 번째 기록이 막혀 500으로 끝나고, PG의 재전송에서 정상 처리되어 취소 기록은 1건</title>
