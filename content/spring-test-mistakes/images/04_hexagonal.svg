<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>엔티티와 유스케이스가 있는 육각형 코어를 웹·외부 시스템 어댑터가 입력 포트로 호출하고, 유스케이스가 호출하는 출력 포트를 영속성·외부 시스템 어댑터가 구현해 모든 의존성이 코어를 향하는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .lname { font-size: 14px; font-weight: 700; fill: #6b7280; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .st { font-size: 11.5px; fill: #6b7280; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .ring { font-size: 13px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .pkg { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .dep { stroke: #6b7280; stroke-width: 1.5; fill: none; }
    .depr { stroke: #dc2626; stroke-width: 1.6; fill: none; }
    .depg { stroke: #16a34a; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="760" height="540" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="520" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">육각형 아키텍처 — 모든 의존성은 코어를 향한다</text>
  <polygon points="160,280 270,90 490,90 600,280 490,470 270,470" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <g transform="rotate(-60 215 185)">
    <rect x="155" y="171" width="120" height="28" rx="4" class="hold"/>
    <text x="215" y="190" class="ts" text-anchor="middle">입력 포트</text>
  </g>
  <g transform="rotate(60 215 375)">
    <rect x="155" y="361" width="120" height="28" rx="4" class="hold"/>
    <text x="215" y="380" class="ts" text-anchor="middle">입력 포트</text>
  </g>
  <g transform="rotate(60 545 185)">
    <rect x="485" y="171" width="120" height="28" rx="4" class="hold"/>
    <text x="545" y="190" class="ts" text-anchor="middle">출력 포트</text>
  </g>
  <g transform="rotate(-60 545 375)">
    <rect x="485" y="361" width="120" height="28" rx="4" class="hold"/>
    <text x="545" y="380" class="ts" text-anchor="middle">출력 포트</text>
  </g>
  <rect x="300" y="128" width="160" height="48" rx="8" class="box"/>
  <text x="380" y="157" class="t" text-anchor="middle">유스케이스</text>
  <rect x="310" y="256" width="140" height="48" rx="8" class="ok"/>
  <text x="380" y="285" class="okt" text-anchor="middle">엔티티</text>
  <rect x="300" y="384" width="160" height="48" rx="8" class="box"/>
  <text x="380" y="413" class="t" text-anchor="middle">유스케이스</text>
  <path d="M380,176 L380,254" class="dep" marker-end="url(#ag)"/>
  <path d="M380,384 L380,306" class="dep" marker-end="url(#ag)"/>
  <line x1="300" y1="152" x2="234" y2="182" class="dep" marker-end="url(#tri)"/>
  <line x1="300" y1="408" x2="234" y2="378" class="dep" marker-end="url(#tri)"/>
  <path d="M460,152 L524,182" class="dep" marker-end="url(#ag)"/>
  <path d="M460,408 L524,378" class="dep" marker-end="url(#ag)"/>
  <rect x="20" y="149" width="120" height="56" rx="8" class="box"/>
  <text x="80" y="182" class="t" text-anchor="middle">웹 어댑터</text>
  <rect x="20" y="355" width="120" height="56" rx="8" class="box"/>
  <text x="80" y="379" class="t" text-anchor="middle">외부 시스템</text>
  <text x="80" y="398" class="t" text-anchor="middle">어댑터</text>
  <rect x="620" y="149" width="120" height="56" rx="8" class="box"/>
  <text x="680" y="182" class="ts" text-anchor="middle">영속성 어댑터</text>
  <rect x="620" y="355" width="120" height="56" rx="8" class="box"/>
  <text x="680" y="379" class="t" text-anchor="middle">외부 시스템</text>
  <text x="680" y="398" class="t" text-anchor="middle">어댑터</text>
  <path d="M140,177 L193,177" class="dep" marker-end="url(#ag)"/>
  <path d="M140,383 L193,383" class="dep" marker-end="url(#ag)"/>
  <line x1="620" y1="177" x2="567" y2="177" class="dep" marker-end="url(#tri)"/>
  <line x1="620" y1="383" x2="567" y2="383" class="dep" marker-end="url(#tri)"/>
  <line x1="30" y1="508" x2="70" y2="508" class="dep" marker-end="url(#ag)"/>
  <text x="80" y="512" class="s">호출(의존)</text>
  <line x1="170" y1="508" x2="210" y2="508" class="dep" marker-end="url(#tri)"/>
  <text x="220" y="512" class="s">포트 구현</text>
  <text x="730" y="512" class="foot" text-anchor="end">육각형 바깥으로 향하는 의존성이 없다</text>
</svg>
