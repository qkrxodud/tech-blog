  <text x="60" y="352" class="s2" style="font-size:11px;fill:#1f2937;font-weight:700">같은 코드의 첫 <tspan class="m">clean check</tspan> — 결제 API 19개·결제 취소 API 14개가 모든 요청에 404(33개 실패)</text>
  <text x="60" y="372" class="gs" style="font-size:10.5px">한 번 관찰 · 재현 안 됨(그 뒤 <tspan class="m">clean check</tspan> 4번·<tspan class="m">test</tspan> 1번 모두 통과) · 원인 못 찾음 · 코드는 바꾸지 않음</text>
