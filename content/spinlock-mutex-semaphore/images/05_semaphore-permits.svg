<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>세마포 입장권 3장: 스레드 네 개가 acquire해 셋은 들어가고 하나는 기다리다가, 한 장이 돌아오자 들어가는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 13.5px; font-weight: 700; fill: #1f2937; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .holdt { font-size: 12.5px; fill: #6b7280; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #dc2626; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #b91c1c; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 13.5px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
  </defs>
  <rect width="760" height="450" fill="#ffffff"/>

  <rect x="10" y="10" width="740" height="430" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">세마포 — 입장권 3장, 화장실 3칸</text>
  <text x="730" y="42" class="code" text-anchor="end">new Semaphore(3)</text>

  <text x="210" y="70" class="step" text-anchor="middle">1단계</text>
  <text x="300" y="70" class="step" text-anchor="middle">2단계</text>
  <text x="390" y="70" class="step" text-anchor="middle">3단계</text>
  <text x="480" y="70" class="step" text-anchor="middle">4단계</text>
  <text x="570" y="70" class="step" text-anchor="middle">5단계</text>
  <text x="660" y="70" class="step" text-anchor="middle">6단계</text>
  <line x1="166" y1="78" x2="722" y2="78" class="axis" marker-end="url(#ar)"/>

  <!-- T1 -->
  <text x="30" y="124" class="lane">스레드 1</text>
  <rect x="160" y="96" width="575" height="46" rx="6" class="track"/>
  <rect x="170" y="100" width="80" height="38" rx="8" class="box"/>
  <text x="210" y="124" class="op" text-anchor="middle">acquire</text>
  <rect x="254" y="104" width="272" height="30" rx="6" class="hold"/>
  <text x="390" y="124" class="holdt" text-anchor="middle">한 칸 사용 중</text>
  <rect x="530" y="100" width="80" height="38" rx="8" class="box"/>
  <text x="570" y="124" class="op" text-anchor="middle">release</text>

  <!-- T2 -->
  <text x="30" y="178" class="lane">스레드 2</text>
  <rect x="160" y="150" width="575" height="46" rx="6" class="track"/>
  <rect x="260" y="154" width="80" height="38" rx="8" class="box"/>
  <text x="300" y="178" class="op" text-anchor="middle">acquire</text>
  <rect x="344" y="158" width="376" height="30" rx="6" class="hold"/>
  <text x="532" y="178" class="holdt" text-anchor="middle">한 칸 사용 중</text>

  <!-- T3 -->
  <text x="30" y="232" class="lane">스레드 3</text>
  <rect x="160" y="204" width="575" height="46" rx="6" class="track"/>
  <rect x="350" y="208" width="80" height="38" rx="8" class="box"/>
  <text x="390" y="232" class="op" text-anchor="middle">acquire</text>
  <rect x="434" y="212" width="286" height="30" rx="6" class="hold"/>
  <text x="577" y="232" class="holdt" text-anchor="middle">한 칸 사용 중</text>

  <!-- T4 -->
  <text x="30" y="286" class="lane">스레드 4</text>
  <rect x="160" y="258" width="575" height="46" rx="6" class="track"/>
  <rect x="440" y="262" width="80" height="38" rx="8" class="box"/>
  <text x="480" y="286" class="op" text-anchor="middle">acquire</text>
  <rect x="524" y="266" width="92" height="30" rx="6" class="wait"/>
  <text x="570" y="286" class="waitt" text-anchor="middle">0장이라 대기</text>
  <rect x="620" y="262" width="80" height="38" rx="8" class="ok"/>
  <text x="660" y="286" class="okt" text-anchor="middle">입장</text>

  <!-- 남은 입장권 -->
  <text x="30" y="344" class="db">남은 입장권</text>
  <text x="30" y="368" class="sub">처음 3장</text>
  <rect x="180" y="324" width="60" height="30" rx="6" class="dbbox"/>
  <text x="210" y="344" class="db" text-anchor="middle">2장</text>
  <circle cx="196" cy="368" r="5" fill="#16a34a" stroke="#16a34a" stroke-width="1.2"/>
  <circle cx="210" cy="368" r="5" fill="#16a34a" stroke="#16a34a" stroke-width="1.2"/>
  <circle cx="224" cy="368" r="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="270" y="324" width="60" height="30" rx="6" class="dbbox"/>
  <text x="300" y="344" class="db" text-anchor="middle">1장</text>
  <circle cx="286" cy="368" r="5" fill="#16a34a" stroke="#16a34a" stroke-width="1.2"/>
  <circle cx="300" cy="368" r="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <circle cx="314" cy="368" r="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="360" y="324" width="60" height="30" rx="6" class="dbbox"/>
  <text x="390" y="344" class="db" text-anchor="middle">0장</text>
  <circle cx="376" cy="368" r="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <circle cx="390" cy="368" r="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <circle cx="404" cy="368" r="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="450" y="324" width="60" height="30" rx="6" class="bad"/>
  <text x="480" y="344" class="badt" text-anchor="middle">0장</text>
  <circle cx="466" cy="368" r="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <circle cx="480" cy="368" r="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <circle cx="494" cy="368" r="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="540" y="324" width="60" height="30" rx="6" class="dbbox"/>
  <text x="570" y="344" class="db" text-anchor="middle">1장</text>
  <circle cx="556" cy="368" r="5" fill="#16a34a" stroke="#16a34a" stroke-width="1.2"/>
  <circle cx="570" cy="368" r="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <circle cx="584" cy="368" r="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <rect x="630" y="324" width="60" height="30" rx="6" class="dbbox"/>
  <text x="660" y="344" class="db" text-anchor="middle">0장</text>
  <circle cx="646" cy="368" r="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <circle cx="660" cy="368" r="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <circle cx="674" cy="368" r="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="30" y="404" class="sub">1~3단계: 한 장씩 가져가 3 → 2 → 1 → 0  ·  4단계: 0장이라 스레드 4는 대기</text>
  <text x="30" y="424" class="sub">5단계: 스레드 1이 한 장 돌려놓아 1장  ·  6단계: 기다리던 스레드 4가 가져가 다시 0장</text>
</svg>
