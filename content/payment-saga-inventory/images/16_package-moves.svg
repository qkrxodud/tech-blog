<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>10장 출발 코드 앞의 패키지 이동 두 커밋 — 결제 애그리거트(Payment·PaymentStatus·CancelRequest)가 던지는 예외가 global/error에 있어 domain이 global에 기대고 있었기 때문에 ErrorCode·ErrorType·PaymentChallengeException과 예외들을 domain/error로 옮기고 global/error에는 GlobalExceptionHandler와 ErrorResponse만 남김. 주기 작업 잠금 창구 JobLockRepository는 업무 규칙이 아닌 운영상의 조정 장치이고 쓰는 곳이 ExclusiveJobRunner 하나뿐이라 domain/job에서 application/payment로 옮김. 동작과 테스트 내용은 바뀌지 않았고 앞 글의 패키지 경로와 테스트 출력의 예외 경로는 지금 코드와 다름</title>
