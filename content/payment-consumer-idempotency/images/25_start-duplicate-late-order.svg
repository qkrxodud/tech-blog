  <text x="52" y="381" class="s" style="font-size:11px">그보다 먼저 만든 승인</text>
  <line x1="216" y1="376" x2="282" y2="376" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="284" y="360" width="200" height="32" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="296" y="381" class="s" style="font-size:11px">1줄 더</text>
  <line x1="486" y1="376" x2="524" y2="376" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="526" y="360" width="220" height="32" rx="6" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="538" y="381" class="bads" style="font-size:11px"><tspan class="m">PAID</tspan>로 돌아감 — 기대 <tspan class="m">CANCELED</tspan></text>
  <text x="540" y="408" class="bads" style="font-size:10.5px">받은 순서대로 따름 · 만든 시각·번호를 보지 않음</text>
  <text x="52" y="408" class="gs" style="font-size:10.5px">같은 파티션에 취소 → 옛 승인 순서로 실음</text>
  <line x1="14" y1="430" x2="746" y2="430" stroke="#d1d5db" stroke-width="1"/>
  <use href="#i-db" transform="translate(24,444) scale(0.7)"/>
  <text x="58" y="458" class="t2" style="font-size:12px">재고 서비스는 둘 다 재현되지 않음</text>
  <text x="58" y="478" class="gs" style="font-size:10.5px">같은 확정·해제는 10장 예약 상태 전이가 이미 지난 상태로 보고 바꾸지 않음 · 해제는 끝 상태라 옛 확정이 와도 되살아나지 않음</text>
  <text x="58" y="498" class="gs" style="font-size:10.5px">계약 출력: expected 1 but was 2 · updated_at 다름 · expected "CANCELED" but was "PAID"</text>
