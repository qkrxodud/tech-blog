<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>SendMoneyService가 @Transactional로 트랜잭션을 열고 LoadAccountPort와 UpdateAccountStatePort를 차례로 호출한 뒤 커밋해, 두 영속성 연산이 한 트랜잭션에 묶이는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 11.5px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .mok { font-size: 11.5px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .mbad { font-size: 11.5px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .pk { font-size: 12px; font-weight: 700; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .st { font-size: 11px; fill: #6b7280; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .lbl { font-size: 11.5px; fill: #6b7280; }
    .glbl { font-size: 11.5px; font-weight: 700; fill: #15803d; }
    .rlbl { font-size: 11.5px; font-weight: 700; fill: #b91c1c; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .layer { font-size: 13px; font-weight: 700; fill: #6b7280; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .pkg { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .ctx { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .sep { stroke: #c4c8ce; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .scope { fill: none; stroke: #16a34a; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .th { font-size: 13px; font-weight: 700; fill: #374151; }
    .td { font-size: 12px; fill: #374151; }
    .tdg { font-size: 12px; fill: #15803d; }
    .tdr { font-size: 12px; fill: #b91c1c; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="300" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">트랜잭션 경계 — 영속성 어댑터를 호출하는 서비스가 정한다</text>
  <text x="220" y="68" class="step" text-anchor="middle">트랜잭션 시작</text>
  <text x="360" y="68" class="step" text-anchor="middle">계좌 로드</text>
  <text x="500" y="68" class="step" text-anchor="middle">활동 저장</text>
  <text x="640" y="68" class="step" text-anchor="middle">커밋</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="104" class="lane">서비스</text>
  <text x="30" y="122" class="sub" font-family="Menlo, Consolas, monospace" font-size="10.5">SendMoneyService</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="156" y="84" width="548" height="132" rx="10" class="scope"/>
  <rect x="162" y="88" width="116" height="48" rx="8" class="ok"/>
  <text x="220" y="108" class="mok" text-anchor="middle">@Transactional</text>
  <text x="220" y="127" class="val" text-anchor="middle">경계 열기</text>
  <rect x="302" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="360" y="117" class="m" text-anchor="middle">loadAccount</text>
  <rect x="442" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="500" y="108" class="m" text-anchor="middle">update</text>
  <text x="500" y="124" class="m" text-anchor="middle">Activities</text>
  <rect x="582" y="88" width="116" height="48" rx="8" class="ok"/>
  <text x="640" y="108" class="mok" text-anchor="middle">commit</text>
  <text x="640" y="127" class="val" text-anchor="middle">경계 닫기</text>
  <text x="30" y="172" class="lane">어댑터</text>
  <text x="30" y="190" class="sub">영속성 어댑터</text>
  <rect x="150" y="150" width="585" height="56" rx="6" class="track"/>
  <rect x="302" y="154" width="116" height="48" rx="8" class="hold"/>
  <text x="360" y="174" class="m" text-anchor="middle">LoadAccount</text>
  <text x="360" y="192" class="m" text-anchor="middle">Port</text>
  <rect x="442" y="154" width="116" height="48" rx="8" class="hold"/>
  <text x="500" y="174" class="m" text-anchor="middle">UpdateAccount</text>
  <text x="500" y="192" class="m" text-anchor="middle">StatePort</text>
  <path d="M360,136 L360,152" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
  <path d="M500,136 L500,152" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="704" y="234" class="glbl" text-anchor="end">한 트랜잭션</text>
  <text x="30" y="262" class="foot">영속성 어댑터는 어떤 연산이 같은 유스케이스에 포함되는지 모르기 때문에</text>
  <text x="30" y="284" class="foot">트랜잭션을 언제 열고 닫을지는 어댑터 호출을 관장하는 서비스가 정합니다.</text>
</svg>
