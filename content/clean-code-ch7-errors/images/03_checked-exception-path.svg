<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>최하위 함수가 확인된 예외를 던지면 세 단계 위 catch 블록까지 가는 중간 함수의 선언부에 모두 throws를 추가해야 하고, printA를 바꾸면 func의 선언부도 바뀐다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .ttl { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ttls { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .cs { font-family: Menlo, Consolas, monospace; font-size: 11.5px; fill: #374151; }
    .csb { font-family: Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; fill: #1f2937; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="452" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="432" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">확인된 예외 — catch까지 가는 경로의 선언부가 모두 바뀜</text>
  <rect x="30" y="70" width="340" height="60" rx="8" class="box"/>
  <text x="48" y="95" class="ttl">최상위 함수</text>
  <text x="48" y="116" class="val">catch 블록 (세 단계 위)</text>
  <rect x="30" y="154" width="340" height="60" rx="8" class="bad"/>
  <text x="48" y="179" class="badt">중간 함수</text>
  <text x="48" y="200" class="val">선언부에 throws 추가</text>
  <rect x="30" y="238" width="340" height="60" rx="8" class="bad"/>
  <text x="48" y="263" class="badt">중간 함수</text>
  <text x="48" y="284" class="val">선언부에 throws 추가</text>
  <rect x="30" y="322" width="340" height="60" rx="8" class="hold"/>
  <text x="48" y="347" class="ttl">최하위 함수</text>
  <text x="48" y="368" class="val">확인된 예외를 던지도록 변경</text>
  <line x1="200" y1="322" x2="200" y2="300" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <line x1="200" y1="238" x2="200" y2="216" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <line x1="200" y1="154" x2="200" y2="132" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="212" y="312" class="note">예외 전파</text>
  <rect x="410" y="70" width="325" height="312" rx="10" class="box"/>
  <text x="428" y="96" class="ttl">예: <tspan font-family="Menlo, Consolas, monospace">printA()</tspan>를 바꾸면</text>
  <rect x="428" y="118" width="289" height="64" rx="8" class="bad"/>
  <text x="444" y="143" class="csb">func(boolean flag)</text>
  <text x="444" y="165" class="note"><tspan font-family="Menlo, Consolas, monospace">throws NotPrintException</tspan> 추가</text>
  <rect x="428" y="234" width="289" height="64" rx="8" class="hold"/>
  <text x="444" y="259" class="csb">printA(boolean flag)</text>
  <text x="444" y="281" class="val"><tspan font-family="Menlo, Consolas, monospace">throw new NotPrintException()</tspan></text>
  <line x1="572" y1="234" x2="572" y2="184" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="584" y="214" class="note">호출자 선언부도 바뀜</text>
  <text x="428" y="330" class="sub">printA()만 바꿨는데</text>
  <text x="428" y="350" class="sub">호출하는 func()의 선언부도 고칩니다</text>
  <text x="30" y="420" class="note">경로의 모든 함수가 최하위 함수의 예외를 알아야 하므로 캡슐화가 깨집니다</text>
</svg>
