<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 368" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>findAllWithMemberDelivery()가 ORDERS, MEMBER, DELIVERY를 조인한 SQL 1번으로 주문과 회원, 배송을 함께 가져오므로, SimpleOrderDto를 만들 때 getMember()와 getDelivery()를 호출해도 추가 SQL이 실행되지 않는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
