  <circle cx="120" cy="96" r="10" fill="#111827"/><text x="120" y="100" class="num" text-anchor="middle">1</text>
  <text x="134" y="116" class="bt" style="font-size:12px"><tspan class="m">claim</tspan> — 줄 남김</text>
  <text x="134" y="134" class="bs" style="font-size:10.5px"><tspan class="m">RESERVED</tspan> · 커밋 전</text>
  <rect x="296" y="96" width="230" height="48" rx="10" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <circle cx="296" cy="96" r="10" fill="#111827"/><text x="296" y="100" class="num" text-anchor="middle">2</text>
  <use href="#i-clock" transform="translate(308,106) scale(0.95)"/>
  <text x="342" y="116" class="yt" style="font-size:12px">재고 줄이기 1초 붙잡힘</text>
  <text x="342" y="134" class="ys" style="font-size:10.5px">트리거</text>
  <rect x="542" y="96" width="180" height="48" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <circle cx="542" cy="96" r="10" fill="#111827"/><text x="542" y="100" class="num" text-anchor="middle">3</text>
  <text x="556" y="116" class="okt" style="font-size:12px">커밋</text>
  <text x="556" y="134" class="oks" style="font-size:10.5px">재고 3(처음 5)</text>
  <rect x="296" y="196" width="230" height="48" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="296" cy="196" r="10" fill="#111827"/><text x="296" y="200" class="num" text-anchor="middle">4</text>
  <use href="#i-wait" transform="translate(308,205) scale(0.95)"/>
  <text x="342" y="216" class="gt" style="font-size:12px">같은 번호 <tspan class="m">claim</tspan> — 기다림</text>
  <text x="342" y="234" class="gs" style="font-size:10.5px">문서로 확인하지 못한 가정</text>
  <rect x="542" y="196" width="180" height="48" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <circle cx="542" cy="196" r="10" fill="#111827"/><text x="542" y="200" class="num" text-anchor="middle">5</text>
  <text x="556" y="216" class="okt" style="font-size:11.5px">이미 있는 줄 → 해제</text>
  <text x="556" y="234" class="oks" style="font-size:10.5px">잠그고 읽기 · 재고 5</text>
  <line x1="632" y1="146" x2="632" y2="192" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="640" y="174" class="oks" style="font-size:10.5px">커밋 뒤</text>
  <rect x="24" y="270" width="348" height="120" rx="12" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#i-doc" transform="translate(38,284) scale(0.9)"/>
  <text x="74" y="296" class="okt" style="font-size:12.5px">문서에 있는 것</text>
  <text x="38" y="330" class="oks" style="font-size:11px">MySQL 8.4 — 일반 INSERT가 중복 키를</text>
  <text x="38" y="348" class="oks" style="font-size:11px">만나면 그 인덱스 줄에 공유 잠금</text>
  <text x="38" y="372" class="oks" style="font-size:10.5px">"Locks Set by Different SQL Statements"</text>
  <rect x="388" y="270" width="348" height="120" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <use href="#i-warn" transform="translate(402,284) scale(0.9)"/>
  <text x="438" y="296" class="gt" style="font-size:12.5px">확인하지 못한 것</text>
  <text x="402" y="330" class="gs" style="font-size:11px"><tspan class="m">insert ignore</tspan>의 경우는 문서로</text>
  <text x="402" y="348" class="gs" style="font-size:11px">확인하지 못함 — 이 계약이 통과한</text>
  <text x="402" y="366" class="gs" style="font-size:11px">실행으로만 아는 가정</text>
  <text x="380" y="420" class="gs" text-anchor="middle" style="font-size:11px">해제가 먼저 줄을 남긴 경우에는 반대로 늦게 온 예약이 그 줄에 막혀 <tspan class="m">409 RESERVATION_RELEASED</tspan></text>
  <rect x="120" y="96" width="160" height="48" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.01;0.02;0.07;0.08;1"/></rect>
  <rect x="296" y="96" width="230" height="48" rx="10" fill="none" stroke="#d97706" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0853;0.0953;0.3953;0.4053;1"/></rect>
  <rect x="542" y="96" width="180" height="48" rx="10" fill="none" stroke="#16a34a" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.57;0.58;0.63;0.64;1"/></rect>
  <rect x="296" y="196" width="230" height="48" rx="10" fill="none" stroke="#6b7280" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2271;0.2371;0.6471;0.6571;1"/></rect>
  <rect x="542" y="196" width="180" height="48" rx="10" fill="none" stroke="#16a34a" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.89;0.9;0.95;0.96;1"/></rect>
