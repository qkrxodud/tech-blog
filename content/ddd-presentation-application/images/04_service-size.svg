<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 442" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>MemberService 한 클래스에 join, changePassword 등 모든 기능을 두는 방식과, 기능별로 응용 서비스 클래스를 나누고 공통 로직은 MemberServiceHelper에 두는 방식의 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .op2 { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #1f2937; }
    .okc2 { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badc2 { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .monoxs { font-family: Menlo, Consolas, monospace; font-size: 11.5px; fill: #374151; }
    .monos { font-family: Menlo, Consolas, monospace; font-size: 12.5px; fill: #374151; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="760" height="442" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="190" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">한 클래스에 모든 기능 — MemberService</text>
  <text x="730" y="42" class="code" text-anchor="end">MemberService</text>
  <rect x="30" y="60" width="420" height="110" rx="10" class="hold"/>
  <text x="46" y="84" class="op2">MemberService</text>
  <rect x="46" y="98" width="90" height="36" rx="6" class="box"/>
  <text x="91" y="121" class="op2" text-anchor="middle">join()</text>
  <rect x="148" y="98" width="164" height="36" rx="6" class="box"/>
  <text x="230" y="121" class="op2" text-anchor="middle">changePassword()</text>
  <rect x="324" y="98" width="90" height="36" rx="6" class="box"/>
  <text x="369" y="121" class="op2" text-anchor="middle">…</text>
  <text x="46" y="156" class="sub">memberRepository 등 필드를 함께 사용</text>
  <rect x="470" y="60" width="260" height="48" rx="6" class="ok"/>
  <text x="600" y="89" class="okt" text-anchor="middle">동일 로직 중복 제거</text>
  <rect x="470" y="122" width="260" height="48" rx="6" class="bad"/>
  <text x="600" y="143" class="badt" text-anchor="middle">클래스가 커지고</text>
  <text x="600" y="161" class="note" text-anchor="middle">연관 없는 코드가 섞임</text>
  <rect x="10" y="216" width="740" height="216" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="248" class="h">기능별 클래스 — 공통 로직은 Helper로</text>
  <text x="730" y="248" class="code" text-anchor="end">MemberServiceHelper</text>
  <rect x="40" y="272" width="200" height="48" rx="8" class="box"/>
  <text x="140" y="301" class="op2" text-anchor="middle">JoinService</text>
  <line x1="140" y1="322" x2="300" y2="344" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#agy)"/>
  <rect x="280" y="272" width="200" height="48" rx="8" class="box"/>
  <text x="380" y="301" class="op2" text-anchor="middle">ChangePasswordService</text>
  <line x1="380" y1="322" x2="380" y2="344" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#agy)"/>
  <rect x="520" y="272" width="200" height="48" rx="8" class="box"/>
  <text x="620" y="301" class="op2" text-anchor="middle">…Service</text>
  <line x1="620" y1="322" x2="460" y2="344" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#agy)"/>
  <rect x="200" y="348" width="360" height="48" rx="8" class="ok"/>
  <text x="380" y="370" class="okc2" text-anchor="middle">MemberServiceHelper</text>
  <text x="380" y="388" class="monos" text-anchor="middle">findExistingMember(repo, id)</text>
  <text x="40" y="420" class="sub">클래스마다 필요한 기능만 두고, 공통되는 로직은 별도 클래스에서 가져다 씀</text>
</svg>
