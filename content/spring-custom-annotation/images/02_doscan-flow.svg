<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 482" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>doScan이 basePackage마다 findCandidateComponents로 후보를 찾고, 후보마다 스코프와 빈 이름을 정한 뒤 checkCandidate를 통과한 후보를 registerBeanDefinition으로 등록하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .desc { font-size: 13px; fill: #374151; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .dimt { font-size: 12px; fill: #9ca3af; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .chip { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .dim { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .okms { font-size: 12px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .badms { font-size: 12px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="482" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="462" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h"><tspan font-family="Menlo, Consolas, monospace">doScan</tspan> — 후보를 찾아 빈 정의로 등록하는 순서</text>
  <text x="730" y="42" class="code" text-anchor="end">ClassPathBeanDefinitionScanner</text>

  <text x="44" y="97" class="step" text-anchor="middle">1</text>
  <rect x="62" y="70" width="360" height="44" rx="8" class="hold"/>
  <text x="242" y="97" class="mb" text-anchor="middle">doScan(basePackages)</text>
  <text x="446" y="97" class="desc">지정한 패키지(basePackage)마다 아래 과정을 반복</text>

  <line x1="242" y1="116" x2="242" y2="134" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>

  <text x="44" y="165" class="step" text-anchor="middle">2</text>
  <rect x="62" y="138" width="360" height="44" rx="8" class="box"/>
  <text x="242" y="165" class="mb" text-anchor="middle">findCandidateComponents(...)</text>
  <text x="446" y="165" class="desc"><tspan font-family="Menlo, Consolas, monospace">@Component</tspan>가 붙은 후보 클래스 찾기</text>

  <line x1="242" y1="184" x2="242" y2="214" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>

  <rect x="30" y="200" width="700" height="256" rx="10" class="scope"/>
  <text x="716" y="220" class="sub" text-anchor="end">찾은 후보(candidate)마다 반복</text>

  <text x="44" y="245" class="step" text-anchor="middle">3</text>
  <rect x="62" y="218" width="360" height="44" rx="8" class="box"/>
  <text x="242" y="245" class="mb" text-anchor="middle">resolveScopeMetadata(...)</text>
  <text x="446" y="245" class="desc">스코프 정하기</text>

  <line x1="242" y1="264" x2="242" y2="278" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>

  <text x="44" y="309" class="step" text-anchor="middle">4</text>
  <rect x="62" y="282" width="360" height="44" rx="8" class="box"/>
  <text x="242" y="309" class="mb" text-anchor="middle">generateBeanName(...)</text>
  <text x="446" y="309" class="desc">빈 이름 만들기</text>

  <line x1="242" y1="328" x2="242" y2="342" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>

  <text x="44" y="373" class="step" text-anchor="middle">5</text>
  <rect x="62" y="346" width="360" height="44" rx="8" class="box"/>
  <text x="242" y="373" class="mb" text-anchor="middle">checkCandidate(beanName, candidate)</text>
  <text x="446" y="373" class="desc">등록할 수 있는 후보인지 확인</text>

  <line x1="242" y1="392" x2="242" y2="408" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>

  <text x="44" y="435" class="step" text-anchor="middle">6</text>
  <rect x="62" y="412" width="360" height="36" rx="8" class="ok"/>
  <text x="242" y="435" class="okm" text-anchor="middle">registerBeanDefinition(...)</text>
  <text x="446" y="435" class="gnote">빈 정의(BeanDefinition) 등록</text>
</svg>
