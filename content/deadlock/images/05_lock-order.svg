<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 546" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>위쪽은 transfer(a,b)와 transfer(b,a)가 각각 a와 b를 먼저 잠가 서로 기다리는 데드락, 아래쪽은 id로 정렬해 둘 다 a부터 잠가 한쪽이 기다렸다가 차례로 끝나는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .waitl { stroke: #dc2626; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
    .lbl { font-size: 12.5px; font-weight: 700; fill: #6b7280; }
    .colh { font-size: 12px; font-weight: 700; fill: #9ca3af; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="546" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="252" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">호출 순서대로 잠금 — 데드락</text>
  <text x="730" y="42" class="code" text-anchor="end">transfer(a,b) / transfer(b,a)</text>
  <text x="220" y="68" class="step" text-anchor="middle">1단계</text>
  <text x="360" y="68" class="step" text-anchor="middle">2단계</text>
  <text x="500" y="68" class="step" text-anchor="middle">3단계</text>
  <text x="640" y="68" class="step" text-anchor="middle"></text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">스레드 1</text>
  <text x="30" y="126" class="sub">transfer(a, b)</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="88" width="116" height="48" rx="8" class="hold"/>
  <text x="220" y="108" class="op" text-anchor="middle">lock(a)</text>
  <text x="220" y="127" class="val" text-anchor="middle">a 쥠</text>
  <rect x="302" y="88" width="116" height="48" rx="8" class="bad"/>
  <text x="360" y="108" class="badc" text-anchor="middle">lock(b)</text>
  <text x="360" y="127" class="val" text-anchor="middle">2가 쥠 → 대기</text>
  <rect x="430" y="96" width="274" height="32" rx="6" class="wait"/>
  <text x="567" y="117" class="waitt" text-anchor="middle">a를 쥔 채 계속 대기</text>
  <text x="30" y="168" class="lane">스레드 2</text>
  <text x="30" y="186" class="sub">transfer(b, a)</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="148" width="116" height="48" rx="8" class="hold"/>
  <text x="220" y="168" class="op" text-anchor="middle">lock(b)</text>
  <text x="220" y="187" class="val" text-anchor="middle">b 쥠</text>
  <rect x="302" y="148" width="116" height="48" rx="8" class="bad"/>
  <text x="360" y="168" class="badc" text-anchor="middle">lock(a)</text>
  <text x="360" y="187" class="val" text-anchor="middle">1이 쥠 → 대기</text>
  <rect x="430" y="156" width="274" height="32" rx="6" class="wait"/>
  <text x="567" y="177" class="waitt" text-anchor="middle">b를 쥔 채 계속 대기</text>
  <rect x="150" y="214" width="585" height="32" rx="15" class="bad"/>
  <text x="442.5" y="235" class="badt" text-anchor="middle">순환 대기 — 1은 b를, 2는 a를 기다림</text>
  <rect x="10" y="278" width="740" height="268" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="310" class="h">id 순서로 정렬 — 둘 다 a부터 잠금</text>
  <text x="730" y="310" class="code" text-anchor="end">a.id &lt; b.id</text>
  <text x="220" y="336" class="step" text-anchor="middle">1단계</text>
  <text x="360" y="336" class="step" text-anchor="middle">2단계</text>
  <text x="500" y="336" class="step" text-anchor="middle">3단계</text>
  <text x="640" y="336" class="step" text-anchor="middle">4단계</text>
  <line x1="160" y1="344" x2="722" y2="344" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="376" class="lane">스레드 1</text>
  <text x="30" y="394" class="sub">transfer(a, b)</text>
  <rect x="150" y="354" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="356" width="116" height="48" rx="8" class="hold"/>
  <text x="220" y="376" class="op" text-anchor="middle">lock(a)</text>
  <text x="220" y="395" class="val" text-anchor="middle">a 쥠</text>
  <rect x="302" y="356" width="116" height="48" rx="8" class="hold"/>
  <text x="360" y="376" class="op" text-anchor="middle">lock(b)</text>
  <text x="360" y="395" class="val" text-anchor="middle">b 쥠</text>
  <rect x="442" y="356" width="116" height="48" rx="8" class="ok"/>
  <text x="500" y="376" class="okc" text-anchor="middle">unlock</text>
  <text x="500" y="395" class="val" text-anchor="middle">a, b 해제</text>
  <text x="30" y="436" class="lane">스레드 2</text>
  <text x="30" y="454" class="sub">transfer(b, a)</text>
  <rect x="150" y="414" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="424" width="396" height="32" rx="6" class="wait"/>
  <text x="360" y="445" class="waitt" text-anchor="middle">lock(a) 대기 — 쥔 락이 없음</text>
  <rect x="582" y="416" width="116" height="48" rx="8" class="ok"/>
  <text x="640" y="436" class="okc" text-anchor="middle">lock(a, b)</text>
  <text x="640" y="455" class="val" text-anchor="middle">차례로 획득</text>
  <line x1="540" y1="404" x2="598" y2="415" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="150" y="482" width="585" height="32" rx="15" class="ok"/>
  <text x="442.5" y="503" class="okt" text-anchor="middle">원이 생기지 않음 — 기다리는 쪽이 아무 락도 쥐지 않음</text>
</svg>
