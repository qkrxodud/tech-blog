<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>EntityManagerFactory와 EntityManager를 만들고 트랜잭션을 시작한 뒤 member를 persist하고, 정상이면 commit, 예외가 나면 rollback한 다음 finally에서 em.close, 마지막에 emf.close를 호출하는 JpaMain 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .m { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="372" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="352" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">JpaMain 실행 흐름 — 트랜잭션 안에서 저장하고 항상 close한다</text>
  <rect x="30" y="62" width="220" height="56" rx="8" class="box"/>
  <text x="140" y="86" class="t" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">EntityManagerFactory</tspan> 생성</text>
  <text x="140" y="105" class="val" text-anchor="middle">애플리케이션에서 한 개</text>
  <rect x="270" y="62" width="220" height="56" rx="8" class="box"/>
  <text x="380" y="86" class="t" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">EntityManager</tspan> 생성</text>
  <text x="380" y="105" class="val" text-anchor="middle">하나의 단위마다</text>
  <rect x="510" y="62" width="220" height="56" rx="8" class="hold"/>
  <text x="620" y="86" class="t" text-anchor="middle">트랜잭션 시작</text>
  <text x="620" y="105" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">tx.begin()</tspan></text>
  <line x1="250" y1="90" x2="264" y2="90" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="490" y1="90" x2="504" y2="90" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <path d="M620,118 L620,138 L130,138 L130,176" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="30" y="182" width="200" height="56" rx="8" class="box"/>
  <text x="130" y="206" class="t" text-anchor="middle">회원 저장</text>
  <text x="130" y="225" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">em.persist(member)</tspan></text>
  <rect x="290" y="152" width="190" height="52" rx="8" class="ok"/>
  <text x="385" y="174" class="okt" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">tx.commit()</tspan></text>
  <text x="385" y="193" class="val" text-anchor="middle">DB에 insert 완료</text>
  <rect x="290" y="218" width="190" height="52" rx="8" class="bad"/>
  <text x="385" y="240" class="badt" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">tx.rollback()</tspan></text>
  <text x="385" y="259" class="val" text-anchor="middle">도중에 에러가 나면</text>
  <line x1="230" y1="200" x2="284" y2="180" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="230" y1="220" x2="284" y2="242" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="258" y="172" class="gnote" text-anchor="middle">정상</text>
  <text x="258" y="262" class="note" text-anchor="middle">예외</text>
  <rect x="540" y="182" width="190" height="56" rx="8" class="hold"/>
  <text x="635" y="206" class="t" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">em.close()</tspan></text>
  <text x="635" y="225" class="val" text-anchor="middle">finally에서 항상 호출</text>
  <line x1="480" y1="178" x2="534" y2="200" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="480" y1="244" x2="534" y2="222" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="540" y="278" width="190" height="52" rx="8" class="hold"/>
  <text x="635" y="300" class="t" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">emf.close()</tspan></text>
  <text x="635" y="319" class="val" text-anchor="middle">애플리케이션 종료 시</text>
  <line x1="635" y1="238" x2="635" y2="272" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="30" y="346" class="foot">JPA의 데이터 변경은 트랜잭션 안에서 실행하고, 사용이 끝나면 close한다</text>
</svg>
