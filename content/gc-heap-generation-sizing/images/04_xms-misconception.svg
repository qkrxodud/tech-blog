<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>-Xms를 heap 앞부분으로 보는 잘못된 그림과, -Xmx로 예약한 범위 안에서 young 500m와 old 1000m를 generation별로 커밋하는 실제 그림</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .lane2 { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .used { fill: #e5e7eb; stroke: none; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="452" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="190" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <rect x="10" y="216" width="740" height="220" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">잘못 이해하기 쉬운 그림 — -Xms가 heap의 앞부분?</text>
  <text x="30" y="72" class="lane2">-Xmx3g -Xms1500m</text>
  <rect x="150" y="96" width="278.3" height="52" rx="3" class="hold"/>
  <text x="289.1" y="127.0" class="op" text-anchor="middle">처음부터 쓰는 1500m</text>
  <rect x="428.3" y="96" width="291.7" height="52" rx="3" class="wait"/>
  <text x="574.1" y="127.0" class="waitt" text-anchor="middle">나중에 이어서 늘림</text>
  <path d="M 150 152 L 150 160 L 428.3 160 L 428.3 152" class="al"/>
  <text x="289.15" y="176" class="sub" text-anchor="middle">-Xms1500m</text>
  <rect x="560" y="58" width="170" height="28" rx="14" class="bad"/>
  <text x="645" y="77" class="badt" text-anchor="middle">이렇게 동작하지 않음</text>
  <text x="30" y="248" class="h">실제 동작 — 예약은 -Xmx, 커밋은 generation별로</text>
  <path d="M 150 290 L 150 282 L 340.0 282 L 340.0 290" class="al"/>
  <text x="245.0" y="274" class="sub" text-anchor="middle">max young = 1g (예약)</text>
  <path d="M 340.0 290 L 340.0 282 L 720 282 L 720 290" class="al"/>
  <text x="530.0" y="274" class="sub" text-anchor="middle">max old = 2g (예약)</text>
  <rect x="150" y="298" width="92.8" height="52" rx="3" class="ok"/>
  <text x="196.4" y="329.0" class="okt" text-anchor="middle">500m</text>
  <rect x="242.8" y="298" width="97.2" height="52" rx="3" class="wait"/>
  <rect x="340.0" y="298" width="185.5" height="52" rx="3" class="ok"/>
  <text x="432.8" y="329.0" class="okt" text-anchor="middle">1000m</text>
  <rect x="525.5" y="298" width="194.5" height="52" rx="3" class="wait"/>
  <text x="30" y="322" class="lane2">JVM heap</text>
  <text x="30" y="340" class="sub">young | old</text>
  <path d="M 150 354 L 150 362 L 242.8 362 L 242.8 354" class="al"/>
  <path d="M 340.0 354 L 340.0 362 L 525.5 362 L 525.5 354" class="al"/>
  <text x="196.4" y="380" class="sub" text-anchor="middle">init young</text>
  <text x="432.75" y="380" class="sub" text-anchor="middle">init old</text>
  <text x="150" y="412" class="gnote">초록: 커밋된 영역 (500m + 1000m = -Xms1500m)</text>
  <text x="480" y="412" class="sub">점선: 예약만 된 영역</text>

</svg>
