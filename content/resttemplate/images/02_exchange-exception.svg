<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>exchange() 결과가 2xx·3xx 응답이면 예외 없이 200 OK일 때만 UserDTO를 만들고, 4xx면 HttpClientErrorException이 첫 번째 catch에서, 5xx면 HttpServerErrorException이, 타임아웃·연결 실패면 ResourceAccessException이 RuntimeException catch에서 잡혀 userDto가 null로 반환되는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .subc { font-size: 12px; fill: #6b7280; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .valc { font-size: 12.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .lbl { font-size: 12px; font-weight: 700; fill: #6b7280; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="400" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">exchange() 결과 — 응답 상태에 따른 예외와 catch</text>
  <text x="730" y="42" class="code" text-anchor="end">DefaultResponseErrorHandler</text>
  <text x="105" y="72" class="step" text-anchor="middle">exchange() 결과</text>
  <text x="330" y="72" class="step" text-anchor="middle">발생하는 예외</text>
  <text x="605" y="72" class="step" text-anchor="middle">예시 코드의 처리</text>
  <rect x="30" y="84" width="150" height="54" rx="8" class="box"/>
  <text x="105" y="116" class="t" text-anchor="middle">2xx · 3xx 응답</text>
  <rect x="210" y="84" width="240" height="54" rx="8" class="wait"/>
  <text x="330" y="116" class="waitt" text-anchor="middle">예외 없음</text>
  <rect x="480" y="84" width="250" height="54" rx="8" class="ok"/>
  <text x="605" y="106" class="okt" text-anchor="middle">200 OK이면 <tspan font-family="Menlo, Consolas, monospace">UserDTO</tspan> 생성</text>
  <text x="605" y="125" class="val" text-anchor="middle">그 밖의 상태면 null 반환</text>
  <line x1="182" y1="111" x2="207" y2="111" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="452" y1="111" x2="477" y2="111" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="30" y="152" width="150" height="54" rx="8" class="box"/>
  <text x="105" y="184" class="t" text-anchor="middle">4xx 응답</text>
  <rect x="210" y="152" width="240" height="54" rx="8" class="bad"/>
  <text x="330" y="184" class="badc" text-anchor="middle">HttpClientErrorException</text>
  <rect x="480" y="152" width="250" height="54" rx="8" class="box"/>
  <text x="605" y="174" class="t" text-anchor="middle">첫 번째 catch</text>
  <text x="605" y="193" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">log.error</tspan> 후 null 반환</text>
  <line x1="182" y1="179" x2="207" y2="179" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="452" y1="179" x2="477" y2="179" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="30" y="220" width="150" height="54" rx="8" class="box"/>
  <text x="105" y="252" class="t" text-anchor="middle">5xx 응답</text>
  <rect x="210" y="220" width="240" height="54" rx="8" class="bad"/>
  <text x="330" y="252" class="badc" text-anchor="middle">HttpServerErrorException</text>
  <rect x="480" y="220" width="250" height="54" rx="8" class="box"/>
  <text x="605" y="242" class="t" text-anchor="middle">두 번째 catch</text>
  <text x="605" y="261" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">RuntimeException</tspan>으로 잡힘</text>
  <line x1="182" y1="247" x2="207" y2="247" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="452" y1="247" x2="477" y2="247" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="30" y="288" width="150" height="54" rx="8" class="box"/>
  <text x="105" y="320" class="t" text-anchor="middle">타임아웃 · 연결 실패</text>
  <rect x="210" y="288" width="240" height="54" rx="8" class="bad"/>
  <text x="330" y="320" class="badc" text-anchor="middle">ResourceAccessException</text>
  <rect x="480" y="288" width="250" height="54" rx="8" class="box"/>
  <text x="605" y="310" class="t" text-anchor="middle">두 번째 catch</text>
  <text x="605" y="329" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">RuntimeException</tspan>으로 잡힘</text>
  <line x1="182" y1="315" x2="207" y2="315" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="452" y1="315" x2="477" y2="315" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="30" y="374" class="foot">세 예외는 모두 RuntimeException을 상속하므로, 4xx는 첫 번째 catch에서, 5xx와 I/O 오류는</text>
  <text x="30" y="394" class="foot">두 번째 catch에서 잡힙니다. 예외가 발생하면 userDto는 null로 반환됩니다.</text>
</svg>
