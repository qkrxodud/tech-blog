<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>클라이언트가 DNS 서버에 도메인 명을 물어 IP 200.200.200.2를 응답받아 서버에 접속하고, 서버 안에서는 목적 PORT 80, 443, 21로 HTTP, HTTPS, FTP 애플리케이션을 구분하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .m { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .mv { font-size: 12px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="436" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="214" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">DNS — 도메인 명으로 IP를 찾는다</text>
  <rect x="30" y="70" width="140" height="60" rx="8" class="box"/>
  <text x="100" y="105" class="t" text-anchor="middle">클라이언트</text>
  <rect x="270" y="64" width="240" height="72" rx="8" class="hold"/>
  <text x="390" y="88" class="t" text-anchor="middle">DNS 서버</text>
  <text x="390" y="112" class="val" text-anchor="middle">도메인 명 → <tspan font-family="Menlo, Consolas, monospace" style="font-size:12px">200.200.200.2</tspan></text>
  <rect x="600" y="70" width="130" height="60" rx="8" class="ok"/>
  <text x="665" y="96" class="okt" text-anchor="middle">서버</text>
  <text x="665" y="116" class="mv" text-anchor="middle">200.200.200.2</text>
  <line x1="170" y1="86" x2="266" y2="86" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="218" y="78" class="step" text-anchor="middle">1. 도메인 명</text>
  <line x1="270" y1="116" x2="174" y2="116" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="218" y="132" class="step" text-anchor="middle">2. IP 응답</text>
  <polyline points="100,130 100,164 665,164 665,134" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="390" y="182" class="gnote" text-anchor="middle">3. 응답받은 IP로 접속</text>
  <text x="30" y="208" class="foot">서버 IP가 200.200.200.3으로 바뀌어도 DNS의 정보만 바뀌고, 사용자는 같은 도메인 명을 사용합니다.</text>

  <rect x="10" y="240" width="740" height="186" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="272" class="h">PORT — IP로 서버를 찾고 PORT로 애플리케이션을 찾는다</text>
  <rect x="30" y="300" width="230" height="74" rx="8" class="box"/>
  <text x="46" y="322" class="t">패킷</text>
  <text x="46" y="343" class="val">목적 IP: <tspan font-family="Menlo, Consolas, monospace" style="font-size:12px">200.200.200.2</tspan></text>
  <text x="46" y="362" class="val">목적 PORT: <tspan font-family="Menlo, Consolas, monospace" style="font-size:12px">80</tspan></text>
  <rect x="320" y="290" width="410" height="96" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="336" y="310" class="sub">서버 <tspan font-family="Menlo, Consolas, monospace">200.200.200.2</tspan></text>
  <rect x="336" y="320" width="116" height="52" rx="8" class="ok"/>
  <text x="394" y="342" class="okt" text-anchor="middle">HTTP</text>
  <text x="394" y="362" class="mv" text-anchor="middle">PORT 80</text>
  <rect x="466" y="320" width="116" height="52" rx="8" class="box"/>
  <text x="524" y="342" class="t" text-anchor="middle">HTTPS</text>
  <text x="524" y="362" class="mv" text-anchor="middle">PORT 443</text>
  <rect x="596" y="320" width="116" height="52" rx="8" class="box"/>
  <text x="654" y="342" class="t" text-anchor="middle">FTP</text>
  <text x="654" y="362" class="mv" text-anchor="middle">PORT 21</text>
  <line x1="260" y1="346" x2="332" y2="346" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="410" class="foot">목적 IP로 서버에 도착한 패킷은 TCP 세그먼트의 목적 PORT를 보고 해당 애플리케이션으로 전달됩니다.</text>
</svg>
