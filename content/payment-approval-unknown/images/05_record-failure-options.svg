<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 548" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결과 기록에 실패한 결제 — 비교 D는 PG 승인 뒤 기록이 막히면 0.1초씩 쉬며 세 번까지 기록해 보고, 그래도 막히면 결제가 AUTHENTICATED로 남는데 보정이 APPROVAL_UNKNOWN만 보아 PG DONE과 어긋난다. 고른 방식은 AUTHENTICATED도 보정 대상에 넣어 대기 시간 뒤 조회 200 DONE으로 APPROVED가 된다. PG가 5xx로 답한 결제는 502 PAYMENT_GATEWAY_FAILED 뒤 AUTHENTICATED로 남았다가 보정 조회 404로 APPROVAL_FAILED가 된다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #4b5563; }
    .m { font-family: Menlo, Consolas, monospace; }
    .lbl { font-size: 12px; fill: #4b5563; }
    .tab { font-size: 12.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .badt { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .bads { font-size: 12px; fill: #b91c1c; }
    .okt { font-size: 13px; font-weight: 700; fill: #15803d; }
    .oks { font-size: 12px; fill: #15803d; }
    .gt { font-size: 13px; font-weight: 700; fill: #6b7280; }
    .gs { font-size: 12px; fill: #6b7280; }
    .ot { font-size: 13px; font-weight: 700; fill: #b45309; }
    .os { font-size: 12px; fill: #b45309; }
    .o { stroke: #1f2937; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .spine { stroke: #1f2937; stroke-width: 1.5; fill: none; }
    .life { stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .run { stroke-dasharray: 5 4; animation: run 0.9s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -18; } }
    @media (prefers-reduced-motion: reduce) { .run { animation: none; } .anim { display: none; } }
  </style>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="aor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
    <g id="pkt">
      <rect x="-11" y="-8" width="22" height="16" rx="3" fill="#2dd4bf" stroke="#0f766e" stroke-width="1.5"/>
      <path d="M-10,-7 L0,1 L10,-7" fill="none" stroke="#0f766e" stroke-width="1.5"/>
    </g>
    <g id="pkt2">
      <rect x="-11" y="-8" width="22" height="16" rx="3" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/>
      <path d="M-10,-7 L0,1 L10,-7" fill="none" stroke="#c2410c" stroke-width="1.5"/>
    </g>
    <g id="xmark"><circle r="9" fill="#ef4444"/><path d="M-4,-4 L4,4 M4,-4 L-4,4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
    <g id="vmark"><circle r="9" fill="#22c55e"/><path d="M-4.5,0 L-1.5,3.5 L4.5,-3.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="omark"><circle r="9" fill="#f59e0b"/><path d="M-4,0 H4" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g>
    <g id="i-card"><rect x="0" y="3" width="32" height="22" rx="4" fill="#5eead4" class="o"/><rect x="0" y="8" width="32" height="5" fill="#1f2937"/><rect x="4" y="16" width="8" height="6" rx="1.5" fill="#fbbf24" class="o" stroke-width="1"/></g>
    <g id="i-chips"><rect x="0" y="4" width="13" height="14" rx="4" fill="#e5e7eb" class="o"/><rect x="21" y="4" width="13" height="14" rx="4" fill="#86efac" class="o"/><path d="M14,11 h6" class="o" fill="none"/><path d="M17,8 l3,3 l-3,3" class="o" fill="none"/></g>
    <g id="i-plane"><path d="M1,13 L31,1 L23,29 L15,19 Z" fill="#fdba74" class="o"/><path d="M15,19 L31,1 L11,16 Z" fill="#fb923c" class="o"/></g>
    <g id="i-coin"><circle cx="12" cy="12" r="11" fill="#fbbf24" class="o"/><circle cx="12" cy="12" r="7" fill="#fcd34d" stroke="#b45309" stroke-width="1"/><text x="12" y="16.5" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">₩</text></g>
    <g id="i-db"><path d="M1,5 v20 a13,5 0 0 0 26,0 v-20 a13,5 0 0 1 -26,0 z" fill="#60a5fa" class="o"/><path d="M1,15 a13,5 0 0 0 26,0" fill="none" class="o"/><ellipse cx="14" cy="5" rx="13" ry="5" fill="#bfdbfe" class="o"/></g>
    <g id="i-doc"><path d="M0,0 h18 l8,8 v26 h-26 z" fill="#ffffff" class="o"/><path d="M18,0 v8 h8" fill="#e5e7eb" class="o"/><circle cx="20" cy="26" r="8" fill="#22c55e" class="o"/><path d="M16.5,26 l2.5,2.5 l4.5,-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5,10 h9 M5,16 h7" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/></g>
    <g id="i-docx"><path d="M0,0 h18 l8,8 v26 h-26 z" fill="#ffffff" class="o"/><path d="M18,0 v8 h8" fill="#e5e7eb" class="o"/><circle cx="20" cy="26" r="8" fill="#ef4444" class="o"/><path d="M17,23 l6,6 M23,23 l-6,6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><path d="M5,10 h9 M5,16 h7" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/></g>
    <g id="i-server"><rect x="0" y="0" width="36" height="13" rx="3" fill="#cbd5e1" class="o"/><rect x="0" y="16" width="36" height="13" rx="3" fill="#cbd5e1" class="o"/><circle cx="7" cy="6.5" r="2.2" fill="#22c55e"/><circle cx="7" cy="22.5" r="2.2" fill="#22c55e"/><path d="M14,6.5 h16 M14,22.5 h16" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/></g>
    <g id="i-clock"><circle cx="14" cy="14" r="13" fill="#fde68a" class="o"/><path d="M14,7 V14 L20,18" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/></g>
    <g id="i-search"><circle cx="11" cy="11" r="9" fill="#bae6fd" class="o"/><path d="M18,18 L27,27" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/></g>
    <g id="i-undo"><circle cx="14" cy="14" r="13" fill="#fecaca" class="o"/><path d="M8,14 a6,6 0 1 1 6,6" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"/><path d="M5,11 l3,3.5 l3.5,-3" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="i-pause"><circle cx="14" cy="14" r="13" fill="#e5e7eb" class="o"/><path d="M10,8 v12 M18,8 v12" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/></g>
  </defs>
  <rect width="760" height="548" fill="#ffffff"/>
  <text x="24" y="30" class="h">결과 기록에 실패한 결제 — 요청 안 재시도와 보정 대상 넓히기</text>
  <rect x="14" y="58" width="732" height="156" rx="16" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="28" y="45" width="360" height="26" rx="6" fill="#5b7194"/>
  <text x="208.0" y="63" class="tab" text-anchor="middle">비교 D — 요청 안에서 다시 기록, 보정은 결과 모름만</text>
  <rect x="32" y="84" width="166" height="50" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <use href="#i-server" x="42" y="95"/>
  <text x="86" y="105" class="t2" style="font-size: 12.5px">PG 승인</text>
  <text x="86" y="123" class="gs" style="font-size: 12px"><tspan class="m">200</tspan> 승인 남음</text>
  <circle cx="32" cy="84" r="10" fill="#111827"/><text x="32" y="88" class="num" text-anchor="middle">1</text>
  <line x1="198" y1="109" x2="213" y2="109" class="spine" marker-end="url(#ak)"/>
  <rect x="214" y="84" width="166" height="50" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <use href="#i-docx" x="226" y="92"/>
  <text x="268" y="105" class="t2" style="font-size: 12.5px">결과 기록 실패</text>
  <text x="268" y="123" class="bads" style="font-size: 12px">트리거로 저장이 막힘</text>
  <circle cx="214" cy="84" r="10" fill="#111827"/><text x="214" y="88" class="num" text-anchor="middle">2</text>
  <line x1="380" y1="109" x2="395" y2="109" class="spine" marker-end="url(#ak)"/>
  <rect x="396" y="84" width="166" height="50" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <use href="#i-clock" x="406" y="95"/>
  <text x="450" y="105" class="t2" style="font-size: 12.5px">다시 기록</text>
  <text x="450" y="123" class="s" style="font-size: 12px">0.1초씩 쉬며 세 번까지</text>
  <circle cx="396" cy="84" r="10" fill="#111827"/><text x="396" y="88" class="num" text-anchor="middle">3</text>
  <line x1="562" y1="109" x2="577" y2="109" class="spine" marker-end="url(#ak)"/>
  <rect x="578" y="84" width="160" height="50" rx="10" fill="#ece8fb" stroke="#9b88d6" stroke-width="1.5"/>
  <use href="#i-search" x="588" y="94"/>
  <text x="626" y="105" class="t2" style="font-size: 12.5px">보정 대상인가</text>
  <text x="626" y="123" class="bads" style="font-size: 12px">결과 모름만 봄·아니오</text>
  <circle cx="578" cy="84" r="10" fill="#111827"/><text x="578" y="88" class="num" text-anchor="middle">4</text>
  <text x="36" y="160" class="s" style="font-size: 12px">막힘이 풀리지 않아 세 번 모두 실패 → 결제는 인증 기록 트랜잭션이 남긴 상태 그대로, 4에서 대상이 아님</text>
  <rect x="32" y="170" width="706" height="30" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.2"/>
  <use href="#xmark" x="50" y="185"/>
  <text x="66" y="190" class="badt" style="font-size: 12.5px">결제 <tspan class="m">AUTHENTICATED</tspan> · PG <tspan class="m">DONE</tspan> — 어긋남 (12건 측정에서 2건)</text>
  <rect x="14" y="240" width="732" height="156" rx="16" fill="#f3f6fb" stroke="#16a34a" stroke-width="2"/>
  <rect x="28" y="227" width="400" height="26" rx="6" fill="#5b7194"/>
  <text x="228.0" y="245" class="tab" text-anchor="middle">이 장에서 고른 방식 — 오래된 AUTHENTICATED도 보정 대상</text>
  <rect x="32" y="266" width="166" height="50" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <use href="#i-server" x="42" y="277"/>
  <text x="86" y="287" class="t2" style="font-size: 12.5px">PG 승인</text>
  <text x="86" y="305" class="gs" style="font-size: 12px"><tspan class="m">200</tspan> 승인 남음</text>
  <circle cx="32" cy="266" r="10" fill="#111827"/><text x="32" y="270" class="num" text-anchor="middle">1</text>
  <line x1="198" y1="291" x2="213" y2="291" class="spine" marker-end="url(#ak)"/>
  <rect x="214" y="266" width="166" height="50" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <use href="#i-docx" x="226" y="274"/>
  <text x="268" y="287" class="t2" style="font-size: 12.5px">결과 기록 실패</text>
  <text x="268" y="305" class="bads" style="font-size: 12px">인증 상태에 머묾</text>
  <circle cx="214" cy="266" r="10" fill="#111827"/><text x="214" y="270" class="num" text-anchor="middle">2</text>
  <line x1="380" y1="291" x2="395" y2="291" class="spine" marker-end="url(#ak)"/>
  <rect x="396" y="266" width="166" height="50" rx="10" fill="#ece8fb" stroke="#9b88d6" stroke-width="1.5"/>
  <use href="#i-search" x="406" y="276"/>
  <text x="450" y="287" class="t2" style="font-size: 12.5px">보정 대상인가</text>
  <text x="450" y="305" class="oks" style="font-size: 12px">대기 시간 뒤 · 예</text>
  <circle cx="396" cy="266" r="10" fill="#111827"/><text x="396" y="270" class="num" text-anchor="middle">3</text>
  <line x1="562" y1="291" x2="577" y2="291" class="spine" marker-end="url(#ak)"/>
  <rect x="578" y="266" width="160" height="50" rx="10" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <use href="#i-plane" x="587" y="276"/>
  <text x="632" y="287" class="t2" style="font-size: 12.5px">PG 조회</text>
  <text x="632" y="305" class="s" style="font-size: 12px"><tspan class="m">200 DONE</tspan></text>
  <circle cx="578" cy="266" r="10" fill="#111827"/><text x="578" y="270" class="num" text-anchor="middle">4</text>
  <text x="36" y="342" class="s" style="font-size: 12px">대상 상태: <tspan class="m">APPROVAL_UNKNOWN</tspan>, <tspan class="m">AUTHENTICATED</tspan> — 기록을 막던 문제가 풀린 뒤 PG 기록에서 결과를 다시 얻음</text>
  <rect x="32" y="352" width="706" height="30" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.2"/>
  <use href="#vmark" x="50" y="367"/>
  <text x="66" y="372" class="okt" style="font-size: 12.5px">결제 <tspan class="m">APPROVED</tspan> · PG <tspan class="m">DONE</tspan> — 짝이 맞음</text>
  <rect x="14" y="422" width="732" height="112" rx="16" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="28" y="409" width="230" height="26" rx="6" fill="#5b7194"/>
  <text x="143.0" y="427" class="tab" text-anchor="middle">같은 대상에 들어가는 5xx 결제</text>
  <rect x="32" y="448" width="166" height="50" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <use href="#i-server" x="42" y="459"/>
  <text x="86" y="469" class="t2" style="font-size: 12.5px">PG 5xx 오류</text>
  <text x="86" y="487" class="gs" style="font-size: 12px">승인·거절 기록 없음</text>
  <circle cx="32" cy="448" r="10" fill="#111827"/><text x="32" y="452" class="num" text-anchor="middle">1</text>
  <line x1="198" y1="473" x2="213" y2="473" class="spine" marker-end="url(#ak)"/>
  <rect x="214" y="448" width="166" height="50" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#i-docx" x="226" y="456"/>
  <text x="268" y="469" class="t2" style="font-size: 12.5px">응답 <tspan class="m">502</tspan></text>
  <text x="268" y="487" class="bads" style="font-size: 12px">처리하지 못했다고 답</text>
  <circle cx="214" cy="448" r="10" fill="#111827"/><text x="214" y="452" class="num" text-anchor="middle">2</text>
  <line x1="380" y1="473" x2="395" y2="473" class="spine" marker-end="url(#ak)"/>
  <rect x="396" y="448" width="166" height="50" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <use href="#i-chips" x="406" y="462"/>
  <text x="450" y="469" class="t2" style="font-size: 12.5px">결제 상태</text>
  <text x="450" y="487" class="s" style="font-size: 12px">인증 상태 그대로</text>
  <circle cx="396" cy="448" r="10" fill="#111827"/><text x="396" y="452" class="num" text-anchor="middle">3</text>
  <line x1="562" y1="473" x2="577" y2="473" class="spine" marker-end="url(#ak)"/>
  <rect x="578" y="448" width="160" height="50" rx="10" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <use href="#i-plane" x="587" y="458"/>
  <text x="632" y="469" class="t2" style="font-size: 12.5px">보정 조회</text>
  <text x="632" y="487" class="s" style="font-size: 12px"><tspan class="m">404</tspan> → 승인 실패</text>
  <circle cx="578" cy="448" r="10" fill="#111827"/><text x="578" y="452" class="num" text-anchor="middle">4</text>
  <text x="36" y="524" class="gs" style="font-size: 12px">502는 <tspan class="m">PAYMENT_GATEWAY_FAILED</tspan>. Mock PG에 기록이 없어 보정 조회가 <tspan class="m">404 NOT_FOUND_PAYMENT</tspan>를 받고 <tspan class="m">APPROVAL_FAILED</tspan>로 닫힘</text>
</svg>
