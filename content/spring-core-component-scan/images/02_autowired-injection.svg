<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>MemberServiceImpl 생성자의 MemberRepository에는 memoryMemberRepository가, OrderServiceImpl 생성자의 두 파라미터에는 memoryMemberRepository와 rateDiscountPolicy가 타입으로 조회되어 주입되는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .okms { font-size: 12px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .chip { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .gscope { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .dim { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dimt { font-size: 12.5px; fill: #9ca3af; font-family: Menlo, Consolas, monospace; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .tag { font-size: 11.5px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="390" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="370" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">@Autowired 의존관계 자동 주입 — 파라미터 타입으로 빈을 찾아 주입</text>
  <rect x="30" y="70" width="310" height="100" rx="8" class="box"/>
  <text x="50" y="96" class="mb">MemberServiceImpl</text>
  <text x="330" y="96" class="sub" text-anchor="end">생성자 파라미터</text>
  <rect x="50" y="112" width="270" height="40" rx="6" class="chip"/>
  <text x="185" y="137" class="m" text-anchor="middle">MemberRepository</text>
  <rect x="30" y="190" width="310" height="150" rx="8" class="box"/>
  <text x="50" y="216" class="mb">OrderServiceImpl</text>
  <text x="330" y="216" class="sub" text-anchor="end">생성자 파라미터</text>
  <rect x="50" y="232" width="270" height="40" rx="6" class="chip"/>
  <text x="185" y="257" class="m" text-anchor="middle">MemberRepository</text>
  <rect x="50" y="284" width="270" height="40" rx="6" class="chip"/>
  <text x="185" y="309" class="m" text-anchor="middle">DiscountPolicy</text>
  <rect x="470" y="70" width="260" height="270" rx="10" class="scope"/>
  <text x="490" y="96" class="t">스프링 컨테이너</text>
  <rect x="490" y="112" width="220" height="56" rx="8" class="ok"/>
  <text x="600" y="136" class="okm" text-anchor="middle">memoryMemberRepository</text>
  <text x="600" y="156" class="sub" text-anchor="middle">MemberRepository 타입</text>
  <rect x="490" y="270" width="220" height="56" rx="8" class="ok"/>
  <text x="600" y="294" class="okm" text-anchor="middle">rateDiscountPolicy</text>
  <text x="600" y="314" class="sub" text-anchor="middle">DiscountPolicy 타입</text>
  <text x="406" y="118" class="gnote" text-anchor="middle">타입으로 찾아 주입</text>
  <line x1="488" y1="136" x2="324" y2="132" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="488" y1="150" x2="324" y2="250" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="488" y1="298" x2="324" y2="304" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="366" class="foot"><tspan font-family="Menlo, Consolas, monospace">getBean(MemberRepository.class)</tspan>로 꺼내는 것과 같고, 파라미터가 여러 개여도 각각 찾아 주입합니다.</text>
</svg>
