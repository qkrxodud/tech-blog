  <text x="204" y="215" class="s2" style="fill:#15803d;font-size:11px">해제가 같은 예약 줄을</text><text x="204" y="231" class="s2" style="fill:#15803d;font-size:11px">기다렸다 돌려줌</text>
  <text x="360" y="228" class="okt" text-anchor="end">재고 5</text>
