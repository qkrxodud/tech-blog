<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>지표 수집, 정규화, 가중합산, ReadinessScore 계산, 임계값 비교, 신호 결정, AutoSignalLog 저장, 텔레그램 알림으로 이어지는 신호 생성 흐름과 임계값에 따른 BUY, HOLD, SELL 구간</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="436" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="220" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">신호 생성 흐름 — 지표 수집에서 텔레그램 알림까지</text>
  <rect x="30" y="66" width="150" height="48" rx="8" class="box"/>
  <text x="105" y="86" class="db" text-anchor="middle">지표 수집</text>
  <text x="105" y="105" class="val" text-anchor="middle">16개 외부 API</text>
  <line x1="182" y1="90" x2="211" y2="90" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="215" y="66" width="150" height="48" rx="8" class="box"/>
  <text x="290" y="86" class="db" text-anchor="middle">정규화</text>
  <text x="290" y="105" class="val" text-anchor="middle">0~100 스케일링</text>
  <line x1="367" y1="90" x2="396" y2="90" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="400" y="66" width="150" height="48" rx="8" class="box"/>
  <text x="475" y="95" class="db" text-anchor="middle">가중합산</text>
  <line x1="552" y1="90" x2="581" y2="90" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="585" y="66" width="150" height="48" rx="8" class="box"/>
  <text x="660" y="86" class="db" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">ReadinessScore</tspan></text>
  <text x="660" y="105" class="val" text-anchor="middle">계산</text>
  <path d="M660,114 L660,132 L105,132 L105,150" fill="none" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="30" y="152" width="150" height="48" rx="8" class="box"/>
  <text x="105" y="172" class="db" text-anchor="middle">임계값 비교</text>
  <text x="105" y="191" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">AutoTradePolicy</tspan></text>
  <line x1="182" y1="176" x2="211" y2="176" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="215" y="152" width="150" height="48" rx="8" class="hold"/>
  <text x="290" y="172" class="db" text-anchor="middle">신호 결정</text>
  <text x="290" y="191" class="val" text-anchor="middle">BUY·SELL·HOLD·SKIP</text>
  <line x1="367" y1="176" x2="396" y2="176" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="400" y="152" width="150" height="48" rx="8" class="box"/>
  <text x="475" y="172" class="db" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">AutoSignalLog</tspan></text>
  <text x="475" y="191" class="val" text-anchor="middle">DB 저장</text>
  <line x1="552" y1="176" x2="581" y2="176" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="585" y="152" width="150" height="48" rx="8" class="box"/>
  <text x="660" y="172" class="db" text-anchor="middle">텔레그램</text>
  <text x="660" y="191" class="val" text-anchor="middle">알림 발송</text>
  <text x="30" y="218" class="sub">16개 외부 API에서 수집한 지표를 0~100으로 정규화해 가중합산한 ReadinessScore를 임계값과 비교합니다</text>
  <rect x="10" y="246" width="740" height="180" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="278" class="h">임계값 비교 — <tspan font-family="Menlo, Consolas, monospace">determineSignal()</tspan></text>
  <rect x="150" y="306" width="180" height="40" rx="6" class="bad"/>
  <rect x="330" y="306" width="200" height="40" rx="0" class="hold"/>
  <rect x="530" y="306" width="180" height="40" rx="6" class="ok"/>
  <text x="240" y="331" class="badc" text-anchor="middle">SELL</text>
  <text x="430" y="331" class="op" text-anchor="middle">HOLD</text>
  <text x="620" y="331" class="okc" text-anchor="middle">BUY</text>
  <line x1="330" y1="298" x2="330" y2="354" stroke="#6b7280" stroke-width="1.4"/>
  <line x1="530" y1="298" x2="530" y2="354" stroke="#6b7280" stroke-width="1.4"/>
  <text x="330" y="372" class="code" text-anchor="middle">exitThreshold</text>
  <text x="530" y="372" class="code" text-anchor="middle">entryThreshold</text>
  <text x="30" y="331" class="sub">점수</text>
  <text x="150" y="296" class="step">낮음</text>
  <text x="710" y="296" class="step" text-anchor="end">높음</text>
  <text x="150" y="402" class="sub">청산 임계값 이하면 SELL, 진입 임계값 이상이면 BUY, 그 사이는 HOLD — 임계값은 DB에 저장된 설정값</text>
</svg>
