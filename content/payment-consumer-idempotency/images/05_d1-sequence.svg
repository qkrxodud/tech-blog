  <text x="24" y="28" class="h">결정 1 — 번호를 남기는 일과 주문 변경을 한 트랜잭션에</text>
  <text x="24" y="48" class="gs" style="font-size:11.5px"><tspan class="m">OrderPaymentService.apply</tspan> 코드 순서 · 같은 결제 결과가 두 번 옴(첫 봉투 → 둘째 봉투)</text>
