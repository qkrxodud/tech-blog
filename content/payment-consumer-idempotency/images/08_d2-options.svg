<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 572" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 2 선택지 비교 — 주문 서비스에서 취소(번호 큼, 0.2초 뒤)가 먼저 반영된 뒤 옛 승인이 늦게 오면 번호 비교(이 장에서 고름)와 만든 시각 비교는 승인을 무시해 취소를 유지하고, 거르지 않음은 PAID로 되돌아감. 시계가 0.3초 늦은 서버 B가 0.2초 뒤 남긴 취소(찍힌 시각 t−0.1초)는 번호 비교와 거르지 않음이 반영하고 만든 시각 비교는 옛 결과로 무시해 PAID로 남음. 실패 모음에서 다시 넣은 옛 승인이 더 새 취소 뒤에 오면 번호와 시각 비교는 무시하고 거르지 않음은 PAID로 되돌아감. 11장 계약 실패는 0개, 1개(시계 계약), 2개(늦은·다시 넣은 옛 승인)이고, 재고 서비스는 명령에 만든 시각이 없어 시각 비교를 만들지 않았으며 옛 명령을 거르지 않는 비교도 12개 모두 통과해 넣기 전후의 차이가 없었던 그림</title>
