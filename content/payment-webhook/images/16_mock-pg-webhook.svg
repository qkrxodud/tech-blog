<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 526" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>Mock PG의 웹훅 — 결제 상태가 승인 DONE, 거절 ABORTED, 취소 PARTIAL_CANCELED·CANCELED로 바뀌면 PAYMENT_STATUS_CHANGED를 POST로 보내고, 본문은 eventType, createdAt(yyyy-MM-ddTHH:mm:ss.SSSSSS), 결제 조회 응답과 같은 모양의 data이며 eventId는 없음. 10초 안에 200으로 답하면 성공이고, 아니면 7번까지 다시 보냄. 실제 재전송 간격은 1, 4, 16, 64, 256, 1024, 4096분(최초 전송으로부터 3일 19시간까지)이고 테스트는 횟수만 같게 두고 100ms로 줄임. 문서로 확인하지 못해 Mock PG의 가정으로 둔 것은 알림 순서(바뀐 순서대로 바로 보내고 테스트에서만 쌓아 두었다가 순서를 바꿔 0.1초씩 띄워 보냄), 다시 보내는 본문이 처음과 같음(createdAt도), createdAt은 한국 시각, 서명과 transmission 헤더를 붙이지 않음. 시험용 조작으로 알림 쌓아 두기와 순서 바꿔 보내기, 같은 본문 두 번, 늦게 보내기, 같은 상태 다시, 위조 알림, 승인 답만 붙잡기, PG에서만 일어나는 취소를 둠</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #4b5563; }
    .m { font-family: Menlo, Consolas, monospace; }
    .lbl { font-size: 12px; fill: #4b5563; }
    .tab { font-size: 12.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .badt { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .bads { font-size: 12px; fill: #b91c1c; }
    .okt { font-size: 13px; font-weight: 700; fill: #15803d; }
    .oks { font-size: 12px; fill: #15803d; }
    .gt { font-size: 13px; font-weight: 700; fill: #6b7280; }
    .gs { font-size: 12px; fill: #6b7280; }
    .ot { font-size: 13px; font-weight: 700; fill: #c2410c; }
    .os { font-size: 12px; fill: #c2410c; }
    .bt { font-size: 13px; font-weight: 700; fill: #1e3a8a; }
    .bs { font-size: 12px; fill: #1e3a8a; }
    .o { stroke: #1f2937; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .spine { stroke: #1f2937; stroke-width: 1.5; fill: none; }
    .life { stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .run { stroke-dasharray: 5 4; animation: run 0.9s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -18; } }
    @media (prefers-reduced-motion: reduce) { .run { animation: none; } .anim { display: none; } }
  </style>
