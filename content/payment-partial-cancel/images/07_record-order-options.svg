<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 614" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>기록과 PG 호출 순서 비교 — 비교 C는 받을 수 있는 취소인지 확인만 하고 되돌린 뒤 PG에 취소를 보내, 1초에 시간 초과로 504가 나도 DB에 남은 것이 없고 PG는 1.5초에 취소를 DONE으로 남겨 잔액 10000원이 되며, 보정은 대상 결제가 없어 조회하지 않아 우리 남은 금액 15000원과 PG 잔액 10000원이 어긋난다. 이 장에서 고른 방식은 REQUESTED와 requested_at을 먼저 커밋한 뒤 PG를 부르고, 시간 초과 때 UNKNOWN을 커밋하고 504로 답하며, 대기 시간 뒤 보정이 주문번호로 조회해 cancels의 같은 금액 5000원 취소와 짝지어 DONE으로 닫아 남은 10000원이 PG 잔액과 같다</title>
