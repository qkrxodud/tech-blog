<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>같은 시각에 저장된 캐시가 한꺼번에 만료되자 요청 1, 2, N이 모두 cache miss로 DB를 조회해 캐시를 갱신하려 하면서 DB 부하가 급증하고 모든 요청의 응답이 지연되는 캐시 스템피드 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .subc { font-size: 12px; fill: #6b7280; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .valc { font-size: 12.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .lbl { font-size: 12px; font-weight: 700; fill: #6b7280; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="410" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="390" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">캐시 스템피드 — 한꺼번에 만료된 캐시로 요청이 DB에 몰림</text>
  <text x="220" y="68" class="step" text-anchor="middle">만료 전</text>
  <text x="360" y="68" class="step" text-anchor="middle">동시에 만료</text>
  <text x="500" y="68" class="step" text-anchor="middle">모두 DB 조회</text>
  <text x="640" y="68" class="step" text-anchor="middle">과부하</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">요청 1</text>
  <text x="30" y="126" class="sub">사용자 요청</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="162.0" y="88" width="116" height="48" rx="8" class="ok"/>
  <text x="220" y="108" class="okc" text-anchor="middle">cache hit</text>
  <text x="220" y="127" class="val" text-anchor="middle">Redis 응답</text>
  <rect x="302.0" y="88" width="116" height="48" rx="8" class="bad"/>
  <text x="360" y="108" class="badc" text-anchor="middle">cache miss</text>
  <text x="360" y="127" class="val" text-anchor="middle">캐시 없음</text>
  <rect x="442.0" y="88" width="116" height="48" rx="8" class="bad"/>
  <text x="500" y="108" class="badt" text-anchor="middle">DB 조회</text>
  <text x="500" y="127" class="val" text-anchor="middle">캐시 갱신 시도</text>
  <rect x="582.0" y="88" width="116" height="48" rx="8" class="bad"/>
  <text x="640" y="108" class="badt" text-anchor="middle">응답 지연</text>
  <text x="640" y="127" class="val" text-anchor="middle">DB 대기</text>
  <text x="30" y="168" class="lane">요청 2</text>
  <text x="30" y="186" class="sub">사용자 요청</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="162.0" y="148" width="116" height="48" rx="8" class="ok"/>
  <text x="220" y="168" class="okc" text-anchor="middle">cache hit</text>
  <text x="220" y="187" class="val" text-anchor="middle">Redis 응답</text>
  <rect x="302.0" y="148" width="116" height="48" rx="8" class="bad"/>
  <text x="360" y="168" class="badc" text-anchor="middle">cache miss</text>
  <text x="360" y="187" class="val" text-anchor="middle">캐시 없음</text>
  <rect x="442.0" y="148" width="116" height="48" rx="8" class="bad"/>
  <text x="500" y="168" class="badt" text-anchor="middle">DB 조회</text>
  <text x="500" y="187" class="val" text-anchor="middle">캐시 갱신 시도</text>
  <rect x="582.0" y="148" width="116" height="48" rx="8" class="bad"/>
  <text x="640" y="168" class="badt" text-anchor="middle">응답 지연</text>
  <text x="640" y="187" class="val" text-anchor="middle">DB 대기</text>
  <text x="30" y="228" class="lane">요청 N</text>
  <text x="30" y="246" class="sub">사용자 요청</text>
  <rect x="150" y="206" width="585" height="52" rx="6" class="track"/>
  <rect x="162.0" y="208" width="116" height="48" rx="8" class="ok"/>
  <text x="220" y="228" class="okc" text-anchor="middle">cache hit</text>
  <text x="220" y="247" class="val" text-anchor="middle">Redis 응답</text>
  <rect x="302.0" y="208" width="116" height="48" rx="8" class="bad"/>
  <text x="360" y="228" class="badc" text-anchor="middle">cache miss</text>
  <text x="360" y="247" class="val" text-anchor="middle">캐시 없음</text>
  <rect x="442.0" y="208" width="116" height="48" rx="8" class="bad"/>
  <text x="500" y="228" class="badt" text-anchor="middle">DB 조회</text>
  <text x="500" y="247" class="val" text-anchor="middle">캐시 갱신 시도</text>
  <rect x="582.0" y="208" width="116" height="48" rx="8" class="bad"/>
  <text x="640" y="228" class="badt" text-anchor="middle">응답 지연</text>
  <text x="640" y="247" class="val" text-anchor="middle">DB 대기</text>
  <text x="30" y="295" class="db">캐시</text>
  <rect x="175" y="274" width="90" height="32" rx="6" class="dbbox"/>
  <text x="220" y="295" class="db" text-anchor="middle">유효</text>
  <rect x="315" y="274" width="90" height="32" rx="6" class="bad"/>
  <text x="360" y="295" class="badt" text-anchor="middle">만료</text>
  <rect x="455" y="274" width="90" height="32" rx="6" class="bad"/>
  <text x="500" y="295" class="badt" text-anchor="middle">갱신 중</text>
  <rect x="595" y="274" width="90" height="32" rx="6" class="bad"/>
  <text x="640" y="295" class="badt" text-anchor="middle">갱신 중</text>
  <text x="30" y="337" class="db">DB 부하</text>
  <rect x="175" y="316" width="90" height="32" rx="6" class="dbbox"/>
  <text x="220" y="337" class="db" text-anchor="middle">낮음</text>
  <rect x="315" y="316" width="90" height="32" rx="6" class="dbbox"/>
  <text x="360" y="337" class="db" text-anchor="middle">낮음</text>
  <rect x="455" y="316" width="90" height="32" rx="6" class="bad"/>
  <text x="500" y="337" class="badt" text-anchor="middle">급증</text>
  <rect x="595" y="316" width="90" height="32" rx="6" class="bad"/>
  <text x="640" y="337" class="badt" text-anchor="middle">과부하</text>
  <text x="150" y="378" class="note">과부하가 걸린 서버는 모든 클라이언트의 데이터 검색 속도를 저하시킵니다.</text>
</svg>
