<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>Metaspace는 VirtualSpaceNode의 리스트인 VirtualSpaceList로 관리되고, 각 node는 크기가 다른 chunk로 나뉘어 A, B classloader에 할당된다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
    .monob { font-family: Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #1f2937; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .sep { stroke: #9ca3af; stroke-width: 1; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="380" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">VirtualSpaceList — node를 chunk로 나눠 classloader에 할당</text>
  <path d="M 40 82 L 40 74 L 720 74 L 720 82" class="al"/>
  <text x="380" y="68" class="mono" text-anchor="middle">VirtualSpaceList</text>
  <rect x="40" y="118" width="190" height="60" rx="6" class="box"/>
  <rect x="44" y="122" width="182" height="52" rx="4" class="ok"/>
  <text x="135.0" y="146.0" class="okt" text-anchor="middle">A</text>
  <text x="135.0" y="163.0" class="sub" text-anchor="middle">chunk</text>
  <text x="135.0" y="110" class="mono" text-anchor="middle">VirtualSpaceNode</text>
  <rect x="275" y="118" width="215" height="60" rx="6" class="box"/>
  <rect x="279" y="122" width="62" height="52" rx="4" class="ok"/>
  <text x="310.0" y="146.0" class="okt" text-anchor="middle">A</text>
  <text x="310.0" y="163.0" class="sub" text-anchor="middle">chunk</text>
  <rect x="349" y="122" width="52" height="52" rx="4" class="ok"/>
  <text x="375.0" y="146.0" class="okt" text-anchor="middle">A</text>
  <text x="375.0" y="163.0" class="sub" text-anchor="middle">chunk</text>
  <rect x="409" y="122" width="77" height="52" rx="4" class="hold"/>
  <text x="447.5" y="146.0" class="t" text-anchor="middle">B</text>
  <text x="447.5" y="163.0" class="sub" text-anchor="middle">chunk</text>
  <text x="382.5" y="110" class="mono" text-anchor="middle">VirtualSpaceNode</text>
  <rect x="535" y="118" width="185" height="60" rx="6" class="box"/>
  <rect x="539" y="122" width="102" height="52" rx="4" class="hold"/>
  <text x="590.0" y="146.0" class="t" text-anchor="middle">B</text>
  <text x="590.0" y="163.0" class="sub" text-anchor="middle">chunk</text>
  <rect x="649" y="122" width="67" height="52" rx="4" class="hold"/>
  <text x="682.5" y="146.0" class="t" text-anchor="middle">B</text>
  <text x="682.5" y="163.0" class="sub" text-anchor="middle">chunk</text>
  <text x="627.5" y="110" class="mono" text-anchor="middle">VirtualSpaceNode</text>
  <line x1="232" y1="140" x2="272" y2="140" class="al" marker-end="url(#ar)"/>
  <line x1="272" y1="156" x2="232" y2="156" class="al" marker-end="url(#ar)"/>
  <line x1="492" y1="140" x2="532" y2="140" class="al" marker-end="url(#ar)"/>
  <line x1="532" y1="156" x2="492" y2="156" class="al" marker-end="url(#ar)"/>
  <rect x="150" y="250" width="160" height="40" rx="8" class="ok"/>
  <text x="230" y="275" class="okt" text-anchor="middle">A classloader</text>
  <rect x="480" y="250" width="160" height="40" rx="8" class="hold"/>
  <text x="560" y="275" class="t" text-anchor="middle">B classloader</text>
  <line x1="200" y1="248" x2="140" y2="182" class="gl" marker-end="url(#agr)"/>
  <line x1="230" y1="248" x2="310" y2="182" class="gl" marker-end="url(#agr)"/>
  <line x1="250" y1="248" x2="370" y2="182" class="gl" marker-end="url(#agr)"/>
  <line x1="520" y1="248" x2="448" y2="182" class="al" marker-end="url(#ar)"/>
  <line x1="570" y1="248" x2="590" y2="182" class="al" marker-end="url(#ar)"/>
  <line x1="600" y1="248" x2="670" y2="182" class="al" marker-end="url(#ar)"/>
  <text x="40" y="326" class="val">각 node는 mmap으로 잡은 하나의 연속된 주소 공간이고, chunk 단위로 나뉘어 관리됩니다.</text>
  <text x="40" y="348" class="val">한 node 안에서도 A와 B의 chunk가 섞일 수 있고, chunk 크기는 서로 다릅니다.</text>
  <text x="40" y="370" class="val">classloader는 자기에게 할당된 chunk에 자신이 로딩한 클래스의 metadata를 저장합니다.</text>
</svg>
