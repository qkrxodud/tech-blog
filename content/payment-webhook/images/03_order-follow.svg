<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 636" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>순서가 바뀐 알림 — 결과 모름 결제를 PG가 승인한 뒤 전액 취소했고 취소 알림이 승인 알림보다 먼저 올 때, 결제 서버는 PG에 다시 조회해 CANCELED와 취소 이력 1건을 읽고, 승인 결과를 기다리는 결제라 hasApproval로 approve()해 APPROVED가 된 뒤, 승인이 남은 결제라 모르는 transactionKey의 PG 취소를 들여와 남은 0원으로 APPROVAL_CANCELED가 된다. 늦게 온 승인 알림은 다시 조회해도 이미 지난 상태라 아무것도 하지 않는다. 비교 B처럼 CANCELED를 취소 행위 하나로 바꿔 전이 표로 거부하면 결과 모름에서는 표에 없어 두 알림 모두 409로 답하고 결제는 결과 모름으로 남는다</title>
