  <rect width="760" height="500" fill="#ffffff"/>
  <text x="24" y="30" class="h">금액이 0 이하인 준비 — 요청에서 막을까, 결제가 막을까</text>
  <text x="24" y="52" class="gs">점선은 이 장에서 구현하지 않은 선택 · 1장에서 상태 전이 규칙을 <tspan class="m">Payment</tspan>에 둔 것과 같은 이유</text>
  <rect x="24" y="86" width="196" height="58" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <use href="#i-card" transform="translate(36,100) scale(0.9)"/>
  <text x="76" y="112" class="t2" style="font-size:11.5px">API 준비 요청</text>
  <text x="76" y="130" class="s" style="font-size:10px"><tspan class="m">POST /api/v1/payments</tspan></text>
  <rect x="24" y="164" width="196" height="58" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <use href="#i-app" transform="translate(36,178) scale(0.9)"/>
  <text x="76" y="190" class="t2" style="font-size:11.5px">테스트</text>
  <text x="76" y="208" class="s" style="font-size:10.5px">결제를 직접 만듦</text>
  <rect x="24" y="242" width="196" height="58" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <use href="#i-bell" transform="translate(36,256) scale(0.9)"/>
  <text x="76" y="268" class="gt" style="font-size:11.5px">나중의 배치·메시지</text>
  <text x="76" y="286" class="gs" style="font-size:10.5px">아직 없음</text>
  <rect x="268" y="78" width="200" height="74" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="282" y="102" class="gt" style="font-size:11.5px">요청 DTO 검사 — 구현 안 함</text>
  <text x="282" y="122" class="gs" style="font-size:10.5px"><tspan class="m">@NotNull</tspan> <tspan class="m">@Positive</tspan></text>
  <text x="282" y="140" class="gs" style="font-size:10.5px">컨트롤러의 <tspan class="m">@Valid</tspan></text>
  <rect x="516" y="78" width="220" height="160" rx="12" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <rect x="516" y="78" width="220" height="160" rx="12" fill="none" stroke="#2563eb" stroke-width="2"/>
  <use href="#i-coin" x="532" y="94"/>
  <text x="566" y="110" class="bt" style="font-size:13px"><tspan class="m">Payment.create</tspan></text>
  <text x="532" y="140" class="bs" style="font-size:11.5px">금액이 없거나 0 이하면</text>
  <text x="532" y="160" class="bs" style="font-size:10.5px"><tspan class="m">InvalidAmountException</tspan></text>
  <text x="532" y="196" class="bs" style="font-size:11.5px">"금액이 양수인 결제만</text>
  <text x="532" y="216" class="bs" style="font-size:11.5px">존재한다"를 결제가 직접 지킴</text>
  <rect x="268" y="206" width="222" height="48" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="280" y="226" class="t2" style="font-size:11px">다시 준비: <tspan class="m">create</tspan>를 지나지 않음</text>
  <text x="280" y="244" class="s" style="font-size:10px"><tspan class="m">verifyPreparedAmount</tspan>가 같은 검사</text>
  <path d="M220,115 H264" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#agy)"/>
  <path d="M470,115 H512" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#agy)"/>
  <path d="M220,125 C240,125 240,170 260,170 H490 C500,170 500,160 512,160" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#abl)"/>
  <path d="M220,193 H490 C500,193 500,200 512,200" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#abl)"/>
  <path d="M220,271 H490 C500,271 500,226 512,226" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#agy)"/>
  <text x="268" y="186" class="bs" style="font-size:10.5px">새로 만드는 길은 모두 <tspan class="m">Payment.create</tspan>를 지남</text>
  <text x="268" y="290" class="gs" style="font-size:10.5px">나중에 생겨도 같은 규칙</text>
  <line x1="626" y1="238" x2="626" y2="250" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="516" y="252" width="220" height="44" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="534" y="274"/>
  <text x="550" y="270" class="bads" style="font-size:10.5px">API 길</text>
  <text x="550" y="287" class="badt" style="font-size:11.5px"><tspan class="m">400 INVALID_AMOUNT</tspan></text>
  <rect x="516" y="302" width="220" height="44" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="534" y="324"/>
  <text x="550" y="320" class="bads" style="font-size:10.5px">테스트 · 배치 길</text>
  <text x="550" y="337" class="badt" style="font-size:10.5px">예외 <tspan class="m">InvalidAmountException</tspan></text>
  <rect x="24" y="364" width="350" height="120" rx="12" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="38" y="388" class="badt" style="font-size:12.5px">치르는 것</text>
  <text x="38" y="410" class="bads" style="font-size:11px">필드 오류를 모아 알리는 Bean Validation 기능을</text>
  <text x="38" y="428" class="bads" style="font-size:11px">쓰지 않음 — 첫 오류 하나만 알림</text>
  <text x="38" y="452" class="bads" style="font-size:11px">지금은 금액 하나라 차이 없음</text>
  <text x="38" y="470" class="bads" style="font-size:11px">검사할 항목이 많아지면 불편해짐</text>
  <rect x="386" y="364" width="350" height="120" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="400" y="388" class="t2" style="font-size:12.5px">다른 선택이 맞는 경우</text>
  <text x="400" y="410" class="s" style="font-size:11px">요청 필드가 많고 잘못된 필드를</text>
  <text x="400" y="428" class="s" style="font-size:11px">한 번에 알려야 하는 API</text>
  <text x="400" y="452" class="s" style="font-size:11px">형식 검사는 Bean Validation,</text>
  <text x="400" y="470" class="s" style="font-size:11px">업무 규칙은 도메인으로 나눔</text>
</svg>
