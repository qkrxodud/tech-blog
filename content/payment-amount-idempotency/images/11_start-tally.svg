<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>3장 출발 코드에서 3장 테스트 23개 중 10개 실패 — 승인 요청 확인 계약 7개 중 4개, 결제 API 16개 중 6개. 첫째 금액을 바꾼 승인이 그대로 통과(계약: 금액이 다르면 카드사에 요청하지 않음은 Mock PG에 100원 승인이 남고, 준비 상태 그대로는 APPROVED가 됨 / API: 금액이 다른 승인과 금액 없는 승인이 400 대신 200) 4개, 둘째 같은 승인 요청을 다시 보내면 실패(계약: 승인된 결제와 거절된 결제에 다시 온 같은 요청이 인증 전이 거부 / API: 200 대신 409) 3개, 셋째 같은 주문번호로 다시 준비하면 500(같은 금액은 201 대신, 다른 금액은 409 대신) 2개, 그 밖에 0원 준비가 400 대신 201로 1개. 4 + 3 + 2 + 1 = 10</title>
