<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>상품, 주문, 회원, 결제 관련 객체 열세 개를 선으로 이은 개별 객체 모델</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .ops { font-size: 11.5px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .src { font-size: 13px; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .grp { fill: #f3f4f6; stroke: #c4c8ce; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .pkg { fill: #ffffff; stroke: #c4c8ce; stroke-width: 1.2; }
    .grpt { font-size: 13px; font-weight: 700; fill: #4b5563; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .edge { stroke: #9ca3af; stroke-width: 1.4; fill: none; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="760" height="450" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="430" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">개별 객체 모델 — 객체가 많아지면 큰 관계가 흐려진다</text>
  <rect x="318.0" y="74" width="124" height="44" rx="6" class="box"/>
  <text x="380.0" y="101.0" class="opm" text-anchor="middle">Address</text>
  <rect x="30.0" y="164" width="124" height="44" rx="6" class="box"/>
  <text x="92.0" y="191.0" class="opm" text-anchor="middle">Category</text>
  <rect x="174.0" y="164" width="124" height="44" rx="6" class="box"/>
  <text x="236.0" y="181.5" class="opm" text-anchor="middle">Delivery</text>
  <text x="236.0" y="200.5" class="opm" text-anchor="middle">Tracking</text>
  <rect x="318.0" y="164" width="124" height="44" rx="6" class="box"/>
  <text x="380.0" y="191.0" class="opm" text-anchor="middle">ShippingInfo</text>
  <rect x="462.0" y="164" width="124" height="44" rx="6" class="box"/>
  <text x="524.0" y="191.0" class="opm" text-anchor="middle">Receiver</text>
  <rect x="30.0" y="254" width="124" height="44" rx="6" class="box"/>
  <text x="92.0" y="281.0" class="opm" text-anchor="middle">Product</text>
  <rect x="174.0" y="254" width="124" height="44" rx="6" class="box"/>
  <text x="236.0" y="281.0" class="opm" text-anchor="middle">OrderLine</text>
  <rect x="318.0" y="254" width="124" height="44" rx="6" class="box"/>
  <text x="380.0" y="281.0" class="opm" text-anchor="middle">Order</text>
  <rect x="462.0" y="254" width="124" height="44" rx="6" class="box"/>
  <text x="524.0" y="281.0" class="opm" text-anchor="middle">Orderer</text>
  <rect x="606.0" y="254" width="124" height="44" rx="6" class="box"/>
  <text x="668.0" y="281.0" class="opm" text-anchor="middle">Member</text>
  <rect x="30.0" y="344" width="124" height="44" rx="6" class="box"/>
  <text x="92.0" y="371.0" class="opm" text-anchor="middle">Review</text>
  <rect x="318.0" y="344" width="124" height="44" rx="6" class="box"/>
  <text x="380.0" y="371.0" class="opm" text-anchor="middle">PaymentInfo</text>
  <rect x="606.0" y="344" width="124" height="44" rx="6" class="box"/>
  <text x="668.0" y="371.0" class="opm" text-anchor="middle">MemberGrade</text>
  <line x1="92" y1="208" x2="92" y2="254" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="92" y1="298" x2="92" y2="344" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="154.0" y1="276" x2="174.0" y2="276" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="236" y1="208" x2="236" y2="254" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="278.0" y1="208" x2="324.0" y2="254" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="298.0" y1="276" x2="318.0" y2="276" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="380" y1="208" x2="380" y2="254" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="380" y1="118" x2="380" y2="164" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="442.0" y1="186" x2="462.0" y2="186" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="524" y1="208" x2="524" y2="254" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="442.0" y1="276" x2="462.0" y2="276" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="586.0" y1="276" x2="606.0" y2="276" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="668" y1="298" x2="668" y2="344" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="380" y1="298" x2="380" y2="344" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="30" y="418" class="foot">구성요소가 하나씩 보일 뿐, 어떤 객체끼리 하나의 단위인지는 드러나지 않습니다.</text>
</svg>
