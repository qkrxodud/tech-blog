<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>adapter.in.web의 SendMoneyController가 application.port.in의 SendMoneyUseCase를 호출하고, application.service의 SendMoneyService가 같은 포트를 구현해 두 쪽 모두 포트에 의존하는 구조</title>
  <style>
