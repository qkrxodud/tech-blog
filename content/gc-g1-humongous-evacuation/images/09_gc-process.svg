<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>G1 GC pause 안에서 Pre Evacuate Collection Set, Merge Heap Roots, Evacuate Collection Set, Post Evacuate Collection Set이 차례로 진행되고 mutator 스레드는 그동안 멈춘다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .lane2 { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .opc { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .rg { font-size: 13px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dark { fill: #d1d5db; stroke: #6b7280; stroke-width: 1.2; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="340" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">Garbage Collection Process — 한 번의 pause 안에서</text>
  <text x="730" y="42" class="code" text-anchor="end">STW pause</text>
  <text x="222" y="68" class="step" text-anchor="middle">1</text>
  <text x="367" y="68" class="step" text-anchor="middle">2</text>
  <text x="512" y="68" class="step" text-anchor="middle">3</text>
  <text x="657" y="68" class="step" text-anchor="middle">4</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="116.0" class="lane">mutator</text>
  <text x="30" y="134.0" class="sub">application</text>
  <rect x="150" y="90" width="585" height="56" rx="6" class="track"/>
  <rect x="154" y="104" width="571" height="28" rx="6" class="wait"/>
  <text x="440" y="123" class="waitt" text-anchor="middle">멈춤 — TLAB 연결 차단부터 재시작 준비까지</text>
  <text x="30" y="206.0" class="lane">GC 스레드</text>
  <text x="30" y="224.0" class="sub">parallel</text>
  <rect x="150" y="160" width="585" height="96" rx="6" class="track"/>
  <rect x="154" y="166" width="136" height="84" rx="8" class="box"/>
  <text x="222" y="188" class="op" text-anchor="middle">Pre Evacuate</text>
  <text x="222" y="205" class="op" text-anchor="middle">Collection Set</text>
  <text x="222" y="226" class="sub" text-anchor="middle">TLAB 연결 차단</text>
  <text x="222" y="242" class="sub" text-anchor="middle">collection set 확정</text>
  <rect x="299" y="166" width="136" height="84" rx="8" class="box"/>
  <text x="367" y="188" class="op" text-anchor="middle">Merge</text>
  <text x="367" y="205" class="op" text-anchor="middle">Heap Roots</text>
  <text x="367" y="226" class="sub" text-anchor="middle">단일 remembered</text>
  <text x="367" y="242" class="sub" text-anchor="middle">set 구축</text>
  <rect x="444" y="166" width="136" height="84" rx="8" class="ok"/>
  <text x="512" y="188" class="okt" text-anchor="middle">Evacuate</text>
  <text x="512" y="205" class="okt" text-anchor="middle">Collection Set</text>
  <text x="512" y="226" class="sub" text-anchor="middle">roots에서 reachable</text>
  <text x="512" y="242" class="sub" text-anchor="middle">객체 evacuation</text>
  <rect x="589" y="166" width="136" height="84" rx="8" class="box"/>
  <text x="657" y="188" class="op" text-anchor="middle">Post Evacuate</text>
  <text x="657" y="205" class="op" text-anchor="middle">Collection Set</text>
  <text x="657" y="226" class="sub" text-anchor="middle">clean-up</text>
  <text x="657" y="242" class="sub" text-anchor="middle">mutator 재시작 준비</text>
  <line x1="290" y1="208" x2="299" y2="208" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="435" y1="208" x2="444" y2="208" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="580" y1="208" x2="589" y2="208" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="30" y="296" class="db">roots</text>
  <text x="150" y="296" class="val">JNI, thread stack, static, code cache, remembered set</text>
  <text x="150" y="326" class="sub">mixed GC라면 그 전에 SATB 알고리즘으로 marking을 마친다 (pre-write barrier, TAMS)</text>
</svg>
