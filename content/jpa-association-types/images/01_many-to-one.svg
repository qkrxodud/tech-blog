<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>MEMBER 테이블의 두 회원이 TEAM_ID 외래 키로 같은 팀을 가리키고, 객체에서는 Member.team이 Team을 참조하는 다대일 단방향 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12.5px; fill: #374151; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .thead { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .cell { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 13px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 12.5px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 12.5px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="agb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="440" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="420" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">다대일 단방향 — 외래 키는 N 쪽에 있다</text>
  <text x="730" y="42" class="code" text-anchor="end">@ManyToOne</text>
  <text x="30" y="74" class="lane">객체</text>
  <rect x="130" y="56" width="190" height="106" rx="6" class="box"/>
  <rect x="130" y="56" width="190" height="28" rx="6" class="thead"/>
  <text x="225.0" y="75" class="mb" text-anchor="middle">Member</text>
  <text x="142" y="101.5" class="m">id</text>
  <text x="142" y="127.5" class="m">name</text>
  <rect x="134" y="139" width="182" height="20" rx="4" class="ok"/>
  <text x="142" y="153.5" class="okm">team</text>
  <rect x="500" y="56" width="190" height="80" rx="6" class="box"/>
  <rect x="500" y="56" width="190" height="28" rx="6" class="thead"/>
  <text x="595.0" y="75" class="mb" text-anchor="middle">Team</text>
  <text x="512" y="101.5" class="m">id</text>
  <text x="512" y="127.5" class="m">name</text>
  <line x1="324" y1="149.0" x2="496" y2="97.0" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="410" y="171.0" class="gnote" text-anchor="middle">Member.team이 주인</text>
  <text x="140" y="230" class="lane" text-anchor="middle">N</text>
  <text x="510" y="230" class="lane" text-anchor="middle">1</text>
  <text x="30" y="260" class="lane">테이블</text>
  <text x="130" y="246" class="mb">MEMBER</text>
  <rect x="130" y="254" width="100" height="26" class="thead"/>
  <text x="180.0" y="271.5" class="m" text-anchor="middle">MEMBER_ID</text>
  <rect x="230" y="254" width="110" height="26" class="thead"/>
  <text x="285.0" y="271.5" class="m" text-anchor="middle">USERNAME</text>
  <rect x="340" y="254" width="100" height="26" class="thead"/>
  <text x="390.0" y="271.5" class="m" text-anchor="middle">TEAM_ID</text>
  <rect x="130" y="280" width="100" height="26" class="cell"/>
  <text x="180.0" y="297.5" class="m" text-anchor="middle">1</text>
  <rect x="230" y="280" width="110" height="26" class="cell"/>
  <text x="285.0" y="297.5" class="m" text-anchor="middle">member1</text>
  <rect x="340" y="280" width="100" height="26" class="ok"/>
  <text x="390.0" y="297.5" class="okm" text-anchor="middle">1</text>
  <rect x="130" y="306" width="100" height="26" class="cell"/>
  <text x="180.0" y="323.5" class="m" text-anchor="middle">2</text>
  <rect x="230" y="306" width="110" height="26" class="cell"/>
  <text x="285.0" y="323.5" class="m" text-anchor="middle">member2</text>
  <rect x="340" y="306" width="100" height="26" class="ok"/>
  <text x="390.0" y="323.5" class="okm" text-anchor="middle">1</text>
  <text x="500" y="246" class="mb">TEAM</text>
  <rect x="500" y="254" width="90" height="26" class="thead"/>
  <text x="545.0" y="271.5" class="m" text-anchor="middle">TEAM_ID</text>
  <rect x="590" y="254" width="100" height="26" class="thead"/>
  <text x="640.0" y="271.5" class="m" text-anchor="middle">NAME</text>
  <rect x="500" y="280" width="90" height="26" class="ok"/>
  <text x="545.0" y="297.5" class="okm" text-anchor="middle">1</text>
  <rect x="590" y="280" width="100" height="26" class="cell"/>
  <text x="640.0" y="297.5" class="m" text-anchor="middle">teamA</text>
  <line x1="444" y1="293.0" x2="496" y2="293.0" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="444" y1="319.0" x2="496" y2="299.0" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="372" class="foot">회원을 두 명 저장해도 두 회원의 TEAM_ID에 같은 팀을 넣을 수 있습니다.</text>
  <text x="30" y="394" class="foot">양방향으로 만들어도 테이블은 그대로이고, 객체에 Team.members 참조만 추가됩니다.</text>
</svg>
