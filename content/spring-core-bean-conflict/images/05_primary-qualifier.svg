<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>메인 DB 커넥션 빈에는 @Primary를, 서브 DB 커넥션 빈에는 @Qualifier를 붙여, 지정 없이 조회하는 코드에는 메인 DB 빈이, @Qualifier를 지정한 코드에는 서브 DB 빈이 주입되고, 둘이 함께 있으면 @Qualifier가 우선하는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .okms { font-size: 12px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .chip { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .gscope { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .dim { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dimt { font-size: 12.5px; fill: #9ca3af; font-family: Menlo, Consolas, monospace; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .tag { font-size: 11.5px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="340" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">@Primary와 @Qualifier 활용 — 메인은 기본값, 서브는 명시적으로</text>
  <text x="150" y="72" class="step" text-anchor="middle">조회하는 코드</text>
  <text x="610" y="72" class="step" text-anchor="middle">스프링 빈</text>
  <rect x="30" y="84" width="240" height="64" rx="8" class="box"/>
  <text x="150" y="110" class="t" text-anchor="middle">자주 사용하는 조회</text>
  <text x="150" y="132" class="sub" text-anchor="middle">@Qualifier 지정 없음</text>
  <rect x="30" y="176" width="240" height="64" rx="8" class="box"/>
  <text x="150" y="202" class="t" text-anchor="middle">특별한 기능으로 가끔 사용</text>
  <text x="150" y="224" class="sub" text-anchor="middle">@Qualifier 지정</text>
  <rect x="490" y="84" width="240" height="64" rx="8" class="ok"/>
  <text x="610" y="108" class="tag" text-anchor="middle">@Primary</text>
  <text x="610" y="132" class="okt" text-anchor="middle">메인 DB 커넥션 빈</text>
  <rect x="490" y="176" width="240" height="64" rx="8" class="ok"/>
  <text x="610" y="200" class="tag" text-anchor="middle">@Qualifier</text>
  <text x="610" y="224" class="okt" text-anchor="middle">서브 DB 커넥션 빈</text>
  <text x="380" y="108" class="gnote" text-anchor="middle">기본값으로 주입</text>
  <line x1="486" y1="120" x2="274" y2="120" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="380" y="200" class="gnote" text-anchor="middle">명시적으로 주입</text>
  <line x1="486" y1="212" x2="274" y2="212" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="30" y="262" width="700" height="44" rx="22" class="hold"/>
  <text x="380" y="289" class="t" text-anchor="middle">우선순위: @Qualifier(좁은 범위, 수동) &gt; @Primary(기본값)</text>
  <text x="30" y="332" class="foot">둘이 함께 있으면 @Qualifier가 우선권을 가집니다.</text>
</svg>
