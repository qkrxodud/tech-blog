  <rect width="760" height="470" fill="#ffffff"/>
  <text x="24" y="28" class="h">측정 — 쓰는 중인 DB 연결과 대사 시간(두 실행 범위)</text>
  <rect x="14" y="58" width="330" height="400" rx="16" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="26" y="46" width="200" height="24" rx="6" fill="#5b7194"/><text x="126" y="62.5" class="tab" text-anchor="middle">쓰는 중인 DB 연결(풀 10개)</text>
  <text x="28" y="86" class="gs" style="font-size:10.5px">5ms마다 읽은 평균 · 장애 15초 측정</text>
  <text x="28" y="119" class="t2" style="font-size:11.5px;fill:#c2410c">시간 제한만</text>
