<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>두 주문의 겹침을 고정하는 방법 — 먼저 보낸 주문의 인증 기록에서 재고·쿠폰·포인트를 바꾸는 JdbcTemplate 문장은 바로 나가 그 줄의 잠금을 쥐고, 결제 상태를 AUTHENTICATED로 바꾸는 UPDATE는 커밋 때 나가다 트리거에 1초 붙잡힘. 테스트는 잠든 것을 확인(awaitHeld)한 뒤 두 번째 주문의 승인을 보내 두 주문의 답을 보낸 순서대로 돌려받음. 거절을 세 곳이 겹쳐 닫는 경우는 PG가 거절을 남기고 거절 답을 붙잡아 둔 채, 알림 처리가 승인 실패를 남기다 1초 붙잡힌 동안 보정을 시작하고 그다음 거절 답을 보냄. 재고 10개에 30건은 겹침을 고정하지 않고 미리 준비한 30건의 승인을 스레드 30개에서 래치로 한꺼번에 보냄</title>
