<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>외래 키가 있는 MEMBER 쪽의 Member.team이 연관관계의 주인으로 TEAM_ID를 등록·수정하고, mappedBy를 지정한 Team.members는 읽기만 하는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12.5px; fill: #374151; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .thead { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .cell { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 13px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 12.5px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 12.5px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="agb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="404" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="384" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">연관관계의 주인 — 외래 키가 있는 쪽</text>
  <rect x="30" y="66" width="220" height="106" rx="6" class="box"/>
  <rect x="30" y="66" width="220" height="28" rx="6" class="thead"/>
  <text x="140.0" y="85" class="mb" text-anchor="middle">Member</text>
  <text x="42" y="111.5" class="m">id</text>
  <text x="42" y="137.5" class="m">name</text>
  <rect x="34" y="149" width="212" height="20" rx="4" class="ok"/>
  <text x="42" y="163.5" class="okm">team</text>
  <rect x="510" y="66" width="220" height="106" rx="6" class="box"/>
  <rect x="510" y="66" width="220" height="28" rx="6" class="thead"/>
  <text x="620.0" y="85" class="mb" text-anchor="middle">Team</text>
  <text x="522" y="111.5" class="m">id</text>
  <text x="522" y="137.5" class="m">name</text>
  <rect x="514" y="149" width="212" height="20" rx="4" class="wait"/>
  <text x="522" y="163.5" class="m">members</text>
  <rect x="30" y="188" width="220" height="32" rx="8" class="ok"/>
  <text x="140.0" y="208.5" class="okt" text-anchor="middle">주인 — 외래 키 등록·수정</text>
  <rect x="510" y="188" width="220" height="32" rx="8" class="wait"/>
  <text x="620.0" y="208.5" class="waitt" text-anchor="middle">mappedBy 지정 — 읽기만</text>
  <rect x="300" y="250" width="160" height="106" rx="6" class="box"/>
  <rect x="300" y="250" width="160" height="28" rx="6" class="thead"/>
  <text x="380.0" y="269" class="mb" text-anchor="middle">MEMBER</text>
  <text x="312" y="295.5" class="m">MEMBER_ID</text>
  <text x="312" y="321.5" class="m">USERNAME</text>
  <rect x="304" y="333" width="152" height="20" rx="4" class="ok"/>
  <text x="312" y="347.5" class="okm">TEAM_ID (FK)</text>
  <line x1="254" y1="159.0" x2="298" y2="339.0" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="506" y1="159.0" x2="462" y2="339.0" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <text x="30" y="300" class="code">@ManyToOne</text>
  <text x="30" y="318" class="code">@JoinColumn(name = "TEAM_ID")</text>
  <text x="730" y="300" class="code" text-anchor="end">@OneToMany</text>
  <text x="730" y="318" class="code" text-anchor="end">(mappedBy = "team")</text>
  <text x="30" y="380" class="foot">TEAM_ID를 바꾸는 것은 주인인 Member.team뿐이고, Team.members는 조회에만 사용됩니다.</text>
</svg>
