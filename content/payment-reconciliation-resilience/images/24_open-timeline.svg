  <rect x="189.5" y="113" width="222" height="14" rx="3" fill="#ffffff"/>
  <text x="193.5" y="124" class="gs" style="font-size:9.5px">약 5초 — 읽기 5초에서 계산, 측정값 아님</text>
  <text x="18" y="270" class="t2" style="font-size:12px">결과</text>
  <text x="18" y="286" class="gs" style="font-size:9.5px"></text>
  <rect x="120" y="256" width="103.5" height="44" rx="8" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/><text x="171.75" y="275" class="s2" text-anchor="middle" style="fill:#c2410c;font-size:9.5px">결과 모름 20</text><text x="171.75" y="289" class="s2" text-anchor="middle" style="fill:#c2410c;font-size:9.5px">두 실행 같음</text>
  <rect x="231.5" y="256" width="91" height="44" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/><text x="277" y="275" class="s2" text-anchor="middle" style="fill:#b91c1c;font-size:9.5px">승인 실패</text><text x="277" y="289" class="s2" text-anchor="middle" style="fill:#b91c1c;font-size:9.5px">다시 결제해야 함</text>
  <text x="330.5" y="284" class="s2" style="font-size:10.5px;fill:#1f2937">열린 동안에도 재고는 잡았다가 돌려줌(승인 요청 전에 예약 — 10장)</text>
