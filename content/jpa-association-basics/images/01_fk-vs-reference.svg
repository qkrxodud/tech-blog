<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>테이블에 맞춘 모델은 Member가 teamId 값만 가져 팀을 찾으려면 em.find를 한 번 더 호출하고, 객체지향 모델은 Member가 Team을 참조해 getTeam으로 바로 찾는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12.5px; fill: #374151; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .thead { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .cell { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 13px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 12.5px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 12.5px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="agb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="510" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="244" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">테이블에 맞춘 모델 — Member가 팀의 id 값만 가진다</text>
  <rect x="30" y="66" width="180" height="106" rx="6" class="box"/>
  <rect x="30" y="66" width="180" height="28" rx="6" class="thead"/>
  <text x="120.0" y="85" class="mb" text-anchor="middle">Member</text>
  <text x="42" y="111.5" class="m">id</text>
  <text x="42" y="137.5" class="m">name</text>
  <rect x="34" y="149" width="172" height="20" rx="4" class="bad"/>
  <text x="42" y="163.5" class="badm">teamId</text>
  <rect x="260" y="66" width="150" height="80" rx="6" class="box"/>
  <rect x="260" y="66" width="150" height="28" rx="6" class="thead"/>
  <text x="335.0" y="85" class="mb" text-anchor="middle">Team</text>
  <text x="272" y="111.5" class="m">id</text>
  <text x="272" y="137.5" class="m">name</text>
  <line x1="214" y1="159.0" x2="256" y2="107.0" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="30" y="204" class="note">teamId는 참조가 아니라 Team의 id 값입니다.</text>
  <text x="450" y="62" class="sub">팀 조회 순서</text>
  <rect x="450" y="70" width="280" height="34" rx="8" class="box"/>
  <text x="590.0" y="91.5" class="m" text-anchor="middle">em.find(Member.class, id)</text>
  <line x1="590" y1="104" x2="590" y2="116" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="450" y="118" width="280" height="34" rx="8" class="box"/>
  <text x="590.0" y="139.5" class="m" text-anchor="middle">findMember.getTeamId()</text>
  <line x1="590" y1="152" x2="590" y2="164" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="450" y="166" width="280" height="34" rx="8" class="bad"/>
  <text x="590.0" y="187.5" class="badm" text-anchor="middle">em.find(Team.class, findTeamId)</text>
  <text x="30" y="236" class="foot">팀을 찾으려면 꺼낸 팀의 id로 em.find()를 한 번 더 호출해야 합니다.</text>
  <rect x="10" y="270" width="740" height="230" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="302" class="h">객체지향 모델 — Member가 Team을 참조한다</text>
  <text x="730" y="302" class="code" text-anchor="end">@ManyToOne @JoinColumn</text>
  <rect x="30" y="326" width="180" height="106" rx="6" class="box"/>
  <rect x="30" y="326" width="180" height="28" rx="6" class="thead"/>
  <text x="120.0" y="345" class="mb" text-anchor="middle">Member</text>
  <text x="42" y="371.5" class="m">id</text>
  <text x="42" y="397.5" class="m">name</text>
  <rect x="34" y="409" width="172" height="20" rx="4" class="ok"/>
  <text x="42" y="423.5" class="okm">team</text>
  <rect x="260" y="326" width="150" height="80" rx="6" class="box"/>
  <rect x="260" y="326" width="150" height="28" rx="6" class="thead"/>
  <text x="335.0" y="345" class="mb" text-anchor="middle">Team</text>
  <text x="272" y="371.5" class="m">id</text>
  <text x="272" y="397.5" class="m">name</text>
  <line x1="214" y1="419.0" x2="256" y2="361.0" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="464" class="gnote">team 필드는 MEMBER 테이블의 TEAM_ID 외래 키와 매핑됩니다.</text>
  <text x="450" y="322" class="sub">팀 조회 순서</text>
  <rect x="450" y="330" width="280" height="34" rx="8" class="box"/>
  <text x="590.0" y="351.5" class="m" text-anchor="middle">em.find(Member.class, id)</text>
  <line x1="590" y1="364" x2="590" y2="376" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="450" y="378" width="280" height="34" rx="8" class="ok"/>
  <text x="590.0" y="399.5" class="okm" text-anchor="middle">findMember.getTeam()</text>
  <text x="30" y="488" class="foot">조회한 회원에서 참조로 바로 팀을 꺼냅니다.</text>
</svg>
