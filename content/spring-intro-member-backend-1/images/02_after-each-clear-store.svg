<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 426" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>findAll 테스트 뒤 afterEach에서 clearStore로 저장소를 비우면 findByName 테스트가 새로 저장한 spring1을 찾고, 비우지 않으면 앞 테스트의 spring1이 남아 다른 회원을 찾을 수 있다는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .mxs { font-size: 11px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .chip { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .gscope { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="426" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="250" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">@AfterEach — 테스트 메서드가 끝날 때마다 저장소 비우기</text>
  <text x="730" y="42" class="code" text-anchor="end">clearStore()</text>
  <text x="226.0" y="68" class="step" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">findAll()</tspan></text>
  <text x="371.0" y="68" class="step" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">afterEach()</tspan></text>
  <text x="516.0" y="68" class="step" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">findByName()</tspan></text>
  <text x="661.0" y="68" class="step" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">afterEach()</tspan></text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="110" class="lane">테스트</text>
  <text x="30" y="128" class="sub">메서드 실행</text>
  <rect x="150" y="86" width="585" height="60" rx="6" class="track"/>
  <rect x="160" y="92" width="132" height="48" rx="8" class="box"/>
  <text x="226.0" y="112.0" class="ms" text-anchor="middle">spring1, spring2</text>
  <text x="226.0" y="131.0" class="val" text-anchor="middle">저장 후 2건 확인</text>
  <line x1="293" y1="116" x2="303" y2="116" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="305" y="92" width="132" height="48" rx="8" class="hold"/>
  <text x="371.0" y="112.0" class="mb" text-anchor="middle">clearStore()</text>
  <text x="371.0" y="131.0" class="val" text-anchor="middle">store 비움</text>
  <line x1="438" y1="116" x2="448" y2="116" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="450" y="92" width="132" height="48" rx="8" class="box"/>
  <text x="516.0" y="112.0" class="ms" text-anchor="middle">spring1, spring2</text>
  <text x="516.0" y="131.0" class="val" text-anchor="middle">다시 저장</text>
  <line x1="583" y1="116" x2="593" y2="116" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="595" y="92" width="132" height="48" rx="8" class="ok"/>
  <text x="661.0" y="112.0" class="okt" text-anchor="middle">"spring1" 조회</text>
  <text x="661.0" y="131.0" class="val" text-anchor="middle">member1과 같음</text>
  <text x="30" y="190" class="db">store</text>
  <text x="30" y="208" class="sub">static Map</text>
  <rect x="176" y="174" width="100" height="32" rx="6" class="dbbox"/>
  <text x="226.0" y="195" class="db" text-anchor="middle">id 1, 2</text>
  <rect x="321" y="174" width="100" height="32" rx="6" class="dbbox"/>
  <text x="371.0" y="195" class="db" text-anchor="middle">비어 있음</text>
  <rect x="466" y="174" width="100" height="32" rx="6" class="dbbox"/>
  <text x="516.0" y="195" class="db" text-anchor="middle">id 3, 4</text>
  <rect x="611" y="174" width="100" height="32" rx="6" class="ok"/>
  <text x="661.0" y="195" class="okt" text-anchor="middle">id 3 반환</text>
  <text x="30" y="236" class="foot">seq는 초기화하지 않으므로 뒤 테스트의 회원 id는 3, 4로 이어집니다.</text>
  <rect x="10" y="276" width="740" height="140" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="308" class="h">clearStore()를 하지 않으면 — 앞 테스트의 회원이 남음</text>
  <text x="30" y="346" class="db">store</text>
  <rect x="160" y="326" width="160" height="32" rx="6" class="bad"/>
  <text x="240" y="347" class="badt" text-anchor="middle">id 1, 2, 3, 4</text>
  <line x1="322" y1="342" x2="446" y2="342" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="450" y="318" width="277" height="48" rx="8" class="bad"/>
  <text x="588.5" y="338.0" class="badt" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">findByName("spring1")</tspan></text>
  <text x="588.5" y="357.0" class="note" text-anchor="middle">앞 테스트의 spring1(id 1)을 찾을 수 있음</text>
  <text x="30" y="398" class="foot">이름이 같은 회원이 둘이 되어, 테스트를 실행하는 순서에 따라 결과가 달라질 수 있습니다.</text>
</svg>
