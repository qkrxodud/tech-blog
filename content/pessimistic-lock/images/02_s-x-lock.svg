<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 556" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>S-Lock이 걸려 있으면 다른 트랜잭션의 S-Lock은 함께 읽지만 X-Lock은 대기하고, X-Lock이 걸려 있으면 S-Lock과 X-Lock 모두 대기하는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .valc { font-size: 12.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .dbc { font-size: 14px; font-weight: 700; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .mark { stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="556" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="260" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">S-Lock이 걸려 있을 때 — 읽기만 함께 가능</text>
  <text x="730" y="42" class="code" text-anchor="end">Shared Lock</text>
  <text x="220" y="68" class="step" text-anchor="middle">1단계</text>
  <text x="360" y="68" class="step" text-anchor="middle">2단계</text>
  <text x="500" y="68" class="step" text-anchor="middle">3단계</text>
  <text x="640" y="68" class="step" text-anchor="middle">4단계</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">트랜잭션 1</text>
  <text x="30" y="126" class="sub">락을 먼저 획득</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="88" width="116" height="48" rx="8" class="hold"/>
  <text x="220" y="108" class="op" text-anchor="middle">S-Lock</text>
  <text x="220" y="127" class="val" text-anchor="middle">획득 · 읽는 중</text>
  <rect x="290" y="96" width="432" height="32" rx="6" class="wait"/>
  <text x="506.0" y="117" class="waitt" text-anchor="middle">락을 쥐고 작업 중</text>
  <text x="30" y="168" class="lane">트랜잭션 2</text>
  <text x="30" y="186" class="sub">같은 행에 접근</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="302" y="148" width="116" height="48" rx="8" class="ok"/>
  <text x="360" y="168" class="okc" text-anchor="middle">S-Lock</text>
  <text x="360" y="187" class="val" text-anchor="middle">함께 읽음</text>
  <text x="30" y="228" class="lane">트랜잭션 3</text>
  <text x="30" y="246" class="sub">같은 행에 접근</text>
  <rect x="150" y="206" width="585" height="52" rx="6" class="track"/>
  <rect x="302" y="208" width="116" height="48" rx="8" class="bad"/>
  <text x="360" y="228" class="badc" text-anchor="middle">X-Lock</text>
  <text x="360" y="247" class="val" text-anchor="middle">획득 불가</text>
  <rect x="430" y="216" width="292" height="32" rx="6" class="wait"/>
  <text x="576.0" y="237" class="waitt" text-anchor="middle">S-Lock이 풀릴 때까지 수정 불가</text>
  <rect x="10" y="286" width="740" height="260" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="318" class="h">X-Lock이 걸려 있을 때 — 단일 트랜잭션만 접근</text>
  <text x="730" y="318" class="code" text-anchor="end">Exclusive Lock</text>
  <text x="220" y="344" class="step" text-anchor="middle">1단계</text>
  <text x="360" y="344" class="step" text-anchor="middle">2단계</text>
  <text x="500" y="344" class="step" text-anchor="middle">3단계</text>
  <text x="640" y="344" class="step" text-anchor="middle">4단계</text>
  <line x1="160" y1="352" x2="722" y2="352" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="384" class="lane">트랜잭션 1</text>
  <text x="30" y="402" class="sub">락을 먼저 획득</text>
  <rect x="150" y="362" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="364" width="116" height="48" rx="8" class="hold"/>
  <text x="220" y="384" class="op" text-anchor="middle">X-Lock</text>
  <text x="220" y="403" class="val" text-anchor="middle">획득 · 수정 중</text>
  <rect x="290" y="372" width="432" height="32" rx="6" class="wait"/>
  <text x="506.0" y="393" class="waitt" text-anchor="middle">락을 쥐고 작업 중</text>
  <text x="30" y="444" class="lane">트랜잭션 2</text>
  <text x="30" y="462" class="sub">같은 행에 접근</text>
  <rect x="150" y="422" width="585" height="52" rx="6" class="track"/>
  <rect x="302" y="424" width="116" height="48" rx="8" class="bad"/>
  <text x="360" y="444" class="badc" text-anchor="middle">S-Lock</text>
  <text x="360" y="463" class="val" text-anchor="middle">획득 불가</text>
  <rect x="430" y="432" width="292" height="32" rx="6" class="wait"/>
  <text x="576.0" y="453" class="waitt" text-anchor="middle">X-Lock이 풀릴 때까지 읽기 불가</text>
  <text x="30" y="504" class="lane">트랜잭션 3</text>
  <text x="30" y="522" class="sub">같은 행에 접근</text>
  <rect x="150" y="482" width="585" height="52" rx="6" class="track"/>
  <rect x="302" y="484" width="116" height="48" rx="8" class="bad"/>
  <text x="360" y="504" class="badc" text-anchor="middle">X-Lock</text>
  <text x="360" y="523" class="val" text-anchor="middle">획득 불가</text>
  <rect x="430" y="492" width="292" height="32" rx="6" class="wait"/>
  <text x="576.0" y="513" class="waitt" text-anchor="middle">X-Lock이 풀릴 때까지 수정 불가</text>
</svg>
