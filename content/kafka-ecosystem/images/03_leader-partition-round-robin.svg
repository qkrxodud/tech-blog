<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>브로커 3대에 파티션 5개를 만들면 브로커 0부터 차례로 파티션 0, 1, 2의 리더가 놓이고, 다시 브로커 0부터 파티션 3, 4의 리더가 놓이는 round-robin 배치</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .chip { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
    .grp { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="320" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="300" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">파티션 5개, 브로커 3대 — 리더 파티션의 round-robin 배치</text>
  <rect x="110" y="62" width="190" height="162" rx="10" class="grp"/>
  <text x="205" y="86" class="t" text-anchor="middle">브로커 0</text>
  <rect x="320" y="62" width="190" height="162" rx="10" class="grp"/>
  <text x="415" y="86" class="t" text-anchor="middle">브로커 1</text>
  <rect x="530" y="62" width="190" height="162" rx="10" class="grp"/>
  <text x="625" y="86" class="t" text-anchor="middle">브로커 2</text>
  <text x="30" y="132" class="sub">1바퀴</text>
  <text x="30" y="192" class="sub">2바퀴</text>
  <rect x="130" y="102" width="150" height="48" rx="8" class="ok"/>
  <text x="205" y="123" class="okt" text-anchor="middle">파티션 0</text>
  <text x="205" y="141" class="gnote" text-anchor="middle">리더 · 1번째</text>
  <rect x="340" y="102" width="150" height="48" rx="8" class="ok"/>
  <text x="415" y="123" class="okt" text-anchor="middle">파티션 1</text>
  <text x="415" y="141" class="gnote" text-anchor="middle">리더 · 2번째</text>
  <rect x="550" y="102" width="150" height="48" rx="8" class="ok"/>
  <text x="625" y="123" class="okt" text-anchor="middle">파티션 2</text>
  <text x="625" y="141" class="gnote" text-anchor="middle">리더 · 3번째</text>
  <rect x="130" y="162" width="150" height="48" rx="8" class="ok"/>
  <text x="205" y="183" class="okt" text-anchor="middle">파티션 3</text>
  <text x="205" y="201" class="gnote" text-anchor="middle">리더 · 4번째</text>
  <rect x="340" y="162" width="150" height="48" rx="8" class="ok"/>
  <text x="415" y="183" class="okt" text-anchor="middle">파티션 4</text>
  <text x="415" y="201" class="gnote" text-anchor="middle">리더 · 5번째</text>
  <line x1="282" y1="126" x2="336" y2="126" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="492" y1="126" x2="546" y2="126" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="282" y1="186" x2="336" y2="186" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <polyline points="625,152 625,242 205,242 205,214" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <text x="415" y="262" class="sub" text-anchor="middle">마지막 브로커 다음은 다시 브로커 0</text>
  <text x="30" y="290" class="foot">리더 파티션이 브로커마다 골고루 놓여, 클라이언트의 통신이 특정 브로커에 몰리지 않습니다.</text>
</svg>
