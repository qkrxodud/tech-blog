<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>새 객체가 Eden에 할당되고, Minor GC에서 살아남으면 S0과 S1 사이를 오가다가 오래 살아남은 객체는 Old로 옮겨지며, Old가 가득 차면 Major GC가 일어나는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t13 { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okt13 { font-size: 13px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badt13 { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .m { font-family: Menlo, Consolas, monospace; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="340" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">세대별 GC — 객체가 세대를 옮겨 가는 흐름</text>
  <rect x="30" y="90" width="100" height="60" rx="8" class="dbbox"/>
  <text x="80" y="116" class="t13" text-anchor="middle">새 객체</text>
  <text x="80" y="135" class="s" text-anchor="middle">new</text>
  <rect x="170" y="76" width="130" height="88" rx="10" class="box"/>
  <text x="235" y="114" class="t" text-anchor="middle">Eden</text>
  <text x="235" y="134" class="s" text-anchor="middle">처음 할당되는 곳</text>
  <rect x="340" y="76" width="130" height="40" rx="8" class="box"/>
  <text x="405" y="101" class="t13" text-anchor="middle">Survivor S0</text>
  <rect x="340" y="124" width="130" height="40" rx="8" class="wait"/>
  <text x="405" y="149" class="waitt" text-anchor="middle">Survivor S1 (빈 곳)</text>
  <rect x="570" y="76" width="160" height="88" rx="10" class="hold"/>
  <text x="650" y="114" class="t" text-anchor="middle">Old</text>
  <text x="650" y="134" class="s" text-anchor="middle">오래 살아남은 객체</text>
  <line x1="131" y1="120" x2="166" y2="120" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="301" y1="110" x2="336" y2="98" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <path d="M 472 106 Q 500 125 474 143" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="498" y="140" class="gnote">번갈아 복사</text>
  <line x1="471" y1="88" x2="566" y2="88" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="518" y="80" class="gnote" text-anchor="middle">승격</text>
  <line x1="170" y1="182" x2="470" y2="182" stroke="#c4c8ce" stroke-width="1.2"/>
  <text x="320" y="200" class="sub" text-anchor="middle">Young Generation</text>
  <line x1="570" y1="182" x2="730" y2="182" stroke="#c4c8ce" stroke-width="1.2"/>
  <text x="650" y="200" class="sub" text-anchor="middle">Old Generation</text>
  <rect x="170" y="220" width="300" height="70" rx="10" class="ok"/>
  <text x="320" y="245" class="okt" text-anchor="middle">Minor GC — Young만 수집</text>
  <text x="320" y="267" class="s" text-anchor="middle">Eden이 가득 차면 · 자주, 짧게 멈춤</text>
  <rect x="570" y="220" width="160" height="70" rx="10" class="bad"/>
  <text x="650" y="245" class="badt" text-anchor="middle">Major GC</text>
  <text x="650" y="265" class="s" text-anchor="middle">Old가 가득 차면</text>
  <text x="650" y="281" class="s" text-anchor="middle">힙 전체 · 길게 멈춤</text>
  <text x="30" y="324" class="foot">Minor GC마다 살아남은 객체는 비어 있는 Survivor로 복사되고, 여러 번 살아남으면 Old로 옮겨집니다(승격).</text>
</svg>
