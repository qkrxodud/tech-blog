<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>GC가 일어났을 때 인스턴스, 직접 참조, classloader가 모두 unreachable이어야 chunk가 회수되어 재사용되거나 OS에 반환된다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
    .monob { font-family: Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #1f2937; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .sep { stroke: #9ca3af; stroke-width: 1; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="440" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="420" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">chunk 회수 — class metadata에 더 이상 접근할 수 없을 때</text>
  <rect x="60" y="62" width="440" height="44" rx="8" class="hold"/>
  <text x="280" y="89" class="t" text-anchor="middle">GC 발생 (committed Metaspace가 High-Water Mark 도달)</text>
  <line x1="280" y1="106" x2="280" y2="126" class="al" marker-end="url(#ar)"/>
  <rect x="60" y="128" width="440" height="48" rx="8" class="box"/>
  <text x="80" y="158" class="t">1.</text>
  <text x="102" y="158" class="val">해당 class 타입의 인스턴스가 모두 unreachable?</text>
  <line x1="502" y1="152" x2="574" y2="152" class="rl" marker-end="url(#arr)"/>
  <text x="538" y="145" class="note" text-anchor="middle">아니오</text>
  <line x1="280" y1="176" x2="280" y2="198" class="gl" marker-end="url(#agr)"/>
  <text x="290" y="192" class="gnote">예</text>
  <rect x="60" y="200" width="440" height="48" rx="8" class="box"/>
  <text x="80" y="230" class="t">2.</text>
  <text x="102" y="230" class="val">static 필드·메서드 호출 등 class 직접 참조가 없음?</text>
  <line x1="502" y1="224" x2="574" y2="224" class="rl" marker-end="url(#arr)"/>
  <text x="538" y="217" class="note" text-anchor="middle">아니오</text>
  <line x1="280" y1="248" x2="280" y2="270" class="gl" marker-end="url(#agr)"/>
  <text x="290" y="264" class="gnote">예</text>
  <rect x="60" y="272" width="440" height="48" rx="8" class="box"/>
  <text x="80" y="302" class="t">3.</text>
  <text x="102" y="302" class="val">class를 로딩한 classloader 객체가 unreachable?</text>
  <line x1="502" y1="296" x2="574" y2="296" class="rl" marker-end="url(#arr)"/>
  <text x="538" y="289" class="note" text-anchor="middle">아니오</text>
  <line x1="280" y1="320" x2="280" y2="342" class="gl" marker-end="url(#agr)"/>
  <text x="290" y="336" class="gnote">예</text>
  <rect x="578" y="128" width="150" height="192" rx="8" class="bad"/>
  <text x="653" y="214" class="badt" text-anchor="middle">회수하지 않음</text>
  <text x="653" y="236" class="note" text-anchor="middle">metadata 유지</text>
  <rect x="60" y="344" width="440" height="48" rx="8" class="ok"/>
  <text x="280" y="373" class="okt" text-anchor="middle">chunk 회수 → 재사용하거나 OS에 반환</text>
  <text x="30" y="420" class="sub">세 조건 중 가장 핵심은 3번입니다. 기본 classloader들은 프로세스 내내 살아 있습니다.</text>
</svg>
