<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 522" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>pause time 목표를 못 맞추면 pause time이 더 긴 generation 하나만 5% 줄이고, throughput 목표를 못 맞추면 GC time 비율 1:3에 따라 young 5%, old 15%처럼 두 generation을 함께 늘린다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
    .monob { font-family: Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #1f2937; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dark { fill: #d1d5db; stroke: #6b7280; stroke-width: 1.2; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .sep { stroke: #e5e7eb; stroke-width: 1; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="522" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="236" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <rect x="10" y="262" width="740" height="240" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">pause time 목표 미달 — 한 번에 한 generation만 축소</text>
  <text x="730" y="42" class="code" text-anchor="end">decrement 20 / 4 = 5%</text>
  <text x="30" y="82" class="lane">young</text>
  <text x="30" y="100" class="sub">pause 목표 초과</text>
  <rect x="150" y="62" width="200" height="46" rx="6" class="hold"/>
  <text x="250" y="90" class="val" text-anchor="middle">pause time</text>
  <text x="30" y="148" class="lane">old</text>
  <text x="30" y="166" class="sub">pause 목표 초과</text>
  <rect x="150" y="128" width="300" height="46" rx="6" class="bad"/>
  <text x="300" y="156" class="badt" text-anchor="middle">pause time (더 김)</text>
  <line x1="358" y1="85" x2="488" y2="85" class="al" marker-end="url(#ar)"/>
  <rect x="490" y="62" width="240" height="46" rx="8" class="box"/>
  <text x="610" y="90" class="op" text-anchor="middle">이번에는 그대로</text>
  <line x1="458" y1="151" x2="488" y2="151" class="rl" marker-end="url(#arr)"/>
  <rect x="490" y="128" width="240" height="46" rx="8" class="bad"/>
  <text x="610" y="156" class="badt" text-anchor="middle">old만 5% 축소</text>
  <text x="30" y="206" class="sub">두 generation 모두 목표를 넘으면 pause time이 더 긴 쪽부터 하나씩 줄임</text>
  <text x="30" y="226" class="note">목표를 너무 빡빡하게 잡으면 GC가 자주 일어나 throughput이 감소</text>
  <text x="30" y="294" class="h">throughput 목표 미달 — 두 generation을 함께 확대</text>
  <text x="730" y="294" class="code" text-anchor="end">increment 20%</text>
  <text x="30" y="326" class="val">GC time 비율 young : old = 1 : 3</text>
  <rect x="150" y="340" width="145" height="40" rx="4" class="box"/>
  <text x="222" y="365" class="op" text-anchor="middle">young 1/4</text>
  <rect x="295" y="340" width="435" height="40" rx="4" class="hold"/>
  <text x="512" y="365" class="op" text-anchor="middle">old 3/4</text>
  <text x="30" y="365" class="lane">GC time</text>
  <line x1="222" y1="380" x2="222" y2="412" class="gl" marker-end="url(#agr)"/>
  <line x1="512" y1="380" x2="512" y2="412" class="gl" marker-end="url(#agr)"/>
  <rect x="120" y="414" width="205" height="46" rx="8" class="ok"/>
  <text x="222" y="436" class="okt" text-anchor="middle">young 5% 증가</text>
  <text x="222" y="453" class="val" text-anchor="middle">20% × 1/4</text>
  <rect x="410" y="414" width="205" height="46" rx="8" class="ok"/>
  <text x="512" y="436" class="okt" text-anchor="middle">old 15% 증가</text>
  <text x="512" y="453" class="val" text-anchor="middle">20% × 3/4</text>
  <text x="30" y="492" class="sub">각 generation이 total GC time에서 차지한 비율만큼 증가 %를 나눠 가짐</text>
</svg>
