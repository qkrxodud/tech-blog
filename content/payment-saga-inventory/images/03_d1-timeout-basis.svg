<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 1 시간 제한 근거 — 예약 응답 시간은 하나씩 50건이 중앙 3~4ms·p99 6~25ms, 300건 동시가 중앙 299~418ms·p99 539~740ms·최대 544~746ms로 6번 모두 1초를 넘은 요청이 없어 읽기 시간 제한을 1s로 두었음. 재고 서비스 포트에 TCP 연결을 맺은 시간은 하나씩 50번 최대 0~2ms, 300개 동시 최대 0~86ms, 1000개 동시 최대 1~128ms로 300ms를 넘거나 실패한 연결이 없어 연결 시간 제한을 300ms로 두었음. 두 측정 모두 같은 머신의 루프백이라 망을 건너는 시간은 들어 있지 않고, 운영 망에서도 맞다는 것은 가정임</title>
