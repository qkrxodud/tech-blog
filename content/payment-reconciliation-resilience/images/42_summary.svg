<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>12장 다섯 결정과 비교 구현의 실패 수 요약 — 1 하루치 대사는 그날 거래 내역을 5000건씩 읽어 결제 키로 맞추고 어긋남을 (날짜, 결제 키, 종류)마다 한 줄씩 남기며 결제마다 단건 조회는 계약 13개 중 4개 실패(대사 측정 1만 건에서 단건 조회 35263~36130ms, 운영 995~1033ms), 2 어긋남 처리는 뒤처진 결제만 카드사에 다시 조회해 6장 따라가기로 맞추고 나머지는 운영자 확인으로 남겨 기록만 3개·모두 맞춤 7개 실패, 3 상태 이력은 상태를 바꾼 트랜잭션에서 이전·다음 상태·행위·계기·바뀐 때를 남겨 이력 없음 8개·outbox로 대신 7개 실패, 4 승인 차단기는 기준을 넘으면 승인을 요청하지 않고 바로 실패해 15초 장애 측정에서 결과 모름이 시간 제한만 60·다시 시도 20·차단기 20이고 계약 6개에서 시간 제한만·다시 시도가 4개씩 실패, 5 지표 6개와 보낸 outbox 7일·받은 기록·처리한 명령 14일 정리로 지표 없음 6개·지우지 않음 3개 실패한 그림</title>
