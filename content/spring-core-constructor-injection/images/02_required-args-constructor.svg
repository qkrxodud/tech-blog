<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>롬복의 @RequiredArgsConstructor가 OrderServiceImpl의 final 필드 두 개를 받는 생성자를 만들고, 생성자가 1개뿐이라 @Autowired 없이도 스프링 컨테이너가 그 생성자로 memoryMemberRepository와 rateDiscountPolicy를 주입하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .okms { font-size: 12px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .chip { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .gscope { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .dim { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dimt { font-size: 12.5px; fill: #9ca3af; font-family: Menlo, Consolas, monospace; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .tag { font-size: 11.5px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="350" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="330" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">@RequiredArgsConstructor — final 필드로 생성자를 만들어 주입</text>
  <text x="130" y="72" class="step" text-anchor="middle">1. final 필드 선언</text>
  <text x="380" y="72" class="step" text-anchor="middle">2. 롬복이 생성자 생성</text>
  <text x="630" y="72" class="step" text-anchor="middle">3. 스프링이 생성자로 주입</text>
  <rect x="30" y="84" width="200" height="150" rx="8" class="box"/>
  <text x="130" y="108" class="ms" text-anchor="middle">@RequiredArgsConstructor</text>
  <text x="130" y="132" class="mb" text-anchor="middle">OrderServiceImpl</text>
  <rect x="42" y="148" width="176" height="32" rx="6" class="chip"/>
  <text x="130" y="169" class="ms" text-anchor="middle">final MemberRepository</text>
  <rect x="42" y="188" width="176" height="32" rx="6" class="chip"/>
  <text x="130" y="209" class="ms" text-anchor="middle">final DiscountPolicy</text>
  <line x1="234" y1="159" x2="276" y2="159" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="280" y="84" width="200" height="150" rx="8" class="hold"/>
  <text x="380" y="108" class="sub" text-anchor="middle">자동으로 만들어진 생성자</text>
  <text x="380" y="136" class="mb" text-anchor="middle">OrderServiceImpl(</text>
  <text x="380" y="162" class="m" text-anchor="middle">MemberRepository,</text>
  <text x="380" y="184" class="m" text-anchor="middle">DiscountPolicy)</text>
  <text x="380" y="216" class="sub" text-anchor="middle">생성자가 1개뿐</text>
  <line x1="484" y1="159" x2="526" y2="159" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="530" y="84" width="200" height="150" rx="10" class="scope"/>
  <text x="630" y="108" class="t" text-anchor="middle">스프링 컨테이너</text>
  <rect x="542" y="124" width="176" height="40" rx="8" class="ok"/>
  <text x="630" y="148" class="okms" text-anchor="middle">memoryMemberRepository</text>
  <rect x="542" y="176" width="176" height="40" rx="8" class="ok"/>
  <text x="630" y="200" class="okms" text-anchor="middle">rateDiscountPolicy</text>
  <rect x="130" y="262" width="500" height="40" rx="20" class="ok"/>
  <text x="380" y="287" class="okt" text-anchor="middle">생성자가 1개라 @Autowired를 생략해도 자동으로 주입</text>
  <text x="30" y="326" class="foot">생성자와 대입 코드를 직접 작성하지 않아도, 롬복이 만든 생성자 하나로 의존관계가 주입됩니다.</text>
</svg>
