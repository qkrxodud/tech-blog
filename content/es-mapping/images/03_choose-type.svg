<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 506" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>저장할 값에 따라 integer, long, double, text, keyword, date, boolean 중 데이터 타입을 고르는 기준</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 14px; font-weight: 600; fill: #1f2937; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opn { font-size: 13px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .lbl { font-size: 12.5px; font-weight: 700; fill: #6b7280; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="506" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="486" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">어떤 데이터 타입을 고를까 — 자주 쓰는 타입</text>
  <rect x="150" y="64" width="400" height="40" rx="8" class="box"/>
  <text x="166" y="89" class="t2">10억 이하의 정수만 저장</text>
  <line x1="552" y1="84" x2="586" y2="84" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="590" y="64" width="140" height="40" rx="8" class="ok"/>
  <text x="660" y="89" class="okc" text-anchor="middle">integer</text>
  <rect x="150" y="112" width="400" height="40" rx="8" class="box"/>
  <text x="166" y="137" class="t2">10억이 넘는 정수를 저장할 수도 있음</text>
  <line x1="552" y1="132" x2="586" y2="132" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="590" y="112" width="140" height="40" rx="8" class="ok"/>
  <text x="660" y="137" class="okc" text-anchor="middle">long</text>
  <rect x="150" y="160" width="400" height="40" rx="8" class="box"/>
  <text x="166" y="185" class="t2">실수(소수점을 가진 숫자)를 저장할 수도 있음</text>
  <line x1="552" y1="180" x2="586" y2="180" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="590" y="160" width="140" height="40" rx="8" class="ok"/>
  <text x="660" y="185" class="okc" text-anchor="middle">double</text>
  <text x="30" y="138.0" class="lane">숫자</text>
  <line x1="30" y1="211" x2="730" y2="211" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="150" y="222" width="400" height="40" rx="8" class="box"/>
  <text x="166" y="247" class="t2">토큰으로 쪼개서 저장 — 유연한 검색</text>
  <line x1="552" y1="242" x2="586" y2="242" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="590" y="222" width="140" height="40" rx="8" class="ok"/>
  <text x="660" y="247" class="okc" text-anchor="middle">text</text>
  <rect x="150" y="270" width="400" height="40" rx="8" class="box"/>
  <text x="166" y="295" class="t2">쪼개지 않고 그대로 저장 — 정확한 검색</text>
  <line x1="552" y1="290" x2="586" y2="290" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="590" y="270" width="140" height="40" rx="8" class="ok"/>
  <text x="660" y="295" class="okc" text-anchor="middle">keyword</text>
  <rect x="150" y="318" width="400" height="52" rx="8" class="bad"/>
  <text x="166" y="340" class="badt">주의) 계산에 쓰지 않는 숫자</text>
  <text x="166" y="359" class="note">휴대폰 번호, 주민등록번호 — 숫자가 아닌 문자로</text>
  <path d="M552,344 L660,344 L660,314" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="30" y="302.0" class="lane">문자</text>
  <line x1="30" y1="381" x2="730" y2="381" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="150" y="392" width="400" height="40" rx="8" class="box"/>
  <text x="166" y="417" class="t2">날짜 데이터</text>
  <line x1="552" y1="412" x2="586" y2="412" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="590" y="392" width="140" height="40" rx="8" class="ok"/>
  <text x="660" y="417" class="okc" text-anchor="middle">date</text>
  <rect x="150" y="440" width="400" height="40" rx="8" class="box"/>
  <text x="166" y="465" class="t2">true, false</text>
  <line x1="552" y1="460" x2="586" y2="460" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="590" y="440" width="140" height="40" rx="8" class="ok"/>
  <text x="660" y="465" class="okc" text-anchor="middle">boolean</text>
  <text x="30" y="442.0" class="lane">기타</text>
</svg>
