<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>jcmd 51379 VM.flags 출력 29개 플래그 중 InitialHeapSize 512MB, MaxHeapSize 8GB, MinHeapSize 8MB, UseG1GC를 강조한 그림</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
    .monob { font-family: Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; fill: #15803d; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .opm { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .grid { stroke: #eceef1; stroke-width: 1; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="450" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">jcmd VM.flags — 실행 중인 JVM의 설정 값</text>
  <rect x="30" y="58" width="700" height="32" rx="6" class="dbbox"/>
  <text x="44" y="79" class="mono">$ jcmd 51379 VM.flags</text>
  <text x="44" y="118" class="mono">-XX:CICompilerCount=4</text>
  <text x="44" y="139" class="mono">-XX:ConcGCThreads=2</text>
  <text x="44" y="160" class="mono">-XX:+EnableJVMCIProduct</text>
  <text x="44" y="181" class="mono">-XX:G1ConcRefinementThreads=9</text>
  <text x="44" y="202" class="mono">-XX:G1EagerReclaimRemSetThreshold=32</text>
  <text x="44" y="223" class="mono">-XX:G1HeapRegionSize=4194304</text>
  <text x="44" y="244" class="mono">-XX:G1RemSetArrayOfCardsEntries=32</text>
  <text x="44" y="265" class="mono">-XX:G1RemSetHowlMaxNumBuckets=8</text>
  <text x="44" y="286" class="mono">-XX:G1RemSetHowlNumBuckets=8</text>
  <text x="44" y="307" class="mono">-XX:GCDrainStackTargetSize=64</text>
  <rect x="36" y="313" width="340" height="21" rx="4" class="ok"/>
  <text x="44" y="328" class="monob">-XX:InitialHeapSize=536870912</text>
  <text x="368" y="328" class="monob" text-anchor="end">→ 512MB</text>
  <text x="44" y="349" class="mono">-XX:+ManagementServer</text>
  <text x="44" y="370" class="mono">-XX:MarkStackSize=4194304</text>
  <rect x="36" y="376" width="340" height="21" rx="4" class="ok"/>
  <text x="44" y="391" class="monob">-XX:MaxHeapSize=8589934592</text>
  <text x="368" y="391" class="monob" text-anchor="end">→ 8GB</text>
  <text x="44" y="412" class="mono">-XX:MaxNewSize=5150605312</text>
  <text x="404" y="118" class="mono">-XX:MinHeapDeltaBytes=4194304</text>
  <rect x="396" y="124" width="340" height="21" rx="4" class="ok"/>
  <text x="404" y="139" class="monob">-XX:MinHeapSize=8388608</text>
  <text x="728" y="139" class="monob" text-anchor="end">→ 8MB</text>
  <text x="404" y="160" class="mono">-XX:NonNMethodCodeHeapSize=16384</text>
  <text x="404" y="181" class="mono">-XX:NonProfiledCodeHeapSize=0</text>
  <text x="404" y="202" class="mono">-XX:-ProfileInterpreter</text>
  <text x="404" y="223" class="mono">-XX:ProfiledCodeHeapSize=0</text>
  <text x="404" y="244" class="mono">-XX:SoftMaxHeapSize=8589934592</text>
  <text x="404" y="265" class="mono">-XX:ThreadPriorityPolicy=1</text>
  <text x="404" y="286" class="mono">-XX:TieredStopAtLevel=1</text>
  <text x="404" y="307" class="mono">-XX:-UnlockExperimentalVMOptions</text>
  <text x="404" y="328" class="mono">-XX:+UseCompressedOops</text>
  <rect x="396" y="334" width="340" height="21" rx="4" class="ok"/>
  <text x="404" y="349" class="monob">-XX:+UseG1GC</text>
  <text x="728" y="349" class="monob" text-anchor="end">→ G1 선택</text>
  <text x="404" y="370" class="mono">-XX:-UseNUMA</text>
  <text x="404" y="391" class="mono">-XX:-UseNUMAInterleaving</text>
  <text x="30" y="444" class="sub">터미널 출력은 한 줄로 이어져 나오며, 그림은 플래그마다 줄을 나눈 것입니다. 초록은 본문에서 보는 값입니다</text>
</svg>
