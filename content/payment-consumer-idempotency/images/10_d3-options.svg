  <text x="186" y="182" class="s2" style="font-size:10px;fill:#1f2937">측정(운영 값 1·2·4·8초, 계속 실패시킴 — 15초를 다 쓰고 실패 모음으로): 뒤 결과를</text><text x="186" y="196" class="s2" style="font-size:10px;fill:#1f2937">15813~15933ms(첫 실행) · 15736~15759ms(두 번째) 막음 · 영구 오류는 바로 실패 모음, 58~70ms · 42~46ms</text>
