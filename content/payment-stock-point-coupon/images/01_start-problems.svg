  <text x="24" y="48" class="s2">되돌리기 계약의 처음 값: 재고 5 · 포인트 3000원 · 쿠폰 ISSUED → 주문(상품 2개, 쿠폰, 포인트 1000원)이 잡으면 재고 3 · 2000원 · USED</text>
