  <text x="296" y="84" class="t2" style="font-size:12px">받은 기록</text>
  <text x="296" y="101" class="s" style="font-size:10.5px"><tspan class="m">received_payment_event</tspan></text>
  <rect x="526" y="66" width="220" height="44" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="538" y="84" class="t2" style="font-size:12px">주문</text>
  <text x="538" y="101" class="s" style="font-size:10.5px"><tspan class="m">orders</tspan> 상태 · <tspan class="m">updated_at</tspan></text>
  <rect x="24" y="124" width="200" height="24" rx="6" fill="#b45309"/>
  <text x="124.0" y="140.5" class="tab" text-anchor="middle">첫째 — 같은 메시지 두 번</text>
  <circle cx="24" cy="174" r="10" fill="#111827"/><text x="24" y="178" class="num" text-anchor="middle">1</text>
  <rect x="40" y="158" width="174" height="32" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="52" y="179" class="s" style="font-size:11px">승인 · 번호 N</text>
