<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>이름이 teamA, teamB인 회원을 추가해 회원이 여섯 명일 때, 세타 조인은 이름이 팀 이름과 같은 teamA, teamB 회원 두 명만 조회하고, leftJoin(team).on(member.username.eq(team.name))은 회원 여섯 명을 모두 조회하면서 이름이 같은 팀만 붙이고 나머지는 null인 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .msg { font-size: 11.5px; fill: #374151; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .cont { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="176" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">세타 조인 — 이름이 같은 회원만 남음</text>
  <text x="730" y="42" class="code" text-anchor="end">from(member, team).where(...)</text>
  <rect x="30" y="62" width="108" height="40" rx="8" class="box"/>
  <text x="84" y="87" class="opm" text-anchor="middle">member1</text>
  <rect x="148" y="62" width="108" height="40" rx="8" class="box"/>
  <text x="202" y="87" class="opm" text-anchor="middle">member2</text>
  <rect x="266" y="62" width="108" height="40" rx="8" class="box"/>
  <text x="320" y="87" class="opm" text-anchor="middle">member3</text>
  <rect x="384" y="62" width="108" height="40" rx="8" class="box"/>
  <text x="438" y="87" class="opm" text-anchor="middle">member4</text>
  <rect x="502" y="62" width="108" height="40" rx="8" class="ok"/>
  <text x="556" y="87" class="okm" text-anchor="middle">teamA</text>
  <rect x="620" y="62" width="108" height="40" rx="8" class="ok"/>
  <text x="674" y="87" class="okm" text-anchor="middle">teamB</text>
  <line x1="557" y1="104" x2="557" y2="122" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="400" y="126" width="314" height="40" rx="8" class="ok"/>
  <text x="557" y="151" class="okt" text-anchor="middle">결과: teamA, teamB 두 명</text>
  <text x="30" y="151" class="sub">username = team.name인 회원만 조회됩니다.</text>
  <rect x="10" y="202" width="740" height="208" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="234" class="h">on 조인 — 회원은 모두, 이름이 같은 팀만 붙음</text>
  <text x="730" y="234" class="code" text-anchor="end">leftJoin(team).on(...)</text>
  <rect x="30" y="254" width="112" height="48" rx="8" class="box"/>
  <text x="86" y="283" class="opm" text-anchor="middle">member1</text>
  <rect x="146" y="254" width="112" height="48" rx="8" class="wait"/>
  <text x="202" y="283" class="m" text-anchor="middle">null</text>
  <rect x="266" y="254" width="112" height="48" rx="8" class="box"/>
  <text x="322" y="283" class="opm" text-anchor="middle">member2</text>
  <rect x="382" y="254" width="112" height="48" rx="8" class="wait"/>
  <text x="438" y="283" class="m" text-anchor="middle">null</text>
  <rect x="502" y="254" width="112" height="48" rx="8" class="box"/>
  <text x="558" y="283" class="opm" text-anchor="middle">member3</text>
  <rect x="618" y="254" width="112" height="48" rx="8" class="wait"/>
  <text x="674" y="283" class="m" text-anchor="middle">null</text>
  <rect x="30" y="318" width="112" height="48" rx="8" class="box"/>
  <text x="86" y="347" class="opm" text-anchor="middle">member4</text>
  <rect x="146" y="318" width="112" height="48" rx="8" class="wait"/>
  <text x="202" y="347" class="m" text-anchor="middle">null</text>
  <rect x="266" y="318" width="112" height="48" rx="8" class="box"/>
  <text x="322" y="347" class="opm" text-anchor="middle">teamA</text>
  <rect x="382" y="318" width="112" height="48" rx="8" class="ok"/>
  <text x="438" y="347" class="okm" text-anchor="middle">teamA</text>
  <rect x="502" y="318" width="112" height="48" rx="8" class="box"/>
  <text x="558" y="347" class="opm" text-anchor="middle">teamB</text>
  <rect x="618" y="318" width="112" height="48" rx="8" class="ok"/>
  <text x="674" y="347" class="okm" text-anchor="middle">teamB</text>
  <text x="30" y="392" class="foot">left 조인이므로 이름이 같은 팀이 없는 회원도 팀 자리가 null인 채로 조회됩니다.</text>
</svg>
