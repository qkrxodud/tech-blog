  <line x1="287" y1="510" x2="68" y2="510" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#agr)"/>
  <circle cx="296" cy="510" r="9" fill="#111827"/><text x="296" y="514" class="num" text-anchor="middle">10</text>
  <text x="20" y="528" class="lbl" style="fill: #15803d"><tspan class="m">200 {orderId, cancelAmount,</tspan></text>
  <text x="20" y="543" class="lbl" style="fill: #15803d"><tspan class="m">cancelStatus: DONE, balanceAmount}</tspan></text>
  <line x1="12" y1="556" x2="748" y2="556" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="22" cy="574" r="8" fill="#ef4444"/><text x="22" y="578" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="36" y="578" class="bads">키가 없거나 300자를 넘거나 사유가 없으면 <tspan class="m">400</tspan></text>
  <circle cx="420" cy="574" r="8" fill="#ef4444"/><text x="420" y="578" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="434" y="578" class="bads">결제가 없으면 <tspan class="m">404 PAYMENT_NOT_FOUND</tspan></text>
  <circle cx="22" cy="593" r="8" fill="#ef4444"/><text x="22" y="597" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <text x="36" y="597" class="bads">같은 키에 다른 금액·사유면 <tspan class="m">422</tspan> — 같은 키·같은 내용이면 다음 그림의 재요청 흐름</text>
  <circle cx="22" cy="612" r="8" fill="#ef4444"/><text x="22" y="616" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">D</text>
  <text x="36" y="616" class="bads">승인이 남지 않은 결제·받을 수 있는 금액 초과는 <tspan class="m">409</tspan>, 0원 이하는 <tspan class="m">400</tspan> — 모두 PG 호출 없음</text>
  <circle cx="22" cy="631" r="8" fill="#ef4444"/><text x="22" y="635" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">E</text>
  <text x="36" y="635" class="bads">PG가 4xx면 <tspan class="m">FAILED</tspan>·<tspan class="m">200</tspan>, 시간 초과면 <tspan class="m">UNKNOWN</tspan>·<tspan class="m">504</tspan></text>
  <text x="36" y="652" class="bads">5xx면 <tspan class="m">502</tspan>, 취소는 결과를 기다리는 상태 그대로(첫 요청이면 <tspan class="m">REQUESTED</tspan>, 결과 모름 취소를 같은 키로 다시 보낸 경우면 <tspan class="m">UNKNOWN</tspan>)</text>
