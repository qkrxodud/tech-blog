  <rect width="760" height="258" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="238" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h" text-anchor="start">실수의 피드백 — 루프 843의 setter 혼입이 다음 루프에 반영되는 흐름</text>
  <text x="215" y="68" class="step" text-anchor="middle">루프 843</text>
  <text x="390" y="68" class="step" text-anchor="middle">피드백 기록</text>
  <text x="544" y="68" class="step" text-anchor="middle">다음 루프</text>
  <text x="680" y="68" class="step" text-anchor="middle">이후 루프</text>
  <line x1="160" y1="76" x2="735" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane" text-anchor="start">루프</text>
  <text x="30" y="126" class="sub" text-anchor="start">코드 작성</text>
  <rect x="150" y="86" width="592" height="52" rx="6" class="track"/>
  <rect x="153" y="88" width="124" height="48" rx="8" class="bad"/>
  <text x="215.0" y="108.0" class="badt" text-anchor="middle">setter 혼입</text>
  <text x="215.0" y="127.0" class="val" text-anchor="middle">변경 의도 불명확</text>
  <rect x="488" y="88" width="112" height="48" rx="8" class="box"/>
  <text x="544.0" y="108.0" class="t" text-anchor="middle">파일 읽기</text>
  <text x="544.0" y="127.0" class="val" text-anchor="middle">루프 시작 시</text>
  <rect x="628" y="88" width="106" height="48" rx="8" class="ok"/>
  <text x="681.0" y="108.0" class="okm" text-anchor="middle">changeXxx()</text>
  <text x="681.0" y="127.0" class="val" text-anchor="middle">규칙대로 작성</text>
  <text x="30" y="172" class="lane" text-anchor="start">MEMORY/</text>
  <text x="30" y="190" class="sub" text-anchor="start">피드백 파일</text>
  <rect x="150" y="150" width="592" height="52" rx="6" class="track"/>
  <rect x="295" y="152" width="190" height="48" rx="8" class="hold"/>
  <text x="390.0" y="172.0" class="opm" text-anchor="middle">feedback_no_setter.md</text>
  <text x="390.0" y="191.0" class="val" text-anchor="middle">setter 대신 <tspan font-family="Menlo, Consolas, monospace">changeXxx()</tspan></text>
  <line x1="262" y1="137" x2="318" y2="150" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="470" y1="151" x2="512" y2="139" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="602" y1="112" x2="625" y2="112" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="30" y="236" class="foot" text-anchor="start">피드백을 한 번 파일로 남겨 두면, 이후 루프는 시작할 때마다 이 파일을 읽어 같은 실수를 반복하지 않습니다.</text>
</svg>
