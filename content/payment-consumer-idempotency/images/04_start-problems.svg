  <rect width="760" height="650" fill="#ffffff"/>
  <text x="24" y="28" class="h">출발 코드에서 재현한 다섯 가지 — 주문 서비스 / 재고 서비스</text>
  <text x="214" y="54" class="t2">주문 서비스 — 결제 결과</text>
  <text x="490" y="54" class="t2">재고 서비스 — 확정·해제 명령</text>
  <circle cx="26" cy="86" r="11" fill="#111827"/>
  <text x="26" y="90" class="num" text-anchor="middle" style="font-size:11px">1</text>
  <text x="44" y="91" class="t2" style="font-size:12.5px">같은 메시지 두 번</text>
  <rect x="204" y="66" width="268" height="84" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xs" x="218" y="82"/>
  <text x="230" y="86" class="bads" style="font-size:11px">다시 보낸 결과 — 받은 기록 2줄(기대 1)</text>
  <use href="#xs" x="218" y="99"/>
  <text x="230" y="103" class="bads" style="font-size:11px">다시 읽은 결과 — <tspan class="m">updated_at</tspan>이 다시 바뀜</text>
  <text x="216" y="120" class="gs" style="font-size:11px">주문 상태는 같은 값</text>
  <rect x="480" y="66" width="268" height="84" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="492" y="86" class="gs" style="font-size:11px">재현되지 않음</text>
  <text x="492" y="103" class="gs" style="font-size:11px">10장 예약 상태 전이가 이미 지난 상태로</text>
  <text x="492" y="120" class="gs" style="font-size:11px">보고 바꾸지 않음 — 두 계약 통과</text>
  <circle cx="26" cy="180" r="11" fill="#111827"/>
  <text x="26" y="184" class="num" text-anchor="middle" style="font-size:11px">2</text>
  <text x="44" y="185" class="t2" style="font-size:12.5px">늦게 온 옛 메시지</text>
  <rect x="204" y="160" width="268" height="84" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xs" x="218" y="176"/>
  <text x="230" y="180" class="bads" style="font-size:11px">취소 뒤 옛 승인 → <tspan class="m">PAID</tspan>(기대 <tspan class="m">CANCELED</tspan>)</text>
  <use href="#vs" x="218" y="193"/>
  <text x="230" y="197" class="oks" style="font-size:11px">시계가 달라 시각이 뒤바뀐 새 결과는 통과</text>
  <text x="216" y="214" class="gs" style="font-size:11px">받은 순서대로 따르기 때문</text>
  <rect x="480" y="160" width="268" height="84" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="492" y="180" class="gs" style="font-size:11px">재현되지 않음</text>
  <text x="492" y="197" class="gs" style="font-size:11px">해제 뒤 옛 확정이 와도 해제는 끝 상태라</text>
  <text x="492" y="214" class="gs" style="font-size:11px">예약이 되살아나지 않음</text>
  <circle cx="26" cy="274" r="11" fill="#111827"/>
  <text x="26" y="278" class="num" text-anchor="middle" style="font-size:11px">3</text>
  <text x="44" y="279" class="t2" style="font-size:12.5px">처리할 수 없는 메시지</text>
  <rect x="204" y="254" width="268" height="84" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xs" x="218" y="270"/>
  <text x="230" y="274" class="bads" style="font-size:11px">모르는 상태·읽을 수 없는 본문</text>
  <text x="216" y="291" class="gs" style="font-size:11px">기본 처리 10번 뒤 로그만 남고 넘어감</text>
  <text x="216" y="308" class="gs" style="font-size:11px">30초 동안 실패 모음에 나타나지 않음</text>
  <rect x="480" y="254" width="268" height="84" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xs" x="494" y="270"/>
  <text x="506" y="274" class="bads" style="font-size:11px">읽을 수 없는 명령 — 주문 서비스와 같음</text>
  <use href="#xs" x="494" y="287"/>
  <text x="506" y="291" class="bads" style="font-size:11px">모르는 명령 "HOLD"를 해제로 처리</text>
  <text x="492" y="308" class="gs" style="font-size:11px"><tspan class="m">RELEASED</tspan>(기대 <tspan class="m">RESERVED</tspan>) — 실행에서 봄</text>
  <circle cx="26" cy="368" r="11" fill="#111827"/>
  <text x="26" y="372" class="num" text-anchor="middle" style="font-size:11px">4</text>
  <text x="44" y="373" class="t2" style="font-size:12.5px">일시 장애</text>
  <rect x="204" y="348" width="268" height="84" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xs" x="218" y="364"/>
  <text x="230" y="368" class="bads" style="font-size:11px">6초 <tspan class="m">read_only</tspan> 동안 온 결과 — 30초 기다려도</text>
  <text x="216" y="385" class="gs" style="font-size:11px">반영 안 됨, 기본 처리 10번을 장애 중에 다 씀</text>
  <use href="#xs" x="218" y="398"/>
  <text x="230" y="402" class="bads" style="font-size:11px">다시 시도 중 순서 — 앞 승인을 잃음</text>
  <rect x="480" y="348" width="268" height="84" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xs" x="494" y="364"/>
  <text x="506" y="368" class="bads" style="font-size:11px">6초 장애 동안 온 명령 — 같은 이유로</text>
  <text x="492" y="385" class="gs" style="font-size:11px">반영 안 됨</text>
  <text x="492" y="402" class="gs" style="font-size:11px">1.5초 장애로는 재현되지 않음</text>
  <circle cx="26" cy="462" r="11" fill="#111827"/>
  <text x="26" y="466" class="num" text-anchor="middle" style="font-size:11px">5</text>
  <text x="44" y="467" class="t2" style="font-size:12.5px">같은 파티션 막힘</text>
  <rect x="204" y="442" width="268" height="84" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xs" x="218" y="458"/>
  <text x="230" y="462" class="bads" style="font-size:11px">모르는 상태 바로 뒤 결과가 4.60초 뒤 반영</text>
  <text x="216" y="479" class="gs" style="font-size:11px">기대 2초 안 — 기본 처리 10번이 끝날 때까지</text>
