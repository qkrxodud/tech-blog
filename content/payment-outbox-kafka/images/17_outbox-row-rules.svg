<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 1에서 남기는 payment_outbox 한 줄 — 번호 id(남긴 순서대로 커져 이벤트의 고유 번호, 같은 결제의 이벤트는 번호 순이 만든 순서), 결제 번호 payment_id, 주문번호 order_id, 결과 상태 status, 만든 때 occurred_at, 보낸 때 sent_at(비워 둠). 결제를 가리키는 외래 키는 두지 않음. PaymentOutboxTest 4개로 확인한 남기는 규칙: 승인하면 승인 결과 하나가 남고, 승인 기록이 실패하면 남지 않고, 부분 취소는 남기지 않고, 승인과 전액 취소는 만든 순서대로 남음. 결정 1을 넣은 커밋에서 운영 구현은 보내는 일이 아직 없어 도착을 보는 계약 6개가 실패하고 응답 지연 계약만 통과함</title>
