  <rect width="760" height="616" fill="#ffffff"/>
  <text x="24" y="30" class="h">Mock PG의 취소 처리 순서 — 이번 장에서 더한 동작</text>
  <rect x="40" y="44" width="380" height="56" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <use href="#i-app" x="50" y="57"/>
  <text x="90" y="66" class="s" style="fill: #1f2937"><tspan class="m">POST /v1/payments/{paymentKey}/cancel</tspan></text>
  <text x="90" y="84" class="s"><tspan class="m">Idempotency-Key</tspan> · <tspan class="m">{cancelReason, cancelAmount}</tspan></text>
  <rect x="16" y="124" width="728" height="452" rx="14" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="590" y="112" width="140" height="26" rx="6" fill="#5b7194"/>
  <text x="660" y="130" class="tab" text-anchor="middle">Mock PG</text>
  <line x1="190" y1="101" x2="190" y2="133" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="40" y="135" width="300" height="46" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <rect x="40" y="135" width="300" height="46" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1262;0.1362;0.1862;0.1962;1"/></rect>
  <circle cx="40" cy="135" r="11" fill="#111827"/><text x="40" y="139" class="num" text-anchor="middle">1</text>
  <text x="190" y="155" class="t2" text-anchor="middle">결제 찾기</text>
  <text x="190" y="172" class="s" text-anchor="middle"><tspan class="m">paymentKey</tspan>로</text>
  <line x1="342" y1="158.0" x2="378" y2="158.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="380" y="140" width="352" height="36" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.2"/>
  <use href="#xmark" x="398" y="158.0"/>
  <text x="414" y="162.0" class="bads">없으면 <tspan class="m">404</tspan> — 취소 요청 수에 세지 않음</text>
  <line x1="190" y1="182" x2="190" y2="196" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <polygon points="190,198 340,226 190,254 40,226" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <polygon points="190,198 340,226 190,254 40,226" fill="none" stroke="#d97706" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2507;0.2607;0.3107;0.3207;1"/></polygon>
  <circle cx="40" cy="226" r="11" fill="#111827"/><text x="40" y="230" class="num" text-anchor="middle">2</text>
  <text x="190" y="224" class="t2" text-anchor="middle">서버 오류 시나리오인가</text>
  <text x="190" y="240" class="s" text-anchor="middle">취소 요청 수는 셈</text>
  <line x1="342" y1="226.0" x2="378" y2="226.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="380" y="208" width="352" height="36" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.2"/>
  <use href="#xmark" x="398" y="226.0"/>
  <text x="414" y="230.0" class="bads"><tspan class="m">500 FAILED_INTERNAL_SYSTEM_PROCESSING</tspan></text>
  <text x="394" y="260" class="gs">취소를 남기지 않음(가정) · 멱등 응답으로도 기억하지 않음</text>
  <line x1="190" y1="255" x2="190" y2="270" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <polygon points="190,272 340,300 190,328 40,300" fill="#ece8fb" stroke="#9b88d6" stroke-width="1.5"/>
  <polygon points="190,272 340,300 190,328 40,300" fill="none" stroke="#7c3aed" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3862;0.3962;0.4462;0.4562;1"/></polygon>
  <circle cx="40" cy="300" r="11" fill="#111827"/><text x="40" y="304" class="num" text-anchor="middle">3</text>
  <text x="190" y="298" class="t2" text-anchor="middle">같은 멱등키를 본 적 있나</text>
  <text x="190" y="314" class="s" text-anchor="middle">결제마다 · 헤더가 있을 때</text>
  <line x1="342" y1="284.0" x2="378" y2="284.0" stroke="#16a34a" stroke-width="1.5" marker-end="url(#agr)"/>
  <rect x="380" y="270" width="352" height="28" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.2"/>
  <use href="#vmark" x="398" y="284.0"/>
  <text x="414" y="288.0" class="oks">끝난 요청이면 첫 응답 그대로 — 다시 취소하지 않음</text>
  <line x1="342" y1="316.0" x2="378" y2="316.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="380" y="302" width="352" height="28" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.2"/>
  <use href="#xmark" x="398" y="316.0"/>
  <text x="414" y="320.0" class="bads">처리 중이면 <tspan class="m">409 IDEMPOTENT_REQUEST_PROCESSING</tspan></text>
  <line x1="190" y1="329" x2="190" y2="349" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="40" y="351" width="300" height="46" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <rect x="40" y="351" width="300" height="46" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.45;0.46;0.62;0.63;1"/></rect>
  <circle cx="40" cy="351" r="11" fill="#111827"/><text x="40" y="355" class="num" text-anchor="middle">4</text>
  <text x="190" y="371" class="t2" text-anchor="middle">시나리오 시간만큼 기다림</text>
  <text x="190" y="388" class="s" text-anchor="middle">예: 늦은 취소는 1.5초</text>
  <g transform="translate(52,360) scale(0.9)"><use href="#i-clock"/></g>
  <line x1="342" y1="374" x2="378" y2="374" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#agy)"/>
  <rect x="380" y="356" width="352" height="36" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>
  <text x="394" y="379" class="s">결제 서버가 기다리기를 그만둬도 취소는 남음</text>
  <line x1="190" y1="398" x2="190" y2="418" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <polygon points="190,420 340,448 190,476 40,448" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <polygon points="190,420 340,448 190,476 40,448" fill="none" stroke="#d97706" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6972;0.7072;0.7572;0.7672;1"/></polygon>
  <circle cx="40" cy="448" r="11" fill="#111827"/><text x="40" y="452" class="num" text-anchor="middle">5</text>
  <text x="190" y="446" class="t2" text-anchor="middle">취소할 수 있나</text>
  <text x="190" y="462" class="s" text-anchor="middle">잔액·결제 상태</text>
  <line x1="342" y1="444.0" x2="378" y2="444.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="380" y="408" width="352" height="72" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.2"/>
  <text x="394" y="426" class="bads">잔액 초과·0원 이하 <tspan class="m">403 NOT_CANCELABLE_AMOUNT</tspan></text>
  <text x="394" y="443" class="bads">전액 취소된 결제 <tspan class="m">400 ALREADY_CANCELED_PAYMENT</tspan></text>
  <text x="394" y="460" class="bads">승인 실패 결제 <tspan class="m">403 NOT_CANCELABLE_PAYMENT</tspan></text>
  <line x1="190" y1="477" x2="190" y2="500" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="40" y="500" width="692" height="64" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <rect x="40" y="500" width="692" height="64" rx="10" fill="none" stroke="#16a34a" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.84;0.85;0.9;0.91;1"/></rect>
  <use href="#vmark" x="62" y="532"/>
  <text x="80" y="519" class="okt"><tspan class="m">200</tspan> Payment — <tspan class="m">balanceAmount</tspan>와 취소 이력 <tspan class="m">cancels[]</tspan></text>
  <text x="80" y="537" class="oks"><tspan class="m">cancels[]</tspan> 칸: <tspan class="m">transactionKey</tspan> · <tspan class="m">cancelAmount</tspan> · <tspan class="m">cancelReason</tspan> · <tspan class="m">canceledAt</tspan> · <tspan class="m">cancelStatus: DONE</tspan></text>
  <text x="80" y="555" class="oks">잔액이 0원이면 <tspan class="m">CANCELED</tspan>, 남으면 <tspan class="m">PARTIAL_CANCELED</tspan></text>
  <text x="24" y="594" class="gs"><tspan class="m">GET /v1/payments/orders/{orderId}</tspan> 응답에도 <tspan class="m">balanceAmount</tspan>와 <tspan class="m">cancels</tspan>를 더했습니다</text>
  <text x="24" y="611" class="gs">가정: 같은 멱등키에 다른 본문이 와도 첫 응답을 줌 · 멱등키 15일 유효 기간은 흉내 내지 않음</text>
  <g class="anim" opacity="0">
    <use href="#pkt"/>
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear"
      path="M190,100 V490"
      keyPoints="0;0;0.1487;0.3231;0.5128;0.6179;0.6179;0.8923;1;1;1" keyTimes="0;0.03;0.1362;0.2607;0.3962;0.46;0.57;0.7072;0.85;0.85;1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.025;0.03;0.85;0.86;1"/>
  </g>
</svg>
