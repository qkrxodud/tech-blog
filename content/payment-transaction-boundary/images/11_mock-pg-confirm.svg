<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>Mock PG의 승인 API POST /v1/payments/confirm이 지나는 순서 — 지금 시나리오를 읽고, 주문을 기다리는 주문에 올리고, 시나리오의 지연 시간만큼 Thread.sleep으로 기다린 뒤 finally에서 내리고, 서버 오류 시나리오면 500 FAILED_INTERNAL_SYSTEM_PROCESSING(완성 코드에서 더한 분기), 거절 시나리오면 400 CARD_REJECTED로 답하고, 아니면 주문별 승인 횟수를 기록하고 200 status DONE으로 답함. 결제 서버가 이미 기다리기를 그만뒀어도 승인은 남음. 시나리오는 제어 API PUT /control/scenario로 바꾸고, 테스트는 지금 기다리는 주문과 주문별 승인 횟수를 봄</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 13px; font-weight: 700; fill: #1f2937; }
