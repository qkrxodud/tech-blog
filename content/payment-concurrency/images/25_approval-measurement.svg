<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>같은 결제에 같은 결제 키 승인 30개를 한꺼번에 보낸 측정 — 결정 2가 들어간 코드라 PG 답을 기다리는 결제에 다시 온 같은 키는 AUTHENTICATED(API 202) 확인 중으로 답함. 결제 줄 잠금은 PG 승인 요청 1, 승인 1·확인 중 29(응답 중앙값 14ms). 잠그지 않음은 PG 승인 요청 10, 승인 10·확인 중 20. 상태 조건 UPDATE는 PG 승인 요청 1, 승인 1·확인 중 20·409가 9. 변경 번호 비교는 PG 승인 요청 1, 승인 1·확인 중 2·409가 27. @Version 그대로는 PG 승인 요청 1, 승인 1·확인 중 20·내부 오류 9. 조건은 스레드 30개에서 래치로 한꺼번에, 트리거로 겹침을 고정하지 않고 PG는 바로 답하며, 연결 풀은 기본값 10개, 묶음마다 결제 3건, 전체를 한 번 실행</title>
  <style>
