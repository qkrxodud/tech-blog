<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>password 값이 들어 있는 User 객체를 ObjectMapper로 직렬화하면 @JsonIgnoreProperties로 지정한 password가 제외되어 username과 email만 JSON에 담기는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .desc { font-size: 13px; fill: #374151; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .dimt { font-size: 12px; fill: #9ca3af; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .chip { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .dim { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .okms { font-size: 12px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .badms { font-size: 12px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="300" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">직렬화 — 지정한 <tspan font-family="Menlo, Consolas, monospace">password</tspan>는 JSON에서 빠짐</text>
  <text x="730" y="42" class="code" text-anchor="end">@JsonIgnoreProperties({"password"})</text>

  <rect x="30" y="70" width="280" height="160" rx="8" class="box"/>
  <text x="170" y="96" class="t" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">User</tspan> 객체</text>
  <rect x="44" y="110" width="252" height="30" rx="6" class="chip"/>
  <text x="56" y="130" class="m">username = "john"</text>
  <rect x="44" y="146" width="252" height="30" rx="6" class="bad"/>
  <text x="56" y="166" class="badms">password = "secret"</text>
  <rect x="44" y="182" width="252" height="30" rx="6" class="chip"/>
  <text x="56" y="202" class="m">email = "john@example.com"</text>

  <text x="380" y="140" class="ms" text-anchor="middle">writeValueAsString</text>
  <line x1="314" y1="152" x2="444" y2="152" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>

  <rect x="450" y="70" width="280" height="160" rx="8" class="ok"/>
  <text x="590" y="96" class="okt" text-anchor="middle">생성된 JSON</text>
  <text x="470" y="128" class="m">{</text>
  <text x="486" y="150" class="m">"username": "john",</text>
  <text x="486" y="172" class="m">"email": "john@example.com"</text>
  <text x="470" y="194" class="m">}</text>

  <rect x="30" y="250" width="700" height="44" rx="8" class="bad"/>
  <text x="380" y="277" class="note" text-anchor="middle">객체에는 <tspan font-family="Menlo, Consolas, monospace">password</tspan> 값이 있지만, 어노테이션에 지정했기 때문에 직렬화 결과에서 제외됩니다</text>
</svg>
