  <rect width="760" height="428" fill="#ffffff"/>
  <text x="24" y="30" class="h">부분 취소된 결제의 상태 — 상태는 그대로, 남은 금액이 0원이면 닫음</text>
  <text x="24" y="52" class="gs">15000원 승인 결제에 5000원, 10000원 부분 취소 · <tspan class="m">complete()</tspan> → <tspan class="m">cancelIfNothingLeft()</tspan></text>
  <rect x="16" y="86" width="728" height="230" rx="14" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="30" y="74" width="200" height="24" rx="6" fill="#5b7194"/>
  <text x="130.0" y="91" class="tab" text-anchor="middle">결제 하나에 부분 취소 두 번</text>
