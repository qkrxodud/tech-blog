<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 434" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>15000원 결제에 1000원 부분 취소 30개를 한꺼번에 보낸 측정 — 결제 줄 잠금은 PG 취소 요청이 정확히 15개이고 15개는 보내기 전에 거부하며 응답 중앙값 88~90ms, 잠그지 않음은 PG 요청 20~21개 중 5~6개를 PG가 거절하고 42~65ms, 상태 조건 UPDATE는 24개 중 9개 거절에 105~118ms, @Version 그대로는 20~23개 중 5~8개 거절에 65~97ms다. 변경 번호 비교는 PG에 3개를 보냈지만 우리 기록은 1~2건만 끝나고 나머지는 409라 우리 남은 금액 13000~14000원, PG 잔액 12000원으로 어긋났다</title>
