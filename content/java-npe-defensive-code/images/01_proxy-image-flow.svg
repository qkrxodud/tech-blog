<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>개발 서버는 이미지 원본에서 직접 받을 수 없어 프록시 서버가 이미지를 먼저 받아 두고, 개발 서버가 프록시 서버에 다시 요청해 받는 구조와, 응답 body가 null로 오는 지점</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 12px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .valc { font-size: 12px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 12px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 12px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .lbl { font-size: 12px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="310" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">이미지 받아 오기 — 프록시 서버를 거치는 구조</text>
  <path d="M120,128 C120,78 640,78 640,128" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="380" y="114" class="note" text-anchor="middle">직접 받을 수 없음</text>
  <rect x="30" y="130" width="180" height="64" rx="8" class="box"/>
  <text x="120" y="157" class="t" text-anchor="middle">개발 서버</text>
  <text x="120" y="178" class="valc" text-anchor="middle">exchange(uri, GET)</text>
  <rect x="290" y="130" width="180" height="64" rx="8" class="box"/>
  <text x="380" y="157" class="t" text-anchor="middle">프록시 서버</text>
  <text x="380" y="178" class="val" text-anchor="middle">이미지를 먼저 받음</text>
  <rect x="550" y="130" width="180" height="64" rx="8" class="hold"/>
  <text x="640" y="157" class="t" text-anchor="middle">이미지 원본</text>
  <text x="640" y="178" class="val" text-anchor="middle">개발 서버에서 접근 불가</text>
  <line x1="472" y1="152" x2="546" y2="152" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="510" y="145" class="lbl" text-anchor="middle">①</text>
  <line x1="548" y1="174" x2="474" y2="174" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="510" y="190" class="gnote" text-anchor="middle">②</text>
  <line x1="212" y1="152" x2="286" y2="152" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="250" y="145" class="lbl" text-anchor="middle">③</text>
  <line x1="288" y1="174" x2="214" y2="174" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="250" y="190" class="note" text-anchor="middle">④</text>
  <rect x="30" y="206" width="180" height="30" rx="15" class="bad"/>
  <text x="120" y="226" class="badt" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">getBody()</tspan>가 null</text>
  <text x="30" y="266" class="sub">① 프록시 서버가 이미지 원본에 이미지를 요청하고, ② 이미지를 먼저 받아 둡니다.</text>
  <text x="30" y="288" class="sub">③ 개발 서버가 <tspan font-family="Menlo, Consolas, monospace">exchange(uri, GET)</tspan>으로 프록시 서버의 이미지를 다시 요청합니다.</text>
  <text x="30" y="310" class="note">④ 파일이 없으면 응답의 <tspan font-family="Menlo, Consolas, monospace">getBody()</tspan>가 null이고, 이어서 <tspan font-family="Menlo, Consolas, monospace">getInputStream()</tspan>을 호출하는 곳에서 NPE가 발생합니다.</text>
</svg>
