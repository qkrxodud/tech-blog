  <text x="280" y="188" class="bs" style="font-size:11.5px">기다리다 그만두면</text>
  <circle cx="472" cy="183" r="13" fill="#2563eb"/>
  <text x="472" y="188" class="num" text-anchor="middle" style="font-size:12.5px">1</text>
