  <rect x="32" y="114" width="196" height="26" rx="6" fill="#5b7194"/>
  <text x="130.0" y="132" class="tab" text-anchor="middle">처리기 — Payment.follow</text>
  <g transform="translate(0,12)">
  <rect x="60" y="140" width="280" height="50" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
