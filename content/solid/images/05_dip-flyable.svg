<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>고수준 모듈 BirdHandler와 저수준 모듈 Sparrow, Eagle이 모두 Flyable 인터페이스에 의존하고, Main이 Sparrow와 Eagle을 생성해 BirdHandler 생성자로 넘기면 각각 Sparrow is flying, Eagle is soaring high가 출력되는 그림</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .bt { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .gl { font-size: 12.5px; font-weight: 700; fill: #6b7280; }
    .cv { font-family: Menlo, Consolas, monospace; font-size: 12.5px; fill: #4b5563; }
    .cvb { font-family: Menlo, Consolas, monospace; font-size: 12.5px; fill: #b91c1c; }
    .cvg { font-family: Menlo, Consolas, monospace; font-size: 12.5px; fill: #15803d; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="360" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="340" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">DIP — 고수준과 저수준 모두 Flyable에 의존</text>
  <text x="730" y="42" class="code" text-anchor="end">bird.fly()</text>
  <text x="30" y="100" class="lane">고수준 모듈</text>
  <text x="30" y="188" class="lane">추상화</text>
  <text x="30" y="282" class="lane">저수준 모듈</text>
  <rect x="270" y="68" width="200" height="54" rx="8" class="box"/>
  <text x="370" y="91" class="op" text-anchor="middle">BirdHandler</text>
  <text x="370" y="111" class="cv" text-anchor="middle">Flyable bird</text>
  <rect x="540" y="68" width="190" height="54" rx="8" class="hold"/>
  <text x="635" y="91" class="op" text-anchor="middle">Main</text>
  <text x="635" y="111" class="cv" text-anchor="middle">new BirdHandler(...)</text>
  <line x1="538" y1="95" x2="474" y2="95" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <text x="506" y="140" class="sub" text-anchor="middle">생성자로 전달</text>
  <rect x="270" y="160" width="200" height="50" rx="8" class="hold"/>
  <text x="370" y="181" class="op" text-anchor="middle">Flyable</text>
  <text x="370" y="200" class="cv" text-anchor="middle">fly()</text>
  <rect x="150" y="252" width="200" height="54" rx="8" class="ok"/>
  <text x="250" y="275" class="okc" text-anchor="middle">Sparrow</text>
  <text x="250" y="295" class="cv" text-anchor="middle">Sparrow is flying</text>
  <rect x="400" y="252" width="200" height="54" rx="8" class="ok"/>
  <text x="500" y="275" class="okc" text-anchor="middle">Eagle</text>
  <text x="500" y="295" class="cv" text-anchor="middle">Eagle is soaring high</text>
  <line x1="370" y1="124" x2="370" y2="157" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="250" y1="250" x2="330" y2="213" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="500" y1="250" x2="410" y2="213" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="334" class="gnote">의존 화살표가 모두 Flyable을 향합니다. Main은 Sparrow와 Eagle을 생성해 BirdHandler 생성자로 넘깁니다.</text>
</svg>
