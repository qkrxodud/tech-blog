  <rect width="760" height="520" fill="#ffffff"/>
  <text x="24" y="30" class="h">결정 6 — Mock PG를 어떤 형태로 만들까</text>
  <text x="24" y="52" class="gs" style="font-size:11px">점선은 비교 구현하지 않은 형태</text>
  <rect x="24" y="72" width="228" height="92" rx="12" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="38" y="96" class="bt" style="font-size:12px">같은 JVM 안의 가짜 구현</text>
  <text x="38" y="122" class="bs" style="font-size:11px"><tspan class="m">PaymentGateway</tspan>를</text>
  <text x="38" y="141" class="bs" style="font-size:11px">테스트용 클래스로 대신함</text>
  <text x="38" y="190" class="gt" style="font-size:12px">읽기 시간 제한</text>
  <rect x="24" y="200" width="228" height="84" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="38" y="224" class="t2" style="font-size:12.5px"></text>
  <text x="38" y="226" class="s" style="font-size:11px">지나가지 않음</text>
  <text x="38" y="245" class="s" style="font-size:11px">시간 제한은 실제 HTTP 요청에서</text>
  <text x="38" y="264" class="s" style="font-size:11px"><tspan class="m">JdkClientHttpRequestFactory</tspan>가 걺</text>
  <text x="38" y="310" class="gt" style="font-size:12px">맞는 경우</text>
  <rect x="24" y="320" width="228" height="90" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="38" y="344" class="t2" style="font-size:12.5px"></text>
  <text x="38" y="346" class="s" style="font-size:11px">PG 결과에 따른 분기만 확인하고</text>
  <text x="38" y="366" class="s" style="font-size:11px">HTTP 계층은 볼 필요가 없을 때</text>
  <text x="38" y="386" class="s" style="font-size:11px">가장 빠름</text>
  <rect x="266" y="72" width="228" height="92" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="280" y="96" class="gt" style="font-size:12px">WireMock 같은 HTTP 대역</text>
  <text x="280" y="122" class="gs" style="font-size:11px">비교 구현하지 않음</text>
  <text x="280" y="141" class="gs" style="font-size:11px">직접 만든 모듈과의 차이는 확인 못 함</text>
  <text x="280" y="190" class="gt" style="font-size:12px">읽기 시간 제한</text>
  <rect x="266" y="200" width="228" height="84" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="280" y="224" class="gt" style="font-size:12.5px"></text>
  <text x="280" y="226" class="gs" style="font-size:11px">확인하지 않음</text>
  <text x="280" y="310" class="gt" style="font-size:12px">맞는 경우</text>
  <rect x="266" y="320" width="228" height="90" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="280" y="344" class="gt" style="font-size:12.5px"></text>
  <text x="280" y="346" class="gs" style="font-size:11px">실제 PG 문서의 요청·응답 형식을</text>
  <text x="280" y="366" class="gs" style="font-size:11px">많이 흉내 내야 할 때</text>
  <text x="280" y="386" class="gs" style="font-size:11px">요청 일치 규칙과 응답 틀</text>
  <rect x="508" y="72" width="228" height="92" rx="12" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="532" y="91"/>
  <text x="548" y="96" class="okt" style="font-size:12px">직접 만든 별도 모듈 — 고름</text>
  <text x="522" y="122" class="oks" style="font-size:11px">실제 HTTP로 답하는</text>
  <text x="522" y="141" class="oks" style="font-size:11px">Spring Boot 앱(<tspan class="m">mock-pg</tspan>)</text>
  <text x="522" y="190" class="gt" style="font-size:12px">읽기 시간 제한</text>
  <rect x="508" y="200" width="228" height="84" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="522" y="224" class="t2" style="font-size:12.5px"></text>
  <text x="522" y="226" class="s" style="font-size:11px">지나감</text>
  <text x="522" y="245" class="s" style="font-size:11px">결제 서버와 실제 HTTP로 주고받음</text>
  <text x="522" y="310" class="gt" style="font-size:12px">고른 이유</text>
  <rect x="508" y="320" width="228" height="90" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="522" y="344" class="t2" style="font-size:12.5px"></text>
  <text x="522" y="346" class="s" style="font-size:11px">시간 제한 설정을 시험할 수 있음</text>
  <text x="522" y="366" class="s" style="font-size:11px">6장 웹훅도 같은 Mock PG에</text>
  <text x="522" y="386" class="s" style="font-size:11px">기능을 더하면 됨</text>
  <rect x="24" y="428" width="712" height="72" rx="12" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <text x="38" y="452" class="ot" style="font-size:12.5px">별도 모듈로 치르는 것</text>
  <text x="38" y="474" class="os" style="font-size:11.5px">빌드가 멀티 모듈이 됨 · 테스트마다 Mock PG를 띄우는 시간이 듦</text>
  <text x="38" y="492" class="os" style="font-size:11px">테스트에서는 결제 서버와 같은 클래스 경로를 써서 Mock PG 쪽 DB 자동 구성을 끄고 띄움</text>
</svg>
