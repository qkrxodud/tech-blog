<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>웹 브라우저가 HTTP 요청 메시지를 만들고 3-way handshake로 연결한 뒤 메시지를 TCP/IP 패킷에 담아 전송하면, 구글 서버가 200 OK와 HTML을 담은 응답 메시지를 만들어 돌려보내고 웹 브라우저가 HTML을 렌더링하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .m { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .mv { font-size: 12px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="416" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="396" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">웹 브라우저 요청 흐름 — HTTP 메시지를 TCP/IP 패킷에 담아 주고받는다</text>
  <text x="220" y="68" class="step" text-anchor="middle">1. 요청 메시지 생성</text>
  <text x="360" y="68" class="step" text-anchor="middle">2. 연결 후 패킷 전송</text>
  <text x="500" y="68" class="step" text-anchor="middle">3. 응답 메시지 생성</text>
  <text x="640" y="68" class="step" text-anchor="middle">4. 응답 전송, 렌더링</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="110" class="lane">웹 브라우저</text>
  <text x="30" y="128" class="sub">클라이언트</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <text x="30" y="200" class="lane">구글 서버</text>
  <text x="30" y="218" class="sub">요청을 받는 쪽</text>
  <rect x="150" y="176" width="585" height="52" rx="6" class="track"/>

  <rect x="162" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="108" class="t" text-anchor="middle">요청 메시지</text>
  <text x="220" y="127" class="val" text-anchor="middle">HTTP 형태로 생성</text>
  <rect x="302" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="360" y="108" class="t" text-anchor="middle">TCP/IP 패킷</text>
  <text x="360" y="127" class="val" text-anchor="middle">메시지를 담아 전송</text>
  <line x1="360" y1="137" x2="360" y2="176" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="368" y="160" class="sub">노드를 거쳐 전달</text>
  <rect x="302" y="178" width="116" height="48" rx="8" class="hold"/>
  <text x="360" y="207" class="val" text-anchor="middle">요청 패킷 도착</text>
  <rect x="442" y="178" width="116" height="48" rx="8" class="box"/>
  <text x="500" y="198" class="t" text-anchor="middle">응답 메시지</text>
  <text x="500" y="217" class="val" text-anchor="middle">200 OK, HTML</text>
  <rect x="582" y="178" width="116" height="48" rx="8" class="hold"/>
  <text x="640" y="207" class="val" text-anchor="middle">응답 패킷 전송</text>
  <line x1="640" y1="177" x2="640" y2="138" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="582" y="88" width="116" height="48" rx="8" class="ok"/>
  <text x="640" y="108" class="okt" text-anchor="middle">HTML 렌더링</text>
  <text x="640" y="127" class="val" text-anchor="middle">화면에 표시</text>
  <text x="160" y="158" class="sub">3-way handshake로 연결</text>

  <rect x="30" y="248" width="340" height="120" rx="8" class="box"/>
  <text x="46" y="270" class="sub">요청 메시지</text>
  <text x="46" y="296" class="mv">GET /search?q=hello&amp;hl=ko HTTP/1.1</text>
  <text x="46" y="316" class="mv">Host: www.google.com</text>
  <rect x="390" y="248" width="340" height="120" rx="8" class="box"/>
  <text x="406" y="270" class="sub">응답 메시지</text>
  <text x="406" y="296" class="mv">HTTP/1.1 200 OK</text>
  <text x="406" y="316" class="mv">Content-Type: text/html;charset=UTF-8</text>
  <text x="406" y="336" class="val"><tspan font-family="Menlo, Consolas, monospace" style="font-size:12px">Content-Length:</tspan> 실제 HTML 데이터 길이</text>
  <text x="406" y="356" class="mv">&lt;html&gt;...&lt;/html&gt;</text>
  <text x="30" y="392" class="foot">요청과 응답 모두 HTTP 메시지를 TCP/IP 패킷에 담아 보내고, 받는 쪽이 메시지를 꺼내 처리합니다.</text>
</svg>
