<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 652" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>6장 출발 코드의 웹훅 — Mock PG가 POST /api/v1/webhooks/tosspayments로 eventType, createdAt, data를 보내면 결제 서버는 PAYMENT_STATUS_CHANGED인지 보고, 주문번호로 결제를 찾아 본문의 상태를 report(GatewayStatus.of(status))로 전이 표대로 옮긴 뒤 트랜잭션을 커밋하고 본문 없는 200으로 답한다. 결제가 없으면 404 PAYMENT_NOT_FOUND, 전이 표에 없는 행위면 409 INVALID_PAYMENT_TRANSITION으로 답하고, Mock PG는 10초 안에 200을 받지 못하면 같은 본문을 최대 7번 다시 보낸다.</title>
