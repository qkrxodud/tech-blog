  <text x="664.0" y="66" class="t2" style="font-size:13px;font-weight:700;fill:#1f2937">Mock PG</text>
  <text x="664.0" y="84" class="s2">결제 조회</text>
  <text x="290.0" y="120" class="lbl hl" text-anchor="middle"><tspan class="m">tryLock</tspan>: <tspan class="m">update … where locked_until &lt;= now</tspan></text>
  <line x1="89" y1="128" x2="498" y2="128" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <circle cx="80" cy="128" r="9" fill="#111827"/><text x="80" y="132" class="num" text-anchor="middle" style="font-size:11px">1</text>
  <line x1="500" y1="156" x2="82" y2="156" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#agr)"/>
  <circle cx="500" cy="156" r="9" fill="#111827"/><text x="500" y="160" class="num" text-anchor="middle" style="font-size:11px">2</text>
  <text x="486" y="152" class="lbl hl" text-anchor="end" style="fill:#15803d">1줄 → 서버 1이 맡음(15분)</text>
  <line x1="219" y1="196" x2="498" y2="196" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <circle cx="210" cy="196" r="9" fill="#111827"/><text x="210" y="200" class="num" text-anchor="middle" style="font-size:11px">3</text>
  <line x1="500" y1="216" x2="212" y2="216" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#agy)"/>
  <text x="486" y="212" class="lbl" text-anchor="end" style="fill:#6b7280">0줄</text>
  <line x1="349" y1="246" x2="498" y2="246" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <circle cx="340" cy="246" r="9" fill="#111827"/><text x="340" y="250" class="num" text-anchor="middle" style="font-size:11px">4</text>
  <line x1="500" y1="266" x2="342" y2="266" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#agy)"/>
  <text x="486" y="262" class="lbl" text-anchor="end" style="fill:#6b7280">0줄</text>
  <rect x="90" y="226" width="112" height="26" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="146" y="244" class="gs" text-anchor="middle" style="font-size:12px">이번 주기를 넘김</text>
  <text x="590" y="192" class="s2" text-anchor="middle">같은 때 맡으려 해도</text>
  <text x="590" y="210" class="s2" text-anchor="middle">MySQL이 같은 줄을</text>
  <text x="590" y="228" class="s2" text-anchor="middle">하나씩 바꿔 나중은 0줄</text>
  <text x="380.0" y="288" class="lbl hl" text-anchor="middle" style="fill:#c2410c"><tspan class="m">PaymentReconciler</tspan> · <tspan class="m">PaymentCancelReconciler</tspan> → 결제마다 조회</text>
  <line x1="89" y1="296" x2="678" y2="296" stroke="#c2410c" stroke-width="1.6" class="run" marker-end="url(#aor)"/>
  <circle cx="80" cy="296" r="9" fill="#111827"/><text x="80" y="300" class="num" text-anchor="middle" style="font-size:11px">5</text>
  <text x="380.0" y="344" class="lbl hl" text-anchor="middle" style="fill:#15803d">조회 결과로 결제를 맞춤</text>
  <line x1="680" y1="326" x2="82" y2="326" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#agr)"/>
  <circle cx="680" cy="326" r="9" fill="#111827"/><text x="680" y="330" class="num" text-anchor="middle" style="font-size:11px">6</text>
  <text x="290.0" y="368" class="lbl hl" text-anchor="middle"><tspan class="m">finally</tspan> <tspan class="m">unlock</tspan>: <tspan class="m">locked_until = now</tspan></text>
  <line x1="89" y1="376" x2="498" y2="376" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <circle cx="80" cy="376" r="9" fill="#111827"/><text x="80" y="380" class="num" text-anchor="middle" style="font-size:11px">7</text>
  <line x1="500" y1="396" x2="82" y2="396" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#agy)"/>
  <line x1="12" y1="424" x2="748" y2="424" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="22" cy="446" r="8" fill="#16a34a"/><text x="22" y="450" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="36" y="450" class="oks">작업이 도중에 실패해도 <tspan class="m">finally</tspan>에서 당겨 두어 다음 주기에 아무 서버나 맡음</text>
  <circle cx="22" cy="470" r="8" fill="#9ca3af"/><text x="22" y="474" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="36" y="474" class="gs">맡은 서버가 죽으면 <tspan class="m">locked_until</tspan>(맡는 시간 15분)이 지날 때까지 아무도 맡지 못함 — 실제로 죽여 보지는 않음</text>
  <text x="36" y="496" class="gs">받은 알림 처리(payment-webhook)도 같은 방식으로 따로 한 줄을 씀</text>
