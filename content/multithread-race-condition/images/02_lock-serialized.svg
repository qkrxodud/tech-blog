<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>스레드 1이 락을 잡고 5를 읽어 6을 저장한 뒤 해제하는 동안 스레드 2는 기다렸다가 6을 읽어 7을 저장하는 실행 순서</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .opk { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .lbl { font-size: 13px; font-weight: 700; fill: #374151; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="310" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">synchronized·ReentrantLock — 한 번에 한 스레드만</text>
  <text x="730" y="42" class="code" text-anchor="end">lock → counter++ → unlock</text>
  <text x="220" y="68" class="step" text-anchor="middle">1단계</text>
  <text x="360" y="68" class="step" text-anchor="middle">2단계</text>
  <text x="500" y="68" class="step" text-anchor="middle">3단계</text>
  <text x="640" y="68" class="step" text-anchor="middle">4단계</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">스레드 1</text>
  <text x="30" y="126" class="sub">먼저 락을 잡음</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="88" width="116" height="48" rx="8" class="hold"/>
  <text x="220" y="108" class="opk" text-anchor="middle">락 획득·읽기</text>
  <text x="220" y="127" class="val" text-anchor="middle">5 읽음</text>
  <rect x="302" y="88" width="116" height="48" rx="8" class="hold"/>
  <text x="360" y="108" class="opk" text-anchor="middle">증가·쓰기</text>
  <text x="360" y="127" class="val" text-anchor="middle">6 저장, 락 해제</text>

  <text x="30" y="168" class="lane">스레드 2</text>
  <text x="30" y="186" class="sub">락이 풀린 뒤</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="158" width="256" height="28" rx="6" class="wait"/>
  <text x="290" y="177" class="waitt" text-anchor="middle">락 대기 (스레드 1이 잡고 있음)</text>
  <rect x="442" y="148" width="116" height="48" rx="8" class="hold"/>
  <text x="500" y="168" class="opk" text-anchor="middle">락 획득·읽기</text>
  <text x="500" y="187" class="val" text-anchor="middle">6 읽음</text>
  <rect x="582" y="148" width="116" height="48" rx="8" class="hold"/>
  <text x="640" y="168" class="opk" text-anchor="middle">증가·쓰기</text>
  <text x="640" y="187" class="val" text-anchor="middle">7 저장, 락 해제</text>
  <line x1="390" y1="136" x2="455" y2="147" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>

  <text x="30" y="235" class="db">counter</text>
  <rect x="180" y="214" width="80" height="32" rx="6" class="dbbox"/>
  <text x="220" y="235" class="db" text-anchor="middle">5</text>
  <rect x="320" y="214" width="80" height="32" rx="6" class="dbbox"/>
  <text x="360" y="235" class="db" text-anchor="middle">6</text>
  <rect x="460" y="214" width="80" height="32" rx="6" class="dbbox"/>
  <text x="500" y="235" class="db" text-anchor="middle">6</text>
  <rect x="600" y="214" width="80" height="32" rx="6" class="ok"/>
  <text x="640" y="235" class="okt" text-anchor="middle">7</text>

  <text x="150" y="272" class="sub">스레드 2는 스레드 1이 저장한 6을 읽고 나서 더하므로 두 번의 증가가 모두 남습니다</text>
  <rect x="150" y="284" width="250" height="26" rx="13" class="ok"/>
  <text x="275" y="302" class="okt" text-anchor="middle" style="font-size:13px">결과 7 (항상 같은 결과)</text>
</svg>
