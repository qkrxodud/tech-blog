  <text x="24" y="480" class="gs" style="font-size:10.5px">‘한 줄씩 skip locked’ 비교는 실패 3개에서 2개로 줄었고 나머지 2개는 남음 · 비교 넷 = 가리지 않음·상태 전이만·거르지 않음·만든 시각</text>
