<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 614" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>앞 글에서 8장으로 넘긴 항목과 8장이 남긴 한계 — 1장 연재 목차의 결제와 재고·포인트·쿠폰은 한 서비스·같은 MySQL의 한 트랜잭션으로 다뤘고 서비스가 나뉘는 경우는 9장으로 넘김, 7장 예고의 결제 밖의 데이터는 결정 2(승인 요청 전에 잡기)와 결정 4(상태 전이에서 한 번 돌려주기)가 맡고 결과 모름은 쥔 채로 둠, 7장 남은 한계의 여러 결제를 한 트랜잭션에서 잠그는 기록은 잠그는 결제가 여전히 하나지만 결제 밖의 재고·쿠폰·포인트 줄로 같은 걱정이 넓어졌고, 재고를 상품 번호 순으로 잡게 했을 뿐 교착 상태는 시험하지 않음. 남은 한계 열 가지 — EXPIRED로 만드는 길 없음, 금액만 보낸 준비는 받은 금액, memberId를 믿음, 부분 취소는 카드 금액만, 결과 모름 동안 묶임, 조건부 UPDATE를 앞에 둔 근거 없음, 여러 줄 잠금의 교착 상태 시험 안 함, 300건 넘는 대기 실행 안 함, 등록 API 없음, 컨테이너 접속 실패 원인 미확정. 9장은 Transactional Outbox와 Kafka, 보상 트랜잭션은 10장</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #4b5563; }
    .m { font-family: Menlo, Consolas, monospace; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .gs { font-size: 12px; fill: #6b7280; }
    .os { font-size: 12px; fill: #c2410c; }
  </style>
  <defs>
    <marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
  </defs>

  <rect width="760" height="614" fill="#ffffff"/>
  <text x="24" y="28" class="h">앞 글에서 넘겨받은 항목과 8장이 남긴 한계</text>
  <text x="24" y="56" class="t2">넘겨받은 항목 → 8장에서</text>
  <rect x="16" y="68" width="360" height="34" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>
  <rect x="24" y="74" width="50" height="22" rx="11" fill="#475569"/>
  <text x="49" y="89" class="num" text-anchor="middle" style="font-size:11.5px">1장</text>
  <text x="86" y="90" class="s" style="fill:#1f2937">연재 목차의 결제와 재고·포인트·쿠폰</text>
  <line x1="378" y1="85" x2="396" y2="85" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#agy)"/>
  <rect x="400" y="72" width="96" height="26" rx="13" fill="#2563eb"/>
  <text x="448" y="89" class="num" text-anchor="middle" style="font-size:12px">한 트랜잭션</text>
  <rect x="504" y="72" width="122" height="26" rx="13" fill="#c2410c"/>
  <text x="565" y="89" class="num" text-anchor="middle" style="font-size:12px">서비스 분리는 9장</text>
  <rect x="16" y="108" width="360" height="34" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>
  <rect x="24" y="114" width="50" height="22" rx="11" fill="#475569"/>
  <text x="49" y="129" class="num" text-anchor="middle" style="font-size:11.5px">7장</text>
  <text x="86" y="130" class="s" style="fill:#1f2937">결제 밖의 데이터도 같은 결과로</text>
  <line x1="378" y1="125" x2="396" y2="125" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#agy)"/>
  <rect x="400" y="112" width="84" height="26" rx="13" fill="#7c3aed"/>
  <text x="442" y="129" class="num" text-anchor="middle" style="font-size:12px">결정 2 잡기</text>
  <rect x="492" y="112" width="104" height="26" rx="13" fill="#d97706"/>
  <text x="544" y="129" class="num" text-anchor="middle" style="font-size:12px">결정 4 돌려주기</text>
  <rect x="604" y="112" width="96" height="26" rx="13" fill="#475569"/>
  <text x="652" y="129" class="num" text-anchor="middle" style="font-size:12px">결과 모름은 쥠</text>
  <rect x="16" y="148" width="360" height="34" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>
  <rect x="24" y="154" width="50" height="22" rx="11" fill="#475569"/>
  <text x="49" y="169" class="num" text-anchor="middle" style="font-size:11.5px">7장</text>
  <text x="86" y="170" class="s" style="fill:#1f2937">여러 결제를 한 트랜잭션에서 잠그는 기록</text>
  <line x1="378" y1="165" x2="396" y2="165" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#agy)"/>
  <rect x="400" y="152" width="116" height="26" rx="13" fill="#475569"/>
  <text x="458" y="169" class="num" text-anchor="middle" style="font-size:12px">결제 밖 줄로 넓어짐</text>
  <rect x="524" y="152" width="124" height="26" rx="13" fill="#2563eb"/>
  <text x="586" y="169" class="num" text-anchor="middle" style="font-size:12px">재고는 상품 번호 순</text>
  <rect x="656" y="152" width="100" height="26" rx="13" fill="#9ca3af"/>
  <text x="706" y="169" class="num" text-anchor="middle" style="font-size:12px">교착 시험 안 함</text>
  <line x1="16" y1="198" x2="744" y2="198" stroke="#e5e7eb" stroke-width="1"/>
  <text x="24" y="224" class="t2">8장이 남긴 한계</text>
  <text x="736" y="224" class="gs" text-anchor="end">점선 = 시험하지 않았거나 원인을 확정하지 않은 것</text>
  <rect x="16" y="236" width="728" height="26" rx="7" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="30" y="253.5" class="s" style="fill:#1f2937">우리 쪽 결제를 <tspan class="m">EXPIRED</tspan>로 만드는 길이 없음</text>
  <text x="732" y="253.5" class="gs" text-anchor="end"><tspan class="m">expire()</tspan> 되돌리기는 도메인 테스트로만</text>
  <rect x="16" y="267" width="728" height="26" rx="7" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.2"/>
  <text x="30" y="284.5" class="s" style="fill:#1f2937">상품 없이 금액만 보낸 준비는 받은 금액 그대로</text>
  <text x="732" y="284.5" class="os" text-anchor="end">7장까지와 같음</text>
  <rect x="16" y="298" width="728" height="26" rx="7" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.2"/>
  <text x="30" y="315.5" class="s" style="fill:#1f2937"><tspan class="m">memberId</tspan>는 고객이 보낸 값을 믿음</text>
  <text x="732" y="315.5" class="os" text-anchor="end">인증이 없음</text>
  <rect x="16" y="329" width="728" height="26" rx="7" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.2"/>
  <text x="30" y="346.5" class="s" style="fill:#1f2937">부분 취소는 카드 금액만 돌려줌</text>
  <text x="732" y="346.5" class="os" text-anchor="end">상품 단위 · 포인트 먼저인지는 안 다룸</text>
  <rect x="16" y="360" width="728" height="26" rx="7" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.2"/>
  <text x="30" y="377.5" class="s" style="fill:#1f2937">결과 모름 동안 재고·포인트·쿠폰이 묶임</text>
  <text x="732" y="377.5" class="os" text-anchor="end">보정이 닫을 때까지</text>
  <rect x="16" y="391" width="728" height="26" rx="7" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.2"/>
  <text x="30" y="408.5" class="s" style="fill:#1f2937">조건부 UPDATE를 <tspan class="m">for update</tspan>보다 앞에 둔 근거</text>
  <text x="732" y="408.5" class="os" text-anchor="end">측정 범위 안에서 차이 없음</text>
  <rect x="16" y="422" width="728" height="26" rx="7" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="30" y="439.5" class="s" style="fill:#1f2937">인증 트랜잭션이 결제·재고·쿠폰·포인트 여러 줄을 잠금</text>
  <text x="732" y="439.5" class="gs" text-anchor="end">교착 상태 시험 안 함</text>
  <rect x="16" y="453" width="728" height="26" rx="7" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="30" y="470.5" class="s" style="fill:#1f2937">재고 줄 하나에 몰린 주문의 대기</text>
  <text x="732" y="470.5" class="gs" text-anchor="end">300건까지만 · 느린 인증 트랜잭션은 실행 안 함</text>
  <rect x="16" y="484" width="728" height="26" rx="7" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.2"/>
  <text x="30" y="501.5" class="s" style="fill:#1f2937">상품·재고·쿠폰을 등록하는 API가 없음</text>
  <text x="732" y="501.5" class="os" text-anchor="end">시험이 테이블에 직접 남김</text>
  <rect x="16" y="515" width="728" height="26" rx="7" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="30" y="532.5" class="s" style="fill:#1f2937">시험 컨텍스트 캐시를 10개로 묶어 컨테이너 접속 실패를 넘김</text>
  <text x="732" y="532.5" class="gs" text-anchor="end">원인은 확정 안 함</text>
  <line x1="16" y1="554" x2="744" y2="554" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="16" y="560" width="62" height="22" rx="11" fill="#c2410c"/>
  <text x="47" y="575" class="num" text-anchor="middle" style="font-size:11.5px">9장</text>
  <text x="88" y="576" class="s" style="fill:#1f2937">재고·포인트·쿠폰이 다른 서비스로 나뉘면 결제 상태 전이와 같은 트랜잭션에서 돌려줄 수 없음</text>
  <text x="88" y="598" class="gs">9장 Transactional Outbox와 Kafka · 이미 끝난 일을 되돌리는 보상 트랜잭션은 10장</text>
</svg>
