  <line x1="628" y1="169" x2="628" y2="232" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <text x="636" y="205" class="lbl">다음 부분 취소</text>
  <line x1="547" y1="262" x2="512" y2="262" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <line x1="369" y1="262" x2="342" y2="262" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="356" y="252" class="oks" text-anchor="middle">예</text>
  <line x1="189" y1="262" x2="172" y2="262" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="16" y="330" width="356" height="82" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="30" y="352" class="t2">매입된 결제도 같은 방식</text>
  <text x="30" y="372" class="s"><tspan class="m">CAPTURED</tspan> → 남은 0원 → <tspan class="m">CAPTURE_CANCELED</tspan></text>
  <text x="30" y="392" class="gs">상태가 늘지 않아 비교 구현 둘과 전이 테스트는 그대로</text>
  <rect x="388" y="330" width="356" height="82" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="402" y="352" class="gt">새 부분 취소 상태 두 개(매입 전·후)</text>
  <text x="402" y="372" class="gs">구현해서 돌려 보지 않음</text>
  <text x="402" y="392" class="gs">상태만으로 부분 취소된 결제를 가릴 수 있음</text>
  <g class="anim" opacity="0">
    <use href="#pkt"/>
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear"
      path="M181,140 H628 V262 H181"
      keyPoints="0;0;0;0.0984;0.2707;0.44;0.56;0.7451;0.9173;1;1;1" keyTimes="0;0.03;0.03;0.1575;0.2808;0.402;0.488;0.6204;0.7437;0.86;0.86;1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.025;0.03;0.86;0.87;1"/>
  </g>
