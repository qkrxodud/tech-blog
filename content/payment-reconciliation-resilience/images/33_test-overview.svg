  <text x="30" y="150" class="s2" style="font-size:11px;fill:#1f2937">30개 모두 12장 계약 41개에서</text><text x="30" y="168" class="s2" style="font-size:11px;fill:#1f2937">대사 13 중 9 · 이력 9 중 8</text><text x="30" y="186" class="s2" style="font-size:11px;fill:#1f2937">장애 6 중 4 · 운영 신호 13 중 9</text><text x="30" y="204" class="oks" style="font-size:11px;fill:#1f2937">앞 장 시험 761개 모두 통과</text>
