<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 596" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>7장 완성 코드에서 15000원 결제에 10000원 취소 두 건이 겹칠 때 — 취소 A가 PaymentCancelRecorder.request에서 findByOrderIdForUpdate로 결제 줄을 잠그고 받을 수 있는 금액 15000원을 확인해 REQUESTED 10000원 줄을 남기는 사이, 취소 B는 같은 select … for update에서 기다린다. A가 커밋해 잠금이 풀리면 A는 트랜잭션 밖에서 Mock PG에 취소를 보내고, B는 잠금을 얻어 A의 요청 줄까지 빼고 5000원으로 계산해 409 CANCEL_AMOUNT_EXCEEDS_BALANCE로 답한다. A는 PG 답을 받아 recordOutcome에서 다시 결제 줄을 잠그고 DONE으로 기록한 뒤 200으로 답한다</title>
