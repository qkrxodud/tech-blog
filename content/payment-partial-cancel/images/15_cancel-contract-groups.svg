  <rect width="760" height="516" fill="#ffffff"/>
  <text x="24" y="30" class="h">5장 테스트 37개 — 취소 계약 24개와 결제 취소 API 13개</text>
  <text x="24" y="52" class="gs">계약은 추상 클래스 <tspan class="m">CancelContract</tspan>에 두고 구현마다 상속해 같은 테스트를 돌림 · "카드사"는 Mock PG</text>
  <rect x="24" y="72" width="228" height="128" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="24" y="72" width="228" height="34" rx="12" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="38" y="94" class="bt" style="font-size:12.5px">취소와 상태</text>
  <circle cx="228" cy="89" r="13" fill="#2563eb"/>
  <text x="228" y="94" class="num" text-anchor="middle" style="font-size:13px">5</text>
  <text x="38" y="128" class="s" style="font-size:10.5px">승인 · 매입 결제의 전액 취소</text>
  <text x="38" y="147" class="s" style="font-size:10.5px">전액 취소는 카드사에도 취소로</text>
  <text x="38" y="166" class="s" style="font-size:10.5px">부분 취소 뒤 남으면 승인 그대로</text>
  <text x="38" y="185" class="s" style="font-size:10.5px">0원이 되면 승인 취소</text>
  <rect x="266" y="72" width="228" height="128" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="266" y="72" width="228" height="34" rx="12" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="280" y="94" class="bt" style="font-size:12.5px">남은 금액</text>
  <circle cx="470" cy="89" r="13" fill="#2563eb"/>
  <text x="470" y="94" class="num" text-anchor="middle" style="font-size:13px">3</text>
  <text x="280" y="128" class="s" style="font-size:10.5px">두 번 부분 취소 → 카드사 잔액과 같음</text>
  <text x="280" y="147" class="s" style="font-size:10.5px">큰 취소는 받지 않음</text>
  <text x="280" y="166" class="s" style="font-size:10.5px">큰 취소는 카드사에 안 보냄</text>
  <rect x="508" y="72" width="228" height="128" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="508" y="72" width="228" height="34" rx="12" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="522" y="94" class="bt" style="font-size:12.5px">받지 않는 취소</text>
  <circle cx="712" cy="89" r="13" fill="#2563eb"/>
  <text x="712" y="94" class="num" text-anchor="middle" style="font-size:13px">7</text>
  <text x="522" y="128" class="s" style="font-size:10.5px">승인 전 · 승인 거절 · 결과 모름</text>
  <text x="522" y="147" class="s" style="font-size:10.5px">× 받지 않음 / 카드사에 안 보냄</text>
  <text x="522" y="166" class="s" style="font-size:10.5px">이미 전액 취소된 결제의 새 취소</text>
  <rect x="24" y="212" width="228" height="128" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="24" y="212" width="228" height="34" rx="12" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="38" y="234" class="bt" style="font-size:12.5px">같은 요청</text>
  <circle cx="228" cy="229" r="13" fill="#2563eb"/>
  <text x="228" y="234" class="num" text-anchor="middle" style="font-size:13px">4</text>
  <text x="38" y="268" class="s" style="font-size:10.5px">같은 키 → 카드사에 한 번, 같은 답</text>
  <text x="38" y="287" class="s" style="font-size:10.5px">같은 키에 다른 금액은 받지 않음</text>
  <text x="38" y="306" class="s" style="font-size:10.5px">키가 다르면 같은 금액도 두 번</text>
  <rect x="266" y="212" width="228" height="128" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="266" y="212" width="228" height="34" rx="12" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="280" y="234" class="bt" style="font-size:12.5px">답을 못 받은 취소</text>
  <circle cx="470" cy="229" r="13" fill="#2563eb"/>
  <text x="470" y="234" class="num" text-anchor="middle" style="font-size:13px">3</text>
  <text x="280" y="268" class="s" style="font-size:10.5px">시간 초과 → 결과 모름으로 남음</text>
  <text x="280" y="287" class="s" style="font-size:10.5px">결과 모름 → 보정 뒤 잔액 같음</text>
  <text x="280" y="306" class="s" style="font-size:10.5px">기록 실패 → 보정 뒤 잔액 같음</text>
  <rect x="508" y="212" width="228" height="128" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="508" y="212" width="228" height="34" rx="12" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="522" y="234" class="bt" style="font-size:12.5px">시간 초과 뒤 재요청</text>
  <circle cx="712" cy="229" r="13" fill="#2563eb"/>
  <text x="712" y="234" class="num" text-anchor="middle" style="font-size:13px">2</text>
  <text x="522" y="268" class="s" style="font-size:10.5px">같은 키 → 카드사에서 두 번 안 됨</text>
  <text x="522" y="287" class="s" style="font-size:10.5px">같은 키 → 카드사 잔액으로 답</text>
  <rect x="24" y="356" width="712" height="62" rx="12" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <text x="38" y="376" class="ot" style="font-size:12.5px">결제 취소 API 13개 — 주요 응답</text>
  <text x="38" y="395" class="os" style="font-size:10.5px">키 없음 · 300자 초과 · 사유 없음 · 0원 이하 → <tspan class="m">400</tspan> · 같은 키에 다른 금액 → <tspan class="m">422</tspan></text>
  <text x="38" y="410" class="os" style="font-size:10.5px">넘는 금액 · 승인 전 결제 → <tspan class="m">409</tspan> · PG 시간 초과 → <tspan class="m">504</tspan> · PG가 앞 취소를 처리 중에 같은 키 → <tspan class="m">202</tspan></text>
  <text x="380" y="440" class="t" text-anchor="middle" style="font-size:13.5px">5 + 3 + 7 + 4 + 3 + 2 = 24 · 24 + 13 = 37개</text>
  <rect x="24" y="454" width="712" height="50" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <use href="#i-clock" transform="translate(36,465) scale(0.95)"/>
  <text x="74" y="474" class="gs" style="font-size:10.5px">시험 조건 — 결제 15000원 · 부분 취소 5000원 · PG 읽기 시간 제한 1초로 줄임 · 늦은 취소는 1.5초 뒤 답</text>
  <text x="74" y="493" class="gs" style="font-size:10.5px">보정 시각은 대기 시간(10초)이 지난 때 · 기록 실패는 MySQL 트리거 · 매입 결제는 상태를 <tspan class="m">CAPTURED</tspan>로 바꿔 시작</text>
</svg>
