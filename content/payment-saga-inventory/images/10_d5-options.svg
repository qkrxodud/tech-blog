<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 5 선택지 비교 — 재고 서비스가 멈춘 동안 카드사가 거절한 결제에서, 상태 전이 트랜잭션에서 payment_outbox에 남기는 운영은 결제 상태와 STOCK_RELEASE 줄을 함께 커밋하고 릴레이가 stock-reservation-commands로 보내 브로커가 받으며, 재고 서비스가 돌아오면 읽던 자리부터 읽어 해제해 재고 5가 됨. 상태를 바꾼 자리에서 바로 HTTP로 보내는 비교는 결제 줄을 잠근 채 HTTP 해제를 보내다 연결에 실패해 로그만 남기고, 돌아와도 재고는 3임. 계약 실패 0과 1, 측정 어긋난 재고 0과 −5, 늦음 응답 중앙 1027~1038ms와 2042~2045ms. 운영의 원복 시간은 25건 중앙 302~626ms, p95 1321~1553ms</title>
  <style>
