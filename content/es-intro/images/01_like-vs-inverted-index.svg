<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 538" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>MySQL의 LIKE '%kafka%'는 모든 행을 순서대로 확인하는 풀스캔이고, 역인덱스는 kafka와 spring의 Posting List를 꺼내 겹치는 5번·8번 문서만 고른다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #1f2937; }
    .cell { font-size: 15px; font-weight: 700; fill: #1f2937; }
    .codek { font-size: 13px; fill: #6b7280; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="538" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="230" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">MySQL — 모든 행의 content를 하나씩 확인</text>
  <text x="730" y="42" class="code" text-anchor="end">LIKE '%kafka%'</text>
  <text x="440" y="64" class="step" text-anchor="middle">1번 행부터 마지막 행까지 순서대로</text>
  <line x1="160" y1="72" x2="722" y2="72" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="30" y="104" class="lane">content</text>
  <text x="30" y="122" class="sub">문서 → 내용</text>
  <rect x="150" y="80" width="585" height="60" rx="6" class="track"/>
  <rect x="162" y="86" width="84" height="48" rx="8" class="box"/>
  <text x="204" y="106" class="t" text-anchor="middle">1번 행</text>
  <text x="204" y="125" class="val" text-anchor="middle">비교</text>
  <rect x="258" y="86" width="84" height="48" rx="8" class="box"/>
  <text x="300" y="106" class="t" text-anchor="middle">2번 행</text>
  <text x="300" y="125" class="val" text-anchor="middle">비교</text>
  <rect x="354" y="86" width="84" height="48" rx="8" class="box"/>
  <text x="396" y="106" class="t" text-anchor="middle">3번 행</text>
  <text x="396" y="125" class="val" text-anchor="middle">비교</text>
  <rect x="450" y="86" width="84" height="48" rx="8" class="box"/>
  <text x="492" y="106" class="t" text-anchor="middle">4번 행</text>
  <text x="492" y="125" class="val" text-anchor="middle">비교</text>
  <rect x="546" y="86" width="84" height="48" rx="8" class="box"/>
  <text x="588" y="106" class="t" text-anchor="middle">5번 행</text>
  <text x="588" y="125" class="val" text-anchor="middle">비교</text>
  <rect x="642" y="86" width="84" height="48" rx="8" class="wait"/>
  <text x="684" y="115" class="waitt" text-anchor="middle">… N번 행</text>
  <rect x="150" y="154" width="380" height="32" rx="16" class="bad"/>
  <text x="340" y="175" class="badt" text-anchor="middle">B-tree index를 사용하지 못해 풀스캔</text>
  <text x="150" y="216" class="sub">kafka가 어느 행에 있는지 미리 알 수 없어, 모든 행을 열어 봐야 함</text>
  <rect x="10" y="256" width="740" height="266" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="288" class="h">역인덱스 — 단어로 Posting List를 바로 꺼냄</text>
  <text x="730" y="288" class="codek" text-anchor="end">단어 → 문서</text>
  <text x="40" y="318" class="sub">Term Dictionary</text>
  <text x="225" y="318" class="sub">Posting List</text>
  <rect x="40" y="330" width="120" height="36" rx="8" class="hold"/>
  <text x="100" y="353" class="op" text-anchor="middle">kafka</text>
  <line x1="165" y1="348" x2="213" y2="348" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="225" y="330" width="50" height="36" rx="6" class="box"/>
  <text x="250" y="353" class="cell" text-anchor="middle">1</text>
  <rect x="283" y="330" width="50" height="36" rx="6" class="ok"/>
  <text x="308" y="353" class="okt" text-anchor="middle">5</text>
  <rect x="341" y="330" width="50" height="36" rx="6" class="ok"/>
  <text x="366" y="353" class="okt" text-anchor="middle">8</text>
  <rect x="399" y="330" width="50" height="36" rx="6" class="box"/>
  <text x="424" y="353" class="cell" text-anchor="middle">13</text>
  <rect x="457" y="330" width="50" height="36" rx="6" class="box"/>
  <text x="482" y="353" class="cell" text-anchor="middle">21</text>
  <rect x="515" y="330" width="50" height="36" rx="6" class="box"/>
  <text x="540" y="353" class="cell" text-anchor="middle">…</text>
  <rect x="40" y="378" width="120" height="36" rx="8" class="hold"/>
  <text x="100" y="401" class="op" text-anchor="middle">spring</text>
  <line x1="165" y1="396" x2="213" y2="396" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="225" y="378" width="50" height="36" rx="6" class="box"/>
  <text x="250" y="401" class="cell" text-anchor="middle">3</text>
  <rect x="283" y="378" width="50" height="36" rx="6" class="ok"/>
  <text x="308" y="401" class="okt" text-anchor="middle">5</text>
  <rect x="341" y="378" width="50" height="36" rx="6" class="ok"/>
  <text x="366" y="401" class="okt" text-anchor="middle">8</text>
  <rect x="399" y="378" width="50" height="36" rx="6" class="box"/>
  <text x="424" y="401" class="cell" text-anchor="middle">40</text>
  <rect x="457" y="378" width="50" height="36" rx="6" class="box"/>
  <text x="482" y="401" class="cell" text-anchor="middle">…</text>
  <rect x="40" y="426" width="120" height="36" rx="8" class="box"/>
  <text x="100" y="449" class="op" text-anchor="middle">redis</text>
  <line x1="165" y1="444" x2="213" y2="444" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="225" y="426" width="50" height="36" rx="6" class="box"/>
  <text x="250" y="449" class="cell" text-anchor="middle" style="fill:#9ca3af">2</text>
  <rect x="283" y="426" width="50" height="36" rx="6" class="box"/>
  <text x="308" y="449" class="cell" text-anchor="middle" style="fill:#9ca3af">8</text>
  <rect x="341" y="426" width="50" height="36" rx="6" class="box"/>
  <text x="366" y="449" class="cell" text-anchor="middle" style="fill:#9ca3af">19</text>
  <rect x="399" y="426" width="50" height="36" rx="6" class="box"/>
  <text x="424" y="449" class="cell" text-anchor="middle" style="fill:#9ca3af">…</text>
  <text x="470" y="449" class="sub">이번 검색에서는 보지 않음</text>
  <rect x="275" y="324" width="118" height="96" rx="8" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="522" y="401" class="gnote">← 두 목록에 모두 있음</text>
  <rect x="40" y="476" width="560" height="32" rx="16" class="ok"/>
  <text x="320" y="497" class="okt" text-anchor="middle">kafka &amp; spring 검색 → 두 목록에 모두 있는 문서만 바로 노출</text>
</svg>
