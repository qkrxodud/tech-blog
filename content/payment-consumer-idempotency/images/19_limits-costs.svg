<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>남은 한계 중 결정의 비용과 가정으로 남긴 것 — 일시 오류 메시지 하나가 같은 파티션의 뒤 메시지를 15813~15933ms·15736~15759ms 막는 결정 3의 비용, 이 머신에서 잰 MySQL 재시작 2.62~3.04초의 약 5배로 둔 다시 시도 15초(5배 여유는 가정, 운영 DB 전환 기준 없음), 30초 장애에서 파티션마다 맨 앞 메시지 2건이 실패 모음으로 가 운영자가 다시 넣기를 돌려야 반영되는 것, payment_outbox 번호가 커밋 순서대로 커진다는 것과 insert ignore가 남기는 중인 트랜잭션을 기다린다는 것을 문서로 확인하지 않은 가정, 재고 서비스 결정 1·2는 넣기 전후 차이가 없고 재고 운영 계약 실패는 결정 3·4에서 7·5·0개로 줄어든 것, 받은 기록·처리한 명령 기록·보낸 payment_outbox 줄을 지우지 않고 TTL도 없는 것, 이미 만든 DB를 옮기는 스크립트가 없는 것(옮길 때는 orders.last_event_id·stock_reservation.last_command_id 칸을 더하고 received_payment_event의 같은 번호 줄을 지운 뒤 고유 키를 더해야 하며, create table if not exists는 새 칸·키를 더하지 않음)을 카드로 나눈 그림</title>
