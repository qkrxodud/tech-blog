<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>member1과 member3가 같은 Address 인스턴스를 참조하는 상태에서 member1의 street를 newCity로 바꾸면 두 회원의 주소가 모두 newCity로 저장되는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .msg { font-size: 11.5px; fill: #374151; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .cont { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="310" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">값 타입 공유 참조 — 한 회원만 바꿔도 함께 바뀜</text>
  <text x="730" y="42" class="code" text-anchor="end">setHomeAddress(address)</text>
  <text x="105" y="74" class="step" text-anchor="middle">엔티티</text>
  <text x="345" y="74" class="step" text-anchor="middle">임베디드 값 타입 인스턴스</text>
  <text x="625" y="74" class="step" text-anchor="middle">DB에 저장되는 값</text>
  <rect x="30" y="92" width="150" height="48" rx="8" class="box"/>
  <text x="105" y="113" class="opm" text-anchor="middle">member1</text>
  <text x="105" y="131" class="val" text-anchor="middle">Member</text>
  <rect x="30" y="182" width="150" height="48" rx="8" class="box"/>
  <text x="105" y="203" class="opm" text-anchor="middle">member3</text>
  <text x="105" y="221" class="val" text-anchor="middle">Member</text>
  <rect x="240" y="100" width="210" height="124" rx="10" class="hold"/>
  <text x="345" y="124" class="opm" text-anchor="middle">Address@x01</text>
  <text x="260" y="152" class="m" text-anchor="start">city: test1</text>
  <text x="260" y="176" class="m" text-anchor="start">street: test1 → <tspan fill="#b91c1c" font-weight="700">newCity</tspan></text>
  <text x="260" y="200" class="m" text-anchor="start">zipcode: test1</text>
  <line x1="180" y1="116" x2="236" y2="140" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="180" y1="206" x2="236" y2="186" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="208" y="170" class="step" text-anchor="middle">같은 참조</text>
  <text x="510" y="104" class="db" text-anchor="start">MEMBER 테이블</text>
  <rect x="510" y="112" width="220" height="28" rx="4" class="hold"/>
  <text x="560.0" y="131" class="ts" text-anchor="middle">회원</text>
  <text x="670.0" y="131" class="ts" text-anchor="middle">street</text>
  <rect x="510" y="140" width="220" height="28" rx="0" class="bad"/>
  <text x="560.0" y="159" class="val" text-anchor="middle">member1</text>
  <text x="670.0" y="159" class="val" text-anchor="middle">newCity</text>
  <rect x="510" y="168" width="220" height="28" rx="0" class="bad"/>
  <text x="560.0" y="187" class="val" text-anchor="middle">member3</text>
  <text x="670.0" y="187" class="val" text-anchor="middle">newCity</text>
  <line x1="610" y1="112" x2="610" y2="196" stroke="#d1d5db" stroke-width="1"/>
  <line x1="452" y1="162" x2="504" y2="162" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="30" y="252" width="420" height="32" rx="6" class="bad"/>
  <text x="240" y="273" class="note" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">member1.getHomeAddress().setStreet("newCity")</tspan></text>
  <text x="510" y="264" class="note" text-anchor="start">member1만 바꿨지만</text>
  <text x="510" y="282" class="note" text-anchor="start">member3의 주소도 함께 바뀜</text>
</svg>
