<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>주문 애그리거트 안에서 Order가 루트 엔티티이고, 애그리거트 밖에서는 Order를 통해 내부 객체에 접근한다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .ops { font-size: 11.5px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .src { font-size: 13px; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .grp { fill: #f3f4f6; stroke: #c4c8ce; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .pkg { fill: #ffffff; stroke: #c4c8ce; stroke-width: 1.2; }
    .grpt { font-size: 13px; font-weight: 700; fill: #4b5563; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .edge { stroke: #9ca3af; stroke-width: 1.4; fill: none; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="410" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">애그리거트 루트 — 주문 애그리거트를 관리하는 Order</text>
  <rect x="110" y="56" width="540" height="270" rx="12" class="grp"/>
  <text x="122" y="76" class="grpt">주문 애그리거트</text>
  <rect x="318.0" y="86" width="124" height="44" rx="6" class="box"/>
  <text x="380.0" y="113.0" class="opm" text-anchor="middle">Address</text>
  <rect x="168.0" y="168" width="124" height="44" rx="6" class="box"/>
  <text x="230.0" y="185.5" class="opm" text-anchor="middle">Delivery</text>
  <text x="230.0" y="204.5" class="opm" text-anchor="middle">Tracking</text>
  <rect x="318.0" y="168" width="124" height="44" rx="6" class="box"/>
  <text x="380.0" y="195.0" class="opm" text-anchor="middle">ShippingInfo</text>
  <rect x="468.0" y="168" width="124" height="44" rx="6" class="box"/>
  <text x="530.0" y="195.0" class="opm" text-anchor="middle">Receiver</text>
  <rect x="168.0" y="250" width="124" height="44" rx="6" class="box"/>
  <text x="230.0" y="277.0" class="opm" text-anchor="middle">OrderLine</text>
  <rect x="318.0" y="250" width="124" height="44" rx="6" class="box"/>
  <text x="380.0" y="277.0" class="opm" text-anchor="middle">Order</text>
  <rect x="468.0" y="250" width="124" height="44" rx="6" class="box"/>
  <text x="530.0" y="277.0" class="opm" text-anchor="middle">Orderer</text>
  <line x1="230" y1="212" x2="230" y2="250" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="272.0" y1="212" x2="324.0" y2="250" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="292.0" y1="272" x2="318.0" y2="272" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="380" y1="212" x2="380" y2="250" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="380" y1="130" x2="380" y2="168" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="442.0" y1="190" x2="468.0" y2="190" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="530" y1="212" x2="530" y2="250" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="442.0" y1="272" x2="468.0" y2="272" stroke="#9ca3af" stroke-width="1.3"/>
  <rect x="318" y="250" width="124" height="44" rx="6" class="ok"/>
  <text x="380.0" y="277.0" class="okc" text-anchor="middle">Order</text>
  <text x="450" y="314" class="gnote">루트 엔티티</text>
  <rect x="300" y="348" width="160" height="40" rx="8" class="box"/>
  <text x="380.0" y="373.0" class="t" text-anchor="middle">애그리거트 외부</text>
  <line x1="380" y1="348" x2="380" y2="297" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="470" y="373" class="gnote">루트를 통해서만 접근</text>
</svg>
