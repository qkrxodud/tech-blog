<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 466" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>트랜잭션을 나누는 세 방식 비교 — 기록을 맡는 빈을 따로 두거나 TransactionTemplate으로 경계를 직접 그으면 인증 기록과 결과 기록이 각각 짧은 트랜잭션으로 커밋되고 PG를 기다리는 동안 연결을 쓰지 않아 계약 테스트 4개를 모두 통과하고, 같은 클래스 안에서 this로 부르면 프록시를 거치지 않아 트랜잭션이 걸리지 않으므로 인증 기록이 저장되지 않고 다시 읽은 결제가 READY라 승인 전이가 거부되어 승인·거절 테스트 2개가 실패하는 그림</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 13.5px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 13.5px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 13.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .flow { stroke: #9ca3af; stroke-width: 1.4; fill: none; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 13.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okw { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 13.5px; fill: #b91c1c; }
    .gnote { font-size: 13.5px; fill: #15803d; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="466" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="446" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">트랜잭션을 나누는 세 방식 — 기록 메서드에 트랜잭션이 걸리는가</text>
  <text x="115" y="76" class="step" text-anchor="middle">① 인증 기록</text>
  <text x="290" y="76" class="step" text-anchor="middle">② PG 승인 호출</text>
  <text x="465" y="76" class="step" text-anchor="middle">③ 결과 기록</text>
  <text x="650" y="76" class="step" text-anchor="middle">계약 테스트 4개</text>
  <line x1="30" y1="84" x2="556" y2="84" class="axis" marker-end="url(#ar)"/>

  <!-- 방식 1: 빈 분리 -->
  <text x="30" y="114" class="t">기록을 맡는 빈을 따로 두기</text>
  <text x="244" y="114" class="sub"><tspan font-family="Menlo, Consolas, monospace">PaymentRecorder</tspan>의 <tspan font-family="Menlo, Consolas, monospace">@Transactional</tspan> 메서드를 부름</text>
  <rect x="30" y="124" width="170" height="52" rx="8" class="hold"/>
  <text x="115" y="145" class="t" text-anchor="middle">트랜잭션 1</text>
  <text x="115" y="165" class="val" text-anchor="middle">프록시를 거쳐 커밋</text>
  <rect x="212" y="124" width="156" height="52" rx="8" class="okw"/>
  <text x="290" y="145" class="okt" text-anchor="middle">연결을 쓰지 않음</text>
  <text x="290" y="165" class="gnote" text-anchor="middle">트랜잭션 밖</text>
  <rect x="380" y="124" width="170" height="52" rx="8" class="hold"/>
  <text x="465" y="145" class="t" text-anchor="middle">트랜잭션 2</text>
  <text x="465" y="165" class="val" text-anchor="middle">다시 읽고 기록·커밋</text>
  <rect x="570" y="128" width="160" height="44" rx="8" class="ok"/>
  <text x="650" y="155" class="okt" text-anchor="middle">4개 모두 통과</text>

  <line x1="30" y1="194" x2="730" y2="194" stroke="#e5e7eb"/>

  <!-- 방식 2: TransactionTemplate -->
  <text x="30" y="222" class="t"><tspan font-family="Menlo, Consolas, monospace">TransactionTemplate</tspan>으로 경계 긋기</text>
  <text x="330" y="222" class="sub">비교 B' — 메서드 안에서 경계를 직접 그음</text>
  <rect x="30" y="232" width="170" height="52" rx="8" class="hold"/>
  <text x="115" y="253" class="t" text-anchor="middle">트랜잭션 1</text>
  <text x="115" y="273" class="val" text-anchor="middle">그은 경계 안에서 커밋</text>
  <rect x="212" y="232" width="156" height="52" rx="8" class="okw"/>
  <text x="290" y="253" class="okt" text-anchor="middle">연결을 쓰지 않음</text>
  <text x="290" y="273" class="gnote" text-anchor="middle">트랜잭션 밖</text>
  <rect x="380" y="232" width="170" height="52" rx="8" class="hold"/>
  <text x="465" y="253" class="t" text-anchor="middle">트랜잭션 2</text>
  <text x="465" y="273" class="val" text-anchor="middle">다시 읽고 기록·커밋</text>
  <rect x="570" y="236" width="160" height="44" rx="8" class="ok"/>
  <text x="650" y="263" class="okt" text-anchor="middle">4개 모두 통과</text>

  <line x1="30" y1="302" x2="730" y2="302" stroke="#e5e7eb"/>

  <!-- 방식 3: this 호출 -->
  <text x="30" y="330" class="t">같은 클래스 안에서 <tspan font-family="Menlo, Consolas, monospace">this</tspan>로 부르기</text>
  <text x="244" y="330" class="sub">함정 확인용 — 스프링의 트랜잭션 프록시를 거치지 않음</text>
  <rect x="30" y="340" width="170" height="52" rx="8" class="bad"/>
  <text x="115" y="361" class="badt" text-anchor="middle">트랜잭션 없음</text>
  <text x="115" y="381" class="note" text-anchor="middle">인증 기록이 저장 안 됨</text>
  <rect x="212" y="340" width="156" height="52" rx="8" class="box"/>
  <text x="290" y="361" class="t" text-anchor="middle">PG 승인 호출</text>
  <text x="290" y="381" class="val" text-anchor="middle">트랜잭션 밖</text>
  <rect x="380" y="340" width="170" height="52" rx="8" class="bad"/>
  <text x="465" y="361" class="badt" text-anchor="middle">다시 읽으니 <tspan font-family="Menlo, Consolas, monospace">READY</tspan></text>
  <text x="465" y="381" class="note" text-anchor="middle">승인 전이가 거부됨</text>
  <rect x="570" y="340" width="160" height="52" rx="8" class="bad"/>
  <text x="650" y="361" class="badt" text-anchor="middle">2개 실패</text>
  <text x="650" y="381" class="note" text-anchor="middle">승인·거절 테스트</text>
  <text x="30" y="420" class="sub">연결 대기·시간 제한 테스트는 통과 — 트랜잭션이 아예 걸리지 않아 오래 열려 있는 트랜잭션도 없음</text>
  <text x="30" y="440" class="sub">승인 테스트의 실패 메시지: <tspan font-family="Menlo, Consolas, monospace" font-size="12px">Cannot APPROVE a payment in READY status.</tspan></text>
</svg>
