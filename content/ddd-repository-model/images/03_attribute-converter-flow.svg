<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>MoneyConverter가 저장할 때는 Money를 Integer 칼럼 값으로, 읽을 때는 Integer를 Money로 바꾸는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opk { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .ster { font-size: 11.5px; font-style: italic; fill: #6b7280; }
    .cls { font-size: 15px; font-weight: 700; fill: #1f2937; }
    .attr { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
    .sep { stroke: #d1d5db; stroke-width: 1; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
    <marker id="dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="14" markerHeight="9" orient="auto">
      <path d="M1,5 L8,1 L15,5 L8,9 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="760" height="330" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="310" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">MoneyConverter — 두 방향으로 값을 변환</text>
  <text x="730" y="42" class="code" text-anchor="end">@Converter(autoApply = true)</text>
  <text x="140" y="70" class="step" text-anchor="middle">밸류 (도메인 모델)</text>
  <text x="380" y="70" class="step" text-anchor="middle">AttributeConverter</text>
  <text x="625" y="70" class="step" text-anchor="middle">DB 칼럼</text>
  <text x="30" y="108" class="lane">저장</text>
  <rect x="70" y="84" width="140" height="52" rx="8" class="box"/>
  <text x="140" y="106" class="op" text-anchor="middle">Money</text>
  <text x="140" y="125" class="val" text-anchor="middle">totalAmounts</text>
  <rect x="250" y="84" width="260" height="52" rx="8" class="ok"/>
  <text x="380" y="106" class="okc" text-anchor="middle">convertToDatabaseColumn</text>
  <text x="380" y="125" class="val" text-anchor="middle">money.getValue()</text>
  <rect x="550" y="84" width="150" height="52" rx="8" class="dbbox"/>
  <text x="625" y="106" class="op" text-anchor="middle">Integer</text>
  <text x="625" y="125" class="val" text-anchor="middle">total_amounts</text>
  <line x1="212" y1="110" x2="246" y2="110" stroke="#16a34a" stroke-width="1.5" marker-end="url(#agr)"/>
  <line x1="512" y1="110" x2="546" y2="110" stroke="#16a34a" stroke-width="1.5" marker-end="url(#agr)"/>
  <text x="30" y="198" class="lane">조회</text>
  <rect x="70" y="174" width="140" height="52" rx="8" class="box"/>
  <text x="140" y="196" class="op" text-anchor="middle">Money</text>
  <text x="140" y="215" class="val" text-anchor="middle">new Money(value)</text>
  <rect x="250" y="174" width="260" height="52" rx="8" class="ok"/>
  <text x="380" y="196" class="okc" text-anchor="middle">convertToEntityAttribute</text>
  <text x="380" y="215" class="val" text-anchor="middle">Integer → Money</text>
  <rect x="550" y="174" width="150" height="52" rx="8" class="dbbox"/>
  <text x="625" y="196" class="op" text-anchor="middle">Integer</text>
  <text x="625" y="215" class="val" text-anchor="middle">total_amounts</text>
  <line x1="546" y1="200" x2="512" y2="200" stroke="#16a34a" stroke-width="1.5" marker-end="url(#agr)"/>
  <line x1="246" y1="200" x2="212" y2="200" stroke="#16a34a" stroke-width="1.5" marker-end="url(#agr)"/>
  <text x="30" y="266" class="sub">두 메서드 모두 값이 null이면 null을 그대로 돌려줍니다.</text>
  <text x="30" y="288" class="sub">autoApply = true이면 모델의 모든 Money 프로퍼티에 자동으로 적용되고, false이면 @Convert로 직접 지정합니다.</text>
</svg>
