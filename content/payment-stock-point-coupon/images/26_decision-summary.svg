  <line x1="576" y1="365" x2="586" y2="365" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="588" y="336" width="148" height="58" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="598" y="360" class="oks" style="font-size:10.5px">겹친 거절에도 한 번</text>
  <text x="598" y="378" class="oks" style="font-size:10.5px">결과 모름은 쥔 채로</text>
  <rect x="24" y="406" width="76" height="72" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="62" y="447" class="t2" text-anchor="middle" style="font-size:12.5px">결정 5</text>
  <text x="110" y="424" class="t2" style="font-size:12px">같은 쿠폰</text>
