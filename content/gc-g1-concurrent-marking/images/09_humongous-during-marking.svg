<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>Concurrent Marking 중 이미 스캔이 끝난 A가 새로 할당된 거대 객체 H를 참조하면, 기존 참조가 없어 SATB buffer에 들어갈 객체도 없고 A도 다시 탐색되지 않아 H가 살았으나 죽었다고 판단된다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
    .monob { font-family: Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #1f2937; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dark { fill: #d1d5db; stroke: #6b7280; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .sep { stroke: #e5e7eb; stroke-width: 1; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .wn { fill: #ffffff; stroke: #6b7280; stroke-width: 1.5; }
    .gn { fill: #d1d5db; stroke: #6b7280; stroke-width: 1.5; }
    .bn { fill: #374151; stroke: #1f2937; stroke-width: 1.5; }
    .nt { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ntw { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .edge { stroke: #6b7280; stroke-width: 1.5; fill: none; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="392" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="372" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">SATB buffer만으로 충분할까 — marking 도중 할당된 거대 객체</text>
  <text x="730" y="42" class="code" text-anchor="end">A.huge = new H();</text>
  <rect x="30" y="100" width="80" height="40" rx="4" class="dark"/>
  <text x="70" y="125" class="op" text-anchor="middle">GC root</text>
  <rect x="160" y="70" width="150" height="110" rx="6" class="box"/>
  <text x="235.0" y="90" class="sub" text-anchor="middle">old region</text>
  <rect x="340" y="70" width="150" height="110" rx="6" class="box"/>
  <text x="415.0" y="90" class="sub" text-anchor="middle">old region</text>
  <rect x="520" y="70" width="210" height="110" rx="6" class="box"/>
  <text x="625.0" y="90" class="sub" text-anchor="middle">humongous region</text>
  <rect x="200" y="104" width="70" height="50" rx="4" fill="#374151" stroke="#1f2937"/>
  <text x="235" y="126" class="ntw" text-anchor="middle">A</text>
  <text x="235" y="144" class="ntw" text-anchor="middle">31</text>
  <rect x="380" y="104" width="70" height="50" rx="4" fill="#d1d5db" stroke="#6b7280"/>
  <text x="415" y="126" class="nt" text-anchor="middle">B</text>
  <text x="415" y="144" class="nt" text-anchor="middle">33</text>
  <rect x="540" y="104" width="130" height="50" rx="4" class="bad"/>
  <text x="605" y="126" class="badt" text-anchor="middle">H</text>
  <text x="605" y="144" class="badt" text-anchor="middle">24</text>
  <line x1="111" y1="120" x2="198" y2="126" class="edge" marker-end="url(#ar)"/>
  <line x1="271" y1="126" x2="378" y2="126" class="edge" marker-end="url(#ar)"/>
  <path d="M 271 142 Q 400 195 538 142" class="gl" marker-end="url(#agr)"/>
  <text x="405" y="200" class="gnote" text-anchor="middle">A.huge가 새로 H를 참조</text>
  <text x="160" y="220" class="sub">A: 스캔 완료(Black) · B: local mark stack에 33이 있음(Grey) · H: marking 전(White)</text>
  <line x1="30" y1="238" x2="730" y2="238" class="sep"/>
  <text x="30" y="262" class="val">1. Concurrent Marking 중 애플리케이션 코드가 거대(humongous) 객체 H를 생성 — region size의 ½ 이상이면 거대 객체</text>
  <text x="30" y="288" class="val">2. A.huge는 원래 아무것도 참조하지 않았으므로 pre-write barrier가 SATB buffer에 넣을 기존 객체가 없음</text>
  <text x="30" y="314" class="val">3. A는 이미 스캔이 끝난 상태라 다시 탐색하지 않음</text>
  <text x="30" y="340" class="note">4. H는 marking되지 않아 살았으나 죽었다고 판단됨</text>
  <text x="30" y="370" class="gnote">marking 도중 새로운 객체가 할당되는 경우는 TAMS 포인터로 대응</text>

</svg>
