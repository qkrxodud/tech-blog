<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>BooleanBuilder 방식은 if 문으로 member.username.eq와 member.age.eq를 builder에 and로 쌓아 where에 넘기고, Where 다중 파라미터 방식은 usernameEq와 ageEq가 조건 또는 null을 반환하고 allEq가 둘을 and로 묶어 where에 넘기는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .msg { font-size: 11.5px; fill: #374151; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .cont { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="450" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="200" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">BooleanBuilder — if 문으로 조건을 쌓음</text>
  <text x="730" y="42" class="code" text-anchor="end">searchMember1("member1", 10)</text>
  <rect x="30" y="64" width="170" height="52" rx="8" class="hold"/>
  <text x="115.0" y="85.5" class="opm" text-anchor="middle">usernameParam</text>
  <text x="115.0" y="104.5" class="sub" text-anchor="middle">!= null 이면</text>
  <rect x="225" y="64" width="300" height="52" rx="8" class="box"/>
  <text x="375.0" y="85.5" class="m" text-anchor="middle">builder.and(</text>
  <text x="375.0" y="104.5" class="m" text-anchor="middle">member.username.eq("member1"))</text>
  <rect x="30" y="128" width="170" height="52" rx="8" class="hold"/>
  <text x="115.0" y="149.5" class="opm" text-anchor="middle">agePara</text>
  <text x="115.0" y="168.5" class="sub" text-anchor="middle">!= null 이면</text>
  <rect x="225" y="128" width="300" height="52" rx="8" class="box"/>
  <text x="375.0" y="149.5" class="m" text-anchor="middle">builder.and(</text>
  <text x="375.0" y="168.5" class="m" text-anchor="middle">member.age.eq(10))</text>
  <line x1="200" y1="90" x2="221" y2="90" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="200" y1="154" x2="221" y2="154" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="560" y="64" width="170" height="116" rx="8" class="ok"/>
  <text x="645.0" y="117.5" class="okm" text-anchor="middle">where(builder)</text>
  <text x="645.0" y="136.5" class="gnote" text-anchor="middle">member1 조회</text>
  <line x1="525" y1="90" x2="556" y2="110" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="525" y1="154" x2="556" y2="134" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="200" class="foot" text-anchor="start">조건을 조립하는 코드가 searchMember1 안의 if 문에 들어갑니다</text>
  <rect x="10" y="226" width="740" height="214" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="258" class="h">Where 다중 파라미터 — 조건마다 메서드</text>
  <text x="730" y="258" class="code" text-anchor="end">searchMember2("member1", 10)</text>
  <rect x="30" y="280" width="170" height="52" rx="8" class="hold"/>
  <text x="115.0" y="311.0" class="m" text-anchor="middle">usernameEq("member1")</text>
  <rect x="225" y="280" width="300" height="52" rx="8" class="box"/>
  <text x="375.0" y="301.5" class="m" text-anchor="middle">member.username.eq("member1")</text>
  <text x="375.0" y="320.5" class="sub" text-anchor="middle">값이 null이면 null 반환</text>
  <rect x="30" y="344" width="170" height="52" rx="8" class="hold"/>
  <text x="115.0" y="375.0" class="m" text-anchor="middle">ageEq(10)</text>
  <rect x="225" y="344" width="300" height="52" rx="8" class="box"/>
  <text x="375.0" y="365.5" class="m" text-anchor="middle">member.age.eq(10)</text>
  <text x="375.0" y="384.5" class="sub" text-anchor="middle">값이 null이면 null 반환</text>
  <line x1="200" y1="306" x2="221" y2="306" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="200" y1="370" x2="221" y2="370" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="560" y="280" width="170" height="116" rx="8" class="ok"/>
  <text x="645.0" y="324.0" class="okt" text-anchor="middle">allEq(…)로 and</text>
  <text x="645.0" y="343.0" class="okm" text-anchor="middle">where(allEq(…))</text>
  <text x="645.0" y="362.0" class="gnote" text-anchor="middle">member1 조회</text>
  <line x1="525" y1="306" x2="556" y2="326" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="525" y1="370" x2="556" y2="350" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="422" class="foot" text-anchor="start">where 조건의 null은 무시되고, 조건 메서드는 allEq처럼 조합하거나 다른 쿼리에서 다시 사용할 수 있습니다</text>
</svg>
