<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>em.find로 memberA를 조회하면 1차 캐시에 엔티티와 최초 값의 스냅샷이 저장되고, setUsername·setAge로 값을 바꾼 뒤 commit하면 엔티티와 스냅샷을 비교해 UPDATE SQL을 쓰기 지연 SQL 저장소에 넣고 flush와 커밋으로 DB에 반영하는 변경 감지 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .m { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="372" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="352" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">변경 감지 — 스냅샷과 비교해 UPDATE를 만든다</text>
  <text x="220" y="68" class="step" text-anchor="middle">find(memberA)</text>
  <text x="360" y="68" class="step" text-anchor="middle">값 수정</text>
  <text x="500" y="68" class="step" text-anchor="middle">commit()</text>
  <text x="640" y="68" class="step" text-anchor="middle">flush · 커밋</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">코드</text>
  <text x="30" y="126" class="sub">EntityManager</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="108" class="m" text-anchor="middle">find</text>
  <text x="220" y="127" class="val" text-anchor="middle">memberA</text>
  <rect x="302" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="360" y="108" class="m" text-anchor="middle">setUsername</text>
  <text x="360" y="127" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">setAge(10)</tspan></text>
  <rect x="442" y="88" width="116" height="48" rx="8" class="hold"/>
  <text x="500" y="108" class="m" text-anchor="middle">commit()</text>
  <text x="500" y="127" class="val" text-anchor="middle">트랜잭션 커밋</text>
  <text x="30" y="168" class="lane">1차 캐시</text>
  <text x="30" y="186" class="sub">엔티티 · 스냅샷</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="148" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="168" class="t" text-anchor="middle">스냅샷 저장</text>
  <text x="220" y="187" class="val" text-anchor="middle">최초에 가져온 값</text>
  <rect x="302" y="148" width="116" height="48" rx="8" class="box"/>
  <text x="360" y="168" class="t" text-anchor="middle">엔티티 변경</text>
  <text x="360" y="187" class="val" text-anchor="middle">스냅샷은 그대로</text>
  <rect x="442" y="148" width="116" height="48" rx="8" class="hold"/>
  <text x="500" y="168" class="t" text-anchor="middle">스냅샷 비교</text>
  <text x="500" y="187" class="val" text-anchor="middle">다른 부분 체크</text>
  <text x="30" y="228" class="lane">SQL 저장소</text>
  <text x="30" y="246" class="sub">쓰기 지연</text>
  <rect x="150" y="206" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="216" width="256" height="32" rx="6" class="wait"/>
  <text x="290" y="237" class="waitt" text-anchor="middle">update 호출 코드 없음</text>
  <rect x="442" y="208" width="116" height="48" rx="8" class="box"/>
  <text x="500" y="228" class="m" text-anchor="middle">UPDATE</text>
  <text x="500" y="247" class="val" text-anchor="middle">저장</text>
  <rect x="582" y="208" width="116" height="48" rx="8" class="hold"/>
  <text x="640" y="228" class="m" text-anchor="middle">flush</text>
  <text x="640" y="247" class="val" text-anchor="middle">DB로 전송</text>
  <text x="30" y="288" class="lane">DB</text>
  <rect x="150" y="266" width="585" height="52" rx="6" class="track"/>
  <rect x="582" y="268" width="116" height="48" rx="8" class="ok"/>
  <text x="640" y="288" class="okc" text-anchor="middle">UPDATE</text>
  <text x="640" y="307" class="val" text-anchor="middle">값 변경 · 커밋</text>
  <line x1="500" y1="196" x2="500" y2="206" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="558" y1="232" x2="576" y2="232" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="640" y1="256" x2="640" y2="266" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="346" class="foot">em.update() 같은 코드 없이, 커밋 시점에 스냅샷과 다른 부분을 찾아 UPDATE SQL을 만든다</text>
</svg>
