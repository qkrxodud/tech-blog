<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결제가 PG에 보내기 전에 취소를 받을지 판단하는 순서(Payment.checkCancel) — 1 전이 표에 CANCEL이 없는 상태(승인 전, 인증, 인증 실패, 승인 실패, 결과 모름, 만료, 이미 취소)면 409 INVALID_PAYMENT_TRANSITION, 2 금액이 없으면 받을 수 있는 금액 전부로 정함, 3 0원 이하면 400 INVALID_AMOUNT, 4 받을 수 있는 금액(남은 금액에서 PG 답을 기다리는 취소를 뺀 값)을 넘으면 409 CANCEL_AMOUNT_EXCEEDS_BALANCE, 모두 지나면 그 금액으로 REQUESTED 취소를 남기고 PG로 보냄. 거절은 모두 PG를 부르지 않음</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #4b5563; }
