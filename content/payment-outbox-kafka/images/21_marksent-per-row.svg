<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>릴레이 한 주기에서 markSent는 어느 트랜잭션에도 끼지 않고 JdbcTemplate으로 줄마다 바로 반영됨 — findUnsent(50)로 sent_at이 빈 줄을 번호 순으로 읽어, 줄마다 결제 번호를 키로 send하고 받았다는 답이 오면 markSent로 보낸 때를 남김. 주기 중간에 멈춰도 그때까지 보낸 줄은 sent_at이 남아 있어 다음 주기의 findUnsent는 아직 안 보낸 줄만 읽어 다시 보내지 않음</title>
