<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>같은 알림 묶음 측정의 묶음과 조건 — ./gradlew webhookMeasurement로 구현마다 같은 묶음을 보냄. 시나리오 9개(순서 바뀜, 승인 알림이 승인 답보다 먼저, 같은 알림 두 번, 같은 상태를 다른 때에 다시, 위조 알림, PG 조회가 늦음, 결과 모름 결제, 결과 모름 취소, PG에서만 일어난 부분 취소)를 2건씩 보내 결제 18건이고 모든 결제에 승인 알림도 감. 측정에서는 받은 알림 처리와 4·5장 주기 보정을 0.2초마다 함께 돌리고, 읽기 시간 제한 1초, 보정 대기 시간 10초, 200이 아니면 100ms 간격으로 7번까지 다시 보냄. 운영 설정은 처리 1초, 보정 1분. 묶음을 보내는 데 구현마다 14676ms에서 15311ms가 걸렸고, 다 보낸 뒤 25초까지 봐서 그때 PG와 다른 결제를 어긋남으로 셈. 맞춰지기까지는 결제의 마지막 PG 쪽 변화(위조는 위조 알림을 보낸 때)부터 처음 PG와 같아진 때까지. 한 번 실행한 값</title>
  <style>
