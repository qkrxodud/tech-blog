<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 548" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>달맞이산에서 Claude가 포켓몬센터 방향, 통과 여부, 턱에서 떨어진 이유를 노트에 잘못 적었고, 드리밍이 대화 기록과 대조해 노트를 고친 경우만 1,935번째 행동에 블루시티에 도착한 그림</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="548" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="290" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">달맞이산 — 드리밍이 대화 기록과 대조해 노트를 고침</text>
  <text x="220" y="68" class="step" text-anchor="middle">이정표</text>
  <text x="360" y="68" class="step" text-anchor="middle">진행 표시</text>
  <text x="500" y="68" class="step" text-anchor="middle">턱에서 떨어진 뒤</text>
  <text x="640" y="68" class="step" text-anchor="middle">드리밍</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">세션 중 노트</text>
  <text x="30" y="126" class="sub">Claude가 적음</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="158" y="88" width="124" height="48" rx="8" class="bad"/>
  <text x="220" y="108" class="badt" text-anchor="middle">센터는 동쪽</text>
  <text x="220" y="127" class="val" text-anchor="middle">이정표 잘못 적음</text>
  <rect x="298" y="88" width="124" height="48" rx="8" class="bad"/>
  <text x="360" y="108" class="badt" text-anchor="middle">달맞이산 완료</text>
  <text x="360" y="127" class="val" text-anchor="middle">지나왔다고 표시</text>
  <rect x="438" y="88" width="124" height="48" rx="8" class="bad"/>
  <text x="500" y="108" class="badt" text-anchor="middle">지나쳤다고 결론</text>
  <text x="500" y="127" class="val" text-anchor="middle">원래 맞는 쪽</text>
  <rect x="578" y="88" width="124" height="48" rx="8" class="ok"/>
  <text x="640" y="108" class="okt" text-anchor="middle">노트 다시 씀</text>
  <text x="640" y="127" class="val" text-anchor="middle">오류 정정</text>
  <text x="30" y="168" class="lane">대화 기록</text>
  <text x="30" y="186" class="sub">실제로 일어난 일</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="158" y="148" width="124" height="48" rx="8" class="box"/>
  <text x="220" y="168" class="db" text-anchor="middle">센터는 입구 쪽</text>
  <text x="220" y="187" class="val" text-anchor="middle">입구는 서쪽</text>
  <rect x="298" y="148" width="124" height="48" rx="8" class="box"/>
  <text x="360" y="168" class="db" text-anchor="middle">아직 못 지남</text>
  <text x="360" y="187" class="val" text-anchor="middle">동굴 통과 전</text>
  <rect x="438" y="148" width="124" height="48" rx="8" class="box"/>
  <text x="500" y="168" class="db" text-anchor="middle">턱에서 떨어짐</text>
  <text x="500" y="187" class="val" text-anchor="middle">도구에 턱 안 보임</text>
  <text x="30" y="228" class="lane">드리밍</text>
  <text x="30" y="246" class="sub">작업이 끝난 뒤</text>
  <rect x="150" y="206" width="585" height="52" rx="6" class="track"/>
  <rect x="578" y="208" width="124" height="48" rx="8" class="hold"/>
  <text x="640" y="228" class="db" text-anchor="middle">기록과 대조</text>
  <text x="640" y="247" class="val" text-anchor="middle">틀린 노트 찾기</text>
  <line x1="563" y1="186" x2="577" y2="214" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="640" y1="207" x2="640" y2="139" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="150" y="284" class="sub">입구는 서쪽, 출구는 동쪽. 입구 근처의 한 방향 턱에서 내려서면 왔던 길로 떨어진다.</text>
  <rect x="10" y="316" width="740" height="222" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="348" class="h">결과 — 노트 상태에 따라 블루시티에 도착했는지</text>
  <text x="30" y="386" class="lane">고친 노트</text>
  <text x="30" y="403" class="sub">드리밍 뒤</text>
  <rect x="210" y="366" width="525" height="44" rx="8" class="ok"/>
  <text x="472" y="393" class="okt" text-anchor="middle">곧장 달맞이산으로 돌아가 1,935번째 행동에 블루시티 도착</text>
  <text x="30" y="442" class="lane">고치지 않은 노트</text>
  <rect x="210" y="420" width="525" height="54" rx="8" class="bad"/>
  <text x="472" y="442" class="badt" text-anchor="middle">같은 길로 세 번 떨어짐 · 블루시티 못 감</text>
  <text x="472" y="462" class="note" text-anchor="middle">멈추겠다고 적었지만 하네스 자동 응답으로 계속 진행해 회색시티까지 되돌아감</text>
  <text x="30" y="506" class="lane">메모리 없음</text>
  <rect x="210" y="484" width="525" height="44" rx="8" class="bad"/>
  <text x="472" y="511" class="badt" text-anchor="middle">블루시티 못 감</text>
</svg>
