<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>mixed GC를 시작하면 young gen remembered set의 I와 #0, #1 그룹 remembered set의 F, I를 하나로 합쳐 merged remembered set F, I를 만들고, 이를 GC root와 함께 출발점으로 삼아 A, C, L은 새 survivor region으로, B, D, E, H는 새 old region으로 옮긴다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .lane2 { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .rl11 { font-size: 11px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .obj { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .old { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 1.2; }
    .young { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; }
    .free { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; stroke-dasharray: 4 3; }
    .ob { fill: #ffffff; stroke: #6b7280; stroke-width: 1.2; }
    .cset { fill: none; stroke: #16a34a; stroke-width: 2.6; }
    .grp { fill: none; stroke: #16a34a; stroke-width: 2; stroke-dasharray: 7 4; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .sep { stroke: #e5e7eb; stroke-width: 1; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="610" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="266" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">Merge Heap Roots — collection set의 remembered set 합치기</text>
  <text x="730" y="42" class="code" text-anchor="end">mixed GC</text>
  <text x="40" y="82" class="sub">young gen rset</text>
  <rect x="40" y="90" width="130" height="24" rx="3" class="bad"/>
  <text x="105.0" y="107" class="badt" text-anchor="middle">I</text>
  <text x="40" y="158" class="sub">rset of #0, #1</text>
  <rect x="40" y="166" width="130" height="24" rx="3" class="hold"/>
  <text x="105.0" y="183" class="obj" text-anchor="middle">F</text>
  <rect x="40" y="192" width="130" height="24" rx="3" class="bad"/>
  <text x="105.0" y="209" class="badt" text-anchor="middle">I</text>
  <path d="M 176 102 C 260 102, 260 150, 330 150" class="gl" marker-end="url(#agr)"/>
  <path d="M 176 192 C 260 192, 260 160, 330 160" class="gl" marker-end="url(#agr)"/>
  <text x="214" y="150" class="gnote" text-anchor="middle">merge</text>
  <text x="340" y="122" class="sub">merged remembered set</text>
  <rect x="340" y="130" width="150" height="24" rx="3" class="ok"/>
  <text x="415.0" y="147" class="okt" text-anchor="middle">F</text>
  <rect x="340" y="156" width="150" height="24" rx="3" class="ok"/>
  <text x="415.0" y="173" class="okt" text-anchor="middle">I</text>
  <text x="520" y="140" class="gnote">중복된 I는 하나로</text>
  <text x="520" y="162" class="sub">GC root와 함께</text>
  <text x="520" y="180" class="sub">evacuation의 출발점</text>
  <text x="40" y="256" class="sub">rset of #7, #8(E)은 이번 collection set의 것이 아니므로 합치지 않음</text>
  <rect x="10" y="292" width="740" height="308" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="324" class="h">mixed GC 종료 — 살아 있는 객체를 옮긴 결과</text>
  <text x="730" y="324" class="code" text-anchor="end">evacuation</text>
  <rect x="30" y="340" width="700" height="44" rx="6" class="track"/>
  <rect x="40" y="346" width="240" height="32" rx="6" class="ok"/>
  <text x="160" y="367" class="okt" text-anchor="middle">A, C, L</text>
  <text x="300" y="367" class="val">새 survivor region으로 이동</text>
  <rect x="30" y="392" width="700" height="44" rx="6" class="track"/>
  <rect x="40" y="398" width="240" height="32" rx="6" class="ok"/>
  <text x="160" y="419" class="okt" text-anchor="middle">B, D, E, H</text>
  <text x="300" y="419" class="val">새 old region으로 이동</text>
  <rect x="30" y="444" width="700" height="44" rx="6" class="track"/>
  <rect x="40" y="450" width="240" height="32" rx="6" class="box"/>
  <text x="160" y="471" class="op" text-anchor="middle">#0, #1, 기존 young region</text>
  <text x="300" y="471" class="val">free region으로 비워짐</text>
  <rect x="40" y="528" width="130" height="24" rx="3" class="hold"/>
  <text x="105" y="545" class="obj" text-anchor="middle">E</text>
  <rect x="40" y="554" width="130" height="24" rx="3" class="hold"/>
  <text x="105" y="571" class="obj" text-anchor="middle">E</text>
  <text x="40" y="518" class="sub">rset of #7, #8</text>
  <text x="190" y="545" class="val">강의 그림에서는 mixed GC 후 E가 두 개 표시됨</text>
  <text x="190" y="567" class="sub">옮겨진 E가 여전히 #7, #8 그룹의 객체를 참조하기 때문으로 보임</text>
</svg>
