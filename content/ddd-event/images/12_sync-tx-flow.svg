<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>컨트롤러부터 외부 결제 시스템까지 1번 cancel부터 7번 결제 취소 API 호출이 한 흐름으로 이어지고, 돌아온 뒤 13번 DB 업데이트에 실패하면 결제만 취소된 상태로 남는 동기 처리 순서</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 12px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .msg { font-size: 11.5px; fill: #374151; }
    .hd { font-size: 10.5px; fill: #374151; }
    .gmsg { font-size: 11.5px; fill: #15803d; }
    .rmsg { font-size: 11.5px; fill: #b91c1c; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .pkg { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .life { stroke: #c4c8ce; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .act { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.2; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6b7280" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect width="760" height="580" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="560" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">동기 처리 — 외부 API까지 한 흐름에서 실행된다</text>
  <rect x="20" y="58" width="84" height="42" rx="5" class="box"/>
  <text x="62" y="74.5" class="hd" text-anchor="middle">CancelOrder</text>
  <text x="62" y="93.5" class="hd" text-anchor="middle">Controller</text>
  <line x1="62" y1="100" x2="62" y2="500" class="life"/>
  <rect x="110" y="58" width="84" height="42" rx="5" class="box"/>
  <text x="152" y="74.5" class="hd" text-anchor="middle">CancelOrder</text>
  <text x="152" y="93.5" class="hd" text-anchor="middle">Service</text>
  <line x1="152" y1="100" x2="152" y2="500" class="life"/>
  <rect x="200" y="58" width="84" height="42" rx="5" class="box"/>
  <text x="242" y="84" class="hd" text-anchor="middle">Order</text>
  <line x1="242" y1="100" x2="242" y2="500" class="life"/>
  <rect x="290" y="58" width="84" height="42" rx="5" class="box"/>
  <text x="332" y="84" class="hd" text-anchor="middle">Events</text>
  <line x1="332" y1="100" x2="332" y2="500" class="life"/>
  <rect x="380" y="58" width="84" height="42" rx="5" class="box"/>
  <text x="422" y="84" class="hd" text-anchor="middle">퍼블리셔</text>
  <line x1="422" y1="100" x2="422" y2="500" class="life"/>
  <rect x="470" y="58" width="84" height="42" rx="5" class="box"/>
  <text x="512" y="74.5" class="hd" text-anchor="middle">OrderCanceled</text>
  <text x="512" y="93.5" class="hd" text-anchor="middle">EventHandler</text>
  <line x1="512" y1="100" x2="512" y2="500" class="life"/>
  <rect x="560" y="58" width="84" height="42" rx="5" class="box"/>
  <text x="602" y="84" class="hd" text-anchor="middle">RefundService</text>
  <line x1="602" y1="100" x2="602" y2="500" class="life"/>
  <rect x="650" y="58" width="84" height="42" rx="5" class="box"/>
  <text x="692" y="84" class="hd" text-anchor="middle">외부 시스템</text>
  <line x1="692" y1="100" x2="692" y2="500" class="life"/>
  <rect x="57" y="118" width="10" height="368" class="act"/>
  <rect x="147" y="130" width="10" height="344" class="act"/>
  <rect x="237" y="154" width="10" height="236" class="act"/>
  <rect x="327" y="178" width="10" height="188" class="act"/>
  <rect x="417" y="202" width="10" height="140" class="act"/>
  <rect x="507" y="226" width="10" height="92" class="act"/>
  <rect x="597" y="250" width="10" height="44" class="act"/>
  <rect x="687" y="274" width="10" height="14" class="ok"/>
  <line x1="68" y1="130" x2="144" y2="130" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="71" y="124" class="msg">1. cancel()</text>
  <line x1="158" y1="154" x2="234" y2="154" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="161" y="148" class="msg">2. cancel()</text>
  <line x1="248" y1="178" x2="324" y2="178" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="251" y="172" class="msg">3. raise()</text>
  <line x1="338" y1="202" x2="414" y2="202" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="341" y="196" class="msg">4. publishEvent()</text>
  <line x1="428" y1="226" x2="504" y2="226" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="431" y="220" class="msg">5. handle()</text>
  <line x1="518" y1="250" x2="594" y2="250" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="521" y="244" class="msg">6. refund()</text>
  <line x1="608" y1="274" x2="684" y2="274" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="611" y="268" class="gmsg">7. 결제 취소 API</text>
  <line x1="596" y1="294" x2="520" y2="294" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <text x="557.0" y="288" class="msg" text-anchor="middle">8</text>
  <line x1="506" y1="318" x2="430" y2="318" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <text x="467.0" y="312" class="msg" text-anchor="middle">9</text>
  <line x1="416" y1="342" x2="340" y2="342" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <text x="377.0" y="336" class="msg" text-anchor="middle">10</text>
  <line x1="326" y1="366" x2="250" y2="366" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <text x="287.0" y="360" class="msg" text-anchor="middle">11</text>
  <line x1="236" y1="390" x2="160" y2="390" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <text x="197.0" y="384" class="msg" text-anchor="middle">12</text>
  <rect x="155" y="422" width="10" height="24" class="bad"/>
  <path d="M157,412 L182,412 L182,432 L168,432" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="188" y="428" class="note">13. DB 업데이트 실패</text>
  <line x1="146" y1="474" x2="70" y2="474" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <text x="107.0" y="468" class="msg" text-anchor="middle">14</text>
  <text x="30" y="530" class="note">12번까지 성공하고 13번 DB 업데이트에 실패하면, 결제는 취소됐는데</text>
  <text x="30" y="550" class="note">DB에는 주문이 취소되지 않은 상태로 남습니다.</text>
</svg>
