<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>collection set은 young regions, humongous regions, collection set candidate regions로 구성되고, candidate는 Concurrent start부터 Cleanup까지의 marking과 evacuation failure 두 경로로 등록된다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .lane2 { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .opc { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .rg { font-size: 13px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dark { fill: #d1d5db; stroke: #6b7280; stroke-width: 1.2; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="440" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="420" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">collection set — 수집 대상 region의 구성</text>
  <text x="730" y="42" class="code" text-anchor="end">collection set</text>
  <rect x="270" y="66" width="220" height="52" rx="8" class="box"/>
  <text x="380.0" y="88.0" class="op" text-anchor="middle">Young regions</text>
  <text x="380.0" y="106.0" class="val" text-anchor="middle">모든 collection에 항상 포함</text>
  <rect x="270" y="136" width="220" height="52" rx="8" class="box"/>
  <text x="380.0" y="158.0" class="op" text-anchor="middle">Humongous regions</text>
  <text x="380.0" y="176.0" class="val" text-anchor="middle">garbage면 어느 collection에서도</text>
  <rect x="270" y="206" width="220" height="52" rx="8" class="hold"/>
  <text x="380.0" y="228.0" class="op" text-anchor="middle">CSet candidate regions</text>
  <text x="380.0" y="246.0" class="val" text-anchor="middle">회수하기 좋은 old regions</text>
  <rect x="560" y="116" width="170" height="92" rx="8" class="ok"/>
  <text x="645.0" y="158.0" class="okt" text-anchor="middle">collection set</text>
  <text x="645.0" y="176.0" class="val" text-anchor="middle">이번 GC의 수집 대상</text>
  <path d="M 490 92 C 525 92 525 162 556 162" class="gl" marker-end="url(#agr)"/>
  <path d="M 490 162 C 525 162 525 162 556 162" class="gl" marker-end="url(#agr)"/>
  <path d="M 490 232 C 525 232 525 162 556 162" class="gl" marker-end="url(#agr)"/>
  <rect x="40" y="310" width="300" height="56" rx="8" class="box"/>
  <text x="190.0" y="334.0" class="op" text-anchor="middle">① Concurrent start ~ Cleanup</text>
  <text x="190.0" y="352.0" class="val" text-anchor="middle">garbage가 많은 old region만 추림</text>
  <rect x="420" y="310" width="300" height="56" rx="8" class="bad"/>
  <text x="570.0" y="334.0" class="badt" text-anchor="middle">② evacuation failure를 겪은 region</text>
  <text x="570.0" y="352.0" class="val" text-anchor="middle">young은 old로 승격, 다음 GC 때 바로</text>
  <path d="M 190 310 C 190 280 330 280 350 262" class="al" marker-end="url(#ar)"/>
  <path d="M 570 310 C 570 280 430 280 410 262" class="rl" marker-end="url(#arr)"/>
  <text x="190" y="388" class="sub" text-anchor="middle">이전 글에서 정리한 marking 경로</text>
  <text x="570" y="388" class="sub" text-anchor="middle">garbage가 많을 가능성이 큰 region</text>
  <text x="380" y="408" class="sub" text-anchor="middle">②로 등록된 region 때문에 young GC에도 old region이 collection set에 포함될 수 있다</text>
</svg>
