<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>m.username 같은 상태 필드는 탐색의 끝이고, o.member 같은 단일 값 연관 경로는 묵시적 내부 조인 후 o.member.team처럼 계속 탐색할 수 있으며, t.members 같은 컬렉션 값 연관 경로는 t.members.username으로 탐색하면 실패해 join t.members m으로 별칭을 얻어 탐색하는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .msg { font-size: 11.5px; fill: #374151; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .cont { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="450" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">경로 표현식 — 상태 필드, 단일 값 연관, 컬렉션 값 연관</text>
  <text x="30" y="92" class="ts" text-anchor="start">상태 필드</text>
  <rect x="140" y="64" width="600" height="60" rx="6" class="track"/>
  <text x="30" y="182" class="ts" text-anchor="start">단일 값 연관</text>
  <rect x="140" y="154" width="600" height="60" rx="6" class="track"/>
  <text x="30" y="272" class="ts" text-anchor="start">컬렉션 값 연관</text>
  <rect x="140" y="244" width="600" height="60" rx="6" class="track"/>
  <rect x="150" y="70" width="170" height="48" rx="8" class="box"/>
  <text x="235.0" y="90" class="opm" text-anchor="middle">m.username</text>
  <text x="235.0" y="109" class="val" text-anchor="middle">상태 필드</text>
  <rect x="345" y="70" width="170" height="48" rx="8" class="hold"/>
  <text x="430.0" y="90" class="t" text-anchor="middle">탐색의 끝</text>
  <text x="430.0" y="109" class="val" text-anchor="middle">더 탐색할 수 없음</text>
  <line x1="320" y1="94" x2="341" y2="94" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="150" y="160" width="170" height="48" rx="8" class="box"/>
  <text x="235.0" y="180" class="opm" text-anchor="middle">o.member</text>
  <text x="235.0" y="199" class="val" text-anchor="middle">다대일 연관</text>
  <rect x="345" y="160" width="170" height="48" rx="8" class="hold"/>
  <text x="430.0" y="180" class="t" text-anchor="middle">묵시적 내부 조인</text>
  <text x="430.0" y="199" class="val" text-anchor="middle">SQL에 inner join</text>
  <rect x="540" y="160" width="190" height="48" rx="8" class="ok"/>
  <text x="635.0" y="180" class="okm" text-anchor="middle">o.member.team</text>
  <text x="635.0" y="199" class="val" text-anchor="middle">계속 탐색 — 성공</text>
  <line x1="320" y1="184" x2="341" y2="184" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="515" y1="184" x2="536" y2="184" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="150" y="250" width="170" height="48" rx="8" class="box"/>
  <text x="235.0" y="270" class="opm" text-anchor="middle">t.members</text>
  <text x="235.0" y="289" class="val" text-anchor="middle">일대다 컬렉션</text>
  <rect x="345" y="250" width="170" height="48" rx="8" class="hold"/>
  <text x="430.0" y="270" class="t" text-anchor="middle">묵시적 내부 조인</text>
  <text x="430.0" y="289" class="val" text-anchor="middle">SQL에 inner join</text>
  <rect x="540" y="250" width="190" height="48" rx="8" class="bad"/>
  <text x="635.0" y="270" class="badm" text-anchor="middle">t.members.username</text>
  <text x="635.0" y="289" class="val" text-anchor="middle">더 탐색 — 실패</text>
  <line x1="320" y1="274" x2="341" y2="274" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="515" y1="274" x2="536" y2="274" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="30" y="352" class="ts" text-anchor="start">명시적 조인</text>
  <rect x="140" y="334" width="600" height="60" rx="6" class="track"/>
  <rect x="150" y="340" width="365" height="48" rx="8" class="ok"/>
  <text x="332.5" y="360" class="okm" text-anchor="middle">from Team t join t.members m</text>
  <text x="332.5" y="379" class="val" text-anchor="middle">FROM 절에서 별칭 m을 얻음</text>
  <rect x="540" y="340" width="190" height="48" rx="8" class="ok"/>
  <text x="635.0" y="360" class="okm" text-anchor="middle">m.username</text>
  <text x="635.0" y="379" class="val" text-anchor="middle">별칭으로 탐색 — 성공</text>
  <line x1="515" y1="364" x2="536" y2="364" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="635" y1="298" x2="635" y2="336" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="426" class="sub" text-anchor="start">묵시적 조인은 항상 내부 조인이고, SQL의 FROM(JOIN) 절에 영향을 줍니다</text>
</svg>
