<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>10장 계약 SagaContract 21개 — 재고가 모자란 주문 4개(카드사에 승인을 요청하지 않음, 승인 없이 실패로 끝남, 쓴 쿠폰·포인트를 돌려줌, 재고를 그대로 둠), 확정과 원복 5개(승인된 주문의 예약은 확정, 카드사 거절·만료 보정·전액 취소·결과 모름 보정 실패의 재고는 처음으로), 결과 모름 2개(그동안 예약을 그대로 둠, 보정이 승인으로 닫으면 확정), 늦음과 순서 5개(답이 늦어도 재고는 처음으로, 답이 늦은 주문은 카드사에 요청하지 않음, 예약 처리 중 시간 초과, 해제보다 늦게 도착한 예약, 해제가 먼저 도착해도 처음보다 늘지 않음), 두 번 2개(같은 해제, 같은 확정), 멈춤 1개(재고 서비스가 멈춘 동안 승인 없이 끝난 주문의 재고는 돌아온 뒤 처음으로), 몰림 2개(재고 100개에 서버 두 대로 300건이 와도 승인 100건 이하, 일부 취소 뒤 남은 재고와 승인 수량의 합이 처음 재고). 4 + 5 + 2 + 5 + 2 + 1 + 2 = 21. 계약에서는 재고 서비스 읽기 시간 제한을 0.5초로 줄이고 늦은 재고 서비스와 카드사는 1.5초 뒤에 답함</title>
