<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>PG 승인 뒤 우리 쪽 결과 기록이 실패하면 — MySQL 트리거로 APPROVED로 바꾸는 저장을 막은 ApprovalRecordFailureTest 2개(통과). 트랜잭션을 나눈 구조는 트랜잭션 1에서 AUTHENTICATED를 커밋하고 트랜잭션 밖에서 PG 승인을 받은 뒤 트랜잭션 2의 결과 기록이 막혀, Mock PG에는 승인 1건, 결제는 AUTHENTICATED로 남음. 하나로 묶은 구조(비교 A)는 결과 기록이 막혀 트랜잭션 전체가 되돌려져 Mock PG에는 승인 1건, 결제는 READY로 남음. 하나로 묶어도 PG 호출은 롤백되지 않음</title>
