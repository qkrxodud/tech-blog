<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 712" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>같은 승인 요청이 다시 올 때 선택지별 PG 호출과 응답 — 첫 요청이 PG를 한 번 불러 결과를 기록한 뒤 요청이 다시 오면, 다시 온 요청을 가리지 않는 비교 C는 인증 전이에서 막혀 같은 요청에도 409로 답하고, 상태만으로 가리는 비교 D는 같은 요청에 결과로 답하지만 다른 결제 키의 요청까지 승인으로 답하며, 결제 키와 상태로 가리는 고른 방식은 같은 키에는 기록된 결과로 답하고 다른 키는 409로 거부하는 그림. 세 방식 모두 다시 온 요청에서 PG는 부르지 않는다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 13.5px; fill: #9ca3af; }
    .sub { font-size: 13.5px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 13.5px; fill: #4b5563; }
    .m { font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .flow { stroke: #9ca3af; stroke-width: 1.4; fill: none; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 13.5px; fill: #b91c1c; }
    .gnote { font-size: 13.5px; fill: #15803d; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="712" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="152" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="40" class="h">첫 요청 — 카드사 답이 결제에 기록됨</text>
  <rect x="30" y="54" width="128" height="52" rx="8" class="box"/>
  <text x="94" y="75" class="t" text-anchor="middle">① 승인 요청</text>
  <text x="94" y="94" class="val" text-anchor="middle">결제 키와 금액</text>
  <rect x="173" y="54" width="128" height="52" rx="8" class="box"/>
  <text x="237" y="75" class="t" text-anchor="middle">② 금액 확인</text>
  <text x="237" y="94" class="val" text-anchor="middle">준비 금액과 같음</text>
  <rect x="316" y="54" width="128" height="52" rx="8" class="box"/>
  <text x="380" y="75" class="t" text-anchor="middle">③ 인증 전이</text>
  <text x="380" y="94" class="val" text-anchor="middle"><tspan class="m" style="font-size: 12.5px">AUTHENTICATED</tspan></text>
  <rect x="459" y="54" width="128" height="52" rx="8" class="hold"/>
  <text x="523" y="75" class="t" text-anchor="middle">④ PG 승인 호출</text>
  <text x="523" y="94" class="val" text-anchor="middle">1회</text>
  <rect x="602" y="54" width="128" height="52" rx="8" class="box"/>
  <text x="666" y="75" class="t" text-anchor="middle">⑤ 결과 기록</text>
  <text x="666" y="94" class="val" text-anchor="middle"><tspan class="m" style="font-size: 12.5px">APPROVED</tspan></text>
  <line x1="158" y1="80" x2="171" y2="80" class="flow" marker-end="url(#ar)"/>
  <line x1="301" y1="80" x2="314" y2="80" class="flow" marker-end="url(#ar)"/>
  <line x1="444" y1="80" x2="457" y2="80" class="flow" marker-end="url(#ar)"/>
  <line x1="587" y1="80" x2="600" y2="80" class="flow" marker-end="url(#ar)"/>
  <text x="30" y="132" class="sub">카드사가 거절했다면 ⑤에서 <tspan class="m" style="font-size: 12.5px">APPROVAL_FAILED</tspan>로 기록됨</text>
  <text x="30" y="152" class="sub">응답을 받지 못한 클라이언트가 같은 요청을 다시 보내거나, 다른 결제 키로 요청이 옴 ↓</text>
  <text x="30" y="186" class="step">다시 온 요청</text>
  <text x="346" y="186" class="step" text-anchor="middle">판단</text>
  <text x="546" y="186" class="step" text-anchor="middle">PG 호출</text>
  <text x="663" y="186" class="step" text-anchor="middle">응답</text>
  <rect x="10" y="194" width="740" height="142" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="220" class="h" style="font-size: 15px">비교 C — 다시 온 요청을 가리지 않음 (409로 답하는 방식)</text>
  <text x="30" y="251" class="sub">같은 키 · 승인된 결제</text>
  <rect x="196" y="232" width="300" height="28" rx="6" class="box"/>
  <text x="346" y="251" class="val" text-anchor="middle">인증 전이를 다시 시도 → 거부</text>
  <rect x="508" y="232" width="76" height="28" rx="14" class="hold"/>
  <text x="546" y="251" class="val" text-anchor="middle">0회</text>
  <rect x="596" y="232" width="134" height="28" rx="6" class="bad"/>
  <text x="663" y="251" class="badt" text-anchor="middle" style="font-size: 13.5px">409 (승인 대신)</text>
  <text x="30" y="283" class="sub">같은 키 · 거절된 결제</text>
  <rect x="196" y="264" width="300" height="28" rx="6" class="box"/>
  <text x="346" y="283" class="val" text-anchor="middle">인증 전이를 다시 시도 → 거부</text>
  <rect x="508" y="264" width="76" height="28" rx="14" class="hold"/>
  <text x="546" y="283" class="val" text-anchor="middle">0회</text>
  <rect x="596" y="264" width="134" height="28" rx="6" class="bad"/>
  <text x="663" y="283" class="badt" text-anchor="middle" style="font-size: 13.5px">409 (거절 대신)</text>
  <text x="30" y="315" class="sub">다른 키 · 승인된 결제</text>
  <rect x="196" y="296" width="300" height="28" rx="6" class="box"/>
  <text x="346" y="315" class="val" text-anchor="middle">인증 전이를 다시 시도 → 거부</text>
  <rect x="508" y="296" width="76" height="28" rx="14" class="hold"/>
  <text x="546" y="315" class="val" text-anchor="middle">0회</text>
  <rect x="596" y="296" width="134" height="28" rx="6" class="ok"/>
  <text x="663" y="315" class="okt" text-anchor="middle" style="font-size: 13.5px">409 거부</text>
  <rect x="10" y="352" width="740" height="142" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="378" class="h" style="font-size: 15px">비교 D — 결제 키 없이 상태만으로 가림</text>
  <text x="30" y="409" class="sub">같은 키 · 승인된 결제</text>
  <rect x="196" y="390" width="300" height="28" rx="6" class="box"/>
  <text x="346" y="409" class="val" text-anchor="middle"><tspan class="m" style="font-size: 12.5px">APPROVED</tspan> → 그 결과로 답</text>
  <rect x="508" y="390" width="76" height="28" rx="14" class="hold"/>
  <text x="546" y="409" class="val" text-anchor="middle">0회</text>
  <rect x="596" y="390" width="134" height="28" rx="6" class="ok"/>
  <text x="663" y="409" class="okt" text-anchor="middle" style="font-size: 13.5px">승인으로 답함</text>
  <text x="30" y="441" class="sub">같은 키 · 거절된 결제</text>
  <rect x="196" y="422" width="300" height="28" rx="6" class="box"/>
  <text x="346" y="441" class="val" text-anchor="middle"><tspan class="m" style="font-size: 12.5px">APPROVAL_FAILED</tspan> → 그 결과로 답</text>
  <rect x="508" y="422" width="76" height="28" rx="14" class="hold"/>
  <text x="546" y="441" class="val" text-anchor="middle">0회</text>
  <rect x="596" y="422" width="134" height="28" rx="6" class="ok"/>
  <text x="663" y="441" class="okt" text-anchor="middle" style="font-size: 13.5px">거절로 답함</text>
  <text x="30" y="473" class="sub">다른 키 · 승인된 결제</text>
  <rect x="196" y="454" width="300" height="28" rx="6" class="box"/>
  <text x="346" y="473" class="val" text-anchor="middle">키를 보지 않고 <tspan class="m" style="font-size: 12.5px">APPROVED</tspan> → 답</text>
  <rect x="508" y="454" width="76" height="28" rx="14" class="hold"/>
  <text x="546" y="473" class="val" text-anchor="middle">0회</text>
  <rect x="596" y="454" width="134" height="28" rx="6" class="bad"/>
  <text x="663" y="473" class="badt" text-anchor="middle" style="font-size: 13.5px">승인으로 답함</text>
  <rect x="10" y="510" width="740" height="142" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="536" class="h" style="font-size: 15px">고른 방식 — 결제 키와 상태로 가림</text>
  <text x="30" y="567" class="sub">같은 키 · 승인된 결제</text>
  <rect x="196" y="548" width="300" height="28" rx="6" class="box"/>
  <text x="346" y="567" class="val" text-anchor="middle">같은 키, 결과가 기록됨 → 그 결과로 답</text>
  <rect x="508" y="548" width="76" height="28" rx="14" class="hold"/>
  <text x="546" y="567" class="val" text-anchor="middle">0회</text>
  <rect x="596" y="548" width="134" height="28" rx="6" class="ok"/>
  <text x="663" y="567" class="okt" text-anchor="middle" style="font-size: 13.5px">승인으로 답함</text>
  <text x="30" y="599" class="sub">같은 키 · 거절된 결제</text>
  <rect x="196" y="580" width="300" height="28" rx="6" class="box"/>
  <text x="346" y="599" class="val" text-anchor="middle">같은 키, 결과가 기록됨 → 그 결과로 답</text>
  <rect x="508" y="580" width="76" height="28" rx="14" class="hold"/>
  <text x="546" y="599" class="val" text-anchor="middle">0회</text>
  <rect x="596" y="580" width="134" height="28" rx="6" class="ok"/>
  <text x="663" y="599" class="okt" text-anchor="middle" style="font-size: 13.5px">거절로 답함</text>
  <text x="30" y="631" class="sub">다른 키 · 승인된 결제</text>
  <rect x="196" y="612" width="300" height="28" rx="6" class="box"/>
  <text x="346" y="631" class="val" text-anchor="middle">다른 키 → 인증 전이 시도 → 거부</text>
  <rect x="508" y="612" width="76" height="28" rx="14" class="hold"/>
  <text x="546" y="631" class="val" text-anchor="middle">0회</text>
  <rect x="596" y="612" width="134" height="28" rx="6" class="ok"/>
  <text x="663" y="631" class="okt" text-anchor="middle" style="font-size: 13.5px">409 거부</text>
  <text x="30" y="676" class="sub">세 방식 모두 다시 온 요청에서는 PG를 부르지 않음(합계 1회). 갈리는 것은 응답.</text>
  <text x="30" y="698" class="sub">고른 방식에서도 같은 키인데 결제가 <tspan class="m" style="font-size: 12.5px">AUTHENTICATED</tspan>이면 돌려줄 결과가 없어 409 — 4장에서 다룸</text>
</svg>
