<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>BigDecimal 금액 비교 — DB에서 읽은 15000.00(소수 자릿수 2)과 요청 JSON의 15000(소수 자릿수 0)을 equals로 비교하면 다른 금액으로 보아 AMOUNT_MISMATCH로 거부하고, compareTo로 비교하면 0이라 금액 확인을 통과하며, equals로 비교한 비교 B는 정상 금액 승인까지 거부해 계약 테스트 7개 중 5개가 실패한 그림</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 13.5px; fill: #9ca3af; }
    .sub { font-size: 13.5px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 13.5px; fill: #4b5563; }
    .m { font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .flow { stroke: #9ca3af; stroke-width: 1.4; fill: none; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 13.5px; fill: #b91c1c; }
    .gnote { font-size: 13.5px; fill: #15803d; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="520" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="362" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">금액 비교 — DB에서 읽은 15000.00과 요청의 15000</text>

  <rect x="30" y="62" width="700" height="64" rx="8" class="hold"/>
  <text x="380" y="88" class="t" text-anchor="middle">DB에서 읽은 금액 <tspan class="m">15000.00</tspan> <tspan font-weight="400" class="val">— <tspan class="m" style="font-size: 13px">decimal(19, 2)</tspan>, 소수 자릿수 2</tspan></text>
  <text x="380" y="112" class="t" text-anchor="middle">요청 JSON의 금액 <tspan class="m">15000</tspan> <tspan font-weight="400" class="val">— <tspan class="m" style="font-size: 13px">new BigDecimal("15000")</tspan>, 소수 자릿수 0</tspan></text>

  <path d="M280,126 L280,140 L200,140 L200,154" class="flow" marker-end="url(#ar)"/>
  <path d="M480,126 L480,140 L560,140 L560,154" class="flow" marker-end="url(#ar)"/>

  <!-- 왼쪽: equals -->
  <rect x="40" y="156" width="320" height="52" rx="8" class="box"/>
  <text x="200" y="177" class="t" text-anchor="middle"><tspan class="m">equals</tspan>로 비교 (비교 B)</text>
  <text x="200" y="196" class="val" text-anchor="middle">수치와 소수 자릿수가 모두 같아야 같음</text>
  <line x1="200" y1="208" x2="200" y2="226" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="40" y="228" width="320" height="52" rx="8" class="bad"/>
  <text x="200" y="249" class="badt" text-anchor="middle">다른 금액으로 봄</text>
  <text x="200" y="268" class="note m" text-anchor="middle" style="font-size: 12.5px">equals → false</text>
  <line x1="200" y1="280" x2="200" y2="298" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="40" y="300" width="320" height="52" rx="8" class="bad"/>
  <text x="200" y="321" class="badt" text-anchor="middle">거부 <tspan class="m" style="font-size: 13px">AMOUNT_MISMATCH</tspan></text>
  <text x="200" y="340" class="note" text-anchor="middle">같은 금액인데 승인하지 않음</text>

  <!-- 오른쪽: compareTo -->
  <rect x="400" y="156" width="320" height="52" rx="8" class="box"/>
  <text x="560" y="177" class="t" text-anchor="middle"><tspan class="m">compareTo</tspan>로 비교 (고른 방식)</text>
  <text x="560" y="196" class="val" text-anchor="middle">값만 비교</text>
  <line x1="560" y1="208" x2="560" y2="226" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="400" y="228" width="320" height="52" rx="8" class="ok"/>
  <text x="560" y="249" class="okt" text-anchor="middle">같은 금액으로 봄</text>
  <text x="560" y="268" class="gnote m" text-anchor="middle" style="font-size: 12.5px">compareTo → 0</text>
  <line x1="560" y1="280" x2="560" y2="298" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="400" y="300" width="320" height="52" rx="8" class="ok"/>
  <text x="560" y="321" class="okt" text-anchor="middle">금액 확인 통과</text>
  <text x="560" y="340" class="gnote" text-anchor="middle">다음 판단(같은 요청인지)으로 넘어감</text>

  <!-- 패널 2: 비교 B 결과 -->
  <rect x="10" y="388" width="740" height="122" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="420" class="h">비교 B — 계약 테스트 7개 중 5개 실패</text>
  <text x="30" y="448" class="sub">테스트의 요청 금액은 모두 <tspan class="m" style="font-size: 13px">15000</tspan>, DB에서 읽은 금액은 모두 <tspan class="m" style="font-size: 13px">15000.00</tspan></text>
  <text x="30" y="472" class="note">실패 5 — 정상 금액으로 보낸 승인까지 모두 <tspan class="m" style="font-size: 12.5px">AmountMismatchException</tspan>으로 거부</text>
  <text x="30" y="494" class="sub">통과 2 — 금액이 다를 때 거부하는 테스트. 모든 요청을 거부하니 통과한 것</text>
</svg>
