<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>Order 엔티티의 OrderLine 밸류 목록이 order_number로 연결된 order_line 테이블에 line_idx 순서와 함께 저장되는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opk { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .ster { font-size: 11.5px; font-style: italic; fill: #6b7280; }
    .cls { font-size: 15px; font-weight: 700; fill: #1f2937; }
    .attr { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
    .sep { stroke: #d1d5db; stroke-width: 1; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
    <marker id="dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="14" markerHeight="9" orient="auto">
      <path d="M1,5 L8,1 L15,5 L8,9 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="400" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">밸류 컬렉션 — 별도 테이블 order_line에 저장</text>
  <text x="730" y="42" class="code" text-anchor="end">@ElementCollection</text>
  <text x="170" y="66" class="step" text-anchor="middle">도메인 모델</text>
  <text x="560" y="66" class="step" text-anchor="middle">테이블</text>
  <rect x="60" y="80" width="230" height="94" rx="6" class="hold"/>
  <text x="175.0" y="97" class="ster" text-anchor="middle">&lt;&lt;Entity&gt;&gt;</text>
  <text x="175.0" y="116" class="cls" text-anchor="middle">Order</text>
  <line x1="60" y1="124" x2="290" y2="124" class="sep"/>
  <text x="72" y="143" class="attr">number: OrderNo</text>
  <text x="72" y="162" class="attr">orderLines: List&lt;OrderLine&gt;</text>
  <line x1="175" y1="176" x2="175" y2="226" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="60" y="230" width="230" height="132" rx="6" class="box"/>
  <text x="175.0" y="247" class="ster" text-anchor="middle">&lt;&lt;Value&gt;&gt;</text>
  <text x="175.0" y="266" class="cls" text-anchor="middle">OrderLine</text>
  <line x1="60" y1="274" x2="290" y2="274" class="sep"/>
  <text x="72" y="293" class="attr">productId: ProductId</text>
  <text x="72" y="312" class="attr">price: Money</text>
  <text x="72" y="331" class="attr">quantity: Quantity</text>
  <text x="72" y="350" class="attr">amounts: Money</text>
  <rect x="450" y="80" width="220" height="62" rx="6" class="dbbox"/>
  <text x="560.0" y="101" class="db" text-anchor="middle">purchase_order</text>
  <line x1="450" y1="110" x2="670" y2="110" class="sep"/>
  <text x="462" y="131" class="attr">order_number</text>
  <rect x="450" y="180" width="220" height="182" rx="6" class="dbbox"/>
  <text x="560.0" y="201" class="db" text-anchor="middle">order_line</text>
  <line x1="450" y1="210" x2="670" y2="210" class="sep"/>
  <rect x="454" y="214" width="212" height="22" rx="4" class="dbbox"/>
  <text x="462" y="231" class="attr">order_number</text>
  <rect x="454" y="238" width="212" height="22" rx="4" class="ok"/>
  <text x="462" y="255" class="attr">line_idx</text>
  <text x="462" y="279" class="attr">product_id</text>
  <text x="462" y="303" class="attr">price</text>
  <text x="462" y="327" class="attr">quantity</text>
  <text x="462" y="351" class="attr">amounts</text>
  <line x1="560" y1="142" x2="560" y2="176" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="440" y="236" class="code" text-anchor="end">joinColumns</text>
  <text x="440" y="260" class="gnote" text-anchor="end">@OrderColumn</text>
  <text x="30" y="396" class="sub">List의 인덱스는 OrderLine 프로퍼티가 아니라 @OrderColumn으로 지정한 line_idx 칼럼에 저장됩니다.</text>
</svg>
