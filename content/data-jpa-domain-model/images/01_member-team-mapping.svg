<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>Member.team이 MEMBER 테이블의 team_id 외래키를 관리하는 연관관계의 주인이고, mappedBy를 지정한 Team.members는 읽기만 하는 Member와 Team의 양방향 연관관계</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .thead { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .chip { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 13px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 12px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="470" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="450" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">Member와 Team — 양방향 연관관계</text>
  <rect x="30" y="66" width="220" height="136" rx="6" class="box"/>
  <rect x="30" y="66" width="220" height="28" rx="6" class="thead"/>
  <text x="140.0" y="85" class="mb" text-anchor="middle">Member</text>
  <text x="42" y="112.5" class="m">id</text>
  <text x="42" y="138.5" class="m">userName</text>
  <text x="42" y="164.5" class="m">age</text>
  <rect x="34" y="176.0" width="212" height="20" rx="4" class="ok"/>
  <text x="42" y="190.5" class="okm">team</text>
  <rect x="510" y="66" width="220" height="110" rx="6" class="box"/>
  <rect x="510" y="66" width="220" height="28" rx="6" class="thead"/>
  <text x="620.0" y="85" class="mb" text-anchor="middle">Team</text>
  <text x="522" y="112.5" class="m">id</text>
  <text x="522" y="138.5" class="m">name</text>
  <rect x="514" y="150.0" width="212" height="20" rx="4" class="wait"/>
  <text x="522" y="164.5" class="m">members</text>
  <rect x="30" y="214" width="220" height="32" rx="8" class="ok"/>
  <text x="140" y="235" class="okt" text-anchor="middle">연관관계의 주인 — 외래키 변경</text>
  <rect x="510" y="188" width="220" height="32" rx="8" class="wait"/>
  <text x="620" y="209" class="waitt" text-anchor="middle">mappedBy — 읽기만</text>
  <text x="30" y="290" class="code">@ManyToOne(fetch = LAZY)</text>
  <text x="30" y="308" class="code">@JoinColumn(name = "team_id")</text>
  <text x="730" y="262" class="code" text-anchor="end">@OneToMany</text>
  <text x="730" y="280" class="code" text-anchor="end">(mappedBy = "team")</text>
  <rect x="290" y="280" width="180" height="110" rx="6" class="box"/>
  <rect x="290" y="280" width="180" height="28" rx="6" class="thead"/>
  <text x="380.0" y="299" class="mb" text-anchor="middle">MEMBER</text>
  <text x="302" y="326.5" class="m">member_id (PK)</text>
  <text x="302" y="352.5" class="m">…</text>
  <rect x="294" y="364.0" width="172" height="20" rx="4" class="ok"/>
  <text x="302" y="378.5" class="okm">team_id (FK)</text>
  <rect x="560" y="332" width="170" height="84" rx="6" class="box"/>
  <rect x="560" y="332" width="170" height="28" rx="6" class="thead"/>
  <text x="645.0" y="351" class="mb" text-anchor="middle">TEAM</text>
  <text x="572" y="378.5" class="m">team_id (PK)</text>
  <text x="572" y="404.5" class="m">…</text>
  <line x1="252" y1="187.5" x2="288" y2="370" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="508" y1="161.5" x2="476" y2="362" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <line x1="472" y1="374" x2="556" y2="374" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="30" y="440" class="foot">team_id 값을 바꾸는 것은 Member.team이고, Team.members는 조회에만 사용됩니다.</text>
</svg>
