<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>재고 서비스를 늦추고 멈춘 동안의 측정 순서(SagaMeasurement) — 재고 20개 상품에 주문을 한 건씩 차례로 보냄. 보통 10건, 재고 서비스가 답을 1.5초 늦게 주는 동안 10건, 재고 서비스가 멈춘 동안(중계 끊음 + 재고 명령 읽기 멈춤) 10건과 승인된 결제 5건 전액 취소, 그다음 재고 서비스를 되돌리고 20초까지 기다림. 결제 서버 재고 시간 제한은 운영 값(연결 300ms·읽기 1s), 릴레이는 0.5초마다, 카드사는 바로 승인. 서비스를 시험 JVM 안에서 바로 불렀고 k6는 돌리지 않음. 방식마다 3번 돌리고 앞에 1건을 버렸으며 전체를 두 번 실행해 6번. 예약 응답 시간(ReservationLatencyMeasurement)은 따로, 재고가 넉넉한 상품에 하나씩 50건과 스레드 300개에서 한꺼번에 300건을 보내 결제 서버 쪽에서 쟀고 이 측정만 시간 제한을 10초로 늘림</title>
