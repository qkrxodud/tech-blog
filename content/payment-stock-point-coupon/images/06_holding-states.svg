  <text x="352" y="236" class="s2" style="fill:#1e3a8a">PG에 승인이 남았을 수</text>
  <text x="352" y="251" class="s2" style="fill:#1e3a8a">있어 쥔 채로 — 4장</text>
  <text x="352" y="266" class="s2" style="fill:#1e3a8a">보정이 승인·실패로 닫음</text>
  <text x="510" y="166" class="s2" style="fill:#4b5563">부분 취소는 그대로</text>
  <text x="510" y="182" class="s2" style="fill:#4b5563">(카드 금액만)</text>
  <text x="510" y="316" class="oks">남은 금액 0원</text>
  <text x="76" y="262" class="gs" text-anchor="end" style="font-size:11px">잡은 것</text>
  <text x="76" y="277" class="gs" text-anchor="end" style="font-size:11px">없음 —</text>
  <text x="76" y="292" class="gs" text-anchor="end" style="font-size:11px">안 돌려줌</text>
  <line x1="12" y1="466" x2="748" y2="466" stroke="#9ca3af" stroke-width="1"/>
  <line x1="26" y1="486" x2="58" y2="486" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="5 4"/>
  <text x="66" y="490" class="s2">만료 전이: 우리 쪽 결제를 <tspan class="m">EXPIRED</tspan>로 바꾸는 길이 코드에 없음(<tspan class="m">expire()</tspan>를 부르는 곳 없음) — 도메인 테스트로만 확인</text>
  <text x="26" y="512" class="s2" style="fill:#1f2937">이미 승인 실패로 닫힌 결제를 다시 보면 before도 돌려줄 상태라 돌려주지 않음 — 겹친 기록 중 상태를 바꾼 하나만 돌려줌</text>
  <text x="26" y="534" class="gs">PG 쪽 만료는 알림 처리·보정이 승인 실패로 닫으며 돌려줌. 인증 실패(<tspan class="m">AUTH_FAILED</tspan>)는 잡기 전이라 그리지 않음</text>

</svg>
