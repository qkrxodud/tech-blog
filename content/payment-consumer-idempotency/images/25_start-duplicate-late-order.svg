  <rect width="760" height="520" fill="#ffffff"/>
  <text x="24" y="30" class="h">출발 코드 주문 서비스 — 첫째·둘째 문제가 생기는 순서</text>
  <text x="24" y="52" class="gs" style="font-size:11px"><tspan class="m">OrderPaymentService.apply</tspan>: 받은 기록에 남김(고유 키 없음) → 주문을 결과대로 바꾸고 <tspan class="m">updated_at</tspan> = 지금</text>
  <rect x="24" y="66" width="190" height="44" rx="8" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <text x="36" y="84" class="t2" style="font-size:12px">Kafka</text>
  <text x="36" y="101" class="s" style="font-size:10.5px"><tspan class="m">payment-events</tspan></text>
