  <rect width="760" height="450" fill="#ffffff"/>
  <text x="24" y="28" class="h">결정 2 — 대사가 찾은 어긋남을 어디까지 고칠까</text>
  <text x="24" y="48" class="gs" style="font-size:11.5px"><tspan class="m">MismatchResolver.resolve</tspan> 구현 셋 · 어긋남 종류마다 무엇을 하는지</text>
  <rect x="199" y="58" width="178" height="62" rx="10" fill="#f9fafb" stroke="#16a34a" stroke-width="3"/>
  <text x="210" y="78" class="t2" style="font-size:12px">뒤처짐만 따라가기</text>
  <text x="210" y="94" class="gs" style="font-size:9.5px"><tspan class="m">FollowBehindResolver</tspan></text>
  <text x="210" y="111" class="oks" style="font-size:10px;font-weight:700">이 장에서 고름 · 운영</text>
  <rect x="383" y="58" width="178" height="62" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="394" y="78" class="t2" style="font-size:12px">기록만 하고 고치지 않음</text>
  <text x="394" y="94" class="gs" style="font-size:9.5px"><tspan class="m">RecordOnlyResolver</tspan></text>
  <text x="394" y="111" class="gs" style="font-size:10px">결정 1 커밋의 운영 코드와 같음</text>
  <rect x="567" y="58" width="178" height="62" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="578" y="78" class="t2" style="font-size:12px">모두 카드사에 맞춤</text>
  <text x="578" y="94" class="gs" style="font-size:9.5px"><tspan class="m">FollowAllResolver</tspan></text>
  <text x="578" y="111" class="gs" style="font-size:10px">비교</text>
  <text x="18" y="148" class="t2" style="font-size:11px"><tspan class="m">STATUS_BEHIND</tspan></text>
  <text x="18" y="165" class="gs" style="font-size:10.5px">우리가 뒤처짐</text>
  <rect x="202" y="130" width="172" height="44" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/><text x="288" y="156" class="s2" text-anchor="middle" style="fill:#15803d;font-size:10.5px;font-weight:700">따라감 → <tspan class="m">FOLLOWED</tspan></text>
  <rect x="386" y="130" width="172" height="44" rx="8" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/><text x="472" y="156" class="s2" text-anchor="middle" style="fill:#92400e;font-size:10px">운영자 확인 <tspan class="m">NEEDS_REVIEW</tspan></text>
  <rect x="570" y="130" width="172" height="44" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/><text x="656" y="156" class="s2" text-anchor="middle" style="fill:#15803d;font-size:10.5px;font-weight:700">따라감 → <tspan class="m">FOLLOWED</tspan></text>
  <text x="18" y="200" class="t2" style="font-size:11px"><tspan class="m">STATUS_MISMATCH</tspan></text>
  <text x="18" y="217" class="gs" style="font-size:10.5px">우리가 앞섬 등</text>
  <rect x="202" y="182" width="172" height="44" rx="8" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/><text x="288" y="208" class="s2" text-anchor="middle" style="fill:#92400e;font-size:10px">운영자 확인 <tspan class="m">NEEDS_REVIEW</tspan></text>
  <rect x="386" y="182" width="172" height="44" rx="8" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/><text x="472" y="208" class="s2" text-anchor="middle" style="fill:#92400e;font-size:10px">운영자 확인 <tspan class="m">NEEDS_REVIEW</tspan></text>
  <rect x="570" y="182" width="172" height="44" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/><text x="656" y="200.5" class="s2" text-anchor="middle" style="fill:#b91c1c;font-size:10px;font-weight:700">상태를 카드사 단계로 되돌림</text><text x="656" y="215.5" class="s2" text-anchor="middle" style="fill:#b91c1c;font-size:10px;font-weight:700">결제 줄 직접 고침 → <tspan class="m">FOLLOWED</tspan></text>
  <text x="18" y="252" class="t2" style="font-size:11px"><tspan class="m">AMOUNT_MISMATCH</tspan></text>
  <text x="18" y="269" class="gs" style="font-size:10.5px">승인 금액 다름</text>
  <rect x="202" y="234" width="172" height="44" rx="8" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/><text x="288" y="260" class="s2" text-anchor="middle" style="fill:#92400e;font-size:10px">운영자 확인 <tspan class="m">NEEDS_REVIEW</tspan></text>
  <rect x="386" y="234" width="172" height="44" rx="8" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/><text x="472" y="260" class="s2" text-anchor="middle" style="fill:#92400e;font-size:10px">운영자 확인 <tspan class="m">NEEDS_REVIEW</tspan></text>
  <rect x="570" y="234" width="172" height="44" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/><text x="656" y="252.5" class="s2" text-anchor="middle" style="fill:#b91c1c;font-size:10px;font-weight:700">우리 금액을 카드사 금액으로</text><text x="656" y="267.5" class="s2" text-anchor="middle" style="fill:#b91c1c;font-size:10px;font-weight:700">결제 줄 직접 고침 → <tspan class="m">FOLLOWED</tspan></text>
  <text x="18" y="304" class="t2" style="font-size:11px"><tspan class="m">OURS_ONLY</tspan></text>
  <text x="18" y="321" class="gs" style="font-size:10.5px">우리에게만</text>
  <rect x="202" y="286" width="172" height="44" rx="8" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/><text x="288" y="312" class="s2" text-anchor="middle" style="fill:#92400e;font-size:10px">운영자 확인 <tspan class="m">NEEDS_REVIEW</tspan></text>
  <rect x="386" y="286" width="172" height="44" rx="8" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/><text x="472" y="312" class="s2" text-anchor="middle" style="fill:#92400e;font-size:10px">운영자 확인 <tspan class="m">NEEDS_REVIEW</tspan></text>
  <rect x="570" y="286" width="172" height="44" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/><text x="656" y="304.5" class="s2" text-anchor="middle" style="fill:#b91c1c;font-size:10px;font-weight:700">승인 실패로 바꿈</text><text x="656" y="319.5" class="s2" text-anchor="middle" style="fill:#b91c1c;font-size:10px;font-weight:700">결제 줄 직접 고침 → <tspan class="m">FOLLOWED</tspan></text>
  <text x="18" y="356" class="t2" style="font-size:11px"><tspan class="m">PG_ONLY</tspan></text>
  <text x="18" y="373" class="gs" style="font-size:10.5px">카드사에만</text>
  <rect x="202" y="338" width="172" height="44" rx="8" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/><text x="288" y="364" class="s2" text-anchor="middle" style="fill:#92400e;font-size:10px">운영자 확인 <tspan class="m">NEEDS_REVIEW</tspan></text>
  <rect x="386" y="338" width="172" height="44" rx="8" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/><text x="472" y="364" class="s2" text-anchor="middle" style="fill:#92400e;font-size:10px">운영자 확인 <tspan class="m">NEEDS_REVIEW</tspan></text>
  <rect x="570" y="338" width="172" height="44" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/><text x="656" y="356.5" class="s2" text-anchor="middle" style="fill:#b91c1c;font-size:10px;font-weight:700">승인 결제로 새로 만듦</text><text x="656" y="371.5" class="s2" text-anchor="middle" style="fill:#b91c1c;font-size:10px;font-weight:700">결제 줄 직접 고침 → <tspan class="m">FOLLOWED</tspan></text>
  <line x1="14" y1="392" x2="748" y2="392" stroke="#9ca3af" stroke-width="1"/>
  <text x="18" y="414" class="gs" style="font-size:10.5px">따라가기는 거래 내역의 값을 그대로 쓰지 않고 카드사에 결제를 다시 조회해 6장 <tspan class="m">PaymentWebhookRecorder.follow</tspan>로 맞춤(계기 <tspan class="m">DAILY_RECONCILIATION</tspan>)</text><text x="18" y="434" class="gs" style="font-size:10.5px">모두 맞춤은 허용 전이 표로 할 수 없는 변경이라 결제 줄을 직접 고침 — 빨간 칸은 계약이 “고치지 않는다”, “운영자 확인으로 남는다”고 본 동작</text>
