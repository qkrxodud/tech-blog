<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>루프 412에서 double 사용으로 수수료 오차가 생기자 사람이 MEMORY 폴더에 feedback_no_double.md를 기록하고, 다음 루프부터 Claude가 이 파일을 읽어 BigDecimal을 사용하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="320" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">규칙 위반 기록 — 피드백 파일이 다음 루프에 반영됨</text>
  <text x="220" y="68" class="step" text-anchor="middle">루프 412</text>
  <text x="360" y="68" class="step" text-anchor="middle">발견 즉시</text>
  <text x="500" y="68" class="step" text-anchor="middle">다음 루프</text>
  <text x="640" y="68" class="step" text-anchor="middle">이후</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">Claude</text>
  <text x="30" y="126" class="sub">구현</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="88" width="116" height="48" rx="8" class="bad"/>
  <text x="220" y="108" class="badt" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">double</tspan> 계산</text>
  <text x="220" y="127" class="val" text-anchor="middle">수수료 오차</text>
  <rect x="442" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="500" y="108" class="db" text-anchor="middle">MEMORY 읽기</text>
  <text x="500" y="127" class="val" text-anchor="middle">피드백 확인</text>
  <rect x="582" y="88" width="116" height="48" rx="8" class="ok"/>
  <text x="640" y="108" class="okc" text-anchor="middle">BigDecimal</text>
  <text x="640" y="127" class="val" text-anchor="middle">같은 실수 없음</text>
  <line x1="560" y1="112" x2="578" y2="112" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="168" class="lane">사람</text>
  <text x="30" y="186" class="sub">검토</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="302" y="148" width="116" height="48" rx="8" class="box"/>
  <text x="360" y="168" class="db" text-anchor="middle">위반 발견</text>
  <text x="360" y="187" class="val" text-anchor="middle">피드백 기록</text>
  <line x1="250" y1="136" x2="310" y2="147" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="30" y="239" class="db">MEMORY/</text>
  <rect x="300" y="216" width="410" height="36" rx="6" class="dbbox"/>
  <text x="505" y="239" class="code" text-anchor="middle">feedback_no_double.md</text>
  <line x1="360" y1="196" x2="360" y2="215" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="500" y1="216" x2="500" y2="137" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="150" y="282" class="sub">double 대신 BigDecimal을 사용한다.</text>
  <text x="150" y="302" class="sub">Why: 루프 412에서 double로 계산된 수수료 금액에 부동소수점 오차 발생.</text>
  <text x="150" y="320" class="sub">How to apply: 수치 계산이 필요한 모든 곳에 BigDecimal 사용.</text>
</svg>
