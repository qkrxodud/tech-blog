  <rect x="609" y="228" width="88" height="24" rx="6" class="box"/>
  <text x="653" y="245" class="monob" text-anchor="middle">r1(K)</text>
  <rect x="609" y="258" width="88" height="24" rx="6" class="box"/>
  <text x="653" y="275" class="monob" text-anchor="middle">w1(K)</text>
  <rect x="609" y="288" width="88" height="24" rx="6" class="box"/>
  <text x="653" y="305" class="monob" text-anchor="middle">r1(H)</text>
  <rect x="609" y="318" width="88" height="24" rx="6" class="box"/>
  <text x="653" y="335" class="monob" text-anchor="middle">w1(H)</text>
  <rect x="609" y="348" width="88" height="24" rx="6" class="box"/>
  <text x="653" y="365" class="monob" text-anchor="middle">c1</text>
  <text x="30" y="404" class="t">H에 대한 충돌 연산의 순서</text>
  <text x="408" y="404" class="t">H에 대한 충돌 연산의 순서</text>
  <text x="30" y="430" class="mono">r2(H) → w1(H)</text>
  <text x="170" y="430" class="gnote">같음</text>
  <text x="30" y="452" class="mono">w2(H) → r1(H)</text>
  <text x="170" y="452" class="gnote">같음</text>
  <text x="30" y="474" class="mono">w2(H) → w1(H)</text>
  <text x="170" y="474" class="gnote">같음</text>
  <text x="408" y="430" class="mono">r1(H) → w2(H)</text>
  <text x="548" y="430" class="note">sched.2는 반대</text>
  <text x="408" y="452" class="mono">r2(H) → w1(H)</text>
  <text x="548" y="452" class="gnote">같음</text>
  <text x="408" y="474" class="mono">w2(H) → w1(H)</text>
  <text x="548" y="474" class="gnote">같음</text>
  <text x="352" y="42" class="sub" text-anchor="end">흰색 T1 · 회색 T2</text>
  <text x="730" y="42" class="sub" text-anchor="end">흰색 T1 · 회색 T2</text>
