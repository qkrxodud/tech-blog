  <circle cx="440" cy="386" r="9" fill="#111827"/><text x="440" y="390" class="num" text-anchor="middle">6</text>
  <circle cx="626" cy="374" r="8" fill="#ef4444"/><text x="626" y="378" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <line x1="674" y1="398" x2="442" y2="398" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#agy)"/>
  <text x="182" y="432" class="lbl" text-anchor="middle" style="fill: #c2410c"><tspan class="m">GET …/orders/{orderId}</tspan></text>
