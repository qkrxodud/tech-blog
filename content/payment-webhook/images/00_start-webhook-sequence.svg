  <text x="652" y="108" class="s">결제</text>
  <text x="238" y="142" class="lbl" text-anchor="middle"><tspan class="m">POST /api/v1/webhooks/tosspayments</tspan></text>
  <line x1="99" y1="150" x2="378" y2="150" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <circle cx="90" cy="150" r="9" fill="#111827"/><text x="90" y="154" class="num" text-anchor="middle">1</text>
  <text x="238" y="166" class="lbl" text-anchor="middle"><tspan class="m">{eventType, createdAt, data}</tspan></text>
  <rect x="396" y="184" width="216" height="36" rx="8" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.4"/>
  <rect x="396" y="184" width="216" height="36" rx="8" fill="none" stroke="#d97706" stroke-width="3" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0925;0.1025;0.1525;0.1625;1"/></rect>
  <text x="504" y="198" class="lbl" text-anchor="middle" style="fill: #1f2937"><tspan class="m">PAYMENT_STATUS_CHANGED</tspan>인가</text>
  <text x="504" y="214" class="lbl" text-anchor="middle" style="fill: #1f2937">결제 상태 알림일 때만 처리</text>
  <circle cx="380" cy="202" r="9" fill="#111827"/><text x="380" y="206" class="num" text-anchor="middle">2</text>
  <circle cx="612" cy="186" r="8" fill="#ef4444"/><text x="612" y="190" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <text x="525" y="240" class="lbl" text-anchor="middle"><tspan class="m">findByOrderId(orderId)</tspan></text>
  <line x1="389" y1="248" x2="668" y2="248" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <circle cx="380" cy="248" r="9" fill="#111827"/><text x="380" y="252" class="num" text-anchor="middle">3</text>
  <circle cx="626" cy="236" r="8" fill="#ef4444"/><text x="626" y="240" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
