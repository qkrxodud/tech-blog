<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>트랜잭션 메서드에서 RuntimeException과 Error가 발생하면 롤백, Checked Exception은 기본적으로 커밋, rollbackFor에 지정한 예외는 롤백되는 갈래</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .cellt { font-size: 14px; font-weight: 700; fill: #374151; }
    .colh { font-size: 13px; font-weight: 700; fill: #4b5563; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="320" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">롤백 규칙 — 예외 종류에 따라 트랜잭션이 끝나는 방식</text>
  <text x="730" y="42" class="code" text-anchor="end">rollbackFor</text>
  <text x="110" y="76" class="colh" text-anchor="middle">발생</text>
  <text x="375" y="76" class="colh" text-anchor="middle">예외 종류</text>
  <text x="640" y="76" class="colh" text-anchor="middle">결과</text>
  <rect x="30" y="160" width="160" height="56" rx="8" class="box"/>
  <text x="110" y="183" class="cellt" text-anchor="middle">트랜잭션 메서드에서</text>
  <text x="110" y="203" class="cellt" text-anchor="middle">예외 발생</text>
  <line x1="190" y1="188" x2="248" y2="116" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="250" y="92" width="250" height="48" rx="8" class="box"/>
  <text x="375" y="113" class="cellt" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">RuntimeException</tspan>, <tspan font-family="Menlo, Consolas, monospace">Error</tspan></text>
  <text x="375" y="132" class="val" text-anchor="middle">기본 롤백 대상</text>
  <line x1="500" y1="116" x2="558" y2="116" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="560" y="92" width="160" height="48" rx="8" class="ok"/>
  <text x="640" y="122" class="okt" text-anchor="middle">롤백</text>
  <line x1="190" y1="188" x2="248" y2="188" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="250" y="164" width="250" height="48" rx="8" class="box"/>
  <text x="375" y="185" class="cellt" text-anchor="middle">Checked Exception</text>
  <text x="375" y="204" class="val" text-anchor="middle">rollbackFor 지정 없음 (IOException 등)</text>
  <line x1="500" y1="188" x2="558" y2="188" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="560" y="164" width="160" height="48" rx="8" class="bad"/>
  <text x="640" y="185" class="badt" text-anchor="middle">커밋</text>
  <text x="640" y="204" class="note" text-anchor="middle">롤백되지 않음</text>
  <line x1="190" y1="188" x2="248" y2="260" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="250" y="236" width="250" height="48" rx="8" class="box"/>
  <text x="375" y="257" class="cellt" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">rollbackFor</tspan>에 지정한 예외</text>
  <text x="375" y="276" class="val" text-anchor="middle">Checked Exception도 포함</text>
  <line x1="500" y1="260" x2="558" y2="260" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="560" y="236" width="160" height="48" rx="8" class="ok"/>
  <text x="640" y="266" class="okt" text-anchor="middle">롤백</text>
  <text x="30" y="314" class="sub">Checked Exception은 기본적으로 롤백 대상이 아니어서, 롤백하려면 rollbackFor에 지정해야 합니다.</text>

</svg>
