<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 482" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>점층적 생성자는 매개변수가 하나씩 늘어난 생성자를 this로 이어 호출하고, 빌더는 필수 값으로 Builder를 만든 뒤 선택 값을 메서드로 채우고 build로 Product를 생성하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .pool { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .life { stroke: #c4c8ce; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="482" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="196" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">점층적 생성자 — 매개변수를 하나씩 늘린 생성자를 this()로 잇는다</text>
  <rect x="30" y="66" width="150" height="54" rx="8" class="box"/>
  <text x="105" y="88" class="t" text-anchor="middle">매개변수 1개</text>
  <text x="105" y="108" class="code" text-anchor="middle">name</text>
  <rect x="208" y="66" width="150" height="54" rx="8" class="box"/>
  <text x="283" y="88" class="t" text-anchor="middle">매개변수 2개</text>
  <text x="283" y="108" class="code" text-anchor="middle">+ description</text>
  <rect x="386" y="66" width="150" height="54" rx="8" class="box"/>
  <text x="461" y="88" class="t" text-anchor="middle">매개변수 3개</text>
  <text x="461" y="108" class="code" text-anchor="middle">+ price</text>
  <rect x="564" y="66" width="150" height="54" rx="8" class="bad"/>
  <text x="639" y="88" class="badt" text-anchor="middle">매개변수 4개</text>
  <text x="639" y="108" class="code" text-anchor="middle">+ quantity</text>
  <line x1="562" y1="93" x2="540" y2="93" class="flow" marker-end="url(#ag)"/>
  <line x1="384" y1="93" x2="362" y2="93" class="flow" marker-end="url(#ag)"/>
  <line x1="206" y1="93" x2="184" y2="93" class="flow" marker-end="url(#ag)"/>
  <text x="372" y="146" class="s" text-anchor="middle">각 생성자는 매개변수가 하나 적은 생성자를 <tspan font-family="Menlo, Consolas, monospace">this(...)</tspan>로 호출한 뒤 자기 필드만 채웁니다.</text>
  <text x="30" y="178" class="note">원치 않는 매개변수에도 값을 지정해야 하고, 매개변수가 많아지면 호출 코드를 작성하거나 읽기 어렵습니다.</text>

  <rect x="10" y="222" width="740" height="250" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="254" class="h">빌더 — 필요한 값만 메서드로 채우고 build()로 생성한다</text>
  <rect x="26" y="278" width="134" height="54" rx="8" class="box"/>
  <text x="93" y="300" class="opm" text-anchor="middle">new Builder</text>
  <text x="93" y="320" class="code" text-anchor="middle" style="font-size:11.5px">"Sample Product"</text>
  <rect x="180" y="278" width="130" height="54" rx="8" class="box"/>
  <text x="245" y="300" class="opm" text-anchor="middle">.description</text>
  <text x="245" y="320" class="s" text-anchor="middle">선택 값</text>
  <rect x="330" y="278" width="112" height="54" rx="8" class="box"/>
  <text x="386" y="300" class="opm" text-anchor="middle">.price</text>
  <text x="386" y="320" class="code" text-anchor="middle">19.99</text>
  <rect x="462" y="278" width="118" height="54" rx="8" class="box"/>
  <text x="521" y="300" class="opm" text-anchor="middle">.quantity</text>
  <text x="521" y="320" class="code" text-anchor="middle">100</text>
  <rect x="600" y="278" width="130" height="54" rx="8" class="ok"/>
  <text x="665" y="300" class="okm" text-anchor="middle">.build()</text>
  <text x="665" y="320" class="s" text-anchor="middle">Product 생성</text>
  <line x1="162" y1="305" x2="177" y2="305" class="flow" marker-end="url(#ag)"/>
  <line x1="312" y1="305" x2="327" y2="305" class="flow" marker-end="url(#ag)"/>
  <line x1="444" y1="305" x2="459" y2="305" class="flow" marker-end="url(#ag)"/>
  <line x1="582" y1="305" x2="597" y2="305" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="93" y="350" class="s" text-anchor="middle">필수 값</text>
  <text x="386" y="350" class="s" text-anchor="middle">각 메서드는 <tspan font-family="Menlo, Consolas, monospace">this</tspan>(Builder)를 반환</text>
  <line x1="665" y1="334" x2="665" y2="372" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="540" y="376" width="190" height="44" rx="8" class="ok"/>
  <text x="635" y="403" class="okm" text-anchor="middle">new Product(this)</text>
  <text x="30" y="398" class="foot">Product의 생성자는 <tspan font-family="Menlo, Consolas, monospace">private</tspan>이고,</text>
  <text x="30" y="418" class="foot">Builder에 모은 값을 받아 필드를 채웁니다.</text>
  <text x="30" y="452" class="gnote">점층적 생성자의 안정성과 자바빈즈 패턴의 가독성을 겸비한 방식입니다.</text>
</svg>
