<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 556" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>minor GC 전에는 eden과 survivor1에 객체가 있고, minor GC 후에는 live 객체가 survivor0으로 copy되어 age가 1 늘고, age가 임계치에 도달한 P는 old generation으로 promotion되어 1211이 remembered set에 추가되는 모습</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #374151; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ops { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .tiny { font-size: 11px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #e5e7eb; stroke: #6b7280; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .region { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12px; fill: #9ca3af; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .ad { stroke: #9ca3af; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="556" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="228" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">minor GC 전 — eden에 새 객체를 할당할 공간이 부족함</text>
  <rect x="150" y="62" width="172" height="96" rx="8" class="region"/>
  <text x="160" y="82" class="ops">eden</text>
  <rect x="332" y="62" width="140" height="96" rx="8" class="region"/>
  <text x="342" y="82" class="ops">survivor0</text>
  <rect x="482" y="62" width="108" height="96" rx="8" class="region"/>
  <text x="492" y="82" class="ops">survivor1</text>
  <rect x="600" y="62" width="130" height="96" rx="8" class="dbbox"/>
  <text x="610" y="82" class="ops">old</text>
  <rect x="24" y="62" width="112" height="34" rx="8" class="dbbox"/>
  <text x="80" y="84" class="ops" text-anchor="middle">GC root</text>
  <rect x="24" y="106" width="112" height="52" rx="8" class="hold"/>
  <text x="80" y="126" class="tiny" text-anchor="middle">remembered set</text>
  <text x="80" y="146" class="opm" text-anchor="middle">1121</text>
  <rect x="158" y="96" width="36" height="46" rx="8" class="ok"/>
  <text x="176.0" y="116.0" class="okt" text-anchor="middle">a</text>
  <text x="176.0" y="132.0" class="tiny" text-anchor="middle">age 0</text>
  <rect x="198" y="96" width="36" height="46" rx="8" class="bad"/>
  <text x="216.0" y="124.0" class="badt" text-anchor="middle">×</text>
  <rect x="238" y="96" width="36" height="46" rx="8" class="ok"/>
  <text x="256.0" y="116.0" class="okt" text-anchor="middle">b</text>
  <text x="256.0" y="132.0" class="tiny" text-anchor="middle">age 0</text>
  <rect x="278" y="96" width="36" height="46" rx="8" class="bad"/>
  <text x="296.0" y="124.0" class="badt" text-anchor="middle">×</text>
  <rect x="340" y="96" width="124" height="46" rx="6" class="wait"/>
  <text x="402" y="124" class="waitt" text-anchor="middle">빈 공간</text>
  <rect x="488" y="96" width="46" height="46" rx="8" class="ok"/>
  <text x="511.0" y="116.0" class="okt" text-anchor="middle">c</text>
  <text x="511.0" y="132.0" class="tiny" text-anchor="middle">age 1</text>
  <rect x="538" y="96" width="46" height="46" rx="8" class="ok"/>
  <text x="561.0" y="116.0" class="okt" text-anchor="middle">P</text>
  <text x="561.0" y="132.0" class="tiny" text-anchor="middle">age N</text>
  <rect x="606" y="96" width="56" height="46" rx="8" class="hold"/>
  <text x="634.0" y="124.0" class="opm" text-anchor="middle">1121</text>
  <rect x="668" y="96" width="56" height="46" rx="8" class="hold"/>
  <text x="696.0" y="124.0" class="op" text-anchor="middle">old</text>
  <line x1="606" y1="119" x2="586" y2="119" class="al" marker-end="url(#ar)"/>
  <text x="30" y="192" class="sub">eden과 survivor1의 객체 중 live는 a, b, c, P — 1121은 young 객체 P를 참조하므로 remembered set에 있습니다</text>
  <text x="30" y="214" class="sub">N은 다음 minor GC에서 age가 임계치에 도달하는 나이를 뜻합니다</text>
  <rect x="10" y="254" width="740" height="292" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="286" class="h">minor GC 후 — live만 survivor0으로 copy, P는 old로 promotion</text>
  <rect x="150" y="306" width="172" height="96" rx="8" class="region"/>
  <text x="160" y="326" class="ops">eden</text>
  <rect x="332" y="306" width="140" height="96" rx="8" class="region"/>
  <text x="342" y="326" class="ops">survivor0</text>
  <rect x="482" y="306" width="108" height="96" rx="8" class="region"/>
  <text x="492" y="326" class="ops">survivor1</text>
  <rect x="600" y="306" width="130" height="96" rx="8" class="dbbox"/>
  <text x="610" y="326" class="ops">old</text>
  <rect x="24" y="306" width="112" height="34" rx="8" class="dbbox"/>
  <text x="80" y="328" class="ops" text-anchor="middle">GC root</text>
  <rect x="24" y="350" width="112" height="52" rx="8" class="hold"/>
  <text x="80" y="370" class="tiny" text-anchor="middle">remembered set</text>
  <text x="80" y="390" class="opm" text-anchor="middle">1121, 1211</text>
  <rect x="158" y="340" width="156" height="46" rx="6" class="wait"/>
  <text x="236" y="368" class="waitt" text-anchor="middle">빈 공간</text>
  <rect x="338" y="340" width="40" height="46" rx="8" class="ok"/>
  <text x="358.0" y="360.0" class="okt" text-anchor="middle">a</text>
  <text x="358.0" y="376.0" class="tiny" text-anchor="middle">age 1</text>
  <rect x="382" y="340" width="40" height="46" rx="8" class="ok"/>
  <text x="402.0" y="360.0" class="okt" text-anchor="middle">b</text>
  <text x="402.0" y="376.0" class="tiny" text-anchor="middle">age 1</text>
  <rect x="426" y="340" width="40" height="46" rx="8" class="ok"/>
  <text x="446.0" y="360.0" class="okt" text-anchor="middle">c</text>
  <text x="446.0" y="376.0" class="tiny" text-anchor="middle">age 2</text>
  <rect x="488" y="340" width="96" height="46" rx="6" class="wait"/>
  <text x="536" y="368" class="waitt" text-anchor="middle">빈 공간</text>
  <rect x="604" y="340" width="38" height="46" rx="8" class="hold"/>
  <text x="623.0" y="368.0" class="tiny" text-anchor="middle">1121</text>
  <rect x="646" y="340" width="38" height="46" rx="8" class="hold"/>
  <text x="665.0" y="368.0" class="tiny" text-anchor="middle">old</text>
  <rect x="688" y="340" width="38" height="46" rx="8" class="ok"/>
  <text x="707.0" y="360.0" class="okt" text-anchor="middle">P</text>
  <text x="707.0" y="376.0" class="tiny" text-anchor="middle">1211</text>
  <path d="M707,386 C707,426 446,426 446,388" class="al" marker-end="url(#ar)"/>
  <text x="576" y="436" class="tiny" text-anchor="middle">1211이 c를 참조</text>
  <text x="30" y="466" class="gnote">a, b, c는 age가 1씩 증가(aging) — P는 age가 임계치에 도달해 old generation으로 promotion되어 1211이 됨</text>
  <text x="30" y="490" class="sub">1211이 young 객체 c를 참조하므로 remembered set에 추가됩니다</text>
  <text x="30" y="514" class="note">1121이 참조하던 P는 이제 old 객체이므로, 1121은 다음 minor GC 때 remembered set에서 제거됩니다</text>
</svg>
