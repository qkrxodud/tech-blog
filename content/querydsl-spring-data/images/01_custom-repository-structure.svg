<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>MemberRepository가 JpaRepository와 MemberRepositoryCustom을 함께 상속하고, MemberRepositoryImpl이 MemberRepositoryCustom을 구현해 JPAQueryFactory로 searchByWhere를 실행하며, memberRepository.searchByWhere 호출이 Impl의 Querydsl 코드로 이어지는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .msg { font-size: 11.5px; fill: #374151; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .cont { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="380" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="360" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">사용자 정의 리포지토리 — 인터페이스 셋과 구현 클래스</text>
  <text x="730" y="42" class="code" text-anchor="end">MemberRepositoryCustom</text>
  <rect x="40" y="66" width="270" height="52" rx="8" class="hold"/>
  <text x="175.0" y="87.5" class="opm" text-anchor="middle">JpaRepository&lt;Member, Long&gt;</text>
  <text x="175.0" y="106.5" class="sub" text-anchor="middle">스프링 데이터 JPA 제공</text>
  <rect x="450" y="66" width="270" height="52" rx="8" class="hold"/>
  <text x="585.0" y="87.5" class="opm" text-anchor="middle">MemberRepositoryCustom</text>
  <text x="585.0" y="106.5" class="sub" text-anchor="middle">1. searchByWhere 선언</text>
  <rect x="40" y="176" width="270" height="52" rx="8" class="box"/>
  <text x="175.0" y="197.5" class="opm" text-anchor="middle">MemberRepository</text>
  <text x="175.0" y="216.5" class="sub" text-anchor="middle">3. 두 인터페이스를 상속</text>
  <rect x="450" y="176" width="270" height="52" rx="8" class="ok"/>
  <text x="585.0" y="197.5" class="okm" text-anchor="middle">MemberRepositoryImpl</text>
  <text x="585.0" y="216.5" class="gnote" text-anchor="middle">2. JPAQueryFactory로 구현</text>
  <line x1="175" y1="176" x2="175" y2="122" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="184" y="154" class="sub" text-anchor="start">extends</text>
  <line x1="310" y1="184" x2="446" y2="112" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="392" y="172" class="sub" text-anchor="start">extends</text>
  <line x1="585" y1="176" x2="585" y2="122" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="594" y="154" class="sub" text-anchor="start">implements</text>
  <rect x="40" y="276" width="270" height="56" rx="8" class="box"/>
  <text x="175.0" y="299.5" class="m" text-anchor="middle">memberRepository</text>
  <text x="175.0" y="318.5" class="m" text-anchor="middle">.searchByWhere(condition)</text>
  <line x1="175" y1="276" x2="175" y2="232" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="310" y1="304" x2="560" y2="232" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#agr)"/>
  <text x="450" y="292" class="gnote" text-anchor="start">Impl의 Querydsl 코드가 실행됨</text>
  <text x="30" y="356" class="foot" text-anchor="start">구현 클래스 이름은 리포지토리 인터페이스 이름 + Impl 규칙을 따릅니다</text>
</svg>
