<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 2 — 재고·쿠폰·포인트를 언제 잡을까. 같은 세 입력(가: 재고 0개 상품의 주문, 나: 재고 1개를 잡은 첫 주문이 PG 답을 기다리는 동안 온 같은 상품의 둘째 주문, 다: 준비만 하고 승인을 요청하지 않은 주문)을 세 구현에 넣었다. 인증 때 잡기(이 장에서 고름)는 가에 409 OUT_OF_STOCK으로 PG 요청 0, 나에 둘째를 바로 OUT_OF_STOCK, 다에 재고 3 그대로로 실패 0개. 승인 뒤 잡기(HoldAfterApprovalConfirmService)는 가에 PG 승인 1건 뒤 전액 취소 1건이 남고 답은 같은 OUT_OF_STOCK, 나에 둘째도 PG까지 가서 3초 안에 답을 받지 못해 실패 3개. 준비 때 잡기(HoldAtPrepareService)는 다에서 재고가 3에서 2로 줄어 실패 1개. 인증 때 잡는 비용은 PG 답을 기다리는 동안 재고가 묶이고 거절·결과 모름·만료 때 되돌려야 한다는 것(결정 4)</title>
