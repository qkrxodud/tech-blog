  <rect width="760" height="470" fill="#ffffff"/>
  <text x="24" y="30" class="h">측정 순서 — <tspan class="m">./gradlew sagaMeasurement</tspan></text>
  <text x="24" y="52" class="gs">서비스를 시험 JVM 안에서 바로 부름(k6 아님) · 방식마다 3번 × 전체 두 번 실행 = 6번 · 앞에 1건 버림</text>
