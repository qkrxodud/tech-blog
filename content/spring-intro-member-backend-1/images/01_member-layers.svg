<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>컨트롤러, 서비스, 리포지토리, DB 순서의 계층과 도메인 객체, 그리고 저장소가 정해지지 않아 MemberRepository 인터페이스를 두고 MemoryMemberRepository를 먼저 쓰는 구성</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .mxs { font-size: 11px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .chip { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .gscope { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="400" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">회원 관리 예제 — 웹 애플리케이션 계층 구조</text>
  <rect x="30" y="66" width="160" height="56" rx="8" class="box"/>
  <text x="110.0" y="90.0" class="t" text-anchor="middle">컨트롤러</text>
  <text x="110.0" y="109.0" class="val" text-anchor="middle">웹 MVC의 컨트롤러</text>
  <line x1="192" y1="94" x2="207" y2="94" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="210" y="66" width="160" height="56" rx="8" class="box"/>
  <text x="290.0" y="90.0" class="t" text-anchor="middle">서비스</text>
  <text x="290.0" y="109.0" class="val" text-anchor="middle">핵심 비즈니스 로직</text>
  <line x1="372" y1="94" x2="387" y2="94" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="390" y="66" width="160" height="56" rx="8" class="box"/>
  <text x="470.0" y="90.0" class="t" text-anchor="middle">리포지토리</text>
  <text x="470.0" y="109.0" class="val" text-anchor="middle">DB 접근, 도메인 저장</text>
  <line x1="552" y1="94" x2="567" y2="94" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="570" y="66" width="160" height="56" rx="8" class="chip"/>
  <text x="650.0" y="90.0" class="t" text-anchor="middle">DB</text>
  <text x="650.0" y="109.0" class="val" text-anchor="middle">데이터 저장소</text>
  <rect x="30" y="140" width="700" height="48" rx="8" class="hold"/>
  <text x="380" y="160" class="t" text-anchor="middle">도메인</text>
  <text x="380" y="178" class="val" text-anchor="middle">비즈니스 도메인 객체 — 회원, 주문, 쿠폰 등 (주로 DB에 저장하고 관리)</text>
  <line x1="30" y1="210" x2="730" y2="210" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="30" y="238" class="t">이번 예제의 리포지토리 — 저장소가 정해지지 않아 인터페이스로 구현</text>
  <rect x="250" y="256" width="260" height="48" rx="8" class="box"/>
  <text x="380.0" y="276.0" class="mb" text-anchor="middle">MemberRepository</text>
  <text x="380.0" y="295.0" class="val" text-anchor="middle">인터페이스</text>
  <rect x="90" y="334" width="260" height="48" rx="8" class="ok"/>
  <text x="220.0" y="354.0" class="okm" text-anchor="middle">MemoryMemberRepository</text>
  <text x="220.0" y="373.0" class="val" text-anchor="middle">지금 사용하는 메모리 구현체</text>
  <rect x="410" y="334" width="260" height="48" rx="8" class="wait"/>
  <text x="540" y="354" class="waitt" text-anchor="middle">DB 구현체</text>
  <text x="540" y="373" class="waitt" text-anchor="middle">저장소가 선정되면 변경</text>
  <line x1="220" y1="333" x2="330" y2="305" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="540" y1="333" x2="430" y2="305" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="232" y="318" class="code" text-anchor="end">implements</text>
</svg>
