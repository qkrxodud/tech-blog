<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 486" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>계약 테스트가 결제를 다루는 순서 — 구현마다 newPayment()로 READY 결제를 만들고, paymentIn(from)이 PATH에 적힌 행위를 차례로 perform해 출발 상태를 만든 뒤 status()로 확인하고, 시험할 행위를 perform해 허용 표에 있으면 다음 상태로 바뀌었는지, 없으면 InvalidPaymentTransitionException이 나고 상태가 출발 상태 그대로인지 봄. perform은 허용 전이 표와 State 패턴에서는 capture() 같은 메서드 호출로, Spring Statemachine에서는 이벤트 전송으로 넘어가며, 구현마다 개별 테스트 7개와 조합 63개로 70개</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #4b5563; }
