  <rect width="760" height="486" fill="#ffffff"/>
  <text x="24" y="30" class="h">계약 테스트 — 테스트가 결제를 다루는 순서</text>
  <text x="24" y="52" class="gs">예: <tspan class="m">CAPTURED</tspan>에서 출발하면 <tspan class="m">AUTHENTICATE</tspan> → <tspan class="m">APPROVE</tspan> → <tspan class="m">CAPTURE</tspan>를 차례로 호출해 만듦</text>
  <rect x="24" y="70" width="712" height="362" rx="16" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="36" y="80" width="300" height="24" rx="6" fill="#5b7194"/>
  <text x="186.0" y="96.5" class="tab" text-anchor="middle"><tspan class="m">PaymentTransitionContract</tspan> — 추상 클래스</text>
