<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 462" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>엔티티 타입은 값이 바뀌어도 식별자로 같은 회원을 추적하고, 값 타입은 100을 200으로 바꾸면 다른 값으로 대체되며, 값 타입은 기본값 타입, 임베디드 타입, 컬렉션 값 타입으로 나뉘는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .msg { font-size: 12px; fill: #374151; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .cont { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .life { stroke: #c4c8ce; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="760" height="462" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="200" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">엔티티 타입과 값 타입 — 식별자로 추적할 수 있는가</text>
  <text x="30" y="74" class="t">엔티티 타입</text>
  <text x="118" y="74" class="code">@Entity</text>
  <rect x="30" y="90" width="140" height="56" rx="8" class="hold"/>
  <text x="100" y="114" class="ts" text-anchor="middle">회원 <tspan font-family="Menlo, Consolas, monospace">id = 1</tspan></text>
  <text x="100" y="133" class="val" text-anchor="middle">나이 변경 전</text>
  <line x1="172" y1="118" x2="212" y2="118" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="215" y="90" width="140" height="56" rx="8" class="ok"/>
  <text x="285" y="114" class="okt" text-anchor="middle">회원 <tspan font-family="Menlo, Consolas, monospace">id = 1</tspan></text>
  <text x="285" y="133" class="val" text-anchor="middle">나이 변경 후</text>
  <text x="30" y="176" class="gnote">식별자가 같으므로 같은 회원으로 추적합니다.</text>
  <line x1="380" y1="64" x2="380" y2="196" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="400" y="74" class="t">값 타입</text>
  <text x="462" y="74" class="code">int, Integer, String</text>
  <rect x="400" y="90" width="130" height="56" rx="8" class="box"/>
  <text x="465" y="124" class="op" text-anchor="middle">100</text>
  <line x1="532" y1="118" x2="572" y2="118" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="575" y="90" width="130" height="56" rx="8" class="bad"/>
  <text x="640" y="124" class="badc" text-anchor="middle">200</text>
  <text x="400" y="176" class="note">식별자가 없어 완전히 다른 값으로 대체됩니다.</text>
  <rect x="10" y="226" width="740" height="226" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="258" class="h">값 타입 종류</text>
  <rect x="300" y="274" width="160" height="40" rx="8" class="hold"/>
  <text x="380" y="299" class="t" text-anchor="middle">값 타입</text>
  <line x1="380" y1="315" x2="145.0" y2="342" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="30" y="345" width="230" height="94" rx="8" class="box"/>
  <text x="145" y="368" class="t" text-anchor="middle">기본값 타입</text>
  <text x="145" y="389" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">int, double</tspan></text>
  <text x="145" y="406" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">Integer, Long</tspan></text>
  <text x="145" y="423" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">String</tspan></text>
  <line x1="380" y1="315" x2="380.0" y2="342" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="275" y="345" width="210" height="94" rx="8" class="box"/>
  <text x="380" y="368" class="t" text-anchor="middle">임베디드 타입</text>
  <text x="380" y="389" class="val" text-anchor="middle">복합 값 타입</text>
  <text x="380" y="406" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">embedded type</tspan></text>
  <line x1="380" y1="315" x2="615.0" y2="342" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="500" y="345" width="230" height="94" rx="8" class="box"/>
  <text x="615" y="368" class="t" text-anchor="middle">컬렉션 값 타입</text>
  <text x="615" y="389" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">collection value type</tspan></text>
</svg>
