<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 1 OrderPaymentService.apply 코드 순서 — 결제 결과(eventId N)가 들어오면 한 트랜잭션 안에서 1 PaymentOutcome.from·eventNumber·requireComplete로 영구 오류를 확인하고(영구 오류면 기록 전에 멈추고 다시 시도하지 않음), 2 claim이 event_id 고유 키 표에 insert ignore로 번호를 남겨 1줄이면 3 follow로 주문 상태를 바꾸고(마지막 번호 확인은 결정 2) 4 번호와 주문 변경을 함께 커밋함. 같은 결과가 다시 오면 2에서 0줄이라 아무것도 바꾸지 않고 커밋하고, 주문 변경이 실패해 롤백되면 번호 줄도 함께 롤백돼 다시 시도할 수 있음. 받은 기록은 JPA 엔티티에서 빼 JDBC로 남기고, 재고 서비스도 processed_stock_command(command_id 고유)에 남겨 처음 온 번호일 때만 예약을 바꿈. 같은 번호를 남기는 중인 트랜잭션을 기다린다는 주석은 MySQL 문서로 확인하지 않았고, 가리는 이유는 결제 서버가 적어도 한 번 보내고 커밋 전 재기동이면 같은 메시지를 다시 읽기 때문인 그림</title>
