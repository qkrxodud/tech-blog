  <circle cx="380" cy="358" r="9" fill="#111827"/><text x="380" y="362" class="num" text-anchor="middle">5</text>
  <line x1="668" y1="370" x2="382" y2="370" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#agy)"/>
  <text x="235" y="386" class="lbl" text-anchor="middle" style="fill: #15803d"><tspan class="m">200</tspan> (본문 없음)</text>
  <line x1="371" y1="394" x2="92" y2="394" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#agr)"/>
  <circle cx="380" cy="394" r="9" fill="#111827"/><text x="380" y="398" class="num" text-anchor="middle">6</text>
  <line x1="24" y1="414" x2="736" y2="414" stroke="#e5e7eb" stroke-width="1"/>
  <text x="235" y="432" class="lbl" text-anchor="middle" style="fill: #b91c1c"><tspan class="m">404</tspan> · <tspan class="m">409</tspan> — 200이 아님</text>
  <line x1="371" y1="440" x2="92" y2="440" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <circle cx="380" cy="440" r="9" fill="#111827"/><text x="380" y="444" class="num" text-anchor="middle">7</text>
  <rect x="20" y="456" width="300" height="46" rx="10" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <rect x="20" y="456" width="300" height="46" rx="10" fill="none" stroke="#ea580c" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.8131;0.8231;0.8731;0.8831;1"/></rect>
  <text x="38" y="474" class="ot">10초 안에 200이 아니면 다시 보냄</text>
  <text x="38" y="492" class="os">최대 7번 · 간격 1·4·16…4096분(테스트 100ms)</text>
  <circle cx="20" cy="456" r="9" fill="#111827"/><text x="20" y="460" class="num" text-anchor="middle">8</text>
  <text x="238" y="520" class="lbl" text-anchor="middle" style="fill: #c2410c">같은 본문으로 다시 POST · 7번을 다 쓰면 그만</text>
  <line x1="99" y1="528" x2="378" y2="528" stroke="#c2410c" stroke-width="1.6" class="run" marker-end="url(#aor)"/>
  <circle cx="90" cy="528" r="9" fill="#111827"/><text x="90" y="532" class="num" text-anchor="middle">9</text>
  <line x1="12" y1="552" x2="748" y2="552" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="22" cy="570" r="8" fill="#ef4444"/><text x="22" y="574" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="36" y="574" class="bads">주문번호로 결제를 찾지 못하면 <tspan class="m">404 PAYMENT_NOT_FOUND</tspan> — 주문번호가 없는 결제 상태 알림도 404</text>
  <circle cx="22" cy="590" r="8" fill="#ef4444"/><text x="22" y="594" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="36" y="594" class="bads">전이 표에 없는 행위면 <tspan class="m">409 INVALID_PAYMENT_TRANSITION</tspan> — 승인된 결제에 다시 온 승인 알림 등</text>
  <circle cx="22" cy="610" r="8" fill="#ef4444"/><text x="22" y="614" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <text x="36" y="614" class="gs">다른 <tspan class="m">eventType</tspan>은 아무것도 하지 않고 <tspan class="m">200</tspan> · 읽을 수 없는 본문은 <tspan class="m">400 INVALID_INPUT</tspan></text>
  <text x="14" y="638" class="gs">옮기는 행위 — <tspan class="m">DONE</tspan> 승인 · <tspan class="m">ABORTED</tspan>·<tspan class="m">EXPIRED</tspan> 승인 실패 · <tspan class="m">CANCELED</tspan> 취소 · 부분 취소는 옮기지 않고 <tspan class="m">200</tspan></text>
