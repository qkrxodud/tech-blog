  <text x="28" y="165" class="t2" style="font-size:11.5px;fill:#7c3aed">다시 시도</text>
  <rect x="120" y="152" width="196" height="18" rx="4" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="120" y="152" width="2.0" height="18" rx="4" fill="#7c3aed" opacity="0.75"/>
  <text x="128" y="165" class="s2" text-anchor="start" style="font-size:11px;font-weight:700;fill:#7c3aed">0.05~0.07개</text>
  <text x="28" y="211" class="t2" style="font-size:11.5px;fill:#16a34a">차단기(운영)</text>
  <rect x="120" y="198" width="196" height="18" rx="4" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="120" y="198" width="137.2" height="18" rx="4" fill="#16a34a" opacity="0.75"/>
  <text x="251.2" y="211" class="num" text-anchor="end" style="font-size:11px;font-weight:700">6.98~7.00개</text>
  <text x="120" y="252" class="gs" style="font-size:10px">0</text>
  <text x="316" y="252" class="gs" text-anchor="end" style="font-size:10px">10</text>
  <text x="28" y="276" class="t2" style="font-size:11.5px">최대는 세 방식 모두 10/10</text>
  <text x="28" y="296" class="gs" style="font-size:10.5px">고객 20명이 같은 때 준비·인증 기록을 남긴 순간</text><text x="28" y="312" class="gs" style="font-size:10.5px">— 카드사를 기다리며 쥔 연결이 아님</text>
  <rect x="28" y="334" width="302" height="112" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="40" y="354" class="oks" style="font-size:10.5px;fill:#1f2937">카드사 답을 기다리는 동안 연결을 쥐지 않음</text><text x="40" y="370" class="s2" style="font-size:10.5px;fill:#1f2937">2장 — 승인 요청은 트랜잭션 밖</text><text x="40" y="386" class="s2" style="font-size:10.5px;fill:#1f2937">시간 제한만·다시 시도 평균은 요청 앞뒤의 짧은 기록</text><text x="40" y="402" class="s2" style="font-size:10.5px;fill:#1f2937">차단기 평균 약 7개는 바로 실패한 고객이 쉬지 않고</text><text x="40" y="418" class="s2" style="font-size:10.5px;fill:#1f2937">다음 결제를 준비·기록(초당 약 240건)</text><text x="40" y="434" class="gs" style="font-size:10.5px;fill:#1f2937">실제 고객의 재시도 간격은 재지 않음</text>
  <rect x="356" y="58" width="392" height="400" rx="16" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="368" y="46" width="220" height="24" rx="6" fill="#5b7194"/><text x="478" y="62.5" class="tab" text-anchor="middle">대사 한 번(카드사에서만 취소 1%)</text>
  <text x="370" y="86" class="gs" style="font-size:10.5px">걸린 시간 · 두 실행 범위 · 막대는 같은 눈금</text>
  <text x="370" y="112" class="t2" style="font-size:12.5px">1천 건</text>
  <text x="370" y="135" class="s2" style="font-size:10.5px;fill:#2563eb;font-weight:700">운영 — 거래 내역</text>
  <rect x="470" y="124" width="3.1" height="14" rx="3" fill="#2563eb" opacity="0.25"/>
  <rect x="470" y="124" width="2.2" height="14" rx="3" fill="#2563eb" opacity="0.7"/>
  <text x="479.0731891891892" y="135" class="s2" style="font-size:10.5px;fill:#2563eb;font-weight:700">306~434ms</text>
  <text x="470" y="153" class="gs" style="font-size:10px">거래 조회 1번 · 결제 조회 10번</text>
  <text x="370" y="179" class="s2" style="font-size:10.5px;fill:#c2410c;font-weight:700">결제마다 단건 조회</text>
  <rect x="470" y="168" width="35.3" height="14" rx="3" fill="#c2410c" opacity="0.25"/>
  <rect x="470" y="168" width="33.9" height="14" rx="3" fill="#c2410c" opacity="0.7"/>
  <text x="511.2921081081081" y="179" class="s2" style="font-size:10.5px;fill:#c2410c;font-weight:700">4783~4984ms</text>
  <text x="470" y="197" class="gs" style="font-size:10px">결제 조회 1000번</text>
  <use href="#vs" x="377" y="212"/>
  <text x="389" y="216" class="oks" style="font-size:10.5px">맞춘 결제 10건(두 방식 같음)</text>
  <text x="370" y="252" class="t2" style="font-size:12.5px">1만 건</text>
  <text x="370" y="275" class="s2" style="font-size:10.5px;fill:#2563eb;font-weight:700">운영 — 거래 내역</text>
  <rect x="470" y="264" width="7.3" height="14" rx="3" fill="#2563eb" opacity="0.25"/>
  <rect x="470" y="264" width="7.0" height="14" rx="3" fill="#2563eb" opacity="0.7"/>
  <text x="483.31475675675676" y="275" class="s2" style="font-size:10.5px;fill:#2563eb;font-weight:700">995~1033ms</text>
  <text x="470" y="293" class="gs" style="font-size:10px">거래 조회 3번 · 결제 조회 100번</text>
  <text x="370" y="319" class="s2" style="font-size:10.5px;fill:#c2410c;font-weight:700">결제마다 단건 조회</text>
  <rect x="470" y="308" width="255.8" height="14" rx="3" fill="#c2410c" opacity="0.25"/>
  <rect x="470" y="308" width="249.7" height="14" rx="3" fill="#c2410c" opacity="0.7"/>
  <text x="719.8394594594595" y="319" class="num" text-anchor="end" style="font-size:10.5px;fill:#7c2d12">35263~36130ms</text>
  <text x="470" y="337" class="gs" style="font-size:10px">결제 조회 1만 번</text>
  <use href="#vs" x="377" y="352"/>
  <text x="389" y="356" class="oks" style="font-size:10.5px">맞춘 결제 100건(두 방식 같음)</text>
  <text x="370" y="388" class="gs" style="font-size:10px">거래 조회 3번 = 1만 건과 취소 100건을 5000건씩</text><text x="370" y="404" class="gs" style="font-size:10px">결제 조회 = 뒤처진 결제를 따라가거나(운영) 결제마다(비교) 부른 수</text>
</svg>
