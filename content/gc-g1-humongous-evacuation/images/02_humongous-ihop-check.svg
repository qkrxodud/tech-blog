<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>보통은 young GC가 끝날 때 IHOP를 확인해 다음 young GC를 concurrent start로 쓰지만, humongous object는 할당될 때마다 IHOP를 확인해 concurrent start를 즉시 실행한다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .lane2 { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .opc { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .rg { font-size: 13px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dark { fill: #d1d5db; stroke: #6b7280; stroke-width: 1.2; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="310" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">IHOP 확인 시점 — 보통의 경우와 humongous object 할당</text>
  <text x="730" y="42" class="code" text-anchor="end">IHOP</text>
  <text x="220" y="68" class="step" text-anchor="middle">1단계</text>
  <text x="360" y="68" class="step" text-anchor="middle">2단계</text>
  <text x="500" y="68" class="step" text-anchor="middle">3단계</text>
  <text x="640" y="68" class="step" text-anchor="middle">4단계</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="118.0" class="lane">보통의 경우</text>
  <text x="30" y="136.0" class="sub">young GC 끝에 확인</text>
  <rect x="150" y="90" width="585" height="60" rx="6" class="track"/>
  <rect x="158.0" y="96" width="124" height="48" rx="8" class="box"/>
  <text x="220" y="116.0" class="op" text-anchor="middle">young GC 끝</text>
  <text x="220" y="134.0" class="val" text-anchor="middle">normal young GC</text>
  <rect x="298.0" y="96" width="124" height="48" rx="8" class="box"/>
  <text x="360" y="116.0" class="op" text-anchor="middle">IHOP 초과?</text>
  <text x="360" y="134.0" class="val" text-anchor="middle">초과했다면</text>
  <rect x="430" y="106" width="140" height="28" rx="6" class="wait"/>
  <text x="500" y="125" class="waitt" text-anchor="middle">다음 young GC 대기</text>
  <rect x="578.0" y="96" width="124" height="48" rx="8" class="ok"/>
  <text x="640" y="116.0" class="okt" text-anchor="middle">다음 young GC</text>
  <text x="640" y="134.0" class="val" text-anchor="middle">concurrent start로</text>
  <text x="30" y="198.0" class="lane">humongous</text>
  <text x="30" y="216.0" class="sub">할당할 때마다 확인</text>
  <rect x="150" y="170" width="585" height="60" rx="6" class="track"/>
  <rect x="158.0" y="176" width="124" height="48" rx="8" class="box"/>
  <text x="220" y="196.0" class="op" text-anchor="middle">humongous 할당</text>
  <text x="220" y="214.0" class="val" text-anchor="middle">거대 객체 생성</text>
  <rect x="298.0" y="176" width="124" height="48" rx="8" class="box"/>
  <text x="360" y="196.0" class="op" text-anchor="middle">IHOP 초과?</text>
  <text x="360" y="214.0" class="val" text-anchor="middle">아직 마킹 전?</text>
  <rect x="438.0" y="176" width="124" height="48" rx="8" class="ok"/>
  <text x="500" y="196.0" class="okt" text-anchor="middle">즉시 실행</text>
  <text x="500" y="214.0" class="val" text-anchor="middle">concurrent start</text>
  <text x="30" y="266" class="db">IHOP</text>
  <text x="150" y="266" class="val">old generation의 heap 점유율 임계치 — 넘기면 concurrent marking을 시작한다</text>
  <text x="150" y="300" class="sub">보통의 경우에는 임계치를 넘기면 다음 번 young GC를 concurrent start로 활용한다</text>
</svg>
