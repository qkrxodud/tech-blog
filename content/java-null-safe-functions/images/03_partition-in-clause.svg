<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>Lists.partition으로 id 15개를 4개씩 네 묶음으로 자르고, 묶음마다 in 절에 넣어 쿼리를 한 번씩 실행하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 12px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .valc { font-size: 12px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 12px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 12px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .lbl { font-size: 12px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="390" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="370" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">Lists.partition — 4개씩 잘라 in 절에 나눠 넣기</text>
  <text x="730" y="42" class="code" text-anchor="end">partition(memberids, 4)</text>
  <text x="30" y="88" class="lane">memberids</text>
  <text x="30" y="106" class="sub">id 15개</text>
  <rect x="150" y="72" width="34" height="32" rx="5" class="hold"/>
  <text x="167" y="93" class="opm" text-anchor="middle">1</text>
  <rect x="189" y="72" width="34" height="32" rx="5" class="hold"/>
  <text x="206" y="93" class="opm" text-anchor="middle">2</text>
  <rect x="228" y="72" width="34" height="32" rx="5" class="hold"/>
  <text x="245" y="93" class="opm" text-anchor="middle">3</text>
  <rect x="267" y="72" width="34" height="32" rx="5" class="hold"/>
  <text x="284" y="93" class="opm" text-anchor="middle">4</text>
  <rect x="306" y="72" width="34" height="32" rx="5" class="box"/>
  <text x="323" y="93" class="opm" text-anchor="middle">5</text>
  <rect x="345" y="72" width="34" height="32" rx="5" class="box"/>
  <text x="362" y="93" class="opm" text-anchor="middle">6</text>
  <rect x="384" y="72" width="34" height="32" rx="5" class="box"/>
  <text x="401" y="93" class="opm" text-anchor="middle">7</text>
  <rect x="423" y="72" width="34" height="32" rx="5" class="box"/>
  <text x="440" y="93" class="opm" text-anchor="middle">8</text>
  <rect x="462" y="72" width="34" height="32" rx="5" class="hold"/>
  <text x="479" y="93" class="opm" text-anchor="middle">9</text>
  <rect x="501" y="72" width="34" height="32" rx="5" class="hold"/>
  <text x="518" y="93" class="opm" text-anchor="middle">10</text>
  <rect x="540" y="72" width="34" height="32" rx="5" class="hold"/>
  <text x="557" y="93" class="opm" text-anchor="middle">11</text>
  <rect x="579" y="72" width="34" height="32" rx="5" class="hold"/>
  <text x="596" y="93" class="opm" text-anchor="middle">12</text>
  <rect x="618" y="72" width="34" height="32" rx="5" class="box"/>
  <text x="635" y="93" class="opm" text-anchor="middle">13</text>
  <rect x="657" y="72" width="34" height="32" rx="5" class="box"/>
  <text x="674" y="93" class="opm" text-anchor="middle">14</text>
  <rect x="696" y="72" width="34" height="32" rx="5" class="box"/>
  <text x="713" y="93" class="opm" text-anchor="middle">15</text>
  <text x="30" y="172" class="lane">partition</text>
  <text x="30" y="190" class="sub">4개씩 4묶음</text>
  <text x="30" y="266" class="lane">쿼리</text>
  <text x="30" y="284" class="sub">묶음마다 실행</text>
  <line x1="225.5" y1="106" x2="219" y2="150" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="150" y="153" width="138" height="40" rx="8" class="hold"/>
  <text x="219" y="178" class="opm" text-anchor="middle">[1, 2, 3, 4]</text>
  <line x1="219" y1="195" x2="219" y2="240" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="150" y="243" width="138" height="48" rx="8" class="ok"/>
  <text x="219" y="263" class="okt" text-anchor="middle">쿼리 1</text>
  <text x="219" y="282" class="valc" text-anchor="middle">IN (1,2,3,4)</text>
  <line x1="381.5" y1="106" x2="368" y2="150" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="299" y="153" width="138" height="40" rx="8" class="box"/>
  <text x="368" y="178" class="opm" text-anchor="middle">[5, 6, 7, 8]</text>
  <line x1="368" y1="195" x2="368" y2="240" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="299" y="243" width="138" height="48" rx="8" class="ok"/>
  <text x="368" y="263" class="okt" text-anchor="middle">쿼리 2</text>
  <text x="368" y="282" class="valc" text-anchor="middle">IN (5,6,7,8)</text>
  <line x1="537.5" y1="106" x2="517" y2="150" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="448" y="153" width="138" height="40" rx="8" class="hold"/>
  <text x="517" y="178" class="opm" text-anchor="middle">[9, 10, 11, 12]</text>
  <line x1="517" y1="195" x2="517" y2="240" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="448" y="243" width="138" height="48" rx="8" class="ok"/>
  <text x="517" y="263" class="okt" text-anchor="middle">쿼리 3</text>
  <text x="517" y="282" class="valc" text-anchor="middle">IN (9,10,11,12)</text>
  <line x1="674" y1="106" x2="666" y2="150" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="597" y="153" width="138" height="40" rx="8" class="box"/>
  <text x="666" y="178" class="opm" text-anchor="middle">[13, 14, 15]</text>
  <line x1="666" y1="195" x2="666" y2="240" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="597" y="243" width="138" height="48" rx="8" class="ok"/>
  <text x="666" y="263" class="okt" text-anchor="middle">쿼리 4</text>
  <text x="666" y="282" class="valc" text-anchor="middle">IN (13,14,15)</text>
  <text x="150" y="325" class="note">id를 한 번에 in 절에 넣으면 슬로우 쿼리가 생기고, 오라클은 in 절 값이 1,000건으로 제한됩니다.</text>
  <text x="150" y="349" class="gnote">실무에서는 partitionSize를 1,000 이하로 두고 묶음마다 쿼리를 실행합니다.</text>
</svg>
