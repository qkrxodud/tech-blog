<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>수정자 주입은 public setXxx로 주입한 뒤에도 다시 호출되어 의존관계가 바뀔 수 있고, 생성자 주입은 객체 생성 시 1번만 호출되어 의존관계가 그대로 유지되는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .okms { font-size: 12px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .chip { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .gscope { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .dim { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dimt { font-size: 12.5px; fill: #9ca3af; font-family: Menlo, Consolas, monospace; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .tag { font-size: 11.5px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="408" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="186" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">수정자 주입 — setXxx가 public으로 열려 있음</text>
  <text x="220" y="70" class="step" text-anchor="middle">객체 생성</text>
  <text x="360" y="70" class="step" text-anchor="middle">의존관계 주입</text>
  <text x="500" y="70" class="step" text-anchor="middle">실행 중</text>
  <text x="640" y="70" class="step" text-anchor="middle">결과</text>
  <line x1="160" y1="78" x2="722" y2="78" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="116" class="lane">수정자 주입</text>
  <text x="30" y="134" class="sub">public setXxx</text>
  <rect x="150" y="90" width="585" height="56" rx="6" class="track"/>
  <rect x="162" y="94" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="114" class="op" text-anchor="middle">new</text>
  <text x="220" y="133" class="val" text-anchor="middle">빈 객체 생성</text>
  <rect x="302" y="94" width="116" height="48" rx="8" class="box"/>
  <text x="360" y="114" class="op" text-anchor="middle">setXxx()</text>
  <text x="360" y="133" class="val" text-anchor="middle">의존관계 주입</text>
  <rect x="442" y="94" width="116" height="48" rx="8" class="bad"/>
  <text x="500" y="114" class="badm" text-anchor="middle">setXxx()</text>
  <text x="500" y="133" class="val" text-anchor="middle">다시 호출 가능</text>
  <rect x="582" y="94" width="116" height="48" rx="8" class="bad"/>
  <text x="640" y="114" class="badt" text-anchor="middle">변경됨</text>
  <text x="640" y="133" class="val" text-anchor="middle">실수로 바뀜</text>
  <text x="150" y="176" class="note">변경하면 안 되는 메서드가 열려 있어, 종료 전까지 누군가의 실수로 의존관계가 바뀔 수 있습니다.</text>
  <rect x="10" y="212" width="740" height="186" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="244" class="h">생성자 주입 — 생성할 때 딱 1번만 호출</text>
  <text x="220" y="272" class="step" text-anchor="middle">객체 생성 + 주입</text>
  <text x="360" y="272" class="step" text-anchor="middle">실행 중</text>
  <text x="500" y="272" class="step" text-anchor="middle">실행 중</text>
  <text x="640" y="272" class="step" text-anchor="middle">결과</text>
  <line x1="160" y1="280" x2="722" y2="280" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="318" class="lane">생성자 주입</text>
  <text x="30" y="336" class="sub">생성자 1번 호출</text>
  <rect x="150" y="292" width="585" height="56" rx="6" class="track"/>
  <rect x="162" y="296" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="316" class="op" text-anchor="middle">new Xxx(..)</text>
  <text x="220" y="335" class="val" text-anchor="middle">생성 시 1번 주입</text>
  <rect x="290" y="304" width="280" height="32" rx="6" class="wait"/>
  <text x="430" y="325" class="waitt" text-anchor="middle">이후 생성자는 다시 호출되지 않음</text>
  <rect x="582" y="296" width="116" height="48" rx="8" class="ok"/>
  <text x="640" y="316" class="okt" text-anchor="middle">그대로 유지</text>
  <text x="640" y="335" class="val" text-anchor="middle">불변</text>
  <text x="150" y="378" class="gnote">생성 시점에 정해진 의존관계가 애플리케이션 종료 전까지 바뀌지 않아 불변하게 설계할 수 있습니다.</text>
</svg>
