<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 488" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>앞 글에서 11장으로 넘긴 항목 중 1장 목차와 9장 — 1장 목차의 11장 컨슈머 멱등성·재시도·DLQ는 결정 1~4, 9장 도입의 중복 가리기·재시도·실패 모음은 결정 1·3·4, 9장 결정 3(릴레이 나누기)의 옛 이벤트를 거르지 않는 문제는 결정 2로 다뤄 한 줄씩 skip locked 비교 실패가 3개에서 2개로 줄었고, 9장 결정 5 비용의 중복 가리기는 결정 1(event_id 고유 키), 9장 남은 한계는 결정 1~4(기본 처리는 비교로 돌려 주문 8·재고 7 실패), 9장 마무리의 다시 재 볼 필요는 가리지 않음·상태 전이만·거르지 않음·만든 시각 비교를 같은 계약으로 돌린 결정 1·2로 다룬 그림</title>
