<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>잡지 못한 주문이 지나는 순서 — HoldRefusalTest에서 재고 5개·쿠폰 2000원은 있고 포인트가 500원인 회원이 상품 1개에 포인트 1000원을 쓰는 7000원 주문의 승인을 보냄. 인증 트랜잭션(PaymentRecorder.authenticate)이 결제 줄을 잠그고 읽어 금액을 확인하고 인증 전이를 한 뒤 PaymentHoldings.hold가 상품 번호 순 재고 조건부 UPDATE(1줄), 쿠폰 ISSUED → USED(1줄), 포인트 조건부 UPDATE(잔액 500 &lt; 1000이라 0줄) 순서로 잡다 포인트에서 InsufficientPointException. 트랜잭션이 통째로 롤백돼 재고 5·쿠폰 ISSUED 그대로, 결제는 READY, Mock PG 승인 요청 0, 답은 409 INSUFFICIENT_POINT. 재고·쿠폰은 JdbcTemplate 문장이고 인증은 JPA 결제라 함께 롤백되는지 실행으로 확인(HoldRefusalTest 4개 통과)</title>
