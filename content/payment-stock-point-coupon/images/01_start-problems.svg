<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 562" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>8장 출발 코드에서 재현한 다섯 문제 — 1. 재고를 넘겨 팜: 재고 1개에 겹친 두 주문이 모두 승인되고 PG 승인 2건, 재고 10개에 30건이 모두 승인됐는데 남은 재고는 −20이 아니라 6, 재고 0개 상품도 PG 승인(API 200). 2. 결제가 끝났는데 줄인 것이 남음: 전액 취소 뒤와 부분 취소가 쌓여 0원이 된 뒤에도 재고 3·포인트 2000원·쿠폰 USED, 결과 모름을 보정이 승인으로 닫으면 아무것도 줄이지 않음. 3. 쿠폰 한 장이 두 번 쓰임: 같은 쿠폰 두 주문이 모두 승인, 먼저 준비한 주문이 이미 쓰인 쿠폰으로 PG 승인 요청, 포인트 1000원 회원의 두 주문이 모두 승인. 4. 포인트가 여러 번 돌아옴: 출발 코드에서는 줄인 것이 없어 재현되지 않고 결정 4 비교에서 포인트 5000원(처음 3000원)으로 재현. 5. 고객이 금액을 바꿈: 17000원 주문을 1000원으로 낮춰 준비 201, PG 1000.00원 승인. 8장 테스트 42개 중 21개 실패</title>
