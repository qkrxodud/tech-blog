  <use href="#vmark" x="40" y="488"/>
  <text x="58" y="484" class="okt">결제는 <tspan class="m">READY</tspan> 그대로 · Mock PG 승인 0건 — PG를 부르기 전에 멈춤</text>
  <text x="58" y="502" class="oks">금액이 같으면 PG에는 요청 금액이 아니라 저장한 금액을 보냄</text>
