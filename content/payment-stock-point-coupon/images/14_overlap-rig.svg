  <text x="398" y="114" class="s" style="font-size:10.5px"><tspan class="m">AUTHENTICATED</tspan> · 커밋 때 나감</text>
  <rect x="384" y="156" width="352" height="48" rx="10" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <circle cx="384" cy="156" r="10" fill="#111827"/><text x="384" y="160" class="num" text-anchor="middle">3</text>
  <use href="#i-clock" transform="translate(398,166) scale(0.95)"/>
  <text x="436" y="176" class="t2" style="font-size:12px">트리거가 1초 붙잡음</text>
  <text x="436" y="194" class="s" style="font-size:10.5px">바꾼 재고·쿠폰·포인트 줄의 잠금을 쥔 채 잠듦</text>
  <rect x="440" y="236" width="136" height="48" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="440" cy="236" r="10" fill="#111827"/><text x="440" y="240" class="num" text-anchor="middle">4</text>
  <text x="454" y="256" class="t2" style="font-size:12px">잠든 것을 확인</text>
  <text x="454" y="274" class="s" style="font-size:10.5px"><tspan class="m">awaitHeld()</tspan></text>
  <rect x="588" y="236" width="148" height="48" rx="10" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <circle cx="588" cy="236" r="10" fill="#111827"/><text x="588" y="240" class="num" text-anchor="middle">5</text>
  <text x="602" y="256" class="ot" style="font-size:12px">두 번째 주문 승인</text>
  <text x="602" y="274" class="os" style="font-size:10.5px">앞 주문 커밋 전에</text>
  <text x="140" y="306" class="gs" style="font-size:11px">두 주문의 답은 보낸 순서대로 돌려받음 — <tspan class="m">List.of(firstAnswer.join(), laterAnswer)</tspan></text>
  <rect x="24" y="324" width="350" height="104" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="38" y="348" class="t2" style="font-size:12.5px">거절을 세 곳이 겹쳐 닫는 경우</text>
  <text x="38" y="370" class="s" style="font-size:11px">PG가 거절을 남기고 거절 답은 붙잡아 둠</text>
  <text x="38" y="387" class="s" style="font-size:11px">알림 처리가 승인 실패를 남기다 1초 붙잡힘</text>
  <text x="38" y="404" class="s" style="font-size:11px">그동안 보정을 시작</text>
  <text x="38" y="421" class="s" style="font-size:11px">그다음 붙잡아 둔 거절 답을 보냄</text>
  <rect x="386" y="324" width="350" height="104" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="400" y="348" class="t2" style="font-size:12.5px">재고 10개에 30건</text>
  <text x="400" y="370" class="s" style="font-size:11px">겹침을 고정하지 않음</text>
  <text x="400" y="387" class="s" style="font-size:11px">미리 준비해 둔 주문 30건의 승인을</text>
  <text x="400" y="404" class="s" style="font-size:11px">스레드 30개에서 래치로 한꺼번에 보냄</text>
