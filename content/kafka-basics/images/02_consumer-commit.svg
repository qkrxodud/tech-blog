<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>컨슈머가 0번부터 3번 레코드까지 가져가고 커밋으로 위치를 기록하면, 레코드는 파티션에 그대로 남고 다음에는 4번 레코드부터 이어서 가져가는 모습</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .chip { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
    .grp { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="300" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="280" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">컨슈머 커밋 — 어디까지 가져갔는지 기록</text>
  <text x="30" y="124" class="lane">파티션</text>
  <text x="30" y="142" class="sub">큐 구조</text>
  <text x="291" y="80" class="val" text-anchor="middle">가져간 레코드 (삭제되지 않고 남아 있음)</text>
  <line x1="150" y1="90" x2="432" y2="90" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="150" y="100" width="66" height="48" rx="8" class="hold"/>
  <text x="183" y="130" class="op" text-anchor="middle">0</text>
  <rect x="222" y="100" width="66" height="48" rx="8" class="hold"/>
  <text x="255" y="130" class="op" text-anchor="middle">1</text>
  <rect x="294" y="100" width="66" height="48" rx="8" class="hold"/>
  <text x="327" y="130" class="op" text-anchor="middle">2</text>
  <rect x="366" y="100" width="66" height="48" rx="8" class="hold"/>
  <text x="399" y="130" class="op" text-anchor="middle">3</text>
  <rect x="438" y="100" width="66" height="48" rx="8" class="box"/>
  <text x="471" y="130" class="op" text-anchor="middle">4</text>
  <rect x="510" y="100" width="66" height="48" rx="8" class="box"/>
  <text x="543" y="130" class="op" text-anchor="middle">5</text>
  <rect x="582" y="100" width="66" height="48" rx="8" class="box"/>
  <text x="615" y="130" class="op" text-anchor="middle">6</text>
  <rect x="654" y="100" width="66" height="48" rx="8" class="box"/>
  <text x="687" y="130" class="op" text-anchor="middle">7</text>
  <line x1="435" y1="94" x2="435" y2="160" stroke="#16a34a" stroke-width="2"/>
  <text x="428" y="176" class="gnote" text-anchor="end">커밋한 위치</text>
  <rect x="380" y="200" width="260" height="56" rx="8" class="ok"/>
  <text x="510" y="224" class="okt" text-anchor="middle">컨슈머</text>
  <text x="510" y="243" class="gnote" text-anchor="middle">커밋한 위치 다음부터 가져감</text>
  <line x1="474" y1="150" x2="474" y2="196" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="278" class="foot">칸 안의 숫자는 파티션에 쌓인 순서(오프셋)입니다. 가져간 0~3번 레코드도 파티션에 그대로 남아 있습니다.</text>
</svg>
