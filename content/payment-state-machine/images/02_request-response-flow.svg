<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 656" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결제 요청과 응답 — 고객이 결제 버튼을 누르면 READY, 결제창에서 카드사 인증을 마치면 AUTHENTICATED, 가맹점 서버가 PG를 거쳐 카드사에 승인을 요청해 결과를 받으면 APPROVED, 승인 마감 뒤 PG가 매입을 청구하면 CAPTURED, 취소는 매입 전이면 APPROVAL_CANCELED, 매입 후면 CAPTURE_CANCELED가 되는 요청·응답 흐름도. 1장 코드가 구현한 것은 결제 상태의 전이뿐이다</title>
