<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>상태 유지 방식은 서버 A가 저장한 상태를 서버 B가 알지 못해 두 번째 요청을 처리하지 못하고, 무상태 방식은 클라이언트가 요청마다 필요한 데이터를 함께 보내 서버 A와 서버 B 모두 처리할 수 있는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .m { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .mv { font-size: 12px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="396" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="180" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">상태 유지 — 상태를 서버에 저장하면 중간에 서버가 바뀌면 안 된다</text>
  <rect x="30" y="72" width="160" height="84" rx="8" class="box"/>
  <text x="110" y="110" class="t" text-anchor="middle">클라이언트</text>
  <text x="110" y="130" class="sub" text-anchor="middle">상태를 서버가 저장</text>
  <rect x="470" y="64" width="260" height="50" rx="8" class="hold"/>
  <text x="486" y="85" class="t">서버 A</text>
  <text x="486" y="104" class="val">요청 1 처리, 상태 저장</text>
  <rect x="470" y="126" width="260" height="50" rx="8" class="bad"/>
  <text x="486" y="147" class="badt">서버 B</text>
  <text x="486" y="166" class="note">저장된 상태가 없어 처리 불가</text>
  <line x1="190" y1="98" x2="466" y2="90" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="328" y="84" class="gnote" text-anchor="middle">요청 1</text>
  <line x1="190" y1="132" x2="466" y2="150" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="328" y="160" class="note" text-anchor="middle">요청 2 (서버가 바뀜)</text>
  <rect x="10" y="206" width="740" height="180" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="238" class="h">무상태 — 클라이언트가 필요한 데이터를 요청마다 함께 보낸다</text>
  <rect x="30" y="268" width="160" height="84" rx="8" class="box"/>
  <text x="110" y="306" class="t" text-anchor="middle">클라이언트</text>
  <text x="110" y="326" class="sub" text-anchor="middle">상태를 클라이언트가 저장</text>
  <rect x="470" y="260" width="260" height="50" rx="8" class="ok"/>
  <text x="486" y="281" class="okt">서버 A</text>
  <text x="486" y="300" class="val">요청 1과 데이터로 처리</text>
  <rect x="470" y="322" width="260" height="50" rx="8" class="ok"/>
  <text x="486" y="343" class="okt">서버 B</text>
  <text x="486" y="362" class="val">요청 2와 데이터로 처리</text>
  <line x1="190" y1="294" x2="466" y2="286" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="328" y="280" class="gnote" text-anchor="middle">요청 1 + 필요한 데이터</text>
  <line x1="190" y1="328" x2="466" y2="346" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="328" y="356" class="gnote" text-anchor="middle">요청 2 + 필요한 데이터</text>
</svg>
