<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>SSR은 서버가 JSP나 타임리프로 HTML 최종 결과를 만들어 웹 브라우저에 전달하고, CSR은 서버가 HTTP API로 데이터만 전달하면 웹 브라우저에서 자바스크립트가 HTML을 동적으로 생성해 적용한다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .m { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .mv { font-size: 12px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .gn { font-size: 12.5px; fill: #15803d; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="372" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="168" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">SSR — 서버에서 HTML 최종 결과를 만든다</text>
  <text x="730" y="42" class="sub" text-anchor="end">JSP, 타임리프 · 백엔드 개발자</text>
  <rect x="30" y="64" width="190" height="60" rx="8" class="box"/>
  <text x="125" y="89" class="t" text-anchor="middle">웹 브라우저</text>
  <text x="125" y="110" class="val" text-anchor="middle">화면 요청</text>
  <line x1="220" y1="94" x2="279" y2="94" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="285" y="64" width="190" height="60" rx="8" class="hold"/>
  <text x="380" y="89" class="t" text-anchor="middle">서버</text>
  <text x="380" y="110" class="val" text-anchor="middle">HTML 최종 결과 생성</text>
  <line x1="475" y1="94" x2="534" y2="94" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="505" y="86" class="gnote" text-anchor="middle">HTML</text>
  <rect x="540" y="64" width="190" height="60" rx="8" class="ok"/>
  <text x="635" y="89" class="okt" text-anchor="middle">웹 브라우저</text>
  <text x="635" y="110" class="val" text-anchor="middle">받은 HTML을 그대로 표시</text>
  <text x="30" y="156" class="foot">주로 정적인 화면에 사용합니다.</text>

  <rect x="10" y="194" width="740" height="168" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="226" class="h">CSR — 웹 브라우저에서 자바스크립트로 HTML을 만든다</text>
  <text x="730" y="226" class="sub" text-anchor="end">React, Vue.js · 웹 프론트엔드 개발자</text>
  <rect x="30" y="248" width="190" height="60" rx="8" class="box"/>
  <text x="125" y="273" class="t" text-anchor="middle">웹 브라우저</text>
  <text x="125" y="294" class="val" text-anchor="middle">데이터 요청</text>
  <line x1="220" y1="278" x2="279" y2="278" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="285" y="248" width="190" height="60" rx="8" class="hold"/>
  <text x="380" y="273" class="t" text-anchor="middle">서버 (HTTP API)</text>
  <text x="380" y="294" class="val" text-anchor="middle">데이터만 전달</text>
  <line x1="475" y1="278" x2="534" y2="278" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="505" y="270" class="gnote" text-anchor="middle">JSON</text>
  <rect x="540" y="248" width="190" height="60" rx="8" class="ok"/>
  <text x="635" y="273" class="okt" text-anchor="middle">웹 브라우저</text>
  <text x="635" y="294" class="val" text-anchor="middle">자바스크립트로 HTML 생성</text>
  <text x="30" y="340" class="foot">주로 동적인 화면에 사용하며, 앱처럼 필요한 부분만 변경할 수 있습니다.</text>
</svg>
