<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>code 페이지 2번에 접근했는데 매핑이 없어 page fault가 나고, OS가 디스크에서 페이지를 읽어 RAM에 올린 뒤 페이지 테이블을 갱신하고 명령어를 다시 실행하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .seg { font-size: 13px; font-weight: 700; fill: #374151; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opk { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .dia { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .lbl { font-size: 12.5px; font-weight: 700; fill: #6b7280; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="430" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="410" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">page fault 처리 — 필요한 페이지를 그때 RAM에 올림</text>
  <text x="730" y="42" class="code" text-anchor="end">demand paging</text>
  <text x="208" y="68" class="step" text-anchor="middle">1단계</text>
  <text x="325" y="68" class="step" text-anchor="middle">2단계</text>
  <text x="442" y="68" class="step" text-anchor="middle">3단계</text>
  <text x="559" y="68" class="step" text-anchor="middle">4단계</text>
  <text x="676" y="68" class="step" text-anchor="middle">5단계</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">CPU·MMU</text>
  <text x="30" y="126" class="sub">주소 변환</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <text x="30" y="168" class="lane">OS 커널</text>
  <text x="30" y="186" class="sub">page fault 처리</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <text x="30" y="228" class="lane">디스크</text>
  <text x="30" y="246" class="sub">실행 파일</text>
  <rect x="150" y="206" width="585" height="52" rx="6" class="track"/>
  <text x="30" y="288" class="lane">RAM</text>
  <text x="30" y="306" class="sub">프레임</text>
  <rect x="150" y="266" width="585" height="52" rx="6" class="track"/>
  <rect x="154" y="88" width="108" height="48" rx="8" class="bad"/>
  <text x="208" y="108" class="badt" text-anchor="middle">주소 변환</text>
  <text x="208" y="127" class="val" text-anchor="middle">2번: 매핑 없음</text>
  <rect x="271" y="148" width="108" height="48" rx="8" class="bad"/>
  <text x="325" y="168" class="badc" text-anchor="middle">page fault</text>
  <text x="325" y="187" class="val" text-anchor="middle">커널로 전환</text>
  <rect x="388" y="208" width="108" height="48" rx="8" class="box"/>
  <text x="442" y="228" class="opk" text-anchor="middle">읽기</text>
  <text x="442" y="247" class="val" text-anchor="middle">code 페이지</text>
  <rect x="388" y="268" width="108" height="48" rx="8" class="ok"/>
  <text x="442" y="288" class="okt" text-anchor="middle">적재</text>
  <text x="442" y="307" class="val" text-anchor="middle">빈 프레임에</text>
  <rect x="505" y="148" width="108" height="48" rx="8" class="ok"/>
  <text x="559" y="168" class="okt" text-anchor="middle">테이블 갱신</text>
  <text x="559" y="187" class="val" text-anchor="middle">2번 → 프레임</text>
  <rect x="622" y="88" width="108" height="48" rx="8" class="ok"/>
  <text x="676" y="108" class="okt" text-anchor="middle">다시 실행</text>
  <text x="676" y="127" class="val" text-anchor="middle">RAM → IR</text>
  <line x1="240" y1="136" x2="300" y2="148" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <line x1="355" y1="196" x2="412" y2="208" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="442" y1="256" x2="442" y2="267" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="498" y1="280" x2="540" y2="197" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="590" y1="148" x2="650" y2="137" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="350" class="db">페이지 테이블 2번</text>
  <rect x="168" y="330" width="80" height="30" rx="6" class="bad"/>
  <text x="208" y="350" class="badt" text-anchor="middle">없음</text>
  <rect x="519" y="330" width="80" height="30" rx="6" class="ok"/>
  <text x="559" y="350" class="okt" text-anchor="middle">프레임</text>
  <rect x="636" y="330" width="80" height="30" rx="6" class="ok"/>
  <text x="676" y="350" class="okt" text-anchor="middle">프레임</text>
  <text x="30" y="386" class="sub">page fault는 프로그램 오류와 다르며, 필요한 페이지를 올리는 정상적인 과정입니다.</text>
  <text x="30" y="406" class="sub">테이블이 갱신되면 CPU는 같은 명령어를 다시 실행하고, 이번에는 RAM에서 바로 읽어 IR에 올립니다.</text>
</svg>
