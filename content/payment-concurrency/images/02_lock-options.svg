  <rect width="760" height="612" fill="#ffffff"/>
  <text x="24" y="28" class="h">결정 1 — 같은 결제를 바꾸는 기록을 무엇으로 가릴까</text>
  <rect x="242" y="44" width="252" height="56" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <circle cx="242" cy="44" r="12" fill="#111827"/><text x="242" y="48" class="num" text-anchor="middle" style="font-size:12px">가</text>
  <text x="368.0" y="67" class="t2" text-anchor="middle" style="font-size:13.5px;font-weight:700;fill:#1f2937">남은 금액을 넘는 취소 둘</text>
  <text x="368.0" y="87" class="s" text-anchor="middle">15000원 결제에 10000원 두 건</text>
  <rect x="506" y="44" width="238" height="56" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <circle cx="506" cy="44" r="12" fill="#111827"/><text x="506" y="48" class="num" text-anchor="middle" style="font-size:12px">나</text>
  <text x="625.0" y="67" class="t2" text-anchor="middle" style="font-size:13.5px;font-weight:700;fill:#1f2937">겹친 5000원 부분 취소 둘</text>
  <text x="625.0" y="87" class="s" text-anchor="middle">첫 취소의 답 기록과 둘째 요청 기록</text>
  <rect x="16" y="116" width="214" height="70" rx="10" fill="#e3f3e6" stroke="#16a34a" stroke-width="2.5"/>
  <use href="#i-lock" x="28" y="136"/>
  <text x="64" y="139" class="t2" style="font-size:13.5px;font-weight:700;fill:#1f2937">결제 줄 잠금</text>
  <text x="64" y="158" class="s2"><tspan class="m">select … for update</tspan></text>
  <text x="64" y="176" class="oks">이 장에서 고름 · 실패 0개</text>
  <rect x="242" y="116" width="252" height="70" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.3"/>
  <use href="#vmark" x="264" y="151.0"/>
  <text x="282" y="146" class="okt">나중 취소는 기다린 뒤 거부</text>
  <text x="282" y="166" class="oks">"남은 금액보다 큼", PG 1건</text>
  <rect x="506" y="116" width="238" height="70" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.3"/>
  <use href="#vmark" x="528" y="151.0"/>
  <text x="546" y="146" class="okt">우리 남은 금액 = PG 잔액</text>
  <text x="546" y="166" class="oks">기다린 기록이 앞 기록을 봄</text>
  <rect x="16" y="196" width="214" height="70" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="30" y="219" class="t2" style="font-size:13.5px;font-weight:700;fill:#1f2937">잠그지 않음</text>
  <text x="30" y="238" class="s2">6장까지</text>
  <text x="30" y="256" class="bads">계약 실패 6개</text>
  <rect x="242" y="196" width="252" height="70" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.3"/>
  <use href="#xmark" x="264" y="231.0"/>
  <text x="282" y="226" class="badt">둘 다 PG로 감</text>
  <text x="282" y="246" class="bads">나중 취소도 답을 받음</text>
  <rect x="506" y="196" width="238" height="70" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.3"/>
  <use href="#vmark" x="528" y="231.0"/>
  <text x="546" y="236.0" class="okt">우리 남은 금액 = PG 잔액</text>
  <rect x="16" y="276" width="214" height="70" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="30" y="299" class="t2" style="font-size:13.5px;font-weight:700;fill:#1f2937">변경 번호 비교</text>
  <text x="30" y="318" class="s2">커밋 직전 version 비교, 강제 증가</text>
  <text x="30" y="336" class="bads">계약 실패 2개</text>
  <rect x="242" y="276" width="252" height="70" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.3"/>
  <use href="#xmark" x="264" y="311.0"/>
  <text x="282" y="306" class="badt">나중 취소가 <tspan class="m">409</tspan></text>
  <text x="282" y="326" class="bads"><tspan class="m">INVALID_PAYMENT_TRANSITION</tspan></text>
  <rect x="506" y="276" width="238" height="70" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.3"/>
  <use href="#xmark" x="528" y="311.0"/>
  <text x="546" y="306" class="badt">첫 취소 답 기록이 409로 되돌림</text>
  <text x="546" y="326" class="bads">우리 10000원 ≠ PG 5000원</text>
  <rect x="16" y="356" width="214" height="70" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="30" y="379" class="t2" style="font-size:13.5px;font-weight:700;fill:#1f2937">상태 조건 UPDATE</text>
  <text x="30" y="398" class="s2">커밋 직전 status 비교</text>
  <text x="30" y="416" class="bads">계약 실패 3개</text>
  <rect x="242" y="356" width="252" height="70" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.3"/>
  <use href="#xmark" x="264" y="391.0"/>
  <text x="282" y="386" class="badt">둘 다 PG로 감</text>
  <text x="282" y="406" class="bads">취소 요청은 결제 상태를 안 바꿈</text>
  <rect x="506" y="356" width="238" height="70" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.3"/>
  <use href="#vmark" x="528" y="391.0"/>
  <text x="546" y="396.0" class="okt">우리 남은 금액 = PG 잔액</text>
  <rect x="16" y="436" width="214" height="70" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="30" y="459" class="t2" style="font-size:13.5px;font-weight:700;fill:#1f2937">JPA <tspan class="m">@Version</tspan> 그대로</text>
  <text x="30" y="478" class="s2">결제 줄이 바뀔 때만 오름</text>
  <text x="30" y="496" class="bads">계약 실패 4개</text>
  <rect x="242" y="436" width="252" height="70" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.3"/>
  <use href="#xmark" x="264" y="471.0"/>
  <text x="282" y="466" class="badt">둘 다 PG로 감</text>
  <text x="282" y="486" class="bads">취소 줄 추가는 version을 안 올림</text>
  <rect x="506" y="436" width="238" height="70" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.3"/>
  <use href="#vmark" x="528" y="471.0"/>
  <text x="546" y="476.0" class="okt">우리 남은 금액 = PG 잔액</text>
  <rect x="16" y="516" width="214" height="56" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="30" y="539" class="gt">Redis 분산 잠금</text>
  <text x="30" y="558" class="gs">구현하지 않음</text>
  <rect x="242" y="516" width="502" height="56" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="260" y="539" class="gs">연재 목차에 Redis를 쓰는 장이 없고, 이 장의 문제는 DB만으로 풀 수 있었음</text>
  <text x="260" y="558" class="gs">구현해서 돌려 보지 않음</text>
  <use href="#vs" x="26" y="594"/>
  <text x="40" y="598" class="lbl">계약대로</text>
  <use href="#xs" x="120" y="594"/>
  <text x="134" y="598" class="lbl">계약 실패 — 같은 결제 기록 계약 11개, docs/ch07/01·03 결과</text>
