  <rect width="760" height="504" fill="#ffffff"/>
  <text x="24" y="30" class="h">언제 조회할까 — 시간 초과 직후 조회와 대기 시간 뒤 조회</text>
  <line x1="150" y1="58" x2="740" y2="58" stroke="#c4c8ce" stroke-width="1.5"/>
  <line x1="190" y1="52" x2="190" y2="64" stroke="#9ca3af" stroke-width="1.5"/><text x="190" y="48" class="gs" text-anchor="middle">0초</text>
  <line x1="390" y1="52" x2="390" y2="64" stroke="#9ca3af" stroke-width="1.5"/><text x="390" y="48" class="gs" text-anchor="middle">1초</text>
  <line x1="490" y1="52" x2="490" y2="64" stroke="#9ca3af" stroke-width="1.5"/><text x="490" y="48" class="gs" text-anchor="middle">1.5초</text>
