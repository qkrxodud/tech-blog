  <rect width="760" height="540" fill="#ffffff"/>
  <text x="24" y="28" class="h">결정 1 — 카드사 기록과 우리 결제를 무엇으로 맞춰 볼까</text>
  <text x="24" y="48" class="gs" style="font-size:11.5px">하루치 대사 계약 13개 · 측정은 결제 1천·1만 건, 1%를 카드사에서만 취소(두 번 실행)</text>
  <rect x="14" y="62" width="238" height="54" rx="10" fill="#f9fafb" stroke="#16a34a" stroke-width="3"/>
  <text x="26" y="84" class="t2" style="font-size:12.5px">하루치 거래 내역을 쪽 단위로</text>
  <text x="26" y="104" class="oks" style="font-size:11px;font-weight:700">이 장에서 고름 · 운영</text>
  <rect x="262" y="62" width="238" height="54" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="274" y="84" class="t2" style="font-size:12.5px">결제마다 카드사 단건 조회</text>
  <text x="274" y="104" class="gs" style="font-size:11px">4장 보정을 그날 인증한 결제로 넓힘</text>
  <rect x="510" y="62" width="238" height="54" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="522" y="84" class="gt" style="font-size:12.5px">닿지 않은 웹훅을 다시 요청</text>
  <text x="522" y="104" class="gs" style="font-size:11px">계획에 없어 구현하지 않음</text>
  <text x="24" y="140" class="t2" style="font-size:12px">어떻게 읽나</text>
  <rect x="20" y="150" width="226" height="52" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/><text x="133" y="172.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px"><tspan class="m">GET /v1/transactions</tspan> 5000건씩</text><text x="133" y="187.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">→ 결제 키로 묶어 우리 결제와 맞춤</text>
  <rect x="268" y="150" width="226" height="52" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/><text x="381" y="172.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">그날 인증한 우리 결제마다 <tspan class="m">findPayment</tspan></text><text x="381" y="187.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">→ 6장 따라가기</text>
  <text x="24" y="230" class="t2" style="font-size:12px">카드사 조회 수(측정)</text>
  <rect x="20" y="240" width="226" height="52" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/><text x="133" y="262.5" class="s2" text-anchor="middle" style="fill:#15803d;font-size:11px">거래 조회 1번(1천 건)·3번(1만 건)</text><text x="133" y="277.5" class="s2" text-anchor="middle" style="fill:#15803d;font-size:11px">+ 뒤처진 결제 조회 10번·100번</text>
  <rect x="268" y="240" width="226" height="52" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/><text x="381" y="262.5" class="s2" text-anchor="middle" style="fill:#b91c1c;font-size:11px;font-weight:700">결제 조회 1000번(1천 건)</text><text x="381" y="277.5" class="s2" text-anchor="middle" style="fill:#b91c1c;font-size:11px;font-weight:700">1만 번(1만 건) — 결제 수만큼</text>
  <text x="24" y="320" class="t2" style="font-size:12px">카드사에만 있는 결제</text>
  <rect x="20" y="330" width="226" height="46" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/><text x="133" y="357" class="s2" text-anchor="middle" style="fill:#15803d;font-size:11px">찾음 — 거래 내역에 있음</text>
  <rect x="268" y="330" width="226" height="46" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/><text x="381" y="357" class="s2" text-anchor="middle" style="fill:#b91c1c;font-size:11px;font-weight:700">못 찾음 — 우리 목록에 없음</text>
  <text x="24" y="398" class="t2" style="font-size:12px">12장 대사 계약 실패</text>
  <rect x="20" y="408" width="226" height="70" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="40" y="432"/>
  <text x="56" y="437" class="okt">13개 모두 통과</text>
  <rect x="268" y="408" width="226" height="70" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="288" y="432"/>
  <text x="304" y="437" class="badt">4개 실패</text>
  <text x="280" y="456" class="bads" style="font-size:10px">금액 다름·카드사에만·우리 쪽만 취소를 운영자</text><text x="280" y="470" class="bads" style="font-size:10px">확인으로 남기지 못함, 서버 두 대(조회 없음)</text>
  <rect x="516" y="150" width="226" height="328" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="629" y="186" class="gt" text-anchor="middle" style="font-size:12.5px">비교로 돌리지 않음</text>
  <text x="629" y="210" class="gs" text-anchor="middle" style="font-size:11px">수치 없음</text>
  <line x1="14" y1="496" x2="748" y2="496" stroke="#9ca3af" stroke-width="1"/>
  <text x="24" y="520" class="s2" style="font-size:11.5px;fill:#1f2937">카드사에서만 취소된 결제는 두 방식 모두 측정에서 모두 맞춤(1천 건 중 10건, 1만 건 중 100건)</text>
</svg>
