  <rect x="616" y="128" width="128" height="84" rx="12" fill="none" stroke="#ea580c" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2931;0.3031;0.4331;0.4431;1"/></rect>
  <use href="#i-server" x="662.0" y="138"/>
  <text x="680.0" y="186" class="t2" text-anchor="middle">Mock PG</text>
  <text x="680.0" y="202" class="s" text-anchor="middle"><tspan class="m">PARTIAL_CANCELED</tspan></text>
  <line x1="200" y1="190" x2="200" y2="204" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <rect x="60" y="206" width="280" height="50" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <rect x="60" y="206" width="280" height="50" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6606;0.6706;0.7206;0.7306;1"/></rect>
  <circle cx="60" cy="206" r="11" fill="#111827"/><text x="60" y="210" class="num" text-anchor="middle">2</text>
  <use href="#i-key" x="78" y="216"/>
  <text x="122" y="227" class="t2">모르는 키만 고름</text>
  <text x="122" y="244" class="s"><tspan class="m">isUnknownTransaction</tspan></text>
  <line x1="340" y1="231" x2="384" y2="231" stroke="#2563eb" stroke-width="1.5" marker-end="url(#abl)"/>
  <rect x="386" y="213" width="186" height="36" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.2"/>
