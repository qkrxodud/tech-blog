  <rect width="760" height="470" fill="#ffffff"/>
  <text x="24" y="30" class="h">구현 — <tspan class="m">markSent</tspan>는 한 줄을 보낼 때마다 바로 반영</text>
  <text x="24" y="52" class="gs">어느 트랜잭션에도 끼지 않고 <tspan class="m">JdbcTemplate</tspan>으로 · 예시: 네 줄을 읽은 주기가 셋째 줄에서 멈춤</text>
