<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 506" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>MySQL은 INSERT 1건에 인덱스 3개만 갱신하지만, Elasticsearch는 문서를 분석해 나온 term 200개의 posting list를 갱신하고 이를 메모리 버퍼와 1초 주기 세그먼트로 상쇄하는 그림</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .chip { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; }
    .chipt { font-size: 13px; font-weight: 600; fill: #1f2937; }
    .idt { font-size: 13px; font-weight: 700; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .empty { fill: none; stroke: #e5e7eb; stroke-width: 1.2; stroke-dasharray: 3 3; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="506" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="170" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">MySQL — INSERT 1건이면 인덱스 3개 갱신</text>
  <text x="30" y="64" class="sub">인덱스가 걸린 컬럼 개수만큼만 B-Tree를 고침</text>
  <rect x="40.0" y="96" width="140" height="48" rx="8" class="box"/>
  <text x="110" y="116" class="op" text-anchor="middle">INSERT</text>
  <text x="110" y="135" class="val" text-anchor="middle">문서 1건</text>
  <rect x="265.0" y="96" width="130" height="48" rx="8" class="ok"/>
  <text x="330" y="116" class="okt" text-anchor="middle">인덱스 1</text>
  <text x="330" y="135" class="val" text-anchor="middle">B-Tree에 1건</text>
  <rect x="415.0" y="96" width="130" height="48" rx="8" class="ok"/>
  <text x="480" y="116" class="okt" text-anchor="middle">인덱스 2</text>
  <text x="480" y="135" class="val" text-anchor="middle">B-Tree에 1건</text>
  <rect x="565.0" y="96" width="130" height="48" rx="8" class="ok"/>
  <text x="630" y="116" class="okt" text-anchor="middle">인덱스 3</text>
  <text x="630" y="135" class="val" text-anchor="middle">B-Tree에 1건</text>
  <line x1="184" y1="120" x2="259" y2="120" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="330" y="166" class="gnote">트리 3개에 각각 1건씩 반영</text>
  <rect x="10" y="196" width="740" height="300" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="228" class="h">Elasticsearch — INSERT 1건이면 term 200개 갱신</text>
  <text x="30" y="250" class="sub">500단어짜리 문서에서 중복을 제거하면 고유 term 200개</text>
  <rect x="30.0" y="270" width="140" height="48" rx="8" class="box"/>
  <text x="100" y="290" class="op" text-anchor="middle">INSERT</text>
  <text x="100" y="309" class="val" text-anchor="middle">500단어 문서</text>
  <rect x="190.0" y="270" width="150" height="48" rx="8" class="box"/>
  <text x="265" y="290" class="db" text-anchor="middle">분석</text>
  <text x="265" y="309" class="val" text-anchor="middle">형태소 분석(nori)</text>
  <rect x="360.0" y="270" width="130" height="48" rx="8" class="box"/>
  <text x="425" y="290" class="db" text-anchor="middle">term 200개</text>
  <text x="425" y="309" class="val" text-anchor="middle">중복 제거 후</text>
  <rect x="510" y="270" width="220" height="48" rx="8" class="bad"/>
  <text x="620" y="290" class="badt" text-anchor="middle">posting list 200개</text>
  <text x="620" y="309" class="val" text-anchor="middle">+ term frequency + position</text>
  <line x1="173" y1="294" x2="187" y2="294" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="343" y1="294" x2="357" y2="294" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="493" y1="294" x2="507" y2="294" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="620" y="340" class="note" text-anchor="middle">읽기를 위해 쓰기 비용을 앞당겨 지불</text>
  <text x="30" y="372" class="lane">그래서 배치로 상쇄합니다</text>
  <rect x="40.0" y="386" width="220" height="48" rx="8" class="hold"/>
  <text x="150" y="406" class="db" text-anchor="middle">메모리 버퍼</text>
  <text x="150" y="425" class="val" text-anchor="middle">색인할 문서를 모아 둠</text>
  <rect x="310.0" y="386" width="220" height="48" rx="8" class="ok"/>
  <text x="420" y="406" class="okt" text-anchor="middle">세그먼트</text>
  <text x="420" y="425" class="val" text-anchor="middle">1초에 한 번 만듦</text>
  <line x1="264" y1="410" x2="306" y2="410" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="560" y="392" width="170" height="36" rx="6" class="wait"/>
  <text x="645" y="415" class="waitt" text-anchor="middle">그 1초 = near real-time</text>
  <text x="30" y="472" class="sub">쓰기 비용을 배치로 상쇄하는 대신, 그 1초가 near real-time이라는 또 다른 대가가 됨</text>
</svg>
