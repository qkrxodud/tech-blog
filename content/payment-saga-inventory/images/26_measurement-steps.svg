  <text x="392" y="210" class="bads" style="font-size:10.5px">멈춤 = 중계 끊음 + 재고 명령 읽기 멈춤</text>
  <rect x="44" y="226" width="676" height="82" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
