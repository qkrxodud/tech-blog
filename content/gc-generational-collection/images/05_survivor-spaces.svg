<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 526" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>survivor가 하나면 다음 minor GC 때 copy할 빈 공간이 없고, young generation을 eden, survivor0, survivor1로 나누면 새 객체 공간, 살아남은 객체 공간, copy를 위한 빈 공간이 따로 생기는 모습</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #374151; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ops { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .tiny { font-size: 11px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #e5e7eb; stroke: #6b7280; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .region { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12px; fill: #9ca3af; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .ad { stroke: #9ca3af; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="526" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="228" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">survivor가 하나일 때 — 다음 minor GC에서 copy할 빈 공간이 없음</text>
  <text x="368" y="70" class="step" text-anchor="middle">새 객체가 생성되는 공간</text>
  <text x="640" y="70" class="step" text-anchor="middle">survivor</text>
  <rect x="196" y="80" width="344" height="52" rx="8" class="region"/>
  <rect x="550" y="80" width="180" height="52" rx="8" class="region"/>
  <rect x="204" y="88" width="60" height="36" rx="6" class="wait"/>
  <rect x="270" y="88" width="60" height="36" rx="6" class="wait"/>
  <rect x="336" y="88" width="60" height="36" rx="6" class="wait"/>
  <rect x="402" y="88" width="60" height="36" rx="6" class="wait"/>
  <rect x="468" y="88" width="60" height="36" rx="6" class="wait"/>
  <rect x="558" y="88" width="52" height="36" rx="8" class="ok"/>
  <text x="584.0" y="111.0" class="okt" text-anchor="middle">live</text>
  <rect x="614" y="88" width="52" height="36" rx="8" class="ok"/>
  <text x="640.0" y="111.0" class="okt" text-anchor="middle">live</text>
  <rect x="670" y="88" width="52" height="36" rx="6" class="wait"/>
  <text x="30" y="102" class="ops">1번째 minor GC 후</text>
  <text x="30" y="120" class="sub">live를 survivor로 copy</text>
  <rect x="196" y="150" width="344" height="52" rx="8" class="region"/>
  <rect x="550" y="150" width="180" height="52" rx="8" class="region"/>
  <rect x="204" y="158" width="60" height="36" rx="8" class="box"/>
  <text x="234.0" y="181.0" class="val" text-anchor="middle">새 객체</text>
  <rect x="270" y="158" width="60" height="36" rx="8" class="ok"/>
  <text x="300.0" y="181.0" class="okt" text-anchor="middle">live</text>
  <rect x="336" y="158" width="60" height="36" rx="8" class="bad"/>
  <text x="366.0" y="181.0" class="note" text-anchor="middle">garbage</text>
  <rect x="402" y="158" width="60" height="36" rx="8" class="box"/>
  <text x="432.0" y="181.0" class="val" text-anchor="middle">새 객체</text>
  <rect x="468" y="158" width="60" height="36" rx="8" class="box"/>
  <text x="498.0" y="181.0" class="val" text-anchor="middle">새 객체</text>
  <rect x="558" y="158" width="52" height="36" rx="8" class="ok"/>
  <text x="584.0" y="181.0" class="okt" text-anchor="middle">live</text>
  <rect x="614" y="158" width="52" height="36" rx="8" class="ok"/>
  <text x="640.0" y="181.0" class="okt" text-anchor="middle">live</text>
  <rect x="670" y="158" width="52" height="36" rx="8" class="ok"/>
  <text x="696.0" y="181.0" class="okt" text-anchor="middle">live</text>
  <text x="30" y="172" class="ops">다음 minor GC</text>
  <text x="30" y="190" class="note">copy할 곳이 없음</text>
  <text x="30" y="226" class="note">survivor에는 살아남은 객체가, 나머지에는 새 객체가 있어 copy를 위한 빈 공간이 남지 않습니다</text>
  <rect x="10" y="254" width="740" height="262" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="286" class="h">eden, survivor0, survivor1 — mark-copy에 필요한 세 가지 공간</text>
  <text x="30" y="360" class="lane">young</text>
  <text x="30" y="378" class="sub">generation</text>
  <rect x="150" y="324" width="330" height="64" rx="8" class="region"/>
  <text x="160" y="320" class="ops">eden</text>
  <rect x="160" y="338" width="70" height="36" rx="8" class="box"/>
  <text x="195.0" y="361.0" class="val" text-anchor="middle">새 객체</text>
  <rect x="238" y="338" width="70" height="36" rx="8" class="box"/>
  <text x="273.0" y="361.0" class="val" text-anchor="middle">새 객체</text>
  <rect x="316" y="338" width="70" height="36" rx="8" class="box"/>
  <text x="351.0" y="361.0" class="val" text-anchor="middle">새 객체</text>
  <rect x="394" y="338" width="70" height="36" rx="8" class="box"/>
  <text x="429.0" y="361.0" class="val" text-anchor="middle">새 객체</text>
  <rect x="490" y="324" width="116" height="64" rx="8" class="region"/>
  <text x="500" y="320" class="ops">survivor0</text>
  <rect x="498" y="338" width="48" height="36" rx="8" class="ok"/>
  <text x="522.0" y="361.0" class="okt" text-anchor="middle">live</text>
  <rect x="552" y="338" width="48" height="36" rx="8" class="ok"/>
  <text x="576.0" y="361.0" class="okt" text-anchor="middle">live</text>
  <rect x="616" y="324" width="114" height="64" rx="8" class="region"/>
  <text x="626" y="320" class="ops">survivor1</text>
  <rect x="624" y="338" width="98" height="36" rx="6" class="wait"/>
  <text x="673" y="361" class="waitt" text-anchor="middle">빈 공간</text>
  <text x="315" y="410" class="val" text-anchor="middle">새로운 객체가 생성될 공간</text>
  <text x="548" y="410" class="val" text-anchor="middle">살아남은 young</text>
  <text x="548" y="427" class="val" text-anchor="middle">객체를 담을 공간</text>
  <text x="673" y="410" class="val" text-anchor="middle">copy를 위한</text>
  <text x="673" y="427" class="val" text-anchor="middle">빈 공간</text>
  <path d="M315,420 C315,470 690,470 690,436" class="gl" marker-end="url(#agr)"/>
  <path d="M548,436 C548,462 660,466 684,440" class="gl" marker-end="url(#agr)"/>
  <text x="30" y="498" class="gnote">다음 minor GC 때 eden과 survivor0의 live 객체를 survivor1로 copy — 두 survivor 중 한 곳은 항상 비어 있습니다</text>
</svg>
