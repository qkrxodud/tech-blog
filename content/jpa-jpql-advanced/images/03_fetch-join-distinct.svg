<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>select distinct t로 조회하면 SQL에 DISTINCT가 붙지만 팀A 두 행은 회원 컬럼이 달라 그대로 남고, 애플리케이션에서 같은 식별자의 팀A 엔티티 중복을 JPA가 제거해 결과가 팀A, 팀B 두 건이 되는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .msg { font-size: 11.5px; fill: #374151; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .cont { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="380" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">페치 조인과 DISTINCT — SQL에서는 남고, 애플리케이션에서 제거</text>
  <text x="730" y="42" class="code" text-anchor="end">select distinct t</text>
  <text x="30" y="96" class="lane" text-anchor="start">1. SQL</text>
  <text x="30" y="116" class="sub" text-anchor="start">DISTINCT 추가</text>
  <text x="150" y="88" class="ts" text-anchor="start"></text>
  <rect x="150" y="96" width="180" height="28" rx="4" class="hold"/>
  <text x="190.0" y="115" class="ts" text-anchor="middle">팀</text>
  <text x="280.0" y="115" class="ts" text-anchor="middle">회원</text>
  <rect x="150" y="124" width="180" height="28" rx="0" class="bad"/>
  <text x="190.0" y="143" class="val" text-anchor="middle">팀A</text>
  <text x="280.0" y="143" class="val" text-anchor="middle">member1</text>
  <rect x="150" y="152" width="180" height="28" rx="0" class="bad"/>
  <text x="190.0" y="171" class="val" text-anchor="middle">팀A</text>
  <text x="280.0" y="171" class="val" text-anchor="middle">member2</text>
  <rect x="150" y="180" width="180" height="28" rx="0" class="box"/>
  <text x="190.0" y="199" class="val" text-anchor="middle">팀B</text>
  <text x="280.0" y="199" class="val" text-anchor="middle">member3</text>
  <line x1="230" y1="96" x2="230" y2="208" stroke="#d1d5db" stroke-width="1"/>
  <text x="360" y="120" class="note" text-anchor="start">SQL의 DISTINCT는 결과값이 완전히</text>
  <text x="360" y="140" class="note" text-anchor="start">일치해야 제거되는데, 팀A 두 행은</text>
  <text x="360" y="160" class="note" text-anchor="start">회원 컬럼이 달라 그대로 남습니다</text>
  <rect x="360" y="176" width="180" height="30" rx="6" class="bad"/>
  <text x="450" y="196" class="badt" text-anchor="middle">SQL 결과: 3행</text>
  <line x1="240" y1="212" x2="240" y2="248" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="30" y="276" class="lane" text-anchor="start">2. 애플리케이션</text>
  <text x="30" y="296" class="sub" text-anchor="start">엔티티 중복 제거</text>
  <rect x="150" y="254" width="130" height="48" rx="8" class="box"/>
  <text x="215.0" y="274" class="t" text-anchor="middle">팀A</text>
  <text x="215.0" y="293" class="val" text-anchor="middle">결과 리스트</text>
  <rect x="150" y="310" width="130" height="48" rx="8" class="wait"/>
  <text x="215.0" y="330" class="waitt" text-anchor="middle">팀A</text>
  <text x="215.0" y="349" class="val" text-anchor="middle">같은 식별자 → 제거</text>
  <rect x="300" y="254" width="130" height="48" rx="8" class="box"/>
  <text x="365.0" y="274" class="t" text-anchor="middle">팀B</text>
  <text x="365.0" y="293" class="val" text-anchor="middle">결과 리스트</text>
  <line x1="430" y1="290" x2="496" y2="290" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="500" y="268" width="230" height="44" rx="8" class="ok"/>
  <text x="615" y="295" class="okt" text-anchor="middle">resultList: 팀A, 팀B</text>
</svg>
