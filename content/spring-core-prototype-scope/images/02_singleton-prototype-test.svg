<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 426" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>싱글톤 테스트는 컨테이너 생성 때 init이 한 번 실행되고 같은 인스턴스를 두 번 조회한 뒤 close 때 destroy가 호출되고, 프로토타입 테스트는 getBean마다 init이 실행되어 서로 다른 인스턴스가 나오고 close 때 destroy가 호출되지 않는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .msg { font-size: 11.5px; fill: #374151; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .cont { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="426" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="190" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">싱글톤 테스트 — 한 번 초기화, 종료 메서드 호출</text>
  <text x="730" y="42" class="code" text-anchor="end">SingletonTest</text>
  <text x="198" y="68" class="step" text-anchor="middle">컨테이너 생성</text>
  <text x="318" y="68" class="step" text-anchor="middle">getBean() 1</text>
  <text x="446" y="68" class="step" text-anchor="middle">getBean() 2</text>
  <text x="574" y="68" class="step" text-anchor="middle">비교</text>
  <text x="690" y="68" class="step" text-anchor="middle">ac.close()</text>
  <line x1="140" y1="76" x2="738" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">싱글톤</text>
  <text x="30" y="126" class="sub">SingletonBean</text>
  <rect x="140" y="86" width="600" height="52" rx="6" class="track"/>
  <rect x="148" y="88" width="100" height="48" rx="8" class="box"/>
  <text x="198" y="108" class="opm" text-anchor="middle">init()</text>
  <text x="198" y="127" class="val" text-anchor="middle">초기화 1번</text>
  <rect x="260" y="88" width="116" height="48" rx="8" class="hold"/>
  <text x="318" y="108" class="opm" text-anchor="middle">@x01</text>
  <text x="318" y="127" class="val" text-anchor="middle">같은 인스턴스</text>
  <rect x="388" y="88" width="116" height="48" rx="8" class="hold"/>
  <text x="446" y="108" class="opm" text-anchor="middle">@x01</text>
  <text x="446" y="127" class="val" text-anchor="middle">같은 인스턴스</text>
  <rect x="518" y="88" width="112" height="48" rx="8" class="ok"/>
  <text x="574" y="108" class="okm" text-anchor="middle">isSameAs</text>
  <text x="574" y="127" class="val" text-anchor="middle">통과</text>
  <rect x="646" y="88" width="88" height="48" rx="8" class="ok"/>
  <text x="690" y="108" class="okm" text-anchor="middle">destroy()</text>
  <text x="690" y="127" class="val" text-anchor="middle">호출됨</text>
  <text x="140" y="172" class="foot">컨테이너가 만들 때 한 번 초기화하고, 컨테이너가 끝날 때 종료 메서드까지 호출합니다</text>
  <rect x="10" y="216" width="740" height="200" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="248" class="h">프로토타입 테스트 — 조회할 때마다 초기화, 종료 메서드 없음</text>
  <text x="730" y="248" class="code" text-anchor="end">prototypeTest</text>
  <text x="198" y="274" class="step" text-anchor="middle">컨테이너 생성</text>
  <text x="318" y="274" class="step" text-anchor="middle">getBean() 1</text>
  <text x="446" y="274" class="step" text-anchor="middle">getBean() 2</text>
  <text x="574" y="274" class="step" text-anchor="middle">비교</text>
  <text x="690" y="274" class="step" text-anchor="middle">ac.close()</text>
  <line x1="140" y1="282" x2="738" y2="282" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="314" class="lane">프로토타입</text>
  <text x="30" y="332" class="sub">ProtoTypeBean</text>
  <rect x="140" y="292" width="600" height="52" rx="6" class="track"/>
  <rect x="150" y="302" width="96" height="32" rx="6" class="wait"/>
  <text x="198" y="323" class="waitt" text-anchor="middle">생성 안 함</text>
  <rect x="260" y="294" width="116" height="48" rx="8" class="box"/>
  <text x="318" y="314" class="opm" text-anchor="middle">init()</text>
  <text x="318" y="333" class="val" text-anchor="middle">@x01 새로 생성</text>
  <rect x="388" y="294" width="116" height="48" rx="8" class="box"/>
  <text x="446" y="314" class="opm" text-anchor="middle">init()</text>
  <text x="446" y="333" class="val" text-anchor="middle">@x02 새로 생성</text>
  <rect x="518" y="294" width="112" height="48" rx="8" class="ok"/>
  <text x="574" y="314" class="okm" text-anchor="middle">isNotSameAs</text>
  <text x="574" y="333" class="val" text-anchor="middle">통과</text>
  <rect x="646" y="294" width="88" height="48" rx="8" class="bad"/>
  <text x="690" y="314" class="badm" text-anchor="middle">destroy()</text>
  <text x="690" y="333" class="val" text-anchor="middle">호출 안 됨</text>
  <text x="140" y="378" class="foot">초기화까지만 컨테이너가 관여하고, 이후에는 관리하지 않으므로 종료 메서드가 호출되지 않습니다</text>
  <text x="140" y="398" class="note">종료가 필요하면 빈을 조회한 클라이언트가 직접 호출해야 합니다</text>
</svg>
