<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 472" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>일대다 단방향에서 Team.members가 주인이라 MEMBER와 TEAM을 INSERT한 뒤 MEMBER의 TEAM_ID를 채우는 UPDATE가 추가로 실행되고, @JoinColumn이 없으면 중간에 연결 테이블이 하나 추가되는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12.5px; fill: #374151; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .thead { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .cell { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 13px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 12.5px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 12.5px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="agb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="472" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="246" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">일대다 단방향 — UPDATE SQL이 추가로 실행된다</text>
  <rect x="30" y="66" width="170" height="106" rx="6" class="box"/>
  <rect x="30" y="66" width="170" height="28" rx="6" class="thead"/>
  <text x="115.0" y="85" class="mb" text-anchor="middle">Team</text>
  <text x="42" y="111.5" class="m">id</text>
  <text x="42" y="137.5" class="m">name</text>
  <rect x="34" y="149" width="162" height="20" rx="4" class="ok"/>
  <text x="42" y="163.5" class="okm">members</text>
  <rect x="260" y="66" width="160" height="106" rx="6" class="box"/>
  <rect x="260" y="66" width="160" height="28" rx="6" class="thead"/>
  <text x="340.0" y="85" class="mb" text-anchor="middle">MEMBER</text>
  <text x="272" y="111.5" class="m">MEMBER_ID</text>
  <text x="272" y="137.5" class="m">USERNAME</text>
  <rect x="264" y="149" width="152" height="20" rx="4" class="bad"/>
  <text x="272" y="163.5" class="badm">TEAM_ID (FK)</text>
  <line x1="204" y1="159.0" x2="256" y2="159.0" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="30" y="210" class="note">주인인 Team.members가 관리하는</text>
  <text x="30" y="228" class="note">외래 키가 MEMBER 테이블에 있습니다.</text>
  <text x="460" y="62" class="sub">실행되는 SQL</text>
  <rect x="460" y="70" width="270" height="34" rx="8" class="box"/>
  <text x="595.0" y="91.5" class="m" text-anchor="middle">INSERT MEMBER</text>
  <line x1="595" y1="104" x2="595" y2="114" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="460" y="116" width="270" height="34" rx="8" class="box"/>
  <text x="595.0" y="137.5" class="m" text-anchor="middle">INSERT TEAM</text>
  <line x1="595" y1="150" x2="595" y2="160" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="460" y="162" width="270" height="34" rx="8" class="bad"/>
  <text x="595.0" y="183.5" class="badt" text-anchor="middle">UPDATE MEMBER — <tspan font-family="Menlo, Consolas, monospace">TEAM_ID</tspan> 설정</text>
  <text x="460" y="220" class="note">연관관계 관리를 위해 UPDATE가</text>
  <text x="460" y="238" class="note">한 번 더 실행됩니다.</text>
  <rect x="10" y="272" width="740" height="190" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="304" class="h">@JoinColumn이 없으면 — 중간에 연결 테이블이 추가된다</text>
  <rect x="30" y="328" width="160" height="80" rx="6" class="box"/>
  <rect x="30" y="328" width="160" height="28" rx="6" class="thead"/>
  <text x="110.0" y="347" class="mb" text-anchor="middle">TEAM</text>
  <text x="42" y="373.5" class="m">TEAM_ID (PK)</text>
  <text x="42" y="399.5" class="m">NAME</text>
  <rect x="280" y="328" width="200" height="80" rx="6" class="bad"/>
  <text x="380" y="347" class="badt" text-anchor="middle">연결 테이블</text>
  <text x="380" y="376" class="note" text-anchor="middle">팀 외래 키</text>
  <text x="380" y="398" class="note" text-anchor="middle">회원 외래 키</text>
  <rect x="570" y="328" width="160" height="80" rx="6" class="box"/>
  <rect x="570" y="328" width="160" height="28" rx="6" class="thead"/>
  <text x="650.0" y="347" class="mb" text-anchor="middle">MEMBER</text>
  <text x="582" y="373.5" class="m">MEMBER_ID (PK)</text>
  <text x="582" y="399.5" class="m">USERNAME</text>
  <line x1="194" y1="369.0" x2="276" y2="372" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="484" y1="394" x2="566" y2="369.0" stroke="#dc2626" stroke-width="1.6"/>
  <text x="30" y="446" class="foot">조인 테이블 방식이 되어 TEAM과 MEMBER 사이에 테이블이 하나 더 생깁니다.</text>
</svg>
