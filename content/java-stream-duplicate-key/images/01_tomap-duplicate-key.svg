<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 496" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>스트림 요소 A=1, B=2, C=3, D=4, D=5를 toMap으로 모을 때, 위쪽은 Merge Function이 없어 두 번째 D에서 IllegalStateException이 발생하는 흐름, 아래쪽은 (v1, v2) -&gt; v1 + v2로 D의 값 4와 5를 9로 병합하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .lab { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .badm { font-size: 12.5px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
    <rect width="760" height="496" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="230" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">Merge Function 없음 — 두 번째 D에서 예외</text>
  <text x="30" y="64" class="code">toMap(Map.Entry::getKey, Map.Entry::getValue)</text>
  <text x="30" y="103" class="lane">스트림 요소</text>
  <text x="30" y="163" class="lane">Map에 넣기</text>
  <text x="30" y="181" class="sub">요소마다 차례로</text>
  <rect x="150" y="78" width="585" height="40" rx="6" class="track"/>
  <rect x="150" y="138" width="585" height="56" rx="6" class="track"/>
  <rect x="157.5" y="82" width="105" height="32" rx="6" class="dbbox"/>
  <text x="210" y="103" class="op" text-anchor="middle">A=1</text>
  <line x1="210" y1="115" x2="210" y2="138" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="157.5" y="140" width="105" height="52" rx="8" class="box"/>
  <text x="210" y="161" class="op" text-anchor="middle">A=1</text>
  <text x="210" y="180" class="val" text-anchor="middle">새 키 — 저장</text>
  <rect x="274.5" y="82" width="105" height="32" rx="6" class="dbbox"/>
  <text x="327" y="103" class="op" text-anchor="middle">B=2</text>
  <line x1="327" y1="115" x2="327" y2="138" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="274.5" y="140" width="105" height="52" rx="8" class="box"/>
  <text x="327" y="161" class="op" text-anchor="middle">B=2</text>
  <text x="327" y="180" class="val" text-anchor="middle">새 키 — 저장</text>
  <rect x="391.5" y="82" width="105" height="32" rx="6" class="dbbox"/>
  <text x="444" y="103" class="op" text-anchor="middle">C=3</text>
  <line x1="444" y1="115" x2="444" y2="138" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="391.5" y="140" width="105" height="52" rx="8" class="box"/>
  <text x="444" y="161" class="op" text-anchor="middle">C=3</text>
  <text x="444" y="180" class="val" text-anchor="middle">새 키 — 저장</text>
  <rect x="508.5" y="82" width="105" height="32" rx="6" class="dbbox"/>
  <text x="561" y="103" class="op" text-anchor="middle">D=4</text>
  <line x1="561" y1="115" x2="561" y2="138" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="508.5" y="140" width="105" height="52" rx="8" class="box"/>
  <text x="561" y="161" class="op" text-anchor="middle">D=4</text>
  <text x="561" y="180" class="val" text-anchor="middle">새 키 — 저장</text>
  <rect x="625.5" y="82" width="105" height="32" rx="6" class="dbbox"/>
  <text x="678" y="103" class="op" text-anchor="middle">D=5</text>
  <line x1="678" y1="115" x2="678" y2="138" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="625.5" y="140" width="105" height="52" rx="8" class="bad"/>
  <text x="678" y="161" class="badt" text-anchor="middle">D 이미 있음</text>
  <text x="678" y="180" class="note" text-anchor="middle">예외 발생</text>
  <line x1="615.5" y1="166" x2="623.5" y2="166" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="150" y="222" class="badm">IllegalStateException: Duplicate key D (attempted merging values 4 and 5)</text>
  <rect x="10" y="256" width="740" height="230" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="288" class="h">Merge Function 있음 — 같은 키의 값을 병합</text>
  <text x="30" y="310" class="code">toMap(Map.Entry::getKey, Map.Entry::getValue, (v1, v2) -&gt; v1 + v2)</text>
  <text x="30" y="349" class="lane">스트림 요소</text>
  <text x="30" y="409" class="lane">Map에 넣기</text>
  <text x="30" y="427" class="sub">요소마다 차례로</text>
  <rect x="150" y="324" width="585" height="40" rx="6" class="track"/>
  <rect x="150" y="384" width="585" height="56" rx="6" class="track"/>
  <rect x="157.5" y="328" width="105" height="32" rx="6" class="dbbox"/>
  <text x="210" y="349" class="op" text-anchor="middle">A=1</text>
  <line x1="210" y1="361" x2="210" y2="384" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="157.5" y="386" width="105" height="52" rx="8" class="box"/>
  <text x="210" y="407" class="op" text-anchor="middle">A=1</text>
  <text x="210" y="426" class="val" text-anchor="middle">새 키 — 저장</text>
  <rect x="274.5" y="328" width="105" height="32" rx="6" class="dbbox"/>
  <text x="327" y="349" class="op" text-anchor="middle">B=2</text>
  <line x1="327" y1="361" x2="327" y2="384" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="274.5" y="386" width="105" height="52" rx="8" class="box"/>
  <text x="327" y="407" class="op" text-anchor="middle">B=2</text>
  <text x="327" y="426" class="val" text-anchor="middle">새 키 — 저장</text>
  <rect x="391.5" y="328" width="105" height="32" rx="6" class="dbbox"/>
  <text x="444" y="349" class="op" text-anchor="middle">C=3</text>
  <line x1="444" y1="361" x2="444" y2="384" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="391.5" y="386" width="105" height="52" rx="8" class="box"/>
  <text x="444" y="407" class="op" text-anchor="middle">C=3</text>
  <text x="444" y="426" class="val" text-anchor="middle">새 키 — 저장</text>
  <rect x="508.5" y="328" width="105" height="32" rx="6" class="dbbox"/>
  <text x="561" y="349" class="op" text-anchor="middle">D=4</text>
  <line x1="561" y1="361" x2="561" y2="384" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="508.5" y="386" width="105" height="52" rx="8" class="box"/>
  <text x="561" y="407" class="op" text-anchor="middle">D=4</text>
  <text x="561" y="426" class="val" text-anchor="middle">새 키 — 저장</text>
  <rect x="625.5" y="328" width="105" height="32" rx="6" class="dbbox"/>
  <text x="678" y="349" class="op" text-anchor="middle">D=5</text>
  <line x1="678" y1="361" x2="678" y2="384" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="625.5" y="386" width="105" height="52" rx="8" class="ok"/>
  <text x="678" y="407" class="okc" text-anchor="middle">D=9</text>
  <text x="678" y="426" class="val" text-anchor="middle">D=4와 병합</text>
  <line x1="615.5" y1="412" x2="623.5" y2="412" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="150" y="468" class="gnote">결과: <tspan font-family="Menlo, Consolas, monospace">{A=1, B=2, C=3, D=9}</tspan> — <tspan font-family="Menlo, Consolas, monospace">v1</tspan>은 먼저 저장된 값, <tspan font-family="Menlo, Consolas, monospace">v2</tspan>는 새로 들어온 값</text>
</svg>
