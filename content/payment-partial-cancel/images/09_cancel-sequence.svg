<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>5장 완성 코드의 취소 요청 — 클라이언트가 Idempotency-Key 헤더와 cancelAmount, cancelReason을 담아 POST /{orderId}/cancel을 보내면, 결제 서버는 짧은 트랜잭션 안에서 결제를 조회하고 키와 사유를 확인하고 같은 키의 취소가 없는지와 받을 수 있는 취소인지 본 뒤 payment_cancel에 REQUESTED를 기록해 커밋한다. 트랜잭션 밖에서 Mock PG에 POST /v1/payments/{paymentKey}/cancel을 같은 Idempotency-Key로 보내고, 200 Payment(balanceAmount, cancels)를 받으면 다른 짧은 트랜잭션에서 DONE과 transaction_key, balance_after를 커밋하며 남은 금액이 0원이면 결제를 취소 상태로 바꾸고, 200과 cancelStatus DONE, balanceAmount로 답한다. 키·사유 오류는 400, 결제가 없으면 404, 같은 키 다른 내용은 422, 받을 수 없는 취소는 409 또는 400이고 모두 PG를 부르지 않으며, PG가 4xx면 FAILED와 200, 시간 초과면 UNKNOWN과 504, 5xx면 502로 답하고 취소는 결과를 기다리는 상태 그대로 둔다(첫 요청이면 REQUESTED, 결과 모름 취소를 같은 키로 다시 보낸 경우면 UNKNOWN)</title>
