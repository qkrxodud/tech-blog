<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 368" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>join은 validateDuplicateMember에서 findByName으로 같은 이름의 회원을 찾아, 없으면 저장하고 id를 반환하고, 있으면 IllegalStateException을 던져 저장하지 않는 두 경우</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .mxs { font-size: 11px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .chip { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .gscope { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="368" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="166" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">정상 — 이름이 hello인 회원 가입</text>
  <text x="730" y="42" class="code" text-anchor="end">join(member1)</text>
  <rect x="30" y="66" width="160" height="64" rx="8" class="box"/>
  <text x="110.0" y="86.0" class="ms" text-anchor="middle">validateDuplicate</text>
  <text x="110.0" y="103.0" class="ms" text-anchor="middle">Member(member)</text>
  <text x="110.0" y="120.0" class="val" text-anchor="middle">중복 회원 검증</text>
  <line x1="192" y1="98" x2="207" y2="98" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="210" y="66" width="160" height="64" rx="8" class="box"/>
  <text x="290.0" y="86.0" class="ms" text-anchor="middle">findByName("hello")</text>
  <text x="290.0" y="103.0" class="val" text-anchor="middle">같은 이름 회원</text>
  <text x="290.0" y="120.0" class="val" text-anchor="middle">없음</text>
  <line x1="372" y1="98" x2="387" y2="98" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="390" y="66" width="160" height="64" rx="8" class="box"/>
  <text x="470.0" y="94.0" class="mb" text-anchor="middle">save(member)</text>
  <text x="470.0" y="113.0" class="val" text-anchor="middle">저장소에 저장</text>
  <line x1="552" y1="98" x2="567" y2="98" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="570" y="66" width="160" height="64" rx="8" class="ok"/>
  <text x="650.0" y="94.0" class="okt" text-anchor="middle">id 반환</text>
  <text x="650.0" y="113.0" class="ms" text-anchor="middle">member.getId()</text>
  <text x="30" y="158" class="foot">중복 회원이 없으면 저장한 뒤 회원의 id를 반환합니다.</text>
  <rect x="10" y="192" width="740" height="166" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="224" class="h">중복 — 같은 이름 spring으로 두 번 가입</text>
  <text x="730" y="224" class="code" text-anchor="end">join(member2)</text>
  <rect x="30" y="248" width="160" height="64" rx="8" class="box"/>
  <text x="110.0" y="268.0" class="ms" text-anchor="middle">validateDuplicate</text>
  <text x="110.0" y="285.0" class="ms" text-anchor="middle">Member(member)</text>
  <text x="110.0" y="302.0" class="val" text-anchor="middle">중복 회원 검증</text>
  <line x1="192" y1="280" x2="207" y2="280" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="210" y="248" width="160" height="64" rx="8" class="box"/>
  <text x="290.0" y="268.0" class="ms" text-anchor="middle">findByName("spring")</text>
  <text x="290.0" y="285.0" class="val" text-anchor="middle">먼저 가입한</text>
  <text x="290.0" y="302.0" class="val" text-anchor="middle">member1 있음</text>
  <line x1="372" y1="280" x2="387" y2="280" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="390" y="248" width="160" height="64" rx="8" class="bad"/>
  <text x="470.0" y="276.0" class="badm" text-anchor="middle">ifPresent</text>
  <text x="470.0" y="295.0" class="note" text-anchor="middle">예외 던짐</text>
  <line x1="552" y1="280" x2="567" y2="280" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="570" y="248" width="160" height="64" rx="8" class="bad"/>
  <text x="650.0" y="268.0" class="badm" text-anchor="middle">IllegalState</text>
  <text x="650.0" y="285.0" class="badm" text-anchor="middle">Exception</text>
  <text x="650.0" y="302.0" class="note" text-anchor="middle">저장 안 됨</text>
  <text x="30" y="340" class="foot">예외 메시지는 "이미 존재하는 회원입니다."이고, save까지 가지 않습니다.</text>
</svg>
