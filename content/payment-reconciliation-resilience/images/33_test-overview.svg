  <text x="58" y="272" class="t2" style="font-size:11.5px">커버리지(JaCoCo) — 결제 서버만 · 시작 클래스 제외 · 기준 90%</text>
  <text x="58" y="296" class="s2" style="font-size:12px;fill:#1e3a8a;font-weight:700">INSTRUCTION 97.3% · BRANCH 93.5% · LINE 96.8%</text>
  <rect x="478" y="250" width="270" height="66" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="490" y="272" class="gt" style="font-size:11.5px">주문 서비스·재고 서비스 모듈</text>
  <text x="490" y="290" class="gs" style="font-size:10.5px">커버리지 검사 밖 — 결정 5의 실패 모음 수·</text>
  <text x="490" y="306" class="gs" style="font-size:10.5px">정리 코드는 위 수치에 들어 있지 않음</text>
