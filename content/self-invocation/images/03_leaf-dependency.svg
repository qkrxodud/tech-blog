<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>REQUIRES_NEW 메서드를 동료 Service로 빼면 나중에 반대 방향 의존이 생겨 순환 참조가 될 수 있고, Repository에만 의존하는 leaf 컴포넌트로 빼면 의존이 서비스로 돌아오지 않는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 13.5px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 13.5px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badw { fill: #ffffff; stroke: #dc2626; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .badt { font-size: 13.5px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="448" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="206" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">Service → Service — 반대 방향 의존이 생기면 순환</text>
  <rect x="60" y="84" width="180" height="56" rx="8" class="box"/>
  <text x="150" y="117" class="op" text-anchor="middle">OrderService</text>
  <rect x="360" y="84" width="180" height="56" rx="8" class="box"/>
  <text x="450" y="117" class="t" text-anchor="middle">동료 Service</text>
  <line x1="242" y1="104" x2="358" y2="104" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="300" y="96" class="sub" text-anchor="middle">주입·호출</text>
  <path d="M 450 142 C 450 186, 150 186, 150 146" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="300" y="200" class="note" text-anchor="middle">나중에 생긴 반대 방향 의존 — 순환 참조</text>
  <text x="570" y="108" class="foot">지금은 괜찮아도</text>
  <text x="570" y="126" class="foot">사이클로 번질 수 있음</text>
  <rect x="10" y="232" width="740" height="206" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="264" class="h">leaf 컴포넌트 — Repository에만 의존한다</text>
  <rect x="30" y="300" width="170" height="56" rx="8" class="box"/>
  <text x="115" y="333" class="op" text-anchor="middle">OrderService</text>
  <rect x="270" y="300" width="190" height="56" rx="8" class="ok"/>
  <text x="365" y="324" class="okc" text-anchor="middle">OrderLogWriter</text>
  <text x="365" y="344" class="val" text-anchor="middle">leaf, REQUIRES_NEW</text>
  <rect x="530" y="300" width="200" height="56" rx="8" class="box"/>
  <text x="630" y="333" class="op" text-anchor="middle">OrderLogRepository</text>
  <line x1="202" y1="328" x2="268" y2="328" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="462" y1="328" x2="528" y2="328" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="235" y="318" class="sub" text-anchor="middle">프록시</text>
  <text x="30" y="394" class="gnote">어떤 Service도 주입받지 않으므로 의존 그래프의 말단입니다</text>
  <text x="30" y="414" class="foot">다른 빈을 부르는 외부 호출이라 프록시를 거쳐 REQUIRES_NEW가 동작합니다</text>
</svg>
