<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>시각을 남기는 방식과 앞 장 코드·시험에서 바뀐 것 — 같은 MySQL(컨테이너 시간대 UTC)에 JPA Instant로 남긴 authenticated_at·occurred_at·changed_at은 UTC, JDBC Timestamp.from으로 남긴 sent_at·received_at·job_lock은 이 JVM 시간대(KST), 재고 서비스 processed_at은 UTC LocalDateTime이라, 결정 1 커밋의 대사가 인증한 때를 Timestamp로 넘겨 authenticated_at과 9시간 어긋났고 결정 3 커밋에서 findAuthenticatedBetween이 utc(from)·utc(to)로 넘기게 고침. 출발 구조 계약 세 곳을 뒤 커밋에서 고치고(ch12-start 태그는 그대로), 시험 도구 4곳이 이력을 먼저 지우게 하고(처음에 빠뜨려 4장 보정 계약 14개 실패), 시험은 차단기·대사 일정·정리 일정을 기본으로 끄며, 결제를 바꾸는 기록 셋이 이력을 남기고 Mock PG에 forgetPayments를 더한 그림</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
