  <rect width="760" height="540" fill="#ffffff"/>
  <text x="24" y="28" class="h">결정 4 — 예약 답을 받지 못하면 어떻게 할까</text>
  <text x="24" y="48" class="gs" style="font-size:11.5px">결제 서버가 시간 제한으로 답을 받지 못했을 때, 재고 서비스 쪽에서 실제로 일어난 일 네 가지 · 칸의 재고 = 남은 재고 + 승인이 남은 결제의 수량(처음 5)</text>
  <rect x="192" y="62" width="182" height="46" rx="10" fill="#f9fafb" stroke="#16a34a" stroke-width="3"/>
  <text x="204" y="81" class="t2">닫고 해제를 보냄</text>
  <text x="204" y="99" class="oks" style="font-size:10px;font-weight:700">이 장에서 고름 · 운영</text>
  <rect x="378" y="62" width="182" height="46" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="390" y="81" class="t2">조회로 확인 뒤 진행</text>
  <text x="390" y="99" class="gs" style="font-size:10px">비교 · <tspan class="m">GET /reservations/{id}</tspan></text>
  <rect x="564" y="62" width="182" height="46" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="576" y="81" class="t2">실패로만 봄</text>
