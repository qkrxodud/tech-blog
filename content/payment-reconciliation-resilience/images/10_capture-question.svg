  <rect width="760" height="440" fill="#ffffff"/>
  <text x="24" y="28" class="h">1장이 남긴 질문 — 12장 대사에 매입 상태가 다시 필요한가</text>
  <text x="24" y="48" class="gs" style="font-size:11.5px">1장: “12장 대사에서 매입 상태가 다시 필요해지는지 확인할 예정”</text>
  <rect x="14" y="64" width="236" height="270" rx="12" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <use href="#i-server" transform="translate(26,76) scale(0.75)"/>
  <text x="62" y="92" class="t2">거래 조회 <tspan class="m">status</tspan></text>
  <text x="30" y="122" class="s2" style="font-size:11px;fill:#1f2937"><tspan class="m">READY</tspan></text><text x="30" y="141" class="s2" style="font-size:11px;fill:#1f2937"><tspan class="m">IN_PROGRESS</tspan></text><text x="30" y="160" class="s2" style="font-size:11px;fill:#1f2937"><tspan class="m">WAITING_FOR_DEPOSIT</tspan></text><text x="30" y="179" class="s2" style="font-size:11px;fill:#1f2937"><tspan class="m">DONE</tspan></text><text x="30" y="198" class="s2" style="font-size:11px;fill:#1f2937"><tspan class="m">CANCELED</tspan></text><text x="30" y="217" class="s2" style="font-size:11px;fill:#1f2937"><tspan class="m">PARTIAL_CANCELED</tspan></text><text x="30" y="236" class="s2" style="font-size:11px;fill:#1f2937"><tspan class="m">ABORTED</tspan></text><text x="30" y="255" class="s2" style="font-size:11px;fill:#1f2937"><tspan class="m">EXPIRED</tspan></text>
  <rect x="26" y="284" width="212" height="34" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/><text x="132" y="305" class="s2" text-anchor="middle" style="fill:#b91c1c;font-size:11.5px;font-weight:700">매입 단계 없음</text>
  <rect x="264" y="64" width="236" height="270" rx="12" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <use href="#i-chips" transform="translate(276,78) scale(0.75)"/>
  <text x="312" y="92" class="t2">대사가 보는 단계</text>
  <rect x="280" y="118" width="204" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><text x="382" y="142" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">우리 결제 <tspan class="m">CAPTURED</tspan>(매입)</text>
  <line x1="382" y1="160" x2="382" y2="196" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="280" y="198" width="204" height="40" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/><text x="382" y="222" class="s2" text-anchor="middle" style="fill:#15803d;font-size:11.5px;font-weight:700">대사 단계 “승인”</text>
  <text x="280" y="264" class="gs" style="font-size:10.5px">승인과 같은 단계로 봄</text><text x="280" y="281" class="gs" style="font-size:10.5px">단위 시험 “매입한 결제는 카드사</text><text x="280" y="298" class="gs" style="font-size:10.5px">승인과 같은 단계로 본다”</text>
  <rect x="514" y="64" width="234" height="270" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <use href="#i-app" transform="translate(526,76) scale(0.75)"/>
  <text x="562" y="92" class="gt">운영 코드</text>
  <rect x="528" y="118" width="206" height="64" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <use href="#xs" x="546" y="140"/>
  <text x="560" y="144" class="gt" style="font-size:11.5px"><tspan class="m">capture()</tspan>를 부르는</text>
  <text x="546" y="166" class="gt" style="font-size:11.5px">흐름 없음</text>
  <text x="528" y="210" class="gs" style="font-size:11px">시험만 부름</text>
  <text x="528" y="232" class="gs" style="font-size:11px">이 장에서도 매입 흐름은</text>
  <text x="528" y="250" class="gs" style="font-size:11px">만들지 않음</text>
  <line x1="14" y1="352" x2="748" y2="352" stroke="#9ca3af" stroke-width="1"/>
  <rect x="14" y="366" width="734" height="58" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="36" y="395"/>
  <text x="54" y="391" class="okt">이 대사에는 매입 상태가 필요하지 않았음</text>
  <text x="54" y="411" class="oks" style="font-size:11px">매입 흐름이 없는 것은 남은 한계로 둠</text>
</svg>
