<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>위쪽은 락을 얻은 요청 하나만 DB를 조회해 캐시를 저장하고 나머지는 기다렸다가 갱신된 캐시를 읽는 Lock 방식, 아래쪽은 배치가 만료 전에 캐시를 미리 적재하지만 누락된 키는 다시 miss가 나는 캐시 웜업</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .subc { font-size: 12px; fill: #6b7280; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .valc { font-size: 12.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .lbl { font-size: 12px; font-weight: 700; fill: #6b7280; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .codek { font-size: 13px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="540" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="252" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">Lock 방식 — 락을 얻은 요청 하나만 DB 조회</text>
  <text x="730" y="42" class="codek" text-anchor="end">분산락</text>
  <text x="220" y="68" class="step" text-anchor="middle">1단계</text>
  <text x="360" y="68" class="step" text-anchor="middle">2단계</text>
  <text x="500" y="68" class="step" text-anchor="middle">3단계</text>
  <text x="640" y="68" class="step" text-anchor="middle">4단계</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">요청 1</text>
  <text x="30" y="126" class="sub">락 획득</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="162.0" y="88" width="116" height="48" rx="8" class="ok"/>
  <text x="220" y="108" class="okt" text-anchor="middle">락 획득</text>
  <text x="220" y="127" class="val" text-anchor="middle">캐시 만료 시점</text>
  <rect x="302.0" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="360" y="108" class="t" text-anchor="middle">DB 조회</text>
  <text x="360" y="127" class="val" text-anchor="middle">단일 요청만</text>
  <rect x="442.0" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="500" y="108" class="t" text-anchor="middle">캐시 저장</text>
  <text x="500" y="127" class="val" text-anchor="middle">Redis 갱신</text>
  <rect x="582.0" y="88" width="116" height="48" rx="8" class="hold"/>
  <text x="640" y="108" class="t" text-anchor="middle">락 해제</text>
  <text x="640" y="127" class="val" text-anchor="middle">응답</text>
  <text x="30" y="168" class="lane">요청 2</text>
  <text x="30" y="186" class="sub">락 획득 실패</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="162.0" y="148" width="116" height="48" rx="8" class="bad"/>
  <text x="220" y="168" class="badt" text-anchor="middle">획득 실패</text>
  <text x="220" y="187" class="val" text-anchor="middle">다른 요청이 보유</text>
  <rect x="302" y="156" width="256" height="32" rx="6" class="wait"/>
  <text x="430.0" y="177" class="waitt" text-anchor="middle">대기 — 응답 지연</text>
  <rect x="582.0" y="148" width="116" height="48" rx="8" class="ok"/>
  <text x="640" y="168" class="okc" text-anchor="middle">cache hit</text>
  <text x="640" y="187" class="val" text-anchor="middle">갱신된 캐시</text>
  <line x1="540" y1="136" x2="600" y2="148" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="150" y="214" width="288" height="32" rx="15" class="ok"/>
  <text x="294.0" y="235" class="okt" text-anchor="middle">DB 조회는 한 번 — DB 부하 감소</text>
  <rect x="448" y="214" width="287" height="32" rx="15" class="bad"/>
  <text x="591.5" y="235" class="badt" text-anchor="middle">대기한 요청은 응답 지연</text>
  <rect x="10" y="278" width="740" height="252" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="310" class="h">캐시 웜업 — 배치로 캐시를 미리 채움</text>
  <text x="730" y="310" class="code" text-anchor="end">batch</text>
  <text x="220" y="336" class="step" text-anchor="middle">1단계</text>
  <text x="360" y="336" class="step" text-anchor="middle">2단계</text>
  <text x="500" y="336" class="step" text-anchor="middle">3단계</text>
  <text x="640" y="336" class="step" text-anchor="middle">4단계</text>
  <line x1="160" y1="344" x2="722" y2="344" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="376" class="lane">배치</text>
  <text x="30" y="394" class="sub">자주 쓰는 데이터</text>
  <rect x="150" y="354" width="585" height="52" rx="6" class="track"/>
  <rect x="162.0" y="356" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="376" class="t" text-anchor="middle">배치 실행</text>
  <text x="220" y="395" class="val" text-anchor="middle">특정 시점</text>
  <rect x="302.0" y="356" width="116" height="48" rx="8" class="ok"/>
  <text x="360" y="376" class="okt" text-anchor="middle">캐시 적재</text>
  <text x="360" y="395" class="val" text-anchor="middle">리모트 캐시</text>
  <text x="30" y="436" class="lane">사용자 요청</text>
  <rect x="150" y="414" width="585" height="52" rx="6" class="track"/>
  <rect x="442.0" y="416" width="116" height="48" rx="8" class="ok"/>
  <text x="500" y="436" class="okc" text-anchor="middle">cache hit</text>
  <text x="500" y="455" class="val" text-anchor="middle">적재된 데이터</text>
  <rect x="582.0" y="416" width="116" height="48" rx="8" class="bad"/>
  <text x="640" y="436" class="badc" text-anchor="middle">cache miss</text>
  <text x="640" y="455" class="val" text-anchor="middle">웜업 대상 누락</text>
  <line x1="380" y1="404" x2="470" y2="416" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="150" y="482" width="288" height="32" rx="15" class="bad"/>
  <text x="294.0" y="503" class="badt" text-anchor="middle">리모트 캐시 서버 부하 — 응답 지연</text>
  <rect x="448" y="482" width="287" height="32" rx="15" class="bad"/>
  <text x="591.5" y="503" class="badt" text-anchor="middle">누락 시 Stampede 재발</text>
</svg>
