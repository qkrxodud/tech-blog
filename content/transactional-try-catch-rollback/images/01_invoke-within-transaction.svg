<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>invokeWithinTransaction이 트랜잭션을 시작하고 대상 메서드를 호출한 뒤 예외면 rollbackOn으로 롤백 여부를 판단하고 정상 반환이면 커밋하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .cellt { font-size: 14px; font-weight: 700; fill: #374151; }
    .colh { font-size: 13px; font-weight: 700; fill: #4b5563; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="450" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="430" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">invokeWithinTransaction — 트랜잭션 시작부터 커밋·롤백까지</text>
  <text x="730" y="42" class="code" text-anchor="end">TransactionAspectSupport</text>
  <text x="195" y="74" class="colh" text-anchor="middle">프록시 (TransactionInterceptor)</text>
  <text x="590" y="74" class="colh" text-anchor="middle">대상 객체 (service)</text>
  <rect x="40" y="86" width="310" height="52" rx="8" class="box"/>
  <text x="195" y="108" class="cellt" text-anchor="middle">1. 트랜잭션 시작</text>
  <text x="195" y="127" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace" font-size="12">createTransactionIfNecessary()</tspan></text>
  <line x1="195" y1="138" x2="195" y2="164" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="40" y="166" width="310" height="52" rx="8" class="box"/>
  <text x="195" y="188" class="cellt" text-anchor="middle">2. 대상 메서드 호출</text>
  <text x="195" y="207" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace" font-size="12">invocation.proceedWithInvocation()</tspan></text>
  <rect x="450" y="166" width="280" height="52" rx="8" class="hold"/>
  <text x="590" y="188" class="cellt" text-anchor="middle">save() 실행</text>
  <text x="590" y="207" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace" font-size="12">repository.save(object)</tspan></text>
  <line x1="350" y1="184" x2="448" y2="184" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="448" y1="204" x2="352" y2="204" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="400" y="160" class="sub" text-anchor="middle">예외 또는 반환</text>
  <line x1="150" y1="218" x2="110" y2="260" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="330" y1="218" x2="520" y2="260" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="160" y="248" class="note">예외가 올라옴</text>
  <text x="540" y="250" class="gnote">정상 반환</text>
  <rect x="30" y="262" width="330" height="52" rx="8" class="box"/>
  <text x="195" y="284" class="cellt" text-anchor="middle">3. catch (Throwable ex)</text>
  <text x="195" y="303" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace" font-size="12">completeTransactionAfterThrowing()</tspan></text>
  <rect x="400" y="262" width="330" height="52" rx="8" class="box"/>
  <text x="565" y="284" class="cellt" text-anchor="middle">3. try 블록 종료</text>
  <text x="565" y="303" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace" font-size="12">commitTransactionAfterReturning()</tspan></text>
  <line x1="195" y1="314" x2="195" y2="338" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="565" y1="314" x2="565" y2="338" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="30" y="340" width="330" height="52" rx="8" class="hold"/>
  <text x="195" y="362" class="cellt" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">rollbackOn(ex)</tspan>로 판단</text>
  <text x="195" y="381" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace" font-size="12">true</tspan>면 롤백, <tspan font-family="Menlo, Consolas, monospace" font-size="12">false</tspan>면 커밋</text>
  <rect x="400" y="340" width="330" height="52" rx="8" class="ok"/>
  <text x="565" y="371" class="okt" text-anchor="middle">커밋</text>
  <text x="30" y="424" class="sub">대상 메서드의 예외가 프록시까지 올라와야 catch로 들어가 롤백 여부를 판단합니다.</text>

</svg>
