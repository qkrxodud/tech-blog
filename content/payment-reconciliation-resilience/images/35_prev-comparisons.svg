  <text x="58" y="350" class="okt" style="font-size:12px">그 밖의 2~11장 비교 클래스는 시험 수·실패 수가 11장 기록과 같음</text>
  <text x="58" y="370" class="gs" style="font-size:10.5px">시험은 차단기를 기본으로 꺼 두어 앞 장 비교의 승인은 11장과 같게 감</text>
