<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>기존 애그리거트의 기능을 실행할 때는 리포지터리에서 애그리거트를 구하고 도메인 기능을 실행한 뒤 결과를 리턴하고, 새 애그리거트를 만들 때는 값을 검사하고 애그리거트를 생성해 저장한 뒤 결과를 리턴하는 응용 서비스의 두 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .op2 { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #1f2937; }
    .okc2 { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badc2 { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .monoxs { font-family: Menlo, Consolas, monospace; font-size: 11.5px; fill: #374151; }
    .monos { font-family: Menlo, Consolas, monospace; font-size: 12.5px; fill: #374151; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="760" height="376" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="170" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">기존 애그리거트의 기능 실행 — doSomeFunc</text>
  <text x="730" y="42" class="code" text-anchor="end">doSomeFunc(req)</text>
  <rect x="40" y="66" width="210" height="58" rx="8" class="box"/>
  <text x="145" y="90" class="t" text-anchor="middle">1. 애그리거트 구함</text>
  <text x="145" y="110" class="monos" text-anchor="middle">findById(id)</text>
  <line x1="252" y1="95" x2="272" y2="95" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#agy)"/>
  <rect x="274" y="66" width="210" height="58" rx="8" class="ok"/>
  <text x="379" y="90" class="okt" text-anchor="middle">2. 도메인 기능 실행</text>
  <text x="379" y="110" class="monos" text-anchor="middle">agg.doFunc(value)</text>
  <line x1="486" y1="95" x2="506" y2="95" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#agy)"/>
  <rect x="508" y="66" width="210" height="58" rx="8" class="box"/>
  <text x="613" y="90" class="t" text-anchor="middle">3. 결과 리턴</text>
  <text x="613" y="110" class="monos" text-anchor="middle">createSuccessResult</text>
  <text x="40" y="158" class="gnote">응용 서비스는 순서만 제어하고, 판단은 애그리거트의 도메인 기능이 함</text>
  <rect x="10" y="196" width="740" height="170" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="228" class="h">새 애그리거트 생성 — doSomeCreation</text>
  <text x="730" y="228" class="code" text-anchor="end">doSomeCreation(req)</text>
  <rect x="40" y="252" width="152" height="58" rx="8" class="box"/>
  <text x="116" y="276" class="t" text-anchor="middle">1. 값 검사</text>
  <text x="116" y="296" class="monos" text-anchor="middle">validate(req)</text>
  <line x1="194" y1="281" x2="214" y2="281" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#agy)"/>
  <rect x="216" y="252" width="152" height="58" rx="8" class="ok"/>
  <text x="292" y="276" class="okt" text-anchor="middle">2. 애그리거트 생성</text>
  <text x="292" y="296" class="monos" text-anchor="middle">createSome(req)</text>
  <line x1="370" y1="281" x2="390" y2="281" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#agy)"/>
  <rect x="392" y="252" width="152" height="58" rx="8" class="box"/>
  <text x="468" y="276" class="t" text-anchor="middle">3. 저장</text>
  <text x="468" y="296" class="monos" text-anchor="middle">save(newAgg)</text>
  <line x1="546" y1="281" x2="566" y2="281" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#agy)"/>
  <rect x="568" y="252" width="152" height="58" rx="8" class="box"/>
  <text x="644" y="276" class="t" text-anchor="middle">4. 결과 리턴</text>
  <text x="644" y="296" class="monos" text-anchor="middle">createSuccess…</text>
  <text x="40" y="344" class="gnote">저장할 애그리거트를 만드는 일도 도메인 객체가 맡음</text>
</svg>
