<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>V4는 주문을 조회한 뒤 주문마다 findOrderItems를 실행해 루트 1번과 컬렉션 N번, V5는 주문 id를 모아 IN 절로 주문 상품을 한 번에 조회한 뒤 Map으로 매칭해 루트 1번과 컬렉션 1번, V6는 주문과 주문 상품을 모두 조인한 플랫 데이터를 한 번에 조회한 뒤 애플리케이션에서 groupingBy로 묶어 쿼리 1번이지만 중복 데이터 전송과 페이징 불가가 단점인 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="452" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="432" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h" text-anchor="start">DTO 직접 조회 — V4, V5, V6 비교</text>
  <rect x="30" y="62" width="220" height="364" rx="8" class="track"/>
  <text x="44" y="88" class="lane" text-anchor="start">V4</text>
  <text x="44" y="108" class="m" text-anchor="start">findOrderQueryDtos()</text>
  <rect x="40" y="120" width="200" height="50" rx="8" class="box"/>
  <text x="140.0" y="140" class="t" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">findOrders()</tspan> 1번</text>
  <text x="140.0" y="159" class="val" text-anchor="middle">ToOne 관계를 조인해 주문 조회</text>
  <line x1="140.0" y1="170" x2="140.0" y2="182" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="40" y="184" width="200" height="50" rx="8" class="bad"/>
  <text x="140.0" y="204" class="badt" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">findOrderItems()</tspan> N번</text>
  <text x="140.0" y="223" class="val" text-anchor="middle">주문마다 주문 상품 조회</text>
  <rect x="40" y="314" width="200" height="32" rx="8" class="bad"/>
  <text x="140.0" y="335.0" class="badt" text-anchor="middle">루트 1번 + 컬렉션 N번</text>
  <text x="44" y="368" class="val" text-anchor="start">· 코드가 단순함</text>
  <text x="44" y="387" class="val" text-anchor="start">· 주문 한 건 조회에 적합</text>
  <rect x="270" y="62" width="220" height="364" rx="8" class="track"/>
  <text x="284" y="88" class="lane" text-anchor="start">V5</text>
  <text x="284" y="108" class="m" text-anchor="start">finAllByDto_optimization()</text>
  <rect x="280" y="120" width="200" height="50" rx="8" class="box"/>
  <text x="380.0" y="140" class="t" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">findOrders()</tspan> 1번</text>
  <text x="380.0" y="159" class="val" text-anchor="middle">ToOne 관계를 조인해 주문 조회</text>
  <line x1="380.0" y1="170" x2="380.0" y2="182" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="280" y="184" width="200" height="50" rx="8" class="ok"/>
  <text x="380.0" y="204" class="okt" text-anchor="middle">IN 절로 1번</text>
  <text x="380.0" y="223" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">orderIds</tspan>로 주문 상품 한꺼번에</text>
  <line x1="380.0" y1="234" x2="380.0" y2="246" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="280" y="248" width="200" height="50" rx="8" class="box"/>
  <text x="380.0" y="268" class="t" text-anchor="middle">Map으로 매칭</text>
  <text x="380.0" y="287" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">groupingBy(getOrderId)</tspan></text>
  <rect x="280" y="314" width="200" height="32" rx="8" class="ok"/>
  <text x="380.0" y="335.0" class="okt" text-anchor="middle">루트 1번 + 컬렉션 1번</text>
  <text x="284" y="368" class="val" text-anchor="start">· 코드가 복잡함</text>
  <text x="284" y="387" class="val" text-anchor="start">· 여러 주문을 한꺼번에 조회</text>
  <rect x="510" y="62" width="220" height="364" rx="8" class="track"/>
  <text x="524" y="88" class="lane" text-anchor="start">V6</text>
  <text x="524" y="108" class="m" text-anchor="start">findAllByDto_flat()</text>
  <rect x="520" y="120" width="200" height="50" rx="8" class="ok"/>
  <text x="620.0" y="140" class="okt" text-anchor="middle">플랫 데이터 1번</text>
  <text x="620.0" y="159" class="val" text-anchor="middle">주문과 주문 상품을 모두 조인</text>
  <line x1="620.0" y1="170" x2="620.0" y2="182" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="520" y="184" width="200" height="50" rx="8" class="box"/>
  <text x="620.0" y="204" class="t" text-anchor="middle">애플리케이션에서 변환</text>
  <text x="620.0" y="223" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">groupingBy</tspan>로 OrderQueryDto</text>
  <rect x="520" y="314" width="200" height="32" rx="8" class="ok"/>
  <text x="620.0" y="335.0" class="okt" text-anchor="middle">쿼리 1번</text>
  <text x="524" y="368" class="note" text-anchor="start">· 중복 데이터 전송</text>
  <text x="524" y="387" class="note" text-anchor="start">· 애플리케이션 추가 작업 큼</text>
  <text x="524" y="406" class="note" text-anchor="start">· Order 기준 페이징 불가</text>
</svg>
