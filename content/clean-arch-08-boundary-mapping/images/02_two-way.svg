<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>웹 계층은 웹 모델을, 영속성 계층은 영속성 모델을 가지고 각 어댑터가 자기 모델과 Account 사이를 양방향으로 매핑하며 포트는 Account를 주고받는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 11.5px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .mok { font-size: 11.5px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .mbad { font-size: 11.5px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .pk { font-size: 12px; font-weight: 700; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .st { font-size: 11px; fill: #6b7280; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .lbl { font-size: 11.5px; fill: #6b7280; }
    .glbl { font-size: 11.5px; font-weight: 700; fill: #15803d; }
    .rlbl { font-size: 11.5px; font-weight: 700; fill: #b91c1c; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .layer { font-size: 13px; font-weight: 700; fill: #6b7280; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .pkg { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .ctx { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .sep { stroke: #c4c8ce; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .scope { fill: none; stroke: #16a34a; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .th { font-size: 13px; font-weight: 700; fill: #374151; }
    .td { font-size: 12px; fill: #374151; }
    .tdg { font-size: 12px; fill: #15803d; }
    .tdr { font-size: 12px; fill: #b91c1c; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="320" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">‘양방향’ 매핑 전략 — 어댑터마다 전용 모델과 도메인 모델을 서로 매핑</text>
  <text x="92" y="72" class="layer" text-anchor="middle">웹 계층</text>
  <text x="380" y="72" class="layer" text-anchor="middle">애플리케이션 계층</text>
  <text x="668" y="72" class="layer" text-anchor="middle">영속성 계층</text>
  <line x1="164" y1="60" x2="164" y2="256" class="sep"/>
  <line x1="596" y1="60" x2="596" y2="256" class="sep"/>
  <rect x="30.0" y="86" width="124" height="62" rx="8" class="box"/>
  <text x="92.0" y="113.5" class="m" text-anchor="middle">Account</text>
  <text x="92.0" y="128.5" class="m" text-anchor="middle">Controller</text>
  <rect x="174.0" y="86" width="124" height="62" rx="8" class="hold"/>
  <text x="236.0" y="106.0" class="st" text-anchor="middle">«interface»</text>
  <text x="236.0" y="121.0" class="m" text-anchor="middle">SendMoney</text>
  <text x="236.0" y="136.0" class="m" text-anchor="middle">UseCase</text>
  <rect x="318.0" y="86" width="124" height="62" rx="8" class="box"/>
  <text x="380.0" y="113.5" class="m" text-anchor="middle">SendMoney</text>
  <text x="380.0" y="128.5" class="m" text-anchor="middle">Service</text>
  <rect x="462.0" y="86" width="124" height="62" rx="8" class="hold"/>
  <text x="524.0" y="106.0" class="st" text-anchor="middle">«interface»</text>
  <text x="524.0" y="121.0" class="m" text-anchor="middle">UpdateAccount</text>
  <text x="524.0" y="136.0" class="m" text-anchor="middle">StatePort</text>
  <rect x="606.0" y="86" width="124" height="62" rx="8" class="box"/>
  <text x="668.0" y="106.0" class="m" text-anchor="middle">Account</text>
  <text x="668.0" y="121.0" class="m" text-anchor="middle">Persistence</text>
  <text x="668.0" y="136.0" class="m" text-anchor="middle">Adapter</text>
  <path d="M154.0,117.0 L172.0,117.0" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
  <path d="M318.0,117.0 L299.0,117.0" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tri)"/>
  <path d="M442.0,117.0 L460.0,117.0" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
  <path d="M606.0,117.0 L587.0,117.0" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tri)"/>
  <rect x="310" y="196" width="140" height="48" rx="8" class="hold"/>
  <text x="380" y="225" class="t" text-anchor="middle">Account</text>
  <path d="M236,148 L236,220 L308,220" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
  <path d="M524,148 L524,220 L452,220" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
  <rect x="30.0" y="196" width="124" height="48" rx="8" class="ok"/>
  <text x="92" y="225.0" class="okt" text-anchor="middle">웹 모델</text>
  <rect x="606.0" y="196" width="124" height="48" rx="8" class="ok"/>
  <text x="668" y="225.0" class="okt" text-anchor="middle">영속성 모델</text>
  <path d="M92,148 L92,194" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
  <path d="M668,148 L668,194" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="92" y="264" class="glbl" text-anchor="middle">웹 모델 ⇄ Account</text>
  <text x="668" y="264" class="glbl" text-anchor="middle">영속성 모델 ⇄ Account</text>
  <text x="30" y="296" class="foot">각 계층은 전용 모델을 가지고, 어댑터가 자기 모델과 도메인 모델 사이를 양방향으로 매핑합니다.</text>
  <text x="30" y="318" class="note">포트는 여전히 도메인 모델(Account)을 입력과 반환값으로 사용합니다.</text>
</svg>
