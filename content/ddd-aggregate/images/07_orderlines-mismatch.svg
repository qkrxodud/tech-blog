<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>외부 코드가 getOrderLines로 OrderLines를 꺼내 changeOrderLines를 실행하면 목록은 바뀌지만 Order의 totalAmounts는 다시 계산되지 않아 값이 어긋난다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .ops { font-size: 11.5px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .src { font-size: 13px; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .grp { fill: #f3f4f6; stroke: #c4c8ce; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .pkg { fill: #ffffff; stroke: #c4c8ce; stroke-width: 1.2; }
    .grpt { font-size: 13px; font-weight: 700; fill: #4b5563; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .edge { stroke: #9ca3af; stroke-width: 1.4; fill: none; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="760" height="330" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="310" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">getOrderLines()를 열어 두면 — 목록과 총액이 어긋난다</text>
  <text x="240" y="70" class="step" text-anchor="middle">1. 꺼내기</text>
  <text x="420" y="70" class="step" text-anchor="middle">2. 외부에서 변경</text>
  <text x="600" y="70" class="step" text-anchor="middle">3. 결과</text>
  <line x1="160" y1="78" x2="700" y2="78" stroke="#c4c8ce" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="30" y="116" class="t">외부 코드</text>
  <rect x="165" y="90" width="150" height="50" rx="8" class="box"/>
  <text x="240.0" y="110.5" class="ops" text-anchor="middle">getOrderLines()</text>
  <text x="240.0" y="129.5" class="val" text-anchor="middle">내부 객체를 꺼냄</text>
  <rect x="345" y="90" width="150" height="50" rx="8" class="bad"/>
  <text x="420.0" y="110.5" class="ops" text-anchor="middle">changeOrderLines()</text>
  <text x="420.0" y="129.5" class="val" text-anchor="middle">새 목록으로 교체</text>
  <rect x="525" y="90" width="150" height="50" rx="8" class="bad"/>
  <text x="600.0" y="110.5" class="badt" text-anchor="middle">총액 불일치</text>
  <text x="600.0" y="129.5" class="val" text-anchor="middle">합계를 다시 안 구함</text>
  <line x1="316" y1="115" x2="342" y2="115" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="496" y1="115" x2="522" y2="115" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="30" y="190" class="opm">OrderLines</text>
  <text x="30" y="250" class="opm">totalAmounts</text>
  <rect x="180" y="166" width="120" height="36" rx="6" class="dbbox"/>
  <text x="240.0" y="189.0" class="db" text-anchor="middle">기존 목록</text>
  <rect x="360" y="166" width="120" height="36" rx="6" class="hold"/>
  <text x="420.0" y="189.0" class="db" text-anchor="middle">새 목록</text>
  <rect x="540" y="166" width="120" height="36" rx="6" class="hold"/>
  <text x="600.0" y="189.0" class="db" text-anchor="middle">새 목록</text>
  <rect x="180" y="226" width="120" height="36" rx="6" class="dbbox"/>
  <text x="240.0" y="249.0" class="db" text-anchor="middle">기존 합계</text>
  <rect x="360" y="226" width="120" height="36" rx="6" class="dbbox"/>
  <text x="420.0" y="249.0" class="db" text-anchor="middle">기존 합계</text>
  <rect x="540" y="226" width="120" height="36" rx="6" class="bad"/>
  <text x="600.0" y="249.0" class="badt" text-anchor="middle">기존 합계</text>
  <text x="30" y="296" class="note">목록만 바뀌고 Order의 totalAmounts는 그대로 남습니다. 루트를 거치지 않아 생기는 버그입니다.</text>
</svg>
