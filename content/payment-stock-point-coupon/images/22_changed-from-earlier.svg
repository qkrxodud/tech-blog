  <rect width="760" height="456" fill="#ffffff"/>
  <text x="24" y="30" class="h">앞 장 코드에서 바뀐 것</text>
  <rect x="24" y="56" width="712" height="66" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="24" y="56" width="84" height="66" rx="12" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="66" y="94" class="bt" text-anchor="middle" style="font-size:12px">3장</text>
  <text x="122" y="82" class="t2" style="font-size:12.5px">준비</text>
  <text x="122" y="102" class="s" style="font-size:10.5px"><tspan class="m">PaymentPrepareRecorder</tspan></text>
  <line x1="352" y1="89" x2="376" y2="89" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <text x="386" y="84" class="bs" style="font-size:11.5px">상품을 담은 준비면 <tspan class="m">PaymentOrders</tspan>로 결제를 만듦</text>
  <text x="386" y="104" class="s" style="font-size:11px">없으면 7장까지처럼 주문번호와 금액</text>
  <rect x="664" y="76" width="60" height="26" rx="13" fill="#1e3a8a"/>
  <text x="694" y="93.5" class="num" text-anchor="middle" style="font-size:11px">결정 1</text>
  <rect x="24" y="130" width="712" height="66" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="24" y="130" width="84" height="66" rx="12" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="66" y="168" class="bt" text-anchor="middle" style="font-size:12px">2장</text>
  <text x="122" y="156" class="t2" style="font-size:12.5px">승인 앞 기록(인증)</text>
  <text x="122" y="176" class="s" style="font-size:10.5px"><tspan class="m">PaymentRecorder.authenticate</tspan></text>
  <line x1="352" y1="163" x2="376" y2="163" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <text x="386" y="158" class="bs" style="font-size:11.5px">여기서 재고·쿠폰·포인트를 잡음</text>
  <text x="386" y="178" class="s" style="font-size:11px">출발 코드의 승인 답 기록 줄이기는 뺌</text>
  <rect x="664" y="150" width="60" height="26" rx="13" fill="#1e3a8a"/>
  <text x="694" y="167.5" class="num" text-anchor="middle" style="font-size:11px">결정 2</text>
  <rect x="24" y="204" width="712" height="66" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="24" y="204" width="84" height="66" rx="12" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="66" y="242" class="bt" text-anchor="middle" style="font-size:12px">4·5·6장</text>
  <text x="122" y="230" class="t2" style="font-size:12.5px">기록 다섯 곳</text>
  <text x="122" y="250" class="s" style="font-size:9.5px">승인 답 · 결과 모름 보정 · 취소 답 · 취소 보정 · 알림</text>
  <line x1="352" y1="237" x2="376" y2="237" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <text x="386" y="232" class="bs" style="font-size:11.5px">바꾸기 전 상태를 들고</text>
  <text x="386" y="252" class="s" style="font-size:11px">결제를 바꾼 뒤 <tspan class="m">releaseIfClosed</tspan></text>
  <rect x="664" y="224" width="60" height="26" rx="13" fill="#1e3a8a"/>
  <text x="694" y="241.5" class="num" text-anchor="middle" style="font-size:11px">결정 4</text>
  <rect x="24" y="278" width="712" height="66" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="24" y="278" width="84" height="66" rx="12" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="66" y="316" class="bt" text-anchor="middle" style="font-size:12px">앞 장 시험</text>
  <text x="122" y="304" class="t2" style="font-size:12.5px">결제를 지우는 시험 4개</text>
  <text x="122" y="324" class="s" style="font-size:10.5px"><tspan class="m">ReconciliationContract</tspan> 등</text>
  <line x1="352" y1="311" x2="376" y2="311" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <text x="386" y="306" class="bs" style="font-size:11.5px">외래 키 때문에 <tspan class="m">payment_item</tspan>을 먼저 지움</text>
  <text x="386" y="326" class="s" style="font-size:11px"><tspan class="m">PaymentPrepareServiceTest</tspan>는 생성자 인자가 늘어 고침</text>
  <rect x="24" y="356" width="712" height="96" rx="12" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <text x="38" y="380" class="ot" style="font-size:12.5px">빌드 — 모든 시험 태스크에 <tspan class="m">spring.test.context.cache.maxSize=10</tspan></text>
  <rect x="38" y="392" width="200" height="50" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="50" y="412" class="badt" style="font-size:11px">결정 5 커밋 <tspan class="m">clean check</tspan></text>
  <text x="50" y="430" class="bads" style="font-size:11px">641개 중 20개 실패</text>
  <line x1="240" y1="417" x2="262" y2="417" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <rect x="266" y="392" width="182" height="50" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="278" y="412" class="t2" style="font-size:11px">웹훅 시험 두 묶음</text>
  <text x="278" y="430" class="s" style="font-size:10.5px">컨테이너에 접속하지 못함</text>
  <line x1="450" y1="417" x2="472" y2="417" stroke="#1f2937" stroke-width="1.3" marker-end="url(#ak)"/>
  <rect x="476" y="392" width="246" height="50" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="488" y="412" class="okt" style="font-size:11px">캐시를 10개로 묶은 뒤</text>
  <text x="488" y="430" class="oks" style="font-size:11px">641개 모두 통과</text>
  <text x="24" y="476" class="gs" style="font-size:10.5px">원인은 확정하지 않음 — 컨텍스트가 늘어 컨테이너가 한꺼번에 많이 떠 있던 탓으로 봄, 컨테이너 로그는 모으지 않음</text>
</svg>
