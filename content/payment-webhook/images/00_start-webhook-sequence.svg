  <text x="24" y="28" class="h">6장 출발 코드의 웹훅 — 받은 요청 안에서 본문의 상태를 옮기고 답함</text>
  <text x="24" y="50" class="gs">Mock PG는 승인·거절·취소로 결제 상태가 바뀌면 알림 · 결제 서버는 <tspan class="m">data</tspan>의 <tspan class="m">orderId</tspan>와 <tspan class="m">status</tspan>만 읽음</text>
