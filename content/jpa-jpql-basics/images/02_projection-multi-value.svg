<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>select m.username, m.age 결과를 Query 타입, Object 배열, new 명령어로 받을 때 각각 받는 타입과 값을 꺼내는 방법 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .msg { font-size: 11.5px; fill: #374151; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .cont { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="310" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">여러 값 조회 — 결과를 받는 세 가지 방법</text>
  <text x="730" y="42" class="code" text-anchor="end">select m.username, m.age</text>
  <text x="30" y="76" class="step" text-anchor="start">방법</text>
  <text x="200" y="76" class="step" text-anchor="start">받는 타입</text>
  <text x="470" y="76" class="step" text-anchor="start">값 꺼내기</text>
  <rect x="30" y="90" width="150" height="48" rx="8" class="hold"/>
  <text x="105" y="119" class="ts" text-anchor="middle">1. Query 타입</text>
  <rect x="200" y="90" width="240" height="48" rx="8" class="box"/>
  <text x="320" y="119" class="ts" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">List</tspan> (타입 지정 없음)</text>
  <rect x="470" y="90" width="260" height="48" rx="8" class="box"/>
  <text x="600" y="119" class="val" text-anchor="middle">순서와 타입을 직접 맞춤</text>
  <line x1="180" y1="114" x2="196" y2="114" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="440" y1="114" x2="466" y2="114" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="30" y="154" width="150" height="48" rx="8" class="hold"/>
  <text x="105" y="183" class="ts" text-anchor="middle">2. Object[] 타입</text>
  <rect x="200" y="154" width="240" height="48" rx="8" class="box"/>
  <text x="320" y="183" class="opm" text-anchor="middle">List&lt;Object[]&gt;</text>
  <rect x="470" y="154" width="260" height="48" rx="8" class="box"/>
  <text x="600" y="183" class="val" text-anchor="middle">objects[0], objects[1]</text>
  <line x1="180" y1="178" x2="196" y2="178" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="440" y1="178" x2="466" y2="178" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="30" y="218" width="150" height="48" rx="8" class="hold"/>
  <text x="105" y="247" class="ts" text-anchor="middle">3. new 명령어</text>
  <rect x="200" y="218" width="240" height="48" rx="8" class="ok"/>
  <text x="320" y="247" class="okm" text-anchor="middle">List&lt;MemberDTO&gt;</text>
  <rect x="470" y="218" width="260" height="48" rx="8" class="ok"/>
  <text x="600" y="247" class="okm" text-anchor="middle">getUsername(), getAge()</text>
  <line x1="180" y1="242" x2="196" y2="242" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="440" y1="242" x2="466" y2="242" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="30" y="294" class="sub" text-anchor="start">new 명령어는 패키지명을 포함한 전체 클래스명과, 순서·타입이 일치하는 생성자가 필요합니다</text>
</svg>
