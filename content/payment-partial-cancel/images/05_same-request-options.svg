<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>같은 취소 요청을 가리는 세 방식에 같은 네 입력을 넣은 결과 — 키 필수와 남긴 결과(이 장에서 고름)는 키를 바꾼 같은 금액 부분 취소 두 번을 PG에서 2번 취소하고, 부분 취소 뒤 같은 키 재요청은 PG를 부르지 않고 처음과 같은 답을 주며, 같은 키에 다른 금액은 422, 전액 취소 뒤 새 키 취소는 409로 거부한다. 비교 A 자연 키는 두 번째 같은 금액 취소를 재요청으로 보아 PG 취소가 1번이고 같은 키 다른 금액을 새 취소로 받는다. 비교 B(고객의 키를 기록에 쓰지 않고 지금 결제 상태로 답함)는 요청마다 새 키로 남겨, 같은 키 재요청을 PG에 다시 보내 다른 답을 주고, 다른 금액도 받고, 전액 취소 뒤 새 취소를 재요청으로 보아 성공으로 답한다. 응답 본문 저장 테이블과 키를 선택으로 받는 방식은 구현하지 않았다</title>
