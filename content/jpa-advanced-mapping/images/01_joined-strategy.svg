<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>조인 전략에서 ITEM 테이블에 공통 컬럼과 DTYPE을 두고, ALBUM·MOVIE·BOOK 테이블이 ITEM의 ID를 기본 키이자 외래 키로 가지는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12.5px; fill: #374151; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .thead { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .cell { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 13px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 12.5px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 12.5px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="agb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="360" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">조인 전략 — 타입마다 테이블을 만들고 조인한다</text>
  <text x="730" y="42" class="code" text-anchor="end">InheritanceType.JOINED</text>
  <rect x="290" y="60" width="180" height="106" rx="6" class="box"/>
  <rect x="290" y="60" width="180" height="28" rx="6" class="thead"/>
  <text x="380.0" y="79" class="mb" text-anchor="middle">ITEM</text>
  <rect x="294" y="91" width="172" height="20" rx="4" class="ok"/>
  <text x="302" y="105.5" class="okm">ID (PK)</text>
  <text x="302" y="131.5" class="s">공통 컬럼</text>
  <rect x="294" y="143" width="172" height="20" rx="4" class="wait"/>
  <text x="302" y="157.5" class="m">DTYPE</text>
  <rect x="40" y="232" width="180" height="80" rx="6" class="box"/>
  <rect x="40" y="232" width="180" height="28" rx="6" class="thead"/>
  <text x="130.0" y="251" class="mb" text-anchor="middle">ALBUM</text>
  <rect x="44" y="263" width="172" height="20" rx="4" class="ok"/>
  <text x="52" y="277.5" class="okm">ID (PK, FK)</text>
  <text x="52" y="303.5" class="s">앨범 전용 컬럼</text>
  <line x1="130" y1="230" x2="380" y2="170" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="290" y="232" width="180" height="80" rx="6" class="box"/>
  <rect x="290" y="232" width="180" height="28" rx="6" class="thead"/>
  <text x="380.0" y="251" class="mb" text-anchor="middle">MOVIE</text>
  <rect x="294" y="263" width="172" height="20" rx="4" class="ok"/>
  <text x="302" y="277.5" class="okm">ID (PK, FK)</text>
  <text x="302" y="303.5" class="s">영화 전용 컬럼</text>
  <line x1="380" y1="230" x2="380" y2="170" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="540" y="232" width="180" height="80" rx="6" class="box"/>
  <rect x="540" y="232" width="180" height="28" rx="6" class="thead"/>
  <text x="630.0" y="251" class="mb" text-anchor="middle">BOOK</text>
  <rect x="544" y="263" width="172" height="20" rx="4" class="ok"/>
  <text x="552" y="277.5" class="okm">ID (PK, FK)</text>
  <text x="552" y="303.5" class="s">책 전용 컬럼</text>
  <line x1="630" y1="230" x2="380" y2="170" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="480" y="152" class="waitt">DTYPE은 @DiscriminatorColumn을</text>
  <text x="480" y="170" class="waitt">넣었을 때 생깁니다.</text>
  <text x="30" y="340" class="foot">저장할 때 ITEM과 자식 테이블에 INSERT가 두 번 실행되고, 조회할 때는 ITEM과 자식 테이블을 조인합니다.</text>
</svg>
