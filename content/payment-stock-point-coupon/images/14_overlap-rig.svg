  <text x="202" y="96" class="t2" style="font-size:12px">재고·쿠폰·포인트 줄 바꿈</text>
  <text x="202" y="114" class="s" style="font-size:9.5px"><tspan class="m">JdbcTemplate</tspan> · 바로 나가 잠금 쥠</text>
  <rect x="384" y="76" width="200" height="48" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="384" cy="76" r="10" fill="#111827"/><text x="384" y="80" class="num" text-anchor="middle">2</text>
