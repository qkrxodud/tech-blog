<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>소스 파일은 이름, 고차원 개념과 알고리즘, 세세한 의도, 가장 저차원 함수와 세부 내역 순으로 위에서 아래로 구성된다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .ttl { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ttls { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .cs { font-family: Menlo, Consolas, monospace; font-size: 11.5px; fill: #374151; }
    .csb { font-family: Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; fill: #1f2937; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="430" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="410" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">신문 기사처럼 작성하기 — 위에서 아래로 내려갈수록 세부 내역</text>
  <rect x="30" y="62" width="480" height="336" rx="10" class="box"/>
  <text x="46" y="84" class="sub">소스 파일</text>
  <rect x="46" y="96" width="448" height="64" rx="8" class="hold"/>
  <text x="64" y="123" class="ttl">1. 이름</text>
  <text x="64" y="144" class="val">간단하면서도 설명이 가능하게 — 이름만 보고 올바른 모듈인지 판단</text>
  <rect x="46" y="170" width="448" height="64" rx="8" class="hold"/>
  <text x="64" y="197" class="ttl">2. 첫 부분</text>
  <text x="64" y="218" class="val">고차원 개념과 알고리즘을 설명</text>
  <rect x="46" y="244" width="448" height="64" rx="8" class="box"/>
  <text x="64" y="271" class="ttl">3. 아래로 내려갈수록</text>
  <text x="64" y="292" class="val">의도를 세세하게 묘사</text>
  <rect x="46" y="318" width="448" height="64" rx="8" class="box"/>
  <text x="64" y="345" class="ttl">4. 마지막</text>
  <text x="64" y="366" class="val">가장 저차원 함수와 세부 내역</text>
  <line x1="566" y1="104" x2="566" y2="380" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="586" y="112" class="ttls">고차원</text>
  <text x="586" y="130" class="sub">개념과 알고리즘</text>
  <text x="586" y="364" class="ttls">저차원</text>
  <text x="586" y="382" class="sub">함수와 세부 내역</text>
  <text x="586" y="244" class="sub">위에서 아래로 읽는 순서</text>
</svg>
