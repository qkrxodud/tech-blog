<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>조회 V1은 List of Member를 그대로 반환해 엔티티의 모든 필드가 JSON 배열로 나가고, 조회 V2는 MemberDto로 name만 담아 Result의 data 필드로 감싸 반환하므로 나중에 data 옆에 필드를 추가할 수 있는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .m { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .vm { font-size: 12px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .jm { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="218" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">회원 조회 V1 — 엔티티 목록을 그대로 반환</text>
  <text x="730" y="42" class="code" text-anchor="end">List&lt;Member&gt;</text>
  <rect x="40" y="72" width="170" height="56" rx="8" class="box"/>
  <text x="125" y="96" class="t" text-anchor="middle">Member 목록</text>
  <text x="125" y="115" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">findMembers()</tspan></text>
  <line x1="210" y1="100" x2="268" y2="100" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="270" y="62" width="450" height="80" rx="8" class="bad"/>
  <text x="290" y="88" class="jm">[</text>
  <text x="306" y="108" class="jm">{ "id": …, "name": …, … },</text>
  <text x="290" y="128" class="jm">]</text>
  <text x="560" y="108" class="note">엔티티의 모든 필드</text>
  <rect x="40" y="160" width="680" height="48" rx="6" class="bad"/>
  <text x="380" y="180" class="note" text-anchor="middle">엔티티 값이 모두 노출되고, 엔티티가 바뀌면 응답도 바뀜</text>
  <text x="380" y="198" class="note" text-anchor="middle">최상위가 배열이라 다른 필드를 함께 내려주기 어려움</text>
  <rect x="10" y="244" width="740" height="216" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="276" class="h">회원 조회 V2 — DTO를 Result로 감싸 반환</text>
  <text x="730" y="276" class="code" text-anchor="end">Result&lt;T&gt;</text>
  <rect x="40" y="306" width="130" height="56" rx="8" class="box"/>
  <text x="105" y="330" class="t" text-anchor="middle">Member 목록</text>
  <text x="105" y="349" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">findMembers()</tspan></text>
  <rect x="200" y="306" width="130" height="56" rx="8" class="ok"/>
  <text x="265" y="330" class="okm" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">MemberDto</tspan></text>
  <text x="265" y="349" class="val" text-anchor="middle">name만 담음</text>
  <line x1="170" y1="334" x2="198" y2="334" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="330" y1="334" x2="358" y2="334" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="360" y="296" width="360" height="80" rx="8" class="ok"/>
  <text x="380" y="322" class="jm">{</text>
  <text x="396" y="342" class="jm">"data": [ { "name": … }, … ]</text>
  <text x="380" y="362" class="jm">}</text>
  <rect x="40" y="392" width="680" height="48" rx="6" class="ok"/>
  <text x="380" y="412" class="gnote" text-anchor="middle">API 스펙에 맞춘 값만 노출하고, 엔티티가 바뀌어도 응답은 그대로</text>
  <text x="380" y="430" class="gnote" text-anchor="middle">data를 객체로 감쌌으므로 그 옆에 필요한 필드를 더할 수 있음</text>
</svg>
