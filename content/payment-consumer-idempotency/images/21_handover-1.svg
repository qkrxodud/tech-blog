  <text x="26" y="386" class="gs" style="font-size:10.5px">중복과 늦게 온 옛 이벤트를 가리지 않음 · 기본 처리 그대로</text>
  <use href="#vmark" x="391" y="375"/>
  <use href="#vmark" x="453" y="375"/>
  <use href="#vmark" x="515" y="375"/>
  <use href="#vmark" x="577" y="375"/>
  <text x="614" y="379" class="oks" style="font-size:10px">기본 처리 8·7 실패</text>
  <rect x="14" y="408" width="734" height="54" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="26" y="428" class="t2" style="font-size:11.5px">9장 마무리</text>
  <text x="26" y="446" class="gs" style="font-size:10.5px">받는 쪽에서 어떻게 가릴지는 11장에서 다시 재 볼 필요</text>
