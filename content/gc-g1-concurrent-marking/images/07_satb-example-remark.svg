  <rect x="702" y="370" width="18" height="22" class="box" stroke-width="1"/>
  <text x="711" y="386" class="mono" text-anchor="middle">0</text>
  <line x1="30" y1="406" x2="730" y2="406" class="sep"/>
  <text x="30" y="428" class="val">0을 꺼냄 — old, TAMS 이전, bit 0</text>
  <text x="30" y="446" class="gnote">mark stack에 push</text>
  <text x="330" y="436" class="sub">(비어 있음)</text>
  <rect x="440" y="420" width="30" height="22" rx="3" class="hold"/>
  <text x="455.0" y="436" class="mono" text-anchor="middle">0</text>
