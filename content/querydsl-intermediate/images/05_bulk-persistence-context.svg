<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>bulkUpdate가 age 28 미만인 member1과 member2의 username을 DB에서만 비회원으로 바꿔 영속성 컨텍스트와 상태가 달라지고, em.flush와 em.clear 뒤 다시 조회하면 DB의 비회원 값을 가져오는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .msg { font-size: 11.5px; fill: #374151; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .cont { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="300" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="280" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">벌크 연산 — 영속성 컨텍스트를 거치지 않고 DB에 실행</text>
  <text x="730" y="42" class="code" text-anchor="end">where(member.age.lt(28))</text>
  <text x="220" y="68" class="step" text-anchor="middle">1. 실행 전</text>
  <text x="360" y="68" class="step" text-anchor="middle">2. bulkUpdate</text>
  <text x="500" y="68" class="step" text-anchor="middle">3. flush · clear</text>
  <text x="640" y="68" class="step" text-anchor="middle">4. 다시 조회</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane" text-anchor="start">영속성</text>
  <text x="30" y="126" class="sub" text-anchor="start">컨텍스트</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="88" width="116" height="48" rx="8" class="hold"/>
  <text x="220.0" y="107.5" class="m" text-anchor="middle">member1</text>
  <text x="220.0" y="126.5" class="m" text-anchor="middle">member2</text>
  <rect x="302" y="88" width="116" height="48" rx="8" class="bad"/>
  <text x="360.0" y="107.5" class="badm" text-anchor="middle">member1</text>
  <text x="360.0" y="126.5" class="badm" text-anchor="middle">member2</text>
  <rect x="442" y="88" width="116" height="48" rx="8" class="wait"/>
  <text x="500.0" y="117.0" class="waitt" text-anchor="middle">비어 있음</text>
  <rect x="582" y="88" width="116" height="48" rx="8" class="ok"/>
  <text x="640.0" y="107.5" class="okt" text-anchor="middle">비회원</text>
  <text x="640.0" y="126.5" class="okt" text-anchor="middle">비회원</text>
  <text x="30" y="180" class="lane" text-anchor="start">DB</text>
  <text x="30" y="198" class="sub" text-anchor="start">member 테이블</text>
  <rect x="150" y="158" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="160" width="116" height="48" rx="8" class="box"/>
  <text x="220.0" y="179.5" class="m" text-anchor="middle">member1</text>
  <text x="220.0" y="198.5" class="m" text-anchor="middle">member2</text>
  <rect x="302" y="160" width="116" height="48" rx="8" class="box"/>
  <text x="360.0" y="179.5" class="val" text-anchor="middle">비회원</text>
  <text x="360.0" y="198.5" class="val" text-anchor="middle">비회원</text>
  <rect x="442" y="160" width="116" height="48" rx="8" class="box"/>
  <text x="500.0" y="179.5" class="val" text-anchor="middle">비회원</text>
  <text x="500.0" y="198.5" class="val" text-anchor="middle">비회원</text>
  <rect x="582" y="160" width="116" height="48" rx="8" class="box"/>
  <text x="640.0" y="179.5" class="val" text-anchor="middle">비회원</text>
  <text x="640.0" y="198.5" class="val" text-anchor="middle">비회원</text>
  <line x1="640" y1="160" x2="640" y2="138" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="150" y="238" class="note" text-anchor="start">2단계에서 DB는 비회원으로 바뀌었지만 영속성 컨텍스트의 엔티티는 그대로라 상태가 다릅니다</text>
  <text x="150" y="262" class="foot" text-anchor="start">em.flush(), em.clear()로 초기화한 뒤 다시 조회해야 DB의 값을 가져옵니다</text>
</svg>
