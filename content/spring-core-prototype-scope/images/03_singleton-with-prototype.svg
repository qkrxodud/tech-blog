<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>싱글톤 ClientBean이 생성 시점에 주입받은 PrototypeBean 하나를 클라이언트 A와 B의 logic 호출에서 함께 사용해 count가 0, 1, 2로 증가하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .msg { font-size: 11.5px; fill: #374151; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .cont { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="440" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="420" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">싱글톤 빈이 프로토타입 빈을 주입받을 때 — 같은 빈을 계속 사용</text>
  <text x="260" y="70" class="step" text-anchor="middle">1. 컨테이너 생성 시점</text>
  <text x="450" y="70" class="step" text-anchor="middle">2. 클라이언트 A 호출</text>
  <text x="640" y="70" class="step" text-anchor="middle">3. 클라이언트 B 호출</text>
  <line x1="160" y1="78" x2="738" y2="78" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="112" class="lane">클라이언트</text>
  <text x="30" y="130" class="sub">A, B</text>
  <rect x="160" y="90" width="578" height="52" rx="6" class="track"/>
  <rect x="190" y="100" width="140" height="32" rx="6" class="wait"/>
  <text x="260" y="121" class="waitt" text-anchor="middle">아직 요청 없음</text>
  <rect x="370" y="92" width="160" height="48" rx="8" class="box"/>
  <text x="450" y="112" class="ts" text-anchor="middle">클라이언트 A</text>
  <text x="450" y="131" class="m" text-anchor="middle">clientBean.logic()</text>
  <line x1="450" y1="140" x2="450" y2="160" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="560" y="92" width="160" height="48" rx="8" class="box"/>
  <text x="640" y="112" class="ts" text-anchor="middle">클라이언트 B</text>
  <text x="640" y="131" class="m" text-anchor="middle">clientBean.logic()</text>
  <line x1="640" y1="140" x2="640" y2="160" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="30" y="188" class="lane">ClientBean</text>
  <text x="30" y="206" class="sub">싱글톤</text>
  <rect x="160" y="166" width="578" height="52" rx="6" class="track"/>
  <rect x="180" y="168" width="160" height="48" rx="8" class="hold"/>
  <text x="260" y="188" class="ts" text-anchor="middle">생성 + 의존관계 주입</text>
  <text x="260" y="207" class="val" text-anchor="middle">프로토타입 빈 요청</text>
  <rect x="370" y="168" width="160" height="48" rx="8" class="hold"/>
  <text x="450" y="188" class="m" text-anchor="middle">addCount()</text>
  <text x="450" y="207" class="val" text-anchor="middle">보관한 참조값 사용</text>
  <rect x="560" y="168" width="160" height="48" rx="8" class="hold"/>
  <text x="640" y="188" class="m" text-anchor="middle">addCount()</text>
  <text x="640" y="207" class="val" text-anchor="middle">보관한 참조값 사용</text>
  <line x1="260" y1="216" x2="260" y2="238" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="450" y1="216" x2="450" y2="238" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="640" y1="216" x2="640" y2="238" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="30" y="264" class="lane">PrototypeBean</text>
  <text x="30" y="282" class="sub">프로토타입</text>
  <rect x="160" y="242" width="578" height="52" rx="6" class="track"/>
  <rect x="180" y="244" width="160" height="48" rx="8" class="box"/>
  <text x="260" y="264" class="t" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">@x01</tspan> 생성</text>
  <text x="260" y="283" class="val" text-anchor="middle">count = 0</text>
  <rect x="370" y="244" width="160" height="48" rx="8" class="box"/>
  <text x="450" y="264" class="opm" text-anchor="middle">@x01</text>
  <text x="450" y="283" class="val" text-anchor="middle">count = 1</text>
  <rect x="560" y="244" width="160" height="48" rx="8" class="bad"/>
  <text x="640" y="264" class="badt" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">@x01</tspan> 같은 빈</text>
  <text x="640" y="283" class="val" text-anchor="middle">count = 2</text>
  <text x="30" y="338" class="db">logic() 반환값</text>
  <rect x="410" y="316" width="80" height="32" rx="6" class="ok"/>
  <text x="450" y="337" class="okt" text-anchor="middle">1</text>
  <rect x="600" y="316" width="80" height="32" rx="6" class="bad"/>
  <text x="640" y="337" class="badt" text-anchor="middle">2</text>
  <text x="160" y="380" class="foot">PrototypeBean은 ClientBean을 만들 때 한 번만 생성되어 ClientBean의 필드에 보관됩니다</text>
  <text x="160" y="404" class="note">사용할 때마다 새로 생성되지 않으므로 클라이언트 B의 호출에서 count가 2가 됩니다</text>
</svg>
