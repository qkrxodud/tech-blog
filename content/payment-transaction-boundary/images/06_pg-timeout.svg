<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>PG 호출 시간 제한이 없을 때와 있을 때 PG가 늦게 답하면 요청이 끝나는 모습 비교 — 시간 제한이 없는 출발 코드는 3초 뒤 답하는 PG를 DB 연결을 쥔 채 끝까지 기다려 약 3초 뒤 승인으로 끝나고, 읽기 시간 제한을 1초로 두면 1초에 기다리기를 그만두고 결제를 AUTHENTICATED로 둔 채 504 PAYMENT_GATEWAY_NO_RESPONSE로 답하지만 1.5초 뒤 승인하는 Mock PG에는 그 뒤에 승인이 1건 남는 그림</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 13.5px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 13.5px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 13.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .flow { stroke: #9ca3af; stroke-width: 1.4; fill: none; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 13.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okw { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 13.5px; fill: #b91c1c; }
    .gnote { font-size: 13.5px; fill: #15803d; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="512" fill="#ffffff"/>
  <!-- 패널 A: 시간 제한 없음. 1초 = 160px, 0초는 x=160 -->
  <rect x="10" y="10" width="740" height="214" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">시간 제한 없음(출발 코드) — PG가 3초 뒤 답할 때까지 기다림</text>
  <text x="160" y="72" class="step" text-anchor="middle">0초</text>
  <text x="320" y="72" class="step" text-anchor="middle">1초</text>
  <text x="480" y="72" class="step" text-anchor="middle">2초</text>
  <text x="640" y="72" class="step" text-anchor="middle">3초</text>
  <line x1="150" y1="80" x2="735" y2="80" class="axis" marker-end="url(#ar)"/>

  <text x="30" y="116" class="lane">결제 서버</text>
  <text x="30" y="134" class="sub">승인 요청</text>
  <rect x="150" y="90" width="585" height="56" rx="6" class="track"/>
  <rect x="160" y="94" width="476" height="48" rx="8" class="hold"/>
  <text x="398" y="114" class="t" text-anchor="middle">PG 답을 끝까지 기다림</text>
  <text x="398" y="133" class="val" text-anchor="middle">그동안 DB 연결도 함께 붙잡혀 있음</text>
  <rect x="644" y="94" width="86" height="48" rx="8" class="box"/>
  <text x="687" y="114" class="t" text-anchor="middle">약 3초 뒤</text>
  <text x="687" y="133" class="val" text-anchor="middle">승인으로 끝남</text>

  <text x="30" y="180" class="lane">Mock PG</text>
  <text x="30" y="198" class="sub">3초 지연</text>
  <rect x="150" y="154" width="585" height="56" rx="6" class="track"/>
  <rect x="160" y="158" width="476" height="48" rx="8" class="wait"/>
  <text x="398" y="187" class="waitt" text-anchor="middle">3초 뒤에 답하도록 설정</text>
  <rect x="644" y="158" width="86" height="48" rx="8" class="box"/>
  <text x="687" y="187" class="t" text-anchor="middle">승인 응답</text>
  <line x1="687" y1="158" x2="687" y2="144" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- 패널 B: 읽기 시간 제한 1초 -->
  <rect x="10" y="240" width="740" height="262" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="272" class="h">읽기 시간 제한 1초 — 1초에 기다리기를 그만두고 504</text>
  <text x="30" y="296" class="sub">테스트 설정: 읽기 시간 제한 1초, Mock PG는 1.5초 뒤 승인 (운영 설정은 연결 1초, 읽기 5초)</text>
  <text x="160" y="324" class="step" text-anchor="middle">0초</text>
  <text x="320" y="324" class="step" text-anchor="middle">1초</text>
  <text x="400" y="324" class="step" text-anchor="middle">1.5초</text>
  <line x1="150" y1="332" x2="735" y2="332" class="axis" marker-end="url(#ar)"/>

  <text x="30" y="368" class="lane">결제 서버</text>
  <text x="30" y="386" class="sub">승인 요청</text>
  <rect x="150" y="342" width="585" height="56" rx="6" class="track"/>
  <rect x="160" y="346" width="156" height="48" rx="8" class="wait"/>
  <text x="238" y="375" class="waitt" text-anchor="middle">PG 답 대기</text>
  <rect x="324" y="346" width="238" height="48" rx="8" class="bad"/>
  <text x="443" y="366" class="badt" text-anchor="middle">기다리기를 그만두고 504</text>
  <text x="443" y="385" class="note" text-anchor="middle" style="font-family: Menlo, Consolas, monospace; font-size: 12px">PAYMENT_GATEWAY_NO_RESPONSE</text>
  <rect x="570" y="346" width="160" height="48" rx="8" class="bad"/>
  <text x="650" y="366" class="badt" text-anchor="middle">결제 상태</text>
  <text x="650" y="385" class="note" text-anchor="middle" style="font-family: Menlo, Consolas, monospace; font-size: 12.5px">AUTHENTICATED</text>

  <text x="30" y="432" class="lane">Mock PG</text>
  <text x="30" y="450" class="sub">1.5초 뒤 승인</text>
  <rect x="150" y="406" width="585" height="56" rx="6" class="track"/>
  <rect x="160" y="410" width="236" height="48" rx="8" class="wait"/>
  <text x="278" y="439" class="waitt" text-anchor="middle">승인 처리 중</text>
  <rect x="404" y="410" width="326" height="48" rx="8" class="bad"/>
  <text x="567" y="430" class="badt" text-anchor="middle">기다리기를 그만둬도 승인 처리는 계속</text>
  <text x="567" y="449" class="note" text-anchor="middle">Mock PG에 승인 1건이 남음</text>
  <text x="30" y="486" class="note">PG에는 승인, 우리는 인증 상태인 결제가 생김 — 보정은 4장에서 다룸</text>
</svg>
