<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 488" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>IDENTITY 전략은 persist할 때마다 INSERT를 바로 실행해 엔티티마다 DB를 왕복하고, SEQUENCE 전략은 allocationSize 50으로 ID를 미리 확보해 두고 flush할 때 INSERT를 배치로 모아 보내는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12.5px; fill: #374151; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .thead { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .cell { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 12.5px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 12.5px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="488" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="226" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">IDENTITY — persist마다 INSERT를 바로 실행</text>
  <text x="730" y="42" class="code" text-anchor="end">IDENTITY</text>
  <text x="220" y="68" class="step" text-anchor="middle">persist 1</text>
  <text x="360" y="68" class="step" text-anchor="middle">persist 2</text>
  <text x="500" y="68" class="step" text-anchor="middle">persist 3</text>
  <text x="640" y="68" class="step" text-anchor="middle">flush</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="110" class="lane">애플리케이션</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="108" class="op" text-anchor="middle">persist()</text>
  <text x="220" y="127" class="val" text-anchor="middle">ID 필요</text>
  <rect x="302" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="360" y="108" class="op" text-anchor="middle">persist()</text>
  <text x="360" y="127" class="val" text-anchor="middle">ID 필요</text>
  <rect x="442" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="500" y="108" class="op" text-anchor="middle">persist()</text>
  <text x="500" y="127" class="val" text-anchor="middle">ID 필요</text>
  <rect x="582" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="640" y="108" class="op" text-anchor="middle">flush</text>
  <text x="640" y="127" class="val" text-anchor="middle">보낼 INSERT 없음</text>
  <text x="30" y="170" class="lane">DB</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="148" width="116" height="48" rx="8" class="bad"/>
  <text x="220" y="168" class="badm" text-anchor="middle">INSERT</text>
  <text x="220" y="187" class="val" text-anchor="middle">ID 1 받음</text>
  <line x1="220" y1="137" x2="220" y2="146" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="302" y="148" width="116" height="48" rx="8" class="bad"/>
  <text x="360" y="168" class="badm" text-anchor="middle">INSERT</text>
  <text x="360" y="187" class="val" text-anchor="middle">ID 2 받음</text>
  <line x1="360" y1="137" x2="360" y2="146" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="442" y="148" width="116" height="48" rx="8" class="bad"/>
  <text x="500" y="168" class="badm" text-anchor="middle">INSERT</text>
  <text x="500" y="187" class="val" text-anchor="middle">ID 3 받음</text>
  <line x1="500" y1="137" x2="500" y2="146" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="640" y="176" class="sub" text-anchor="middle">호출 없음</text>
  <text x="150" y="222" class="note">INSERT를 해야 ID를 알 수 있어 엔티티마다 DB를 왕복하고, INSERT를 JDBC 배치로 묶지 못합니다.</text>
  <rect x="10" y="252" width="740" height="226" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="284" class="h">SEQUENCE — ID를 미리 받아 두고 INSERT는 모아서</text>
  <text x="730" y="284" class="code" text-anchor="end">allocationSize = 50</text>
  <text x="220" y="310" class="step" text-anchor="middle">persist 1</text>
  <text x="360" y="310" class="step" text-anchor="middle">persist 2</text>
  <text x="500" y="310" class="step" text-anchor="middle">persist 3</text>
  <text x="640" y="310" class="step" text-anchor="middle">flush</text>
  <line x1="160" y1="318" x2="722" y2="318" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="352" class="lane">애플리케이션</text>
  <rect x="150" y="328" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="330" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="350" class="op" text-anchor="middle">persist()</text>
  <text x="220" y="369" class="val" text-anchor="middle">ID 1 할당</text>
  <rect x="302" y="330" width="116" height="48" rx="8" class="box"/>
  <text x="360" y="350" class="op" text-anchor="middle">persist()</text>
  <text x="360" y="369" class="val" text-anchor="middle">ID 2 (메모리)</text>
  <rect x="442" y="330" width="116" height="48" rx="8" class="box"/>
  <text x="500" y="350" class="op" text-anchor="middle">persist()</text>
  <text x="500" y="369" class="val" text-anchor="middle">ID 3 (메모리)</text>
  <rect x="582" y="330" width="116" height="48" rx="8" class="box"/>
  <text x="640" y="350" class="op" text-anchor="middle">flush</text>
  <text x="640" y="369" class="val" text-anchor="middle">INSERT 3건</text>
  <text x="30" y="412" class="lane">DB</text>
  <rect x="150" y="388" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="390" width="116" height="48" rx="8" class="ok"/>
  <text x="220" y="410" class="okm" text-anchor="middle">next value</text>
  <text x="220" y="429" class="val" text-anchor="middle">ID 1~50 확보</text>
  <line x1="220" y1="379" x2="220" y2="388" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="360" y="418" class="sub" text-anchor="middle">호출 없음</text>
  <text x="500" y="418" class="sub" text-anchor="middle">호출 없음</text>
  <rect x="582" y="390" width="116" height="48" rx="8" class="ok"/>
  <text x="640" y="410" class="okm" text-anchor="middle">batch INSERT</text>
  <text x="640" y="429" class="val" text-anchor="middle">한 번에 전송</text>
  <line x1="640" y1="379" x2="640" y2="388" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="150" y="464" class="gnote">batch INSERT는 hibernate.jdbc.batch_size를 설정했을 때 동작합니다.</text>
</svg>
