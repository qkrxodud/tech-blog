  <line x1="194" y1="311" x2="194" y2="321" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="24" y="322" width="340" height="40" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/><text x="194" y="338.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">재고 서비스 — 받은 명령대로 예약 상태만</text><text x="194" y="353.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">결제 상태는 모름</text>
  <rect x="388" y="62" width="360" height="46" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="402" y="82" class="t2">② 코레오그래피</text>
  <text x="402" y="100" class="gs" style="font-size:11.5px">비교 · 계약을 지켜 기본 시험에 있음</text>
  <rect x="398" y="122" width="340" height="40" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/><text x="568" y="138.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">결제 상태 전이 — 기록 다섯 곳</text><text x="568" y="153.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px"><tspan class="m">ChoreographyHoldings</tspan>: 쿠폰·포인트만 돌려줌</text>
  <line x1="568" y1="163" x2="568" y2="173" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="398" y="174" width="340" height="40" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/><text x="568" y="198" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">확정·해제를 보내지 않음</text>
  <line x1="568" y1="215" x2="568" y2="225" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="398" y="226" width="340" height="36" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/><text x="568" y="248" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px"><tspan class="m">payment_outbox</tspan> — <tspan class="m">PAYMENT_RESULT</tspan> 줄(9장)</text>
  <line x1="568" y1="263" x2="568" y2="273" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="398" y="274" width="340" height="36" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/><text x="568" y="296" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">릴레이 → <tspan class="m">payment-events</tspan></text>
  <line x1="568" y1="311" x2="568" y2="321" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="398" y="322" width="340" height="72" rx="8" fill="#ece8fb" stroke="#9b88d6" stroke-width="1.5"/><text x="568" y="339.5" class="s2" text-anchor="middle" style="fill:#4c1d95;font-size:11px">재고 서비스 <tspan class="m">PaymentEventReactionListener</tspan>가 정함</text><text x="568" y="354.5" class="s2" text-anchor="middle" style="fill:#4c1d95;font-size:11px"><tspan class="m">APPROVED</tspan>·<tspan class="m">CAPTURED</tspan> → 확정</text><text x="568" y="369.5" class="s2" text-anchor="middle" style="fill:#4c1d95;font-size:11px"><tspan class="m">APPROVAL_FAILED</tspan>·<tspan class="m">EXPIRED</tspan>·</text><text x="568" y="384.5" class="s2" text-anchor="middle" style="fill:#4c1d95;font-size:11px"><tspan class="m">APPROVAL_CANCELED</tspan>·<tspan class="m">CAPTURE_CANCELED</tspan> → 해제</text>
  <rect x="14" y="412" width="360" height="74" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="36" y="434"/>
  <text x="52" y="439" class="okt">계약 21개 모두 통과</text>
  <text x="52" y="460" class="oks" style="font-size:11.5px">측정 어긋난 재고 0(6번)</text>
  <text x="52" y="477" class="oks" style="font-size:11.5px">맞춰진 때 352~716ms</text>
  <rect x="388" y="412" width="360" height="74" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="410" y="434"/>
  <text x="426" y="439" class="okt">계약 21개 모두 통과</text>
  <text x="426" y="460" class="oks" style="font-size:11.5px">측정 어긋난 재고 0(6번)</text>
  <text x="426" y="477" class="oks" style="font-size:11.5px">맞춰진 때 243~752ms</text>
  <rect x="14" y="496" width="360" height="44" rx="8" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/><text x="194" y="514" class="s2" text-anchor="middle" style="fill:#9a3412;font-size:11px">결제 서버에 재고 확정·해제 규칙(<tspan class="m">settle</tspan>)과 재고 명령 보내기</text><text x="194" y="530" class="s2" text-anchor="middle" style="fill:#9a3412;font-size:11px"><tspan class="m">payment_outbox</tspan>에 재고 명령 줄이 더 쌓임</text>
  <rect x="388" y="496" width="360" height="44" rx="8" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/><text x="568" y="514" class="s2" text-anchor="middle" style="fill:#9a3412;font-size:11px">재고 서비스가 결제 상태 여섯 개의 뜻을 앎</text><text x="568" y="530" class="s2" text-anchor="middle" style="fill:#9a3412;font-size:11px">재고를 잡지 않은 결제의 실패 이벤트에도 빈 해제 줄</text>
  <text x="24" y="558" class="os" style="font-size:11.5px">주황 칸은 계약과 측정에 드러나지 않은 차이(코드에서 본 것 — 빈 해제 줄 수는 세지 않음)</text>
  <line x1="12" y1="570" x2="748" y2="570" stroke="#9ca3af" stroke-width="1"/>
  <text x="380" y="592" class="gt" text-anchor="middle" style="font-size:13px">결과는 계약과 측정으로 갈리지 않음</text>
