<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>mixed GC 한 번에 young region의 살아 있는 객체 1, 10, 12와 6, 8을 새 survivor로 옮기고, CSet candidate 중 5, 3, 14가 있는 old region 3개를 새 old region 하나로 evacuation 하며, 11과 13은 다음 후보로 남는다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
    .monob { font-family: Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #1f2937; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .lbl { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .rE { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .rS { fill: #ffffff; stroke: #16a34a; stroke-width: 1.8; }
    .rO { fill: #e5e7eb; stroke: #6b7280; stroke-width: 1.5; }
    .rH { fill: #9ca3af; stroke: #4b5563; stroke-width: 1.5; }
    .rF { fill: #ffffff; stroke: #c4c8ce; stroke-width: 1.2; }
    .rR { fill: #fafafa; stroke: #c4c8ce; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .tE { font-size: 13px; font-weight: 700; fill: #15803d; }
    .tS { font-size: 13px; font-weight: 700; fill: #15803d; }
    .tO { font-size: 13px; font-weight: 700; fill: #374151; }
    .tH { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .tF { font-size: 11px; fill: #9ca3af; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .dl { stroke: #9ca3af; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="530" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="196" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">mixed GC 전 — CSet candidate 5개, 이번에 3개를 회수</text>
  <text x="730" y="42" class="sub" text-anchor="end">한 번에 3개로 가정</text>
  <rect x="30" y="62" width="70" height="64" rx="6" class="rS"/>
  <text x="65.0" y="80" class="sub" text-anchor="middle">survivor</text>
  <text x="65.0" y="106" class="monob" text-anchor="middle">1 9 6</text>
  <rect x="108" y="62" width="70" height="64" rx="6" class="rS"/>
  <text x="143.0" y="80" class="sub" text-anchor="middle">survivor</text>
  <text x="143.0" y="106" class="monob" text-anchor="middle">10 4 12</text>
  <rect x="186" y="62" width="70" height="64" rx="6" class="rS"/>
  <text x="221.0" y="80" class="sub" text-anchor="middle">survivor</text>
  <text x="221.0" y="106" class="monob" text-anchor="middle">7 8</text>
  <rect x="264" y="62" width="70" height="64" rx="6" class="rO"/>
  <text x="299.0" y="80" class="sub" text-anchor="middle">old</text>
  <text x="299.0" y="106" class="monob" text-anchor="middle">2 15</text>
  <rect x="342" y="62" width="70" height="64" rx="6" fill="#e5e7eb" stroke="#dc2626" stroke-width="2.2"/>
  <text x="377.0" y="80" class="sub" text-anchor="middle">old</text>
  <text x="377.0" y="106" class="monob" text-anchor="middle">5</text>
  <text x="377.0" y="146" class="note" text-anchor="middle">회수</text>
  <rect x="420" y="62" width="70" height="64" rx="6" fill="#e5e7eb" stroke="#dc2626" stroke-width="2.2"/>
  <text x="455.0" y="80" class="sub" text-anchor="middle">old</text>
  <text x="455.0" y="106" class="monob" text-anchor="middle">3</text>
  <text x="455.0" y="146" class="note" text-anchor="middle">회수</text>
  <rect x="498" y="62" width="70" height="64" rx="6" fill="#e5e7eb" stroke="#dc2626" stroke-width="2.2"/>
  <text x="533.0" y="80" class="sub" text-anchor="middle">old</text>
  <text x="533.0" y="106" class="monob" text-anchor="middle">14</text>
  <text x="533.0" y="146" class="note" text-anchor="middle">회수</text>
  <rect x="576" y="62" width="70" height="64" rx="6" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="611.0" y="80" class="sub" text-anchor="middle">old</text>
  <text x="611.0" y="106" class="monob" text-anchor="middle">11</text>
  <text x="611.0" y="146" class="sub" text-anchor="middle">후보</text>
  <rect x="654" y="62" width="70" height="64" rx="6" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="689.0" y="80" class="sub" text-anchor="middle">old</text>
  <text x="689.0" y="106" class="monob" text-anchor="middle">13</text>
  <text x="689.0" y="146" class="sub" text-anchor="middle">후보</text>
  <text x="30" y="180" class="sub">young region(eden에서 살아남은 객체는 없다고 가정)과 CSet candidate 중 old region 3개를 함께 evacuation</text>
  <rect x="10" y="222" width="740" height="288" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="254" class="h">mixed GC 후 — 살아 있는 객체만 새 region으로 옮기고 원래 region은 반환</text>
  <rect x="30" y="274" width="70" height="64" rx="6" class="rF"/>
  <text x="65.0" y="292" class="sub" text-anchor="middle">free</text>
  <text x="65.0" y="318" class="sub" text-anchor="middle"></text>
  <text x="65.0" y="358" class="sub" text-anchor="middle">반환</text>
  <rect x="108" y="274" width="70" height="64" rx="6" class="rF"/>
  <text x="143.0" y="292" class="sub" text-anchor="middle">free</text>
  <text x="143.0" y="318" class="sub" text-anchor="middle"></text>
  <text x="143.0" y="358" class="sub" text-anchor="middle">반환</text>
  <rect x="186" y="274" width="70" height="64" rx="6" class="rF"/>
  <text x="221.0" y="292" class="sub" text-anchor="middle">free</text>
  <text x="221.0" y="318" class="sub" text-anchor="middle"></text>
  <text x="221.0" y="358" class="sub" text-anchor="middle">반환</text>
  <rect x="264" y="274" width="70" height="64" rx="6" class="rO"/>
  <text x="299.0" y="292" class="sub" text-anchor="middle">old</text>
  <text x="299.0" y="318" class="monob" text-anchor="middle">2 15</text>
  <rect x="342" y="274" width="70" height="64" rx="6" class="rF"/>
  <text x="377.0" y="292" class="sub" text-anchor="middle">free</text>
  <text x="377.0" y="318" class="sub" text-anchor="middle"></text>
  <text x="377.0" y="358" class="sub" text-anchor="middle">반환</text>
  <rect x="420" y="274" width="70" height="64" rx="6" class="rF"/>
  <text x="455.0" y="292" class="sub" text-anchor="middle">free</text>
  <text x="455.0" y="318" class="sub" text-anchor="middle"></text>
  <text x="455.0" y="358" class="sub" text-anchor="middle">반환</text>
  <rect x="498" y="274" width="70" height="64" rx="6" class="rF"/>
  <text x="533.0" y="292" class="sub" text-anchor="middle">free</text>
  <text x="533.0" y="318" class="sub" text-anchor="middle"></text>
  <text x="533.0" y="358" class="sub" text-anchor="middle">반환</text>
  <rect x="576" y="274" width="70" height="64" rx="6" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="611.0" y="292" class="sub" text-anchor="middle">old</text>
  <text x="611.0" y="318" class="monob" text-anchor="middle">11</text>
  <text x="611.0" y="358" class="sub" text-anchor="middle">후보</text>
  <rect x="654" y="274" width="70" height="64" rx="6" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="689.0" y="292" class="sub" text-anchor="middle">old</text>
  <text x="689.0" y="318" class="monob" text-anchor="middle">13</text>
  <text x="689.0" y="358" class="sub" text-anchor="middle">후보</text>
  <text x="30" y="390" class="lbl">free list에서 새로 받은 region</text>
  <rect x="30" y="402" width="70" height="64" rx="6" class="ok"/>
  <text x="65.0" y="420" class="sub" text-anchor="middle">survivor</text>
  <text x="65.0" y="446" class="monob" text-anchor="middle">1 10 12</text>
  <rect x="108" y="402" width="70" height="64" rx="6" class="ok"/>
  <text x="143.0" y="420" class="sub" text-anchor="middle">survivor</text>
  <text x="143.0" y="446" class="monob" text-anchor="middle">6 8</text>
  <rect x="186" y="402" width="70" height="64" rx="6" class="ok"/>
  <text x="221.0" y="420" class="sub" text-anchor="middle">old</text>
  <text x="221.0" y="446" class="monob" text-anchor="middle">3 5 14</text>
  <text x="270" y="426" class="sub">옮겨진 객체를 참조하던 곳은 old region마다 있는</text>
  <text x="270" y="444" class="sub">remembered set으로 찾아 새 주소로 갱신</text>
  <text x="270" y="470" class="sub">남은 11, 13은 다음 mixed GC에서 회수되거나,</text>
  <text x="270" y="488" class="sub">의미가 없으면 Young-Only phase로 전환</text>
</svg>
