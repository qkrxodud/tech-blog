  <text x="478" y="226" class="t2" style="font-size:11.5px">10장 비교 — 재고 서비스 답이 없으면</text>
  <text x="478" y="242" class="t2" style="font-size:11.5px">실패로만 보고 해제를 보내지 않음</text>
  <text x="452" y="266" class="badt" style="font-size:13px">4개 → 3개 실패</text>
  <text x="452" y="284" class="s2" style="font-size:10.5px;fill:#1f2937">몰림 계약 하나(서버 두 대·300건, 겹침 고정 안 함)</text>
  <text x="452" y="300" class="gs" style="font-size:10.5px">10장에 적은 흔들림</text>
