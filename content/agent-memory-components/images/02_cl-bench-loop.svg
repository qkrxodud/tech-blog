<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>CL-Bench 학습 루프에서 Sonnet 4.6은 가설을 세운 뒤 검증하지 않아 추측이 담긴 파일이 남고, Opus 5는 검증을 거쳐 규칙을 적은 뒤 다음 질문에서 메모리 디렉터리를 다시 읽는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="310" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">CL-Bench 학습 루프 — 모델마다 어디까지 닫았는지</text>
  <text x="220" y="68" class="step" text-anchor="middle">실패 기록</text>
  <text x="360" y="68" class="step" text-anchor="middle">원인 가설</text>
  <text x="500" y="68" class="step" text-anchor="middle">검증</text>
  <text x="640" y="68" class="step" text-anchor="middle">규칙으로 만들기</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">Sonnet 4.6</text>
  <text x="30" y="126" class="sub">가설에서 멈춤</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="108" class="db" text-anchor="middle">실패 기록</text>
  <text x="220" y="127" class="val" text-anchor="middle">정답과 비교</text>
  <rect x="302" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="360" y="108" class="db" text-anchor="middle">가설 세움</text>
  <text x="360" y="127" class="val" text-anchor="middle">원인 추측</text>
  <rect x="442" y="88" width="116" height="48" rx="8" class="bad"/>
  <text x="500" y="108" class="badt" text-anchor="middle">검증 안 함</text>
  <text x="500" y="127" class="val" text-anchor="middle">추측 그대로</text>
  <rect x="582" y="88" width="116" height="48" rx="8" class="bad"/>
  <text x="640" y="108" class="badt" text-anchor="middle">흩어진 파일</text>
  <text x="640" y="127" class="val" text-anchor="middle">추측이 남음</text>
  <line x1="279" y1="112" x2="299" y2="112" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="419" y1="112" x2="439" y2="112" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="559" y1="112" x2="579" y2="112" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="30" y="168" class="lane">Opus 5</text>
  <text x="30" y="186" class="sub">루프를 닫음</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="148" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="168" class="db" text-anchor="middle">실패 기록</text>
  <text x="220" y="187" class="val" text-anchor="middle">정답과 비교</text>
  <rect x="302" y="148" width="116" height="48" rx="8" class="box"/>
  <text x="360" y="168" class="db" text-anchor="middle">가설 세움</text>
  <text x="360" y="187" class="val" text-anchor="middle">원인 추측</text>
  <rect x="442" y="148" width="116" height="48" rx="8" class="ok"/>
  <text x="500" y="168" class="okt" text-anchor="middle">검증</text>
  <text x="500" y="187" class="val" text-anchor="middle">직접 확인</text>
  <rect x="582" y="148" width="116" height="48" rx="8" class="ok"/>
  <text x="640" y="168" class="okt" text-anchor="middle">규칙 작성</text>
  <text x="640" y="187" class="val" text-anchor="middle">근거·함정 경고</text>
  <line x1="279" y1="172" x2="299" y2="172" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="419" y1="172" x2="439" y2="172" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="559" y1="172" x2="579" y2="172" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="150" y="216" width="585" height="36" rx="6" class="dbbox"/>
  <text x="442" y="239" class="db" text-anchor="middle">메모리 디렉터리 — 질문마다 새 세션이지만 파일은 남음</text>
  <line x1="640" y1="197" x2="640" y2="214" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="220" y1="215" x2="220" y2="199" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="228" y="210" class="gnote">다음 질문에서 읽음</text>
  <text x="30" y="280" class="sub">실패를 기록하고, 원인을 가설로 세우고, 검증한 뒤 규칙으로 만든다. 검증을 건너뛰면 추측이 담긴 파일이 남는다.</text>
  <text x="30" y="300" class="sub">환경: Claude Managed Agents</text>
</svg>
