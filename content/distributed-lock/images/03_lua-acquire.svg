<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>클라이언트 A가 보낸 Lua 스크립트가 lock 키가 없음을 확인하고 해시 키와 만료 시간을 만들어 락을 얻고, 뒤이어 스크립트를 보낸 클라이언트 B는 키가 이미 있어 남은 TTL을 받고 실패한 뒤 채널을 구독하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .subc { font-size: 12px; fill: #6b7280; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .valc { font-size: 12.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .lbl { font-size: 12px; font-weight: 700; fill: #6b7280; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="280" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">Redisson 락 획득 시도 — Lua 스크립트</text>
  <text x="730" y="42" class="code" text-anchor="end">EVAL (Lua)</text>
  <text x="220" y="68" class="step" text-anchor="middle">1단계</text>
  <text x="360" y="68" class="step" text-anchor="middle">2단계</text>
  <text x="500" y="68" class="step" text-anchor="middle">3단계</text>
  <text x="640" y="68" class="step" text-anchor="middle">4단계</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">클라이언트 A</text>
  <text x="30" y="126" class="sub">먼저 시도</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="162.0" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="108" class="t" text-anchor="middle">lock 스크립트</text>
  <text x="220" y="127" class="val" text-anchor="middle">exists → 없음</text>
  <rect x="302.0" y="88" width="116" height="48" rx="8" class="ok"/>
  <text x="360" y="108" class="okt" text-anchor="middle">락 획득</text>
  <text x="360" y="127" class="val" text-anchor="middle">해시 키·만료 생성</text>
  <rect x="442" y="96" width="256" height="32" rx="6" class="hold"/>
  <text x="570" y="117" class="val" text-anchor="middle">작업 중 — 락 보유</text>
  <text x="30" y="168" class="lane">클라이언트 B</text>
  <text x="30" y="186" class="sub">나중에 시도</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="302.0" y="148" width="116" height="48" rx="8" class="box"/>
  <text x="360" y="168" class="t" text-anchor="middle">lock 스크립트</text>
  <text x="360" y="187" class="val" text-anchor="middle">exists → 있음</text>
  <rect x="442.0" y="148" width="116" height="48" rx="8" class="bad"/>
  <text x="500" y="168" class="badt" text-anchor="middle">획득 실패</text>
  <text x="500" y="187" class="val" text-anchor="middle">남은 TTL 반환</text>
  <rect x="582" y="156" width="116" height="32" rx="6" class="wait"/>
  <text x="640.0" y="177" class="waitt" text-anchor="middle">채널 구독, 대기</text>
  <text x="30" y="235" class="db">lock 키</text>
  <rect x="180" y="214" width="80" height="32" rx="6" class="dbbox"/>
  <text x="220" y="235" class="db" text-anchor="middle">없음</text>
  <rect x="320" y="214" width="80" height="32" rx="6" class="ok"/>
  <text x="360" y="235" class="okt" text-anchor="middle">A: 1</text>
  <rect x="460" y="214" width="80" height="32" rx="6" class="dbbox"/>
  <text x="500" y="235" class="db" text-anchor="middle">A: 1</text>
  <rect x="600" y="214" width="80" height="32" rx="6" class="dbbox"/>
  <text x="640" y="235" class="db" text-anchor="middle">A: 1</text>
  <text x="150" y="272" class="foot">확인과 생성을 스크립트 하나로 원자적으로 실행하기 때문에, 한 클라이언트만 성공합니다.</text>
</svg>
