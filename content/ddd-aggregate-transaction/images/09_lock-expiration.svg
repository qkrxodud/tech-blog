<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>잠금 유효 시간이 지나면 잠금이 해제되어 사용자 B가 잠금을 구할 수 있고, 만료 뒤에 수정 요청을 보낸 사용자 A는 checkLock에서 실패하며, 수정 폼에서 주기적으로 유효 시간을 늘리면 수정 요청이 성공하는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .valc { font-size: 12.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .dbt { font-size: 13px; font-weight: 700; fill: #374151; }
    .dbc { font-size: 14px; font-weight: 700; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="254" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">잠금 유효 시간 — 지나면 자동으로 해제</text>
  <text x="730" y="42" class="code" text-anchor="end">lockTimeout = 5 * 60 * 1000</text>
  <text x="220" y="68" class="step" text-anchor="middle">잠금 구함</text>
  <text x="360" y="68" class="step" text-anchor="middle">유효 시간 만료</text>
  <text x="500" y="68" class="step" text-anchor="middle">만료 뒤</text>
  <text x="640" y="68" class="step" text-anchor="middle">만료 1초 뒤</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="117" class="lane">사용자 A</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="88" width="116" height="48" rx="8" class="hold"/>
  <text x="220" y="108" class="t" text-anchor="middle">잠금 구함</text>
  <text x="220" y="127" class="val" text-anchor="middle">유효 시간 5분</text>
  <rect x="290" y="96" width="140" height="32" rx="6" class="wait"/>
  <text x="360.0" y="117.0" class="waitt" text-anchor="middle">수정 요청 없음</text>
  <rect x="574" y="88" width="132" height="48" rx="8" class="bad"/>
  <text x="640" y="108" class="badt" text-anchor="middle">수정 요청</text>
  <text x="640" y="127" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">checkLock()</tspan> 실패</text>
  <text x="30" y="177" class="lane">사용자 B</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="442" y="148" width="116" height="48" rx="8" class="ok"/>
  <text x="500" y="168" class="okt" text-anchor="middle">잠금 구함</text>
  <text x="500" y="187" class="val" text-anchor="middle">만료된 잠금 삭제</text>
  <text x="30" y="235" class="db">잠금</text>
  <rect x="162" y="214" width="256" height="32" rx="6" class="hold"/>
  <text x="290" y="235" class="dbt" text-anchor="middle">사용자 A</text>
  <rect x="442" y="214" width="256" height="32" rx="6" class="hold"/>
  <text x="570" y="235" class="dbt" text-anchor="middle">사용자 B</text>
  <rect x="10" y="280" width="740" height="180" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="312" class="h">유효 시간 연장 — 수정 폼에서 주기적으로 시간을 늘림</text>
  <text x="730" y="312" class="code" text-anchor="end">extendLockExpiration()</text>
  <text x="220" y="338" class="step" text-anchor="middle">잠금 구함</text>
  <text x="360" y="338" class="step" text-anchor="middle">1분마다 Ajax 호출</text>
  <text x="500" y="338" class="step" text-anchor="middle">수정 요청</text>
  <text x="640" y="338" class="step" text-anchor="middle">완료</text>
  <line x1="160" y1="346" x2="722" y2="346" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="387" class="lane">사용자 A</text>
  <rect x="150" y="356" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="358" width="116" height="48" rx="8" class="hold"/>
  <text x="220" y="378" class="t" text-anchor="middle">잠금 구함</text>
  <text x="220" y="397" class="val" text-anchor="middle">유효 시간 5분</text>
  <rect x="302" y="358" width="116" height="48" rx="8" class="box"/>
  <text x="360" y="378" class="t" text-anchor="middle">유효 시간 연장</text>
  <text x="360" y="397" class="val" text-anchor="middle">1분씩 증가</text>
  <rect x="434" y="358" width="132" height="48" rx="8" class="ok"/>
  <text x="500" y="378" class="okt" text-anchor="middle">수정 요청</text>
  <text x="500" y="397" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">checkLock()</tspan> 통과</text>
  <rect x="582" y="358" width="116" height="48" rx="8" class="ok"/>
  <text x="640" y="378" class="okt" text-anchor="middle">잠금 해제</text>
  <text x="640" y="397" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">releaseLock()</tspan></text>
  <text x="30" y="442" class="foot">사용자가 폼을 오래 열어 두어도 연장 요청이 이어지는 동안에는 잠금이 만료되지 않습니다.</text>
</svg>
