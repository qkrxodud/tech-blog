<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 518" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>5장 출발 코드의 취소 세 장면 — 15000원 결제를 5000원 부분 취소하면 PG 잔액은 10000원 PARTIAL_CANCELED인데 결제는 cancel() 전이로 APPROVAL_CANCELED가 되고, 두 번째 5000원은 PG를 먼저 불러 PG에서 취소된 뒤 우리 쪽 전이가 409로 거부된다. 같은 Idempotency-Key로 다시 온 취소는 키를 보지 않고 PG에 다시 보내 PG 취소 요청이 2번 간다. 승인 결과를 모르는 결제의 취소는 상태를 보지 않고 PG에 취소를 보낸 뒤 전이에서 409 INVALID_PAYMENT_TRANSITION으로 거부되어, PG에 보낸 요청이 0이어야 하는데 1이다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #4b5563; }
    .m { font-family: Menlo, Consolas, monospace; }
    .lbl { font-size: 12px; fill: #4b5563; }
    .tab { font-size: 12.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .badt { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .bads { font-size: 12px; fill: #b91c1c; }
    .okt { font-size: 13px; font-weight: 700; fill: #15803d; }
    .oks { font-size: 12px; fill: #15803d; }
    .gt { font-size: 13px; font-weight: 700; fill: #6b7280; }
    .gs { font-size: 12px; fill: #6b7280; }
    .ot { font-size: 13px; font-weight: 700; fill: #c2410c; }
    .os { font-size: 12px; fill: #c2410c; }
    .bt { font-size: 13px; font-weight: 700; fill: #1e3a8a; }
    .o { stroke: #1f2937; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .life { stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .run { stroke-dasharray: 5 4; animation: run 0.9s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -18; } }
    @media (prefers-reduced-motion: reduce) { .run { animation: none; } .anim { display: none; } }
  </style>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="aor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
    <marker id="abl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <g id="pkt">
      <rect x="-11" y="-8" width="22" height="16" rx="3" fill="#2dd4bf" stroke="#0f766e" stroke-width="1.5"/>
      <path d="M-10,-7 L0,1 L10,-7" fill="none" stroke="#0f766e" stroke-width="1.5"/>
    </g>
    <g id="pkt2">
      <rect x="-11" y="-8" width="22" height="16" rx="3" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/>
      <path d="M-10,-7 L0,1 L10,-7" fill="none" stroke="#c2410c" stroke-width="1.5"/>
    </g>
    <g id="xmark"><circle r="9" fill="#ef4444"/><path d="M-4,-4 L4,4 M4,-4 L-4,4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
    <g id="vmark"><circle r="9" fill="#22c55e"/><path d="M-4.5,0 L-1.5,3.5 L4.5,-3.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="xs"><circle r="7" fill="#ef4444"/><path d="M-3,-3 L3,3 M3,-3 L-3,3" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></g>
    <g id="vs"><circle r="7" fill="#22c55e"/><path d="M-3.5,0 L-1,2.8 L3.5,-2.8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="i-card"><rect x="0" y="3" width="32" height="22" rx="4" fill="#5eead4" class="o"/><rect x="0" y="8" width="32" height="5" fill="#1f2937"/><rect x="4" y="16" width="8" height="6" rx="1.5" fill="#fbbf24" class="o" stroke-width="1"/></g>
    <g id="i-app"><rect x="0" y="0" width="30" height="30" rx="5" fill="#93c5fd" class="o"/><path d="M0,9 h30" class="o" fill="none"/><circle cx="5" cy="4.5" r="1.4" fill="#1f2937"/><circle cx="10" cy="4.5" r="1.4" fill="#1f2937"/><path d="M7,16 h16 M7,22 h11" stroke="#1e3a8a" stroke-width="1.6" stroke-linecap="round"/></g>
    <g id="i-db"><path d="M1,5 v20 a13,5 0 0 0 26,0 v-20 a13,5 0 0 1 -26,0 z" fill="#60a5fa" class="o"/><path d="M1,15 a13,5 0 0 0 26,0" fill="none" class="o"/><ellipse cx="14" cy="5" rx="13" ry="5" fill="#bfdbfe" class="o"/></g>
    <g id="i-server"><rect x="0" y="0" width="36" height="13" rx="3" fill="#cbd5e1" class="o"/><rect x="0" y="16" width="36" height="13" rx="3" fill="#cbd5e1" class="o"/><circle cx="7" cy="6.5" r="2.2" fill="#22c55e"/><circle cx="7" cy="22.5" r="2.2" fill="#22c55e"/><path d="M14,6.5 h16 M14,22.5 h16" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/></g>
    <g id="i-coin"><circle cx="12" cy="12" r="11" fill="#fbbf24" class="o"/><circle cx="12" cy="12" r="7" fill="#fcd34d" stroke="#b45309" stroke-width="1"/><text x="12" y="16.5" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">₩</text></g>
    <g id="i-key"><circle cx="8" cy="12" r="7.5" fill="#fbbf24" class="o"/><circle cx="8" cy="12" r="2.6" fill="#ffffff" class="o" stroke-width="1.2"/><path d="M15.5,12 H30 V17.5 M25,12 V16.5" fill="none" class="o" stroke-width="2"/></g>
    <g id="i-clock"><circle cx="14" cy="14" r="13" fill="#fde68a" class="o"/><path d="M14,7 V14 L20,18" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/></g>
    <g id="i-chips"><rect x="0" y="4" width="13" height="14" rx="4" fill="#e5e7eb" class="o"/><rect x="21" y="4" width="13" height="14" rx="4" fill="#86efac" class="o"/><path d="M14,11 h6" class="o" fill="none"/><path d="M17,8 l3,3 l-3,3" class="o" fill="none"/></g>
    <g id="i-plane"><path d="M1,13 L31,1 L23,29 L15,19 Z" fill="#fdba74" class="o"/><path d="M15,19 L31,1 L11,16 Z" fill="#fb923c" class="o"/></g>
    <g id="i-doc"><path d="M0,0 h18 l8,8 v26 h-26 z" fill="#ffffff" class="o"/><path d="M18,0 v8 h8" fill="#e5e7eb" class="o"/><circle cx="20" cy="26" r="8" fill="#22c55e" class="o"/><path d="M16.5,26 l2.5,2.5 l4.5,-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5,10 h9 M5,16 h7" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/></g>
    <g id="i-table"><rect x="0" y="0" width="30" height="26" rx="3" fill="#ffffff" class="o"/><rect x="0" y="0" width="30" height="7" rx="3" fill="#60a5fa" class="o"/><path d="M0,13.5 h30 M0,20 h30 M11,7 v19" stroke="#1f2937" stroke-width="1.2"/></g>
    <g id="i-search"><circle cx="11" cy="11" r="9" fill="#bae6fd" class="o"/><path d="M18,18 L27,27" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/></g>
    <g id="i-chart"><rect x="0" y="16" width="7" height="12" fill="#93c5fd" class="o"/><rect x="10" y="8" width="7" height="20" fill="#60a5fa" class="o"/><rect x="20" y="2" width="7" height="26" fill="#2563eb" class="o"/></g>
  </defs>
  <rect width="760" height="518" fill="#ffffff"/>
  <text x="24" y="30" class="h">5장 출발 코드의 취소 — PG를 먼저 부르고 상태만 바꿀 때</text>
  <text x="24" y="52" class="gs">결제 15000원 · 부분 취소 5000원 · 받은 금액으로 PG에 취소를 보낸 뒤 결과와 상관없이 <tspan class="m">cancel()</tspan> 전이</text>
  <rect x="14" y="66" width="732" height="136" rx="14" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <use href="#i-coin" x="26" y="74"/>
  <text x="64" y="91" class="t2">① 부분 취소를 두 번 — 15000원 결제를 5000원씩</text>
  <rect x="26" y="106" width="150" height="66" rx="10" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <circle cx="26" cy="106" r="11" fill="#111827"/><text x="26" y="110" class="num" text-anchor="middle">1</text>
  <text x="40" y="127" class="t2">PG 취소 5000원</text>
  <text x="40" y="145" class="s">PG 잔액 10000원</text>
  <text x="40" y="162" class="s"><tspan class="m">PARTIAL_CANCELED</tspan></text>
  <line x1="177" y1="139" x2="188" y2="139" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <rect x="190" y="106" width="150" height="66" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="190" cy="106" r="11" fill="#111827"/><text x="190" y="110" class="num" text-anchor="middle">2</text>
  <text x="204" y="127" class="t2"><tspan class="m">cancel()</tspan> 전이</text>
  <text x="204" y="145" class="s">금액과 상관없이</text>
  <text x="204" y="162" class="s"><tspan class="m">APPROVAL_CANCELED</tspan></text>
  <line x1="341" y1="139" x2="352" y2="139" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <rect x="354" y="106" width="150" height="66" rx="10" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <circle cx="354" cy="106" r="11" fill="#111827"/><text x="354" y="110" class="num" text-anchor="middle">3</text>
  <text x="368" y="127" class="t2">두 번째 5000원</text>
  <text x="368" y="145" class="s">PG를 먼저 부름</text>
  <text x="368" y="162" class="s">PG 잔액 5000원</text>
  <line x1="505" y1="139" x2="516" y2="139" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="518" y="106" width="226" height="66" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="536" y="122"/>
  <text x="552" y="127" class="badt">전이 거부 — <tspan class="m">409</tspan></text>
  <text x="552" y="145" class="bads">PG에는 취소가 두 건 남음</text>
  <text x="552" y="162" class="bads">우리 쪽은 거부로 답함</text>
  <text x="28" y="192" class="bads">두 번째 전이 — <tspan class="m">Cannot CANCEL a payment in APPROVAL_CANCELED status.</tspan></text>
  <rect x="14" y="214" width="732" height="136" rx="14" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <use href="#i-key" x="24" y="220"/>
  <text x="64" y="239" class="t2">② 같은 Idempotency-Key로 다시 온 취소</text>
  <rect x="26" y="254" width="150" height="66" rx="10" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <circle cx="26" cy="254" r="11" fill="#111827"/><text x="26" y="258" class="num" text-anchor="middle">1</text>
  <text x="40" y="275" class="t2">PG 취소 5000원</text>
  <text x="40" y="293" class="s">키 <tspan class="m">cancel-1</tspan></text>
  <line x1="177" y1="287" x2="188" y2="287" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <rect x="190" y="254" width="150" height="66" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="190" cy="254" r="11" fill="#111827"/><text x="190" y="258" class="num" text-anchor="middle">2</text>
  <text x="204" y="275" class="t2"><tspan class="m">cancel()</tspan> 전이</text>
  <text x="204" y="293" class="s"><tspan class="m">APPROVAL_CANCELED</tspan></text>
  <line x1="341" y1="287" x2="352" y2="287" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <rect x="354" y="254" width="150" height="66" rx="10" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <circle cx="354" cy="254" r="11" fill="#111827"/><text x="354" y="258" class="num" text-anchor="middle">3</text>
  <text x="368" y="275" class="t2">다시 온 <tspan class="m">cancel-1</tspan></text>
  <text x="368" y="293" class="s">키를 보지 않고</text>
  <text x="368" y="310" class="s">PG에 다시 보냄</text>
  <line x1="505" y1="287" x2="516" y2="287" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="518" y="254" width="226" height="66" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="536" y="270"/>
  <text x="552" y="275" class="badt">PG 취소 요청 2번</text>
  <text x="552" y="293" class="bads"><tspan class="m">expected: 1 but was: 2</tspan></text>
  <text x="28" y="340" class="gs">출발 코드는 <tspan class="m">Idempotency-Key</tspan> 헤더를 받지만 쓰지 않고, 취소 이력도 남기지 않습니다</text>
  <rect x="14" y="362" width="732" height="136" rx="14" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <use href="#i-clock" x="26" y="370"/>
  <text x="64" y="387" class="t2">③ 승인 결과를 모르는 결제의 취소</text>
  <rect x="26" y="402" width="150" height="66" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <circle cx="26" cy="402" r="11" fill="#111827"/><text x="26" y="406" class="num" text-anchor="middle">1</text>
  <text x="40" y="423" class="t2">결제 상태</text>
  <text x="40" y="441" class="s"><tspan class="m">APPROVAL_UNKNOWN</tspan></text>
  <text x="40" y="458" class="s">상태를 보지 않음</text>
  <line x1="177" y1="435" x2="188" y2="435" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <rect x="190" y="402" width="150" height="66" rx="10" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <circle cx="190" cy="402" r="11" fill="#111827"/><text x="190" y="406" class="num" text-anchor="middle">2</text>
  <text x="204" y="423" class="t2">PG에 취소 요청</text>
  <text x="204" y="441" class="s">PG를 먼저 부름</text>
  <line x1="341" y1="435" x2="352" y2="435" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <rect x="354" y="402" width="150" height="66" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="354" cy="402" r="11" fill="#111827"/><text x="354" y="406" class="num" text-anchor="middle">3</text>
  <text x="368" y="423" class="t2"><tspan class="m">cancel()</tspan> 전이</text>
  <text x="368" y="441" class="s">전이 표에 없음</text>
  <line x1="505" y1="435" x2="516" y2="435" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="518" y="402" width="226" height="66" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="536" y="418"/>
  <text x="552" y="423" class="badt">전이 거부 — <tspan class="m">409</tspan></text>
  <text x="536" y="441" class="bads"><tspan class="m">INVALID_PAYMENT_TRANSITION</tspan></text>
  <text x="28" y="488" class="bads">거부 코드 테스트는 통과했지만 PG에 취소가 나간 뒤였습니다 — PG에 보낸 요청 <tspan class="m">expected: 0 but was: 1</tspan></text>
</svg>
