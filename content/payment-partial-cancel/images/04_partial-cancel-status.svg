  <circle cx="456" cy="108" r="11" fill="#111827"/><text x="456" y="112" class="num" text-anchor="middle">2</text>
  <text x="460" y="138" class="t2" text-anchor="middle">남은 0원?</text>
  <text x="460" y="156" class="s" text-anchor="middle">아니오</text>
  <rect x="563" y="112" width="130" height="56" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <rect x="563" y="112" width="130" height="56" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.392;0.402;0.452;0.462;1"/></rect>
  <text x="628.0" y="136" class="t2" text-anchor="middle" style="font-size: 12.5px"><tspan class="m">APPROVED</tspan></text>
  <text x="628.0" y="155" class="s" text-anchor="middle">남은 10000원</text>
  <rect x="548" y="234" width="160" height="56" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
