  <rect width="760" height="400" fill="#ffffff"/>
  <text x="24" y="28" class="h">테스트 결과 — 출발 코드에서 12장 완성 코드로</text>
  <text x="24" y="48" class="gs" style="font-size:11px">출발: <tspan class="m">./gradlew clean test</tspan>(별도 worktree, 2026-11-22) · 완성: <tspan class="m">./gradlew clean check</tspan>(2026-11-23)</text>
  <rect x="14" y="64" width="300" height="170" rx="12" fill="#fff7f7" stroke="#e08a8a" stroke-width="1.5"/>
