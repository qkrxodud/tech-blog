  <rect x="232" y="200" width="196" height="52" rx="8" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/><text x="330" y="222" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px"><tspan class="m">stock-reservation-commands</tspan></text><text x="330" y="238" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">확정·해제 명령(<tspan class="m">commandId</tspan>)</text>
