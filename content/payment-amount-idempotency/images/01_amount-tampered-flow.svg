  <rect width="760" height="526" fill="#ffffff"/>
  <text x="24" y="30" class="h">결제창에서 금액을 바꿨을 때 — 받은 금액을 보낼지, 비교할지</text>
  <text x="24" y="52" class="s">준비 금액 15000(DB에는 <tspan class="m">15000.00</tspan>)인 결제에, 결제창에서 100원으로 인증한 고객이 승인을 요청</text>
  <text x="24" y="86" class="h2">3장 출발 코드 — 받은 금액을 그대로 PG에 보냄</text>
