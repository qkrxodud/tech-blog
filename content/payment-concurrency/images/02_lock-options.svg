<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 612" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>같은 결제를 바꾸는 기록을 가리는 다섯 방식에 두 입력을 넣은 결과 — 15000원 결제에 남은 금액을 넘는 10000원 취소 둘에서 결제 줄 잠금은 나중 취소를 기다리게 한 뒤 남은 금액보다 크다고 거부해 PG에 1건만 보내고, 잠그지 않음·상태 조건 UPDATE·@Version 그대로는 둘 다 PG로 보내며 변경 번호 비교는 나중 취소에 409를 준다. 겹친 5000원 부분 취소 둘에서는 변경 번호 비교만 첫 취소의 답 기록을 409로 되돌려 우리 10000원, PG 5000원으로 어긋난다. 계약 11개 중 실패는 0, 6, 2, 3, 4개이고 Redis 분산 잠금은 구현하지 않았다</title>
