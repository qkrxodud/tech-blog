<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>같은 주문번호의 준비 둘이 겹칠 때 — 준비 A가 결제를 찾지 못해 insert하고 트리거로 1초 붙잡힌 사이 준비 B도 결제를 찾지 못해 insert하다 uk_payment_order_id에서 기다리고, A가 커밋하면 B는 DataIntegrityViolationException으로 되돌려진다. 트랜잭션 없는 서비스가 이를 잡아 readOnly 새 트랜잭션에서 A의 결제를 다시 읽고 같은 금액이면 201, 다른 금액이면 409 DUPLICATE_ORDER로 답한다. 잡지 않으면 B는 500이고, GET_LOCK 이름 잠금은 계약을 지키지만 준비 한 건에 연결이 둘 든다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
