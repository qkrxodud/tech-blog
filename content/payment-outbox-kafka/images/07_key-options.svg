  <rect width="760" height="438" fill="#ffffff"/>
  <text x="24" y="28" class="h">결정 4 — 같은 결제의 이벤트 순서를 어떻게 지킬까</text>
  <text x="24" y="48" class="gs" style="font-size:11.5px">같은 입력: 같은 결제의 승인(n)·취소(n+1), 주문 서비스가 승인을 남기는 기록에서 1초 붙잡힘</text>
  <text x="205" y="74" class="gt" text-anchor="middle">릴레이</text>
  <text x="372" y="74" class="gt" text-anchor="middle">토픽 <tspan class="m">payment-events</tspan></text>
  <text x="530" y="74" class="gt" text-anchor="middle">주문 서비스</text>
  <text x="676" y="74" class="gt" text-anchor="middle">받은 순서 · 주문</text>
