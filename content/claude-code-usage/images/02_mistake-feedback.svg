<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 258" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>루프 843에서 setter가 섞인 코드가 생겨 feedback_no_setter.md를 기록하고, 다음 루프부터 이 파일을 읽어 changeXxx() 메서드로 작성하는 흐름</title>
  <style>
