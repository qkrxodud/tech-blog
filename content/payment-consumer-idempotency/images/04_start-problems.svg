<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>11장 출발 코드에서 재현한 문제 다섯 가지 — 1 같은 메시지 두 번: 주문 서비스는 다시 보낸 결과에 받은 기록 2줄(기대 1), 다시 읽은 결과에 주문 상태는 같지만 updated_at이 다시 바뀜. 재고 서비스는 10장 예약 상태 전이로 재현되지 않음. 2 늦게 온 옛 메시지: 취소 뒤 옛 승인에 PAID(기대 CANCELED), 시계가 다른 서버의 새 결과는 받은 순서대로 따라 통과. 재고는 해제가 끝 상태라 재현되지 않음. 3 처리할 수 없는 메시지: 모르는 상태와 읽을 수 없는 본문은 기본 처리 10번 뒤 로그만 남아 30초 동안 실패 모음에 없음, 재고는 읽을 수 없는 명령도 같고 모르는 명령 HOLD를 해제로 처리해 RELEASED(기대 RESERVED). 4 일시 장애: 6초 read_only 동안 온 결과와 명령이 기본 처리 10번을 장애 중에 다 써 반영되지 않고, 주문의 다시 시도 중 순서도 앞 승인을 잃어 실패, 1.5초 장애로는 재현되지 않음. 5 같은 파티션 막힘: 모르는 상태 뒤 결과가 4.60초 뒤 반영(기대 2초 안), 재고는 모르는 명령을 해제로 처리해 통과. 나머지는 실패 모음·다시 넣기 계약 3개씩이고, 737개 중 18개(주문 12 중 11, 재고 12 중 7)가 실패하고 앞 장 713개는 통과한 그림</title>
