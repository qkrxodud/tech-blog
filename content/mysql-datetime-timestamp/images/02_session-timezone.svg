<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>+09:00 세션에서 dt와 ts에 같은 값을 넣고 +00:00 세션에서 조회하면 dt는 14:00 그대로, ts는 05:00으로 보이는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="336" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="316" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">세션 타임존 바꾸기 — dt는 그대로, ts만 달라짐</text>
  <text x="730" y="42" class="code" text-anchor="end">SELECT dt, ts</text>
  <text x="218" y="68" class="step" text-anchor="middle">SET +09:00</text>
  <text x="358" y="68" class="step" text-anchor="middle">INSERT</text>
  <text x="498" y="68" class="step" text-anchor="middle">SET +00:00</text>
  <text x="638" y="68" class="step" text-anchor="middle">SELECT</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">세션</text>
  <text x="30" y="126" class="sub">time_zone</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="156" y="88" width="124" height="48" rx="8" class="box"/>
  <text x="218" y="108" class="op" text-anchor="middle">+09:00</text>
  <text x="218" y="127" class="val" text-anchor="middle">한국 세션</text>
  <rect x="436" y="88" width="124" height="48" rx="8" class="box"/>
  <text x="498" y="108" class="op" text-anchor="middle">+00:00</text>
  <text x="498" y="127" class="val" text-anchor="middle">UTC 세션</text>
  <text x="30" y="168" class="lane">dt</text>
  <text x="30" y="186" class="sub">DATETIME</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="296" y="148" width="124" height="48" rx="8" class="hold"/>
  <text x="358" y="168" class="op" text-anchor="middle">14:00:00</text>
  <text x="358" y="187" class="val" text-anchor="middle">그대로 저장</text>
  <rect x="576" y="148" width="124" height="48" rx="8" class="ok"/>
  <text x="638" y="168" class="okc" text-anchor="middle">14:00:00</text>
  <text x="638" y="187" class="val" text-anchor="middle">그대로</text>
  <text x="30" y="228" class="lane">ts</text>
  <text x="30" y="246" class="sub">TIMESTAMP</text>
  <rect x="150" y="206" width="585" height="52" rx="6" class="track"/>
  <rect x="296" y="208" width="124" height="48" rx="8" class="hold"/>
  <text x="358" y="228" class="op" text-anchor="middle">14:00:00</text>
  <text x="358" y="247" class="val" text-anchor="middle">UTC 05:00로 저장</text>
  <rect x="576" y="208" width="124" height="48" rx="8" class="bad"/>
  <text x="638" y="228" class="badc" text-anchor="middle">05:00:00</text>
  <text x="638" y="247" class="val" text-anchor="middle">9시간 전으로 보임</text>
  <text x="150" y="290" class="sub">저장된 데이터는 그대로이고, 조회하는 세션의 타임존이 바뀌어서 ts의 표시만 바뀝니다</text>

</svg>
