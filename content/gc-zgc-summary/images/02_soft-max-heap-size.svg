<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>-Xmx5g -XX:SoftMaxHeapSize=4g로 설정하면 ZGC는 평소 4g 안에서 운영하고, 힙이 부족할 때만 4g에서 5g 사이까지 사용한다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .mc { font-family: Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 700; fill: #1f2937; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .gauge { fill: #ffffff; stroke: #c4c8ce; stroke-width: 1.2; }
    .used { fill: #d1d5db; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <pattern id="small" width="4" height="36" patternUnits="userSpaceOnUse">
      <rect width="4" height="36" fill="#fee2e2"/>
      <line x1="3.5" y1="0" x2="3.5" y2="36" stroke="#f87171" stroke-width="1"/>
    </pattern>
    <pattern id="large" x="150" width="56.25" height="36" patternUnits="userSpaceOnUse">
      <rect width="56.25" height="36" fill="#dcfce7"/>
      <line x1="55.75" y1="0" x2="55.75" y2="36" stroke="#16a34a" stroke-width="1.2"/>
    </pattern>
  </defs>
  <rect width="760" height="290" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="270" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">SoftMaxHeapSize — 평소에는 4g 안에서, 부족하면 -Xmx까지</text>
  <text x="30" y="66" class="code">-Xmx5g -XX:SoftMaxHeapSize=4g</text>

  <text x="582" y="104" class="code" text-anchor="middle">SoftMaxHeapSize</text>
  <text x="690" y="104" class="code" text-anchor="middle">-Xmx</text>
  <text x="30" y="140" class="lane">힙</text>
  <rect x="150" y="114" width="432" height="52" rx="6" class="ok"/>
  <text x="366" y="136" class="okt" text-anchor="middle">평소 운영 범위</text>
  <text x="366" y="155" class="val" text-anchor="middle">ZGC가 최대한 넘지 않으려고 함</text>
  <rect x="582" y="114" width="108" height="52" rx="6" class="wait"/>
  <text x="636" y="136" class="waitt" text-anchor="middle">힙이 부족할</text>
  <text x="636" y="154" class="waitt" text-anchor="middle">때만 사용</text>

  <line x1="150" y1="166" x2="150" y2="178" class="axis"/>
  <line x1="582" y1="166" x2="582" y2="178" class="axis"/>
  <line x1="690" y1="166" x2="690" y2="178" class="axis"/>
  <text x="150" y="194" class="step" text-anchor="middle">0</text>
  <text x="582" y="194" class="step" text-anchor="middle">4g</text>
  <text x="690" y="194" class="step" text-anchor="middle">5g</text>

  <text x="150" y="232" class="sub">· 디폴트 값은 0이며, 이때는 -Xmx와 동일하다</text>
  <text x="150" y="254" class="sub">· -Xmx와 -Xms를 다르게 준 경우에 의미가 있다</text>
</svg>
