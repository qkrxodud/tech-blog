<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 628" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 3 운영 구현에서 겹친 나중 준비가 지나는 순서 — 트랜잭션이 없는 PaymentPrepareService가 PaymentPrepareRecorder.prepare(트랜잭션 1)를 부르면 주문번호로 결제를 찾지 못하고 새 결제를 저장하다 uk_payment_order_id 중복 거부(DataIntegrityViolationException)를 받아 그 트랜잭션은 되돌리기로 표시됨. 서비스가 그 거부를 잡아 prepareAgain(트랜잭션 2, readOnly)에서 먼저 남은 결제를 다시 읽고 verifyPreparedAmount로 3장 규칙대로 금액이 같으면 그 결제 201, 다르면 409 DUPLICATE_ORDER로 답함. 다시 읽어도 결제가 없으면 주문번호 중복이 아닌 거부라 원래 예외를 그대로 알림</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #4b5563; }
    .m { font-family: Menlo, Consolas, monospace; }
