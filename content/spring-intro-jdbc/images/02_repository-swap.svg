<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>SpringConfig의 memberRepository()가 반환하는 구현체를 MemoryMemberRepository에서 JdbcMemberRepository로 바꾸면, MemberRepository 인터페이스에 의존하는 MemberService는 그대로 두고 저장소만 H2 DB로 바뀌는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .grp { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 13px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 12px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="350" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="330" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">구현체 교체 — SpringConfig의 Repository 빈만 바꾼다</text>
  <text x="730" y="42" class="code" text-anchor="end">SpringConfig.java</text>

  <rect x="30" y="64" width="318" height="232" rx="10" class="grp"/>
  <text x="46" y="90" class="op">SpringConfig</text>
  <text x="46" y="112" class="m">memberRepository()</text>
  <text x="46" y="142" class="step">변경 전 (주석 처리)</text>
  <rect x="44" y="148" width="290" height="52" rx="8" class="wait"/>
  <text x="189" y="179" class="m" text-anchor="middle" fill="#9ca3af">new MemoryMemberRepository()</text>
  <text x="46" y="220" class="step">변경 후</text>
  <rect x="44" y="228" width="290" height="52" rx="8" class="ok"/>
  <text x="189" y="259" class="okm" text-anchor="middle">new JdbcMemberRepository(dataSource)</text>

  <rect x="372" y="70" width="160" height="52" rx="8" class="box"/>
  <text x="452" y="93" class="op" text-anchor="middle">MemberService</text>
  <text x="452" y="111" class="sub" text-anchor="middle">코드 변경 없음</text>
  <line x1="534" y1="96" x2="562" y2="96" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="566" y="70" width="170" height="52" rx="8" class="hold"/>
  <text x="651" y="93" class="op" text-anchor="middle">MemberRepository</text>
  <text x="651" y="111" class="sub" text-anchor="middle">인터페이스</text>

  <line x1="336" y1="174" x2="368" y2="174" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <rect x="372" y="148" width="180" height="52" rx="8" class="wait"/>
  <text x="462" y="171" class="m" text-anchor="middle" fill="#9ca3af">MemoryMemberRepository</text>
  <text x="462" y="189" class="sub" text-anchor="middle">변경 전 구현체</text>
  <line x1="554" y1="166" x2="606" y2="126" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ag)"/>

  <line x1="336" y1="254" x2="368" y2="254" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="372" y="228" width="180" height="52" rx="8" class="ok"/>
  <text x="462" y="251" class="okm" text-anchor="middle">JdbcMemberRepository</text>
  <text x="462" y="269" class="sub" text-anchor="middle">변경 후 구현체</text>
  <line x1="540" y1="226" x2="690" y2="126" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="664" y="190" class="gnote" text-anchor="middle">구현</text>

  <line x1="554" y1="254" x2="596" y2="254" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="600" y="228" width="136" height="52" rx="8" class="hold"/>
  <text x="668" y="251" class="t" text-anchor="middle">H2 DB</text>
  <text x="668" y="269" class="sub" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">DataSource</tspan>로 연결</text>

  <text x="30" y="322" class="foot"><tspan font-family="Menlo, Consolas, monospace">MemberService</tspan>는 <tspan font-family="Menlo, Consolas, monospace">MemberRepository</tspan> 인터페이스에만 의존하므로, 바꾸는 곳은 SpringConfig 한 군데입니다.</text>
</svg>
