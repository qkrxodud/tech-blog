<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>BirdHandler.letBirdFly에 Parrot을 넘기면 fly()가 정상 동작하고, Ostrich를 넘기면 UnsupportedOperationException이 발생해 Bird 자리를 대체하지 못하는 그림</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .bt { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .gl { font-size: 12.5px; font-weight: 700; fill: #6b7280; }
    .cv { font-family: Menlo, Consolas, monospace; font-size: 12.5px; fill: #4b5563; }
    .cvb { font-family: Menlo, Consolas, monospace; font-size: 12.5px; fill: #b91c1c; }
    .cvg { font-family: Menlo, Consolas, monospace; font-size: 12.5px; fill: #15803d; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="290" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="270" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">LSP — Bird 자리에 넣었을 때 동작하는가</text>
  <text x="730" y="42" class="code" text-anchor="end">letBirdFly(Bird bird)</text>
  <text x="210" y="68" class="step" text-anchor="middle">넘기는 객체</text>
  <text x="350" y="68" class="step" text-anchor="middle">BirdHandler</text>
  <text x="490" y="68" class="step" text-anchor="middle">오버라이드한 fly()</text>
  <text x="645" y="68" class="step" text-anchor="middle">결과</text>
  <line x1="150" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>

  <text x="30" y="108" class="lane">Parrot</text>
  <text x="30" y="126" class="sub">앵무새</text>
  <rect x="140" y="86" width="595" height="52" rx="6" class="track"/>
  <rect x="152" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="210" y="108" class="op" text-anchor="middle">Parrot</text>
  <text x="210" y="127" class="val" text-anchor="middle">Bird로 전달</text>
  <rect x="292" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="350" y="108" class="op" text-anchor="middle">bird.fly()</text>
  <text x="350" y="127" class="val" text-anchor="middle">호출</text>
  <rect x="432" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="490" y="108" class="op" text-anchor="middle">fly()</text>
  <text x="490" y="127" class="val" text-anchor="middle">출력</text>
  <rect x="565" y="88" width="160" height="48" rx="8" class="ok"/>
  <text x="645" y="108" class="okt" text-anchor="middle">정상 동작</text>
  <text x="645" y="127" class="cvg" text-anchor="middle">Parrot is flying</text>

  <text x="30" y="178" class="lane">Ostrich</text>
  <text x="30" y="196" class="sub">타조</text>
  <rect x="140" y="156" width="595" height="52" rx="6" class="track"/>
  <rect x="152" y="158" width="116" height="48" rx="8" class="box"/>
  <text x="210" y="178" class="op" text-anchor="middle">Ostrich</text>
  <text x="210" y="197" class="val" text-anchor="middle">Bird로 전달</text>
  <rect x="292" y="158" width="116" height="48" rx="8" class="box"/>
  <text x="350" y="178" class="op" text-anchor="middle">bird.fly()</text>
  <text x="350" y="197" class="val" text-anchor="middle">호출</text>
  <rect x="432" y="158" width="116" height="48" rx="8" class="bad"/>
  <text x="490" y="178" class="badc" text-anchor="middle">throw</text>
  <text x="490" y="197" class="val" text-anchor="middle">예외를 던짐</text>
  <rect x="565" y="158" width="160" height="48" rx="8" class="bad"/>
  <text x="645" y="178" class="badt" text-anchor="middle">대체 불가</text>
  <text x="645" y="197" class="cvb" text-anchor="middle">Ostrich can't fly!</text>
  <text x="30" y="236" class="note">Ostrich의 fly()는 UnsupportedOperationException을 던지므로, Bird 자리에 넣으면 BirdHandler가 기대한 동작이 깨집니다.</text>
  <text x="30" y="260" class="sub">Parrot은 Bird 자리에 넣어도 날아가는 동작을 그대로 지키므로 부모 클래스를 대체할 수 있습니다.</text>
</svg>
