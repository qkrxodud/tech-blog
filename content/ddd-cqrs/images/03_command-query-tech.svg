<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>명령 모델은 응용 서비스, 도메인, JPA 리포지터리와 RDBMS를 쓰고, 조회 모델은 DTO/DAO와 NoSQL을 쓰며 둘 사이를 이벤트로 동기화하는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opk { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .ster { font-size: 11.5px; font-style: italic; fill: #6b7280; }
    .cls { font-size: 15px; font-weight: 700; fill: #1f2937; }
    .attr { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
    .sep { stroke: #d1d5db; stroke-width: 1; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
    <marker id="dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="14" markerHeight="9" orient="auto">
      <path d="M1,5 L8,1 L15,5 L8,9 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="760" height="490" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="470" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">명령 모델과 조회 모델이 다른 기술 사용 — 이벤트로 동기화</text>
  <text x="730" y="42" class="code" text-anchor="end">RDBMS / NoSQL</text>
  <text x="170" y="84" class="lane" text-anchor="middle">명령 모델</text>
  <text x="590" y="84" class="lane" text-anchor="middle">조회 모델</text>
  <rect x="50" y="100" width="240" height="46" rx="8" class="box"/>
  <text x="170" y="128" class="opk" text-anchor="middle">컨트롤러</text>
  <line x1="170" y1="147" x2="170" y2="170" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="50" y="172" width="240" height="46" rx="8" class="box"/>
  <text x="170" y="200" class="opk" text-anchor="middle">응용 서비스</text>
  <line x1="170" y1="219" x2="170" y2="242" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="50" y="244" width="240" height="46" rx="8" class="box"/>
  <text x="170" y="272" class="opk" text-anchor="middle">도메인</text>
  <line x1="170" y1="291" x2="170" y2="314" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="50" y="316" width="240" height="46" rx="8" class="box"/>
  <text x="170" y="344" class="opk" text-anchor="middle">인프라 (JPA 리포지터리 구현)</text>
  <line x1="170" y1="363" x2="170" y2="386" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="90" y="388" width="160" height="50" rx="24" class="dbbox"/>
  <text x="170" y="418" class="db" text-anchor="middle">RDBMS</text>
  <rect x="470" y="100" width="240" height="46" rx="8" class="box"/>
  <text x="590" y="128" class="opk" text-anchor="middle">컨트롤러</text>
  <line x1="590" y1="147" x2="590" y2="170" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="470" y="172" width="240" height="46" rx="8" class="box"/>
  <text x="590" y="200" class="opk" text-anchor="middle">DTO/DAO</text>
  <line x1="590" y1="219" x2="590" y2="242" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="470" y="244" width="240" height="46" rx="8" class="box"/>
  <text x="590" y="272" class="opk" text-anchor="middle">도메인</text>
  <line x1="590" y1="291" x2="590" y2="314" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="470" y="316" width="240" height="46" rx="8" class="box"/>
  <text x="590" y="344" class="opk" text-anchor="middle">인프라 (NoSQL: DAO 구현)</text>
  <line x1="590" y1="363" x2="590" y2="386" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="510" y="388" width="160" height="50" rx="24" class="dbbox"/>
  <text x="590" y="418" class="db" text-anchor="middle">NoSQL</text>
  <line x1="310" y1="266" x2="450" y2="266" stroke="#16a34a" stroke-width="2" marker-end="url(#agr)"/>
  <rect x="330" y="230" width="100" height="28" rx="14" class="ok"/>
  <text x="380" y="249" class="okt" text-anchor="middle">이벤트</text>
  <text x="380" y="290" class="gnote" text-anchor="middle">변경 내용 전달</text>
</svg>
