  <rect width="760" height="470" fill="#ffffff"/>
  <text x="24" y="28" class="h">결정 4의 비용 — 열리기 전과 열린 동안</text>
  <text x="24" y="48" class="gs" style="font-size:10.5px">장애 15초 측정(고객 20명, 운영 값) · 15초 뒤 새 요청을 멈춤 · 약 5초 경계와 15초 뒤는 운영 값으로 그린 모양(측정값 아님)</text>
