<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>팀A에 member1과 member2, 팀B에 member3가 있을 때 팀과 회원을 조인하면 SQL 결과가 세 행이 되고, 결과 리스트에 같은 팀A 엔티티가 두 번 담기는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .msg { font-size: 11.5px; fill: #374151; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .cont { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="396" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="376" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">컬렉션 페치 조인 — 회원 수만큼 팀이 중복</text>
  <text x="730" y="42" class="code" text-anchor="end">join fetch t.memberList</text>
  <text x="30" y="84" class="ts" text-anchor="start">TEAM</text>
  <rect x="30" y="92" width="120" height="28" rx="4" class="hold"/>
  <text x="90.0" y="111" class="ts" text-anchor="middle">name</text>
  <rect x="30" y="120" width="120" height="28" rx="0" class="box"/>
  <text x="90.0" y="139" class="val" text-anchor="middle">팀A</text>
  <rect x="30" y="148" width="120" height="28" rx="0" class="box"/>
  <text x="90.0" y="167" class="val" text-anchor="middle">팀B</text>
  <text x="30" y="200" class="ts" text-anchor="start">MEMBER</text>
  <rect x="30" y="208" width="170" height="28" rx="4" class="hold"/>
  <text x="75.0" y="227" class="ts" text-anchor="middle">회원</text>
  <text x="160.0" y="227" class="ts" text-anchor="middle">팀</text>
  <rect x="30" y="236" width="170" height="28" rx="0" class="box"/>
  <text x="75.0" y="255" class="val" text-anchor="middle">member1</text>
  <text x="160.0" y="255" class="val" text-anchor="middle">팀A</text>
  <rect x="30" y="264" width="170" height="28" rx="0" class="box"/>
  <text x="75.0" y="283" class="val" text-anchor="middle">member2</text>
  <text x="160.0" y="283" class="val" text-anchor="middle">팀A</text>
  <rect x="30" y="292" width="170" height="28" rx="0" class="box"/>
  <text x="75.0" y="311" class="val" text-anchor="middle">member3</text>
  <text x="160.0" y="311" class="val" text-anchor="middle">팀B</text>
  <line x1="120" y1="208" x2="120" y2="320" stroke="#d1d5db" stroke-width="1"/>
  <text x="260" y="142" class="ts" text-anchor="start">SQL 결과 (조인한 행)</text>
  <rect x="260" y="150" width="180" height="28" rx="4" class="hold"/>
  <text x="300.0" y="169" class="ts" text-anchor="middle">팀</text>
  <text x="390.0" y="169" class="ts" text-anchor="middle">회원</text>
  <rect x="260" y="178" width="180" height="28" rx="0" class="box"/>
  <text x="300.0" y="197" class="val" text-anchor="middle">팀A</text>
  <text x="390.0" y="197" class="val" text-anchor="middle">member1</text>
  <rect x="260" y="206" width="180" height="28" rx="0" class="box"/>
  <text x="300.0" y="225" class="val" text-anchor="middle">팀A</text>
  <text x="390.0" y="225" class="val" text-anchor="middle">member2</text>
  <rect x="260" y="234" width="180" height="28" rx="0" class="box"/>
  <text x="300.0" y="253" class="val" text-anchor="middle">팀B</text>
  <text x="390.0" y="253" class="val" text-anchor="middle">member3</text>
  <line x1="340" y1="150" x2="340" y2="262" stroke="#d1d5db" stroke-width="1"/>
  <line x1="208" y1="190" x2="254" y2="190" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="444" y1="206" x2="500" y2="206" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="560" y="142" class="opm" text-anchor="start">resultList</text>
  <rect x="560" y="154" width="170" height="44" rx="8" class="box"/>
  <text x="645.0" y="174" class="t" text-anchor="middle">팀A</text>
  <text x="645.0" y="193" class="val" text-anchor="middle">memberList: 2명</text>
  <rect x="560" y="206" width="170" height="44" rx="8" class="bad"/>
  <text x="645.0" y="226" class="badt" text-anchor="middle">팀A</text>
  <text x="645.0" y="245" class="val" text-anchor="middle">같은 엔티티가 한 번 더</text>
  <rect x="560" y="258" width="170" height="44" rx="8" class="box"/>
  <text x="645.0" y="278" class="t" text-anchor="middle">팀B</text>
  <text x="645.0" y="297" class="val" text-anchor="middle">memberList: 1명</text>
  <text x="30" y="356" class="sub" text-anchor="start">조인하면 팀A가 회원 두 명만큼 두 행이 되므로, 결과 리스트에도 팀A가 두 번 담깁니다</text>
</svg>
