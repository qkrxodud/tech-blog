<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>text 타입은 문자열을 토큰으로 쪼개 저장해 유연하게 검색되고, keyword 타입은 문자열 그대로 저장해 정확히 일치할 때만 검색된다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 14px; font-weight: 600; fill: #1f2937; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opn { font-size: 13px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .lbl { font-size: 12.5px; font-weight: 700; fill: #6b7280; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="520" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="236" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">text — 토큰으로 쪼개서 저장</text>
  <text x="730" y="42" class="code" text-anchor="end">"type": "text"</text>
  <text x="30" y="82" class="sub">저장할 값</text>
  <rect x="110" y="62" width="360" height="32" rx="6" class="box"/>
  <text x="290" y="83" class="t2" text-anchor="middle">Apple 2025 맥북 에어 13 M4 10코어</text>
  <line x1="290" y1="96" x2="290" y2="116" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="30" y="140" class="sub">저장된 토큰</text>
  <rect x="110" y="120" width="67" height="30" rx="6" class="hold"/>
  <text x="143.5" y="140" class="opn" text-anchor="middle">Apple</text>
  <rect x="187" y="120" width="58" height="30" rx="6" class="hold"/>
  <text x="216" y="140" class="opn" text-anchor="middle">2025</text>
  <rect x="255" y="120" width="50" height="30" rx="6" class="hold"/>
  <text x="280" y="140" class="t2" text-anchor="middle">맥북</text>
  <rect x="315" y="120" width="50" height="30" rx="6" class="hold"/>
  <text x="340" y="140" class="t2" text-anchor="middle">에어</text>
  <rect x="375" y="120" width="40" height="30" rx="6" class="hold"/>
  <text x="395" y="140" class="opn" text-anchor="middle">13</text>
  <rect x="425" y="120" width="40" height="30" rx="6" class="hold"/>
  <text x="445" y="140" class="opn" text-anchor="middle">M4</text>
  <rect x="475" y="120" width="78" height="30" rx="6" class="hold"/>
  <text x="514" y="140" class="t2" text-anchor="middle">10코어</text>
  <text x="30" y="196" class="sub">검색어</text>
  <rect x="110" y="176" width="90" height="32" rx="6" class="box"/>
  <text x="155" y="197" class="t2" text-anchor="middle">맥북</text>
  <line x1="202" y1="192" x2="236" y2="192" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="240" y="176" width="240" height="32" rx="15" class="ok"/>
  <text x="360" y="197" class="okt" text-anchor="middle">토큰 ‘맥북’과 일치 — 조회됨</text>
  <text x="30" y="234" class="gnote">완전히 일치하지 않아도 비슷한 데이터를 조회해 오는 유연한 검색이 필요할 때 사용합니다.</text>
  <rect x="10" y="262" width="740" height="248" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="294" class="h">keyword — 문자열 그대로 저장</text>
  <text x="730" y="294" class="code" text-anchor="end">"type": "keyword"</text>
  <text x="30" y="334" class="sub">저장할 값</text>
  <rect x="110" y="314" width="200" height="32" rx="6" class="box"/>
  <text x="210" y="335" class="opn" text-anchor="middle">010-1234-5678</text>
  <line x1="210" y1="348" x2="210" y2="368" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="30" y="392" class="sub">저장된 토큰</text>
  <rect x="110" y="372" width="200" height="30" rx="6" class="hold"/>
  <text x="210" y="392" class="opn" text-anchor="middle">010-1234-5678</text>
  <text x="326" y="392" class="val">쪼개지 않고 하나의 값으로 저장</text>
  <text x="30" y="440" class="sub">검색어</text>
  <rect x="110" y="420" width="160" height="32" rx="6" class="box"/>
  <text x="190" y="441" class="opn" text-anchor="middle">010-1234-5678</text>
  <line x1="272" y1="436" x2="306" y2="436" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="310" y="420" width="120" height="32" rx="15" class="ok"/>
  <text x="370" y="441" class="okt" text-anchor="middle">일치 — 조회됨</text>
  <rect x="450" y="420" width="70" height="32" rx="6" class="box"/>
  <text x="485" y="441" class="opn" text-anchor="middle">1234</text>
  <line x1="522" y1="436" x2="556" y2="436" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="560" y="420" width="170" height="32" rx="15" class="bad"/>
  <text x="645" y="441" class="badt" text-anchor="middle">일부만 같음 — 안 됨</text>
  <text x="30" y="488" class="note">휴대폰 번호, 이메일, 주문번호처럼 정확하게 일치할 때만 조회해야 하는 값에 사용합니다.</text>
</svg>
