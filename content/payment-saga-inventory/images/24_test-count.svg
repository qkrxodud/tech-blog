  <rect width="760" height="420" fill="#ffffff"/>
  <text x="24" y="30" class="h">10장 테스트 수</text>
  <rect x="24" y="50" width="348" height="250" rx="12" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="38" y="74" class="okt" style="font-size:12.5px">기본 시험 <tspan class="m">./gradlew clean check</tspan></text>
  <text x="38" y="116" class="okt" style="font-size:34px">713</text>
  <text x="106" y="116" class="oks" style="font-size:13px">개 모두 통과</text>
  <text x="38" y="146" class="oks" style="font-size:12px">9장 671개 + 10장 42개</text>
  <rect x="38" y="158" width="320" height="52" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="50" y="178" class="t2" style="font-size:11.5px">계약 21개 × 2</text>
  <text x="50" y="198" class="s2" style="font-size:10px">운영 <tspan class="m">SagaTest</tspan> · 코레오그래피 <tspan class="m">ChoreographySagaTest</tspan></text>
  <text x="38" y="232" class="oks" style="font-size:11.5px">라인 커버리지 97.0%(1118줄 중 1084줄)</text>
  <text x="38" y="254" class="oks" style="font-size:11.5px">재고 서비스 모듈 7개 · 주문 서비스 모듈 10개 통과</text>
  <text x="38" y="274" class="oks" style="font-size:11px">두 모듈에는 커버리지 검사를 걸지 않음</text>
  <rect x="388" y="50" width="348" height="250" rx="12" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="402" y="74" class="badt" style="font-size:12.5px">비교 구현 <tspan class="m">./gradlew knownFailingTest</tspan></text>
  <text x="402" y="116" class="badt" style="font-size:34px">125</text>
  <text x="468" y="116" class="bads" style="font-size:13px">/ 507개 실패</text>
  <rect x="402" y="130" width="320" height="92" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="414" y="150" class="t2" style="font-size:11.5px">10장 비교 16 / 105(계약 21개 × 다섯 구현)</text>
  <text x="414" y="174" class="bads" style="font-size:11px">승인 먼저 7</text>
  <text x="516" y="174" class="bads" style="font-size:11px">수량만 4</text>
  <text x="618" y="174" class="bads" style="font-size:11px">실패로만 3</text>
  <text x="414" y="196" class="bads" style="font-size:11px">조회로 확인 1</text>
  <text x="516" y="196" class="bads" style="font-size:11px">그 자리 HTTP 1</text>
  <text x="402" y="244" class="bads" style="font-size:11px">2~9장 비교는 9장 기록과 같은 이름이 실패</text>
  <text x="402" y="262" class="bads" style="font-size:11px">다른 것: 8장 되돌리기 비교 둘(1 → 0, 2 → 1)</text>
  <text x="402" y="282" class="bads" style="font-size:11px">7장 <tspan class="m">jpaVersionTest</tspan> 11개 중 4개 — 9장과 같음</text>
  <rect x="24" y="316" width="712" height="46" rx="12" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <text x="38" y="344" class="ys" style="font-size:11.5px">후속 작업 뒤 다시 돌린 <tspan class="m">knownFailingTest</tspan>는 126개 실패 — 더해진 1개는 흔들리는 몰림 계약(수량만)</text>
  <text x="380" y="396" class="gs" text-anchor="middle" style="font-size:11.5px">7 + 4 + 3 + 1 + 1 = 16 · 코레오그래피는 계약을 지켜 기본 시험에 있음</text>
</svg>
