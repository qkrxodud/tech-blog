  <rect width="760" height="488" fill="#ffffff"/>
  <text x="24" y="28" class="h">앞 글에서 넘긴 항목 ① — 1장 목차와 9장</text>
  <text x="24" y="48" class="gs" style="font-size:11px">왼쪽은 앞 글에서 넘긴 항목의 요지, 오른쪽 체크는 이 장에서 그 항목을 다룬 결정</text>
