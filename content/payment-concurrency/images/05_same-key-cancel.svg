  <rect width="760" height="452" fill="#ffffff"/>
  <text x="24" y="28" class="h">결정 4 — 같은 키의 취소가 동시에 오면</text>
  <rect x="16" y="42" width="728" height="40" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <use href="#i-key" x="30" y="50"/>
  <text x="72" y="67" class="s" style="fill:#1f2937;font-weight:700">같은 <tspan class="m">Idempotency-Key</tspan>로 10000원 취소 두 건 — 먼저 보낸 취소가 요청 줄을 남기다 붙잡힌 동안 둘째를 보냄</text>
  <rect x="16" y="96" width="356" height="340" rx="14" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <text x="32" y="122" class="t">출발 코드 · 잠그지 않음</text>
  <text x="32" y="141" class="s2">상태 조건 UPDATE, @Version 그대로도 같은 결과</text>
  <rect x="30" y="156" width="328" height="48" rx="9" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.3"/>
  <circle cx="30" cy="156" r="11" fill="#111827"/><text x="30" y="160" class="num" text-anchor="middle" style="font-size:12px">1</text>
  <use href="#i-search" x="42" y="166"/>
  <text x="82" y="177" class="s" style="fill:#1f2937;font-weight:700;font-size:12.5px">A·B 모두 같은 키 취소를 못 찾음</text>
  <text x="82" y="194" class="s2"><tspan class="m">findRepeatedCancel</tspan> → 없음</text>
  <rect x="30" y="216" width="328" height="48" rx="9" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.3"/>
  <circle cx="30" cy="216" r="11" fill="#111827"/><text x="30" y="220" class="num" text-anchor="middle" style="font-size:12px">2</text>
  <use href="#i-table" x="42" y="226"/>
  <text x="82" y="237" class="s" style="fill:#1f2937;font-weight:700;font-size:12.5px">A·B 모두 <tspan class="m">payment_cancel</tspan> insert</text>
  <text x="82" y="254" class="s2">새 취소로 남기려 함</text>
  <rect x="30" y="276" width="328" height="48" rx="9" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.3"/>
  <circle cx="30" cy="276" r="11" fill="#111827"/><text x="30" y="280" class="num" text-anchor="middle" style="font-size:12px">3</text>
  <use href="#i-warn" x="42" y="286"/>
  <text x="82" y="297" class="s" style="fill:#1f2937;font-weight:700;font-size:12.5px">B의 insert가 중복으로 거부됨</text>
  <text x="82" y="314" class="s2"><tspan class="m">uk_payment_cancel_idempotency_key</tspan></text>
  <rect x="30" y="340" width="328" height="78" rx="9" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.3"/>
  <use href="#xmark" x="50" y="362"/>
  <text x="68" y="367" class="badt">B는 <tspan class="m">500</tspan> 내부 오류</text>
  <text x="50" y="390" class="bads">취소 줄 하나, PG 취소 한 번은 unique 키와</text>
  <text x="50" y="408" class="bads">PG 멱등키 덕분</text>
  <rect x="388" y="96" width="356" height="340" rx="14" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="388" y="96" width="356" height="340" rx="14" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <text x="404" y="122" class="t">결정 1의 결제 줄 잠금 뒤 5장 규칙</text>
  <text x="404" y="141" class="s2">이 장에서 고름 — 코드는 바꾸지 않음</text>
  <rect x="402" y="156" width="328" height="48" rx="9" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.3"/>
  <circle cx="402" cy="156" r="11" fill="#111827"/><text x="402" y="160" class="num" text-anchor="middle" style="font-size:12px">1</text>
  <use href="#i-wait" x="414" y="166"/>
  <text x="454" y="177" class="s" style="fill:#1f2937;font-weight:700;font-size:12.5px">B는 결제 줄에서 기다림</text>
  <text x="454" y="194" class="s2">A가 <tspan class="m">REQUESTED</tspan> 줄을 남기고 커밋할 때까지</text>
  <rect x="402" y="216" width="328" height="48" rx="9" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.3"/>
  <circle cx="402" cy="216" r="11" fill="#111827"/><text x="402" y="220" class="num" text-anchor="middle" style="font-size:12px">2</text>
  <use href="#i-search" x="414" y="226"/>
  <text x="454" y="237" class="s" style="fill:#1f2937;font-weight:700;font-size:12.5px">B가 A의 취소를 찾음</text>
  <text x="454" y="254" class="s2"><tspan class="m">findRepeatedCancel</tspan> → A의 줄</text>
  <rect x="402" y="276" width="328" height="48" rx="9" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.3"/>
  <circle cx="402" cy="276" r="11" fill="#111827"/><text x="402" y="280" class="num" text-anchor="middle" style="font-size:12px">3</text>
  <use href="#i-plane" x="414" y="286"/>
  <text x="454" y="297" class="s" style="fill:#1f2937;font-weight:700;font-size:12.5px"><tspan class="m">isAwaitingResult</tspan>면 같은 키로 PG에 다시</text>
  <text x="454" y="314" class="s2">결과를 남겼으면 <tspan class="m">CancelAttempt.repeat</tspan></text>
  <rect x="402" y="340" width="328" height="78" rx="9" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.3"/>
  <use href="#vmark" x="422" y="362"/>
  <text x="440" y="367" class="okt">B도 끝난 10000원 취소로 답함</text>
  <text x="422" y="390" class="oks">8번 반복: 매번 PG 취소 요청 2번, 실제 취소 1번</text>
  <text x="422" y="408" class="oks" style="font-size:11px">PG가 같은 키에 다시 취소하지 않는다는 5장 가정</text>
</svg>
