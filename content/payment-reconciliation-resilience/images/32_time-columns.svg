  <rect width="760" height="470" fill="#ffffff"/>
  <text x="24" y="28" class="h">시각을 남기는 방식과 앞 장 코드·시험에서 바뀐 것</text>
  <text x="24" y="48" class="gs" style="font-size:11px">같은 MySQL(컨테이너 시간대 UTC)에 시각을 남기는 방식이 칸마다 다름 — 12장 코드는 그 칸을 남긴 쪽과 같은 방식으로 견줌</text>
  <rect x="14" y="62" width="238" height="128" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="26" y="82" class="t2" style="font-size:12px">JPA(Hibernate) <tspan class="m">Instant</tspan></text>
  <text x="26" y="99" class="gs" style="font-size:10px">결제·outbox·이력</text>
  <text x="26" y="122" class="s2" style="font-size:10px;fill:#1f2937"><tspan class="m">authenticated_at</tspan>(결제)</text><text x="26" y="138" class="s2" style="font-size:10px;fill:#1f2937"><tspan class="m">occurred_at</tspan>(outbox)</text><text x="26" y="154" class="s2" style="font-size:10px;fill:#1f2937"><tspan class="m">changed_at</tspan>(이력)</text>
  <text x="26" y="178" class="bs" style="font-size:12px;font-weight:700">→ UTC</text>
  <rect x="262" y="62" width="238" height="128" rx="10" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <text x="274" y="82" class="t2" style="font-size:12px">JDBC <tspan class="m">Timestamp.from</tspan></text>
  <text x="274" y="99" class="gs" style="font-size:10px">9장 <tspan class="m">markSent</tspan> · 주문 서비스 · 작업 잠금</text>
  <text x="274" y="122" class="s2" style="font-size:10px;fill:#1f2937"><tspan class="m">sent_at</tspan>(outbox)</text><text x="274" y="138" class="s2" style="font-size:10px;fill:#1f2937"><tspan class="m">received_at</tspan>(주문 서비스)</text><text x="274" y="154" class="s2" style="font-size:10px;fill:#1f2937"><tspan class="m">job_lock</tspan></text>
  <text x="274" y="178" class="ys" style="font-size:12px;font-weight:700">→ JVM 시간대(KST)</text>
  <rect x="510" y="62" width="238" height="128" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="522" y="82" class="t2" style="font-size:12px">재고 서비스</text>
  <text x="522" y="99" class="gs" style="font-size:10px"><tspan class="m">LocalDateTime.ofInstant(…, UTC)</tspan></text>
  <text x="522" y="122" class="s2" style="font-size:10px;fill:#1f2937"><tspan class="m">processed_at</tspan></text>
  <text x="522" y="178" class="oks" style="font-size:12px;font-weight:700">→ UTC</text>
  <text x="24" y="206" class="gs" style="font-size:10.5px">JPA가 UTC로 남긴 칸을 JDBC <tspan class="m">getTimestamp</tspan>로 읽으면 이 JVM 시간대(KST)로 읽혀 9시간 어긋남 · 앞 장 칸의 방식은 바꾸지 않음</text>
  <rect x="14" y="220" width="360" height="74" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <use href="#xmark" x="32" y="240"/>
  <text x="48" y="244" class="badt" style="font-size:12px">결정 1 커밋의 대사</text>
  <text x="26" y="264" class="s2" style="font-size:10.5px;fill:#1f2937">인증한 때를 이 JVM 시간대(<tspan class="m">Timestamp</tspan>)로 넘김</text>
  <text x="26" y="282" class="bads" style="font-size:10px">→ UTC <tspan class="m">authenticated_at</tspan>과 9시간 어긋남</text>
  <line x1="376" y1="257" x2="398" y2="257" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="400" y="220" width="348" height="74" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <use href="#vmark" x="418" y="240"/>
  <text x="434" y="244" class="okt" style="font-size:12px">결정 3 커밋에서 고침</text>
  <text x="412" y="264" class="s2" style="font-size:10.5px;fill:#1f2937"><tspan class="m">findAuthenticatedBetween</tspan> → <tspan class="m">utc(from)</tspan>·<tspan class="m">utc(to)</tspan></text>
  <text x="412" y="282" class="oks" style="font-size:10px">UTC로 넘겨 <tspan class="m">authenticated_at</tspan>과 같은 방식으로 견줌</text>
  <line x1="14" y1="312" x2="748" y2="312" stroke="#9ca3af" stroke-width="1"/>
  <text x="24" y="334" class="t2">앞 장 코드와 시험에서 바뀐 것</text>
  <rect x="14" y="346" width="362" height="54" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="26" y="364" class="t2" style="font-size:11.5px">출발 구조 계약 세 곳을 뒤 커밋에서 고침</text>
  <text x="26" y="380" class="s2" style="font-size:10px;fill:#1f2937">결정 3 UTC 칸 · 결정 4 차단기 켜기 · 결정 5 30일 전 결과</text>
  <text x="26" y="394" class="gs" style="font-size:10px"><tspan class="m">ch12-start</tspan> 태그는 그대로 · 출발 실행은 고치기 전</text>
  <rect x="386" y="346" width="362" height="54" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="398" y="364" class="t2" style="font-size:11.5px">시험 도구 4곳이 이력을 먼저 지움</text>
  <text x="398" y="380" class="s2" style="font-size:10px;fill:#1f2937">4장 보정 계약·측정, 7장 서버 여러 대 계약·측정</text>
  <text x="398" y="394" class="gs" style="font-size:10px">처음에 빠뜨려 4장 보정 계약 14개 실패</text>
  <rect x="14" y="406" width="362" height="54" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="26" y="424" class="t2" style="font-size:11.5px">시험은 기본으로 끔</text>
  <text x="26" y="440" class="s2" style="font-size:10px;fill:#1f2937">차단기 · 하루치 대사 일정 · 세 정리 일정</text>
  <text x="26" y="454" class="gs" style="font-size:10px">5장 비교 2개·10장 비교 1개 생성자 고침</text>
  <rect x="386" y="406" width="362" height="54" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="398" y="424" class="t2" style="font-size:11.5px">결제를 바꾸는 기록 셋이 이력을 남김</text>
  <text x="398" y="440" class="s2" style="font-size:10px;fill:#1f2937"><tspan class="m">PaymentWebhookRecorder.follow</tspan>에 계기를 받는 메서드</text>
  <text x="398" y="454" class="gs" style="font-size:10px">측정용 Mock PG <tspan class="m">forgetPayments</tspan></text>
</svg>
