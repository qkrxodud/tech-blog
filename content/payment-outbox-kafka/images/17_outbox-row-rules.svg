  <rect width="760" height="470" fill="#ffffff"/>
  <text x="24" y="30" class="h">결정 1 — 상태를 바꾼 트랜잭션에서 남기는 한 줄</text>
  <text x="24" y="52" class="gs"><tspan class="m">payment_outbox</tspan> · 결제를 가리키는 외래 키는 두지 않음(따로 보내고 지우는 기록)</text>
