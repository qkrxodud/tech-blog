  <rect width="760" height="560" fill="#ffffff"/>
  <text x="24" y="30" class="h">결정 여섯 가지 한눈에</text>
  <text x="24" y="52" class="gs">출발 코드의 3장 테스트 23개 중 10개 실패 → 완성 코드에서 모두 통과</text>
  <text x="110" y="84" class="gs" style="font-size:11.5px">출발 코드 · 비교 구현에서</text>
  <text x="372" y="84" class="gs" style="font-size:11.5px">고른 것</text>
  <text x="586" y="84" class="gs" style="font-size:11.5px">결과</text>
  <rect x="24" y="94" width="76" height="70" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="62" y="134" class="t2" text-anchor="middle" style="font-size:12.5px">결정 1</text>
  <text x="110" y="110" class="t2" style="font-size:12px">승인 금액을 어디서 확인</text>
  <rect x="110" y="118" width="224" height="42" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="122" y="135" class="bads" style="font-size:11px">받은 금액을 그대로 PG에</text>
  <text x="122" y="151" class="bads" style="font-size:11px">100원 승인이 남음</text>
  <line x1="336" y1="139" x2="356" y2="139" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="360" y="100" width="214" height="58" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="372" y="124" class="bt" style="font-size:11.5px">저장한 금액과 비교</text>
  <text x="372" y="142" class="bt" style="font-size:11.5px">PG에는 저장한 금액</text>
  <line x1="576" y1="129" x2="586" y2="129" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="588" y="100" width="148" height="58" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="598" y="134" class="oks" style="font-size:10.5px">다르면 PG 호출 0건</text>
  <rect x="24" y="170" width="76" height="70" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="62" y="210" class="t2" text-anchor="middle" style="font-size:12.5px">결정 2</text>
  <text x="110" y="186" class="t2" style="font-size:12px">금액을 어떻게 비교</text>
  <rect x="110" y="194" width="224" height="42" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="122" y="211" class="bads" style="font-size:11px">비교 B(<tspan class="m">equals</tspan>): 계약 5개 실패</text>
  <text x="122" y="227" class="bads" style="font-size:11px"><tspan class="m">15000.00</tspan> ≠ <tspan class="m">15000</tspan></text>
  <line x1="336" y1="215" x2="356" y2="215" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="360" y="176" width="214" height="58" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="372" y="210" class="bt" style="font-size:11.5px"><tspan class="m">compareTo</tspan>로 값만 비교</text>
  <line x1="576" y1="205" x2="586" y2="205" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="588" y="176" width="148" height="58" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
