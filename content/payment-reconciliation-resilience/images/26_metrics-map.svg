<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 5 운영 지표 지도 — 결제 서버는 payment.outbox.unsent(보내지 않은 결제 결과 수), payment.outbox.oldest-unsent-age(가장 먼저 남긴 보내지 않은 결과가 기다린 초), payment.reconciliation.open-mismatches(운영자가 확인할 대사 어긋남 수), payment.pg.circuit.state(0 닫힘·1 열림·2 반쯤 열림·3 꺼짐·4 그 밖)를, 재고 서비스는 inventory.dead-letter.pending, 주문 서비스는 order.dead-letter.pending을 게이지로 내며 읽을 때마다 DB 집계나 브로커 조회(5초 제한)로 새로 셈. 결제 서버와 재고 서비스는 health,metrics를 열어 /actuator/metrics/{이름}으로 보고, 주문 서비스는 웹 서버가 없어 서비스 안에만 있으며 수집기는 붙이지 않음. 실패 모음 수는 파티션마다 토픽 끝에서 다시 넣기 그룹이 커밋한 자리를 뺀 값이라 다시 넣은 메시지는 빠지는 구성</title>
