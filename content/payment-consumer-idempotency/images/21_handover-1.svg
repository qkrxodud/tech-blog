  <text x="26" y="266" class="gs" style="font-size:10.5px">옛 이벤트를 거르지 않으므로(11장) 나눠 보낸 만큼 주문 상태가 틀림</text>
  <circle cx="391" cy="255" r="4" fill="#e5e7eb"/>
