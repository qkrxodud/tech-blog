  <text x="24" y="30" class="h">2장 완성 코드 — <tspan class="m">./gradlew check</tspan> 241개 통과</text>
  <text x="24" y="52" class="gs" style="font-size:11px">비교 구현은 기본 빌드에서 빼고 <tspan class="m">./gradlew knownFailingTest</tspan>로 따로 돌림(13개 중 6개 실패 기록)</text>
