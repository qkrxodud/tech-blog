  <text x="693" y="244" class="step" text-anchor="middle">8</text>
  <text x="711" y="244" class="step" text-anchor="middle">9</text>
  <line x1="30" y1="256" x2="730" y2="256" class="sep"/>
  <text x="30" y="278" class="val">mutator: local SATB buffer를</text>
  <text x="30" y="296" class="sub">통째로 global SATB buffer에 enqueue</text>
