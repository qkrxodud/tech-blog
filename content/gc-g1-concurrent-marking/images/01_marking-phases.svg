<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>G1 GC marking 사이클은 Concurrent Start(STW), Root Region Scanning, Concurrent Marking(concurrent), Remark, Cleanup(STW) 순서로 진행되고, mark stack은 Concurrent Start 시작부터 Remark 완료까지, SATB buffer와 pre-write barrier는 Concurrent Start 완료부터 Remark 시작 직전까지 쓰인다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
    .monob { font-family: Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #1f2937; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dark { fill: #d1d5db; stroke: #6b7280; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .sep { stroke: #e5e7eb; stroke-width: 1; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .wn { fill: #ffffff; stroke: #6b7280; stroke-width: 1.5; }
    .gn { fill: #d1d5db; stroke: #6b7280; stroke-width: 1.5; }
    .bn { fill: #374151; stroke: #1f2937; stroke-width: 1.5; }
    .nt { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ntw { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .edge { stroke: #6b7280; stroke-width: 1.5; fill: none; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="350" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="330" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">G1 GC marking 사이클 — 단계와 활성 구간</text>
  <text x="730" y="42" class="code" text-anchor="end">-XX:+UseG1GC</text>
  <rect x="30" y="66" width="128" height="62" rx="8" class="hold"/>
  <text x="94.0" y="92" class="op" text-anchor="middle">Concurrent</text>
  <text x="94.0" y="111" class="op" text-anchor="middle">Start</text>
  <text x="94.0" y="146" class="sub" text-anchor="middle">STW</text>
  <text x="94.0" y="170" class="val" text-anchor="middle">young GC에 얹혀 진행</text>
  <text x="94.0" y="188" class="val" text-anchor="middle">root 객체 marking</text>
  <line x1="159" y1="97" x2="171" y2="97" class="al" marker-end="url(#ar)"/>
  <rect x="173" y="66" width="128" height="62" rx="8" class="ok"/>
  <text x="237.0" y="92" class="okt" text-anchor="middle">Root Region</text>
  <text x="237.0" y="111" class="okt" text-anchor="middle">Scanning</text>
  <text x="237.0" y="146" class="gnote" text-anchor="middle">concurrent</text>
  <text x="237.0" y="170" class="val" text-anchor="middle">survivor region에서</text>
  <text x="237.0" y="188" class="val" text-anchor="middle">old 참조 스캔</text>
  <line x1="302" y1="97" x2="314" y2="97" class="al" marker-end="url(#ar)"/>
  <rect x="316" y="66" width="128" height="62" rx="8" class="ok"/>
  <text x="380.0" y="92" class="okt" text-anchor="middle">Concurrent</text>
  <text x="380.0" y="111" class="okt" text-anchor="middle">Marking</text>
  <text x="380.0" y="146" class="gnote" text-anchor="middle">concurrent</text>
  <text x="380.0" y="170" class="val" text-anchor="middle">살아 있는 old 객체</text>
  <text x="380.0" y="188" class="val" text-anchor="middle">marking</text>
  <line x1="445" y1="97" x2="457" y2="97" class="al" marker-end="url(#ar)"/>
  <rect x="459" y="66" width="128" height="62" rx="8" class="hold"/>
  <text x="523.0" y="102" class="op" text-anchor="middle">Remark</text>
  <text x="523.0" y="146" class="sub" text-anchor="middle">STW</text>
  <text x="523.0" y="170" class="val" text-anchor="middle">SATB buffer에 남은</text>
  <text x="523.0" y="188" class="val" text-anchor="middle">객체 marking</text>
  <line x1="588" y1="97" x2="600" y2="97" class="al" marker-end="url(#ar)"/>
  <rect x="602" y="66" width="128" height="62" rx="8" class="hold"/>
  <text x="666.0" y="102" class="op" text-anchor="middle">Cleanup</text>
  <text x="666.0" y="146" class="sub" text-anchor="middle">STW</text>
  <text x="666.0" y="170" class="val" text-anchor="middle">collection set</text>
  <text x="666.0" y="188" class="val" text-anchor="middle">후보 region 확정</text>
  <line x1="30" y1="206" x2="730" y2="206" class="sep"/>
  <text x="30" y="232" class="op">mark stack <tspan class="sub" font-weight="400">Concurrent Start 시작 ~ Remark 완료</tspan></text>
  <line x1="30" y1="248" x2="587" y2="248" class="al" stroke-width="3"/>
  <line x1="30" y1="240" x2="30" y2="256" class="al"/>
  <line x1="587" y1="240" x2="587" y2="256" class="al"/>
  <text x="158" y="280" class="okt">SATB buffer · pre-write barrier <tspan class="sub" font-weight="400">Concurrent Start 완료 ~ Remark 시작 직전</tspan></text>
  <line x1="158" y1="296" x2="459" y2="296" class="gl" stroke-width="3"/>
  <line x1="158" y1="288" x2="158" y2="304" class="gl"/>
  <line x1="459" y1="288" x2="459" y2="304" class="gl"/>
  <text x="30" y="330" class="sub">STW 단계는 회색, 애플리케이션 코드와 동시에 실행되는 단계는 초록으로 표시</text>

</svg>
