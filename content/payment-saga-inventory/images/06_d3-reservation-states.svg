  <rect width="760" height="500" fill="#ffffff"/>
  <text x="24" y="28" class="h">결정 3 — 재고 서비스의 예약 줄(<tspan class="m">stock_reservation</tspan>) 상태 전이</text>
  <text x="24" y="48" class="gs" style="font-size:11.5px">예약 번호 = 결제 번호(기본 키) · 예약과 해제 모두 줄을 먼저 남기려고(<tspan class="m">claim</tspan>, <tspan class="m">insert ignore</tspan>) 함</text>
  <rect x="216" y="176" width="170" height="58" rx="29" fill="#e6edfa" stroke="#7b93c9" stroke-width="2"/><text x="301" y="202" class="t" text-anchor="middle" style="font-family:Menlo, Consolas, monospace">RESERVED</text><text x="301" y="220" class="s2" text-anchor="middle">잡음 · 재고 줄어 있음</text>
