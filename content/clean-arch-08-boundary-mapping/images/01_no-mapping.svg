  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="310" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">‘매핑하지 않기’ 전략 — 모든 계층이 같은 Account 모델을 사용</text>
  <text x="92" y="72" class="layer" text-anchor="middle">웹 계층</text>
  <text x="380" y="72" class="layer" text-anchor="middle">애플리케이션 계층</text>
  <text x="668" y="72" class="layer" text-anchor="middle">영속성 계층</text>
  <line x1="164" y1="60" x2="164" y2="250" class="sep"/>
  <line x1="596" y1="60" x2="596" y2="250" class="sep"/>
  <rect x="30.0" y="86" width="124" height="62" rx="8" class="box"/>
  <text x="92.0" y="113.5" class="m" text-anchor="middle">Account</text>
  <text x="92.0" y="128.5" class="m" text-anchor="middle">Controller</text>
  <rect x="174.0" y="86" width="124" height="62" rx="8" class="hold"/>
  <text x="236.0" y="106.0" class="st" text-anchor="middle">«interface»</text>
  <text x="236.0" y="121.0" class="m" text-anchor="middle">SendMoney</text>
  <text x="236.0" y="136.0" class="m" text-anchor="middle">UseCase</text>
  <rect x="318.0" y="86" width="124" height="62" rx="8" class="box"/>
  <text x="380.0" y="113.5" class="m" text-anchor="middle">SendMoney</text>
  <text x="380.0" y="128.5" class="m" text-anchor="middle">Service</text>
  <rect x="462.0" y="86" width="124" height="62" rx="8" class="hold"/>
  <text x="524.0" y="106.0" class="st" text-anchor="middle">«interface»</text>
  <text x="524.0" y="121.0" class="m" text-anchor="middle">UpdateAccount</text>
  <text x="524.0" y="136.0" class="m" text-anchor="middle">StatePort</text>
  <rect x="606.0" y="86" width="124" height="62" rx="8" class="box"/>
  <text x="668.0" y="106.0" class="m" text-anchor="middle">Account</text>
  <text x="668.0" y="121.0" class="m" text-anchor="middle">Persistence</text>
  <text x="668.0" y="136.0" class="m" text-anchor="middle">Adapter</text>
  <path d="M154.0,117.0 L172.0,117.0" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
  <path d="M318.0,117.0 L299.0,117.0" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tri)"/>
  <path d="M442.0,117.0 L460.0,117.0" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
  <path d="M606.0,117.0 L587.0,117.0" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#tri)"/>
  <rect x="310" y="196" width="140" height="48" rx="8" class="bad"/>
  <text x="380" y="225" class="badt" text-anchor="middle">Account</text>
  <path d="M236,148 L236,220 L308,220" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M524,148 L524,220 L452,220" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="30" y="278" class="foot">웹 컨트롤러와 영속성 어댑터도 Account에 접근하므로 계층 간 매핑이 전혀 없습니다.</text>
  <text x="30" y="300" class="note">Account에 JSON·ORM 애너테이션이 붙고, 세 계층의 이유로 변경되어 단일 책임 원칙을 위반합니다.</text>
</svg>
