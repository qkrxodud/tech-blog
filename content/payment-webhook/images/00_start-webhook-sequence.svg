  <text x="412" y="301" class="t2">본문 상태를 전이 표대로 옮김</text>
  <text x="412" y="320" class="s"><tspan class="m">report(GatewayStatus.of(status))</tspan></text>
  <circle cx="380" cy="306" r="9" fill="#111827"/><text x="380" y="310" class="num" text-anchor="middle">4</text>
  <circle cx="656" cy="284" r="8" fill="#ef4444"/><text x="656" y="288" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="525" y="350" class="lbl" text-anchor="middle">트랜잭션 커밋 · 결제 상태 변경</text>
