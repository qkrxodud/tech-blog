  <title>같은 결제 12건으로 잰 결과 — 승인으로 남은 결제는 운영 6, 망취소 0(PG 취소 6), 비교 B 0, 비교 C 0, 비교 D 4이고, PG와 어긋난 결제는 0, 0, 12, 6, 2, 확정하지 못한 결제는 0, 0, 12, 2, 2이며, 보정은 운영과 망취소가 1번(1403ms, 1424ms), 첫 확인 요청이 늦으면 2번(16322ms, 16325ms)에 끝나고 B·C·D는 5번 돌고도 확정하지 못한 결제가 남았다</title>
