<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 484" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>오류 코드 방식은 getHandle 뒤에 handle 유효 여부와 일시정지 상태를 매번 확인하며 분기가 생기고, 예외 방식은 tryToShutDown의 종료 순서와 catch 블록의 오류 처리가 분리된다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .ttl { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ttls { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .cs { font-family: Menlo, Consolas, monospace; font-size: 11.5px; fill: #374151; }
    .csb { font-family: Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; fill: #1f2937; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="484" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="238" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">오류 코드 — 호출할 때마다 바로 확인</text>
  <rect x="30" y="66" width="128" height="52" rx="8" class="box"/>
  <text x="94" y="97" class="csb" text-anchor="middle">getHandle()</text>
  <rect x="172" y="66" width="128" height="52" rx="8" class="hold"/>
  <text x="236" y="97" class="ttls" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">handle</tspan> 유효?</text>
  <rect x="314" y="66" width="128" height="52" rx="8" class="box"/>
  <text x="378" y="88" class="cs" text-anchor="middle">retrieve</text>
  <text x="378" y="106" class="cs" text-anchor="middle">DeviceRecord()</text>
  <rect x="456" y="66" width="128" height="52" rx="8" class="hold"/>
  <text x="520" y="97" class="ttls" text-anchor="middle">일시정지 아님?</text>
  <rect x="598" y="66" width="128" height="52" rx="8" class="ok"/>
  <text x="662" y="88" class="cs" text-anchor="middle">pauseDevice()</text>
  <text x="662" y="106" class="cs" text-anchor="middle">… closeDevice()</text>
  <line x1="158" y1="92" x2="170" y2="92" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="300" y1="92" x2="312" y2="92" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="442" y1="92" x2="454" y2="92" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="584" y1="92" x2="596" y2="92" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="307" y="60" class="gnote" text-anchor="middle">예</text>
  <text x="591" y="60" class="gnote" text-anchor="middle">예</text>
  <line x1="236" y1="118" x2="236" y2="156" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="244" y="142" class="note">아니오</text>
  <rect x="152" y="158" width="168" height="48" rx="8" class="bad"/>
  <text x="236" y="178" class="badc" text-anchor="middle">logger.log()</text>
  <text x="236" y="197" class="val" text-anchor="middle">Invalid handle</text>
  <line x1="520" y1="118" x2="520" y2="156" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="528" y="142" class="note">아니오</text>
  <rect x="436" y="158" width="168" height="48" rx="8" class="bad"/>
  <text x="520" y="178" class="badc" text-anchor="middle">logger.log()</text>
  <text x="520" y="197" class="val" text-anchor="middle">Device suspended</text>
  <text x="30" y="234" class="note">정상 흐름 사이사이에 오류 확인 분기가 끼어 있습니다</text>
  <rect x="10" y="264" width="740" height="210" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="296" class="h">예외 — 정상 흐름과 오류 처리를 분리</text>
  <text x="30" y="322" class="ttls"><tspan font-family="Menlo, Consolas, monospace">tryToShutDown()</tspan> — 종료 순서만 남음</text>
  <rect x="30" y="334" width="128" height="48" rx="8" class="ok"/>
  <text x="94" y="363" class="cs" text-anchor="middle">getHandle()</text>
  <rect x="174" y="334" width="128" height="48" rx="8" class="ok"/>
  <text x="238" y="354" class="cs" text-anchor="middle">retrieve</text>
  <text x="238" y="371" class="cs" text-anchor="middle">DeviceRecord()</text>
  <rect x="318" y="334" width="128" height="48" rx="8" class="ok"/>
  <text x="382" y="363" class="cs" text-anchor="middle">pauseDevice()</text>
  <rect x="462" y="334" width="128" height="48" rx="8" class="ok"/>
  <text x="526" y="354" class="cs" text-anchor="middle">clearDevice</text>
  <text x="526" y="371" class="cs" text-anchor="middle">WorkQueue()</text>
  <rect x="606" y="334" width="128" height="48" rx="8" class="ok"/>
  <text x="670" y="363" class="cs" text-anchor="middle">closeDevice()</text>
  <line x1="158" y1="358" x2="172" y2="358" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="302" y1="358" x2="316" y2="358" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="446" y1="358" x2="460" y2="358" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="590" y1="358" x2="604" y2="358" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="94" y1="382" x2="94" y2="420" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="104" y="406" class="note"><tspan font-family="Menlo, Consolas, monospace">throw DeviceShutDownError</tspan></text>
  <rect x="30" y="422" width="250" height="44" rx="8" class="bad"/>
  <text x="155" y="449" class="badc" text-anchor="middle">logger.log(e)</text>
  <text x="296" y="438" class="ttls"><tspan font-family="Menlo, Consolas, monospace">sendShutDown()</tspan>의 catch 블록</text>
  <text x="296" y="457" class="note">오류 처리는 한 곳에 모입니다</text>
</svg>
