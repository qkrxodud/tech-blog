<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>innerMethod 안에서 RuntimeException을 던진 뒤 catch로 잡으면, 프록시는 예외 없이 끝난 것으로 보고 커밋하여 Inner User가 남는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 13.5px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 13.5px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badw { fill: #ffffff; stroke: #dc2626; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .badt { font-size: 13.5px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="380" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="360" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">메서드 안에서 잡은 예외 — 프록시는 정상 종료로 본다</text>
  <text x="730" y="42" class="code" text-anchor="end">rollbackOn(ex)</text>
  <text x="214" y="68" class="step" text-anchor="middle">1단계</text>
  <text x="331" y="68" class="step" text-anchor="middle">2단계</text>
  <text x="448" y="68" class="step" text-anchor="middle">3단계</text>
  <text x="565" y="68" class="step" text-anchor="middle">4단계</text>
  <text x="682" y="68" class="step" text-anchor="middle">5단계</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">프록시</text>
  <text x="30" y="126" class="sub">트랜잭션 시작·종료</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <text x="30" y="168" class="lane">innerMethod</text>
  <text x="30" y="186" class="sub">실제 메서드</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="161" y="88" width="106" height="48" rx="8" class="box"/>
  <text x="214" y="107.5" class="t" text-anchor="middle">트랜잭션 시작</text>
  <text x="214" y="126.5" class="val" text-anchor="middle">innerMethod()</text>
  <rect x="278" y="148" width="106" height="48" rx="8" class="box"/>
  <text x="331" y="167.5" class="op" text-anchor="middle">save()</text>
  <text x="331" y="186.5" class="val" text-anchor="middle">Inner User</text>
  <rect x="395" y="148" width="106" height="48" rx="8" class="box"/>
  <text x="448" y="167.5" class="op" text-anchor="middle">throw</text>
  <text x="448" y="186.5" class="val" text-anchor="middle">런타임 예외</text>
  <rect x="512" y="148" width="106" height="48" rx="8" class="bad"/>
  <text x="565" y="167.5" class="badc" text-anchor="middle">catch</text>
  <text x="565" y="186.5" class="val" text-anchor="middle">예외를 잡음</text>
  <rect x="283" y="96" width="330" height="32" rx="6" class="wait"/>
  <text x="448.0" y="117" class="waitt" text-anchor="middle">밖으로 던져지는 예외 없음 — <tspan font-family="Menlo, Consolas, monospace">rollbackOn</tspan> 호출 안 됨</text>
  <rect x="629" y="88" width="106" height="48" rx="8" class="bad"/>
  <text x="682" y="107.5" class="badt" text-anchor="middle">커밋</text>
  <text x="682" y="126.5" class="val" text-anchor="middle">정상 종료</text>
  <line x1="234" y1="136" x2="311" y2="146" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="384" y1="172" x2="394" y2="172" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="501" y1="172" x2="511" y2="172" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="585" y1="146" x2="662" y2="136" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="30" y="241" class="db">DB의 user</text>
  <rect x="291" y="220" width="80" height="32" rx="6" class="dbbox"/>
  <text x="331" y="241" class="db" text-anchor="middle">1건</text>
  <rect x="642" y="220" width="80" height="32" rx="6" class="bad"/>
  <text x="682" y="241" class="badt" text-anchor="middle">1건 커밋</text>
  <rect x="150" y="278" width="240" height="30" rx="15" class="bad"/>
  <text x="270" y="298" class="badt" text-anchor="middle">결과 — Inner User가 남음</text>
  <text x="406" y="298" class="foot">테스트가 기대한 <tspan font-family="Menlo, Consolas, monospace">users.size() = 0</tspan>과 다름</text>
  <text x="150" y="340" class="foot">프록시는 메서드 밖으로 던져진 RuntimeException이나 Error를 보고 롤백을 결정합니다</text>
</svg>
