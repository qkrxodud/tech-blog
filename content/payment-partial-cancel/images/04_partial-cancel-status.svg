  <text x="281.0" y="155" class="s" text-anchor="middle"><tspan class="m">DONE</tspan> · 남은 10000원</text>
  <polygon points="456,108 526,140 456,172 386,140" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
