<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>young generation 크기는 G1NewSizePercent와 G1MaxNewSizePercent로 비율 범위를 주는 것을 권장하고, NewSize와 MaxNewSize를 같게, -Xmn, 두 percent 옵션을 같게, NewRatio처럼 크기를 고정하거나 유연성을 떨어뜨리면 pause time control을 못 한다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .gc { fill: #d1d5db; stroke: #6b7280; stroke-width: 1.2; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .br { stroke: #9ca3af; stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="450" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="176" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">권장 — 비율로 범위를 준다</text>
  <text x="730" y="42" class="code" text-anchor="end">G1NewSizePercent / G1MaxNewSizePercent</text>
  <text x="40" y="74" class="sub">전체 heap size</text>
  <rect x="40" y="82" width="680" height="40" rx="6" class="dbbox"/>
  <rect x="40" y="82" width="34" height="40" rx="6" class="hold"/>
  <rect x="74" y="82" width="374" height="40" class="ok"/>
  <text x="261" y="107" class="okt" text-anchor="middle">young generation이 움직이는 범위</text>
  <text x="74" y="142" class="val" text-anchor="middle">5%</text>
  <text x="448" y="142" class="val" text-anchor="middle">60%</text>
  <line x1="74" y1="122" x2="74" y2="130" class="axis"/>
  <line x1="448" y1="122" x2="448" y2="130" class="axis"/>
  <text x="40" y="170" class="gnote">heap size가 바뀌어도 young generation의 초기/최소값과 최대값이 따라서 반응</text>
  <rect x="10" y="202" width="740" height="238" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="234" class="h">권장하지 않음 — young 크기를 고정하거나 묶는다</text>
  <rect x="40" y="252" width="330" height="40" rx="8" class="box"/>
  <text x="205" y="277" class="op" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">-XX:NewSize = -XX:MaxNewSize</tspan></text>
  <rect x="390" y="252" width="330" height="40" rx="8" class="box"/>
  <text x="555" y="277" class="op" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">-Xmn1g</tspan></text>
  <rect x="40" y="302" width="330" height="40" rx="8" class="box"/>
  <text x="205" y="327" class="op" text-anchor="middle" style="font-size:12.5px"><tspan font-family="Menlo, Consolas, monospace">G1NewSizePercent = G1MaxNewSizePercent</tspan></text>
  <rect x="390" y="302" width="330" height="40" rx="8" class="box"/>
  <text x="555" y="320" class="op" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">-XX:NewRatio</tspan></text>
  <text x="555" y="336" class="sub" text-anchor="middle">old 크기에 비례 → 유연성 저하</text>
  <line x1="380" y1="342" x2="380" y2="368" class="rl" marker-end="url(#arr)"/>
  <rect x="140" y="370" width="480" height="48" rx="8" class="bad"/>
  <text x="380" y="391" class="badt" text-anchor="middle">young 크기를 적절하게 조정 못 함</text>
  <text x="380" y="409" class="note" text-anchor="middle">→ pause time control을 못 함</text>
</svg>
