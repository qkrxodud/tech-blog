  <title>결정 3 선택지 비교 — 예약 줄과 상태 전이(이 장에서 고름)는 해제가 예약보다 먼저 오면 claim으로 빈 해제 줄을 남겨 재고 5를 그대로 두고 늦은 예약을 409로 막아 재고 5이며, 같은 해제가 두 번 오면 첫 해제만 RELEASED로 바꿔 재고 3에서 5로 돌려주고 두 번째는 바꾸지 않음. 계약 실패 0, 측정 어긋난 재고 0(6번). 수량만(비교)은 해제가 먼저 오면 늘리기가 먼저 반영돼 재고 7이 되고 늦게 온 줄이기가 그 뒤에 반영되며, 같은 해제가 두 번 오면 두 번 늘려 재고 7이 됨. 계약 21개 중 4개 실패(나머지 2개는 확정 계약 0), 측정 어긋난 재고 +10(4번)·0(2번)</title>
