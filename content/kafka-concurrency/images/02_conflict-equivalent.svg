  <line x1="275" y1="132" x2="275" y2="376" class="axis" marker-end="url(#ar)"/>
  <rect x="231" y="138" width="88" height="24" rx="6" class="hold"/>
  <text x="275" y="155" class="monob" text-anchor="middle">r2(H)</text>
  <rect x="231" y="168" width="88" height="24" rx="6" class="hold"/>
  <text x="275" y="185" class="monob" text-anchor="middle">w2(H)</text>
  <rect x="231" y="198" width="88" height="24" rx="6" class="hold"/>
  <text x="275" y="215" class="monob" text-anchor="middle">c2</text>
  <rect x="231" y="228" width="88" height="24" rx="6" class="box"/>
  <text x="275" y="245" class="monob" text-anchor="middle">r1(K)</text>
  <rect x="231" y="258" width="88" height="24" rx="6" class="box"/>
  <text x="275" y="275" class="monob" text-anchor="middle">w1(K)</text>
  <rect x="231" y="288" width="88" height="24" rx="6" class="box"/>
  <text x="275" y="305" class="monob" text-anchor="middle">r1(H)</text>
  <rect x="231" y="318" width="88" height="24" rx="6" class="box"/>
  <text x="275" y="335" class="monob" text-anchor="middle">w1(H)</text>
  <rect x="231" y="348" width="88" height="24" rx="6" class="box"/>
  <text x="275" y="365" class="monob" text-anchor="middle">c1</text>
  <text x="483" y="104" class="monob" text-anchor="middle">sched.4</text>
  <text x="483" y="122" class="sub" text-anchor="middle">nonserial</text>
  <line x1="483" y1="132" x2="483" y2="376" class="axis" marker-end="url(#ar)"/>
  <rect x="439" y="138" width="88" height="24" rx="6" class="box"/>
  <text x="483" y="155" class="monob" text-anchor="middle">r1(K)</text>
  <rect x="439" y="168" width="88" height="24" rx="6" class="box"/>
  <text x="483" y="185" class="monob" text-anchor="middle">w1(K)</text>
  <rect x="439" y="198" width="88" height="24" rx="6" class="box"/>
  <text x="483" y="215" class="monob" text-anchor="middle">r1(H)</text>
  <rect x="439" y="228" width="88" height="24" rx="6" class="hold"/>
