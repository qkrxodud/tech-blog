  <rect width="760" height="400" fill="#ffffff"/>
  <text x="24" y="30" class="h">반복 실행 — 흔들린 것은 몰림 계약 하나</text>
  <text x="24" y="52" class="gs">몰림 계약(서버 두 대 · 300건)은 겹침을 고정하지 않음 · 0.5초를 넘긴 예약이 몇 건 나느냐에 달림</text>
  <text x="24" y="86" class="t2" style="font-size:12.5px">기본 42개</text>
  <rect x="130" y="66" width="80" height="34" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
