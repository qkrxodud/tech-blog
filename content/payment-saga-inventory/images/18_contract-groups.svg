  <rect width="760" height="500" fill="#ffffff"/>
  <text x="24" y="30" class="h">10장 계약 21개 — 일곱 묶음</text>
  <text x="24" y="52" class="gs">계약 조건: 재고 서비스 읽기 시간 제한 0.5초 · 늦은 재고 서비스와 카드사는 1.5초 뒤 답 · 테스트 이름의 "카드사"는 Mock PG</text>
  <rect x="24" y="70" width="228" height="128" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="24" y="70" width="228" height="34" rx="12" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <text x="38" y="92" class="yt" style="font-size:12.5px">재고가 모자란 주문</text>
  <circle cx="230" cy="87" r="13" fill="#d97706"/>
  <text x="230" y="92" class="num" text-anchor="middle" style="font-size:13px">4</text>
  <text x="38" y="124" class="s2" style="font-size:11px">카드사에 승인을 요청하지 않음</text>
  <text x="38" y="141" class="s2" style="font-size:11px">승인 없이 실패로 끝남</text>
  <text x="38" y="158" class="s2" style="font-size:11px">쓴 쿠폰 · 포인트를 돌려줌</text>
  <text x="38" y="175" class="s2" style="font-size:11px">재고를 그대로 둠</text>
  <rect x="266" y="70" width="228" height="128" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="266" y="70" width="228" height="34" rx="12" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="280" y="92" class="bt" style="font-size:12.5px">확정과 원복</text>
  <circle cx="472" cy="87" r="13" fill="#2563eb"/>
  <text x="472" y="92" class="num" text-anchor="middle" style="font-size:13px">5</text>
  <text x="280" y="124" class="s2" style="font-size:11px">승인된 주문의 예약은 확정</text>
  <text x="280" y="141" class="s2" style="font-size:11px">카드사 거절 · 만료 보정 ·</text>
  <text x="280" y="158" class="s2" style="font-size:11px">전액 취소 · 결과 모름 보정 실패</text>
  <text x="280" y="175" class="s2" style="font-size:11px">→ 재고는 처음으로</text>
  <rect x="508" y="70" width="228" height="128" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="508" y="70" width="228" height="34" rx="12" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="522" y="92" class="bt" style="font-size:12.5px">결과 모름</text>
  <circle cx="714" cy="87" r="13" fill="#2563eb"/>
  <text x="714" y="92" class="num" text-anchor="middle" style="font-size:13px">2</text>
  <text x="522" y="124" class="s2" style="font-size:11px">그동안 예약을 그대로 둠</text>
  <text x="522" y="141" class="s2" style="font-size:11px">보정이 승인으로 닫으면 확정</text>
  <rect x="24" y="212" width="348" height="128" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="24" y="212" width="348" height="34" rx="12" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/>
  <text x="38" y="234" class="ot" style="font-size:12.5px">늦음과 순서</text>
  <circle cx="350" cy="229" r="13" fill="#c2410c"/>
  <text x="350" y="234" class="num" text-anchor="middle" style="font-size:13px">5</text>
  <text x="38" y="266" class="s2" style="font-size:11px">답이 늦어도 재고는 처음으로</text>
  <text x="38" y="283" class="s2" style="font-size:11px">답이 늦은 주문은 카드사에 요청 안 함</text>
  <text x="38" y="300" class="s2" style="font-size:11px">예약 처리 중 시간 초과</text>
  <text x="38" y="317" class="s2" style="font-size:11px">해제보다 늦게 도착한 예약</text>
  <text x="38" y="334" class="s2" style="font-size:11px">해제가 먼저 와도 늘지 않음</text>
  <rect x="388" y="212" width="348" height="128" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="388" y="212" width="348" height="34" rx="12" fill="#ede9fe" stroke="#8b7fd1" stroke-width="1.5"/>
  <text x="402" y="234" class="t2" style="font-size:12.5px">두 번</text>
  <circle cx="714" cy="229" r="13" fill="#7c3aed"/>
  <text x="714" y="234" class="num" text-anchor="middle" style="font-size:13px">2</text>
  <text x="402" y="266" class="s2" style="font-size:11px">같은 해제가 두 번 와도 한 번만</text>
  <text x="402" y="283" class="s2" style="font-size:11px">같은 확정이 두 번 와도 한 번만</text>
  <rect x="24" y="354" width="228" height="104" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="24" y="354" width="228" height="34" rx="12" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="38" y="376" class="badt" style="font-size:12.5px">멈춤</text>
  <circle cx="230" cy="371" r="13" fill="#dc2626"/>
  <text x="230" y="376" class="num" text-anchor="middle" style="font-size:13px">1</text>
  <text x="38" y="408" class="s2" style="font-size:11px">재고 서비스가 멈춘 동안 승인 없이</text>
  <text x="38" y="425" class="s2" style="font-size:11px">끝난 주문 → 돌아온 뒤 처음 재고</text>
  <rect x="266" y="354" width="470" height="104" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="266" y="354" width="470" height="34" rx="12" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="280" y="376" class="t2" style="font-size:12.5px">몰림</text>
  <circle cx="714" cy="371" r="13" fill="#374151"/>
  <text x="714" y="376" class="num" text-anchor="middle" style="font-size:13px">2</text>
  <text x="280" y="408" class="s2" style="font-size:11px">재고 100개 · 서버 두 대 · 300건</text>
  <text x="280" y="425" class="s2" style="font-size:11px">→ 승인 100건 이하</text>
  <text x="280" y="442" class="s2" style="font-size:11px">일부 취소 뒤 합 = 처음 재고</text>
  <text x="380" y="486" class="t" text-anchor="middle" style="font-size:14px">4 + 5 + 2 + 5 + 2 + 1 + 2 = 21개</text>
</svg>
