  <text x="186" y="342" class="s2" style="font-size:10px;fill:#1f2937">막는 시간 일시 4630~4650ms · 4572~4599ms, 영구 4612~4618ms · 4572~4605ms — 일시·영구 모두 같은 처리</text>
  <rect x="14" y="372" width="160" height="140" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
