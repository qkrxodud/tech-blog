  <rect width="760" height="470" fill="#ffffff"/>
  <text x="24" y="28" class="h">결정 4 — 한 결제를 보내지 못하면 그 결제의 다음 결과만 기다림</text>
  <text x="24" y="50" class="s2" style="font-size:11.5px;fill:#1f2937"><tspan class="m">relay</tspan> → <tspan class="m">findUnsent</tspan>(번호 순) → 줄마다 <tspan class="m">relayUnlessWaiting</tspan>: <tspan class="m">waiting</tspan>에 있으면 건너뜀</text>
  <text x="24" y="68" class="s2" style="font-size:11.5px;fill:#1f2937">→ <tspan class="m">isNotSent</tspan>(<tspan class="m">send</tspan>) → 실패면 결제 번호를 <tspan class="m">waiting.add</tspan>, 성공이면 <tspan class="m">markSent</tspan></text>
  <rect x="14" y="84" width="356" height="266" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><text x="30" y="108" class="t2">주기 1 — 예시 배치</text><rect x="28" y="122" width="140" height="36" rx="7" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/><text x="40" y="145" class="s2" style="font-size:11.5px;fill:#1f2937;font-weight:700">줄 1 · 결제 1 승인</text><line x1="170" y1="140" x2="182" y2="140" stroke="#dc2626" stroke-width="1.3" marker-end="url(#arr)"/><rect x="186" y="122" width="170" height="36" rx="7" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/><use href="#xs" x="200" y="140"/><text x="213" y="137" class="bads" style="font-size:11px;font-weight:700">보내지 못함</text><text x="213" y="151" class="bads" style="font-size:10.5px"><tspan class="m">waiting</tspan> = {결제 1}</text><rect x="28" y="168" width="140" height="36" rx="7" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/><text x="40" y="191" class="s2" style="font-size:11.5px;fill:#1f2937;font-weight:700">줄 2 · 결제 2 승인</text><line x1="170" y1="186" x2="182" y2="186" stroke="#16a34a" stroke-width="1.3" marker-end="url(#agr)"/><rect x="186" y="168" width="170" height="36" rx="7" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/><use href="#vs" x="200" y="186"/><text x="213" y="191" class="oks" style="font-size:11.5px;font-weight:700">보냄 → <tspan class="m">markSent</tspan></text><rect x="28" y="214" width="140" height="36" rx="7" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/><text x="40" y="237" class="s2" style="font-size:11.5px;fill:#1f2937;font-weight:700">줄 3 · 결제 1 취소</text><line x1="170" y1="232" x2="182" y2="232" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#agy)"/><rect x="186" y="214" width="170" height="36" rx="7" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/><text x="198" y="229" class="gs" style="font-size:11px;font-weight:700">건너뜀</text><text x="198" y="243" class="gs" style="font-size:10.5px">결제 1이 기다리는 중</text><rect x="28" y="260" width="140" height="36" rx="7" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/><text x="40" y="283" class="s2" style="font-size:11.5px;fill:#1f2937;font-weight:700">줄 4 · 결제 2 취소</text><line x1="170" y1="278" x2="182" y2="278" stroke="#16a34a" stroke-width="1.3" marker-end="url(#agr)"/><rect x="186" y="260" width="170" height="36" rx="7" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/><use href="#vs" x="200" y="278"/><text x="213" y="283" class="oks" style="font-size:11.5px;font-weight:700">보냄 → <tspan class="m">markSent</tspan></text><text x="30" y="336" class="oks" style="font-size:11.5px;font-weight:700">결제 2는 [승인, 취소]로 도착</text>
  <line x1="372" y1="216" x2="386" y2="216" stroke="#1f2937" stroke-width="1.4" marker-end="url(#ak)"/>
  <rect x="390" y="84" width="356" height="266" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><text x="406" y="108" class="t2">주기 2 — 아직 안 보낸 줄만</text><rect x="404" y="122" width="140" height="36" rx="7" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/><text x="416" y="145" class="s2" style="font-size:11.5px;fill:#1f2937;font-weight:700">줄 1 · 결제 1 승인</text><line x1="546" y1="140" x2="558" y2="140" stroke="#16a34a" stroke-width="1.3" marker-end="url(#agr)"/><rect x="562" y="122" width="170" height="36" rx="7" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/><use href="#vs" x="576" y="140"/><text x="589" y="145" class="oks" style="font-size:11.5px;font-weight:700">보냄 → <tspan class="m">markSent</tspan></text><rect x="404" y="168" width="140" height="36" rx="7" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/><text x="416" y="191" class="s2" style="font-size:11.5px;fill:#1f2937;font-weight:700">줄 3 · 결제 1 취소</text><line x1="546" y1="186" x2="558" y2="186" stroke="#16a34a" stroke-width="1.3" marker-end="url(#agr)"/><rect x="562" y="168" width="170" height="36" rx="7" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/><use href="#vs" x="576" y="186"/><text x="589" y="191" class="oks" style="font-size:11.5px;font-weight:700">보냄 → <tspan class="m">markSent</tspan></text><text x="406" y="336" class="oks" style="font-size:11.5px;font-weight:700">결제 1도 [승인, 취소]로 도착</text>
  <text x="406" y="250" class="gs" style="font-size:11px"><tspan class="m">waiting</tspan>은 주기마다 새로 만듦</text>
  <rect x="14" y="364" width="356" height="56" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="28" y="386" class="t2" style="font-size:12px">결정 2 커밋의 규칙</text>
  <text x="28" y="406" class="gs" style="font-size:11px">한 건 못 보내면 주기를 멈춤 — 결제 2도 다음 주기로</text>
  <rect x="390" y="364" width="356" height="56" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="404" y="386" class="t2" style="font-size:12px;fill:#b91c1c">한 줄씩 나눠 보내기 비교</text>
  <text x="404" y="406" class="bads" style="font-size:11px">못 보내면 주기를 멈춰 다른 결제도 안 나감 — 계약 실패</text>
  <text x="24" y="448" class="gs" style="font-size:11.5px">계약 3개로 확인: 그 주기에 그 결제의 취소는 나가지 않고, 다른 결제는 [승인, 취소], 다음 주기에 그 결제도 [승인, 취소]</text>
</svg>
