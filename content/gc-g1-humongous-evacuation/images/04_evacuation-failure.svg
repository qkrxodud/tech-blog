<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>mixed GC에서 A, C, D와 E, F가 있던 region은 복사 후 free region이 되지만, B가 있던 region과 pinned 객체가 있던 region은 이동 실패로 남아 old region으로 승격되고 CSet candidates가 된다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .lane2 { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .opc { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .rg { font-size: 13px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dark { fill: #d1d5db; stroke: #6b7280; stroke-width: 1.2; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="450" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">evacuation failure — mixed GC 중 이동에 실패한 region</text>
  <text x="730" y="42" class="code" text-anchor="end">mixed GC</text>
  <text x="220" y="68" class="step" text-anchor="middle">GC 전</text>
  <text x="360" y="68" class="step" text-anchor="middle">evacuation</text>
  <text x="500" y="68" class="step" text-anchor="middle">GC 후</text>
  <text x="640" y="68" class="step" text-anchor="middle">다음 GC</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="120.0" class="lane">A, C, D</text>
  <text x="30" y="138.0" class="sub">살아 있는 객체</text>
  <rect x="150" y="90" width="585" height="64" rx="6" class="track"/>
  <rect x="158.0" y="98" width="124" height="48" rx="8" class="box"/>
  <text x="220" y="118.0" class="op" text-anchor="middle">A, C, D</text>
  <text x="220" y="136.0" class="val" text-anchor="middle">live</text>
  <rect x="298.0" y="98" width="124" height="48" rx="8" class="ok"/>
  <text x="360" y="118.0" class="okt" text-anchor="middle">복사 성공</text>
  <text x="360" y="136.0" class="val" text-anchor="middle">한 region으로</text>
  <rect x="438.0" y="98" width="124" height="48" rx="8" class="ok"/>
  <text x="500" y="118.0" class="okt" text-anchor="middle">free region</text>
  <text x="500" y="136.0" class="val" text-anchor="middle">회수됨</text>
  <text x="30" y="194.0" class="lane">E, F</text>
  <text x="30" y="212.0" class="sub">살아 있는 객체</text>
  <rect x="150" y="164" width="585" height="64" rx="6" class="track"/>
  <rect x="158.0" y="172" width="124" height="48" rx="8" class="box"/>
  <text x="220" y="192.0" class="op" text-anchor="middle">E, F</text>
  <text x="220" y="210.0" class="val" text-anchor="middle">live</text>
  <rect x="298.0" y="172" width="124" height="48" rx="8" class="ok"/>
  <text x="360" y="192.0" class="okt" text-anchor="middle">복사 성공</text>
  <text x="360" y="210.0" class="val" text-anchor="middle">다른 region으로</text>
  <rect x="438.0" y="172" width="124" height="48" rx="8" class="ok"/>
  <text x="500" y="192.0" class="okt" text-anchor="middle">free region</text>
  <text x="500" y="210.0" class="val" text-anchor="middle">회수됨</text>
  <text x="30" y="268.0" class="lane">B</text>
  <text x="30" y="286.0" class="sub">survivor region</text>
  <rect x="150" y="238" width="585" height="64" rx="6" class="track"/>
  <rect x="158.0" y="246" width="124" height="48" rx="8" class="box"/>
  <text x="220" y="266.0" class="op" text-anchor="middle">B</text>
  <text x="220" y="284.0" class="val" text-anchor="middle">live</text>
  <rect x="298.0" y="246" width="124" height="48" rx="8" class="bad"/>
  <text x="360" y="266.0" class="badt" text-anchor="middle">이동 실패</text>
  <text x="360" y="284.0" class="val" text-anchor="middle">evacuation failure</text>
  <rect x="438.0" y="246" width="124" height="48" rx="8" class="hold"/>
  <text x="500" y="266.0" class="op" text-anchor="middle">old로 승격</text>
  <text x="500" y="284.0" class="val" text-anchor="middle">회수 안 됨</text>
  <rect x="578.0" y="246" width="124" height="48" rx="8" class="ok"/>
  <text x="640" y="266.0" class="okt" text-anchor="middle">바로 수집</text>
  <text x="640" y="284.0" class="val" text-anchor="middle">CSet candidates</text>
  <text x="30" y="342.0" class="lane">pinned 객체</text>
  <text x="30" y="360.0" class="sub">eden region</text>
  <rect x="150" y="312" width="585" height="64" rx="6" class="track"/>
  <rect x="158.0" y="320" width="124" height="48" rx="8" class="box"/>
  <text x="220" y="340.0" class="op" text-anchor="middle">pinned</text>
  <text x="220" y="358.0" class="val" text-anchor="middle">native에서 참조</text>
  <rect x="298.0" y="320" width="124" height="48" rx="8" class="bad"/>
  <text x="360" y="340.0" class="badt" text-anchor="middle">이동 불가</text>
  <text x="360" y="358.0" class="val" text-anchor="middle">pinned</text>
  <rect x="438.0" y="320" width="124" height="48" rx="8" class="hold"/>
  <text x="500" y="340.0" class="op" text-anchor="middle">old로 승격</text>
  <text x="500" y="358.0" class="val" text-anchor="middle">회수 안 됨</text>
  <rect x="578.0" y="320" width="124" height="48" rx="8" class="ok"/>
  <text x="640" y="340.0" class="okt" text-anchor="middle">바로 수집</text>
  <text x="640" y="358.0" class="val" text-anchor="middle">CSet candidates</text>
  <text x="150" y="400" class="sub">이동에 실패한 live 객체가 속한 region은 이번 GC에서 회수되지 않는다</text>
  <text x="150" y="418" class="sub">이번에 회수되지 못한 young region은 old region으로 승격되고, 다음 GC 때 즉시 회수되도록</text>
  <text x="150" y="436" class="sub">CSet candidate regions로 스케줄링 된다</text>
</svg>
