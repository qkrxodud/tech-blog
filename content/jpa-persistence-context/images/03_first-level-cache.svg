<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 398" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>1차 캐시에 member1이 있으면 DB를 조회하지 않고 1차 캐시에서 반환하고, member2가 1차 캐시에 없으면 DB에서 조회해 1차 캐시에 저장한 뒤 반환하는 두 경우</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .m { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="398" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="168" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">1차 캐시에 있을 때 — DB를 조회하지 않는다</text>
  <text x="730" y="42" class="code" text-anchor="end">find(Member.class, "member1")</text>
  <rect x="30" y="72" width="180" height="64" rx="8" class="box"/>
  <text x="120" y="100" class="t" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">find("member1")</tspan></text>
  <text x="120" y="119" class="val" text-anchor="middle">PK 값으로 조회</text>
  <rect x="260" y="64" width="230" height="80" rx="8" class="hold"/>
  <text x="375" y="84" class="t" text-anchor="middle">1차 캐시</text>
  <line x1="272" y1="94" x2="478" y2="94" stroke="#d1d5db"/>
  <line x1="375" y1="94" x2="375" y2="136" stroke="#d1d5db"/>
  <text x="323" y="110" class="sub" text-anchor="middle">@Id</text>
  <text x="427" y="110" class="sub" text-anchor="middle">Entity</text>
  <text x="323" y="130" class="m" text-anchor="middle">member1</text>
  <text x="427" y="130" class="m" text-anchor="middle">member</text>
  <rect x="540" y="72" width="190" height="64" rx="8" class="ok"/>
  <text x="635" y="100" class="okt" text-anchor="middle">member 반환</text>
  <text x="635" y="119" class="val" text-anchor="middle">1차 캐시에서 꺼냄</text>
  <line x1="210" y1="104" x2="254" y2="104" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="490" y1="104" x2="534" y2="104" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="164" class="foot">DB에 조회하지 않고 1차 캐시의 PK 값으로 객체를 가져온다</text>
  <rect x="10" y="194" width="740" height="194" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="226" class="h">1차 캐시에 없을 때 — DB에서 조회해 1차 캐시에 저장한다</text>
  <text x="730" y="226" class="code" text-anchor="end">find(Member.class, "member2")</text>
  <text x="105" y="256" class="step" text-anchor="middle">1</text>
  <text x="285" y="256" class="step" text-anchor="middle">2</text>
  <text x="465" y="256" class="step" text-anchor="middle">3</text>
  <text x="645" y="256" class="step" text-anchor="middle">4</text>
  <rect x="30" y="266" width="150" height="60" rx="8" class="bad"/>
  <text x="105" y="292" class="badt" text-anchor="middle">1차 캐시 조회</text>
  <text x="105" y="311" class="val" text-anchor="middle">member2 없음</text>
  <rect x="210" y="266" width="150" height="60" rx="8" class="dbbox"/>
  <text x="285" y="292" class="t" text-anchor="middle">DB 조회</text>
  <text x="285" y="311" class="val" text-anchor="middle">member2 있음</text>
  <rect x="390" y="266" width="150" height="60" rx="8" class="hold"/>
  <text x="465" y="292" class="t" text-anchor="middle">1차 캐시에 저장</text>
  <text x="465" y="311" class="val" text-anchor="middle">조회한 member2</text>
  <rect x="570" y="266" width="160" height="60" rx="8" class="ok"/>
  <text x="650" y="292" class="okt" text-anchor="middle">member2 반환</text>
  <text x="650" y="311" class="val" text-anchor="middle">1차 캐시에서 반환</text>
  <line x1="180" y1="296" x2="204" y2="296" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="360" y1="296" x2="384" y2="296" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="540" y1="296" x2="564" y2="296" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="360" class="foot">1차 캐시에 없으면 DB에서 조회하고, 조회한 값을 1차 캐시에 저장한 뒤 반환한다</text>
</svg>
