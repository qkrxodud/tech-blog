<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>보통은 persist하면 1차 캐시와 쓰기 지연 SQL 저장소에 저장했다가 커밋 시점에 INSERT하지만, IDENTITY 전략은 DB에 INSERT해야 PK를 알 수 있으므로 persist 시점에 즉시 INSERT를 실행하고 DB에서 식별자를 조회하는 차이</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .m { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="372" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="168" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">보통의 경우 — 커밋 시점에 INSERT를 실행한다</text>
  <rect x="30" y="66" width="150" height="60" rx="8" class="box"/>
  <text x="105" y="92" class="t" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">em.persist()</tspan></text>
  <text x="105" y="111" class="val" text-anchor="middle">엔티티 저장</text>
  <rect x="210" y="66" width="200" height="60" rx="8" class="hold"/>
  <text x="310" y="92" class="t" text-anchor="middle">1차 캐시 · SQL 저장소</text>
  <text x="310" y="111" class="val" text-anchor="middle">INSERT를 모아 둠</text>
  <rect x="440" y="66" width="130" height="60" rx="8" class="box"/>
  <text x="505" y="92" class="t" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">commit()</tspan></text>
  <text x="505" y="111" class="val" text-anchor="middle">트랜잭션 커밋</text>
  <rect x="600" y="66" width="130" height="60" rx="8" class="ok"/>
  <text x="665" y="92" class="okt" text-anchor="middle">INSERT 실행</text>
  <text x="665" y="111" class="val" text-anchor="middle">DB에 반영</text>
  <line x1="180" y1="96" x2="204" y2="96" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="410" y1="96" x2="434" y2="96" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="570" y1="96" x2="594" y2="96" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="158" class="foot">em.persist는 1차 캐시와 쓰기 지연 SQL 저장소에 저장하고, 커밋 시점에 INSERT를 실행한다</text>
  <rect x="10" y="194" width="740" height="168" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="226" class="h">IDENTITY — persist 시점에 즉시 INSERT를 실행한다</text>
  <text x="730" y="226" class="code" text-anchor="end">GenerationType.IDENTITY</text>
  <rect x="30" y="250" width="150" height="60" rx="8" class="box"/>
  <text x="105" y="276" class="t" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">em.persist()</tspan></text>
  <text x="105" y="295" class="val" text-anchor="middle">엔티티 저장</text>
  <rect x="210" y="250" width="160" height="60" rx="8" class="hold"/>
  <text x="290" y="276" class="t" text-anchor="middle">즉시 INSERT</text>
  <text x="290" y="295" class="val" text-anchor="middle">커밋을 기다리지 않음</text>
  <rect x="400" y="250" width="150" height="60" rx="8" class="dbbox"/>
  <text x="475" y="276" class="t" text-anchor="middle">DB가 PK 생성</text>
  <text x="475" y="295" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">AUTO_INCREMENT</tspan></text>
  <rect x="580" y="250" width="150" height="60" rx="8" class="ok"/>
  <text x="655" y="276" class="okt" text-anchor="middle">식별자 조회</text>
  <text x="655" y="295" class="val" text-anchor="middle">DB에서 PK를 가져옴</text>
  <line x1="180" y1="280" x2="204" y2="280" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="370" y1="280" x2="394" y2="280" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="550" y1="280" x2="574" y2="280" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="342" class="foot">IDENTITY 전략은 DB에 INSERT해야 PK가 정해지기 때문에 persist 시점에 INSERT를 보낸다</text>
</svg>
