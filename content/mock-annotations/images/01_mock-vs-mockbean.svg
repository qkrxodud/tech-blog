<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>@Mock과 @InjectMocks는 스프링 없이 Mockito가 가짜 객체를 만들어 주입하고, @MockBean은 ApplicationContext의 MailSendClient 빈을 Mock으로 교체한다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="520" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="230" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">@Mock · @InjectMocks — Mockito가 가짜 객체를 만들어 주입</text>
  <text x="30" y="64" class="sub"><tspan font-family="Menlo, Consolas, monospace">@ExtendWith(MockitoExtension.class)</tspan> — 스프링 컨텍스트를 띄우지 않음</text>
  <rect x="40" y="86" width="270" height="56" rx="8" class="hold"/>
  <text x="175" y="109" class="op" text-anchor="middle">MailSendClient</text>
  <text x="175" y="130" class="val" text-anchor="middle">@Mock — 가짜 객체</text>
  <rect x="40" y="160" width="270" height="56" rx="8" class="hold"/>
  <text x="175" y="183" class="op" text-anchor="middle">MailSendHistoryRepository</text>
  <text x="175" y="204" class="val" text-anchor="middle">@Mock — 가짜 객체</text>
  <rect x="460" y="120" width="260" height="62" rx="8" class="box"/>
  <text x="590" y="146" class="op" text-anchor="middle">MailService</text>
  <text x="590" y="168" class="val" text-anchor="middle">@InjectMocks — 실제 객체</text>
  <line x1="310" y1="114" x2="458" y2="140" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="310" y1="188" x2="458" y2="164" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="590" y="208" class="gnote" text-anchor="middle">생성자 · 세터 · 필드로 주입</text>

  <rect x="10" y="256" width="740" height="254" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="288" class="h">@MockBean — ApplicationContext의 빈을 Mock으로 교체</text>
  <text x="30" y="310" class="sub"><tspan font-family="Menlo, Consolas, monospace">@SpringBootTest</tspan> — 스프링 컨텍스트를 띄우고 그 안의 빈을 사용</text>
  <rect x="30" y="324" width="700" height="172" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="46" y="346" class="code">ApplicationContext</text>
  <rect x="60" y="384" width="230" height="58" rx="8" class="box"/>
  <text x="175" y="408" class="op" text-anchor="middle">MailService</text>
  <text x="175" y="429" class="val" text-anchor="middle">@Autowired — 실제 빈</text>
  <text x="60" y="476" class="sub">같은 타입의 빈이 없으면 Mock 빈을 새로 등록</text>
  <rect x="450" y="340" width="266" height="36" rx="6" class="wait"/>
  <text x="583" y="363" class="waitt" text-anchor="middle">기존 <tspan font-family="Menlo, Consolas, monospace">MailSendClient</tspan> 빈</text>
  <line x1="583" y1="376" x2="583" y2="396" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="596" y="391" class="step">교체</text>
  <rect x="450" y="398" width="266" height="40" rx="8" class="ok"/>
  <text x="583" y="423" class="okt" text-anchor="middle">Mock <tspan font-family="Menlo, Consolas, monospace">MailSendClient</tspan> 빈</text>
  <rect x="450" y="450" width="266" height="36" rx="6" class="box"/>
  <text x="583" y="473" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">MailSendHistoryRepository</tspan> 실제 빈</text>
  <line x1="290" y1="406" x2="448" y2="416" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="290" y1="428" x2="448" y2="464" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
</svg>
