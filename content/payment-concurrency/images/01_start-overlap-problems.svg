<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>7장 출발 코드에서 겹친 요청 네 장면 — 같은 결제 키 승인 둘은 둘 다 READY를 읽어 PG 승인 요청이 2번 가고 다른 키면 승인이 2건 남는다. 15000원 결제에 10000원 취소 둘은 나중 취소가 앞 취소의 요청 줄을 보지 못해 둘 다 PG로 가지만 Mock PG가 둘째를 거절해 PG 취소 합은 결제 금액 안이다. 알림 반영이 APPROVAL_CANCELED로 바꾸는 사이 승인 답 기록이 반영 전 결제를 읽고 뒤에 커밋해 PG는 CANCELED, 결제는 APPROVED로 남는다. 서버 두 대가 같은 때 주기 작업을 돌리면 결제마다 PG 조회와 망취소가 두 번씩 가지만 결과는 PG와 같다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #4b5563; }
    .s2 { font-size: 11.5px; fill: #4b5563; }
    .m { font-family: Menlo, Consolas, monospace; }
    .lbl { font-size: 12px; fill: #4b5563; }
    .tab { font-size: 12.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .badt { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .bads { font-size: 12px; fill: #b91c1c; }
    .okt { font-size: 13px; font-weight: 700; fill: #15803d; }
    .oks { font-size: 12px; fill: #15803d; }
    .gt { font-size: 13px; font-weight: 700; fill: #6b7280; }
    .gs { font-size: 12px; fill: #6b7280; }
    .ot { font-size: 13px; font-weight: 700; fill: #c2410c; }
    .os { font-size: 12px; fill: #c2410c; }
    .bt { font-size: 13px; font-weight: 700; fill: #1e3a8a; }
    .bs { font-size: 12px; fill: #1e3a8a; }
    .o { stroke: #1f2937; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .spine { stroke: #1f2937; stroke-width: 1.5; fill: none; }
    .life { stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .run { stroke-dasharray: 5 4; animation: run 0.9s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -18; } }
    @media (prefers-reduced-motion: reduce) { .run { animation: none; } .anim { display: none; } }
  </style>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="aor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
    <marker id="abl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <g id="pkt">
      <rect x="-11" y="-8" width="22" height="16" rx="3" fill="#2dd4bf" stroke="#0f766e" stroke-width="1.5"/>
      <path d="M-10,-7 L0,1 L10,-7" fill="none" stroke="#0f766e" stroke-width="1.5"/>
    </g>
    <g id="pkt2">
      <rect x="-11" y="-8" width="22" height="16" rx="3" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/>
      <path d="M-10,-7 L0,1 L10,-7" fill="none" stroke="#c2410c" stroke-width="1.5"/>
    </g>
    <g id="xmark"><circle r="9" fill="#ef4444"/><path d="M-4,-4 L4,4 M4,-4 L-4,4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
    <g id="vmark"><circle r="9" fill="#22c55e"/><path d="M-4.5,0 L-1.5,3.5 L4.5,-3.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="xs"><circle r="7" fill="#ef4444"/><path d="M-3,-3 L3,3 M3,-3 L-3,3" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></g>
    <g id="vs"><circle r="7" fill="#22c55e"/><path d="M-3.5,0 L-1,2.8 L3.5,-2.8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="i-card"><rect x="0" y="3" width="32" height="22" rx="4" fill="#5eead4" class="o"/><rect x="0" y="8" width="32" height="5" fill="#1f2937"/><rect x="4" y="16" width="8" height="6" rx="1.5" fill="#fbbf24" class="o" stroke-width="1"/></g>
    <g id="i-app"><rect x="0" y="0" width="30" height="30" rx="5" fill="#93c5fd" class="o"/><path d="M0,9 h30" class="o" fill="none"/><circle cx="5" cy="4.5" r="1.4" fill="#1f2937"/><circle cx="10" cy="4.5" r="1.4" fill="#1f2937"/><path d="M7,16 h16 M7,22 h11" stroke="#1e3a8a" stroke-width="1.6" stroke-linecap="round"/></g>
    <g id="i-db"><path d="M1,5 v20 a13,5 0 0 0 26,0 v-20 a13,5 0 0 1 -26,0 z" fill="#60a5fa" class="o"/><path d="M1,15 a13,5 0 0 0 26,0" fill="none" class="o"/><ellipse cx="14" cy="5" rx="13" ry="5" fill="#bfdbfe" class="o"/></g>
    <g id="i-server"><rect x="0" y="0" width="36" height="13" rx="3" fill="#cbd5e1" class="o"/><rect x="0" y="16" width="36" height="13" rx="3" fill="#cbd5e1" class="o"/><circle cx="7" cy="6.5" r="2.2" fill="#22c55e"/><circle cx="7" cy="22.5" r="2.2" fill="#22c55e"/><path d="M14,6.5 h16 M14,22.5 h16" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/></g>
    <g id="i-coin"><circle cx="12" cy="12" r="11" fill="#fbbf24" class="o"/><circle cx="12" cy="12" r="7" fill="#fcd34d" stroke="#b45309" stroke-width="1"/><text x="12" y="16.5" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">₩</text></g>
    <g id="i-key"><circle cx="8" cy="12" r="7.5" fill="#fbbf24" class="o"/><circle cx="8" cy="12" r="2.6" fill="#ffffff" class="o" stroke-width="1.2"/><path d="M15.5,12 H30 V17.5 M25,12 V16.5" fill="none" class="o" stroke-width="2"/></g>
    <g id="i-clock"><circle cx="14" cy="14" r="13" fill="#fde68a" class="o"/><path d="M14,7 V14 L20,18" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/></g>
    <g id="i-chips"><rect x="0" y="4" width="13" height="14" rx="4" fill="#e5e7eb" class="o"/><rect x="21" y="4" width="13" height="14" rx="4" fill="#86efac" class="o"/><path d="M14,11 h6" class="o" fill="none"/><path d="M17,8 l3,3 l-3,3" class="o" fill="none"/></g>
    <g id="i-plane"><path d="M1,13 L31,1 L23,29 L15,19 Z" fill="#fdba74" class="o"/><path d="M15,19 L31,1 L11,16 Z" fill="#fb923c" class="o"/></g>
    <g id="i-doc"><path d="M0,0 h18 l8,8 v26 h-26 z" fill="#ffffff" class="o"/><path d="M18,0 v8 h8" fill="#e5e7eb" class="o"/><circle cx="20" cy="26" r="8" fill="#22c55e" class="o"/><path d="M16.5,26 l2.5,2.5 l4.5,-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5,10 h9 M5,16 h7" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/></g>
    <g id="i-table"><rect x="0" y="0" width="30" height="26" rx="3" fill="#ffffff" class="o"/><rect x="0" y="0" width="30" height="7" rx="3" fill="#60a5fa" class="o"/><path d="M0,13.5 h30 M0,20 h30 M11,7 v19" stroke="#1f2937" stroke-width="1.2"/></g>
    <g id="i-search"><circle cx="11" cy="11" r="9" fill="#bae6fd" class="o"/><path d="M18,18 L27,27" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/></g>
    <g id="i-chart"><rect x="0" y="16" width="7" height="12" fill="#93c5fd" class="o"/><rect x="10" y="8" width="7" height="20" fill="#60a5fa" class="o"/><rect x="20" y="2" width="7" height="26" fill="#2563eb" class="o"/></g>
    <g id="i-bell"><path d="M14,3 C8.5,3 6,7.5 6,13 V19 L3,23 H25 L22,19 V13 C22,7.5 19.5,3 14,3 Z" fill="#fde047" class="o"/><circle cx="14" cy="26" r="3" fill="#f59e0b" class="o"/></g>
    <g id="i-warn"><path d="M14,2 L27,25 H1 Z" fill="#fca5a5" class="o"/><path d="M14,10 V17" stroke="#7f1d1d" stroke-width="2.2" stroke-linecap="round"/><circle cx="14" cy="21" r="1.5" fill="#7f1d1d"/></g>
    <g id="i-lock"><path d="M7,12 V8 a7,7 0 0 1 14,0 V12" fill="none" class="o" stroke-width="2.2"/><rect x="3" y="12" width="22" height="16" rx="3" fill="#fbbf24" class="o"/><circle cx="14" cy="20" r="2.4" fill="#1f2937"/></g>
    <g id="i-wait"><path d="M3,1 H23 M3,29 H23" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><path d="M5,2 C5,10 13,12 13,15 C13,18 5,20 5,28 H21 C21,20 13,18 13,15 C13,12 21,10 21,2 Z" fill="#e0e7ff" class="o"/><path d="M8,26 C9,22 13,21 13,19 C13,21 17,22 18,26 Z" fill="#f59e0b"/></g>
  </defs>

  <rect width="760" height="660" fill="#ffffff"/>
  <text x="24" y="28" class="h">7장 출발 코드 — 겹친 요청이 서로를 보지 못하는 네 장면</text>
  <rect x="16" y="44" width="356" height="270" rx="14" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <circle cx="20" cy="48" r="12" fill="#111827"/><text x="20" y="52" class="num" text-anchor="middle" style="font-size:12px">1</text>
  <text x="40" y="70" class="t">같은 결제 키로 승인 두 건</text>
  <rect x="30" y="86" width="328" height="46" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.3"/>
  <rect x="38" y="98" width="44" height="22" rx="11" fill="#2563eb"/>
  <text x="60" y="113" class="num" text-anchor="middle" style="font-size:11.5px">승인 A</text>
  <use href="#i-clock" x="90" y="95"/>
  <text x="134" y="106" class="s" style="fill:#1f2937;font-weight:700;font-size:12.5px"><tspan class="m">READY</tspan> 읽고 인증 전이</text>
  <text x="134" y="123" class="s2">바꾸는 기록이 커밋 전에 1초 붙잡힘</text>
  <rect x="30" y="140" width="328" height="46" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.3"/>
  <rect x="38" y="152" width="44" height="22" rx="11" fill="#7c3aed"/>
  <text x="60" y="167" class="num" text-anchor="middle" style="font-size:11.5px">승인 B</text>
  <use href="#i-chips" x="90" y="149"/>
  <text x="134" y="160" class="s" style="fill:#1f2937;font-weight:700;font-size:12.5px"><tspan class="m">READY</tspan> 읽음(A 커밋 전)</text>
  <text x="134" y="177" class="s2">결과 남긴 결제가 아니라 인증 전이</text>
  <rect x="30" y="198" width="328" height="44" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.3"/>
  <use href="#xmark" x="50" y="220.0"/>
  <text x="68" y="217" class="badt">PG 승인 요청 2번</text>
  <text x="68" y="234" class="bads">같은 결제 키 둘이면 요청 2번</text>
  <rect x="30" y="250" width="328" height="44" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.3"/>
  <use href="#xmark" x="50" y="272.0"/>
  <text x="68" y="269" class="badt">PG에 승인 2건</text>
  <text x="68" y="286" class="bads">다른 결제 키 둘이면 승인이 둘</text>
  <rect x="388" y="44" width="356" height="270" rx="14" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <circle cx="392" cy="48" r="12" fill="#111827"/><text x="392" y="52" class="num" text-anchor="middle" style="font-size:12px">2</text>
  <text x="412" y="70" class="t">15000원 결제에 남은 금액을 넘는 10000원 취소 둘</text>
  <rect x="402" y="86" width="328" height="46" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.3"/>
  <rect x="410" y="98" width="44" height="22" rx="11" fill="#2563eb"/>
  <text x="432" y="113" class="num" text-anchor="middle" style="font-size:11.5px">취소 A</text>
  <use href="#i-clock" x="462" y="95"/>
  <text x="506" y="106" class="s" style="fill:#1f2937;font-weight:700;font-size:12.5px">10000원 <tspan class="m">REQUESTED</tspan> 줄 남김</text>
  <text x="506" y="123" class="s2">요청 줄을 남기다 1초 붙잡힘</text>
  <rect x="402" y="140" width="328" height="46" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.3"/>
  <rect x="410" y="152" width="44" height="22" rx="11" fill="#7c3aed"/>
  <text x="432" y="167" class="num" text-anchor="middle" style="font-size:11.5px">취소 B</text>
  <use href="#i-coin" x="462" y="149"/>
  <text x="506" y="160" class="s" style="fill:#1f2937;font-weight:700;font-size:12.5px">A의 줄이 안 보임</text>
  <text x="506" y="177" class="s2">받을 수 있는 금액 15000원으로 계산</text>
  <rect x="402" y="198" width="328" height="44" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.3"/>
  <use href="#xmark" x="422" y="220.0"/>
  <text x="440" y="217" class="badt">둘 다 PG로 감</text>
  <text x="440" y="234" class="bads">나중 취소도 "남은 금액보다 큼" 대신 답을 받음</text>
  <rect x="402" y="250" width="328" height="44" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.3"/>
  <use href="#vmark" x="422" y="272.0"/>
  <text x="440" y="269" class="okt">PG 취소 합은 결제 금액 안</text>
  <text x="440" y="286" class="oks">둘째 취소는 Mock PG가 잔액 검사로 거절</text>
  <rect x="16" y="330" width="356" height="270" rx="14" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <circle cx="20" cy="334" r="12" fill="#111827"/><text x="20" y="338" class="num" text-anchor="middle" style="font-size:12px">3</text>
  <text x="40" y="356" class="t">알림 반영과 승인 답 기록이 겹침</text>
  <rect x="30" y="372" width="328" height="46" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.3"/>
  <rect x="38" y="384" width="44" height="22" rx="11" fill="#ea580c"/>
  <text x="60" y="399" class="num" text-anchor="middle" style="font-size:11.5px">알림</text>
  <use href="#i-bell" x="90" y="381"/>
  <text x="134" y="392" class="s" style="fill:#1f2937;font-weight:700;font-size:12.5px">반영 → <tspan class="m">APPROVAL_CANCELED</tspan></text>
  <text x="134" y="409" class="s2">전액 취소 알림, 승인 답을 붙잡은 사이</text>
  <rect x="30" y="426" width="328" height="46" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.3"/>
  <rect x="38" y="438" width="44" height="22" rx="11" fill="#2563eb"/>
  <text x="60" y="453" class="num" text-anchor="middle" style="font-size:11.5px">승인 답</text>
  <use href="#i-doc" x="90" y="435"/>
  <text x="134" y="446" class="s" style="fill:#1f2937;font-weight:700;font-size:12.5px">반영 전 결제를 읽고 <tspan class="m">APPROVED</tspan>로</text>
  <text x="134" y="463" class="s2">알림 반영보다 뒤에 커밋</text>
  <rect x="30" y="484" width="328" height="44" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.3"/>
  <use href="#xmark" x="50" y="506.0"/>
  <text x="68" y="503" class="badt">승인으로 덮어씀</text>
  <text x="68" y="520" class="bads">PG는 <tspan class="m">CANCELED</tspan>, 우리 결제는 <tspan class="m">APPROVED</tspan></text>
  <text x="40" y="558" class="s2">6장에서 남긴 "처리기와 API가 같은 결제를</text>
  <text x="40" y="576" class="s2">함께 바꾸는 경우"를 고정된 겹침으로 재현</text>
  <rect x="388" y="330" width="356" height="270" rx="14" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <circle cx="392" cy="334" r="12" fill="#111827"/><text x="392" y="338" class="num" text-anchor="middle" style="font-size:12px">4</text>
  <text x="412" y="356" class="t">서버 두 대가 같은 때 주기 작업</text>
  <rect x="402" y="372" width="328" height="46" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.3"/>
  <rect x="410" y="384" width="44" height="22" rx="11" fill="#475569"/>
  <text x="432" y="399" class="num" text-anchor="middle" style="font-size:11.5px">서버 1·2</text>
  <use href="#i-server" x="462" y="381"/>
  <text x="506" y="392" class="s" style="fill:#1f2937;font-weight:700;font-size:12.5px">래치로 같은 때 주기 작업 시작</text>
  <text x="506" y="409" class="s2">PG는 조회·취소에 0.5초 늦게 답함</text>
  <rect x="402" y="426" width="328" height="100" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.3"/>
  <use href="#xmark" x="422" y="446"/>
  <text x="440" y="451" class="badt">결제마다 PG에 두 번</text>
  <text x="440" y="472" class="bads">승인 보정 조회 <tspan class="m">[2, 2, 2]</tspan></text>
  <text x="440" y="490" class="bads">취소 보정 조회 <tspan class="m">[2, 2, 2]</tspan> · 망취소 <tspan class="m">[2, 2, 2]</tspan></text>
  <text x="440" y="508" class="bads">알림 처리 조회 <tspan class="m">[2, 1, 1]</tspan> — 실행마다 다를 수 있음</text>
  <rect x="402" y="536" width="328" height="44" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.3"/>
  <use href="#vmark" x="422" y="558.0"/>
  <text x="440" y="563.0" class="okt">결과(승인, 남은 금액)는 PG와 같음</text>
  <use href="#xs" x="30" y="622"/>
  <text x="44" y="626" class="lbl">출발 코드에서 실패한 것</text>
  <use href="#vs" x="200" y="622"/>
  <text x="214" y="626" class="lbl">출발 코드에서도 지켜진 것 — docs/ch07/01 결과</text>
  <text x="30" y="648" class="gs">겹치는 순간은 MySQL 트리거로 먼저 보낸 기록을 1초 붙잡아 고정했습니다</text>
</svg>
