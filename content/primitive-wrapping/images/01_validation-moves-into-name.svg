<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>포장 전에는 String name과 이름 길이 검증이 Car 안에 있지만, 포장 후에는 Name이 5자 초과 검증을 맡고 Car는 Name만 가지는 구조 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .bt { font-size: 14px; font-weight: 700; fill: #1f2937; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="520" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="220" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">포장 전 — 이름 검증이 Car 안에 있다</text>
  <text x="730" y="42" class="code" text-anchor="end">String name</text>
  <rect x="30" y="60" width="700" height="122" rx="10" class="hold"/>
  <text x="50" y="86" class="op">Car</text>
  <rect x="50" y="102" width="200" height="56" rx="8" class="box"/>
  <text x="150" y="125" class="op" text-anchor="middle">String name</text>
  <text x="150" y="145" class="val" text-anchor="middle">이름을 문자열로 보관</text>
  <rect x="270" y="102" width="200" height="56" rx="8" class="bad"/>
  <text x="370" y="125" class="badc" text-anchor="middle">checkName()</text>
  <text x="370" y="145" class="val" text-anchor="middle">5자 초과면 예외</text>
  <rect x="490" y="102" width="220" height="56" rx="8" class="wait"/>
  <text x="600" y="125" class="bt" text-anchor="middle">다른 값의 검증</text>
  <text x="600" y="145" class="val" text-anchor="middle">값이 늘면 Car에 추가됨</text>
  <text x="30" y="210" class="note">값이 늘어날수록 그 값들의 유효성 체크를 모두 Car가 맡게 됩니다.</text>
  <rect x="10" y="246" width="740" height="264" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="278" class="h">포장 후 — Name이 자기 값을 검증한다</text>
  <text x="730" y="278" class="code" text-anchor="end">Name name</text>
  <rect x="30" y="296" width="330" height="150" rx="10" class="hold"/>
  <text x="50" y="322" class="op">Car</text>
  <rect x="50" y="338" width="290" height="56" rx="8" class="box"/>
  <text x="195" y="361" class="op" text-anchor="middle">Name name</text>
  <text x="195" y="381" class="val" text-anchor="middle">이름은 Name 객체로 보관</text>
  <text x="50" y="428" class="sub">자동차에 대한 검증과 로직만 남음</text>
  <line x1="342" y1="366" x2="396" y2="366" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="400" y="296" width="330" height="150" rx="10" class="ok"/>
  <text x="420" y="322" class="okc">Name</text>
  <rect x="420" y="338" width="290" height="56" rx="8" class="box"/>
  <text x="565" y="361" class="op" text-anchor="middle">checkName()</text>
  <text x="565" y="381" class="val" text-anchor="middle">5자 초과면 예외</text>
  <text x="420" y="428" class="code">NAME_MAX_LENGTH = 5</text>
  <text x="30" y="480" class="sub">이름 길이 검증이 Name 안으로 옮겨 가고, Car는 Name을 가지고 자동차 로직에 집중합니다.</text>
</svg>
