  <text x="232" y="274" class="gs" style="font-size:11px">두 번호 모두 <tspan class="m">payment_outbox</tspan> 번호</text>
  <rect x="452" y="78" width="296" height="214" rx="16" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="464" y="66" width="210" height="24" rx="6" fill="#5b7194"/><text x="569" y="82.5" class="tab" text-anchor="middle">받는 쪽 — 이 장에서 바꿈</text>
  <rect x="468" y="104" width="264" height="56" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/><text x="600" y="127.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11.5px">주문 서비스</text><text x="600" y="144.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11.5px">결제 결과 → 주문 상태</text>
  <rect x="468" y="186" width="264" height="56" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/><text x="600" y="209.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11.5px">재고 서비스</text><text x="600" y="226.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11.5px">확정·해제 명령 → 예약 상태</text>
  <line x1="430" y1="144" x2="466" y2="132" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <line x1="430" y1="226" x2="466" y2="214" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
