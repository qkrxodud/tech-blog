<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 464" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>모호한 지시 알림 기능 개선과, 무엇을, 어떻게, 어디까지, 하지 말아야 할 것이 담긴 구체적인 지시 AUTO-TRADE-BUY-SELL-ALERT의 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="464" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="126" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">모호한 지시</text>
  <rect x="30" y="58" width="700" height="40" rx="8" class="bad"/>
  <text x="46" y="83" class="badt"><tspan font-family="Menlo, Consolas, monospace">- [ ]</tspan> 알림 기능 개선</text>
  <text x="30" y="122" class="note">무엇을, 어떻게, 어디까지, 하지 말아야 할 것이 모두 빠져 있음</text>
  <rect x="10" y="152" width="740" height="302" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="184" class="h">구체적인 지시</text>
  <text x="730" y="184" class="code" text-anchor="end">[AUTO-TRADE-BUY-SELL-ALERT]</text>
  <rect x="30" y="200" width="140" height="48" rx="8" class="ok"/>
  <text x="100" y="229" class="okt" text-anchor="middle">무엇을</text>
  <rect x="186" y="200" width="544" height="48" rx="8" class="box"/>
  <text x="202" y="229" class="val">BUY/SELL 신호 전용 강조 알림</text>
  <rect x="30" y="260" width="140" height="48" rx="8" class="ok"/>
  <text x="100" y="289" class="okt" text-anchor="middle">어떻게</text>
  <rect x="186" y="260" width="544" height="48" rx="8" class="box"/>
  <text x="202" y="280" class="val">“매수 신호 발동!” 헤더 + 진입가/목표가/스탑로스 포함</text>
  <text x="202" y="299" class="val"><tspan font-family="Menlo, Consolas, monospace">SentAlertRepository</tspan>로 당일 중복 발송 방지</text>
  <rect x="30" y="320" width="140" height="48" rx="8" class="ok"/>
  <text x="100" y="349" class="okt" text-anchor="middle">어디까지</text>
  <rect x="186" y="320" width="544" height="48" rx="8" class="box"/>
  <text x="202" y="349" class="val">BUY/SELL 시에만 별도 강조 메시지 추가 발송</text>
  <rect x="30" y="380" width="140" height="48" rx="8" class="ok"/>
  <text x="100" y="409" class="okt" text-anchor="middle">하지 말 것</text>
  <rect x="186" y="380" width="544" height="48" rx="8" class="box"/>
  <text x="202" y="409" class="val">HOLD/SKIP은 기존 요약 메시지만 유지</text>
</svg>
