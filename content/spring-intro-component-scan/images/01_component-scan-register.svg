<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 334" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>@Controller가 붙은 MemberController, @Service가 붙은 MemberService, @Repository가 붙은 MemoryMemberRepository가 내부의 @Component 때문에 컴포넌트 스캔으로 스프링 컨테이너에 빈으로 등록되는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .mxs { font-size: 11px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .chip { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .gscope { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="334" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="314" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">컴포넌트 스캔 — @Component를 포함한 클래스를 빈으로 등록</text>
  <text x="155" y="74" class="sub" text-anchor="middle">애노테이션이 붙은 클래스</text>
  <text x="375" y="74" class="sub" text-anchor="middle">스캔</text>
  <text x="605" y="74" class="sub" text-anchor="middle">스프링 컨테이너</text>
  <rect x="480" y="86" width="250" height="186" rx="10" class="gscope"/>
  <rect x="30" y="88" width="250" height="54" rx="8" class="box"/>
  <text x="155" y="110" class="mb" text-anchor="middle">@Controller</text>
  <text x="155" y="130" class="m" text-anchor="middle">MemberController</text>
  <line x1="284" y1="115" x2="488" y2="115" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="496" y="92" width="218" height="46" rx="8" class="ok"/>
  <text x="605.0" y="111.0" class="okm" text-anchor="middle">MemberController</text>
  <text x="605.0" y="130.0" class="val" text-anchor="middle">스프링 빈</text>
  <rect x="30" y="150" width="250" height="54" rx="8" class="box"/>
  <text x="155" y="172" class="mb" text-anchor="middle">@Service</text>
  <text x="155" y="192" class="m" text-anchor="middle">MemberService</text>
  <line x1="284" y1="177" x2="488" y2="177" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="496" y="154" width="218" height="46" rx="8" class="ok"/>
  <text x="605.0" y="173.0" class="okm" text-anchor="middle">MemberService</text>
  <text x="605.0" y="192.0" class="val" text-anchor="middle">스프링 빈</text>
  <rect x="30" y="212" width="250" height="54" rx="8" class="box"/>
  <text x="155" y="234" class="mb" text-anchor="middle">@Repository</text>
  <text x="155" y="254" class="m" text-anchor="middle">MemoryMemberRepository</text>
  <line x1="284" y1="239" x2="488" y2="239" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="496" y="216" width="218" height="46" rx="8" class="ok"/>
  <text x="605.0" y="235.0" class="okm" text-anchor="middle">MemoryMemberRepository</text>
  <text x="605.0" y="254.0" class="val" text-anchor="middle">스프링 빈</text>
  <text x="380" y="108" class="sub" text-anchor="middle">@Component 포함</text>
  <text x="30" y="300" class="foot">@Controller, @Service, @Repository는 모두 내부에 @Component를 포함하고 있어 스캔 대상이 됩니다.</text>
</svg>
