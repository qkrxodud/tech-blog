  <circle cx="16" cy="86" r="11" fill="#111827"/><text x="16" y="90" class="num" text-anchor="middle" style="font-size:12px">1</text>
  <use href="#i-search" x="28" y="95"/>
  <text x="68" y="106" class="s" style="fill:#1f2937;font-weight:700;font-size:12.5px"><tspan class="m">findByOrderId</tspan> → 없음</text>
  <text x="68" y="123" class="s2"><tspan class="m">PaymentPrepareRecorder</tspan></text>
  <rect x="16" y="142" width="260" height="46" rx="9" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.3"/>
  <circle cx="16" cy="142" r="11" fill="#111827"/><text x="16" y="146" class="num" text-anchor="middle" style="font-size:12px">2</text>
  <use href="#i-clock" x="28" y="151"/>
  <text x="68" y="162" class="s" style="fill:#1f2937;font-weight:700;font-size:12.5px"><tspan class="m">save</tspan> — insert</text>
  <text x="68" y="179" class="s2">트리거로 1초 붙잡힘</text>
  <rect x="296" y="142" width="448" height="46" rx="9" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.3"/>
  <circle cx="296" cy="142" r="11" fill="#111827"/><text x="296" y="146" class="num" text-anchor="middle" style="font-size:12px">3</text>
  <use href="#i-search" x="308" y="151"/>
  <text x="348" y="162" class="s" style="fill:#1f2937;font-weight:700;font-size:12.5px"><tspan class="m">findByOrderId</tspan> → 없음</text>
  <text x="348" y="179" class="s2">A가 아직 커밋하지 않아 보이지 않음</text>
  <rect x="296" y="198" width="448" height="46" rx="9" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.3"/>
  <circle cx="296" cy="198" r="11" fill="#111827"/><text x="296" y="202" class="num" text-anchor="middle" style="font-size:12px">4</text>
  <use href="#i-wait" x="308" y="207"/>
  <text x="348" y="218" class="s" style="fill:#1f2937;font-weight:700;font-size:12.5px"><tspan class="m">save</tspan> — insert</text>
  <text x="348" y="235" class="s2"><tspan class="m">uk_payment_order_id</tspan>에서 A의 줄을 기다림</text>
  <rect x="16" y="254" width="260" height="46" rx="9" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.3"/>
  <circle cx="16" cy="254" r="11" fill="#111827"/><text x="16" y="258" class="num" text-anchor="middle" style="font-size:12px">5</text>
  <use href="#i-doc" x="28" y="263"/>
  <text x="68" y="274" class="s" style="fill:#1f2937;font-weight:700;font-size:12.5px">커밋</text>
  <text x="68" y="291" class="s2">결제 하나가 남음</text>
  <rect x="296" y="254" width="448" height="46" rx="9" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.3"/>
  <circle cx="296" cy="254" r="11" fill="#111827"/><text x="296" y="258" class="num" text-anchor="middle" style="font-size:12px">6</text>
