  <circle cx="452" cy="120" r="10" fill="#111827"/><text x="452" y="124" class="num" text-anchor="middle" style="font-size: 11px">3</text>
  <rect x="452" y="120" width="130" height="66" rx="10" fill="none" stroke="#16a34a" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.79;0.8;0.95;0.96;1"/></rect>
