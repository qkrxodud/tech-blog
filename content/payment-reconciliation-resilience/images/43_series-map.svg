  <rect width="760" height="446" fill="#ffffff"/>
  <text x="24" y="28" class="h">결제 시스템 챌린지 — 1장 목차의 네 부와 이 장</text>
  <text x="24" y="48" class="gs" style="font-size:11px">이번 글로 연재를 마침 · 다음 장은 없음</text>
  <line x1="40" y1="84" x2="659" y2="84" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
  <circle cx="101" cy="84" r="9" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <rect x="14" y="104" width="174" height="190" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="26" y="126" class="t2" style="font-size:12px">1부 단일 서버</text>
  <text x="26" y="150" class="s2" style="font-size:10.5px;fill:#1f2937">1장 결제 기초와 상태 머신</text>
  <text x="26" y="170" class="s2" style="font-size:10.5px;fill:#1f2937">2장 가장 단순한 결제 구현과</text>
  <text x="48" y="190" class="s2" style="font-size:10.5px;fill:#1f2937">트랜잭션 경계</text>
  <text x="26" y="210" class="s2" style="font-size:10.5px;fill:#1f2937">3장 금액 검증과 멱등성</text>
  <text x="26" y="230" class="s2" style="font-size:10.5px;fill:#1f2937">4장 응답을 못 받았을 때의 처리</text>
  <text x="26" y="250" class="s2" style="font-size:10.5px;fill:#1f2937">5장 취소와 부분 취소</text>
  <text x="26" y="270" class="s2" style="font-size:10.5px;fill:#1f2937">6장 웹훅 처리</text>
  <circle cx="287" cy="84" r="9" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <rect x="200" y="104" width="174" height="190" rx="10" fill="#ece8fb" stroke="#9b88d6" stroke-width="1.5"/>
  <text x="212" y="126" class="t2" style="font-size:12px">2부 서버가 여러 대가 되면</text>
  <text x="212" y="150" class="s2" style="font-size:10.5px;fill:#1f2937">7장 동시성 제어</text>
  <text x="212" y="170" class="s2" style="font-size:10.5px;fill:#1f2937">8장 결제와 재고·포인트·쿠폰</text>
  <circle cx="473" cy="84" r="9" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <rect x="386" y="104" width="174" height="190" rx="10" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <text x="398" y="126" class="t2" style="font-size:12px">3부 서비스를 분리하면</text>
  <text x="398" y="150" class="s2" style="font-size:10.5px;fill:#1f2937">9장 Transactional Outbox와 Kafka</text>
  <text x="398" y="170" class="s2" style="font-size:10.5px;fill:#1f2937">10장 Saga와 보상 트랜잭션</text>
  <text x="398" y="190" class="s2" style="font-size:10.5px;fill:#1f2937">11장 컨슈머 멱등성·재시도·DLQ</text>
  <circle cx="659" cy="84" r="9" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <rect x="572" y="104" width="174" height="190" rx="10" fill="#e3f3e6" stroke="#16a34a" stroke-width="3"/>
  <text x="584" y="126" class="t2" style="font-size:12px">4부 운영</text>
  <text x="584" y="150" class="s2" style="font-size:10.5px;fill:#1f2937">12장 대사와 장애 대응</text>
  <text x="659" y="70" class="okt" text-anchor="middle" style="font-size:12px">이 장</text>
  <rect x="14" y="318" width="734" height="116" rx="16" fill="#f3f6fb" stroke="#9fb3d1" stroke-width="1.5"/>
  <rect x="26" y="306" width="300" height="24" rx="6" fill="#5b7194"/><text x="176" y="322.5" class="tab" text-anchor="middle">남은 한계에 모아 둔 것 가운데</text>
  <rect x="28" y="340" width="228" height="60" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <use href="#i-coin" transform="translate(40,356) scale(0.7)"/>
  <text x="72" y="375" class="t2" style="font-size:11px">매입 흐름</text>
  <rect x="268" y="340" width="228" height="60" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <use href="#i-search" transform="translate(280,356) scale(0.7)"/>
  <text x="312" y="375" class="t2" style="font-size:11px">운영자가 확인한 대사 어긋남을 닫는 길</text>
  <rect x="508" y="340" width="228" height="60" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <use href="#i-clock" transform="translate(520,356) scale(0.7)"/>
  <text x="552" y="375" class="t2" style="font-size:11px">차단기 기준값과 보존 기간의 운영 기준</text>
  <text x="28" y="420" class="gs" style="font-size:11px">이 장과 앞 장들에서 해결하지 못한 것은 남은 한계에 모아 둠</text>
</svg>
