  <rect x="24" y="92" width="50" height="22" rx="11" fill="#475569"/>
  <text x="49" y="107" class="num" text-anchor="middle" style="font-size:11.5px">2·3장</text>
  <text x="86" y="108" class="s" style="fill:#1f2937">같은 결제에 동시에 들어오는 승인</text>
  <line x1="538" y1="103" x2="558" y2="103" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#agy)"/>
  <rect x="560" y="90" width="82" height="26" rx="13" fill="#2563eb"/>
  <text x="601" y="107" class="num" text-anchor="middle" style="font-size:12px">결정 1</text>
  <rect x="652" y="90" width="82" height="26" rx="13" fill="#7c3aed"/>
  <text x="693" y="107" class="num" text-anchor="middle" style="font-size:12px">결정 2</text>
  <rect x="16" y="126" width="520" height="34" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.2"/>
  <rect x="24" y="132" width="50" height="22" rx="11" fill="#475569"/>
  <text x="49" y="147" class="num" text-anchor="middle" style="font-size:11.5px">3장</text>
  <text x="86" y="148" class="s" style="fill:#1f2937">같은 주문의 동시 준비가 500</text>
