<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>MemberRepository가 JpaRepository와 MemberRepositoryCustom을 함께 상속하고, MemberRepositoryCustom은 이름 규칙에 따라 MemberRepositoryImpl이 구현하므로, memberRepository.findMemberCustom()을 호출하면 MemberRepositoryImpl의 EntityManager 코드가 실행된다는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 12.5px; fill: #374151; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="760" height="430" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="410" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">사용자 정의 리포지토리 — 인터페이스와 구현 클래스의 연결</text>
  <rect x="210" y="62" width="340" height="48" rx="8" class="box"/>
  <text x="380" y="82" class="t" text-anchor="middle">호출하는 쪽</text>
  <text x="380" y="100" class="mono" text-anchor="middle">memberRepository.findMemberCustom()</text>
  <line x1="380" y1="112" x2="380" y2="140" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#agy)"/>
  <rect x="250" y="144" width="260" height="52" rx="8" class="hold"/>
  <text x="380" y="166" class="op" text-anchor="middle">MemberRepository</text>
  <text x="380" y="185" class="val" text-anchor="middle">두 인터페이스를 함께 상속</text>
  <line x1="320" y1="198" x2="210" y2="240" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#agy)"/>
  <line x1="440" y1="198" x2="550" y2="240" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#agy)"/>
  <text x="230" y="222" class="sub" text-anchor="end">extends</text>
  <text x="530" y="222" class="sub">extends</text>
  <rect x="60" y="244" width="280" height="52" rx="8" class="box"/>
  <text x="200" y="266" class="op" text-anchor="middle">JpaRepository</text>
  <text x="200" y="285" class="val" text-anchor="middle">공통 메서드 — 스프링 데이터 JPA가 구현</text>
  <rect x="420" y="244" width="280" height="52" rx="8" class="box"/>
  <text x="560" y="266" class="op" text-anchor="middle">MemberRepositoryCustom</text>
  <text x="560" y="285" class="val" text-anchor="middle">사용자 정의 인터페이스</text>
  <line x1="560" y1="326" x2="560" y2="300" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="548" y="318" class="gnote" text-anchor="end">implements</text>
  <rect x="420" y="330" width="280" height="52" rx="8" class="ok"/>
  <text x="560" y="352" class="okc" text-anchor="middle">MemberRepositoryImpl</text>
  <text x="560" y="371" class="val" text-anchor="middle">EntityManager로 직접 구현</text>
  <rect x="60" y="330" width="280" height="52" rx="8" class="wait"/>
  <text x="200" y="352" class="waitt" text-anchor="middle">이름 규칙</text>
  <text x="200" y="371" class="waitt" text-anchor="middle">리포지토리 인터페이스 이름 + Impl</text>
  <text x="30" y="406" class="sub">findMemberCustom()을 호출하면 스프링 빈으로 등록된 MemberRepositoryImpl의 코드가 실행됩니다.</text>
</svg>
