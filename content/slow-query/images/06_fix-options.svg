<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 326" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>rule_id와 check_ts 복합 인덱스로 조인과 조회 조건을 한 인덱스에서 처리하는 방법과, STRAIGHT_JOIN으로 FROM 절 순서대로 조인하는 방법 중 조회 조건이 동적이라 STRAIGHT_JOIN을 선택한 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .subc { font-size: 12px; fill: #6b7280; font-family: Menlo, Consolas, monospace; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .valc { font-size: 12px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .dbc { font-size: 13px; font-weight: 700; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .opg { font-size: 14px; font-weight: 700; fill: #9ca3af; font-family: Menlo, Consolas, monospace; }
    .tg { font-size: 13px; font-weight: 700; fill: #6b7280; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .colh { font-size: 12px; font-weight: 700; fill: #9ca3af; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="326" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="306" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">해결 방법 — 두 가지 중 STRAIGHT_JOIN 선택</text>
  <rect x="190" y="62" width="380" height="44" rx="8" class="hold"/>
  <text x="380" y="89" class="t" text-anchor="middle">rule 드라이빙 → check_ts 인덱스 미사용</text>
  <path d="M380,106 L380,124 L200,124 L200,148" stroke="#9ca3af" stroke-width="1.6" fill="none" marker-end="url(#ag)"/>
  <path d="M380,124 L560,124 L560,148" stroke="#9ca3af" stroke-width="1.6" fill="none" marker-end="url(#ag)"/>
  <text x="210" y="140" class="step">방법 1</text>
  <text x="570" y="140" class="step">방법 2</text>
  <rect x="50" y="150" width="300" height="56" rx="8" class="box"/>
  <text x="200" y="173" class="t" text-anchor="middle">복합 인덱스 (rule_id, check_ts)</text>
  <text x="200" y="194" class="val" text-anchor="middle">조인·조건 컬럼을 한 인덱스로</text>
  <rect x="410" y="150" width="300" height="56" rx="8" class="ok"/>
  <text x="560" y="173" class="okc" text-anchor="middle">STRAIGHT_JOIN</text>
  <text x="560" y="194" class="val" text-anchor="middle">FROM 절에 명시된 순서대로 조인</text>
  <rect x="50" y="220" width="300" height="32" rx="6" class="wait"/>
  <text x="200" y="241" class="waitt" text-anchor="middle">조회 조건 컬럼이 동적으로 변함</text>
  <text x="572" y="232" class="gnote">그래서 선택</text>
  <path d="M350,236 L560,236 L560,208" stroke="#16a34a" stroke-width="1.6" fill="none" marker-end="url(#agr)"/>
  <rect x="150" y="268" width="585" height="32" rx="15" class="ok"/>
  <text x="442.5" y="289" class="okt" text-anchor="middle">STRAIGHT_JOIN으로 드라이빙 순서를 지정해 해결</text>
</svg>
