<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>실행 결과의 사다리에서 pobi는 1줄과 2줄에서 오른쪽으로, 3줄에서는 그대로, 4줄과 5줄에서 왼쪽으로 이동해 첫 번째 자리의 꽝에 도착한다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 12px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .name { font-size: 14px; font-weight: 700; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .pkg { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .rail { stroke: #9ca3af; stroke-width: 3; stroke-linecap: round; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="380" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">사다리 타기 — pobi의 이동 경로</text>
  <text x="730" y="42" class="sub" text-anchor="end">실행 결과 pobi : 꽝</text>

  <text x="110" y="78" class="name" text-anchor="middle">pobi</text>
  <text x="230" y="78" class="name" text-anchor="middle">honux</text>
  <text x="350" y="78" class="name" text-anchor="middle">crong</text>
  <text x="470" y="78" class="name" text-anchor="middle">jk</text>
  <line x1="110" y1="90" x2="110" y2="300" class="rail"/>
  <line x1="230" y1="90" x2="230" y2="300" class="rail"/>
  <line x1="350" y1="90" x2="350" y2="300" class="rail"/>
  <line x1="470" y1="90" x2="470" y2="300" class="rail"/>

  <g stroke="#c4c8ce" stroke-width="3">
    <line x1="110" y1="120" x2="230" y2="120"/>
    <line x1="350" y1="120" x2="470" y2="120"/>
    <line x1="230" y1="160" x2="350" y2="160"/>
    <line x1="110" y1="200" x2="230" y2="200"/>
    <line x1="230" y1="240" x2="350" y2="240"/>
    <line x1="110" y1="280" x2="230" y2="280"/>
    <line x1="350" y1="280" x2="470" y2="280"/>
  </g>
  <polyline points="110,90 110,120 230,120 230,160 350,160 350,240 230,240 230,280 110,280 110,302" fill="none" stroke="#16a34a" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="110" cy="90" r="6" fill="#16a34a"/>

  <text x="520" y="124" class="val"><tspan class="t">1줄</tspan> 오른쪽으로 이동 (0 → 1)</text>
  <text x="520" y="164" class="val"><tspan class="t">2줄</tspan> 오른쪽으로 이동 (1 → 2)</text>
  <text x="520" y="204" class="val"><tspan class="t">3줄</tspan> 양쪽 모두 연결 없음, 그대로 (2)</text>
  <text x="520" y="244" class="val"><tspan class="t">4줄</tspan> 왼쪽으로 이동 (2 → 1)</text>
  <text x="520" y="284" class="val"><tspan class="t">5줄</tspan> 왼쪽으로 이동 (1 → 0)</text>

  <rect x="88" y="308" width="44" height="28" rx="6" class="ok"/>
  <text x="110" y="327" class="okt" text-anchor="middle">꽝</text>
  <text x="230" y="327" class="val" text-anchor="middle">5000</text>
  <text x="350" y="327" class="val" text-anchor="middle">꽝</text>
  <text x="470" y="327" class="val" text-anchor="middle">3000</text>
  <text x="30" y="370" class="foot">괄호 안 숫자는 왼쪽부터 0으로 센 참여자 자리입니다. 회색은 사다리의 가로 라인, 초록은 pobi가 지나간 길입니다.</text>
</svg>
