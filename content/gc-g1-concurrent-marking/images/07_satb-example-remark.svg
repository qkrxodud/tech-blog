  <text x="639" y="386" class="mono" text-anchor="middle">1</text>
  <rect x="648" y="370" width="18" height="22" class="box" stroke-width="1"/>
  <text x="657" y="386" class="mono" text-anchor="middle">0</text>
  <rect x="666" y="370" width="18" height="22" class="box" stroke-width="1"/>
  <text x="675" y="386" class="mono" text-anchor="middle">0</text>
  <rect x="684" y="370" width="18" height="22" class="hold" stroke-width="1"/>
