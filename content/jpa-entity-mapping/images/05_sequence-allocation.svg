<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>allocationSize를 50으로 두면 memberA를 persist할 때 시퀀스 값을 조회해 1부터 50까지를 애플리케이션이 가지고 있다가, memberB·C·D는 DB 호출 없이 메모리의 값으로 PK를 부여받고, commit 시점에 INSERT를 한 번에 실행하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .m { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="372" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="352" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">SEQUENCE 최적화 — 시퀀스 값을 미리 받아 두고 메모리에서 쓴다</text>
  <text x="730" y="42" class="code" text-anchor="end">allocationSize = 50</text>
  <text x="208" y="68" class="step" text-anchor="middle">persist(A)</text>
  <text x="325" y="68" class="step" text-anchor="middle">persist(B)</text>
  <text x="442" y="68" class="step" text-anchor="middle">persist(C)</text>
  <text x="559" y="68" class="step" text-anchor="middle">persist(D)</text>
  <text x="676" y="68" class="step" text-anchor="middle">commit()</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">코드</text>
  <text x="30" y="126" class="sub">JpaMain</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="156" y="88" width="104" height="48" rx="8" class="box"/>
  <text x="208" y="108" class="m" text-anchor="middle">persist</text>
  <text x="208" y="127" class="val" text-anchor="middle">memberA</text>
  <rect x="273" y="88" width="104" height="48" rx="8" class="box"/>
  <text x="325" y="108" class="m" text-anchor="middle">persist</text>
  <text x="325" y="127" class="val" text-anchor="middle">memberB</text>
  <rect x="390" y="88" width="104" height="48" rx="8" class="box"/>
  <text x="442" y="108" class="m" text-anchor="middle">persist</text>
  <text x="442" y="127" class="val" text-anchor="middle">memberC</text>
  <rect x="507" y="88" width="104" height="48" rx="8" class="box"/>
  <text x="559" y="108" class="m" text-anchor="middle">persist</text>
  <text x="559" y="127" class="val" text-anchor="middle">memberD</text>
  <rect x="624" y="88" width="104" height="48" rx="8" class="hold"/>
  <text x="676" y="108" class="m" text-anchor="middle">commit()</text>
  <text x="676" y="127" class="val" text-anchor="middle">트랜잭션 커밋</text>
  <text x="30" y="168" class="lane">애플리케이션</text>
  <text x="30" y="186" class="sub">가지고 있는 값</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="156" y="148" width="104" height="48" rx="8" class="hold"/>
  <text x="208" y="168" class="t" text-anchor="middle">1~50 확보</text>
  <text x="208" y="187" class="val" text-anchor="middle">A의 PK = 1</text>
  <rect x="273" y="148" width="104" height="48" rx="8" class="ok"/>
  <text x="325" y="168" class="okt" text-anchor="middle">B의 PK = 2</text>
  <text x="325" y="187" class="val" text-anchor="middle">메모리 값 사용</text>
  <rect x="390" y="148" width="104" height="48" rx="8" class="ok"/>
  <text x="442" y="168" class="okt" text-anchor="middle">C의 PK = 3</text>
  <text x="442" y="187" class="val" text-anchor="middle">메모리 값 사용</text>
  <rect x="507" y="148" width="104" height="48" rx="8" class="ok"/>
  <text x="559" y="168" class="okt" text-anchor="middle">D의 PK = 4</text>
  <text x="559" y="187" class="val" text-anchor="middle">메모리 값 사용</text>
  <text x="30" y="228" class="lane">DB 시퀀스</text>
  <text x="30" y="246" class="sub">MEMBER_SEQ</text>
  <rect x="150" y="206" width="585" height="52" rx="6" class="track"/>
  <rect x="156" y="208" width="104" height="48" rx="8" class="dbbox"/>
  <text x="208" y="228" class="t" text-anchor="middle">시퀀스 조회</text>
  <text x="208" y="247" class="val" text-anchor="middle">PK 값을 가져옴</text>
  <rect x="273" y="218" width="338" height="32" rx="6" class="wait"/>
  <text x="442" y="239" class="waitt" text-anchor="middle">DB에 접속하지 않음</text>
  <text x="30" y="288" class="lane">DB</text>
  <text x="30" y="306" class="sub">MEMBER 테이블</text>
  <rect x="150" y="266" width="585" height="52" rx="6" class="track"/>
  <rect x="624" y="268" width="104" height="48" rx="8" class="ok"/>
  <text x="676" y="288" class="okc" text-anchor="middle">INSERT</text>
  <text x="676" y="307" class="val" text-anchor="middle">한 번에 실행</text>
  <line x1="208" y1="208" x2="208" y2="198" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="676" y1="136" x2="676" y2="266" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="30" y="346" class="foot">allocationSize만큼 PK 값을 미리 가지고 있어서, persist할 때마다 DB에서 값을 받아 오지 않는다</text>
</svg>
