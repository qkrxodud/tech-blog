  <rect x="422" y="62" width="324" height="124" rx="12" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <text x="438" y="86" class="t2"><tspan class="m">RoundRobinPartitioner</tspan>를 쓴 곳</text>
  <text x="438" y="110" class="s2" style="fill:#1f2937">키 없는 구현의 시험만 — 출발 구조 · 바로 보냄</text><text x="438" y="129" class="s2" style="fill:#1f2937">· 커밋 뒤 보냄 · 키 없이(남겨 두고 릴레이)</text><text x="438" y="148" class="s2" style="fill:#1f2937">키를 쓰는 운영(결정 4부터)의 시험에는 안 씀</text><text x="438" y="167" class="s2" style="fill:#1f2937">뒤의 측정은 키 없는 방식도 기본 파티셔너</text>
