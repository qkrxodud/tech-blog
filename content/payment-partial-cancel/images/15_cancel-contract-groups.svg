<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 516" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>5장 테스트 37개 — 취소 계약 CancelContract 24개(취소와 상태 5개: 승인·매입 결제의 전액 취소, 카드사에도 취소로 남음, 부분 취소 뒤 승인 그대로, 0원이 되면 승인 취소. 남은 금액 3개: 두 번 부분 취소 뒤 카드사 잔액과 같음, 큰 취소는 받지 않고 보내지 않음. 받지 않는 취소 7개: 승인 전·승인 거절·승인 결과 모름 세 경우로 도는 파라미터 테스트 2개와 이미 전액 취소된 결제. 같은 요청 4개. 답을 못 받은 취소 3개. 시간 초과 뒤 재요청 2개)와 결제 취소 API 테스트 13개. 5 + 3 + 7 + 4 + 3 + 2 = 24, 24 + 13 = 37. 시험 조건은 결제 15000원, 부분 취소 5000원, PG 읽기 시간 제한을 1초로 줄이고 늦은 취소는 1.5초 뒤 답함, 보정 시각은 보정 대기 시간 10초가 지난 때, 결과 기록 실패는 MySQL 트리거, 매입된 결제는 상태를 CAPTURED로 바꿔 시작</title>
  <style>
