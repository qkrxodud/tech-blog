<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>포인트를 돌려줄 때 — PointRepositoryAdapter.restore는 point_history에 RESTORE 이력을 insert ignore로 먼저 남기고, 이력이 들어간 때만 point_wallet 잔액을 늘림. point_history에는 (payment_id, type) unique 키가 있어 결제 하나에 RESTORE는 한 줄만 올라감. 곳마다 따로 되돌리는 비교에서 거절 하나를 세 기록이 닫으면 먼저 닫은 기록은 이력 1줄이 들어가 잔액이 2000원에서 3000원이 되고, 나중 두 기록은 0줄이라 그대로 3000원. 재고에는 이력이 없어 세 기록이 저마다 2개씩 돌려줘 재고가 9(처음 5)가 됨</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 13px; font-weight: 700; fill: #1f2937; }
