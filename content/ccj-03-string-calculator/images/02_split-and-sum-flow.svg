<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>splitAndSum이 1,2:3과 커스텀 구분자 입력은 나눠서 6을 반환하고, 음수가 있으면 RuntimeException을 던지며, null이나 빈 문자열이면 바로 0을 반환하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="376" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="356" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">splitAndSum() — 입력값 확인, 분리, 변환·검증, 합계</text>
  <text x="220" y="68" class="step" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">isNotValidValue()</tspan></text>
  <text x="360" y="68" class="step" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">splitString()</tspan></text>
  <text x="500" y="68" class="step" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">convertToNumberArray()</tspan></text>
  <text x="640" y="68" class="step" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">sumIntArr()</tspan></text>
  <line x1="160" y1="76" x2="722" y2="76" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">기본 구분자</text>
  <text x="30" y="126" class="sub"><tspan font-family="Menlo, Consolas, monospace">"1,2:3"</tspan></text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="108" class="op" text-anchor="middle">false</text>
  <text x="220" y="127" class="val" text-anchor="middle">값이 있음</text>
  <line x1="281" y1="112" x2="299" y2="112" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="302" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="360" y="108" class="op" text-anchor="middle">split(",|:")</text>
  <text x="360" y="127" class="val" text-anchor="middle">[1, 2, 3]</text>
  <line x1="421" y1="112" x2="439" y2="112" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="442" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="500" y="108" class="op" text-anchor="middle">parseInt</text>
  <text x="500" y="127" class="val" text-anchor="middle">음수 없음</text>
  <line x1="561" y1="112" x2="579" y2="112" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="582" y="88" width="116" height="48" rx="8" class="ok"/>
  <text x="640" y="108" class="okc" text-anchor="middle">6</text>
  <text x="640" y="127" class="val" text-anchor="middle">sum()</text>
  <text x="30" y="168" class="lane">커스텀 구분자</text>
  <text x="30" y="186" class="sub"><tspan font-family="Menlo, Consolas, monospace">"//;\n1;2;3"</tspan></text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="148" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="168" class="op" text-anchor="middle">false</text>
  <text x="220" y="187" class="val" text-anchor="middle">값이 있음</text>
  <line x1="281" y1="172" x2="299" y2="172" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="302" y="148" width="116" height="48" rx="8" class="box"/>
  <text x="360" y="168" class="op" text-anchor="middle">split(";")</text>
  <text x="360" y="187" class="val" text-anchor="middle">1;2;3을 나눔</text>
  <line x1="421" y1="172" x2="439" y2="172" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="442" y="148" width="116" height="48" rx="8" class="box"/>
  <text x="500" y="168" class="op" text-anchor="middle">parseInt</text>
  <text x="500" y="187" class="val" text-anchor="middle">음수 없음</text>
  <line x1="561" y1="172" x2="579" y2="172" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="582" y="148" width="116" height="48" rx="8" class="ok"/>
  <text x="640" y="168" class="okc" text-anchor="middle">6</text>
  <text x="640" y="187" class="val" text-anchor="middle">sum()</text>
  <text x="30" y="228" class="lane">음수</text>
  <text x="30" y="246" class="sub"><tspan font-family="Menlo, Consolas, monospace">"-1,2"</tspan></text>
  <rect x="150" y="206" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="208" width="116" height="48" rx="8" class="box"/>
  <text x="220" y="228" class="op" text-anchor="middle">false</text>
  <text x="220" y="247" class="val" text-anchor="middle">값이 있음</text>
  <line x1="281" y1="232" x2="299" y2="232" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="302" y="208" width="116" height="48" rx="8" class="box"/>
  <text x="360" y="228" class="op" text-anchor="middle">split(",|:")</text>
  <text x="360" y="247" class="val" text-anchor="middle">[-1, 2]</text>
  <text x="30" y="288" class="lane">빈 값</text>
  <text x="30" y="306" class="sub"><tspan font-family="Menlo, Consolas, monospace">null</tspan> 또는 <tspan font-family="Menlo, Consolas, monospace">""</tspan></text>
  <rect x="150" y="266" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="268" width="116" height="48" rx="8" class="hold"/>
  <text x="220" y="288" class="op" text-anchor="middle">true</text>
  <text x="220" y="307" class="val" text-anchor="middle">바로 반환</text>
  <line x1="421" y1="232" x2="439" y2="232" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="442" y="208" width="256" height="48" rx="8" class="bad"/>
  <text x="570" y="228" class="badc" text-anchor="middle">RuntimeException</text>
  <text x="570" y="247" class="val" text-anchor="middle">-1 &lt; 0이라 예외 발생</text>
  <rect x="290" y="276" width="282" height="32" rx="6" class="wait"/>
  <text x="431" y="297" class="waitt" text-anchor="middle">분리·변환 단계를 건너뜀</text>
  <rect x="582" y="268" width="116" height="48" rx="8" class="ok"/>
  <text x="640" y="288" class="okc" text-anchor="middle">0</text>
  <text x="640" y="307" class="val" text-anchor="middle">ZERO</text>
  <line x1="281" y1="292" x2="286" y2="292" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="574" y1="292" x2="579" y2="292" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="150" y="348" class="sub">커스텀 구분자 패턴의 group(1)은 //와 \n 사이의 문자, group(2)는 나눌 문자열입니다.</text>
</svg>
