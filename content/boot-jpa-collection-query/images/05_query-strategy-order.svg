<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>엔티티 조회 방식으로 먼저 접근해 페치 조인으로 쿼리 수를 줄이고, 컬렉션은 페이징이 필요하면 default_batch_fetch_size와 @BatchSize, 필요 없으면 페치 조인을 쓰며, 해결이 안 되면 DTO 조회 방식, 그래도 안 되면 Native SQL이나 스프링 JdbcTemplate을 쓰는 순서</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="380" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h" text-anchor="start">쿼리 방식 선택 — 권장 순서</text>
  <rect x="30" y="62" width="300" height="50" rx="8" class="ok"/>
  <text x="180.0" y="82" class="okt" text-anchor="middle">1. 엔티티 조회 방식으로 우선 접근</text>
  <text x="180.0" y="101" class="val" text-anchor="middle">옵션만 바꿔 다양한 최적화를 시도</text>
  <rect x="30" y="132" width="300" height="44" rx="8" class="box"/>
  <text x="180.0" y="159.0" class="t" text-anchor="middle">페치 조인으로 쿼리 수 최적화</text>
  <line x1="180" y1="112" x2="180" y2="128" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="180" y1="176" x2="180" y2="192" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="30" y="196" width="300" height="44" rx="8" class="box"/>
  <text x="180.0" y="223.0" class="t" text-anchor="middle">컬렉션 최적화 — 페이징이 필요한가?</text>
  <line x1="130" y1="240" x2="130" y2="262" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="285" y1="240" x2="285" y2="262" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="122" y="256" class="sub" text-anchor="end">필요</text>
  <text x="293" y="256" class="sub" text-anchor="start">필요 없음</text>
  <rect x="30" y="266" width="200" height="64" rx="8" class="box"/>
  <text x="130.0" y="286" class="m" text-anchor="middle">default_batch_fetch_size</text>
  <text x="130.0" y="305" class="m" text-anchor="middle">@BatchSize</text>
  <rect x="240" y="266" width="90" height="64" rx="8" class="box"/>
  <text x="285.0" y="303.0" class="t" text-anchor="middle">페치 조인</text>
  <text x="30" y="356" class="sub" text-anchor="start">컬렉션은 페치 조인하면 페이징이 불가능</text>
  <line x1="334" y1="87" x2="396" y2="87" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="365" y="78" class="sub" text-anchor="middle">해결 안 되면</text>
  <rect x="400" y="62" width="330" height="50" rx="8" class="box"/>
  <text x="565.0" y="82" class="t" text-anchor="middle">2. DTO 조회 방식</text>
  <text x="565.0" y="101" class="val" text-anchor="middle">최적화 방식을 바꿀 때 코드 변경이 많음</text>
  <line x1="565" y1="112" x2="565" y2="158" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="575" y="140" class="sub" text-anchor="start">해결 안 되면</text>
  <rect x="400" y="162" width="330" height="50" rx="8" class="box"/>
  <text x="565.0" y="182" class="t" text-anchor="middle">3. Native SQL, 스프링 JdbcTemplate</text>
  <text x="565.0" y="201" class="val" text-anchor="middle">SQL을 직접 사용</text>
  <text x="400" y="250" class="val" text-anchor="start">성능 최적화와 코드 복잡도 사이에서</text>
  <text x="400" y="270" class="val" text-anchor="start">엔티티 조회 방식은 단순한 코드를 유지하며 최적화</text>
</svg>
