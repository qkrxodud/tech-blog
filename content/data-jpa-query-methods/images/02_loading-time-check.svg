<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>애플리케이션 로딩 시점에 메소드 이름 쿼리와 @Query의 JPQL을 미리 분석해서, 정상이면 시작이 완료되고 엔티티 필드명이 바뀌었거나 JPQL 문법이 틀렸으면 애플리케이션이 시작되지 않는다는 그림</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 12.5px; fill: #374151; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="310" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">쿼리 검사 — 메서드 호출 전, 애플리케이션 로딩 시점에</text>
  <text x="250" y="72" class="step" text-anchor="middle">애플리케이션 로딩</text>
  <text x="450" y="72" class="step" text-anchor="middle">쿼리 분석</text>
  <text x="640" y="72" class="step" text-anchor="middle">결과</text>
  <line x1="160" y1="80" x2="722" y2="80" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="112" class="lane">메소드 이름</text>
  <text x="30" y="130" class="sub">정상</text>
  <rect x="150" y="90" width="585" height="56" rx="6" class="track"/>
  <rect x="175" y="94" width="150" height="48" rx="8" class="box"/>
  <text x="250" y="123" class="t" text-anchor="middle">리포지토리 생성</text>
  <line x1="327" y1="118" x2="370" y2="118" class="axis" marker-end="url(#ar)"/>
  <rect x="375" y="94" width="150" height="48" rx="8" class="hold"/>
  <text x="450" y="123" class="t" text-anchor="middle">메소드 이름 분석</text>
  <line x1="527" y1="118" x2="560" y2="118" class="axis" marker-end="url(#ar)"/>
  <rect x="565" y="94" width="150" height="48" rx="8" class="ok"/>
  <text x="640" y="123" class="okt" text-anchor="middle">시작 완료</text>
  <text x="30" y="178" class="lane">메소드 이름</text>
  <text x="30" y="196" class="sub">필드명만 변경</text>
  <rect x="150" y="156" width="585" height="56" rx="6" class="track"/>
  <rect x="175" y="160" width="150" height="48" rx="8" class="box"/>
  <text x="250" y="189" class="t" text-anchor="middle">리포지토리 생성</text>
  <line x1="327" y1="184" x2="370" y2="184" class="axis" marker-end="url(#ar)"/>
  <rect x="375" y="160" width="150" height="48" rx="8" class="bad"/>
  <text x="450" y="189" class="t" text-anchor="middle">필드와 이름 불일치</text>
  <line x1="527" y1="184" x2="560" y2="184" class="axis" marker-end="url(#ar)"/>
  <rect x="565" y="160" width="150" height="48" rx="8" class="bad"/>
  <text x="640" y="189" class="badt" text-anchor="middle">시작 실패</text>
  <text x="30" y="244" class="lane">@Query</text>
  <text x="30" y="262" class="sub">JPQL 문법 오류</text>
  <rect x="150" y="222" width="585" height="56" rx="6" class="track"/>
  <rect x="175" y="226" width="150" height="48" rx="8" class="box"/>
  <text x="250" y="255" class="t" text-anchor="middle">리포지토리 생성</text>
  <line x1="327" y1="250" x2="370" y2="250" class="axis" marker-end="url(#ar)"/>
  <rect x="375" y="226" width="150" height="48" rx="8" class="bad"/>
  <text x="450" y="255" class="t" text-anchor="middle">JPQL 파싱 실패</text>
  <line x1="527" y1="250" x2="560" y2="250" class="axis" marker-end="url(#ar)"/>
  <rect x="565" y="226" width="150" height="48" rx="8" class="bad"/>
  <text x="640" y="255" class="badt" text-anchor="middle">시작 실패</text>
  <text x="30" y="304" class="sub">잘못된 쿼리는 요청이 들어와 메서드를 호출할 때가 아니라 애플리케이션을 띄울 때 오류로 드러납니다.</text>
</svg>
