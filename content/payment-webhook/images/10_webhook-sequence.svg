<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>6장 완성 코드의 웹훅 — Mock PG가 POST /api/v1/webhooks/tosspayments로 eventType, createdAt, data를 보내면 결제 서버는 PAYMENT_STATUS_CHANGED이고 주문번호가 있는지 보고 payment_webhook에 RECEIVED로 남긴 뒤 본문 없는 200으로 답한다. 처리기는 앞 처리가 끝나고 1초 뒤마다 RECEIVED 알림을 id 순으로 100건까지 읽어 주문마다 묶고, 주문의 결제를 조회해 없으면 IGNORED로 닫고, 있으면 Mock PG에 GET /v1/payments/orders/{orderId}로 조회해 200 Payment(status, cancels)를 받아 한 트랜잭션에서 Payment.follow와 알림 PROCESSED를 함께 반영한다. 조회에 답이 없거나 오류면 RECEIVED 그대로 failed_lookups를 하나 늘리고, 다른 eventType이나 주문번호 없는 알림은 남기지 않고 200, 읽을 수 없는 본문은 400 INVALID_INPUT, 404 NOT_FOUND_PAYMENT는 NOT_FOUND로 읽어 결제를 그대로 둔다</title>
  <style>
