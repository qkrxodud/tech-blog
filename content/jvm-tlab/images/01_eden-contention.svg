<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 488" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>TLAB 없이 두 스레드가 Eden의 할당 포인터 하나를 함께 쓸 때, 동기화가 없으면 같은 주소를 받아 객체가 겹치고, 락으로 동기화하면 겹치지 않지만 한 스레드가 기다려야 하는 모습</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
    .monob { font-family: Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; fill: #15803d; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .opm { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .grid { stroke: #eceef1; stroke-width: 1; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="488" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="226" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">TLAB 없이 동기화도 없다면 — 두 스레드가 같은 주소를 받음</text>
  <text x="730" y="42" class="code" text-anchor="end">Eden top = 100</text>
  <text x="220" y="68" class="step" text-anchor="middle">1단계</text>
  <text x="360" y="68" class="step" text-anchor="middle">2단계</text>
  <text x="500" y="68" class="step" text-anchor="middle">3단계</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="108" class="lane">Thread A</text>
  <text x="30" y="126" class="sub">객체 16B 할당</text>
  <rect x="150" y="86" width="585" height="52" rx="6" class="track"/>
  <rect x="162.0" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="220.0" y="108.0" class="op" text-anchor="middle">top 읽음</text>
  <text x="220.0" y="127.0" class="val" text-anchor="middle">100</text>
  <rect x="302.0" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="360.0" y="108.0" class="op" text-anchor="middle">객체 배치</text>
  <text x="360.0" y="127.0" class="val" text-anchor="middle">주소 100</text>
  <rect x="442.0" y="88" width="116" height="48" rx="8" class="box"/>
  <text x="500.0" y="108.0" class="op" text-anchor="middle">top = 116</text>
  <text x="500.0" y="127.0" class="val" text-anchor="middle">16B 더함</text>
  <text x="30" y="168" class="lane">Thread B</text>
  <text x="30" y="186" class="sub">객체 16B 할당</text>
  <rect x="150" y="146" width="585" height="52" rx="6" class="track"/>
  <rect x="162.0" y="148" width="116" height="48" rx="8" class="box"/>
  <text x="220.0" y="168.0" class="op" text-anchor="middle">top 읽음</text>
  <text x="220.0" y="187.0" class="val" text-anchor="middle">100</text>
  <rect x="302.0" y="148" width="116" height="48" rx="8" class="bad"/>
  <text x="360.0" y="168.0" class="badt" text-anchor="middle">객체 배치</text>
  <text x="360.0" y="187.0" class="val" text-anchor="middle">주소 100 (겹침)</text>
  <rect x="442.0" y="148" width="116" height="48" rx="8" class="bad"/>
  <text x="500.0" y="168.0" class="badt" text-anchor="middle">top = 116</text>
  <text x="500.0" y="187.0" class="val" text-anchor="middle">A의 결과를 덮어씀</text>
  <text x="150" y="222" class="note">두 스레드가 같은 위치 100을 읽고 그 자리에 각자 객체를 놓아, 객체가 겹칩니다</text>
  <rect x="10" y="252" width="740" height="226" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="284" class="h">락(또는 CAS)으로 동기화 — 한 번에 한 스레드만 top을 옮김</text>
  <text x="220" y="310" class="step" text-anchor="middle">1단계</text>
  <text x="360" y="310" class="step" text-anchor="middle">2단계</text>
  <text x="500" y="310" class="step" text-anchor="middle">3단계</text>
  <line x1="160" y1="318" x2="722" y2="318" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="350" class="lane">Thread A</text>
  <text x="30" y="368" class="sub">객체 16B 할당</text>
  <rect x="150" y="328" width="585" height="52" rx="6" class="track"/>
  <rect x="162.0" y="330" width="116" height="48" rx="8" class="hold"/>
  <text x="220.0" y="350.0" class="op" text-anchor="middle">락 획득</text>
  <text x="220.0" y="369.0" class="val" text-anchor="middle">top = 100</text>
  <rect x="302.0" y="330" width="116" height="48" rx="8" class="ok"/>
  <text x="360.0" y="350.0" class="okt" text-anchor="middle">주소 100</text>
  <text x="360.0" y="369.0" class="val" text-anchor="middle">top = 116</text>
  <rect x="442.0" y="330" width="116" height="48" rx="8" class="box"/>
  <text x="500.0" y="359.0" class="op" text-anchor="middle">락 해제</text>
  <text x="30" y="410" class="lane">Thread B</text>
  <text x="30" y="428" class="sub">객체 16B 할당</text>
  <rect x="150" y="388" width="585" height="52" rx="6" class="track"/>
  <rect x="162" y="398" width="256" height="32" rx="6" class="wait"/>
  <text x="290" y="419" class="waitt" text-anchor="middle">대기 (A가 락을 놓을 때까지)</text>
  <rect x="442.0" y="390" width="116" height="48" rx="8" class="ok"/>
  <text x="500.0" y="410.0" class="okt" text-anchor="middle">주소 116</text>
  <text x="500.0" y="429.0" class="val" text-anchor="middle">top = 132</text>
  <line x1="500" y1="378" x2="500" y2="390" class="gl" marker-end="url(#agr)"/>
  <text x="150" y="464" class="note">객체는 겹치지 않지만, 할당할 때마다 동기화 비용이 들고 다른 스레드는 기다려야 합니다</text>
</svg>
