<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>@ComponentScan이 @Component가 붙은 클래스를 찾아 클래스명의 맨 앞글자만 소문자로 바꾼 이름으로 빈을 등록하고, @Component("memberService2")처럼 이름을 지정하면 그 이름으로 등록하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .okms { font-size: 12px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .chip { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .gscope { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .dim { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dimt { font-size: 12.5px; fill: #9ca3af; font-family: Menlo, Consolas, monospace; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .tag { font-size: 11.5px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="400" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">컴포넌트 스캔 — @Component가 붙은 클래스를 빈으로 등록</text>
  <text x="155" y="74" class="sub" text-anchor="middle">@Component가 붙은 클래스</text>
  <text x="375" y="74" class="sub" text-anchor="middle">@ComponentScan</text>
  <text x="605" y="74" class="sub" text-anchor="middle">스프링 컨테이너에 등록된 빈 이름</text>
  <rect x="30" y="88" width="250" height="40" rx="8" class="box"/>
  <text x="155" y="113" class="mb" text-anchor="middle">MemoryMemberRepository</text>
  <line x1="284" y1="108" x2="476" y2="108" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="480" y="88" width="250" height="40" rx="8" class="ok"/>
  <text x="605" y="113" class="okm" text-anchor="middle">memoryMemberRepository</text>
  <rect x="30" y="138" width="250" height="40" rx="8" class="box"/>
  <text x="155" y="163" class="mb" text-anchor="middle">RateDiscountPolicy</text>
  <line x1="284" y1="158" x2="476" y2="158" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="480" y="138" width="250" height="40" rx="8" class="ok"/>
  <text x="605" y="163" class="okm" text-anchor="middle">rateDiscountPolicy</text>
  <rect x="30" y="188" width="250" height="40" rx="8" class="box"/>
  <text x="155" y="213" class="mb" text-anchor="middle">MemberServiceImpl</text>
  <line x1="284" y1="208" x2="476" y2="208" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="480" y="188" width="250" height="40" rx="8" class="ok"/>
  <text x="605" y="213" class="okm" text-anchor="middle">memberServiceImpl</text>
  <rect x="30" y="238" width="250" height="40" rx="8" class="box"/>
  <text x="155" y="263" class="mb" text-anchor="middle">OrderServiceImpl</text>
  <line x1="284" y1="258" x2="476" y2="258" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="480" y="238" width="250" height="40" rx="8" class="ok"/>
  <text x="605" y="263" class="okm" text-anchor="middle">orderServiceImpl</text>
  <text x="380" y="104" class="sub" text-anchor="middle">맨 앞글자만 소문자로</text>
  <line x1="30" y1="296" x2="730" y2="296" stroke="#e5e7eb" stroke-width="1.2"/>
  <rect x="30" y="310" width="250" height="56" rx="8" class="box"/>
  <text x="155" y="333" class="mb" text-anchor="middle">@Component("memberService2")</text>
  <text x="155" y="353" class="m" text-anchor="middle">MemberServiceImpl</text>
  <line x1="284" y1="338" x2="476" y2="338" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="380" y="328" class="sub" text-anchor="middle">직접 지정한 이름</text>
  <rect x="480" y="318" width="250" height="40" rx="8" class="ok"/>
  <text x="605" y="343" class="okm" text-anchor="middle">memberService2</text>
  <text x="30" y="392" class="foot">이름을 지정하지 않으면 클래스명에서 정해지고, 직접 지정하면 그 이름으로 등록됩니다.</text>
</svg>
