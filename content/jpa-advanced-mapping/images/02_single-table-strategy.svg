<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>단일 테이블 전략에서 ITEM 테이블 하나에 공통 컬럼과 앨범·영화·책 전용 컬럼, DTYPE을 모두 두고, 각 행은 자기 타입이 아닌 전용 컬럼이 null로 남는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12.5px; fill: #374151; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .thead { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .cell { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 13px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 12.5px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .badm { font-size: 12.5px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="agb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="310" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="290" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">단일 테이블 전략 — 한 테이블에 모두 넣는다</text>
  <text x="730" y="42" class="code" text-anchor="end">InheritanceType.SINGLE_TABLE</text>
  <text x="30" y="74" class="mb">ITEM</text>
  <rect x="30" y="82" width="70" height="26" class="thead"/>
  <text x="65.0" y="99.5" class="m" text-anchor="middle">ID</text>
  <rect x="100" y="82" width="120" height="26" class="thead"/>
  <text x="160.0" y="99.5" class="s" text-anchor="middle">공통 컬럼</text>
  <rect x="220" y="82" width="120" height="26" class="thead"/>
  <text x="280.0" y="99.5" class="s" text-anchor="middle">앨범 컬럼</text>
  <rect x="340" y="82" width="120" height="26" class="thead"/>
  <text x="400.0" y="99.5" class="s" text-anchor="middle">영화 컬럼</text>
  <rect x="460" y="82" width="120" height="26" class="thead"/>
  <text x="520.0" y="99.5" class="s" text-anchor="middle">책 컬럼</text>
  <rect x="580" y="82" width="150" height="26" class="thead"/>
  <text x="655.0" y="99.5" class="m" text-anchor="middle">DTYPE</text>
  <rect x="30" y="108" width="70" height="26" class="cell"/>
  <text x="65.0" y="125.5" class="m" text-anchor="middle">1</text>
  <rect x="100" y="108" width="120" height="26" class="cell"/>
  <text x="160.0" y="125.5" class="s" text-anchor="middle">값</text>
  <rect x="220" y="108" width="120" height="26" class="cell"/>
  <text x="280.0" y="125.5" class="s" text-anchor="middle">값</text>
  <rect x="340" y="108" width="120" height="26" class="bad"/>
  <text x="400.0" y="125.5" class="badm" text-anchor="middle">null</text>
  <rect x="460" y="108" width="120" height="26" class="bad"/>
  <text x="520.0" y="125.5" class="badm" text-anchor="middle">null</text>
  <rect x="580" y="108" width="150" height="26" class="ok"/>
  <text x="655.0" y="125.5" class="okm" text-anchor="middle">Album</text>
  <rect x="30" y="134" width="70" height="26" class="cell"/>
  <text x="65.0" y="151.5" class="m" text-anchor="middle">2</text>
  <rect x="100" y="134" width="120" height="26" class="cell"/>
  <text x="160.0" y="151.5" class="s" text-anchor="middle">값</text>
  <rect x="220" y="134" width="120" height="26" class="bad"/>
  <text x="280.0" y="151.5" class="badm" text-anchor="middle">null</text>
  <rect x="340" y="134" width="120" height="26" class="cell"/>
  <text x="400.0" y="151.5" class="s" text-anchor="middle">값</text>
  <rect x="460" y="134" width="120" height="26" class="bad"/>
  <text x="520.0" y="151.5" class="badm" text-anchor="middle">null</text>
  <rect x="580" y="134" width="150" height="26" class="ok"/>
  <text x="655.0" y="151.5" class="okm" text-anchor="middle">Movie</text>
  <rect x="30" y="160" width="70" height="26" class="cell"/>
  <text x="65.0" y="177.5" class="m" text-anchor="middle">3</text>
  <rect x="100" y="160" width="120" height="26" class="cell"/>
  <text x="160.0" y="177.5" class="s" text-anchor="middle">값</text>
  <rect x="220" y="160" width="120" height="26" class="bad"/>
  <text x="280.0" y="177.5" class="badm" text-anchor="middle">null</text>
  <rect x="340" y="160" width="120" height="26" class="bad"/>
  <text x="400.0" y="177.5" class="badm" text-anchor="middle">null</text>
  <rect x="460" y="160" width="120" height="26" class="cell"/>
  <text x="520.0" y="177.5" class="s" text-anchor="middle">값</text>
  <rect x="580" y="160" width="150" height="26" class="ok"/>
  <text x="655.0" y="177.5" class="okm" text-anchor="middle">Book</text>
  <text x="30" y="222" class="note">자식 엔티티가 매핑한 컬럼은 자기 타입이 아닌 행에서 null이 되므로, 모두 null을 허용해야 합니다.</text>
  <text x="30" y="244" class="gnote">DTYPE은 @DiscriminatorColumn이 없어도 생성됩니다. 어떤 타입인지 구분할 방법이 반드시 필요하기 때문입니다.</text>
  <text x="30" y="280" class="foot">조인 없이 한 테이블만 조회하므로 조회 쿼리가 단순합니다.</text>
</svg>
