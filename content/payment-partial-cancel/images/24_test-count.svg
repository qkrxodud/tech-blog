  <rect width="760" height="450" fill="#ffffff"/>
  <text x="24" y="30" class="h">5장 테스트 — 기본 460개 통과, 계약을 못 지키는 비교는 따로</text>
  <text x="24" y="52" class="gs"><tspan class="m">./gradlew clean check</tspan> · 라인 커버리지 99.3%(567줄 중 563줄, 시작 클래스 제외)</text>
