<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>애플리케이션 시작 시 DB와 연결된 커넥션을 풀에 미리 만들어 두고, 요청이 오면 풀에서 커넥션을 받아 SQL을 전달하고 결과를 처리한 뒤 연결된 상태 그대로 반환하는 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .pool { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .life { stroke: #c4c8ce; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="372" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="160" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">애플리케이션 시작 — 커넥션을 미리 만들어 둔다</text>
  <text x="30" y="92" class="lane">시작 시</text>
  <text x="30" y="110" class="sub">미리 생성</text>
  <rect x="150" y="60" width="360" height="98" rx="10" class="pool"/>
  <text x="330" y="82" class="t" text-anchor="middle">커넥션 풀</text>
  <rect x="166" y="98" width="76" height="40" rx="6" class="ok"/>
  <text x="204" y="123" class="okt" text-anchor="middle">커넥션</text>
  <rect x="250" y="98" width="76" height="40" rx="6" class="ok"/>
  <text x="288" y="123" class="okt" text-anchor="middle">커넥션</text>
  <rect x="334" y="98" width="76" height="40" rx="6" class="ok"/>
  <text x="372" y="123" class="okt" text-anchor="middle">커넥션</text>
  <rect x="418" y="98" width="76" height="40" rx="6" class="ok"/>
  <text x="456" y="123" class="okt" text-anchor="middle">커넥션</text>
  <rect x="610" y="60" width="120" height="98" rx="10" class="dbbox"/>
  <text x="670" y="114" class="db" text-anchor="middle">DB</text>
  <line x1="512" y1="118" x2="608" y2="118" stroke="#16a34a" stroke-width="1.6"/>
  <text x="560" y="108" class="gnote" text-anchor="middle">연결된 상태</text>
  <rect x="10" y="186" width="740" height="176" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="218" class="h">요청 처리 — 빌려서 쓰고, 연결된 채로 반환한다</text>
  <rect x="30" y="240" width="160" height="60" rx="10" class="box"/>
  <text x="110" y="265" class="t" text-anchor="middle">커넥션 획득</text>
  <text x="110" y="285" class="s" text-anchor="middle">풀에서 꺼냄</text>
  <line x1="192" y1="270" x2="207" y2="270" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="210" y="240" width="160" height="60" rx="10" class="box"/>
  <text x="290" y="265" class="t" text-anchor="middle">SQL 전달</text>
  <text x="290" y="285" class="s" text-anchor="middle">받은 커넥션 사용</text>
  <line x1="372" y1="270" x2="387" y2="270" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="390" y="240" width="160" height="60" rx="10" class="box"/>
  <text x="470" y="265" class="t" text-anchor="middle">결과 처리</text>
  <text x="470" y="285" class="s" text-anchor="middle">애플리케이션 로직</text>
  <line x1="552" y1="270" x2="567" y2="270" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="570" y="240" width="160" height="60" rx="10" class="ok"/>
  <text x="650" y="265" class="okt" text-anchor="middle">커넥션 반환</text>
  <text x="650" y="285" class="s" text-anchor="middle">연결된 상태 그대로</text>
  <text x="30" y="334" class="foot">사용이 끝난 커넥션은 종료하지 않고 풀에 돌려놓기 때문에, 새로 연결을 맺을 필요가 없습니다.</text>
</svg>
