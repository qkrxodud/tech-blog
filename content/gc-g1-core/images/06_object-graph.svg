<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>GC root와 remembered set에서 출발한 보통의 young GC는 young 객체 1, 4, 6, 7, 8, 9, 10, 12만 탐색하고, old 객체 2, 3, 5, 11에서 탐색을 멈춘다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
    .monob { font-family: Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #1f2937; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .lbl { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .rE { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .rS { fill: #ffffff; stroke: #16a34a; stroke-width: 1.8; }
    .rO { fill: #e5e7eb; stroke: #6b7280; stroke-width: 1.5; }
    .rH { fill: #9ca3af; stroke: #4b5563; stroke-width: 1.5; }
    .rF { fill: #ffffff; stroke: #c4c8ce; stroke-width: 1.2; }
    .rR { fill: #fafafa; stroke: #c4c8ce; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .tE { font-size: 13px; font-weight: 700; fill: #15803d; }
    .tS { font-size: 13px; font-weight: 700; fill: #15803d; }
    .tO { font-size: 13px; font-weight: 700; fill: #374151; }
    .tH { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .tF { font-size: 11px; fill: #9ca3af; }
    .gl { stroke: #16a34a; stroke-width: 1.6; fill: none; }
    .rl { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .al { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .dl { stroke: #9ca3af; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="520" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="500" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">보통의 young GC — old 객체에서 탐색을 멈춤</text>
  <text x="730" y="42" class="code" text-anchor="end">Young-Only phase</text>
  <text x="30" y="82" class="lane">young</text>
  <text x="30" y="100" class="sub">eden·survivor</text>
  <rect x="150" y="62" width="586" height="190" rx="8" class="track"/>
  <text x="30" y="290" class="lane">old</text>
  <text x="30" y="308" class="sub">old region</text>
  <rect x="150" y="262" width="586" height="180" rx="8" class="track"/>
  <rect x="28" y="130" width="96" height="34" rx="6" class="dbbox"/>
  <text x="76" y="152" class="lbl" text-anchor="middle">GC root</text>
  <rect x="658" y="50" width="80" height="30" rx="6" class="dbbox"/>
  <text x="698" y="70" class="lbl" text-anchor="middle">GC root</text>
  <rect x="22" y="352" width="110" height="44" rx="6" class="dbbox"/>
  <text x="77" y="370" class="lbl" text-anchor="middle">remembered</text>
  <text x="77" y="387" class="lbl" text-anchor="middle">set</text>
  <line x1="248.0" y1="110.0" x2="310.0" y2="110.0" class="gl" marker-end="url(#agr)"/>
  <line x1="553.7777777777778" y1="124.0" x2="527.0344991543291" y2="184.17237690275948" class="gl" marker-end="url(#agr)"/>
  <line x1="570.8888888888889" y1="124.0" x2="617.8832298840813" y2="184.42129556524733" class="gl" marker-end="url(#agr)"/>
  <line x1="248.0" y1="200.0" x2="300.0" y2="200.0" class="gl" marker-end="url(#agr)"/>
  <line x1="236.6315789473684" y1="124.0" x2="312.51224836315345" y2="284.19252432221293" class="dl" marker-end="url(#ar)"/>
  <line x1="338.10526315789474" y1="124.0" x2="430.89266430102185" y2="284.26914742903773" class="dl" marker-end="url(#ar)"/>
  <line x1="508.8" y1="214.0" x2="452.4493900951088" y2="284.43826238111393" class="dl" marker-end="url(#ar)"/>
  <line x1="313.36842105263156" y1="214.0" x2="237.4877516368465" y2="374.19252432221293" class="dl" marker-end="url(#ar)"/>
  <line x1="334.0" y1="286.0" x2="404.5857864376269" y2="215.4142135623731" class="al" marker-end="url(#ar)"/>
  <line x1="230.0" y1="376.0" x2="230.0" y2="216.0" class="al" marker-end="url(#ar)"/>
  <line x1="248.0" y1="382.2857142857143" x2="420.1617099399639" y2="308.50212431144405" class="al" marker-end="url(#ar)"/>
  <line x1="440.0" y1="314.0" x2="440.0" y2="374.0" class="al" marker-end="url(#ar)"/>
  <line x1="458.0" y1="390.0" x2="560.0" y2="390.0" class="al" marker-end="url(#ar)"/>
  <line x1="672.0" y1="300.0" x2="590.0" y2="300.0" class="al" marker-end="url(#ar)"/>
  <line x1="124" y1="140" x2="210" y2="116" class="gl" marker-end="url(#agr)"/>
  <line x1="124" y1="156" x2="210" y2="194" class="gl" marker-end="url(#agr)"/>
  <line x1="668" y1="80" x2="580" y2="104" class="gl" marker-end="url(#agr)"/>
  <line x1="718" y1="80" x2="694" y2="284" class="dl" marker-end="url(#ar)"/>
  <line x1="132" y1="386" x2="210" y2="390" class="al" marker-end="url(#ar)"/>
  <line x1="132" y1="362" x2="300" y2="308" class="al" marker-end="url(#ar)"/>
  <rect x="212.0" y="96.0" width="36" height="28" rx="5" class="ok"/>
  <text x="230" y="115" class="okt" text-anchor="middle">1</text>
  <rect x="312.0" y="96.0" width="36" height="28" rx="5" class="ok"/>
  <text x="330" y="115" class="okt" text-anchor="middle">9</text>
  <rect x="542.0" y="96.0" width="36" height="28" rx="5" class="ok"/>
  <text x="560" y="115" class="okt" text-anchor="middle">6</text>
  <rect x="212.0" y="186.0" width="36" height="28" rx="5" class="ok"/>
  <text x="230" y="205" class="okt" text-anchor="middle">10</text>
  <rect x="302.0" y="186.0" width="36" height="28" rx="5" class="ok"/>
  <text x="320" y="205" class="okt" text-anchor="middle">4</text>
  <rect x="402.0" y="186.0" width="36" height="28" rx="5" class="ok"/>
  <text x="420" y="205" class="okt" text-anchor="middle">12</text>
  <rect x="502.0" y="186.0" width="36" height="28" rx="5" class="ok"/>
  <text x="520" y="205" class="okt" text-anchor="middle">7</text>
  <rect x="612.0" y="186.0" width="36" height="28" rx="5" class="ok"/>
  <text x="630" y="205" class="okt" text-anchor="middle">8</text>
  <rect x="302.0" y="286.0" width="36" height="28" rx="5" fill="#e5e7eb" stroke="#1f2937" stroke-width="2.6"/>
  <text x="320" y="305" class="db" text-anchor="middle">2</text>
  <rect x="422.0" y="286.0" width="36" height="28" rx="5" fill="#e5e7eb" stroke="#1f2937" stroke-width="2.6"/>
  <text x="440" y="305" class="db" text-anchor="middle">3</text>
  <rect x="552.0" y="286.0" width="36" height="28" rx="5" class="hold"/>
  <text x="570" y="305" class="val" text-anchor="middle">15</text>
  <rect x="672.0" y="286.0" width="36" height="28" rx="5" fill="#e5e7eb" stroke="#1f2937" stroke-width="2.6"/>
  <text x="690" y="305" class="db" text-anchor="middle">5</text>
  <rect x="212.0" y="376.0" width="36" height="28" rx="5" fill="#e5e7eb" stroke="#1f2937" stroke-width="2.6"/>
  <text x="230" y="395" class="db" text-anchor="middle">11</text>
  <rect x="422.0" y="376.0" width="36" height="28" rx="5" class="hold"/>
  <text x="440" y="395" class="val" text-anchor="middle">13</text>
  <rect x="562.0" y="376.0" width="36" height="28" rx="5" class="hold"/>
  <text x="580" y="395" class="val" text-anchor="middle">14</text>
  <rect x="30" y="470" width="22" height="18" rx="4" class="ok"/>
  <text x="58" y="484" class="sub">young 객체 (탐색함)</text>
  <rect x="190" y="470" width="22" height="18" rx="4" fill="#e5e7eb" stroke="#1f2937" stroke-width="2.6"/>
  <text x="218" y="484" class="sub">여기서 멈추는 old 객체</text>
  <rect x="370" y="470" width="22" height="18" rx="4" class="hold"/>
  <text x="398" y="484" class="sub">닿지 않는 old 객체</text>
  <line x1="520" y1="479" x2="560" y2="479" class="dl"/>
  <text x="566" y="484" class="sub">old로 가는 참조 — 따라가지 않음</text>
</svg>
