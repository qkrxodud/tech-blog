  <rect width="760" height="450" fill="#ffffff"/>
  <text x="24" y="30" class="h">같은 예약 번호를 두 트랜잭션이 남길 때 — <tspan class="m">claim</tspan>의 전제</text>
  <text x="24" y="52" class="gs">이런 겹침이 생길 수 있는 경우 — 계약이 이 순서를 고정하지는 않음 · 줄 남기기는 <tspan class="m">insert ignore</tspan> 한 문장</text>
  <line x1="110" y1="120" x2="736" y2="120" stroke="#e5e7eb" stroke-width="1"/>
  <text x="24" y="116" class="t2" style="font-size:13px">예약</text>
  <text x="24" y="134" class="gs" style="font-size:10.5px"><tspan class="m">reserve</tspan></text>
  <line x1="110" y1="220" x2="736" y2="220" stroke="#e5e7eb" stroke-width="1"/>
  <text x="24" y="216" class="t2" style="font-size:13px">해제</text>
  <text x="24" y="234" class="gs" style="font-size:10.5px"><tspan class="m">release</tspan></text>
