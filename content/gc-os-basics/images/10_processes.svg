<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>프로세스 A와 B가 각자의 가상 주소 공간과 페이지 테이블을 갖고, 하나의 CPU와 하나의 RAM의 프레임을 나눠 쓰는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .seg { font-size: 13px; font-weight: 700; fill: #374151; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opk { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .dia { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .lbl { font-size: 12.5px; font-weight: 700; fill: #6b7280; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="450" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">여러 프로세스 — 페이지 테이블은 따로, CPU와 RAM은 함께</text>
  <rect x="30" y="196" width="100" height="84" rx="14" class="hold"/>
  <text x="80" y="232" class="t" text-anchor="middle">CPU</text>
  <text x="80" y="252" class="s" text-anchor="middle">IR · MMU</text>
  <text x="215" y="70" class="t" text-anchor="middle">프로세스 A</text>
  <rect x="170" y="76" width="90" height="150" rx="10" class="box"/>
  <rect x="176" y="82" width="78" height="24" rx="4" class="hold"/>
  <text x="215" y="99" class="s" text-anchor="middle">kernel</text>
  <rect x="176" y="110" width="78" height="24" rx="4" class="hold"/>
  <text x="215" y="127" class="s" text-anchor="middle">stack</text>
  <rect x="176" y="138" width="78" height="24" rx="4" class="hold"/>
  <text x="215" y="155" class="s" text-anchor="middle">heap</text>
  <rect x="176" y="166" width="78" height="24" rx="4" class="hold"/>
  <text x="215" y="183" class="s" text-anchor="middle">data</text>
  <rect x="176" y="194" width="78" height="24" rx="4" class="ok"/>
  <text x="215" y="211" class="gnote" text-anchor="middle">code</text>
  <text x="365" y="106" class="s" text-anchor="middle">A의 페이지 테이블</text>
  <rect x="290" y="116" width="40" height="26" class="box"/>
  <rect x="330" y="116" width="110" height="26" class="box"/>
  <rect x="290" y="142" width="40" height="26" class="box"/>
  <rect x="330" y="142" width="110" height="26" class="box"/>
  <rect x="290" y="168" width="40" height="26" class="box"/>
  <rect x="330" y="168" width="110" height="26" class="box"/>
  <rect x="330" y="116" width="110" height="26" class="ok"/>
  <text x="310" y="134" class="seg" text-anchor="middle">2</text>
  <text x="385" y="134" class="gnote" text-anchor="middle">프레임 1</text>
  <line x1="262" y1="201" x2="288" y2="130" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="215" y="270" class="t" text-anchor="middle">프로세스 B</text>
  <rect x="170" y="276" width="90" height="150" rx="10" class="box"/>
  <rect x="176" y="282" width="78" height="24" rx="4" class="hold"/>
  <text x="215" y="299" class="s" text-anchor="middle">kernel</text>
  <rect x="176" y="310" width="78" height="24" rx="4" class="hold"/>
  <text x="215" y="327" class="s" text-anchor="middle">stack</text>
  <rect x="176" y="338" width="78" height="24" rx="4" class="hold"/>
  <text x="215" y="355" class="s" text-anchor="middle">heap</text>
  <rect x="176" y="366" width="78" height="24" rx="4" class="hold"/>
  <text x="215" y="383" class="s" text-anchor="middle">data</text>
  <rect x="176" y="394" width="78" height="24" rx="4" class="ok"/>
  <text x="215" y="411" class="gnote" text-anchor="middle">code</text>
  <text x="365" y="306" class="s" text-anchor="middle">B의 페이지 테이블</text>
  <rect x="290" y="316" width="40" height="26" class="box"/>
  <rect x="330" y="316" width="110" height="26" class="box"/>
  <rect x="290" y="342" width="40" height="26" class="box"/>
  <rect x="330" y="342" width="110" height="26" class="box"/>
  <rect x="290" y="368" width="40" height="26" class="box"/>
  <rect x="330" y="368" width="110" height="26" class="box"/>
  <rect x="330" y="316" width="110" height="26" class="ok"/>
  <text x="310" y="334" class="seg" text-anchor="middle">2</text>
  <text x="385" y="334" class="gnote" text-anchor="middle">프레임 2</text>
  <line x1="262" y1="401" x2="288" y2="330" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="130" y1="226" x2="168" y2="160" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="130" y1="252" x2="168" y2="330" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="570" y="62" class="t" text-anchor="middle">RAM</text>
  <rect x="520" y="70" width="110" height="350" rx="12" class="box"/>
  <rect x="528" y="110" width="94" height="30" rx="4" class="ok"/>
  <text x="575" y="130" class="gnote" text-anchor="middle">프레임 1 (A)</text>
  <rect x="528" y="160" width="94" height="30" rx="4" class="ok"/>
  <text x="575" y="180" class="gnote" text-anchor="middle">프레임 2 (B)</text>
  <rect x="528" y="210" width="94" height="30" rx="4" class="dbbox"/>
  <rect x="528" y="250" width="94" height="30" rx="4" class="dbbox"/>
  <rect x="528" y="290" width="94" height="30" rx="4" class="dbbox"/>
  <rect x="528" y="340" width="94" height="70" rx="6" class="hold"/>
  <text x="575" y="380" class="seg" text-anchor="middle">kernel</text>
  <line x1="440" y1="123" x2="526" y2="125" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="440" y1="323" x2="526" y2="177" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="650" y="70" width="90" height="100" rx="12" class="dbbox"/>
  <text x="695" y="112" class="t" text-anchor="middle">디스크</text>
  <text x="695" y="132" class="s" text-anchor="middle">실행 파일</text>
  <line x1="660" y1="170" x2="626" y2="222" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#agr)"/>
  <text x="695" y="196" class="s" text-anchor="middle">필요할 때 적재</text>
  <text x="30" y="446" class="sub">CPU는 지금 실행 중인 프로세스의 페이지 테이블로 주소를 바꾸고, 프레임은 모두 같은 RAM에 있습니다.</text>
</svg>
