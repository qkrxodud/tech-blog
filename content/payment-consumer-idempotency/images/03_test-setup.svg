<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 630" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>11장 계약의 시험 도구와 시간 값 — MessageFeed는 받는 쪽 토픽에 결제 번호 키로 직접 싣고 번호는 10억대부터, ReceiverOutage는 관리자 계정의 read_only on/off로 받는 쪽 쓰기를 오류 1290으로 막으며 결제 서버와 두 서비스가 함께 막힘, 트리거 signal sqlstate 45000은 한 주문·예약의 변경만 일시 오류로 실패시킴, TopicLag는 소비자 그룹이 커밋한 자리가 토픽 끝에 닿으면 다 처리한 것으로 봄, 결제 이벤트 토픽은 컨텍스트마다 새 이름임. 연결이 끊기는 장애는 만들지 않았고, 처리 뒤 커밋 전 재기동은 같은 메시지를 한 번 더 실어 대신함(가정). 시간 축에서 기본 처리 모두 10번(처음 1 + 다시 9)은 약 0.5초씩 모두 약 4.6초(0.5초가 fetch.max.wait.ms 500ms와 같은지는 확인하지 않음), 처음 둔 장애 1.5초·1초씩 3번은 출발 코드에서도 통과, 계약 장애 6초, 계약 다시 시도 2·4·4·4초(합 14초)이고 첫 간격 2초 안에 뒤 결과가 반영되는지로 다시 시도하지 않았는지를 봄. 운영 값은 1·2·4·8초(합 15초)로 따로 둔 그림</title>
