<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>5장 완성 코드의 테스트 결과 — ./gradlew clean check 460개 모두 통과(4장 373개에 5장 87개), 라인 커버리지 99.3%(567줄 중 563줄). 5장 87개는 운영 구현의 취소 테스트 32개(계약 24개와 운영 구현에만 있는 8개: PG가 거절한 취소 2, 보정 중 조회 무응답 1, PG 500 경로 5), 도메인 테스트 41개(결제 취소와 남은 금액 3, 취소 받기와 취소 상태 13, 같은 취소 요청 가리기 14, 답을 기다리는 취소와 확인한 결과로 닫기 11), 결제 취소 API 14개(출발 코드의 13개와 PG 5xx 502 하나). knownFailingTest는 164개 중 39개 실패로 2·3·4장 26개와 5장 비교 A 2, B 6, C 3, D 2</title>
