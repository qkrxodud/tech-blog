<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 3 선택지 비교 — 같은 파티션에 같은 주문의 승인과 취소를 보내고 승인이 일시 오류일 때, 같은 자리에서 간격을 늘려 다시 시도하는 운영(blocking)은 취소가 뒤에서 기다려, 계약(다시 시도 2·4·4·4초, 6초 장애)에서는 장애가 끝난 뒤 다시 시도에서 승인이 반영되고 취소가 이어 받은 순서대로 반영됨. 측정(운영 값 1·2·4·8초로 계속 실패시켜 15초를 다 쓰고 실패 모음으로 감)에서 일시 오류가 뒤 결과를 막은 시간은 첫 실행 15813~15933ms·두 번째 15736~15759ms이고, 영구 오류는 바로 실패 모음으로 58~70ms·42~46ms임. Spring Kafka 기본 처리는 처음 1번에 간격 없이 9번 더(모두 10번, 약 4.6초) 읽은 뒤 ERROR 로그로 넘어가 6초 장애에 승인을 잃고 실패 모음이 없으며, 막는 시간은 일시 4630~4650ms·4572~4599ms, 영구 4612~4618ms·4572~4605ms임. 다시 시도 토픽(non-blocking)은 승인을 다시 시도 토픽으로 넘겨 취소가 먼저 반영되고 늦게 온 승인은 결정 2가 걸러 받은 순서가 APPROVAL_CANCELED, APPROVED로 바뀌며, 막는 시간은 일시 45~48ms·41~50ms, 영구 49~57ms·46~51ms이고 다 쓴 메시지의 원인 머리가 비어 있음. 11장 계약 실패는 운영 0·0, 기본 처리 주문 8·재고 7, 다시 시도 토픽 주문 2·재고 1인 그림</title>
