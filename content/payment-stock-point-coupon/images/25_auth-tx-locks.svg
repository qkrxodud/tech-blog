  <rect width="760" height="452" fill="#ffffff"/>
  <text x="24" y="30" class="h">인증 트랜잭션이 커밋까지 쥐는 줄</text>
  <text x="24" y="52" class="gs">7장: 결제 줄 하나 → 8장: 결제 줄 + 재고 · 쿠폰 · 포인트 줄</text>
  <line x1="40" y1="96" x2="700" y2="96" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="24" y="72" width="132" height="48" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="24" cy="72" r="10" fill="#111827"/><text x="24" y="76" class="num" text-anchor="middle">1</text>
  <use href="#i-lock" transform="translate(36,82) scale(0.85)"/>
  <text x="74" y="92" class="t2" style="font-size:12px">결제 줄</text>
  <text x="74" y="110" class="s" style="font-size:10px">7장 잠금</text>
