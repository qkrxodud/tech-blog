<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 690" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>2장 완성 코드에서 결제 한 건의 요청과 응답 순서 — 클라이언트가 POST /api/v1/payments로 준비하면 READY를 저장하고 201로 답하고, POST /api/v1/payments/{orderId}/confirm으로 paymentKey를 보내면 결제 서버는 트랜잭션 1에서 결제를 읽어 AUTHENTICATED를 커밋하고 연결을 반납한 뒤, 트랜잭션 밖에서 Mock PG의 POST /v1/payments/confirm에 paymentKey, orderId, amount를 보내 200 status DONE을 받고, 트랜잭션 2에서 결제를 다시 읽어 APPROVED를 커밋한 뒤 200 status APPROVED로 답하며, 결제가 없으면 404, 상태가 맞지 않으면 409, 거절이면 200 APPROVAL_FAILED, 시간 안에 답이 없으면 504로 끝나는 그림</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 13.5px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 13.5px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 13.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .flow { stroke: #9ca3af; stroke-width: 1.4; fill: none; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 13.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okw { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 13.5px; fill: #b91c1c; }
    .gnote { font-size: 13.5px; fill: #15803d; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="690" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="670" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="40" class="h">요청과 응답 순서 — 트랜잭션 두 개 사이에서 PG를 부른다</text>

  <!-- 참여자 -->
  <rect x="30" y="54" width="100" height="44" rx="8" class="box"/>
  <text x="80" y="81" class="t" text-anchor="middle">클라이언트</text>
  <rect x="240" y="54" width="160" height="44" rx="8" class="box"/>
  <text x="320" y="73" class="t" text-anchor="middle">결제 서버</text>
  <text x="320" y="90" class="sub" text-anchor="middle" style="font-size: 12px">컨트롤러·서비스</text>
  <rect x="450" y="54" width="100" height="44" rx="8" class="dbbox"/>
  <text x="500" y="81" class="db" text-anchor="middle">DB</text>
  <rect x="620" y="54" width="120" height="44" rx="8" class="box"/>
  <text x="680" y="81" class="t" text-anchor="middle">Mock PG</text>
  <line x1="80" y1="98" x2="80" y2="566" stroke="#c4c8ce" stroke-dasharray="4 4"/>
  <line x1="320" y1="98" x2="320" y2="566" stroke="#c4c8ce" stroke-dasharray="4 4"/>
  <line x1="500" y1="98" x2="500" y2="566" stroke="#c4c8ce" stroke-dasharray="4 4"/>
  <line x1="680" y1="98" x2="680" y2="566" stroke="#c4c8ce" stroke-dasharray="4 4"/>

  <!-- 준비 -->
  <text x="88" y="118" class="step">결제 준비(별도 요청)</text>
  <text x="90" y="136" class="code" style="font-size: 12px; fill: #1f2937">POST /api/v1/payments</text>
  <text x="90" y="150" class="code" style="font-size: 12px">{orderId, amount}</text>
  <line x1="80" y1="158" x2="316" y2="158" class="flow" marker-end="url(#ar)"/>
  <text x="410" y="152" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace" font-size="12px">READY</tspan> 저장·커밋</text>
  <line x1="324" y1="158" x2="492" y2="158" class="flow" marker-end="url(#ar)"/>
  <rect x="494" y="150" width="12" height="18" rx="2" class="hold"/>
  <text x="200" y="180" class="code" text-anchor="middle" style="font-size: 12px; fill: #1f2937">201 {status: READY}</text>
  <line x1="320" y1="188" x2="84" y2="188" class="flow" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <line x1="30" y1="202" x2="730" y2="202" stroke="#e5e7eb"/>

  <!-- 승인 요청 -->
  <text x="88" y="222" class="step">결제 승인</text>
  <text x="90" y="240" class="code" style="font-size: 12px; fill: #1f2937">POST /api/v1/payments/</text>
  <text x="90" y="254" class="code" style="font-size: 12px; fill: #1f2937">{orderId}/confirm <tspan fill="#6b7280">{paymentKey}</tspan></text>
  <line x1="80" y1="262" x2="316" y2="262" class="flow" marker-end="url(#ar)"/>

  <!-- 트랜잭션 1 -->
  <rect x="232" y="270" width="432" height="72" rx="8" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="240" y="285" class="sub" style="font-size: 12.5px; font-weight: 700; fill: #1f2937">트랜잭션 1 — <tspan font-family="Menlo, Consolas, monospace" font-weight="400">authenticate()</tspan></text>
  <text x="410" y="300" class="val" text-anchor="middle" style="font-size: 12.5px">결제 읽기·인증 기록</text>
  <line x1="324" y1="306" x2="492" y2="306" class="flow" marker-end="url(#ar)"/>
  <rect x="494" y="298" width="12" height="36" rx="2" class="hold"/>
  <text x="514" y="311" class="val" style="font-size: 12.5px"><tspan font-family="Menlo, Consolas, monospace" font-size="12px">AUTHENTICATED</tspan> 커밋</text>
  <text x="410" y="326" class="gnote" text-anchor="middle" style="font-size: 12.5px">커밋 후 연결 반납</text>
  <line x1="494" y1="332" x2="324" y2="332" class="flow" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <circle cx="214" cy="306" r="10" class="bad"/>
  <text x="214" y="311" class="badt" text-anchor="middle" style="font-size: 12px">A</text>

  <!-- 트랜잭션 밖: PG 호출 -->
  <rect x="232" y="352" width="508" height="104" rx="8" class="okw"/>
  <text x="240" y="368" class="gnote" style="font-weight: 700">트랜잭션 밖 — PG를 기다리는 동안 DB 연결을 쓰지 않음</text>
  <text x="330" y="386" class="code" style="font-size: 12px; fill: #1f2937">POST /v1/payments/confirm</text>
  <text x="330" y="400" class="code" style="font-size: 12px">{paymentKey, orderId, amount}</text>
  <line x1="324" y1="408" x2="672" y2="408" class="flow" marker-end="url(#ar)"/>
  <rect x="674" y="408" width="12" height="32" rx="2" class="hold"/>
  <text x="500" y="434" class="code" text-anchor="middle" style="font-size: 12px; fill: #1f2937">200 {status: DONE, totalAmount}</text>
  <line x1="674" y1="442" x2="324" y2="442" class="flow" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <circle cx="712" cy="434" r="10" class="bad"/>
  <text x="712" y="439" class="badt" text-anchor="middle" style="font-size: 12px">B</text>

  <!-- 트랜잭션 2 -->
  <rect x="232" y="466" width="432" height="72" rx="8" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="240" y="481" class="sub" style="font-size: 12.5px; font-weight: 700; fill: #1f2937">트랜잭션 2 — <tspan font-family="Menlo, Consolas, monospace" font-weight="400">recordApproval()</tspan></text>
  <text x="410" y="496" class="val" text-anchor="middle" style="font-size: 12.5px">다시 읽고 결과 기록</text>
  <line x1="324" y1="502" x2="492" y2="502" class="flow" marker-end="url(#ar)"/>
  <rect x="494" y="494" width="12" height="36" rx="2" class="hold"/>
  <text x="514" y="507" class="val" style="font-size: 12.5px"><tspan font-family="Menlo, Consolas, monospace" font-size="12px">APPROVED</tspan> 커밋</text>
  <text x="410" y="522" class="gnote" text-anchor="middle" style="font-size: 12.5px">커밋 후 연결 반납</text>
  <line x1="494" y1="528" x2="324" y2="528" class="flow" stroke-dasharray="5 4" marker-end="url(#ar)"/>

  <!-- 응답 -->
  <text x="200" y="552" class="code" text-anchor="middle" style="font-size: 12px; fill: #15803d">200 {status: APPROVED}</text>
  <line x1="320" y1="560" x2="84" y2="560" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>

  <!-- 갈래 -->
  <line x1="30" y1="580" x2="730" y2="580" stroke="#e5e7eb"/>
  <circle cx="40" cy="598" r="9" class="bad"/>
  <text x="40" y="602" class="badt" text-anchor="middle" style="font-size: 11px">A</text>
  <text x="58" y="602" class="val" style="font-size: 12.5px">결제가 없으면 404 <tspan font-family="Menlo, Consolas, monospace" font-size="12px">PAYMENT_NOT_FOUND</tspan>, 상태가 맞지 않으면 409 <tspan font-family="Menlo, Consolas, monospace" font-size="12px">INVALID_PAYMENT_TRANSITION</tspan></text>
  <circle cx="40" cy="622" r="9" class="bad"/>
  <text x="40" y="626" class="badt" text-anchor="middle" style="font-size: 11px">B</text>
  <text x="58" y="626" class="val" style="font-size: 12.5px">거절(400 <tspan font-family="Menlo, Consolas, monospace" font-size="12px">CARD_REJECTED</tspan>)이면 트랜잭션 2에서 <tspan font-family="Menlo, Consolas, monospace" font-size="12px">APPROVAL_FAILED</tspan> 커밋 → 200 <tspan font-family="Menlo, Consolas, monospace" font-size="12px">{status: APPROVAL_FAILED}</tspan></text>
  <text x="58" y="648" class="val" style="font-size: 12.5px">읽기 시간 제한 안에 답이 없으면 <tspan font-family="Menlo, Consolas, monospace" font-size="12px">AUTHENTICATED</tspan>로 둔 채 504 <tspan font-family="Menlo, Consolas, monospace" font-size="12px">PAYMENT_GATEWAY_NO_RESPONSE</tspan></text>
  <text x="58" y="670" class="sub" style="font-size: 12px">오류 응답 본문은 <tspan font-family="Menlo, Consolas, monospace">{code, message}</tspan>, 승인 응답 본문은 <tspan font-family="Menlo, Consolas, monospace">{orderId, amount, status}</tspan></text>
</svg>
