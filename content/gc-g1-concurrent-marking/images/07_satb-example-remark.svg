  <text x="711" y="486" class="mono" text-anchor="middle">0</text>
  <text x="30" y="526" class="sub">Remark 종료 후 Cleanup(STW)에서 collection set candidate regions를 확정한다</text>
  <text x="30" y="546" class="sub">2는 더 이상 참조되지 않지만 이미 marking되어 있어 살았다고 판단된다</text>

