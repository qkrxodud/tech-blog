<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>account 패키지 아래 adapter(in/web, out/persistence), domain, application(port/in, port/out) 패키지를 두어 육각형 아키텍처의 요소가 패키지 이름으로 드러나는 구조</title>
