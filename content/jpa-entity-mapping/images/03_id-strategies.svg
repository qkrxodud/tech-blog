<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>IDENTITY는 기본 키 생성을 데이터베이스에 위임하고, SEQUENCE는 데이터베이스 시퀀스 오브젝트를, TABLE은 키 생성 전용 테이블을 사용하며, AUTO는 방언에 따라 자동 지정되는 기본 키 생성 전략 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .m { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="340" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">기본 키 생성 전략 — 키를 어디서 만드는가</text>
  <text x="730" y="42" class="code" text-anchor="end">@GeneratedValue(strategy = ...)</text>
  <text x="30" y="129" class="sub">키를 만드는 곳</text>
  <text x="30" y="177" class="sub">주로 쓰는 DB</text>
  <text x="30" y="225" class="sub">필요한 설정</text>
  <text x="30" y="273" class="sub">특징</text>
  <rect x="140" y="58" width="186" height="40" rx="8" class="hold"/>
  <text x="233" y="83" class="m" text-anchor="middle">IDENTITY</text>
  <rect x="140" y="106" width="186" height="36" rx="6" class="box"/>
  <text x="233" y="129" class="val" text-anchor="middle">데이터베이스에 위임</text>
  <rect x="140" y="154" width="186" height="36" rx="6" class="box"/>
  <text x="233" y="177" class="val" text-anchor="middle">MySQL · PostgreSQL 등</text>
  <rect x="140" y="202" width="186" height="36" rx="6" class="box"/>
  <text x="233" y="225" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">strategy</tspan>만 지정</text>
  <rect x="140" y="250" width="186" height="36" rx="6" class="box"/>
  <text x="233" y="273" class="val" text-anchor="middle">persist 시점에 즉시 INSERT</text>
  <rect x="340" y="58" width="186" height="40" rx="8" class="hold"/>
  <text x="433" y="83" class="m" text-anchor="middle">SEQUENCE</text>
  <rect x="340" y="106" width="186" height="36" rx="6" class="box"/>
  <text x="433" y="129" class="val" text-anchor="middle">DB 시퀀스 오브젝트</text>
  <rect x="340" y="154" width="186" height="36" rx="6" class="box"/>
  <text x="433" y="177" class="val" text-anchor="middle">Oracle · PostgreSQL 등</text>
  <rect x="340" y="202" width="186" height="36" rx="6" class="box"/>
  <text x="433" y="225" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">@SequenceGenerator</tspan></text>
  <rect x="340" y="250" width="186" height="36" rx="6" class="box"/>
  <text x="433" y="273" class="val" text-anchor="middle">allocationSize로 최적화</text>
  <rect x="540" y="58" width="186" height="40" rx="8" class="hold"/>
  <text x="633" y="83" class="m" text-anchor="middle">TABLE</text>
  <rect x="540" y="106" width="186" height="36" rx="6" class="box"/>
  <text x="633" y="129" class="val" text-anchor="middle">키 생성 전용 테이블</text>
  <rect x="540" y="154" width="186" height="36" rx="6" class="box"/>
  <text x="633" y="177" class="val" text-anchor="middle">모든 DB</text>
  <rect x="540" y="202" width="186" height="36" rx="6" class="box"/>
  <text x="633" y="225" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">@TableGenerator</tspan></text>
  <rect x="540" y="250" width="186" height="36" rx="6" class="bad"/>
  <text x="633" y="273" class="note" text-anchor="middle">성능이 좋지 않음</text>
  <text x="30" y="330" class="foot">AUTO는 방언에 따라 자동 지정되며 기본값이다. <tspan font-family="Menlo, Consolas, monospace">@Id</tspan>만 사용하면 직접 할당한다.</text>
</svg>
