<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>7장 출발 코드에서 15000원 결제에 10000원 취소 두 건이 겹칠 때 — 취소 A가 PaymentCancelRecorder.request에서 findByOrderId로 결제를 잠그지 않고 읽어 REQUESTED 10000원 줄을 남기다 1초 붙잡힌 사이, 취소 B도 같은 결제를 읽지만 커밋 전인 A의 요청 줄이 보이지 않아 받을 수 있는 금액 15000원으로 계산하고 REQUESTED 10000원 줄을 남긴다. 둘 다 커밋한 뒤 트랜잭션 밖에서 Mock PG에 취소를 보내고, PG는 A를 취소하고 B는 잔액 검사로 403 NOT_CANCELABLE_AMOUNT로 거절한다. recordOutcome에서 A는 DONE, B는 FAILED로 남고 둘 다 200으로 답한다</title>
