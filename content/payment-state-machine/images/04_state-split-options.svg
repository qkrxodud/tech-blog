<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결제 단계를 상태로 나누는 세 가지 방식 — 승인 하나로 묶으면 취소할 때 매입 전후를 알 수 없고, 하나의 상태 필드에 인증·승인·매입을 모두 두면 APPROVED와 CAPTURED에서 취소가 전이 표 한 곳에서 갈라지며, 결제 상태와 매입 상태를 두 필드로 나누면 두 필드를 함께 봐야 취소 방향이 정해지는 그림</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .subc { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #6b7280; }
    .lbl { font-family: Menlo, Consolas, monospace; font-size: 11px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .st { font-size: 12.5px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .term { fill: #f3f4f6; stroke: #374151; stroke-width: 2.6; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .flow { stroke: #9ca3af; stroke-width: 1.4; fill: none; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .card { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.2; }
    .pick { fill: #ffffff; stroke: #16a34a; stroke-width: 2.2; }
    .sm { font-family: Menlo, Consolas, monospace; font-size: 11.5px; fill: #374151; }
    .smg { font-family: Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 700; fill: #15803d; }
    .tc { font-size: 13px; fill: #374151; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="500" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="480" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">상태 나누기 — 세 방식에서 취소 방향이 정해지는 곳</text>
  <rect x="22" y="60" width="228" height="420" rx="10" class="card"/>
  <rect x="266" y="60" width="228" height="420" rx="10" class="pick"/>
  <rect x="510" y="60" width="228" height="420" rx="10" class="card"/>
  <text x="38" y="132" class="step">상태 필드</text>
  <line x1="38" y1="298" x2="234" y2="298" stroke="#eceef1"/>
  <text x="38" y="318" class="step">취소 요청이 오면</text>
  <line x1="38" y1="410" x2="234" y2="410" stroke="#eceef1"/>
  <text x="282" y="132" class="step">상태 필드</text>
  <line x1="282" y1="298" x2="478" y2="298" stroke="#eceef1"/>
  <text x="282" y="318" class="step">취소 요청이 오면</text>
  <line x1="282" y1="410" x2="478" y2="410" stroke="#eceef1"/>
  <text x="526" y="132" class="step">상태 필드</text>
  <line x1="526" y1="298" x2="722" y2="298" stroke="#eceef1"/>
  <text x="526" y="318" class="step">취소 요청이 오면</text>
  <line x1="526" y1="410" x2="722" y2="410" stroke="#eceef1"/>
  <text x="38" y="90" class="t">승인 하나로 묶기</text>
  <text x="38" y="110" class="sub">인증·승인·매입을 구분하지 않음</text>
  <rect x="38" y="146" width="196" height="56" rx="8" class="hold"/>
  <text x="136" y="167" class="subc" text-anchor="middle">status</text>
  <text x="136" y="189" class="t" text-anchor="middle">결제 완료</text>
  <text x="136" y="226" class="sub" text-anchor="middle">매입 전후를 담을 자리가 없음</text>
  <rect x="38" y="330" width="196" height="44" rx="8" class="bad"/>
  <text x="136" y="357" class="badt" text-anchor="middle">매입 전인지 후인지 모름</text>
  <text x="136" y="394" class="note" text-anchor="middle">승인 취소·매입 취소 구분 불가</text>
  <text x="38" y="430" class="step">다른 선택이 맞는 조건</text>
  <text x="38" y="452" class="tc">정산을 PG에 모두 맡기고</text>
  <text x="38" y="470" class="tc">매입 시점에 관여하지 않을 때</text>
  <text x="282" y="90" class="t">한 필드에 모두 두기</text>
  <rect x="408" y="74" width="74" height="22" rx="11" class="ok"/>
  <text x="445" y="89.5" class="gnote" text-anchor="middle">이 장의 선택</text>
  <text x="282" y="110" class="sub">인증·승인·매입을 status 하나에</text>
  <rect x="282" y="146" width="196" height="122" rx="8" class="hold"/>
  <text x="380" y="167" class="subc" text-anchor="middle">status</text>
  <text x="380" y="190" class="sm" text-anchor="middle">READY</text>
  <text x="380" y="211" class="sm" text-anchor="middle">AUTHENTICATED</text>
  <text x="380" y="232" class="sm" text-anchor="middle">APPROVED</text>
  <text x="380" y="253" class="sm" text-anchor="middle">CAPTURED</text>
  <text x="380" y="287" class="sub" text-anchor="middle">+ 실패·만료·취소 5개, 모두 9개</text>
  <rect x="282" y="330" width="196" height="50" rx="8" class="ok"/>
  <text x="380" y="351" class="smg" text-anchor="middle">APPROVED → APPROVAL_CANCELED</text>
  <text x="380" y="370" class="smg" text-anchor="middle">CAPTURED → CAPTURE_CANCELED</text>
  <text x="380" y="398" class="gnote" text-anchor="middle">전이 표 한 곳에서 갈라짐</text>
  <text x="282" y="430" class="step">이 선택의 비용</text>
  <text x="282" y="452" class="tc">매입 중간 단계(<tspan font-family="Menlo, Consolas, monospace" font-size="11.5">REQUESTED</tspan> 등)를</text>
  <text x="282" y="470" class="tc">표현하지 못함</text>
  <text x="526" y="90" class="t">두 필드로 나누기</text>
  <text x="526" y="110" class="sub">토스페이먼츠 결제 객체와 같은 방식</text>
  <rect x="526" y="146" width="196" height="52" rx="8" class="hold"/>
  <text x="624" y="166" class="subc" text-anchor="middle">status</text>
  <text x="624" y="186" class="sm" text-anchor="middle">IN_PROGRESS·DONE…</text>
  <rect x="526" y="208" width="196" height="52" rx="8" class="hold"/>
  <text x="624" y="228" class="subc" text-anchor="middle">acquireStatus</text>
  <text x="624" y="248" class="sm" text-anchor="middle">REQUESTED·COMPLETED…</text>
  <text x="624" y="287" class="sub" text-anchor="middle">결제 상태와 매입 상태를 따로</text>
  <rect x="526" y="330" width="196" height="50" rx="8" class="box"/>
  <text x="624" y="351" class="tc" text-anchor="middle">두 필드를 함께 봐야</text>
  <text x="624" y="370" class="tc" text-anchor="middle">취소 방향이 정해짐</text>
  <text x="526" y="430" class="step">다른 선택이 맞는 조건</text>
  <text x="526" y="452" class="tc">매입 중간 상태를 PG에서 받아</text>
  <text x="526" y="470" class="tc">대사에 써야 할 때</text>
</svg>
