<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 556" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 4 — 1장 상태 머신에서 결제가 잡아 둔 재고·포인트·쿠폰을 쥐는 상태(keepsHoldings: AUTHENTICATED, APPROVAL_UNKNOWN, APPROVED, CAPTURED)와 돌려줄 상태(dropsHoldings: APPROVAL_FAILED, EXPIRED, APPROVAL_CANCELED, CAPTURE_CANCELED). 쥐는 상태에서 돌려줄 상태로 가는 전이(AUTHENTICATED→APPROVAL_FAILED, APPROVAL_UNKNOWN→APPROVAL_FAILED, AUTHENTICATED→EXPIRED, APPROVED→APPROVAL_CANCELED, CAPTURED→CAPTURE_CANCELED)에서만 돌려준다. AUTHENTICATED→APPROVAL_UNKNOWN은 PG에 승인이 남았을 수 있어 쥔 채로 두고, READY→EXPIRED는 잡은 것이 없어 돌려주지 않으며, 부분 취소는 카드 금액만 돌려준다. 만료 전이는 expire()를 부르는 곳이 없어 도메인 테스트로만 확인했다</title>
