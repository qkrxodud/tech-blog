<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>main 실행은 local 프로파일이라 InitMember가 teamA, teamB와 member0부터 member99까지 100명을 넣고, 테스트 실행은 test 프로파일이라 InitMember가 등록되지 않아 테스트가 넣은 데이터만 사용하는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .msg { font-size: 11.5px; fill: #374151; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .cont { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="270" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="250" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">프로파일 분리 — 샘플 데이터는 local에서만</text>
  <text x="730" y="42" class="code" text-anchor="end">@Profile("local")</text>
  <text x="30" y="76" class="step" text-anchor="start">실행</text>
  <text x="170" y="76" class="step" text-anchor="start">application.yml</text>
  <text x="370" y="76" class="step" text-anchor="start">InitMember</text>
  <text x="570" y="76" class="step" text-anchor="start">사용하는 데이터</text>
  <rect x="30" y="88" width="120" height="56" rx="8" class="hold"/>
  <text x="90.0" y="111.5" class="ts" text-anchor="middle">main 실행</text>
  <text x="90.0" y="130.5" class="sub" text-anchor="middle">src/main</text>
  <rect x="170" y="88" width="180" height="56" rx="8" class="box"/>
  <text x="260.0" y="121.0" class="opm" text-anchor="middle">active: local</text>
  <rect x="370" y="88" width="180" height="56" rx="8" class="ok"/>
  <text x="460.0" y="111.5" class="okt" text-anchor="middle">빈 등록, 동작</text>
  <text x="460.0" y="130.5" class="gnote" text-anchor="middle">@PostConstruct로 init()</text>
  <rect x="570" y="88" width="160" height="56" rx="8" class="ok"/>
  <text x="650.0" y="111.5" class="okt" text-anchor="middle">teamA, teamB</text>
  <text x="650.0" y="130.5" class="okm" text-anchor="middle">member0~member99</text>
  <rect x="30" y="164" width="120" height="56" rx="8" class="hold"/>
  <text x="90.0" y="187.5" class="ts" text-anchor="middle">테스트 실행</text>
  <text x="90.0" y="206.5" class="sub" text-anchor="middle">src/test</text>
  <rect x="170" y="164" width="180" height="56" rx="8" class="box"/>
  <text x="260.0" y="197.0" class="opm" text-anchor="middle">active: test</text>
  <rect x="370" y="164" width="180" height="56" rx="8" class="wait"/>
  <text x="460.0" y="197.0" class="waitt" text-anchor="middle">등록되지 않음</text>
  <rect x="570" y="164" width="160" height="56" rx="8" class="box"/>
  <text x="650.0" y="187.5" class="val" text-anchor="middle">테스트가 직접</text>
  <text x="650.0" y="206.5" class="val" text-anchor="middle">넣은 데이터만</text>
  <line x1="150" y1="116" x2="166" y2="116" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="350" y1="116" x2="366" y2="116" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="550" y1="116" x2="566" y2="116" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="150" y1="192" x2="166" y2="192" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="350" y1="192" x2="366" y2="192" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="550" y1="192" x2="566" y2="192" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="30" y="248" class="foot" text-anchor="start">샘플 데이터 100건이 테스트 케이스 실행에 영향을 주지 않습니다</text>
</svg>
