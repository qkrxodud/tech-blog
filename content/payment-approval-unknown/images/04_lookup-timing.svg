  <text x="30" y="213" class="t2">Mock PG</text>
  <line x1="120" y1="136" x2="740" y2="136" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="120" y1="208" x2="740" y2="208" stroke="#e5e7eb" stroke-width="1"/>
