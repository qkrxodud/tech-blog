<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>Article 엔티티가 식별자 없는 ArticleContent 밸류를 가지고, @SecondaryTable로 article_content 테이블에 매핑되는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opk { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .ster { font-size: 11.5px; font-style: italic; fill: #6b7280; }
    .cls { font-size: 15px; font-weight: 700; fill: #1f2937; }
    .attr { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
    .sep { stroke: #d1d5db; stroke-width: 1; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
    <marker id="dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="14" markerHeight="9" orient="auto">
      <path d="M1,5 L8,1 L15,5 L8,9 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="760" height="390" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="370" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">ArticleContent를 밸류로 — @SecondaryTable로 다른 테이블에 매핑</text>
  <text x="730" y="42" class="code" text-anchor="end">@Embeddable</text>
  <text x="170" y="66" class="step" text-anchor="middle">도메인 모델</text>
  <text x="560" y="66" class="step" text-anchor="middle">테이블</text>
  <rect x="60" y="80" width="220" height="113" rx="6" class="hold"/>
  <text x="170.0" y="97" class="ster" text-anchor="middle">&lt;&lt;Entity&gt;&gt;</text>
  <text x="170.0" y="116" class="cls" text-anchor="middle">Article</text>
  <line x1="60" y1="124" x2="280" y2="124" class="sep"/>
  <text x="72" y="143" class="attr">id: Long</text>
  <text x="72" y="162" class="attr">title: String</text>
  <text x="72" y="181" class="attr">content: ArticleContent</text>
  <line x1="170" y1="195" x2="170" y2="214" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="60" y="218" width="220" height="94" rx="6" class="ok"/>
  <text x="170.0" y="235" class="ster" text-anchor="middle">&lt;&lt;Value&gt;&gt;</text>
  <text x="170.0" y="254" class="cls" text-anchor="middle">ArticleContent</text>
  <line x1="60" y1="262" x2="280" y2="262" class="sep"/>
  <text x="72" y="281" class="attr">content: String</text>
  <text x="72" y="300" class="attr">contentType: String</text>
  <rect x="450" y="80" width="220" height="86" rx="6" class="dbbox"/>
  <text x="560.0" y="101" class="db" text-anchor="middle">article</text>
  <line x1="450" y1="110" x2="670" y2="110" class="sep"/>
  <text x="462" y="131" class="attr">id (PK)</text>
  <text x="462" y="155" class="attr">title</text>
  <rect x="450" y="218" width="220" height="110" rx="6" class="dbbox"/>
  <text x="560.0" y="239" class="db" text-anchor="middle">article_content</text>
  <line x1="450" y1="248" x2="670" y2="248" class="sep"/>
  <text x="462" y="269" class="attr">id (PK)</text>
  <text x="462" y="293" class="attr">content</text>
  <text x="462" y="317" class="attr">content_type</text>
  <line x1="560" y1="168" x2="560" y2="214" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="572" y="196" class="code">pkJoinColumns = id</text>
  <text x="30" y="364" class="sub">ArticleContent에는 식별자가 없고, 저장할 테이블은 @SecondaryTable과 @AttributeOverride로 지정합니다.</text>
</svg>
