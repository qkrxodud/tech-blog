  <text x="26" y="163" class="gs" style="font-size:11px">이미 잡음(커밋됨)</text>
  <rect x="192" y="116" width="182" height="64" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="204" y="152" class="s2" style="fill:#15803d;font-size:11px">해제가 돌려줌</text>
