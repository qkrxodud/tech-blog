<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 472" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>1장부터 6장까지 7장으로 넘긴 항목과 그 항목을 푼 결정 — 1장 동시 전이는 결정 1, 2·3장 동시 승인은 결정 1·2, 3장 동시 준비 500은 결정 3, 4장 서버마다 도는 보정은 결정 5, 4장 인증 상태의 같은 키 409는 결정 2, 5장 같은 키 동시 취소는 결정 4, 남은 금액을 넘는 취소는 결정 1, 6장 처리기와 API의 동시 변경은 결정 1, 서버마다 도는 처리기는 결정 5가 맡고, 4장 보정과 같은 결제 키 재요청의 겹침은 따로 시험하지 않았다</title>
  <style>
