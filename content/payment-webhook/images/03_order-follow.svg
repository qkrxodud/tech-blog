  <circle cx="40" cy="318" r="11" fill="#111827"/><text x="40" y="322" class="num" text-anchor="middle">3</text>
  <text x="200" y="315" class="t2" text-anchor="middle">승인이 남은 결제?</text>
  <text x="200" y="332" class="s" text-anchor="middle">승인 · 매입</text>
  <line x1="360" y1="318" x2="384" y2="318" stroke="#6b7280" stroke-width="1.5" marker-end="url(#agy)"/>
  <rect x="386" y="298" width="186" height="40" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="386" y="298" width="186" height="40" rx="8" fill="none" stroke="#16a34a" stroke-width="3" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.94;0.95;0.998;0.999;1"/></rect>
  <text x="400" y="314" class="gt">아니오 → 아무것도 안 함</text>
  <text x="400" y="330" class="gs">이미 지난 상태 — 거부하지 않음</text>
  <line x1="200" y1="350" x2="200" y2="366" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <rect x="60" y="368" width="280" height="50" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <rect x="60" y="368" width="280" height="50" rx="10" fill="none" stroke="#16a34a" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5048;0.5148;0.5648;0.5748;1"/></rect>
  <circle cx="60" cy="368" r="11" fill="#111827"/><text x="60" y="372" class="num" text-anchor="middle">4</text>
  <use href="#i-doc" x="78" y="378"/>
  <text x="122" y="389" class="t2">PG 취소를 들여옴</text>
  <text x="122" y="406" class="s">모르는 <tspan class="m">transactionKey</tspan> · 남은 0원</text>
  <rect x="386" y="373" width="186" height="40" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.2"/>
  <text x="400" y="389" class="oks"><tspan class="m">fromGateway</tspan> → DONE</text>
  <text x="400" y="405" class="oks">0원이면 <tspan class="m">cancel()</tspan></text>
  <line x1="340" y1="393" x2="384" y2="393" stroke="#16a34a" stroke-width="1.5" marker-end="url(#agr)"/>
