<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 492" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결정 1 선택지 비교 — 남기고 따로 보냄(고름)은 상태 UPDATE와 같은 트랜잭션에서 payment_outbox에 한 줄 남기고 커밋 뒤 보내지 않아 응답 계약을 통과하고 결정 2 릴레이 뒤 유실·유령도 통과하며 비용은 도착 지연이다. 바로 보냄(출발 구조)은 트랜잭션 안에서 send와 join()으로 답을 기다려 유실·유령·응답 1.53초가 실패한다. 커밋 뒤 보냄은 트랜잭션 안에서 Spring 이벤트만 내고 커밋 뒤 리스너가 send와 join()을 해 유령은 통과하지만 유실과 응답 1.53초가 실패한다. Kafka 트랜잭션과 DB 트랜잭션을 함께 묶는 방법은 구현하지 않았고 비교로 돌리지 않았다</title>
