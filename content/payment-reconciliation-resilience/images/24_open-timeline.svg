  <text x="457.5" y="196" class="bads" text-anchor="middle" style="font-size:10px">새 승인도 카드사에 보내지 않고 바로 실패</text>
  <text x="457.5" y="212" class="gs" text-anchor="middle" style="font-size:9.5px">카드사가 돌아와도 · 측정하지 않음</text>
  <line x1="187.5" y1="116" x2="187.5" y2="226" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/>
