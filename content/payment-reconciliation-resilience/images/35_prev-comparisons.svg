  <rect width="760" height="396" fill="#ffffff"/>
  <text x="24" y="28" class="h"><tspan class="m">./gradlew knownFailingTest</tspan> — 비교 구현 746개 중 214개 실패</text>
  <text x="24" y="48" class="gs" style="font-size:11px">결정 5 커밋과 같은 코드 · 계약을 지키지 못하는 비교 구현을 따로 돌림</text>
  <text x="24" y="136" class="t2" style="font-size:12px">↑ 12장 비교 9개 — 95개 중 46개 실패</text>
  <text x="118.67024128686327" y="78" class="t2" style="font-size:12px">2~11장 비교 — 651개 중 168개 실패</text>
