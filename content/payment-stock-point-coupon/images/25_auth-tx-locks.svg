  <circle cx="168" cy="72" r="10" fill="#111827"/><text x="168" y="76" class="num" text-anchor="middle">2</text>
  <use href="#i-box" transform="translate(180,82) scale(0.85)"/>
  <text x="218" y="92" class="t2" style="font-size:12px">재고 줄</text>
  <text x="218" y="110" class="s" style="font-size:10px">상품 번호 순</text>
  <rect x="312" y="72" width="132" height="48" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="312" cy="72" r="10" fill="#111827"/><text x="312" y="76" class="num" text-anchor="middle">3</text>
  <use href="#i-ticket" transform="translate(324,81) scale(0.85)"/>
  <text x="362" y="92" class="t2" style="font-size:12px">쿠폰 줄</text>
  <text x="362" y="110" class="s" style="font-size:10px"><tspan class="m">USED</tspan>로</text>
  <rect x="456" y="72" width="132" height="48" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="456" cy="72" r="10" fill="#111827"/><text x="456" y="76" class="num" text-anchor="middle">4</text>
  <use href="#i-point" transform="translate(468,82) scale(0.85)"/>
  <text x="506" y="92" class="t2" style="font-size:12px">포인트 줄</text>
  <text x="506" y="110" class="s" style="font-size:10px">잔액 조건부</text>
