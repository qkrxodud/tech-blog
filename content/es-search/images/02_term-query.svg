<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 476" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>term 쿼리는 keyword와 숫자 필드에서 저장된 값과 정확히 같은 검색어일 때만 도큐먼트를 조회한다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .mono { font-size: 13px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .monob { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .grp { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .ko { font-size: 13px; fill: #374151; }
    .kocode { font-size: 13px; fill: #6b7280; }
    .kob { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .okk { font-size: 14px; font-weight: 700; fill: #15803d; }
    .badk { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .brk { stroke: #9ca3af; stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="476" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="250" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <rect x="10" y="276" width="740" height="190" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">term — 저장된 값과 정확히 같을 때만</text>
  <text x="730" y="42" class="code" text-anchor="end">category: keyword</text>
  <text x="30" y="79" class="sub">저장된 값</text>
  <rect x="170" y="60" width="114.44" height="30" rx="6" class="hold"/>
  <text x="227.22" y="79.5" class="kob" text-anchor="middle">"자유 게시판"</text>
  <text x="316" y="80" class="sub">keyword는 문자열 전체가 하나의 값으로 저장됩니다</text>
  <line x1="30" y1="104" x2="730" y2="104" class="axis"/>
  <text x="30" y="136" class="sub">term 검색</text>
  <rect x="170" y="116" width="250" height="30" rx="6" class="box"/>
  <text x="295" y="135.5" class="ko" text-anchor="middle">"category": "자유"</text>
  <line x1="426" y1="131" x2="470" y2="131" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="476" y="116" width="244" height="30" rx="15" class="bad"/>
  <text x="598" y="136" class="badt" text-anchor="middle">조회 안 됨 — 일부만 같음</text>
  <rect x="170" y="160" width="250" height="30" rx="6" class="box"/>
  <text x="295" y="179.5" class="ko" text-anchor="middle">"category": "자유게시판"</text>
  <line x1="426" y1="175" x2="470" y2="175" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="476" y="160" width="244" height="30" rx="15" class="bad"/>
  <text x="598" y="180" class="badt" text-anchor="middle">조회 안 됨 — 띄어쓰기 다름</text>
  <rect x="170" y="204" width="250" height="30" rx="6" class="box"/>
  <text x="295" y="223.5" class="ko" text-anchor="middle">"category": "자유 게시판"</text>
  <line x1="426" y1="219" x2="470" y2="219" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="476" y="204" width="244" height="30" rx="15" class="ok"/>
  <text x="598" y="224" class="okt" text-anchor="middle">1번 도큐먼트 조회</text>
  <text x="30" y="308" class="h">term — 숫자 필드도 같은 값만</text>
  <text x="730" y="308" class="code" text-anchor="end">board_id: long</text>
  <text x="30" y="345" class="sub">저장된 값</text>
  <rect x="170" y="326" width="101" height="30" rx="6" class="hold"/>
  <text x="220.5" y="345.5" class="monob" text-anchor="middle">1 · 2 · 3</text>
  <line x1="30" y1="370" x2="730" y2="370" class="axis"/>
  <text x="30" y="402" class="sub">term 검색</text>
  <rect x="170" y="382" width="250" height="30" rx="6" class="box"/>
  <text x="295" y="401.5" class="mono" text-anchor="middle">"board_id": 13</text>
  <line x1="426" y1="397" x2="470" y2="397" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="476" y="382" width="244" height="30" rx="15" class="bad"/>
  <text x="598" y="402" class="badt" text-anchor="middle">조회 안 됨 — 13이 없음</text>
  <rect x="170" y="422" width="250" height="30" rx="6" class="box"/>
  <text x="295" y="441.5" class="mono" text-anchor="middle">"board_id": 1</text>
  <line x1="426" y1="437" x2="470" y2="437" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="476" y="422" width="244" height="30" rx="15" class="ok"/>
  <text x="598" y="442" class="okt" text-anchor="middle">1번 도큐먼트 조회</text>
</svg>
