  <text x="558" y="506" class="lbl" text-anchor="middle" style="fill: #15803d; font-weight: 700">한 트랜잭션</text>
  <text x="558" y="522" class="lbl" text-anchor="middle" style="fill: #15803d"><tspan class="m">Payment.follow</tspan> + 알림 <tspan class="m">PROCESSED</tspan></text>
  <line x1="449" y1="530" x2="674" y2="530" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <circle cx="440" cy="530" r="9" fill="#111827"/><text x="440" y="534" class="num" text-anchor="middle">9</text>
  <line x1="674" y1="542" x2="442" y2="542" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#agy)"/>
  <line x1="12" y1="560" x2="748" y2="560" stroke="#e5e7eb" stroke-width="1"/>
  <circle cx="22" cy="578" r="8" fill="#ef4444"/><text x="22" y="582" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="36" y="582" class="bads">모르는 주문이면 PG에 묻지 않고 알림을 <tspan class="m">IGNORED</tspan>로 닫음</text>
  <circle cx="22" cy="598" r="8" fill="#ef4444"/><text x="22" y="602" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="36" y="602" class="bads">조회에 답이 없거나 오류면 <tspan class="m">RECEIVED</tspan> 그대로, <tspan class="m">failed_lookups + 1</tspan> — 다음 주기에 다시 봄</text>
  <circle cx="22" cy="618" r="8" fill="#ef4444"/><text x="22" y="622" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <text x="36" y="622" class="gs">다른 <tspan class="m">eventType</tspan>이나 주문번호 없는 알림은 남기지 않고 <tspan class="m">200</tspan> · 읽을 수 없는 본문은 <tspan class="m">400 INVALID_INPUT</tspan></text>
  <circle cx="22" cy="638" r="8" fill="#ef4444"/><text x="22" y="642" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">D</text>
  <text x="36" y="642" class="gs"><tspan class="m">404 NOT_FOUND_PAYMENT</tspan>는 <tspan class="m">NOT_FOUND</tspan>로 읽고 결제를 그대로 둠(결정 1)</text>
