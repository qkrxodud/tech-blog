<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>검색 요청의 isOnlyNotBlocked가 true이면 nonBlocked 스펙을 추가하고, 이름에 글자가 없으면 nameLike를 건너뛴 뒤 toSpec에서 where(null)부터 모은 스펙을 and로 합쳐 findAll에 넘기는 스펙 빌더의 흐름</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .op2 { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #1f2937; }
    .okc2 { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badc2 { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .monos { font-family: Menlo, Consolas, monospace; font-size: 12.5px; fill: #374151; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="agy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="760" height="490" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="470" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">스펙 빌더 — 조건이 맞을 때만 스펙을 모아 and로 합침</text>
  <text x="730" y="42" class="code" text-anchor="end">SpecBuilder</text>
  <rect x="40" y="58" width="680" height="34" rx="6" class="dbbox"/>
  <text x="56" y="80" class="val">검색 요청 <tspan font-family="Menlo, Consolas, monospace">onlyNotBlocked = true, name = ""</tspan></text>
  <text x="175" y="114" class="step" text-anchor="middle">빌더 메서드</text>
  <text x="400" y="114" class="step" text-anchor="middle">조건 확인</text>
  <text x="620" y="114" class="step" text-anchor="middle">specs 목록</text>
  <rect x="40" y="124" width="270" height="48" rx="8" class="box"/>
  <text x="175" y="144" class="op2" text-anchor="middle">ifTrue(</text>
  <text x="175" y="162" class="monos" text-anchor="middle">isOnlyNotBlocked(), …)</text>
  <line x1="314" y1="148" x2="336" y2="148" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#agy)"/>
  <rect x="340" y="124" width="120" height="48" rx="8" class="ok"/>
  <text x="400" y="154" class="okc" text-anchor="middle">true</text>
  <line x1="464" y1="148" x2="516" y2="148" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="520" y="124" width="200" height="48" rx="8" class="ok"/>
  <text x="620" y="144" class="okt" text-anchor="middle">추가</text>
  <text x="620" y="162" class="monos" text-anchor="middle">nonBlocked()</text>
  <rect x="40" y="184" width="270" height="48" rx="8" class="box"/>
  <text x="175" y="204" class="op2" text-anchor="middle">ifHasText(</text>
  <text x="175" y="222" class="monos" text-anchor="middle">getName(), …)</text>
  <line x1="314" y1="208" x2="336" y2="208" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#agy)"/>
  <rect x="340" y="184" width="120" height="48" rx="8" class="bad"/>
  <text x="400" y="204" class="badt" text-anchor="middle">글자 없음</text>
  <text x="400" y="222" class="monos" text-anchor="middle">""</text>
  <line x1="464" y1="208" x2="516" y2="208" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#agy)"/>
  <rect x="520" y="190" width="200" height="36" rx="6" class="wait"/>
  <text x="620" y="213" class="waitt" text-anchor="middle">건너뜀 (nameLike 안 넣음)</text>
  <line x1="380" y1="240" x2="380" y2="258" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#agy)"/>
  <rect x="40" y="262" width="680" height="46" rx="10" class="hold"/>
  <circle cx="68" cy="285" r="12" fill="#6b7280"/>
  <text x="68" y="290" class="num" text-anchor="middle">1</text>
  <text x="92" y="290" class="t">모인 스펙</text>
  <text x="200" y="290" class="mono">specs = [nonBlocked()]</text>
  <line x1="380" y1="310" x2="380" y2="326" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#agy)"/>
  <rect x="40" y="330" width="680" height="46" rx="10" class="box"/>
  <circle cx="68" cy="353" r="12" fill="#6b7280"/>
  <text x="68" y="358" class="num" text-anchor="middle">2</text>
  <text x="92" y="358" class="op2">toSpec()</text>
  <text x="200" y="358" class="mono">where(null).and(nonBlocked())</text>
  <line x1="380" y1="378" x2="380" y2="394" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="40" y="398" width="680" height="46" rx="10" class="ok"/>
  <text x="380" y="426" class="okc" text-anchor="middle">memberDataDao.findAll(spec, PageRequest.of(0, 5))</text>
  <text x="40" y="466" class="sub">if 문은 빌더 안에 한 번만 있고, 사용하는 쪽은 조건과 스펙만 나열함</text>
</svg>
