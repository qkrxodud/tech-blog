<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 464" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>fly()와 swim()이 한 인터페이스에 있으면 Penguin도 fly()를, Sparrow도 swim()을 구현해야 하고, Flyable과 Swimmable로 나누면 Sparrow는 fly()만, Penguin은 swim()만 구현하는 그림</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .bt { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .gl { font-size: 12.5px; font-weight: 700; fill: #6b7280; }
    .cv { font-family: Menlo, Consolas, monospace; font-size: 12.5px; fill: #4b5563; }
    .cvb { font-family: Menlo, Consolas, monospace; font-size: 12.5px; fill: #b91c1c; }
    .cvg { font-family: Menlo, Consolas, monospace; font-size: 12.5px; fill: #15803d; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="464" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="214" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">ISP 적용 전 — fly()와 swim()이 한 인터페이스에 있을 때</text>
  <rect x="270" y="58" width="220" height="50" rx="8" class="hold"/>
  <text x="380" y="78" class="val" text-anchor="middle">하나의 인터페이스</text>
  <text x="380" y="98" class="opm" text-anchor="middle">fly() + swim()</text>
  <rect x="40" y="138" width="320" height="52" rx="8" class="box"/>
  <text x="56" y="170" class="op">Sparrow</text>
  <rect x="150" y="148" width="96" height="32" rx="6" class="ok"/>
  <text x="198" y="169" class="okc" text-anchor="middle">fly()</text>
  <rect x="254" y="148" width="96" height="32" rx="6" class="bad"/>
  <text x="302" y="169" class="badc" text-anchor="middle">swim()</text>
  <rect x="400" y="138" width="320" height="52" rx="8" class="box"/>
  <text x="416" y="170" class="op">Penguin</text>
  <rect x="510" y="148" width="96" height="32" rx="6" class="bad"/>
  <text x="558" y="169" class="badc" text-anchor="middle">fly()</text>
  <rect x="614" y="148" width="96" height="32" rx="6" class="ok"/>
  <text x="662" y="169" class="okc" text-anchor="middle">swim()</text>
  <line x1="200" y1="136" x2="300" y2="111" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="560" y1="136" x2="460" y2="111" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="30" y="210" class="note">빨간 메서드는 그 새에게 필요하지 않지만, 인터페이스를 구현하려면 함께 구현해야 합니다.</text>

  <rect x="10" y="240" width="740" height="214" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="272" class="h">ISP 적용 후 — Flyable과 Swimmable로 분리</text>
  <rect x="120" y="290" width="180" height="50" rx="8" class="hold"/>
  <text x="210" y="311" class="op" text-anchor="middle">Flyable</text>
  <text x="210" y="330" class="cv" text-anchor="middle">fly()</text>
  <rect x="460" y="290" width="180" height="50" rx="8" class="hold"/>
  <text x="550" y="311" class="op" text-anchor="middle">Swimmable</text>
  <text x="550" y="330" class="cv" text-anchor="middle">swim()</text>
  <rect x="120" y="380" width="180" height="50" rx="8" class="ok"/>
  <text x="210" y="401" class="okc" text-anchor="middle">Sparrow</text>
  <text x="210" y="420" class="val" text-anchor="middle">fly()만 구현</text>
  <rect x="460" y="380" width="180" height="50" rx="8" class="ok"/>
  <text x="550" y="401" class="okc" text-anchor="middle">Penguin</text>
  <text x="550" y="420" class="val" text-anchor="middle">swim()만 구현</text>
  <line x1="210" y1="378" x2="210" y2="343" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="550" y1="378" x2="550" y2="343" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <text x="220" y="365" class="sub">implements</text>
  <text x="560" y="365" class="sub">implements</text>
  <text x="30" y="446" class="gnote">각 새는 자신에게 필요한 인터페이스만 구현합니다.</text>
</svg>
