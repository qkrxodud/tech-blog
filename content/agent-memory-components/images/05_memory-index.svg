<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>매 세션 자동으로 실리는 MEMORY.md에는 한 줄짜리 목차만 두고, 각 항목이 가리키는 메모리 파일은 아래층에 두었다가 필요할 때 열어 읽는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="410" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="390" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">맨 윗층과 아래층 — MEMORY.md에는 목차만 둔다</text>
  <text x="30" y="104" class="lane">맨 윗층</text>
  <text x="30" y="122" class="sub">매 세션 자동으로 실림</text>
  <rect x="150" y="62" width="585" height="112" rx="8" class="hold"/>
  <text x="166" y="88" class="op">MEMORY.md</text>
  <text x="719" y="88" class="gnote" text-anchor="end">처음 200줄 또는 25KB만 컨텍스트에 실림</text>
  <text x="166" y="116" class="val">- 블로그 말투는 기존 글에 맞춘다 → <tspan font-family="Menlo, Consolas, monospace">blog-tone-match-existing.md</tspan></text>
  <text x="166" y="138" class="val">- 답변은 한국어로 → <tspan font-family="Menlo, Consolas, monospace">reply-in-korean.md</tspan></text>
  <text x="166" y="160" class="val">- GC 챌린지는 진행 중인 연재 → <tspan font-family="Menlo, Consolas, monospace">gc-challenge-series-ongoing.md</tspan></text>
  <text x="30" y="262" class="lane">아래층</text>
  <text x="30" y="280" class="sub">필요할 때 읽음</text>
  <rect x="150" y="236" width="250" height="48" rx="8" class="box"/>
  <text x="275" y="265" class="code" text-anchor="middle">blog-tone-match-existing.md</text>
  <rect x="412" y="236" width="200" height="48" rx="8" class="box"/>
  <text x="512" y="265" class="code" text-anchor="middle">reply-in-korean.md</text>
  <rect x="624" y="236" width="111" height="48" rx="8" class="box"/>
  <text x="679" y="265" class="code" text-anchor="middle">…</text>
  <line x1="275" y1="175" x2="275" y2="234" stroke="#c4c8ce" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <line x1="512" y1="175" x2="512" y2="234" stroke="#c4c8ce" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="284" y="210" class="step">필요할 때 열어 읽음</text>
  <text x="30" y="324" class="note">맨 윗층이 길어지면 — 토큰을 더 쓰고, 틀린 노트가 모든 세션으로 퍼지고, 지시를 잘 따르지 않게 된다</text>
  <text x="30" y="350" class="gnote">드리밍은 세부를 아래층으로 내리고 링크만 남겨 맨 윗층을 작게 유지한다</text>
  <text x="30" y="380" class="sub">목차 예시는 이 블로그 작업에 쓰는 MEMORY.md에서 가져왔다.</text>
</svg>
