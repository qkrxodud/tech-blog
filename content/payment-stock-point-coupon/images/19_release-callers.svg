  <circle cx="268" cy="84" r="10" fill="#111827"/><text x="268" y="88" class="num" text-anchor="middle">1</text>
  <use href="#i-lock" transform="translate(284,92) scale(0.95)"/>
  <text x="326" y="104" class="t2" style="font-size:12px">결제 줄을 잠그고 읽음</text>
  <text x="326" y="121" class="s" style="font-size:10px"><tspan class="m">findByOrderIdForUpdate</tspan> (7장)</text>
  <rect x="268" y="146" width="264" height="46" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="268" cy="146" r="10" fill="#111827"/><text x="268" y="150" class="num" text-anchor="middle">2</text>
  <use href="#i-doc" transform="translate(284,154) scale(0.95)"/>
  <text x="326" y="166" class="t2" style="font-size:12px">바꾸기 전 상태를 듦</text>
  <text x="326" y="183" class="s" style="font-size:10px"><tspan class="m">before = payment.getStatus()</tspan></text>
  <rect x="268" y="208" width="264" height="46" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="268" cy="208" r="10" fill="#111827"/><text x="268" y="212" class="num" text-anchor="middle">3</text>
  <use href="#i-chips" transform="translate(284,216) scale(0.95)"/>
  <text x="326" y="228" class="t2" style="font-size:12px">결제를 바꿈</text>
  <text x="326" y="245" class="s" style="font-size:10px">승인 · 승인 실패 · 보정 · 취소 · 알림</text>
  <path d="M400,270 L532,320 L400,370 L268,320 Z" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <circle cx="268" cy="320" r="10" fill="#111827"/><text x="268" y="324" class="num" text-anchor="middle">4</text>
  <text x="400" y="312" class="t2" text-anchor="middle" style="font-size:11.5px"><tspan class="m">releaseIfClosed</tspan></text>
  <text x="400" y="330" class="s" text-anchor="middle" style="font-size:10.5px">before 쥠 · 지금 돌려줄 상태?</text>
  <line x1="400" y1="372" x2="400" y2="396" stroke="#16a34a" stroke-width="1.4" marker-end="url(#agr)"/>
  <text x="410" y="389" class="oks" style="font-size:11px">참</text>
  <rect x="268" y="398" width="452" height="98" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="284" y="420" class="okt" style="font-size:12.5px"><tspan class="m">release</tspan> — 잡을 때와 같은 순서</text>
  <use href="#i-box" transform="translate(286,428) scale(0.62)"/>
  <text x="310" y="442" class="oks" style="font-size:11px">재고 += 수량(상품 번호 순)</text>
  <use href="#i-ticket" transform="translate(286,450) scale(0.62)"/>
  <text x="310" y="464" class="oks" style="font-size:11px">이 결제가 쓴 <tspan class="m">USED</tspan> 쿠폰만 <tspan class="m">ISSUED</tspan>로</text>
  <use href="#i-point" transform="translate(286,472) scale(0.62)"/>
  <text x="310" y="486" class="oks" style="font-size:11px">포인트: <tspan class="m">RESTORE</tspan> 이력이 들어간 때만 잔액 +=</text>
  <line x1="534" y1="320" x2="556" y2="320" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#agy)"/>
  <rect x="558" y="286" width="162" height="68" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="570" y="306" class="gt" style="font-size:12px">거짓 → 그대로</text>
  <text x="570" y="324" class="gs" style="font-size:10.5px">승인·부분 취소로 바꾼 기록</text>
  <text x="570" y="340" class="gs" style="font-size:10.5px">이미 닫힌 결제를 본 기록</text>
  <text x="268" y="516" class="bs" style="font-size:10.5px">겹쳐 닫은 나중 기록은 이미 승인 실패가 된 결제를 읽음 → before가 돌려줄 상태라 거짓</text>
  <text x="268" y="534" class="bs" style="font-size:10px">판단: <tspan class="m">before.keepsHoldings() &amp;&amp; status.dropsHoldings()</tspan></text>
  <rect x="24" y="76" width="190" height="60" rx="10" fill="none" stroke="#2563eb" stroke-width="3.5" opacity="0" class="anim"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.01;0.02;0.07;0.08;1"/></rect>
