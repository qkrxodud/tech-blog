  <circle cx="270" cy="556" r="9" fill="#111827"/><text x="270" y="560" class="num" text-anchor="middle" style="font-size: 11px">11</text>
  <text x="294" y="556" class="t2" style="font-size: 12.5px">금액 확인 → 이미 결과가 있나</text>
  <text x="294" y="572" class="oks" style="font-size: 11px">같은 금액 · 예 — PG 호출 없음</text>
  <line x1="261" y1="598" x2="72" y2="598" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#agr)"/>
