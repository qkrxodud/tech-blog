<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>teamA에 member1(10), member2(20)이 소속되고 teamB에 member3(30), member4(40)이 소속된 테스트 데이터</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .thead { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .chip { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 13px; font-weight: 700; fill: #15803d; }
    .okm { font-size: 12px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="280" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="260" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">테스트 데이터 — 팀 2개와 회원 4명</text>
  <text x="730" y="42" class="code" text-anchor="end">testEntity()</text>
  <rect x="30" y="66" width="340" height="150" rx="8" class="box"/>
  <rect x="30" y="66" width="340" height="32" rx="8" class="thead"/>
  <text x="200" y="88" class="mb" text-anchor="middle">teamA</text>
  <rect x="46" y="116" width="146" height="80" rx="6" class="chip"/>
  <text x="119" y="146" class="mb" text-anchor="middle">member1</text>
  <text x="119" y="168" class="m" text-anchor="middle">age 10</text>
  <rect x="208" y="116" width="146" height="80" rx="6" class="chip"/>
  <text x="281" y="146" class="mb" text-anchor="middle">member2</text>
  <text x="281" y="168" class="m" text-anchor="middle">age 20</text>
  <rect x="390" y="66" width="340" height="150" rx="8" class="box"/>
  <rect x="390" y="66" width="340" height="32" rx="8" class="thead"/>
  <text x="560" y="88" class="mb" text-anchor="middle">teamB</text>
  <rect x="406" y="116" width="146" height="80" rx="6" class="chip"/>
  <text x="479" y="146" class="mb" text-anchor="middle">member3</text>
  <text x="479" y="168" class="m" text-anchor="middle">age 30</text>
  <rect x="568" y="116" width="146" height="80" rx="6" class="chip"/>
  <text x="641" y="146" class="mb" text-anchor="middle">member4</text>
  <text x="641" y="168" class="m" text-anchor="middle">age 40</text>
  <text x="30" y="250" class="foot">생성자 <tspan font-family="Menlo, Consolas, monospace">new Member("member1", 10, teamA)</tspan>처럼 이름, 나이, 팀을 함께 넘깁니다.</text>
</svg>
