<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>RAM보다 큰 프로그램은 통째로 올릴 수 없고, 여러 프로그램을 올리면 A와 B만 들어가고 C는 자리가 없는 두 경우</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .seg { font-size: 13px; font-weight: 700; fill: #374151; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opk { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .dia { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .lbl { font-size: 12.5px; font-weight: 700; fill: #6b7280; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="500" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="220" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">경우 1 — 프로그램 하나가 RAM보다 큼</text>
  <rect x="120" y="60" width="150" height="156" rx="12" class="bad"/>
  <text x="195" y="134" class="badt" text-anchor="middle">프로그램 A</text>
  <text x="195" y="154" class="s" text-anchor="middle">실행 파일 전체</text>
  <rect x="380" y="96" width="140" height="84" rx="12" class="hold"/>
  <text x="450" y="143" class="t" text-anchor="middle">RAM</text>
  <line x1="272" y1="138" x2="376" y2="138" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="540" y="132" class="note">A를 통째로 올릴 수 없음</text>
  <text x="540" y="152" class="sub">필요한 부분만 올려야 합니다</text>
  <rect x="10" y="246" width="740" height="244" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="278" class="h">경우 2 — 여러 프로그램을 동시에 올림</text>
  <rect x="40" y="312" width="110" height="96" rx="12" class="box"/>
  <text x="95" y="365" class="t" text-anchor="middle">프로그램 A</text>
  <rect x="165" y="330" width="110" height="60" rx="12" class="box"/>
  <text x="220" y="365" class="t" text-anchor="middle">프로그램 B</text>
  <rect x="290" y="318" width="110" height="84" rx="12" class="bad"/>
  <text x="345" y="356" class="badt" text-anchor="middle">프로그램 C</text>
  <text x="345" y="376" class="note" text-anchor="middle">자리 없음</text>
  <line x1="410" y1="360" x2="494" y2="360" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="452" y="350" class="lbl" text-anchor="middle">적재</text>
  <rect x="500" y="292" width="220" height="180" rx="12" class="hold"/>
  <text x="610" y="312" class="t" text-anchor="middle">RAM</text>
  <rect x="515" y="322" width="190" height="86" rx="10" class="ok"/>
  <text x="610" y="370" class="okt" text-anchor="middle">프로그램 A</text>
  <rect x="515" y="414" width="190" height="48" rx="10" class="ok"/>
  <text x="610" y="443" class="okt" text-anchor="middle">프로그램 B</text>
  <text x="40" y="450" class="note">A, B를 올리고 나면 C가 들어갈 자리가 남지 않습니다</text>
</svg>
