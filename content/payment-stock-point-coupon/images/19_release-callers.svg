<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>결제를 바꾸는 기록 다섯 곳이 돌려주는 순서 — 승인 답 기록 PaymentRecorder.recordApproval, 결과 모름 보정 PaymentRecorder.recordInquiry, 취소 답 기록 PaymentCancelRecorder.recordOutcome, 취소 보정 PaymentCancelRecorder.recordInquiry, 알림 반영 PaymentWebhookRecorder.follow가 모두 7장의 결제 줄 잠금(findByOrderIdForUpdate)으로 결제를 읽고, 바꾸기 전 상태(before)를 들고, 결제를 바꾼 뒤 같은 트랜잭션에서 releaseIfClosed를 부름. releasesHoldingsFrom이 before가 쥐는 상태이고 지금 상태가 돌려줄 상태일 때만 참이라 release로 재고 += 수량, 이 결제가 쓴 쿠폰만 ISSUED, 포인트는 RESTORE 이력이 들어간 때만 잔액 +=. 같은 거절을 겹쳐 닫은 나중 기록은 이미 승인 실패가 된 결제를 읽어 before가 돌려줄 상태라 거짓이 되고 그대로 둠. 승인이나 부분 취소로 바꾼 기록도 거짓</title>
