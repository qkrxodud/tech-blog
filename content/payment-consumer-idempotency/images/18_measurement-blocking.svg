<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>막는 시간 측정(주문 서비스, 방식마다 3번씩 두 번 실행, 로그 눈금) — 일시 오류 결과 뒤 같은 파티션 결과가 반영되기까지 운영(blocking + DLT)은 첫 실행 15813~15933ms·두 번째 15736~15759ms, 로그만 15839~15969ms·15700~15753ms, DB 실패 표 15764~15889ms·15708~15794ms로 다시 시도 합 15초 근처이고, 기본 처리는 4630~4650ms·4572~4599ms, 다시 시도 토픽은 45~48ms·41~50ms임. 영구 오류 뒤는 운영 58~70ms·42~46ms, 기본 처리 4612~4618ms·4572~4605ms, 다시 시도 토픽 49~57ms·46~51ms, 로그만 56~62ms·46~55ms, DB 실패 표 48~65ms·45~52ms이고, 운영의 일시 오류 값은 두 실행 범위가 겹치지 않아 따로 적은 그림</title>
