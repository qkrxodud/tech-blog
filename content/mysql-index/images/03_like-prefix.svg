<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>name 인덱스에서 LIKE Mouse%는 정렬 순서에서 Mouse로 시작하는 구간만 찾아 인덱스를 사용하고, 앞부분이 정해지지 않은 중간·접미사 검색은 정렬 순서를 쓸 수 없어 인덱스를 활용할 수 없다는 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .grp { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ko { font-size: 13px; fill: #374151; }
    .mono { font-size: 13px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .monob { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .colh { font-size: 12px; font-weight: 700; fill: #9ca3af; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .flow { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .edge { stroke: #c4c8ce; stroke-width: 1.4; fill: none; }
    .gedge { stroke: #16a34a; stroke-width: 2.2; fill: none; }
    .redge { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="185" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">접두사 검색 — 정렬된 순서에서 시작 위치를 찾음</text>
  <text x="730" y="42" class="code" text-anchor="end">LIKE 'Mouse%'</text>
  <rect x="30" y="70" width="128" height="40" rx="8" class="hold"/>
  <text x="94" y="95" class="mono" text-anchor="middle">Keyboard</text>
  <rect x="171" y="70" width="128" height="40" rx="8" class="hold"/>
  <text x="235" y="95" class="mono" text-anchor="middle">Laptop</text>
  <rect x="312" y="70" width="128" height="40" rx="8" class="hold"/>
  <text x="376" y="95" class="mono" text-anchor="middle">Monitor</text>
  <rect x="453" y="70" width="128" height="40" rx="8" class="ok"/>
  <text x="517" y="95" class="okm" text-anchor="middle">Mouse</text>
  <rect x="594" y="70" width="128" height="40" rx="8" class="hold"/>
  <text x="658" y="95" class="mono" text-anchor="middle">USB Drive</text>
  <path d="M455,122 V128 H579 V122" class="gedge"/>
  <text x="517" y="146" class="gnote" text-anchor="middle">이 구간만 확인</text>
  <text x="30" y="174" class="foot">name 순으로 정렬되어 있으므로 'Mouse'로 시작하는 위치를 바로 찾을 수 있습니다.</text>
  <rect x="10" y="205" width="740" height="185" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="237" class="h">중간/접미사 검색 — 시작 위치를 알 수 없음</text>
  <text x="730" y="237" class="code" text-anchor="end">LIKE '%철수%'</text>
  <rect x="30" y="265" width="128" height="40" rx="8" class="bad"/>
  <text x="94" y="290" class="badm" text-anchor="middle">Keyboard</text>
  <rect x="171" y="265" width="128" height="40" rx="8" class="bad"/>
  <text x="235" y="290" class="badm" text-anchor="middle">Laptop</text>
  <rect x="312" y="265" width="128" height="40" rx="8" class="bad"/>
  <text x="376" y="290" class="badm" text-anchor="middle">Monitor</text>
  <rect x="453" y="265" width="128" height="40" rx="8" class="bad"/>
  <text x="517" y="290" class="badm" text-anchor="middle">Mouse</text>
  <rect x="594" y="265" width="128" height="40" rx="8" class="bad"/>
  <text x="658" y="290" class="badm" text-anchor="middle">USB Drive</text>
  <path d="M30,322 H722" class="redge" marker-end="url(#arr)"/>
  <text x="30" y="352" class="foot">앞부분이 정해지지 않으면 정렬 순서를 쓸 수 없어 인덱스를 활용할 수 없습니다.</text>
  <text x="30" y="371" class="foot">모든 값을 처음부터 확인해야 합니다.</text>
</svg>
