<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 584" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>Payment.follow의 규칙 — PG에서 다시 읽은 GatewayPayment(status, cancels)를 받아, 승인 결과를 기다리는 결제(인증, 결과 모름)면 hasApproval(DONE, PARTIAL_CANCELED, CANCELED)일 때 approve(), isDeclined(ABORTED, EXPIRED)일 때 failApproval(), 그 밖(처리 중, NOT_FOUND)은 그대로 둔다. 이어서 승인이 남은 결제(승인, 매입)면 모르는 transactionKey만 골라, 결과를 기다리는 우리 취소와 같은 금액이면 짝지어 DONE으로 닫고, 짝 안 된 PG 취소는 fromGateway로 들여오며, 남은 금액이 0원이면 cancel()한다. 승인이 남지 않은 결제는 이미 지난 상태라 아무것도 하지 않는다. 4장 보정 reconcile()은 승인 결과를 기다리는 결제가 NOT_FOUND면 failApproval()하고, 그 밖은 같은 follow()로 닫는다</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
