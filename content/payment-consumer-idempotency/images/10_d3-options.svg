  <rect x="186" y="394" width="54" height="30" rx="6" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="213" y="413" class="bads" text-anchor="middle" style="font-size:10.5px;">승인 ✕</text>
  <rect x="244" y="394" width="66" height="30" rx="6" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
