  <text x="20" y="458" class="gs" style="font-size:11.5px">결정 1 결제 줄 잠금 · 2 다시 온 승인 202 · 3 중복 거부 잡아 다시 읽기 · 4 잠금 뒤 5장 규칙 · 5 작업 잠금</text>
