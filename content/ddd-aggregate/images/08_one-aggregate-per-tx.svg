<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>위는 Order의 shipTo가 Member의 주소까지 바꾸는 잘못된 구조, 아래는 응용 서비스가 한 트랜잭션 안에서 Order와 Member를 각각 변경하는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .ops { font-size: 11.5px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .src { font-size: 13px; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .grp { fill: #f3f4f6; stroke: #c4c8ce; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .pkg { fill: #ffffff; stroke: #c4c8ce; stroke-width: 1.2; }
    .grpt { font-size: 13px; font-weight: 700; fill: #4b5563; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .edge { stroke: #9ca3af; stroke-width: 1.4; fill: none; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="760" height="530" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="214" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">Order가 Member까지 변경 — 책임 범위를 넘는다</text>
  <text x="730" y="42" class="code" text-anchor="end">Order.shipTo()</text>
  <text x="30" y="86" class="lane">Order</text>
  <text x="30" y="104" class="sub">주문 애그리거트</text>
  <rect x="170" y="60" width="565" height="58" rx="6" class="track"/>
  <text x="30" y="166" class="lane">Member</text>
  <text x="30" y="184" class="sub">회원 애그리거트</text>
  <rect x="170" y="140" width="565" height="58" rx="6" class="track"/>
  <rect x="186" y="65" width="140" height="48" rx="8" class="box"/>
  <text x="256.0" y="84.5" class="ops" text-anchor="middle">shipTo()</text>
  <text x="256.0" y="103.5" class="val" text-anchor="middle">배송지 변경</text>
  <rect x="346" y="65" width="170" height="48" rx="8" class="box"/>
  <text x="431.0" y="84.5" class="ops" text-anchor="middle">verifyNotYetShipped()</text>
  <text x="431.0" y="103.5" class="val" text-anchor="middle">출고 전 확인</text>
  <rect x="536" y="65" width="180" height="48" rx="8" class="bad"/>
  <text x="626.0" y="84.5" class="ops" text-anchor="middle">orderer.getMember()</text>
  <text x="626.0" y="103.5" class="val" text-anchor="middle">다른 애그리거트 접근</text>
  <line x1="327" y1="89" x2="343" y2="89" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="517" y1="89" x2="533" y2="89" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="536" y="145" width="180" height="48" rx="8" class="bad"/>
  <text x="626.0" y="164.5" class="badc" text-anchor="middle">changeAddress()</text>
  <text x="626.0" y="183.5" class="val" text-anchor="middle">회원 주소 변경</text>
  <line x1="626" y1="113" x2="626" y2="143" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="30" y="214" class="note">애그리거트끼리 결합도가 높아지고, 한 트랜잭션에서 두 애그리거트를 수정해 충돌 가능성도 커집니다.</text>
  <rect x="10" y="240" width="740" height="280" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="272" class="h">응용 서비스가 각각 변경 — 애그리거트는 자기 상태만</text>
  <text x="730" y="272" class="code" text-anchor="end">@Transactional</text>
  <text x="30" y="316" class="lane">응용 서비스</text>
  <text x="30" y="334" class="sub">changeOrderService</text>
  <rect x="170" y="290" width="565" height="58" rx="6" class="track"/>
  <text x="30" y="396" class="lane">Order</text>
  <text x="30" y="414" class="sub">주문 애그리거트</text>
  <rect x="170" y="370" width="565" height="58" rx="6" class="track"/>
  <text x="30" y="476" class="lane">Member</text>
  <text x="30" y="494" class="sub">회원 애그리거트</text>
  <rect x="170" y="450" width="565" height="58" rx="6" class="track"/>
  <rect x="250" y="295" width="260" height="48" rx="8" class="box"/>
  <text x="380.0" y="314.5" class="ops" text-anchor="middle">changeShippingInfo()</text>
  <text x="380.0" y="333.5" class="val" text-anchor="middle">한 트랜잭션 안에서 실행</text>
  <rect x="240" y="375" width="120" height="48" rx="8" class="ok"/>
  <text x="300.0" y="394.5" class="okc" text-anchor="middle">shipTo()</text>
  <text x="300.0" y="413.5" class="val" text-anchor="middle">배송지 변경</text>
  <rect x="540" y="455" width="160" height="48" rx="8" class="ok"/>
  <text x="620.0" y="474.5" class="okc" text-anchor="middle">changeAddress()</text>
  <text x="620.0" y="493.5" class="val" text-anchor="middle">회원 주소 변경</text>
  <line x1="300" y1="343" x2="300" y2="373" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
  <line x1="470" y1="343" x2="590" y2="453" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agr)"/>
</svg>
