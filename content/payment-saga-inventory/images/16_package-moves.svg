  <text x="420" y="227" class="s2" style="font-size:10.5px"><tspan class="m">GlobalExceptionHandler</tspan> · <tspan class="m">ErrorResponse</tspan>만</text>
  <circle cx="36" cy="280" r="10" fill="#111827"/><text x="36" y="284" class="num" text-anchor="middle">2</text>
