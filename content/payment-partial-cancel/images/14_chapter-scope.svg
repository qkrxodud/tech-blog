<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>5장이 다루는 것 — 4장 예고의 망취소 비교용 Mock PG 취소 API를 운영 코드에서 쓰는 것과 3장 예고의 부분 취소에서 같은 요청을 가리는 Idempotency-Key, 1장 남은 한계의 "취소는 전액만 가능"을 이어받아 승인된 결제의 취소와 부분 취소를 다룸. 결정마다 다른 선택지를 같은 취소 계약 테스트와 같은 취소 묶음으로 비교함. 결제 서버는 한 대로 보고, 같은 결제에 취소가 동시에 들어오는 경우는 7장 동시성 제어로 넘김. 출발 코드 ch05-start, 완성 코드 ch05</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #4b5563; }
    .m { font-family: Menlo, Consolas, monospace; }
