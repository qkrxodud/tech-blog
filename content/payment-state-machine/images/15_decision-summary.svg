  <rect width="760" height="470" fill="#ffffff"/>
  <text x="24" y="30" class="h">결정 네 가지 한눈에</text>
  <text x="24" y="52" class="gs">출발 코드: 계약 테스트 70개 중 61개 실패 → 완성 코드: 전체 테스트 218개 통과</text>
  <text x="110" y="84" class="gs" style="font-size:11.5px">확인한 문제</text>
  <text x="372" y="84" class="gs" style="font-size:11.5px">고른 것</text>
  <text x="586" y="84" class="gs" style="font-size:11.5px">결과</text>
  <line x1="326" y1="147" x2="342" y2="147" stroke="#1f2937" stroke-width="1.4" marker-end="url(#ak)"/>
  <line x1="558" y1="147" x2="572" y2="147" stroke="#1f2937" stroke-width="1.4" marker-end="url(#ak)"/>
  <rect x="24" y="96" width="76" height="84" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="62" y="144" class="t2" text-anchor="middle" style="font-size:13px">결정 1</text>
  <text x="110" y="110" class="t2" style="font-size:12px">결제 단계를 상태로</text>
  <rect x="110" y="118" width="214" height="58" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="122" y="141" class="bads" style="font-size:10.5px">승인 하나로 묶으면</text>
  <text x="122" y="160" class="bads" style="font-size:10.5px">매입 전후를 가를 수 없음</text>
  <rect x="346" y="118" width="210" height="58" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="356" y="141" class="bt" style="font-size:11.5px">인증 · 승인 · 매입을</text>
  <text x="356" y="160" class="bs" style="font-size:10.5px">상태 필드 하나에(9개)</text>
  <rect x="574" y="118" width="162" height="58" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="586" y="141" class="oks" style="font-size:11px">취소 방향이</text>
  <text x="586" y="160" class="oks" style="font-size:11px">전이 표 한 곳에서 갈라짐</text>
  <line x1="326" y1="239" x2="342" y2="239" stroke="#1f2937" stroke-width="1.4" marker-end="url(#ak)"/>
  <line x1="558" y1="239" x2="572" y2="239" stroke="#1f2937" stroke-width="1.4" marker-end="url(#ak)"/>
  <rect x="24" y="188" width="76" height="84" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="62" y="236" class="t2" text-anchor="middle" style="font-size:13px">결정 2</text>
  <text x="110" y="202" class="t2" style="font-size:12px">전이를 막는 곳</text>
  <rect x="110" y="210" width="214" height="58" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="122" y="233" class="bads" style="font-size:10.5px">현재 상태를 보지 않고 대입</text>
  <text x="122" y="252" class="bads" style="font-size:10.5px">70개 중 61개 실패</text>
  <rect x="346" y="210" width="210" height="58" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="356" y="233" class="bt" style="font-size:11.5px">enum 허용 전이 표</text>
  <text x="356" y="252" class="bs" style="font-size:10.5px"><tspan class="m">changeStatus()</tspan>로만 바꿈</text>
  <rect x="574" y="210" width="162" height="58" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="586" y="233" class="oks" style="font-size:11px">70개 통과</text>
  <text x="586" y="252" class="oks" style="font-size:11px">비교 구현 둘도 통과</text>
  <line x1="326" y1="331" x2="342" y2="331" stroke="#1f2937" stroke-width="1.4" marker-end="url(#ak)"/>
  <line x1="558" y1="331" x2="572" y2="331" stroke="#1f2937" stroke-width="1.4" marker-end="url(#ak)"/>
  <rect x="24" y="280" width="76" height="84" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="62" y="328" class="t2" text-anchor="middle" style="font-size:13px">결정 3</text>
  <text x="110" y="294" class="t2" style="font-size:12px">거부를 알리는 법</text>
  <rect x="110" y="302" width="214" height="58" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="122" y="325" class="bads" style="font-size:10.5px">잘못된 전이가</text>
  <text x="122" y="344" class="bads" style="font-size:10.5px">예외 없이 실행됨</text>
  <rect x="346" y="302" width="210" height="58" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="356" y="325" class="bt" style="font-size:11.5px">예외로 알림</text>
  <text x="356" y="344" class="bs" style="font-size:9.5px"><tspan class="m">InvalidPaymentTransitionException</tspan></text>
  <rect x="574" y="302" width="162" height="58" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="586" y="325" class="s" style="font-size:11px">같은 요청 두 번은 실패</text>
  <text x="586" y="344" class="s" style="font-size:11px">→ 3장 멱등성</text>
  <line x1="326" y1="423" x2="342" y2="423" stroke="#1f2937" stroke-width="1.4" marker-end="url(#ak)"/>
  <line x1="558" y1="423" x2="572" y2="423" stroke="#1f2937" stroke-width="1.4" marker-end="url(#ak)"/>
  <rect x="24" y="372" width="76" height="84" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="62" y="420" class="t2" text-anchor="middle" style="font-size:13px">결정 4</text>
  <text x="110" y="386" class="t2" style="font-size:12px">상태를 DB에</text>
  <rect x="110" y="394" width="214" height="58" rx="10" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/>
  <text x="122" y="417" class="bads" style="font-size:10.5px"><tspan class="m">ORDINAL</tspan>은 상태 추가 때 뜻이 바뀜</text>
  <text x="122" y="436" class="bads" style="font-size:10.5px">Hibernate가 만들면 MySQL <tspan class="m">enum</tspan></text>
  <rect x="346" y="394" width="210" height="58" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="356" y="417" class="bt" style="font-size:11.5px"><tspan class="m">varchar(30)</tspan> 이름 저장</text>
  <text x="356" y="436" class="bs" style="font-size:10.5px"><tspan class="m">schema.sql</tspan>로 직접 관리</text>
  <rect x="574" y="394" width="162" height="58" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="586" y="417" class="oks" style="font-size:11px">새 상태를 그대로 받음</text>
  <text x="586" y="436" class="oks" style="font-size:11px">DB가 값은 검사하지 않음</text>
</svg>
