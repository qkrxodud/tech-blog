<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>정적 컨텐츠는 관련 컨트롤러가 없으면 static 폴더의 파일을 그대로 보내고, MVC는 컨트롤러가 Model에 값을 담아 ViewResolver로 HTML을 만들고, API는 @ResponseBody로 객체를 json으로 보내는 흐름 비교</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .m { font-size: 12.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .mb { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .mxs { font-size: 11px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .chip { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .gscope { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="350" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="330" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">웹 요청 처리 — 정적 컨텐츠, MVC와 템플릿 엔진, API</text>
  <text x="226.0" y="68" class="step" text-anchor="middle">1. 요청 받음</text>
  <text x="371.0" y="68" class="step" text-anchor="middle">2. 컨트롤러 찾기</text>
  <text x="516.0" y="68" class="step" text-anchor="middle">3. 처리</text>
  <text x="661.0" y="68" class="step" text-anchor="middle">4. 응답</text>
  <line x1="160" y1="76" x2="722" y2="76" class="axis" marker-end="url(#ar)"/>
  <text x="30" y="110" class="lane">정적 컨텐츠</text>
  <text x="30" y="128" class="sub">파일을 그대로</text>
  <rect x="150" y="86" width="585" height="60" rx="6" class="track"/>
  <rect x="160" y="92" width="132" height="48" rx="8" class="box"/>
  <text x="226.0" y="112.0" class="t" text-anchor="middle">내장 톰캣</text>
  <text x="226.0" y="131.0" class="val" text-anchor="middle">요청 수신</text>
  <line x1="293" y1="116" x2="303" y2="116" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="305" y="92" width="132" height="48" rx="8" class="hold"/>
  <text x="371.0" y="112.0" class="t" text-anchor="middle">관련 컨트롤러</text>
  <text x="371.0" y="131.0" class="val" text-anchor="middle">없음</text>
  <line x1="438" y1="116" x2="448" y2="116" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="450" y="92" width="132" height="48" rx="8" class="box"/>
  <text x="516.0" y="112.0" class="mxs" text-anchor="middle">static/</text>
  <text x="516.0" y="131.0" class="mxs" text-anchor="middle">hello-static.html</text>
  <line x1="583" y1="116" x2="593" y2="116" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="595" y="92" width="132" height="48" rx="8" class="ok"/>
  <text x="661.0" y="112.0" class="okt" text-anchor="middle">파일 그대로</text>
  <text x="661.0" y="131.0" class="val" text-anchor="middle">전송</text>
  <text x="30" y="182" class="lane">MVC</text>
  <text x="30" y="200" class="sub">템플릿 엔진</text>
  <rect x="150" y="158" width="585" height="60" rx="6" class="track"/>
  <rect x="160" y="164" width="132" height="48" rx="8" class="box"/>
  <text x="226.0" y="184.0" class="t" text-anchor="middle">내장 톰캣</text>
  <text x="226.0" y="203.0" class="val" text-anchor="middle">요청 수신</text>
  <line x1="293" y1="188" x2="303" y2="188" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="305" y="164" width="132" height="48" rx="8" class="box"/>
  <text x="371.0" y="184.0" class="mb" text-anchor="middle">@GetMapping</text>
  <text x="371.0" y="203.0" class="m" text-anchor="middle">"hello"</text>
  <line x1="438" y1="188" x2="448" y2="188" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="450" y="164" width="132" height="48" rx="8" class="box"/>
  <text x="516.0" y="184.0" class="mb" text-anchor="middle">addAttribute</text>
  <text x="516.0" y="203.0" class="m" text-anchor="middle">"hello cozing"</text>
  <line x1="583" y1="188" x2="593" y2="188" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="595" y="164" width="132" height="48" rx="8" class="ok"/>
  <text x="661.0" y="184.0" class="okm" text-anchor="middle">ViewResolver</text>
  <text x="661.0" y="203.0" class="val" text-anchor="middle">HTML로 변환</text>
  <text x="30" y="254" class="lane">API</text>
  <text x="30" y="272" class="code">@ResponseBody</text>
  <rect x="150" y="230" width="585" height="60" rx="6" class="track"/>
  <rect x="160" y="236" width="132" height="48" rx="8" class="box"/>
  <text x="226.0" y="256.0" class="t" text-anchor="middle">내장 톰캣</text>
  <text x="226.0" y="275.0" class="val" text-anchor="middle">요청 수신</text>
  <line x1="293" y1="260" x2="303" y2="260" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="305" y="236" width="132" height="48" rx="8" class="box"/>
  <text x="371.0" y="256.0" class="mb" text-anchor="middle">@GetMapping</text>
  <text x="371.0" y="275.0" class="m" text-anchor="middle">"hello-api"</text>
  <line x1="438" y1="260" x2="448" y2="260" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="450" y="236" width="132" height="48" rx="8" class="box"/>
  <text x="516.0" y="256.0" class="mb" text-anchor="middle">HelloApi</text>
  <text x="516.0" y="275.0" class="val" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">setName</tspan> 후 반환</text>
  <line x1="583" y1="260" x2="593" y2="260" stroke="#c4c8ce" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="595" y="236" width="132" height="48" rx="8" class="ok"/>
  <text x="661.0" y="256.0" class="okm" text-anchor="middle">json</text>
  <text x="661.0" y="275.0" class="val" text-anchor="middle">데이터 그대로</text>
  <text x="30" y="316" class="foot">세 방식 모두 내장 톰캣이 요청을 받고 스프링 컨테이너에서 관련 컨트롤러를 먼저 찾습니다.</text>
</svg>
