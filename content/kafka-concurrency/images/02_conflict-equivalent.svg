  <text x="483" y="335" class="monob" text-anchor="middle">w1(H)</text>
  <rect x="439" y="348" width="88" height="24" rx="6" class="box"/>
  <text x="483" y="365" class="monob" text-anchor="middle">c1</text>
  <text x="653" y="104" class="monob" text-anchor="middle">sched.2</text>
  <text x="653" y="122" class="sub" text-anchor="middle">serial: T2 → T1</text>
  <line x1="653" y1="132" x2="653" y2="376" class="axis" marker-end="url(#ar)"/>
  <rect x="609" y="138" width="88" height="24" rx="6" class="hold"/>
  <text x="653" y="155" class="monob" text-anchor="middle">r2(H)</text>
