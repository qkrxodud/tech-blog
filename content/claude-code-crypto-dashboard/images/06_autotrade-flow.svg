<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>스케줄러 실행, 지표 수집, 정규화, 가중합산, 신호 결정, 멱등성 키 검사, 주문 실행, 텔레그램 알림, 트레일링 스탑 모니터링으로 이어지는 자동매매 9단계</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .ms { font-size: 11.5px; fill: #4b5563; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 12px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .msg { font-size: 11.5px; fill: #374151; }
    .hd { font-size: 10.5px; fill: #374151; }
    .gmsg { font-size: 11.5px; fill: #15803d; }
    .rmsg { font-size: 11.5px; fill: #b91c1c; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .pkg { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .life { stroke: #c4c8ce; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .act { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.2; }
    .foot { font-size: 12.5px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6b7280" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="340" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h" text-anchor="start">자동매매 흐름 — 지표 수집부터 주문 후 모니터링까지 9단계</text>
  <rect x="30" y="74" width="200" height="52" rx="8" class="box"/>
  <text x="130.0" y="96.0" class="t" text-anchor="middle">1. 스케줄러 실행</text>
  <text x="130.0" y="115.0" class="s" text-anchor="middle">매일 오전</text>
  <line x1="232" y1="100" x2="278" y2="100" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="280" y="74" width="200" height="52" rx="8" class="box"/>
  <text x="380.0" y="96.0" class="t" text-anchor="middle">2. 지표 수집</text>
  <text x="380.0" y="115.0" class="s" text-anchor="middle">16개 지표, 외부 API</text>
  <line x1="482" y1="100" x2="528" y2="100" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="530" y="74" width="200" height="52" rx="8" class="box"/>
  <text x="630.0" y="96.0" class="t" text-anchor="middle">3. 정규화</text>
  <text x="630.0" y="115.0" class="s" text-anchor="middle">0~100 스케일링</text>
  <path d="M630,128 L630,146 L130,146 L130,162" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="30" y="164" width="200" height="52" rx="8" class="box"/>
  <text x="130.0" y="186.0" class="t" text-anchor="middle">4. 가중합산</text>
  <text x="130.0" y="205.0" class="s" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">ReadinessScore</tspan> 계산</text>
  <line x1="232" y1="190" x2="278" y2="190" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="280" y="164" width="200" height="52" rx="8" class="box"/>
  <text x="380.0" y="186.0" class="t" text-anchor="middle">5. 신호 결정</text>
  <text x="380.0" y="205.0" class="m" text-anchor="middle">BUY / SELL / HOLD / SKIP</text>
  <line x1="482" y1="190" x2="528" y2="190" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="530" y="164" width="200" height="52" rx="8" class="ok"/>
  <text x="630.0" y="186.0" class="okt" text-anchor="middle">6. 멱등성 키 검사</text>
  <text x="630.0" y="205.0" class="m" text-anchor="middle">UUID + timestamp</text>
  <path d="M630,218 L630,236 L130,236 L130,252" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="30" y="254" width="200" height="52" rx="8" class="hold"/>
  <text x="130.0" y="276.0" class="t" text-anchor="middle">7. 주문 실행</text>
  <text x="130.0" y="295.0" class="s" text-anchor="middle">Bithumb API, 실제/시뮬</text>
  <line x1="232" y1="280" x2="278" y2="280" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="280" y="254" width="200" height="52" rx="8" class="box"/>
  <text x="380.0" y="276.0" class="t" text-anchor="middle">8. 텔레그램 알림</text>
  <text x="380.0" y="295.0" class="s" text-anchor="middle">알림 발송</text>
  <line x1="482" y1="280" x2="528" y2="280" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="530" y="254" width="200" height="52" rx="8" class="box"/>
  <text x="630.0" y="276.0" class="t" text-anchor="middle">9. 트레일링 스탑</text>
  <text x="630.0" y="295.0" class="s" text-anchor="middle">60초 주기 모니터링</text>
  <text x="30" y="336" class="foot" text-anchor="start">6단계의 멱등성 키 검사를 통과한 신호만 주문으로 이어지므로, 같은 신호로 주문이 두 번 나가지 않습니다.</text>
</svg>
