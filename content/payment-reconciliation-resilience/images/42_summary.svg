  <use href="#i-table" transform="translate(328,76) scale(0.6)"/>
  <text x="354" y="92" class="t2" style="font-size:12px">상태 이력</text>
  <text x="322" y="118" class="s2" style="font-size:10.5px;fill:#1f2937">상태를 바꾼</text><text x="322" y="135" class="s2" style="font-size:10.5px;fill:#1f2937">트랜잭션에서</text><text x="322" y="152" class="s2" style="font-size:10.5px;fill:#1f2937">이전·다음 상태, 행위,</text><text x="322" y="169" class="s2" style="font-size:10.5px;fill:#1f2937">계기, 바뀐 때를</text><text x="322" y="186" class="s2" style="font-size:10.5px;fill:#1f2937">한 줄씩 남김</text>
  <rect x="310" y="266" width="142" height="30" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="381" y="285" class="gs" text-anchor="middle" style="font-size:9.5px">이력을 지우는 코드 없음</text>
