<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>웹 계층의 컨트롤러가 도메인 계층의 서비스를 거치지 않고 영속성 계층의 엔티티와 리포지토리에 바로 접근하는 구조</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .lname { font-size: 14px; font-weight: 700; fill: #6b7280; }
    .sub { font-size: 12px; fill: #6b7280; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #6b7280; }
    .st { font-size: 11.5px; fill: #6b7280; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .ring { font-size: 13px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .pkg { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12.5px; fill: #15803d; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .dep { stroke: #6b7280; stroke-width: 1.5; fill: none; }
    .depr { stroke: #dc2626; stroke-width: 1.6; fill: none; }
    .depg { stroke: #16a34a; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="380" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">도메인 계층 건너뛰기 — 웹 계층이 영속성 계층에 바로 접근한다</text>
  <rect x="30" y="60" width="700" height="76" rx="10" class="pkg"/>
  <text x="46" y="84" class="lname">웹</text>
  <rect x="300" y="78" width="160" height="44" rx="8" class="box"/>
  <text x="380" y="105" class="t" text-anchor="middle">컨트롤러</text>
  <rect x="30" y="152" width="700" height="76" rx="10" class="pkg"/>
  <text x="46" y="176" class="lname">도메인</text>
  <rect x="300" y="170" width="160" height="44" rx="8" class="box"/>
  <text x="380" y="197" class="t" text-anchor="middle">서비스</text>
  <rect x="30" y="244" width="700" height="100" rx="10" class="pkg"/>
  <text x="46" y="268" class="lname">영속성</text>
  <rect x="70" y="274" width="200" height="48" rx="8" class="box"/>
  <text x="170" y="303" class="t" text-anchor="middle">엔티티</text>
  <rect x="490" y="274" width="200" height="48" rx="8" class="box"/>
  <text x="590" y="303" class="t" text-anchor="middle">리포지토리</text>
  <path d="M300,100 L120,100 L120,272" class="depr" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <path d="M460,100 L640,100 L640,272" class="depr" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="134" y="126" class="note">도메인 계층을 건너뜀</text>
  <path d="M300,192 L210,192 L210,272" class="dep" marker-end="url(#ag)"/>
  <path d="M460,192 L550,192 L550,272" class="dep" marker-end="url(#ag)"/>
  <path d="M490,298 L272,298" class="dep" marker-end="url(#ag)"/>
  <text x="30" y="372" class="foot">도메인 로직이 웹 계층에 흩어지고, 웹 계층 테스트에서 영속성 계층까지 모킹해야 한다</text>
</svg>
