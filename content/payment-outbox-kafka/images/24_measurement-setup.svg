  <text x="458" y="162" class="bt" style="font-size:12px">결제 100건</text>
  <text x="458" y="180" class="bs" style="font-size:10.5px">승인 뒤 전액 취소</text>
  <line x1="561" y1="192" x2="561" y2="204" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ak)"/>
  <rect x="402" y="205" width="318" height="51" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
