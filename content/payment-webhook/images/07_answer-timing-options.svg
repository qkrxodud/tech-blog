<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 616" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>언제 200으로 답할까 — PG 조회가 1.5초 늦고 읽기 시간 제한이 1초일 때, 비교 E는 받은 요청 안에서 조회를 기다리다 1초에 시간 초과로 504를 답하고 Mock PG는 100ms 뒤 같은 알림을 다시 보낸다(측정 18건에서 첫 전송 200 실패 6건, 재전송 10번, 가장 늦은 첫 답 1012ms, 어긋난 결제 0건). 고른 방식은 받은 알림을 payment_webhook에 RECEIVED로 남기고 바로 200으로 답하고(가장 늦은 첫 답 12ms), 처리기가 주기마다 PG에 조회해 실패하면 RECEIVED 그대로 failed_lookups를 하나 늘리고 다음 주기에 성공하면 follow하고 PROCESSED로 닫는다</title>
