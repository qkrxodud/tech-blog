  <rect width="760" height="636" fill="#ffffff"/>
  <text x="24" y="30" class="h">순서가 바뀐 알림 — 다시 읽은 상태를 갈 수 있는 방향으로 따라가기</text>
  <text x="24" y="50" class="s">결과 모름 결제 · PG는 승인(<tspan class="m">DONE</tspan>) 뒤 전액 취소(<tspan class="m">CANCELED</tspan>) · 취소 알림이 승인 알림보다 먼저</text>
  <rect x="60" y="62" width="280" height="44" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <use href="#i-bell" x="74" y="70"/>
  <text x="112" y="80" class="t2">① 취소 알림이 먼저</text>
  <text x="112" y="97" class="s">본문 <tspan class="m">status: CANCELED</tspan></text>
  <rect x="386" y="62" width="186" height="44" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="400" y="80" class="ot">② 늦게 온 승인 알림</text>
  <text x="400" y="97" class="os">본문 <tspan class="m">status: DONE</tspan></text>
