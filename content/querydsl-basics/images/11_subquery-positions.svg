<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>where 절의 서브 쿼리는 최대 나이 40, 평균 나이 25, 10보다 큰 나이 20·30·40을 구해 eq, goe, in 조건에 쓰고, select 절의 서브 쿼리는 하이버네이트 구현체에서 지원하며, from 절의 서브 쿼리인 인라인 뷰는 지원하지 않는 정리</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; fill: #9ca3af; }
    .lane { font-size: 16px; font-weight: 700; fill: #1f2937; }
    .sub { font-size: 12px; fill: #6b7280; }
    .op { font-size: 14px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .val { font-size: 12.5px; fill: #4b5563; }
    .db { font-size: 14px; font-weight: 700; fill: #374151; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .hold { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .dbbox { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .track { fill: #ffffff; stroke: #eceef1; }
    .axis { stroke: #c4c8ce; stroke-width: 1.2; }
    .wait { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .waitt { font-size: 12.5px; fill: #6b7280; }
    .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .okt { font-size: 14px; font-weight: 700; fill: #15803d; }
    .okc { font-size: 14px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
    .badt { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    .badc { font-size: 14px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .note { font-size: 12.5px; fill: #b91c1c; }
    .gnote { font-size: 12px; fill: #15803d; font-weight: 700; }
    .okm { font-size: 13px; font-weight: 700; fill: #15803d; font-family: Menlo, Consolas, monospace; }
    .badm { font-size: 13px; font-weight: 700; fill: #b91c1c; font-family: Menlo, Consolas, monospace; }
    .opm { font-size: 13px; font-weight: 700; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .m { font-size: 12px; fill: #374151; font-family: Menlo, Consolas, monospace; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .ts { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .msg { font-size: 11.5px; fill: #374151; }
    .foot { font-size: 12.5px; fill: #6b7280; }
    .cont { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .scope { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4c8ce"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>
  <rect x="10" y="10" width="740" height="400" rx="12" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="30" y="42" class="h">서브 쿼리 위치 — where, select는 가능, from은 불가</text>
  <text x="730" y="42" class="code" text-anchor="end">JPAExpressions</text>
  <text x="30" y="76" class="lane">where 절</text>
  <text x="200" y="76" class="step" text-anchor="middle">서브 쿼리</text>
  <text x="400" y="76" class="step" text-anchor="middle">서브 쿼리 결과</text>
  <text x="620" y="76" class="step" text-anchor="middle">바깥 쿼리 결과(age)</text>
  <text x="30" y="110" class="op">eq</text>
  <rect x="110" y="88" width="180" height="40" rx="8" class="box"/>
  <text x="200" y="113" class="m" text-anchor="middle">memberSub.age.max()</text>
  <rect x="330" y="88" width="140" height="40" rx="8" class="hold"/>
  <text x="400" y="113" class="m" text-anchor="middle">40</text>
  <rect x="510" y="88" width="220" height="40" rx="8" class="ok"/>
  <text x="620" y="113" class="okm" text-anchor="middle">40</text>
  <text x="30" y="160" class="op">goe</text>
  <rect x="110" y="138" width="180" height="40" rx="8" class="box"/>
  <text x="200" y="163" class="m" text-anchor="middle">memberSub.age.avg()</text>
  <rect x="330" y="138" width="140" height="40" rx="8" class="hold"/>
  <text x="400" y="163" class="m" text-anchor="middle">25</text>
  <rect x="510" y="138" width="220" height="40" rx="8" class="ok"/>
  <text x="620" y="163" class="okm" text-anchor="middle">30, 40</text>
  <text x="30" y="210" class="op">in</text>
  <rect x="110" y="188" width="180" height="40" rx="8" class="box"/>
  <text x="200" y="213" class="m" text-anchor="middle">where(age.gt(10))</text>
  <rect x="330" y="188" width="140" height="40" rx="8" class="hold"/>
  <text x="400" y="213" class="m" text-anchor="middle">20, 30, 40</text>
  <rect x="510" y="188" width="220" height="40" rx="8" class="ok"/>
  <text x="620" y="213" class="okm" text-anchor="middle">20, 30, 40</text>
  <line x1="290" y1="108" x2="328" y2="108" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="470" y1="108" x2="508" y2="108" stroke="#16a34a" stroke-width="1.4" marker-end="url(#agr)"/>
  <line x1="290" y1="158" x2="328" y2="158" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="470" y1="158" x2="508" y2="158" stroke="#16a34a" stroke-width="1.4" marker-end="url(#agr)"/>
  <line x1="290" y1="208" x2="328" y2="208" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="470" y1="208" x2="508" y2="208" stroke="#16a34a" stroke-width="1.4" marker-end="url(#agr)"/>
  <line x1="30" y1="246" x2="730" y2="246" class="axis"/>
  <text x="30" y="284" class="lane">select 절</text>
  <rect x="160" y="262" width="290" height="40" rx="8" class="box"/>
  <text x="305" y="287" class="m" text-anchor="middle">select(member.username, select(...))</text>
  <rect x="470" y="262" width="260" height="40" rx="8" class="ok"/>
  <text x="600" y="287" class="okt" text-anchor="middle">하이버네이트 구현체에서 지원</text>
  <text x="30" y="344" class="lane">from 절</text>
  <rect x="160" y="322" width="290" height="40" rx="8" class="bad"/>
  <text x="305" y="347" class="badt" text-anchor="middle">인라인 뷰 — JPQL이 지원 안 함</text>
  <rect x="470" y="322" width="260" height="40" rx="8" class="box"/>
  <text x="600" y="347" class="val" text-anchor="middle">join 변경 / 쿼리 2번 / nativeSQL</text>
  <text x="30" y="394" class="foot">from 절의 서브 쿼리가 필요하면 join으로 바꾸거나, 쿼리를 나누거나, nativeSQL을 사용합니다.</text>
</svg>
