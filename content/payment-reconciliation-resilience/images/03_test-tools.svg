  </defs>

  <rect width="760" height="560" fill="#ffffff"/>
  <text x="24" y="28" class="h">12장 계약의 시험 도구 — 어긋남과 장애를 만드는 방법</text>
  <text x="24" y="48" class="gs" style="font-size:11.5px">카드사 쪽 어긋남은 Mock PG로, 우리 쪽 어긋남은 시험이 결제 줄을 직접 고쳐 만듦</text>
  <rect x="14" y="64" width="300" height="336" rx="12" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <use href="#i-server" transform="translate(26,76) scale(0.8)"/>
  <text x="64" y="92" class="t2">Mock PG(카드사)</text>
  <rect x="28" y="110" width="272" height="62" rx="8" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/><text x="164" y="130" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:10.5px">거래 조회 <tspan class="m">GET /v1/transactions</tspan></text><text x="164" y="145" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:10.5px"><tspan class="m">startDate</tspan>·<tspan class="m">endDate</tspan>·<tspan class="m">startingAfter</tspan>·<tspan class="m">limit</tspan></text><text x="164" y="160" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:10.5px">승인·취소마다 거래 한 건</text>
  <rect x="28" y="180" width="272" height="46" rx="8" fill="#fbebdd" stroke="#d99a6c" stroke-width="1.5"/><text x="164" y="199.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:10.5px">가맹점 관리 화면 취소 <tspan class="m">cancelAtCardCompany</tspan></text><text x="164" y="214.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:10.5px">카드사에만 남는 승인 <tspan class="m">approveAtCardCompany</tspan></text>
  <rect x="28" y="234" width="272" height="62" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.5"/><text x="164" y="254" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:10.5px">알림 주소 <tspan class="m">http://localhost:1/…</tspan>(받는 곳 없음)</text><text x="164" y="269" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:10.5px">7번 재전송(시험 간격 0.1초)이 모두</text><text x="164" y="284" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:10.5px">끝날 때까지 기다림</text>
  <rect x="28" y="304" width="272" height="36" rx="8" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/><text x="164" y="326" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:10.5px">거래 조회 답 붙잡기(래치)</text>
  <rect x="28" y="348" width="272" height="40" rx="8" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/><text x="164" y="364.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:10.5px">장애: 승인을 받고 3초 동안 답하지 않다가</text><text x="164" y="379.5" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:10.5px">아무것도 남기지 않음(LOST)</text>
  <rect x="338" y="64" width="196" height="200" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="350" y="88" class="t2">결제 서버 두 대(7장)</text>
  <rect x="352" y="100" width="168" height="40" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/><text x="436" y="124" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px">이 서버</text>
  <rect x="352" y="150" width="168" height="40" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/><text x="436" y="174" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:11px"><tspan class="m">OtherPaymentServer</tspan></text>
  <text x="352" y="210" class="gs" style="font-size:10.5px">한 서버가 거래 내역을 조회하는</text><text x="352" y="226" class="gs" style="font-size:10.5px">동안 다른 서버가 대사를 부름</text><text x="352" y="242" class="gs" style="font-size:10.5px">(답을 붙잡아 겹침을 고정)</text>
  <rect x="556" y="64" width="192" height="200" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <use href="#i-db" transform="translate(568,76) scale(0.75)"/>
  <text x="598" y="92" class="t2">시험이 직접 고침</text>
  <rect x="570" y="108" width="164" height="46" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/><text x="652" y="127" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:10.5px">결제 줄 금액·상태</text><text x="652" y="143" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:10.5px"><tspan class="m">update</tspan></text>
  <rect x="570" y="164" width="164" height="46" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/><text x="652" y="183" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:10.5px">카드사가 모르는</text><text x="652" y="199" class="s2" text-anchor="middle" style="fill:#1f2937;font-size:10.5px">승인 결제 <tspan class="m">insert</tspan></text>
  <text x="570" y="236" class="gs" style="font-size:10.5px">우리 쪽 어긋남</text>
  <rect x="338" y="280" width="410" height="114" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <use href="#i-warn" transform="translate(350,292) scale(0.7)"/>
  <text x="380" y="308" class="t2">카드사 장애 계약 값</text>
  <text x="352" y="332" class="s2" style="font-size:10.5px;fill:#1f2937">읽기 시간 제한 1초로 줄임</text><text x="352" y="350" class="s2" style="font-size:10.5px;fill:#1f2937">차단기: 최근 4번 중 50%(최소 4번), 열린 시간 2초, 시험 삼아 1번</text>
  <text x="352" y="378" class="gs" style="font-size:10.5px">운영 값과 다른 계약 값</text>
  <line x1="12" y1="412" x2="748" y2="412" stroke="#9ca3af" stroke-width="1"/>
  <rect x="14" y="426" width="734" height="120" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <use href="#i-kafka" transform="translate(26,438) scale(0.7)"/>
  <text x="58" y="454" class="t2">실패 모음과 지표</text>
  <text x="30" y="480" class="s2" style="font-size:10.5px;fill:#1f2937">실패 모음: 받는 쪽 기록을 트리거로 실패시키고, 다시 시도를 0.1초 한 번으로 줄여 실패 모음(토픽 이름 + <tspan class="m">.DLT</tspan>)에 쌓음</text><text x="30" y="500" class="s2" style="font-size:10.5px;fill:#1f2937">지표: 각 서비스 컨텍스트의 <tspan class="m">MeterRegistry</tspan>에서 읽음(결제 서버·주문 서비스·재고 서비스)</text><text x="30" y="520" class="s2" style="font-size:10.5px;fill:#1f2937">출발 구조 시험 구현: 대사 자리에서 4장 보정·5장 취소 보정·6장 알림 처리를 보정 대기 시간이 지난 때로 한 번씩 돌림</text>
</svg>
