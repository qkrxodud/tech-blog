<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>변경 번호 비교에서 겹친 5000원 부분 취소 둘 — 15000원 결제에 첫 5000원 취소가 요청 줄을 남기고 PG로 보내 답(0.3초 뒤)을 기다리는 동안 두 번째 5000원 취소가 요청 줄을 남기다 트리거에 1초 붙잡히고, 그사이 온 첫 취소의 답 기록이 커밋 직전 번호 충돌로 409가 되어 되돌려짐. PG는 취소했는데 첫 취소를 보낸 클라이언트는 409를 받고 우리 취소는 요청 상태로 남아, 보정 전에는 우리 남은 금액 10000원과 PG 잔액 5000원이 어긋남</title>
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #1f2937; }
    .t { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .t2 { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .s { font-size: 12px; fill: #4b5563; }
