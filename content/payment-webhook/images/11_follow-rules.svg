    <g id="i-lock"><path d="M7,12 V8 a7,7 0 0 1 14,0 V12" fill="none" class="o" stroke-width="2.2"/><rect x="3" y="12" width="22" height="16" rx="3" fill="#fbbf24" class="o"/><circle cx="14" cy="20" r="2.4" fill="#1f2937"/></g>
  </defs>
  <rect width="760" height="584" fill="#ffffff"/>
  <text x="24" y="30" class="h">Payment.follow — 다시 읽은 PG 결제를 따라가는 규칙</text>
  <text x="24" y="50" class="s">승인 결과를 기다리는 결제면 승인 쪽을 먼저, 그 결과 승인이 남은 결제면 이어서 취소 이력</text>
  <rect x="40" y="62" width="360" height="44" rx="10" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <use href="#i-search" x="56" y="70"/>
  <text x="96" y="80" class="t2">PG에서 다시 읽은 결제</text>
  <text x="96" y="97" class="s"><tspan class="m">GatewayPayment(status, cancels)</tspan></text>
  <line x1="220" y1="106" x2="220" y2="124" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <polygon points="220,126 400,158 220,190 40,158" fill="#fdf3d7" stroke="#d4a845" stroke-width="1.5"/>
  <circle cx="40" cy="158" r="11" fill="#111827"/><text x="40" y="162" class="num" text-anchor="middle">1</text>
  <text x="220" y="155" class="t2" text-anchor="middle">승인 결과를 기다리는 결제?</text>
  <text x="220" y="172" class="s" text-anchor="middle">인증 · 결과 모름</text>
  <path d="M400,158 H436" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <path d="M436,132 V224" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <text x="414" y="150" class="gs" text-anchor="middle">예</text>
  <line x1="436" y1="132" x2="450" y2="132" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <rect x="452" y="112" width="292" height="40" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.3"/>
  <text x="466" y="129" class="okt"><tspan class="m">hasApproval</tspan> → <tspan class="m">approve()</tspan></text>
  <text x="466" y="145" class="oks"><tspan class="m">DONE · PARTIAL_CANCELED · CANCELED</tspan></text>
  <line x1="436" y1="178" x2="450" y2="178" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <rect x="452" y="158" width="292" height="40" rx="8" fill="#fde8e8" stroke="#e08a8a" stroke-width="1.3"/>
  <text x="466" y="175" class="badt"><tspan class="m">isDeclined</tspan> → <tspan class="m">failApproval()</tspan></text>
  <text x="466" y="191" class="bads"><tspan class="m">ABORTED · EXPIRED</tspan></text>
  <line x1="436" y1="224" x2="450" y2="224" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <rect x="452" y="204" width="292" height="40" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="466" y="221" class="gt">그 밖 → 그대로 둠</text>
  <text x="466" y="237" class="gs">처리 중 · <tspan class="m">NOT_FOUND</tspan></text>
  <line x1="220" y1="190" x2="220" y2="262" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <text x="232" y="222" class="gs">아니오, 또는 위에서 승인한 뒤</text>
  <polygon points="220,264 400,296 220,328 40,296" fill="#ece8fb" stroke="#9b88d6" stroke-width="1.5"/>
  <circle cx="40" cy="296" r="11" fill="#111827"/><text x="40" y="300" class="num" text-anchor="middle">2</text>
  <text x="220" y="293" class="t2" text-anchor="middle">승인이 남은 결제?</text>
  <text x="220" y="310" class="s" text-anchor="middle">승인 · 매입</text>
  <line x1="400" y1="296" x2="450" y2="296" stroke="#6b7280" stroke-width="1.5" marker-end="url(#agy)"/>
  <text x="425" y="288" class="gs" text-anchor="middle">아니오</text>
  <rect x="452" y="276" width="292" height="40" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="466" y="293" class="gt">아무것도 하지 않음</text>
  <text x="466" y="309" class="gs">이미 지난 상태 — 전이 표로 거부하지 않음</text>
  <line x1="220" y1="328" x2="220" y2="346" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <text x="232" y="342" class="gs">예</text>
  <rect x="40" y="348" width="360" height="44" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="40" cy="348" r="11" fill="#111827"/><text x="40" y="352" class="num" text-anchor="middle">3</text>
  <use href="#i-key" x="58" y="358"/>
  <text x="102" y="369" class="t2">모르는 <tspan class="m">transactionKey</tspan>만 고름</text>
  <text x="102" y="386" class="s"><tspan class="m">isUnknownTransaction</tspan></text>
  <line x1="220" y1="392" x2="220" y2="402" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <rect x="40" y="404" width="360" height="44" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <circle cx="40" cy="404" r="11" fill="#111827"/><text x="40" y="408" class="num" text-anchor="middle">4</text>
  <use href="#i-doc" x="58" y="414"/>
  <text x="102" y="425" class="t2">결과를 기다리는 우리 취소와 같은 금액이면 짝</text>
  <text x="102" y="442" class="s"><tspan class="m">sameAmountOf</tspan> → <tspan class="m">complete</tspan> → <tspan class="m">DONE</tspan></text>
  <line x1="220" y1="448" x2="220" y2="458" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <rect x="40" y="460" width="360" height="44" rx="10" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <circle cx="40" cy="460" r="11" fill="#111827"/><text x="40" y="464" class="num" text-anchor="middle">5</text>
  <use href="#i-doc" x="58" y="470"/>
  <text x="102" y="481" class="t2">짝 안 된 PG 취소는 들여옴</text>
  <text x="102" y="498" class="s"><tspan class="m">fromGateway</tspan> → <tspan class="m">DONE</tspan></text>
  <line x1="220" y1="504" x2="220" y2="514" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ak)"/>
  <rect x="40" y="516" width="360" height="44" rx="10" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <circle cx="40" cy="516" r="11" fill="#111827"/><text x="40" y="520" class="num" text-anchor="middle">6</text>
  <use href="#i-chips" x="58" y="526"/>
  <text x="102" y="537" class="t2">남은 금액이 0원이면 취소 상태로</text>
  <text x="102" y="554" class="s"><tspan class="m">cancelIfNothingLeft</tspan> → <tspan class="m">cancel()</tspan></text>
  <rect x="452" y="348" width="292" height="156" rx="12" fill="#ece8fb" stroke="#9b88d6" stroke-width="1.5"/>
  <text x="468" y="372" class="t2">4장 보정 <tspan class="m">reconcile()</tspan></text>
  <text x="468" y="396" class="s">승인 결과를 기다리는 결제가 <tspan class="m">NOT_FOUND</tspan>면</text>
  <text x="468" y="414" class="s">→ <tspan class="m">failApproval()</tspan></text>
  <text x="468" y="438" class="s">그 밖은 위와 같은 <tspan class="m">follow()</tspan></text>
  <text x="468" y="462" class="s">웹훅은 <tspan class="m">NOT_FOUND</tspan>를 그대로 둠(결정 1)</text>
  <text x="468" y="486" class="gs">6장에서 보정도 이 규칙으로 바꿈</text>
</svg>
