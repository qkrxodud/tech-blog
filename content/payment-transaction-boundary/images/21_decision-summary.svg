  <rect width="760" height="470" fill="#ffffff"/>
  <text x="24" y="30" class="h">2장의 결정 여섯 가지</text>
  <text x="24" y="60" class="gs" style="font-size:11.5px">결정</text>
  <text x="330" y="60" class="gs" style="font-size:11.5px">고른 것</text>
  <text x="560" y="60" class="gs" style="font-size:11.5px">근거</text>
  <rect x="24" y="72" width="290" height="52" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="24" cy="72" r="10" fill="#111827"/><text x="24" y="76" class="num" text-anchor="middle">1</text>
  <text x="44" y="103" class="t2" style="font-size:12.5px">PG 승인 호출을 어디서</text>
  <line x1="316" y1="98" x2="326" y2="98" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="328" y="72" width="216" height="52" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="342" y="103" class="bt" style="font-size:11.5px">트랜잭션 밖에서</text>
  <line x1="546" y1="98" x2="556" y2="98" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="558" y="72" width="178" height="52" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="570" y="94" class="oks" style="font-size:10.5px">묶으면 대기 중 조회 실패</text>
  <text x="570" y="111" class="oks" style="font-size:10.5px">조회 p95 1.4초 → 10ms 수준</text>
  <rect x="24" y="132" width="290" height="52" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="24" cy="132" r="10" fill="#111827"/><text x="24" y="136" class="num" text-anchor="middle">2</text>
  <text x="44" y="163" class="t2" style="font-size:12.5px">트랜잭션을 어떻게 나눌까</text>
  <line x1="316" y1="158" x2="326" y2="158" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="328" y="132" width="216" height="52" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="342" y="163" class="bt" style="font-size:11.5px"><tspan class="m">PaymentRecorder</tspan> 빈으로</text>
  <line x1="546" y1="158" x2="556" y2="158" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="558" y="132" width="178" height="52" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="570" y="154" class="oks" style="font-size:10.5px">같은 클래스 안 <tspan class="m">this</tspan> 호출은</text>
  <text x="570" y="171" class="oks" style="font-size:10.5px">트랜잭션이 걸리지 않음</text>
  <rect x="24" y="192" width="290" height="52" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="24" cy="192" r="10" fill="#111827"/><text x="24" y="196" class="num" text-anchor="middle">3</text>
  <text x="44" y="223" class="t2" style="font-size:12.5px">거절을 어떻게 알릴까</text>
  <line x1="316" y1="218" x2="326" y2="218" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="328" y="192" width="216" height="52" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="342" y="214" class="bt" style="font-size:11.5px">기록 · 커밋 후</text>
  <text x="342" y="231" class="bt" style="font-size:11.5px"><tspan class="m">200</tspan> + <tspan class="m">status</tspan></text>
  <line x1="546" y1="218" x2="556" y2="218" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="558" y="192" width="178" height="52" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="570" y="214" class="oks" style="font-size:10.5px"><tspan class="m">noRollbackFor</tspan>도</text>
  <text x="570" y="231" class="oks" style="font-size:10.5px">연결 문제는 그대로</text>
  <rect x="24" y="252" width="290" height="52" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="24" cy="252" r="10" fill="#111827"/><text x="24" y="256" class="num" text-anchor="middle">4</text>
  <text x="44" y="283" class="t2" style="font-size:12.5px">Open Session In View</text>
  <line x1="316" y1="278" x2="326" y2="278" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="328" y="252" width="216" height="52" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="342" y="283" class="bt" style="font-size:11.5px">끔</text>
  <line x1="546" y1="278" x2="556" y2="278" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="558" y="252" width="178" height="52" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="570" y="283" class="oks" style="font-size:10.5px">켜면 나눠도 API 조회가 <tspan class="m">500</tspan></text>
  <rect x="24" y="312" width="290" height="52" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="24" cy="312" r="10" fill="#111827"/><text x="24" y="316" class="num" text-anchor="middle">5</text>
  <text x="44" y="343" class="t2" style="font-size:12.5px">PG 호출 시간 제한</text>
  <line x1="316" y1="338" x2="326" y2="338" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="328" y="312" width="216" height="52" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="342" y="334" class="bt" style="font-size:11.5px">연결 1초 · 읽기 5초</text>
  <text x="342" y="351" class="bt" style="font-size:11.5px">Mock PG 기준 값</text>
  <line x1="546" y1="338" x2="556" y2="338" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="558" y="312" width="178" height="52" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="570" y="334" class="oks" style="font-size:10.5px">답이 없으면 <tspan class="m">504</tspan></text>
  <text x="570" y="351" class="oks" style="font-size:10.5px">결과를 모름으로 알림</text>
  <rect x="24" y="372" width="290" height="52" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="24" cy="372" r="10" fill="#111827"/><text x="24" y="376" class="num" text-anchor="middle">6</text>
  <text x="44" y="403" class="t2" style="font-size:12.5px">Mock PG 형태</text>
  <line x1="316" y1="398" x2="326" y2="398" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="328" y="372" width="216" height="52" rx="8" fill="#e6edfa" stroke="#7b93c9" stroke-width="1.5"/>
  <text x="342" y="403" class="bt" style="font-size:11.5px">실제 HTTP 별도 모듈</text>
  <line x1="546" y1="398" x2="556" y2="398" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ak)"/>
  <rect x="558" y="372" width="178" height="52" rx="8" fill="#e3f3e6" stroke="#6aab78" stroke-width="1.5"/>
  <text x="570" y="394" class="oks" style="font-size:10.5px">읽기 시간 제한 설정을</text>
  <text x="570" y="411" class="oks" style="font-size:10.5px">지나감</text>
